# Curated performance-mutation sites for despector (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants despector --source data/external-src/<checkout> \
#       --sites data/projects/despector/mutation_sites.yaml

package_root: org.spongepowered.despector

sites:
  - {class: org.spongepowered.despector.Despector, method: decompile, match: "(InputStream input) throws IOException", note: "Despector.decompile"}
  - {class: org.spongepowered.despector.ast.SourceSet, method: getLoader, match: "()", note: "SourceSet.getLoader"}
  - {class: org.spongepowered.despector.config.ConfigManager, method: getConfig, match: "()", note: "ConfigManager.getConfig"}
  - {class: org.spongepowered.despector.decompiler.method.ConditionBuilder, method: makeSimpleCondition, match: "(ConditionalOpcodeBlock block, Locals locals)", note: "ConditionBuilder.makeSimpleCondition"}
  - {class: org.spongepowered.despector.emitter.EmitterSet, method: getAstEmitter, match: "(Class<T> type)", note: "EmitterSet.getAstEmitter"}
  - {class: org.spongepowered.despector.parallel.MethodDecompileTask, method: getEntry, match: "()", note: "MethodDecompileTask.getEntry"}
  - {class: org.spongepowered.despector.transform.builder.Builders, method: createClass, match: "(String name)", note: "Builders.createClass"}
  - {class: org.spongepowered.despector.util.AstUtil, method: getStackRequirementsSize, match: "(Insn next)", note: "AstUtil.getStackRequirementsSize"}
  - {class: org.spongepowered.despector.Despector, method: decompile, match: "(InputStream input, Language lang) throws IOException", note: "Despector.decompile"}
  - {class: org.spongepowered.despector.ast.SourceSet, method: setLoader, match: "(Loader loader)", note: "SourceSet.setLoader"}
  - {class: org.spongepowered.despector.config.ConfigManager, method: load, match: "(Path path)", note: "ConfigManager.load"}
  - {class: org.spongepowered.despector.decompiler.method.ConditionBuilder, method: makeCondition, match: "(List<ConditionalOpcodeBlock> blocks, Locals locals, OpcodeBlock body, OpcodeBlock ret)", note: "ConditionBuilder.makeCondition"}
  - {class: org.spongepowered.despector.emitter.EmitterSet, method: setAstEmitter, match: "(Class<? extends T> type, AstEmitter<?, T> emitter)", note: "EmitterSet.setAstEmitter"}
  - {class: org.spongepowered.despector.parallel.MethodDecompileTask, method: run, match: "()", note: "MethodDecompileTask.run"}
  - {class: org.spongepowered.despector.transform.builder.Builders, method: integer, match: "(int val)", note: "Builders.integer"}
  - {class: org.spongepowered.despector.util.AstUtil, method: getStackResultSize, match: "(Insn next)", note: "AstUtil.getStackResultSize"}
  - {class: org.spongepowered.despector.Language, method: getExtension, match: "(TypeEntry type)", note: "Language.getExtension"}
  - {class: org.spongepowered.despector.ast.insn.cst.StringConstant, method: getConstant, match: "()", note: "StringConstant.getConstant"}
  - {class: org.spongepowered.despector.decompiler.method.StatementBuilder, method: appendBlock, match: "(OpcodeBlock op, StatementBlock block, Locals locals, Deque<Instruction> stack)", note: "StatementBuilder.appendBlock"}
  - {class: org.spongepowered.despector.emitter.bytecode.instruction.BytecodeArrayAccessEmitter, method: emit, match: "(BytecodeEmitterContext ctx, ArrayAccess arg, TypeSignature type)", note: "BytecodeArrayAccessEmitter.emit"}
  - {class: org.spongepowered.despector.parallel.Scheduler, method: getTasks, match: "()", note: "Scheduler.getTasks"}
  - {class: org.spongepowered.despector.transform.builder.ClassTypeBuilder, method: supertype, match: "(String spr)", note: "ClassTypeBuilder.supertype"}
  - {class: org.spongepowered.despector.util.ConditionUtil, method: inverse, match: "(Condition condition)", note: "ConditionUtil.inverse"}
  - {class: org.spongepowered.despector.ast.insn.cst.StringConstant, method: setConstant, match: "(String cst)", note: "StringConstant.setConstant"}
  - {class: org.spongepowered.despector.decompiler.method.StatementBuilder, method: inferType, match: "()", note: "StatementBuilder.inferType"}
  - {class: org.spongepowered.despector.emitter.bytecode.instruction.BytecodeStringConstantEmitter, method: emit, match: "(BytecodeEmitterContext ctx, StringConstant arg, TypeSignature type)", note: "BytecodeStringConstantEmitter.emit"}
  - {class: org.spongepowered.despector.parallel.Scheduler, method: execute, match: "()", note: "Scheduler.execute"}
  - {class: org.spongepowered.despector.transform.builder.ClassTypeBuilder, method: reset, match: "()", note: "ClassTypeBuilder.reset"}
  - {class: org.spongepowered.despector.util.ConditionUtil, method: isInverse, match: "(Condition a, Condition other)", note: "ConditionUtil.isInverse"}
  - {class: org.spongepowered.despector.ast.insn.misc.MultiNewArray, method: setType, match: "(ClassTypeSignature type)", note: "MultiNewArray.setType"}
  - {class: org.spongepowered.despector.decompiler.BaseDecompiler, method: isValid, match: "(String name)", note: "BaseDecompiler.isValid"}
  - {class: org.spongepowered.despector.emitter.java.instruction.ArrayLoadEmitter, method: emit, match: "(JavaEmitterContext ctx, ArrayAccess arg, TypeSignature type)", note: "ArrayLoadEmitter.emit"}
  - {class: org.spongepowered.despector.transform.builder.FieldBuilder, method: name, match: "(String name)", note: "FieldBuilder.name"}
  - {class: org.spongepowered.despector.util.DebugUtil, method: opcodeToString, match: "(int opcode)", note: "DebugUtil.opcodeToString"}
  - {class: org.spongepowered.despector.ast.insn.misc.MultiNewArray, method: getSizes, match: "()", note: "MultiNewArray.getSizes"}
  - {class: org.spongepowered.despector.decompiler.BaseDecompiler, method: decompile, match: "(InputStream input, SourceSet set) throws IOException", note: "BaseDecompiler.decompile"}
  - {class: org.spongepowered.despector.emitter.java.instruction.MultiNewArrayEmitter, method: emit, match: "(JavaEmitterContext ctx, MultiNewArray arg, TypeSignature type)", note: "MultiNewArrayEmitter.emit"}
  - {class: org.spongepowered.despector.transform.builder.FieldBuilder, method: reset, match: "()", note: "FieldBuilder.reset"}
  - {class: org.spongepowered.despector.util.SignatureParser, method: parse, match: "(String signature)", note: "SignatureParser.parse"}
  - {class: org.spongepowered.despector.ast.insn.misc.NewArray, method: setType, match: "(ClassTypeSignature type)", note: "NewArray.setType"}
  - {class: org.spongepowered.despector.decompiler.DirectoryWalker, method: walk, match: "(SourceSet src, Decompiler decomp) throws IOException", note: "DirectoryWalker.walk"}
  - {class: org.spongepowered.despector.emitter.java.instruction.NewArrayEmitter, method: emit, match: "(JavaEmitterContext ctx, NewArray arg, TypeSignature type)", note: "NewArrayEmitter.emit"}
  - {class: org.spongepowered.despector.transform.builder.MethodBuilder, method: createLocal, match: "(String name, TypeSignature type)", note: "MethodBuilder.createLocal"}
  - {class: org.spongepowered.despector.util.SignatureParser, method: parseMethod, match: "(String signature)", note: "SignatureParser.parseMethod"}
  - {class: org.spongepowered.despector.ast.insn.misc.NewArray, method: getSize, match: "()", note: "NewArray.getSize"}
  - {class: org.spongepowered.despector.decompiler.JarWalker, method: walk, match: "(SourceSet sources, Decompiler decomp)", note: "JarWalker.walk"}
  - {class: org.spongepowered.despector.emitter.java.instruction.StringConstantEmitter, method: escape, match: "(String text)", note: "StringConstantEmitter.escape"}
  - {class: org.spongepowered.despector.transform.builder.MethodBuilder, method: name, match: "(String name)", note: "MethodBuilder.name"}
  - {class: org.spongepowered.despector.util.Pair, method: getFirst, match: "()", note: "Pair.getFirst"}
  - {class: org.spongepowered.despector.ast.insn.misc.NumberCompare, method: getLeftOperand, match: "()", note: "NumberCompare.getLeftOperand"}
