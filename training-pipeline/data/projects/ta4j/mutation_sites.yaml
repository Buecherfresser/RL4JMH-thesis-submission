# Curated performance-mutation sites for ta4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants ta4j --source data/external-src/<checkout> \
#       --sites data/projects/ta4j/mutation_sites.yaml

package_root: org.ta4j.core

sites:
  - {class: org.ta4j.core.BaseBarSeriesBuilder, method: build, match: "()", note: "BaseBarSeriesBuilder.build"}
  - {class: org.ta4j.core.aggregator.RangeBarAggregator, method: aggregate, match: "(List<Bar> bars)", note: "RangeBarAggregator.aggregate"}
  - {class: org.ta4j.core.analysis.AnalysisContext, method: AnalysisContext, match: "(MissingHistoryPolicy missingHistoryPolicy,", note: "AnalysisContext.AnalysisContext"}
  - {class: org.ta4j.core.backtest.BacktestExecutionResult, method: BacktestExecutionResult, match: "(BarSeries barSeries, List<TradingStatement> tradingStatements,", note: "BacktestExecutionResult.BacktestExecutionResult"}
  - {class: org.ta4j.core.bars.AmountBarBuilder, method: timePeriod, match: "(final Duration timePeriod)", note: "AmountBarBuilder.timePeriod"}
  - {class: org.ta4j.core.criteria.NumberOfBarsCriterion, method: calculate, match: "(BarSeries series, Position position)", note: "NumberOfBarsCriterion.calculate"}
  - {class: org.ta4j.core.indicators.IndicatorUtils, method: requireSameSeries, match: "(Indicator<?> firstIndicator, Indicator<?> secondIndicator,", note: "IndicatorUtils.requireSameSeries"}
  - {class: org.ta4j.core.named.NamedAssetRegistry, method: defaultRegistry, match: "()", note: "NamedAssetRegistry.defaultRegistry"}
  - {class: org.ta4j.core.num.DecimalNum, method: valueOf, match: "(final String val)", note: "DecimalNum.valueOf"}
  - {class: org.ta4j.core.reports.BasePerformanceReport, method: getTotalProfitLoss, match: "()", note: "BasePerformanceReport.getTotalProfitLoss"}
  - {class: org.ta4j.core.rules.TimeRangeRule, method: TimeRange, match: "(LocalTime from, LocalTime to)", note: "TimeRangeRule.TimeRange"}
  - {class: org.ta4j.core.serialization.AnalysisCriterionSerialization, method: toJson, match: "(AnalysisCriterion criterion)", note: "AnalysisCriterionSerialization.toJson"}
  - {class: org.ta4j.core.utils.BarSeriesUtils, method: aggregateBars, match: "(BarSeries barSeries, Duration timePeriod, String aggregatedSeriesName)", note: "BarSeriesUtils.aggregateBars"}
  - {class: org.ta4j.core.walkforward.AnchoredExpandingWalkForwardSplitter, method: split, match: "(BarSeries series, WalkForwardConfig config)", note: "AnchoredExpandingWalkForwardSplitter.split"}
  - {class: org.ta4j.core.BaseBarSeriesBuilder, method: setConstrained, match: "(boolean constrained)", note: "BaseBarSeriesBuilder.setConstrained"}
  - {class: org.ta4j.core.aggregator.BaseBarSeriesAggregator, method: aggregate, match: "(BarSeries series, String aggregatedSeriesName)", note: "BaseBarSeriesAggregator.aggregate"}
  - {class: org.ta4j.core.analysis.AnalysisContext, method: defaults, match: "()", note: "AnalysisContext.defaults"}
  - {class: org.ta4j.core.backtest.BacktestExecutionResult, method: barSeries, match: "()", note: "BacktestExecutionResult.barSeries"}
  - {class: org.ta4j.core.bars.AmountBarBuilder, method: beginTime, match: "(final Instant beginTime)", note: "AmountBarBuilder.beginTime"}
  - {class: org.ta4j.core.criteria.NumberOfBarsCriterion, method: calculate, match: "(BarSeries series, TradingRecord tradingRecord)", note: "NumberOfBarsCriterion.calculate"}
  - {class: org.ta4j.core.indicators.IndicatorUtils, method: isSameSeries, match: "(BarSeries firstSeries, BarSeries secondSeries)", note: "IndicatorUtils.isSameSeries"}
  - {class: org.ta4j.core.named.NamedAssetRegistry, method: builder, match: "()", note: "NamedAssetRegistry.builder"}
  - {class: org.ta4j.core.num.DecimalNum, method: valueOf, match: "(final String val, final MathContext mathContext)", note: "DecimalNum.valueOf"}
  - {class: org.ta4j.core.reports.BasePerformanceReport, method: getTotalProfitLossPercentage, match: "()", note: "BasePerformanceReport.getTotalProfitLossPercentage"}
  - {class: org.ta4j.core.rules.TimeRangeRule, method: isSatisfied, match: "(int index, TradingRecord tradingRecord)", note: "TimeRangeRule.isSatisfied"}
  - {class: org.ta4j.core.serialization.AnalysisCriterionSerialization, method: describe, match: "(AnalysisCriterion criterion)", note: "AnalysisCriterionSerialization.describe"}
  - {class: org.ta4j.core.utils.BarSeriesUtils, method: replaceBarIfChanged, match: "(BarSeries barSeries, Bar newBar)", note: "BarSeriesUtils.replaceBarIfChanged"}
  - {class: org.ta4j.core.walkforward.PredictionSnapshot, method: P, match: "(String foldId, int decisionIndex, List<RankedPrediction<P>> topPredictions,", note: "PredictionSnapshot.P"}
  - {class: org.ta4j.core.ConcurrentBarSeriesBuilder, method: build, match: "()", note: "ConcurrentBarSeriesBuilder.build"}
  - {class: org.ta4j.core.aggregator.DurationBarAggregator, method: aggregate, match: "(List<Bar> bars)", note: "DurationBarAggregator.aggregate"}
  - {class: org.ta4j.core.analysis.CashFlow, method: calculatePosition, match: "(Position position, int finalIndex)", note: "CashFlow.calculatePosition"}
  - {class: org.ta4j.core.backtest.BacktestExecutor, method: execute, match: "(List<Strategy> strategies, Num amount)", note: "BacktestExecutor.execute"}
  - {class: org.ta4j.core.bars.AmountBarBuilderFactory, method: createBarBuilder, match: "(final BarSeries series)", note: "AmountBarBuilderFactory.createBarBuilder"}
  - {class: org.ta4j.core.criteria.NumberOfBreakEvenPositionsCriterion, method: calculate, match: "(BarSeries series, Position position)", note: "NumberOfBreakEvenPositionsCriterion.calculate"}
  - {class: org.ta4j.core.indicators.elliott.ElliottScenarioComparator, method: divergenceScore, match: "(final ElliottScenario scenario1, final ElliottScenario scenario2)", note: "ElliottScenarioComparator.divergenceScore"}
  - {class: org.ta4j.core.num.DecimalNumFactory, method: getInstance, match: "()", note: "DecimalNumFactory.getInstance"}
  - {class: org.ta4j.core.reports.BaseTradingStatement, method: getStrategy, match: "()", note: "BaseTradingStatement.getStrategy"}
  - {class: org.ta4j.core.rules.AndRule, method: isSatisfied, match: "(int index, TradingRecord tradingRecord)", note: "AndRule.isSatisfied"}
  - {class: org.ta4j.core.serialization.ComponentDescriptor, method: typeOnly, match: "(String type)", note: "ComponentDescriptor.typeOnly"}
  - {class: org.ta4j.core.utils.DeprecationNotifier, method: warnOnce, match: "(Class<?> deprecatedType, String replacementType, String removalVersion)", note: "DeprecationNotifier.warnOnce"}
  - {class: org.ta4j.core.walkforward.PredictionSnapshot, method: snapshotKey, match: "()", note: "PredictionSnapshot.snapshotKey"}
  - {class: org.ta4j.core.ConcurrentBarSeriesBuilder, method: withNumFactory, match: "(NumFactory numFactory)", note: "ConcurrentBarSeriesBuilder.withNumFactory"}
  - {class: org.ta4j.core.aggregator.HeikinAshiBarAggregator, method: aggregate, match: "(List<Bar> ohlcBars)", note: "HeikinAshiBarAggregator.aggregate"}
  - {class: org.ta4j.core.analysis.CashFlow, method: getValue, match: "(int index)", note: "CashFlow.getValue"}
  - {class: org.ta4j.core.backtest.BacktestExecutor, method: execute, match: "(List<Strategy> strategies, PositionSizer positionSizer)", note: "BacktestExecutor.execute"}
  - {class: org.ta4j.core.bars.HeikinAshiBarBuilder, method: previousHeikinAshiOpenPrice, match: "(Num previousOpen)", note: "HeikinAshiBarBuilder.previousHeikinAshiOpenPrice"}
  - {class: org.ta4j.core.criteria.NumberOfBreakEvenPositionsCriterion, method: calculate, match: "(BarSeries series, TradingRecord tradingRecord)", note: "NumberOfBreakEvenPositionsCriterion.calculate"}
  - {class: org.ta4j.core.indicators.elliott.ElliottScenarioComparator, method: sharedInvalidation, match: "(final Collection<ElliottScenario> scenarios)", note: "ElliottScenarioComparator.sharedInvalidation"}
  - {class: org.ta4j.core.num.DecimalNumFactory, method: getInstance, match: "(final int precision)", note: "DecimalNumFactory.getInstance"}
  - {class: org.ta4j.core.reports.BaseTradingStatement, method: getPositionStatsReport, match: "()", note: "BaseTradingStatement.getPositionStatsReport"}
