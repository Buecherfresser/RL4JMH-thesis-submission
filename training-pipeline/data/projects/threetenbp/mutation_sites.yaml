  - {class: org.threeten.bp.temporal.IsoFields, method: getRangeUnit, match: "()", note: "IsoFields.getRangeUnit"}
  - {class: org.threeten.bp.zone.TzdbZoneRulesCompiler, method: compile, match: "() throws Exception", note: "TzdbZoneRulesCompiler.compile"}
  - {class: org.threeten.bp.LocalDate, method: queryFrom, match: "(TemporalAccessor temporal)", note: "LocalDate.queryFrom"}
  - {class: org.threeten.bp.chrono.HijrahDate, method: now, match: "()", note: "HijrahDate.now"}
  - {class: org.threeten.bp.format.DateTimeParseException, method: getParsedString, match: "()", note: "DateTimeParseException.getParsedString"}
  - {class: org.threeten.bp.temporal.JulianFields, method: getBaseUnit, match: "()", note: "JulianFields.getBaseUnit"}
  - {class: org.threeten.bp.zone.TzdbZoneRulesProvider, method: provideZoneIds, match: "()", note: "TzdbZoneRulesProvider.provideZoneIds"}
  - {class: org.threeten.bp.LocalDate, method: now, match: "()", note: "LocalDate.now"}
  - {class: org.threeten.bp.chrono.HijrahDate, method: now, match: "(ZoneId zone)", note: "HijrahDate.now"}
