  - {class: com.oath.halodb.DBMetaData, method: getMaxFileSize, match: "()", note: "DBMetaData.getMaxFileSize"}
  - {class: com.oath.halodb.DBMetaData, method: setMaxFileSize, match: "(int maxFileSize)", note: "DBMetaData.setMaxFileSize"}
  - {class: com.oath.halodb.HaloDB, method: open, match: "(File dirname, HaloDBOptions opts) throws HaloDBException", note: "HaloDB.open"}
