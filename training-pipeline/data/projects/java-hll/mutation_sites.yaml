# Curated performance-mutation sites for java-hll (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants java-hll --source data/external-src/<checkout> \
#       --sites data/projects/java-hll/mutation_sites.yaml

package_root: net.agkn.hll

sites:
  - {class: net.agkn.hll.HLL, method: addRaw, match: "(final long rawValue)", note: "HLL.addRaw"}
  - {class: net.agkn.hll.serialization.SerializationUtil, method: getSchemaVersion, match: "(final int schemaVersionNumber)", note: "SerializationUtil.getSchemaVersion"}
  - {class: net.agkn.hll.util.BitUtil, method: leastSignificantBit, match: "(final long value)", note: "BitUtil.leastSignificantBit"}
  - {class: net.agkn.hll.HLL, method: cardinality, match: "()", note: "HLL.cardinality"}
  - {class: net.agkn.hll.serialization.SerializationUtil, method: getSchemaVersion, match: "(final byte[] bytes)", note: "SerializationUtil.getSchemaVersion"}
  - {class: net.agkn.hll.util.HLLUtil, method: registerBitSize, match: "(final long expectedUniqueElements)", note: "HLLUtil.registerBitSize"}
  - {class: net.agkn.hll.HLL, method: clear, match: "()", note: "HLL.clear"}
  - {class: net.agkn.hll.serialization.SerializationUtil, method: packVersionByte, match: "(final int schemaVersion, final int typeOrdinal)", note: "SerializationUtil.packVersionByte"}
  - {class: net.agkn.hll.util.HLLUtil, method: alphaMSquared, match: "(final int m)", note: "HLLUtil.alphaMSquared"}
  - {class: net.agkn.hll.HLL, method: union, match: "(final HLL other)", note: "HLL.union"}
  - {class: net.agkn.hll.serialization.SerializationUtil, method: packCutoffByte, match: "(final int explicitCutoff, final boolean sparseEnabled)", note: "SerializationUtil.packCutoffByte"}
  - {class: net.agkn.hll.util.HLLUtil, method: pwMaxMask, match: "(final int registerSizeInBits)", note: "HLLUtil.pwMaxMask"}
  - {class: net.agkn.hll.HLL, method: toBytes, match: "()", note: "HLL.toBytes"}
  - {class: net.agkn.hll.serialization.SerializationUtil, method: packParametersByte, match: "(final int registerWidth, final int registerCountLog2)", note: "SerializationUtil.packParametersByte"}
  - {class: net.agkn.hll.util.HLLUtil, method: smallEstimatorCutoff, match: "(final int m)", note: "HLLUtil.smallEstimatorCutoff"}
  - {class: net.agkn.hll.HLL, method: toBytes, match: "(final ISchemaVersion schemaVersion)", note: "HLL.toBytes"}
  - {class: net.agkn.hll.serialization.SerializationUtil, method: sparseEnabled, match: "(final byte cutoffByte)", note: "SerializationUtil.sparseEnabled"}
  - {class: net.agkn.hll.util.HLLUtil, method: smallEstimator, match: "(final int m, final int numberOfZeroes)", note: "HLLUtil.smallEstimator"}
  - {class: net.agkn.hll.HLL, method: fromBytes, match: "(final byte[] bytes)", note: "HLL.fromBytes"}
  - {class: net.agkn.hll.serialization.SerializationUtil, method: explicitCutoff, match: "(final byte cutoffByte)", note: "SerializationUtil.explicitCutoff"}
  - {class: net.agkn.hll.util.HLLUtil, method: largeEstimatorCutoff, match: "(final int log2m, final int registerSizeInBits)", note: "HLLUtil.largeEstimatorCutoff"}
  - {class: net.agkn.hll.serialization.SerializationUtil, method: schemaVersion, match: "(final byte versionByte)", note: "SerializationUtil.schemaVersion"}
  - {class: net.agkn.hll.util.HLLUtil, method: largeEstimator, match: "(final int log2m, final int registerSizeInBits, final double estimator)", note: "HLLUtil.largeEstimator"}
  - {class: net.agkn.hll.serialization.SerializationUtil, method: typeOrdinal, match: "(final byte versionByte)", note: "SerializationUtil.typeOrdinal"}
  - {class: net.agkn.hll.util.NumberUtil, method: log2, match: "(final double value)", note: "NumberUtil.log2"}
  - {class: net.agkn.hll.serialization.SerializationUtil, method: registerWidth, match: "(final byte parametersByte)", note: "SerializationUtil.registerWidth"}
  - {class: net.agkn.hll.util.NumberUtil, method: toHex, match: "(final byte[] bytes, final int offset, final int count)", note: "NumberUtil.toHex"}
  - {class: net.agkn.hll.serialization.SerializationUtil, method: registerCountLog2, match: "(final byte parametersByte)", note: "SerializationUtil.registerCountLog2"}
  - {class: net.agkn.hll.util.NumberUtil, method: fromHex, match: "(final String string, final int offset, final int count)", note: "NumberUtil.fromHex"}
  - {class: net.agkn.hll.serialization.BigEndianAscendingWordDeserializer, method: readWord, match: "()", note: "BigEndianAscendingWordDeserializer.readWord"}
  - {class: net.agkn.hll.util.BitVector, method: words, match: "()", note: "BitVector.words"}
  - {class: net.agkn.hll.serialization.BigEndianAscendingWordDeserializer, method: totalWordCount, match: "()", note: "BigEndianAscendingWordDeserializer.totalWordCount"}
  - {class: net.agkn.hll.util.BitVector, method: wordCount, match: "()", note: "BitVector.wordCount"}
  - {class: net.agkn.hll.serialization.BigEndianAscendingWordSerializer, method: writeWord, match: "(final long word)", note: "BigEndianAscendingWordSerializer.writeWord"}
  - {class: net.agkn.hll.util.BitVector, method: byteCount, match: "()", note: "BitVector.byteCount"}
  - {class: net.agkn.hll.serialization.BigEndianAscendingWordSerializer, method: getBytes, match: "()", note: "BigEndianAscendingWordSerializer.getBytes"}
  - {class: net.agkn.hll.util.BitVector, method: registerWidth, match: "()", note: "BitVector.registerWidth"}
  - {class: net.agkn.hll.serialization.HLLMetadata, method: schemaVersion, match: "()", note: "HLLMetadata.schemaVersion"}
  - {class: net.agkn.hll.util.BitVector, method: getRegister, match: "(final long registerIndex)", note: "BitVector.getRegister"}
  - {class: net.agkn.hll.serialization.HLLMetadata, method: HLLType, match: "()", note: "HLLMetadata.HLLType"}
  - {class: net.agkn.hll.util.BitVector, method: setRegister, match: "(final long registerIndex, final long value)", note: "BitVector.setRegister"}
  - {class: net.agkn.hll.serialization.HLLMetadata, method: registerCountLog2, match: "()", note: "HLLMetadata.registerCountLog2"}
  - {class: net.agkn.hll.util.BitVector, method: registerIterator, match: "()", note: "BitVector.registerIterator"}
  - {class: net.agkn.hll.serialization.HLLMetadata, method: registerWidth, match: "()", note: "HLLMetadata.registerWidth"}
  - {class: net.agkn.hll.util.BitVector, method: setMaxRegister, match: "(final long registerIndex, final long value)", note: "BitVector.setMaxRegister"}
  - {class: net.agkn.hll.serialization.HLLMetadata, method: log2ExplicitCutoff, match: "()", note: "HLLMetadata.log2ExplicitCutoff"}
  - {class: net.agkn.hll.util.BitVector, method: getRegisterContents, match: "(final IWordSerializer serializer)", note: "BitVector.getRegisterContents"}
  - {class: net.agkn.hll.serialization.HLLMetadata, method: explicitOff, match: "()", note: "HLLMetadata.explicitOff"}
  - {class: net.agkn.hll.serialization.HLLMetadata, method: explicitAuto, match: "()", note: "HLLMetadata.explicitAuto"}
  - {class: net.agkn.hll.serialization.HLLMetadata, method: sparseEnabled, match: "()", note: "HLLMetadata.sparseEnabled"}
