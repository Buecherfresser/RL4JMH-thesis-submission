# Curated performance-mutation sites for rtree (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants rtree --source data/external-src/<checkout> \
#       --sites data/projects/rtree/mutation_sites.yaml

package_root: com.conversantmedia.util

sites:
  - {class: com.conversantmedia.util.collection.geometry.Range1d, method: getMbr, match: "(final HyperRect r)", note: "Range1d.getMbr"}
  - {class: com.conversantmedia.util.collection.geometry.Range1d, method: getNDim, match: "()", note: "Range1d.getNDim"}
  - {class: com.conversantmedia.util.collection.geometry.Range1d, method: getCentroid, match: "()", note: "Range1d.getCentroid"}
  - {class: com.conversantmedia.util.collection.geometry.Range1d, method: getMin, match: "()", note: "Range1d.getMin"}
  - {class: com.conversantmedia.util.collection.geometry.Point1d, method: getNDim, match: "()", note: "Point1d.getNDim"}
  - {class: com.conversantmedia.util.collection.geometry.Point1d, method: getCoord, match: "(final int d)", note: "Point1d.getCoord"}
  - {class: com.conversantmedia.util.collection.geometry.Point1d, method: distance, match: "(final HyperPoint p)", note: "Point1d.distance"}
  - {class: com.conversantmedia.util.collection.geometry.Point1d, method: distance, match: "(final HyperPoint p, final int d)", note: "Point1d.distance"}
