# Curated performance-mutation sites for xjx (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants xjx --source data/external-src/<checkout> \
#       --sites data/projects/xjx/mutation_sites.yaml

package_root: io.jonasg.xjx

sites:
  - {class: io.jonasg.xjx.BufferedPositionedReader, method: currentLine, match: "()", note: "BufferedPositionedReader.currentLine"}
  - {class: io.jonasg.xjx.sax.SaxParser, method: parse, match: "(Reader reader, SaxHandler saxHandler)", note: "SaxParser.parse"}
  - {class: io.jonasg.xjx.scanners.CDATAScanner, method: scan, match: "(PositionedReader reader, TokenEmitter tokenEmitter)", note: "CDATAScanner.scan"}
  - {class: io.jonasg.xjx.serdes.TypeMappers, method: forType, match: "(Class<?> type, XjxConfiguration configuration)", note: "TypeMappers.forType"}
  - {class: io.jonasg.xjx.BufferedPositionedReader, method: peekLine, match: "()", note: "BufferedPositionedReader.peekLine"}
  - {class: io.jonasg.xjx.sax.Attribute, method: Attribute, match: "(String name, String value)", note: "Attribute.Attribute"}
  - {class: io.jonasg.xjx.scanners.CharacterScanner, method: scan, match: "(PositionedReader reader, TokenEmitter tokenEmitter)", note: "CharacterScanner.scan"}
  - {class: io.jonasg.xjx.serdes.deserialize.MapAsRoot, method: MapAsRoot, match: "(Object root, Map<String, Object> map)", note: "MapAsRoot.MapAsRoot"}
  - {class: io.jonasg.xjx.Attributes, method: empty, match: "()", note: "Attributes.empty"}
  - {class: io.jonasg.xjx.scanners.CommentBodyScanner, method: scan, match: "(PositionedReader reader, TokenEmitter tokenEmitter)", note: "CommentBodyScanner.scan"}
  - {class: io.jonasg.xjx.serdes.deserialize.MapRootSaxHandler, method: startDocument, match: "()", note: "MapRootSaxHandler.startDocument"}
  - {class: io.jonasg.xjx.Attributes, method: isPresent, match: "()", note: "Attributes.isPresent"}
  - {class: io.jonasg.xjx.scanners.DocumentTypeDeclarationScanner, method: scan, match: "(PositionedReader reader, TokenEmitter tokenEmitter)", note: "DocumentTypeDeclarationScanner.scan"}
  - {class: io.jonasg.xjx.serdes.deserialize.MapRootSaxHandler, method: startTag, match: "(String namespace, String name, List<Attribute> attributes)", note: "MapRootSaxHandler.startTag"}
  - {class: io.jonasg.xjx.EndTag, method: EndTag, match: "(String namespace, String name)", note: "EndTag.EndTag"}
  - {class: io.jonasg.xjx.scanners.EndTagScanner, method: scan, match: "(PositionedReader reader, TokenEmitter tokenEmitter)", note: "EndTagScanner.scan"}
  - {class: io.jonasg.xjx.serdes.deserialize.MapWithTypeInfo, method: MapWithTypeInfo, match: "(Map<String, Object> map, Class<?> valueType)", note: "MapWithTypeInfo.MapWithTypeInfo"}
  - {class: io.jonasg.xjx.StartTag, method: StartTag, match: "(String name, String namespace, Attributes attributes)", note: "StartTag.StartTag"}
  - {class: io.jonasg.xjx.scanners.StartCommentScanner, method: scan, match: "(PositionedReader reader, TokenEmitter tokenEmitter)", note: "StartCommentScanner.scan"}
  - {class: io.jonasg.xjx.serdes.deserialize.TypedValueMapSaxHandler, method: startDocument, match: "()", note: "TypedValueMapSaxHandler.startDocument"}
  - {class: io.jonasg.xjx.Token, method: T, match: "(Type type, T value)", note: "Token.T"}
  - {class: io.jonasg.xjx.scanners.StartTagScanner, method: scan, match: "(PositionedReader reader, TokenEmitter emitter)", note: "StartTagScanner.scan"}
  - {class: io.jonasg.xjx.serdes.deserialize.TypedValueMapSaxHandler, method: startTag, match: "(String namespace, String name, List<Attribute> attributes)", note: "TypedValueMapSaxHandler.startTag"}
  - {class: io.jonasg.xjx.Tokenizer, method: tokenize, match: "(Reader reader)", note: "Tokenizer.tokenize"}
  - {class: io.jonasg.xjx.scanners.WhiteSpaceScanner, method: scan, match: "(PositionedReader reader, TokenEmitter tokenEmitter)", note: "WhiteSpaceScanner.scan"}
  - {class: io.jonasg.xjx.serdes.deserialize.accessor.SetterFieldAccessor, method: hasSetterForField, match: "()", note: "SetterFieldAccessor.hasSetterForField"}
  - {class: io.jonasg.xjx.Tokenizer, method: tryAdvance, match: "(Consumer<? super Token<?>> action)", note: "Tokenizer.tryAdvance"}
  - {class: io.jonasg.xjx.serdes.deserialize.config.ConfigurationBuilder, method: failOnUnknownEnumValue, match: "(boolean failOnUnmappableEnumValue)", note: "ConfigurationBuilder.failOnUnknownEnumValue"}
  - {class: io.jonasg.xjx.serdes.serialize.XmlStringBuilder, method: build, match: "(XmlNode nodes)", note: "XmlStringBuilder.build"}
  - {class: io.jonasg.xjx.serdes.Path, method: of, match: "(String... paths)", note: "Path.of"}
  - {class: io.jonasg.xjx.serdes.Path, method: parse, match: "(String path)", note: "Path.parse"}
  - {class: io.jonasg.xjx.serdes.Section, method: Section, match: "(String name, boolean isLeaf)", note: "Section.Section"}
  - {class: io.jonasg.xjx.serdes.deserialize.LazySupplier, method: reset, match: "(Supplier<T> supplier)", note: "LazySupplier.reset"}
  - {class: io.jonasg.xjx.serdes.deserialize.PathBasedSaxHandler, method: startDocument, match: "()", note: "PathBasedSaxHandler.startDocument"}
  - {class: io.jonasg.xjx.serdes.deserialize.PathBasedSaxHandler, method: startTag, match: "(String namespace, String name, List<Attribute> attributes)", note: "PathBasedSaxHandler.startTag"}
  - {class: io.jonasg.xjx.serdes.deserialize.PathWriter, method: rootInitializer, match: "(Supplier<Object> rootInitializer)", note: "PathWriter.rootInitializer"}
  - {class: io.jonasg.xjx.serdes.deserialize.PathWriter, method: objectInitializer, match: "(Supplier<Object> objectInitializer)", note: "PathWriter.objectInitializer"}
  - {class: io.jonasg.xjx.serdes.deserialize.PathWriterIndex, method: putAll, match: "(PathWriterIndex pathWriterIndex)", note: "PathWriterIndex.putAll"}
  - {class: io.jonasg.xjx.serdes.deserialize.PathWriterIndexFactory, method: createIndexForType, match: "(Class<T> type, String rootTag)", note: "PathWriterIndexFactory.createIndexForType"}
  - {class: io.jonasg.xjx.serdes.deserialize.RecordWrapper, method: record, match: "()", note: "RecordWrapper.record"}
  - {class: io.jonasg.xjx.serdes.deserialize.TagPath, method: isAbsolute, match: "()", note: "TagPath.isAbsolute"}
  - {class: io.jonasg.xjx.serdes.deserialize.TagPath, method: field, match: "()", note: "TagPath.field"}
  - {class: io.jonasg.xjx.serdes.deserialize.ValueDeserializationHandler, method: getInstance, match: "()", note: "ValueDeserializationHandler.getInstance"}
  - {class: io.jonasg.xjx.serdes.deserialize.ValueDeserializationHandler, method: handle, match: "(Field field, String value)", note: "ValueDeserializationHandler.handle"}
  - {class: io.jonasg.xjx.serdes.deserialize.config.XjxConfiguration, method: failOnUnknownEnumValue, match: "()", note: "XjxConfiguration.failOnUnknownEnumValue"}
  - {class: io.jonasg.xjx.serdes.reflector.FieldReflector, method: name, match: "()", note: "FieldReflector.name"}
  - {class: io.jonasg.xjx.serdes.reflector.FieldReflector, method: type, match: "()", note: "FieldReflector.type"}
  - {class: io.jonasg.xjx.serdes.reflector.InstanceField, method: InstanceField, match: "(FieldReflector fieldReflector, T instance)", note: "InstanceField.InstanceField"}
  - {class: io.jonasg.xjx.serdes.reflector.InstanceField, method: hasAnnotation, match: "(Class<A> annotation)", note: "InstanceField.hasAnnotation"}
  - {class: io.jonasg.xjx.serdes.reflector.InstanceReflector, method: setField, match: "(String fieldName, Object value)", note: "InstanceReflector.setField"}
