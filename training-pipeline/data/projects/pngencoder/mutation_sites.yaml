# Curated performance-mutation sites for pngencoder (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants pngencoder --source data/external-src/<checkout> \
#       --sites data/projects/pngencoder/mutation_sites.yaml

package_root: com.pngencoder

sites:
  - {class: com.pngencoder.PngEncoder, method: withBufferedImage, match: "(BufferedImage bufferedImage)", note: "PngEncoder.withBufferedImage"}
  - {class: com.pngencoder.PngEncoder, method: withCompressionLevel, match: "(int compressionLevel)", note: "PngEncoder.withCompressionLevel"}
  - {class: com.pngencoder.PngEncoder, method: withTryIndexedEncoding, match: "(boolean tryIndexedEncoding)", note: "PngEncoder.withTryIndexedEncoding"}
  - {class: com.pngencoder.PngEncoder, method: withMultiThreadedCompressionEnabled, match: "(boolean multiThreadedCompressionEnabled)", note: "PngEncoder.withMultiThreadedCompressionEnabled"}
  - {class: com.pngencoder.PngEncoder, method: withMultiThreadedCompressionDisabled, match: "()", note: "PngEncoder.withMultiThreadedCompressionDisabled"}
  - {class: com.pngencoder.PngEncoder, method: withSrgbRenderingIntent, match: "(PngEncoderSrgbRenderingIntent srgbRenderingIntent)", note: "PngEncoder.withSrgbRenderingIntent"}
  - {class: com.pngencoder.PngEncoder, method: withPhysicalPixelDimensions, match: "(PngEncoderPhysicalPixelDimensions physicalPixelDimensions)", note: "PngEncoder.withPhysicalPixelDimensions"}
  - {class: com.pngencoder.PngEncoder, method: withPredictorEncoding, match: "(boolean usePredictorEncoding)", note: "PngEncoder.withPredictorEncoding"}
  - {class: com.pngencoder.PngEncoder, method: getBufferedImage, match: "()", note: "PngEncoder.getBufferedImage"}
  - {class: com.pngencoder.PngEncoder, method: isPredictorEncodingEnabled, match: "()", note: "PngEncoder.isPredictorEncodingEnabled"}
  - {class: com.pngencoder.PngEncoder, method: getCompressionLevel, match: "()", note: "PngEncoder.getCompressionLevel"}
  - {class: com.pngencoder.PngEncoder, method: isMultiThreadedCompressionEnabled, match: "()", note: "PngEncoder.isMultiThreadedCompressionEnabled"}
