# Curated performance-mutation sites for ehcache3 (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants ehcache3 --source data/external-src/<checkout> \
#       --sites data/projects/ehcache3/mutation_sites.yaml

package_root: org.ehcache

sites:
  - {class: org.ehcache.build.util.ConfigurationBucketSet, method: api, match: "()", note: "ConfigurationBucketSet.api"}
  - {class: org.ehcache.clustered.ChainUtils, method: readPayload, match: "(ByteBuffer byteBuffer)", note: "ChainUtils.readPayload"}
  - {class: org.ehcache.config.builders.CacheConfigurationBuilder, method: newCacheConfigurationBuilder, match: "(Class<K> keyType, Class<V> valueType, ResourcePools resourcePools)", note: "CacheConfigurationBuilder.newCacheConfigurationBuilder"}
  - {class: org.ehcache.core.collections.ConcurrentWeakIdentityHashMap, method: putIfAbsent, match: "(final K key, final V value)", note: "ConcurrentWeakIdentityHashMap.putIfAbsent"}
  - {class: org.ehcache.demos.peeper.PeeperServletContextListener, method: contextInitialized, match: "(ServletContextEvent servletContextEvent)", note: "PeeperServletContextListener.contextInitialized"}
  - {class: org.ehcache.event.EventOrdering, method: isOrdered, match: "()", note: "EventOrdering.isOrdered"}
  - {class: org.ehcache.expiry.Duration, method: of, match: "(long length, TimeUnit timeUnit)", note: "Duration.of"}
  - {class: org.ehcache.impl.config.event.DefaultCacheEventListenerConfiguration, method: getServiceType, match: "()", note: "DefaultCacheEventListenerConfiguration.getServiceType"}
  - {class: org.ehcache.internal.store.StoreCreationEventListenerTest, method: setUp, match: "()", note: "StoreCreationEventListenerTest.setUp"}
  - {class: org.ehcache.jsr107.CloseUtil, method: closeAllAfter, match: "(T failure, Object ... objects)", note: "CloseUtil.closeAllAfter"}
  - {class: org.ehcache.management.providers.settings.EhcacheSettingsProvider, method: wrap, match: "(CacheBinding cacheBinding)", note: "EhcacheSettingsProvider.wrap"}
  - {class: org.ehcache.osgi.OsgiTestUtils, method: baseConfiguration, match: "(String ... path)", note: "OsgiTestUtils.baseConfiguration"}
  - {class: org.ehcache.spi.loaderwriter.BulkCacheLoadingException, method: getFailures, match: "()", note: "BulkCacheLoadingException.getFailures"}
  - {class: org.ehcache.transactions.xa.internal.xml.TxCacheManagerServiceConfigurationParser, method: parse, match: "(Element fragment, ClassLoader classLoader)", note: "TxCacheManagerServiceConfigurationParser.parse"}
