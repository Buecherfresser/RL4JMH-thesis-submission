  - {class: org.inferred.freebuilder.processor.property.ListMultimapProperty, method: addValueFieldDeclaration, match: "(SourceBuilder code)", note: "ListMultimapProperty.addValueFieldDeclaration"}
  - {class: org.inferred.freebuilder.processor.property.ListProperty, method: create, match: "(Config config)", note: "ListProperty.create"}
  - {class: org.inferred.freebuilder.processor.property.ListProperty, method: addValueFieldDeclaration, match: "(SourceBuilder code)", note: "ListProperty.addValueFieldDeclaration"}
  - {class: org.inferred.freebuilder.processor.property.MapProperty, method: create, match: "(Config config)", note: "MapProperty.create"}
