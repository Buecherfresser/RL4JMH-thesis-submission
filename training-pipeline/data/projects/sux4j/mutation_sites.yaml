# Curated performance-mutation sites for sux4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants sux4j --source data/external-src/<checkout> \
#       --sites data/projects/sux4j/mutation_sites.yaml

package_root: it.unimi.dsi.sux4j

sites:
  - {class: it.unimi.dsi.sux4j.bits.HintedBsearchSelect, method: select, match: "(final long rank)", note: "HintedBsearchSelect.select"}
  - {class: it.unimi.dsi.sux4j.io.FileLinesBigList, method: nextLong, match: "()", note: "FileLinesBigList.nextLong"}
  - {class: it.unimi.dsi.sux4j.mph.CHDMinimalPerfectHashFunction, method: keys, match: "(final Iterable<? extends T> keys)", note: "CHDMinimalPerfectHashFunction.keys"}
  - {class: it.unimi.dsi.sux4j.scratch.EliasFanoMonotoneLongBigListTables, method: numBits, match: "()", note: "EliasFanoMonotoneLongBigListTables.numBits"}
  - {class: it.unimi.dsi.sux4j.test.ByteArrayFunctionSpeedTest, method: main, match: "(final String[] arg) throws IOException, JSAPException, ClassNotFoundException, NoSuchMethodException, SecurityException", note: "ByteArrayFunctionSpeedTest.main"}
  - {class: it.unimi.dsi.sux4j.util.EliasFanoIndexedMonotoneLongBigList, method: successor, match: "(final long lowerBound)", note: "EliasFanoIndexedMonotoneLongBigList.successor"}
  - {class: it.unimi.dsi.sux4j.bits.HintedBsearchSelect, method: numBits, match: "()", note: "HintedBsearchSelect.numBits"}
