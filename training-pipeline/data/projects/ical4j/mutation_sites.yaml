# Curated performance-mutation sites for ical4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants ical4j --source data/external-src/<checkout> \
#       --sites data/projects/ical4j/mutation_sites.yaml

package_root: net.fortuna.ical4j

sites:
  - {class: net.fortuna.ical4j.agent.VEventUserAgent, method: publish, match: "(VEvent... component)", note: "VEventUserAgent.publish"}
  - {class: net.fortuna.ical4j.data.CalendarBuilder, method: build, match: "(final InputStream in) throws IOException, ParserException", note: "CalendarBuilder.build"}
  - {class: net.fortuna.ical4j.filter.FilterExpressionParser, method: parse, match: "(String filterExpression)", note: "FilterExpressionParser.parse"}
  - {class: net.fortuna.ical4j.model.AddressList, method: getAddresses, match: "()", note: "AddressList.getAddresses"}
  - {class: net.fortuna.ical4j.transform.compliance.DateListPropertyRule, method: apply, match: "(DateListProperty element)", note: "DateListPropertyRule.apply"}
  - {class: net.fortuna.ical4j.util.DefaultDecoderFactory, method: createBinaryDecoder, match: "(final Encoding encoding)", note: "DefaultDecoderFactory.createBinaryDecoder"}
  - {class: net.fortuna.ical4j.validate.ComponentContainerRuleSet, method: apply, match: "(String context, ComponentContainer<? extends Component> target)", note: "ComponentContainerRuleSet.apply"}
  - {class: net.fortuna.ical4j.agent.VEventUserAgent, method: request, match: "(VEvent... component)", note: "VEventUserAgent.request"}
  - {class: net.fortuna.ical4j.data.CalendarBuilder, method: build, match: "(final Reader in) throws IOException, ParserException", note: "CalendarBuilder.build"}
  - {class: net.fortuna.ical4j.filter.FilterExpressionParser, method: newInstance, match: "()", note: "FilterExpressionParser.newInstance"}
  - {class: net.fortuna.ical4j.model.ComponentBuilder, method: name, match: "(String name)", note: "ComponentBuilder.name"}
  - {class: net.fortuna.ical4j.transform.compliance.DateListPropertyRule, method: getSupportedType, match: "()", note: "DateListPropertyRule.getSupportedType"}
  - {class: net.fortuna.ical4j.util.DefaultDecoderFactory, method: createStringDecoder, match: "(final Encoding encoding)", note: "DefaultDecoderFactory.createStringDecoder"}
  - {class: net.fortuna.ical4j.validate.PropertyContainerRuleSet, method: apply, match: "(String context, T target)", note: "PropertyContainerRuleSet.apply"}
  - {class: net.fortuna.ical4j.agent.VFreeBusyUserAgent, method: publish, match: "(VFreeBusy... component)", note: "VFreeBusyUserAgent.publish"}
  - {class: net.fortuna.ical4j.data.CalendarParserImpl, method: parse, match: "(final InputStream in, final ContentHandler handler)", note: "CalendarParserImpl.parse"}
  - {class: net.fortuna.ical4j.filter.expression.FunctionExpression, method: getValue, match: "()", note: "FunctionExpression.getValue"}
  - {class: net.fortuna.ical4j.model.ComponentBuilder, method: hasName, match: "(String name)", note: "ComponentBuilder.hasName"}
  - {class: net.fortuna.ical4j.transform.recurrence.BySetPosRule, method: apply, match: "(List<T> dates)", note: "BySetPosRule.apply"}
  - {class: net.fortuna.ical4j.util.DefaultEncoderFactory, method: createBinaryEncoder, match: "(final Encoding encoding)", note: "DefaultEncoderFactory.createBinaryEncoder"}
  - {class: net.fortuna.ical4j.validate.PropertyRuleSet, method: apply, match: "(String context, T target)", note: "PropertyRuleSet.apply"}
  - {class: net.fortuna.ical4j.agent.VFreeBusyUserAgent, method: request, match: "(VFreeBusy... component)", note: "VFreeBusyUserAgent.request"}
  - {class: net.fortuna.ical4j.data.CalendarParserImpl, method: parse, match: "(final Reader in, final ContentHandler handler)", note: "CalendarParserImpl.parse"}
  - {class: net.fortuna.ical4j.filter.expression.NumberExpression, method: getValue, match: "()", note: "NumberExpression.getValue"}
  - {class: net.fortuna.ical4j.model.ComponentList, method: addAll, match: "(@NonNull Collection<T> content)", note: "ComponentList.addAll"}
  - {class: net.fortuna.ical4j.transform.compliance.AttendeePropertyRule, method: apply, match: "(Attendee element)", note: "AttendeePropertyRule.apply"}
  - {class: net.fortuna.ical4j.util.DefaultEncoderFactory, method: createStringEncoder, match: "(final Encoding encoding)", note: "DefaultEncoderFactory.createStringEncoder"}
  - {class: net.fortuna.ical4j.validate.CalendarValidatorImpl, method: validate, match: "(Calendar target) throws ValidationException", note: "CalendarValidatorImpl.validate"}
  - {class: net.fortuna.ical4j.agent.VJournalUserAgent, method: publish, match: "(VJournal... component)", note: "VJournalUserAgent.publish"}
  - {class: net.fortuna.ical4j.data.HCalendarParser, method: parse, match: "(InputStream in, ContentHandler handler) throws IOException, ParserException", note: "HCalendarParser.parse"}
  - {class: net.fortuna.ical4j.filter.expression.StringExpression, method: getValue, match: "()", note: "StringExpression.getValue"}
  - {class: net.fortuna.ical4j.model.ComponentList, method: removeAll, match: "(String... name)", note: "ComponentList.removeAll"}
  - {class: net.fortuna.ical4j.transform.compliance.AttendeePropertyRule, method: getSupportedType, match: "()", note: "AttendeePropertyRule.getSupportedType"}
