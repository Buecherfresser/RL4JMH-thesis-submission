  - {class: org.apache.datasketches.tuple.UpdatableTupleSketchBuilder, method: setResizeFactor, match: "(final ResizeFactor resizeFactor)", note: "UpdatableTupleSketchBuilder.setResizeFactor"}
  - {class: org.apache.datasketches.common.ArrayOfDoublesSerDe, method: serializeToByteArray, match: "(final Double item)", note: "ArrayOfDoublesSerDe.serializeToByteArray"}
  - {class: org.apache.datasketches.cpc.CpcSketch, method: getEstimate, match: "()", note: "CpcSketch.getEstimate"}
  - {class: org.apache.datasketches.fdt.Group, method: getPrimaryKey, match: "()", note: "Group.getPrimaryKey"}
  - {class: org.apache.datasketches.filters.bloomfilter.DirectBitArray, method: isDirty, match: "()", note: "DirectBitArray.isDirty"}
  - {class: org.apache.datasketches.frequencies.FrequentItemsSketch, method: getCurrentMapCapacity, match: "()", note: "FrequentItemsSketch.getCurrentMapCapacity"}
  - {class: org.apache.datasketches.hash.MurmurHash3FFM, method: hash, match: "(final long[] in, final long seed)", note: "MurmurHash3FFM.hash"}
  - {class: org.apache.datasketches.hll.HeapAuxHashMap, method: getAuxCount, match: "()", note: "HeapAuxHashMap.getAuxCount"}
  - {class: org.apache.datasketches.kll.KllDirectDoublesSketch, method: getK, match: "()", note: "KllDirectDoublesSketch.getK"}
