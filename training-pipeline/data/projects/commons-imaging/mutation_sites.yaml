  - {class: org.apache.commons.imaging.ImageDump, method: dump, match: "(final String prefix, final BufferedImage src) throws IOException", note: "ImageDump.dump"}
  - {class: org.apache.commons.imaging.common.BinaryFileParser, method: debugNumber, match: "(final String msg, final int data, final int bytes)", note: "BinaryFileParser.debugNumber"}
  - {class: org.apache.commons.imaging.formats.bmp.PixelParserRgb, method: newline, match: "() throws ImagingException, IOException", note: "PixelParserRgb.newline"}
  - {class: org.apache.commons.imaging.icc.IccProfileInfo, method: getProfileId, match: "()", note: "IccProfileInfo.getProfileId"}
