# Curated performance-mutation sites for junidecode (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants junidecode --source data/external-src/<checkout> \
#       --sites data/projects/junidecode/mutation_sites.yaml

package_root: net.gcardone.junidecode

sites:
  - {class: net.gcardone.junidecode.App, method: main, match: "(String[] args)", note: "App.main"}
  - {class: net.gcardone.junidecode.Junidecode, method: unidecode, match: "(final String s)", note: "Junidecode.unidecode"}
