  - {class: org.apache.commons.configuration2.ConfigurationUtils, method: removeEventListener, match: "(final EventType<T> eventType, final EventListener<? super T> listener)", note: "ConfigurationUtils.removeEventListener"}
  - {class: org.apache.commons.configuration2.beanutils.CombinedBeanDeclaration, method: getBeanFactoryName, match: "()", note: "CombinedBeanDeclaration.getBeanFactoryName"}
  - {class: org.apache.commons.configuration2.builder.BasicBuilderParameters, method: fetchInterpolatorSpecification, match: "(final Map<String, Object> params)", note: "BasicBuilderParameters.fetchInterpolatorSpecification"}
  - {class: org.apache.commons.configuration2.convert.DisabledListDelimiterHandler, method: escapeString, match: "(final String s)", note: "DisabledListDelimiterHandler.escapeString"}
  - {class: org.apache.commons.configuration2.event.EventListenerRegistrationData, method: getListener, match: "()", note: "EventListenerRegistrationData.getListener"}
