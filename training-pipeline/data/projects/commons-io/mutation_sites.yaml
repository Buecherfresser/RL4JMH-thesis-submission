  - {class: org.apache.commons.io.serialization.ObjectStreamClassPredicate, method: accept, match: "(final Class<?>... classes)", note: "ObjectStreamClassPredicate.accept"}
  - {class: org.apache.commons.io.Buffers, method: clear, match: "(final ByteBuffer buffer)", note: "Buffers.clear"}
  - {class: org.apache.commons.io.channels.ByteArraySeekableByteChannel, method: wrap, match: "(final byte[] bytes)", note: "ByteArraySeekableByteChannel.wrap"}
  - {class: org.apache.commons.io.charset.CharsetEncoders, method: toCharsetEncoder, match: "(final CharsetEncoder charsetEncoder)", note: "CharsetEncoders.toCharsetEncoder"}
  - {class: org.apache.commons.io.file.DirectoryStreamFilter, method: getPathFilter, match: "()", note: "DirectoryStreamFilter.getPathFilter"}
  - {class: org.apache.commons.io.filefilter.FileFilterUtils, method: ageFileFilter, match: "(final Date cutoffDate, final boolean acceptOlder)", note: "FileFilterUtils.ageFileFilter"}
