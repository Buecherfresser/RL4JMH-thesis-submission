# Curated benchmarkable classes for Jackson Core (GRPO prompt corpus).
#
# Low-level, self-contained encode/decode/number kernels (string quoting, base64, number
# parse/format, char classification, buffer building) with a hot public method over
# String/byte[]/char[] -- benchmarkable without standing up a full parse pipeline. FQCNs
# best-effort from the pinned API; jmh-curate-snippets reports non-matches. Filter with:
#   jmh-curate-snippets --snippets data/snippets/jackson-core.jsonl \
#       --good-classes data/projects/jackson-core/good_classes.yaml

project: jackson-core

classes:
  # io: the self-contained hot kernels
  - com.fasterxml.jackson.core.io.JsonStringEncoder
  - com.fasterxml.jackson.core.io.NumberInput
  - com.fasterxml.jackson.core.io.NumberOutput
  - com.fasterxml.jackson.core.io.CharTypes
  - com.fasterxml.jackson.core.io.BigDecimalParser
  # base64
  - com.fasterxml.jackson.core.Base64Variant
  - com.fasterxml.jackson.core.Base64Variants
  # util buffers / builders
  - com.fasterxml.jackson.core.util.TextBuffer
  - com.fasterxml.jackson.core.util.ByteArrayBuilder
  - com.fasterxml.jackson.core.util.BufferRecycler
  # factory (constructs a parser/generator per call over a String)
  - com.fasterxml.jackson.core.JsonFactory
