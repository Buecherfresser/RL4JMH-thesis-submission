# Curated performance-mutation sites for vertx (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants vertx --source data/external-src/<checkout> \
#       --sites data/projects/vertx/mutation_sites.yaml

package_root: io.vertx

sites:
  - {class: io.vertx.core.buffer.impl.BufferImpl, method: toJsonObject, match: "()", note: "BufferImpl.toJsonObject"}
  - {class: io.vertx.core.buffer.impl.BufferImpl, method: toJsonArray, match: "()", note: "BufferImpl.toJsonArray"}
  - {class: io.vertx.core.datagram.impl.PacketWriteStreamImpl, method: handle, match: "(AsyncResult<Void> event)", note: "PacketWriteStreamImpl.handle"}
  - {class: io.vertx.core.datagram.impl.PacketWriteStreamImpl, method: exceptionHandler, match: "(Handler<Throwable> handler)", note: "PacketWriteStreamImpl.exceptionHandler"}
  - {class: io.vertx.core.eventbus.impl.BodyReadStream, method: exceptionHandler, match: "(Handler<Throwable> handler)", note: "BodyReadStream.exceptionHandler"}
  - {class: io.vertx.core.eventbus.impl.BodyReadStream, method: handler, match: "(Handler<T> handler)", note: "BodyReadStream.handler"}
  - {class: io.vertx.core.eventbus.impl.codecs.BufferMessageCodec, method: encodeToWire, match: "(Buffer buffer, Buffer b)", note: "BufferMessageCodec.encodeToWire"}
  - {class: io.vertx.core.eventbus.impl.codecs.BufferMessageCodec, method: decodeFromWire, match: "(int pos, Buffer buffer)", note: "BufferMessageCodec.decodeFromWire"}
  - {class: io.vertx.core.eventbus.impl.codecs.ByteArrayMessageCodec, method: encodeToWire, match: "(Buffer buffer, byte[] byteArray)", note: "ByteArrayMessageCodec.encodeToWire"}
  - {class: io.vertx.core.eventbus.impl.codecs.ByteArrayMessageCodec, method: decodeFromWire, match: "(int pos, Buffer buffer)", note: "ByteArrayMessageCodec.decodeFromWire"}
  - {class: io.vertx.core.eventbus.impl.codecs.JsonArrayMessageCodec, method: encodeToWire, match: "(Buffer buffer, JsonArray jsonArray)", note: "JsonArrayMessageCodec.encodeToWire"}
  - {class: io.vertx.core.eventbus.impl.codecs.JsonArrayMessageCodec, method: decodeFromWire, match: "(int pos, Buffer buffer)", note: "JsonArrayMessageCodec.decodeFromWire"}
  - {class: io.vertx.core.eventbus.impl.codecs.StringMessageCodec, method: encodeToWire, match: "(Buffer buffer, String s)", note: "StringMessageCodec.encodeToWire"}
  - {class: io.vertx.core.eventbus.impl.codecs.StringMessageCodec, method: decodeFromWire, match: "(int pos, Buffer buffer)", note: "StringMessageCodec.decodeFromWire"}
  - {class: io.vertx.core.http.FormDecoderConfig, method: getMaxAttributeSize, match: "()", note: "FormDecoderConfig.getMaxAttributeSize"}
  - {class: io.vertx.core.http.FormDecoderConfig, method: setMaxAttributeSize, match: "(int maxSize)", note: "FormDecoderConfig.setMaxAttributeSize"}
  - {class: io.vertx.core.http.Http2Settings, method: getHeaderTableSize, match: "()", note: "Http2Settings.getHeaderTableSize"}
  - {class: io.vertx.core.http.Http2Settings, method: setHeaderTableSize, match: "(long headerTableSize)", note: "Http2Settings.setHeaderTableSize"}
  - {class: io.vertx.core.http.Http3Settings, method: getQPackMaxTableCapacity, match: "()", note: "Http3Settings.getQPackMaxTableCapacity"}
  - {class: io.vertx.core.http.Http3Settings, method: setQPackMaxTableCapacity, match: "(long value)", note: "Http3Settings.setQPackMaxTableCapacity"}
  - {class: io.vertx.core.http.HttpSetting, method: identifier, match: "()", note: "HttpSetting.identifier"}
  - {class: io.vertx.core.http.HttpSetting, method: name, match: "()", note: "HttpSetting.name"}
  - {class: io.vertx.core.http.MimeMapping, method: iterate, match: "()", note: "MimeMapping.iterate"}
  - {class: io.vertx.core.http.MimeMapping, method: mimeTypeForExtension, match: "(String ext)", note: "MimeMapping.mimeTypeForExtension"}
  - {class: io.vertx.core.http.QueryParamDecoderConfig, method: getMaxSize, match: "()", note: "QueryParamDecoderConfig.getMaxSize"}
  - {class: io.vertx.core.http.QueryParamDecoderConfig, method: setMaxSize, match: "(int maxSize)", note: "QueryParamDecoderConfig.setMaxSize"}
  - {class: io.vertx.core.http.StreamPriority, method: getWeight, match: "()", note: "StreamPriority.getWeight"}
  - {class: io.vertx.core.http.StreamPriority, method: setWeight, match: "(short weight)", note: "StreamPriority.setWeight"}
  - {class: io.vertx.core.http.StreamResetException, method: getCode, match: "()", note: "StreamResetException.getCode"}
  - {class: io.vertx.core.http.impl.HttpClientBuilderInternal, method: with, match: "(HttpClientConfig config)", note: "HttpClientBuilderInternal.with"}
  - {class: io.vertx.core.http.impl.HttpClientBuilderInternal, method: with, match: "(HttpClientOptions options)", note: "HttpClientBuilderInternal.with"}
  - {class: io.vertx.core.http.impl.HttpParser, method: parseQuotedString, match: "(String s, int from, int to)", note: "HttpParser.parseQuotedString"}
