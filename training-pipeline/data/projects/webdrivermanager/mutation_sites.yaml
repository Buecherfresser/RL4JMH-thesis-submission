# Curated performance-mutation sites for webdrivermanager (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants webdrivermanager --source data/external-src/<checkout> \
#       --sites data/projects/webdrivermanager/mutation_sites.yaml

package_root: io.github.bonigarcia

sites:
  - {class: io.github.bonigarcia.wdm.online.Parser, method: parseJson, match: "(HttpClient client, String url, Class<T> klass)", note: "Parser.parseJson"}
  - {class: io.github.bonigarcia.wdm.WdmAgent, method: premain, match: "(String args, Instrumentation instrumentation)", note: "WdmAgent.premain"}
