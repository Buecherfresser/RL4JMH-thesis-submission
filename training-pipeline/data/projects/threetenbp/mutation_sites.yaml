  - {class: org.threeten.bp.chrono.ChronoPeriodImpl, method: getChronology, match: "()", note: "ChronoPeriodImpl.getChronology"}
  - {class: org.threeten.bp.format.DateTimeFormatterBuilder, method: getLocalizedDateTimePattern, match: "(", note: "DateTimeFormatterBuilder.getLocalizedDateTimePattern"}
  - {class: org.threeten.bp.temporal.ChronoField, method: getRangeUnit, match: "()", note: "ChronoField.getRangeUnit"}
  - {class: org.threeten.bp.zone.Ser, method: readExternal, match: "(ObjectInput in) throws IOException, ClassNotFoundException", note: "Ser.readExternal"}
  - {class: org.threeten.bp.Duration, method: ofDays, match: "(long days)", note: "Duration.ofDays"}
  - {class: org.threeten.bp.chrono.ChronoZonedDateTimeImpl, method: isSupported, match: "(TemporalUnit unit)", note: "ChronoZonedDateTimeImpl.isSupported"}
  - {class: org.threeten.bp.format.DateTimeFormatter, method: ofPattern, match: "(String pattern)", note: "DateTimeFormatter.ofPattern"}
  - {class: org.threeten.bp.temporal.ChronoUnit, method: getDuration, match: "()", note: "ChronoUnit.getDuration"}
