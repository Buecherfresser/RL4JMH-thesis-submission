# Curated performance-mutation sites for hypersistence-utils (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants hypersistence-utils --source data/external-src/<checkout> \
#       --sites data/projects/hypersistence-utils/mutation_sites.yaml

package_root: io.hypersistence.utils

sites:
  - {class: io.hypersistence.utils.common.ClassLoaderUtils, method: getClassLoader, match: "()", note: "ClassLoaderUtils.getClassLoader"}
  - {class: io.hypersistence.utils.hibernate.query.DistinctListTransformer, method: transformList, match: "(List collection)", note: "DistinctListTransformer.transformList"}
  - {class: io.hypersistence.utils.jdbc.validator.SQLStatementCountMismatchException, method: getExpected, match: "()", note: "SQLStatementCountMismatchException.getExpected"}
  - {class: io.hypersistence.utils.logging.InlineQueryLogEntryCreator, method: writeParamsEntry, match: "(StringBuilder sb, ExecutionInfo execInfo, List<QueryInfo> queryInfoList)", note: "InlineQueryLogEntryCreator.writeParamsEntry"}
  - {class: io.hypersistence.utils.spring.repository.StatelessSessionUtil, method: statelessSession, match: "(EntityManager entityManager)", note: "StatelessSessionUtil.statelessSession"}
  - {class: io.hypersistence.utils.common.ClassLoaderUtils, method: loadClass, match: "(String className) throws ClassNotFoundException", note: "ClassLoaderUtils.loadClass"}
  - {class: io.hypersistence.utils.hibernate.query.MapResultTransformer, method: transformTuple, match: "(Object[] tuple, String[] aliases)", note: "MapResultTransformer.transformTuple"}
  - {class: io.hypersistence.utils.jdbc.validator.SQLStatementCountMismatchException, method: getRecorded, match: "()", note: "SQLStatementCountMismatchException.getRecorded"}
  - {class: io.hypersistence.utils.spring.aop.RetryAspect, method: retry, match: "(ProceedingJoinPoint pjp) throws Throwable", note: "RetryAspect.retry"}
  - {class: io.hypersistence.utils.common.ReflectionUtils, method: newInstance, match: "(String className)", note: "ReflectionUtils.newInstance"}
  - {class: io.hypersistence.utils.hibernate.query.MapResultTransformer, method: transformList, match: "(List tuples)", note: "MapResultTransformer.transformList"}
  - {class: io.hypersistence.utils.jdbc.validator.SQLStatementCountValidator, method: reset, match: "()", note: "SQLStatementCountValidator.reset"}
  - {class: io.hypersistence.utils.spring.repository.BaseJpaRepositoryImpl, method: persist, match: "(S entity)", note: "BaseJpaRepositoryImpl.persist"}
  - {class: io.hypersistence.utils.common.ReflectionUtils, method: newInstance, match: "(Class clazz)", note: "ReflectionUtils.newInstance"}
  - {class: io.hypersistence.utils.hibernate.type.array.BooleanArrayType, method: getName, match: "()", note: "BooleanArrayType.getName"}
  - {class: io.hypersistence.utils.jdbc.validator.SQLStatementCountValidator, method: assertSelectCount, match: "(int expectedCount)", note: "SQLStatementCountValidator.assertSelectCount"}
  - {class: io.hypersistence.utils.spring.repository.BaseJpaRepositoryImpl, method: persistAndFlush, match: "(S entity)", note: "BaseJpaRepositoryImpl.persistAndFlush"}
  - {class: io.hypersistence.utils.common.StringUtils, method: join, match: "(CharSequence delimiter, CharSequence... elements)", note: "StringUtils.join"}
  - {class: io.hypersistence.utils.hibernate.type.array.DateArrayType, method: getName, match: "()", note: "DateArrayType.getName"}
  - {class: io.hypersistence.utils.jdbc.validator.StatementType, method: recordedCount, match: "()", note: "StatementType.recordedCount"}
  - {class: io.hypersistence.utils.spring.repository.HibernateRepositoryImpl, method: findAll, match: "()", note: "HibernateRepositoryImpl.findAll"}
  - {class: io.hypersistence.utils.common.StringUtils, method: isBlank, match: "(String value)", note: "StringUtils.isBlank"}
  - {class: io.hypersistence.utils.hibernate.type.array.DecimalArrayType, method: getName, match: "()", note: "DecimalArrayType.getName"}
  - {class: io.hypersistence.utils.jdbc.validator.StatementType, method: recordedCount, match: "()", note: "StatementType.recordedCount"}
  - {class: io.hypersistence.utils.spring.repository.HibernateRepositoryImpl, method: save, match: "(S entity)", note: "HibernateRepositoryImpl.save"}
