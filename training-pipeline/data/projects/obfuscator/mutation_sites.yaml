# Curated performance-mutation sites for obfuscator (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants obfuscator --source data/external-src/<checkout> \
#       --sites data/projects/obfuscator/mutation_sites.yaml

package_root: me.superblaubeere27.jobf

sites:
  - {class: me.superblaubeere27.jobf.JObfSettings, method: getUseCustomDictionary, match: "()", note: "JObfSettings.getUseCustomDictionary"}
  - {class: me.superblaubeere27.jobf.processors.LineNumberRemover, method: process, match: "(ProcessorCallback callback, ClassNode node)", note: "LineNumberRemover.process"}
  - {class: me.superblaubeere27.jobf.ui.Appender, method: append, match: "(final ILoggingEvent event)", note: "Appender.append"}
  - {class: me.superblaubeere27.jobf.utils.ConsoleUtils, method: formatBox, match: "(String title, boolean center, List<String> lines)", note: "ConsoleUtils.formatBox"}
  - {class: me.superblaubeere27.jobf.JObfSettings, method: getClassNameDictionary, match: "()", note: "JObfSettings.getClassNameDictionary"}
  - {class: me.superblaubeere27.jobf.processors.NumberObfuscationTransformer, method: obfuscateInsnList, match: "(InsnList list)", note: "NumberObfuscationTransformer.obfuscateInsnList"}
  - {class: me.superblaubeere27.jobf.ui.Appender, method: start, match: "()", note: "Appender.start"}
  - {class: me.superblaubeere27.jobf.utils.InliningUtils, method: inline, match: "(MethodNode node, ClassNode classNode, MethodNode target, Frame<SourceValue> frame)", note: "InliningUtils.inline"}
  - {class: me.superblaubeere27.jobf.JObf, method: getGui, match: "()", note: "JObf.getGui"}
  - {class: me.superblaubeere27.jobf.processors.NumberObfuscationTransformer, method: getInstructions, match: "(int value)", note: "NumberObfuscationTransformer.getInstructions"}
  - {class: me.superblaubeere27.jobf.ui.GUI, method: mouseClicked, match: "(MouseEvent e)", note: "GUI.mouseClicked"}
  - {class: me.superblaubeere27.jobf.utils.InliningUtils, method: canInlineMethod, match: "(ClassNode from, ClassNode clazz, MethodNode node)", note: "InliningUtils.canInlineMethod"}
  - {class: me.superblaubeere27.jobf.JObf, method: main, match: "(String[] args) throws Exception", note: "JObf.main"}
  - {class: me.superblaubeere27.jobf.processors.StringEncryptionTransformer, method: process, match: "(ProcessorCallback callback, ClassNode node)", note: "StringEncryptionTransformer.process"}
  - {class: me.superblaubeere27.jobf.ui.GUI, method: scrollDown, match: "()", note: "GUI.scrollDown"}
  - {class: me.superblaubeere27.jobf.utils.NameUtils, method: setup, match: "()", note: "NameUtils.setup"}
