# Curated performance-mutation sites for reflection-util (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants reflection-util --source data/external-src/<checkout> \
#       --sites data/projects/reflection-util/mutation_sites.yaml

package_root: de.cronn.reflection

sites:
  - {class: de.cronn.reflection.util.ClassUtils, method: getRealClass, match: "(T object)", note: "ClassUtils.getRealClass"}
  - {class: de.cronn.reflection.util.ClassUtils, method: getRealClass, match: "(Class<T> clazz)", note: "ClassUtils.getRealClass"}
  - {class: de.cronn.reflection.util.ClassUtils, method: createNewInstanceLike, match: "(T source)", note: "ClassUtils.createNewInstanceLike"}
  - {class: de.cronn.reflection.util.ClassUtils, method: isFromPackage, match: "(Class<?> clazz, String packageName)", note: "ClassUtils.isFromPackage"}
  - {class: de.cronn.reflection.util.ClassUtils, method: createNewInstance, match: "(Class<T> sourceClass)", note: "ClassUtils.createNewInstance"}
  - {class: de.cronn.reflection.util.ClassUtils, method: getVoidMethodName, match: "(T bean, VoidMethod<T> voidMethod)", note: "ClassUtils.getVoidMethodName"}
  - {class: de.cronn.reflection.util.PropertyUtils, method: getPropertyDescriptorByName, match: "(Object bean, String propertyName)", note: "PropertyUtils.getPropertyDescriptorByName"}
  - {class: de.cronn.reflection.util.PropertyUtils, method: getPropertyDescriptorByName, match: "(", note: "PropertyUtils.getPropertyDescriptorByName"}
  - {class: de.cronn.reflection.util.PropertyUtils, method: getPropertyDescriptorByNameOrThrow, match: "(", note: "PropertyUtils.getPropertyDescriptorByNameOrThrow"}
  - {class: de.cronn.reflection.util.PropertyUtils, method: getPropertyDescriptorByNameOrThrow, match: "(", note: "PropertyUtils.getPropertyDescriptorByNameOrThrow"}
  - {class: de.cronn.reflection.util.PropertyUtils, method: getPropertyDescriptors, match: "(Class<?> type)", note: "PropertyUtils.getPropertyDescriptors"}
  - {class: de.cronn.reflection.util.PropertyUtils, method: getPropertyDescriptors, match: "(Object object)", note: "PropertyUtils.getPropertyDescriptors"}
  - {class: de.cronn.reflection.util.RecordUtils, method: hasOnlyImmutableRecordComponents, match: "(Class<?> recordClass)", note: "RecordUtils.hasOnlyImmutableRecordComponents"}
  - {class: de.cronn.reflection.util.RecordUtils, method: cloneRecord, match: "(T record, Function<Object, Object> valueMapping)", note: "RecordUtils.cloneRecord"}
