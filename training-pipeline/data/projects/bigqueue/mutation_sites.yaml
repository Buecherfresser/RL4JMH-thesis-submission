  - {class: com.leansoft.bigqueue.page.MappedPageFactoryImpl, method: getPageIndexSetBefore, match: "(long timestamp)", note: "MappedPageFactoryImpl.getPageIndexSetBefore"}
  - {class: com.leansoft.bigqueue.BigArrayImpl, method: isEmpty, match: "()", note: "BigArrayImpl.isEmpty"}
