# Curated performance-mutation sites for tablesaw (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants tablesaw --source data/external-src/<checkout> \
#       --sites data/projects/tablesaw/mutation_sites.yaml

package_root: tech.tablesaw

sites:
  - {class: tech.tablesaw.aggregate.AggregateFunctions, method: summarize, match: "(DateTimeColumn column)", note: "AggregateFunctions.summarize"}
  - {class: tech.tablesaw.analytic.AggregateFunctions, method: functionName, match: "()", note: "AggregateFunctions.functionName"}
  - {class: tech.tablesaw.api.StringColumn, method: valueIsMissing, match: "(String string)", note: "StringColumn.valueIsMissing"}
  - {class: tech.tablesaw.beakerx.TablesawDisplayer, method: register, match: "()", note: "TablesawDisplayer.register"}
  - {class: tech.tablesaw.columns.booleans.BitSetBooleanData, method: size, match: "()", note: "BitSetBooleanData.size"}
  - {class: tech.tablesaw.conversion.TableConverter, method: doubleMatrix, match: "()", note: "TableConverter.doubleMatrix"}
  - {class: tech.tablesaw.docs.GettingStarted, method: run, match: "() throws IOException", note: "GettingStarted.run"}
  - {class: tech.tablesaw.filtering.DeferredNumberColumn, method: isEqualTo, match: "(double other)", note: "DeferredNumberColumn.isEqualTo"}
  - {class: tech.tablesaw.index.ByteIndex, method: atLeast, match: "(byte value)", note: "ByteIndex.atLeast"}
  - {class: tech.tablesaw.interpolation.Interpolator, method: backfill, match: "()", note: "Interpolator.backfill"}
  - {class: tech.tablesaw.io.jdbc.SqlResultSetReader, method: mapJdbcTypeToColumnType, match: "(Integer jdbc, ColumnType columnType)", note: "SqlResultSetReader.mapJdbcTypeToColumnType"}
  - {class: tech.tablesaw.joining.RowComparatorChain, method: addComparator, match: "(Comparator<Row> comparator)", note: "RowComparatorChain.addComparator"}
  - {class: tech.tablesaw.plotly.Utils, method: dataAsString, match: "(double[] data)", note: "Utils.dataAsString"}
  - {class: tech.tablesaw.selection.BitSetBackedSelection, method: removeRange, match: "(long start, long end)", note: "BitSetBackedSelection.removeRange"}
  - {class: tech.tablesaw.sorting.SortUtils, method: getChain, match: "(Table table, Sort key)", note: "SortUtils.getChain"}
  - {class: tech.tablesaw.table.RollingColumn, method: generateNewColumnName, match: "(AggregateFunction<?, ?> function)", note: "RollingColumn.generateNewColumnName"}
  - {class: tech.tablesaw.util.DoubleArrays, method: toN, match: "(int n)", note: "DoubleArrays.toN"}
  - {class: tech.tablesaw.aggregate.AggregateFunctions, method: summarize, match: "(DateColumn column)", note: "AggregateFunctions.summarize"}
  - {class: tech.tablesaw.analytic.AggregateFunctions, method: returnType, match: "()", note: "AggregateFunctions.returnType"}
  - {class: tech.tablesaw.api.StringColumn, method: appendMissing, match: "()", note: "StringColumn.appendMissing"}
  - {class: tech.tablesaw.beakerx.TablesawDisplayer, method: registerTable, match: "()", note: "TablesawDisplayer.registerTable"}
  - {class: tech.tablesaw.columns.booleans.BitSetBooleanData, method: clear, match: "()", note: "BitSetBooleanData.clear"}
  - {class: tech.tablesaw.conversion.TableConverter, method: doubleMatrix, match: "(int... columnIndicies)", note: "TableConverter.doubleMatrix"}
  - {class: tech.tablesaw.docs.Main, method: main, match: "(String[] args) throws IOException, InterruptedException", note: "Main.main"}
  - {class: tech.tablesaw.filtering.DeferredNumberColumn, method: isBetweenExclusive, match: "(double start, double end)", note: "DeferredNumberColumn.isBetweenExclusive"}
  - {class: tech.tablesaw.index.ByteIndex, method: greaterThan, match: "(byte value)", note: "ByteIndex.greaterThan"}
  - {class: tech.tablesaw.interpolation.Interpolator, method: frontfill, match: "()", note: "Interpolator.frontfill"}
  - {class: tech.tablesaw.io.jdbc.SqlResultSetReader, method: getColumnType, match: "(int columnType, int scale, int precision)", note: "SqlResultSetReader.getColumnType"}
  - {class: tech.tablesaw.joining.RowComparatorChain, method: size, match: "()", note: "RowComparatorChain.size"}
  - {class: tech.tablesaw.plotly.Utils, method: quote, match: "(String string)", note: "Utils.quote"}
  - {class: tech.tablesaw.selection.BitSetBackedSelection, method: flip, match: "(int rangeStart, int rangeEnd)", note: "BitSetBackedSelection.flip"}
  - {class: tech.tablesaw.sorting.SortUtils, method: rowComparator, match: "(Column<?> column, Sort.Order order)", note: "SortUtils.rowComparator"}
  - {class: tech.tablesaw.table.RollingColumn, method: calc, match: "(AggregateFunction<INCOL, OUT> function)", note: "RollingColumn.calc"}
  - {class: tech.tablesaw.util.DoubleArrays, method: to2dArray, match: "(NumericColumn<?>... columns)", note: "DoubleArrays.to2dArray"}
  - {class: tech.tablesaw.aggregate.CrossTab, method: counts, match: "(Table table, String columnName)", note: "CrossTab.counts"}
  - {class: tech.tablesaw.analytic.ArgumentList, method: getAggregateFunctions, match: "()", note: "ArgumentList.getAggregateFunctions"}
  - {class: tech.tablesaw.api.BooleanColumn, method: valueIsMissing, match: "(byte b)", note: "BooleanColumn.valueIsMissing"}
  - {class: tech.tablesaw.columns.booleans.BooleanParser, method: canParse, match: "(String s)", note: "BooleanParser.canParse"}
  - {class: tech.tablesaw.conversion.smile.SmileConverter, method: toDataFrame, match: "()", note: "SmileConverter.toDataFrame"}
  - {class: tech.tablesaw.docs.OutputWriter, method: println, match: "(Object obj)", note: "OutputWriter.println"}
  - {class: tech.tablesaw.filtering.DeferredStringColumn, method: isEmptyString, match: "()", note: "DeferredStringColumn.isEmptyString"}
  - {class: tech.tablesaw.index.DoubleIndex, method: atLeast, match: "(double value)", note: "DoubleIndex.atLeast"}
  - {class: tech.tablesaw.io.AddCellToColumnException, method: getColumnIndex, match: "()", note: "AddCellToColumnException.getColumnIndex"}
  - {class: tech.tablesaw.joining.DataFrameJoiner, method: type, match: "(JoinType joinType)", note: "DataFrameJoiner.type"}
  - {class: tech.tablesaw.plotly.components.TemplateUtils, method: setTemplateLocations, match: "(String... locations)", note: "TemplateUtils.setTemplateLocations"}
  - {class: tech.tablesaw.selection.BitmapBackedSelection, method: removeRange, match: "(long start, long end)", note: "BitmapBackedSelection.removeRange"}
  - {class: tech.tablesaw.sorting.comparators.DescendingIntComparator, method: instance, match: "()", note: "DescendingIntComparator.instance"}
  - {class: tech.tablesaw.table.StandardTableSliceGroup, method: create, match: "(Table original, String... columnsNames)", note: "StandardTableSliceGroup.create"}
  - {class: tech.tablesaw.util.StringUtils, method: splitByCharacterTypeCamelCase, match: "(final String str)", note: "StringUtils.splitByCharacterTypeCamelCase"}
  - {class: tech.tablesaw.aggregate.CrossTab, method: percents, match: "(Table table, String column1)", note: "CrossTab.percents"}
