# Gemma 4 E2B - run 9 on the 8x RTX PRO 6000 Blackwell box (rtx-jonas). From BASE.
#
# Run 8 was the infrastructure run: it fixed the JMH lock, parallelised the reward, and certified
# weight sync, and it climbed compile 14.8 % -> 36.6 % and reward 0.106 -> 0.263 over 1485 steps in
# 20.4 h at a *constant* 3e-6. Run 9 changes three things and nothing else:
#
#   1. THE LEARNING RATE, 3e-6 -> 8e-5 with a cosine floor at 2e-5. 3e-6 was never tuned in the
#      regime the pipeline actually runs in -- it was picked for run 2, when the reload_weights bug
#      meant every rollout came from the BASE model and gradients were ~20x smaller than they are
#      now. The two probe rounds (2026-08-11, one GPU per arm, same seed, same prompt order, from
#      base, 1 prompt/step) say it was leaving a lot on the table. Over the first ~70 steps:
#
#        arm     reward (first 20 -> last 20)   compile (first 20 -> last 20)   grad_norm median
#        1e-5    0.089 -> 0.194                 0.144 -> 0.287                  5.0e-03
#        2e-5    0.072 -> 0.229                 0.138 -> 0.338                  2.7e-03
#        4e-5    0.061 -> 0.360                 0.100 -> 0.463                  2.0e-03
#        8e-5    0.162 -> 0.333                 0.250 -> 0.494                  3.8e-03
#
#      8e-5 led 4e-5 in every 10-step block up to step 50 and peaked at reward 0.682 / compile
#      0.762 in block 31-40 -- above anything run 8 reached in 1485 steps at 3e-6. Neither hot arm
#      collapsed: no parse failures, entropy 0.31-0.45 (no collapse toward 0), and completion
#      length flat at 1273-1767 tokens against a 16384 cap, so nothing ran away. The one drift
#      signal is 8e-5's clipped_ratio pinning at 1.00 from step ~40 (4e-5 stayed 0.16-0.34): with
#      lengths that short that is NOT truncation, it is the policy switching to <eos> (1) instead
#      of <turn|> (106) as its terminator. `mask_truncated_completions: false` means that costs
#      nothing in the loss, and both ids are in Gemma 4's generation_config, so serving is
#      unaffected -- but it is the reason for the floor rather than a bare cosine to 0.
#
#      Note the probes measured 8e-5 at a global batch of 8 (1 prompt/step). This run uses 32
#      (4 prompts/step), which cuts gradient noise ~2x, so 8e-5 here is *less* aggressive than
#      8e-5 there, not more.
#
#      WATCH: reward and compile_frac over the first 100 steps against run 8's 0.10 / 14.8 %, and
#      entropy. If entropy climbs past ~0.6 or reward is flat at step 150, the LR is too hot --
#      kill it and re-launch at 4e-5, which the probe says is the safe second choice.
#
#   2. THE CORPUS, 1160 prompts / 65 projects -> 4739 / 241 (the repaired corpus + the verified
#      tier A corpus, data/snippets/rl-mutation-all.good.jsonl). After max_source_chars and
#      exclude_projects, 4547 survive. Run 8 saw 2970 prompt-visits over 834 usable prompts, i.e.
#      it went round its corpus ~3.5x; at 2 prompts/step this run sees 3200 visits over 4447
#      training prompts, so most subjects are seen exactly once. Every one of the 236 projects
#      training has a resolving patched mutant classpath and a mutants.yaml registry -- the blocks
#      at the bottom are generated by scripts/sync_grpo_corpus_configs.py, which refuses a project
#      whose classpath has a dangling entry.
#
#   3. A 100-PROMPT HELD-OUT SET (new; see holdout_* below). Every reward number runs 1-8 report is
#      in-sample: measured on a prompt the policy was being trained on at that moment. None of them
#      can separate "learned to write JMH benchmarks" from "memorised these 834 subjects". These 100
#      prompts are excluded from training and scored AFTER the run by scripts/score_holdout.py,
#      base vs checkpoint, which is what makes the result a gain rather than a level. TRL's in-run
#      eval loop was tried first and rejected on measurement -- see the holdout_* block for the
#      numbers.
#
# NOT changed, deliberately: the prompt text, the reward weights, group_size, the sampling params,
# and repair_completions. The system prompt's @State grouping is a known cause of compile failures
# (it lists a TYPE-only annotation alongside five method-legal ones) and it is worth fixing -- but
# fixing it here would make it impossible to attribute a compile-rate jump to the LR.
#
# WHY FOUR RANKS AND NOT EIGHT. All eight cards are free and VRAM is not the constraint (run 8
# peaked at 51.7 GiB of 97.9 GiB per card), so 8 ranks looks free. It is not: this box has 62 GiB
# of RAM, of which the NVIDIA driver permanently holds ~27 GiB for the page tables of 8x96 GiB of
# VRAM, leaving ~35 GiB usable. Measured with an 8-rank smoke of this exact config
# (/opt/jmh/logs/run9-smoke8-ram.csv, 2026-08-11), sampling MemAvailable every 2 s:
#
#     phase                          MemAvailable   swap in use   java procs
#     idle                              34.96 GiB      0.21 GiB            0
#     8 ranks loaded, pre-reward        11.38 GiB      2.56 GiB            0
#     8 ranks, still pre-reward         10.17 GiB     16.27 GiB            0
#     first reward wave                  6.78 GiB     16.35 GiB           32
#
# The eight trainer ranks drove 16 GiB into swap *before a single JVM started*, so this is not a
# reward_workers problem and dropping to 2 workers per rank would not fix it. Swapping also
# destroys the mutation reward specifically: it is a >=10 % slowdown test at alpha=0.05, and page
# faults inside a timed JMH fork are indistinguishable from the mutant being slow. 4 ranks x 4
# workers is run 8's shape, which held for 20.4 h with no swap.
#
#   NUM_GPUS=4 CUDA_VISIBLE_DEVICES=0,1,2,3 \
#     GRPO_CONFIG=configs/grpo/mutation70-gemma-rtx-run9.yaml scripts/cluster/run-grpo-rtx-run3.sh

base_model: google/gemma-4-E2B-it
output_dir: outputs/grpo-mutation70-gemma-rtx-run9
dataset_path: data/snippets/rl-mutation-all.good.jsonl
corpus: full
seed: 42

finetune_mode: lora
precision: bf16
gradient_checkpointing: true
attn_implementation: sdpa
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  exclude_modules: [vision_tower, audio_tower, multi_modal_projector]
  bias: none

# See header note 1. The floor matters: a plain cosine (or run 8's `linear`) decays to exactly 0,
# which spends the last few hundred steps not moving the policy. 2e-5 is still ~7x run 8's constant
# LR and is the arm the probe ranked second on compile rate, so the tail of this run is roughly
# "run at the second-best LR" rather than "run at no LR".
#
# The schedule decays over HF's num_training_steps, which is max_steps -- that is why
# num_iterations below is set explicitly instead of being left to the epoch estimate. An
# epoch-derived horizon depends on the dataloader length, which changes with the rank count, so
# the same config on 4 vs 8 GPUs would otherwise anneal on a different curve.
learning_rate: 8.0e-5
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_min_lr: 2.0e-5
# Global batch = per_device x num_processes x accum = 1 x 4 x 4 = 16 = 2 prompts x G8, i.e. run 8's
# batch exactly. See "WHY FOUR RANKS" above.
per_device_batch_size: 1
gradient_accumulation_steps: 4
group_size: 8
rollout_temperature: 1.0
top_p: 0.95
top_k: 64
max_prompt_length: 20480
max_completion_length: 16384
completion_eos_token_id: 106
chat_template_kwargs:
  enable_thinking: true
max_source_chars: 48000
limit_prompts: 0

kl_coeff: 0.0
epsilon: 0.2
epsilon_high: 0.28
grpo_loss_type: dr_grpo
scale_rewards: false
# Stays false. Gemma 4 declares three terminators (eos_token_id: [1, 106, 50]) and uses two; TRL
# tests only for `completion_eos_token_id` and would mask every completion ending on <eos> out of
# the loss. Run 2 lost ~57 % of every batch that way, and the discarded half was the longer half.
# This is load-bearing at 8e-5, where the probe shows the policy migrating to <eos> almost
# entirely -- with masking on, this run would train on nearly nothing by step 50.
mask_truncated_completions: false
mu: 1

# --- training length -------------------------------------------------------------------------
# 1600 optimiser steps, and it is what fixes the cosine horizon. Run 8 needed 1485 steps at 3e-6
# and was still gaining at its last one; this gives slightly more updates at an LR the probe says
# learns several times faster per step, so the curve should finish inside the horizon rather than
# be cut off at it.
#
# Budget ~23 h: 1600 x 51.0 s. That step time is measured on THIS corpus, not carried over from run
# 8 -- configs/grpo/run9-lenprobe.yaml logged 50.98 s/it with mean completion 1741 tokens and 0/16
# parse failures, against run 8's 51.2 s and ~1640 tokens, so the 4x bigger corpus costs nothing per
# step. At 2 prompts/step that is 3200 prompt-visits against 4447
# training prompts, i.e. ~0.72 epochs -- most prompts are seen once and none more than twice. That
# is a deliberate consequence of the corpus growing 4x while throughput did not: this run trades
# repetition for coverage, which is the right trade when the thing being measured is a held-out
# reward rather than a training reward.
num_epochs: 4.0
num_iterations: 1600
warmup_ratio: 0.03
logging_steps: 1
save_steps: 25
resume_from_checkpoint: auto
report_to: none

# --- held-out evaluation ---------------------------------------------------------------------
# 100 prompts withheld from training by a seeded shuffle of the filtered prompt list, so the split
# is reproducible from this file alone and survives a resume (a re-drawn split would leak the
# held-out prompts into training for the rest of the run). The shuffle is over the whole list
# rather than a head/tail slice because the corpus is grouped by project: slicing would hold out
# whole projects and measure cross-project transfer instead of held-out-subject generalisation.
# At seed 12345 the 100 land across 38 projects. The exact ids are written to
# output_dir/holdout_prompts.json at startup, and the curve to metrics/holdout_eval.csv.
#
# IN-RUN EVAL IS OFF (holdout_eval_every: 0) AND THAT IS A MEASURED DECISION, NOT AN OVERSIGHT.
# The prompts are still withheld -- nothing below this line trains on them -- but they are scored
# offline by scripts/score_holdout.py after the run instead of by TRL's eval loop during it.
#
# The in-run path was configured, smoke-tested green, and then measured on the real 100 prompts at
# step 0 (2026-08-11, killed at step 0 after ~12 min). Two findings, either one disqualifying:
#
#   * COST. 32 rollouts in ~12 min = ~22 s/rollout, against 3.2 s/rollout for training (51 s per
#     16-rollout generation batch). A pass is ~2.5 h, not the ~40 min budgeted, so five passes
#     would have added ~12 h to a 23 h run. The reward was not the cause: those 32 rollouts
#     consumed 6 s of reward time in total (mean 0.2 s). It is the eval generation path, which
#     hands vLLM one sequence per rank and pays a wake/sync/sleep cycle per 4 rollouts instead of
#     per 16.
#   * VALIDITY. 28 of 32 eval rollouts were parse failures (87.5 %). On the same corpus and the
#     same base weights, training generates 1741-token completions with 0/16 parse failures
#     (measured by configs/grpo/run9-lenprobe.yaml, max_len 2212 against the 16384 cap). A
#     held-out number produced by a path that fails to parse 87.5 % of what it generates measures
#     the eval path, not the policy.
#
# Offline scoring reuses the training reward and the training generation shape, so a base-vs-
# checkpoint delta on these 100 prompts is comparable to the training curve by construction.
holdout_prompts: 100
holdout_seed: 12345
holdout_eval_every: 0
holdout_eval_on_start: false
# MUST hold: per_device_eval_batch_size x num_processes == num_generations_eval. The eval batch is
# not accumulated (there is no gradient), so the global eval batch is 1 x 4 = 4 and it has to be
# exactly one group.
#
# per_device_eval_batch_size stays at 1 -- the same as per_device_batch_size -- because the eval
# forward pass is where this run first died. TRL's `_get_per_token_logps_and_entropies` builds a
# (batch, completion_len, vocab) logits tensor and accelerate's mixed-precision wrapper upcasts it
# to fp32 on the way out, so with Gemma 4's 262144-token vocab and a completion at the 16384 cap
# one row costs 16 GiB and four cost exactly the 64 GiB the 4-rank smoke tried and failed to
# allocate (2026-08-11, /opt/jmh/logs/run9-smoke4.log). Training never hit it because
# per_device_batch_size is 1; eval inherited a batch of 4 and did.
#
# The consequence is G=4 rather than G=8 on the held-out set. Mean reward is an unbiased estimate
# of the policy's expected reward at any G, and every pass -- including the step-0 baseline -- uses
# the identical G, so the gain is measured consistently. Only the per-prompt variance is higher,
# and that is averaged over 100 prompts.
per_device_eval_batch_size: 1
num_generations_eval: 4

use_vllm: true
vllm_mode: colocate
# Run 8 peaked at 51.7 GiB of the 97.9 GiB per card at 0.40, so VRAM is not the constraint here --
# host RAM is (~36 GiB usable; the driver holds ~27 GiB for 8x96 GiB of VRAM).
vllm_gpu_memory_utilization: 0.40
vllm_tensor_parallel_size: 1
vllm_max_model_length: 65536
# MUST stay false while enable_thinking is on -- measured twice, see training-run-failures.md
# section 9.
vllm_importance_sampling_correction: false
vllm_enable_sleep_mode: true

reward_weights:
  compile: 0.10
  runtime: 0.10
  anti_pattern: 0.05
  rsd: 0.05
  mutation: 0.70
anti_pattern_backend: spotjmh
need_run: true
# 4 workers x 4 ranks = 16 concurrent JMH processes: run 8's validated level, which scored
# mutation 0.719 against run 7's 0.69 (serial rewards), so the concurrency is not costing timing
# fidelity at this level. The 8-rank smoke that would have doubled it to 32 is documented in the
# header -- it failed on host RAM, not on this setting.
#
# WATCH: mutation_score_mean against run 8's 0.719. A drop means back off.
reward_workers: 4
capture_completions_every: 25
gpu_sample_seconds: 10.0
repair_completions: false
exclude_projects:
  - jackson-dataformats-binary
  - spatial4j
rsd_good: 0.05
rsd_bad: 0.25

mutation:
  alpha: 0.05
  min_slowdown: 1.10
  arm_property: jmhbench.mutant
  coverage_guidance: true
  max_mutants_per_candidate: 0
  max_benchmarks_per_mutant: 6
  mode: coverage_aware
  coverage_weight: 0.30
  coverage_jmh:
    warmup_iterations: 0
    measurement_iterations: 1
    forks: 1
    warmup_time: "100ms"
    measurement_time: "100ms"
    timeout_s: 120.0
    per_iteration_timeout_s: 60.0
    fail_on_error: false
    # Same cap as runner.jmh above: the coverage pass forks the same benchmarks.
    jvm_args: ["-Xmx2g", "-XX:+ExitOnOutOfMemoryError"]

runner:
  jmh_version: "1.37"
  java_release: 17
  jmh:
    warmup_iterations: 3
    measurement_iterations: 5
    forks: 1
    warmup_time: "200ms"
    measurement_time: "200ms"
    timeout_s: 120.0
    per_iteration_timeout_s: 60.0
    fail_on_error: false
    # A JMH fork with no -Xmx inherits the JVM default max heap of 1/4 of PHYSICAL RAM -- ~15.5 GiB
    # on this box -- and 16 concurrent forks are therefore allowed ~248 GiB against ~35 GiB of
    # usable RAM. That is not theoretical: run 9's first attempt was OOM-killed with a single
    # `java` at 7.8 GiB anon-rss (dmesg, 2026-08-12 00:02 and 01:54) after swap hit 31.8/31 GiB.
    # Run 8 never hit it because its 65-project corpus did not produce allocation-heavy
    # benchmarks; over 236 projects the model writes @Setup bodies that build large structures.
    #
    # 2 GiB is above what any legitimate microbenchmark here needs, so this bounds the damage
    # without biasing the reward: a runaway candidate now dies with OutOfMemoryError and scores 0
    # (correct -- it is a bad benchmark) instead of taking the box down. ExitOnOutOfMemoryError
    # makes it die immediately rather than GC-thrashing for the full 120 s timeout.
    jvm_args: ["-Xmx2g", "-XX:+ExitOnOutOfMemoryError"]

