  - {class: com.ezylang.evalex.data.conversion.BinaryConverter, method: convert, match: "(Object object, ExpressionConfiguration configuration)", note: "BinaryConverter.convert"}
  - {class: com.ezylang.evalex.functions.basic.MaxFunction, method: evaluate, match: "(", note: "MaxFunction.evaluate"}
  - {class: com.ezylang.evalex.operators.booleans.InfixAndOperator, method: evaluate, match: "(", note: "InfixAndOperator.evaluate"}
  - {class: com.ezylang.evalex.data.conversion.BinaryConverter, method: canConvert, match: "(Object object)", note: "BinaryConverter.canConvert"}
  - {class: com.ezylang.evalex.functions.basic.MinFunction, method: evaluate, match: "(", note: "MinFunction.evaluate"}
  - {class: com.ezylang.evalex.operators.booleans.InfixEqualsOperator, method: evaluate, match: "(", note: "InfixEqualsOperator.evaluate"}
  - {class: com.ezylang.evalex.data.conversion.BooleanConverter, method: convert, match: "(Object object, ExpressionConfiguration configuration)", note: "BooleanConverter.convert"}
  - {class: com.ezylang.evalex.functions.basic.NotFunction, method: evaluate, match: "(", note: "NotFunction.evaluate"}
  - {class: com.ezylang.evalex.operators.booleans.InfixGreaterEqualsOperator, method: evaluate, match: "(", note: "InfixGreaterEqualsOperator.evaluate"}
  - {class: com.ezylang.evalex.data.conversion.BooleanConverter, method: canConvert, match: "(Object object)", note: "BooleanConverter.canConvert"}
