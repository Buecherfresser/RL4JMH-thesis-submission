# Curated performance-mutation sites for hash4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants hash4j --source data/external-src/<checkout> \
#       --sites data/projects/hash4j/mutation_sites.yaml

package_root: com.dynatrace.hash4j

sites:
  - {class: com.dynatrace.hash4j.consistent.ConsistentJumpBackAnchorBucketSetHasher, method: addBucket, match: "()", note: "ConsistentJumpBackAnchorBucketSetHasher.addBucket"}
  - {class: com.dynatrace.hash4j.distinctcount.DistinctCountUtil, method: deduplicateTokens, match: "(int[] tokens, int fromIndexIncl, int toIndexExcl)", note: "DistinctCountUtil.deduplicateTokens"}
  - {class: com.dynatrace.hash4j.hashing.ByteArrayByteAccess, method: getByteAsUnsignedInt, match: "(byte[] data, long idx)", note: "ByteArrayByteAccess.getByteAsUnsignedInt"}
  - {class: com.dynatrace.hash4j.internal.ArraySizeUtil, method: increaseArraySize, match: "(int currentSize, int requiredIndex)", note: "ArraySizeUtil.increaseArraySize"}
  - {class: com.dynatrace.hash4j.random.RandomExponentialUtil, method: exponential, match: "(PseudoRandomGenerator prg)", note: "RandomExponentialUtil.exponential"}
  - {class: com.dynatrace.hash4j.similarity.DistinctElementHashProvider, method: reset, match: "(ElementHashProvider elementHashProvider)", note: "DistinctElementHashProvider.reset"}
