# Curated performance-mutation sites for apfloat (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants apfloat --source data/external-src/<checkout> \
#       --sites data/projects/apfloat/mutation_sites.yaml

package_root: org.apfloat

sites:
