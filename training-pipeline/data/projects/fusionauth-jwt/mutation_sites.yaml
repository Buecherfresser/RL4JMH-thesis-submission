  - {class: io.fusionauth.jwt.rsa.RSAPSSVerifier, method: newVerifier, match: "(Path path)", note: "RSAPSSVerifier.newVerifier"}
  - {class: io.fusionauth.jwt.JWTUtils, method: decodeHeader, match: "(String encodedJWT)", note: "JWTUtils.decodeHeader"}
  - {class: io.fusionauth.jwt.domain.JWT, method: getTimeMachineDecoder, match: "(ZonedDateTime now)", note: "JWT.getTimeMachineDecoder"}
  - {class: io.fusionauth.jwt.ec.ECVerifier, method: newVerifier, match: "(PublicKey publicKey)", note: "ECVerifier.newVerifier"}
  - {class: io.fusionauth.jwt.rsa.RSASigner, method: newSHA256Signer, match: "(String privateKey)", note: "RSASigner.newSHA256Signer"}
  - {class: io.fusionauth.jwt.TimeMachineJWTDecoder, method: now, match: "()", note: "TimeMachineJWTDecoder.now"}
  - {class: io.fusionauth.jwt.domain.JWT, method: getEncoder, match: "()", note: "JWT.getEncoder"}
  - {class: io.fusionauth.jwt.ec.ECVerifier, method: newVerifier, match: "(Path path)", note: "ECVerifier.newVerifier"}
