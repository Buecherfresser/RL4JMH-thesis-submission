# Curated performance-mutation sites for crawler-commons (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants crawler-commons --source data/external-src/<checkout> \
#       --sites data/projects/crawler-commons/mutation_sites.yaml

package_root: crawlercommons.sitemaps.sax

sites:
  - {class: crawlercommons.sitemaps.sax.AtomHandler, method: startElement, match: "(String uri, String localName, String qName, Attributes attributes) throws SAXException", note: "AtomHandler.startElement"}
  - {class: crawlercommons.sitemaps.sax.extension.PageMapsHandler, method: reset, match: "()", note: "PageMapsHandler.reset"}
  - {class: crawlercommons.sitemaps.sax.AtomHandler, method: endElement, match: "(String uri, String localName, String qName) throws SAXException", note: "AtomHandler.endElement"}
  - {class: crawlercommons.sitemaps.sax.extension.PageMapsHandler, method: startElement, match: "(String uri, String localName, String qName, Attributes attributes) throws SAXException", note: "PageMapsHandler.startElement"}
  - {class: crawlercommons.sitemaps.sax.AtomHandler, method: characters, match: "(char[] ch, int start, int length) throws SAXException", note: "AtomHandler.characters"}
  - {class: crawlercommons.sitemaps.sax.extension.PageMapsHandler, method: endElement, match: "(String uri, String localName, String qName) throws SAXException", note: "PageMapsHandler.endElement"}
  - {class: crawlercommons.sitemaps.sax.AtomHandler, method: getSiteMap, match: "()", note: "AtomHandler.getSiteMap"}
