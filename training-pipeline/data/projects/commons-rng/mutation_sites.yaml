  - {class: org.apache.commons.rng.core.util.RandomStreams, method: characteristics, match: "()", note: "RandomStreams.characteristics"}
  - {class: org.apache.commons.rng.sampling.distribution.InternalUtils, method: withCache, match: "(final int cacheSize)", note: "InternalUtils.withCache"}
  - {class: org.apache.commons.rng.simple.internal.IntArray2LongArray, method: convert, match: "(int[] seed)", note: "IntArray2LongArray.convert"}
  - {class: org.apache.commons.rng.core.RandomProviderDefaultState, method: getState, match: "()", note: "RandomProviderDefaultState.getState"}
  - {class: org.apache.commons.rng.sampling.CollectionSampler, method: sample, match: "()", note: "CollectionSampler.sample"}
  - {class: org.apache.commons.rng.simple.internal.Long2IntArray, method: convert, match: "(Long seed)", note: "Long2IntArray.convert"}
