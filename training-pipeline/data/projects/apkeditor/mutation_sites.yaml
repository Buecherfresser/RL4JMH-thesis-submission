  - {class: com.reandroid.apkeditor.refactor.TypeNameMap, method: toXMLDocument, match: "()", note: "TypeNameMap.toXMLDocument"}
  - {class: com.reandroid.apkeditor.smali.SmaliDecompiler, method: decodeDex, match: "(DexFileInputSource inputSource, File mainDir) throws IOException", note: "SmaliDecompiler.decodeDex"}
  - {class: com.reandroid.apkeditor.utils.CyclicIterator, method: getIndex, match: "()", note: "CyclicIterator.getIndex"}
  - {class: com.reandroid.apkeditor.APKEditor, method: getARSCLibInfo, match: "()", note: "APKEditor.getARSCLibInfo"}
  - {class: com.reandroid.apkeditor.compile.BuildOptions, method: newCommandExecutor, match: "()", note: "BuildOptions.newCommandExecutor"}
  - {class: com.reandroid.apkeditor.decompile.Decompiler, method: runCommand, match: "() throws IOException", note: "Decompiler.runCommand"}
  - {class: com.reandroid.apkeditor.info.InfoWriterJson, method: writeXmlDocument, match: "(String sourcePath, ResXmlDocument xmlDocument) throws IOException", note: "InfoWriterJson.writeXmlDocument"}
  - {class: com.reandroid.apkeditor.protect.DexConfuser, method: confuse, match: "()", note: "DexConfuser.confuse"}
  - {class: com.reandroid.apkeditor.refactor.TypeNameMap, method: listTypeNames, match: "()", note: "TypeNameMap.listTypeNames"}
  - {class: com.reandroid.apkeditor.smali.SmaliDecompiler, method: decodeDex, match: "(ApkModule apkModule, File mainDirectory) throws IOException", note: "SmaliDecompiler.decodeDex"}
  - {class: com.reandroid.apkeditor.APKEditor, method: getDescription, match: "()", note: "APKEditor.getDescription"}
  - {class: com.reandroid.apkeditor.compile.BuildOptions, method: validateInput, match: "(boolean isFile, boolean isDirectory)", note: "BuildOptions.validateInput"}
  - {class: com.reandroid.apkeditor.info.InfoWriterText, method: writeStringPool, match: "(String source, StringPool<?> stringPool) throws IOException", note: "InfoWriterText.writeStringPool"}
  - {class: com.reandroid.apkeditor.protect.DexConfuser, method: getAllTasks, match: "()", note: "DexConfuser.getAllTasks"}
