# Curated performance-mutation sites for java-php-serializer (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants java-php-serializer --source data/external-src/<checkout> \
#       --sites data/projects/java-php-serializer/mutation_sites.yaml

package_root: com.marcospassos.phpserializer

sites:
  - {class: com.marcospassos.phpserializer.SerializerBuilder, method: build, match: "()", note: "SerializerBuilder.build"}
  - {class: com.marcospassos.phpserializer.adapter.ObjectAdapter, method: writeFields, match: "(", note: "ObjectAdapter.writeFields"}
  - {class: com.marcospassos.phpserializer.exclusion.DisjunctionExclusionStrategy, method: shouldSkipField, match: "(Field field)", note: "DisjunctionExclusionStrategy.shouldSkipField"}
  - {class: com.marcospassos.phpserializer.naming.PsrNamingStrategy, method: getClassName, match: "(Class type)", note: "PsrNamingStrategy.getClassName"}
  - {class: com.marcospassos.phpserializer.state.WritingArrayState, method: isReferable, match: "()", note: "WritingArrayState.isReferable"}
  - {class: com.marcospassos.phpserializer.util.ReflectionUtils, method: getFields, match: "(Class type)", note: "ReflectionUtils.getFields"}
  - {class: com.marcospassos.phpserializer.SerializerBuilder, method: setCharset, match: "(Charset charset)", note: "SerializerBuilder.setCharset"}
  - {class: com.marcospassos.phpserializer.adapter.ObjectAdapter, method: getModifiers, match: "(Field field)", note: "ObjectAdapter.getModifiers"}
  - {class: com.marcospassos.phpserializer.exclusion.NoExclusionStrategy, method: shouldSkipField, match: "(Field field)", note: "NoExclusionStrategy.shouldSkipField"}
  - {class: com.marcospassos.phpserializer.naming.PsrNamingStrategy, method: getFieldName, match: "(Field field)", note: "PsrNamingStrategy.getFieldName"}
  - {class: com.marcospassos.phpserializer.state.WritingArrayState, method: key, match: "()", note: "WritingArrayState.key"}
  - {class: com.marcospassos.phpserializer.util.ReflectionUtils, method: getValue, match: "(Object object, Field field)", note: "ReflectionUtils.getValue"}
  - {class: com.marcospassos.phpserializer.SerializerBuilder, method: setNamingStrategy, match: "(NamingStrategy strategy)", note: "SerializerBuilder.setNamingStrategy"}
  - {class: com.marcospassos.phpserializer.adapter.ObjectAdapter, method: getFields, match: "(", note: "ObjectAdapter.getFields"}
  - {class: com.marcospassos.phpserializer.state.WritingArrayState, method: arrayEnd, match: "()", note: "WritingArrayState.arrayEnd"}
  - {class: com.marcospassos.phpserializer.SerializerBuilder, method: addExclusionStrategy, match: "(FieldExclusionStrategy strategy)", note: "SerializerBuilder.addExclusionStrategy"}
  - {class: com.marcospassos.phpserializer.state.FinishedState, method: isReferable, match: "()", note: "FinishedState.isReferable"}
