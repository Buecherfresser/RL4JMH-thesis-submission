  - {class: org.apache.commons.csv.CSVFormat, method: setDelimiter, match: "(final char delimiter)", note: "CSVFormat.setDelimiter"}
  - {class: org.apache.commons.csv.CSVFormat, method: setDelimiter, match: "(final String delimiter)", note: "CSVFormat.setDelimiter"}
  - {class: org.apache.commons.csv.CSVFormat, method: setDuplicateHeaderMode, match: "(final DuplicateHeaderMode duplicateHeaderMode)", note: "CSVFormat.setDuplicateHeaderMode"}
  - {class: org.apache.commons.csv.CSVFormat, method: setEscape, match: "(final char escapeCharacter)", note: "CSVFormat.setEscape"}
  - {class: org.apache.commons.csv.CSVFormat, method: setEscape, match: "(final Character escapeCharacter)", note: "CSVFormat.setEscape"}
  - {class: org.apache.commons.csv.CSVFormat, method: setHeader, match: "(final Class<? extends Enum<?>> headerEnum)", note: "CSVFormat.setHeader"}
  - {class: org.apache.commons.csv.CSVFormat, method: setHeader, match: "(final ResultSet resultSet) throws SQLException", note: "CSVFormat.setHeader"}
  - {class: org.apache.commons.csv.CSVFormat, method: setHeader, match: "(final ResultSetMetaData resultSetMetaData) throws SQLException", note: "CSVFormat.setHeader"}
  - {class: org.apache.commons.csv.CSVFormat, method: setHeader, match: "(final String... header)", note: "CSVFormat.setHeader"}
  - {class: org.apache.commons.csv.CSVFormat, method: setHeaderComments, match: "(final Object... headerComments)", note: "CSVFormat.setHeaderComments"}
  - {class: org.apache.commons.csv.CSVFormat, method: setHeaderComments, match: "(final String... headerComments)", note: "CSVFormat.setHeaderComments"}
  - {class: org.apache.commons.csv.CSVFormat, method: setIgnoreEmptyLines, match: "(final boolean ignoreEmptyLines)", note: "CSVFormat.setIgnoreEmptyLines"}
  - {class: org.apache.commons.csv.CSVFormat, method: setIgnoreHeaderCase, match: "(final boolean ignoreHeaderCase)", note: "CSVFormat.setIgnoreHeaderCase"}
