  - {class: org.javastack.kvstore.structures.hash.IntLinkedHashMap, method: clear, match: "()", note: "IntLinkedHashMap.clear"}
  - {class: org.javastack.kvstore.utils.Check64bitsJVM, method: JVMis64bits, match: "()", note: "Check64bitsJVM.JVMis64bits"}
  - {class: org.javastack.kvstore.holders.ByteHolder, method: byteValue, match: "()", note: "ByteHolder.byteValue"}
  - {class: org.javastack.kvstore.io.FileLongStore, method: open, match: "(final boolean readOnly)", note: "FileLongStore.open"}
  - {class: org.javastack.kvstore.structures.hash.IntLinkedHashMap, method: clear, match: "(final boolean shrink)", note: "IntLinkedHashMap.clear"}
  - {class: org.javastack.kvstore.utils.Check64bitsJVM, method: main, match: "(final String[] args) throws Throwable", note: "Check64bitsJVM.main"}
  - {class: org.javastack.kvstore.holders.IntHolder, method: valueOf, match: "(final long value)", note: "IntHolder.valueOf"}
  - {class: org.javastack.kvstore.structures.hash.WeakSet, method: clear, match: "()", note: "WeakSet.clear"}
  - {class: org.javastack.kvstore.utils.GenericFactory, method: newArray, match: "(final int size)", note: "GenericFactory.newArray"}
  - {class: org.javastack.kvstore.holders.IntHolder, method: valueOf, match: "(final int value)", note: "IntHolder.valueOf"}
  - {class: org.javastack.kvstore.structures.hash.WeakSet, method: clear, match: "(final boolean shrink)", note: "WeakSet.clear"}
