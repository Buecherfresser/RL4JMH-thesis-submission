  - {class: com.twitter.nodes.OrNode, method: evaluate, match: "(final List<Node<Boolean>> operands)", note: "OrNode.evaluate"}
  - {class: com.twitter.nodes.utils.Pair, method: getFirst, match: "()", note: "Pair.getFirst"}
