# Curated performance-mutation sites for jinjava (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jinjava --source data/external-src/<checkout> \
#       --sites data/projects/jinjava/mutation_sites.yaml

package_root: com.hubspot.jinjava

sites:
  - {class: com.hubspot.jinjava.Jinjava, method: setResourceLocator, match: "(ResourceLocator resourceLocator)", note: "Jinjava.setResourceLocator"}
  - {class: com.hubspot.jinjava.doc.JinjavaDoc, method: getExpTests, match: "()", note: "JinjavaDoc.getExpTests"}
  - {class: com.hubspot.jinjava.el.ExtendedSyntaxBuilder, method: createParser, match: "(String expression)", note: "ExtendedSyntaxBuilder.createParser"}
  - {class: com.hubspot.jinjava.features.DateTimeFeatureActivationStrategy, method: of, match: "(ZonedDateTime activateAt)", note: "DateTimeFeatureActivationStrategy.of"}
  - {class: com.hubspot.jinjava.interpret.AutoCloseableSupplier, method: of, match: "(T tSupplier)", note: "AutoCloseableSupplier.of"}
  - {class: com.hubspot.jinjava.lib.exptest.IsMappingExpTest, method: getName, match: "()", note: "IsMappingExpTest.getName"}
  - {class: com.hubspot.jinjava.loader.CascadingResourceLocator, method: getString, match: "(", note: "CascadingResourceLocator.getString"}
  - {class: com.hubspot.jinjava.mode.DefaultExecutionMode, method: instance, match: "()", note: "DefaultExecutionMode.instance"}
  - {class: com.hubspot.jinjava.objects.SafeString, method: getValue, match: "()", note: "SafeString.getValue"}
  - {class: com.hubspot.jinjava.random.ConstantZeroRandomNumberGenerator, method: nextInt, match: "()", note: "ConstantZeroRandomNumberGenerator.nextInt"}
  - {class: com.hubspot.jinjava.tree.TreeParser, method: buildTree, match: "()", note: "TreeParser.buildTree"}
  - {class: com.hubspot.jinjava.util.CharArrayUtils, method: charArrayRegionMatches, match: "(", note: "CharArrayUtils.charArrayRegionMatches"}
  - {class: com.hubspot.jinjava.Jinjava, method: getExpressionFactory, match: "()", note: "Jinjava.getExpressionFactory"}
  - {class: com.hubspot.jinjava.doc.JinjavaDoc, method: addExpTest, match: "(JinjavaDocExpTest expTest)", note: "JinjavaDoc.addExpTest"}
  - {class: com.hubspot.jinjava.el.MacroFunctionMapper, method: resolveFunction, match: "(String prefix, String localName)", note: "MacroFunctionMapper.resolveFunction"}
  - {class: com.hubspot.jinjava.features.DateTimeFeatureActivationStrategy, method: isActive, match: "(Context context)", note: "DateTimeFeatureActivationStrategy.isActive"}
  - {class: com.hubspot.jinjava.interpret.AutoCloseableSupplier, method: of, match: "(", note: "AutoCloseableSupplier.of"}
  - {class: com.hubspot.jinjava.lib.exptest.IsMappingExpTest, method: evaluate, match: "(Object var, JinjavaInterpreter interpreter, Object... args)", note: "IsMappingExpTest.evaluate"}
  - {class: com.hubspot.jinjava.loader.ClasspathResourceLocator, method: getString, match: "(", note: "ClasspathResourceLocator.getString"}
  - {class: com.hubspot.jinjava.mode.EagerExecutionMode, method: instance, match: "()", note: "EagerExecutionMode.instance"}
  - {class: com.hubspot.jinjava.objects.collections.PyList, method: delegate, match: "()", note: "PyList.delegate"}
  - {class: com.hubspot.jinjava.random.ConstantZeroRandomNumberGenerator, method: nextInt, match: "(int bound)", note: "ConstantZeroRandomNumberGenerator.nextInt"}
  - {class: com.hubspot.jinjava.tree.output.OutputList, method: addNode, match: "(OutputNode node)", note: "OutputList.addNode"}
  - {class: com.hubspot.jinjava.util.DeferredValueUtils, method: isFullyDeferred, match: "(Object obj)", note: "DeferredValueUtils.isFullyDeferred"}
  - {class: com.hubspot.jinjava.JinjavaConfig, method: getCharset, match: "()", note: "JinjavaConfig.getCharset"}
  - {class: com.hubspot.jinjava.doc.JinjavaDocFactory, method: getCodeEditorTagSnippets, match: "()", note: "JinjavaDocFactory.getCodeEditorTagSnippets"}
  - {class: com.hubspot.jinjava.el.MacroFunctionMapper, method: setFunction, match: "(String prefix, String localName, Method method)", note: "MacroFunctionMapper.setFunction"}
  - {class: com.hubspot.jinjava.features.FeatureConfig, method: getFeature, match: "(String name)", note: "FeatureConfig.getFeature"}
  - {class: com.hubspot.jinjava.interpret.CallStack, method: pushWithoutCycleCheck, match: "(String path, int lineNumber, int startPosition)", note: "CallStack.pushWithoutCycleCheck"}
  - {class: com.hubspot.jinjava.lib.exptest.IsNumberExpTest, method: getName, match: "()", note: "IsNumberExpTest.getName"}
  - {class: com.hubspot.jinjava.loader.FileLocator, method: getString, match: "(String name, Charset encoding, JinjavaInterpreter interpreter)", note: "FileLocator.getString"}
  - {class: com.hubspot.jinjava.mode.EagerExecutionMode, method: isPreserveRawTags, match: "()", note: "EagerExecutionMode.isPreserveRawTags"}
  - {class: com.hubspot.jinjava.objects.collections.PyList, method: toList, match: "()", note: "PyList.toList"}
  - {class: com.hubspot.jinjava.random.DeferredRandomNumberGenerator, method: nextInt, match: "()", note: "DeferredRandomNumberGenerator.nextInt"}
