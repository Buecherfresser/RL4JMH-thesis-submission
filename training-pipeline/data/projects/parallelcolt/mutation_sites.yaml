  - {class: cern.colt.buffer.tbyte.ByteBuffer2D, method: addAllOf, match: "(ByteArrayList x, ByteArrayList y)", note: "ByteBuffer2D.addAllOf"}
  - {class: cern.colt.list.tdouble.DoubleListAdapter, method: object, match: "(double element)", note: "DoubleListAdapter.object"}
  - {class: cern.colt.map.tdouble.OpenLongDoubleHashMap, method: assign, match: "(cern.colt.function.tdouble.DoubleFunction function)", note: "OpenLongDoubleHashMap.assign"}
  - {class: cern.colt.matrix.io.MatrixVectorReader, method: readVectorInfo, match: "() throws IOException", note: "MatrixVectorReader.readVectorInfo"}
  - {class: cern.colt.Partitioning, method: dualPartition, match: "(int[] list, int[] secondary, int from, int to, int splitter)", note: "Partitioning.dualPartition"}
  - {class: cern.colt.buffer.tbyte.ByteBuffer2D, method: clear, match: "()", note: "ByteBuffer2D.clear"}
  - {class: cern.colt.list.tdouble.DoubleListAdapter, method: size, match: "()", note: "DoubleListAdapter.size"}
  - {class: cern.colt.map.tdouble.OpenLongDoubleHashMap, method: assign, match: "(AbstractLongDoubleMap other)", note: "OpenLongDoubleHashMap.assign"}
  - {class: cern.colt.matrix.io.MatrixVectorWriter, method: printMatrixInfo, match: "(MatrixInfo info)", note: "MatrixVectorWriter.printMatrixInfo"}
