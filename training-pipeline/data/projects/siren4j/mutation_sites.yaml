# Curated performance-mutation sites for siren4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants siren4j --source data/external-src/<checkout> \
#       --sites data/projects/siren4j/mutation_sites.yaml

package_root: com.google.code

sites:
  - {class: com.google.code.siren4j.component.builder.ActionBuilder, method: newInstance, match: "()", note: "ActionBuilder.newInstance"}
  - {class: com.google.code.siren4j.component.builder.ActionBuilder, method: createActionBuilder, match: "()", note: "ActionBuilder.createActionBuilder"}
  - {class: com.google.code.siren4j.component.builder.ActionBuilder, method: setComponentClass, match: "(String... componentClass)", note: "ActionBuilder.setComponentClass"}
  - {class: com.google.code.siren4j.component.builder.EntityBuilder, method: newInstance, match: "()", note: "EntityBuilder.newInstance"}
  - {class: com.google.code.siren4j.component.builder.EntityBuilder, method: createEntityBuilder, match: "()", note: "EntityBuilder.createEntityBuilder"}
  - {class: com.google.code.siren4j.component.builder.EntityBuilder, method: setComponentClass, match: "(String... componentClass)", note: "EntityBuilder.setComponentClass"}
  - {class: com.google.code.siren4j.component.builder.FieldBuilder, method: newInstance, match: "()", note: "FieldBuilder.newInstance"}
  - {class: com.google.code.siren4j.component.builder.FieldBuilder, method: createFieldBuilder, match: "()", note: "FieldBuilder.createFieldBuilder"}
  - {class: com.google.code.siren4j.component.builder.FieldBuilder, method: setComponentClass, match: "(String... componentClass)", note: "FieldBuilder.setComponentClass"}
  - {class: com.google.code.siren4j.component.builder.LinkBuilder, method: newInstance, match: "()", note: "LinkBuilder.newInstance"}
  - {class: com.google.code.siren4j.component.builder.LinkBuilder, method: createLinkBuilder, match: "()", note: "LinkBuilder.createLinkBuilder"}
  - {class: com.google.code.siren4j.component.builder.LinkBuilder, method: setComponentClass, match: "(String... componentClass)", note: "LinkBuilder.setComponentClass"}
  - {class: com.google.code.siren4j.converter.ReflectedInfoBuilder, method: aReflectedInfo, match: "()", note: "ReflectedInfoBuilder.aReflectedInfo"}
  - {class: com.google.code.siren4j.converter.ReflectedInfoBuilder, method: withField, match: "(Field field)", note: "ReflectedInfoBuilder.withField"}
  - {class: com.google.code.siren4j.converter.ReflectedInfoBuilder, method: withGetter, match: "(Method getter)", note: "ReflectedInfoBuilder.withGetter"}
  - {class: com.google.code.siren4j.error.Siren4JBuilderValidationException, method: getPropertyName, match: "()", note: "Siren4JBuilderValidationException.getPropertyName"}
  - {class: com.google.code.siren4j.error.Siren4JBuilderValidationException, method: getClazz, match: "()", note: "Siren4JBuilderValidationException.getClazz"}
  - {class: com.google.code.siren4j.error.Siren4JBuilderValidationException, method: getMessage, match: "()", note: "Siren4JBuilderValidationException.getMessage"}
  - {class: com.google.code.siren4j.util.ComponentUtils, method: getSubEntityByRel, match: "(Entity entity, String... rel)", note: "ComponentUtils.getSubEntityByRel"}
  - {class: com.google.code.siren4j.util.ComponentUtils, method: getLinkByRel, match: "(Entity entity, String... rel)", note: "ComponentUtils.getLinkByRel"}
  - {class: com.google.code.siren4j.util.ComponentUtils, method: getActionByName, match: "(Entity entity, String name)", note: "ComponentUtils.getActionByName"}
  - {class: com.google.code.siren4j.util.ReflectionUtils, method: stripGetterPrefix, match: "(String name)", note: "ReflectionUtils.stripGetterPrefix"}
  - {class: com.google.code.siren4j.util.ReflectionUtils, method: getGetterField, match: "(Method method)", note: "ReflectionUtils.getGetterField"}
  - {class: com.google.code.siren4j.util.ReflectionUtils, method: getExposedFieldInfo, match: "(final Class<?> clazz)", note: "ReflectionUtils.getExposedFieldInfo"}
  - {class: com.google.code.siren4j.component.impl.ActionImpl, method: getName, match: "()", note: "ActionImpl.getName"}
  - {class: com.google.code.siren4j.component.impl.ActionImpl, method: setName, match: "(String name)", note: "ActionImpl.setName"}
  - {class: com.google.code.siren4j.component.impl.ActionImpl, method: getMethod, match: "()", note: "ActionImpl.getMethod"}
  - {class: com.google.code.siren4j.component.impl.EmbeddedEntityImpl, method: getProperties, match: "()", note: "EmbeddedEntityImpl.getProperties"}
  - {class: com.google.code.siren4j.component.impl.EmbeddedEntityImpl, method: getEntities, match: "()", note: "EmbeddedEntityImpl.getEntities"}
  - {class: com.google.code.siren4j.component.impl.EmbeddedEntityImpl, method: getLinks, match: "()", note: "EmbeddedEntityImpl.getLinks"}
  - {class: com.google.code.siren4j.component.impl.EntityImpl, method: getProperties, match: "()", note: "EntityImpl.getProperties"}
  - {class: com.google.code.siren4j.component.impl.EntityImpl, method: setProperties, match: "(Map<String, Object> properties)", note: "EntityImpl.setProperties"}
