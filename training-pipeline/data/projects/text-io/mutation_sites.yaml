  - {class: org.beryx.textio.swing.SwingTextTerminal, method: actionPerformed, match: "(ActionEvent e)", note: "SwingTextTerminal.actionPerformed"}
  - {class: org.beryx.textio.system.SystemTextTerminal, method: rawPrint, match: "(String message)", note: "SystemTextTerminal.rawPrint"}
  - {class: org.beryx.textio.web.RatpackDataServer, method: create, match: "(Context context, String initData)", note: "RatpackDataServer.create"}
  - {class: org.beryx.textio.StringInputReader, method: withPattern, match: "(String regex, int flags)", note: "StringInputReader.withPattern"}
