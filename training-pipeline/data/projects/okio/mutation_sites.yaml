# Curated performance-mutation sites for okio (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants okio --source data/external-src/<checkout> \
#       --sites data/projects/okio/mutation_sites.yaml

package_root: okio

sites:
  - {class: okio.jvm.jmh.src.jmh.java.com.squareup.okio.benchmarks.BufferCursorSeekBenchmark, method: setup, match: "() throws IOException", note: "BufferCursorSeekBenchmark.setup"}
  - {class: samples.src.jvmMain.java.okio.samples.BitmapEncoder, method: main, match: "(String[] args) throws Exception", note: "BitmapEncoder.main"}
  - {class: okio.src.jvmTest.java.okio.BufferCursorTest, method: parameters, match: "() throws Exception", note: "BufferCursorTest.parameters"}
