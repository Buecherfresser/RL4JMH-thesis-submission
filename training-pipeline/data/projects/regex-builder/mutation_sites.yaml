  - {class: com.github.sgreben.regex_builder.charclass.EndInputBeforeFinalTerminator, method: complement, match: "()", note: "EndInputBeforeFinalTerminator.complement"}
  - {class: com.github.sgreben.regex_builder.charclass.EndInputBeforeFinalTerminator, method: compile, match: "(java.util.List<TOKEN> output)", note: "EndInputBeforeFinalTerminator.compile"}
  - {class: com.github.sgreben.regex_builder.charclass.HorizontalWhitespace, method: complement, match: "()", note: "HorizontalWhitespace.complement"}
  - {class: com.github.sgreben.regex_builder.charclass.HorizontalWhitespace, method: compile, match: "(java.util.List<TOKEN> output)", note: "HorizontalWhitespace.compile"}
