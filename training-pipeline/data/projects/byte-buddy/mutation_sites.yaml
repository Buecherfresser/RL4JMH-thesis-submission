# Curated performance-mutation sites for byte-buddy (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants byte-buddy --source data/external-src/<checkout> \
#       --sites data/projects/byte-buddy/mutation_sites.yaml

package_root: net.bytebuddy

sites:
  - {class: net.bytebuddy.ByteBuddy, method: subclass, match: "(Class<T> superType)", note: "ByteBuddy.subclass"}
  - {class: net.bytebuddy.agent.Attacher, method: main, match: "(String[] args)", note: "Attacher.main"}
  - {class: net.bytebuddy.asm.Advice, method: to, match: "(Class<?> advice)", note: "Advice.to"}
  - {class: net.bytebuddy.build.ToStringPlugin, method: make, match: "()", note: "ToStringPlugin.make"}
  - {class: net.bytebuddy.description.modifier.EnumerationState, method: getMask, match: "()", note: "EnumerationState.getMask"}
  - {class: net.bytebuddy.dynamic.loading.ByteArrayClassLoader, method: doDefineClasses, match: "(Map<String, byte[]> typeDefinitions) throws ClassNotFoundException", note: "ByteArrayClassLoader.doDefineClasses"}
  - {class: net.bytebuddy.fuzz.ClassFileParsingFuzzer, method: fuzzerTestOneInput, match: "(FuzzedDataProvider data)", note: "ClassFileParsingFuzzer.fuzzerTestOneInput"}
  - {class: net.bytebuddy.implementation.ToStringMethod, method: prefixedByFullyQualifiedClassName, match: "()", note: "ToStringMethod.prefixedByFullyQualifiedClassName"}
  - {class: net.bytebuddy.matcher.ArrayTypeMatcher, method: doMatch, match: "(T target)", note: "ArrayTypeMatcher.doMatch"}
  - {class: net.bytebuddy.utility.CompoundList, method: of, match: "(S left, List<? extends S> right)", note: "CompoundList.of"}
  - {class: net.bytebuddy.ByteBuddy, method: subclass, match: "(Class<T> superType, ConstructorStrategy constructorStrategy)", note: "ByteBuddy.subclass"}
  - {class: net.bytebuddy.agent.ByteBuddyAgent, method: getInstrumentation, match: "()", note: "ByteBuddyAgent.getInstrumentation"}
  - {class: net.bytebuddy.asm.Advice, method: to, match: "(Class<?> advice, ClassFileLocator classFileLocator)", note: "Advice.to"}
  - {class: net.bytebuddy.build.ToStringPlugin, method: apply, match: "(DynamicType.Builder<?> builder, TypeDescription typeDescription, ClassFileLocator classFileLocator)", note: "ToStringPlugin.apply"}
  - {class: net.bytebuddy.description.modifier.EnumerationState, method: getRange, match: "()", note: "EnumerationState.getRange"}
  - {class: net.bytebuddy.dynamic.loading.ByteArrayClassLoader, method: findClass, match: "(String name) throws ClassNotFoundException", note: "ByteArrayClassLoader.findClass"}
  - {class: net.bytebuddy.fuzz.ClassFileParsingFuzzer, method: process, match: "(byte[] classFile)", note: "ClassFileParsingFuzzer.process"}
  - {class: net.bytebuddy.implementation.ToStringMethod, method: prefixedByCanonicalClassName, match: "()", note: "ToStringMethod.prefixedByCanonicalClassName"}
  - {class: net.bytebuddy.matcher.StringMatcher, method: doMatch, match: "(String target)", note: "StringMatcher.doMatch"}
  - {class: net.bytebuddy.utility.CompoundList, method: of, match: "(List<? extends S> left, S right)", note: "CompoundList.of"}
  - {class: net.bytebuddy.ClassFileVersion, method: ofMinorMajor, match: "(int versionNumber)", note: "ClassFileVersion.ofMinorMajor"}
  - {class: net.bytebuddy.agent.ByteBuddyAgent, method: attach, match: "(File agentJar, String processId)", note: "ByteBuddyAgent.attach"}
  - {class: net.bytebuddy.asm.AnnotationRemoval, method: strip, match: "(ElementMatcher<? super AnnotationDescription> matcher)", note: "AnnotationRemoval.strip"}
  - {class: net.bytebuddy.build.AccessControllerPlugin, method: make, match: "()", note: "AccessControllerPlugin.make"}
  - {class: net.bytebuddy.description.modifier.FieldManifestation, method: getMask, match: "()", note: "FieldManifestation.getMask"}
  - {class: net.bytebuddy.dynamic.scaffold.inline.DecoratingDynamicTypeBuilder, method: visit, match: "(AsmVisitorWrapper asmVisitorWrapper)", note: "DecoratingDynamicTypeBuilder.visit"}
  - {class: net.bytebuddy.fuzz.ClassGenerationFuzzer, method: fuzzerTestOneInput, match: "(FuzzedDataProvider data)", note: "ClassGenerationFuzzer.fuzzerTestOneInput"}
  - {class: net.bytebuddy.implementation.bytecode.collection.ArrayAccess, method: of, match: "(TypeDefinition componentType)", note: "ArrayAccess.of"}
  - {class: net.bytebuddy.matcher.StringMatcher, method: getDescription, match: "()", note: "StringMatcher.getDescription"}
  - {class: net.bytebuddy.utility.RandomString, method: make, match: "()", note: "RandomString.make"}
  - {class: net.bytebuddy.ClassFileVersion, method: ofJavaVersionString, match: "(String javaVersionString)", note: "ClassFileVersion.ofJavaVersionString"}
  - {class: net.bytebuddy.agent.Installer, method: getInstrumentation, match: "()", note: "Installer.getInstrumentation"}
  - {class: net.bytebuddy.asm.AnnotationRemoval, method: onType, match: "()", note: "AnnotationRemoval.onType"}
  - {class: net.bytebuddy.build.AccessControllerPlugin, method: apply, match: "(DynamicType.Builder<?> builder, TypeDescription typeDescription, ClassFileLocator classFileLocator)", note: "AccessControllerPlugin.apply"}
  - {class: net.bytebuddy.description.modifier.FieldManifestation, method: getRange, match: "()", note: "FieldManifestation.getRange"}
  - {class: net.bytebuddy.dynamic.scaffold.inline.DecoratingDynamicTypeBuilder, method: suffix, match: "(String suffix)", note: "DecoratingDynamicTypeBuilder.suffix"}
  - {class: net.bytebuddy.fuzz.SeedCorpusGenerator, method: main, match: "(String[] arguments) throws IOException", note: "SeedCorpusGenerator.main"}
  - {class: net.bytebuddy.implementation.bytecode.collection.ArrayAccess, method: load, match: "()", note: "ArrayAccess.load"}
  - {class: net.bytebuddy.matcher.StringSetMatcher, method: doMatch, match: "(String target)", note: "StringSetMatcher.doMatch"}
  - {class: net.bytebuddy.utility.RandomString, method: make, match: "(int length)", note: "RandomString.make"}
  - {class: net.bytebuddy.TypeCache, method: expungeStaleEntries, match: "()", note: "TypeCache.expungeStaleEntries"}
  - {class: net.bytebuddy.agent.Installer, method: premain, match: "(String arguments, Instrumentation instrumentation)", note: "Installer.premain"}
  - {class: net.bytebuddy.asm.MemberRemoval, method: stripFields, match: "(ElementMatcher<? super FieldDescription.InDefinedShape> matcher)", note: "MemberRemoval.stripFields"}
  - {class: net.bytebuddy.build.CachedReturnPlugin, method: make, match: "()", note: "CachedReturnPlugin.make"}
  - {class: net.bytebuddy.description.modifier.FieldPersistence, method: getMask, match: "()", note: "FieldPersistence.getMask"}
  - {class: net.bytebuddy.dynamic.scaffold.inline.RebaseDynamicTypeBuilder, method: toTypeWriter, match: "(TypePool typePool)", note: "RebaseDynamicTypeBuilder.toTypeWriter"}
  - {class: net.bytebuddy.implementation.bytecode.collection.ArrayFactory, method: forType, match: "(TypeDescription.Generic componentType)", note: "ArrayFactory.forType"}
  - {class: net.bytebuddy.matcher.AccessibilityMatcher, method: doMatch, match: "(T target)", note: "AccessibilityMatcher.doMatch"}
  - {class: net.bytebuddy.utility.StreamDrainer, method: drain, match: "(InputStream inputStream) throws IOException", note: "StreamDrainer.drain"}
  - {class: net.bytebuddy.TypeCache, method: clear, match: "()", note: "TypeCache.clear"}
