# Curated performance-mutation sites for simple-binary-encoding (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants simple-binary-encoding --source data/external-src/<checkout> \
#       --sites data/projects/simple-binary-encoding/mutation_sites.yaml

