# Curated performance-mutation sites for securitybuilder (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants securitybuilder --source data/external-src/<checkout> \
#       --sites data/projects/securitybuilder/mutation_sites.yaml

package_root: com.tersesystems.securitybuilder

sites:
