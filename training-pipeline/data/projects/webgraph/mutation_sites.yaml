# Curated performance-mutation sites for webgraph (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants webgraph --source data/external-src/<checkout> \
#       --sites data/projects/webgraph/mutation_sites.yaml

package_root: it.unimi.dsi.webgraph

sites:
