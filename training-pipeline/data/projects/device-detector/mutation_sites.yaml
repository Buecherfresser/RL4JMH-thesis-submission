# Curated performance-mutation sites for device-detector (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants device-detector --source data/external-src/<checkout> \
#       --sites data/projects/device-detector/mutation_sites.yaml

package_root: com.deevvi.device

