# Curated performance-mutation sites for java-diff-utils (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants java-diff-utils --source data/external-src/<checkout> \
#       --sites data/projects/java-diff-utils/mutation_sites.yaml

package_root: com.github.difflib

sites:
  - {class: com.github.difflib.DiffUtils, method: withDefaultDiffAlgorithmFactory, match: "(DiffAlgorithmFactory factory)", note: "DiffUtils.withDefaultDiffAlgorithmFactory"}
  - {class: com.github.difflib.algorithm.Change, method: withEndOriginal, match: "(int endOriginal)", note: "Change.withEndOriginal"}
  - {class: com.github.difflib.patch.ChangeDelta, method: applyTo, match: "(List<T> target) throws PatchFailedException", note: "ChangeDelta.applyTo"}
  - {class: com.github.difflib.text.StringUtils, method: htmlEntites, match: "(String str)", note: "StringUtils.htmlEntites"}
  - {class: com.github.difflib.unifieddiff.UnifiedDiff, method: getHeader, match: "()", note: "UnifiedDiff.getHeader"}
  - {class: com.github.difflib.DiffUtils, method: diff, match: "(", note: "DiffUtils.diff"}
  - {class: com.github.difflib.algorithm.Change, method: withEndRevised, match: "(int endRevised)", note: "Change.withEndRevised"}
  - {class: com.github.difflib.patch.ChangeDelta, method: restore, match: "(List<T> target)", note: "ChangeDelta.restore"}
  - {class: com.github.difflib.text.StringUtils, method: normalize, match: "(String str)", note: "StringUtils.normalize"}
  - {class: com.github.difflib.unifieddiff.UnifiedDiff, method: setHeader, match: "(String header)", note: "UnifiedDiff.setHeader"}
  - {class: com.github.difflib.DiffUtils, method: diff, match: "(List<? extends T> original, List<? extends T> revised)", note: "DiffUtils.diff"}
  - {class: com.github.difflib.algorithm.jgit.HistogramDiff, method: computeDiff, match: "(", note: "HistogramDiff.computeDiff"}
  - {class: com.github.difflib.patch.ChangeDelta, method: applyFuzzyToAt, match: "(List<T> target, int fuzz, int position) throws PatchFailedException", note: "ChangeDelta.applyFuzzyToAt"}
  - {class: com.github.difflib.text.StringUtils, method: wrapText, match: "(List<String> list, int columnWidth)", note: "StringUtils.wrapText"}
  - {class: com.github.difflib.unifieddiff.UnifiedDiff, method: getFiles, match: "()", note: "UnifiedDiff.getFiles"}
  - {class: com.github.difflib.UnifiedDiffUtils, method: parseUnifiedDiff, match: "(List<String> diff)", note: "UnifiedDiffUtils.parseUnifiedDiff"}
  - {class: com.github.difflib.algorithm.jgit.HistogramDiff, method: hash, match: "(DataList<T> s, int i)", note: "HistogramDiff.hash"}
  - {class: com.github.difflib.patch.Chunk, method: verifyChunk, match: "(List<T> target) throws PatchFailedException", note: "Chunk.verifyChunk"}
  - {class: com.github.difflib.text.deltamerge.DeltaMergeUtils, method: mergeInlineDeltas, match: "(", note: "DeltaMergeUtils.mergeInlineDeltas"}
  - {class: com.github.difflib.unifieddiff.UnifiedDiffFile, method: getDiffCommand, match: "()", note: "UnifiedDiffFile.getDiffCommand"}
  - {class: com.github.difflib.UnifiedDiffUtils, method: generateUnifiedDiff, match: "(", note: "UnifiedDiffUtils.generateUnifiedDiff"}
  - {class: com.github.difflib.algorithm.jgit.HistogramDiff, method: size, match: "()", note: "HistogramDiff.size"}
  - {class: com.github.difflib.patch.Chunk, method: verifyChunk, match: "(List<T> target, int fuzz, int position) throws PatchFailedException", note: "Chunk.verifyChunk"}
  - {class: com.github.difflib.text.DiffRow, method: getTag, match: "()", note: "DiffRow.getTag"}
  - {class: com.github.difflib.unifieddiff.UnifiedDiffFile, method: setDiffCommand, match: "(String diffCommand)", note: "UnifiedDiffFile.setDiffCommand"}
  - {class: com.github.difflib.UnifiedDiffUtils, method: generateOriginalAndDiff, match: "(List<String> original, List<String> revised)", note: "UnifiedDiffUtils.generateOriginalAndDiff"}
  - {class: com.github.difflib.algorithm.myers.MyersDiff, method: computeDiff, match: "(", note: "MyersDiff.computeDiff"}
  - {class: com.github.difflib.patch.Chunk, method: getPosition, match: "()", note: "Chunk.getPosition"}
  - {class: com.github.difflib.text.DiffRow, method: setTag, match: "(Tag tag)", note: "DiffRow.setTag"}
  - {class: com.github.difflib.unifieddiff.UnifiedDiffFile, method: getFromFile, match: "()", note: "UnifiedDiffFile.getFromFile"}
  - {class: com.github.difflib.algorithm.myers.MyersDiff, method: factory, match: "()", note: "MyersDiff.factory"}
  - {class: com.github.difflib.patch.DeleteDelta, method: applyTo, match: "(List<T> target) throws PatchFailedException", note: "DeleteDelta.applyTo"}
  - {class: com.github.difflib.text.DiffRow, method: getOldLine, match: "()", note: "DiffRow.getOldLine"}
