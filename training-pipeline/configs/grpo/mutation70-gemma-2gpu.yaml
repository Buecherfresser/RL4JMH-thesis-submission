# Gemma 4 E2B - run 2: 2-GPU TRL server mode, thinking enabled, long completions.
#
# Derived from mutation70-gemma.yaml (run 1, LRZ 5723231). Every change below is backed by a
# measurement from run 1 or from the JMH-Bench matrix that evaluated its adapter
# (docs/evaluation-gemma-grpo-run1.md):
#
#   * completions were being truncated -- run 1 logged clipped_ratio mean 0.10, max 0.80
#     against a 4096 cap. A truncated Java class cannot compile, so part of run 1's 77 %
#     compile-failure rate was budget, not skill. -> max_completion_length 4096 -> 16384.
#   * thinking is the single biggest lever measured. On JMH-Bench the same adapter scored
#     18 % vs 10 % mutation and 34 % vs 21 % first-shot compile with thinking on vs off --
#     yet run 1 trained with it off. -> chat_template_kwargs.enable_thinking: true.
#     Gemma 4's chat template exposes only enable_thinking / preserve_thinking; there is no
#     effort or budget knob, so "maximum effort" == a completion budget large enough that the
#     model is never cut off mid-thought.
#   * run 1 was under-trained: 744 updates at LR 1e-6 with 44 % of steps yielding no gradient.
#     -> LR 3e-6. Watch entropy and completions/clipped_ratio; fall back to 2e-6 on collapse.
#
# Colocate cannot pay for this: vLLM took ~30 % of the single card and still OOM'd in backward
# at step 108 of job 5721357. Server mode puts vLLM on GPU 0 and leaves GPU 1 entirely to the
# trainer, which is what buys the 40960-token window.
#
# Stage 1 is one epoch. If reward trends up, extend with resume_from_checkpoint: auto rather
# than restarting -- 2 epochs at this token count is ~90-120 h, well past the 2-day QOS wall.
#
#   sbatch scripts/cluster/run-grpo-gemma-2gpu-lrz.sbatch

base_model: google/gemma-4-E2B-it
output_dir: outputs/grpo-mutation70-gemma-2gpu
dataset_path: data/snippets/rl-mutation.good.jsonl
corpus: full
seed: 42

finetune_mode: lora
precision: bf16
gradient_checkpointing: true
attn_implementation: sdpa
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  exclude_modules: [vision_tower, audio_tower, multi_modal_projector]
  bias: none

learning_rate: 3.0e-6
# 1x8 keeps the same global batch of 8 (= group_size, so the gradient stays numerically
# identical to run 1) while holding only one 36k-token sequence in activations at a time.
# At 20480+16384 tokens a per-device batch of 2 would not fit even on a dedicated card.
per_device_batch_size: 1
gradient_accumulation_steps: 8
group_size: 8
rollout_temperature: 1.0
top_p: 0.95
top_k: 64
max_prompt_length: 20480
max_completion_length: 16384
completion_eos_token_id: 106
# Render rollout prompts with Gemma 4's thinking channel open. parse_completion() already
# calls strip_thinking(), so the reward path is unaffected -- it still sees only the Java.
chat_template_kwargs:
  enable_thinking: true
# 48000 chars ~ 13.7k tokens, still inside max_prompt_length (20480) with room for the
# instruction template. Admits 1040 of the 1097 subjects against run 1's 744 (+40 %), and the
# ones it adds are the large complex-API classes that run 1 never got to attempt.
max_source_chars: 48000
limit_prompts: 0

kl_coeff: 0.0
epsilon: 0.2
epsilon_high: 0.28
grpo_loss_type: dr_grpo
scale_rewards: false
mask_truncated_completions: true
mu: 1

num_epochs: 1.0
num_iterations: 0
warmup_ratio: 0.03
logging_steps: 1
# Slurm caps this QOS at 2 days, which is shorter than one epoch over 1040 prompts.
# Checkpoint often so a follow-up job can resume instead of restarting.
save_steps: 25
# 'auto' = continue from the newest checkpoint-* in output_dir, or start fresh if none.
# Guards against losing hours to a crash or the 2-day wall; see training-run-failures.md.
resume_from_checkpoint: auto
report_to: none

use_vllm: true
# Server mode: `trl vllm-serve` owns GPU 0, the trainer owns GPU 1. gpu_memory_utilization and
# sleep mode are colocate-only concepts and do not apply.
vllm_mode: server
vllm_server_base_url: http://localhost:8000
vllm_server_timeout: 1800.0
vllm_tensor_parallel_size: 1
# 20480 prompt + 16384 completion = 36864; round up for template overhead.
vllm_max_model_length: 40960

reward_weights:
  compile: 0.10
  runtime: 0.10
  anti_pattern: 0.05
  rsd: 0.05
  mutation: 0.70
# SpotJMHBugs (Costa et al., TSE 2019) bytecode analysis, not the regex pre-screen.
# regex is only a static approximation; spotjmh is the actual detector. Requires
# vendor/spotbugs (tools/install_spotjmhbugs.sh) -- preflight_grpo.py --reward-smoke
# fails the run if the backend is missing, since r_anti would otherwise be dead weight.
anti_pattern_backend: spotjmh
need_run: true
rsd_good: 0.05
rsd_bad: 0.25

mutation:
  alpha: 0.05
  min_slowdown: 1.10
  arm_property: jmhbench.mutant
  coverage_guidance: true
  max_mutants_per_candidate: 0
  max_benchmarks_per_mutant: 6
  mode: coverage_aware
  coverage_weight: 0.30
  coverage_jmh:
    warmup_iterations: 0
    measurement_iterations: 1
    forks: 1
    warmup_time: "100ms"
    measurement_time: "100ms"
    timeout_s: 120.0
    per_iteration_timeout_s: 60.0
    fail_on_error: false

runner:
  jmh_version: "1.37"
  java_release: 17
  jmh:
    warmup_iterations: 3
    measurement_iterations: 5
    forks: 1
    warmup_time: "200ms"
    measurement_time: "200ms"
    timeout_s: 120.0
    per_iteration_timeout_s: 60.0
    fail_on_error: false

