  - {class: org.nlpcn.commons.lang.finger.SimHashService, method: hmDistance, match: "(String c1, String c2)", note: "SimHashService.hmDistance"}
  - {class: org.nlpcn.commons.lang.finger.pojo.MyFingerprint, method: updateScore, match: "(double factor)", note: "MyFingerprint.updateScore"}
  - {class: org.nlpcn.commons.lang.finger.pojo.MyFingerprint, method: getName, match: "()", note: "MyFingerprint.getName"}
  - {class: org.nlpcn.commons.lang.index.MemoryIndex, method: addItem, match: "(T value, Double score, String... fields)", note: "MemoryIndex.addItem"}
  - {class: org.nlpcn.commons.lang.index.MemoryIndex, method: addItem, match: "(T value, String... fields)", note: "MemoryIndex.addItem"}
  - {class: org.nlpcn.commons.lang.jianfan.Converter, method: loadCharMapping, match: "(boolean s2t)", note: "Converter.loadCharMapping"}
