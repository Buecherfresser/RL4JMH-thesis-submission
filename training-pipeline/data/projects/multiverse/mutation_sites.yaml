# Curated performance-mutation sites for multiverse (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants multiverse --source data/external-src/<checkout> \
#       --sites data/projects/multiverse/mutation_sites.yaml

package_root: org.multiverse.api

sites:
  - {class: org.multiverse.api.StmUtils, method: newTxnLinkedList, match: "()", note: "StmUtils.newTxnLinkedList"}
  - {class: org.multiverse.api.blocking.DefaultRetryLatch, method: open, match: "(final long expectedEra)", note: "DefaultRetryLatch.open"}
  - {class: org.multiverse.api.exceptions.InvisibleCheckedException, method: getCause, match: "()", note: "InvisibleCheckedException.getCause"}
  - {class: org.multiverse.api.functions.Functions, method: identityFunction, match: "()", note: "Functions.identityFunction"}
  - {class: org.multiverse.api.predicates.Predicates, method: evaluate, match: "(Object value)", note: "Predicates.evaluate"}
  - {class: org.multiverse.api.StmUtils, method: newTxnStack, match: "()", note: "StmUtils.newTxnStack"}
  - {class: org.multiverse.api.blocking.DefaultRetryLatch, method: await, match: "(long expectedEra, String transactionFamilyName)", note: "DefaultRetryLatch.await"}
  - {class: org.multiverse.api.functions.Functions, method: identityDoubleFunction, match: "()", note: "Functions.identityDoubleFunction"}
  - {class: org.multiverse.api.predicates.Predicates, method: evaluate, match: "(Object value)", note: "Predicates.evaluate"}
  - {class: org.multiverse.api.StmUtils, method: newTxnStack, match: "(int capacity)", note: "StmUtils.newTxnStack"}
  - {class: org.multiverse.api.blocking.DefaultRetryLatch, method: awaitUninterruptible, match: "(final long expectedEra)", note: "DefaultRetryLatch.awaitUninterruptible"}
  - {class: org.multiverse.api.functions.Functions, method: incDoubleFunction, match: "()", note: "Functions.incDoubleFunction"}
  - {class: org.multiverse.api.predicates.Predicates, method: newIsNullPredicate, match: "()", note: "Predicates.newIsNullPredicate"}
  - {class: org.multiverse.api.StmUtils, method: newTxnQueue, match: "()", note: "StmUtils.newTxnQueue"}
  - {class: org.multiverse.api.blocking.DefaultRetryLatch, method: awaitNanosUninterruptible, match: "(final long expectedEra, long nanosTimeout)", note: "DefaultRetryLatch.awaitNanosUninterruptible"}
  - {class: org.multiverse.api.functions.Functions, method: identityIntFunction, match: "()", note: "Functions.identityIntFunction"}
  - {class: org.multiverse.api.predicates.Predicates, method: newIsNotNullPredicate, match: "()", note: "Predicates.newIsNotNullPredicate"}
  - {class: org.multiverse.api.StmUtils, method: newTxnQueue, match: "(int capacity)", note: "StmUtils.newTxnQueue"}
  - {class: org.multiverse.api.blocking.DefaultRetryLatch, method: awaitNanos, match: "(final long expectedEra, long nanosTimeout, String transactionFamilyName)", note: "DefaultRetryLatch.awaitNanos"}
  - {class: org.multiverse.api.functions.Functions, method: identityLongFunction, match: "()", note: "Functions.identityLongFunction"}
  - {class: org.multiverse.api.StmUtils, method: newTxnDeque, match: "()", note: "StmUtils.newTxnDeque"}
  - {class: org.multiverse.api.blocking.DefaultRetryLatch, method: getEra, match: "()", note: "DefaultRetryLatch.getEra"}
  - {class: org.multiverse.api.functions.Functions, method: incIntFunction, match: "()", note: "Functions.incIntFunction"}
  - {class: org.multiverse.api.StmUtils, method: newTxnDeque, match: "(int capacity)", note: "StmUtils.newTxnDeque"}
  - {class: org.multiverse.api.blocking.DefaultRetryLatch, method: reset, match: "()", note: "DefaultRetryLatch.reset"}
