# Curated performance-mutation sites for commons-pool (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants commons-pool --source data/external-src/<checkout> \
#       --sites data/projects/commons-pool/mutation_sites.yaml

package_root: org.apache.commons.pool3

sites:
  - {class: org.apache.commons.pool3.PoolUtils, method: getNextShrink, match: "()", note: "PoolUtils.getNextShrink"}
  - {class: org.apache.commons.pool3.impl.CallStackUtils, method: newCallStack, match: "(final String messageFormat,", note: "CallStackUtils.newCallStack"}
  - {class: org.apache.commons.pool3.proxy.CglibProxyHandler, method: intercept, match: "(final Object object, final Method method, final Object[] args, final MethodProxy methodProxy) throws Throwable", note: "CglibProxyHandler.intercept"}
  - {class: org.apache.commons.pool3.PoolUtils, method: addObject, match: "(final K key) throws E, IllegalStateException, UnsupportedOperationException", note: "PoolUtils.addObject"}
  - {class: org.apache.commons.pool3.impl.AbandonedConfig, method: getLogAbandoned, match: "()", note: "AbandonedConfig.getLogAbandoned"}
  - {class: org.apache.commons.pool3.proxy.CglibProxySource, method: setSuperclass, match: "(final Class<? extends T> superclass)", note: "CglibProxySource.setSuperclass"}
  - {class: org.apache.commons.pool3.PoolUtils, method: borrowObject, match: "(final K key) throws E, NoSuchElementException, IllegalStateException", note: "PoolUtils.borrowObject"}
  - {class: org.apache.commons.pool3.impl.AbandonedConfig, method: getLogWriter, match: "()", note: "AbandonedConfig.getLogWriter"}
  - {class: org.apache.commons.pool3.proxy.CglibProxySource, method: builder, match: "()", note: "CglibProxySource.builder"}
  - {class: org.apache.commons.pool3.impl.AbandonedConfig, method: getRemoveAbandonedOnBorrow, match: "()", note: "AbandonedConfig.getRemoveAbandonedOnBorrow"}
  - {class: org.apache.commons.pool3.proxy.CglibProxySource, method: createProxy, match: "(final T pooledObject, final UsageTracking<T> usageTracking)", note: "CglibProxySource.createProxy"}
  - {class: org.apache.commons.pool3.impl.DefaultEvictionPolicy, method: evict, match: "(final EvictionConfig config, final PooledObject<T> underTest, final int idleCount)", note: "DefaultEvictionPolicy.evict"}
  - {class: org.apache.commons.pool3.proxy.JdkProxyHandler, method: invoke, match: "(final Object proxy, final Method method, final Object[] args) throws Throwable", note: "JdkProxyHandler.invoke"}
  - {class: org.apache.commons.pool3.impl.DefaultPooledObject, method: allocate, match: "()", note: "DefaultPooledObject.allocate"}
  - {class: org.apache.commons.pool3.proxy.JdkProxySource, method: setClassLoader, match: "(final ClassLoader classLoader)", note: "JdkProxySource.setClassLoader"}
  - {class: org.apache.commons.pool3.impl.DefaultPooledObject, method: compareTo, match: "(final PooledObject<T> other)", note: "DefaultPooledObject.compareTo"}
  - {class: org.apache.commons.pool3.proxy.JdkProxySource, method: setInterfaces, match: "(final Class<?>... interfaces)", note: "JdkProxySource.setInterfaces"}
  - {class: org.apache.commons.pool3.impl.DefaultPooledObject, method: deallocate, match: "()", note: "DefaultPooledObject.deallocate"}
  - {class: org.apache.commons.pool3.proxy.JdkProxySource, method: builder, match: "()", note: "JdkProxySource.builder"}
  - {class: org.apache.commons.pool3.impl.DefaultPooledObjectInfo, method: getBorrowedCount, match: "()", note: "DefaultPooledObjectInfo.getBorrowedCount"}
  - {class: org.apache.commons.pool3.proxy.ProxiedKeyedObjectPool, method: addObject, match: "(final K key) throws E, IllegalStateException,", note: "ProxiedKeyedObjectPool.addObject"}
  - {class: org.apache.commons.pool3.impl.DefaultPooledObjectInfo, method: getCreateTime, match: "()", note: "DefaultPooledObjectInfo.getCreateTime"}
  - {class: org.apache.commons.pool3.proxy.ProxiedKeyedObjectPool, method: borrowObject, match: "(final K key) throws E, NoSuchElementException,", note: "ProxiedKeyedObjectPool.borrowObject"}
  - {class: org.apache.commons.pool3.impl.DefaultPooledObjectInfo, method: getCreateTimeFormatted, match: "()", note: "DefaultPooledObjectInfo.getCreateTimeFormatted"}
  - {class: org.apache.commons.pool3.proxy.ProxiedKeyedObjectPool, method: clear, match: "() throws E, UnsupportedOperationException", note: "ProxiedKeyedObjectPool.clear"}
  - {class: org.apache.commons.pool3.impl.EvictionConfig, method: isEvictionThread, match: "()", note: "EvictionConfig.isEvictionThread"}
  - {class: org.apache.commons.pool3.proxy.ProxiedObjectPool, method: addObject, match: "() throws E, IllegalStateException, UnsupportedOperationException", note: "ProxiedObjectPool.addObject"}
  - {class: org.apache.commons.pool3.impl.EvictionConfig, method: getIdleEvictDuration, match: "()", note: "EvictionConfig.getIdleEvictDuration"}
  - {class: org.apache.commons.pool3.proxy.ProxiedObjectPool, method: borrowObject, match: "() throws E, NoSuchElementException, IllegalStateException", note: "ProxiedObjectPool.borrowObject"}
