# Rejection fine-tuning on Apache Commons Lang, scored with the performance-mutation reward.
# See jmhgen.config.RFTConfig, the annotated configs/rft/default.yaml, and configs/rft/commons-lang.yaml.
# This variant adds r_mutation: each candidate benchmark is scored by how many of the mutants
# planted in its subject class it detects (JMH-Bench-style; see src/jmhgen/mutation/).
#
# Setup (once):
#   # 1. Plant the curated mutants + emit the mutated-class prompt corpus.
#   jmh-make-mutants commons-lang --source data/external-src/commons-lang \
#       --sites data/projects/commons-lang/mutation_sites.yaml
#   # 2. Build the PATCHED SUT jar (with MutationSwitch baked in) and its classpath.
#   jmh-provision-mutants commons-lang
#   # 3. Train.
#   jmh-train-rft --config configs/rft/commons-lang-mutation.yaml

base_model: google/gemma-4-E2B-it
output_dir: outputs/rft-commons-lang-mutation
# The prompt corpus is exactly the classes that carry a mutant, so every prompt has a signal.
dataset_path: data/projects/commons-lang/snippets.jsonl
seed: 42

# Shared numerical recipe (identical to default.yaml / SFT for a valid per-stage comparison).
finetune_mode: lora
precision: bf16
gradient_checkpointing: true
attn_implementation: sdpa
loss_type: chunked_nll
activation_offloading: false
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  exclude_modules: [vision_tower, audio_tower, multi_modal_projector]
  bias: none

max_seq_len: 16384
learning_rate: 1.0e-5
per_device_batch_size: 1
gradient_accumulation_steps: 8
num_epochs: 1.0
completion_only_loss: true

# --- sampling (E-step) ---
samples_per_prompt: 16
sampling_temperature: 1.0
limit_prompts: 0
max_source_chars: 90000
inference:
  base_url: http://localhost:8000/v1
  model: google/gemma-4-E2B-it
  api_key_env: VLLM_API_KEY
  timeout_s: 600.0
  max_concurrency: 8
  top_p: 0.95
  top_k: 64
  max_tokens: 8192
  enable_thinking: true

# --- verification / acceptance ---
# Mutation needs a successful run (baseline) before it can arm anything.
accept_threshold: 0.6
need_run: true
reward_weights:
  compile: 0.2
  runtime: 0.2
  anti_pattern: 0.2
  rsd: 0.1
  mutation: 0.3
rsd_good: 0.05
rsd_bad: 0.25
# Global detection rule for a killed mutant: >=10% slower and significant at p<0.05.
mutation:
  alpha: 0.05
  min_slowdown: 1.10
  arm_property: jmhbench.mutant
  max_mutants_per_candidate: 8
  # graded = coverage fraction (killed / in-class mutants); gate = binary any-kill. The prompt
  # asks the model to cover the class's important methods, so graded is the aligned default.
  mode: graded
runner:
  jmh_version: "1.37"
  java_release: 17
  jmh:
    warmup_iterations: 3
    measurement_iterations: 5
    forks: 1
    # Bound a stuck/armed iteration so a mutant that explodes runtime is caught (and killed)
    # instead of hanging the verify phase.
    per_iteration_timeout_s: 60
project_classpaths:
  # MUST be the PATCHED jar from jmh-provision-mutants (contains MutationSwitch).
  commons-lang: data/classpaths/commons-lang-mutants.cp
project_mutants:
  commons-lang: data/projects/commons-lang/mutants.yaml

# --- dataset construction ---
work_dir: data/rft-commons-lang-mutation
max_keep_per_prompt: 4
dedup: true
drop_all_pass: false
val_fraction: 0.05
