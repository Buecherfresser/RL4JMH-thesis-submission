# Curated performance-mutation sites for conversant-disruptor (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants conversant-disruptor --source data/external-src/<checkout> \
#       --sites data/projects/conversant-disruptor/mutation_sites.yaml

package_root: com.conversantmedia.util.concurrent

sites:
