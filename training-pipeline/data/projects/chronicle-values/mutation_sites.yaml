  - {class: net.openhft.chronicle.values.CharSequenceFieldModel, method: generateArrayElementGet, match: "(", note: "CharSequenceFieldModel.generateArrayElementGet"}
  - {class: net.openhft.chronicle.values.CodeTemplate, method: addWritePattern, match: "(", note: "CodeTemplate.addWritePattern"}
  - {class: net.openhft.chronicle.values.EnumFieldModel, method: generateFields, match: "(ValueBuilder valueBuilder)", note: "EnumFieldModel.generateFields"}
  - {class: net.openhft.chronicle.values.EnumFieldModel, method: generateFields, match: "(ValueBuilder valueBuilder)", note: "EnumFieldModel.generateFields"}
