# Curated benchmarkable classes for Apache Commons Statistics (GRPO prompt corpus).
#
# Streaming descriptive statistics and continuous/discrete distributions -- each exposes a hot
# public method (accept/add + getAsDouble, or density/cumulativeProbability) over primitive
# inputs, so a JMH benchmark drives it from a @State array/parameter. FQCNs best-effort from the
# pinned API; jmh-curate-snippets reports non-matches. Filter with:
#   jmh-curate-snippets --snippets data/snippets/commons-statistics.jsonl \
#       --good-classes data/projects/commons-statistics/good_classes.yaml

project: commons-statistics

classes:
  # descriptive (streaming reductions over double[])
  - org.apache.commons.statistics.descriptive.Mean
  - org.apache.commons.statistics.descriptive.Variance
  - org.apache.commons.statistics.descriptive.StandardDeviation
  - org.apache.commons.statistics.descriptive.Sum
  - org.apache.commons.statistics.descriptive.SumOfSquares
  - org.apache.commons.statistics.descriptive.SumOfLogs
  - org.apache.commons.statistics.descriptive.GeometricMean
  - org.apache.commons.statistics.descriptive.Min
  - org.apache.commons.statistics.descriptive.Max
  - org.apache.commons.statistics.descriptive.Median
  - org.apache.commons.statistics.descriptive.Skewness
  - org.apache.commons.statistics.descriptive.Kurtosis
  - org.apache.commons.statistics.descriptive.Quantile
  - org.apache.commons.statistics.descriptive.Product
  # distributions (density / cumulativeProbability / sampling)
  - org.apache.commons.statistics.distribution.NormalDistribution
  - org.apache.commons.statistics.distribution.PoissonDistribution
  - org.apache.commons.statistics.distribution.BinomialDistribution
  - org.apache.commons.statistics.distribution.GammaDistribution
  - org.apache.commons.statistics.distribution.BetaDistribution
  - org.apache.commons.statistics.distribution.TriangularDistribution
  - org.apache.commons.statistics.distribution.ChiSquaredDistribution
  - org.apache.commons.statistics.distribution.ExponentialDistribution
