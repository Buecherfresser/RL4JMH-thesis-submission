# Curated performance-mutation sites for indriya (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants indriya --source data/external-src/<checkout> \
#       --sites data/projects/indriya/mutation_sites.yaml

package_root: tech.units.indriya

sites:
  - {class: tech.units.indriya.format.NumberDelimiterQuantityFormat, method: setNumberFormat, match: "(NumberFormat numberFormat)", note: "NumberDelimiterQuantityFormat.setNumberFormat"}
  - {class: tech.units.indriya.function.DefaultNumberSystem, method: isIntegerOnly, match: "()", note: "DefaultNumberSystem.isIntegerOnly"}
  - {class: tech.units.indriya.internal.format.DefaultCharStream, method: setTabSize, match: "(int i)", note: "DefaultCharStream.setTabSize"}
  - {class: tech.units.indriya.quantity.NumberQuantity, method: subtract, match: "(Quantity<Q> that)", note: "NumberQuantity.subtract"}
  - {class: tech.units.indriya.spi.DefaultServiceProvider, method: getPriority, match: "()", note: "DefaultServiceProvider.getPriority"}
  - {class: tech.units.indriya.unit.AlternateUnit, method: getParentUnit, match: "()", note: "AlternateUnit.getParentUnit"}
  - {class: tech.units.indriya.format.NumberDelimiterQuantityFormat, method: setUnitFormat, match: "(UnitFormat unitFormat)", note: "NumberDelimiterQuantityFormat.setUnitFormat"}
  - {class: tech.units.indriya.function.DefaultNumberSystem, method: subtract, match: "(final Number x, final Number y)", note: "DefaultNumberSystem.subtract"}
  - {class: tech.units.indriya.internal.format.DefaultCharStream, method: getTabSize, match: "()", note: "DefaultCharStream.getTabSize"}
  - {class: tech.units.indriya.quantity.NumberQuantity, method: divide, match: "(Quantity<?> that)", note: "NumberQuantity.divide"}
  - {class: tech.units.indriya.unit.AlternateUnit, method: getDimension, match: "()", note: "AlternateUnit.getDimension"}
  - {class: tech.units.indriya.format.SymbolMap, method: of, match: "(ResourceBundle rb)", note: "SymbolMap.of"}
  - {class: tech.units.indriya.function.QuantityStreams, method: summarizeQuantity, match: "(", note: "QuantityStreams.summarizeQuantity"}
  - {class: tech.units.indriya.internal.format.RationalNumberFormat, method: wrap, match: "(NumberFormat numberFormat)", note: "RationalNumberFormat.wrap"}
  - {class: tech.units.indriya.quantity.QuantityRange, method: of, match: "(Quantity minimum, Quantity maximum, Quantity resolution)", note: "QuantityRange.of"}
  - {class: tech.units.indriya.unit.AnnotatedUnit, method: getActualUnit, match: "()", note: "AnnotatedUnit.getActualUnit"}
  - {class: tech.units.indriya.format.SymbolMap, method: label, match: "(Unit<?> unit, String symbol)", note: "SymbolMap.label"}
  - {class: tech.units.indriya.function.RationalNumber, method: ofInteger, match: "(long number)", note: "RationalNumber.ofInteger"}
  - {class: tech.units.indriya.internal.format.RationalNumberFormat, method: format, match: "(double number, StringBuffer toAppendTo, FieldPosition pos)", note: "RationalNumberFormat.format"}
  - {class: tech.units.indriya.quantity.QuantityRange, method: of, match: "(Quantity minimum, Quantity maximum)", note: "QuantityRange.of"}
  - {class: tech.units.indriya.unit.AnnotatedUnit, method: getAnnotation, match: "()", note: "AnnotatedUnit.getAnnotation"}
  - {class: tech.units.indriya.format.DefaultFormatService, method: getQuantityFormat, match: "(String key)", note: "DefaultFormatService.getQuantityFormat"}
  - {class: tech.units.indriya.function.RationalNumber, method: ofInteger, match: "(BigInteger number)", note: "RationalNumber.ofInteger"}
  - {class: tech.units.indriya.internal.format.RationalNumberScanner, method: getNumber, match: "()", note: "RationalNumberScanner.getNumber"}
  - {class: tech.units.indriya.quantity.DefaultQuantityFactory, method: getInstance, match: "(final Class<Q> type)", note: "DefaultQuantityFactory.getInstance"}
  - {class: tech.units.indriya.unit.BaseUnit, method: toSystemUnit, match: "()", note: "BaseUnit.toSystemUnit"}
  - {class: tech.units.indriya.format.DefaultFormatService, method: getQuantityFormat, match: "()", note: "DefaultFormatService.getQuantityFormat"}
  - {class: tech.units.indriya.function.AddConverter, method: isIdentity, match: "()", note: "AddConverter.isIdentity"}
  - {class: tech.units.indriya.internal.format.UnitFormatParser, method: parseUnit, match: "() throws TokenException", note: "UnitFormatParser.parseUnit"}
  - {class: tech.units.indriya.quantity.DefaultQuantityFactory, method: create, match: "(Number value, Unit<Q> unit)", note: "DefaultQuantityFactory.create"}
  - {class: tech.units.indriya.unit.BaseUnit, method: getSystemConverter, match: "() throws UnsupportedOperationException", note: "BaseUnit.getSystemConverter"}
  - {class: tech.units.indriya.format.EBNFUnitFormat, method: getInstance, match: "()", note: "EBNFUnitFormat.getInstance"}
  - {class: tech.units.indriya.function.AddConverter, method: canReduceWith, match: "(AbstractConverter that)", note: "AddConverter.canReduceWith"}
  - {class: tech.units.indriya.internal.function.simplify.CompositionTaskArrayAdapter, method: of, match: "(T[] array)", note: "CompositionTaskArrayAdapter.of"}
