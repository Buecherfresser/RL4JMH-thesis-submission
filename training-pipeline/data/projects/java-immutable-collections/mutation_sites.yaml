  - {class: org.javimmutable.collections.util.MapAccessTimingComparison, method: main, match: "(String[] argv)", note: "MapAccessTimingComparison.main"}
  - {class: org.javimmutable.collections.IListMaps, method: ordered, match: "()", note: "IListMaps.ordered"}
