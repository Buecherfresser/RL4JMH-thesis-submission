# Curated performance-mutation sites for easy-random (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants easy-random --source data/external-src/<checkout> \
#       --sites data/projects/easy-random/mutation_sites.yaml

package_root: org.jeasy.random

sites:
  - {class: org.jeasy.random.DefaultExclusionPolicy, method: shouldBeExcluded, match: "(final Field field, final RandomizerContext context)", note: "DefaultExclusionPolicy.shouldBeExcluded"}
  - {class: org.jeasy.random.randomizers.CreditCardNumberRandomizer, method: getRandomValue, match: "()", note: "CreditCardNumberRandomizer.getRandomValue"}
  - {class: org.jeasy.random.util.CharacterUtils, method: collectPrintableCharactersOf, match: "(Charset charset)", note: "CharacterUtils.collectPrintableCharactersOf"}
  - {class: org.jeasy.random.DefaultExclusionPolicy, method: shouldBeExcluded, match: "(final Class<?> type, final RandomizerContext context)", note: "DefaultExclusionPolicy.shouldBeExcluded"}
  - {class: org.jeasy.random.randomizers.GenericStringRandomizer, method: getRandomValue, match: "()", note: "GenericStringRandomizer.getRandomValue"}
  - {class: org.jeasy.random.util.CharacterUtils, method: filterLetters, match: "(List<Character> characters)", note: "CharacterUtils.filterLetters"}
  - {class: org.jeasy.random.EasyRandom, method: nextObject, match: "(final Class<T> type)", note: "EasyRandom.nextObject"}
  - {class: org.jeasy.random.randomizers.PhoneNumberRandomizer, method: getRandomValue, match: "()", note: "PhoneNumberRandomizer.getRandomValue"}
  - {class: org.jeasy.random.util.ConversionUtils, method: convertArguments, match: "(final RandomizerArgument[] declaredArguments)", note: "ConversionUtils.convertArguments"}
  - {class: org.jeasy.random.EasyRandom, method: objects, match: "(final Class<T> type, final int streamSize)", note: "EasyRandom.objects"}
  - {class: org.jeasy.random.randomizers.collection.EnumSetRandomizer, method: getRandomValue, match: "()", note: "EnumSetRandomizer.getRandomValue"}
  - {class: org.jeasy.random.util.ConversionUtils, method: convertDateToLocalDate, match: "(Date date)", note: "ConversionUtils.convertDateToLocalDate"}
  - {class: org.jeasy.random.EasyRandomParameters, method: getCollectionSizeRange, match: "()", note: "EasyRandomParameters.getCollectionSizeRange"}
  - {class: org.jeasy.random.randomizers.collection.ListRandomizer, method: getRandomValue, match: "()", note: "ListRandomizer.getRandomValue"}
  - {class: org.jeasy.random.util.ReflectionUtils, method: asRandomizer, match: "(final Supplier<T> supplier)", note: "ReflectionUtils.asRandomizer"}
  - {class: org.jeasy.random.EasyRandomParameters, method: setCollectionSizeRange, match: "(final Range<Integer> collectionSizeRange)", note: "EasyRandomParameters.setCollectionSizeRange"}
  - {class: org.jeasy.random.randomizers.collection.MapRandomizer, method: getRandomValue, match: "()", note: "MapRandomizer.getRandomValue"}
  - {class: org.jeasy.random.util.ReflectionUtils, method: invoke, match: "(final Object proxy, final Method method, final Object[] args) throws Throwable", note: "ReflectionUtils.invoke"}
  - {class: org.jeasy.random.FieldPredicates, method: named, match: "(final String name)", note: "FieldPredicates.named"}
  - {class: org.jeasy.random.randomizers.collection.SetRandomizer, method: getRandomValue, match: "()", note: "SetRandomizer.getRandomValue"}
  - {class: org.jeasy.random.util.PrimitiveEnum, method: getClazz, match: "()", note: "PrimitiveEnum.getClazz"}
  - {class: org.jeasy.random.FieldPredicates, method: path, match: "(final String path)", note: "FieldPredicates.path"}
  - {class: org.jeasy.random.randomizers.number.NumberRandomizer, method: getRandomValue, match: "()", note: "NumberRandomizer.getRandomValue"}
  - {class: org.jeasy.random.ObjenesisObjectFactory, method: createInstance, match: "(Class<T> type, RandomizerContext context)", note: "ObjenesisObjectFactory.createInstance"}
  - {class: org.jeasy.random.randomizers.range.BigDecimalRangeRandomizer, method: getRandomValue, match: "()", note: "BigDecimalRangeRandomizer.getRandomValue"}
  - {class: org.jeasy.random.RandomizationContext, method: getTargetType, match: "()", note: "RandomizationContext.getTargetType"}
  - {class: org.jeasy.random.randomizers.range.BigIntegerRangeRandomizer, method: getRandomValue, match: "()", note: "BigIntegerRangeRandomizer.getRandomValue"}
  - {class: org.jeasy.random.RandomizationContext, method: getCurrentObject, match: "()", note: "RandomizationContext.getCurrentObject"}
  - {class: org.jeasy.random.randomizers.range.ByteRangeRandomizer, method: checkValues, match: "()", note: "ByteRangeRandomizer.checkValues"}
  - {class: org.jeasy.random.RandomizationContextStackItem, method: getObject, match: "()", note: "RandomizationContextStackItem.getObject"}
  - {class: org.jeasy.random.randomizers.range.ByteRangeRandomizer, method: getRandomValue, match: "()", note: "ByteRangeRandomizer.getRandomValue"}
  - {class: org.jeasy.random.RandomizationContextStackItem, method: setObject, match: "(Object object)", note: "RandomizationContextStackItem.setObject"}
  - {class: org.jeasy.random.randomizers.range.DateRangeRandomizer, method: checkValues, match: "()", note: "DateRangeRandomizer.checkValues"}
  - {class: org.jeasy.random.RegistriesRandomizerProvider, method: getRandomizerByField, match: "(Field field, RandomizerContext context)", note: "RegistriesRandomizerProvider.getRandomizerByField"}
