  - {class: org.apache.commons.rng.sampling.UnitSphereSampler, method: sample, match: "()", note: "UnitSphereSampler.sample"}
  - {class: org.apache.commons.rng.simple.JDKRandomWrapper, method: nextInt, match: "()", note: "JDKRandomWrapper.nextInt"}
