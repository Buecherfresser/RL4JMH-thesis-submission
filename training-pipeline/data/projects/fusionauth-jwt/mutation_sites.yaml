  - {class: io.fusionauth.jwt.json.Mapper, method: deserialize, match: "(InputStream is, Class<T> type) throws InvalidJWTException", note: "Mapper.deserialize"}
  - {class: io.fusionauth.jwt.rsa.RSAPSSSigner, method: newSHA256Signer, match: "(String privateKey, String kid)", note: "RSAPSSSigner.newSHA256Signer"}
  - {class: io.fusionauth.jwt.JWTDecoder, method: withClockSkew, match: "(int clockSkew)", note: "JWTDecoder.withClockSkew"}
  - {class: io.fusionauth.jwt.domain.Algorithm, method: getDigest, match: "()", note: "Algorithm.getDigest"}
  - {class: io.fusionauth.jwt.ec.ECSigner, method: newSHA256Signer, match: "(String privateKey)", note: "ECSigner.newSHA256Signer"}
  - {class: io.fusionauth.jwt.ed.EdDSASigner, method: newSigner, match: "(String privateKey, String kid)", note: "EdDSASigner.newSigner"}
  - {class: io.fusionauth.jwt.hmac.HMACSigner, method: newSHA256Signer, match: "(byte[] secret, String kid)", note: "HMACSigner.newSHA256Signer"}
  - {class: io.fusionauth.jwt.json.Mapper, method: prettyPrint, match: "(Object object) throws InvalidJWTException", note: "Mapper.prettyPrint"}
  - {class: io.fusionauth.jwt.rsa.RSAPSSSigner, method: newSHA256Signer, match: "(PrivateKey privateKey)", note: "RSAPSSSigner.newSHA256Signer"}
  - {class: io.fusionauth.jwt.JWTDecoder, method: now, match: "()", note: "JWTDecoder.now"}
  - {class: io.fusionauth.jwt.domain.Header, method: anyGetter, match: "()", note: "Header.anyGetter"}
  - {class: io.fusionauth.jwt.ec.ECSigner, method: newSHA256Signer, match: "(String privateKey, String kid)", note: "ECSigner.newSHA256Signer"}
  - {class: io.fusionauth.jwt.ed.EdDSAVerifier, method: newVerifier, match: "(Path path)", note: "EdDSAVerifier.newVerifier"}
