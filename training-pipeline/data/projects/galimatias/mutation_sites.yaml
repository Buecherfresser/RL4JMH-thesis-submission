# Curated performance-mutation sites for galimatias (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants galimatias --source data/external-src/<checkout> \
#       --sites data/projects/galimatias/mutation_sites.yaml

package_root: io.mola.galimatias

sites:
  - {class: io.mola.galimatias.FormURLEncodedParser, method: getInstance, match: "()", note: "FormURLEncodedParser.getInstance"}
  - {class: io.mola.galimatias.canonicalize.CombinedCanonicalizer, method: canonicalize, match: "(final URL input) throws GalimatiasParseException", note: "CombinedCanonicalizer.canonicalize"}
  - {class: io.mola.galimatias.cli.CLI, method: error, match: "(GalimatiasParseException error) throws GalimatiasParseException", note: "CLI.error"}
  - {class: io.mola.galimatias.FormURLEncodedParser, method: parse, match: "(final String input)", note: "FormURLEncodedParser.parse"}
  - {class: io.mola.galimatias.canonicalize.DecodeUnreservedCanonicalizer, method: canonicalize, match: "(final URL input) throws GalimatiasParseException", note: "DecodeUnreservedCanonicalizer.canonicalize"}
  - {class: io.mola.galimatias.cli.CLI, method: fatalError, match: "(GalimatiasParseException error)", note: "CLI.fatalError"}
  - {class: io.mola.galimatias.FormURLEncodedParser, method: parse, match: "(final String input, final Charset charset)", note: "FormURLEncodedParser.parse"}
  - {class: io.mola.galimatias.canonicalize.RFC2396Canonicalizer, method: canonicalize, match: "(URL url) throws GalimatiasParseException", note: "RFC2396Canonicalizer.canonicalize"}
  - {class: io.mola.galimatias.cli.CLI, method: main, match: "(String[] args)", note: "CLI.main"}
  - {class: io.mola.galimatias.URLParser, method: settings, match: "(final URLParsingSettings settings)", note: "URLParser.settings"}
  - {class: io.mola.galimatias.canonicalize.RFC2396Canonicalizer, method: test, match: "(int c)", note: "RFC2396Canonicalizer.test"}
  - {class: io.mola.galimatias.URLParser, method: parse, match: "() throws GalimatiasParseException", note: "URLParser.parse"}
  - {class: io.mola.galimatias.canonicalize.RFC2396Canonicalizer, method: test, match: "(int c)", note: "RFC2396Canonicalizer.test"}
  - {class: io.mola.galimatias.URLParsingSettings, method: errorHandler, match: "()", note: "URLParsingSettings.errorHandler"}
  - {class: io.mola.galimatias.canonicalize.RFC3986Canonicalizer, method: canonicalize, match: "(URL url) throws GalimatiasParseException", note: "RFC3986Canonicalizer.canonicalize"}
  - {class: io.mola.galimatias.URLParsingSettings, method: create, match: "()", note: "URLParsingSettings.create"}
  - {class: io.mola.galimatias.canonicalize.RFC3986Canonicalizer, method: test, match: "(int c)", note: "RFC3986Canonicalizer.test"}
  - {class: io.mola.galimatias.URLParsingSettings, method: withErrorHandler, match: "(final ErrorHandler handler)", note: "URLParsingSettings.withErrorHandler"}
  - {class: io.mola.galimatias.canonicalize.RFC3986Canonicalizer, method: test, match: "(int c)", note: "RFC3986Canonicalizer.test"}
  - {class: io.mola.galimatias.URLUtils, method: percentDecode, match: "(final String input)", note: "URLUtils.percentDecode"}
  - {class: io.mola.galimatias.canonicalize.RegexCanonicalizer, method: canonicalize, match: "(final URL input) throws GalimatiasParseException", note: "RegexCanonicalizer.canonicalize"}
  - {class: io.mola.galimatias.URLUtils, method: domainToASCII, match: "(final String domain) throws GalimatiasParseException", note: "URLUtils.domainToASCII"}
  - {class: io.mola.galimatias.canonicalize.StripPartCanonicalizer, method: canonicalize, match: "(final URL input) throws GalimatiasParseException", note: "StripPartCanonicalizer.canonicalize"}
  - {class: io.mola.galimatias.URLUtils, method: domainToUnicode, match: "(final String asciiDomain) throws GalimatiasParseException", note: "URLUtils.domainToUnicode"}
  - {class: io.mola.galimatias.DefaultErrorHandler, method: getInstance, match: "()", note: "DefaultErrorHandler.getInstance"}
  - {class: io.mola.galimatias.DefaultErrorHandler, method: error, match: "(GalimatiasParseException error) throws GalimatiasParseException", note: "DefaultErrorHandler.error"}
  - {class: io.mola.galimatias.DefaultErrorHandler, method: fatalError, match: "(GalimatiasParseException error)", note: "DefaultErrorHandler.fatalError"}
  - {class: io.mola.galimatias.Domain, method: parseDomain, match: "(final String input) throws GalimatiasParseException", note: "Domain.parseDomain"}
  - {class: io.mola.galimatias.Domain, method: labels, match: "()", note: "Domain.labels"}
  - {class: io.mola.galimatias.Domain, method: parseDomain, match: "(final String input, final boolean unicode) throws GalimatiasParseException", note: "Domain.parseDomain"}
  - {class: io.mola.galimatias.GalimatiasParseException, method: getPosition, match: "()", note: "GalimatiasParseException.getPosition"}
  - {class: io.mola.galimatias.GalimatiasParseException, method: getParseIssue, match: "()", note: "GalimatiasParseException.getParseIssue"}
  - {class: io.mola.galimatias.GalimatiasParseException, method: withMessage, match: "(final String msg)", note: "GalimatiasParseException.withMessage"}
  - {class: io.mola.galimatias.IPv4Address, method: parseIPv4Address, match: "(final String input) throws GalimatiasParseException", note: "IPv4Address.parseIPv4Address"}
  - {class: io.mola.galimatias.IPv4Address, method: toInetAddress, match: "() throws UnknownHostException", note: "IPv4Address.toInetAddress"}
  - {class: io.mola.galimatias.IPv4Address, method: fromInet4Adress, match: "(final Inet4Address inet4Address)", note: "IPv4Address.fromInet4Adress"}
  - {class: io.mola.galimatias.IPv6Address, method: parseIPv6Address, match: "(final String ipString) throws GalimatiasParseException", note: "IPv6Address.parseIPv6Address"}
  - {class: io.mola.galimatias.IPv6Address, method: toInetAddress, match: "()", note: "IPv6Address.toInetAddress"}
  - {class: io.mola.galimatias.IPv6Address, method: fromInet6Address, match: "(final Inet6Address inet6Address)", note: "IPv6Address.fromInet6Address"}
  - {class: io.mola.galimatias.NameValue, method: name, match: "()", note: "NameValue.name"}
  - {class: io.mola.galimatias.NameValue, method: value, match: "()", note: "NameValue.value"}
  - {class: io.mola.galimatias.StrictErrorHandler, method: getInstance, match: "()", note: "StrictErrorHandler.getInstance"}
  - {class: io.mola.galimatias.StrictErrorHandler, method: error, match: "(GalimatiasParseException error) throws GalimatiasParseException", note: "StrictErrorHandler.error"}
  - {class: io.mola.galimatias.StrictErrorHandler, method: fatalError, match: "(GalimatiasParseException error)", note: "StrictErrorHandler.fatalError"}
  - {class: io.mola.galimatias.URL, method: scheme, match: "()", note: "URL.scheme"}
  - {class: io.mola.galimatias.URL, method: schemeData, match: "()", note: "URL.schemeData"}
  - {class: io.mola.galimatias.URL, method: username, match: "()", note: "URL.username"}
  - {class: io.mola.galimatias.URLSearchParameters, method: withAppended, match: "(final String name, final String value)", note: "URLSearchParameters.withAppended"}
  - {class: io.mola.galimatias.URLSearchParameters, method: withAppended, match: "(final NameValue nameValue)", note: "URLSearchParameters.withAppended"}
  - {class: io.mola.galimatias.URLSearchParameters, method: with, match: "(final String name, final String value)", note: "URLSearchParameters.with"}
