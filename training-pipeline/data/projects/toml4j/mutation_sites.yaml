  - {class: com.moandjiezana.toml.Toml, method: containsTableArray, match: "(String key)", note: "Toml.containsTableArray"}
  - {class: com.moandjiezana.toml.Toml, method: isEmpty, match: "()", note: "Toml.isEmpty"}
  - {class: com.moandjiezana.toml.Toml, method: to, match: "(Class<T> targetClass)", note: "Toml.to"}
  - {class: com.moandjiezana.toml.Toml, method: toMap, match: "()", note: "Toml.toMap"}
  - {class: com.moandjiezana.toml.Toml, method: entrySet, match: "()", note: "Toml.entrySet"}
  - {class: com.moandjiezana.toml.Toml, method: getKey, match: "()", note: "Toml.getKey"}
  - {class: com.moandjiezana.toml.Toml, method: getValue, match: "()", note: "Toml.getValue"}
  - {class: com.moandjiezana.toml.Toml, method: setValue, match: "(Object value)", note: "Toml.setValue"}
