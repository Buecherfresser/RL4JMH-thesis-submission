  - {class: io.vertx.core.http.impl.HttpUtils, method: name, match: "(HttpServerRequest req, int index)", note: "HttpUtils.name"}
  - {class: io.vertx.core.http.impl.StatisticsGatheringHttpClientStream, method: id, match: "()", note: "StatisticsGatheringHttpClientStream.id"}
  - {class: io.vertx.core.http.impl.StatisticsGatheringHttpClientStream, method: metric, match: "()", note: "StatisticsGatheringHttpClientStream.metric"}
  - {class: io.vertx.core.http.impl.http1.VertxHttpRequestDecoder, method: splitHeaderName, match: "(byte[] sb, int start, int length)", note: "VertxHttpRequestDecoder.splitHeaderName"}
  - {class: io.vertx.core.http.impl.http1.VertxHttpRequestDecoder, method: createMessage, match: "(String[] initialLine)", note: "VertxHttpRequestDecoder.createMessage"}
  - {class: io.vertx.core.http.impl.http1.VertxHttpResponseEncoder, method: encodeHeaders, match: "(HttpHeaders headers, ByteBuf buf)", note: "VertxHttpResponseEncoder.encodeHeaders"}
  - {class: io.vertx.core.http.impl.http1.VertxHttpResponseEncoder, method: acceptOutboundMessage, match: "(Object msg) throws Exception", note: "VertxHttpResponseEncoder.acceptOutboundMessage"}
  - {class: io.vertx.core.http.impl.http2.DefaultHttp2ClientStream, method: scheme, match: "()", note: "DefaultHttp2ClientStream.scheme"}
  - {class: io.vertx.core.http.impl.http2.DefaultHttp2ClientStream, method: authority, match: "()", note: "DefaultHttp2ClientStream.authority"}
  - {class: io.vertx.core.http.impl.http2.DefaultHttp2ServerStream, method: headers, match: "()", note: "DefaultHttp2ServerStream.headers"}
  - {class: io.vertx.core.http.impl.http2.DefaultHttp2ServerStream, method: method, match: "()", note: "DefaultHttp2ServerStream.method"}
  - {class: io.vertx.core.http.impl.http2.codec.VertxCompressorHttp2ConnectionEncoder, method: writeHeaders, match: "(ChannelHandlerContext ctx, int streamId, Http2Headers headers, int padding, boolean endStream, ChannelPromise promise)", note: "VertxCompressorHttp2ConnectionEncoder.writeHeaders"}
  - {class: io.vertx.core.http.impl.http2.codec.VertxCompressorHttp2ConnectionEncoder, method: writeHeaders, match: "(ChannelHandlerContext ctx, int streamId, Http2Headers headers, int streamDependency, short weight, boolean exclusive, int padding, boolean endStream, ChannelPromise promise)", note: "VertxCompressorHttp2ConnectionEncoder.writeHeaders"}
  - {class: io.vertx.core.http.impl.http2.codec.VertxHttp2ConnectionHandlerBuilder, method: server, match: "(boolean isServer)", note: "VertxHttp2ConnectionHandlerBuilder.server"}
