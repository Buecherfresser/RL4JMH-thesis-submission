  - {class: org.apache.commons.configuration2.io.FileHandlerListenerAdapter, method: loading, match: "(final FileHandler handler)", note: "FileHandlerListenerAdapter.loading"}
  - {class: org.apache.commons.configuration2.plist.PropertyListConfiguration, method: padNum, match: "(final StringBuilder buf, final int num, final int length)", note: "PropertyListConfiguration.padNum"}
  - {class: org.apache.commons.configuration2.reloading.CombinedReloadingController, method: reloadingPerformed, match: "()", note: "CombinedReloadingController.reloadingPerformed"}
  - {class: org.apache.commons.configuration2.resolver.CatalogResolver, method: normalizeURI, match: "(final String uriref)", note: "CatalogResolver.normalizeURI"}
