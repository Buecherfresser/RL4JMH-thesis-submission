# Curated performance-mutation sites for hipparchus (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants hipparchus --source data/external-src/<checkout> \
#       --sites data/projects/hipparchus/mutation_sites.yaml

package_root: org.hipparchus

sites:
  - {class: org.hipparchus.analysis.FunctionUtils, method: compose, match: "(final UnivariateFunction ... f)", note: "FunctionUtils.compose"}
  - {class: org.hipparchus.clustering.CentroidCluster, method: getCenter, match: "()", note: "CentroidCluster.getCenter"}
  - {class: org.hipparchus.complex.ComplexUtils, method: polar2Complex, match: "(double r, double theta) throws MathIllegalArgumentException", note: "ComplexUtils.polar2Complex"}
  - {class: org.hipparchus.dfp.DfpMath, method: split, match: "(final DfpField field, final String a)", note: "DfpMath.split"}
  - {class: org.hipparchus.distribution.EnumeratedDistribution, method: probability, match: "(final T x)", note: "EnumeratedDistribution.probability"}
  - {class: org.hipparchus.exception.MathRuntimeException, method: createInternalError, match: "()", note: "MathRuntimeException.createInternalError"}
  - {class: org.hipparchus.filtering.LocalizedFilterFormats, method: getSourceString, match: "()", note: "LocalizedFilterFormats.getSourceString"}
  - {class: org.hipparchus.fitting.GaussianCurveFitter, method: value, match: "(double x, double ... p)", note: "GaussianCurveFitter.value"}
  - {class: org.hipparchus.fraction.BigFraction, method: convergents, match: "(final double value, final int maxConvergents)", note: "BigFraction.convergents"}
  - {class: org.hipparchus.geometry.euclidean.oned.IntervalsSet, method: buildNew, match: "(final BSPTree<Euclidean1D, Vector1D, OrientedPoint, SubOrientedPoint> tree)", note: "IntervalsSet.buildNew"}
  - {class: org.hipparchus.linear.Array2DRowFieldMatrix, method: multiplyTransposed, match: "(final FieldMatrix<T> m)", note: "Array2DRowFieldMatrix.multiplyTransposed"}
  - {class: org.hipparchus.ode.EquationsMapper, method: getNumberOfEquations, match: "()", note: "EquationsMapper.getNumberOfEquations"}
  - {class: org.hipparchus.optim.linear.LinearConstraintSet, method: getConstraints, match: "()", note: "LinearConstraintSet.getConstraints"}
  - {class: org.hipparchus.random.CorrelatedRandomVectorGenerator, method: getGenerator, match: "()", note: "CorrelatedRandomVectorGenerator.getGenerator"}
  - {class: org.hipparchus.special.elliptic.jacobi.JacobiEllipticBuilder, method: build, match: "(final double m)", note: "JacobiEllipticBuilder.build"}
  - {class: org.hipparchus.stat.StatUtils, method: sum, match: "(final double... values) throws MathIllegalArgumentException", note: "StatUtils.sum"}
  - {class: org.hipparchus.transform.TransformUtils, method: scaleArray, match: "(double[] f, double d)", note: "TransformUtils.scaleArray"}
  - {class: org.hipparchus.util.ArithmeticUtils, method: addAndCheck, match: "(long a, long b) throws MathRuntimeException", note: "ArithmeticUtils.addAndCheck"}
  - {class: org.hipparchus.analysis.FunctionUtils, method: value, match: "(double x)", note: "FunctionUtils.value"}
  - {class: org.hipparchus.clustering.Cluster, method: addPoint, match: "(final T point)", note: "Cluster.addPoint"}
  - {class: org.hipparchus.complex.ComplexUtils, method: polar2Complex, match: "(T r, T theta) throws MathIllegalArgumentException", note: "ComplexUtils.polar2Complex"}
  - {class: org.hipparchus.dfp.DfpMath, method: split, match: "(final Dfp a)", note: "DfpMath.split"}
  - {class: org.hipparchus.distribution.EnumeratedDistribution, method: getPmf, match: "()", note: "EnumeratedDistribution.getPmf"}
  - {class: org.hipparchus.exception.MathRuntimeException, method: createInternalError, match: "(final Throwable cause)", note: "MathRuntimeException.createInternalError"}
  - {class: org.hipparchus.filtering.LocalizedFilterFormats, method: getLocalizedString, match: "(final Locale locale)", note: "LocalizedFilterFormats.getLocalizedString"}
  - {class: org.hipparchus.fitting.GaussianCurveFitter, method: gradient, match: "(double x, double ... p)", note: "GaussianCurveFitter.gradient"}
  - {class: org.hipparchus.fraction.BigFraction, method: getReal, match: "()", note: "BigFraction.getReal"}
  - {class: org.hipparchus.geometry.euclidean.oned.IntervalsSet, method: getInteriorPoint, match: "()", note: "IntervalsSet.getInteriorPoint"}
  - {class: org.hipparchus.linear.Array2DRowFieldMatrix, method: transposeMultiply, match: "(final FieldMatrix<T> m)", note: "Array2DRowFieldMatrix.transposeMultiply"}
  - {class: org.hipparchus.ode.EquationsMapper, method: getTotalDimension, match: "()", note: "EquationsMapper.getTotalDimension"}
  - {class: org.hipparchus.optim.linear.LinearObjectiveFunction, method: getCoefficients, match: "()", note: "LinearObjectiveFunction.getCoefficients"}
  - {class: org.hipparchus.random.CorrelatedRandomVectorGenerator, method: getRank, match: "()", note: "CorrelatedRandomVectorGenerator.getRank"}
  - {class: org.hipparchus.special.elliptic.jacobi.JacobiEllipticBuilder, method: build, match: "(final T m)", note: "JacobiEllipticBuilder.build"}
  - {class: org.hipparchus.stat.StatUtils, method: sumSq, match: "(final double... values) throws MathIllegalArgumentException", note: "StatUtils.sumSq"}
  - {class: org.hipparchus.transform.TransformUtils, method: scaleArray, match: "(Complex[] f, double d)", note: "TransformUtils.scaleArray"}
  - {class: org.hipparchus.util.ArithmeticUtils, method: gcd, match: "(int p, int q) throws MathRuntimeException", note: "ArithmeticUtils.gcd"}
  - {class: org.hipparchus.analysis.differentiation.FieldTaylorMap, method: getFreeParameters, match: "()", note: "FieldTaylorMap.getFreeParameters"}
  - {class: org.hipparchus.clustering.Cluster, method: getPoints, match: "()", note: "Cluster.getPoints"}
  - {class: org.hipparchus.complex.Complex, method: abs, match: "()", note: "Complex.abs"}
  - {class: org.hipparchus.dfp.Dfp, method: newInstance, match: "()", note: "Dfp.newInstance"}
  - {class: org.hipparchus.distribution.continuous.BetaDistribution, method: getAlpha, match: "()", note: "BetaDistribution.getAlpha"}
  - {class: org.hipparchus.exception.DummyLocalizable, method: getSourceString, match: "()", note: "DummyLocalizable.getSourceString"}
  - {class: org.hipparchus.filtering.kalman.KalmanSmoother, method: init, match: "(KalmanEstimate estimate)", note: "KalmanSmoother.init"}
  - {class: org.hipparchus.fitting.HarmonicCurveFitter, method: create, match: "()", note: "HarmonicCurveFitter.create"}
  - {class: org.hipparchus.fraction.BigFractionField, method: getInstance, match: "()", note: "BigFractionField.getInstance"}
  - {class: org.hipparchus.geometry.euclidean.threed.PolyhedronsSet, method: buildNew, match: "(final BSPTree<Euclidean3D, Vector3D, Plane, SubPlane> tree)", note: "PolyhedronsSet.buildNew"}
  - {class: org.hipparchus.linear.Array2DRowRealMatrix, method: multiplyTransposed, match: "(final RealMatrix m)", note: "Array2DRowRealMatrix.multiplyTransposed"}
  - {class: org.hipparchus.ode.FieldEquationsMapper, method: getNumberOfEquations, match: "()", note: "FieldEquationsMapper.getNumberOfEquations"}
  - {class: org.hipparchus.optim.linear.LinearObjectiveFunction, method: getConstantTerm, match: "()", note: "LinearObjectiveFunction.getConstantTerm"}
  - {class: org.hipparchus.random.GaussMarkovGenerator, method: getTau, match: "()", note: "GaussMarkovGenerator.getTau"}
