# Curated performance-mutation sites for typedmemory (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants typedmemory --source data/external-src/<checkout> \
#       --sites data/projects/typedmemory/mutation_sites.yaml

package_root: com.mamba.typedmemory

sites:
  - {class: com.mamba.typedmemory.api.MemLayout, method: MemLayout, match: "(MemoryLayout layout, Optional<List<MemoryLayout>> groupLayouts) implements LayoutRules", note: "MemLayout.MemLayout"}
  - {class: com.mamba.typedmemory.opcode.ArrayAccessKind, method: kind, match: "(Class<?> elementType)", note: "ArrayAccessKind.kind"}
  - {class: com.mamba.typedmemory.util.MemLayoutString, method: MemLayoutString, match: "(MemoryLayout layout, String stringLayout) implements LayoutRules", note: "MemLayoutString.MemLayoutString"}
  - {class: com.mamba.typedmemory.api.MemLayout, method: byteSize, match: "()", note: "MemLayout.byteSize"}
  - {class: com.mamba.typedmemory.opcode.expr.arrays.ArrayExpr, method: ArrayExpr, match: "(NewArrayExpr alloc, ArrayInitialiserExpr init) implements Expr", note: "ArrayExpr.ArrayExpr"}
  - {class: com.mamba.typedmemory.util.MemLayoutString, method: branch, match: "()", note: "MemLayoutString.branch"}
  - {class: com.mamba.typedmemory.api.MemTypeCache, method: computeValue, match: "(Class<?> type)", note: "MemTypeCache.computeValue"}
  - {class: com.mamba.typedmemory.opcode.expr.arrays.ArrayExpr, method: emit, match: "(CodeEmitter out)", note: "ArrayExpr.emit"}
  - {class: com.mamba.typedmemory.util.MemoryRefs, method: nullPtr, match: "()", note: "MemoryRefs.nullPtr"}
  - {class: com.mamba.typedmemory.api.Nulls, method: of, match: "()", note: "Nulls.of"}
  - {class: com.mamba.typedmemory.opcode.expr.arrays.ArrayInitialiserExpr, method: ArrayInitialiserExpr, match: "(List<Expr> elements) implements Expr", note: "ArrayInitialiserExpr.ArrayInitialiserExpr"}
  - {class: com.mamba.typedmemory.util.MemoryRefs, method: ptr, match: "(MemorySegment segment)", note: "MemoryRefs.ptr"}
  - {class: com.mamba.typedmemory.api.Nulls, method: of, match: "(Class<T> type)", note: "Nulls.of"}
  - {class: com.mamba.typedmemory.opcode.expr.arrays.ArrayInitialiserExpr, method: emit, match: "(CodeEmitter out)", note: "ArrayInitialiserExpr.emit"}
  - {class: com.mamba.typedmemory.api.PrimitiveTransforms, method: setAt, match: "(", note: "PrimitiveTransforms.setAt"}
  - {class: com.mamba.typedmemory.opcode.expr.arrays.ArrayLengthExpr, method: ArrayLengthExpr, match: "(Expr array) implements IntExpr", note: "ArrayLengthExpr.ArrayLengthExpr"}
  - {class: com.mamba.typedmemory.api.PrimitiveTransforms, method: setAt, match: "(", note: "PrimitiveTransforms.setAt"}
  - {class: com.mamba.typedmemory.opcode.expr.arrays.ArrayLengthExpr, method: emit, match: "(CodeEmitter out)", note: "ArrayLengthExpr.emit"}
  - {class: com.mamba.typedmemory.opcode.expr.arrays.ArrayLoadExpr, method: ArrayLoadExpr, match: "(ArrayAccessKind kind, Expr array, IntExpr index) implements Expr", note: "ArrayLoadExpr.ArrayLoadExpr"}
  - {class: com.mamba.typedmemory.opcode.expr.arrays.ArrayLoadExpr, method: emit, match: "(CodeEmitter out)", note: "ArrayLoadExpr.emit"}
  - {class: com.mamba.typedmemory.opcode.expr.arrays.NewObjectArrayExpr, method: NewObjectArrayExpr, match: "(ClassDesc elementType, IntExpr size) implements NewArrayExpr", note: "NewObjectArrayExpr.NewObjectArrayExpr"}
  - {class: com.mamba.typedmemory.opcode.expr.arrays.NewObjectArrayExpr, method: emit, match: "(CodeEmitter out)", note: "NewObjectArrayExpr.emit"}
  - {class: com.mamba.typedmemory.opcode.expr.arrays.NewPrimitiveArrayExpr, method: NewPrimitiveArrayExpr, match: "(TypeKind elementType, IntExpr size) implements NewArrayExpr", note: "NewPrimitiveArrayExpr.NewPrimitiveArrayExpr"}
  - {class: com.mamba.typedmemory.opcode.expr.arrays.NewPrimitiveArrayExpr, method: emit, match: "(CodeEmitter out)", note: "NewPrimitiveArrayExpr.emit"}
  - {class: com.mamba.typedmemory.opcode.lowering.SetLowering, method: lower, match: "(ClassDesc owner, Class<? extends Record> recordType, MemLayout memLayout)", note: "SetLowering.lower"}
  - {class: com.mamba.typedmemory.opcode.stmt.ArrayStoreStmt, method: ArrayStoreStmt, match: "(ArrayAccessKind kind, Expr array, IntExpr index, Expr value) implements Stmt", note: "ArrayStoreStmt.ArrayStoreStmt"}
  - {class: com.mamba.typedmemory.opcode.stmt.ArrayStoreStmt, method: emit, match: "(CodeEmitter out)", note: "ArrayStoreStmt.emit"}
  - {class: com.mamba.typedmemory.opcode.Generator, method: generate, match: "(ClassDesc owner, Class<? extends Record> record, MemLayout memLayout)", note: "Generator.generate"}
  - {class: com.mamba.typedmemory.opcode.Generator, method: generateUserImplName, match: "(Class<?> valueType)", note: "Generator.generateUserImplName"}
  - {class: com.mamba.typedmemory.opcode.LocalAllocator, method: LocalBinding, match: "(int slot, JVMType kind, String name)", note: "LocalAllocator.LocalBinding"}
  - {class: com.mamba.typedmemory.opcode.LocalAllocator, method: enterScope, match: "()", note: "LocalAllocator.enterScope"}
  - {class: com.mamba.typedmemory.opcode.LocalBindings, method: expr, match: "(String name)", note: "LocalBindings.expr"}
  - {class: com.mamba.typedmemory.opcode.OpcodeHelper, method: jvmType, match: "(Class<?> classType)", note: "OpcodeHelper.jvmType"}
  - {class: com.mamba.typedmemory.opcode.OpcodeHelper, method: emitLoad, match: "(CodeEmitter out, JVMType type, int slot)", note: "OpcodeHelper.emitLoad"}
  - {class: com.mamba.typedmemory.opcode.emitter.BytecodeEmitter, method: iconst, match: "(int v)", note: "BytecodeEmitter.iconst"}
  - {class: com.mamba.typedmemory.opcode.emitter.BytecodeEmitter, method: astore, match: "(int slot)", note: "BytecodeEmitter.astore"}
  - {class: com.mamba.typedmemory.opcode.emitter.DebugEmitter, method: iconst, match: "(int value)", note: "DebugEmitter.iconst"}
  - {class: com.mamba.typedmemory.opcode.emitter.DebugEmitter, method: astore, match: "(int slot)", note: "DebugEmitter.astore"}
  - {class: com.mamba.typedmemory.opcode.expr.bind.BlockExpr, method: BlockExpr, match: "(List<Stmt> statements, Expr result) implements Expr", note: "BlockExpr.BlockExpr"}
  - {class: com.mamba.typedmemory.opcode.expr.bind.BlockExpr, method: emit, match: "(CodeEmitter out)", note: "BlockExpr.emit"}
  - {class: com.mamba.typedmemory.opcode.expr.bind.LetExpr, method: LetExpr, match: "(LocalBinding binding, Expr init, Expr body) implements Expr", note: "LetExpr.LetExpr"}
  - {class: com.mamba.typedmemory.opcode.expr.bind.LetExpr, method: emit, match: "(CodeEmitter out)", note: "LetExpr.emit"}
  - {class: com.mamba.typedmemory.opcode.expr.numeric.PrimitiveConversionExpr, method: PrimitiveConversionExpr, match: "(PrimitiveConversion conversion, NumericExpr expr) implements NumericExpr", note: "PrimitiveConversionExpr.PrimitiveConversionExpr"}
  - {class: com.mamba.typedmemory.opcode.expr.numeric.PrimitiveConversionExpr, method: typeKind, match: "()", note: "PrimitiveConversionExpr.typeKind"}
  - {class: com.mamba.typedmemory.opcode.expr.ops.AddExpr, method: of, match: "(NumericExpr left, NumericExpr right)", note: "AddExpr.of"}
  - {class: com.mamba.typedmemory.opcode.expr.ops.AddExpr, method: IntAddExpr, match: "(IntExpr left, IntExpr right) implements IntExpr", note: "AddExpr.IntAddExpr"}
  - {class: com.mamba.typedmemory.opcode.expr.ops.CastExpr, method: CastExpr, match: "(ClassDesc type, Expr expr) implements Expr", note: "CastExpr.CastExpr"}
  - {class: com.mamba.typedmemory.opcode.expr.ops.CastExpr, method: emit, match: "(CodeEmitter out)", note: "CastExpr.emit"}
  - {class: com.mamba.typedmemory.opcode.expr.ops.MulExpr, method: of, match: "(NumericExpr left, NumericExpr right)", note: "MulExpr.of"}
  - {class: com.mamba.typedmemory.opcode.expr.ops.MulExpr, method: IntMulExpr, match: "(IntExpr left, IntExpr right) implements IntExpr", note: "MulExpr.IntMulExpr"}
