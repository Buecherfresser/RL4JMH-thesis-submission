  - {class: org.leadpony.justify.cli.ValidateOption, method: preferredName, match: "()", note: "ValidateOption.preferredName"}
  - {class: org.leadpony.justify.internal.problem.DefaultProblemPrinterBuilder, method: build, match: "()", note: "DefaultProblemPrinterBuilder.build"}
  - {class: org.leadpony.justify.internal.problem.DefaultProblemPrinterBuilder, method: withLocale, match: "(Locale locale)", note: "DefaultProblemPrinterBuilder.withLocale"}
  - {class: org.leadpony.justify.internal.problem.ProblemBuilder, method: withKeyword, match: "(String keyword)", note: "ProblemBuilder.withKeyword"}
