# Curated performance-mutation sites for commons-csv (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants commons-csv --source data/external-src/<checkout> \
#       --sites data/projects/commons-csv/mutation_sites.yaml

package_root: org.apache.commons.csv

sites:
  - {class: org.apache.commons.csv.CSVParser, method: setByteOffset, match: "(final long byteOffset)", note: "CSVParser.setByteOffset"}
  - {class: org.apache.commons.csv.CSVParser, method: setCharacterOffset, match: "(final long characterOffset)", note: "CSVParser.setCharacterOffset"}
  - {class: org.apache.commons.csv.CSVParser, method: setFormat, match: "(final CSVFormat format)", note: "CSVParser.setFormat"}
  - {class: org.apache.commons.csv.CSVParser, method: setRecordNumber, match: "(final long recordNumber)", note: "CSVParser.setRecordNumber"}
  - {class: org.apache.commons.csv.CSVParser, method: setTrackBytes, match: "(final boolean trackBytes)", note: "CSVParser.setTrackBytes"}
  - {class: org.apache.commons.csv.CSVParser, method: builder, match: "()", note: "CSVParser.builder"}
  - {class: org.apache.commons.csv.CSVParser, method: parse, match: "(final File file, final Charset charset, final CSVFormat format) throws IOException", note: "CSVParser.parse"}
  - {class: org.apache.commons.csv.CSVParser, method: parse, match: "(final Path path, final Charset charset, final CSVFormat format) throws IOException", note: "CSVParser.parse"}
  - {class: org.apache.commons.csv.CSVParser, method: parse, match: "(final Reader reader, final CSVFormat format) throws IOException", note: "CSVParser.parse"}
  - {class: org.apache.commons.csv.CSVParser, method: parse, match: "(final String string, final CSVFormat format) throws IOException", note: "CSVParser.parse"}
  - {class: org.apache.commons.csv.CSVParser, method: parse, match: "(final URL url, final Charset charset, final CSVFormat format) throws IOException", note: "CSVParser.parse"}
  - {class: org.apache.commons.csv.CSVParser, method: close, match: "() throws IOException", note: "CSVParser.close"}
  - {class: org.apache.commons.csv.CSVParser, method: getCurrentLineNumber, match: "()", note: "CSVParser.getCurrentLineNumber"}
  - {class: org.apache.commons.csv.CSVParser, method: getFirstEndOfLine, match: "()", note: "CSVParser.getFirstEndOfLine"}
  - {class: org.apache.commons.csv.CSVParser, method: getHeaderComment, match: "()", note: "CSVParser.getHeaderComment"}
  - {class: org.apache.commons.csv.CSVParser, method: getHeaderMap, match: "()", note: "CSVParser.getHeaderMap"}
  - {class: org.apache.commons.csv.CSVParser, method: getHeaderNames, match: "()", note: "CSVParser.getHeaderNames"}
  - {class: org.apache.commons.csv.CSVParser, method: getRecordNumber, match: "()", note: "CSVParser.getRecordNumber"}
  - {class: org.apache.commons.csv.CSVParser, method: getRecords, match: "()", note: "CSVParser.getRecords"}
  - {class: org.apache.commons.csv.CSVParser, method: getTrailerComment, match: "()", note: "CSVParser.getTrailerComment"}
  - {class: org.apache.commons.csv.CSVParser, method: hasHeaderComment, match: "()", note: "CSVParser.hasHeaderComment"}
  - {class: org.apache.commons.csv.CSVParser, method: hasTrailerComment, match: "()", note: "CSVParser.hasTrailerComment"}
  - {class: org.apache.commons.csv.CSVParser, method: isClosed, match: "()", note: "CSVParser.isClosed"}
  - {class: org.apache.commons.csv.CSVParser, method: iterator, match: "()", note: "CSVParser.iterator"}
  - {class: org.apache.commons.csv.CSVParser, method: stream, match: "()", note: "CSVParser.stream"}
  - {class: org.apache.commons.csv.ExtendedBufferedReader, method: close, match: "() throws IOException", note: "ExtendedBufferedReader.close"}
  - {class: org.apache.commons.csv.ExtendedBufferedReader, method: mark, match: "(final int readAheadLimit) throws IOException", note: "ExtendedBufferedReader.mark"}
  - {class: org.apache.commons.csv.ExtendedBufferedReader, method: readLine, match: "() throws IOException", note: "ExtendedBufferedReader.readLine"}
  - {class: org.apache.commons.csv.ExtendedBufferedReader, method: reset, match: "() throws IOException", note: "ExtendedBufferedReader.reset"}
  - {class: org.apache.commons.csv.CSVFormat, method: create, match: "()", note: "CSVFormat.create"}
  - {class: org.apache.commons.csv.CSVFormat, method: create, match: "(final CSVFormat csvFormat)", note: "CSVFormat.create"}
  - {class: org.apache.commons.csv.CSVFormat, method: build, match: "()", note: "CSVFormat.build"}
  - {class: org.apache.commons.csv.CSVFormat, method: setAllowDuplicateHeaderNames, match: "(final boolean allowDuplicateHeaderNames)", note: "CSVFormat.setAllowDuplicateHeaderNames"}
  - {class: org.apache.commons.csv.CSVFormat, method: setAllowMissingColumnNames, match: "(final boolean allowMissingColumnNames)", note: "CSVFormat.setAllowMissingColumnNames"}
  - {class: org.apache.commons.csv.CSVFormat, method: setAutoFlush, match: "(final boolean autoFlush)", note: "CSVFormat.setAutoFlush"}
