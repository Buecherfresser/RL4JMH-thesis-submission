# Curated performance-mutation sites for dsl-json (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants dsl-json --source data/external-src/<checkout> \
#       --sites data/projects/dsl-json/mutation_sites.yaml

package_root: com.dslplatform.json

sites:
  - {class: com.dslplatform.json.ResultSetConverter, method: getColumnType, match: "(int sqlType)", note: "ResultSetConverter.getColumnType"}
  - {class: com.dslplatform.json.jsonb.DslJsonbProvider, method: create, match: "()", note: "DslJsonbProvider.create"}
  - {class: com.dslplatform.json.processor.Analysis, method: hasError, match: "()", note: "Analysis.hasError"}
  - {class: com.dslplatform.json.runtime.ArrayFormatDescription, method: bind, match: "(final JsonReader reader, final B instance) throws IOException", note: "ArrayFormatDescription.bind"}
  - {class: com.dslplatform.json.ConfigureAndroid, method: configure, match: "(DslJson json)", note: "ConfigureAndroid.configure"}
  - {class: com.dslplatform.json.jsonb.DslJsonbProvider, method: withConfig, match: "(JsonbConfig config)", note: "DslJsonbProvider.withConfig"}
  - {class: com.dslplatform.json.processor.Analysis, method: processConverters, match: "(Set<? extends Element> converters)", note: "Analysis.processConverters"}
  - {class: com.dslplatform.json.runtime.ArrayFormatDescription, method: readContent, match: "(final JsonReader reader) throws IOException", note: "ArrayFormatDescription.readContent"}
  - {class: com.dslplatform.json.DslJson, method: withJavaConverters, match: "(boolean javaSpecifics)", note: "DslJson.withJavaConverters"}
  - {class: com.dslplatform.json.jsonb.DslJsonbProvider, method: withProvider, match: "(javax.json.spi.JsonProvider provider)", note: "DslJsonbProvider.withProvider"}
  - {class: com.dslplatform.json.processor.Analysis, method: processAnnotation, match: "(DeclaredType currentAnnotationType, Set<? extends Element> targets)", note: "Analysis.processAnnotation"}
  - {class: com.dslplatform.json.runtime.AttributeDecoder, method: bind, match: "(final JsonReader reader, final T instance) throws IOException", note: "AttributeDecoder.bind"}
  - {class: com.dslplatform.json.DslJson, method: skipDefaultValues, match: "(boolean omitDefaults)", note: "DslJson.skipDefaultValues"}
  - {class: com.dslplatform.json.jsonb.DslJsonbProvider, method: build, match: "()", note: "DslJsonbProvider.build"}
  - {class: com.dslplatform.json.processor.Analysis, method: analyze, match: "()", note: "Analysis.analyze"}
  - {class: com.dslplatform.json.runtime.GenericsMapper, method: create, match: "(final Type manifest, final Class<?> raw)", note: "GenericsMapper.create"}
  - {class: com.dslplatform.json.DslJson, method: allowArrayFormat, match: "(boolean allowArrayFormat)", note: "DslJson.allowArrayFormat"}
  - {class: com.dslplatform.json.processor.AttributeInfo, method: asConcreteType, match: "(Types types, LinkedHashMap<String, TypeMirror> genericSignatures)", note: "AttributeInfo.asConcreteType"}
  - {class: com.dslplatform.json.runtime.GenericsMapper, method: makeConcrete, match: "(final Type manifest, final Class<?> raw)", note: "GenericsMapper.makeConcrete"}
  - {class: com.dslplatform.json.DslJson, method: resolveWriter, match: "(ConverterFactory<? extends JsonWriter.WriteObject> writer)", note: "DslJson.resolveWriter"}
  - {class: com.dslplatform.json.processor.AttributeInfo, method: isEnum, match: "(Map<String, StructInfo> structs)", note: "AttributeInfo.isEnum"}
  - {class: com.dslplatform.json.runtime.LazyAttributeDecoder, method: bind, match: "(final JsonReader reader, final T instance) throws IOException", note: "LazyAttributeDecoder.bind"}
  - {class: com.dslplatform.json.JsonReader, method: reset, match: "(final InputStream stream) throws IOException", note: "JsonReader.reset"}
  - {class: com.dslplatform.json.processor.AttributeInfo, method: canReadInput, match: "()", note: "AttributeInfo.canReadInput"}
  - {class: com.dslplatform.json.runtime.CompositeParameterNameExtractor, method: extractNames, match: "(AccessibleObject ctorOrMethod)", note: "CompositeParameterNameExtractor.extractNames"}
  - {class: com.dslplatform.json.JsonReader, method: length, match: "()", note: "JsonReader.length"}
  - {class: com.dslplatform.json.processor.AttributeInfo, method: canWriteOutput, match: "()", note: "AttributeInfo.canWriteOutput"}
  - {class: com.dslplatform.json.runtime.FormatDescription, method: bind, match: "(final JsonReader reader, final T instance) throws IOException", note: "FormatDescription.bind"}
  - {class: com.dslplatform.json.JsonReader, method: fillInStackTrace, match: "()", note: "JsonReader.fillInStackTrace"}
  - {class: com.dslplatform.json.processor.CachedTypeSupport, method: isSupported, match: "(String type)", note: "CachedTypeSupport.isSupported"}
  - {class: com.dslplatform.json.runtime.Java8ParameterNameExtractor, method: extractNames, match: "(AccessibleObject ctorOrMethod)", note: "Java8ParameterNameExtractor.extractNames"}
  - {class: com.dslplatform.json.JsonReader, method: last, match: "()", note: "JsonReader.last"}
  - {class: com.dslplatform.json.processor.CompiledJsonAnnotationProcessor, method: init, match: "(ProcessingEnvironment processingEnv)", note: "CompiledJsonAnnotationProcessor.init"}
  - {class: com.dslplatform.json.runtime.ObjectFormatDescription, method: bind, match: "(final JsonReader reader, final B instance) throws IOException", note: "ObjectFormatDescription.bind"}
  - {class: com.dslplatform.json.JsonWriter, method: writeNull, match: "()", note: "JsonWriter.writeNull"}
  - {class: com.dslplatform.json.processor.CompiledJsonAnnotationProcessor, method: getSupportedOptions, match: "()", note: "CompiledJsonAnnotationProcessor.getSupportedOptions"}
  - {class: com.dslplatform.json.runtime.ObjectFormatDescription, method: readContent, match: "(final JsonReader reader) throws IOException", note: "ObjectFormatDescription.readContent"}
  - {class: com.dslplatform.json.JsonWriter, method: writeString, match: "(final String value)", note: "JsonWriter.writeString"}
  - {class: com.dslplatform.json.processor.CompiledJsonAnnotationProcessor, method: process, match: "(Set<? extends TypeElement> annotations, RoundEnvironment roundEnv)", note: "CompiledJsonAnnotationProcessor.process"}
  - {class: com.dslplatform.json.runtime.ParanamerParameterNameExtractor, method: extractNames, match: "(AccessibleObject ctorOrMethod)", note: "ParanamerParameterNameExtractor.extractNames"}
  - {class: com.dslplatform.json.JsonWriter, method: writeString, match: "(final CharSequence value)", note: "JsonWriter.writeString"}
  - {class: com.dslplatform.json.processor.CompiledJsonAnnotationProcessor, method: getSupportedSourceVersion, match: "()", note: "CompiledJsonAnnotationProcessor.getSupportedSourceVersion"}
  - {class: com.dslplatform.json.JsonWriter, method: writeAscii, match: "(final String value)", note: "JsonWriter.writeAscii"}
  - {class: com.dslplatform.json.processor.ConverterInfo, method: bind, match: "(Writer code) throws IOException", note: "ConverterInfo.bind"}
  - {class: com.dslplatform.json.ParsingException, method: create, match: "(String reason, boolean withStackTrace)", note: "ParsingException.create"}
  - {class: com.dslplatform.json.processor.LogLevel, method: isVisible, match: "(LogLevel other)", note: "LogLevel.isVisible"}
  - {class: com.dslplatform.json.ParsingException, method: create, match: "(String reason, Throwable cause, boolean withStackTrace)", note: "ParsingException.create"}
  - {class: com.dslplatform.json.processor.MinifiedNaming, method: prepareNames, match: "(Map<String, AttributeInfo> attributes)", note: "MinifiedNaming.prepareNames"}
  - {class: com.dslplatform.json.ParsingException, method: fillInStackTrace, match: "()", note: "ParsingException.fillInStackTrace"}
  - {class: com.dslplatform.json.processor.StructInfo, method: selectedConstructor, match: "()", note: "StructInfo.selectedConstructor"}
