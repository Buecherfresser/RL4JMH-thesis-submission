# Curated performance-mutation sites for rgxgen (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants rgxgen --source data/external-src/<checkout> \
#       --sites data/projects/rgxgen/mutation_sites.yaml

package_root: com.github.curiousoddman

sites:
  - {class: com.github.curiousoddman.rgxgen.RgxGenBuilder, method: withProps, match: "(RgxGenProperties properties)", note: "RgxGenBuilder.withProps"}
  - {class: com.github.curiousoddman.rgxgen.RgxGenBuilder, method: withNodeCreator, match: "(NodeCreator nodeCreator)", note: "RgxGenBuilder.withNodeCreator"}
  - {class: com.github.curiousoddman.rgxgen.iterators.ArrayIterator, method: reset, match: "()", note: "ArrayIterator.reset"}
  - {class: com.github.curiousoddman.rgxgen.iterators.ArrayIterator, method: current, match: "()", note: "ArrayIterator.current"}
  - {class: com.github.curiousoddman.rgxgen.iterators.NegativeStringIterator, method: reset, match: "()", note: "NegativeStringIterator.reset"}
  - {class: com.github.curiousoddman.rgxgen.iterators.NegativeStringIterator, method: current, match: "()", note: "NegativeStringIterator.current"}
  - {class: com.github.curiousoddman.rgxgen.model.SymbolRange, method: SymbolRange, match: "(int from, int to)", note: "SymbolRange.SymbolRange"}
  - {class: com.github.curiousoddman.rgxgen.model.SymbolRange, method: range, match: "(int from, int to)", note: "SymbolRange.range"}
  - {class: com.github.curiousoddman.rgxgen.nodes.SymbolSet, method: ofDotPattern, match: "(RgxGenProperties properties)", note: "SymbolSet.ofDotPattern"}
  - {class: com.github.curiousoddman.rgxgen.nodes.SymbolSet, method: ofAsciiCharacters, match: "(String pattern, char[] symbols, MatchType type)", note: "SymbolSet.ofAsciiCharacters"}
  - {class: com.github.curiousoddman.rgxgen.parsing.dflt.DefaultTreeBuilder, method: build, match: "()", note: "DefaultTreeBuilder.build"}
  - {class: com.github.curiousoddman.rgxgen.util.Util, method: repeatChar, match: "(char c, int times)", note: "Util.repeatChar"}
  - {class: com.github.curiousoddman.rgxgen.util.Util, method: randomlyChangeCase, match: "(RandomGenerator rnd, String input)", note: "Util.randomlyChangeCase"}
  - {class: com.github.curiousoddman.rgxgen.util.chars.CharArrayList, method: stream, match: "()", note: "CharArrayList.stream"}
  - {class: com.github.curiousoddman.rgxgen.util.chars.CharArrayList, method: addAll, match: "(CharList charList)", note: "CharArrayList.addAll"}
  - {class: com.github.curiousoddman.rgxgen.util.chars.CharListCollector, method: supplier, match: "()", note: "CharListCollector.supplier"}
  - {class: com.github.curiousoddman.rgxgen.util.chars.CharListCollector, method: accumulator, match: "()", note: "CharListCollector.accumulator"}
  - {class: com.github.curiousoddman.rgxgen.util.chars.EmptyUnmodifiableCharList, method: stream, match: "()", note: "EmptyUnmodifiableCharList.stream"}
  - {class: com.github.curiousoddman.rgxgen.util.chars.EmptyUnmodifiableCharList, method: addAll, match: "(CharList originalSymbols)", note: "EmptyUnmodifiableCharList.addAll"}
  - {class: com.github.curiousoddman.rgxgen.visitors.GenerationVisitorBuilder, method: withRandom, match: "(RandomGenerator random)", note: "GenerationVisitorBuilder.withRandom"}
  - {class: com.github.curiousoddman.rgxgen.visitors.GenerationVisitorBuilder, method: withProperties, match: "(RgxGenProperties properties)", note: "GenerationVisitorBuilder.withProperties"}
  - {class: com.github.curiousoddman.rgxgen.visitors.helpers.SymbolSetIndexer, method: size, match: "()", note: "SymbolSetIndexer.size"}
  - {class: com.github.curiousoddman.rgxgen.visitors.helpers.SymbolSetIndexer, method: getAll, match: "()", note: "SymbolSetIndexer.getAll"}
  - {class: com.github.curiousoddman.rgxgen.RgxGen, method: forPattern, match: "(String pattern)", note: "RgxGen.forPattern"}
  - {class: com.github.curiousoddman.rgxgen.RgxGen, method: parse, match: "(String pattern)", note: "RgxGen.parse"}
  - {class: com.github.curiousoddman.rgxgen.config.RgxGenOption, method: getFromPropertiesOrDefault, match: "(RgxGenProperties properties)", note: "RgxGenOption.getFromPropertiesOrDefault"}
  - {class: com.github.curiousoddman.rgxgen.config.RgxGenOption, method: getFromProperties, match: "(RgxGenProperties properties)", note: "RgxGenOption.getFromProperties"}
  - {class: com.github.curiousoddman.rgxgen.iterators.CaseVariationIterator, method: reset, match: "()", note: "CaseVariationIterator.reset"}
  - {class: com.github.curiousoddman.rgxgen.iterators.CaseVariationIterator, method: current, match: "()", note: "CaseVariationIterator.current"}
  - {class: com.github.curiousoddman.rgxgen.iterators.ChoiceIterator, method: current, match: "()", note: "ChoiceIterator.current"}
  - {class: com.github.curiousoddman.rgxgen.iterators.ChoiceIterator, method: reset, match: "()", note: "ChoiceIterator.reset"}
  - {class: com.github.curiousoddman.rgxgen.iterators.IncrementalLengthIterator, method: reset, match: "()", note: "IncrementalLengthIterator.reset"}
