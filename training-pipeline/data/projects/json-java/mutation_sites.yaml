# Curated performance-mutation sites for json-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants json-java --source data/external-src/<checkout> \
#       --sites data/projects/json-java/mutation_sites.yaml

package_root: org.json

sites:
  - {class: org.json.CookieList, method: toJSONObject, match: "(String string) throws JSONException", note: "CookieList.toJSONObject"}
  - {class: org.json.JSONArray, method: iterator, match: "()", note: "JSONArray.iterator"}
  - {class: org.json.JSONArray, method: getBoolean, match: "(int index) throws JSONException", note: "JSONArray.getBoolean"}
  - {class: org.json.JSONArray, method: getDouble, match: "(int index) throws JSONException", note: "JSONArray.getDouble"}
  - {class: org.json.JSONArray, method: getFloat, match: "(int index) throws JSONException", note: "JSONArray.getFloat"}
  - {class: org.json.JSONMLParserConfiguration, method: withKeepStrings, match: "(final boolean newVal)", note: "JSONMLParserConfiguration.withKeepStrings"}
  - {class: org.json.JSONMLParserConfiguration, method: withMaxNestingDepth, match: "(int maxNestingDepth)", note: "JSONMLParserConfiguration.withMaxNestingDepth"}
  - {class: org.json.JSONParserConfiguration, method: withMaxNestingDepth, match: "(final int maxNestingDepth)", note: "JSONParserConfiguration.withMaxNestingDepth"}
  - {class: org.json.JSONParserConfiguration, method: withOverwriteDuplicateKey, match: "(final boolean overwriteDuplicateKey)", note: "JSONParserConfiguration.withOverwriteDuplicateKey"}
  - {class: org.json.JSONParserConfiguration, method: withUseNativeNulls, match: "(final boolean useNativeNulls)", note: "JSONParserConfiguration.withUseNativeNulls"}
  - {class: org.json.JSONParserConfiguration, method: withStrictMode, match: "()", note: "JSONParserConfiguration.withStrictMode"}
  - {class: org.json.ParserConfiguration, method: isKeepStrings, match: "()", note: "ParserConfiguration.isKeepStrings"}
  - {class: org.json.ParserConfiguration, method: withKeepStrings, match: "(final boolean newVal)", note: "ParserConfiguration.withKeepStrings"}
  - {class: org.json.ParserConfiguration, method: getMaxNestingDepth, match: "()", note: "ParserConfiguration.getMaxNestingDepth"}
  - {class: org.json.ParserConfiguration, method: withMaxNestingDepth, match: "(int maxNestingDepth)", note: "ParserConfiguration.withMaxNestingDepth"}
  - {class: org.json.StringBuilderWriter, method: append, match: "(CharSequence csq)", note: "StringBuilderWriter.append"}
  - {class: org.json.StringBuilderWriter, method: append, match: "(CharSequence csq, int start, int end)", note: "StringBuilderWriter.append"}
  - {class: org.json.StringBuilderWriter, method: append, match: "(char c)", note: "StringBuilderWriter.append"}
  - {class: org.json.StringBuilderWriter, method: close, match: "() throws IOException", note: "StringBuilderWriter.close"}
  - {class: org.json.XMLParserConfiguration, method: withKeepStrings, match: "(final boolean newVal)", note: "XMLParserConfiguration.withKeepStrings"}
  - {class: org.json.XMLParserConfiguration, method: withKeepNumberAsString, match: "(final boolean newVal)", note: "XMLParserConfiguration.withKeepNumberAsString"}
  - {class: org.json.XMLParserConfiguration, method: withKeepBooleanAsString, match: "(final boolean newVal)", note: "XMLParserConfiguration.withKeepBooleanAsString"}
  - {class: org.json.XMLParserConfiguration, method: getcDataTagName, match: "()", note: "XMLParserConfiguration.getcDataTagName"}
  - {class: org.json.CDL, method: rowToJSONArray, match: "(JSONTokener x) throws JSONException", note: "CDL.rowToJSONArray"}
  - {class: org.json.CDL, method: rowToJSONArray, match: "(JSONTokener x, char delimiter) throws JSONException", note: "CDL.rowToJSONArray"}
  - {class: org.json.CDL, method: rowToJSONObject, match: "(JSONArray names, JSONTokener x) throws JSONException", note: "CDL.rowToJSONObject"}
  - {class: org.json.CDL, method: rowToJSONObject, match: "(JSONArray names, JSONTokener x, char delimiter) throws JSONException", note: "CDL.rowToJSONObject"}
  - {class: org.json.Cookie, method: escape, match: "(String string)", note: "Cookie.escape"}
  - {class: org.json.Cookie, method: toJSONObject, match: "(String string)", note: "Cookie.toJSONObject"}
  - {class: org.json.Cookie, method: unescape, match: "(String string)", note: "Cookie.unescape"}
  - {class: org.json.HTTP, method: toJSONObject, match: "(String string) throws JSONException", note: "HTTP.toJSONObject"}
  - {class: org.json.HTTPTokener, method: nextToken, match: "() throws JSONException", note: "HTTPTokener.nextToken"}
  - {class: org.json.JSONML, method: toJSONArray, match: "(String string) throws JSONException", note: "JSONML.toJSONArray"}
  - {class: org.json.JSONML, method: toJSONArray, match: "(String string, boolean keepStrings) throws JSONException", note: "JSONML.toJSONArray"}
  - {class: org.json.JSONML, method: toJSONArray, match: "(String string, JSONMLParserConfiguration config) throws JSONException", note: "JSONML.toJSONArray"}
  - {class: org.json.JSONML, method: toJSONArray, match: "(XMLTokener x, JSONMLParserConfiguration config) throws JSONException", note: "JSONML.toJSONArray"}
  - {class: org.json.JSONObject, method: getMapType, match: "()", note: "JSONObject.getMapType"}
  - {class: org.json.JSONObject, method: accumulate, match: "(String key, Object value) throws JSONException", note: "JSONObject.accumulate"}
  - {class: org.json.JSONObject, method: append, match: "(String key, Object value) throws JSONException", note: "JSONObject.append"}
  - {class: org.json.JSONObject, method: doubleToString, match: "(double d)", note: "JSONObject.doubleToString"}
  - {class: org.json.JSONPointer, method: build, match: "()", note: "JSONPointer.build"}
  - {class: org.json.JSONPointer, method: append, match: "(String token)", note: "JSONPointer.append"}
  - {class: org.json.JSONPointer, method: append, match: "(int arrayIndex)", note: "JSONPointer.append"}
  - {class: org.json.JSONPointer, method: builder, match: "()", note: "JSONPointer.builder"}
  - {class: org.json.JSONTokener, method: getJsonParserConfiguration, match: "()", note: "JSONTokener.getJsonParserConfiguration"}
  - {class: org.json.JSONTokener, method: setJsonParserConfiguration, match: "(JSONParserConfiguration jsonParserConfiguration)", note: "JSONTokener.setJsonParserConfiguration"}
  - {class: org.json.JSONTokener, method: back, match: "() throws JSONException", note: "JSONTokener.back"}
  - {class: org.json.JSONTokener, method: dehexchar, match: "(char c)", note: "JSONTokener.dehexchar"}
  - {class: org.json.JSONWriter, method: array, match: "() throws JSONException", note: "JSONWriter.array"}
  - {class: org.json.JSONWriter, method: endArray, match: "() throws JSONException", note: "JSONWriter.endArray"}
