# Curated performance-mutation sites for completely (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants completely --source data/external-src/<checkout> \
#       --sites data/projects/completely/mutation_sites.yaml

package_root: com.miguelfonseca.completely

sites:
  - {class: com.miguelfonseca.completely.Aggregator, method: addAll, match: "(Collection<ScoredObject<T>> elements)", note: "Aggregator.addAll"}
  - {class: com.miguelfonseca.completely.common.Strings, method: getCommonPrefixLength, match: "(@Nullable String a, @Nullable String b)", note: "Strings.getCommonPrefixLength"}
  - {class: com.miguelfonseca.completely.data.SampleRecord, method: getFields, match: "()", note: "SampleRecord.getFields"}
  - {class: com.miguelfonseca.completely.text.index.HashMultiMap, method: clear, match: "()", note: "HashMultiMap.clear"}
  - {class: com.miguelfonseca.completely.util.ArraySet, method: addAll, match: "(Collection<? extends E> elements)", note: "ArraySet.addAll"}
  - {class: com.miguelfonseca.completely.Aggregator, method: isEmpty, match: "()", note: "Aggregator.isEmpty"}
  - {class: com.miguelfonseca.completely.common.Precondition, method: checkArgument, match: "(boolean expression)", note: "Precondition.checkArgument"}
  - {class: com.miguelfonseca.completely.data.SampleRecord, method: getName, match: "()", note: "SampleRecord.getName"}
  - {class: com.miguelfonseca.completely.text.index.HashMultiMap, method: getAll, match: "(String key)", note: "HashMultiMap.getAll"}
  - {class: com.miguelfonseca.completely.util.ArraySet, method: iterator, match: "()", note: "ArraySet.iterator"}
  - {class: com.miguelfonseca.completely.Aggregator, method: retain, match: "(ScoredObject<T> element)", note: "Aggregator.retain"}
  - {class: com.miguelfonseca.completely.common.Precondition, method: checkArgument, match: "(boolean expression, @Nullable String message)", note: "Precondition.checkArgument"}
  - {class: com.miguelfonseca.completely.data.ScoredObject, method: getObject, match: "()", note: "ScoredObject.getObject"}
  - {class: com.miguelfonseca.completely.text.index.HashMultiMap, method: isEmpty, match: "()", note: "HashMultiMap.isEmpty"}
  - {class: com.miguelfonseca.completely.util.ArraySet, method: removeAll, match: "(Collection<?> elements)", note: "ArraySet.removeAll"}
  - {class: com.miguelfonseca.completely.Aggregator, method: retainAll, match: "(Collection<ScoredObject<T>> elements)", note: "Aggregator.retainAll"}
  - {class: com.miguelfonseca.completely.common.Precondition, method: checkArithmetic, match: "(boolean expression)", note: "Precondition.checkArithmetic"}
  - {class: com.miguelfonseca.completely.data.ScoredObject, method: getScore, match: "()", note: "ScoredObject.getScore"}
  - {class: com.miguelfonseca.completely.text.index.HashMultiMap, method: putAll, match: "(String key, Collection<V> values)", note: "HashMultiMap.putAll"}
  - {class: com.miguelfonseca.completely.util.ArraySet, method: size, match: "()", note: "ArraySet.size"}
  - {class: com.miguelfonseca.completely.Aggregator, method: size, match: "()", note: "Aggregator.size"}
  - {class: com.miguelfonseca.completely.common.Precondition, method: checkArithmetic, match: "(boolean expression, @Nullable String message)", note: "Precondition.checkArithmetic"}
  - {class: com.miguelfonseca.completely.data.ScoredObject, method: compareTo, match: "(ScoredObject<T> other)", note: "ScoredObject.compareTo"}
  - {class: com.miguelfonseca.completely.text.index.HashMultiMap, method: removeAll, match: "(Collection<V> values)", note: "HashMultiMap.removeAll"}
