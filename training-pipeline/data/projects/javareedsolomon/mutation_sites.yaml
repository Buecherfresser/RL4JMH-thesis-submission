  - {class: com.backblaze.erasure.ReedSolomon, method: isParityCorrect, match: "(byte[][] shards, int firstByte, int byteCount, byte [] tempBuffer)", note: "ReedSolomon.isParityCorrect"}
  - {class: com.backblaze.erasure.ReedSolomon, method: decodeMissing, match: "(byte [] [] shards,", note: "ReedSolomon.decodeMissing"}
  - {class: com.backblaze.erasure.ReedSolomonBenchmark, method: main, match: "(String [] args)", note: "ReedSolomonBenchmark.main"}
  - {class: com.backblaze.erasure.ReedSolomonBenchmark, method: run, match: "()", note: "ReedSolomonBenchmark.run"}
  - {class: com.backblaze.erasure.ReedSolomonBenchmark, method: getRate, match: "()", note: "ReedSolomonBenchmark.getRate"}
