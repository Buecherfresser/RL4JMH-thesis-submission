  - {class: io.vavr.jackson.datatype.VavrModule, method: deserializeNullAsEmptyCollection, match: "()", note: "VavrModule.deserializeNullAsEmptyCollection"}
  - {class: io.vavr.jackson.datatype.VavrTypeModifier, method: modifyType, match: "(JavaType type, Type jdkType, TypeBindings bindings, TypeFactory typeFactory)", note: "VavrTypeModifier.modifyType"}
