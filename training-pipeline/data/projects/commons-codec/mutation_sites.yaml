# Curated performance-mutation sites for commons-codec (GRPO RL corpus).
#
# Hand-picked from good_classes.yaml: concrete classes and hot ~once-per-call public
# methods (encode/decode/hash/aggregate/set-algebra kernels) that a JMH benchmark drives
# once per invocation. Several methods per class => ``killed / in-class mutants`` rewards
# benchmark coverage of the subject's core operations.
#
# Regenerate with:
#   jmh-make-mutants commons-codec --source data/external-src/commons-codec \
#       --sites data/projects/commons-codec/mutation_sites.yaml

package_root: org.apache.commons.codec

sites:
  - {class: org.apache.commons.codec.binary.Base64, method: decodeBase64, match: "(final byte[] base64Data)", note: "Base64.decodeBase64"}
  - {class: org.apache.commons.codec.binary.Base64, method: decodeInteger, match: "(final byte[] pArray)", note: "Base64.decodeInteger"}
  - {class: org.apache.commons.codec.binary.Base64, method: encodeBase64, match: "(final byte[] binaryData)", note: "Base64.encodeBase64"}
  - {class: org.apache.commons.codec.binary.Base32, method: Builder, match: "()", note: "Base32.Builder"}
  - {class: org.apache.commons.codec.binary.Hex, method: decodeHex, match: "(final char[] data) throws DecoderException", note: "Hex.decodeHex"}
  - {class: org.apache.commons.codec.binary.Hex, method: encodeHex, match: "(final byte[] data)", note: "Hex.encodeHex"}
  - {class: org.apache.commons.codec.binary.Hex, method: encodeHexString, match: "(final byte[] data)", note: "Hex.encodeHexString"}
  - {class: org.apache.commons.codec.binary.BinaryCodec, method: fromAscii, match: "(final byte[] ascii)", note: "BinaryCodec.fromAscii"}
  - {class: org.apache.commons.codec.digest.DigestUtils, method: md2, match: "(final byte[] data)", note: "DigestUtils.md2"}
  - {class: org.apache.commons.codec.digest.DigestUtils, method: md2Hex, match: "(final byte[] data)", note: "DigestUtils.md2Hex"}
  - {class: org.apache.commons.codec.digest.DigestUtils, method: md5, match: "(final byte[] data)", note: "DigestUtils.md5"}
  - {class: org.apache.commons.codec.digest.Blake3, method: keyedHash, match: "(final byte[] key, final byte[] data)", note: "Blake3.keyedHash"}
  - {class: org.apache.commons.codec.language.Soundex, method: soundex, match: "(String str)", note: "Soundex.soundex"}
  - {class: org.apache.commons.codec.language.RefinedSoundex, method: soundex, match: "(String str)", note: "RefinedSoundex.soundex"}
  - {class: org.apache.commons.codec.language.Metaphone, method: metaphone, match: "(final String txt)", note: "Metaphone.metaphone"}
  - {class: org.apache.commons.codec.language.DoubleMetaphone, method: doubleMetaphone, match: "(final String value)", note: "DoubleMetaphone.doubleMetaphone"}
  - {class: org.apache.commons.codec.language.DoubleMetaphone, method: DoubleMetaphoneResult, match: "(final int maxLength)", note: "DoubleMetaphone.DoubleMetaphoneResult"}
  - {class: org.apache.commons.codec.language.Nysiis, method: nysiis, match: "(String str)", note: "Nysiis.nysiis"}
  - {class: org.apache.commons.codec.language.ColognePhonetic, method: colognePhonetic, match: "(final String text)", note: "ColognePhonetic.colognePhonetic"}
  - {class: org.apache.commons.codec.language.ColognePhonetic, method: removeNext, match: "()", note: "ColognePhonetic.removeNext"}
  - {class: org.apache.commons.codec.language.ColognePhonetic, method: CologneBuffer, match: "(final char[] data)", note: "ColognePhonetic.CologneBuffer"}
  - {class: org.apache.commons.codec.net.URLCodec, method: decodeUrl, match: "(final byte[] bytes) throws DecoderException", note: "URLCodec.decodeUrl"}
  - {class: org.apache.commons.codec.net.URLCodec, method: encodeUrl, match: "(BitSet urlsafe, final byte[] bytes)", note: "URLCodec.encodeUrl"}
