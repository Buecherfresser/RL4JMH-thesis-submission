# Curated performance-mutation sites for asn1bean (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants asn1bean --source data/external-src/<checkout> \
#       --sites data/projects/asn1bean/mutation_sites.yaml

package_root: com.beanit.asn1bean

