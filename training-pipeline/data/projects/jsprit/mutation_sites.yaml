# Curated performance-mutation sites for jsprit (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jsprit --source data/external-src/<checkout> \
#       --sites data/projects/jsprit/mutation_sites.yaml

package_root: com.graphhopper.jsprit

sites:
  - {class: com.graphhopper.jsprit.analysis.toolbox.AlgorithmSearchProgressChartListener, method: informAlgorithmEnds, match: "(VehicleRoutingProblem problem, Collection<VehicleRoutingProblemSolution> solutions)", note: "AlgorithmSearchProgressChartListener.informAlgorithmEnds"}
  - {class: com.graphhopper.jsprit.core.algorithm.AlgorithmUtil, method: addCoreConstraints, match: "(ConstraintManager constraintManager, StateManager stateManager, final VehicleRoutingProblem vrp)", note: "AlgorithmUtil.addCoreConstraints"}
  - {class: com.graphhopper.jsprit.analysis.toolbox.AlgorithmSearchProgressChartListener, method: informIterationEnds, match: "(int i, VehicleRoutingProblem problem, Collection<VehicleRoutingProblemSolution> solutions)", note: "AlgorithmSearchProgressChartListener.informIterationEnds"}
  - {class: com.graphhopper.jsprit.core.algorithm.PrettyAlgorithmBuilder, method: newInstance, match: "(VehicleRoutingProblem vrp, VehicleFleetManager fleetManager, StateManager stateManager, ConstraintManager constraintManager)", note: "PrettyAlgorithmBuilder.newInstance"}
  - {class: com.graphhopper.jsprit.analysis.toolbox.GraphStreamViewer, method: labelWith, match: "(Label label)", note: "GraphStreamViewer.labelWith"}
  - {class: com.graphhopper.jsprit.core.algorithm.PrettyAlgorithmBuilder, method: setRandom, match: "(Random random)", note: "PrettyAlgorithmBuilder.setRandom"}
  - {class: com.graphhopper.jsprit.analysis.toolbox.GraphStreamViewer, method: setRenderDelay, match: "(long ms)", note: "GraphStreamViewer.setRenderDelay"}
  - {class: com.graphhopper.jsprit.core.algorithm.listener.VehicleRoutingAlgorithmListeners, method: getPriority, match: "()", note: "VehicleRoutingAlgorithmListeners.getPriority"}
  - {class: com.graphhopper.jsprit.analysis.toolbox.XYLineChartBuilder, method: saveChartAsPNG, match: "(JFreeChart chart, String pngFilename)", note: "XYLineChartBuilder.saveChartAsPNG"}
  - {class: com.graphhopper.jsprit.core.algorithm.listener.VehicleRoutingAlgorithmListeners, method: getListener, match: "()", note: "VehicleRoutingAlgorithmListeners.getListener"}
  - {class: com.graphhopper.jsprit.analysis.toolbox.XYLineChartBuilder, method: newInstance, match: "(String chartTitle, String xDomainName, String yDomainName)", note: "XYLineChartBuilder.newInstance"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.AverageRegretKScoringFunction, method: score, match: "(RegretKAlternatives alternatives, Job job)", note: "AverageRegretKScoringFunction.score"}
  - {class: com.graphhopper.jsprit.analysis.toolbox.AlgorithmEventsRecorder, method: setRecordingRange, match: "(int startIteration, int endIteration)", note: "AlgorithmEventsRecorder.setRecordingRange"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.AverageRegretKScoringFunction, method: getK, match: "()", note: "AverageRegretKScoringFunction.getK"}
  - {class: com.graphhopper.jsprit.analysis.toolbox.AlgorithmEventsRecorder, method: ruinStarts, match: "(Collection<VehicleRoute> routes)", note: "AlgorithmEventsRecorder.ruinStarts"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.BestInsertionBuilder, method: setRouteLevel, match: "(int forwardLooking, int memory)", note: "BestInsertionBuilder.setRouteLevel"}
  - {class: com.graphhopper.jsprit.analysis.toolbox.AlgorithmEventsViewer, method: setRuinDelay, match: "(long ruinDelay)", note: "AlgorithmEventsViewer.setRuinDelay"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.BestInsertionBuilder, method: setRouteLevel, match: "(int forwardLooking, int memory, boolean addDefaultMarginalCostCalculation)", note: "BestInsertionBuilder.setRouteLevel"}
  - {class: com.graphhopper.jsprit.analysis.toolbox.AlgorithmEventsViewer, method: setRecreateDelay, match: "(long recreateDelay)", note: "AlgorithmEventsViewer.setRecreateDelay"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.DefaultRegretScoringFunction, method: score, match: "(InsertionData best, InsertionData secondBest, Job job)", note: "DefaultRegretScoringFunction.score"}
  - {class: com.graphhopper.jsprit.analysis.toolbox.Plotter, method: getItemShape, match: "(int seriesIndex, int itemIndex)", note: "Plotter.getItemShape"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.EventListeners, method: inform, match: "(Event event)", note: "EventListeners.inform"}
  - {class: com.graphhopper.jsprit.analysis.toolbox.Plotter, method: getItemOutlinePaint, match: "(int seriesIndex, int itemIndex)", note: "Plotter.getItemOutlinePaint"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.InsertActivityListener, method: inform, match: "(Event event)", note: "InsertActivityListener.inform"}
  - {class: com.graphhopper.jsprit.analysis.toolbox.StopWatch, method: informAlgorithmStarts, match: "(VehicleRoutingProblem problem, VehicleRoutingAlgorithm algorithm, Collection<VehicleRoutingProblemSolution> solutions)", note: "StopWatch.informAlgorithmStarts"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.InsertBreakListener, method: inform, match: "(Event event)", note: "InsertBreakListener.inform"}
  - {class: com.graphhopper.jsprit.analysis.toolbox.StopWatch, method: getCompTimeInSeconds, match: "()", note: "StopWatch.getCompTimeInSeconds"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.InsertionBuilder, method: setInsertionStrategy, match: "(Strategy strategy)", note: "InsertionBuilder.setInsertionStrategy"}
  - {class: com.graphhopper.jsprit.analysis.toolbox.StrategyAnalyser, method: selected, match: "()", note: "StrategyAnalyser.selected"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.InsertionBuilder, method: setRouteLevel, match: "(int forwardLooking, int memory)", note: "InsertionBuilder.setRouteLevel"}
  - {class: com.graphhopper.jsprit.analysis.toolbox.StrategyAnalyser, method: improvedSolution, match: "(double improvement)", note: "StrategyAnalyser.improvedSolution"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.InsertionStrategyBuilder, method: setShipmentInsertionCalculatorFactory, match: "(JobInsertionCostsCalculatorFactory shipmentInsertionCalculatorFactory)", note: "InsertionStrategyBuilder.setShipmentInsertionCalculatorFactory"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.InsertionStrategyBuilder, method: setServiceInsertionCalculator, match: "(JobInsertionCostsCalculatorFactory serviceInsertionCalculator)", note: "InsertionStrategyBuilder.setServiceInsertionCalculator"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.JobInsertionCostsCalculatorBuilder, method: getCalculator, match: "()", note: "JobInsertionCostsCalculatorBuilder.getCalculator"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.JobInsertionCostsCalculatorBuilder, method: getAlgorithmListener, match: "()", note: "JobInsertionCostsCalculatorBuilder.getAlgorithmListener"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.MaxRegretKScoringFunction, method: score, match: "(RegretKAlternatives alternatives, Job job)", note: "MaxRegretKScoringFunction.score"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.MaxRegretKScoringFunction, method: getK, match: "()", note: "MaxRegretKScoringFunction.getK"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.RegretKScoringFunctionAdapter, method: score, match: "(RegretKAlternatives alternatives, Job job)", note: "RegretKScoringFunctionAdapter.score"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.RegretKScoringFunctionAdapter, method: getLegacyScoringFunction, match: "()", note: "RegretKScoringFunctionAdapter.getLegacyScoringFunction"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.RegretKScoringFunctionFactory, method: create, match: "(Strategy strategy, int k, ScoringFunction additionalScorer)", note: "RegretKScoringFunctionFactory.create"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.RegretKScoringFunctionFactory, method: create, match: "(String strategyName, int k, ScoringFunction additionalScorer)", note: "RegretKScoringFunctionFactory.create"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.SumRegretKScoringFunction, method: score, match: "(RegretKAlternatives alternatives, Job job)", note: "SumRegretKScoringFunction.score"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.SumRegretKScoringFunction, method: getK, match: "()", note: "SumRegretKScoringFunction.getK"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.SwitchVehicleListener, method: inform, match: "(Event event)", note: "SwitchVehicleListener.inform"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.listener.InsertionListeners, method: getListeners, match: "()", note: "InsertionListeners.getListeners"}
  - {class: com.graphhopper.jsprit.core.algorithm.recreate.listener.InsertionListeners, method: informJobInserted, match: "(Job insertedJob, VehicleRoute inRoute, InsertionData insertionData)", note: "InsertionListeners.informJobInserted"}
  - {class: com.graphhopper.jsprit.core.algorithm.ruin.RuinString, method: setNoRoutes, match: "(int kMin, int kMax)", note: "RuinString.setNoRoutes"}
  - {class: com.graphhopper.jsprit.core.algorithm.ruin.RuinString, method: setStringLength, match: "(int lMin, int lMax)", note: "RuinString.setStringLength"}
  - {class: com.graphhopper.jsprit.core.algorithm.ruin.listener.RuinListeners, method: ruinStarts, match: "(Collection<VehicleRoute> routes)", note: "RuinListeners.ruinStarts"}
  - {class: com.graphhopper.jsprit.core.algorithm.ruin.listener.RuinListeners, method: ruinEnds, match: "(Collection<VehicleRoute> routes, Collection<Job> unassignedJobs)", note: "RuinListeners.ruinEnds"}
