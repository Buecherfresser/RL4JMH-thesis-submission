  - {class: com.landawn.abacus.exception.ParsingException, method: getErrorToken, match: "()", note: "ParsingException.getErrorToken"}
  - {class: com.landawn.abacus.guava.hash.GuavaHashFunction, method: newHasher, match: "()", note: "GuavaHashFunction.newHasher"}
  - {class: com.landawn.abacus.http.HARUtil, method: setThreadLocalHeaderFilter, match: "(final BiPredicate<? super String, String> httpHeaderFilterForHARRequest) throws IllegalArgumentException", note: "HARUtil.setThreadLocalHeaderFilter"}
