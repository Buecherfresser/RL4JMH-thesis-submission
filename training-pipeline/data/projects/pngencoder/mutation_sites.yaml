  - {class: com.pngencoder.PngEncoder, method: toStream, match: "(OutputStream outputStream)", note: "PngEncoder.toStream"}
  - {class: com.pngencoder.PngEncoder, method: toFile, match: "(Path filePath)", note: "PngEncoder.toFile"}
  - {class: com.pngencoder.PngEncoder, method: toFile, match: "(File file)", note: "PngEncoder.toFile"}
