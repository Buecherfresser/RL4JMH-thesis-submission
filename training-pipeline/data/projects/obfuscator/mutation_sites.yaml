  - {class: me.superblaubeere27.jobf.JObfImpl, method: getMainClass, match: "()", note: "JObfImpl.getMainClass"}
  - {class: me.superblaubeere27.jobf.processors.HWIDProtection, method: process, match: "(ProcessorCallback callback, ClassNode node)", note: "HWIDProtection.process"}
  - {class: me.superblaubeere27.jobf.utils.NodeUtils, method: prettyprint, match: "(AbstractInsnNode insnNode)", note: "NodeUtils.prettyprint"}
  - {class: me.superblaubeere27.jobf.ObfuscatorClassLoader, method: findClass, match: "(String name) throws ClassNotFoundException", note: "ObfuscatorClassLoader.findClass"}
