# Curated performance-mutation sites for h3-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants h3-java --source data/external-src/<checkout> \
#       --sites data/projects/h3-java/mutation_sites.yaml

package_root: com.uber.h3core

sites:
  - {class: com.uber.h3core.H3Core, method: newInstance, match: "() throws IOException", note: "H3Core.newInstance"}
  - {class: com.uber.h3core.exceptions.H3Exception, method: getCode, match: "()", note: "H3Exception.getCode"}
  - {class: com.uber.h3core.H3Core, method: newSystemInstance, match: "()", note: "H3Core.newSystemInstance"}
  - {class: com.uber.h3core.exceptions.H3Exception, method: codeToMessage, match: "(int code)", note: "H3Exception.codeToMessage"}
  - {class: com.uber.h3core.H3Core, method: isValidCell, match: "(long h3)", note: "H3Core.isValidCell"}
  - {class: com.uber.h3core.H3Core, method: isValidCell, match: "(String h3Address)", note: "H3Core.isValidCell"}
  - {class: com.uber.h3core.H3Core, method: isValidIndex, match: "(long h3)", note: "H3Core.isValidIndex"}
  - {class: com.uber.h3core.H3Core, method: isValidIndex, match: "(String h3Address)", note: "H3Core.isValidIndex"}
  - {class: com.uber.h3core.H3Core, method: constructCell, match: "(int baseCellNumber, List<Integer> digits, int res)", note: "H3Core.constructCell"}
  - {class: com.uber.h3core.H3Core, method: constructCell, match: "(int baseCellNumber, List<Integer> digits)", note: "H3Core.constructCell"}
  - {class: com.uber.h3core.H3Core, method: constructCellAddress, match: "(int baseCellNumber, List<Integer> digits)", note: "H3Core.constructCellAddress"}
  - {class: com.uber.h3core.H3Core, method: constructCellAddress, match: "(int baseCellNumber, List<Integer> digits, int res)", note: "H3Core.constructCellAddress"}
  - {class: com.uber.h3core.H3Core, method: getBaseCellNumber, match: "(long h3)", note: "H3Core.getBaseCellNumber"}
  - {class: com.uber.h3core.H3Core, method: getBaseCellNumber, match: "(String h3Address)", note: "H3Core.getBaseCellNumber"}
  - {class: com.uber.h3core.H3Core, method: isPentagon, match: "(long h3)", note: "H3Core.isPentagon"}
  - {class: com.uber.h3core.H3Core, method: isPentagon, match: "(String h3Address)", note: "H3Core.isPentagon"}
  - {class: com.uber.h3core.H3Core, method: latLngToCell, match: "(double lat, double lng, int res)", note: "H3Core.latLngToCell"}
  - {class: com.uber.h3core.H3Core, method: latLngToCellAddress, match: "(double lat, double lng, int res)", note: "H3Core.latLngToCellAddress"}
  - {class: com.uber.h3core.H3Core, method: cellToLatLng, match: "(long h3)", note: "H3Core.cellToLatLng"}
  - {class: com.uber.h3core.H3Core, method: cellToLatLng, match: "(String h3Address)", note: "H3Core.cellToLatLng"}
  - {class: com.uber.h3core.H3Core, method: cellToBoundary, match: "(long h3)", note: "H3Core.cellToBoundary"}
  - {class: com.uber.h3core.H3Core, method: cellToBoundary, match: "(String h3Address)", note: "H3Core.cellToBoundary"}
  - {class: com.uber.h3core.H3Core, method: gridDisk, match: "(String h3Address, int k)", note: "H3Core.gridDisk"}
  - {class: com.uber.h3core.H3Core, method: gridDisk, match: "(long h3, int k)", note: "H3Core.gridDisk"}
  - {class: com.uber.h3core.H3Core, method: gridDiskDistances, match: "(String h3Address, int k)", note: "H3Core.gridDiskDistances"}
  - {class: com.uber.h3core.H3Core, method: gridDiskDistances, match: "(long h3, int k)", note: "H3Core.gridDiskDistances"}
  - {class: com.uber.h3core.H3Core, method: gridDiskUnsafe, match: "(String h3Address, int k)", note: "H3Core.gridDiskUnsafe"}
  - {class: com.uber.h3core.H3Core, method: gridDiskUnsafe, match: "(long h3, int k)", note: "H3Core.gridDiskUnsafe"}
  - {class: com.uber.h3core.H3Core, method: gridRing, match: "(String h3Address, int k)", note: "H3Core.gridRing"}
  - {class: com.uber.h3core.H3Core, method: gridRing, match: "(long h3, int k)", note: "H3Core.gridRing"}
  - {class: com.uber.h3core.H3Core, method: gridRingUnsafe, match: "(String h3Address, int k)", note: "H3Core.gridRingUnsafe"}
  - {class: com.uber.h3core.H3Core, method: gridRingUnsafe, match: "(long h3, int k)", note: "H3Core.gridRingUnsafe"}
  - {class: com.uber.h3core.H3Core, method: gridDistance, match: "(String a, String b)", note: "H3Core.gridDistance"}
  - {class: com.uber.h3core.H3Core, method: gridDistance, match: "(long a, long b)", note: "H3Core.gridDistance"}
  - {class: com.uber.h3core.H3Core, method: cellToLocalIj, match: "(long origin, long h3)", note: "H3Core.cellToLocalIj"}
  - {class: com.uber.h3core.H3Core, method: cellToLocalIj, match: "(String originAddress, String h3Address)", note: "H3Core.cellToLocalIj"}
  - {class: com.uber.h3core.H3Core, method: localIjToCell, match: "(long origin, CoordIJ ij)", note: "H3Core.localIjToCell"}
  - {class: com.uber.h3core.H3Core, method: localIjToCell, match: "(String originAddress, CoordIJ ij)", note: "H3Core.localIjToCell"}
  - {class: com.uber.h3core.H3Core, method: gridPathCells, match: "(String startAddress, String endAddress)", note: "H3Core.gridPathCells"}
  - {class: com.uber.h3core.H3Core, method: gridPathCells, match: "(long start, long end)", note: "H3Core.gridPathCells"}
  - {class: com.uber.h3core.H3Core, method: polygonToCells, match: "(List<LatLng> points, List<List<LatLng>> holes, int res)", note: "H3Core.polygonToCells"}
  - {class: com.uber.h3core.H3Core, method: cellsToMultiPolygon, match: "(Collection<Long> h3, boolean geoJson)", note: "H3Core.cellsToMultiPolygon"}
  - {class: com.uber.h3core.H3Core, method: getResolution, match: "(String h3Address)", note: "H3Core.getResolution"}
  - {class: com.uber.h3core.H3Core, method: getResolution, match: "(long h3)", note: "H3Core.getResolution"}
  - {class: com.uber.h3core.H3Core, method: getIndexDigit, match: "(String h3Address, int res)", note: "H3Core.getIndexDigit"}
  - {class: com.uber.h3core.H3Core, method: getIndexDigit, match: "(long h3, int res)", note: "H3Core.getIndexDigit"}
  - {class: com.uber.h3core.H3Core, method: cellToParent, match: "(long h3, int res)", note: "H3Core.cellToParent"}
  - {class: com.uber.h3core.H3Core, method: cellToParentAddress, match: "(String h3Address, int res)", note: "H3Core.cellToParentAddress"}
  - {class: com.uber.h3core.H3Core, method: cellToChildren, match: "(String h3Address, int childRes)", note: "H3Core.cellToChildren"}
  - {class: com.uber.h3core.H3Core, method: cellToChildren, match: "(long h3, int childRes)", note: "H3Core.cellToChildren"}
