# Maven JMH runner configuration. See jmhgen.config.RunnerConfig.
jmh_version: "1.37"
java_release: 17
mvn_executable: mvn
java_executable: java
compiler_plugin_version: "3.13.0"
shade_plugin_version: "3.6.0"
group_id: jmhgen.generated
work_root: null            # null -> system temp dir (.../jmhgen_work)
keep_work_dir: false

# Default JMH execution parameters. Small on purpose: cheap rewards during training.
# Faithful evaluation runs should override these (more iterations/forks).
jmh:
  warmup_iterations: 3
  measurement_iterations: 5
  forks: 1
  warmup_time: "1s"
  measurement_time: "1s"
  timeout_s: 600.0
  per_iteration_timeout_s: null
  fail_on_error: true
  jvm_args: []
  benchmark_filter: null
