  - {class: com.alipay.remoting.util.FutureTaskUtil, method: getFutureTaskResult, match: "(RunStateRecordedFutureTask<T> task, Logger logger)", note: "FutureTaskUtil.getFutureTaskResult"}
  - {class: com.alipay.remoting.ConnectionEventHandler, method: disconnect, match: "(ChannelHandlerContext ctx, ChannelPromise promise) throws Exception", note: "ConnectionEventHandler.disconnect"}
  - {class: com.alipay.remoting.config.switches.GlobalSwitch, method: turnOff, match: "(int index)", note: "GlobalSwitch.turnOff"}
  - {class: com.alipay.remoting.rpc.HeartbeatHandler, method: userEventTriggered, match: "(final ChannelHandlerContext ctx, Object evt) throws Exception", note: "HeartbeatHandler.userEventTriggered"}
  - {class: com.alipay.remoting.util.FutureTaskUtil, method: launderThrowable, match: "(Throwable t)", note: "FutureTaskUtil.launderThrowable"}
  - {class: com.alipay.remoting.ConnectionPool, method: removeAndTryClose, match: "(Connection connection)", note: "ConnectionPool.removeAndTryClose"}
  - {class: com.alipay.remoting.config.switches.ProtocolSwitch, method: turnOn, match: "(int index)", note: "ProtocolSwitch.turnOn"}
  - {class: com.alipay.remoting.rpc.ResponseCommand, method: getResponseTimeMillis, match: "()", note: "ResponseCommand.getResponseTimeMillis"}
  - {class: com.alipay.remoting.util.IoUtils, method: closeQuietly, match: "(Closeable closeable)", note: "IoUtils.closeQuietly"}
  - {class: com.alipay.remoting.ConnectionPool, method: removeAllAndTryClose, match: "()", note: "ConnectionPool.removeAllAndTryClose"}
  - {class: com.alipay.remoting.config.switches.ProtocolSwitch, method: turnOff, match: "(int index)", note: "ProtocolSwitch.turnOff"}
  - {class: com.alipay.remoting.rpc.ResponseCommand, method: setResponseTimeMillis, match: "(long responseTimeMillis)", note: "ResponseCommand.setResponseTimeMillis"}
  - {class: com.alipay.remoting.util.NettyEventLoopUtil, method: newEventLoopGroup, match: "(int nThreads, ThreadFactory threadFactory)", note: "NettyEventLoopUtil.newEventLoopGroup"}
