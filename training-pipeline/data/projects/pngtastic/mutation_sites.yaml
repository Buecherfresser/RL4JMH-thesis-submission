# Curated performance-mutation sites for pngtastic (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants pngtastic --source data/external-src/<checkout> \
#       --sites data/projects/pngtastic/mutation_sites.yaml

package_root: com.googlecode.pngtastic

sites:
  - {class: com.googlecode.pngtastic.PngtasticColorCounter, method: main, match: "(String[] args)", note: "PngtasticColorCounter.main"}
  - {class: com.googlecode.pngtastic.ant.PngOptimizerTask, method: getToDir, match: "()", note: "PngOptimizerTask.getToDir"}
  - {class: com.googlecode.pngtastic.core.processing.PngByteArrayOutputStream, method: reset, match: "()", note: "PngByteArrayOutputStream.reset"}
  - {class: com.googlecode.pngtastic.PngtasticLayerer, method: main, match: "(String[] args)", note: "PngtasticLayerer.main"}
  - {class: com.googlecode.pngtastic.ant.PngOptimizerTask, method: setToDir, match: "(String toDir)", note: "PngOptimizerTask.setToDir"}
  - {class: com.googlecode.pngtastic.core.processing.PngByteArrayOutputStream, method: len, match: "()", note: "PngByteArrayOutputStream.len"}
  - {class: com.googlecode.pngtastic.PngtasticOptimizer, method: main, match: "(String[] args)", note: "PngtasticOptimizer.main"}
  - {class: com.googlecode.pngtastic.ant.PngOptimizerTask, method: setFileSuffix, match: "(String fileSuffix)", note: "PngOptimizerTask.setFileSuffix"}
  - {class: com.googlecode.pngtastic.core.processing.zopfli.ZopfliOutputStream, method: close, match: "() throws IOException", note: "ZopfliOutputStream.close"}
  - {class: com.googlecode.pngtastic.core.Logger, method: debug, match: "(String message, Object... args)", note: "Logger.debug"}
  - {class: com.googlecode.pngtastic.core.Logger, method: info, match: "(String message, Object... args)", note: "Logger.info"}
  - {class: com.googlecode.pngtastic.core.Logger, method: error, match: "(String message, Object... args)", note: "Logger.error"}
  - {class: com.googlecode.pngtastic.core.PngChunk, method: getTypeString, match: "()", note: "PngChunk.getTypeString"}
  - {class: com.googlecode.pngtastic.core.PngChunk, method: getWidth, match: "()", note: "PngChunk.getWidth"}
  - {class: com.googlecode.pngtastic.core.PngChunk, method: getHeight, match: "()", note: "PngChunk.getHeight"}
  - {class: com.googlecode.pngtastic.core.PngChunkInserter, method: insert, match: "(PngImage image, PngChunk chunk) throws IOException", note: "PngChunkInserter.insert"}
  - {class: com.googlecode.pngtastic.core.PngColorCounter, method: getResult, match: "()", note: "PngColorCounter.getResult"}
  - {class: com.googlecode.pngtastic.core.PngColorCounter, method: getFileName, match: "()", note: "PngColorCounter.getFileName"}
  - {class: com.googlecode.pngtastic.core.PngColorCounter, method: getWidth, match: "()", note: "PngColorCounter.getWidth"}
  - {class: com.googlecode.pngtastic.core.PngFilterType, method: getValue, match: "()", note: "PngFilterType.getValue"}
  - {class: com.googlecode.pngtastic.core.PngFilterType, method: forValue, match: "(byte value)", note: "PngFilterType.forValue"}
  - {class: com.googlecode.pngtastic.core.PngFilterType, method: standardValues, match: "()", note: "PngFilterType.standardValues"}
  - {class: com.googlecode.pngtastic.core.PngImage, method: getFileName, match: "()", note: "PngImage.getFileName"}
  - {class: com.googlecode.pngtastic.core.PngImage, method: setFileName, match: "(String fileName)", note: "PngImage.setFileName"}
  - {class: com.googlecode.pngtastic.core.PngImage, method: getChunks, match: "()", note: "PngImage.getChunks"}
  - {class: com.googlecode.pngtastic.core.PngImageType, method: forColorType, match: "(int colorType)", note: "PngImageType.forColorType"}
  - {class: com.googlecode.pngtastic.core.PngImageType, method: channelCount, match: "()", note: "PngImageType.channelCount"}
  - {class: com.googlecode.pngtastic.core.PngLayerer, method: layer, match: "(PngImage baseImage, PngImage layerImage, Integer compressionLevel, boolean concurrent) throws IOException", note: "PngLayerer.layer"}
  - {class: com.googlecode.pngtastic.core.PngOptimizer, method: setGenerateDataUriCss, match: "(boolean generateDataUriCss)", note: "PngOptimizer.setGenerateDataUriCss"}
  - {class: com.googlecode.pngtastic.core.PngOptimizer, method: getResults, match: "()", note: "PngOptimizer.getResults"}
  - {class: com.googlecode.pngtastic.core.PngOptimizer, method: optimize, match: "(PngImage image, String outputFileName, boolean removeGamma, Integer compressionLevel)", note: "PngOptimizer.optimize"}
  - {class: com.googlecode.pngtastic.core.PngPixel, method: rgbaDistance, match: "(PngPixel other, int bits)", note: "PngPixel.rgbaDistance"}
  - {class: com.googlecode.pngtastic.core.PngPixel, method: rgba8Distance, match: "(PngPixel other)", note: "PngPixel.rgba8Distance"}
  - {class: com.googlecode.pngtastic.core.PngPixel, method: rgba16Distance, match: "(PngPixel other)", note: "PngPixel.rgba16Distance"}
  - {class: com.googlecode.pngtastic.core.PngReader, method: readRGBA8, match: "(final byte[] image)", note: "PngReader.readRGBA8"}
  - {class: com.googlecode.pngtastic.core.PngReader, method: readRGBA8, match: "(final PngImage image) throws IOException", note: "PngReader.readRGBA8"}
  - {class: com.googlecode.pngtastic.core.processing.Base64, method: encodeObject, match: "(Serializable serializableObject) throws IOException", note: "Base64.encodeObject"}
  - {class: com.googlecode.pngtastic.core.processing.Base64, method: encodeObject, match: "(Serializable serializableObject, int options) throws IOException", note: "Base64.encodeObject"}
  - {class: com.googlecode.pngtastic.core.processing.Base64, method: encodeBytes, match: "( byte[] source )", note: "Base64.encodeBytes"}
  - {class: com.googlecode.pngtastic.core.processing.PngtasticCompressionHandler, method: deflate, match: "(PngByteArrayOutputStream inflatedImageData, Integer compressionLevel, boolean concurrent) throws IOException", note: "PngtasticCompressionHandler.deflate"}
  - {class: com.googlecode.pngtastic.core.processing.PngtasticCompressionHandler, method: encodeBytes, match: "(byte[] bytes)", note: "PngtasticCompressionHandler.encodeBytes"}
  - {class: com.googlecode.pngtastic.core.processing.PngtasticCompressionHandler, method: run, match: "()", note: "PngtasticCompressionHandler.run"}
  - {class: com.googlecode.pngtastic.core.processing.PngtasticFilterHandler, method: applyFiltering, match: "(PngFilterType filterType, List<byte[]> scanlines, int sampleBitCount)", note: "PngtasticFilterHandler.applyFiltering"}
  - {class: com.googlecode.pngtastic.core.processing.PngtasticFilterHandler, method: applyAdaptiveFiltering, match: "(PngByteArrayOutputStream inflatedImageData, List<byte[]> scanlines, Map<PngFilterType, List<byte[]>> filteredScanLines, int sampleSize) throws IOException", note: "PngtasticFilterHandler.applyAdaptiveFiltering"}
  - {class: com.googlecode.pngtastic.core.processing.PngtasticFilterHandler, method: filter, match: "(byte[] line, byte[] previousLine, int sampleBitCount) throws PngException", note: "PngtasticFilterHandler.filter"}
  - {class: com.googlecode.pngtastic.core.processing.PngtasticInterlaceHandler, method: interlace, match: "(int width, int height, int sampleBitCount, byte[] inflatedImageData)", note: "PngtasticInterlaceHandler.interlace"}
  - {class: com.googlecode.pngtastic.core.processing.PngtasticInterlaceHandler, method: deInterlace, match: "(int width, int height, int sampleBitCount, PngByteArrayOutputStream inflatedImageData)", note: "PngtasticInterlaceHandler.deInterlace"}
  - {class: com.googlecode.pngtastic.core.processing.ZopfliCompressionHandler, method: deflate, match: "(PngByteArrayOutputStream inflatedImageData, Integer compressionLevel, boolean concurrent) throws IOException", note: "ZopfliCompressionHandler.deflate"}
  - {class: com.googlecode.pngtastic.core.processing.ZopfliCompressionHandler, method: encodeBytes, match: "(byte[] bytes)", note: "ZopfliCompressionHandler.encodeBytes"}
  - {class: com.googlecode.pngtastic.core.processing.zopfli.Deflate, method: greedy, match: "(Cookie cookie, LongestMatchCache lmc, byte[] input, int from,", note: "Deflate.greedy"}
