# Mutation-track metadata for Apache Commons Lang (consumed by jmh-provision-mutants).
# The mutation artefacts in this dir (mutations.patch, mutants.yaml, snippets.jsonl) are
# regenerated from the curated site list (mutation_sites.yaml) with:
#   jmh-make-mutants commons-lang --source data/external-src/commons-lang \
#       --sites data/projects/commons-lang/mutation_sites.yaml
name: commons-lang
display_name: Apache Commons Lang
version: "3.18.0"
package_root: org.apache.commons.lang3

# Pristine vendored source (gitignored under data/external-src/); the patch is applied to a
# throwaway copy of this tree by jmh-provision-mutants, never in place.
source_dir: data/external-src/commons-lang/src/main/java

mutations_patch: mutations.patch
mutants_registry: mutants.yaml
snippets: snippets.jsonl

# commons-lang3 has zero runtime dependencies, so a plain javac build needs no classpath.
java_release: 17
dependencies: []

# How mutants are armed/observed at run time (see the MutationSwitch added by the patch).
mutation:
  switch_class: org.apache.commons.lang3.jmhbench.MutationSwitch
  arm_property: jmhbench.mutant
  record_property: jmhbench.record

provenance:
  project: Apache Commons Lang
  url: https://github.com/apache/commons-lang
  tag: rel/commons-lang-3.18.0
