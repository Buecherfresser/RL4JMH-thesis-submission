# Curated performance-mutation sites for structures (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants structures --source data/external-src/<checkout> \
#       --sites data/projects/structures/mutation_sites.yaml

package_root: com.applications

sites:
  - {class: com.applications.Buffer, method: insert, match: "(char c)", note: "Buffer.insert"}
  - {class: com.applications.Buffer, method: delete, match: "()", note: "Buffer.delete"}
  - {class: com.applications.Buffer, method: left, match: "(int k)", note: "Buffer.left"}
  - {class: com.applications.Buffer, method: right, match: "(int k)", note: "Buffer.right"}
  - {class: com.applications.Buffer, method: size, match: "()", note: "Buffer.size"}
  - {class: com.applications.Buffer, method: main, match: "(String[] args)", note: "Buffer.main"}
  - {class: com.applications.RingBuffer, method: enqueue, match: "(String data)", note: "RingBuffer.enqueue"}
  - {class: com.applications.RingBuffer, method: dequeue, match: "()", note: "RingBuffer.dequeue"}
  - {class: com.applications.RingBuffer, method: isEmpty, match: "()", note: "RingBuffer.isEmpty"}
  - {class: com.applications.RingBuffer, method: isFull, match: "()", note: "RingBuffer.isFull"}
  - {class: com.applications.RingBuffer, method: size, match: "()", note: "RingBuffer.size"}
  - {class: com.applications.Checkpoint, method: undo, match: "()", note: "Checkpoint.undo"}
  - {class: com.applications.Checkpoint, method: redo, match: "()", note: "Checkpoint.redo"}
  - {class: com.applications.Checkpoint, method: size, match: "()", note: "Checkpoint.size"}
  - {class: com.applications.Checkpoint, method: isEmpty, match: "()", note: "Checkpoint.isEmpty"}
  - {class: com.applications.HumpingDumping, method: size, match: "()", note: "HumpingDumping.size"}
  - {class: com.applications.HumpingDumping, method: swap, match: "()", note: "HumpingDumping.swap"}
  - {class: com.applications.Identicals, method: printIdenticals, match: "()", note: "Identicals.printIdenticals"}
  - {class: com.applications.InfixExpression, method: main, match: "(String[] args)", note: "InfixExpression.main"}
  - {class: com.applications.Josephus, method: execute, match: "(int M)", note: "Josephus.execute"}
  - {class: com.applications.Josephus, method: main, match: "(String[] args)", note: "Josephus.main"}
  - {class: com.applications.MoveToFront, method: isEmpty, match: "()", note: "MoveToFront.isEmpty"}
  - {class: com.applications.MoveToFront, method: size, match: "()", note: "MoveToFront.size"}
  - {class: com.applications.MoveToFront, method: push, match: "(char c)", note: "MoveToFront.push"}
  - {class: com.applications.Paranthesis, method: main, match: "(String[] args)", note: "Paranthesis.main"}
  - {class: com.applications.Percolation, method: isOpen, match: "(int i, int j)", note: "Percolation.isOpen"}
  - {class: com.applications.Percolation, method: open, match: "(int i, int j)", note: "Percolation.open"}
  - {class: com.applications.Percolation, method: percolates, match: "()", note: "Percolation.percolates"}
  - {class: com.applications.Percolation, method: isFull, match: "(int i, int j)", note: "Percolation.isFull"}
  - {class: com.applications.Subset, method: main, match: "(String[] args)", note: "Subset.main"}
  - {class: com.applications.Threading, method: main, match: "(String[] args)", note: "Threading.main"}
  - {class: com.applications.Threading, method: isReadyForB, match: "()", note: "Threading.isReadyForB"}
  - {class: com.applications.Threading, method: isReadyForA, match: "()", note: "Threading.isReadyForA"}
  - {class: com.applications.Threading, method: setBDone, match: "()", note: "Threading.setBDone"}
  - {class: com.applications.Threading, method: setADone, match: "()", note: "Threading.setADone"}
  - {class: com.applications.Threading, method: run, match: "()", note: "Threading.run"}
  - {class: com.applications.Threading, method: run, match: "()", note: "Threading.run"}
