# Curated performance-mutation sites for stormpot (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants stormpot --source data/external-src/<checkout> \
#       --sites data/projects/stormpot/mutation_sites.yaml

package_root: stormpot.internal

sites:
  - {class: stormpot.internal.IdentityHashSet, method: iterator, match: "()", note: "IdentityHashSet.iterator"}
  - {class: stormpot.internal.PoolBuilderImpl, method: setSize, match: "(long size)", note: "PoolBuilderImpl.setSize"}
  - {class: stormpot.internal.PoolBuilderImpl, method: getSize, match: "()", note: "PoolBuilderImpl.getSize"}
  - {class: stormpot.internal.PoolBuilderImpl, method: setAllocator, match: "(", note: "PoolBuilderImpl.setAllocator"}
  - {class: stormpot.internal.PoolBuilderPermissions, method: PoolBuilderPermissions, match: "(", note: "PoolBuilderPermissions.PoolBuilderPermissions"}
  - {class: stormpot.internal.AsyncAllocationCompletion, method: AsyncAllocationCompletion, match: "(BSlot<T> slot)", note: "AsyncAllocationCompletion.AsyncAllocationCompletion"}
  - {class: stormpot.internal.AsyncDeallocationCompletion, method: AsyncDeallocationCompletion, match: "(BSlot<T> slot, Consumer<BSlot<T>> andThen)", note: "AsyncDeallocationCompletion.AsyncDeallocationCompletion"}
  - {class: stormpot.internal.BAllocThread, method: run, match: "()", note: "BAllocThread.run"}
  - {class: stormpot.internal.BAllocThread, method: onComplete, match: "()", note: "BAllocThread.onComplete"}
  - {class: stormpot.internal.BSlot, method: expire, match: "(Poolable obj)", note: "BSlot.expire"}
  - {class: stormpot.internal.BSlot, method: release, match: "(Poolable obj)", note: "BSlot.release"}
  - {class: stormpot.internal.BSlot, method: claimTlr2live, match: "()", note: "BSlot.claimTlr2live"}
  - {class: stormpot.internal.BaseSubscriber, method: onSubscribe, match: "(Flow.Subscription subscription)", note: "BaseSubscriber.onSubscribe"}
  - {class: stormpot.internal.BaseSubscriber, method: onNext, match: "(Void item)", note: "BaseSubscriber.onNext"}
  - {class: stormpot.internal.BaseSubscriber, method: onError, match: "(Throwable throwable)", note: "BaseSubscriber.onError"}
  - {class: stormpot.internal.BlazePool, method: claim, match: "(Timeout timeout)", note: "BlazePool.claim"}
  - {class: stormpot.internal.BlazePool, method: tryClaim, match: "() throws PoolException", note: "BlazePool.tryClaim"}
  - {class: stormpot.internal.BlazePool, method: shutdown, match: "()", note: "BlazePool.shutdown"}
  - {class: stormpot.internal.BlazePoolSingleThreadedTap, method: claim, match: "(Timeout timeout) throws PoolException, InterruptedException", note: "BlazePoolSingleThreadedTap.claim"}
  - {class: stormpot.internal.BlazePoolSingleThreadedTap, method: tryClaim, match: "()", note: "BlazePoolSingleThreadedTap.tryClaim"}
  - {class: stormpot.internal.BlazePoolThreadSafeTap, method: claim, match: "(Timeout timeout) throws PoolException, InterruptedException", note: "BlazePoolThreadSafeTap.claim"}
  - {class: stormpot.internal.BlazePoolThreadSafeTap, method: tryClaim, match: "() throws PoolException", note: "BlazePoolThreadSafeTap.tryClaim"}
  - {class: stormpot.internal.BlazePoolVirtualThreadSafeTap, method: claim, match: "(Timeout timeout) throws PoolException, InterruptedException", note: "BlazePoolVirtualThreadSafeTap.claim"}
  - {class: stormpot.internal.BlazePoolVirtualThreadSafeTap, method: tryClaim, match: "() throws PoolException", note: "BlazePoolVirtualThreadSafeTap.tryClaim"}
  - {class: stormpot.internal.DirectAllocationController, method: allocatedSize, match: "()", note: "DirectAllocationController.allocatedSize"}
  - {class: stormpot.internal.EveryExpiration, method: hasExpired, match: "(SlotInfo<? extends T> info) throws Exception", note: "EveryExpiration.hasExpired"}
  - {class: stormpot.internal.InlineAllocationController, method: onComplete, match: "()", note: "InlineAllocationController.onComplete"}
  - {class: stormpot.internal.InlineAllocationController, method: allocatedSize, match: "()", note: "InlineAllocationController.allocatedSize"}
  - {class: stormpot.internal.NanoClock, method: nanoTime, match: "()", note: "NanoClock.nanoTime"}
  - {class: stormpot.internal.NanoClock, method: elapsed, match: "(long startNanos)", note: "NanoClock.elapsed"}
  - {class: stormpot.internal.OrExpiration, method: hasExpired, match: "(SlotInfo<? extends T> info) throws Exception", note: "OrExpiration.hasExpired"}
  - {class: stormpot.internal.PreciseLeakDetector, method: register, match: "(BSlot<?> slot)", note: "PreciseLeakDetector.register"}
  - {class: stormpot.internal.PreciseLeakDetector, method: unregister, match: "(BSlot<?> slot)", note: "PreciseLeakDetector.unregister"}
  - {class: stormpot.internal.PreciseLeakDetector, method: countLeakedObjects, match: "()", note: "PreciseLeakDetector.countLeakedObjects"}
  - {class: stormpot.internal.ReallocatingAdaptor, method: reallocate, match: "(Slot slot, T poolable) throws Exception", note: "ReallocatingAdaptor.reallocate"}
  - {class: stormpot.internal.ReallocatingAdaptor, method: allocate, match: "(Slot slot) throws Exception", note: "ReallocatingAdaptor.allocate"}
  - {class: stormpot.internal.ReallocatingAdaptor, method: deallocate, match: "(T poolable) throws Exception", note: "ReallocatingAdaptor.deallocate"}
  - {class: stormpot.internal.RefillPile, method: push, match: "(BSlot<T> slot)", note: "RefillPile.push"}
  - {class: stormpot.internal.RefillPile, method: pop, match: "()", note: "RefillPile.pop"}
  - {class: stormpot.internal.RefillPile, method: refill, match: "()", note: "RefillPile.refill"}
  - {class: stormpot.internal.StackCompletion, method: complete, match: "()", note: "StackCompletion.complete"}
  - {class: stormpot.internal.StackCompletion, method: subscribe, match: "(Flow.Subscriber<? super Void> subscriber)", note: "StackCompletion.subscribe"}
  - {class: stormpot.internal.StackCompletion, method: propagateTo, match: "(StackCompletion other)", note: "StackCompletion.propagateTo"}
  - {class: stormpot.internal.ThreadLocalBSlotCache, method: initialValue, match: "()", note: "ThreadLocalBSlotCache.initialValue"}
  - {class: stormpot.internal.ThreadedAllocationController, method: shutdown, match: "()", note: "ThreadedAllocationController.shutdown"}
  - {class: stormpot.internal.ThreadedAllocationController, method: offerDeadSlot, match: "(BSlot<T> slot)", note: "ThreadedAllocationController.offerDeadSlot"}
  - {class: stormpot.internal.ThreadedAllocationController, method: setTargetSize, match: "(long size)", note: "ThreadedAllocationController.setTargetSize"}
  - {class: stormpot.internal.TimeExpiration, method: hasExpired, match: "(SlotInfo<? extends T> info)", note: "TimeExpiration.hasExpired"}
  - {class: stormpot.internal.TimeSpreadExpiration, method: hasExpired, match: "(SlotInfo<? extends T> info)", note: "TimeSpreadExpiration.hasExpired"}
  - {class: stormpot.internal.TimingReallocatingAdaptor, method: allocate, match: "(Slot slot) throws Exception", note: "TimingReallocatingAdaptor.allocate"}
