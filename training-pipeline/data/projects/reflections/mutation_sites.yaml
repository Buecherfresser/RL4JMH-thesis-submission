# Curated performance-mutation sites for reflections (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants reflections --source data/external-src/<checkout> \
#       --sites data/projects/reflections/mutation_sites.yaml

package_root: org.reflections.scanners

sites:
  - {class: org.reflections.scanners.AbstractScanner, method: index, match: "()", note: "AbstractScanner.index"}
  - {class: org.reflections.scanners.AbstractScanner, method: scan, match: "(final ClassFile cls)", note: "AbstractScanner.scan"}
  - {class: org.reflections.scanners.MemberUsageScanner, method: scan, match: "(ClassFile classFile)", note: "MemberUsageScanner.scan"}
  - {class: org.reflections.scanners.MemberUsageScanner, method: filterResultsBy, match: "(Predicate<String> filter)", note: "MemberUsageScanner.filterResultsBy"}
  - {class: org.reflections.scanners.MemberUsageScanner, method: edit, match: "(NewExpr e)", note: "MemberUsageScanner.edit"}
  - {class: org.reflections.scanners.MemberUsageScanner, method: edit, match: "(MethodCall m)", note: "MemberUsageScanner.edit"}
  - {class: org.reflections.scanners.MemberUsageScanner, method: edit, match: "(ConstructorCall c)", note: "MemberUsageScanner.edit"}
  - {class: org.reflections.scanners.MemberUsageScanner, method: edit, match: "(FieldAccess f)", note: "MemberUsageScanner.edit"}
  - {class: org.reflections.scanners.MemberUsageScanner, method: parameterNames, match: "(MethodInfo info)", note: "MemberUsageScanner.parameterNames"}
  - {class: org.reflections.scanners.MethodParameterNamesScanner, method: scan, match: "(ClassFile classFile)", note: "MethodParameterNamesScanner.scan"}
  - {class: org.reflections.scanners.Scanners, method: scan, match: "(ClassFile classFile, List<Map.Entry<String, String>> entries)", note: "Scanners.scan"}
  - {class: org.reflections.scanners.Scanners, method: acceptResult, match: "(String annotation)", note: "Scanners.acceptResult"}
  - {class: org.reflections.scanners.Scanners, method: scan, match: "(ClassFile classFile, List<Map.Entry<String, String>> entries)", note: "Scanners.scan"}
  - {class: org.reflections.scanners.Scanners, method: scan, match: "(ClassFile classFile, List<Map.Entry<String, String>> entries)", note: "Scanners.scan"}
  - {class: org.reflections.scanners.Scanners, method: scan, match: "(ClassFile classFile, List<Map.Entry<String, String>> entries)", note: "Scanners.scan"}
  - {class: org.reflections.scanners.Scanners, method: scan, match: "(ClassFile classFile, List<Map.Entry<String, String>> entries)", note: "Scanners.scan"}
  - {class: org.reflections.scanners.Scanners, method: acceptsInput, match: "(String file)", note: "Scanners.acceptsInput"}
  - {class: org.reflections.scanners.Scanners, method: scan, match: "(Vfs.File file)", note: "Scanners.scan"}
  - {class: org.reflections.scanners.Scanners, method: scan, match: "(ClassFile classFile, List<Map.Entry<String, String>> entries)", note: "Scanners.scan"}
  - {class: org.reflections.scanners.Scanners, method: with, match: "(String pattern)", note: "Scanners.with"}
  - {class: org.reflections.scanners.Scanners, method: scan, match: "(ClassFile classFile, List<Map.Entry<String, String>> entries)", note: "Scanners.scan"}
  - {class: org.reflections.scanners.Scanners, method: scan, match: "(ClassFile classFile, List<Map.Entry<String, String>> entries)", note: "Scanners.scan"}
  - {class: org.reflections.scanners.Scanners, method: scan, match: "(ClassFile classFile, List<Map.Entry<String, String>> entries)", note: "Scanners.scan"}
  - {class: org.reflections.scanners.Scanners, method: with, match: "(AnnotatedElement... keys)", note: "Scanners.with"}
  - {class: org.reflections.scanners.Scanners, method: scan, match: "(ClassFile classFile, List<Map.Entry<String, String>> entries)", note: "Scanners.scan"}
  - {class: org.reflections.scanners.Scanners, method: with, match: "(AnnotatedElement... keys)", note: "Scanners.with"}
  - {class: org.reflections.scanners.Scanners, method: scan, match: "(ClassFile classFile, List<Map.Entry<String, String>> entries)", note: "Scanners.scan"}
  - {class: org.reflections.scanners.Scanners, method: index, match: "()", note: "Scanners.index"}
  - {class: org.reflections.scanners.Scanners, method: filterResultsBy, match: "(Predicate<String> filter)", note: "Scanners.filterResultsBy"}
  - {class: org.reflections.scanners.Scanners, method: scan, match: "(ClassFile classFile)", note: "Scanners.scan"}
  - {class: org.reflections.scanners.Scanners, method: acceptResult, match: "(String fqn)", note: "Scanners.acceptResult"}
  - {class: org.reflections.scanners.SubTypesScanner, method: scan, match: "(final ClassFile cls)", note: "SubTypesScanner.scan"}
  - {class: org.reflections.scanners.TypeElementsScanner, method: scan, match: "(ClassFile classFile)", note: "TypeElementsScanner.scan"}
