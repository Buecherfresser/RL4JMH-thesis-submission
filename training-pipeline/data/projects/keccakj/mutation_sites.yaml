  - {class: com.github.aelstad.keccakj.provider.KeccakjProvider, method: getInstance, match: "(String transformation) throws NoSuchAlgorithmException, NoSuchPaddingException", note: "KeccakjProvider.getInstance"}
  - {class: com.github.aelstad.keccakj.spi.KeccakRnd128, method: engineGenerateSeed, match: "(int len)", note: "KeccakRnd128.engineGenerateSeed"}
  - {class: com.github.aelstad.keccakj.spi.KeccakRnd128, method: engineNextBytes, match: "(byte[] buf)", note: "KeccakRnd128.engineNextBytes"}
