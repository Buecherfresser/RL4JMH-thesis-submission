# Curated performance-mutation sites for itu (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants itu --source data/external-src/<checkout> \
#       --sites data/projects/itu/mutation_sites.yaml

package_root: com.ethlo.time

sites:
  - {class: com.ethlo.time.DateTimeParsers, method: of, match: "(DateTimeToken... tokens)", note: "DateTimeParsers.of"}
  - {class: com.ethlo.time.internal.ItuDurationParser, method: parse, match: "(final String chars)", note: "ItuDurationParser.parse"}
  - {class: com.ethlo.time.token.ConfigurableDateTimeParser, method: of, match: "(DateTimeToken... tokens)", note: "ConfigurableDateTimeParser.of"}
  - {class: com.ethlo.time.DateTimeParsers, method: rfc3339, match: "()", note: "DateTimeParsers.rfc3339"}
  - {class: com.ethlo.time.internal.ItuDurationParser, method: parse, match: "(final String text, final int offset)", note: "ItuDurationParser.parse"}
  - {class: com.ethlo.time.token.ConfigurableDateTimeParser, method: parse, match: "(String text, ParsePosition parsePosition)", note: "ConfigurableDateTimeParser.parse"}
  - {class: com.ethlo.time.DateTimeParsers, method: localDate, match: "()", note: "DateTimeParsers.localDate"}
  - {class: com.ethlo.time.internal.fixed.ITUParser, method: parseLenient, match: "(final String chars, final ParseConfig parseConfig, int offset)", note: "ITUParser.parseLenient"}
  - {class: com.ethlo.time.DateTime, method: of, match: "(int year, int month, int day, int hour, int minute, int second, TimezoneOffset offset)", note: "DateTime.of"}
  - {class: com.ethlo.time.internal.fixed.ITUParser, method: sanityCheckInputParams, match: "(String chars, int offset)", note: "ITUParser.sanityCheckInputParams"}
  - {class: com.ethlo.time.DateTime, method: of, match: "(int year, int month, int day, int hour, int minute, int second, int nanos, TimezoneOffset offset, final int fractionDigits)", note: "DateTime.of"}
  - {class: com.ethlo.time.internal.fixed.ITUParser, method: parseDateTime, match: "(final String chars, int offset)", note: "ITUParser.parseDateTime"}
  - {class: com.ethlo.time.DateTime, method: ofYear, match: "(int year)", note: "DateTime.ofYear"}
  - {class: com.ethlo.time.internal.util.ArrayUtils, method: merge, match: "(char[] a, char[] b)", note: "ArrayUtils.merge"}
  - {class: com.ethlo.time.DateTimeTokens, method: separators, match: "(char... anyOf)", note: "DateTimeTokens.separators"}
  - {class: com.ethlo.time.internal.util.DateTimeMath, method: daysFromCivil, match: "(int y, final int m, final int d)", note: "DateTimeMath.daysFromCivil"}
  - {class: com.ethlo.time.DateTimeTokens, method: digits, match: "(Field field, int length)", note: "DateTimeTokens.digits"}
  - {class: com.ethlo.time.internal.util.ErrorUtil, method: raiseUnexpectedCharacter, match: "(String chars, int index, char... expected)", note: "ErrorUtil.raiseUnexpectedCharacter"}
  - {class: com.ethlo.time.DateTimeTokens, method: fractions, match: "()", note: "DateTimeTokens.fractions"}
  - {class: com.ethlo.time.internal.util.ErrorUtil, method: raiseUnexpectedEndOfText, match: "(final String chars, final int offset)", note: "ErrorUtil.raiseUnexpectedEndOfText"}
  - {class: com.ethlo.time.Duration, method: ofMillis, match: "(long millis)", note: "Duration.ofMillis"}
  - {class: com.ethlo.time.internal.util.ErrorUtil, method: raiseMissingGranularity, match: "(Field field, final String chars, final int offset)", note: "ErrorUtil.raiseMissingGranularity"}
  - {class: com.ethlo.time.Duration, method: ofMicros, match: "(long micros)", note: "Duration.ofMicros"}
  - {class: com.ethlo.time.internal.util.LimitedCharArrayIntegerUtil, method: parsePositiveInt, match: "(final String strNum, int startInclusive, int endExclusive)", note: "LimitedCharArrayIntegerUtil.parsePositiveInt"}
  - {class: com.ethlo.time.Duration, method: ofNanos, match: "(long nanos)", note: "Duration.ofNanos"}
  - {class: com.ethlo.time.internal.DurationPartsConsumer, method: error, match: "(final String errorMessage, final String text, int index)", note: "DurationPartsConsumer.error"}
  - {class: com.ethlo.time.Field, method: valueOf, match: "(Class<? extends Temporal> type)", note: "Field.valueOf"}
  - {class: com.ethlo.time.internal.DurationPartsConsumer, method: accept, match: "(final String text, final int index, final int length, final char unit, final long value)", note: "DurationPartsConsumer.accept"}
  - {class: com.ethlo.time.Field, method: of, match: "(TemporalField temporalField)", note: "Field.of"}
  - {class: com.ethlo.time.internal.DurationPartsConsumer, method: validate, match: "(String chars, int index)", note: "DurationPartsConsumer.validate"}
  - {class: com.ethlo.time.Field, method: getRequiredLength, match: "()", note: "Field.getRequiredLength"}
  - {class: com.ethlo.time.internal.fixed.ITUFormatter, method: finish, match: "(final char[] buf, final int length, final TimezoneOffset tz)", note: "ITUFormatter.finish"}
  - {class: com.ethlo.time.ITU, method: parseDateTime, match: "(String text)", note: "ITU.parseDateTime"}
  - {class: com.ethlo.time.internal.fixed.ITUFormatter, method: formatUtc, match: "(OffsetDateTime date, int fractionDigits)", note: "ITUFormatter.formatUtc"}
  - {class: com.ethlo.time.ITU, method: parseDuration, match: "(String text)", note: "ITU.parseDuration"}
  - {class: com.ethlo.time.internal.fixed.ITUFormatter, method: formatUtc, match: "(OffsetDateTime date, Field lastIncluded)", note: "ITUFormatter.formatUtc"}
  - {class: com.ethlo.time.ITU, method: parseDuration, match: "(String text, int offset)", note: "ITU.parseDuration"}
  - {class: com.ethlo.time.internal.token.DigitsToken, method: getField, match: "()", note: "DigitsToken.getField"}
  - {class: com.ethlo.time.LeapSecondException, method: getSecondsInMinute, match: "()", note: "LeapSecondException.getSecondsInMinute"}
  - {class: com.ethlo.time.internal.token.FractionsToken, method: getField, match: "()", note: "FractionsToken.getField"}
  - {class: com.ethlo.time.LeapSecondException, method: getNearestDateTime, match: "()", note: "LeapSecondException.getNearestDateTime"}
  - {class: com.ethlo.time.internal.token.ZoneOffsetToken, method: getField, match: "()", note: "ZoneOffsetToken.getField"}
  - {class: com.ethlo.time.LeapSecondException, method: isVerifiedValidLeapYearMonth, match: "()", note: "LeapSecondException.isVerifiedValidLeapYearMonth"}
  - {class: com.ethlo.time.internal.util.DefaultLeapSecondHandler, method: isValidLeapSecondDate, match: "(YearMonth needle)", note: "DefaultLeapSecondHandler.isValidLeapSecondDate"}
  - {class: com.ethlo.time.ParseConfig, method: getFractionSeparators, match: "()", note: "ParseConfig.getFractionSeparators"}
  - {class: com.ethlo.time.internal.util.DefaultLeapSecondHandler, method: getLastKnownLeapSecond, match: "()", note: "DefaultLeapSecondHandler.getLastKnownLeapSecond"}
  - {class: com.ethlo.time.ParseConfig, method: withDateTimeSeparators, match: "(char... allowed)", note: "ParseConfig.withDateTimeSeparators"}
  - {class: com.ethlo.time.internal.util.DurationFormatter, method: normalizeDuration, match: "(Duration duration)", note: "DurationFormatter.normalizeDuration"}
  - {class: com.ethlo.time.ParseConfig, method: withFractionSeparators, match: "(char... allowed)", note: "ParseConfig.withFractionSeparators"}
  - {class: com.ethlo.time.TimezoneOffset, method: ofHoursMinutes, match: "(int hours, int minutes)", note: "TimezoneOffset.ofHoursMinutes"}
