# Curated performance-mutation sites for commons-validator (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants commons-validator --source data/external-src/<checkout> \
#       --sites data/projects/commons-validator/mutation_sites.yaml

package_root: org.apache.commons.validator

sites:
