  - {class: org.la4j.matrix.dense.Basic2DMatrix, method: zero, match: "(int rows, int columns)", note: "Basic2DMatrix.zero"}
  - {class: org.la4j.operation.ooplace.OoPlaceInnerProduct, method: apply, match: "(final SparseVector a, final SparseVector b)", note: "OoPlaceInnerProduct.apply"}
