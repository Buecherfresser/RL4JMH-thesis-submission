# Curated performance-mutation sites for finmath-lib (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants finmath-lib --source data/external-src/<checkout> \
#       --sites data/projects/finmath-lib/mutation_sites.yaml

package_root: net.finmath.montecarlo

