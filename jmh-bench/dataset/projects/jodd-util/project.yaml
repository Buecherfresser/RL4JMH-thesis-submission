name: jodd-util
display_name: Jodd Util
version: 6.3.0

# Where the pristine, vendored subject-under-test lives (relative to this dir).
# Sources are the published `org.jodd:jodd-util:6.3.0` sources artefact. Two
# classpath resources (`jodd/net/HtmlDecoder.properties`,
# `jodd/net/MimeTypes.properties`) ship alongside the sources and are vendored
# in place; the project-track pom picks up non-`.java` files under the source
# root as resources.
source_dir: src/main/java

provenance:
  project: Jodd Util
  url: https://github.com/oblac/jodd-util/tree/v6.3.0
  tag: v6.3.0
  released: 2023-11-01

mutations_patch: mutations.patch
mutants_registry: mutants.yaml
api_surface: api_surface.md

harness_input:
  mode: per_class
  # All eight public components: bean access, class introspection, IO/streams,
  # net/MIME/URL encoding, date-time, type conversion and the string/array/
  # math utility belt.
  include_packages:
    - "(root)"
    - bean
    - exception
    - introspector
    - io
    - net
    - time
    - typeconverter
    - util
  name_filter: "(Util|Bean|Converter|Introspector|Format|Buffer|Codec|Encoder|Decoder|Cache|Time|Html|Mime|URL|Url|Stream|Reader|Writer|Template|Wildcard|Base64|Chars|Strings)"

# Jodd Util has no runtime dependencies; the SUT compiles against the JDK alone.
dependencies: []

mutation:
  switch_class: jodd.jmhbench.MutationSwitch
  arm_property: jmhbench.mutant
  record_property: jmhbench.record
  record_file_property: jmhbench.record.file
  count: 50
  # Per-character / per-element helpers on top of the generator's shared
  # hot-name list.
  skip_methods:
    - append
    - appendTo
    - toArray
    - convert
    - convertType
    - equalsOne
    - equalsIgnoreCase
    - startsWithChar
    - endsWithChar
    - isCharAtEscaped
    - indexOfChars
    - indexOfIgnoreCase
    - lastIndexOf
    - toChars
    - toBytes
    - readChar
    - writeChar
    - encodeChar
    - decodeChar
    - lookup
    - getFieldValue
    - setFieldValue
    - invokeMethod
