  - {class: it.unimi.dsi.lang.EnumStringParser, method: parse, match: "(final String s) throws ParseException", note: "EnumStringParser.parse"}
  - {class: it.unimi.dsi.logging.ProgressLogger, method: logger, match: "()", note: "ProgressLogger.logger"}
  - {class: it.unimi.dsi.parser.BulletParser, method: parseText, match: "()", note: "BulletParser.parseText"}
