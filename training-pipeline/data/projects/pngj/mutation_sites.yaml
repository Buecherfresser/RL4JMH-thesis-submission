# Curated performance-mutation sites for pngj (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants pngj --source data/external-src/<checkout> \
#       --sites data/projects/pngj/mutation_sites.yaml

package_root: ar.com.hjg

sites:
  - {class: ar.com.hjg.pngj.BufferedStreamFeeder, method: getStream, match: "()", note: "BufferedStreamFeeder.getStream"}
  - {class: ar.com.hjg.pngj.BufferedStreamFeeder, method: feed, match: "(IBytesConsumer consumer)", note: "BufferedStreamFeeder.feed"}
  - {class: ar.com.hjg.pngj.ChunkSeqBuffering, method: isIdatKind, match: "(String id)", note: "ChunkSeqBuffering.isIdatKind"}
  - {class: ar.com.hjg.pngj.ChunkSeqBuffering, method: shouldCheckCrc, match: "(int len, String id)", note: "ChunkSeqBuffering.shouldCheckCrc"}
  - {class: ar.com.hjg.pngj.DeflatedChunksSet, method: isDone, match: "()", note: "DeflatedChunksSet.isDone"}
  - {class: ar.com.hjg.pngj.DeflatedChunksSet, method: isClosed, match: "()", note: "DeflatedChunksSet.isClosed"}
  - {class: ar.com.hjg.pngj.IdatSet, method: unfilterRow, match: "()", note: "IdatSet.unfilterRow"}
  - {class: ar.com.hjg.pngj.IdatSet, method: unfilterRow, match: "(int nbytes)", note: "IdatSet.unfilterRow"}
  - {class: ar.com.hjg.pngj.chunks.ChunksList, method: getChunks, match: "()", note: "ChunksList.getChunks"}
  - {class: ar.com.hjg.pngj.chunks.ChunksList, method: getXById, match: "(final List<PngChunk> list, final String id, final String innerid)", note: "ChunksList.getXById"}
  - {class: ar.com.hjg.pngj.chunks.ChunksListForWrite, method: getQueuedById, match: "(final String id)", note: "ChunksListForWrite.getQueuedById"}
  - {class: ar.com.hjg.pngj.chunks.ChunksListForWrite, method: getQueuedById, match: "(final String id, final String innerid)", note: "ChunksListForWrite.getQueuedById"}
  - {class: ar.com.hjg.pngj.pixels.CompressorStreamDeflater, method: mywrite, match: "(byte[] data, int off, final int len)", note: "CompressorStreamDeflater.mywrite"}
  - {class: ar.com.hjg.pngj.pixels.CompressorStreamDeflater, method: deflate, match: "()", note: "CompressorStreamDeflater.deflate"}
  - {class: ar.com.hjg.pngj.pixels.CompressorStreamLz4, method: mywrite, match: "(byte[] b, int off, int len)", note: "CompressorStreamLz4.mywrite"}
  - {class: ar.com.hjg.pngj.pixels.CompressorStreamLz4, method: done, match: "()", note: "CompressorStreamLz4.done"}
  - {class: ar.com.hjg.pngj.ChunkSeqReaderPng, method: shouldSkipContent, match: "(int len, String id)", note: "ChunkSeqReaderPng.shouldSkipContent"}
  - {class: ar.com.hjg.pngj.ChunkSeqReaderPng, method: getBytesChunksLoaded, match: "()", note: "ChunkSeqReaderPng.getBytesChunksLoaded"}
  - {class: ar.com.hjg.pngj.ChunkSeqSkipping, method: createChunkReaderForNewChunk, match: "(String id, int len, long offset, boolean skip)", note: "ChunkSeqSkipping.createChunkReaderForNewChunk"}
  - {class: ar.com.hjg.pngj.ChunkSeqSkipping, method: chunkDone, match: "()", note: "ChunkSeqSkipping.chunkDone"}
  - {class: ar.com.hjg.pngj.Deinterlacer, method: getPixelsToRead, match: "()", note: "Deinterlacer.getPixelsToRead"}
  - {class: ar.com.hjg.pngj.Deinterlacer, method: getBytesToRead, match: "()", note: "Deinterlacer.getBytesToRead"}
  - {class: ar.com.hjg.pngj.FilterType, method: getByVal, match: "(int i)", note: "FilterType.getByVal"}
  - {class: ar.com.hjg.pngj.FilterType, method: isValidStandard, match: "(int i)", note: "FilterType.isValidStandard"}
  - {class: ar.com.hjg.pngj.IdatChunkWriter, method: getChunkId, match: "()", note: "IdatChunkWriter.getChunkId"}
  - {class: ar.com.hjg.pngj.IdatChunkWriter, method: getAvailLen, match: "()", note: "IdatChunkWriter.getAvailLen"}
  - {class: ar.com.hjg.pngj.ImageInfo, method: withSize, match: "(int cols, int rows)", note: "ImageInfo.withSize"}
  - {class: ar.com.hjg.pngj.ImageInfo, method: getTotalPixels, match: "()", note: "ImageInfo.getTotalPixels"}
  - {class: ar.com.hjg.pngj.ImageLineByte, method: getFactory, match: "()", note: "ImageLineByte.getFactory"}
  - {class: ar.com.hjg.pngj.ImageLineByte, method: createImageLine, match: "(ImageInfo iminfo)", note: "ImageLineByte.createImageLine"}
  - {class: ar.com.hjg.pngj.ImageLineHelper, method: scaleUp, match: "(IImageLineArray line)", note: "ImageLineHelper.scaleUp"}
  - {class: ar.com.hjg.pngj.ImageLineHelper, method: scaleDown, match: "(IImageLineArray line)", note: "ImageLineHelper.scaleDown"}
  - {class: ar.com.hjg.pngj.ImageLineInt, method: getFactory, match: "()", note: "ImageLineInt.getFactory"}
  - {class: ar.com.hjg.pngj.ImageLineInt, method: createImageLine, match: "(ImageInfo iminfo)", note: "ImageLineInt.createImageLine"}
  - {class: ar.com.hjg.pngj.PngHelperInternal, method: initialValue, match: "()", note: "PngHelperInternal.initialValue"}
  - {class: ar.com.hjg.pngj.PngHelperInternal, method: getPngIdSignature, match: "()", note: "PngHelperInternal.getPngIdSignature"}
  - {class: ar.com.hjg.pngj.PngReader, method: readFirstChunks, match: "()", note: "PngReader.readFirstChunks"}
  - {class: ar.com.hjg.pngj.PngReader, method: setChunkLoadBehaviour, match: "(ChunkLoadBehaviour chunkLoadBehaviour)", note: "PngReader.setChunkLoadBehaviour"}
  - {class: ar.com.hjg.pngj.PngReaderApng, method: isApng, match: "()", note: "PngReaderApng.isApng"}
  - {class: ar.com.hjg.pngj.PngReaderApng, method: advanceToFrame, match: "(int frame)", note: "PngReaderApng.advanceToFrame"}
  - {class: ar.com.hjg.pngj.PngReaderByte, method: readRowByte, match: "()", note: "PngReaderByte.readRowByte"}
  - {class: ar.com.hjg.pngj.PngReaderFilter, method: createChunkSequenceReader, match: "()", note: "PngReaderFilter.createChunkSequenceReader"}
  - {class: ar.com.hjg.pngj.PngReaderFilter, method: shouldSkipContent, match: "(int len, String id)", note: "PngReaderFilter.shouldSkipContent"}
  - {class: ar.com.hjg.pngj.PngReaderInt, method: readRowInt, match: "()", note: "PngReaderInt.readRowInt"}
  - {class: ar.com.hjg.pngj.PngWriter, method: queueChunk, match: "(PngChunk chunk)", note: "PngWriter.queueChunk"}
  - {class: ar.com.hjg.pngj.PngWriter, method: copyChunksFrom, match: "(ChunksList chunks, int copyMask)", note: "PngWriter.copyChunksFrom"}
  - {class: ar.com.hjg.pngj.PngWriterHc, method: createPixelsWriter, match: "(ImageInfo imginfo)", note: "PngWriterHc.createPixelsWriter"}
  - {class: ar.com.hjg.pngj.PngWriterHc, method: getPixelWriterMultiple, match: "()", note: "PngWriterHc.getPixelWriterMultiple"}
  - {class: ar.com.hjg.pngj.chunks.ChunkCopyBehaviour, method: createPredicate, match: "(final int copyFromMask, final ImageInfo imgInfo)", note: "ChunkCopyBehaviour.createPredicate"}
  - {class: ar.com.hjg.pngj.chunks.ChunkCopyBehaviour, method: match, match: "(PngChunk chunk)", note: "ChunkCopyBehaviour.match"}
