# Curated performance-mutation sites for clipper2-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants clipper2-java --source data/external-src/<checkout> \
#       --sites data/projects/clipper2-java/mutation_sites.yaml

package_root: com.github.micycle1

sites:
  - {class: com.github.micycle1.clipper2.Clipper, method: intersect, match: "(Paths64 subject, Paths64 clip, FillRule fillRule)", note: "Clipper.intersect"}
  - {class: com.github.micycle1.clipper2.Clipper, method: intersect, match: "(PathsD subject, PathsD clip, FillRule fillRule)", note: "Clipper.intersect"}
  - {class: com.github.micycle1.clipper2.Clipper, method: intersect, match: "(PathsD subject, PathsD clip, FillRule fillRule, int precision)", note: "Clipper.intersect"}
  - {class: com.github.micycle1.clipper2.Clipper, method: union, match: "(Paths64 subject, FillRule fillRule)", note: "Clipper.union"}
  - {class: com.github.micycle1.clipper2.Minkowski, method: sum, match: "(Path64 pattern, Path64 path, boolean isClosed)", note: "Minkowski.sum"}
  - {class: com.github.micycle1.clipper2.Minkowski, method: sum, match: "(PathD pattern, PathD path, boolean isClosed)", note: "Minkowski.sum"}
  - {class: com.github.micycle1.clipper2.Minkowski, method: sum, match: "(PathD pattern, PathD path, boolean isClosed, int decimalPlaces)", note: "Minkowski.sum"}
  - {class: com.github.micycle1.clipper2.Minkowski, method: diff, match: "(Path64 pattern, Path64 path, boolean isClosed)", note: "Minkowski.diff"}
  - {class: com.github.micycle1.clipper2.core.InternalClipper, method: checkPrecision, match: "(int precision)", note: "InternalClipper.checkPrecision"}
  - {class: com.github.micycle1.clipper2.core.InternalClipper, method: isAlmostZero, match: "(double value)", note: "InternalClipper.isAlmostZero"}
  - {class: com.github.micycle1.clipper2.core.InternalClipper, method: round, match: "(double value)", note: "InternalClipper.round"}
  - {class: com.github.micycle1.clipper2.core.InternalClipper, method: crossProduct, match: "(Point64 pt1, Point64 pt2, Point64 pt3)", note: "InternalClipper.crossProduct"}
  - {class: com.github.micycle1.clipper2.core.Point64, method: setX, match: "(double x)", note: "Point64.setX"}
  - {class: com.github.micycle1.clipper2.core.Point64, method: setY, match: "(double y)", note: "Point64.setY"}
