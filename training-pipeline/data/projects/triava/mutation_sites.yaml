# Curated performance-mutation sites for triava (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants triava --source data/external-src/<checkout> \
#       --sites data/projects/triava/mutation_sites.yaml

package_root: com.trivago.triava

sites:
  - {class: com.trivago.triava.collections.HashInterner, method: size, match: "()", note: "HashInterner.size"}
  - {class: com.trivago.triava.logging.TriavaConsoleLogger, method: info, match: "(String message)", note: "TriavaConsoleLogger.info"}
  - {class: com.trivago.triava.tcache.core.Builder, method: build, match: "()", note: "Builder.build"}
  - {class: com.trivago.triava.time.EstimatorTimeSource, method: run, match: "()", note: "EstimatorTimeSource.run"}
  - {class: com.trivago.triava.util.UnitComponent, method: base, match: "()", note: "UnitComponent.base"}
  - {class: com.trivago.triava.logging.TriavaConsoleLogger, method: error, match: "(String message)", note: "TriavaConsoleLogger.error"}
  - {class: com.trivago.triava.tcache.core.Builder, method: setId, match: "(String id)", note: "Builder.setId"}
  - {class: com.trivago.triava.time.EstimatorTimeSource, method: shutdown, match: "()", note: "EstimatorTimeSource.shutdown"}
  - {class: com.trivago.triava.util.UnitComponent, method: kilo, match: "()", note: "UnitComponent.kilo"}
