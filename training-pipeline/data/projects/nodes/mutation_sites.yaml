# Curated performance-mutation sites for nodes (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants nodes --source data/external-src/<checkout> \
#       --sites data/projects/nodes/mutation_sites.yaml

package_root: com.twitter.nodes

sites:
  - {class: com.twitter.nodes.FlatMapTransformNode, method: getResponseClassName, match: "()", note: "FlatMapTransformNode.getResponseClassName"}
  - {class: com.twitter.nodes.utils.DebugMessageBuilder, method: getDebugLevel, match: "(int level)", note: "DebugMessageBuilder.getDebugLevel"}
  - {class: com.twitter.nodes.FlatMapTransformNode, method: transform, match: "(SourceType source)", note: "FlatMapTransformNode.transform"}
  - {class: com.twitter.nodes.utils.DebugMessageBuilder, method: getDebugLevel, match: "()", note: "DebugMessageBuilder.getDebugLevel"}
  - {class: com.twitter.nodes.AndNode, method: evaluate, match: "()", note: "AndNode.evaluate"}
  - {class: com.twitter.nodes.utils.DebugMessageBuilder, method: getLevel, match: "()", note: "DebugMessageBuilder.getLevel"}
  - {class: com.twitter.nodes.AndNode, method: evaluate, match: "(final List<Node<Boolean>> operands)", note: "AndNode.evaluate"}
  - {class: com.twitter.nodes.utils.DebugNoneMessageBuilder, method: getInstance, match: "()", note: "DebugNoneMessageBuilder.getInstance"}
  - {class: com.twitter.nodes.AndNode, method: apply, match: "(Boolean value)", note: "AndNode.apply"}
  - {class: com.twitter.nodes.utils.DebugNoneMessageBuilder, method: reset, match: "()", note: "DebugNoneMessageBuilder.reset"}
  - {class: com.twitter.nodes.EqualsNode, method: evaluate, match: "() throws Exception", note: "EqualsNode.evaluate"}
  - {class: com.twitter.nodes.utils.DebugNoneMessageBuilder, method: basic, match: "(String message, Object... args)", note: "DebugNoneMessageBuilder.basic"}
  - {class: com.twitter.nodes.EqualsNode, method: create, match: "(Node<T> nodeA, Node<T> nodeB)", note: "EqualsNode.create"}
  - {class: com.twitter.nodes.utils.NodeUtils, method: asList, match: "()", note: "NodeUtils.asList"}
  - {class: com.twitter.nodes.IfSuccessfulNode, method: evaluate, match: "() throws Exception", note: "IfSuccessfulNode.evaluate"}
  - {class: com.twitter.nodes.utils.NodeUtils, method: asList, match: "(Node<T> node)", note: "NodeUtils.asList"}
  - {class: com.twitter.nodes.IfSuccessfulNode, method: create, match: "(Node<T> node)", note: "IfSuccessfulNode.create"}
  - {class: com.twitter.nodes.utils.NodeUtils, method: evaluate, match: "() throws Exception", note: "NodeUtils.evaluate"}
  - {class: com.twitter.nodes.LightDarkSwitchNode, method: evaluate, match: "() throws Exception", note: "LightDarkSwitchNode.evaluate"}
