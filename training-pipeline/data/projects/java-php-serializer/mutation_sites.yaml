  - {class: com.marcospassos.phpserializer.state.WritingObjectState, method: property, match: "()", note: "WritingObjectState.property"}
  - {class: com.marcospassos.phpserializer.AdapterRegistry, method: getAdapters, match: "()", note: "AdapterRegistry.getAdapters"}
  - {class: com.marcospassos.phpserializer.state.WritingObjectState, method: objectEnd, match: "()", note: "WritingObjectState.objectEnd"}
  - {class: com.marcospassos.phpserializer.AdapterRegistry, method: registerAdapter, match: "(Class type, TypeAdapter adapter)", note: "AdapterRegistry.registerAdapter"}
