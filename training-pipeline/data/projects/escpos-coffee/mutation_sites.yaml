# Curated performance-mutation sites for escpos-coffee (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants escpos-coffee --source data/external-src/<checkout> \
#       --sites data/projects/escpos-coffee/mutation_sites.yaml

package_root: com.github.anastaciocintra

sites:
