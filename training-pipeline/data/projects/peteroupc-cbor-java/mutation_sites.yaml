  - {class: com.upokecenter.cbor.CBORReader, method: Read, match: "() throws java.io.IOException", note: "CBORReader.Read"}
  - {class: com.upokecenter.cbor.CBORReader, method: ReadForFirstByte, match: "(int firstbyte) throws java.io.IOException", note: "CBORReader.ReadForFirstByte"}
  - {class: com.upokecenter.cbor.CBORUriConverter, method: FromCBORObject, match: "(CBORObject obj)", note: "CBORUriConverter.FromCBORObject"}
  - {class: com.upokecenter.cbor.CBORUriConverter, method: ToCBORObject, match: "(java.net.URI uri)", note: "CBORUriConverter.ToCBORObject"}
  - {class: com.upokecenter.cbor.CBORUuidConverter, method: ToCBORObject, match: "(java.util.UUID obj)", note: "CBORUuidConverter.ToCBORObject"}
  - {class: com.upokecenter.cbor.CBORUuidConverter, method: FromCBORObject, match: "(CBORObject obj)", note: "CBORUuidConverter.FromCBORObject"}
  - {class: com.upokecenter.cbor.CharacterInputWithCount, method: GetOffset, match: "()", note: "CharacterInputWithCount.GetOffset"}
