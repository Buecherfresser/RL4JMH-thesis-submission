  - {class: org.xerial.snappy.Snappy, method: cleanUp, match: "()", note: "Snappy.cleanUp"}
  - {class: org.xerial.snappy.Snappy, method: arrayCopy, match: "(Object src, int offset, int byteLength, Object dest, int dest_offset)", note: "Snappy.arrayCopy"}
  - {class: org.xerial.snappy.Snappy, method: compress, match: "(byte[] input)", note: "Snappy.compress"}
  - {class: org.xerial.snappy.SnappyBundleActivator, method: start, match: "(BundleContext context)", note: "SnappyBundleActivator.start"}
  - {class: org.xerial.snappy.SnappyBundleActivator, method: stop, match: "(BundleContext context)", note: "SnappyBundleActivator.stop"}
  - {class: org.xerial.snappy.SnappyCodec, method: getMagicHeader, match: "()", note: "SnappyCodec.getMagicHeader"}
  - {class: org.xerial.snappy.SnappyCodec, method: headerSize, match: "()", note: "SnappyCodec.headerSize"}
  - {class: org.xerial.snappy.SnappyCodec, method: writeHeader, match: "(byte[] dst, int dstOffset)", note: "SnappyCodec.writeHeader"}
