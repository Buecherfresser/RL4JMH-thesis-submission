  - {class: com.wanasit.chrono.parser.en.ENDayOfWeekDateFormatParser, method: extract, match: "(String text, Date refDate, Matcher matcher, ChronoOption option)", note: "ENDayOfWeekDateFormatParser.extract"}
  - {class: com.wanasit.chrono.refiner.ExtractTimezoneRefiner, method: refine, match: "(List<ParsedResult> results, String text, ChronoOption options)", note: "ExtractTimezoneRefiner.refine"}
  - {class: com.wanasit.chrono.ParsedDateComponent, method: date, match: "()", note: "ParsedDateComponent.date"}
