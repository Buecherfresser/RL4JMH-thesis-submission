# Curated performance-mutation sites for nano-cuckoo (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants nano-cuckoo --source data/external-src/<checkout> \
#       --sites data/projects/nano-cuckoo/mutation_sites.yaml

package_root: net.cinnom.nanocuckoo

sites:
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: insert, match: "( String value )", note: "NanoCuckooFilter.insert"}
  - {class: net.cinnom.nanocuckoo.hash.FixedHasher, method: getHash, match: "( int value )", note: "FixedHasher.getHash"}
  - {class: net.cinnom.nanocuckoo.metro.MetroHash64, method: hash, match: "( byte[] buf, int off, int len, long seed )", note: "MetroHash64.hash"}
  - {class: net.cinnom.nanocuckoo.random.WrappedThreadLocalRandom, method: nextInt, match: "()", note: "WrappedThreadLocalRandom.nextInt"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: insert, match: "( byte[] data )", note: "NanoCuckooFilter.insert"}
  - {class: net.cinnom.nanocuckoo.hash.MetroHasher, method: getHash, match: "( byte[] data )", note: "MetroHasher.getHash"}
  - {class: net.cinnom.nanocuckoo.metro.UnsafeMetroHash64, method: hash, match: "( byte[] buf, int off, int len, long seed )", note: "UnsafeMetroHash64.hash"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: insert, match: "( long hash )", note: "NanoCuckooFilter.insert"}
  - {class: net.cinnom.nanocuckoo.hash.MetroHasher, method: getSeed, match: "()", note: "MetroHasher.getSeed"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: delete, match: "( String value, int count )", note: "NanoCuckooFilter.delete"}
  - {class: net.cinnom.nanocuckoo.hash.XXHasher, method: getHash, match: "( byte[] data )", note: "XXHasher.getHash"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: delete, match: "( byte[] data, int count )", note: "NanoCuckooFilter.delete"}
  - {class: net.cinnom.nanocuckoo.hash.XXHasher, method: getSeed, match: "()", note: "XXHasher.getSeed"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: delete, match: "( long hash, int count )", note: "NanoCuckooFilter.delete"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: delete, match: "( String value )", note: "NanoCuckooFilter.delete"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: delete, match: "( byte[] data )", note: "NanoCuckooFilter.delete"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: delete, match: "( long hash )", note: "NanoCuckooFilter.delete"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: getMemoryUsageBytes, match: "()", note: "NanoCuckooFilter.getMemoryUsageBytes"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: getCapacity, match: "()", note: "NanoCuckooFilter.getCapacity"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: getLoadFactor, match: "()", note: "NanoCuckooFilter.getLoadFactor"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: expand, match: "()", note: "NanoCuckooFilter.expand"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: close, match: "()", note: "NanoCuckooFilter.close"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: loadFilter, match: "( final ObjectInputStream in ) throws IOException, ClassNotFoundException", note: "NanoCuckooFilter.loadFilter"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: saveFilter, match: "( final ObjectOutputStream out ) throws IOException", note: "NanoCuckooFilter.saveFilter"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: writeMemory, match: "( OutputStream outputStream ) throws IOException", note: "NanoCuckooFilter.writeMemory"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: readMemory, match: "( InputStream inputStream ) throws IOException", note: "NanoCuckooFilter.readMemory"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: run, match: "()", note: "NanoCuckooFilter.run"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: build, match: "()", note: "NanoCuckooFilter.build"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: withEntriesPerBucket, match: "( int entriesPerBucket )", note: "NanoCuckooFilter.withEntriesPerBucket"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: withFingerprintBits, match: "( int fpBits )", note: "NanoCuckooFilter.withFingerprintBits"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: withMaxKicks, match: "( int maxKicks )", note: "NanoCuckooFilter.withMaxKicks"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: withStringEncoder, match: "( StringEncoder stringEncoder )", note: "NanoCuckooFilter.withStringEncoder"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: withBucketHasher, match: "( BucketHasher bucketHasher )", note: "NanoCuckooFilter.withBucketHasher"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: withFingerprintHasher, match: "( FingerprintHasher fpHasher )", note: "NanoCuckooFilter.withFingerprintHasher"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: withConcurrency, match: "( int concurrency )", note: "NanoCuckooFilter.withConcurrency"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: withCountingEnabled, match: "( boolean countingEnabled )", note: "NanoCuckooFilter.withCountingEnabled"}
  - {class: net.cinnom.nanocuckoo.NanoCuckooFilter, method: withRandomInt, match: "( RandomInt randomInt )", note: "NanoCuckooFilter.withRandomInt"}
  - {class: net.cinnom.nanocuckoo.UnsafeProvider, method: getUnsafe, match: "()", note: "UnsafeProvider.getUnsafe"}
