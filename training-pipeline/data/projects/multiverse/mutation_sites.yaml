  - {class: org.multiverse.api.StmUtils, method: atomic, match: "(final Runnable runnable)", note: "StmUtils.atomic"}
  - {class: org.multiverse.api.functions.Functions, method: incIntFunction, match: "(int amount)", note: "Functions.incIntFunction"}
