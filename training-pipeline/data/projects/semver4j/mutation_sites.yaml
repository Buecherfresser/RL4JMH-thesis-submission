# Curated performance-mutation sites for semver4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants semver4j --source data/external-src/<checkout> \
#       --sites data/projects/semver4j/mutation_sites.yaml

package_root: org.semver4j.processor

sites:
  - {class: org.semver4j.processor.XRangeProcessor, method: process, match: "(String range, boolean includePreRelease)", note: "XRangeProcessor.process"}
  - {class: org.semver4j.processor.AllVersionsProcessor, method: process, match: "(String range, boolean includePreRelease)", note: "AllVersionsProcessor.process"}
  - {class: org.semver4j.processor.CaretProcessor, method: process, match: "(String range, boolean includePreRelease)", note: "CaretProcessor.process"}
  - {class: org.semver4j.processor.CompositeProcessor, method: all, match: "()", note: "CompositeProcessor.all"}
  - {class: org.semver4j.processor.CompositeProcessor, method: of, match: "(Processor... processors)", note: "CompositeProcessor.of"}
  - {class: org.semver4j.processor.CompositeProcessor, method: process, match: "(String range, boolean includePreRelease)", note: "CompositeProcessor.process"}
  - {class: org.semver4j.processor.HyphenProcessor, method: process, match: "(String range, boolean includePreRelease)", note: "HyphenProcessor.process"}
  - {class: org.semver4j.processor.IvyProcessor, method: process, match: "(String range, boolean includePreRelease)", note: "IvyProcessor.process"}
  - {class: org.semver4j.processor.Processors, method: allVersions, match: "()", note: "Processors.allVersions"}
  - {class: org.semver4j.processor.Processors, method: ivy, match: "()", note: "Processors.ivy"}
  - {class: org.semver4j.processor.Processors, method: hyphen, match: "()", note: "Processors.hyphen"}
  - {class: org.semver4j.processor.Processors, method: caret, match: "()", note: "Processors.caret"}
  - {class: org.semver4j.processor.Processors, method: tilde, match: "()", note: "Processors.tilde"}
  - {class: org.semver4j.processor.Processors, method: xRange, match: "()", note: "Processors.xRange"}
  - {class: org.semver4j.processor.TildeProcessor, method: process, match: "(String range, boolean includePreRelease)", note: "TildeProcessor.process"}
