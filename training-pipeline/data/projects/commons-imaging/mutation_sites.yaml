  - {class: org.apache.commons.imaging.FormatCompliance, method: getDefault, match: "()", note: "FormatCompliance.getDefault"}
  - {class: org.apache.commons.imaging.bytesource.ByteSource, method: array, match: "(final byte[] array)", note: "ByteSource.array"}
  - {class: org.apache.commons.imaging.common.BigEndianBinaryOutputStream, method: write2Bytes, match: "(final int value) throws IOException", note: "BigEndianBinaryOutputStream.write2Bytes"}
