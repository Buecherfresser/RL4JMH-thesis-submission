  - {class: net.neoremind.dynamicproxy.impl.ByteBuddyCreator, method: createInterceptorProxy, match: "(ClassLoader classLoader, Object target, Interceptor interceptor,", note: "ByteBuddyCreator.createInterceptorProxy"}
  - {class: net.neoremind.dynamicproxy.support.ReflectionInvocation, method: proceed, match: "() throws Throwable", note: "ReflectionInvocation.proceed"}
  - {class: net.neoremind.dynamicproxy.util.KeyAndValue, method: setKey, match: "(K key)", note: "KeyAndValue.setKey"}
  - {class: net.neoremind.dynamicproxy.impl.ByteBuddyCreator, method: createInvokerProxy, match: "(ClassLoader classLoader, ObjectInvoker invoker, Class<?>... proxyClasses)", note: "ByteBuddyCreator.createInvokerProxy"}
  - {class: net.neoremind.dynamicproxy.util.KeyAndValue, method: getValue, match: "()", note: "KeyAndValue.getValue"}
  - {class: net.neoremind.dynamicproxy.impl.CglibCreator, method: createDelegatorProxy, match: "(ClassLoader classLoader, ObjectProvider<?> targetProvider,", note: "CglibCreator.createDelegatorProxy"}
  - {class: net.neoremind.dynamicproxy.util.KeyAndValue, method: setValue, match: "(V value)", note: "KeyAndValue.setValue"}
  - {class: net.neoremind.dynamicproxy.impl.CglibCreator, method: createInterceptorProxy, match: "(ClassLoader classLoader, Object target, Interceptor interceptor,", note: "CglibCreator.createInterceptorProxy"}
  - {class: net.neoremind.dynamicproxy.impl.CglibCreator, method: createInvokerProxy, match: "(ClassLoader classLoader, ObjectInvoker invoker, Class<?>... proxyClasses)", note: "CglibCreator.createInvokerProxy"}
  - {class: net.neoremind.dynamicproxy.impl.CglibCreator, method: accept, match: "(Method method)", note: "CglibCreator.accept"}
  - {class: net.neoremind.dynamicproxy.impl.JavassistCreator, method: createDelegatorProxy, match: "(ClassLoader classLoader, ObjectProvider<?> targetProvider,", note: "JavassistCreator.createDelegatorProxy"}
  - {class: net.neoremind.dynamicproxy.impl.JavassistCreator, method: createInterceptorProxy, match: "(ClassLoader classLoader, Object target, Interceptor interceptor,", note: "JavassistCreator.createInterceptorProxy"}
  - {class: net.neoremind.dynamicproxy.impl.JavassistCreator, method: createInvokerProxy, match: "(ClassLoader classLoader, ObjectInvoker invoker, Class<?>... proxyClasses)", note: "JavassistCreator.createInvokerProxy"}
  - {class: net.neoremind.dynamicproxy.impl.JavassistCreator, method: generateProxyClass, match: "(ClassLoader classLoader, Class<?>... proxyClasses)", note: "JavassistCreator.generateProxyClass"}
  - {class: net.neoremind.dynamicproxy.impl.JdkProxyCreator, method: createDelegatorProxy, match: "(ClassLoader classLoader, ObjectProvider<?> delegateProvider,", note: "JdkProxyCreator.createDelegatorProxy"}
  - {class: net.neoremind.dynamicproxy.impl.JdkProxyCreator, method: createInterceptorProxy, match: "(ClassLoader classLoader, Object target, Interceptor interceptor,", note: "JdkProxyCreator.createInterceptorProxy"}
