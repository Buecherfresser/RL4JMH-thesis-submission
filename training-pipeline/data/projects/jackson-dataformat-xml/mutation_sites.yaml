# Curated performance-mutation sites for jackson-dataformat-xml (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jackson-dataformat-xml --source data/external-src/<checkout> \
#       --sites data/projects/jackson-dataformat-xml/mutation_sites.yaml

