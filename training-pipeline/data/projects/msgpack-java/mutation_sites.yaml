# Curated performance-mutation sites for msgpack-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants msgpack-java --source data/external-src/<checkout> \
#       --sites data/projects/msgpack-java/mutation_sites.yaml

package_root: org.msgpack

sites:
  - {class: org.msgpack.core.MessageBufferPacker, method: reset, match: "(MessageBufferOutput out)", note: "MessageBufferPacker.reset"}
  - {class: org.msgpack.jackson.dataformat.JsonArrayFormat, method: findFormat, match: "(Annotated ann)", note: "JsonArrayFormat.findFormat"}
  - {class: org.msgpack.value.impl.ImmutableArrayValueImpl, method: empty, match: "()", note: "ImmutableArrayValueImpl.empty"}
  - {class: org.msgpack.core.MessageBufferPacker, method: clear, match: "()", note: "MessageBufferPacker.clear"}
  - {class: org.msgpack.jackson.dataformat.MessagePackMapper, method: handleBigIntegerAsString, match: "()", note: "MessagePackMapper.handleBigIntegerAsString"}
  - {class: org.msgpack.value.impl.ImmutableArrayValueImpl, method: getValueType, match: "()", note: "ImmutableArrayValueImpl.getValueType"}
  - {class: org.msgpack.core.MessageStringCodingException, method: getCause, match: "()", note: "MessageStringCodingException.getCause"}
  - {class: org.msgpack.jackson.dataformat.MessagePackMapper, method: handleBigDecimalAsString, match: "()", note: "MessagePackMapper.handleBigDecimalAsString"}
  - {class: org.msgpack.value.impl.ImmutableMapValueImpl, method: empty, match: "()", note: "ImmutableMapValueImpl.empty"}
  - {class: org.msgpack.core.buffer.ArrayBufferInput, method: reset, match: "(MessageBuffer buf)", note: "ArrayBufferInput.reset"}
  - {class: org.msgpack.jackson.dataformat.MessagePackParser, method: setExtensionTypeCustomDeserializers, match: "(ExtensionTypeCustomDeserializers extTypeCustomDesers)", note: "MessagePackParser.setExtensionTypeCustomDeserializers"}
  - {class: org.msgpack.value.impl.ImmutableMapValueImpl, method: getValueType, match: "()", note: "ImmutableMapValueImpl.getValueType"}
  - {class: org.msgpack.core.buffer.ArrayBufferInput, method: reset, match: "(byte[] arr)", note: "ArrayBufferInput.reset"}
  - {class: org.msgpack.jackson.dataformat.MessagePackParser, method: getCodec, match: "()", note: "MessagePackParser.getCodec"}
  - {class: org.msgpack.value.impl.ImmutableStringValueImpl, method: getValueType, match: "()", note: "ImmutableStringValueImpl.getValueType"}
  - {class: org.msgpack.core.buffer.ArrayBufferOutput, method: getSize, match: "()", note: "ArrayBufferOutput.getSize"}
  - {class: org.msgpack.jackson.dataformat.MessagePackSerializedString, method: getValue, match: "()", note: "MessagePackSerializedString.getValue"}
  - {class: org.msgpack.value.impl.ImmutableStringValueImpl, method: immutableValue, match: "()", note: "ImmutableStringValueImpl.immutableValue"}
  - {class: org.msgpack.core.buffer.ArrayBufferOutput, method: toByteArray, match: "()", note: "ArrayBufferOutput.toByteArray"}
