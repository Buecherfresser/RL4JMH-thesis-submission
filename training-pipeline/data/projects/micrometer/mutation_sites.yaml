# Curated performance-mutation sites for micrometer (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants micrometer --source data/external-src/<checkout> \
#       --sites data/projects/micrometer/mutation_sites.yaml

package_root: io.micrometer

sites:
  - {class: io.micrometer.appoptics.AppOpticsMeterRegistry, method: map, match: "(Meter.Id id)", note: "AppOpticsMeterRegistry.map"}
  - {class: io.micrometer.atlas.AtlasMeterRegistry, method: wallTime, match: "()", note: "AtlasMeterRegistry.wallTime"}
  - {class: io.micrometer.azuremonitor.AzureMonitorMeterRegistry, method: builder, match: "(AzureMonitorConfig config)", note: "AzureMonitorMeterRegistry.builder"}
  - {class: io.micrometer.cloudwatch2.CloudWatchMeterRegistry, method: publish, match: "()", note: "CloudWatchMeterRegistry.publish"}
  - {class: io.micrometer.common.util.StringUtils, method: truncate, match: "(String string, int maxLength)", note: "StringUtils.truncate"}
  - {class: io.micrometer.core.instrument.StrongReferenceGaugeFunction, method: applyAsDouble, match: "(T value)", note: "StrongReferenceGaugeFunction.applyAsDouble"}
  - {class: io.micrometer.datadog.DatadogMeterRegistry, method: start, match: "(ThreadFactory threadFactory)", note: "DatadogMeterRegistry.start"}
  - {class: io.micrometer.dynatrace.DynatraceMeterRegistry, method: builder, match: "(DynatraceConfig config)", note: "DynatraceMeterRegistry.builder"}
  - {class: io.micrometer.elastic.DefaultIndexTemplateCreator, method: fetchIndexTemplateStatus, match: "(ElasticConfig configuration)", note: "DefaultIndexTemplateCreator.fetchIndexTemplateStatus"}
  - {class: io.micrometer.ganglia.GangliaMeterRegistry, method: builder, match: "(GangliaConfig config)", note: "GangliaMeterRegistry.builder"}
  - {class: io.micrometer.graphite.GraphiteDimensionalNameMapper, method: toHierarchicalName, match: "(Meter.Id id, NamingConvention convention)", note: "GraphiteDimensionalNameMapper.toHierarchicalName"}
  - {class: io.micrometer.health.HealthMeterRegistry, method: step, match: "()", note: "HealthMeterRegistry.step"}
  - {class: io.micrometer.humio.HumioMeterRegistry, method: builder, match: "(HumioConfig config)", note: "HumioMeterRegistry.builder"}
  - {class: io.micrometer.influx.InfluxMeterRegistry, method: start, match: "(ThreadFactory threadFactory)", note: "InfluxMeterRegistry.start"}
  - {class: io.micrometer.jakarta9.instrument.jms.DefaultJmsProcessObservationConvention, method: getName, match: "()", note: "DefaultJmsProcessObservationConvention.getName"}
  - {class: io.micrometer.java11.instrument.binder.jdk.DefaultHttpClientObservationConvention, method: getLowCardinalityKeyValues, match: "(HttpClientContext context)", note: "DefaultHttpClientObservationConvention.getLowCardinalityKeyValues"}
  - {class: io.micrometer.java21.instrument.binder.jdk.VirtualThreadMetrics, method: bindTo, match: "(MeterRegistry registry)", note: "VirtualThreadMetrics.bindTo"}
  - {class: io.micrometer.jetty11.TimedHandler, method: isShutdownDone, match: "()", note: "TimedHandler.isShutdownDone"}
  - {class: io.micrometer.jetty12.client.DefaultJettyClientObservationConvention, method: getLowCardinalityKeyValues, match: "(JettyClientContext context)", note: "DefaultJettyClientObservationConvention.getLowCardinalityKeyValues"}
  - {class: io.micrometer.jmx.JmxMeterRegistry, method: stop, match: "()", note: "JmxMeterRegistry.stop"}
  - {class: io.micrometer.kairos.KairosMeterRegistry, method: builder, match: "(KairosConfig config)", note: "KairosMeterRegistry.builder"}
  - {class: io.micrometer.newrelic.NewRelicInsightsAgentClientProvider, method: publish, match: "(NewRelicMeterRegistry meterRegistry)", note: "NewRelicInsightsAgentClientProvider.publish"}
  - {class: io.micrometer.observation.NoopButScopeHandlingObservation, method: lowCardinalityKeyValue, match: "(KeyValue keyValue)", note: "NoopButScopeHandlingObservation.lowCardinalityKeyValue"}
  - {class: io.micrometer.opentsdb.OpenTSDBDistributionSummary, method: recordNonNegative, match: "(double amount)", note: "OpenTSDBDistributionSummary.recordNonNegative"}
  - {class: io.micrometer.prometheus.MicrometerCollector, method: isEmpty, match: "()", note: "MicrometerCollector.isEmpty"}
  - {class: io.micrometer.prometheusmetrics.DefaultExemplarSamplerFactory, method: createExemplarSampler, match: "(int numberOfExemplars)", note: "DefaultExemplarSamplerFactory.createExemplarSampler"}
  - {class: io.micrometer.registry.otlp.OtlpCumulativeFunctionCounter, method: getStartTimeNanos, match: "()", note: "OtlpCumulativeFunctionCounter.getStartTimeNanos"}
  - {class: io.micrometer.signalfx.SignalFxMeterRegistry, method: publish, match: "()", note: "SignalFxMeterRegistry.publish"}
  - {class: io.micrometer.stackdriver.StackdriverMeterRegistry, method: builder, match: "(StackdriverConfig config)", note: "StackdriverMeterRegistry.builder"}
  - {class: io.micrometer.statsd.StatsdFunctionCounter, method: poll, match: "()", note: "StatsdFunctionCounter.poll"}
  - {class: io.micrometer.wavefront.WavefrontDistributionSummary, method: recordNonNegative, match: "(double amount)", note: "WavefrontDistributionSummary.recordNonNegative"}
  - {class: io.micrometer.appoptics.AppOpticsMeterRegistry, method: builder, match: "(AppOpticsConfig config)", note: "AppOpticsMeterRegistry.builder"}
  - {class: io.micrometer.atlas.AtlasMeterRegistry, method: monotonicTime, match: "()", note: "AtlasMeterRegistry.monotonicTime"}
  - {class: io.micrometer.azuremonitor.AzureMonitorMeterRegistry, method: publish, match: "()", note: "AzureMonitorMeterRegistry.publish"}
  - {class: io.micrometer.cloudwatch2.CloudWatchMeterRegistry, method: getBaseTimeUnit, match: "()", note: "CloudWatchMeterRegistry.getBaseTimeUnit"}
  - {class: io.micrometer.common.util.StringUtils, method: truncate, match: "(String string, int maxLength, String truncationIndicator)", note: "StringUtils.truncate"}
  - {class: io.micrometer.core.instrument.binder.db.JooqExecuteListener, method: start, match: "(ExecuteContext ctx)", note: "JooqExecuteListener.start"}
  - {class: io.micrometer.datadog.DatadogMeterRegistry, method: publish, match: "()", note: "DatadogMeterRegistry.publish"}
  - {class: io.micrometer.dynatrace.DynatraceMeterRegistry, method: publish, match: "()", note: "DynatraceMeterRegistry.publish"}
  - {class: io.micrometer.elastic.DefaultIndexTemplateCreator, method: createIndexTemplate, match: "(ElasticConfig configuration) throws Throwable", note: "DefaultIndexTemplateCreator.createIndexTemplate"}
  - {class: io.micrometer.ganglia.GangliaMeterRegistry, method: publish, match: "()", note: "GangliaMeterRegistry.publish"}
  - {class: io.micrometer.graphite.GraphiteHierarchicalNameMapper, method: toHierarchicalName, match: "(Meter.Id id, NamingConvention convention)", note: "GraphiteHierarchicalNameMapper.toHierarchicalName"}
  - {class: io.micrometer.health.HealthMeterRegistry, method: mode, match: "()", note: "HealthMeterRegistry.mode"}
  - {class: io.micrometer.humio.HumioMeterRegistry, method: publish, match: "()", note: "HumioMeterRegistry.publish"}
  - {class: io.micrometer.influx.InfluxMeterRegistry, method: builder, match: "(InfluxConfig config)", note: "InfluxMeterRegistry.builder"}
  - {class: io.micrometer.jakarta9.instrument.jms.DefaultJmsProcessObservationConvention, method: getContextualName, match: "(JmsProcessObservationContext context)", note: "DefaultJmsProcessObservationConvention.getContextualName"}
  - {class: io.micrometer.java11.instrument.binder.jdk.DefaultHttpClientObservationConvention, method: getName, match: "()", note: "DefaultHttpClientObservationConvention.getName"}
  - {class: io.micrometer.java21.instrument.binder.jdk.VirtualThreadMetrics, method: close, match: "()", note: "VirtualThreadMetrics.close"}
  - {class: io.micrometer.jetty11.TimedHandler, method: onTimeout, match: "(AsyncEvent event)", note: "TimedHandler.onTimeout"}
  - {class: io.micrometer.jetty12.client.DefaultJettyClientObservationConvention, method: getName, match: "()", note: "DefaultJettyClientObservationConvention.getName"}
