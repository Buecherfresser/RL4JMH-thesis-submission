  - {class: com.apicatalog.jsonld.loader.ClasspathLoader, method: loadDocument, match: "(URI url, Options options) throws JsonLdException", note: "ClasspathLoader.loadDocument"}
  - {class: com.apicatalog.jsonld.processor.Expander, method: expand, match: "(", note: "Expander.expand"}
