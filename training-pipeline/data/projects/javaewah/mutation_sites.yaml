# Curated performance-mutation sites for javaewah (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants javaewah --source data/external-src/<checkout> \
#       --sites data/projects/javaewah/mutation_sites.yaml

package_root: com.googlecode.javaewah

sites:
  - {class: com.googlecode.javaewah.BufferedIterator, method: discardFirstWords, match: "(long x)", note: "BufferedIterator.discardFirstWords"}
  - {class: com.googlecode.javaewah.datastructure.BitSet, method: and, match: "(WordArray bs)", note: "BitSet.and"}
  - {class: com.googlecode.javaewah.symmetric.EWAHPointer, method: endOfRun, match: "()", note: "EWAHPointer.endOfRun"}
  - {class: com.googlecode.javaewah.BufferedIterator, method: discardLiteralWords, match: "(long x)", note: "BufferedIterator.discardLiteralWords"}
  - {class: com.googlecode.javaewah.datastructure.BitSet, method: andcardinality, match: "(WordArray bs)", note: "BitSet.andcardinality"}
  - {class: com.googlecode.javaewah.symmetric.EWAHPointer, method: beginOfRun, match: "()", note: "EWAHPointer.beginOfRun"}
  - {class: com.googlecode.javaewah.BufferedIterator, method: discardRunningWords, match: "()", note: "BufferedIterator.discardRunningWords"}
  - {class: com.googlecode.javaewah.datastructure.BitSet, method: andNot, match: "(WordArray bs)", note: "BitSet.andNot"}
  - {class: com.googlecode.javaewah.symmetric.EWAHPointer, method: parseNextRun, match: "()", note: "EWAHPointer.parseNextRun"}
  - {class: com.googlecode.javaewah.BufferedRunningLengthWord, method: discardFirstWords, match: "(long x)", note: "BufferedRunningLengthWord.discardFirstWords"}
  - {class: com.googlecode.javaewah.datastructure.ImmutableBitSet, method: asBitSet, match: "()", note: "ImmutableBitSet.asBitSet"}
  - {class: com.googlecode.javaewah.symmetric.RunningBitmapMerge, method: symmetric, match: "(UpdateableBitmapFunction f, BitmapStorage out,", note: "RunningBitmapMerge.symmetric"}
  - {class: com.googlecode.javaewah.BufferedRunningLengthWord, method: getNumberOfLiteralWords, match: "()", note: "BufferedRunningLengthWord.getNumberOfLiteralWords"}
  - {class: com.googlecode.javaewah.datastructure.ImmutableBitSet, method: cardinality, match: "()", note: "ImmutableBitSet.cardinality"}
  - {class: com.googlecode.javaewah.symmetric.ThresholdFuncBitmap, method: dispatch, match: "(BitmapStorage out, int runBegin, int runEnd)", note: "ThresholdFuncBitmap.dispatch"}
  - {class: com.googlecode.javaewah.BufferedRunningLengthWord, method: getRunningBit, match: "()", note: "BufferedRunningLengthWord.getRunningBit"}
  - {class: com.googlecode.javaewah.datastructure.ImmutableBitSet, method: empty, match: "()", note: "ImmutableBitSet.empty"}
  - {class: com.googlecode.javaewah.IteratingBufferedRunningLengthWord, method: discardFirstWords, match: "(long x)", note: "IteratingBufferedRunningLengthWord.discardFirstWords"}
  - {class: com.googlecode.javaewah.datastructure.PriorityQ, method: size, match: "()", note: "PriorityQ.size"}
  - {class: com.googlecode.javaewah.IteratingBufferedRunningLengthWord, method: discardLiteralWords, match: "(long x)", note: "IteratingBufferedRunningLengthWord.discardLiteralWords"}
  - {class: com.googlecode.javaewah.datastructure.PriorityQ, method: toss, match: "(final T t)", note: "PriorityQ.toss"}
  - {class: com.googlecode.javaewah.IteratingBufferedRunningLengthWord, method: discardRunningWords, match: "()", note: "IteratingBufferedRunningLengthWord.discardRunningWords"}
  - {class: com.googlecode.javaewah.datastructure.PriorityQ, method: peek, match: "()", note: "PriorityQ.peek"}
  - {class: com.googlecode.javaewah.IteratorUtil, method: toSetBitsIntIterator, match: "(final IteratingRLW i)", note: "IteratorUtil.toSetBitsIntIterator"}
  - {class: com.googlecode.javaewah.IteratorUtil, method: toSetBitsIterator, match: "(final IteratingRLW i)", note: "IteratorUtil.toSetBitsIterator"}
  - {class: com.googlecode.javaewah.IteratorUtil, method: materialize, match: "(final IteratingRLW i,", note: "IteratorUtil.materialize"}
  - {class: com.googlecode.javaewah.LongArray, method: sizeInWords, match: "()", note: "LongArray.sizeInWords"}
  - {class: com.googlecode.javaewah.LongArray, method: ensureCapacity, match: "(int capacity)", note: "LongArray.ensureCapacity"}
  - {class: com.googlecode.javaewah.LongArray, method: getWord, match: "(int position)", note: "LongArray.getWord"}
  - {class: com.googlecode.javaewah.LongBufferWrapper, method: sizeInWords, match: "()", note: "LongBufferWrapper.sizeInWords"}
  - {class: com.googlecode.javaewah.LongBufferWrapper, method: ensureCapacity, match: "(int capacity)", note: "LongBufferWrapper.ensureCapacity"}
  - {class: com.googlecode.javaewah.LongBufferWrapper, method: getWord, match: "(int position)", note: "LongBufferWrapper.getWord"}
  - {class: com.googlecode.javaewah.BitCounter, method: addWord, match: "(final long newData)", note: "BitCounter.addWord"}
  - {class: com.googlecode.javaewah.BitCounter, method: addLiteralWord, match: "(final long newData)", note: "BitCounter.addLiteralWord"}
  - {class: com.googlecode.javaewah.BitCounter, method: addStreamOfLiteralWords, match: "(final Buffer buffer, int start, int number)", note: "BitCounter.addStreamOfLiteralWords"}
  - {class: com.googlecode.javaewah.ChunkIteratorImpl, method: nextBit, match: "()", note: "ChunkIteratorImpl.nextBit"}
  - {class: com.googlecode.javaewah.ChunkIteratorImpl, method: nextLength, match: "()", note: "ChunkIteratorImpl.nextLength"}
  - {class: com.googlecode.javaewah.ChunkIteratorImpl, method: move, match: "()", note: "ChunkIteratorImpl.move"}
  - {class: com.googlecode.javaewah.ClearIntIterator, method: moveToNext, match: "()", note: "ClearIntIterator.moveToNext"}
  - {class: com.googlecode.javaewah.EWAHCompressedBitmap, method: addWord, match: "(final long newData)", note: "EWAHCompressedBitmap.addWord"}
  - {class: com.googlecode.javaewah.EWAHCompressedBitmap, method: addWord, match: "(final long newData, final int bitsThatMatter)", note: "EWAHCompressedBitmap.addWord"}
  - {class: com.googlecode.javaewah.EWAHCompressedBitmap, method: addLiteralWord, match: "(final long newData)", note: "EWAHCompressedBitmap.addLiteralWord"}
  - {class: com.googlecode.javaewah.EWAHIterator, method: getEWAHIterator, match: "(EWAHCompressedBitmap bitmap)", note: "EWAHIterator.getEWAHIterator"}
  - {class: com.googlecode.javaewah.EWAHIterator, method: buffer, match: "()", note: "EWAHIterator.buffer"}
  - {class: com.googlecode.javaewah.EWAHIterator, method: literalWords, match: "()", note: "EWAHIterator.literalWords"}
  - {class: com.googlecode.javaewah.FastAggregation, method: bufferedand, match: "(final int bufSize,", note: "FastAggregation.bufferedand"}
  - {class: com.googlecode.javaewah.FastAggregation, method: bufferedandWithContainer, match: "(", note: "FastAggregation.bufferedandWithContainer"}
  - {class: com.googlecode.javaewah.FastAggregation, method: bufferedor, match: "(final int bufSize,", note: "FastAggregation.bufferedor"}
  - {class: com.googlecode.javaewah.IntIteratorImpl, method: moveToNext, match: "()", note: "IntIteratorImpl.moveToNext"}
  - {class: com.googlecode.javaewah.IteratorAggregation, method: not, match: "(final IteratingRLW x)", note: "IteratorAggregation.not"}
