# Curated performance-mutation sites for atlas (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants atlas --source data/external-src/<checkout> \
#       --sites data/projects/atlas/mutation_sites.yaml

package_root: org.openstreetmap.atlas

sites:
  - {class: org.openstreetmap.atlas.event.EventService, method: complete, match: "()", note: "EventService.complete"}
  - {class: org.openstreetmap.atlas.exception.CoreException, method: supplier, match: "(final String message)", note: "CoreException.supplier"}
  - {class: org.openstreetmap.atlas.geography.StringCompressedPolyLine, method: asPolyLine, match: "()", note: "StringCompressedPolyLine.asPolyLine"}
  - {class: org.openstreetmap.atlas.locale.IsoCountry, method: allCountryCodes, match: "()", note: "IsoCountry.allCountryCodes"}
  - {class: org.openstreetmap.atlas.proto.adapters.ProtoByteArrayOfArraysAdapter, method: deserialize, match: "(final byte[] byteArray)", note: "ProtoByteArrayOfArraysAdapter.deserialize"}
  - {class: org.openstreetmap.atlas.streaming.CounterOutputStream, method: close, match: "()", note: "CounterOutputStream.close"}
  - {class: org.openstreetmap.atlas.tags.annotations.extraction.NonEmptyStringExtractor, method: validateAndExtract, match: "(final String value)", note: "NonEmptyStringExtractor.validateAndExtract"}
  - {class: org.openstreetmap.atlas.utilities.arrays.Arrays, method: addNewItem, match: "(final int[] existing, final int newValue)", note: "Arrays.addNewItem"}
  - {class: org.openstreetmap.atlas.event.EventService, method: post, match: "(final T event)", note: "EventService.post"}
  - {class: org.openstreetmap.atlas.exception.CoreException, method: supplier, match: "(final String message, final Object... arguments)", note: "CoreException.supplier"}
  - {class: org.openstreetmap.atlas.geography.StringCompressedPolyLine, method: getEncoding, match: "()", note: "StringCompressedPolyLine.getEncoding"}
  - {class: org.openstreetmap.atlas.locale.IsoCountry, method: allDisplayCountries, match: "()", note: "IsoCountry.allDisplayCountries"}
  - {class: org.openstreetmap.atlas.proto.adapters.ProtoByteArrayOfArraysAdapter, method: serialize, match: "(final ProtoSerializable serializable)", note: "ProtoByteArrayOfArraysAdapter.serialize"}
  - {class: org.openstreetmap.atlas.streaming.CounterOutputStream, method: getCount, match: "()", note: "CounterOutputStream.getCount"}
  - {class: org.openstreetmap.atlas.tags.annotations.validation.NonEmptyStringValidator, method: isValid, match: "(final String value)", note: "NonEmptyStringValidator.isValid"}
  - {class: org.openstreetmap.atlas.utilities.arrays.Arrays, method: addNewItem, match: "(final long[] existing, final long newValue)", note: "Arrays.addNewItem"}
  - {class: org.openstreetmap.atlas.exception.ExceptionSearch, method: find, match: "(final Class<T> target)", note: "ExceptionSearch.find"}
  - {class: org.openstreetmap.atlas.geography.StringCompressedPolygon, method: asPolygon, match: "()", note: "StringCompressedPolygon.asPolygon"}
  - {class: org.openstreetmap.atlas.locale.IsoCountryFuzzyMatcher, method: forDisplayCountryTopMatches, match: "(final int number,", note: "IsoCountryFuzzyMatcher.forDisplayCountryTopMatches"}
  - {class: org.openstreetmap.atlas.proto.adapters.ProtoIntegerArrayOfArraysAdapter, method: deserialize, match: "(final byte[] byteArray)", note: "ProtoIntegerArrayOfArraysAdapter.deserialize"}
  - {class: org.openstreetmap.atlas.streaming.NotifyingIOUtils, method: withBufferSize, match: "(final int bufferSize)", note: "NotifyingIOUtils.withBufferSize"}
  - {class: org.openstreetmap.atlas.tags.filters.matcher.parsing.Parser, method: parse, match: "()", note: "Parser.parse"}
  - {class: org.openstreetmap.atlas.utilities.arrays.BitArray, method: getNewArray, match: "(final int size)", note: "BitArray.getNewArray"}
  - {class: org.openstreetmap.atlas.exception.ExceptionSearch, method: within, match: "(final Throwable source)", note: "ExceptionSearch.within"}
  - {class: org.openstreetmap.atlas.geography.atlas.builder.GeoJsonAtlasBuilder, method: getIdentifier, match: "()", note: "GeoJsonAtlasBuilder.getIdentifier"}
  - {class: org.openstreetmap.atlas.locale.IsoLanguage, method: all, match: "()", note: "IsoLanguage.all"}
  - {class: org.openstreetmap.atlas.proto.adapters.ProtoIntegerArrayOfArraysAdapter, method: serialize, match: "(final ProtoSerializable serializable)", note: "ProtoIntegerArrayOfArraysAdapter.serialize"}
  - {class: org.openstreetmap.atlas.streaming.NotifyingIOUtils, method: withListener, match: "(final IOProgressListener listener)", note: "NotifyingIOUtils.withListener"}
  - {class: org.openstreetmap.atlas.tags.AccessTag, method: isNo, match: "(final Taggable taggable)", note: "AccessTag.isNo"}
  - {class: org.openstreetmap.atlas.utilities.arrays.BitArray, method: getNewArray, match: "(final int size)", note: "BitArray.getNewArray"}
  - {class: org.openstreetmap.atlas.exception.LoadAtlasFromResourceException, method: getResource, match: "()", note: "LoadAtlasFromResourceException.getResource"}
  - {class: org.openstreetmap.atlas.geography.atlas.builder.GeoJsonAtlasBuilder, method: getPolyLine, match: "()", note: "GeoJsonAtlasBuilder.getPolyLine"}
  - {class: org.openstreetmap.atlas.locale.IsoLanguage, method: allLanguageCodes, match: "()", note: "IsoLanguage.allLanguageCodes"}
  - {class: org.openstreetmap.atlas.proto.adapters.ProtoIntegerStringDictionaryAdapter, method: deserialize, match: "(final byte[] byteArray)", note: "ProtoIntegerStringDictionaryAdapter.deserialize"}
  - {class: org.openstreetmap.atlas.streaming.SplittableInputStream, method: addSource, match: "(final int splitIdentifier)", note: "SplittableInputStream.addSource"}
  - {class: org.openstreetmap.atlas.tags.AccessTag, method: isPrivate, match: "(final Taggable taggable)", note: "AccessTag.isPrivate"}
  - {class: org.openstreetmap.atlas.utilities.arrays.BooleanArray, method: getNewArray, match: "(final int size)", note: "BooleanArray.getNewArray"}
  - {class: org.openstreetmap.atlas.exception.change.FeatureChangeMergeException, method: failureAtFrameIndex, match: "(final int index)", note: "FeatureChangeMergeException.failureAtFrameIndex"}
  - {class: org.openstreetmap.atlas.geography.atlas.builder.text.TextAtlasBuilder, method: forHeader, match: "(final String header)", note: "TextAtlasBuilder.forHeader"}
  - {class: org.openstreetmap.atlas.proto.adapters.ProtoIntegerStringDictionaryAdapter, method: serialize, match: "(final ProtoSerializable serializable)", note: "ProtoIntegerStringDictionaryAdapter.serialize"}
  - {class: org.openstreetmap.atlas.streaming.SplittableInputStream, method: split, match: "()", note: "SplittableInputStream.split"}
  - {class: org.openstreetmap.atlas.tags.BarrierTag, method: isBarrier, match: "(final Taggable taggable)", note: "BarrierTag.isBarrier"}
  - {class: org.openstreetmap.atlas.utilities.arrays.BooleanArray, method: getNewArray, match: "(final int size)", note: "BooleanArray.getNewArray"}
  - {class: org.openstreetmap.atlas.exception.change.FeatureChangeMergeException, method: failureTraceSize, match: "()", note: "FeatureChangeMergeException.failureTraceSize"}
  - {class: org.openstreetmap.atlas.geography.atlas.builder.text.TextAtlasBuilder, method: getHeader, match: "()", note: "TextAtlasBuilder.getHeader"}
  - {class: org.openstreetmap.atlas.proto.adapters.ProtoLongArrayAdapter, method: deserialize, match: "(final byte[] byteArray)", note: "ProtoLongArrayAdapter.deserialize"}
  - {class: org.openstreetmap.atlas.streaming.Streams, method: close, match: "(final Closeable stream)", note: "Streams.close"}
  - {class: org.openstreetmap.atlas.tags.BoundaryTag, method: isAdministrative, match: "(final Taggable taggable)", note: "BoundaryTag.isAdministrative"}
  - {class: org.openstreetmap.atlas.utilities.arrays.ByteArray, method: getNewArray, match: "(final int size)", note: "ByteArray.getNewArray"}
  - {class: org.openstreetmap.atlas.exception.change.MergeFailureType, method: getDescription, match: "()", note: "MergeFailureType.getDescription"}
