  - {class: org.joda.time.convert.DateConverter, method: getSupportedType, match: "()", note: "DateConverter.getSupportedType"}
  - {class: org.joda.time.field.DelegatedDurationField, method: getName, match: "()", note: "DelegatedDurationField.getName"}
  - {class: org.joda.time.format.FormatUtils, method: appendPaddedInteger, match: "(Appendable appenadble, int value, int size) throws IOException", note: "FormatUtils.appendPaddedInteger"}
