# Curated performance-mutation sites for jmail (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jmail --source data/external-src/<checkout> \
#       --sites data/projects/jmail/mutation_sites.yaml

package_root: com.sanctionco.jmail

sites:
  - {class: com.sanctionco.jmail.Email, method: of, match: "(String email)", note: "Email.of"}
  - {class: com.sanctionco.jmail.disposable.InputStreamSource, method: isDisposableDomain, match: "(String domain)", note: "InputStreamSource.isDisposableDomain"}
  - {class: com.sanctionco.jmail.dns.DNSLookupUtil, method: hasMXRecord, match: "(String domain)", note: "DNSLookupUtil.hasMXRecord"}
  - {class: com.sanctionco.jmail.net.InternetProtocolAddress, method: isValid, match: "(String ip)", note: "InternetProtocolAddress.isValid"}
  - {class: com.sanctionco.jmail.normalization.NormalizationOptionsBuilder, method: keepQuotes, match: "()", note: "NormalizationOptionsBuilder.keepQuotes"}
  - {class: com.sanctionco.jmail.Email, method: localPart, match: "()", note: "Email.localPart"}
  - {class: com.sanctionco.jmail.disposable.IsTempMailAPISource, method: isDisposableDomain, match: "(String domain)", note: "IsTempMailAPISource.isDisposableDomain"}
  - {class: com.sanctionco.jmail.dns.DNSLookupUtil, method: hasMXRecord, match: "(String domain, int initialTimeout, int numRetries)", note: "DNSLookupUtil.hasMXRecord"}
  - {class: com.sanctionco.jmail.net.InternetProtocolAddress, method: enforceValid, match: "(String ip)", note: "InternetProtocolAddress.enforceValid"}
  - {class: com.sanctionco.jmail.normalization.NormalizationOptionsBuilder, method: adjustCase, match: "(CaseOption caseOption)", note: "NormalizationOptionsBuilder.adjustCase"}
  - {class: com.sanctionco.jmail.Email, method: localPartWithoutComments, match: "()", note: "Email.localPartWithoutComments"}
  - {class: com.sanctionco.jmail.net.InternetProtocolAddress, method: validate, match: "(String ip)", note: "InternetProtocolAddress.validate"}
  - {class: com.sanctionco.jmail.normalization.NormalizationOptionsBuilder, method: removeDots, match: "()", note: "NormalizationOptionsBuilder.removeDots"}
  - {class: com.sanctionco.jmail.Email, method: domain, match: "()", note: "Email.domain"}
  - {class: com.sanctionco.jmail.net.InternetProtocolAddress, method: validateIpv4, match: "(String ip)", note: "InternetProtocolAddress.validateIpv4"}
  - {class: com.sanctionco.jmail.normalization.NormalizationOptionsBuilder, method: removeSubAddress, match: "()", note: "NormalizationOptionsBuilder.removeSubAddress"}
  - {class: com.sanctionco.jmail.Email, method: domainWithoutComments, match: "()", note: "Email.domainWithoutComments"}
  - {class: com.sanctionco.jmail.net.InternetProtocolAddress, method: validateIpv6, match: "(String ip)", note: "InternetProtocolAddress.validateIpv6"}
  - {class: com.sanctionco.jmail.normalization.NormalizationOptionsBuilder, method: removeSubAddress, match: "(String separator)", note: "NormalizationOptionsBuilder.removeSubAddress"}
  - {class: com.sanctionco.jmail.Email, method: identifier, match: "()", note: "Email.identifier"}
  - {class: com.sanctionco.jmail.normalization.NormalizationOptionsBuilder, method: performUnicodeNormalization, match: "()", note: "NormalizationOptionsBuilder.performUnicodeNormalization"}
  - {class: com.sanctionco.jmail.EmailValidationResult, method: isSuccess, match: "()", note: "EmailValidationResult.isSuccess"}
  - {class: com.sanctionco.jmail.normalization.CaseOption, method: adjustLocalPart, match: "(String localPart)", note: "CaseOption.adjustLocalPart"}
  - {class: com.sanctionco.jmail.EmailValidationResult, method: isFailure, match: "()", note: "EmailValidationResult.isFailure"}
  - {class: com.sanctionco.jmail.normalization.CaseOption, method: adjustDomain, match: "(String domain)", note: "CaseOption.adjustDomain"}
  - {class: com.sanctionco.jmail.EmailValidationResult, method: getEmail, match: "()", note: "EmailValidationResult.getEmail"}
  - {class: com.sanctionco.jmail.normalization.IDNConverter, method: labelsToAsciiDomain, match: "(List<String> labels)", note: "IDNConverter.labelsToAsciiDomain"}
  - {class: com.sanctionco.jmail.EmailValidationResult, method: getFailureReason, match: "()", note: "EmailValidationResult.getFailureReason"}
  - {class: com.sanctionco.jmail.normalization.NormalizationOptions, method: getCaseOption, match: "()", note: "NormalizationOptions.getCaseOption"}
  - {class: com.sanctionco.jmail.EmailValidationResult, method: ifValid, match: "(Consumer<Email> action)", note: "EmailValidationResult.ifValid"}
  - {class: com.sanctionco.jmail.normalization.NormalizationOptions, method: shouldRemoveDots, match: "()", note: "NormalizationOptions.shouldRemoveDots"}
  - {class: com.sanctionco.jmail.EmailValidationResult, method: ifValidOrElse, match: "(Consumer<Email> action, Consumer<FailureReason> failureAction)", note: "EmailValidationResult.ifValidOrElse"}
  - {class: com.sanctionco.jmail.normalization.NormalizationOptions, method: shouldRemoveSubAddress, match: "()", note: "NormalizationOptions.shouldRemoveSubAddress"}
  - {class: com.sanctionco.jmail.EmailValidator, method: withRules, match: "(Map<Predicate<Email>, FailureReason> rules)", note: "EmailValidator.withRules"}
  - {class: com.sanctionco.jmail.normalization.NormalizationOptions, method: shouldStripQuotes, match: "()", note: "NormalizationOptions.shouldStripQuotes"}
