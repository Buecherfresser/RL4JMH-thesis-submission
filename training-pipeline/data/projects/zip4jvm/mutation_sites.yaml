# Curated performance-mutation sites for zip4jvm (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants zip4jvm --source data/external-src/<checkout> \
#       --sites data/projects/zip4jvm/mutation_sites.yaml

package_root: ru.olegcherednik.zip4jvm

sites:
  - {class: ru.olegcherednik.zip4jvm.UnzipIt, method: zip, match: "(Path zip)", note: "UnzipIt.zip"}
  - {class: ru.olegcherednik.zip4jvm.crypto.NullDecoder, method: decrypt, match: "(byte[] buf, int offs, int len)", note: "NullDecoder.decrypt"}
  - {class: ru.olegcherednik.zip4jvm.decompose.Utils, method: print, match: "(Path file, Consumer<Out> consumer)", note: "Utils.print"}
  - {class: ru.olegcherednik.zip4jvm.engine.info.DecomposeInfoEngine, method: decompose, match: "(Path dir)", note: "DecomposeInfoEngine.decompose"}
  - {class: ru.olegcherednik.zip4jvm.io.in.ReadBufferInputStream, method: create, match: "(ReadBuffer in)", note: "ReadBufferInputStream.create"}
  - {class: ru.olegcherednik.zip4jvm.model.builders.AesExtraFieldRecordBuilder, method: build, match: "()", note: "AesExtraFieldRecordBuilder.build"}
  - {class: ru.olegcherednik.zip4jvm.utils.BitUtils, method: isBitSet, match: "(int val, int bits)", note: "BitUtils.isBitSet"}
  - {class: ru.olegcherednik.zip4jvm.view.ByteArrayHexView, method: printTextInfo, match: "(Out out)", note: "ByteArrayHexView.printTextInfo"}
  - {class: ru.olegcherednik.zip4jvm.UnzipIt, method: dstDir, match: "(Path dstDir)", note: "UnzipIt.dstDir"}
  - {class: ru.olegcherednik.zip4jvm.crypto.NullDecoder, method: getCompressedSize, match: "()", note: "NullDecoder.getCompressedSize"}
  - {class: ru.olegcherednik.zip4jvm.decompose.Utils, method: copyLarge, match: "(ZipModel zipModel, Path out, Block block)", note: "Utils.copyLarge"}
  - {class: ru.olegcherednik.zip4jvm.engine.info.InfoEngine, method: printTextInfo, match: "(Out out)", note: "InfoEngine.printTextInfo"}
  - {class: ru.olegcherednik.zip4jvm.io.in.ReadBufferInputStream, method: close, match: "() throws IOException", note: "ReadBufferInputStream.close"}
  - {class: ru.olegcherednik.zip4jvm.model.builders.CentralDirectoryBuilder, method: build, match: "()", note: "CentralDirectoryBuilder.build"}
  - {class: ru.olegcherednik.zip4jvm.utils.BitUtils, method: isBitClear, match: "(int val, int bits)", note: "BitUtils.isBitClear"}
  - {class: ru.olegcherednik.zip4jvm.view.StringHexView, method: printTextInfo, match: "(Out out)", note: "StringHexView.printTextInfo"}
  - {class: ru.olegcherednik.zip4jvm.ZipFile, method: isSymlink, match: "()", note: "ZipFile.isSymlink"}
  - {class: ru.olegcherednik.zip4jvm.crypto.NullEncoder, method: encrypt, match: "(byte b, DataOutput out)", note: "NullEncoder.encrypt"}
  - {class: ru.olegcherednik.zip4jvm.decompose.CentralDirectoryDecompose, method: decompose, match: "(Path dir)", note: "CentralDirectoryDecompose.decompose"}
  - {class: ru.olegcherednik.zip4jvm.engine.info.InfoEngine, method: decompose, match: "(Path dir)", note: "InfoEngine.decompose"}
  - {class: ru.olegcherednik.zip4jvm.io.out.DataOutputOutputStream, method: create, match: "(DataOutput out)", note: "DataOutputOutputStream.create"}
  - {class: ru.olegcherednik.zip4jvm.model.builders.EndCentralDirectoryBuilder, method: build, match: "()", note: "EndCentralDirectoryBuilder.build"}
  - {class: ru.olegcherednik.zip4jvm.utils.ByteArrayUtils, method: newInputStreamSupplier, match: "(byte[] buf)", note: "ByteArrayUtils.newInputStreamSupplier"}
  - {class: ru.olegcherednik.zip4jvm.view.out.PrintStreamOut, method: println, match: "()", note: "PrintStreamOut.println"}
  - {class: ru.olegcherednik.zip4jvm.ZipFile, method: getUncompressedSize, match: "()", note: "ZipFile.getUncompressedSize"}
  - {class: ru.olegcherednik.zip4jvm.crypto.NullEncoder, method: writeEncryptionHeaderWhenRequired, match: "(DataOutput out)", note: "NullEncoder.writeEncryptionHeaderWhenRequired"}
  - {class: ru.olegcherednik.zip4jvm.decompose.EmptyDecompose, method: decompose, match: "(Path dir)", note: "EmptyDecompose.decompose"}
  - {class: ru.olegcherednik.zip4jvm.engine.info.ViewInfoEngine, method: printTextInfo, match: "(Out out)", note: "ViewInfoEngine.printTextInfo"}
  - {class: ru.olegcherednik.zip4jvm.io.out.DataOutputOutputStream, method: createUnseasonable, match: "(DataOutput out)", note: "DataOutputOutputStream.createUnseasonable"}
  - {class: ru.olegcherednik.zip4jvm.model.builders.FileHeaderBuilder, method: build, match: "()", note: "FileHeaderBuilder.build"}
  - {class: ru.olegcherednik.zip4jvm.utils.ByteArrayUtils, method: getSize, match: "()", note: "ByteArrayUtils.getSize"}
  - {class: ru.olegcherednik.zip4jvm.view.out.PrintStreamOut, method: println, match: "(String str, char underscore)", note: "PrintStreamOut.println"}
  - {class: ru.olegcherednik.zip4jvm.ZipInfo, method: zip, match: "(Path zip)", note: "ZipInfo.zip"}
  - {class: ru.olegcherednik.zip4jvm.crypto.aes.WinZipAesDecoder, method: decrypt, match: "(byte[] buf, int offs, int len)", note: "WinZipAesDecoder.decrypt"}
  - {class: ru.olegcherednik.zip4jvm.decompose.EncryptedCentralDirectoryDecompose, method: decompose, match: "(Path dir)", note: "EncryptedCentralDirectoryDecompose.decompose"}
  - {class: ru.olegcherednik.zip4jvm.engine.np.Directory, method: createZipEntry, match: "(ZipEntrySettings entrySettings)", note: "Directory.createZipEntry"}
  - {class: ru.olegcherednik.zip4jvm.io.out.OffsOutputStream, method: create, match: "(Path file)", note: "OffsOutputStream.create"}
  - {class: ru.olegcherednik.zip4jvm.model.builders.LocalFileHeaderBuilder, method: build, match: "()", note: "LocalFileHeaderBuilder.build"}
  - {class: ru.olegcherednik.zip4jvm.utils.ByteUtils, method: readWord, match: "(ReadBuffer in)", note: "ByteUtils.readWord"}
  - {class: ru.olegcherednik.zip4jvm.view.CompressionView, method: printTextInfo, match: "(Out out)", note: "CompressionView.printTextInfo"}
  - {class: ru.olegcherednik.zip4jvm.ZipInfo, method: settings, match: "(ZipInfoSettings settings)", note: "ZipInfo.settings"}
  - {class: ru.olegcherednik.zip4jvm.crypto.aes.WinZipAesDecoder, method: getBlockSize, match: "()", note: "WinZipAesDecoder.getBlockSize"}
  - {class: ru.olegcherednik.zip4jvm.decompose.EncryptedFileHeaderDecompose, method: fileHeaderView, match: "(CentralDirectory.FileHeader fileHeader,", note: "EncryptedFileHeaderDecompose.fileHeaderView"}
  - {class: ru.olegcherednik.zip4jvm.engine.np.Directory, method: getPath, match: "()", note: "Directory.getPath"}
  - {class: ru.olegcherednik.zip4jvm.io.out.OffsOutputStream, method: close, match: "()", note: "OffsOutputStream.close"}
  - {class: ru.olegcherednik.zip4jvm.model.builders.StrongEncryptionHeaderExtraFieldRecordBuilder, method: build, match: "()", note: "StrongEncryptionHeaderExtraFieldRecordBuilder.build"}
  - {class: ru.olegcherednik.zip4jvm.utils.ByteUtils, method: readDword, match: "(ReadBuffer in)", note: "ByteUtils.readDword"}
  - {class: ru.olegcherednik.zip4jvm.view.EmptyView, method: printTextInfoWithEmptyLine, match: "(Out out)", note: "EmptyView.printTextInfoWithEmptyLine"}
  - {class: ru.olegcherednik.zip4jvm.ZipIt, method: zip, match: "(Path zip)", note: "ZipIt.zip"}
  - {class: ru.olegcherednik.zip4jvm.crypto.aes.WinZipAesEncoder, method: encrypt, match: "(byte b, DataOutput out)", note: "WinZipAesEncoder.encrypt"}
