  - {class: de.komoot.photon.json.JsonDumper, method: writeHeader, match: "(Map<String, NameMap> countryNames) throws IOException", note: "JsonDumper.writeHeader"}
  - {class: de.komoot.photon.nominatim.model.NameMap, method: containsKey, match: "(Object key)", note: "NameMap.containsKey"}
  - {class: de.komoot.photon.opensearch.BaseQueryBuilder, method: addOsmTagFilter, match: "(List<TagFilter> filters)", note: "BaseQueryBuilder.addOsmTagFilter"}
  - {class: de.komoot.photon.query.RequestBase, method: getDefaultLanguage, match: "()", note: "RequestBase.getDefaultLanguage"}
