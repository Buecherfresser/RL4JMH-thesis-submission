# Curated performance-mutation sites for barcode-lib4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants barcode-lib4j --source data/external-src/<checkout> \
#       --sites data/projects/barcode-lib4j/mutation_sites.yaml

