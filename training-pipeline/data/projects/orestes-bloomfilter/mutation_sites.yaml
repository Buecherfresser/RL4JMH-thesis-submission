# Curated performance-mutation sites for orestes-bloomfilter (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants orestes-bloomfilter --source data/external-src/<checkout> \
#       --sites data/projects/orestes-bloomfilter/mutation_sites.yaml

package_root: orestes.bloomfilter

sites:
  - {class: orestes.bloomfilter.FilterBuilder, method: expectedElements, match: "(int expectedElements)", note: "FilterBuilder.expectedElements"}
  - {class: orestes.bloomfilter.cachesketch.ExpirationQueueMemory, method: enable, match: "()", note: "ExpirationQueueMemory.enable"}
  - {class: orestes.bloomfilter.json.BloomFilterConverter, method: toJson, match: "(BloomFilter<?> source)", note: "BloomFilterConverter.toJson"}
  - {class: orestes.bloomfilter.memory.BloomFilterMemory, method: config, match: "()", note: "BloomFilterMemory.config"}
  - {class: orestes.bloomfilter.redis.MessagePackEncoder, method: encodeItem, match: "(String item, int[] positions)", note: "MessagePackEncoder.encodeItem"}
  - {class: orestes.bloomfilter.FilterBuilder, method: size, match: "(int size)", note: "FilterBuilder.size"}
  - {class: orestes.bloomfilter.cachesketch.ExpirationQueueMemory, method: disable, match: "()", note: "ExpirationQueueMemory.disable"}
  - {class: orestes.bloomfilter.json.BloomFilterConverter, method: toBase64, match: "(BloomFilter<?> source)", note: "BloomFilterConverter.toBase64"}
  - {class: orestes.bloomfilter.memory.BloomFilterMemory, method: addRaw, match: "(byte[] element)", note: "BloomFilterMemory.addRaw"}
  - {class: orestes.bloomfilter.redis.MessagePackEncoder, method: decodeItem, match: "(byte[] bytes)", note: "MessagePackEncoder.decodeItem"}
  - {class: orestes.bloomfilter.FilterBuilder, method: falsePositiveProbability, match: "(double falsePositiveProbability)", note: "FilterBuilder.falsePositiveProbability"}
  - {class: orestes.bloomfilter.cachesketch.ExpirationQueueMemory, method: size, match: "()", note: "ExpirationQueueMemory.size"}
  - {class: orestes.bloomfilter.json.BloomFilterConverter, method: fromJson, match: "(JsonElement source)", note: "BloomFilterConverter.fromJson"}
  - {class: orestes.bloomfilter.memory.BloomFilterMemory, method: clear, match: "()", note: "BloomFilterMemory.clear"}
  - {class: orestes.bloomfilter.redis.RedisBitSet, method: getBulk, match: "(int... indexes)", note: "RedisBitSet.getBulk"}
  - {class: orestes.bloomfilter.TimeMap, method: size, match: "()", note: "TimeMap.size"}
  - {class: orestes.bloomfilter.cachesketch.ExpiringBloomFilterMemory, method: cleanupTTLs, match: "()", note: "ExpiringBloomFilterMemory.cleanupTTLs"}
  - {class: orestes.bloomfilter.memory.CountingBloomFilter16, method: increment, match: "(int index)", note: "CountingBloomFilter16.increment"}
  - {class: orestes.bloomfilter.redis.RedisBitSet, method: clear, match: "(int bitIndex)", note: "RedisBitSet.clear"}
  - {class: orestes.bloomfilter.TimeMap, method: isEmpty, match: "()", note: "TimeMap.isEmpty"}
  - {class: orestes.bloomfilter.cachesketch.ExpiringBloomFilterMemory, method: reportRead, match: "(T element, long TTL, TimeUnit unit)", note: "ExpiringBloomFilterMemory.reportRead"}
  - {class: orestes.bloomfilter.memory.CountingBloomFilter16, method: decrement, match: "(int index)", note: "CountingBloomFilter16.decrement"}
  - {class: orestes.bloomfilter.redis.RedisBitSet, method: clear, match: "(PipelineBase p, int bitIndex)", note: "RedisBitSet.clear"}
  - {class: orestes.bloomfilter.TimeMap, method: containsKey, match: "(Object key)", note: "TimeMap.containsKey"}
  - {class: orestes.bloomfilter.cachesketch.ExpiringBloomFilterMemory, method: reportWrite, match: "(T element, TimeUnit unit)", note: "ExpiringBloomFilterMemory.reportWrite"}
  - {class: orestes.bloomfilter.memory.CountingBloomFilter16, method: getCountMap, match: "()", note: "CountingBloomFilter16.getCountMap"}
  - {class: orestes.bloomfilter.redis.RedisUtils, method: encodeMap, match: "(Map<Integer, Long> map)", note: "RedisUtils.encodeMap"}
  - {class: orestes.bloomfilter.HashProvider, method: hashCarterWegman, match: "(byte[] value, int m, int k)", note: "HashProvider.hashCarterWegman"}
  - {class: orestes.bloomfilter.cachesketch.ExpiringBloomFilterPureRedis, method: clear, match: "()", note: "ExpiringBloomFilterPureRedis.clear"}
  - {class: orestes.bloomfilter.memory.CountingBloomFilter32, method: increment, match: "(int index)", note: "CountingBloomFilter32.increment"}
  - {class: orestes.bloomfilter.redis.RedisUtils, method: encodeKey, match: "(int key)", note: "RedisUtils.encodeKey"}
  - {class: orestes.bloomfilter.HashProvider, method: hashRNG, match: "(byte[] value, int m, int k)", note: "HashProvider.hashRNG"}
  - {class: orestes.bloomfilter.cachesketch.ExpiringBloomFilterPureRedis, method: softClear, match: "()", note: "ExpiringBloomFilterPureRedis.softClear"}
  - {class: orestes.bloomfilter.memory.CountingBloomFilter32, method: decrement, match: "(int index)", note: "CountingBloomFilter32.decrement"}
