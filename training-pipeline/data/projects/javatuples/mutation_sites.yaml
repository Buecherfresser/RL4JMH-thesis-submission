  - {class: org.javatuples.KeyValue, method: with, match: "(final A key, final B value)", note: "KeyValue.with"}
  - {class: org.javatuples.KeyValue, method: fromArray, match: "(final X[] array)", note: "KeyValue.fromArray"}
  - {class: org.javatuples.KeyValue, method: fromCollection, match: "(final Collection<X> collection)", note: "KeyValue.fromCollection"}
