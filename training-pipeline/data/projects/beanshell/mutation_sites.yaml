# Curated performance-mutation sites for beanshell (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants beanshell --source data/external-src/<checkout> \
#       --sites data/projects/beanshell/mutation_sites.yaml

package_root: bsh

sites:
  - {class: bsh.BSHArrayDimensions, method: addDefinedDimension, match: "()", note: "BSHArrayDimensions.addDefinedDimension"}
  - {class: bsh.classpath.BshClassLoader, method: addURL, match: "( URL url )", note: "BshClassLoader.addURL"}
  - {class: bsh.commands.dir, method: usage, match: "()", note: "dir.usage"}
  - {class: bsh.engine.BshScriptEngine, method: getInterpreter, match: "()", note: "BshScriptEngine.getInterpreter"}
  - {class: bsh.org.objectweb.asm.Attribute, method: isUnknown, match: "()", note: "Attribute.isUnknown"}
  - {class: bsh.servlet.BshServlet, method: doGet, match: "(", note: "BshServlet.doGet"}
  - {class: bsh.util.Util, method: makeConsole, match: "()", note: "Util.makeConsole"}
  - {class: bsh.BSHArrayDimensions, method: addUndefinedDimension, match: "()", note: "BSHArrayDimensions.addUndefinedDimension"}
  - {class: bsh.classpath.BshClassLoader, method: loadClass, match: "(String name, boolean resolve)", note: "BshClassLoader.loadClass"}
  - {class: bsh.commands.dir, method: invoke, match: "( Interpreter env, CallStack callstack )", note: "dir.invoke"}
  - {class: bsh.engine.BshScriptEngine, method: eval, match: "(String script, ScriptContext scriptContext) throws ScriptException", note: "BshScriptEngine.eval"}
  - {class: bsh.org.objectweb.asm.Attribute, method: isCodeAttribute, match: "()", note: "Attribute.isCodeAttribute"}
  - {class: bsh.servlet.BshServlet, method: doPost, match: "(", note: "BshServlet.doPost"}
  - {class: bsh.util.Util, method: startSplashScreen, match: "()", note: "Util.startSplashScreen"}
  - {class: bsh.BSHArrayInitializer, method: jjtSetParent, match: "(Node n)", note: "BSHArrayInitializer.jjtSetParent"}
  - {class: bsh.classpath.BshClassPath, method: setPath, match: "( URL[] urls )", note: "BshClassPath.setPath"}
  - {class: bsh.engine.BshScriptEngineFactory, method: getEngineName, match: "()", note: "BshScriptEngineFactory.getEngineName"}
  - {class: bsh.org.objectweb.asm.ByteVector, method: putByte, match: "(final int byteValue)", note: "ByteVector.putByte"}
  - {class: bsh.servlet.Remote, method: main, match: "( String args[] )", note: "Remote.main"}
  - {class: bsh.util.AWTConsole, method: getIn, match: "()", note: "AWTConsole.getIn"}
  - {class: bsh.BSHArrayInitializer, method: eval, match: "( CallStack callstack, Interpreter interpreter )", note: "BSHArrayInitializer.eval"}
  - {class: bsh.classpath.BshClassPath, method: addComponent, match: "( BshClassPath bcp )", note: "BshClassPath.addComponent"}
  - {class: bsh.engine.BshScriptEngineFactory, method: getEngineVersion, match: "()", note: "BshScriptEngineFactory.getEngineVersion"}
  - {class: bsh.org.objectweb.asm.ByteVector, method: putShort, match: "(final int shortValue)", note: "ByteVector.putShort"}
  - {class: bsh.servlet.Remote, method: eval, match: "( String url, String text )", note: "Remote.eval"}
  - {class: bsh.util.AWTConsole, method: getOut, match: "()", note: "AWTConsole.getOut"}
  - {class: bsh.BSHStatementExpressionList, method: eval, match: "(CallStack callstack, Interpreter interpreter)", note: "BSHStatementExpressionList.eval"}
  - {class: bsh.classpath.ClassManagerImpl, method: classForName, match: "( String name )", note: "ClassManagerImpl.classForName"}
  - {class: bsh.engine.ScriptContextEngineView, method: size, match: "()", note: "ScriptContextEngineView.size"}
  - {class: bsh.org.objectweb.asm.ClassWriter, method: visit, match: "(", note: "ClassWriter.visit"}
  - {class: bsh.servlet.SimpleTemplate, method: getTemplate, match: "( String file )", note: "SimpleTemplate.getTemplate"}
  - {class: bsh.util.AWTDemoApplet, method: windowClosing, match: "(WindowEvent windowEvent)", note: "AWTDemoApplet.windowClosing"}
  - {class: bsh.BshArray, method: getIndex, match: "(Object array, int index)", note: "BshArray.getIndex"}
  - {class: bsh.classpath.ClassManagerImpl, method: getResource, match: "( String path )", note: "ClassManagerImpl.getResource"}
  - {class: bsh.engine.ScriptContextEngineView, method: isEmpty, match: "()", note: "ScriptContextEngineView.isEmpty"}
  - {class: bsh.org.objectweb.asm.ClassWriter, method: visitSource, match: "(final String file, final String debug)", note: "ClassWriter.visitSource"}
  - {class: bsh.servlet.SimpleTemplate, method: getStringFromStream, match: "( InputStream ins )", note: "SimpleTemplate.getStringFromStream"}
  - {class: bsh.util.AWTDemoApplet, method: main, match: "(String[] args)", note: "AWTDemoApplet.main"}
  - {class: bsh.BshArray, method: setIndex, match: "(Object array, int index, Object val)", note: "BshArray.setIndex"}
  - {class: bsh.classpath.DiscreteFilesClassLoader, method: instance, match: "()", note: "DiscreteFilesClassLoader.instance"}
  - {class: bsh.org.objectweb.asm.FieldWriter, method: visitAttribute, match: "(final Attribute attribute)", note: "FieldWriter.visitAttribute"}
  - {class: bsh.util.AWTRemoteApplet, method: windowClosing, match: "(WindowEvent windowEvent)", note: "AWTRemoteApplet.windowClosing"}
  - {class: bsh.ClassGeneratorUtil, method: initStaticNameSpace, match: "(NameSpace classStaticNameSpace, BSHBlock instanceInitBlock)", note: "ClassGeneratorUtil.initStaticNameSpace"}
  - {class: bsh.classpath.DiscreteFilesClassLoader, method: newInstance, match: "(", note: "DiscreteFilesClassLoader.newInstance"}
  - {class: bsh.org.objectweb.asm.FieldWriter, method: visitEnd, match: "()", note: "FieldWriter.visitEnd"}
  - {class: bsh.util.AWTRemoteApplet, method: main, match: "(String[] args)", note: "AWTRemoteApplet.main"}
  - {class: bsh.ClassGeneratorUtil, method: generateClass, match: "()", note: "ClassGeneratorUtil.generateClass"}
  - {class: bsh.org.objectweb.asm.Handle, method: getTag, match: "()", note: "Handle.getTag"}
  - {class: bsh.util.BshCanvas, method: paintComponent, match: "( Graphics g )", note: "BshCanvas.paintComponent"}
  - {class: bsh.StringUtil, method: typeString, match: "(Object value)", note: "StringUtil.typeString"}
