# Curated performance-mutation sites for crawler4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants crawler4j --source data/external-src/<checkout> \
#       --sites data/projects/crawler4j/mutation_sites.yaml

package_root: edu.uci.ics

sites:
  - {class: edu.uci.ics.crawler4j.parser.AllTagMapper, method: mapSafeElement, match: "(String name)", note: "AllTagMapper.mapSafeElement"}
  - {class: edu.uci.ics.crawler4j.parser.AllTagMapper, method: isDiscardElement, match: "(String name)", note: "AllTagMapper.isDiscardElement"}
  - {class: edu.uci.ics.crawler4j.parser.Parser, method: parse, match: "(Page page, String contextURL) throws NotAllowedContentException, ParseException", note: "Parser.parse"}
  - {class: edu.uci.ics.crawler4j.parser.TikaHtmlParser, method: parse, match: "(Page page, String contextURL) throws ParseException", note: "TikaHtmlParser.parse"}
  - {class: edu.uci.ics.crawler4j.robotstxt.RobotstxtParser, method: parse, match: "(String content, RobotstxtConfig config)", note: "RobotstxtParser.parse"}
  - {class: edu.uci.ics.crawler4j.url.TLDList, method: isRegisteredDomain, match: "(String domain)", note: "TLDList.isRegisteredDomain"}
  - {class: edu.uci.ics.crawler4j.util.Util, method: long2ByteArray, match: "(long l)", note: "Util.long2ByteArray"}
  - {class: edu.uci.ics.crawler4j.util.Util, method: int2ByteArray, match: "(int value)", note: "Util.int2ByteArray"}
  - {class: edu.uci.ics.crawler4j.crawler.CrawlConfig, method: setDnsResolver, match: "(final DnsResolver dnsResolver)", note: "CrawlConfig.setDnsResolver"}
  - {class: edu.uci.ics.crawler4j.crawler.CrawlConfig, method: getDnsResolver, match: "()", note: "CrawlConfig.getDnsResolver"}
  - {class: edu.uci.ics.crawler4j.crawler.CrawlController, method: getParser, match: "()", note: "CrawlController.getParser"}
  - {class: edu.uci.ics.crawler4j.crawler.CrawlController, method: newInstance, match: "() throws Exception", note: "CrawlController.newInstance"}
  - {class: edu.uci.ics.crawler4j.crawler.Page, method: toByteArray, match: "(HttpEntity entity, int maxBytes) throws IOException", note: "Page.toByteArray"}
  - {class: edu.uci.ics.crawler4j.crawler.Page, method: load, match: "(HttpEntity entity, int maxBytes) throws IOException", note: "Page.load"}
  - {class: edu.uci.ics.crawler4j.crawler.WebCrawler, method: init, match: "(int id, CrawlController crawlController)", note: "WebCrawler.init"}
  - {class: edu.uci.ics.crawler4j.crawler.WebCrawler, method: getMyId, match: "()", note: "WebCrawler.getMyId"}
  - {class: edu.uci.ics.crawler4j.crawler.authentication.FormAuthInfo, method: getUsernameFormStr, match: "()", note: "FormAuthInfo.getUsernameFormStr"}
  - {class: edu.uci.ics.crawler4j.crawler.authentication.FormAuthInfo, method: setUsernameFormStr, match: "(String usernameFormStr)", note: "FormAuthInfo.setUsernameFormStr"}
  - {class: edu.uci.ics.crawler4j.crawler.authentication.NtAuthInfo, method: getDomain, match: "()", note: "NtAuthInfo.getDomain"}
  - {class: edu.uci.ics.crawler4j.crawler.authentication.NtAuthInfo, method: setDomain, match: "(String domain)", note: "NtAuthInfo.setDomain"}
  - {class: edu.uci.ics.crawler4j.crawler.exceptions.PageBiggerThanMaxSizeException, method: getPageSize, match: "()", note: "PageBiggerThanMaxSizeException.getPageSize"}
  - {class: edu.uci.ics.crawler4j.fetcher.BasicAuthHttpRequestInterceptor, method: process, match: "(HttpRequest request, HttpContext context)", note: "BasicAuthHttpRequestInterceptor.process"}
  - {class: edu.uci.ics.crawler4j.fetcher.IdleConnectionMonitorThread, method: run, match: "()", note: "IdleConnectionMonitorThread.run"}
  - {class: edu.uci.ics.crawler4j.fetcher.IdleConnectionMonitorThread, method: shutdown, match: "()", note: "IdleConnectionMonitorThread.shutdown"}
  - {class: edu.uci.ics.crawler4j.fetcher.PageFetchResult, method: getStatusCode, match: "()", note: "PageFetchResult.getStatusCode"}
  - {class: edu.uci.ics.crawler4j.fetcher.PageFetchResult, method: setStatusCode, match: "(int statusCode)", note: "PageFetchResult.setStatusCode"}
  - {class: edu.uci.ics.crawler4j.fetcher.PageFetcher, method: isTrusted, match: "(final X509Certificate[] chain, String authType)", note: "PageFetcher.isTrusted"}
  - {class: edu.uci.ics.crawler4j.fetcher.PageFetcher, method: fetchPage, match: "(WebURL webUrl)", note: "PageFetcher.fetchPage"}
