# Curated performance-mutation sites for jackson-core (GRPO RL corpus).
#
# Hand-picked from good_classes.yaml: concrete classes and hot ~once-per-call public
# methods (encode/decode/hash/aggregate/set-algebra kernels) that a JMH benchmark drives
# once per invocation. Several methods per class => ``killed / in-class mutants`` rewards
# benchmark coverage of the subject's core operations.
#
# Regenerate with:
#   jmh-make-mutants jackson-core --source data/external-src/jackson-core \
#       --sites data/projects/jackson-core/mutation_sites.yaml

package_root: com.fasterxml.jackson.core

sites:
  - {class: com.fasterxml.jackson.core.io.JsonStringEncoder, method: encodeAsUTF8, match: "(String text)", note: "JsonStringEncoder.encodeAsUTF8"}
  - {class: com.fasterxml.jackson.core.io.JsonStringEncoder, method: quoteAsString, match: "(String input)", note: "JsonStringEncoder.quoteAsString"}
  - {class: com.fasterxml.jackson.core.io.JsonStringEncoder, method: quoteAsUTF8, match: "(String text)", note: "JsonStringEncoder.quoteAsUTF8"}
  - {class: com.fasterxml.jackson.core.io.NumberInput, method: inLongRange, match: "(char[] ch, int off, int len, boolean negative)", note: "NumberInput.inLongRange"}
  - {class: com.fasterxml.jackson.core.io.NumberInput, method: looksLikeValidNumber, match: "(final String s)", note: "NumberInput.looksLikeValidNumber"}
  - {class: com.fasterxml.jackson.core.io.NumberInput, method: parseAsDouble, match: "(final String s, final double def)", note: "NumberInput.parseAsDouble"}
  - {class: com.fasterxml.jackson.core.io.NumberOutput, method: outputInt, match: "(int v, char[] b, int off)", note: "NumberOutput.outputInt"}
  - {class: com.fasterxml.jackson.core.io.NumberOutput, method: outputLong, match: "(long v, char[] b, int off)", note: "NumberOutput.outputLong"}
  - {class: com.fasterxml.jackson.core.io.CharTypes, method: appendQuoted, match: "(StringBuilder sb, String content)", note: "CharTypes.appendQuoted"}
  - {class: com.fasterxml.jackson.core.io.CharTypes, method: copyHexBytes, match: "()", note: "CharTypes.copyHexBytes"}
  - {class: com.fasterxml.jackson.core.io.CharTypes, method: copyHexChars, match: "()", note: "CharTypes.copyHexChars"}
  - {class: com.fasterxml.jackson.core.io.BigDecimalParser, method: parse, match: "(String valueStr)", note: "BigDecimalParser.parse"}
  - {class: com.fasterxml.jackson.core.io.BigDecimalParser, method: parseWithFastParser, match: "(final String valueStr)", note: "BigDecimalParser.parseWithFastParser"}
  - {class: com.fasterxml.jackson.core.Base64Variant, method: encodeBase64Chunk, match: "(int b24, char[] buffer, int outPtr)", note: "Base64Variant.encodeBase64Chunk"}
  - {class: com.fasterxml.jackson.core.Base64Variant, method: acceptsPaddingOnRead, match: "()", note: "Base64Variant.acceptsPaddingOnRead"}
  - {class: com.fasterxml.jackson.core.Base64Variant, method: decodeBase64Byte, match: "(byte b)", note: "Base64Variant.decodeBase64Byte"}
