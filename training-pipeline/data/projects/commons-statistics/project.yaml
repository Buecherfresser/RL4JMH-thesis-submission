# Mutation-track metadata for Apache Commons Statistics (GRPO RL corpus).
name: commons-statistics
display_name: Apache Commons Statistics
version: "1.3"
package_root: org.apache.commons.statistics

source_dir: data/external-src/commons-statistics-merged/src/main/java

mutations_patch: mutations.patch
mutants_registry: mutants.yaml
snippets: snippets.jsonl

java_release: 17
dependencies:
  - data/classpaths/lib/commons-statistics/commons-numbers-core-1.3.jar
  - data/classpaths/lib/commons-statistics/commons-numbers-arrays-1.3.jar
  - data/classpaths/lib/commons-statistics/commons-numbers-combinatorics-1.3.jar
  - data/classpaths/lib/commons-statistics/commons-numbers-fraction-1.3.jar
  - data/classpaths/lib/commons-statistics/commons-numbers-gamma-1.3.jar
  - data/classpaths/lib/commons-statistics/commons-numbers-rootfinder-1.3.jar
  - data/classpaths/lib/commons-statistics/commons-rng-client-api-1.6.jar
  - data/classpaths/lib/commons-statistics/commons-rng-sampling-1.6.jar

mutation:
  switch_class: org.apache.commons.statistics.jmhbench.MutationSwitch
  arm_property: jmhbench.mutant
  record_property: jmhbench.record

provenance:
  project: Apache Commons Statistics
  url: https://github.com/apache/commons-statistics
  tag: rel/commons-statistics-1.3
