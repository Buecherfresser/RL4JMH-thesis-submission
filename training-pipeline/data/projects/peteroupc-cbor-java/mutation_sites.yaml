  - {class: com.upokecenter.cbor.CBORExtendedFloat, method: IsPositiveInfinity, match: "(Object obj)", note: "CBORExtendedFloat.IsPositiveInfinity"}
  - {class: com.upokecenter.cbor.CBORExtendedFloat, method: IsInfinity, match: "(Object obj)", note: "CBORExtendedFloat.IsInfinity"}
