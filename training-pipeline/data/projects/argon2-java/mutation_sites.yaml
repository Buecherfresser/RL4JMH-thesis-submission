# Curated performance-mutation sites for argon2-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants argon2-java --source data/external-src/<checkout> \
#       --sites data/projects/argon2-java/mutation_sites.yaml

package_root: at.gadermaier.argon2

sites:
  - {class: at.gadermaier.argon2.Util, method: bytesToHexString, match: "(byte[] bytes)", note: "Util.bytesToHexString"}
  - {class: at.gadermaier.argon2.algorithm.FillMemory, method: fillMemoryBlocks, match: "(Instance instance)", note: "FillMemory.fillMemoryBlocks"}
  - {class: at.gadermaier.argon2.model.Block, method: fromBytes, match: "(byte[] input)", note: "Block.fromBytes"}
  - {class: at.gadermaier.argon2.Util, method: hexStringToByteArray, match: "(String s)", note: "Util.hexStringToByteArray"}
  - {class: at.gadermaier.argon2.algorithm.FillMemory, method: run, match: "()", note: "FillMemory.run"}
  - {class: at.gadermaier.argon2.model.Block, method: toBytes, match: "()", note: "Block.toBytes"}
  - {class: at.gadermaier.argon2.Util, method: littleEndianBytesToLong, match: "(byte[] b)", note: "Util.littleEndianBytesToLong"}
  - {class: at.gadermaier.argon2.algorithm.Initialize, method: initialize, match: "(Instance instance, Argon2 argon2)", note: "Initialize.initialize"}
  - {class: at.gadermaier.argon2.model.Block, method: copyBlock, match: "(Block other)", note: "Block.copyBlock"}
  - {class: at.gadermaier.argon2.Util, method: intToLittleEndianBytes, match: "(int a)", note: "Util.intToLittleEndianBytes"}
  - {class: at.gadermaier.argon2.model.Block, method: xor, match: "(Block b1, Block b2)", note: "Block.xor"}
  - {class: at.gadermaier.argon2.Util, method: longToLittleEndianBytes, match: "(long a)", note: "Util.longToLittleEndianBytes"}
  - {class: at.gadermaier.argon2.model.Block, method: xor, match: "(Block b1, Block b2, Block b3)", note: "Block.xor"}
  - {class: at.gadermaier.argon2.Util, method: intToLong, match: "(int x)", note: "Util.intToLong"}
  - {class: at.gadermaier.argon2.model.Block, method: xorWith, match: "(Block other)", note: "Block.xorWith"}
  - {class: at.gadermaier.argon2.Argon2, method: hash, match: "(byte[] password, byte[] salt)", note: "Argon2.hash"}
  - {class: at.gadermaier.argon2.model.Instance, method: clear, match: "()", note: "Instance.clear"}
  - {class: at.gadermaier.argon2.Argon2, method: hash, match: "(char[] password, String salt)", note: "Argon2.hash"}
  - {class: at.gadermaier.argon2.model.Instance, method: getMemory, match: "()", note: "Instance.getMemory"}
  - {class: at.gadermaier.argon2.Argon2, method: hash, match: "()", note: "Argon2.hash"}
  - {class: at.gadermaier.argon2.model.Instance, method: getVersion, match: "()", note: "Instance.getVersion"}
  - {class: at.gadermaier.argon2.Argon2, method: clear, match: "()", note: "Argon2.clear"}
  - {class: at.gadermaier.argon2.model.Instance, method: getIterations, match: "()", note: "Instance.getIterations"}
  - {class: at.gadermaier.argon2.Argon2, method: setMemoryInKiB, match: "(int memory)", note: "Argon2.setMemoryInKiB"}
  - {class: at.gadermaier.argon2.model.Instance, method: getSegmentLength, match: "()", note: "Instance.getSegmentLength"}
  - {class: at.gadermaier.argon2.Argon2, method: setParallelism, match: "(int parallelism)", note: "Argon2.setParallelism"}
