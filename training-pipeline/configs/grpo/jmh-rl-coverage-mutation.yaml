# Coverage-guided mutation-focused GRPO.
# Scores every curated mutant in the target class. The initial record pass identifies
# benchmark methods that reach each mutant, so armed detection avoids unrelated methods.
base_model: google/gemma-4-E2B-it
output_dir: outputs/grpo-jmh-rl-coverage-mutation
dataset_path: data/snippets/rl-merged.good.jsonl
corpus: original
seed: 42

finetune_mode: lora
precision: bf16
gradient_checkpointing: true
attn_implementation: sdpa
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  exclude_modules: [vision_tower, audio_tower, multi_modal_projector]
  bias: none

learning_rate: 1.0e-6
per_device_batch_size: 4
gradient_accumulation_steps: 2
group_size: 8
rollout_temperature: 1.0
top_p: 0.95
top_k: 64
max_prompt_length: 8192
max_completion_length: 4096
completion_eos_token_id: 106
max_source_chars: 24000

kl_coeff: 0.0
epsilon: 0.2
epsilon_high: 0.28
grpo_loss_type: dr_grpo
scale_rewards: false
mask_truncated_completions: true
mu: 1

num_epochs: 1.0
warmup_ratio: 0.03
logging_steps: 1
save_steps: 50
report_to: none

reward_weights:
  compile: 0.10
  runtime: 0.10
  anti_pattern: 0.05
  rsd: 0.05
  mutation: 0.70
anti_pattern_backend: regex
need_run: true
rsd_good: 0.05
rsd_bad: 0.25

mutation:
  alpha: 0.05
  min_slowdown: 1.10
  arm_property: jmhbench.mutant
  coverage_guidance: true
  max_mutants_per_candidate: 0
  max_benchmarks_per_mutant: 6
  mode: coverage_aware
  coverage_weight: 0.30
  coverage_jmh:
    warmup_iterations: 0
    measurement_iterations: 1
    forks: 1
    warmup_time: "100ms"
    measurement_time: "100ms"
    timeout_s: 120.0
    per_iteration_timeout_s: 60.0
    fail_on_error: false

runner:
  jmh_version: "1.37"
  java_release: 17
  jmh:
    warmup_iterations: 3
    measurement_iterations: 5
    forks: 1
    warmup_time: "200ms"
    measurement_time: "200ms"
    timeout_s: 120.0
    per_iteration_timeout_s: 60.0
    fail_on_error: false

