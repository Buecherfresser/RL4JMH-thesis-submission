# Curated performance-mutation sites for brics-automaton (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants brics-automaton --source data/external-src/<checkout> \
#       --sites data/projects/brics-automaton/mutation_sites.yaml

package_root: dk.brics.automaton

sites:
  - {class: dk.brics.automaton.StringUnionOperations, method: getState, match: "(char label)", note: "StringUnionOperations.getState"}
  - {class: dk.brics.automaton.StringUnionOperations, method: getTransitionLabels, match: "()", note: "StringUnionOperations.getTransitionLabels"}
  - {class: dk.brics.automaton.StringUnionOperations, method: getStates, match: "()", note: "StringUnionOperations.getStates"}
  - {class: dk.brics.automaton.StringUnionOperations, method: hasChildren, match: "()", note: "StringUnionOperations.hasChildren"}
  - {class: dk.brics.automaton.Automaton, method: getSingleton, match: "()", note: "Automaton.getSingleton"}
  - {class: dk.brics.automaton.Automaton, method: setInitialState, match: "(State s)", note: "Automaton.setInitialState"}
  - {class: dk.brics.automaton.Automaton, method: getInitialState, match: "()", note: "Automaton.getInitialState"}
  - {class: dk.brics.automaton.Automaton, method: isDeterministic, match: "()", note: "Automaton.isDeterministic"}
  - {class: dk.brics.automaton.AutomatonMatcher, method: find, match: "()", note: "AutomatonMatcher.find"}
  - {class: dk.brics.automaton.AutomatonMatcher, method: end, match: "() throws IllegalStateException", note: "AutomatonMatcher.end"}
  - {class: dk.brics.automaton.AutomatonMatcher, method: end, match: "(final int group) throws IndexOutOfBoundsException, IllegalStateException", note: "AutomatonMatcher.end"}
  - {class: dk.brics.automaton.AutomatonMatcher, method: group, match: "() throws IllegalStateException", note: "AutomatonMatcher.group"}
  - {class: dk.brics.automaton.BasicAutomata, method: makeEmpty, match: "()", note: "BasicAutomata.makeEmpty"}
  - {class: dk.brics.automaton.BasicAutomata, method: makeEmptyString, match: "()", note: "BasicAutomata.makeEmptyString"}
  - {class: dk.brics.automaton.BasicAutomata, method: makeAnyString, match: "()", note: "BasicAutomata.makeAnyString"}
  - {class: dk.brics.automaton.BasicAutomata, method: makeAnyChar, match: "()", note: "BasicAutomata.makeAnyChar"}
  - {class: dk.brics.automaton.BasicOperations, method: subsetOf, match: "(Automaton a1, Automaton a2)", note: "BasicOperations.subsetOf"}
  - {class: dk.brics.automaton.BasicOperations, method: union, match: "(Automaton a1, Automaton a2)", note: "BasicOperations.union"}
  - {class: dk.brics.automaton.BasicOperations, method: union, match: "(Collection<Automaton> l)", note: "BasicOperations.union"}
  - {class: dk.brics.automaton.BasicOperations, method: determinize, match: "(Automaton a)", note: "BasicOperations.determinize"}
  - {class: dk.brics.automaton.Datatypes, method: main, match: "(String[] args)", note: "Datatypes.main"}
  - {class: dk.brics.automaton.Datatypes, method: isUnicodeBlockName, match: "(String name)", note: "Datatypes.isUnicodeBlockName"}
  - {class: dk.brics.automaton.Datatypes, method: isUnicodeCategoryName, match: "(String name)", note: "Datatypes.isUnicodeCategoryName"}
  - {class: dk.brics.automaton.Datatypes, method: isXMLName, match: "(String name)", note: "Datatypes.isXMLName"}
  - {class: dk.brics.automaton.DatatypesAutomatonProvider, method: getAutomaton, match: "(String name)", note: "DatatypesAutomatonProvider.getAutomaton"}
  - {class: dk.brics.automaton.MatchOnlyRunAutomaton, method: load, match: "(final InputStream stream) throws IOException, ClassCastException, ClassNotFoundException", note: "MatchOnlyRunAutomaton.load"}
  - {class: dk.brics.automaton.MatchOnlyRunAutomaton, method: store, match: "(final OutputStream stream) throws IOException", note: "MatchOnlyRunAutomaton.store"}
  - {class: dk.brics.automaton.MinimizationOperations, method: minimize, match: "(Automaton a)", note: "MinimizationOperations.minimize"}
  - {class: dk.brics.automaton.MinimizationOperations, method: minimizeHuffman, match: "(Automaton a)", note: "MinimizationOperations.minimizeHuffman"}
  - {class: dk.brics.automaton.MinimizationOperations, method: minimizeBrzozowski, match: "(Automaton a)", note: "MinimizationOperations.minimizeBrzozowski"}
  - {class: dk.brics.automaton.MinimizationOperations, method: minimizeHopcroft, match: "(Automaton a)", note: "MinimizationOperations.minimizeHopcroft"}
  - {class: dk.brics.automaton.RegExp, method: toAutomaton, match: "()", note: "RegExp.toAutomaton"}
  - {class: dk.brics.automaton.RegExp, method: toAutomaton, match: "(boolean minimize)", note: "RegExp.toAutomaton"}
  - {class: dk.brics.automaton.RegExp, method: toAutomaton, match: "(AutomatonProvider automaton_provider) throws IllegalArgumentException", note: "RegExp.toAutomaton"}
  - {class: dk.brics.automaton.RegExp, method: toAutomaton, match: "(AutomatonProvider automaton_provider, boolean minimize) throws IllegalArgumentException", note: "RegExp.toAutomaton"}
  - {class: dk.brics.automaton.RunAutomaton, method: getSize, match: "()", note: "RunAutomaton.getSize"}
  - {class: dk.brics.automaton.RunAutomaton, method: isAccept, match: "(int state)", note: "RunAutomaton.isAccept"}
  - {class: dk.brics.automaton.RunAutomaton, method: getInitialState, match: "()", note: "RunAutomaton.getInitialState"}
  - {class: dk.brics.automaton.RunAutomaton, method: getCharIntervals, match: "()", note: "RunAutomaton.getCharIntervals"}
  - {class: dk.brics.automaton.ShuffleOperations, method: shuffle, match: "(Automaton a1, Automaton a2)", note: "ShuffleOperations.shuffle"}
  - {class: dk.brics.automaton.ShuffleOperations, method: shuffleSubsetOf, match: "(Collection<Automaton> ca, Automaton a, Character suspend_shuffle, Character resume_shuffle)", note: "ShuffleOperations.shuffleSubsetOf"}
  - {class: dk.brics.automaton.SpecialOperations, method: reverse, match: "(Automaton a)", note: "SpecialOperations.reverse"}
  - {class: dk.brics.automaton.SpecialOperations, method: overlap, match: "(Automaton a1, Automaton a2)", note: "SpecialOperations.overlap"}
  - {class: dk.brics.automaton.SpecialOperations, method: singleChars, match: "(Automaton a)", note: "SpecialOperations.singleChars"}
  - {class: dk.brics.automaton.SpecialOperations, method: trim, match: "(Automaton a, String set, char c)", note: "SpecialOperations.trim"}
  - {class: dk.brics.automaton.State, method: getTransitions, match: "()", note: "State.getTransitions"}
  - {class: dk.brics.automaton.State, method: addTransition, match: "(Transition t)", note: "State.addTransition"}
  - {class: dk.brics.automaton.State, method: setAccept, match: "(boolean accept)", note: "State.setAccept"}
  - {class: dk.brics.automaton.State, method: isAccept, match: "()", note: "State.isAccept"}
  - {class: dk.brics.automaton.StatePair, method: getFirstState, match: "()", note: "StatePair.getFirstState"}
