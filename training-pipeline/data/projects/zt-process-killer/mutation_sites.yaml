# Curated performance-mutation sites for zt-process-killer (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants zt-process-killer --source data/external-src/<checkout> \
#       --sites data/projects/zt-process-killer/mutation_sites.yaml

package_root: org.zeroturnaround.process

sites:
  - {class: org.zeroturnaround.process.PidUtil, method: getMyPid, match: "()", note: "PidUtil.getMyPid"}
  - {class: org.zeroturnaround.process.win.WmicUtil, method: getPath, match: "()", note: "WmicUtil.getPath"}
  - {class: org.zeroturnaround.process.PidUtil, method: getPid, match: "(Process process)", note: "PidUtil.getPid"}
  - {class: org.zeroturnaround.process.ProcessUtil, method: waitFor, match: "(SystemProcess process) throws InterruptedException", note: "ProcessUtil.waitFor"}
  - {class: org.zeroturnaround.process.ProcessUtil, method: waitFor, match: "(SystemProcess process, long timeout, TimeUnit unit) throws InterruptedException, TimeoutException", note: "ProcessUtil.waitFor"}
  - {class: org.zeroturnaround.process.ProcessUtil, method: destroyGracefullyAndWait, match: "(SystemProcess process) throws IOException, InterruptedException", note: "ProcessUtil.destroyGracefullyAndWait"}
  - {class: org.zeroturnaround.process.ProcessUtil, method: destroyGracefullyAndWait, match: "(SystemProcess process, long timeout, TimeUnit unit) throws IOException, InterruptedException, TimeoutException", note: "ProcessUtil.destroyGracefullyAndWait"}
  - {class: org.zeroturnaround.process.ProcessUtil, method: destroyForcefullyAndWait, match: "(SystemProcess process) throws IOException, InterruptedException", note: "ProcessUtil.destroyForcefullyAndWait"}
  - {class: org.zeroturnaround.process.ProcessUtil, method: destroyForcefullyAndWait, match: "(SystemProcess process, long timeout, TimeUnit unit) throws IOException, InterruptedException, TimeoutException", note: "ProcessUtil.destroyForcefullyAndWait"}
  - {class: org.zeroturnaround.process.ProcessUtil, method: destroyGracefullyOrForcefullyAndWait, match: "(SystemProcess process) throws IOException, InterruptedException", note: "ProcessUtil.destroyGracefullyOrForcefullyAndWait"}
  - {class: org.zeroturnaround.process.ProcessUtil, method: destroyGracefullyOrForcefullyAndWait, match: "(SystemProcess process, long gracefulTimeout, TimeUnit gracefulTimeoutUnit) throws IOException, InterruptedException", note: "ProcessUtil.destroyGracefullyOrForcefullyAndWait"}
  - {class: org.zeroturnaround.process.ProcessUtil, method: destroyGracefullyOrForcefullyAndWait, match: "(SystemProcess process, long gracefulTimeout, TimeUnit gracefulTimeoutUnit, long forcefulTimeout, TimeUnit forcefulTimeoutUnit) throws IOException, InterruptedException, TimeoutException", note: "ProcessUtil.destroyGracefullyOrForcefullyAndWait"}
  - {class: org.zeroturnaround.process.ReflectionUtil, method: invokeWithoutDeclaredExceptions, match: "(Method method, Object target, Object... args)", note: "ReflectionUtil.invokeWithoutDeclaredExceptions"}
  - {class: org.zeroturnaround.process.ReflectionUtil, method: invokeWithInterruptedException, match: "(Method method, Object target, Object... args) throws InterruptedException", note: "ReflectionUtil.invokeWithInterruptedException"}
