  - {class: com.eclipsesource.v8.utils.ConcurrentV8, method: run, match: "(final V8Runnable runnable)", note: "ConcurrentV8.run"}
  - {class: com.eclipsesource.v8.PlatformDetector, method: getName, match: "()", note: "PlatformDetector.getName"}
  - {class: com.eclipsesource.v8.debug.EventData, method: close, match: "()", note: "EventData.close"}
  - {class: com.eclipsesource.v8.utils.MemoryManager, method: getObjectReferenceCount, match: "()", note: "MemoryManager.getObjectReferenceCount"}
  - {class: com.eclipsesource.v8.PlatformDetector, method: getName, match: "()", note: "PlatformDetector.getName"}
  - {class: com.eclipsesource.v8.debug.EventData, method: release, match: "()", note: "EventData.release"}
  - {class: com.eclipsesource.v8.utils.MemoryManager, method: persist, match: "(final V8Value object)", note: "MemoryManager.persist"}
  - {class: com.eclipsesource.v8.V8, method: isLoaded, match: "()", note: "V8.isLoaded"}
  - {class: com.eclipsesource.v8.debug.ExecutionState, method: getFrameCount, match: "()", note: "ExecutionState.getFrameCount"}
  - {class: com.eclipsesource.v8.utils.V8Executor, method: setup, match: "(final V8 runtime)", note: "V8Executor.setup"}
  - {class: com.eclipsesource.v8.V8, method: setFlags, match: "(final String flags)", note: "V8.setFlags"}
  - {class: com.eclipsesource.v8.debug.ExecutionState, method: prepareStep, match: "(final StepAction action)", note: "ExecutionState.prepareStep"}
