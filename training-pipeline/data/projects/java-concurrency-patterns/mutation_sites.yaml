  - {class: br.com.leonardoz.features.futures.UsingCompletableFuture, method: main, match: "(String[] args) throws InterruptedException, ExecutionException", note: "UsingCompletableFuture.main"}
  - {class: br.com.leonardoz.patterns.fixed_lock_ordering.FixedLockOrdering, method: getId, match: "()", note: "FixedLockOrdering.getId"}
  - {class: br.com.leonardoz.features.futures.UsingFutureTasks, method: main, match: "(String[] args)", note: "UsingFutureTasks.main"}
  - {class: br.com.leonardoz.patterns.fixed_lock_ordering.FixedLockOrdering, method: setId, match: "(int id)", note: "FixedLockOrdering.setId"}
  - {class: br.com.leonardoz.features.locks.UsingExplicitReadWriteLocks, method: showContent, match: "()", note: "UsingExplicitReadWriteLocks.showContent"}
