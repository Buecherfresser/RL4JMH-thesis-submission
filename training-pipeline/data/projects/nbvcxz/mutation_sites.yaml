# Curated performance-mutation sites for nbvcxz (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants nbvcxz --source data/external-src/<checkout> \
#       --sites data/projects/nbvcxz/mutation_sites.yaml

package_root: me.gosimple.nbvcxz

sites:
  - {class: me.gosimple.nbvcxz.Nbvcxz, method: getEntropyFromGuesses, match: "(final BigDecimal guesses)", note: "Nbvcxz.getEntropyFromGuesses"}
  - {class: me.gosimple.nbvcxz.matching.DateMatcher, method: match, match: "(final Configuration configuration, final String password)", note: "DateMatcher.match"}
  - {class: me.gosimple.nbvcxz.resources.AdjacencyGraphUtil, method: calcAverageDegree, match: "(HashMap<Character, String[]> keys)", note: "AdjacencyGraphUtil.calcAverageDegree"}
  - {class: me.gosimple.nbvcxz.scoring.Result, method: getEntropy, match: "()", note: "Result.getEntropy"}
  - {class: me.gosimple.nbvcxz.Nbvcxz, method: getGuessesFromEntropy, match: "(final Double entropy)", note: "Nbvcxz.getGuessesFromEntropy"}
  - {class: me.gosimple.nbvcxz.matching.DictionaryMatcher, method: match, match: "(final Configuration configuration, final String password)", note: "DictionaryMatcher.match"}
  - {class: me.gosimple.nbvcxz.resources.AdjacencyGraphUtil, method: neighborsNumber, match: "(String[] neighbors)", note: "AdjacencyGraphUtil.neighborsNumber"}
  - {class: me.gosimple.nbvcxz.scoring.Result, method: getGuesses, match: "()", note: "Result.getGuesses"}
  - {class: me.gosimple.nbvcxz.Nbvcxz, method: main, match: "(String... args)", note: "Nbvcxz.main"}
  - {class: me.gosimple.nbvcxz.matching.RepeatMatcher, method: match, match: "(final Configuration configuration, final String password)", note: "RepeatMatcher.match"}
  - {class: me.gosimple.nbvcxz.resources.AdjacencyGraphUtil, method: getNeighbors, match: "(final AdjacencyGraph adjacencyGraph, final Character key)", note: "AdjacencyGraphUtil.getNeighbors"}
  - {class: me.gosimple.nbvcxz.scoring.Result, method: getMatches, match: "()", note: "Result.getMatches"}
  - {class: me.gosimple.nbvcxz.matching.SeparatorMatcher, method: match, match: "(final Configuration configuration, final String password)", note: "SeparatorMatcher.match"}
  - {class: me.gosimple.nbvcxz.resources.BruteForceUtil, method: getBruteForceCardinality, match: "(final String password)", note: "BruteForceUtil.getBruteForceCardinality"}
  - {class: me.gosimple.nbvcxz.scoring.TimeEstimate, method: getTimeToCrack, match: "(final Result result, final String guess_type)", note: "TimeEstimate.getTimeToCrack"}
  - {class: me.gosimple.nbvcxz.matching.SequenceMatcher, method: match, match: "(final Configuration configuration, final String password)", note: "SequenceMatcher.match"}
  - {class: me.gosimple.nbvcxz.resources.BruteForceUtil, method: getBruteForceCardinality, match: "(final char character)", note: "BruteForceUtil.getBruteForceCardinality"}
  - {class: me.gosimple.nbvcxz.scoring.TimeEstimate, method: getTimeToCrackFormatted, match: "(final Result result, final String guess_type)", note: "TimeEstimate.getTimeToCrackFormatted"}
  - {class: me.gosimple.nbvcxz.matching.SpacialMatcher, method: match, match: "(final Configuration configuration, final String password)", note: "SpacialMatcher.match"}
  - {class: me.gosimple.nbvcxz.resources.CharacterCaseUtil, method: fractionOfStringUppercase, match: "(String input)", note: "CharacterCaseUtil.fractionOfStringUppercase"}
  - {class: me.gosimple.nbvcxz.matching.YearMatcher, method: match, match: "(final Configuration configuration, final String password)", note: "YearMatcher.match"}
  - {class: me.gosimple.nbvcxz.resources.ConfigurationBuilder, method: getDefaultPasswordMatchers, match: "()", note: "ConfigurationBuilder.getDefaultPasswordMatchers"}
  - {class: me.gosimple.nbvcxz.matching.match.DateMatch, method: getDay, match: "()", note: "DateMatch.getDay"}
  - {class: me.gosimple.nbvcxz.resources.ConfigurationBuilder, method: getMooresMultiplier, match: "()", note: "ConfigurationBuilder.getMooresMultiplier"}
  - {class: me.gosimple.nbvcxz.matching.match.DateMatch, method: getMonth, match: "()", note: "DateMatch.getMonth"}
  - {class: me.gosimple.nbvcxz.resources.ConfigurationBuilder, method: getDefaultGuessTypes, match: "(Long crackingHardwareCost)", note: "ConfigurationBuilder.getDefaultGuessTypes"}
  - {class: me.gosimple.nbvcxz.matching.match.DateMatch, method: getYear, match: "()", note: "DateMatch.getYear"}
  - {class: me.gosimple.nbvcxz.resources.DictionaryBuilder, method: setDictionaryName, match: "(final String dictionary_name)", note: "DictionaryBuilder.setDictionaryName"}
  - {class: me.gosimple.nbvcxz.matching.match.DictionaryMatch, method: getRank, match: "()", note: "DictionaryMatch.getRank"}
  - {class: me.gosimple.nbvcxz.resources.DictionaryBuilder, method: setExclusion, match: "(final boolean exclusion)", note: "DictionaryBuilder.setExclusion"}
  - {class: me.gosimple.nbvcxz.matching.match.DictionaryMatch, method: isLeet, match: "()", note: "DictionaryMatch.isLeet"}
  - {class: me.gosimple.nbvcxz.resources.DictionaryBuilder, method: addWord, match: "(final String word, final int rank)", note: "DictionaryBuilder.addWord"}
  - {class: me.gosimple.nbvcxz.matching.match.DictionaryMatch, method: getDictionaryName, match: "()", note: "DictionaryMatch.getDictionaryName"}
  - {class: me.gosimple.nbvcxz.resources.DictionaryUtil, method: loadUnrankedDictionary, match: "(final String fileName)", note: "DictionaryUtil.loadUnrankedDictionary"}
  - {class: me.gosimple.nbvcxz.matching.match.RepeatMatch, method: getRepeatingCharacters, match: "()", note: "RepeatMatch.getRepeatingCharacters"}
  - {class: me.gosimple.nbvcxz.resources.DictionaryUtil, method: loadRankedDictionary, match: "(final String fileName)", note: "DictionaryUtil.loadRankedDictionary"}
  - {class: me.gosimple.nbvcxz.matching.match.RepeatMatch, method: getRepeat, match: "()", note: "RepeatMatch.getRepeat"}
  - {class: me.gosimple.nbvcxz.resources.FeedbackUtil, method: getFeedback, match: "(final Result result)", note: "FeedbackUtil.getFeedback"}
  - {class: me.gosimple.nbvcxz.matching.match.RepeatMatch, method: getDetails, match: "()", note: "RepeatMatch.getDetails"}
  - {class: me.gosimple.nbvcxz.resources.AdjacencyGraph, method: getKeyMap, match: "()", note: "AdjacencyGraph.getKeyMap"}
  - {class: me.gosimple.nbvcxz.matching.match.SequenceMatch, method: getFirstCharacter, match: "()", note: "SequenceMatch.getFirstCharacter"}
  - {class: me.gosimple.nbvcxz.resources.AdjacencyGraph, method: getAverageDegree, match: "()", note: "AdjacencyGraph.getAverageDegree"}
  - {class: me.gosimple.nbvcxz.matching.match.SequenceMatch, method: getDetails, match: "()", note: "SequenceMatch.getDetails"}
  - {class: me.gosimple.nbvcxz.resources.AdjacencyGraph, method: getName, match: "()", note: "AdjacencyGraph.getName"}
  - {class: me.gosimple.nbvcxz.matching.match.SpacialMatch, method: getAdjacencyGraph, match: "()", note: "SpacialMatch.getAdjacencyGraph"}
  - {class: me.gosimple.nbvcxz.resources.BestMatches, method: setMatchLength, match: "(int best_match_length)", note: "BestMatches.setMatchLength"}
  - {class: me.gosimple.nbvcxz.matching.match.SpacialMatch, method: getTurns, match: "()", note: "SpacialMatch.getTurns"}
  - {class: me.gosimple.nbvcxz.resources.BestMatches, method: getMatchLength, match: "()", note: "BestMatches.getMatchLength"}
  - {class: me.gosimple.nbvcxz.matching.match.SpacialMatch, method: getShiftedNumber, match: "()", note: "SpacialMatch.getShiftedNumber"}
  - {class: me.gosimple.nbvcxz.resources.BestMatches, method: setBestMatches, match: "(List<Match> best_matches)", note: "BestMatches.setBestMatches"}
