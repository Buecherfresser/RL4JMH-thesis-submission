# Curated performance-mutation sites for password4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants password4j --source data/external-src/<checkout> \
#       --sites data/projects/password4j/mutation_sites.yaml

package_root: com.password4j

sites:
  - {class: com.password4j.Argon2Function, method: getInstance, match: "(int memory, int iterations, int parallelism, int outputLength, Argon2 type)", note: "Argon2Function.getInstance"}
  - {class: com.password4j.types.Bcrypt, method: valueOf, match: "(char minor)", note: "Bcrypt.valueOf"}
  - {class: com.password4j.Argon2Function, method: getInstance, match: "(int memory, int iterations, int parallelism, int outputLength, Argon2 type,", note: "Argon2Function.getInstance"}
  - {class: com.password4j.types.Bcrypt, method: minor, match: "()", note: "Bcrypt.minor"}
  - {class: com.password4j.Argon2Function, method: getInstanceFromHash, match: "(String hashed)", note: "Argon2Function.getInstanceFromHash"}
  - {class: com.password4j.types.Hmac, method: fromCode, match: "(int code)", note: "Hmac.fromCode"}
  - {class: com.password4j.BalloonHashingFunction, method: getInstance, match: "(String algorithm, int spaceCost, int timeCost, int parallelism, int delta)", note: "BalloonHashingFunction.getInstance"}
  - {class: com.password4j.types.Hmac, method: bits, match: "()", note: "Hmac.bits"}
  - {class: com.password4j.BalloonHashingFunction, method: getInstance, match: "(String algorithm, int spaceCost, int timeCost, int parallelism)", note: "BalloonHashingFunction.getInstance"}
  - {class: com.password4j.types.Hmac, method: code, match: "()", note: "Hmac.code"}
  - {class: com.password4j.BalloonHashingFunction, method: hash, match: "(CharSequence plainTextPassword)", note: "BalloonHashingFunction.hash"}
  - {class: com.password4j.BcryptFunction, method: getInstance, match: "(int logRounds)", note: "BcryptFunction.getInstance"}
  - {class: com.password4j.BcryptFunction, method: getInstance, match: "(Bcrypt type, int logRounds)", note: "BcryptFunction.getInstance"}
  - {class: com.password4j.BcryptFunction, method: getInstanceFromHash, match: "(String hashed)", note: "BcryptFunction.getInstanceFromHash"}
  - {class: com.password4j.CompressedPBKDF2Function, method: getInstance, match: "(Hmac algorithm, int iterations, int length)", note: "CompressedPBKDF2Function.getInstance"}
  - {class: com.password4j.CompressedPBKDF2Function, method: getInstance, match: "(String algorithm, int iterations, int length)", note: "CompressedPBKDF2Function.getInstance"}
  - {class: com.password4j.CompressedPBKDF2Function, method: getInstanceFromHash, match: "(String hashed)", note: "CompressedPBKDF2Function.getInstanceFromHash"}
  - {class: com.password4j.HashBuilder, method: addSalt, match: "(String salt)", note: "HashBuilder.addSalt"}
  - {class: com.password4j.HashBuilder, method: addSalt, match: "(byte[] saltAsBytes)", note: "HashBuilder.addSalt"}
  - {class: com.password4j.HashBuilder, method: addRandomSalt, match: "()", note: "HashBuilder.addRandomSalt"}
  - {class: com.password4j.MessageDigestFunction, method: getInstance, match: "(String algorithm)", note: "MessageDigestFunction.getInstance"}
  - {class: com.password4j.MessageDigestFunction, method: getInstance, match: "(String algorithm, SaltOption saltOption)", note: "MessageDigestFunction.getInstance"}
  - {class: com.password4j.MessageDigestFunction, method: getUID, match: "(String algorithm, SaltOption saltOption)", note: "MessageDigestFunction.getUID"}
  - {class: com.password4j.PBKDF2Function, method: getInstance, match: "(Hmac algorithm, int iterations, int length)", note: "PBKDF2Function.getInstance"}
  - {class: com.password4j.PBKDF2Function, method: getInstance, match: "(String algorithm, int iterations, int length)", note: "PBKDF2Function.getInstance"}
  - {class: com.password4j.PBKDF2Function, method: internalHash, match: "(byte[] plainTextPassword, byte[] salt, String algorithm, int iterations, int length) throws NoSuchAlgorithmException, InvalidKeySpecException", note: "PBKDF2Function.internalHash"}
  - {class: com.password4j.ScryptFunction, method: getInstanceFromHash, match: "(String hashed)", note: "ScryptFunction.getInstanceFromHash"}
  - {class: com.password4j.ScryptFunction, method: getInstance, match: "(int workFactor, int resources, int parallelization)", note: "ScryptFunction.getInstance"}
  - {class: com.password4j.ScryptFunction, method: getInstance, match: "(int workFactor, int resources, int parallelization, int derivedKeyLength)", note: "ScryptFunction.getInstance"}
  - {class: com.password4j.SecureString, method: length, match: "()", note: "SecureString.length"}
  - {class: com.password4j.SecureString, method: charAt, match: "(int index)", note: "SecureString.charAt"}
  - {class: com.password4j.SecureString, method: subSequence, match: "(int start, int end)", note: "SecureString.subSequence"}
  - {class: com.password4j.Utils, method: run, match: "()", note: "Utils.run"}
  - {class: com.password4j.AlgorithmFinder, method: getSecureRandom, match: "()", note: "AlgorithmFinder.getSecureRandom"}
  - {class: com.password4j.AlgorithmFinder, method: getPBKDF2Instance, match: "()", note: "AlgorithmFinder.getPBKDF2Instance"}
  - {class: com.password4j.AlgorithmFinder, method: getCompressedPBKDF2Instance, match: "()", note: "AlgorithmFinder.getCompressedPBKDF2Instance"}
  - {class: com.password4j.BenchmarkResult, method: getPrototype, match: "()", note: "BenchmarkResult.getPrototype"}
  - {class: com.password4j.BenchmarkResult, method: getElapsed, match: "()", note: "BenchmarkResult.getElapsed"}
  - {class: com.password4j.Hash, method: getResult, match: "()", note: "Hash.getResult"}
  - {class: com.password4j.Hash, method: getResultAsBytes, match: "()", note: "Hash.getResultAsBytes"}
  - {class: com.password4j.Hash, method: getBytes, match: "()", note: "Hash.getBytes"}
  - {class: com.password4j.HashChecker, method: addPepper, match: "(CharSequence pepper)", note: "HashChecker.addPepper"}
  - {class: com.password4j.HashChecker, method: addPepper, match: "()", note: "HashChecker.addPepper"}
  - {class: com.password4j.HashChecker, method: addSalt, match: "(String salt)", note: "HashChecker.addSalt"}
  - {class: com.password4j.HashUpdate, method: getHash, match: "()", note: "HashUpdate.getHash"}
  - {class: com.password4j.HashUpdate, method: isVerified, match: "()", note: "HashUpdate.isVerified"}
  - {class: com.password4j.HashUpdate, method: isUpdated, match: "()", note: "HashUpdate.isUpdated"}
  - {class: com.password4j.HashUpdater, method: with, match: "(HashingFunction oldHashingFunction, HashingFunction newHashingFunction)", note: "HashUpdater.with"}
  - {class: com.password4j.HashUpdater, method: addNewSalt, match: "(String salt)", note: "HashUpdater.addNewSalt"}
  - {class: com.password4j.HashUpdater, method: addNewSalt, match: "(byte[] saltAsBytes)", note: "HashUpdater.addNewSalt"}
