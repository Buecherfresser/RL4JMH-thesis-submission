# Curated performance-mutation sites for dd-plist (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants dd-plist --source data/external-src/<checkout> \
#       --sites data/projects/dd-plist/mutation_sites.yaml

package_root: com.dd.plist

sites:
  - {class: com.dd.plist.ASCIIPropertyListParser, method: parse, match: "(File f) throws IOException, ParseException", note: "ASCIIPropertyListParser.parse"}
  - {class: com.dd.plist.ASCIIPropertyListParser, method: parse, match: "(File f, String encoding) throws IOException, ParseException", note: "ASCIIPropertyListParser.parse"}
  - {class: com.dd.plist.ASCIIPropertyListParser, method: parse, match: "(Path path, String encoding) throws IOException, ParseException", note: "ASCIIPropertyListParser.parse"}
  - {class: com.dd.plist.ASCIIPropertyListWriter, method: writeGnuStep, match: "(NSDictionary root, File out) throws IOException", note: "ASCIIPropertyListWriter.writeGnuStep"}
  - {class: com.dd.plist.ASCIIPropertyListWriter, method: writeGnuStep, match: "(NSDictionary root, Path path) throws IOException", note: "ASCIIPropertyListWriter.writeGnuStep"}
  - {class: com.dd.plist.ASCIIPropertyListWriter, method: writeGnuStep, match: "(NSArray root, File out) throws IOException", note: "ASCIIPropertyListWriter.writeGnuStep"}
  - {class: com.dd.plist.BinaryPropertyListParser, method: parse, match: "(File f) throws IOException, PropertyListFormatException", note: "BinaryPropertyListParser.parse"}
  - {class: com.dd.plist.BinaryPropertyListParser, method: parse, match: "(Path path) throws IOException, PropertyListFormatException", note: "BinaryPropertyListParser.parse"}
  - {class: com.dd.plist.BinaryPropertyListParser, method: parse, match: "(InputStream is) throws IOException, PropertyListFormatException", note: "BinaryPropertyListParser.parse"}
  - {class: com.dd.plist.BinaryPropertyListWriter, method: writeToArray, match: "(NSObject root) throws IOException", note: "BinaryPropertyListWriter.writeToArray"}
  - {class: com.dd.plist.ByteOrderMarkFilterInputStream, method: close, match: "() throws IOException", note: "ByteOrderMarkFilterInputStream.close"}
  - {class: com.dd.plist.NSArray, method: objectAtIndex, match: "(int i)", note: "NSArray.objectAtIndex"}
  - {class: com.dd.plist.NSArray, method: setValue, match: "(int key, Object value)", note: "NSArray.setValue"}
  - {class: com.dd.plist.NSArray, method: getArray, match: "()", note: "NSArray.getArray"}
  - {class: com.dd.plist.NSNumber, method: type, match: "()", note: "NSNumber.type"}
  - {class: com.dd.plist.NSNumber, method: isBoolean, match: "()", note: "NSNumber.isBoolean"}
  - {class: com.dd.plist.NSNumber, method: isInteger, match: "()", note: "NSNumber.isInteger"}
  - {class: com.dd.plist.NSSet, method: addObject, match: "(NSObject obj)", note: "NSSet.addObject"}
  - {class: com.dd.plist.NSSet, method: removeObject, match: "(NSObject obj)", note: "NSSet.removeObject"}
  - {class: com.dd.plist.NSSet, method: allObjects, match: "()", note: "NSSet.allObjects"}
  - {class: com.dd.plist.NSString, method: intValue, match: "()", note: "NSString.intValue"}
  - {class: com.dd.plist.NSString, method: floatValue, match: "()", note: "NSString.floatValue"}
  - {class: com.dd.plist.NSString, method: doubleValue, match: "()", note: "NSString.doubleValue"}
  - {class: com.dd.plist.PropertyListConverter, method: convertToASCII, match: "(File in, File out)", note: "PropertyListConverter.convertToASCII"}
  - {class: com.dd.plist.PropertyListConverter, method: convertToASCII, match: "(Path in, Path out)", note: "PropertyListConverter.convertToASCII"}
  - {class: com.dd.plist.PropertyListConverter, method: convertToGnuStepASCII, match: "(File in, File out)", note: "PropertyListConverter.convertToGnuStepASCII"}
  - {class: com.dd.plist.PropertyListFormatException, method: getLocationInformation, match: "()", note: "PropertyListFormatException.getLocationInformation"}
  - {class: com.dd.plist.PropertyListParser, method: readAll, match: "(InputStream in) throws IOException", note: "PropertyListParser.readAll"}
  - {class: com.dd.plist.PropertyListParser, method: parse, match: "(String filePath)", note: "PropertyListParser.parse"}
  - {class: com.dd.plist.PropertyListParser, method: parse, match: "(File f)", note: "PropertyListParser.parse"}
  - {class: com.dd.plist.XMLPropertyListParser, method: getDocBuilder, match: "() throws ParserConfigurationException", note: "XMLPropertyListParser.getDocBuilder"}
  - {class: com.dd.plist.XMLPropertyListParser, method: parse, match: "(File f)", note: "XMLPropertyListParser.parse"}
  - {class: com.dd.plist.XMLPropertyListParser, method: parse, match: "(Path path)", note: "XMLPropertyListParser.parse"}
  - {class: com.dd.plist.ASCIILocationInformation, method: getLineNumber, match: "()", note: "ASCIILocationInformation.getLineNumber"}
  - {class: com.dd.plist.ASCIILocationInformation, method: getColumnNumber, match: "()", note: "ASCIILocationInformation.getColumnNumber"}
  - {class: com.dd.plist.ASCIILocationInformation, method: getDescription, match: "()", note: "ASCIILocationInformation.getDescription"}
  - {class: com.dd.plist.Base64, method: encodeObject, match: "(java.io.Serializable serializableObject)", note: "Base64.encodeObject"}
  - {class: com.dd.plist.Base64, method: encodeObject, match: "(java.io.Serializable serializableObject, int options)", note: "Base64.encodeObject"}
  - {class: com.dd.plist.Base64, method: encodeBytes, match: "(byte[] source)", note: "Base64.encodeBytes"}
  - {class: com.dd.plist.BinaryLocationInformation, method: getId, match: "()", note: "BinaryLocationInformation.getId"}
  - {class: com.dd.plist.BinaryLocationInformation, method: getDescription, match: "()", note: "BinaryLocationInformation.getDescription"}
  - {class: com.dd.plist.ByteOrderMarkReader, method: getDetectedCharset, match: "()", note: "ByteOrderMarkReader.getDetectedCharset"}
  - {class: com.dd.plist.ByteOrderMarkReader, method: detect, match: "(byte[] bytes)", note: "ByteOrderMarkReader.detect"}
  - {class: com.dd.plist.NSData, method: bytes, match: "()", note: "NSData.bytes"}
  - {class: com.dd.plist.NSData, method: length, match: "()", note: "NSData.length"}
  - {class: com.dd.plist.NSData, method: getBytes, match: "(ByteBuffer buf, int length)", note: "NSData.getBytes"}
  - {class: com.dd.plist.NSDate, method: getDate, match: "()", note: "NSDate.getDate"}
  - {class: com.dd.plist.NSDate, method: toJavaObject, match: "()", note: "NSDate.toJavaObject"}
  - {class: com.dd.plist.NSDate, method: compareTo, match: "(NSObject o)", note: "NSDate.compareTo"}
  - {class: com.dd.plist.NSDictionary, method: getHashMap, match: "()", note: "NSDictionary.getHashMap"}
