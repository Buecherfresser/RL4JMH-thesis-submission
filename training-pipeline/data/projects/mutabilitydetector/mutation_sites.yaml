# Curated performance-mutation sites for mutabilitydetector (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants mutabilitydetector --source data/external-src/<checkout> \
#       --sites data/projects/mutabilitydetector/mutation_sites.yaml

package_root: org.mutabilitydetector.checkers

sites:
  - {class: org.mutabilitydetector.checkers.ArrayFieldMutabilityChecker, method: visitField, match: "(int access, String name, String desc, String signature, Object value)", note: "ArrayFieldMutabilityChecker.visitField"}
  - {class: org.mutabilitydetector.checkers.hint.WrappingHint, method: getWrappingHint, match: "(String fieldName)", note: "WrappingHint.getWrappingHint"}
  - {class: org.mutabilitydetector.checkers.info.AnalysisDatabase, method: newAnalysisDatabase, match: "(InformationRetrievalRunner sessionCheckerRunner)", note: "AnalysisDatabase.newAnalysisDatabase"}
  - {class: org.mutabilitydetector.checkers.settermethod.CandidatesInitialisersMapping, method: getInstance, match: "()", note: "CandidatesInitialisersMapping.getInstance"}
  - {class: org.mutabilitydetector.checkers.util.PrivateMethodInvocationAnalyser, method: isPrivateMethodCalledOnlyFromConstructor, match: "(String methodDescriptor)", note: "PrivateMethodInvocationAnalyser.isPrivateMethodCalledOnlyFromConstructor"}
  - {class: org.mutabilitydetector.checkers.OldSetterMethodChecker, method: newSetterMethodChecker, match: "(PrivateMethodInvocationInformation privateMethodInvocationInfo, AsmVerifierFactory verifierFactory)", note: "OldSetterMethodChecker.newSetterMethodChecker"}
  - {class: org.mutabilitydetector.checkers.hint.WrappingHint, method: isEmpty, match: "()", note: "WrappingHint.isEmpty"}
  - {class: org.mutabilitydetector.checkers.info.AnalysisDatabase, method: requestInformation, match: "(InfoKey<I> infoCategory)", note: "AnalysisDatabase.requestInformation"}
  - {class: org.mutabilitydetector.checkers.settermethod.CandidatesInitialisersMapping, method: getConstructors, match: "()", note: "CandidatesInitialisersMapping.getConstructors"}
  - {class: org.mutabilitydetector.checkers.util.PrivateMethodInvocationAnalyser, method: visitMethod, match: "(int access, String name, String desc, String signature, String[] exceptions)", note: "PrivateMethodInvocationAnalyser.visitMethod"}
  - {class: org.mutabilitydetector.checkers.OldSetterMethodChecker, method: visit, match: "(int version, int access, String name, String signature, String superName, String[] interfaces)", note: "OldSetterMethodChecker.visit"}
  - {class: org.mutabilitydetector.checkers.hint.WrappingHintGenerator, method: generate, match: "()", note: "WrappingHintGenerator.generate"}
  - {class: org.mutabilitydetector.checkers.info.AnalysisInProgress, method: noAnalysisUnderway, match: "()", note: "AnalysisInProgress.noAnalysisUnderway"}
  - {class: org.mutabilitydetector.checkers.settermethod.SetterMethodChecker, method: getMethodIdentifier, match: "()", note: "SetterMethodChecker.getMethodIdentifier"}
  - {class: org.mutabilitydetector.checkers.util.StackPushingOpcodes, method: includes, match: "(int opcode)", note: "StackPushingOpcodes.includes"}
  - {class: org.mutabilitydetector.checkers.UnhandledExceptionBuilder, method: unhandledException, match: "(Throwable cause,", note: "UnhandledExceptionBuilder.unhandledException"}
  - {class: org.mutabilitydetector.checkers.info.AnalysisInProgress, method: analysisStartedFor, match: "(Dotted clazz)", note: "AnalysisInProgress.analysisStartedFor"}
  - {class: org.mutabilitydetector.checkers.settermethod.SetterMethodChecker, method: newInstance, match: "()", note: "SetterMethodChecker.newInstance"}
  - {class: org.mutabilitydetector.checkers.util.TypeStructureInformationAnalyser, method: newAnalyser, match: "(Dotted className)", note: "TypeStructureInformationAnalyser.newAnalyser"}
  - {class: org.mutabilitydetector.checkers.AccessModifierQuery, method: method, match: "(int access)", note: "AccessModifierQuery.method"}
  - {class: org.mutabilitydetector.checkers.info.CopyMethod, method: from, match: "(MethodInsnNode methodNode)", note: "CopyMethod.from"}
  - {class: org.mutabilitydetector.checkers.settermethod.Alias, method: newInstance, match: "(final boolean doesExist, final int localVariable)", note: "Alias.newInstance"}
  - {class: org.mutabilitydetector.checkers.util.TypeStructureInformationAnalyser, method: isAbstract, match: "()", note: "TypeStructureInformationAnalyser.isAbstract"}
  - {class: org.mutabilitydetector.checkers.AccessModifierQuery, method: type, match: "(int access)", note: "AccessModifierQuery.type"}
  - {class: org.mutabilitydetector.checkers.info.CyclicReferences, method: detectedBetween, match: "(Dotted ownerClass, Dotted fieldClass, AnalysisInProgress analysisInProgress)", note: "CyclicReferences.detectedBetween"}
  - {class: org.mutabilitydetector.checkers.settermethod.AliasFinder, method: newInstance, match: "(final String variableName, final ControlFlowBlock controlFlowBlockToExamine)", note: "AliasFinder.newInstance"}
  - {class: org.mutabilitydetector.checkers.AllChecksRunner, method: runCheckers, match: "(ImmutableList<AnalysisResult> knownResultsSoFar,", note: "AllChecksRunner.runCheckers"}
  - {class: org.mutabilitydetector.checkers.info.CyclicReferences, method: newEmptyMutableInstance, match: "()", note: "CyclicReferences.newEmptyMutableInstance"}
  - {class: org.mutabilitydetector.checkers.settermethod.AliasFinder, method: find, match: "()", note: "AliasFinder.find"}
  - {class: org.mutabilitydetector.checkers.CanSubclassChecker, method: visit, match: "(int version, int access, String name, String signature, String superName, String[] interfaces)", note: "CanSubclassChecker.visit"}
  - {class: org.mutabilitydetector.checkers.info.InformationRetrievalRunner, method: run, match: "(AsmClassVisitor visitor, ClassIdentifier classIdentifier)", note: "InformationRetrievalRunner.run"}
  - {class: org.mutabilitydetector.checkers.settermethod.AssignmentGuard, method: addPredecessorInstruction, match: "(final AbstractInsnNode predecessor)", note: "AssignmentGuard.addPredecessorInstruction"}
  - {class: org.mutabilitydetector.checkers.CanSubclassChecker, method: visitMethod, match: "(int access, String name, String desc, String signature, String[] exceptions)", note: "CanSubclassChecker.visitMethod"}
  - {class: org.mutabilitydetector.checkers.info.MethodIdentifier, method: forMethod, match: "(Dotted className, String methodDescriptor)", note: "MethodIdentifier.forMethod"}
  - {class: org.mutabilitydetector.checkers.settermethod.AssignmentGuard, method: build, match: "()", note: "AssignmentGuard.build"}
  - {class: org.mutabilitydetector.checkers.CheckerResult, method: withNoErrors, match: "(IsImmutable isImmutable, Iterable<MutableReasonDetail> reasons)", note: "CheckerResult.withNoErrors"}
  - {class: org.mutabilitydetector.checkers.info.MethodIdentifier, method: forMethod, match: "(Slashed className, String methodDescriptor)", note: "MethodIdentifier.forMethod"}
  - {class: org.mutabilitydetector.checkers.settermethod.AssignmentGuardFinder, method: newInstance, match: "(final String candidateName,", note: "AssignmentGuardFinder.newInstance"}
  - {class: org.mutabilitydetector.checkers.CheckerRunner, method: createWithClasspath, match: "(ClassPath classpath, ExceptionPolicy exceptionPolicy)", note: "CheckerRunner.createWithClasspath"}
  - {class: org.mutabilitydetector.checkers.info.MutableTypeInformation, method: hardcodedCopyMethods, match: "()", note: "MutableTypeInformation.hardcodedCopyMethods"}
  - {class: org.mutabilitydetector.checkers.settermethod.AssignmentGuardFinder, method: find, match: "()", note: "AssignmentGuardFinder.find"}
  - {class: org.mutabilitydetector.checkers.CheckerRunner, method: createWithCurrentClasspath, match: "(ExceptionPolicy exceptionPolicy)", note: "CheckerRunner.createWithCurrentClasspath"}
  - {class: org.mutabilitydetector.checkers.info.MutableTypeInformation, method: resultOf, match: "(Dotted ownerClass, Dotted fieldClass, AnalysisInProgress analysisInProgress)", note: "MutableTypeInformation.resultOf"}
  - {class: org.mutabilitydetector.checkers.settermethod.AssignmentGuardVerifier, method: verify, match: "()", note: "AssignmentGuardVerifier.verify"}
  - {class: org.mutabilitydetector.checkers.ClassPathBasedCheckerRunnerFactory, method: createRunner, match: "()", note: "ClassPathBasedCheckerRunnerFactory.createRunner"}
  - {class: org.mutabilitydetector.checkers.info.PrivateMethodInvocationInformation, method: isOnlyCalledFromConstructor, match: "(MethodIdentifier forMethod)", note: "PrivateMethodInvocationInformation.isOnlyCalledFromConstructor"}
  - {class: org.mutabilitydetector.checkers.settermethod.AssignmentGuardVerifier, method: verify, match: "()", note: "AssignmentGuardVerifier.verify"}
  - {class: org.mutabilitydetector.checkers.CollectionWithMutableElementTypeToFieldChecker, method: visitField, match: "(int access, String name, String desc, String signature, Object value)", note: "CollectionWithMutableElementTypeToFieldChecker.visitField"}
  - {class: org.mutabilitydetector.checkers.info.TypeStructureInformation, method: isTypeAbstract, match: "(Dotted className)", note: "TypeStructureInformation.isTypeAbstract"}
  - {class: org.mutabilitydetector.checkers.settermethod.ControlFlowBlock, method: newInstance, match: "(final SortedSet<Integer> allItems)", note: "ControlFlowBlock.newInstance"}
