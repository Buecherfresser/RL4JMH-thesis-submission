# Curated performance-mutation sites for htmlunit-neko (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants htmlunit-neko --source data/external-src/<checkout> \
#       --sites data/projects/htmlunit-neko/mutation_sites.yaml

package_root: org.htmlunit.cyberneko

sites:
  - {class: org.htmlunit.cyberneko.HTMLNamedEntitiesParser, method: lookup, match: "(final String entityName)", note: "HTMLNamedEntitiesParser.lookup"}
  - {class: org.htmlunit.cyberneko.filters.DefaultFilter, method: setDocumentHandler, match: "(final XMLDocumentHandler handler)", note: "DefaultFilter.setDocumentHandler"}
  - {class: org.htmlunit.cyberneko.html.dom.HTMLDListElementImpl, method: getCompact, match: "()", note: "HTMLDListElementImpl.getCompact"}
  - {class: org.htmlunit.cyberneko.io.PlaybackInputStream, method: detectBomEncoding, match: "(final String[] encodings) throws IOException", note: "PlaybackInputStream.detectBomEncoding"}
  - {class: org.htmlunit.cyberneko.parsers.DOMFragmentParser, method: parse, match: "(final String systemId, final DocumentFragment fragment)", note: "DOMFragmentParser.parse"}
  - {class: org.htmlunit.cyberneko.sax.helpers.NekoParserAdapter, method: getSAXParser, match: "()", note: "NekoParserAdapter.getSAXParser"}
  - {class: org.htmlunit.cyberneko.util.FastHashMap, method: size, match: "()", note: "FastHashMap.size"}
  - {class: org.htmlunit.cyberneko.xerces.dom.AttributeMap, method: setNamedItem, match: "(final Node arg) throws DOMException", note: "AttributeMap.setNamedItem"}
  - {class: org.htmlunit.cyberneko.HTMLNamedEntitiesParser, method: lookup, match: "(final int character, final State state)", note: "HTMLNamedEntitiesParser.lookup"}
  - {class: org.htmlunit.cyberneko.filters.DefaultFilter, method: getDocumentHandler, match: "()", note: "DefaultFilter.getDocumentHandler"}
  - {class: org.htmlunit.cyberneko.html.dom.HTMLDListElementImpl, method: setCompact, match: "(final boolean compact)", note: "HTMLDListElementImpl.setCompact"}
  - {class: org.htmlunit.cyberneko.io.PlaybackInputStream, method: playback, match: "()", note: "PlaybackInputStream.playback"}
  - {class: org.htmlunit.cyberneko.parsers.DOMFragmentParser, method: parse, match: "(final InputSource source, final DocumentFragment fragment)", note: "DOMFragmentParser.parse"}
  - {class: org.htmlunit.cyberneko.sax.helpers.NekoParserAdapter, method: parse, match: "(final InputSource source) throws SAXException, IOException", note: "NekoParserAdapter.parse"}
  - {class: org.htmlunit.cyberneko.util.FastHashMap, method: keys, match: "()", note: "FastHashMap.keys"}
  - {class: org.htmlunit.cyberneko.xerces.dom.AttributeMap, method: setNamedItemNS, match: "(final Node arg) throws DOMException", note: "AttributeMap.setNamedItemNS"}
  - {class: org.htmlunit.cyberneko.HTMLUnicodeEntitiesParser, method: getMatch, match: "()", note: "HTMLUnicodeEntitiesParser.getMatch"}
  - {class: org.htmlunit.cyberneko.filters.HTMLWriterFilter, method: startDocument, match: "(final XMLLocator locator, final String encoding,", note: "HTMLWriterFilter.startDocument"}
  - {class: org.htmlunit.cyberneko.html.dom.HTMLFrameSetElementImpl, method: getCols, match: "()", note: "HTMLFrameSetElementImpl.getCols"}
  - {class: org.htmlunit.cyberneko.sax.helpers.NekoSAXParserAdapter, method: getParser, match: "() throws SAXException", note: "NekoSAXParserAdapter.getParser"}
  - {class: org.htmlunit.cyberneko.util.SimpleArrayList, method: size, match: "()", note: "SimpleArrayList.size"}
  - {class: org.htmlunit.cyberneko.xerces.dom.DeepNodeListImpl, method: item, match: "(final int index)", note: "DeepNodeListImpl.item"}
  - {class: org.htmlunit.cyberneko.HTMLUnicodeEntitiesParser, method: getRewindCount, match: "()", note: "HTMLUnicodeEntitiesParser.getRewindCount"}
  - {class: org.htmlunit.cyberneko.filters.HTMLWriterFilter, method: comment, match: "(final XMLString text, final Augmentations augs)", note: "HTMLWriterFilter.comment"}
  - {class: org.htmlunit.cyberneko.html.dom.HTMLFrameSetElementImpl, method: setCols, match: "(final String cols)", note: "HTMLFrameSetElementImpl.setCols"}
  - {class: org.htmlunit.cyberneko.sax.helpers.NekoSAXParserAdapter, method: getXMLReader, match: "() throws SAXException", note: "NekoSAXParserAdapter.getXMLReader"}
  - {class: org.htmlunit.cyberneko.util.SimpleArrayList, method: toArray, match: "()", note: "SimpleArrayList.toArray"}
  - {class: org.htmlunit.cyberneko.xerces.dom.DeepNodeListImpl, method: nextMatchingElementAfter, match: "(Node current)", note: "DeepNodeListImpl.nextMatchingElementAfter"}
  - {class: org.htmlunit.cyberneko.HTMLConfiguration, method: createDocumentScanner, match: "()", note: "HTMLConfiguration.createDocumentScanner"}
  - {class: org.htmlunit.cyberneko.filters.NamespaceBinder, method: getRecognizedFeatures, match: "()", note: "NamespaceBinder.getRecognizedFeatures"}
  - {class: org.htmlunit.cyberneko.html.dom.HTMLMapElementImpl, method: getAreas, match: "()", note: "HTMLMapElementImpl.getAreas"}
  - {class: org.htmlunit.cyberneko.sax.helpers.NekoSAXParserFactory, method: newSAXParser, match: "() throws ParserConfigurationException, SAXException", note: "NekoSAXParserFactory.newSAXParser"}
  - {class: org.htmlunit.cyberneko.util.StringUtils, method: isEmptyString, match: "(final CharSequence s)", note: "StringUtils.isEmptyString"}
  - {class: org.htmlunit.cyberneko.xerces.dom.NamedNodeMapImpl, method: item, match: "(final int index)", note: "NamedNodeMapImpl.item"}
  - {class: org.htmlunit.cyberneko.HTMLConfiguration, method: pushInputSource, match: "(final XMLInputSource inputSource)", note: "HTMLConfiguration.pushInputSource"}
  - {class: org.htmlunit.cyberneko.filters.NamespaceBinder, method: getFeatureDefault, match: "(final String featureId)", note: "NamespaceBinder.getFeatureDefault"}
  - {class: org.htmlunit.cyberneko.html.dom.HTMLMapElementImpl, method: getName, match: "()", note: "HTMLMapElementImpl.getName"}
  - {class: org.htmlunit.cyberneko.sax.helpers.NekoSAXParserFactory, method: setFeature, match: "(final String name, final boolean value)", note: "NekoSAXParserFactory.setFeature"}
  - {class: org.htmlunit.cyberneko.util.StringUtils, method: equalsChar, match: "(final char expected, final CharSequence s)", note: "StringUtils.equalsChar"}
  - {class: org.htmlunit.cyberneko.xerces.dom.NamedNodeMapImpl, method: getNamedItem, match: "(final String name)", note: "NamedNodeMapImpl.getNamedItem"}
  - {class: org.htmlunit.cyberneko.HTMLElements, method: setElement, match: "(final Element element)", note: "HTMLElements.setElement"}
  - {class: org.htmlunit.cyberneko.html.dom.HTMLOListElementImpl, method: getCompact, match: "()", note: "HTMLOListElementImpl.getCompact"}
  - {class: org.htmlunit.cyberneko.util.MiniStack, method: clear, match: "()", note: "MiniStack.clear"}
  - {class: org.htmlunit.cyberneko.xerces.parsers.AbstractDOMParser, method: setDocumentClass, match: "(final Class<? extends DocumentImpl> documentClass)", note: "AbstractDOMParser.setDocumentClass"}
  - {class: org.htmlunit.cyberneko.HTMLElements, method: getElement, match: "(final String ename)", note: "HTMLElements.getElement"}
  - {class: org.htmlunit.cyberneko.html.dom.HTMLOListElementImpl, method: setCompact, match: "(final boolean compact)", note: "HTMLOListElementImpl.setCompact"}
  - {class: org.htmlunit.cyberneko.util.MiniStack, method: reset, match: "()", note: "MiniStack.reset"}
  - {class: org.htmlunit.cyberneko.xerces.parsers.AbstractDOMParser, method: getDocument, match: "()", note: "AbstractDOMParser.getDocument"}
  - {class: org.htmlunit.cyberneko.HTMLScanner, method: pushInputSource, match: "(final XMLInputSource inputSource)", note: "HTMLScanner.pushInputSource"}
  - {class: org.htmlunit.cyberneko.html.dom.HTMLUListElementImpl, method: getCompact, match: "()", note: "HTMLUListElementImpl.getCompact"}
