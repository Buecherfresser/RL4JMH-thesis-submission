# Curated performance-mutation sites for paguro (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants paguro --source data/external-src/<checkout> \
#       --sites data/projects/paguro/mutation_sites.yaml

package_root: org.organicdesign.fp

sites:
  - {class: org.organicdesign.fp.FunctionUtils, method: stringify, match: "(@Nullable Object o)", note: "FunctionUtils.stringify"}
  - {class: org.organicdesign.fp.collections.PersistentHashMap, method: empty, match: "()", note: "PersistentHashMap.empty"}
  - {class: org.organicdesign.fp.function.LazyRef, method: of, match: "(@NotNull Fn0<T> producer)", note: "LazyRef.of"}
  - {class: org.organicdesign.fp.indent.IndentUtils, method: indentSpace, match: "(int len)", note: "IndentUtils.indentSpace"}
  - {class: org.organicdesign.fp.oneOf.OneOf2, method: ofStr, match: "(String o)", note: "OneOf2.ofStr"}
  - {class: org.organicdesign.fp.tuple.Tuple10, method: _1, match: "()", note: "Tuple10._1"}
  - {class: org.organicdesign.fp.type.RuntimeTypes, method: registerClasses, match: "(@NotNull Class @NotNull ... cs)", note: "RuntimeTypes.registerClasses"}
  - {class: org.organicdesign.fp.FunctionUtils, method: ordinal, match: "(final int origI)", note: "FunctionUtils.ordinal"}
  - {class: org.organicdesign.fp.collections.PersistentHashMap, method: emptyMutable, match: "()", note: "PersistentHashMap.emptyMutable"}
  - {class: org.organicdesign.fp.function.LazyRef, method: applyEx, match: "()", note: "LazyRef.applyEx"}
  - {class: org.organicdesign.fp.indent.IndentUtils, method: arrayString, match: "(T @NotNull [] items)", note: "IndentUtils.arrayString"}
  - {class: org.organicdesign.fp.oneOf.OneOf2, method: ofInt, match: "(Integer o)", note: "OneOf2.ofInt"}
  - {class: org.organicdesign.fp.tuple.Tuple10, method: _2, match: "()", note: "Tuple10._2"}
  - {class: org.organicdesign.fp.type.RuntimeTypes, method: name, match: "(@Nullable Class c)", note: "RuntimeTypes.name"}
  - {class: org.organicdesign.fp.StaticImports, method: map, match: "(@Nullable Map.Entry<K,V> @Nullable ... kvPairs)", note: "StaticImports.map"}
