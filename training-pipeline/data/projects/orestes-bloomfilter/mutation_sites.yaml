  - {class: orestes.bloomfilter.redis.helper.RedisBasePoolBuilder, method: getPoolConfig, match: "(int redisConnections)", note: "RedisBasePoolBuilder.getPoolConfig"}
  - {class: orestes.bloomfilter.cachesketch.ExpiringBloomFilterRedis, method: addToQueue, match: "(T element, long remaining, TimeUnit timeUnit)", note: "ExpiringBloomFilterRedis.addToQueue"}
  - {class: orestes.bloomfilter.memory.CountingBloomFilter64, method: increment, match: "(int index)", note: "CountingBloomFilter64.increment"}
  - {class: orestes.bloomfilter.redis.helper.RedisBasePoolBuilder, method: host, match: "(String host)", note: "RedisBasePoolBuilder.host"}
  - {class: orestes.bloomfilter.cachesketch.ExpiringBloomFilterRedis, method: clear, match: "()", note: "ExpiringBloomFilterRedis.clear"}
  - {class: orestes.bloomfilter.memory.CountingBloomFilter64, method: decrement, match: "(int index)", note: "CountingBloomFilter64.decrement"}
  - {class: orestes.bloomfilter.redis.helper.RedisBasePoolBuilder, method: port, match: "(int port)", note: "RedisBasePoolBuilder.port"}
  - {class: orestes.bloomfilter.cachesketch.ExpiringBloomFilterRedis, method: softClear, match: "()", note: "ExpiringBloomFilterRedis.softClear"}
  - {class: orestes.bloomfilter.memory.CountingBloomFilter64, method: getCountMap, match: "()", note: "CountingBloomFilter64.getCountMap"}
  - {class: orestes.bloomfilter.redis.helper.RedisSentinelPoolBuilder, method: master, match: "(String master)", note: "RedisSentinelPoolBuilder.master"}
