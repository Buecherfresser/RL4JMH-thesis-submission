  - {class: com.amihaiemil.eoyaml.EmptyYamlSequence, method: values, match: "()", note: "EmptyYamlSequence.values"}
  - {class: com.amihaiemil.eoyaml.EmptyYamlSequence, method: comment, match: "()", note: "EmptyYamlSequence.comment"}
