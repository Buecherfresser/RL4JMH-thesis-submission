  - {class: org.msgpack.core.buffer.DirectBufferAccess, method: run, match: "()", note: "DirectBufferAccess.run"}
  - {class: org.msgpack.jackson.dataformat.MessagePackGenerator, method: writeEndArray, match: "()", note: "MessagePackGenerator.writeEndArray"}
  - {class: org.msgpack.value.impl.ImmutableBigIntegerValueImpl, method: getValueType, match: "()", note: "ImmutableBigIntegerValueImpl.getValueType"}
  - {class: org.msgpack.core.buffer.DirectBufferAccess, method: run, match: "()", note: "DirectBufferAccess.run"}
  - {class: org.msgpack.jackson.dataformat.MessagePackKeySerializer, method: serialize, match: "(Object value, JsonGenerator jgen, SerializerProvider provider)", note: "MessagePackKeySerializer.serialize"}
  - {class: org.msgpack.value.impl.ImmutableBinaryValueImpl, method: getValueType, match: "()", note: "ImmutableBinaryValueImpl.getValueType"}
  - {class: org.msgpack.core.buffer.InputStreamBufferInput, method: newBufferInput, match: "(InputStream in)", note: "InputStreamBufferInput.newBufferInput"}
  - {class: org.msgpack.jackson.dataformat.MessagePackReadContext, method: reset, match: "(int type, int expEntryCount)", note: "MessagePackReadContext.reset"}
  - {class: org.msgpack.value.impl.ImmutableBinaryValueImpl, method: immutableValue, match: "()", note: "ImmutableBinaryValueImpl.immutableValue"}
  - {class: org.msgpack.core.buffer.InputStreamBufferInput, method: reset, match: "(InputStream in)", note: "InputStreamBufferInput.reset"}
