# Curated performance-mutation sites for t-digest (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants t-digest --source data/external-src/<checkout> \
#       --sites data/projects/t-digest/mutation_sites.yaml

package_root: com.tdunning.math

sites:
  - {class: com.tdunning.math.stats.ScaleFunction, method: k, match: "(double q, double compression, double n)", note: "ScaleFunction.k"}
  - {class: com.tdunning.math.stats.ScaleFunction, method: k, match: "(double q, double normalizer)", note: "ScaleFunction.k"}
  - {class: com.tdunning.math.stats.ScaleFunction, method: q, match: "(double k, double compression, double n)", note: "ScaleFunction.q"}
  - {class: com.tdunning.math.stats.ScaleFunction, method: q, match: "(double k, double normalizer)", note: "ScaleFunction.q"}
  - {class: com.tdunning.math.stats.ScaleFunction, method: max, match: "(double q, double compression, double n)", note: "ScaleFunction.max"}
  - {class: com.tdunning.math.stats.ScaleFunction, method: max, match: "(double q, double normalizer)", note: "ScaleFunction.max"}
  - {class: com.tdunning.math.stats.AVLGroupTree, method: resize, match: "(int newCapacity)", note: "AVLGroupTree.resize"}
  - {class: com.tdunning.math.stats.AVLGroupTree, method: merge, match: "(int node)", note: "AVLGroupTree.merge"}
  - {class: com.tdunning.math.stats.AVLGroupTree, method: fixAggregates, match: "(int node)", note: "AVLGroupTree.fixAggregates"}
  - {class: com.tdunning.math.stats.AVLGroupTree, method: size, match: "()", note: "AVLGroupTree.size"}
  - {class: com.tdunning.math.stats.AVLGroupTree, method: prev, match: "(int node)", note: "AVLGroupTree.prev"}
  - {class: com.tdunning.math.stats.AVLGroupTree, method: mean, match: "(int node)", note: "AVLGroupTree.mean"}
  - {class: com.tdunning.math.stats.AVLTreeDigest, method: setRandomSeed, match: "(long seed)", note: "AVLTreeDigest.setRandomSeed"}
  - {class: com.tdunning.math.stats.AVLTreeDigest, method: recordAllData, match: "()", note: "AVLTreeDigest.recordAllData"}
  - {class: com.tdunning.math.stats.AVLTreeDigest, method: centroidCount, match: "()", note: "AVLTreeDigest.centroidCount"}
  - {class: com.tdunning.math.stats.AVLTreeDigest, method: compress, match: "()", note: "AVLTreeDigest.compress"}
  - {class: com.tdunning.math.stats.AVLTreeDigest, method: size, match: "()", note: "AVLTreeDigest.size"}
  - {class: com.tdunning.math.stats.AVLTreeDigest, method: cdf, match: "(double x)", note: "AVLTreeDigest.cdf"}
  - {class: com.tdunning.math.stats.Centroid, method: mean, match: "()", note: "Centroid.mean"}
  - {class: com.tdunning.math.stats.Centroid, method: id, match: "()", note: "Centroid.id"}
  - {class: com.tdunning.math.stats.Centroid, method: compareTo, match: "(@SuppressWarnings(\"NullableProblems\") Centroid o)", note: "Centroid.compareTo"}
  - {class: com.tdunning.math.stats.Centroid, method: data, match: "()", note: "Centroid.data"}
  - {class: com.tdunning.math.stats.Centroid, method: insertData, match: "(double x)", note: "Centroid.insertData"}
  - {class: com.tdunning.math.stats.Centroid, method: createWeighted, match: "(double x, int w, Iterable<? extends Double> data)", note: "Centroid.createWeighted"}
  - {class: com.tdunning.math.stats.Comparison, method: compareChi2, match: "(TDigest dist1, TDigest dist2, double[] qCuts)", note: "Comparison.compareChi2"}
  - {class: com.tdunning.math.stats.Comparison, method: compareChi2, match: "(Histogram dist1, Histogram dist2)", note: "Comparison.compareChi2"}
  - {class: com.tdunning.math.stats.Comparison, method: llr, match: "(double[][] count)", note: "Comparison.llr"}
  - {class: com.tdunning.math.stats.Comparison, method: ks, match: "(TDigest d1, TDigest d2)", note: "Comparison.ks"}
  - {class: com.tdunning.math.stats.Dist, method: cdf, match: "(final double x, double[] data)", note: "Dist.cdf"}
  - {class: com.tdunning.math.stats.Dist, method: cdf, match: "(final double x, double[] data, double w)", note: "Dist.cdf"}
  - {class: com.tdunning.math.stats.Dist, method: cdf, match: "(final double x, Collection<Double> data)", note: "Dist.cdf"}
  - {class: com.tdunning.math.stats.Dist, method: cdf, match: "(final double x, Collection<Double> data, double w)", note: "Dist.cdf"}
  - {class: com.tdunning.math.stats.Dist, method: quantile, match: "(final double q, double[] data)", note: "Dist.quantile"}
  - {class: com.tdunning.math.stats.Dist, method: quantile, match: "(final double q, List<Double> data)", note: "Dist.quantile"}
  - {class: com.tdunning.math.stats.FloatHistogram, method: bucketIndex, match: "(double x)", note: "FloatHistogram.bucketIndex"}
