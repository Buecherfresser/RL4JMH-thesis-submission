  - {class: org.ehcache.build.util.PluginUtils, method: registerBucket, match: "(Project project, String kind)", note: "PluginUtils.registerBucket"}
  - {class: org.ehcache.clustered.client.config.builders.ClusteredResourcePoolBuilder, method: clusteredDedicated, match: "(String fromResource, long size, MemoryUnit unit)", note: "ClusteredResourcePoolBuilder.clusteredDedicated"}
  - {class: org.ehcache.config.builders.CacheEventListenerConfigurationBuilder, method: eventOrdering, match: "(EventOrdering eventOrdering)", note: "CacheEventListenerConfigurationBuilder.eventOrdering"}
