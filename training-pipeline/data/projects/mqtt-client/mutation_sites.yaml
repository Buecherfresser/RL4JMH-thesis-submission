  - {class: org.fusesource.mqtt.client.Tracer, method: onSend, match: "(MQTTFrame frame)", note: "Tracer.onSend"}
  - {class: org.fusesource.mqtt.codec.PUBREC, method: messageType, match: "()", note: "PUBREC.messageType"}
