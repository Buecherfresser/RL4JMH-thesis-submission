# Curated performance-mutation sites for chrono-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants chrono-java --source data/external-src/<checkout> \
#       --sites data/projects/chrono-java/mutation_sites.yaml

package_root: com.wanasit.chrono

sites:
  - {class: com.wanasit.chrono.Chrono, method: Parse, match: "(String text)", note: "Chrono.Parse"}
  - {class: com.wanasit.chrono.filter.LowProbabilityFormatFilter, method: isValid, match: "(String text, ChronoOption options, ParsedResult result)", note: "LowProbabilityFormatFilter.isValid"}
  - {class: com.wanasit.chrono.parser.en.ENCasualDateExpressionParser, method: pattern, match: "()", note: "ENCasualDateExpressionParser.pattern"}
