# Curated performance-mutation sites for java-string-similarity (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants java-string-similarity --source data/external-src/<checkout> \
#       --sites data/projects/java-string-similarity/mutation_sites.yaml

package_root: info.debatty.java

sites:
  - {class: info.debatty.java.stringsimilarity.OptimalStringAlignment, method: distance, match: "(final String s1, final String s2)", note: "OptimalStringAlignment.distance"}
  - {class: info.debatty.java.stringsimilarity.Cosine, method: similarity, match: "(final String s1, final String s2)", note: "Cosine.similarity"}
  - {class: info.debatty.java.stringsimilarity.Cosine, method: distance, match: "(final String s1, final String s2)", note: "Cosine.distance"}
  - {class: info.debatty.java.stringsimilarity.Cosine, method: similarity, match: "(", note: "Cosine.similarity"}
  - {class: info.debatty.java.stringsimilarity.Damerau, method: distance, match: "(final String s1, final String s2)", note: "Damerau.distance"}
  - {class: info.debatty.java.stringsimilarity.Jaccard, method: similarity, match: "(final String s1, final String s2)", note: "Jaccard.similarity"}
  - {class: info.debatty.java.stringsimilarity.Jaccard, method: distance, match: "(final String s1, final String s2)", note: "Jaccard.distance"}
  - {class: info.debatty.java.stringsimilarity.JaroWinkler, method: getThreshold, match: "()", note: "JaroWinkler.getThreshold"}
  - {class: info.debatty.java.stringsimilarity.JaroWinkler, method: similarity, match: "(final String s1, final String s2)", note: "JaroWinkler.similarity"}
  - {class: info.debatty.java.stringsimilarity.JaroWinkler, method: distance, match: "(final String s1, final String s2)", note: "JaroWinkler.distance"}
  - {class: info.debatty.java.stringsimilarity.Levenshtein, method: distance, match: "(final String s1, final String s2)", note: "Levenshtein.distance"}
  - {class: info.debatty.java.stringsimilarity.Levenshtein, method: distance, match: "(final String s1, final String s2,", note: "Levenshtein.distance"}
  - {class: info.debatty.java.stringsimilarity.LongestCommonSubsequence, method: distance, match: "(final String s1, final String s2)", note: "LongestCommonSubsequence.distance"}
  - {class: info.debatty.java.stringsimilarity.LongestCommonSubsequence, method: length, match: "(final String s1, final String s2)", note: "LongestCommonSubsequence.length"}
  - {class: info.debatty.java.stringsimilarity.MetricLCS, method: distance, match: "(final String s1, final String s2)", note: "MetricLCS.distance"}
  - {class: info.debatty.java.stringsimilarity.NGram, method: distance, match: "(final String s0, final String s1)", note: "NGram.distance"}
  - {class: info.debatty.java.stringsimilarity.NormalizedLevenshtein, method: distance, match: "(final String s1, final String s2)", note: "NormalizedLevenshtein.distance"}
  - {class: info.debatty.java.stringsimilarity.NormalizedLevenshtein, method: similarity, match: "(final String s1, final String s2)", note: "NormalizedLevenshtein.similarity"}
  - {class: info.debatty.java.stringsimilarity.QGram, method: distance, match: "(final String s1, final String s2)", note: "QGram.distance"}
  - {class: info.debatty.java.stringsimilarity.QGram, method: distance, match: "(", note: "QGram.distance"}
  - {class: info.debatty.java.stringsimilarity.RatcliffObershelp, method: similarity, match: "(final String s1, final String s2)", note: "RatcliffObershelp.similarity"}
  - {class: info.debatty.java.stringsimilarity.RatcliffObershelp, method: distance, match: "(final String s1, final String s2)", note: "RatcliffObershelp.distance"}
  - {class: info.debatty.java.stringsimilarity.SorensenDice, method: similarity, match: "(final String s1, final String s2)", note: "SorensenDice.similarity"}
  - {class: info.debatty.java.stringsimilarity.SorensenDice, method: distance, match: "(final String s1, final String s2)", note: "SorensenDice.distance"}
  - {class: info.debatty.java.stringsimilarity.WeightedLevenshtein, method: distance, match: "(final String s1, final String s2)", note: "WeightedLevenshtein.distance"}
  - {class: info.debatty.java.stringsimilarity.WeightedLevenshtein, method: distance, match: "(final String s1, final String s2,", note: "WeightedLevenshtein.distance"}
  - {class: info.debatty.java.stringsimilarity.examples.Examples, method: main, match: "(String[] args)", note: "Examples.main"}
  - {class: info.debatty.java.stringsimilarity.examples.Examples, method: cost, match: "(char c1, char c2)", note: "Examples.cost"}
  - {class: info.debatty.java.stringsimilarity.examples.MetricLCS, method: main, match: "(String[] args)", note: "MetricLCS.main"}
  - {class: info.debatty.java.stringsimilarity.examples.PrecomputedCosine, method: main, match: "(String[] args)", note: "PrecomputedCosine.main"}
  - {class: info.debatty.java.stringsimilarity.examples.nischay21, method: main, match: "(String[] args)", note: "nischay21.main"}
  - {class: info.debatty.java.stringsimilarity.experimental.Sift4, method: setMaxOffset, match: "(final int max_offset)", note: "Sift4.setMaxOffset"}
  - {class: info.debatty.java.stringsimilarity.experimental.Sift4, method: distance, match: "(final String s1, final String s2)", note: "Sift4.distance"}
