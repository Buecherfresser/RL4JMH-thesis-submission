# Curated performance-mutation sites for commons-net (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants commons-net --source data/external-src/<checkout> \
#       --sites data/projects/commons-net/mutation_sites.yaml

package_root: org.apache.commons

sites:
  - {class: org.apache.commons.net.PrintCommandListener, method: protocolCommandSent, match: "(final ProtocolCommandEvent event)", note: "PrintCommandListener.protocolCommandSent"}
  - {class: org.apache.commons.net.PrintCommandListener, method: protocolReplyReceived, match: "(final ProtocolCommandEvent event)", note: "PrintCommandListener.protocolReplyReceived"}
  - {class: org.apache.commons.net.examples.PrintCommandListeners, method: sysOutPrintCommandListener, match: "()", note: "PrintCommandListeners.sysOutPrintCommandListener"}
  - {class: org.apache.commons.net.examples.cidr.SubnetUtils6Example, method: main, match: "(final String[] args)", note: "SubnetUtils6Example.main"}
