  - {class: dregex.impl.ParsedRegex, method: getLiteral, match: "()", note: "ParsedRegex.getLiteral"}
  - {class: dregex.impl.tree.Wildcard, method: from, match: "()", note: "Wildcard.from"}
  - {class: dregex.impl.ParsedRegex, method: getTree, match: "()", note: "ParsedRegex.getTree"}
  - {class: dregex.impl.tree.Wildcard, method: to, match: "()", note: "Wildcard.to"}
  - {class: dregex.impl.RegexImpl, method: getDfa, match: "()", note: "RegexImpl.getDfa"}
  - {class: dregex.impl.RegexImpl, method: getUniverse, match: "()", note: "RegexImpl.getUniverse"}
