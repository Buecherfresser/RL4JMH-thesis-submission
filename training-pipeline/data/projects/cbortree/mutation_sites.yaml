# Curated performance-mutation sites for cbortree (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants cbortree --source data/external-src/<checkout> \
#       --sites data/projects/cbortree/mutation_sites.yaml

package_root: com.google.iot

sites:
  - {class: com.google.iot.cbor.CborArrayImpl, method: getTag, match: "()", note: "CborArrayImpl.getTag"}
  - {class: com.google.iot.cbor.CborArrayImpl, method: listValue, match: "()", note: "CborArrayImpl.listValue"}
  - {class: com.google.iot.cbor.CborByteStringImpl, method: getTag, match: "()", note: "CborByteStringImpl.getTag"}
  - {class: com.google.iot.cbor.CborByteStringImpl, method: byteArrayValue, match: "()", note: "CborByteStringImpl.byteArrayValue"}
  - {class: com.google.iot.cbor.CborMapImpl, method: getTag, match: "()", note: "CborMapImpl.getTag"}
  - {class: com.google.iot.cbor.CborMapImpl, method: mapValue, match: "()", note: "CborMapImpl.mapValue"}
  - {class: com.google.iot.cbor.CborTextStringImpl, method: getTag, match: "()", note: "CborTextStringImpl.getTag"}
  - {class: com.google.iot.cbor.CborTextStringImpl, method: stringValue, match: "()", note: "CborTextStringImpl.stringValue"}
  - {class: com.google.iot.cbor.CborTextStringImpl, method: byteArrayValue, match: "()", note: "CborTextStringImpl.byteArrayValue"}
  - {class: com.google.iot.cbor.CborFloatImpl, method: getTag, match: "()", note: "CborFloatImpl.getTag"}
  - {class: com.google.iot.cbor.CborFloatImpl, method: createHalf, match: "(float value, int tag)", note: "CborFloatImpl.createHalf"}
  - {class: com.google.iot.cbor.CborFloatImpl, method: getAdditionalInformation, match: "()", note: "CborFloatImpl.getAdditionalInformation"}
  - {class: com.google.iot.cbor.CborFloatImpl, method: floatValue, match: "()", note: "CborFloatImpl.floatValue"}
  - {class: com.google.iot.cbor.CborFloatImpl, method: doubleValue, match: "()", note: "CborFloatImpl.doubleValue"}
  - {class: com.google.iot.cbor.CborIntegerImpl, method: getTag, match: "()", note: "CborIntegerImpl.getTag"}
  - {class: com.google.iot.cbor.CborIntegerImpl, method: longValue, match: "()", note: "CborIntegerImpl.longValue"}
  - {class: com.google.iot.cbor.CborReaderImpl, method: hasRemainingDataItems, match: "()", note: "CborReaderImpl.hasRemainingDataItems"}
  - {class: com.google.iot.cbor.CborReaderImpl, method: bytesParsed, match: "()", note: "CborReaderImpl.bytesParsed"}
  - {class: com.google.iot.cbor.CborReaderImpl, method: readDataItem, match: "() throws CborParseException, IOException", note: "CborReaderImpl.readDataItem"}
  - {class: com.google.iot.cbor.CborSimple, method: create, match: "(int value, int tag)", note: "CborSimple.create"}
  - {class: com.google.iot.cbor.CborSimple, method: create, match: "(int value)", note: "CborSimple.create"}
  - {class: com.google.iot.cbor.CborSimple, method: getMajorType, match: "()", note: "CborSimple.getMajorType"}
  - {class: com.google.iot.cbor.CborSimple, method: getAdditionalInformation, match: "()", note: "CborSimple.getAdditionalInformation"}
  - {class: com.google.iot.cbor.CborSimple, method: getValue, match: "()", note: "CborSimple.getValue"}
  - {class: com.google.iot.cbor.CborSimple, method: getTag, match: "()", note: "CborSimple.getTag"}
  - {class: com.google.iot.cbor.CborSimple, method: isValidJson, match: "()", note: "CborSimple.isValidJson"}
  - {class: com.google.iot.cbor.CborSimple, method: toJsonString, match: "()", note: "CborSimple.toJsonString"}
  - {class: com.google.iot.cbor.CborSimple, method: toJavaObject, match: "()", note: "CborSimple.toJavaObject"}
  - {class: com.google.iot.cbor.CborSimple, method: toJavaObject, match: "(Class<T> clazz) throws CborConversionException", note: "CborSimple.toJavaObject"}
  - {class: com.google.iot.cbor.CborTag, method: isValid, match: "(long tag)", note: "CborTag.isValid"}
  - {class: com.google.iot.cbor.CborWriterImpl, method: writeTag, match: "(int tag) throws IOException", note: "CborWriterImpl.writeTag"}
  - {class: com.google.iot.cbor.CborWriterImpl, method: writeDataItem, match: "(CborObject obj) throws IOException", note: "CborWriterImpl.writeDataItem"}
  - {class: com.google.iot.cbor.Half, method: shortBitsToFloat, match: "(short h)", note: "Half.shortBitsToFloat"}
  - {class: com.google.iot.cbor.Half, method: floatToRawShortBits, match: "(float f)", note: "Half.floatToRawShortBits"}
