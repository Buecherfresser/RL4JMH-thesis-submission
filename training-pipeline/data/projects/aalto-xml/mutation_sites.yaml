# Curated performance-mutation sites for aalto-xml (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants aalto-xml --source data/external-src/<checkout> \
#       --sites data/projects/aalto-xml/mutation_sites.yaml

package_root: com.fasterxml.aalto

sites:
  - {class: com.fasterxml.aalto.UncheckedStreamException, method: createFrom, match: "(XMLStreamException sex)", note: "UncheckedStreamException.createFrom"}
  - {class: com.fasterxml.aalto.async.AsyncByteArrayScanner, method: _currentByte, match: "() throws XMLStreamException", note: "AsyncByteArrayScanner._currentByte"}
  - {class: com.fasterxml.aalto.dom.BijectiveNsMap, method: createEmpty, match: "()", note: "BijectiveNsMap.createEmpty"}
  - {class: com.fasterxml.aalto.evt.EventAllocatorImpl, method: getDefaultInstance, match: "()", note: "EventAllocatorImpl.getDefaultInstance"}
  - {class: com.fasterxml.aalto.impl.StreamExceptionBase, method: getMessage, match: "()", note: "StreamExceptionBase.getMessage"}
  - {class: com.fasterxml.aalto.in.MergedStream, method: close, match: "() throws IOException", note: "MergedStream.close"}
  - {class: com.fasterxml.aalto.io.UTF8Writer, method: append, match: "(char c)", note: "UTF8Writer.append"}
  - {class: com.fasterxml.aalto.out.NonRepairingStreamWriter, method: setDefaultNamespace, match: "(String uri)", note: "NonRepairingStreamWriter.setDefaultNamespace"}
  - {class: com.fasterxml.aalto.sax.SAXParserFactoryImpl, method: newInstance, match: "()", note: "SAXParserFactoryImpl.newInstance"}
  - {class: com.fasterxml.aalto.stax.StreamReaderImpl, method: construct, match: "(InputBootstrapper bs)", note: "StreamReaderImpl.construct"}
  - {class: com.fasterxml.aalto.util.BufferRecycler, method: getSmallCBuffer, match: "(int minSize)", note: "BufferRecycler.getSmallCBuffer"}
  - {class: com.fasterxml.aalto.UncheckedStreamException, method: getStackTrace, match: "()", note: "UncheckedStreamException.getStackTrace"}
  - {class: com.fasterxml.aalto.async.AsyncByteArrayScanner, method: _nextByte, match: "() throws XMLStreamException", note: "AsyncByteArrayScanner._nextByte"}
  - {class: com.fasterxml.aalto.dom.BijectiveNsMap, method: createChild, match: "()", note: "BijectiveNsMap.createChild"}
  - {class: com.fasterxml.aalto.evt.EventAllocatorImpl, method: getFastInstance, match: "()", note: "EventAllocatorImpl.getFastInstance"}
  - {class: com.fasterxml.aalto.impl.StreamExceptionBase, method: getLocationDesc, match: "()", note: "StreamExceptionBase.getLocationDesc"}
  - {class: com.fasterxml.aalto.in.MergedStream, method: mark, match: "(int readlimit)", note: "MergedStream.mark"}
  - {class: com.fasterxml.aalto.io.UTF8Writer, method: close, match: "() throws IOException", note: "UTF8Writer.close"}
  - {class: com.fasterxml.aalto.out.NonRepairingStreamWriter, method: _setPrefix, match: "(String prefix, String uri)", note: "NonRepairingStreamWriter._setPrefix"}
  - {class: com.fasterxml.aalto.sax.SAXParserFactoryImpl, method: getFeature, match: "(String name)", note: "SAXParserFactoryImpl.getFeature"}
  - {class: com.fasterxml.aalto.stax.StreamReaderImpl, method: getScanner, match: "()", note: "StreamReaderImpl.getScanner"}
  - {class: com.fasterxml.aalto.util.BufferRecycler, method: returnSmallCBuffer, match: "(char[] buffer)", note: "BufferRecycler.returnSmallCBuffer"}
  - {class: com.fasterxml.aalto.ValidationException, method: create, match: "(XMLValidationProblem cause)", note: "ValidationException.create"}
  - {class: com.fasterxml.aalto.async.AsyncByteBufferScanner, method: _currentByte, match: "() throws XMLStreamException", note: "AsyncByteBufferScanner._currentByte"}
  - {class: com.fasterxml.aalto.dom.DOMOutputElement, method: createRoot, match: "()", note: "DOMOutputElement.createRoot"}
  - {class: com.fasterxml.aalto.evt.EventReaderImpl, method: getErrorDesc, match: "(int errorType, int currEvent)", note: "EventReaderImpl.getErrorDesc"}
