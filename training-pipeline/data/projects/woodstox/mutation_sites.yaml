# Curated performance-mutation sites for woodstox (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants woodstox --source data/external-src/<checkout> \
#       --sites data/projects/woodstox/mutation_sites.yaml

package_root: com.ctc.wstx

sites:
  - {class: com.ctc.wstx.api.ReaderConfig, method: createJ2MEDefaults, match: "()", note: "ReaderConfig.createJ2MEDefaults"}
  - {class: com.ctc.wstx.cfg.ErrorConsts, method: tokenTypeDesc, match: "(int type)", note: "ErrorConsts.tokenTypeDesc"}
  - {class: com.ctc.wstx.dom.DOMOutputElement, method: createRoot, match: "(Node rootNode)", note: "DOMOutputElement.createRoot"}
  - {class: com.ctc.wstx.dtd.LargePrefixedNameSet, method: hasMultiple, match: "()", note: "LargePrefixedNameSet.hasMultiple"}
  - {class: com.ctc.wstx.ent.IntEntity, method: create, match: "(String id, String repl)", note: "IntEntity.create"}
  - {class: com.ctc.wstx.evt.CompactStartElement, method: getAttributeByName, match: "(QName name)", note: "CompactStartElement.getAttributeByName"}
  - {class: com.ctc.wstx.exc.WstxException, method: getMessage, match: "()", note: "WstxException.getMessage"}
  - {class: com.ctc.wstx.io.BufferRecycler, method: getSmallCBuffer, match: "(int minSize)", note: "BufferRecycler.getSmallCBuffer"}
  - {class: com.ctc.wstx.msv.AttributeProxy, method: getIndex, match: "(String qName)", note: "AttributeProxy.getIndex"}
  - {class: com.ctc.wstx.osgi.InputFactoryProviderImpl, method: createInputFactory, match: "()", note: "InputFactoryProviderImpl.createInputFactory"}
  - {class: com.ctc.wstx.sax.WstxSAXParser, method: getParser, match: "()", note: "WstxSAXParser.getParser"}
  - {class: com.ctc.wstx.sr.TypedStreamReader, method: getElementAsBoolean, match: "() throws XMLStreamException", note: "TypedStreamReader.getElementAsBoolean"}
  - {class: com.ctc.wstx.stax.WstxEventFactory, method: setLocation, match: "(Location location)", note: "WstxEventFactory.setLocation"}
  - {class: com.ctc.wstx.sw.BufferingXmlWriter, method: getOutputPtr, match: "()", note: "BufferingXmlWriter.getOutputPtr"}
  - {class: com.ctc.wstx.util.ArgUtil, method: convertToBoolean, match: "(String prop, Object value)", note: "ArgUtil.convertToBoolean"}
  - {class: com.ctc.wstx.api.ReaderConfig, method: createFullDefaults, match: "()", note: "ReaderConfig.createFullDefaults"}
  - {class: com.ctc.wstx.dom.DOMOutputElement, method: createAndAttachChild, match: "(Element element)", note: "DOMOutputElement.createAndAttachChild"}
  - {class: com.ctc.wstx.dtd.LargePrefixedNameSet, method: appendNames, match: "(StringBuilder sb, String sep)", note: "LargePrefixedNameSet.appendNames"}
  - {class: com.ctc.wstx.ent.IntEntity, method: create, match: "(String id, char[] val)", note: "IntEntity.create"}
  - {class: com.ctc.wstx.evt.CompactStartElement, method: getAttributes, match: "()", note: "CompactStartElement.getAttributes"}
  - {class: com.ctc.wstx.exc.WstxException, method: getLocationDesc, match: "()", note: "WstxException.getLocationDesc"}
  - {class: com.ctc.wstx.io.BufferRecycler, method: returnSmallCBuffer, match: "(char[] buffer)", note: "BufferRecycler.returnSmallCBuffer"}
  - {class: com.ctc.wstx.msv.AttributeProxy, method: getIndex, match: "(String uri, String localName)", note: "AttributeProxy.getIndex"}
  - {class: com.ctc.wstx.osgi.InputFactoryProviderImpl, method: getProperties, match: "()", note: "InputFactoryProviderImpl.getProperties"}
  - {class: com.ctc.wstx.sax.WstxSAXParser, method: getXMLReader, match: "()", note: "WstxSAXParser.getXMLReader"}
  - {class: com.ctc.wstx.sr.TypedStreamReader, method: getElementAsInt, match: "() throws XMLStreamException", note: "TypedStreamReader.getElementAsInt"}
  - {class: com.ctc.wstx.stax.WstxEventFactory, method: createDTD, match: "(String dtd)", note: "WstxEventFactory.createDTD"}
  - {class: com.ctc.wstx.sw.BufferingXmlWriter, method: close, match: "(boolean forceRealClose) throws IOException", note: "BufferingXmlWriter.close"}
  - {class: com.ctc.wstx.util.ArgUtil, method: convertToInt, match: "(String prop, Object value, int minValue)", note: "ArgUtil.convertToInt"}
  - {class: com.ctc.wstx.api.ValidatorConfig, method: createDefaults, match: "()", note: "ValidatorConfig.createDefaults"}
  - {class: com.ctc.wstx.dom.WstxDOMWrappingReader, method: createFrom, match: "(DOMSource src, ReaderConfig cfg)", note: "WstxDOMWrappingReader.createFrom"}
  - {class: com.ctc.wstx.dtd.SmallPrefixedNameSet, method: hasMultiple, match: "()", note: "SmallPrefixedNameSet.hasMultiple"}
  - {class: com.ctc.wstx.ent.ParsedExtEntity, method: getNotationName, match: "()", note: "ParsedExtEntity.getNotationName"}
  - {class: com.ctc.wstx.evt.DefaultEventAllocator, method: getDefaultInstance, match: "()", note: "DefaultEventAllocator.getDefaultInstance"}
  - {class: com.ctc.wstx.exc.WstxLazyException, method: throwLazily, match: "(XMLStreamException ex)", note: "WstxLazyException.throwLazily"}
  - {class: com.ctc.wstx.io.CharArraySource, method: fromInternalEntity, match: "()", note: "CharArraySource.fromInternalEntity"}
  - {class: com.ctc.wstx.msv.GenericMsvValidator, method: getBaseUri, match: "()", note: "GenericMsvValidator.getBaseUri"}
  - {class: com.ctc.wstx.osgi.OutputFactoryProviderImpl, method: createOutputFactory, match: "()", note: "OutputFactoryProviderImpl.createOutputFactory"}
  - {class: com.ctc.wstx.sax.WstxSAXParserFactory, method: getFeature, match: "(String name)", note: "WstxSAXParserFactory.getFeature"}
  - {class: com.ctc.wstx.sr.ValidatingStreamReader, method: getProperty, match: "(String name)", note: "ValidatingStreamReader.getProperty"}
  - {class: com.ctc.wstx.stax.WstxInputFactory, method: addSymbol, match: "(String symbol)", note: "WstxInputFactory.addSymbol"}
  - {class: com.ctc.wstx.sw.NonNsStreamWriter, method: getNamespaceContext, match: "()", note: "NonNsStreamWriter.getNamespaceContext"}
  - {class: com.ctc.wstx.util.BijectiveNsMap, method: createEmpty, match: "()", note: "BijectiveNsMap.createEmpty"}
  - {class: com.ctc.wstx.api.ValidatorConfig, method: findPropertyId, match: "(String propName)", note: "ValidatorConfig.findPropertyId"}
  - {class: com.ctc.wstx.dom.WstxDOMWrappingReader, method: isPropertySupported, match: "(String name)", note: "WstxDOMWrappingReader.isPropertySupported"}
  - {class: com.ctc.wstx.dtd.SmallPrefixedNameSet, method: appendNames, match: "(StringBuilder sb, String sep)", note: "SmallPrefixedNameSet.appendNames"}
  - {class: com.ctc.wstx.ent.ParsedExtEntity, method: writeEnc, match: "(Writer w) throws IOException", note: "ParsedExtEntity.writeEnc"}
  - {class: com.ctc.wstx.evt.DefaultEventAllocator, method: getFastInstance, match: "()", note: "DefaultEventAllocator.getFastInstance"}
  - {class: com.ctc.wstx.exc.WstxLazyException, method: getMessage, match: "()", note: "WstxLazyException.getMessage"}
  - {class: com.ctc.wstx.io.CharArraySource, method: doInitInputLocation, match: "(WstxInputData reader)", note: "CharArraySource.doInitInputLocation"}
