# Curated performance-mutation sites for hppcrt (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants hppcrt --source data/external-src/<checkout> \
#       --sites data/projects/hppcrt/mutation_sites.yaml

package_root: com.carrotsearch.hppcrt

sites:
  - {class: com.carrotsearch.hppcrt.BitUtil, method: pop_array, match: "(final long[] arr, final int wordOffset, final int numWords)", note: "BitUtil.pop_array"}
  - {class: com.carrotsearch.hppcrt.generator.ImportDirective, method: getName, match: "()", note: "ImportDirective.getName"}
  - {class: com.carrotsearch.hppcrt.hash.BitMixer, method: mix, match: "(final byte k)", note: "BitMixer.mix"}
  - {class: com.carrotsearch.hppcrt.implementations.EclipseCollIntIntMap, method: setup, match: "(final int[] keysToInsert, final MapImplementation.HASH_QUALITY hashQ, final int[] keysForContainsQuery, final int[] keysForRemovalQuery)", note: "EclipseCollIntIntMap.setup"}
  - {class: com.carrotsearch.hppcrt.BitUtil, method: pop_intersect, match: "(final long[] arr1, final long[] arr2, final int wordOffset, final int numWords)", note: "BitUtil.pop_intersect"}
  - {class: com.carrotsearch.hppcrt.generator.ImportDirective, method: render, match: "(final InternalContextAdapter context, final Writer writer, final Node node) throws IOException, ResourceNotFoundException, ParseErrorException, MethodInvocationException", note: "ImportDirective.render"}
  - {class: com.carrotsearch.hppcrt.hash.BitMixer, method: mix, match: "(final byte k, final int seed)", note: "BitMixer.mix"}
  - {class: com.carrotsearch.hppcrt.implementations.EclipseCollIntIntMap, method: clear, match: "()", note: "EclipseCollIntIntMap.clear"}
  - {class: com.carrotsearch.hppcrt.BenchmarkSuiteRunner, method: parseCommonArguments, match: "(final String[] originalArgs, final BenchmarkOptions commonOptions) throws BenchmarkOptionException", note: "BenchmarkSuiteRunner.parseCommonArguments"}
  - {class: com.carrotsearch.hppcrt.generator.InlinedMethodDef, method: equalsSpecialization, match: "(final ArrayList<String> other)", note: "InlinedMethodDef.equalsSpecialization"}
  - {class: com.carrotsearch.hppcrt.hash.MurmurHash3, method: mix32, match: "(int k)", note: "MurmurHash3.mix32"}
  - {class: com.carrotsearch.hppcrt.implementations.EclipseCollObjectIntMap, method: setup, match: "(final int[] keysToInsert, final MapImplementation.HASH_QUALITY hashQ, final int[] keysForContainsQuery, final int[] keysForRemovalQuery)", note: "EclipseCollObjectIntMap.setup"}
  - {class: com.carrotsearch.hppcrt.BroadWord, method: rank9, match: "(long x)", note: "BroadWord.rank9"}
  - {class: com.carrotsearch.hppcrt.generator.InlinedMethodDef, method: addSpecialization, match: "(final String specializationString)", note: "InlinedMethodDef.addSpecialization"}
  - {class: com.carrotsearch.hppcrt.hash.MurmurHash3, method: mix64, match: "(long z)", note: "MurmurHash3.mix64"}
  - {class: com.carrotsearch.hppcrt.implementations.EclipseCollObjectIntMap, method: clear, match: "()", note: "EclipseCollObjectIntMap.clear"}
  - {class: com.carrotsearch.hppcrt.BroadWord, method: select9, match: "(long x, int r)", note: "BroadWord.select9"}
  - {class: com.carrotsearch.hppcrt.generator.TemplateFile, method: getFileName, match: "()", note: "TemplateFile.getFileName"}
  - {class: com.carrotsearch.hppcrt.hash.PhiMix, method: mix32, match: "(final int x)", note: "PhiMix.mix32"}
  - {class: com.carrotsearch.hppcrt.implementations.FastUtilIdentityIntMap, method: setup, match: "(final int[] keysToInsert, final MapImplementation.HASH_QUALITY hashQ, final int[] keysForContainsQuery, final int[] keysForRemovalQuery)", note: "FastUtilIdentityIntMap.setup"}
  - {class: com.carrotsearch.hppcrt.Containers, method: randomSeed64, match: "()", note: "Containers.randomSeed64"}
  - {class: com.carrotsearch.hppcrt.generator.TemplateNullWriter, method: close, match: "() throws IOException", note: "TemplateNullWriter.close"}
  - {class: com.carrotsearch.hppcrt.hash.PhiMix, method: invMix32, match: "(final int x)", note: "PhiMix.invMix32"}
  - {class: com.carrotsearch.hppcrt.implementations.FastUtilIdentityIntMap, method: clear, match: "()", note: "FastUtilIdentityIntMap.clear"}
  - {class: com.carrotsearch.hppcrt.Containers, method: run, match: "()", note: "Containers.run"}
  - {class: com.carrotsearch.hppcrt.generator.TemplateNullWriter, method: append, match: "(final CharSequence csq) throws IOException", note: "TemplateNullWriter.append"}
  - {class: com.carrotsearch.hppcrt.implementations.FastUtilIntIntMap, method: setup, match: "(final int[] keysToInsert, final MapImplementation.HASH_QUALITY hashQ, final int[] keysForContainsQuery, final int[] keysForRemovalQuery)", note: "FastUtilIntIntMap.setup"}
  - {class: com.carrotsearch.hppcrt.DistributionGenerator, method: main, match: "(final String[] args)", note: "DistributionGenerator.main"}
  - {class: com.carrotsearch.hppcrt.generator.TemplateOptions, method: declareInline, match: "(final String callName, final String... specializations)", note: "TemplateOptions.declareInline"}
  - {class: com.carrotsearch.hppcrt.implementations.FastUtilIntIntMap, method: clear, match: "()", note: "FastUtilIntIntMap.clear"}
  - {class: com.carrotsearch.hppcrt.HashContainers, method: maxElements, match: "(final double loadFactor)", note: "HashContainers.maxElements"}
  - {class: com.carrotsearch.hppcrt.generator.TemplateOptions, method: getGeneratedAnnotation, match: "()", note: "TemplateOptions.getGeneratedAnnotation"}
  - {class: com.carrotsearch.hppcrt.implementations.FastUtilObjectIntMap, method: setup, match: "(final int[] keysToInsert, final MapImplementation.HASH_QUALITY hashQ, final int[] keysForContainsQuery, final int[] keysForRemovalQuery)", note: "FastUtilObjectIntMap.setup"}
  - {class: com.carrotsearch.hppcrt.HashContainers, method: minBufferSize, match: "(final int elements, final double loadFactor)", note: "HashContainers.minBufferSize"}
  - {class: com.carrotsearch.hppcrt.generator.TemplateProcessor, method: format, match: "(final LogRecord record)", note: "TemplateProcessor.format"}
  - {class: com.carrotsearch.hppcrt.implementations.FastUtilObjectIntMap, method: clear, match: "()", note: "FastUtilObjectIntMap.clear"}
  - {class: com.carrotsearch.hppcrt.IteratorPool, method: grow, match: "(final int currentBufferLength, final int elementsCount, final int expectedAdditions)", note: "IteratorPool.grow"}
  - {class: com.carrotsearch.hppcrt.generator.TemplateProcessor, method: setOutputStream, match: "(final OutputStream out) throws SecurityException", note: "TemplateProcessor.setOutputStream"}
  - {class: com.carrotsearch.hppcrt.implementations.HashMapImplementations, method: getInstance, match: "(final int size, final float loadFactor)", note: "HashMapImplementations.getInstance"}
  - {class: com.carrotsearch.hppcrt.IteratorPool, method: borrow, match: "()", note: "IteratorPool.borrow"}
  - {class: com.carrotsearch.hppcrt.generator.Type, method: valueOfOrNull, match: "(final String representation)", note: "Type.valueOfOrNull"}
  - {class: com.carrotsearch.hppcrt.implementations.HashMapImplementations, method: getInstance, match: "(final int size, final float loadFactor)", note: "HashMapImplementations.getInstance"}
  - {class: com.carrotsearch.hppcrt.ObjectPool, method: borrow, match: "()", note: "ObjectPool.borrow"}
  - {class: com.carrotsearch.hppcrt.generator.Type, method: fromString, match: "(final String representation)", note: "Type.fromString"}
  - {class: com.carrotsearch.hppcrt.implementations.HppcIdentityIntMap, method: setup, match: "(final int[] keysToInsert, final MapImplementation.HASH_QUALITY hashQ, final int[] keysForContainsQuery, final int[] keysForRemovalQuery)", note: "HppcIdentityIntMap.setup"}
  - {class: com.carrotsearch.hppcrt.ObjectPool, method: release, match: "(final E releasedObject)", note: "ObjectPool.release"}
  - {class: com.carrotsearch.hppcrt.generator.parser.Replacement, method: sortList, match: "(final Collection<Replacement> replacements)", note: "Replacement.sortList"}
  - {class: com.carrotsearch.hppcrt.implementations.HppcIdentityIntMap, method: clear, match: "()", note: "HppcIdentityIntMap.clear"}
  - {class: com.carrotsearch.hppcrt.XorShift128P, method: nextLong, match: "()", note: "XorShift128P.nextLong"}
  - {class: com.carrotsearch.hppcrt.generator.parser.ReplacementVisitorBase, method: typeBoundOf, match: "(final TypeParameterContext c)", note: "ReplacementVisitorBase.typeBoundOf"}
