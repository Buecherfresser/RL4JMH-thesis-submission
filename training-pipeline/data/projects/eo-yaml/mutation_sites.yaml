# Curated performance-mutation sites for eo-yaml (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants eo-yaml --source data/external-src/<checkout> \
#       --sites data/projects/eo-yaml/mutation_sites.yaml

package_root: com.amihaiemil.eoyaml

sites:
  - {class: com.amihaiemil.eoyaml.EmptyYamlMapping, method: keys, match: "()", note: "EmptyYamlMapping.keys"}
  - {class: com.amihaiemil.eoyaml.extensions.MergedYamlMapping, method: keys, match: "()", note: "MergedYamlMapping.keys"}
  - {class: com.amihaiemil.eoyaml.EmptyYamlMapping, method: value, match: "(final YamlNode key)", note: "EmptyYamlMapping.value"}
  - {class: com.amihaiemil.eoyaml.extensions.MergedYamlMapping, method: value, match: "(final YamlNode key)", note: "MergedYamlMapping.value"}
  - {class: com.amihaiemil.eoyaml.JsonYamlMapping, method: keys, match: "()", note: "JsonYamlMapping.keys"}
  - {class: com.amihaiemil.eoyaml.extensions.MergedYamlSequence, method: values, match: "()", note: "MergedYamlSequence.values"}
  - {class: com.amihaiemil.eoyaml.JsonYamlMapping, method: value, match: "(final YamlNode key)", note: "JsonYamlMapping.value"}
  - {class: com.amihaiemil.eoyaml.extensions.MergedYamlSequence, method: comment, match: "()", note: "MergedYamlSequence.comment"}
  - {class: com.amihaiemil.eoyaml.MutableYamlMappingBuilder, method: build, match: "(final String comment)", note: "MutableYamlMappingBuilder.build"}
  - {class: com.amihaiemil.eoyaml.MutableYamlSequenceBuilder, method: build, match: "(final String comment)", note: "MutableYamlSequenceBuilder.build"}
  - {class: com.amihaiemil.eoyaml.PlainStringScalar, method: value, match: "()", note: "PlainStringScalar.value"}
  - {class: com.amihaiemil.eoyaml.PlainStringScalar, method: comment, match: "()", note: "PlainStringScalar.comment"}
  - {class: com.amihaiemil.eoyaml.ReadFlowMapping, method: keys, match: "()", note: "ReadFlowMapping.keys"}
  - {class: com.amihaiemil.eoyaml.ReadFlowMapping, method: value, match: "(final YamlNode key)", note: "ReadFlowMapping.value"}
  - {class: com.amihaiemil.eoyaml.ReadYamlMapping, method: keys, match: "()", note: "ReadYamlMapping.keys"}
  - {class: com.amihaiemil.eoyaml.ReadYamlMapping, method: value, match: "(final YamlNode key)", note: "ReadYamlMapping.value"}
  - {class: com.amihaiemil.eoyaml.ReadYamlStream, method: values, match: "()", note: "ReadYamlStream.values"}
