# Curated performance-mutation sites for fastjson (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants fastjson --source data/external-src/<checkout> \
#       --sites data/projects/fastjson/mutation_sites.yaml

package_root: com.alibaba.fastjson

sites:
  - {class: com.alibaba.fastjson.JSONArray, method: getRelatedArray, match: "()", note: "JSONArray.getRelatedArray"}
  - {class: com.alibaba.fastjson.asm.ByteVector, method: putByte, match: "(final int b)", note: "ByteVector.putByte"}
  - {class: com.alibaba.fastjson.parser.DefaultJSONParser, method: getDateFomartPattern, match: "()", note: "DefaultJSONParser.getDateFomartPattern"}
  - {class: com.alibaba.fastjson.serializer.ByteBufferCodec, method: deserialze, match: "(DefaultJSONParser parser, Type type, Object fieldName)", note: "ByteBufferCodec.deserialze"}
  - {class: com.alibaba.fastjson.support.geo.LineString, method: getCoordinates, match: "()", note: "LineString.getCoordinates"}
  - {class: com.alibaba.fastjson.util.ASMUtils, method: isAndroid, match: "(String vmName)", note: "ASMUtils.isAndroid"}
  - {class: com.alibaba.fastjson.JSONArray, method: setRelatedArray, match: "(Object relatedArray)", note: "JSONArray.setRelatedArray"}
  - {class: com.alibaba.fastjson.asm.ByteVector, method: putShort, match: "(final int s)", note: "ByteVector.putShort"}
  - {class: com.alibaba.fastjson.parser.DefaultJSONParser, method: getDateFormat, match: "()", note: "DefaultJSONParser.getDateFormat"}
  - {class: com.alibaba.fastjson.serializer.ByteBufferCodec, method: getFastMatchToken, match: "()", note: "ByteBufferCodec.getFastMatchToken"}
  - {class: com.alibaba.fastjson.support.geo.LineString, method: setCoordinates, match: "(double[][] coordinates)", note: "LineString.setCoordinates"}
  - {class: com.alibaba.fastjson.util.ASMUtils, method: desc, match: "(Method method)", note: "ASMUtils.desc"}
  - {class: com.alibaba.fastjson.JSONObject, method: size, match: "()", note: "JSONObject.size"}
  - {class: com.alibaba.fastjson.asm.ClassReader, method: accept, match: "(final TypeCollector classVisitor)", note: "ClassReader.accept"}
  - {class: com.alibaba.fastjson.parser.ParserConfig, method: getGlobalInstance, match: "()", note: "ParserConfig.getGlobalInstance"}
  - {class: com.alibaba.fastjson.serializer.CharArrayCodec, method: deserialze, match: "(DefaultJSONParser parser, Type clazz, Object fieldName)", note: "CharArrayCodec.deserialze"}
  - {class: com.alibaba.fastjson.support.geo.MultiLineString, method: getCoordinates, match: "()", note: "MultiLineString.getCoordinates"}
  - {class: com.alibaba.fastjson.util.AntiCollisionHashMap, method: size, match: "()", note: "AntiCollisionHashMap.size"}
  - {class: com.alibaba.fastjson.JSONObject, method: isEmpty, match: "()", note: "JSONObject.isEmpty"}
  - {class: com.alibaba.fastjson.asm.ClassWriter, method: visit, match: "(final int version, final int access, final String name, final String superName, final String[] interfaces)", note: "ClassWriter.visit"}
  - {class: com.alibaba.fastjson.parser.ParserConfig, method: call, match: "()", note: "ParserConfig.call"}
  - {class: com.alibaba.fastjson.serializer.CharArrayCodec, method: deserialze, match: "(DefaultJSONParser parser)", note: "CharArrayCodec.deserialze"}
  - {class: com.alibaba.fastjson.support.geo.MultiLineString, method: setCoordinates, match: "(double[][][] coordinates)", note: "MultiLineString.setCoordinates"}
  - {class: com.alibaba.fastjson.util.AntiCollisionHashMap, method: isEmpty, match: "()", note: "AntiCollisionHashMap.isEmpty"}
  - {class: com.alibaba.fastjson.JSONPObject, method: getFunction, match: "()", note: "JSONPObject.getFunction"}
  - {class: com.alibaba.fastjson.asm.ClassWriter, method: toByteArray, match: "()", note: "ClassWriter.toByteArray"}
  - {class: com.alibaba.fastjson.parser.deserializer.ArrayListTypeFieldDeserializer, method: getFastMatchToken, match: "()", note: "ArrayListTypeFieldDeserializer.getFastMatchToken"}
  - {class: com.alibaba.fastjson.serializer.ObjectArrayCodec, method: deserialze, match: "(DefaultJSONParser parser, Type type, Object fieldName)", note: "ObjectArrayCodec.deserialze"}
  - {class: com.alibaba.fastjson.support.hsf.HSFJSONUtils, method: parseInvocationArguments, match: "(String json, MethodLocator methodLocator)", note: "HSFJSONUtils.parseInvocationArguments"}
  - {class: com.alibaba.fastjson.util.GenericArrayTypeImpl, method: getGenericComponentType, match: "()", note: "GenericArrayTypeImpl.getGenericComponentType"}
  - {class: com.alibaba.fastjson.JSONPObject, method: setFunction, match: "(String function)", note: "JSONPObject.setFunction"}
  - {class: com.alibaba.fastjson.asm.FieldWriter, method: visitEnd, match: "()", note: "FieldWriter.visitEnd"}
  - {class: com.alibaba.fastjson.parser.deserializer.ArrayListTypeFieldDeserializer, method: parseField, match: "(DefaultJSONParser parser, Object object, Type objectType, Map<String, Object> fieldValues)", note: "ArrayListTypeFieldDeserializer.parseField"}
  - {class: com.alibaba.fastjson.serializer.ObjectArrayCodec, method: getFastMatchToken, match: "()", note: "ObjectArrayCodec.getFastMatchToken"}
  - {class: com.alibaba.fastjson.support.spring.MappingFastJsonValue, method: setValue, match: "(Object value)", note: "MappingFastJsonValue.setValue"}
  - {class: com.alibaba.fastjson.util.IOUtils, method: getStringProperty, match: "(String name)", note: "IOUtils.getStringProperty"}
  - {class: com.alibaba.fastjson.JSONPatch, method: apply, match: "(String original, String patch)", note: "JSONPatch.apply"}
  - {class: com.alibaba.fastjson.asm.MethodCollector, method: visitLocalVariable, match: "(String name, int index)", note: "MethodCollector.visitLocalVariable"}
  - {class: com.alibaba.fastjson.parser.deserializer.MapDeserializer, method: deserialze, match: "(DefaultJSONParser parser, Type type, Object fieldName, String format, int features)", note: "MapDeserializer.deserialze"}
  - {class: com.alibaba.fastjson.serializer.StringCodec, method: deserialze, match: "(DefaultJSONParser parser, Type clazz, Object fieldName)", note: "StringCodec.deserialze"}
  - {class: com.alibaba.fastjson.support.spring.MappingFastJsonValue, method: getValue, match: "()", note: "MappingFastJsonValue.getValue"}
  - {class: com.alibaba.fastjson.util.IOUtils, method: loadPropertiesFromFile, match: "()", note: "IOUtils.loadPropertiesFromFile"}
  - {class: com.alibaba.fastjson.JSONPatch, method: apply, match: "(Object object, String patch)", note: "JSONPatch.apply"}
  - {class: com.alibaba.fastjson.asm.MethodCollector, method: getResult, match: "()", note: "MethodCollector.getResult"}
  - {class: com.alibaba.fastjson.parser.deserializer.MapDeserializer, method: deserialze, match: "(DefaultJSONParser parser, Type type, Object fieldName, Map map)", note: "MapDeserializer.deserialze"}
  - {class: com.alibaba.fastjson.serializer.StringCodec, method: deserialze, match: "(DefaultJSONParser parser)", note: "StringCodec.deserialze"}
  - {class: com.alibaba.fastjson.support.spring.messaging.MappingFastJsonMessageConverter, method: getFastJsonConfig, match: "()", note: "MappingFastJsonMessageConverter.getFastJsonConfig"}
  - {class: com.alibaba.fastjson.util.IdentityHashMap, method: findClass, match: "(String keyString)", note: "IdentityHashMap.findClass"}
  - {class: com.alibaba.fastjson.JSONPath, method: init, match: "()", note: "JSONPath.init"}
  - {class: com.alibaba.fastjson.asm.MethodWriter, method: visitInsn, match: "(final int opcode)", note: "MethodWriter.visitInsn"}
