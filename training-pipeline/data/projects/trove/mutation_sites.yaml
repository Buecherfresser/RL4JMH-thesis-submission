# Curated performance-mutation sites for trove (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants trove --source data/external-src/<checkout> \
#       --sites data/projects/trove/mutation_sites.yaml

package_root: gnu.trove

sites:
  - {class: gnu.trove.Version, method: main, match: "(String[] args)", note: "Version.main"}
  - {class: gnu.trove.impl.HashFunctions, method: hash, match: "(double value)", note: "HashFunctions.hash"}
  - {class: gnu.trove.iterator.hash.TObjectHashIterator, method: objectAtIndex, match: "( int index )", note: "TObjectHashIterator.objectAtIndex"}
  - {class: gnu.trove.list.linked.TLinkedList, method: listIterator, match: "( int index )", note: "TLinkedList.listIterator"}
  - {class: gnu.trove.map.hash.TCustomHashMap, method: setUp, match: "( int initialCapacity )", note: "TCustomHashMap.setUp"}
  - {class: gnu.trove.procedure.array.ToObjectArrayProceedure, method: execute, match: "( T value )", note: "ToObjectArrayProceedure.execute"}
  - {class: gnu.trove.set.hash.TCustomHashSet, method: getHashCode, match: "()", note: "TCustomHashSet.getHashCode"}
  - {class: gnu.trove.strategy.IdentityHashingStrategy, method: computeHashCode, match: "( K object )", note: "IdentityHashingStrategy.computeHashCode"}
  - {class: gnu.trove.Version, method: getVersion, match: "()", note: "Version.getVersion"}
  - {class: gnu.trove.impl.HashFunctions, method: hash, match: "(float value)", note: "HashFunctions.hash"}
  - {class: gnu.trove.list.linked.TLinkedList, method: size, match: "()", note: "TLinkedList.size"}
  - {class: gnu.trove.map.hash.TCustomHashMap, method: putIfAbsent, match: "( K key, V value )", note: "TCustomHashMap.putIfAbsent"}
  - {class: gnu.trove.set.hash.TCustomHashSet, method: execute, match: "( E key )", note: "TCustomHashSet.execute"}
  - {class: gnu.trove.impl.HashFunctions, method: hash, match: "(int value)", note: "HashFunctions.hash"}
  - {class: gnu.trove.list.linked.TLinkedList, method: addFirst, match: "( T linkable )", note: "TLinkedList.addFirst"}
  - {class: gnu.trove.map.hash.TCustomHashMap, method: execute, match: "( K key, V value )", note: "TCustomHashMap.execute"}
  - {class: gnu.trove.set.hash.TCustomHashSet, method: rehash, match: "( int newCapacity )", note: "TCustomHashSet.rehash"}
  - {class: gnu.trove.impl.HashFunctions, method: hash, match: "(long value)", note: "HashFunctions.hash"}
  - {class: gnu.trove.list.linked.TLinkedList, method: addLast, match: "( T linkable )", note: "TLinkedList.addLast"}
  - {class: gnu.trove.map.hash.TCustomHashMap, method: getHashCode, match: "()", note: "TCustomHashMap.getHashCode"}
  - {class: gnu.trove.set.hash.TCustomHashSet, method: toArray, match: "()", note: "TCustomHashSet.toArray"}
  - {class: gnu.trove.impl.PrimeFinder, method: nextPrime, match: "(int desiredCapacity)", note: "PrimeFinder.nextPrime"}
  - {class: gnu.trove.map.hash.THashMap, method: setUp, match: "(int initialCapacity)", note: "THashMap.setUp"}
  - {class: gnu.trove.set.hash.THashSet, method: getHashCode, match: "()", note: "THashSet.getHashCode"}
  - {class: gnu.trove.impl.hash.TCustomObjectHash, method: hash, match: "( Object obj )", note: "TCustomObjectHash.hash"}
  - {class: gnu.trove.map.hash.THashMap, method: putIfAbsent, match: "(K key, V value)", note: "THashMap.putIfAbsent"}
  - {class: gnu.trove.set.hash.THashSet, method: execute, match: "(E key)", note: "THashSet.execute"}
  - {class: gnu.trove.impl.hash.TCustomObjectHash, method: writeExternal, match: "( ObjectOutput out ) throws IOException", note: "TCustomObjectHash.writeExternal"}
  - {class: gnu.trove.map.hash.THashMap, method: execute, match: "(K key, V value)", note: "THashMap.execute"}
  - {class: gnu.trove.set.hash.THashSet, method: rehash, match: "(int newCapacity)", note: "THashSet.rehash"}
  - {class: gnu.trove.impl.hash.THash, method: isEmpty, match: "()", note: "THash.isEmpty"}
  - {class: gnu.trove.map.hash.THashMap, method: getHashCode, match: "()", note: "THashMap.getHashCode"}
  - {class: gnu.trove.set.hash.THashSet, method: toArray, match: "()", note: "THashSet.toArray"}
  - {class: gnu.trove.impl.hash.THash, method: size, match: "()", note: "THash.size"}
  - {class: gnu.trove.set.hash.TLinkedHashSet, method: setUp, match: "(int initialCapacity)", note: "TLinkedHashSet.setUp"}
  - {class: gnu.trove.impl.hash.THash, method: ensureCapacity, match: "( int desiredCapacity )", note: "THash.ensureCapacity"}
  - {class: gnu.trove.set.hash.TLinkedHashSet, method: ensureCapacity, match: "(int capacity)", note: "TLinkedHashSet.ensureCapacity"}
  - {class: gnu.trove.impl.hash.THash, method: compact, match: "()", note: "THash.compact"}
  - {class: gnu.trove.set.hash.TLinkedHashSet, method: clear, match: "()", note: "TLinkedHashSet.clear"}
  - {class: gnu.trove.impl.hash.TObjectHash, method: capacity, match: "()", note: "TObjectHash.capacity"}
  - {class: gnu.trove.set.hash.TLinkedHashSet, method: removeAt, match: "(int index)", note: "TLinkedHashSet.removeAt"}
  - {class: gnu.trove.impl.hash.TObjectHash, method: removeAt, match: "(int index)", note: "TObjectHash.removeAt"}
  - {class: gnu.trove.impl.hash.TObjectHash, method: setUp, match: "(int initialCapacity)", note: "TObjectHash.setUp"}
  - {class: gnu.trove.impl.hash.TObjectHash, method: forEach, match: "(TObjectProcedure<? super T> procedure)", note: "TObjectHash.forEach"}
  - {class: gnu.trove.impl.hash.TPrimitiveHash, method: capacity, match: "()", note: "TPrimitiveHash.capacity"}
  - {class: gnu.trove.impl.hash.TPrimitiveHash, method: removeAt, match: "( int index )", note: "TPrimitiveHash.removeAt"}
  - {class: gnu.trove.impl.hash.TPrimitiveHash, method: setUp, match: "( int initialCapacity )", note: "TPrimitiveHash.setUp"}
  - {class: gnu.trove.impl.hash.TPrimitiveOffheapHash, method: capacity, match: "()", note: "TPrimitiveOffheapHash.capacity"}
  - {class: gnu.trove.impl.hash.TPrimitiveOffheapHash, method: removeAt, match: "( int index )", note: "TPrimitiveOffheapHash.removeAt"}
  - {class: gnu.trove.impl.hash.TPrimitiveOffheapHash, method: setUp, match: "( int initialCapacity )", note: "TPrimitiveOffheapHash.setUp"}
