# Curated performance-mutation sites for akhq (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants akhq --source data/external-src/<checkout> \
#       --sites data/projects/akhq/mutation_sites.yaml

package_root: org.akhq.models

sites:
