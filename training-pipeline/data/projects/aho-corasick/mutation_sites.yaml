# Curated performance-mutation sites for aho-corasick (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants aho-corasick --source data/external-src/<checkout> \
#       --sites data/projects/aho-corasick/mutation_sites.yaml

package_root: org.ahocorasick.trie

sites:
  - {class: org.ahocorasick.trie.DefaultToken, method: isMatch, match: "()", note: "DefaultToken.isMatch"}
  - {class: org.ahocorasick.trie.handler.DefaultEmitHandler, method: emit, match: "(final Emit emit)", note: "DefaultEmitHandler.emit"}
  - {class: org.ahocorasick.trie.DefaultToken, method: getEmit, match: "()", note: "DefaultToken.getEmit"}
  - {class: org.ahocorasick.trie.handler.DefaultEmitHandler, method: getEmits, match: "()", note: "DefaultEmitHandler.getEmits"}
  - {class: org.ahocorasick.trie.Emit, method: getKeyword, match: "()", note: "Emit.getKeyword"}
  - {class: org.ahocorasick.trie.handler.DefaultPayloadEmitHandler, method: emit, match: "(final PayloadEmit<T> emit)", note: "DefaultPayloadEmitHandler.emit"}
  - {class: org.ahocorasick.trie.FragmentToken, method: isMatch, match: "()", note: "FragmentToken.isMatch"}
  - {class: org.ahocorasick.trie.handler.DefaultPayloadEmitHandler, method: getEmits, match: "()", note: "DefaultPayloadEmitHandler.getEmits"}
  - {class: org.ahocorasick.trie.FragmentToken, method: getEmit, match: "()", note: "FragmentToken.getEmit"}
  - {class: org.ahocorasick.trie.handler.PayloadEmitDelegateHandler, method: emit, match: "(PayloadEmit<String> emit)", note: "PayloadEmitDelegateHandler.emit"}
  - {class: org.ahocorasick.trie.MatchToken, method: isMatch, match: "()", note: "MatchToken.isMatch"}
  - {class: org.ahocorasick.trie.handler.StatefulPayloadEmitDelegateHandler, method: emit, match: "(PayloadEmit<String> emit)", note: "StatefulPayloadEmitDelegateHandler.emit"}
  - {class: org.ahocorasick.trie.MatchToken, method: getEmit, match: "()", note: "MatchToken.getEmit"}
  - {class: org.ahocorasick.trie.handler.StatefulPayloadEmitDelegateHandler, method: getEmits, match: "()", note: "StatefulPayloadEmitDelegateHandler.getEmits"}
  - {class: org.ahocorasick.trie.Payload, method: getKeyword, match: "()", note: "Payload.getKeyword"}
  - {class: org.ahocorasick.trie.Payload, method: compareTo, match: "(Payload<T> other)", note: "Payload.compareTo"}
  - {class: org.ahocorasick.trie.PayloadEmit, method: getKeyword, match: "()", note: "PayloadEmit.getKeyword"}
  - {class: org.ahocorasick.trie.PayloadEmit, method: getPayload, match: "()", note: "PayloadEmit.getPayload"}
  - {class: org.ahocorasick.trie.PayloadFragmentToken, method: isMatch, match: "()", note: "PayloadFragmentToken.isMatch"}
  - {class: org.ahocorasick.trie.PayloadFragmentToken, method: getEmit, match: "()", note: "PayloadFragmentToken.getEmit"}
  - {class: org.ahocorasick.trie.PayloadMatchToken, method: isMatch, match: "()", note: "PayloadMatchToken.isMatch"}
  - {class: org.ahocorasick.trie.PayloadMatchToken, method: getEmit, match: "()", note: "PayloadMatchToken.getEmit"}
  - {class: org.ahocorasick.trie.PayloadState, method: nextState, match: "(final Character character)", note: "PayloadState.nextState"}
  - {class: org.ahocorasick.trie.PayloadState, method: nextStateIgnoreRootState, match: "(Character character)", note: "PayloadState.nextStateIgnoreRootState"}
  - {class: org.ahocorasick.trie.PayloadState, method: addState, match: "(Character character)", note: "PayloadState.addState"}
