  - {class: neureka.backend.main.implementations.ParsedCLImplementation, method: getKernelFor, match: "( ExecutionCall<OpenCLDevice> call )", note: "ParsedCLImplementation.getKernelFor"}
  - {class: neureka.backend.main.operations.indexer.Summation, method: execute, match: "( final Function caller, final ExecutionCall<?> call )", note: "Summation.execute"}
  - {class: neureka.backend.main.implementations.ParsedCLImplementation, method: getKernelCode, match: "()", note: "ParsedCLImplementation.getKernelCode"}
  - {class: neureka.backend.main.operations.indexer.Summation, method: calculate, match: "( double[] inputs, int j, int d, Function[] src )", note: "Summation.calculate"}
