# Curated performance-mutation sites for protostuff (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants protostuff --source data/external-src/<checkout> \
#       --sites data/projects/protostuff/mutation_sites.yaml

package_root: io.protostuff

sites:
  - {class: io.protostuff.ByteArrayInput, method: reset, match: "(int offset, int len)", note: "ByteArrayInput.reset"}
  - {class: io.protostuff.compiler.CompilerUtil, method: newWriter, match: "(ProtoModule module, String packageName, String fileName)", note: "CompilerUtil.newWriter"}
  - {class: io.protostuff.mojo.IncludeProjectDependenciesComponentConfigurator, method: configureComponent, match: "(Object component, PlexusConfiguration configuration,", note: "IncludeProjectDependenciesComponentConfigurator.configureComponent"}
  - {class: io.protostuff.parser.ErrorMap, method: clear, match: "()", note: "ErrorMap.clear"}
  - {class: io.protostuff.runtime.ArrayFieldMap, method: getFieldByNumber, match: "(int n)", note: "ArrayFieldMap.getFieldByNumber"}
  - {class: io.protostuff.ByteArrayInput, method: setBounds, match: "(int offset, int limit)", note: "ByteArrayInput.setBounds"}
  - {class: io.protostuff.compiler.CompilerUtil, method: getProtoFiles, match: "(File dir)", note: "CompilerUtil.getProtoFiles"}
  - {class: io.protostuff.mojo.ProtoCompilerMojo, method: execute, match: "() throws MojoExecutionException, MojoFailureException", note: "ProtoCompilerMojo.execute"}
  - {class: io.protostuff.parser.ErrorMap, method: containsKey, match: "(Object arg0)", note: "ErrorMap.containsKey"}
  - {class: io.protostuff.runtime.ArrayFieldMap, method: getFieldByName, match: "(String fieldName)", note: "ArrayFieldMap.getFieldByName"}
  - {class: io.protostuff.ByteBufferInput, method: reset, match: "(int offset, int len)", note: "ByteBufferInput.reset"}
  - {class: io.protostuff.compiler.FilenameUtil, method: getFileName, match: "(String fullPath)", note: "FilenameUtil.getFileName"}
  - {class: io.protostuff.mojo.ProtoCompilerMojo, method: skipMojo, match: "()", note: "ProtoCompilerMojo.skipMojo"}
  - {class: io.protostuff.parser.ProtoUtil, method: loadFrom, match: "(ANTLRReaderStream input, Proto target) throws Exception", note: "ProtoUtil.loadFrom"}
  - {class: io.protostuff.runtime.ArraySchemas, method: setValue, match: "(Object value, Object owner)", note: "ArraySchemas.setValue"}
  - {class: io.protostuff.ByteBufferInput, method: currentOffset, match: "()", note: "ByteBufferInput.currentOffset"}
  - {class: io.protostuff.compiler.CachingProtoLoader, method: getCachedProtos, match: "()", note: "CachingProtoLoader.getCachedProtos"}
  - {class: io.protostuff.mojo.ProtoModule, method: isAddToCompileSourceRoot, match: "()", note: "ProtoModule.isAddToCompileSourceRoot"}
  - {class: io.protostuff.parser.ProtoUtil, method: loadFrom, match: "(InputStream in, Proto target) throws Exception", note: "ProtoUtil.loadFrom"}
  - {class: io.protostuff.runtime.ArraySchemas, method: getFieldName, match: "(int number)", note: "ArraySchemas.getFieldName"}
  - {class: io.protostuff.ByteString, method: writeTo, match: "(OutputStream out, ByteString bs) throws IOException", note: "ByteString.writeTo"}
  - {class: io.protostuff.compiler.CachingProtoLoader, method: loadFrom, match: "(File file, Proto importer) throws Exception", note: "CachingProtoLoader.loadFrom"}
  - {class: io.protostuff.mojo.ProtoModule, method: setAddToCompileSourceRoot, match: "(boolean addToCompileSourceRoot)", note: "ProtoModule.setAddToCompileSourceRoot"}
  - {class: io.protostuff.parser.Annotation, method: getParams, match: "()", note: "Annotation.getParams"}
  - {class: io.protostuff.runtime.HashFieldMap, method: getFieldByNumber, match: "(int n)", note: "HashFieldMap.getFieldByNumber"}
  - {class: io.protostuff.ByteString, method: writeTo, match: "(DataOutput out, ByteString bs) throws IOException", note: "ByteString.writeTo"}
  - {class: io.protostuff.compiler.CompilerMain, method: setCompilerResolver, match: "(CompilerResolver resolver)", note: "CompilerMain.setCompilerResolver"}
  - {class: io.protostuff.parser.Annotation, method: getP, match: "()", note: "Annotation.getP"}
  - {class: io.protostuff.runtime.HashFieldMap, method: getFieldByName, match: "(String fieldName)", note: "HashFieldMap.getFieldByName"}
  - {class: io.protostuff.GraphByteArrayInput, method: updateLast, match: "(Object morphedMessage, Object lastMessage)", note: "GraphByteArrayInput.updateLast"}
  - {class: io.protostuff.compiler.CompilerMain, method: addCompiler, match: "(ProtoCompiler compiler)", note: "CompilerMain.addCompiler"}
  - {class: io.protostuff.parser.DefaultProtoLoader, method: getDefaultInstance, match: "()", note: "DefaultProtoLoader.getDefaultInstance"}
  - {class: io.protostuff.runtime.RuntimeMapFieldFactory, method: mergeFrom, match: "(Input input, T message) throws IOException", note: "RuntimeMapFieldFactory.mergeFrom"}
  - {class: io.protostuff.GraphByteArrayInput, method: isCurrentMessageReference, match: "()", note: "GraphByteArrayInput.isCurrentMessageReference"}
  - {class: io.protostuff.compiler.PluginProtoCompiler, method: resolveSTG, match: "(String stgLocation)", note: "PluginProtoCompiler.resolveSTG"}
  - {class: io.protostuff.parser.DefaultProtoLoader, method: load, match: "(String path, Proto importer) throws Exception", note: "DefaultProtoLoader.load"}
  - {class: io.protostuff.runtime.RuntimeMapFieldFactory, method: writeTo, match: "(Output output, T message) throws IOException", note: "RuntimeMapFieldFactory.writeTo"}
  - {class: io.protostuff.GraphIOUtil, method: mergeFrom, match: "(byte[] data, T message, Schema<T> schema)", note: "GraphIOUtil.mergeFrom"}
  - {class: io.protostuff.compiler.PluginProtoCompiler, method: setGroupResolver, match: "(GroupResolver resolver)", note: "PluginProtoCompiler.setGroupResolver"}
  - {class: io.protostuff.parser.EnumField, method: getEv, match: "()", note: "EnumField.getEv"}
  - {class: io.protostuff.runtime.DefaultIdStrategy, method: registerPojo, match: "(Class<T> typeClass, Schema<T> schema)", note: "DefaultIdStrategy.registerPojo"}
  - {class: io.protostuff.GraphIOUtil, method: mergeFrom, match: "(byte[] data, int offset, int length, T message,", note: "GraphIOUtil.mergeFrom"}
  - {class: io.protostuff.compiler.ProtoModule, method: getSource, match: "()", note: "ProtoModule.getSource"}
  - {class: io.protostuff.parser.EnumField, method: putExtraOption, match: "(java.lang.String key, Object value)", note: "EnumField.putExtraOption"}
  - {class: io.protostuff.runtime.DefaultIdStrategy, method: registerPojo, match: "(Class<T> typeClass)", note: "DefaultIdStrategy.registerPojo"}
  - {class: io.protostuff.JsonIOUtil, method: getRootByteSymbols, match: "()", note: "JsonIOUtil.getRootByteSymbols"}
  - {class: io.protostuff.compiler.ProtoModule, method: setSource, match: "(File source)", note: "ProtoModule.setSource"}
  - {class: io.protostuff.parser.EnumGroup, method: getName, match: "()", note: "EnumGroup.getName"}
  - {class: io.protostuff.runtime.ExplicitIdStrategy, method: registerCollection, match: "(", note: "ExplicitIdStrategy.registerCollection"}
  - {class: io.protostuff.JsonIOUtil, method: getParserFeaturesImpl, match: "()", note: "JsonIOUtil.getParserFeaturesImpl"}
