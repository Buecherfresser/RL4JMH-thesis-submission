  - {class: org.rythmengine.internal.TemplateBuilder, method: __defaultEscape, match: "()", note: "TemplateBuilder.__defaultEscape"}
  - {class: org.rythmengine.internal.compiler.TemplateClassLoader, method: fileNotChanges, match: "()", note: "TemplateClassLoader.fileNotChanges"}
  - {class: org.rythmengine.internal.dialect.DialectManager, method: getById, match: "(String id)", note: "DialectManager.getById"}
