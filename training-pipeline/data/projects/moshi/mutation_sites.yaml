# Curated performance-mutation sites for moshi (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants moshi --source data/external-src/<checkout> \
#       --sites data/projects/moshi/mutation_sites.yaml

package_root: com.squareup.moshi

sites:
  - {class: com.squareup.moshi.ArrayJsonAdapter, method: create, match: "(", note: "ArrayJsonAdapter.create"}
  - {class: com.squareup.moshi.adapters.Iso8601Utils, method: format, match: "(Date date)", note: "Iso8601Utils.format"}
  - {class: com.squareup.moshi.internal.Util, method: jsonName, match: "(String declaredName, AnnotatedElement element)", note: "Util.jsonName"}
  - {class: com.squareup.moshi.ArrayJsonAdapter, method: fromJson, match: "(JsonReader reader) throws IOException", note: "ArrayJsonAdapter.fromJson"}
  - {class: com.squareup.moshi.adapters.Iso8601Utils, method: parse, match: "(String date)", note: "Iso8601Utils.parse"}
  - {class: com.squareup.moshi.internal.Util, method: jsonName, match: "(String declaredName, @Nullable Json annotation)", note: "Util.jsonName"}
  - {class: com.squareup.moshi.ArrayJsonAdapter, method: toJson, match: "(JsonWriter writer, Object value) throws IOException", note: "ArrayJsonAdapter.toJson"}
  - {class: com.squareup.moshi.adapters.EnumJsonAdapter, method: create, match: "(Class<T> enumType)", note: "EnumJsonAdapter.create"}
  - {class: com.squareup.moshi.internal.Util, method: typesMatch, match: "(Type pattern, Type candidate)", note: "Util.typesMatch"}
  - {class: com.squareup.moshi.LinkedHashTreeMap, method: size, match: "()", note: "LinkedHashTreeMap.size"}
  - {class: com.squareup.moshi.adapters.EnumJsonAdapter, method: withUnknownFallback, match: "(@Nullable T fallbackValue)", note: "EnumJsonAdapter.withUnknownFallback"}
  - {class: com.squareup.moshi.internal.NonNullJsonAdapter, method: delegate, match: "()", note: "NonNullJsonAdapter.delegate"}
  - {class: com.squareup.moshi.LinkedHashTreeMap, method: containsKey, match: "(Object key)", note: "LinkedHashTreeMap.containsKey"}
  - {class: com.squareup.moshi.adapters.EnumJsonAdapter, method: fromJson, match: "(JsonReader reader) throws IOException", note: "EnumJsonAdapter.fromJson"}
  - {class: com.squareup.moshi.internal.NonNullJsonAdapter, method: fromJson, match: "(JsonReader reader) throws IOException", note: "NonNullJsonAdapter.fromJson"}
  - {class: com.squareup.moshi.LinkedHashTreeMap, method: clear, match: "()", note: "LinkedHashTreeMap.clear"}
  - {class: com.squareup.moshi.adapters.PolymorphicJsonAdapterFactory, method: of, match: "(Class<T> baseType, String labelKey)", note: "PolymorphicJsonAdapterFactory.of"}
  - {class: com.squareup.moshi.internal.NonNullJsonAdapter, method: toJson, match: "(JsonWriter writer, @Nullable T value) throws IOException", note: "NonNullJsonAdapter.toJson"}
  - {class: com.squareup.moshi.MapJsonAdapter, method: create, match: "(", note: "MapJsonAdapter.create"}
  - {class: com.squareup.moshi.adapters.PolymorphicJsonAdapterFactory, method: withSubtype, match: "(Class<? extends T> subtype, String label)", note: "PolymorphicJsonAdapterFactory.withSubtype"}
  - {class: com.squareup.moshi.internal.NullSafeJsonAdapter, method: delegate, match: "()", note: "NullSafeJsonAdapter.delegate"}
  - {class: com.squareup.moshi.MapJsonAdapter, method: toJson, match: "(JsonWriter writer, Map<K, V> map) throws IOException", note: "MapJsonAdapter.toJson"}
  - {class: com.squareup.moshi.adapters.PolymorphicJsonAdapterFactory, method: withFallbackJsonAdapter, match: "(", note: "PolymorphicJsonAdapterFactory.withFallbackJsonAdapter"}
  - {class: com.squareup.moshi.internal.NullSafeJsonAdapter, method: fromJson, match: "(JsonReader reader) throws IOException", note: "NullSafeJsonAdapter.fromJson"}
  - {class: com.squareup.moshi.MapJsonAdapter, method: fromJson, match: "(JsonReader reader) throws IOException", note: "MapJsonAdapter.fromJson"}
  - {class: com.squareup.moshi.adapters.Rfc3339DateJsonAdapter, method: fromJson, match: "(JsonReader reader) throws IOException", note: "Rfc3339DateJsonAdapter.fromJson"}
  - {class: com.squareup.moshi.internal.NullSafeJsonAdapter, method: toJson, match: "(JsonWriter writer, @Nullable T value) throws IOException", note: "NullSafeJsonAdapter.toJson"}
  - {class: com.squareup.moshi.AdapterMethodsFactory, method: create, match: "(", note: "AdapterMethodsFactory.create"}
  - {class: com.squareup.moshi.adapters.Rfc3339DateJsonAdapter, method: toJson, match: "(JsonWriter writer, Date value) throws IOException", note: "Rfc3339DateJsonAdapter.toJson"}
  - {class: com.squareup.moshi.AdapterMethodsFactory, method: toJson, match: "(JsonWriter writer, @Nullable Object value) throws IOException", note: "AdapterMethodsFactory.toJson"}
  - {class: com.squareup.moshi.AdapterMethodsFactory, method: fromJson, match: "(JsonReader reader) throws IOException", note: "AdapterMethodsFactory.fromJson"}
  - {class: com.squareup.moshi.ClassJsonAdapter, method: create, match: "(", note: "ClassJsonAdapter.create"}
  - {class: com.squareup.moshi.ClassJsonAdapter, method: fromJson, match: "(JsonReader reader) throws IOException", note: "ClassJsonAdapter.fromJson"}
  - {class: com.squareup.moshi.ClassJsonAdapter, method: toJson, match: "(JsonWriter writer, T value) throws IOException", note: "ClassJsonAdapter.toJson"}
  - {class: com.squareup.moshi.JsonUtf8Reader, method: beginArray, match: "() throws IOException", note: "JsonUtf8Reader.beginArray"}
  - {class: com.squareup.moshi.JsonUtf8Reader, method: endArray, match: "() throws IOException", note: "JsonUtf8Reader.endArray"}
  - {class: com.squareup.moshi.JsonUtf8Reader, method: beginObject, match: "() throws IOException", note: "JsonUtf8Reader.beginObject"}
  - {class: com.squareup.moshi.JsonUtf8Writer, method: setIndent, match: "(String indent)", note: "JsonUtf8Writer.setIndent"}
  - {class: com.squareup.moshi.JsonUtf8Writer, method: beginArray, match: "() throws IOException", note: "JsonUtf8Writer.beginArray"}
  - {class: com.squareup.moshi.JsonUtf8Writer, method: endArray, match: "() throws IOException", note: "JsonUtf8Writer.endArray"}
  - {class: com.squareup.moshi.JsonValueReader, method: beginArray, match: "() throws IOException", note: "JsonValueReader.beginArray"}
  - {class: com.squareup.moshi.JsonValueReader, method: endArray, match: "() throws IOException", note: "JsonValueReader.endArray"}
  - {class: com.squareup.moshi.JsonValueReader, method: beginObject, match: "() throws IOException", note: "JsonValueReader.beginObject"}
  - {class: com.squareup.moshi.JsonValueSource, method: discard, match: "() throws IOException", note: "JsonValueSource.discard"}
  - {class: com.squareup.moshi.JsonValueSource, method: timeout, match: "()", note: "JsonValueSource.timeout"}
  - {class: com.squareup.moshi.JsonValueSource, method: close, match: "() throws IOException", note: "JsonValueSource.close"}
  - {class: com.squareup.moshi.JsonValueWriter, method: root, match: "()", note: "JsonValueWriter.root"}
  - {class: com.squareup.moshi.JsonValueWriter, method: beginArray, match: "() throws IOException", note: "JsonValueWriter.beginArray"}
  - {class: com.squareup.moshi.JsonValueWriter, method: endArray, match: "() throws IOException", note: "JsonValueWriter.endArray"}
  - {class: com.squareup.moshi.Moshi, method: adapter, match: "(Type type)", note: "Moshi.adapter"}
