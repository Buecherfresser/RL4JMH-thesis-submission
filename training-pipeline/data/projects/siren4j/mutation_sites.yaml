  - {class: com.google.code.siren4j.component.impl.FieldImpl, method: setType, match: "(FieldType type)", note: "FieldImpl.setType"}
  - {class: com.google.code.siren4j.component.impl.LinkImpl, method: getRel, match: "()", note: "LinkImpl.getRel"}
  - {class: com.google.code.siren4j.component.impl.LinkImpl, method: setRel, match: "(String... rel)", note: "LinkImpl.setRel"}
  - {class: com.google.code.siren4j.component.impl.LinkImpl, method: getHref, match: "()", note: "LinkImpl.getHref"}
  - {class: com.google.code.siren4j.condition.ConditionFactory, method: getInstance, match: "()", note: "ConditionFactory.getInstance"}
  - {class: com.google.code.siren4j.condition.ConditionFactory, method: getCondition, match: "(final Is type)", note: "ConditionFactory.getCondition"}
  - {class: com.google.code.siren4j.condition.EmptyCondition, method: evaluate, match: "(Object obj)", note: "EmptyCondition.evaluate"}
  - {class: com.google.code.siren4j.condition.FalseCondition, method: evaluate, match: "(Object obj)", note: "FalseCondition.evaluate"}
  - {class: com.google.code.siren4j.condition.NotEmptyCondition, method: evaluate, match: "(Object obj)", note: "NotEmptyCondition.evaluate"}
  - {class: com.google.code.siren4j.condition.NotNullCondition, method: evaluate, match: "(Object obj)", note: "NotNullCondition.evaluate"}
  - {class: com.google.code.siren4j.condition.NullCondition, method: evaluate, match: "(Object obj)", note: "NullCondition.evaluate"}
  - {class: com.google.code.siren4j.condition.TrueCondition, method: evaluate, match: "(Object obj)", note: "TrueCondition.evaluate"}
  - {class: com.google.code.siren4j.converter.EntityContextImpl, method: getCurrentObject, match: "()", note: "EntityContextImpl.getCurrentObject"}
  - {class: com.google.code.siren4j.converter.EntityContextImpl, method: getCurrentFieldInfo, match: "()", note: "EntityContextImpl.getCurrentFieldInfo"}
