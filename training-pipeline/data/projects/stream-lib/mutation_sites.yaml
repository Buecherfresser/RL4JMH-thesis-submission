# Curated performance-mutation sites for stream-lib (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants stream-lib --source data/external-src/<checkout> \
#       --sites data/projects/stream-lib/mutation_sites.yaml

package_root: com.clearspring.analytics

sites:
  - {class: com.clearspring.analytics.hash.Lookup3Hash, method: lookup3, match: "(int[] k, int offset, int length, int initval)", note: "Lookup3Hash.lookup3"}
  - {class: com.clearspring.analytics.stream.ConcurrentStreamSummary, method: offer, match: "(final T element)", note: "ConcurrentStreamSummary.offer"}
