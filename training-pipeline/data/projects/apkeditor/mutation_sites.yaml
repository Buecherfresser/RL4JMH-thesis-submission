# Curated performance-mutation sites for apkeditor (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants apkeditor --source data/external-src/<checkout> \
#       --sites data/projects/apkeditor/mutation_sites.yaml

package_root: com.reandroid.apkeditor

sites:
  - {class: com.reandroid.apkeditor.ResourceStrings, method: getString, match: "(String resourceName)", note: "ResourceStrings.getString"}
  - {class: com.reandroid.apkeditor.cloner.Cloner, method: runCommand, match: "() throws IOException", note: "Cloner.runCommand"}
  - {class: com.reandroid.apkeditor.common.AndroidManifestHelper, method: listSplitRequired, match: "(ResXmlElement parentElement)", note: "AndroidManifestHelper.listSplitRequired"}
  - {class: com.reandroid.apkeditor.compile.Builder, method: runCommand, match: "() throws IOException", note: "Builder.runCommand"}
  - {class: com.reandroid.apkeditor.decompile.DexProfileDecoderImpl, method: decodeDexProfile, match: "(ApkModule apkModule, File mainDirectory) throws IOException", note: "DexProfileDecoderImpl.decodeDexProfile"}
  - {class: com.reandroid.apkeditor.info.Info, method: runCommand, match: "() throws IOException", note: "Info.runCommand"}
  - {class: com.reandroid.apkeditor.merge.Merger, method: runCommand, match: "() throws IOException", note: "Merger.runCommand"}
  - {class: com.reandroid.apkeditor.protect.DexArrayPayloadConfuser, method: confuseLevel, match: "()", note: "DexArrayPayloadConfuser.confuseLevel"}
  - {class: com.reandroid.apkeditor.refactor.RefactorUtil, method: isObfuscated, match: "(Collection<String> entryNames)", note: "RefactorUtil.isObfuscated"}
  - {class: com.reandroid.apkeditor.smali.ResourceComment, method: getComment, match: "(int resourceId)", note: "ResourceComment.getComment"}
  - {class: com.reandroid.apkeditor.utils.StringHelper, method: trueOrNull, match: "(Boolean value)", note: "StringHelper.trueOrNull"}
  - {class: com.reandroid.apkeditor.ResourceStrings, method: getConfig, match: "()", note: "ResourceStrings.getConfig"}
  - {class: com.reandroid.apkeditor.cloner.ClonerOptions, method: newCommandExecutor, match: "()", note: "ClonerOptions.newCommandExecutor"}
  - {class: com.reandroid.apkeditor.common.AndroidManifestHelper, method: removeAttributeFromManifestByName, match: "(AndroidManifestBlock androidManifestBlock,", note: "AndroidManifestHelper.removeAttributeFromManifestByName"}
  - {class: com.reandroid.apkeditor.compile.Builder, method: buildJson, match: "() throws IOException", note: "Builder.buildJson"}
  - {class: com.reandroid.apkeditor.decompile.DexProfileDecoderImpl, method: setApkLogger, match: "(APKLogger apkLogger)", note: "DexProfileDecoderImpl.setApkLogger"}
  - {class: com.reandroid.apkeditor.info.InfoOptions, method: newCommandExecutor, match: "()", note: "InfoOptions.newCommandExecutor"}
  - {class: com.reandroid.apkeditor.merge.MergerOptions, method: newCommandExecutor, match: "()", note: "MergerOptions.newCommandExecutor"}
  - {class: com.reandroid.apkeditor.protect.DexArrayPayloadConfuser, method: apply, match: "(DexMethod dexMethod)", note: "DexArrayPayloadConfuser.apply"}
  - {class: com.reandroid.apkeditor.refactor.RefactorUtil, method: isSequentialNames, match: "(Collection<String> entryNames)", note: "RefactorUtil.isSequentialNames"}
  - {class: com.reandroid.apkeditor.smali.SmaliCompiler, method: buildDexFiles, match: "(ApkModuleEncoder apkModuleEncoder, File mainDir) throws IOException", note: "SmaliCompiler.buildDexFiles"}
  - {class: com.reandroid.apkeditor.utils.StringHelper, method: trueOrNull, match: "(boolean value)", note: "StringHelper.trueOrNull"}
  - {class: com.reandroid.apkeditor.Util, method: ensureUniqueFile, match: "(File file)", note: "Util.ensureUniqueFile"}
  - {class: com.reandroid.apkeditor.compile.DexProfileEncoderImpl, method: encodeDexProfile, match: "(File mainDirectory) throws IOException", note: "DexProfileEncoderImpl.encodeDexProfile"}
  - {class: com.reandroid.apkeditor.decompile.DecompileOptions, method: newCommandExecutor, match: "()", note: "DecompileOptions.newCommandExecutor"}
  - {class: com.reandroid.apkeditor.info.InfoOptions, method: validateValues, match: "()", note: "InfoOptions.validateValues"}
  - {class: com.reandroid.apkeditor.merge.MergerOptions, method: validateInput, match: "(boolean isFile, boolean isDirectory)", note: "MergerOptions.validateInput"}
  - {class: com.reandroid.apkeditor.protect.DexStringFogger, method: confuseLevel, match: "()", note: "DexStringFogger.confuseLevel"}
  - {class: com.reandroid.apkeditor.refactor.StringValueNameGenerator, method: refactor, match: "()", note: "StringValueNameGenerator.refactor"}
  - {class: com.reandroid.apkeditor.smali.SmaliCompiler, method: setApkLogger, match: "(APKLogger apkLogger)", note: "SmaliCompiler.setApkLogger"}
  - {class: com.reandroid.apkeditor.utils.CyclicIterator, method: length, match: "()", note: "CyclicIterator.length"}
  - {class: com.reandroid.apkeditor.Util, method: deleteDir, match: "(File dir)", note: "Util.deleteDir"}
  - {class: com.reandroid.apkeditor.compile.DexProfileEncoderImpl, method: setApkLogger, match: "(APKLogger apkLogger)", note: "DexProfileEncoderImpl.setApkLogger"}
  - {class: com.reandroid.apkeditor.decompile.DecompileOptions, method: validateInput, match: "(boolean isFile, boolean isDirectory)", note: "DecompileOptions.validateInput"}
