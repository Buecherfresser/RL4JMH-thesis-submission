# Curated performance-mutation sites for pinyin (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants pinyin --source data/external-src/<checkout> \
#       --sites data/projects/pinyin/mutation_sites.yaml

package_root: com.github.houbb

sites:
  - {class: com.github.houbb.pinyin.support.segment.trie.DefaultPinyinTrieTreeMap, method: getStaticVolatileMap, match: "()", note: "DefaultPinyinTrieTreeMap.getStaticVolatileMap"}
  - {class: com.github.houbb.pinyin.support.segment.trie.DefaultPinyinTrieTreeMap, method: getWordCollection, match: "()", note: "DefaultPinyinTrieTreeMap.getWordCollection"}
  - {class: com.github.houbb.pinyin.api.impl.Pinyin, method: toPinyin, match: "(String string, IPinyinContext context)", note: "Pinyin.toPinyin"}
  - {class: com.github.houbb.pinyin.api.impl.Pinyin, method: toPinyinList, match: "(char chinese, IPinyinContext context)", note: "Pinyin.toPinyinList"}
  - {class: com.github.houbb.pinyin.api.impl.Pinyin, method: hasSamePinyin, match: "(char chineseOne, char chineseTwo, IPinyinContext context)", note: "Pinyin.hasSamePinyin"}
  - {class: com.github.houbb.pinyin.api.impl.PinyinContext, method: newInstance, match: "()", note: "PinyinContext.newInstance"}
  - {class: com.github.houbb.pinyin.api.impl.PinyinContext, method: style, match: "()", note: "PinyinContext.style"}
  - {class: com.github.houbb.pinyin.api.impl.PinyinContext, method: style, match: "(IPinyinToneStyle style)", note: "PinyinContext.style"}
  - {class: com.github.houbb.pinyin.bs.PinyinBs, method: newInstance, match: "()", note: "PinyinBs.newInstance"}
  - {class: com.github.houbb.pinyin.bs.PinyinBs, method: style, match: "(IPinyinToneStyle style)", note: "PinyinBs.style"}
  - {class: com.github.houbb.pinyin.bs.PinyinBs, method: connector, match: "(String connector)", note: "PinyinBs.connector"}
  - {class: com.github.houbb.pinyin.constant.enums.PinyinToneNumEnum, method: num, match: "()", note: "PinyinToneNumEnum.num"}
  - {class: com.github.houbb.pinyin.constant.enums.PinyinToneNumEnum, method: desc, match: "()", note: "PinyinToneNumEnum.desc"}
  - {class: com.github.houbb.pinyin.constant.enums.PinyinToneNumEnum, method: isPing, match: "(final int toneNum)", note: "PinyinToneNumEnum.isPing"}
  - {class: com.github.houbb.pinyin.model.CharToneInfo, method: of, match: "(final ToneItem toneItem,", note: "CharToneInfo.of"}
  - {class: com.github.houbb.pinyin.model.CharToneInfo, method: getIndex, match: "()", note: "CharToneInfo.getIndex"}
  - {class: com.github.houbb.pinyin.model.CharToneInfo, method: getToneItem, match: "()", note: "CharToneInfo.getToneItem"}
  - {class: com.github.houbb.pinyin.model.ToneItem, method: of, match: "(final char letter,", note: "ToneItem.of"}
  - {class: com.github.houbb.pinyin.model.ToneItem, method: getLetter, match: "()", note: "ToneItem.getLetter"}
  - {class: com.github.houbb.pinyin.model.ToneItem, method: getTone, match: "()", note: "ToneItem.getTone"}
  - {class: com.github.houbb.pinyin.support.chinese.DefaultsPinyinChinese, method: isChinese, match: "(String original)", note: "DefaultsPinyinChinese.isChinese"}
  - {class: com.github.houbb.pinyin.support.chinese.DefaultsPinyinChinese, method: isChinese, match: "(char original)", note: "DefaultsPinyinChinese.isChinese"}
  - {class: com.github.houbb.pinyin.support.chinese.DefaultsPinyinChinese, method: toSimple, match: "(String segment)", note: "DefaultsPinyinChinese.toSimple"}
  - {class: com.github.houbb.pinyin.support.chinese.PinyinChineses, method: defaults, match: "()", note: "PinyinChineses.defaults"}
  - {class: com.github.houbb.pinyin.support.data.PinyinData, method: shengMu, match: "(String pinyinNormal)", note: "PinyinData.shengMu"}
