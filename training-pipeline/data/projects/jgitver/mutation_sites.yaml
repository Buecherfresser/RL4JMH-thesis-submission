# Curated performance-mutation sites for jgitver (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jgitver --source data/external-src/<checkout> \
#       --sites data/projects/jgitver/mutation_sites.yaml

package_root: fr.brouillard.oss

sites:
  - {class: fr.brouillard.oss.jgitver.impl.GitUtils, method: tagNameFromRef, match: "(Ref tag)", note: "GitUtils.tagNameFromRef"}
  - {class: fr.brouillard.oss.jgitver.impl.GitUtils, method: isAnnotated, match: "(Ref ref)", note: "GitUtils.isAnnotated"}
  - {class: fr.brouillard.oss.jgitver.impl.GitUtils, method: sanitizeBranchName, match: "(String currentBranch)", note: "GitUtils.sanitizeBranchName"}
  - {class: fr.brouillard.oss.jgitver.impl.GitVersionCalculatorImplBuilder, method: build, match: "(File gitRepositoryLocation) throws IOException", note: "GitVersionCalculatorImplBuilder.build"}
  - {class: fr.brouillard.oss.jgitver.impl.pattern.VersionGrammarParser, method: parseOn, match: "(Context context)", note: "VersionGrammarParser.parseOn"}
  - {class: fr.brouillard.oss.jgitver.BranchingPolicy, method: fixedBranchName, match: "(String name, List<String> transformations)", note: "BranchingPolicy.fixedBranchName"}
  - {class: fr.brouillard.oss.jgitver.BranchingPolicy, method: fixedBranchName, match: "(String name)", note: "BranchingPolicy.fixedBranchName"}
  - {class: fr.brouillard.oss.jgitver.BranchingPolicy, method: ignoreBranchName, match: "(String name)", note: "BranchingPolicy.ignoreBranchName"}
  - {class: fr.brouillard.oss.jgitver.Features, method: isActive, match: "()", note: "Features.isActive"}
  - {class: fr.brouillard.oss.jgitver.Features, method: activate, match: "()", note: "Features.activate"}
  - {class: fr.brouillard.oss.jgitver.Features, method: deactivate, match: "()", note: "Features.deactivate"}
  - {class: fr.brouillard.oss.jgitver.JGitverProperties, method: getVersion, match: "()", note: "JGitverProperties.getVersion"}
  - {class: fr.brouillard.oss.jgitver.JGitverProperties, method: getSHA1, match: "()", note: "JGitverProperties.getSHA1"}
  - {class: fr.brouillard.oss.jgitver.Version, method: getMajor, match: "()", note: "Version.getMajor"}
  - {class: fr.brouillard.oss.jgitver.Version, method: getMinor, match: "()", note: "Version.getMinor"}
  - {class: fr.brouillard.oss.jgitver.Version, method: getPatch, match: "()", note: "Version.getPatch"}
  - {class: fr.brouillard.oss.jgitver.cli.RunnableCLI, method: main, match: "(String[] args)", note: "RunnableCLI.main"}
  - {class: fr.brouillard.oss.jgitver.impl.Commit, method: getGitObject, match: "()", note: "Commit.getGitObject"}
  - {class: fr.brouillard.oss.jgitver.impl.Commit, method: getAnnotatedTags, match: "()", note: "Commit.getAnnotatedTags"}
  - {class: fr.brouillard.oss.jgitver.impl.Commit, method: getLightTags, match: "()", note: "Commit.getLightTags"}
  - {class: fr.brouillard.oss.jgitver.impl.ConfigurableVersionStrategy, method: build, match: "(Commit head, List<Commit> parents) throws VersionCalculationException", note: "ConfigurableVersionStrategy.build"}
  - {class: fr.brouillard.oss.jgitver.impl.ConfigurableVersionStrategy, method: setAutoIncrementPatch, match: "(boolean autoIncrementPatch)", note: "ConfigurableVersionStrategy.setAutoIncrementPatch"}
  - {class: fr.brouillard.oss.jgitver.impl.ConfigurableVersionStrategy, method: setUseDistance, match: "(boolean useDistance)", note: "ConfigurableVersionStrategy.setUseDistance"}
  - {class: fr.brouillard.oss.jgitver.impl.GitVersionCalculatorImpl, method: getVersionObject, match: "(boolean forceComputation)", note: "GitVersionCalculatorImpl.getVersionObject"}
  - {class: fr.brouillard.oss.jgitver.impl.GitVersionCalculatorImpl, method: getVersionObject, match: "()", note: "GitVersionCalculatorImpl.getVersionObject"}
  - {class: fr.brouillard.oss.jgitver.impl.GitVersionCalculatorImpl, method: getVersion, match: "()", note: "GitVersionCalculatorImpl.getVersion"}
  - {class: fr.brouillard.oss.jgitver.impl.Lambdas, method: as, match: "(Predicate<T> predicate)", note: "Lambdas.as"}
  - {class: fr.brouillard.oss.jgitver.impl.Lambdas, method: as, match: "(Consumer<T> consumer)", note: "Lambdas.as"}
  - {class: fr.brouillard.oss.jgitver.impl.Lambdas, method: as, match: "(Supplier<T> supplier)", note: "Lambdas.as"}
  - {class: fr.brouillard.oss.jgitver.impl.MavenVersionStrategy, method: build, match: "(Commit head, List<Commit> parents) throws VersionCalculationException", note: "MavenVersionStrategy.build"}
  - {class: fr.brouillard.oss.jgitver.impl.MavenVersionStrategy, method: setUseDirty, match: "(boolean useDirty)", note: "MavenVersionStrategy.setUseDirty"}
  - {class: fr.brouillard.oss.jgitver.impl.MavenVersionStrategy, method: setForceComputation, match: "(boolean forceComputation)", note: "MavenVersionStrategy.setForceComputation"}
  - {class: fr.brouillard.oss.jgitver.impl.Pair, method: getLeft, match: "()", note: "Pair.getLeft"}
