# Curated performance-mutation sites for mqtt-client (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants mqtt-client --source data/external-src/<checkout> \
#       --sites data/projects/mqtt-client/mutation_sites.yaml

package_root: org.fusesource.mqtt

sites:
  - {class: org.fusesource.mqtt.cli.Listener, method: main, match: "(String[] args) throws Exception", note: "Listener.main"}
  - {class: org.fusesource.mqtt.client.BlockingConnection, method: isConnected, match: "()", note: "BlockingConnection.isConnected"}
  - {class: org.fusesource.mqtt.codec.CONNACK, method: messageType, match: "()", note: "CONNACK.messageType"}
  - {class: org.fusesource.mqtt.cli.Listener, method: run, match: "()", note: "Listener.run"}
  - {class: org.fusesource.mqtt.client.BlockingConnection, method: connect, match: "() throws Exception", note: "BlockingConnection.connect"}
  - {class: org.fusesource.mqtt.codec.CONNACK, method: code, match: "()", note: "CONNACK.code"}
  - {class: org.fusesource.mqtt.cli.Publisher, method: main, match: "(String[] args) throws Exception", note: "Publisher.main"}
  - {class: org.fusesource.mqtt.client.CallbackConnection, method: onConnected, match: "()", note: "CallbackConnection.onConnected"}
  - {class: org.fusesource.mqtt.codec.CONNECT, method: messageType, match: "()", note: "CONNECT.messageType"}
  - {class: org.fusesource.mqtt.cli.Publisher, method: run, match: "()", note: "Publisher.run"}
  - {class: org.fusesource.mqtt.client.CallbackConnection, method: onDisconnected, match: "()", note: "CallbackConnection.onDisconnected"}
  - {class: org.fusesource.mqtt.codec.CONNECT, method: cleanSession, match: "()", note: "CONNECT.cleanSession"}
  - {class: org.fusesource.mqtt.client.FutureConnection, method: onConnected, match: "()", note: "FutureConnection.onConnected"}
  - {class: org.fusesource.mqtt.codec.DISCONNECT, method: messageType, match: "()", note: "DISCONNECT.messageType"}
  - {class: org.fusesource.mqtt.client.FutureConnection, method: onDisconnected, match: "()", note: "FutureConnection.onDisconnected"}
  - {class: org.fusesource.mqtt.codec.MQTTFrame, method: buffers, match: "()", note: "MQTTFrame.buffers"}
  - {class: org.fusesource.mqtt.client.MQTT, method: getBlockingThreadPool, match: "()", note: "MQTT.getBlockingThreadPool"}
  - {class: org.fusesource.mqtt.codec.MQTTFrame, method: buffers, match: "(Buffer...buffers)", note: "MQTTFrame.buffers"}
  - {class: org.fusesource.mqtt.client.MQTT, method: newThread, match: "(Runnable r)", note: "MQTT.newThread"}
  - {class: org.fusesource.mqtt.codec.MQTTProtocolCodec, method: getMaxMessageLength, match: "()", note: "MQTTProtocolCodec.getMaxMessageLength"}
