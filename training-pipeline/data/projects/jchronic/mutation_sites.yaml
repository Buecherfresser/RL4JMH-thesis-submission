# Curated performance-mutation sites for jchronic (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jchronic --source data/external-src/<checkout> \
#       --sites data/projects/jchronic/mutation_sites.yaml

package_root: com.mdimension.jchronic

sites:
  - {class: com.mdimension.jchronic.Chronic, method: parse, match: "(String text)", note: "Chronic.parse"}
  - {class: com.mdimension.jchronic.handlers.DummyHandler, method: handle, match: "(List<Token> tokens, Options options)", note: "DummyHandler.handle"}
  - {class: com.mdimension.jchronic.numerizer.Numerizer, method: getName, match: "()", note: "Numerizer.getName"}
  - {class: com.mdimension.jchronic.repeaters.EnumRepeaterDayPortion, method: createRange, match: "(RepeaterDayPortion.DayPortion type)", note: "EnumRepeaterDayPortion.createRange"}
  - {class: com.mdimension.jchronic.tags.Grabber, method: scan, match: "(List<Token> tokens, Options options)", note: "Grabber.scan"}
  - {class: com.mdimension.jchronic.utils.Range, method: getBegin, match: "()", note: "Range.getBegin"}
  - {class: com.mdimension.jchronic.Chronic, method: parse, match: "(String text, Options options)", note: "Chronic.parse"}
  - {class: com.mdimension.jchronic.handlers.Handler, method: isCompatible, match: "(Options options)", note: "Handler.isCompatible"}
  - {class: com.mdimension.jchronic.numerizer.Numerizer, method: getNumber, match: "()", note: "Numerizer.getNumber"}
  - {class: com.mdimension.jchronic.repeaters.EnumRepeaterDayPortion, method: _getWidth, match: "(Range range)", note: "EnumRepeaterDayPortion._getWidth"}
  - {class: com.mdimension.jchronic.tags.Grabber, method: scanForAll, match: "(Token token, Options options)", note: "Grabber.scanForAll"}
  - {class: com.mdimension.jchronic.utils.Range, method: getEnd, match: "()", note: "Range.getEnd"}
  - {class: com.mdimension.jchronic.Options, method: setDebug, match: "(boolean debug)", note: "Options.setDebug"}
  - {class: com.mdimension.jchronic.handlers.Handler, method: getHandler, match: "()", note: "Handler.getHandler"}
  - {class: com.mdimension.jchronic.repeaters.IntegerRepeaterDayPortion, method: createRange, match: "(Integer type)", note: "IntegerRepeaterDayPortion.createRange"}
  - {class: com.mdimension.jchronic.tags.Ordinal, method: scan, match: "(List<Token> tokens, Options options)", note: "Ordinal.scan"}
  - {class: com.mdimension.jchronic.utils.StringUtils, method: integerValue, match: "(String str)", note: "StringUtils.integerValue"}
  - {class: com.mdimension.jchronic.Options, method: isDebug, match: "()", note: "Options.isDebug"}
  - {class: com.mdimension.jchronic.handlers.HandlerPattern, method: isOptional, match: "()", note: "HandlerPattern.isOptional"}
  - {class: com.mdimension.jchronic.repeaters.IntegerRepeaterDayPortion, method: _getWidth, match: "(Range range)", note: "IntegerRepeaterDayPortion._getWidth"}
  - {class: com.mdimension.jchronic.tags.Ordinal, method: scan, match: "(Token token, Options options)", note: "Ordinal.scan"}
  - {class: com.mdimension.jchronic.utils.Span, method: getBeginCalendar, match: "()", note: "Span.getBeginCalendar"}
  - {class: com.mdimension.jchronic.handlers.ORGRHandler, method: handle, match: "(List<Token> tokens, Options options)", note: "ORGRHandler.handle"}
  - {class: com.mdimension.jchronic.repeaters.RepeaterDay, method: _nextSpan, match: "(PointerType pointer)", note: "RepeaterDay._nextSpan"}
  - {class: com.mdimension.jchronic.tags.OrdinalDay, method: scan, match: "(Token token)", note: "OrdinalDay.scan"}
  - {class: com.mdimension.jchronic.utils.Span, method: getEndCalendar, match: "()", note: "Span.getEndCalendar"}
  - {class: com.mdimension.jchronic.handlers.ORSRHandler, method: handle, match: "(List<Token> tokens, Options options)", note: "ORSRHandler.handle"}
  - {class: com.mdimension.jchronic.repeaters.RepeaterDay, method: _thisSpan, match: "(PointerType pointer)", note: "RepeaterDay._thisSpan"}
  - {class: com.mdimension.jchronic.tags.Pointer, method: scan, match: "(List<Token> tokens, Options options)", note: "Pointer.scan"}
  - {class: com.mdimension.jchronic.utils.Tick, method: isAmbiguous, match: "()", note: "Tick.isAmbiguous"}
  - {class: com.mdimension.jchronic.handlers.PSRHandler, method: handle, match: "(List<Token> tokens, Options options)", note: "PSRHandler.handle"}
  - {class: com.mdimension.jchronic.repeaters.RepeaterDayName, method: _nextSpan, match: "(PointerType pointer)", note: "RepeaterDayName._nextSpan"}
  - {class: com.mdimension.jchronic.tags.Pointer, method: scanForAll, match: "(Token token, Options options)", note: "Pointer.scanForAll"}
  - {class: com.mdimension.jchronic.utils.Tick, method: setTime, match: "(int time)", note: "Tick.setTime"}
  - {class: com.mdimension.jchronic.handlers.RGRHandler, method: handle, match: "(List<Token> tokens, Options options)", note: "RGRHandler.handle"}
