# Curated performance-mutation sites for morpheus-core (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants morpheus-core --source data/external-src/<checkout> \
#       --sites data/projects/morpheus-core/mutation_sites.yaml

package_root: com.zavtech.morpheus

sites:
  - {class: com.zavtech.morpheus.array.ArrayBuilder, method: of, match: "(int initialLength)", note: "ArrayBuilder.of"}
  - {class: com.zavtech.morpheus.frame.DataFrameAsserts, method: assertEquals, match: "(DataFrameVector<?,?,?,?,?> expected, DataFrameVector<?,?,?,?,?> actual)", note: "DataFrameAsserts.assertEquals"}
  - {class: com.zavtech.morpheus.index.IndexOfStrings, method: filter, match: "(Iterable<String> keys)", note: "IndexOfStrings.filter"}
  - {class: com.zavtech.morpheus.jama.Maths, method: hypot, match: "(double a, double b)", note: "Maths.hypot"}
  - {class: com.zavtech.morpheus.range.RangeOfDoubles, method: estimateSize, match: "()", note: "RangeOfDoubles.estimateSize"}
  - {class: com.zavtech.morpheus.reference.XDataFrame, method: parallel, match: "()", note: "XDataFrame.parallel"}
  - {class: com.zavtech.morpheus.sink.CsvSinkOptions, method: setTitle, match: "(String title)", note: "CsvSinkOptions.setTitle"}
  - {class: com.zavtech.morpheus.source.CsvSource, method: getFrame, match: "()", note: "CsvSource.getFrame"}
  - {class: com.zavtech.morpheus.stats.AutoCorrelation, method: getN, match: "()", note: "AutoCorrelation.getN"}
  - {class: com.zavtech.morpheus.util.Comparators, method: getDefaultComparator, match: "(Class<T> type)", note: "Comparators.getDefaultComparator"}
  - {class: com.zavtech.morpheus.array.ArrayBuilder, method: of, match: "(int initialLength, Class<T> type)", note: "ArrayBuilder.of"}
  - {class: com.zavtech.morpheus.frame.DataFrameAsserts, method: assertEqualStructure, match: "(DataFrame<?,?> actual, DataFrame<?,?> expected)", note: "DataFrameAsserts.assertEqualStructure"}
  - {class: com.zavtech.morpheus.index.IndexOfStrings, method: filter, match: "(Predicate<String> predicate)", note: "IndexOfStrings.filter"}
  - {class: com.zavtech.morpheus.jama.CholeskyDecomposition, method: getR, match: "()", note: "CholeskyDecomposition.getR"}
  - {class: com.zavtech.morpheus.range.RangeOfDoubles, method: isAscending, match: "()", note: "RangeOfDoubles.isAscending"}
  - {class: com.zavtech.morpheus.reference.XDataFrame, method: sequential, match: "()", note: "XDataFrame.sequential"}
  - {class: com.zavtech.morpheus.sink.CsvSinkOptions, method: setNullText, match: "(String nullText)", note: "CsvSinkOptions.setNullText"}
  - {class: com.zavtech.morpheus.source.CsvSource, method: run, match: "()", note: "CsvSource.run"}
  - {class: com.zavtech.morpheus.stats.AutoCorrelation, method: getValue, match: "()", note: "AutoCorrelation.getValue"}
  - {class: com.zavtech.morpheus.util.ListenerList, method: addListener, match: "(T listener)", note: "ListenerList.addListener"}
  - {class: com.zavtech.morpheus.array.ArrayCollector, method: ofInts, match: "()", note: "ArrayCollector.ofInts"}
  - {class: com.zavtech.morpheus.frame.DataFrameEvent, method: createRowAdd, match: "(DataFrame<X,Y> frame, Array<X> rows)", note: "DataFrameEvent.createRowAdd"}
  - {class: com.zavtech.morpheus.index.IndexFactoryDefault, method: create, match: "(Iterable<K> keys)", note: "IndexFactoryDefault.create"}
  - {class: com.zavtech.morpheus.jama.CholeskyDecomposition, method: isSPD, match: "()", note: "CholeskyDecomposition.isSPD"}
  - {class: com.zavtech.morpheus.range.RangeOfInts, method: estimateSize, match: "()", note: "RangeOfInts.estimateSize"}
  - {class: com.zavtech.morpheus.reference.XDataFrameAxisStats, method: isRow, match: "()", note: "XDataFrameAxisStats.isRow"}
  - {class: com.zavtech.morpheus.sink.DbSinkOptions, method: getColumnMappings, match: "()", note: "DbSinkOptions.getColumnMappings"}
  - {class: com.zavtech.morpheus.source.CsvSourceOptions, method: validate, match: "()", note: "CsvSourceOptions.validate"}
  - {class: com.zavtech.morpheus.stats.Correlation, method: getValue, match: "()", note: "Correlation.getValue"}
  - {class: com.zavtech.morpheus.util.ListenerList, method: removeListener, match: "(T listener)", note: "ListenerList.removeListener"}
  - {class: com.zavtech.morpheus.array.ArrayCollector, method: ofInts, match: "(int initialCapacity)", note: "ArrayCollector.ofInts"}
  - {class: com.zavtech.morpheus.frame.DataFrameEvent, method: createRowRemove, match: "(DataFrame<X,Y> frame, Array<X> rows)", note: "DataFrameEvent.createRowRemove"}
  - {class: com.zavtech.morpheus.index.IndexFactoryDefault, method: create, match: "(Class<K> keyType, int initialSize)", note: "IndexFactoryDefault.create"}
  - {class: com.zavtech.morpheus.jama.EigenDecomposition, method: getV, match: "()", note: "EigenDecomposition.getV"}
