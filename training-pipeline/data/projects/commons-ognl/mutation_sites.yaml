# Curated performance-mutation sites for commons-ognl (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants commons-ognl --source data/external-src/<checkout> \
#       --sites data/projects/commons-ognl/mutation_sites.yaml

package_root: org.apache.commons

sites:
  - {class: org.apache.commons.ognl.ASTList, method: getValueBody, match: "( OgnlContext context, Object source )", note: "ASTList.getValueBody"}
  - {class: org.apache.commons.ognl.ASTList, method: getGetterClass, match: "()", note: "ASTList.getGetterClass"}
  - {class: org.apache.commons.ognl.ASTMap, method: setClassName, match: "( String value )", note: "ASTMap.setClassName"}
  - {class: org.apache.commons.ognl.ASTMap, method: getValueBody, match: "( OgnlContext context, Object source )", note: "ASTMap.getValueBody"}
  - {class: org.apache.commons.ognl.ArrayElementsAccessor, method: getElements, match: "( final Object target )", note: "ArrayElementsAccessor.getElements"}
  - {class: org.apache.commons.ognl.ArrayElementsAccessor, method: hasMoreElements, match: "()", note: "ArrayElementsAccessor.hasMoreElements"}
  - {class: org.apache.commons.ognl.ArrayPropertyAccessor, method: getProperty, match: "( Map<String, Object> context, Object target, Object name )", note: "ArrayPropertyAccessor.getProperty"}
  - {class: org.apache.commons.ognl.ArrayPropertyAccessor, method: setProperty, match: "( Map<String, Object> context, Object target, Object name, Object value )", note: "ArrayPropertyAccessor.setProperty"}
  - {class: org.apache.commons.ognl.JJTOgnlParserState, method: nodeCreated, match: "()", note: "JJTOgnlParserState.nodeCreated"}
  - {class: org.apache.commons.ognl.JJTOgnlParserState, method: reset, match: "()", note: "JJTOgnlParserState.reset"}
  - {class: org.apache.commons.ognl.ListPropertyAccessor, method: getProperty, match: "( Map<String, Object> context, Object target, Object name )", note: "ListPropertyAccessor.getProperty"}
  - {class: org.apache.commons.ognl.ListPropertyAccessor, method: setProperty, match: "( Map<String, Object> context, Object target, Object name, Object value )", note: "ListPropertyAccessor.setProperty"}
  - {class: org.apache.commons.ognl.MapElementsAccessor, method: getElements, match: "( Object target )", note: "MapElementsAccessor.getElements"}
  - {class: org.apache.commons.ognl.MapPropertyAccessor, method: getProperty, match: "( Map<String, Object> context, Object target, Object name )", note: "MapPropertyAccessor.getProperty"}
  - {class: org.apache.commons.ognl.MapPropertyAccessor, method: setProperty, match: "( Map<String, Object> context, Object target, Object name, Object value )", note: "MapPropertyAccessor.setProperty"}
  - {class: org.apache.commons.ognl.NumberElementsAccessor, method: getElements, match: "( final Object target )", note: "NumberElementsAccessor.getElements"}
  - {class: org.apache.commons.ognl.NumberElementsAccessor, method: hasMoreElements, match: "()", note: "NumberElementsAccessor.hasMoreElements"}
  - {class: org.apache.commons.ognl.SetPropertyAccessor, method: getProperty, match: "( Map<String, Object> context, Object target, Object name )", note: "SetPropertyAccessor.getProperty"}
  - {class: org.apache.commons.ognl.ToStringVisitor, method: visit, match: "( ASTSequence node, StringBuilder data )", note: "ToStringVisitor.visit"}
  - {class: org.apache.commons.ognl.ToStringVisitor, method: visit, match: "( ASTAssign node, StringBuilder data )", note: "ToStringVisitor.visit"}
  - {class: org.apache.commons.ognl.internal.ConcurrentHashMapCache, method: clear, match: "()", note: "ConcurrentHashMapCache.clear"}
  - {class: org.apache.commons.ognl.internal.ConcurrentHashMapCache, method: getSize, match: "()", note: "ConcurrentHashMapCache.getSize"}
  - {class: org.apache.commons.ognl.internal.ConcurrentHashMapCacheFactory, method: createCache, match: "( CacheEntryFactory<K, V> entryFactory )", note: "ConcurrentHashMapCacheFactory.createCache"}
  - {class: org.apache.commons.ognl.internal.ConcurrentHashMapCacheFactory, method: createClassCache, match: "()", note: "ConcurrentHashMapCacheFactory.createClassCache"}
  - {class: org.apache.commons.ognl.internal.ConcurrentHashMapClassCache, method: setClassInspector, match: "( ClassCacheInspector inspector )", note: "ConcurrentHashMapClassCache.setClassInspector"}
  - {class: org.apache.commons.ognl.internal.HashMapCache, method: clear, match: "()", note: "HashMapCache.clear"}
  - {class: org.apache.commons.ognl.internal.HashMapCache, method: getSize, match: "()", note: "HashMapCache.getSize"}
  - {class: org.apache.commons.ognl.internal.HashMapCacheFactory, method: createCache, match: "( CacheEntryFactory<K, V> entryFactory )", note: "HashMapCacheFactory.createCache"}
  - {class: org.apache.commons.ognl.internal.HashMapCacheFactory, method: createClassCache, match: "()", note: "HashMapCacheFactory.createClassCache"}
  - {class: org.apache.commons.ognl.internal.HashMapClassCache, method: setClassInspector, match: "( ClassCacheInspector inspector )", note: "HashMapClassCache.setClassInspector"}
  - {class: org.apache.commons.ognl.ASTAdd, method: jjtClose, match: "()", note: "ASTAdd.jjtClose"}
  - {class: org.apache.commons.ognl.ASTAdd, method: getValueBody, match: "( OgnlContext context, Object source )", note: "ASTAdd.getValueBody"}
  - {class: org.apache.commons.ognl.ASTAnd, method: jjtClose, match: "()", note: "ASTAnd.jjtClose"}
