# Curated performance-mutation sites for jsonstream (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jsonstream --source data/external-src/<checkout> \
#       --sites data/projects/jsonstream/mutation_sites.yaml

package_root: com.itranswarp.jsonstream

sites:
  - {class: com.itranswarp.jsonstream.BeanObjectMapper, method: toObject, match: "(String path, Map<String, Object> jsonObjectMap, Class<?> clazz, TypeAdapters typeAdapters)", note: "BeanObjectMapper.toObject"}
  - {class: com.itranswarp.jsonstream.adapter.DateTimeTypeAdapter, method: deserialize, match: "(String s)", note: "DateTimeTypeAdapter.deserialize"}
  - {class: com.itranswarp.jsonstream.format.Alpha, method: validate, match: "(String value)", note: "Alpha.validate"}
  - {class: com.itranswarp.jsonstream.validator.impl.NumberValidator, method: validate, match: "(Double obj, String path, String name)", note: "NumberValidator.validate"}
  - {class: com.itranswarp.jsonstream.BeanObjectMapper, method: newInstance, match: "(Class<?> clazz, Map<String, Object> jsonObject) throws Exception", note: "BeanObjectMapper.newInstance"}
  - {class: com.itranswarp.jsonstream.adapter.DateTimeTypeAdapter, method: serialize, match: "(LocalDateTime t)", note: "DateTimeTypeAdapter.serialize"}
  - {class: com.itranswarp.jsonstream.format.Email, method: validate, match: "(String value)", note: "Email.validate"}
  - {class: com.itranswarp.jsonstream.validator.impl.StringValidator, method: validate, match: "(String obj, String path, String name)", note: "StringValidator.validate"}
  - {class: com.itranswarp.jsonstream.JsonBuilder, method: registerTypeAdapter, match: "(Class<T> clazz, TypeAdapter<T> typeAdapter)", note: "JsonBuilder.registerTypeAdapter"}
  - {class: com.itranswarp.jsonstream.adapter.DateTypeAdapter, method: deserialize, match: "(String s)", note: "DateTypeAdapter.deserialize"}
  - {class: com.itranswarp.jsonstream.format.Hex, method: validate, match: "(String value)", note: "Hex.validate"}
  - {class: com.itranswarp.jsonstream.validator.impl.BooleanValidator, method: validate, match: "(Boolean obj, String path, String name)", note: "BooleanValidator.validate"}
  - {class: com.itranswarp.jsonstream.JsonBuilder, method: useJsonObjectFactory, match: "(JsonObjectFactory jsonObjectFactory)", note: "JsonBuilder.useJsonObjectFactory"}
  - {class: com.itranswarp.jsonstream.adapter.DateTypeAdapter, method: serialize, match: "(LocalDate t)", note: "DateTypeAdapter.serialize"}
  - {class: com.itranswarp.jsonstream.format.IPv4, method: validate, match: "(String value)", note: "IPv4.validate"}
  - {class: com.itranswarp.jsonstream.validator.impl.IntegerValidator, method: validate, match: "(Long obj, String path, String name)", note: "IntegerValidator.validate"}
  - {class: com.itranswarp.jsonstream.JsonBuilder, method: useJsonArrayFactory, match: "(JsonArrayFactory jsonArrayFactory)", note: "JsonBuilder.useJsonArrayFactory"}
  - {class: com.itranswarp.jsonstream.adapter.TimeTypeAdapter, method: deserialize, match: "(String s)", note: "TimeTypeAdapter.deserialize"}
  - {class: com.itranswarp.jsonstream.format.LowerCase, method: validate, match: "(String value)", note: "LowerCase.validate"}
  - {class: com.itranswarp.jsonstream.JsonBuilder, method: useObjectMapper, match: "(ObjectMapper objectMapper)", note: "JsonBuilder.useObjectMapper"}
  - {class: com.itranswarp.jsonstream.adapter.TimeTypeAdapter, method: serialize, match: "(LocalTime t)", note: "TimeTypeAdapter.serialize"}
  - {class: com.itranswarp.jsonstream.format.NonBlank, method: validate, match: "(String value)", note: "NonBlank.validate"}
  - {class: com.itranswarp.jsonstream.JsonBuilder, method: createReader, match: "(String str)", note: "JsonBuilder.createReader"}
  - {class: com.itranswarp.jsonstream.format.Numeric, method: validate, match: "(String value)", note: "Numeric.validate"}
  - {class: com.itranswarp.jsonstream.JsonBuilder, method: createReader, match: "(Reader reader)", note: "JsonBuilder.createReader"}
  - {class: com.itranswarp.jsonstream.format.UpperCase, method: validate, match: "(String value)", note: "UpperCase.validate"}
  - {class: com.itranswarp.jsonstream.JsonBuilder, method: createReader, match: "(InputStream input)", note: "JsonBuilder.createReader"}
  - {class: com.itranswarp.jsonstream.JsonBuilder, method: createWriter, match: "()", note: "JsonBuilder.createWriter"}
  - {class: com.itranswarp.jsonstream.JsonBuilder, method: createWriter, match: "(Writer writer)", note: "JsonBuilder.createWriter"}
  - {class: com.itranswarp.jsonstream.JsonBuilder, method: createWriter, match: "(OutputStream output)", note: "JsonBuilder.createWriter"}
  - {class: com.itranswarp.jsonstream.PropertySetters, method: isRequired, match: "()", note: "PropertySetters.isRequired"}
  - {class: com.itranswarp.jsonstream.PropertySetters, method: getPropertyType, match: "()", note: "PropertySetters.getPropertyType"}
  - {class: com.itranswarp.jsonstream.PropertySetters, method: getGenericType, match: "()", note: "PropertySetters.getGenericType"}
  - {class: com.itranswarp.jsonstream.PropertySetters, method: setProperty, match: "(Object bean, Object value) throws Exception", note: "PropertySetters.setProperty"}
  - {class: com.itranswarp.jsonstream.PropertySetters, method: getValidators, match: "()", note: "PropertySetters.getValidators"}
  - {class: com.itranswarp.jsonstream.PropertySetters, method: isRequired, match: "()", note: "PropertySetters.isRequired"}
  - {class: com.itranswarp.jsonstream.PropertySetters, method: getPropertyType, match: "()", note: "PropertySetters.getPropertyType"}
  - {class: com.itranswarp.jsonstream.PropertySetters, method: getGenericType, match: "()", note: "PropertySetters.getGenericType"}
  - {class: com.itranswarp.jsonstream.PropertySetters, method: setProperty, match: "(Object bean, Object value) throws Exception", note: "PropertySetters.setProperty"}
  - {class: com.itranswarp.jsonstream.PropertySetters, method: getValidators, match: "()", note: "PropertySetters.getValidators"}
  - {class: com.itranswarp.jsonstream.CharReader, method: hasMore, match: "() throws IOException", note: "CharReader.hasMore"}
  - {class: com.itranswarp.jsonstream.CharReader, method: peek, match: "() throws IOException", note: "CharReader.peek"}
  - {class: com.itranswarp.jsonstream.JsonParseException, method: getErrorIndex, match: "()", note: "JsonParseException.getErrorIndex"}
  - {class: com.itranswarp.jsonstream.JsonReader, method: parse, match: "(Class<T> clazz) throws IOException", note: "JsonReader.parse"}
  - {class: com.itranswarp.jsonstream.JsonReader, method: parse, match: "() throws IOException", note: "JsonReader.parse"}
  - {class: com.itranswarp.jsonstream.PropertyGetters, method: getProperty, match: "(Object obj) throws Exception", note: "PropertyGetters.getProperty"}
  - {class: com.itranswarp.jsonstream.PropertyGetters, method: getProperty, match: "(Object obj) throws Exception", note: "PropertyGetters.getProperty"}
  - {class: com.itranswarp.jsonstream.TypeAdapters, method: registerTypeAdapter, match: "(Class<T> clazz, TypeAdapter<T> typeAdapter)", note: "TypeAdapters.registerTypeAdapter"}
