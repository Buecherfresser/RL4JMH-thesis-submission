  - {class: com.fasterxml.jackson.core.io.CharTypes, method: hexToChar, match: "(int ch)", note: "CharTypes.hexToChar"}
  - {class: com.fasterxml.jackson.core.io.NumberInput, method: parseAsInt, match: "(String s, int def)", note: "NumberInput.parseAsInt"}
  - {class: com.fasterxml.jackson.core.io.NumberInput, method: parseAsLong, match: "(String s, long def)", note: "NumberInput.parseAsLong"}
  - {class: com.fasterxml.jackson.core.io.NumberInput, method: parseBigDecimal, match: "(final String s) throws NumberFormatException", note: "NumberInput.parseBigDecimal"}
  - {class: com.fasterxml.jackson.core.io.NumberInput, method: parseBigInteger, match: "(final String s) throws NumberFormatException", note: "NumberInput.parseBigInteger"}
