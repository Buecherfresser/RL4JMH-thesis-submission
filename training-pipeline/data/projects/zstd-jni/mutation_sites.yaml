# Curated performance-mutation sites for zstd-jni (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants zstd-jni --source data/external-src/<checkout> \
#       --sites data/projects/zstd-jni/mutation_sites.yaml

package_root: com.github.luben.zstd

sites:
  - {class: com.github.luben.zstd.RecyclingBufferPool, method: release, match: "(ByteBuffer buffer)", note: "RecyclingBufferPool.release"}
  - {class: com.github.luben.zstd.util.Native, method: assumeLoaded, match: "()", note: "Native.assumeLoaded"}
  - {class: com.github.luben.zstd.ZstdBufferDecompressingStream, method: refill, match: "(ByteBuffer toRefill)", note: "ZstdBufferDecompressingStream.refill"}
