# Curated performance-mutation sites for jitrex (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jitrex --source data/external-src/<checkout> \
#       --sites data/projects/jitrex/mutation_sites.yaml

package_root: com.humio.jitrex

sites:
  - {class: com.humio.jitrex.IllegalRegexException, method: getReason, match: "()", note: "IllegalRegexException.getReason"}
  - {class: com.humio.jitrex.compiler.RCompiler, method: genShiftTable, match: "(RConstNode regexConst)", note: "RCompiler.genShiftTable"}
  - {class: com.humio.jitrex.form.DecimalNumberFormatterSpan, method: printf, match: "(Writer out, int v)", note: "DecimalNumberFormatterSpan.printf"}
  - {class: com.humio.jitrex.jvm.RJavaClassCustomizer, method: customInitAction, match: "(CodeGenerator gen) throws IOException", note: "RJavaClassCustomizer.customInitAction"}
  - {class: com.humio.jitrex.parser.RParser, method: parse, match: "(String regex)", note: "RParser.parse"}
  - {class: com.humio.jitrex.re2.Unicode, method: isPrint, match: "(int r)", note: "Unicode.isPrint"}
  - {class: com.humio.jitrex.tree.CharSet, method: normalize, match: "(char[] range)", note: "CharSet.normalize"}
  - {class: com.humio.jitrex.util.CaseInsensitiveRegex, method: init, match: "(CharSequence subject, int off, int len)", note: "CaseInsensitiveRegex.init"}
  - {class: com.humio.jitrex.Matcher, method: reset, match: "()", note: "Matcher.reset"}
  - {class: com.humio.jitrex.compiler.RCompiler, method: evalREmpty, match: "(REmptyNode empty)", note: "RCompiler.evalREmpty"}
  - {class: com.humio.jitrex.form.DecimalNumberFormatterSpan, method: printf, match: "(Writer out, long v)", note: "DecimalNumberFormatterSpan.printf"}
  - {class: com.humio.jitrex.jvm.RJavaClassCustomizer, method: customConstructorAction, match: "(CodeGenerator gen) throws IOException", note: "RJavaClassCustomizer.customConstructorAction"}
  - {class: com.humio.jitrex.parser.RParser, method: parse, match: "(String regex, boolean noimplicit)", note: "RParser.parse"}
  - {class: com.humio.jitrex.tree.CharSet, method: toLowerCase, match: "()", note: "CharSet.toLowerCase"}
  - {class: com.humio.jitrex.util.CaseInsensitiveRegex, method: getIndex, match: "(int handle)", note: "CaseInsensitiveRegex.getIndex"}
  - {class: com.humio.jitrex.Matcher, method: reset, match: "(Map<String,String> vars)", note: "Matcher.reset"}
  - {class: com.humio.jitrex.compiler.RDebugMachine, method: newVar, match: "(String name, boolean begin)", note: "RDebugMachine.newVar"}
  - {class: com.humio.jitrex.form.FParser, method: parse, match: "(Vector<Span> acc, char[] buf, int off, int last, Vector<String> varAcc)", note: "FParser.parse"}
  - {class: com.humio.jitrex.jvm.RJavaClassMachine, method: alloc, match: "()", note: "RJavaClassMachine.alloc"}
  - {class: com.humio.jitrex.tree.RAltNode, method: getNCells, match: "()", note: "RAltNode.getNCells"}
  - {class: com.humio.jitrex.util.Formatter, method: printf, match: "(Formatter form, ArgList list)", note: "Formatter.printf"}
  - {class: com.humio.jitrex.Pattern, method: quote, match: "(String s)", note: "Pattern.quote"}
  - {class: com.humio.jitrex.compiler.RDebugMachine, method: newLabel, match: "()", note: "RDebugMachine.newLabel"}
  - {class: com.humio.jitrex.form.FParser, method: parse, match: "(String form, Vector<String> varAcc)", note: "FParser.parse"}
  - {class: com.humio.jitrex.jvm.RJavaClassMachine, method: free, match: "(int loc)", note: "RJavaClassMachine.free"}
  - {class: com.humio.jitrex.tree.RAltNode, method: prepare, match: "(int addMaxLeft, int addMinLeft)", note: "RAltNode.prepare"}
  - {class: com.humio.jitrex.util.Formatter, method: printf, match: "(String form, ArgList list)", note: "Formatter.printf"}
  - {class: com.humio.jitrex.Pattern, method: flags, match: "()", note: "Pattern.flags"}
  - {class: com.humio.jitrex.form.HexNumberFormatterSpan, method: printf, match: "(Writer out, int v)", note: "HexNumberFormatterSpan.printf"}
  - {class: com.humio.jitrex.tree.RAnyNode, method: eval, match: "(RContext context)", note: "RAnyNode.eval"}
  - {class: com.humio.jitrex.util.ProxyRegex, method: getVariableHandle, match: "(String var, boolean begin)", note: "ProxyRegex.getVariableHandle"}
  - {class: com.humio.jitrex.RegexRuntimeLimitException, method: getBacktrackCount, match: "()", note: "RegexRuntimeLimitException.getBacktrackCount"}
  - {class: com.humio.jitrex.form.HexNumberFormatterSpan, method: printf, match: "(Writer out, char v)", note: "HexNumberFormatterSpan.printf"}
  - {class: com.humio.jitrex.tree.RBoundaryNode, method: prepare, match: "(int addMaxLeft, int addMinLeft)", note: "RBoundaryNode.prepare"}
  - {class: com.humio.jitrex.util.ProxyRegex, method: getExtVariableHandle, match: "(String var)", note: "ProxyRegex.getExtVariableHandle"}
  - {class: com.humio.jitrex.form.NumberFormatterSpan, method: printf, match: "(Writer out, int v)", note: "NumberFormatterSpan.printf"}
  - {class: com.humio.jitrex.tree.RBoundaryNode, method: findPrefix, match: "(CharSet tailPrefix)", note: "RBoundaryNode.findPrefix"}
  - {class: com.humio.jitrex.util.Replacer, method: main, match: "(String[] args)", note: "Replacer.main"}
  - {class: com.humio.jitrex.form.NumberFormatterSpan, method: printf, match: "(Writer out, long v)", note: "NumberFormatterSpan.printf"}
  - {class: com.humio.jitrex.tree.RCharClassNode, method: processFlags, match: "(int flags)", note: "RCharClassNode.processFlags"}
  - {class: com.humio.jitrex.util.Replacer, method: cloneReplacer, match: "()", note: "Replacer.cloneReplacer"}
  - {class: com.humio.jitrex.form.OctalNumberFormatterSpan, method: printf, match: "(Writer out, int v)", note: "OctalNumberFormatterSpan.printf"}
  - {class: com.humio.jitrex.tree.RCharClassNode, method: eval, match: "(RContext context)", note: "RCharClassNode.eval"}
  - {class: com.humio.jitrex.form.OctalNumberFormatterSpan, method: printf, match: "(Writer out, char v)", note: "OctalNumberFormatterSpan.printf"}
  - {class: com.humio.jitrex.tree.RConstNode, method: processFlags, match: "(int flags)", note: "RConstNode.processFlags"}
  - {class: com.humio.jitrex.form.RealNumberFormatterSpan, method: printf, match: "(Writer out, double v)", note: "RealNumberFormatterSpan.printf"}
  - {class: com.humio.jitrex.tree.RConstNode, method: eval, match: "(RContext context)", note: "RConstNode.eval"}
  - {class: com.humio.jitrex.form.RealNumberFormatterSpan, method: printf, match: "(Writer out, BigDecimal v)", note: "RealNumberFormatterSpan.printf"}
  - {class: com.humio.jitrex.tree.REmptyNode, method: findPrefix, match: "(CharSet tailPrefix)", note: "REmptyNode.findPrefix"}
  - {class: com.humio.jitrex.form.StringSpan, method: print, match: "(Writer out, int[] argPtr, Object[] args)", note: "StringSpan.print"}
