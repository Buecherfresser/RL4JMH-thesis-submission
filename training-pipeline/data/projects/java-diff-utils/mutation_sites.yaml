  - {class: com.github.difflib.algorithm.myers.MyersDiffWithLinearSpace, method: computeDiff, match: "(", note: "MyersDiffWithLinearSpace.computeDiff"}
  - {class: com.github.difflib.patch.DeleteDelta, method: withChunks, match: "(Chunk<T> original, Chunk<T> revised)", note: "DeleteDelta.withChunks"}
  - {class: com.github.difflib.text.DiffRowGenerator, method: splitStringPreserveDelimiter, match: "(String str, Pattern SPLIT_PATTERN)", note: "DiffRowGenerator.splitStringPreserveDelimiter"}
  - {class: com.github.difflib.unifieddiff.UnifiedDiffReader, method: processLine, match: "(String line) throws UnifiedDiffParserException", note: "UnifiedDiffReader.processLine"}
  - {class: com.github.difflib.algorithm.myers.MyersDiffWithLinearSpace, method: factory, match: "()", note: "MyersDiffWithLinearSpace.factory"}
  - {class: com.github.difflib.patch.EqualDelta, method: applyTo, match: "(List<T> target) throws PatchFailedException", note: "EqualDelta.applyTo"}
  - {class: com.github.difflib.text.DiffRowGenerator, method: generateDiffRows, match: "(List<String> original, List<String> revised)", note: "DiffRowGenerator.generateDiffRows"}
  - {class: com.github.difflib.algorithm.myers.MyersDiffWithLinearSpace, method: create, match: "()", note: "MyersDiffWithLinearSpace.create"}
  - {class: com.github.difflib.patch.EqualDelta, method: restore, match: "(List<T> target)", note: "EqualDelta.restore"}
  - {class: com.github.difflib.text.deltamerge.InlineDeltaMergeInfo, method: getDeltas, match: "()", note: "InlineDeltaMergeInfo.getDeltas"}
  - {class: com.github.difflib.algorithm.myers.PathNode, method: isSnake, match: "()", note: "PathNode.isSnake"}
