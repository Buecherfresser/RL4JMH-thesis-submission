# Curated performance-mutation sites for dataframe-ec (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants dataframe-ec --source data/external-src/<checkout> \
#       --sites data/projects/dataframe-ec/mutation_sites.yaml

package_root: io.github.vmzakharov

sites:
