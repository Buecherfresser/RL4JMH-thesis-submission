# Curated performance-mutation sites for lsmtree (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants lsmtree --source data/external-src/<checkout> \
#       --sites data/projects/lsmtree/mutation_sites.yaml

package_root: com.indeed.lsmtree

sites:
