# Curated performance-mutation sites for univocity-parsers (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants univocity-parsers --source data/external-src/<checkout> \
#       --sites data/projects/univocity-parsers/mutation_sites.yaml

package_root: com.univocity.parsers

sites:
