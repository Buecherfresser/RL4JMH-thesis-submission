# Curated performance-mutation sites for qlexpress (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants qlexpress --source data/external-src/<checkout> \
#       --sites data/projects/qlexpress/mutation_sites.yaml

package_root: com.alibaba.qlexpress4

sites:
  - {class: com.alibaba.qlexpress4.CheckOptions, method: getCheckStrategy, match: "()", note: "CheckOptions.getCheckStrategy"}
  - {class: com.alibaba.qlexpress4.aparser.BuiltInTypesSet, method: getCls, match: "(String lexeme)", note: "BuiltInTypesSet.getCls"}
  - {class: com.alibaba.qlexpress4.api.BatchAddFunctionResult, method: getSucc, match: "()", note: "BatchAddFunctionResult.getSucc"}
  - {class: com.alibaba.qlexpress4.exception.ExMessageUtil, method: getMessage, match: "()", note: "ExMessageUtil.getMessage"}
  - {class: com.alibaba.qlexpress4.member.FieldHandler, method: preHandleAlias, match: "(Class<?> baseClass, String propertyName)", note: "FieldHandler.preHandleAlias"}
  - {class: com.alibaba.qlexpress4.operator.BlackOperatorCheckStrategy, method: isAllowed, match: "(String operator)", note: "BlackOperatorCheckStrategy.isAllowed"}
  - {class: com.alibaba.qlexpress4.proxy.QLambdaInvocationHandler, method: invoke, match: "(Object proxy, Method method, Object[] args)", note: "QLambdaInvocationHandler.invoke"}
  - {class: com.alibaba.qlexpress4.runtime.data.ArrayItemValue, method: setInner, match: "(Object newValue)", note: "ArrayItemValue.setInner"}
  - {class: com.alibaba.qlexpress4.security.StrategyBlackList, method: check, match: "(Member member)", note: "StrategyBlackList.check"}
  - {class: com.alibaba.qlexpress4.utils.BasicUtil, method: transToPrimitive, match: "(Class<?> clazz)", note: "BasicUtil.transToPrimitive"}
  - {class: com.alibaba.qlexpress4.CheckOptions, method: isDisableFunctionCalls, match: "()", note: "CheckOptions.isDisableFunctionCalls"}
  - {class: com.alibaba.qlexpress4.aparser.OutFunctionVisitor, method: exist, match: "(String varName)", note: "OutFunctionVisitor.exist"}
  - {class: com.alibaba.qlexpress4.api.BatchAddFunctionResult, method: getFail, match: "()", note: "BatchAddFunctionResult.getFail"}
  - {class: com.alibaba.qlexpress4.exception.ExMessageUtil, method: getSnippet, match: "()", note: "ExMessageUtil.getSnippet"}
  - {class: com.alibaba.qlexpress4.member.FieldHandler, method: gatherFieldRecursive, match: "(Class<?> baseClass, String propertyName)", note: "FieldHandler.gatherFieldRecursive"}
  - {class: com.alibaba.qlexpress4.operator.BlackOperatorCheckStrategy, method: getOperators, match: "()", note: "BlackOperatorCheckStrategy.getOperators"}
  - {class: com.alibaba.qlexpress4.runtime.data.ArrayItemValue, method: getSymbolName, match: "()", note: "ArrayItemValue.getSymbolName"}
  - {class: com.alibaba.qlexpress4.security.StrategyWhiteList, method: check, match: "(Member member)", note: "StrategyWhiteList.check"}
  - {class: com.alibaba.qlexpress4.utils.BasicUtil, method: numberPromoteLevel, match: "(Class<?> numCls)", note: "BasicUtil.numberPromoteLevel"}
  - {class: com.alibaba.qlexpress4.DefaultClassSupplier, method: getInstance, match: "()", note: "DefaultClassSupplier.getInstance"}
  - {class: com.alibaba.qlexpress4.aparser.OutFunctionVisitor, method: push, match: "()", note: "OutFunctionVisitor.push"}
  - {class: com.alibaba.qlexpress4.api.parsecache.LoadedParseCache, method: getModelVersion, match: "()", note: "LoadedParseCache.getModelVersion"}
  - {class: com.alibaba.qlexpress4.exception.lsp.Range, method: getStart, match: "()", note: "Range.getStart"}
  - {class: com.alibaba.qlexpress4.member.MethodHandler, method: getGetter, match: "(Class<?> clazz, String property)", note: "MethodHandler.getGetter"}
  - {class: com.alibaba.qlexpress4.operator.DefaultOperatorCheckStrategy, method: getInstance, match: "()", note: "DefaultOperatorCheckStrategy.getInstance"}
  - {class: com.alibaba.qlexpress4.runtime.data.ListItemValue, method: setInner, match: "(Object newValue)", note: "ListItemValue.setInner"}
  - {class: com.alibaba.qlexpress4.security.StrategyIsolation, method: getInstance, match: "()", note: "StrategyIsolation.getInstance"}
  - {class: com.alibaba.qlexpress4.utils.CacheUtil, method: isFunctionInterface, match: "(Class<?> clazz)", note: "CacheUtil.isFunctionInterface"}
  - {class: com.alibaba.qlexpress4.DefaultClassSupplier, method: loadCls, match: "(String clsQualifiedName)", note: "DefaultClassSupplier.loadCls"}
  - {class: com.alibaba.qlexpress4.aparser.QLParser, method: program, match: "()", note: "QLParser.program"}
  - {class: com.alibaba.qlexpress4.api.parsecache.LoadedParseCache, method: getProducerVersion, match: "()", note: "LoadedParseCache.getProducerVersion"}
  - {class: com.alibaba.qlexpress4.exception.lsp.Range, method: getEnd, match: "()", note: "Range.getEnd"}
  - {class: com.alibaba.qlexpress4.member.MethodHandler, method: isPreferredGetter, match: "(GetterCandidateMethod before, GetterCandidateMethod after)", note: "MethodHandler.isPreferredGetter"}
  - {class: com.alibaba.qlexpress4.operator.DefaultOperatorCheckStrategy, method: isAllowed, match: "(String operator)", note: "DefaultOperatorCheckStrategy.isAllowed"}
  - {class: com.alibaba.qlexpress4.runtime.data.ListItemValue, method: getSymbolName, match: "()", note: "ListItemValue.getSymbolName"}
  - {class: com.alibaba.qlexpress4.security.StrategyIsolation, method: check, match: "(Member member)", note: "StrategyIsolation.check"}
  - {class: com.alibaba.qlexpress4.utils.PrintlnUtils, method: printlnByCurDepth, match: "(int depth, String str, Consumer<String> debug)", note: "PrintlnUtils.printlnByCurDepth"}
  - {class: com.alibaba.qlexpress4.Express4Runner, method: getFunction, match: "(String functionName)", note: "Express4Runner.getFunction"}
  - {class: com.alibaba.qlexpress4.aparser.QLParser, method: importDeclaration, match: "()", note: "QLParser.importDeclaration"}
  - {class: com.alibaba.qlexpress4.api.parsecache.SerializableCatchEntry, method: getExceptionClassName, match: "()", note: "SerializableCatchEntry.getExceptionClassName"}
  - {class: com.alibaba.qlexpress4.exception.DefaultErrReporter, method: reportFormatWithCatch, match: "(Object catchObj, String errorCode, String format, Object... args)", note: "DefaultErrReporter.reportFormatWithCatch"}
  - {class: com.alibaba.qlexpress4.operator.WhiteOperatorCheckStrategy, method: isAllowed, match: "(String operator)", note: "WhiteOperatorCheckStrategy.isAllowed"}
  - {class: com.alibaba.qlexpress4.runtime.data.MapItemValue, method: setInner, match: "(Object newValue)", note: "MapItemValue.setInner"}
  - {class: com.alibaba.qlexpress4.security.StrategyOpen, method: getInstance, match: "()", note: "StrategyOpen.getInstance"}
  - {class: com.alibaba.qlexpress4.utils.PrintlnUtils, method: buildIndentString, match: "(int indent, String originStr)", note: "PrintlnUtils.buildIndentString"}
  - {class: com.alibaba.qlexpress4.Express4Runner, method: getCompileTimeFunction, match: "(String functionName)", note: "Express4Runner.getCompileTimeFunction"}
  - {class: com.alibaba.qlexpress4.aparser.QLParserBaseVisitor, method: visitTerminal, match: "(TerminalNode node)", note: "QLParserBaseVisitor.visitTerminal"}
  - {class: com.alibaba.qlexpress4.api.parsecache.SerializableCatchEntry, method: setExceptionClassName, match: "(String exceptionClassName)", note: "SerializableCatchEntry.setExceptionClassName"}
  - {class: com.alibaba.qlexpress4.exception.DefaultErrReporter, method: getScript, match: "()", note: "DefaultErrReporter.getScript"}
  - {class: com.alibaba.qlexpress4.operator.WhiteOperatorCheckStrategy, method: getOperators, match: "()", note: "WhiteOperatorCheckStrategy.getOperators"}
