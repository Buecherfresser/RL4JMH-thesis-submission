# Curated performance-mutation sites for parallelcolt (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants parallelcolt --source data/external-src/<checkout> \
#       --sites data/projects/parallelcolt/mutation_sites.yaml

package_root: cern.colt

sites:
  - {class: cern.colt.Arrays, method: ensureCapacity, match: "(byte[] array, int minCapacity)", note: "Arrays.ensureCapacity"}
  - {class: cern.colt.buffer.tboolean.BooleanBuffer, method: addAllOf, match: "(BooleanArrayList list)", note: "BooleanBuffer.addAllOf"}
  - {class: cern.colt.list.tboolean.BooleanArrayList, method: beforeInsert, match: "(int index, boolean element)", note: "BooleanArrayList.beforeInsert"}
  - {class: cern.colt.map.HashFunctions, method: hash, match: "(char value)", note: "HashFunctions.hash"}
  - {class: cern.colt.matrix.FormerFactory, method: create, match: "(final String format)", note: "FormerFactory.create"}
  - {class: cern.colt.Arrays, method: ensureCapacity, match: "(char[] array, int minCapacity)", note: "Arrays.ensureCapacity"}
  - {class: cern.colt.buffer.tboolean.BooleanBuffer, method: clear, match: "()", note: "BooleanBuffer.clear"}
  - {class: cern.colt.list.tboolean.BooleanArrayList, method: countSortFromTo, match: "(int from, int to)", note: "BooleanArrayList.countSortFromTo"}
  - {class: cern.colt.map.HashFunctions, method: hash, match: "(double value)", note: "HashFunctions.hash"}
  - {class: cern.colt.matrix.FormerFactory, method: form, match: "(double value)", note: "FormerFactory.form"}
  - {class: cern.colt.GenericPermuting, method: permutation, match: "(long p, int N)", note: "GenericPermuting.permutation"}
  - {class: cern.colt.buffer.tboolean.BooleanBuffer2D, method: addAllOf, match: "(BooleanArrayList x, BooleanArrayList y)", note: "BooleanBuffer2D.addAllOf"}
  - {class: cern.colt.list.tbyte.ByteArrayList, method: beforeInsert, match: "(int index, byte element)", note: "ByteArrayList.beforeInsert"}
  - {class: cern.colt.map.tdouble.OpenDoubleIntHashMap, method: clear, match: "()", note: "OpenDoubleIntHashMap.clear"}
  - {class: cern.colt.matrix.Transpose, method: netlib, match: "()", note: "Transpose.netlib"}
  - {class: cern.colt.GenericPermuting, method: permute, match: "(int[] list, int[] indexes)", note: "GenericPermuting.permute"}
  - {class: cern.colt.buffer.tboolean.BooleanBuffer2D, method: clear, match: "()", note: "BooleanBuffer2D.clear"}
  - {class: cern.colt.list.tbyte.ByteArrayList, method: binarySearchFromTo, match: "(byte key, int from, int to)", note: "ByteArrayList.binarySearchFromTo"}
  - {class: cern.colt.map.tdouble.OpenDoubleIntHashMap, method: containsKey, match: "(double key)", note: "OpenDoubleIntHashMap.containsKey"}
  - {class: cern.colt.matrix.io.MatrixInfo, method: isSparse, match: "()", note: "MatrixInfo.isSparse"}
  - {class: cern.colt.GenericSorting, method: mergeSort, match: "(int fromIndex, int toIndex, IntComparator c, Swapper swapper)", note: "GenericSorting.mergeSort"}
  - {class: cern.colt.buffer.tboolean.BooleanBuffer3D, method: addAllOf, match: "(BooleanArrayList xElements, BooleanArrayList yElements, BooleanArrayList zElements)", note: "BooleanBuffer3D.addAllOf"}
  - {class: cern.colt.list.tchar.CharArrayList, method: beforeInsert, match: "(int index, char element)", note: "CharArrayList.beforeInsert"}
  - {class: cern.colt.map.tdouble.OpenDoubleLongHashMap, method: clear, match: "()", note: "OpenDoubleLongHashMap.clear"}
  - {class: cern.colt.matrix.io.MatrixInfo, method: isCoordinate, match: "()", note: "MatrixInfo.isCoordinate"}
  - {class: cern.colt.GenericSorting, method: quickSort, match: "(int fromIndex, int toIndex, IntComparator c, Swapper swapper)", note: "GenericSorting.quickSort"}
  - {class: cern.colt.buffer.tboolean.BooleanBuffer3D, method: clear, match: "()", note: "BooleanBuffer3D.clear"}
  - {class: cern.colt.list.tchar.CharArrayList, method: binarySearchFromTo, match: "(char key, int from, int to)", note: "CharArrayList.binarySearchFromTo"}
  - {class: cern.colt.map.tdouble.OpenDoubleLongHashMap, method: containsKey, match: "(double key)", note: "OpenDoubleLongHashMap.containsKey"}
  - {class: cern.colt.matrix.io.MatrixSize, method: numRows, match: "()", note: "MatrixSize.numRows"}
  - {class: cern.colt.ParallelQuickSort, method: quickSort, match: "(final byte[] x, final int off, int len, final ByteComparator comp, final int nThreads)", note: "ParallelQuickSort.quickSort"}
  - {class: cern.colt.buffer.tbyte.ByteBuffer, method: addAllOf, match: "(ByteArrayList list)", note: "ByteBuffer.addAllOf"}
  - {class: cern.colt.list.tdouble.DoubleArrayList, method: beforeInsert, match: "(int index, double element)", note: "DoubleArrayList.beforeInsert"}
  - {class: cern.colt.map.tdouble.OpenIntDoubleHashMap, method: assign, match: "(cern.colt.function.tdouble.DoubleFunction function)", note: "OpenIntDoubleHashMap.assign"}
