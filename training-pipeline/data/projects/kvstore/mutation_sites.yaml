# Curated performance-mutation sites for kvstore (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants kvstore --source data/external-src/<checkout> \
#       --sites data/projects/kvstore/mutation_sites.yaml

package_root: org.javastack.kvstore

sites:
  - {class: org.javastack.kvstore.Example, method: main, match: "(final String[] args) throws Exception", note: "Example.main"}
  - {class: org.javastack.kvstore.holders.ByteArray8Holder, method: valueOf, match: "(final byte[] value)", note: "ByteArray8Holder.valueOf"}
  - {class: org.javastack.kvstore.io.FileStreamStore, method: open, match: "()", note: "FileStreamStore.open"}
  - {class: org.javastack.kvstore.pool.BufferStacker, method: getInstance, match: "(final int bufferLen, final boolean isDirect)", note: "BufferStacker.getInstance"}
  - {class: org.javastack.kvstore.structures.bitset.SimpleBitSet, method: clear, match: "(int bitIndex)", note: "SimpleBitSet.clear"}
  - {class: org.javastack.kvstore.test.BenchMarkDiskStore, method: serialize, match: "(final ByteBuffer out)", note: "BenchMarkDiskStore.serialize"}
  - {class: org.javastack.kvstore.utils.HexStrings, method: nativeAsHex, match: "(final byte input)", note: "HexStrings.nativeAsHex"}
  - {class: org.javastack.kvstore.KVStoreFactory, method: createTree, match: "(final Options opts) throws InstantiationException,", note: "KVStoreFactory.createTree"}
  - {class: org.javastack.kvstore.holders.ByteArray8Holder, method: getValue, match: "()", note: "ByteArray8Holder.getValue"}
  - {class: org.javastack.kvstore.io.FileStreamStore, method: open, match: "(final boolean readOnly)", note: "FileStreamStore.open"}
  - {class: org.javastack.kvstore.pool.BufferStacker, method: push, match: "(final ByteBuffer buf)", note: "BufferStacker.push"}
  - {class: org.javastack.kvstore.structures.bitset.SimpleBitSet, method: clear, match: "(int fromIndex, int toIndex)", note: "SimpleBitSet.clear"}
  - {class: org.javastack.kvstore.test.BenchMarkDiskStore, method: deserialize, match: "(final ByteBuffer in)", note: "BenchMarkDiskStore.deserialize"}
  - {class: org.javastack.kvstore.utils.HexStrings, method: nativeAsHex, match: "(final short input)", note: "HexStrings.nativeAsHex"}
  - {class: org.javastack.kvstore.KVStoreFactory, method: createTreeMemory, match: "(final Options opts) throws InstantiationException,", note: "KVStoreFactory.createTreeMemory"}
  - {class: org.javastack.kvstore.holders.StringHolder, method: valueOf, match: "(final String value)", note: "StringHolder.valueOf"}
  - {class: org.javastack.kvstore.io.StringSerializer, method: fromStringToBuffer, match: "(final ByteBuffer out, final String str)", note: "StringSerializer.fromStringToBuffer"}
  - {class: org.javastack.kvstore.pool.StringPool, method: getCanonicalVersion, match: "(final String str)", note: "StringPool.getCanonicalVersion"}
  - {class: org.javastack.kvstore.structures.hash.FixedIntHashMap, method: clear, match: "(boolean shrink)", note: "FixedIntHashMap.clear"}
  - {class: org.javastack.kvstore.test.BenchMarkMemoryStructures, method: serialize, match: "(final ByteBuffer out)", note: "BenchMarkMemoryStructures.serialize"}
  - {class: org.javastack.kvstore.utils.CRC32, method: getValue, match: "()", note: "CRC32.getValue"}
  - {class: org.javastack.kvstore.Options, method: getString, match: "(final String key)", note: "Options.getString"}
  - {class: org.javastack.kvstore.holders.StringHolder, method: getValue, match: "()", note: "StringHolder.getValue"}
  - {class: org.javastack.kvstore.io.StringSerializer, method: fromBufferToString, match: "(final ByteBuffer in)", note: "StringSerializer.fromBufferToString"}
  - {class: org.javastack.kvstore.pool.StringPool, method: size, match: "()", note: "StringPool.size"}
  - {class: org.javastack.kvstore.structures.hash.FixedIntHashMap, method: getKeys, match: "()", note: "FixedIntHashMap.getKeys"}
  - {class: org.javastack.kvstore.test.BenchMarkMemoryStructures, method: deserialize, match: "(final ByteBuffer in)", note: "BenchMarkMemoryStructures.deserialize"}
  - {class: org.javastack.kvstore.utils.CRC32, method: reset, match: "()", note: "CRC32.reset"}
  - {class: org.javastack.kvstore.Options, method: getString, match: "(final String key, final String defaultValue)", note: "Options.getString"}
  - {class: org.javastack.kvstore.holders.BooleanHolder, method: valueOf, match: "(final boolean value)", note: "BooleanHolder.valueOf"}
  - {class: org.javastack.kvstore.io.FileBlockStore, method: open, match: "()", note: "FileBlockStore.open"}
  - {class: org.javastack.kvstore.structures.hash.IntHashMap, method: clear, match: "()", note: "IntHashMap.clear"}
  - {class: org.javastack.kvstore.utils.CRC32C, method: getValue, match: "()", note: "CRC32C.getValue"}
  - {class: org.javastack.kvstore.holders.BooleanHolder, method: booleanValue, match: "()", note: "BooleanHolder.booleanValue"}
  - {class: org.javastack.kvstore.io.FileBlockStore, method: open, match: "(final boolean readOnly)", note: "FileBlockStore.open"}
  - {class: org.javastack.kvstore.structures.hash.IntHashMap, method: clear, match: "(final boolean shrink)", note: "IntHashMap.clear"}
  - {class: org.javastack.kvstore.utils.CRC32C, method: reset, match: "()", note: "CRC32C.reset"}
  - {class: org.javastack.kvstore.holders.ByteHolder, method: valueOf, match: "(final byte value)", note: "ByteHolder.valueOf"}
