  - {class: org.javatuples.LabelValue, method: fromIterable, match: "(final Iterable<X> iterable)", note: "LabelValue.fromIterable"}
  - {class: org.javatuples.LabelValue, method: fromIterable, match: "(final Iterable<X> iterable, int index)", note: "LabelValue.fromIterable"}
  - {class: org.javatuples.LabelValue, method: getLabel, match: "()", note: "LabelValue.getLabel"}
  - {class: org.javatuples.Octet, method: with, match: "(final A value0, final B value1, final C value2, final D value3, final E value4, final F value5, final G value6, final H value7)", note: "Octet.with"}
