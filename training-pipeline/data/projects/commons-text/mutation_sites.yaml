# Curated performance-mutation sites for commons-text (GRPO RL corpus).
#
# Hand-picked from good_classes.yaml: concrete classes and hot ~once-per-call public
# methods (encode/decode/hash/aggregate/set-algebra kernels) that a JMH benchmark drives
# once per invocation. Several methods per class => ``killed / in-class mutants`` rewards
# benchmark coverage of the subject's core operations.
#
# Regenerate with:
#   jmh-make-mutants commons-text --source data/external-src/commons-text \
#       --sites data/projects/commons-text/mutation_sites.yaml

package_root: org.apache.commons.text

sites:
  - {class: org.apache.commons.text.StringEscapeUtils, method: escapeCsv, match: "(final String input)", note: "StringEscapeUtils.escapeCsv"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: escapeEcmaScript, match: "(final String input)", note: "StringEscapeUtils.escapeEcmaScript"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: escapeHtml4, match: "(final String input)", note: "StringEscapeUtils.escapeHtml4"}
  - {class: org.apache.commons.text.WordUtils, method: abbreviate, match: "(final String str, int lower, int upper, final String appendToEnd)", note: "WordUtils.abbreviate"}
  - {class: org.apache.commons.text.WordUtils, method: capitalize, match: "(final String str)", note: "WordUtils.capitalize"}
  - {class: org.apache.commons.text.WordUtils, method: capitalizeFully, match: "(final String str)", note: "WordUtils.capitalizeFully"}
  - {class: org.apache.commons.text.StringSubstitutor, method: replace, match: "(final Object source, final Map<String, V> valueMap)", note: "StringSubstitutor.replace"}
  - {class: org.apache.commons.text.StringSubstitutor, method: replaceIn, match: "(final StringBuffer source)", note: "StringSubstitutor.replaceIn"}
  - {class: org.apache.commons.text.StringSubstitutor, method: resolveVariable, match: "(final String variableName, final TextStringBuilder buf, final int startPos, final int endPos)", note: "StringSubstitutor.resolveVariable"}
  - {class: org.apache.commons.text.RandomStringGenerator, method: generate, match: "(final int length)", note: "RandomStringGenerator.generate"}
  - {class: org.apache.commons.text.TextStringBuilder, method: replace, match: "(final int startIndex, int endIndex, final String replaceStr)", note: "TextStringBuilder.replace"}
  - {class: org.apache.commons.text.TextStringBuilder, method: wrap, match: "(final char[] initialBuffer)", note: "TextStringBuilder.wrap"}
  - {class: org.apache.commons.text.TextStringBuilder, method: appendAll, match: "(final Iterable<?> iterable)", note: "TextStringBuilder.appendAll"}
  - {class: org.apache.commons.text.similarity.LevenshteinDistance, method: apply, match: "(final CharSequence left, final CharSequence right)", note: "LevenshteinDistance.apply"}
  - {class: org.apache.commons.text.similarity.LevenshteinDetailedDistance, method: apply, match: "(final CharSequence left, final CharSequence right)", note: "LevenshteinDetailedDistance.apply"}
  - {class: org.apache.commons.text.similarity.JaroWinklerDistance, method: apply, match: "(final CharSequence left, final CharSequence right)", note: "JaroWinklerDistance.apply"}
  - {class: org.apache.commons.text.similarity.JaroWinklerDistance, method: matches, match: "(final CharSequence first, final CharSequence second)", note: "JaroWinklerDistance.matches"}
  - {class: org.apache.commons.text.similarity.JaroWinklerSimilarity, method: apply, match: "(final CharSequence left, final CharSequence right)", note: "JaroWinklerSimilarity.apply"}
  - {class: org.apache.commons.text.similarity.JaroWinklerSimilarity, method: matches, match: "(final CharSequence first, final CharSequence second)", note: "JaroWinklerSimilarity.matches"}
  - {class: org.apache.commons.text.similarity.CosineSimilarity, method: cosineSimilarity, match: "(final Map<CharSequence, Integer> leftVector, final Map<CharSequence, Integer> rightVector)", note: "CosineSimilarity.cosineSimilarity"}
  - {class: org.apache.commons.text.similarity.CosineDistance, method: apply, match: "(final CharSequence left, final CharSequence right)", note: "CosineDistance.apply"}
  - {class: org.apache.commons.text.similarity.HammingDistance, method: apply, match: "(final CharSequence left, final CharSequence right)", note: "HammingDistance.apply"}
  - {class: org.apache.commons.text.similarity.LongestCommonSubsequence, method: apply, match: "(final CharSequence left, final CharSequence right)", note: "LongestCommonSubsequence.apply"}
  - {class: org.apache.commons.text.similarity.LongestCommonSubsequence, method: longestCommonSubsequence, match: "(final CharSequence left, final CharSequence right)", note: "LongestCommonSubsequence.longestCommonSubsequence"}
  - {class: org.apache.commons.text.similarity.LongestCommonSubsequenceDistance, method: apply, match: "(final CharSequence left, final CharSequence right)", note: "LongestCommonSubsequenceDistance.apply"}
  - {class: org.apache.commons.text.similarity.FuzzyScore, method: fuzzyScore, match: "(final CharSequence term, final CharSequence query)", note: "FuzzyScore.fuzzyScore"}
  - {class: org.apache.commons.text.translate.NumericEntityEscaper, method: between, match: "(final int codePointLow, final int codePointHigh)", note: "NumericEntityEscaper.between"}
  - {class: org.apache.commons.text.translate.NumericEntityEscaper, method: above, match: "(final int codePoint)", note: "NumericEntityEscaper.above"}
  - {class: org.apache.commons.text.translate.NumericEntityEscaper, method: below, match: "(final int codePoint)", note: "NumericEntityEscaper.below"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: escapeJava, match: "(final String input)", note: "StringEscapeUtils.escapeJava"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: escapeJson, match: "(final String input)", note: "StringEscapeUtils.escapeJson"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: escapeXml11, match: "(final String input)", note: "StringEscapeUtils.escapeXml11"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: unescapeHtml4, match: "(final String input)", note: "StringEscapeUtils.unescapeHtml4"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: unescapeJava, match: "(final String input)", note: "StringEscapeUtils.unescapeJava"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: unescapeJson, match: "(final String input)", note: "StringEscapeUtils.unescapeJson"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: unescapeXml, match: "(final String input)", note: "StringEscapeUtils.unescapeXml"}
  - {class: org.apache.commons.text.WordUtils, method: swapCase, match: "(final String str)", note: "WordUtils.swapCase"}
  - {class: org.apache.commons.text.WordUtils, method: wrap, match: "(final String str, final int wrapLength)", note: "WordUtils.wrap"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: escape, match: "(final String input)", note: "StringEscapeUtils.escape"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: escapeHtml3, match: "(final String input)", note: "StringEscapeUtils.escapeHtml3"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: escapeXSI, match: "(final String input)", note: "StringEscapeUtils.escapeXSI"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: escapeXml10, match: "(final String input)", note: "StringEscapeUtils.escapeXml10"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: unescapeCsv, match: "(final String input)", note: "StringEscapeUtils.unescapeCsv"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: unescapeEcmaScript, match: "(final String input)", note: "StringEscapeUtils.unescapeEcmaScript"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: unescapeHtml3, match: "(final String input)", note: "StringEscapeUtils.unescapeHtml3"}
  - {class: org.apache.commons.text.StringEscapeUtils, method: unescapeXSI, match: "(final String input)", note: "StringEscapeUtils.unescapeXSI"}
  - {class: org.apache.commons.text.StringSubstitutor, method: substitute, match: "(final TextStringBuilder builder, final int offset, final int length)", note: "StringSubstitutor.substitute"}
  - {class: org.apache.commons.text.TextStringBuilder, method: appendFixedWidthPadLeft, match: "(final int value, final int width, final char padChar)", note: "TextStringBuilder.appendFixedWidthPadLeft"}
  - {class: org.apache.commons.text.TextStringBuilder, method: appendFixedWidthPadRight, match: "(final int value, final int width, final char padChar)", note: "TextStringBuilder.appendFixedWidthPadRight"}
  - {class: org.apache.commons.text.TextStringBuilder, method: appendNewLine, match: "()", note: "TextStringBuilder.appendNewLine"}
