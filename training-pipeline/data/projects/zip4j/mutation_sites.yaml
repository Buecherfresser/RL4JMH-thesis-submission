# Curated performance-mutation sites for zip4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants zip4j --source data/external-src/<checkout> \
#       --sites data/projects/zip4j/mutation_sites.yaml

package_root: net.lingala.zip4j

sites:
  - {class: net.lingala.zip4j.ZipFile, method: createSplitZipFile, match: "(List<File> filesToAdd, ZipParameters parameters, boolean splitArchive,", note: "ZipFile.createSplitZipFile"}
  - {class: net.lingala.zip4j.crypto.AesCipherUtil, method: derivePasswordBasedKey, match: "(final byte[] salt, final char[] password,", note: "AesCipherUtil.derivePasswordBasedKey"}
  - {class: net.lingala.zip4j.headers.HeaderUtil, method: getFileHeader, match: "(ZipModel zipModel, String fileName) throws ZipException", note: "HeaderUtil.getFileHeader"}
  - {class: net.lingala.zip4j.io.inputstream.AesCipherInputStream, method: initializeDecrypter, match: "(LocalFileHeader localFileHeader, char[] password,", note: "AesCipherInputStream.initializeDecrypter"}
  - {class: net.lingala.zip4j.model.AESExtraDataRecord, method: getDataSize, match: "()", note: "AESExtraDataRecord.getDataSize"}
  - {class: net.lingala.zip4j.progress.ProgressMonitor, method: updateWorkCompleted, match: "(long workCompleted)", note: "ProgressMonitor.updateWorkCompleted"}
  - {class: net.lingala.zip4j.tasks.AddStreamToZipTask, method: executeTask, match: "(AddStreamToZipTaskParameters taskParameters, ProgressMonitor progressMonitor)", note: "AddStreamToZipTask.executeTask"}
  - {class: net.lingala.zip4j.util.BitUtils, method: isBitSet, match: "(byte b, int pos)", note: "BitUtils.isBitSet"}
  - {class: net.lingala.zip4j.ZipFile, method: createSplitZipFile, match: "(InputStream inputStream, ZipParameters parameters, boolean splitArchive,", note: "ZipFile.createSplitZipFile"}
  - {class: net.lingala.zip4j.crypto.AesCipherUtil, method: derivePasswordVerifier, match: "(final byte[] derivedKey, final AesKeyStrength aesKeyStrength)", note: "AesCipherUtil.derivePasswordVerifier"}
  - {class: net.lingala.zip4j.headers.HeaderUtil, method: decodeStringWithCharset, match: "(byte[] data, boolean isUtf8Encoded, Charset charset)", note: "HeaderUtil.decodeStringWithCharset"}
  - {class: net.lingala.zip4j.io.inputstream.AesCipherInputStream, method: endOfEntryReached, match: "(InputStream inputStream, int numberOfBytesPushedBack) throws IOException", note: "AesCipherInputStream.endOfEntryReached"}
  - {class: net.lingala.zip4j.model.AESExtraDataRecord, method: setDataSize, match: "(int dataSize)", note: "AESExtraDataRecord.setDataSize"}
  - {class: net.lingala.zip4j.progress.ProgressMonitor, method: endProgressMonitor, match: "()", note: "ProgressMonitor.endProgressMonitor"}
  - {class: net.lingala.zip4j.tasks.AddStreamToZipTask, method: calculateTotalWork, match: "(AddStreamToZipTaskParameters taskParameters)", note: "AddStreamToZipTask.calculateTotalWork"}
  - {class: net.lingala.zip4j.util.BitUtils, method: setBit, match: "(byte b, int pos)", note: "BitUtils.setBit"}
  - {class: net.lingala.zip4j.crypto.AESDecrypter, method: decryptData, match: "(byte[] buff, int start, int len) throws ZipException", note: "AESDecrypter.decryptData"}
  - {class: net.lingala.zip4j.headers.FileHeaderFactory, method: generateFileHeader, match: "(ZipParameters zipParameters, boolean isSplitZip, int currentDiskNumberStart,", note: "FileHeaderFactory.generateFileHeader"}
  - {class: net.lingala.zip4j.io.inputstream.InflaterInputStream, method: endOfEntryReached, match: "(InputStream inputStream, int numberOfBytesPushedBack) throws IOException", note: "InflaterInputStream.endOfEntryReached"}
  - {class: net.lingala.zip4j.model.ArchiveExtraDataRecord, method: getExtraFieldLength, match: "()", note: "ArchiveExtraDataRecord.getExtraFieldLength"}
  - {class: net.lingala.zip4j.tasks.SetCommentTask, method: executeTask, match: "(SetCommentTaskTaskParameters taskParameters, ProgressMonitor progressMonitor) throws IOException", note: "SetCommentTask.executeTask"}
  - {class: net.lingala.zip4j.util.CrcUtil, method: computeFileCrc, match: "(File inputFile, ProgressMonitor progressMonitor) throws IOException", note: "CrcUtil.computeFileCrc"}
  - {class: net.lingala.zip4j.crypto.AESDecrypter, method: getCalculatedAuthenticationBytes, match: "(int numberOfBytesPushedBack)", note: "AESDecrypter.getCalculatedAuthenticationBytes"}
  - {class: net.lingala.zip4j.headers.FileHeaderFactory, method: generateLocalFileHeader, match: "(FileHeader fileHeader)", note: "FileHeaderFactory.generateLocalFileHeader"}
  - {class: net.lingala.zip4j.io.inputstream.InflaterInputStream, method: pushBackInputStreamIfNecessary, match: "(PushbackInputStream pushbackInputStream) throws IOException", note: "InflaterInputStream.pushBackInputStreamIfNecessary"}
  - {class: net.lingala.zip4j.model.ArchiveExtraDataRecord, method: setExtraFieldLength, match: "(int extraFieldLength)", note: "ArchiveExtraDataRecord.setExtraFieldLength"}
  - {class: net.lingala.zip4j.tasks.SetCommentTask, method: calculateTotalWork, match: "(SetCommentTaskTaskParameters taskParameters)", note: "SetCommentTask.calculateTotalWork"}
  - {class: net.lingala.zip4j.util.FileUtils, method: setFileAttributes, match: "(Path file, byte[] fileAttributes)", note: "FileUtils.setFileAttributes"}
  - {class: net.lingala.zip4j.crypto.AESEncrypter, method: encryptData, match: "(byte[] buff) throws ZipException", note: "AESEncrypter.encryptData"}
  - {class: net.lingala.zip4j.headers.HeaderReader, method: readAllHeaders, match: "(RandomAccessFile zip4jRaf, Zip4jConfig zip4jConfig) throws IOException", note: "HeaderReader.readAllHeaders"}
  - {class: net.lingala.zip4j.io.inputstream.NoCipherInputStream, method: initializeDecrypter, match: "(LocalFileHeader localFileHeader, char[] password, boolean useUtf8ForPassword)", note: "NoCipherInputStream.initializeDecrypter"}
  - {class: net.lingala.zip4j.model.CentralDirectory, method: getFileHeaders, match: "()", note: "CentralDirectory.getFileHeaders"}
  - {class: net.lingala.zip4j.tasks.AddFilesToZipTask, method: executeTask, match: "(AddFilesToZipTaskParameters taskParameters, ProgressMonitor progressMonitor)", note: "AddFilesToZipTask.executeTask"}
  - {class: net.lingala.zip4j.util.FileUtils, method: setFileLastModifiedTime, match: "(Path file, long lastModifiedTime)", note: "FileUtils.setFileLastModifiedTime"}
  - {class: net.lingala.zip4j.crypto.AESEncrypter, method: encryptData, match: "(byte[] buff, int start, int len) throws ZipException", note: "AESEncrypter.encryptData"}
  - {class: net.lingala.zip4j.headers.HeaderReader, method: readLocalFileHeader, match: "(InputStream inputStream, Charset charset) throws IOException", note: "HeaderReader.readLocalFileHeader"}
  - {class: net.lingala.zip4j.io.inputstream.NoCipherInputStream, method: decryptData, match: "(byte[] buff, int start, int len)", note: "NoCipherInputStream.decryptData"}
  - {class: net.lingala.zip4j.model.CentralDirectory, method: setFileHeaders, match: "(List<FileHeader> fileHeaders)", note: "CentralDirectory.setFileHeaders"}
  - {class: net.lingala.zip4j.tasks.AddFilesToZipTask, method: calculateTotalWork, match: "(AddFilesToZipTaskParameters taskParameters) throws ZipException", note: "AddFilesToZipTask.calculateTotalWork"}
  - {class: net.lingala.zip4j.util.UnzipUtil, method: createZipInputStream, match: "(ZipModel zipModel, FileHeader fileHeader, char[] password)", note: "UnzipUtil.createZipInputStream"}
  - {class: net.lingala.zip4j.crypto.PBKDF2.BinTools, method: bin2hex, match: "(final byte[] b)", note: "BinTools.bin2hex"}
  - {class: net.lingala.zip4j.headers.HeaderSignature, method: getValue, match: "()", note: "HeaderSignature.getValue"}
  - {class: net.lingala.zip4j.io.inputstream.NumberedSplitFileInputStream, method: prepareExtractionForFileHeader, match: "(FileHeader fileHeader) throws IOException", note: "NumberedSplitFileInputStream.prepareExtractionForFileHeader"}
  - {class: net.lingala.zip4j.model.DataDescriptor, method: getCrc, match: "()", note: "DataDescriptor.getCrc"}
  - {class: net.lingala.zip4j.tasks.AddFolderToZipTask, method: executeTask, match: "(AddFolderToZipTaskParameters taskParameters, ProgressMonitor progressMonitor)", note: "AddFolderToZipTask.executeTask"}
  - {class: net.lingala.zip4j.util.UnzipUtil, method: applyFileAttributes, match: "(FileHeader fileHeader, File file)", note: "UnzipUtil.applyFileAttributes"}
  - {class: net.lingala.zip4j.crypto.PBKDF2.BinTools, method: hex2bin, match: "(final String s)", note: "BinTools.hex2bin"}
  - {class: net.lingala.zip4j.headers.HeaderWriter, method: writeLocalFileHeader, match: "(ZipModel zipModel, LocalFileHeader localFileHeader, OutputStream outputStream,", note: "HeaderWriter.writeLocalFileHeader"}
  - {class: net.lingala.zip4j.io.inputstream.NumberedSplitFileInputStream, method: close, match: "() throws IOException", note: "NumberedSplitFileInputStream.close"}
  - {class: net.lingala.zip4j.model.DataDescriptor, method: setCrc, match: "(long crc)", note: "DataDescriptor.setCrc"}
