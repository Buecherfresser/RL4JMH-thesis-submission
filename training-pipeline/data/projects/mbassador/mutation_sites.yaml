# Curated performance-mutation sites for mbassador (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants mbassador --source data/external-src/<checkout> \
#       --sites data/projects/mbassador/mutation_sites.yaml

package_root: net.engio.mbassy

sites:
  - {class: net.engio.mbassy.bus.BusRuntime, method: getProvider, match: "()", note: "BusRuntime.getProvider"}
  - {class: net.engio.mbassy.common.ReflectionUtils, method: getMethods, match: "(IPredicate<Method> condition, Class<?> target)", note: "ReflectionUtils.getMethods"}
  - {class: net.engio.mbassy.dispatch.AsynchronousHandlerInvocation, method: invoke, match: "(final Object listener, final Object message, final MessagePublication publication)", note: "AsynchronousHandlerInvocation.invoke"}
  - {class: net.engio.mbassy.listener.MessageListener, method: ForMessage, match: "(final Class<?> messageType)", note: "MessageListener.ForMessage"}
  - {class: net.engio.mbassy.scan.ClassFileHandlerScanner, method: scanPackage, match: "(String packageName) throws IOException", note: "ClassFileHandlerScanner.scanPackage"}
  - {class: net.engio.mbassy.subscription.AbstractSubscriptionContextAware, method: getContext, match: "()", note: "AbstractSubscriptionContextAware.getContext"}
  - {class: net.engio.mbassy.bus.BusRuntime, method: getKeys, match: "()", note: "BusRuntime.getKeys"}
  - {class: net.engio.mbassy.common.ReflectionUtils, method: getMethods, match: "(IPredicate<Method> condition, Class<?> target, ArrayList<Method> methods)", note: "ReflectionUtils.getMethods"}
  - {class: net.engio.mbassy.dispatch.AsynchronousHandlerInvocation, method: run, match: "()", note: "AsynchronousHandlerInvocation.run"}
  - {class: net.engio.mbassy.listener.MessageListener, method: apply, match: "(MessageHandler target)", note: "MessageListener.apply"}
  - {class: net.engio.mbassy.subscription.MessageEnvelope, method: getMessage, match: "()", note: "MessageEnvelope.getMessage"}
  - {class: net.engio.mbassy.bus.MBassador, method: autoScan, match: "()", note: "MBassador.autoScan"}
  - {class: net.engio.mbassy.common.StrongConcurrentSet, method: iterator, match: "()", note: "StrongConcurrentSet.iterator"}
  - {class: net.engio.mbassy.dispatch.EnvelopedMessageDispatcher, method: dispatch, match: "(MessagePublication publication, Object message, Iterable listeners)", note: "EnvelopedMessageDispatcher.dispatch"}
  - {class: net.engio.mbassy.listener.Filters, method: accepts, match: "(final Object event, final SubscriptionContext context)", note: "Filters.accepts"}
  - {class: net.engio.mbassy.subscription.Subscription, method: belongsTo, match: "(Class listener)", note: "Subscription.belongsTo"}
  - {class: net.engio.mbassy.bus.MBassador, method: autoScan, match: "(String... packages)", note: "MBassador.autoScan"}
  - {class: net.engio.mbassy.common.StrongConcurrentSet, method: createEntry, match: "(T value, Entry<T> next)", note: "StrongConcurrentSet.createEntry"}
  - {class: net.engio.mbassy.dispatch.FilteredMessageDispatcher, method: dispatch, match: "(MessagePublication publication, Object message, Iterable listeners)", note: "FilteredMessageDispatcher.dispatch"}
  - {class: net.engio.mbassy.listener.Filters, method: accepts, match: "(final Object message, final SubscriptionContext context)", note: "Filters.accepts"}
  - {class: net.engio.mbassy.subscription.Subscription, method: handlesMessageType, match: "(Class<?> messageType)", note: "Subscription.handlesMessageType"}
  - {class: net.engio.mbassy.bus.MessagePublication, method: execute, match: "()", note: "MessagePublication.execute"}
  - {class: net.engio.mbassy.common.WeakConcurrentSet, method: iterator, match: "()", note: "WeakConcurrentSet.iterator"}
  - {class: net.engio.mbassy.dispatch.MessageDispatcher, method: dispatch, match: "(final MessagePublication publication, final Object message, final Iterable listeners)", note: "MessageDispatcher.dispatch"}
  - {class: net.engio.mbassy.listener.MessageHandler, method: Create, match: "(Method handler,", note: "MessageHandler.Create"}
  - {class: net.engio.mbassy.subscription.SubscriptionContext, method: getHandler, match: "()", note: "SubscriptionContext.getHandler"}
  - {class: net.engio.mbassy.bus.MessagePublication, method: isFinished, match: "()", note: "MessagePublication.isFinished"}
  - {class: net.engio.mbassy.common.WeakConcurrentSet, method: createEntry, match: "(T value, Entry<T> next)", note: "WeakConcurrentSet.createEntry"}
  - {class: net.engio.mbassy.dispatch.MessageDispatcher, method: getInvocation, match: "()", note: "MessageDispatcher.getInvocation"}
  - {class: net.engio.mbassy.listener.MessageHandler, method: getAnnotation, match: "(Class<A> annotationType)", note: "MessageHandler.getAnnotation"}
  - {class: net.engio.mbassy.subscription.SubscriptionContext, method: getErrorHandlers, match: "()", note: "SubscriptionContext.getErrorHandlers"}
  - {class: net.engio.mbassy.bus.SyncMessageBus, method: publish, match: "(T message)", note: "SyncMessageBus.publish"}
  - {class: net.engio.mbassy.dispatch.MethodHandleInvocation, method: invoke, match: "(final Object listener, final Object message, MessagePublication publication)", note: "MethodHandleInvocation.invoke"}
  - {class: net.engio.mbassy.listener.MetadataReader, method: apply, match: "(Method target)", note: "MetadataReader.apply"}
  - {class: net.engio.mbassy.subscription.SubscriptionFactory, method: createSubscription, match: "(BusRuntime runtime, MessageHandler handlerMetadata) throws MessageBusException", note: "SubscriptionFactory.createSubscription"}
  - {class: net.engio.mbassy.bus.SyncMessageBus, method: post, match: "(T message)", note: "SyncMessageBus.post"}
  - {class: net.engio.mbassy.dispatch.ReflectiveHandlerInvocation, method: invoke, match: "(final Object listener, final Object message, MessagePublication publication)", note: "ReflectiveHandlerInvocation.invoke"}
  - {class: net.engio.mbassy.listener.MetadataReader, method: getMessageListener, match: "(Class target)", note: "MetadataReader.getMessageListener"}
  - {class: net.engio.mbassy.subscription.SubscriptionFactory, method: buildInvocationForHandler, match: "(SubscriptionContext context) throws MessageBusException", note: "SubscriptionFactory.buildInvocationForHandler"}
  - {class: net.engio.mbassy.bus.config.BusConfiguration, method: setProperty, match: "(String name, Object value)", note: "BusConfiguration.setProperty"}
  - {class: net.engio.mbassy.dispatch.SynchronizedHandlerInvocation, method: invoke, match: "(final Object listener, final Object message, MessagePublication publication)", note: "SynchronizedHandlerInvocation.invoke"}
  - {class: net.engio.mbassy.subscription.SubscriptionManager, method: unsubscribe, match: "(Object listener)", note: "SubscriptionManager.unsubscribe"}
  - {class: net.engio.mbassy.bus.config.BusConfiguration, method: getProperty, match: "(String name, T defaultValue)", note: "BusConfiguration.getProperty"}
  - {class: net.engio.mbassy.subscription.SubscriptionManager, method: subscribe, match: "(Object listener)", note: "SubscriptionManager.subscribe"}
  - {class: net.engio.mbassy.bus.config.ConfigurationError, method: MissingFeature, match: "(Class<? extends Feature> featureType)", note: "ConfigurationError.MissingFeature"}
  - {class: net.engio.mbassy.subscription.SubscriptionManagerProvider, method: createManager, match: "(MetadataReader reader,", note: "SubscriptionManagerProvider.createManager"}
  - {class: net.engio.mbassy.bus.error.PublicationError, method: getCause, match: "()", note: "PublicationError.getCause"}
  - {class: net.engio.mbassy.bus.error.PublicationError, method: setCause, match: "(Throwable cause)", note: "PublicationError.setCause"}
  - {class: net.engio.mbassy.bus.publication.SyncAsyncPostCommand, method: now, match: "()", note: "SyncAsyncPostCommand.now"}
  - {class: net.engio.mbassy.bus.publication.SyncAsyncPostCommand, method: asynchronously, match: "()", note: "SyncAsyncPostCommand.asynchronously"}
