# Curated performance-mutation sites for chronicle-values (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants chronicle-values --source data/external-src/<checkout> \
#       --sites data/projects/chronicle-values/mutation_sites.yaml

package_root: net.openhft.chronicle

sites:
  - {class: net.openhft.chronicle.values.ArrayFieldModel, method: array, match: "()", note: "ArrayFieldModel.array"}
  - {class: net.openhft.chronicle.values.ArrayFieldModel, method: generateFields, match: "(ValueBuilder valueBuilder)", note: "ArrayFieldModel.generateFields"}
  - {class: net.openhft.chronicle.values.ArrayFieldModel, method: generateGet, match: "(ValueBuilder valueBuilder, MethodSpec.Builder methodBuilder)", note: "ArrayFieldModel.generateGet"}
  - {class: net.openhft.chronicle.values.ArrayFieldModel, method: generateGetVolatile, match: "(", note: "ArrayFieldModel.generateGetVolatile"}
  - {class: net.openhft.chronicle.values.JavaSourceFromString, method: getCharContent, match: "(boolean ignoreEncodingErrors)", note: "JavaSourceFromString.getCharContent"}
  - {class: net.openhft.chronicle.values.NumberHeapMemberGenerator, method: generateAdd, match: "(ValueBuilder valueBuilder, MethodSpec.Builder methodBuilder)", note: "NumberHeapMemberGenerator.generateAdd"}
  - {class: net.openhft.chronicle.values.NumberHeapMemberGenerator, method: generateArrayElementAdd, match: "(", note: "NumberHeapMemberGenerator.generateArrayElementAdd"}
  - {class: net.openhft.chronicle.values.NumberHeapMemberGenerator, method: generateAddAtomic, match: "(ValueBuilder valueBuilder, MethodSpec.Builder methodBuilder)", note: "NumberHeapMemberGenerator.generateAddAtomic"}
  - {class: net.openhft.chronicle.values.NumberHeapMemberGenerator, method: generateArrayElementAddAtomic, match: "(", note: "NumberHeapMemberGenerator.generateArrayElementAddAtomic"}
  - {class: net.openhft.chronicle.values.RangeImpl, method: min, match: "()", note: "RangeImpl.min"}
  - {class: net.openhft.chronicle.values.RangeImpl, method: max, match: "()", note: "RangeImpl.max"}
