  - {class: io.xlate.edi.internal.stream.tokenization.StreamEvent, method: setData, match: "(CharSequence data)", note: "StreamEvent.setData"}
  - {class: io.xlate.edi.internal.stream.validation.ListSyntaxValidator, method: validate, match: "(EDISyntaxRule syntax, UsageNode structure, ValidationEventHandler handler, SyntaxStatus status)", note: "ListSyntaxValidator.validate"}
  - {class: io.xlate.edi.internal.schema.ControlType, method: getHeaderRefPosition, match: "()", note: "ControlType.getHeaderRefPosition"}
  - {class: io.xlate.edi.internal.schema.ControlType, method: getTrailerRefPosition, match: "()", note: "ControlType.getTrailerRefPosition"}
  - {class: io.xlate.edi.internal.schema.ElementPosition, method: getElementPosition, match: "()", note: "ElementPosition.getElementPosition"}
  - {class: io.xlate.edi.internal.schema.ElementPosition, method: getComponentPosition, match: "()", note: "ElementPosition.getComponentPosition"}
  - {class: io.xlate.edi.internal.schema.ElementType, method: getMinLength, match: "(ElementType defaultElement)", note: "ElementType.getMinLength"}
  - {class: io.xlate.edi.internal.schema.ElementType, method: getMaxLength, match: "(ElementType defaultElement)", note: "ElementType.getMaxLength"}
  - {class: io.xlate.edi.internal.schema.LoopType, method: getLevelIdPosition, match: "()", note: "LoopType.getLevelIdPosition"}
  - {class: io.xlate.edi.internal.schema.LoopType, method: getParentIdPosition, match: "()", note: "LoopType.getParentIdPosition"}
  - {class: io.xlate.edi.internal.schema.Reference, method: getMinOccurs, match: "(Reference defaultElement)", note: "Reference.getMinOccurs"}
  - {class: io.xlate.edi.internal.schema.Reference, method: getMaxOccurs, match: "(Reference defaultElement)", note: "Reference.getMaxOccurs"}
