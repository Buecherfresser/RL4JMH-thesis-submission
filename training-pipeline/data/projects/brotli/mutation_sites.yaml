# Curated performance-mutation sites for brotli (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants brotli --source data/external-src/<checkout> \
#       --sites data/projects/brotli/mutation_sites.yaml

package_root: org.brotli

sites:
  - {class: org.brotli.dec.BrotliInputStream, method: attachDictionaryChunk, match: "(byte[] data)", note: "BrotliInputStream.attachDictionaryChunk"}
  - {class: org.brotli.enc.PreparedDictionaryGenerator, method: generate, match: "(ByteBuffer src)", note: "PreparedDictionaryGenerator.generate"}
  - {class: org.brotli.integration.Benchmark, method: main, match: "(String... args) throws IOException", note: "Benchmark.main"}
  - {class: org.brotli.wrapper.common.SetRfcDictionaryTest, method: testRfcDictionaryChecksums, match: "() throws NoSuchAlgorithmException", note: "SetRfcDictionaryTest.testRfcDictionaryChecksums"}
  - {class: org.brotli.dec.BrotliInputStream, method: enableEagerOutput, match: "()", note: "BrotliInputStream.enableEagerOutput"}
  - {class: org.brotli.integration.BundleChecker, method: close, match: "()", note: "BundleChecker.close"}
  - {class: org.brotli.wrapper.common.SetRfcDictionaryTest, method: testSetRfcDictionary, match: "() throws IOException", note: "SetRfcDictionaryTest.testSetRfcDictionary"}
  - {class: org.brotli.dec.Decoder, method: main, match: "(String... args) throws IOException", note: "Decoder.main"}
  - {class: org.brotli.integration.BundleChecker, method: run, match: "()", note: "BundleChecker.run"}
  - {class: org.brotli.wrapper.common.SetZeroDictionaryTest, method: testZeroDictionary, match: "() throws IOException", note: "SetZeroDictionaryTest.testZeroDictionary"}
  - {class: org.brotli.dec.EagerStreamTest, method: testEagerStream, match: "() throws IOException", note: "EagerStreamTest.testEagerStream"}
  - {class: org.brotli.integration.BundleHelper, method: listEntries, match: "(InputStream input) throws IOException", note: "BundleHelper.listEntries"}
  - {class: org.brotli.wrapper.dec.BrotliDecoderChannel, method: attachDictionary, match: "(ByteBuffer dictionary) throws IOException", note: "BrotliDecoderChannel.attachDictionary"}
  - {class: org.brotli.dec.SetDictionaryTest, method: testSetDictionary, match: "() throws IOException", note: "SetDictionaryTest.testSetDictionary"}
  - {class: org.brotli.integration.BundleHelper, method: readStream, match: "(InputStream input) throws IOException", note: "BundleHelper.readStream"}
  - {class: org.brotli.wrapper.dec.BrotliDecoderChannel, method: isOpen, match: "()", note: "BrotliDecoderChannel.isOpen"}
  - {class: org.brotli.dec.TestUtils, method: newBrotliInputStream, match: "(InputStream input) throws IOException", note: "TestUtils.newBrotliInputStream"}
  - {class: org.brotli.wrapper.dec.BrotliDecoderChannelTest, method: suite, match: "() throws IOException", note: "BrotliDecoderChannelTest.suite"}
  - {class: org.brotli.dec.BitReaderTest, method: testReadAfterEos, match: "()", note: "BitReaderTest.testReadAfterEos"}
  - {class: org.brotli.wrapper.dec.BrotliDecoderChannelTest, method: runTest, match: "() throws Throwable", note: "BrotliDecoderChannelTest.runTest"}
  - {class: org.brotli.dec.BitReaderTest, method: testAccumulatorUnderflowDetected, match: "()", note: "BitReaderTest.testAccumulatorUnderflowDetected"}
  - {class: org.brotli.wrapper.dec.BrotliInputStream, method: attachDictionary, match: "(ByteBuffer dictionary) throws IOException", note: "BrotliInputStream.attachDictionary"}
  - {class: org.brotli.dec.CompoundDictionaryTest, method: testNoDictionary, match: "() throws IOException", note: "CompoundDictionaryTest.testNoDictionary"}
  - {class: org.brotli.wrapper.dec.BrotliInputStream, method: enableEagerOutput, match: "()", note: "BrotliInputStream.enableEagerOutput"}
  - {class: org.brotli.dec.CompoundDictionaryTest, method: testOnePieceDictionary, match: "() throws IOException", note: "CompoundDictionaryTest.testOnePieceDictionary"}
  - {class: org.brotli.wrapper.dec.BrotliInputStreamTest, method: suite, match: "() throws IOException", note: "BrotliInputStreamTest.suite"}
  - {class: org.brotli.dec.DecodeTest, method: testEmpty, match: "() throws IOException", note: "DecodeTest.testEmpty"}
  - {class: org.brotli.wrapper.dec.BrotliInputStreamTest, method: runTest, match: "() throws Throwable", note: "BrotliInputStreamTest.runTest"}
  - {class: org.brotli.dec.DecodeTest, method: testX, match: "() throws IOException", note: "DecodeTest.testX"}
  - {class: org.brotli.wrapper.dec.Decoder, method: enableEagerOutput, match: "()", note: "Decoder.enableEagerOutput"}
  - {class: org.brotli.dec.Dictionary, method: setData, match: "(ByteBuffer newData, int[] newSizeBits)", note: "Dictionary.setData"}
  - {class: org.brotli.wrapper.dec.Decoder, method: close, match: "() throws IOException", note: "Decoder.close"}
  - {class: org.brotli.dec.DictionaryTest, method: testGetData, match: "()", note: "DictionaryTest.testGetData"}
  - {class: org.brotli.wrapper.dec.DecoderJNI, method: attachDictionary, match: "(ByteBuffer dictionary)", note: "DecoderJNI.attachDictionary"}
  - {class: org.brotli.dec.SynthTest, method: testAllTransforms10, match: "()", note: "SynthTest.testAllTransforms10"}
  - {class: org.brotli.wrapper.dec.DecoderJNI, method: push, match: "(int length)", note: "DecoderJNI.push"}
  - {class: org.brotli.dec.SynthTest, method: testAllTransforms4, match: "()", note: "SynthTest.testAllTransforms4"}
  - {class: org.brotli.wrapper.dec.DecoderJNITest, method: testPushLengthExceedingInputBufferIsRejected, match: "() throws IOException", note: "DecoderJNITest.testPushLengthExceedingInputBufferIsRejected"}
  - {class: org.brotli.dec.TransformTest, method: testTrimAll, match: "()", note: "TransformTest.testTrimAll"}
  - {class: org.brotli.wrapper.dec.DecoderJNITest, method: testPushNegativeLengthIsRejected, match: "() throws IOException", note: "DecoderJNITest.testPushNegativeLengthIsRejected"}
  - {class: org.brotli.dec.TransformTest, method: testCapitalize, match: "()", note: "TransformTest.testCapitalize"}
  - {class: org.brotli.wrapper.dec.DecoderTest, method: suite, match: "() throws IOException", note: "DecoderTest.suite"}
  - {class: org.brotli.wrapper.dec.DecoderTest, method: runTest, match: "() throws Throwable", note: "DecoderTest.runTest"}
  - {class: org.brotli.wrapper.dec.EagerStreamTest, method: testEagerReading, match: "() throws IOException", note: "EagerStreamTest.testEagerReading"}
  - {class: org.brotli.wrapper.enc.BrotliEncoderChannel, method: attachDictionary, match: "(PreparedDictionary dictionary) throws IOException", note: "BrotliEncoderChannel.attachDictionary"}
  - {class: org.brotli.wrapper.enc.BrotliEncoderChannel, method: isOpen, match: "()", note: "BrotliEncoderChannel.isOpen"}
  - {class: org.brotli.wrapper.enc.BrotliEncoderChannelTest, method: suite, match: "() throws IOException", note: "BrotliEncoderChannelTest.suite"}
  - {class: org.brotli.wrapper.enc.BrotliEncoderChannelTest, method: runTest, match: "() throws Throwable", note: "BrotliEncoderChannelTest.runTest"}
  - {class: org.brotli.wrapper.enc.BrotliOutputStream, method: attachDictionary, match: "(PreparedDictionary dictionary) throws IOException", note: "BrotliOutputStream.attachDictionary"}
  - {class: org.brotli.wrapper.enc.BrotliOutputStream, method: close, match: "() throws IOException", note: "BrotliOutputStream.close"}
