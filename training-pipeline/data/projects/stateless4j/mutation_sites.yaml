  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: onEntry, match: "(final Action entryAction)", note: "StateConfiguration.onEntry"}
  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: doIt, match: "(Transition<S, T> t)", note: "StateConfiguration.doIt"}
  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: onEntry, match: "(final Action1<Transition<S, T>> entryAction)", note: "StateConfiguration.onEntry"}
