# Curated performance-mutation sites for commons-geometry (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants commons-geometry --source data/external-src/<checkout> \
#       --sites data/projects/commons-geometry/mutation_sites.yaml

package_root: org.apache.commons.geometry

