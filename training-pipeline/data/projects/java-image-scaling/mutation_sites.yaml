# Curated performance-mutation sites for java-image-scaling (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants java-image-scaling --source data/external-src/<checkout> \
#       --sites data/projects/java-image-scaling/mutation_sites.yaml

package_root: com.mortennobel.imagescaling

sites:
