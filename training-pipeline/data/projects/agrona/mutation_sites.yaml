# Curated performance-mutation sites for agrona (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants agrona --source data/external-src/<checkout> \
#       --sites data/projects/agrona/mutation_sites.yaml

package_root: org.agrona

sites:
  - {class: org.agrona.BitUtil, method: findNextPositivePowerOfTwo, match: "(final int value)", note: "BitUtil.findNextPositivePowerOfTwo"}
  - {class: org.agrona.agent.BufferAlignmentAgent, method: premain, match: "(final String agentArgs, final Instrumentation instrumentation)", note: "BufferAlignmentAgent.premain"}
  - {class: org.agrona.build.SonatypeCentralPortalUploadRepositoryTask, method: getPortalUsername, match: "()", note: "SonatypeCentralPortalUploadRepositoryTask.getPortalUsername"}
  - {class: org.agrona.checksum.Crc32, method: compute, match: "(final long address, final int offset, final int length)", note: "Crc32.compute"}
  - {class: org.agrona.collections.ArrayListUtil, method: fastUnorderedRemove, match: "(final ArrayList<T> list, final int index)", note: "ArrayListUtil.fastUnorderedRemove"}
  - {class: org.agrona.concurrent.ManyToManyConcurrentArrayQueue, method: offer, match: "(final E e)", note: "ManyToManyConcurrentArrayQueue.offer"}
  - {class: org.agrona.console.ContinueBarrier, method: await, match: "()", note: "ContinueBarrier.await"}
  - {class: org.agrona.generation.CompilerUtil, method: compileInMemory, match: "(final String className, final Map<String, CharSequence> sources)", note: "CompilerUtil.compileInMemory"}
  - {class: org.agrona.hints.ThreadHints, method: onSpinWait, match: "()", note: "ThreadHints.onSpinWait"}
  - {class: org.agrona.io.DirectBufferDataInput, method: wrap, match: "(final DirectBuffer buffer)", note: "DirectBufferDataInput.wrap"}
