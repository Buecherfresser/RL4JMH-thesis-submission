# Curated performance-mutation sites for j2v8 (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants j2v8 --source data/external-src/<checkout> \
#       --sites data/projects/j2v8/mutation_sites.yaml

package_root: com.eclipsesource.v8

sites:
  - {class: com.eclipsesource.v8.V8Array, method: createTwin, match: "()", note: "V8Array.createTwin"}
  - {class: com.eclipsesource.v8.debug.mirror.ArrayMirror, method: isArray, match: "()", note: "ArrayMirror.isArray"}
  - {class: com.eclipsesource.v8.example.J2V8Example, method: main, match: "(String[] args)", note: "J2V8Example.main"}
  - {class: com.eclipsesource.v8.inspector.V8Inspector, method: createV8Inspector, match: "(final V8 runtime, final V8InspectorDelegate inspectorDelegate, final String contextName)", note: "V8Inspector.createV8Inspector"}
  - {class: com.eclipsesource.v8.utils.ArrayBuffer, method: isAvailable, match: "()", note: "ArrayBuffer.isAvailable"}
  - {class: com.eclipsesource.v8.V8Array, method: twin, match: "()", note: "V8Array.twin"}
  - {class: com.eclipsesource.v8.debug.mirror.ArrayMirror, method: length, match: "()", note: "ArrayMirror.length"}
  - {class: com.eclipsesource.v8.inspector.V8Inspector, method: createV8Inspector, match: "(final V8 runtime, final V8InspectorDelegate inspectorDelegate)", note: "V8Inspector.createV8Inspector"}
  - {class: com.eclipsesource.v8.utils.ArrayBuffer, method: getV8ArrayBuffer, match: "()", note: "ArrayBuffer.getV8ArrayBuffer"}
  - {class: com.eclipsesource.v8.V8ArrayBuffer, method: initialize, match: "(final long runtimePtr, final Object data)", note: "V8ArrayBuffer.initialize"}
  - {class: com.eclipsesource.v8.debug.mirror.FunctionMirror, method: getName, match: "()", note: "FunctionMirror.getName"}
  - {class: com.eclipsesource.v8.utils.TypedArray, method: isAvailable, match: "()", note: "TypedArray.isAvailable"}
  - {class: com.eclipsesource.v8.V8ArrayBuffer, method: createTwin, match: "()", note: "V8ArrayBuffer.createTwin"}
  - {class: com.eclipsesource.v8.debug.mirror.FunctionMirror, method: getScriptName, match: "()", note: "FunctionMirror.getScriptName"}
  - {class: com.eclipsesource.v8.utils.TypedArray, method: getV8TypedArray, match: "()", note: "TypedArray.getV8TypedArray"}
  - {class: com.eclipsesource.v8.V8Function, method: createTwin, match: "()", note: "V8Function.createTwin"}
  - {class: com.eclipsesource.v8.debug.mirror.NumberMirror, method: isNumber, match: "()", note: "NumberMirror.isNumber"}
  - {class: com.eclipsesource.v8.utils.V8Map, method: close, match: "()", note: "V8Map.close"}
  - {class: com.eclipsesource.v8.V8Function, method: initialize, match: "(final long runtimePtr, final Object data)", note: "V8Function.initialize"}
  - {class: com.eclipsesource.v8.debug.mirror.PropertiesArray, method: getProperty, match: "(final int index)", note: "PropertiesArray.getProperty"}
  - {class: com.eclipsesource.v8.utils.V8Map, method: release, match: "()", note: "V8Map.release"}
  - {class: com.eclipsesource.v8.V8TypedArray, method: createTwin, match: "()", note: "V8TypedArray.createTwin"}
  - {class: com.eclipsesource.v8.debug.mirror.PropertiesArray, method: close, match: "()", note: "PropertiesArray.close"}
  - {class: com.eclipsesource.v8.utils.V8ObjectUtils, method: getValue, match: "(final Object v8Object)", note: "V8ObjectUtils.getValue"}
  - {class: com.eclipsesource.v8.V8TypedArray, method: getBuffer, match: "()", note: "V8TypedArray.getBuffer"}
  - {class: com.eclipsesource.v8.debug.mirror.StringMirror, method: isString, match: "()", note: "StringMirror.isString"}
  - {class: com.eclipsesource.v8.utils.V8ObjectUtils, method: getValue, match: "(final Object v8Object, final TypeAdapter adapter)", note: "V8ObjectUtils.getValue"}
  - {class: com.eclipsesource.v8.LibraryLoader, method: computeLibraryShortName, match: "(boolean withLinuxVendor)", note: "LibraryLoader.computeLibraryShortName"}
  - {class: com.eclipsesource.v8.debug.BreakEvent, method: getSourceLine, match: "()", note: "BreakEvent.getSourceLine"}
  - {class: com.eclipsesource.v8.utils.V8PropertyMap, method: size, match: "()", note: "V8PropertyMap.size"}
  - {class: com.eclipsesource.v8.LibraryLoader, method: computeLibraryFullName, match: "(boolean withLinuxVendor)", note: "LibraryLoader.computeLibraryFullName"}
  - {class: com.eclipsesource.v8.debug.BreakEvent, method: getSourceColumn, match: "()", note: "BreakEvent.getSourceColumn"}
  - {class: com.eclipsesource.v8.utils.V8PropertyMap, method: isEmpty, match: "()", note: "V8PropertyMap.isEmpty"}
  - {class: com.eclipsesource.v8.NodeJS, method: createNodeJS, match: "()", note: "NodeJS.createNodeJS"}
