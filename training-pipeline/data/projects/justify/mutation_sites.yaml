  - {class: org.leadpony.justify.internal.base.json.JsonValueParser, method: getString, match: "()", note: "JsonValueParser.getString"}
  - {class: org.leadpony.justify.cli.RemoteLocation, method: resolve, match: "(Location other)", note: "RemoteLocation.resolve"}
  - {class: org.leadpony.justify.internal.base.json.JsonValueParser, method: isIntegralNumber, match: "()", note: "JsonValueParser.isIntegralNumber"}
  - {class: org.leadpony.justify.cli.Status, method: code, match: "()", note: "Status.code"}
