# Curated performance-mutation sites for core (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants core --source data/external-src/<checkout> \
#       --sites data/projects/core/mutation_sites.yaml

package_root: org.burningwave.core

sites:
  - {class: org.burningwave.core.Strings, method: create, match: "()", note: "Strings.create"}
  - {class: org.burningwave.core.assembler.ComponentContainer, method: setFileName, match: "(String name)", note: "ComponentContainer.setFileName"}
  - {class: org.burningwave.core.classes.FunctionSourceGenerator, method: create, match: "(String name)", note: "FunctionSourceGenerator.create"}
