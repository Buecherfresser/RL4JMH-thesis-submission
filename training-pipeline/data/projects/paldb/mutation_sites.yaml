# Curated performance-mutation sites for paldb (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants paldb --source data/external-src/<checkout> \
#       --sites data/projects/paldb/mutation_sites.yaml

package_root: com.linkedin.paldb

sites:
  - {class: com.linkedin.paldb.api.Configuration, method: getBoolean, match: "(String key, boolean defaultValue)", note: "Configuration.getBoolean"}
  - {class: com.linkedin.paldb.impl.ReaderImpl, method: close, match: "()", note: "ReaderImpl.close"}
  - {class: com.linkedin.paldb.utils.HashUtils, method: hash, match: "(byte[] bytes)", note: "HashUtils.hash"}
  - {class: com.linkedin.paldb.api.Configuration, method: getBoolean, match: "(String key)", note: "Configuration.getBoolean"}
  - {class: com.linkedin.paldb.impl.ReaderImpl, method: size, match: "()", note: "ReaderImpl.size"}
  - {class: com.linkedin.paldb.utils.HashUtils, method: getValue, match: "()", note: "HashUtils.getValue"}
  - {class: com.linkedin.paldb.api.Configuration, method: getShort, match: "(String key, short defaultValue)", note: "Configuration.getShort"}
  - {class: com.linkedin.paldb.impl.ReaderImpl, method: getConfiguration, match: "()", note: "ReaderImpl.getConfiguration"}
  - {class: com.linkedin.paldb.utils.HashUtils, method: getIntValue, match: "()", note: "HashUtils.getIntValue"}
  - {class: com.linkedin.paldb.api.Configuration, method: getShort, match: "(String key)", note: "Configuration.getShort"}
  - {class: com.linkedin.paldb.impl.ReaderImpl, method: getFile, match: "()", note: "ReaderImpl.getFile"}
  - {class: com.linkedin.paldb.utils.HashUtils, method: reset, match: "()", note: "HashUtils.reset"}
  - {class: com.linkedin.paldb.api.PalDB, method: createReader, match: "(File file)", note: "PalDB.createReader"}
  - {class: com.linkedin.paldb.impl.ReaderIterable, method: iterator, match: "()", note: "ReaderIterable.iterator"}
  - {class: com.linkedin.paldb.utils.TempUtils, method: createTempDir, match: "(String prefix)", note: "TempUtils.createTempDir"}
  - {class: com.linkedin.paldb.api.PalDB, method: createReader, match: "(File file, Configuration config)", note: "PalDB.createReader"}
  - {class: com.linkedin.paldb.impl.ReaderIterable, method: getKey, match: "()", note: "ReaderIterable.getKey"}
  - {class: com.linkedin.paldb.utils.TempUtils, method: copyIntoTempFile, match: "(String fileName, InputStream inputStream)", note: "TempUtils.copyIntoTempFile"}
  - {class: com.linkedin.paldb.api.PalDB, method: createReader, match: "(InputStream stream, Configuration config)", note: "PalDB.createReader"}
  - {class: com.linkedin.paldb.impl.ReaderIterable, method: getValue, match: "()", note: "ReaderIterable.getValue"}
  - {class: com.linkedin.paldb.utils.DataInputOutput, method: getBuf, match: "()", note: "DataInputOutput.getBuf"}
  - {class: com.linkedin.paldb.api.PalDB, method: createWriter, match: "(File file)", note: "PalDB.createWriter"}
  - {class: com.linkedin.paldb.impl.ReaderIterable, method: setValue, match: "(Object value)", note: "ReaderIterable.setValue"}
  - {class: com.linkedin.paldb.utils.DataInputOutput, method: getPos, match: "()", note: "DataInputOutput.getPos"}
  - {class: com.linkedin.paldb.impl.ReaderKeyIterable, method: iterator, match: "()", note: "ReaderKeyIterable.iterator"}
  - {class: com.linkedin.paldb.utils.DataInputOutput, method: reset, match: "()", note: "DataInputOutput.reset"}
  - {class: com.linkedin.paldb.impl.Serializers, method: registerSerializer, match: "(Serializer serializer)", note: "Serializers.registerSerializer"}
  - {class: com.linkedin.paldb.utils.DataInputOutput, method: resetForReading, match: "()", note: "DataInputOutput.resetForReading"}
  - {class: com.linkedin.paldb.impl.Serializers, method: getSerializer, match: "(Class cls)", note: "Serializers.getSerializer"}
  - {class: com.linkedin.paldb.utils.FormatVersion, method: is, match: "(FormatVersion fv)", note: "FormatVersion.is"}
  - {class: com.linkedin.paldb.impl.StorageCache, method: removeEldestEntry, match: "(Map.Entry eldest)", note: "StorageCache.removeEldestEntry"}
  - {class: com.linkedin.paldb.utils.FormatVersion, method: getBytes, match: "()", note: "FormatVersion.getBytes"}
  - {class: com.linkedin.paldb.impl.StorageCache, method: setMaxWeight, match: "(long maxWeight)", note: "StorageCache.setMaxWeight"}
  - {class: com.linkedin.paldb.utils.FormatVersion, method: fromBytes, match: "(byte[] bytes)", note: "FormatVersion.fromBytes"}
  - {class: com.linkedin.paldb.impl.StorageCache, method: size, match: "()", note: "StorageCache.size"}
  - {class: com.linkedin.paldb.utils.FormatVersion, method: getPrefixBytes, match: "()", note: "FormatVersion.getPrefixBytes"}
  - {class: com.linkedin.paldb.impl.StorageCache, method: getWeight, match: "()", note: "StorageCache.getWeight"}
  - {class: com.linkedin.paldb.impl.StorageReader, method: close, match: "()", note: "StorageReader.close"}
