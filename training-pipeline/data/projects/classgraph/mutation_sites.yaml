# Curated performance-mutation sites for classgraph (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants classgraph --source data/external-src/<checkout> \
#       --sites data/projects/classgraph/mutation_sites.yaml

package_root: nonapi.io.github

sites:
  - {class: nonapi.io.github.classgraph.fileslice.ArraySlice, method: slice, match: "(final long offset, final long length, final boolean isDeflatedZipEntry,", note: "ArraySlice.slice"}
  - {class: nonapi.io.github.classgraph.fileslice.ArraySlice, method: load, match: "() throws IOException", note: "ArraySlice.load"}
  - {class: nonapi.io.github.classgraph.fileslice.reader.RandomAccessArrayReader, method: readUnsignedByte, match: "(final long offset) throws IOException", note: "RandomAccessArrayReader.readUnsignedByte"}
  - {class: nonapi.io.github.classgraph.fileslice.reader.RandomAccessArrayReader, method: readShort, match: "(final long offset) throws IOException", note: "RandomAccessArrayReader.readShort"}
  - {class: nonapi.io.github.classgraph.fileslice.reader.RandomAccessByteBufferReader, method: readUnsignedByte, match: "(final long offset) throws IOException", note: "RandomAccessByteBufferReader.readUnsignedByte"}
  - {class: nonapi.io.github.classgraph.fileslice.reader.RandomAccessByteBufferReader, method: readUnsignedShort, match: "(final long offset) throws IOException", note: "RandomAccessByteBufferReader.readUnsignedShort"}
  - {class: nonapi.io.github.classgraph.json.JSONUtils, method: makeAccessible, match: "(final AccessibleObject obj, final ReflectionUtils reflectionUtils)", note: "JSONUtils.makeAccessible"}
  - {class: nonapi.io.github.classgraph.json.JSONUtils, method: call, match: "() throws Exception", note: "JSONUtils.call"}
  - {class: nonapi.io.github.classgraph.reflection.ReflectionUtils, method: getFieldVal, match: "(final boolean throwException, final Object obj, final Field field)", note: "ReflectionUtils.getFieldVal"}
  - {class: nonapi.io.github.classgraph.reflection.ReflectionUtils, method: getFieldVal, match: "(final boolean throwException, final Object obj, final String fieldName)", note: "ReflectionUtils.getFieldVal"}
  - {class: nonapi.io.github.classgraph.types.Parser, method: getPositionInfo, match: "()", note: "Parser.getPositionInfo"}
  - {class: nonapi.io.github.classgraph.types.Parser, method: setState, match: "(final Object state)", note: "Parser.setState"}
  - {class: nonapi.io.github.classgraph.types.TypeUtils, method: getIdentifierToken, match: "(final Parser parser, final boolean stopAtDollarSign,", note: "TypeUtils.getIdentifierToken"}
  - {class: nonapi.io.github.classgraph.types.TypeUtils, method: modifiersToString, match: "(final int modifiers, final ModifierType modifierType,", note: "TypeUtils.modifiersToString"}
  - {class: nonapi.io.github.classgraph.utils.CollectionUtils, method: sortIfNotEmpty, match: "(final List<T> list)", note: "CollectionUtils.sortIfNotEmpty"}
  - {class: nonapi.io.github.classgraph.utils.CollectionUtils, method: sortIfNotEmpty, match: "(final List<T> list, final Comparator<? super T> comparator)", note: "CollectionUtils.sortIfNotEmpty"}
  - {class: nonapi.io.github.classgraph.utils.FileUtils, method: currDirPath, match: "()", note: "FileUtils.currDirPath"}
  - {class: nonapi.io.github.classgraph.utils.FileUtils, method: sanitizeEntryPath, match: "(final String path, final boolean removeInitialSlash,", note: "FileUtils.sanitizeEntryPath"}
  - {class: nonapi.io.github.classgraph.utils.JarUtils, method: smartPathSplit, match: "(final String pathStr, final ScanSpec scanSpec)", note: "JarUtils.smartPathSplit"}
  - {class: nonapi.io.github.classgraph.utils.JarUtils, method: smartPathSplit, match: "(final String pathStr, final char separatorChar, final ScanSpec scanSpec)", note: "JarUtils.smartPathSplit"}
  - {class: nonapi.io.github.classgraph.utils.ProxyingInputStream, method: readAllBytes, match: "() throws IOException", note: "ProxyingInputStream.readAllBytes"}
  - {class: nonapi.io.github.classgraph.utils.ProxyingInputStream, method: readNBytes, match: "(final int len) throws IOException", note: "ProxyingInputStream.readNBytes"}
  - {class: nonapi.io.github.classgraph.utils.StringUtils, method: readString, match: "(final byte[] arr, final int startOffset, final int numBytes,", note: "StringUtils.readString"}
  - {class: nonapi.io.github.classgraph.utils.StringUtils, method: join, match: "(final StringBuilder buf, final String addAtBeginning, final String sep,", note: "StringUtils.join"}
  - {class: nonapi.io.github.classgraph.utils.URLPathEncoder, method: decodePath, match: "(final String str)", note: "URLPathEncoder.decodePath"}
  - {class: nonapi.io.github.classgraph.utils.URLPathEncoder, method: encodePath, match: "(final String path)", note: "URLPathEncoder.encodePath"}
  - {class: nonapi.io.github.classgraph.classloaderhandler.AntClassLoaderHandler, method: canHandle, match: "(final Class<?> classLoaderClass, final LogNode log)", note: "AntClassLoaderHandler.canHandle"}
  - {class: nonapi.io.github.classgraph.classloaderhandler.AntClassLoaderHandler, method: findClassLoaderOrder, match: "(final ClassLoader classLoader, final ClassLoaderOrder classLoaderOrder,", note: "AntClassLoaderHandler.findClassLoaderOrder"}
