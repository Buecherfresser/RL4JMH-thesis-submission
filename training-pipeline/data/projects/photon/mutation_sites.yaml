  - {class: de.komoot.photon.searcher.TagFilter, method: TagFilter, match: "(TagFilterKind kind, @Nullable String key, @Nullable String value)", note: "TagFilter.TagFilter"}
  - {class: de.komoot.photon.ConfigClassificationTerm, method: isValidCategory, match: "()", note: "ConfigClassificationTerm.isValidCategory"}
  - {class: de.komoot.photon.cli.PhotonUsageFormatter, method: usage, match: "(String command, StringBuilder stringBuilder)", note: "PhotonUsageFormatter.usage"}
  - {class: de.komoot.photon.config.ImportFileConfig, method: getImportFile, match: "()", note: "ImportFileConfig.getImportFile"}
  - {class: de.komoot.photon.json.JsonReader, method: setExtraTags, match: "(ConfigExtraTags extraTags)", note: "JsonReader.setExtraTags"}
  - {class: de.komoot.photon.nominatim.model.OsmlineRowMapper, method: makeBaseQuery, match: "(DBDataAdapter dbutils)", note: "OsmlineRowMapper.makeBaseQuery"}
  - {class: de.komoot.photon.opensearch.IndexSettingBuilder, method: setShards, match: "(int numShards)", note: "IndexSettingBuilder.setShards"}
  - {class: de.komoot.photon.query.RequestFactoryBase, method: parseLatLon, match: "(Context context, boolean mandatory)", note: "RequestFactoryBase.parseLatLon"}
