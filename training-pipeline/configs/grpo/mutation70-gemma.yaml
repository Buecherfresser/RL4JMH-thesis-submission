# Gemma 4 E2B — coverage-guided 70%-mutation GRPO over the full mutation-scorable corpus.
#
# Same reward as configs/grpo/jmh-rl-coverage-mutation.yaml (mutation 0.70, coverage_aware),
# but the prompt set is every project that has a patched mutant jar AND a hidden registry
# (1097 prompts / 55 projects) instead of the six-library `corpus: original` slice (113 prompts).
# `corpus: full` is therefore correct here: dataset_path is already pre-filtered by
# scripts/build_mutation_corpus.py, so nothing unscorable can leak in.
#
#   uv run python scripts/build_mutation_corpus.py        # regenerate the prompt set
#   uv run jmh-train-grpo --config configs/grpo/mutation70-gemma.yaml --corpus full

base_model: google/gemma-4-E2B-it
output_dir: outputs/grpo-mutation70-gemma
dataset_path: data/snippets/rl-mutation.good.jsonl
corpus: full
seed: 42

finetune_mode: lora
precision: bf16
gradient_checkpointing: true
attn_implementation: sdpa
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  exclude_modules: [vision_tower, audio_tower, multi_modal_projector]
  bias: none

learning_rate: 1.0e-6
# 2x4 rather than 4x2: same global batch (8 = group_size, so the gradient is numerically
# unchanged) at half the peak activation memory. The 4x2 shape OOM'd in backward at step
# 108/744 of job 5721357 on a 94GB H100 -- a batch with unusually long completions
# (mean 594, max 714, clipped_ratio 0.25) asked for 16 GiB against a fragmented heap.
per_device_batch_size: 2
gradient_accumulation_steps: 4
group_size: 8
rollout_temperature: 1.0
top_p: 0.95
top_k: 64
max_prompt_length: 8192
max_completion_length: 4096
completion_eos_token_id: 106
# 24000 chars ~ 6k tokens: keeps every prompt inside max_prompt_length. Drops the 170
# largest of the 1097 subjects (927 remain); raising it would truncate prompts instead.
max_source_chars: 24000
limit_prompts: 0

kl_coeff: 0.0
epsilon: 0.2
epsilon_high: 0.28
grpo_loss_type: dr_grpo
scale_rewards: false
mask_truncated_completions: true
mu: 1

num_epochs: 1.0
num_iterations: 0
warmup_ratio: 0.03
logging_steps: 1
# Slurm caps this QOS at 2 days, which is shorter than one epoch over 927 prompts.
# Checkpoint often so a follow-up job can resume instead of restarting.
save_steps: 25
# 'auto' = continue from the newest checkpoint-* in output_dir, or start fresh if none.
# Guards against losing hours to a crash or the 2-day wall; see training-run-failures.md.
resume_from_checkpoint: auto
report_to: none

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.30
vllm_max_model_length: 16384
vllm_tensor_parallel_size: 1
vllm_enable_sleep_mode: true

reward_weights:
  compile: 0.10
  runtime: 0.10
  anti_pattern: 0.05
  rsd: 0.05
  mutation: 0.70
# SpotJMHBugs (Costa et al., TSE 2019) bytecode analysis, not the regex pre-screen.
# regex is only a static approximation; spotjmh is the actual detector. Requires
# vendor/spotbugs (tools/install_spotjmhbugs.sh) -- preflight_grpo.py --reward-smoke
# fails the run if the backend is missing, since r_anti would otherwise be dead weight.
anti_pattern_backend: spotjmh
need_run: true
rsd_good: 0.05
rsd_bad: 0.25

mutation:
  alpha: 0.05
  min_slowdown: 1.10
  arm_property: jmhbench.mutant
  coverage_guidance: true
  max_mutants_per_candidate: 0
  max_benchmarks_per_mutant: 6
  mode: coverage_aware
  coverage_weight: 0.30
  coverage_jmh:
    warmup_iterations: 0
    measurement_iterations: 1
    forks: 1
    warmup_time: "100ms"
    measurement_time: "100ms"
    timeout_s: 120.0
    per_iteration_timeout_s: 60.0
    fail_on_error: false

runner:
  jmh_version: "1.37"
  java_release: 17
  jmh:
    warmup_iterations: 3
    measurement_iterations: 5
    forks: 1
    warmup_time: "200ms"
    measurement_time: "200ms"
    timeout_s: 120.0
    per_iteration_timeout_s: 60.0
    fail_on_error: false

