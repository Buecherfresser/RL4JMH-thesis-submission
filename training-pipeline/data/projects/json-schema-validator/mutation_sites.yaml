# Curated performance-mutation sites for json-schema-validator (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants json-schema-validator --source data/external-src/<checkout> \
#       --sites data/projects/json-schema-validator/mutation_sites.yaml

package_root: com.networknt.schema

sites:
