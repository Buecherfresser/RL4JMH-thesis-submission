# Curated performance-mutation sites for phtree (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants phtree --source data/external-src/<checkout> \
#       --sites data/projects/phtree/mutation_sites.yaml

package_root: ch.ethz.globis

sites:
  - {class: ch.ethz.globis.pht64kd.MaxKTree, method: create, match: "(int dims, int depth)", note: "MaxKTree.create"}
  - {class: ch.ethz.globis.phtree.PhRangeQuery, method: reset, match: "(double range, long... center)", note: "PhRangeQuery.reset"}
  - {class: ch.ethz.globis.pht64kd.MaxKTree, method: insert, match: "(long ... key)", note: "MaxKTree.insert"}
  - {class: ch.ethz.globis.phtree.PhRangeQuery, method: nextKey, match: "()", note: "PhRangeQuery.nextKey"}
  - {class: ch.ethz.globis.pht64kd.MaxKTree64, method: create, match: "()", note: "MaxKTree64.create"}
  - {class: ch.ethz.globis.phtree.PhTreeMultiMapF, method: create, match: "(int dim)", note: "PhTreeMultiMapF.create"}
  - {class: ch.ethz.globis.pht64kd.MaxKTree64, method: create, match: "(int keyWidth)", note: "MaxKTree64.create"}
  - {class: ch.ethz.globis.phtree.PhTreeMultiMapF, method: create, match: "(int dim, PreProcessorPointF pre)", note: "PhTreeMultiMapF.create"}
  - {class: ch.ethz.globis.phtree.PhTreeMultiMapF2, method: create, match: "(int dim)", note: "PhTreeMultiMapF2.create"}
  - {class: ch.ethz.globis.phtree.PhTreeMultiMapF2, method: create, match: "(int dim, PreProcessorPointF pre)", note: "PhTreeMultiMapF2.create"}
