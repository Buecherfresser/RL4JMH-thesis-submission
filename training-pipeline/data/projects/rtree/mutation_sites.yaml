  - {class: com.conversantmedia.util.collection.geometry.Rect3d, method: getMbr, match: "(final HyperRect r)", note: "Rect3d.getMbr"}
  - {class: com.conversantmedia.util.collection.geometry.Rect3d, method: getNDim, match: "()", note: "Rect3d.getNDim"}
