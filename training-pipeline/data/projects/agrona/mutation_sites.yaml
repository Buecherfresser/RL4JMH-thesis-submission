  - {class: org.agrona.agent.BufferAlignmentException, method: index, match: "()", note: "BufferAlignmentException.index"}
  - {class: org.agrona.build.UnsafeApiBytecodeGenerator, method: apply, match: "(", note: "UnsafeApiBytecodeGenerator.apply"}
