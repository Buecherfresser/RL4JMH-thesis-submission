# Curated performance-mutation sites for geometry-api-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants geometry-api-java --source data/external-src/<checkout> \
#       --sites data/projects/geometry-api-java/mutation_sites.yaml

package_root: com.esri.core

