  - {class: io.github.bonigarcia.wdm.WdmServer, method: exchange, match: "(String url, String method, String json,", note: "WdmServer.exchange"}
  - {class: io.github.bonigarcia.wdm.WdmServer, method: getCapabilities, match: "()", note: "WdmServer.getCapabilities"}
  - {class: io.github.bonigarcia.wdm.cache.CacheHandler, method: filterCacheBy, match: "(List<File> input, String key,", note: "CacheHandler.filterCacheBy"}
  - {class: io.github.bonigarcia.wdm.cache.CacheHandler, method: getFilesInCache, match: "()", note: "CacheHandler.getFilesInCache"}
  - {class: io.github.bonigarcia.wdm.cache.ResolutionCache, method: keys, match: "()", note: "ResolutionCache.keys"}
  - {class: io.github.bonigarcia.wdm.cache.ResolutionCache, method: getValueFromResolutionCache, match: "(String key)", note: "ResolutionCache.getValueFromResolutionCache"}
