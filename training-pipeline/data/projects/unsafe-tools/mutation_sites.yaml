# Curated performance-mutation sites for unsafe-tools (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants unsafe-tools --source data/external-src/<checkout> \
#       --sites data/projects/unsafe-tools/mutation_sites.yaml

package_root: com.alexkasko.unsafe

sites:
  - {class: com.alexkasko.unsafe.bytearray.BitShiftLittleEndianByteArrayTool, method: isUnsafe, match: "()", note: "BitShiftLittleEndianByteArrayTool.isUnsafe"}
  - {class: com.alexkasko.unsafe.offheap.OffHeapUtils, method: free, match: "(OffHeapDisposable disposable)", note: "OffHeapUtils.free"}
