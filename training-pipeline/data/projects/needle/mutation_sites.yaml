# Curated performance-mutation sites for needle (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants needle --source data/external-src/<checkout> \
#       --sites data/projects/needle/mutation_sites.yaml

package_root: com.justinblank.strings

sites:
  - {class: com.justinblank.strings.ByteClassUtil, method: fillBytes, match: "(byte[] bytes, byte state, int startingIndex, int endingIndex)", note: "ByteClassUtil.fillBytes"}
  - {class: com.justinblank.strings.RegexAST.CharRangeNode, method: range, match: "()", note: "CharRangeNode.range"}
  - {class: com.justinblank.strings.Search.AsciiAhoCorasickBuilder, method: buildAhoCorasick, match: "(Collection<String> strings)", note: "AsciiAhoCorasickBuilder.buildAhoCorasick"}
  - {class: com.justinblank.strings.precompile.Precompile, method: precompile, match: "(String regex, String className, File directory) throws IOException", note: "Precompile.precompile"}
  - {class: com.justinblank.strings.ByteClassUtil, method: fillMultipleByteClassesFromString_singleArray, match: "(byte[] stateTransitionArray, int length, String s)", note: "ByteClassUtil.fillMultipleByteClassesFromString_singleArray"}
  - {class: com.justinblank.strings.RegexAST.CharRangeNode, method: minLength, match: "()", note: "CharRangeNode.minLength"}
  - {class: com.justinblank.strings.Search.AsciiAhoCorasickBuilder, method: build, match: "(Collection<String> strings, boolean complete)", note: "AsciiAhoCorasickBuilder.build"}
  - {class: com.justinblank.strings.precompile.Precompile, method: precompile, match: "(String regex, String className, File directory, int flags) throws IOException", note: "Precompile.precompile"}
  - {class: com.justinblank.strings.CharRange, method: of, match: "(char start, char end)", note: "CharRange.of"}
  - {class: com.justinblank.strings.RegexAST.Concatenation, method: concatenate, match: "(Node head, Node tail)", note: "Concatenation.concatenate"}
  - {class: com.justinblank.strings.Search.SearchMethodUtil, method: checkIndices, match: "(String s, int start, int end)", note: "SearchMethodUtil.checkIndices"}
  - {class: com.justinblank.strings.CharRange, method: allChars, match: "()", note: "CharRange.allChars"}
  - {class: com.justinblank.strings.RegexAST.Concatenation, method: minLength, match: "()", note: "Concatenation.minLength"}
  - {class: com.justinblank.strings.Search.UnicodeAhoCorasickBuilder, method: buildAhoCorasick, match: "(Collection<String> strings)", note: "UnicodeAhoCorasickBuilder.buildAhoCorasick"}
  - {class: com.justinblank.strings.DFAClassBuilder, method: allMethods, match: "()", note: "DFAClassBuilder.allMethods"}
  - {class: com.justinblank.strings.RegexAST.CountedRepetition, method: minLength, match: "()", note: "CountedRepetition.minLength"}
  - {class: com.justinblank.strings.Search.UnicodeAhoCorasickBuilder, method: build, match: "(Collection<String> strings)", note: "UnicodeAhoCorasickBuilder.build"}
  - {class: com.justinblank.strings.DFADebugUtils, method: debugState, match: "(int state, char c)", note: "DFADebugUtils.debugState"}
  - {class: com.justinblank.strings.RegexAST.CountedRepetition, method: maxLength, match: "()", note: "CountedRepetition.maxLength"}
  - {class: com.justinblank.strings.Search.ASCIIAhoCorasick, method: find, match: "(String s, int start, int end, boolean anchored)", note: "ASCIIAhoCorasick.find"}
  - {class: com.justinblank.strings.DFADebugUtils, method: debugStateTransition, match: "(int newState)", note: "DFADebugUtils.debugStateTransition"}
  - {class: com.justinblank.strings.RegexAST.LParenNode, method: getInstance, match: "()", note: "LParenNode.getInstance"}
  - {class: com.justinblank.strings.Search.SearchMethodMatcher, method: containedIn, match: "()", note: "SearchMethodMatcher.containedIn"}
  - {class: com.justinblank.strings.RangeGroup, method: compareTo, match: "(RangeGroup o)", note: "RangeGroup.compareTo"}
  - {class: com.justinblank.strings.RegexAST.LParenNode, method: minLength, match: "()", note: "LParenNode.minLength"}
  - {class: com.justinblank.strings.Search.SearchMethodMatcher, method: find, match: "()", note: "SearchMethodMatcher.find"}
  - {class: com.justinblank.strings.RegexInstrBuilder, method: createNFA, match: "(Node ast)", note: "RegexInstrBuilder.createNFA"}
  - {class: com.justinblank.strings.RegexAST.LiteralNode, method: fromChar, match: "(char c)", note: "LiteralNode.fromChar"}
  - {class: com.justinblank.strings.Search.SearchMethods, method: makeSearchMethod, match: "(Collection<String> strings)", note: "SearchMethods.makeSearchMethod"}
  - {class: com.justinblank.strings.RegexInstrBuilder, method: createNFA, match: "(Node ast, boolean leftMostLongest)", note: "RegexInstrBuilder.createNFA"}
  - {class: com.justinblank.strings.RegexAST.LiteralNode, method: minLength, match: "()", note: "LiteralNode.minLength"}
