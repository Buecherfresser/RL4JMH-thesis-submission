# Curated performance-mutation sites for jcommander (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jcommander --source data/external-src/<checkout> \
#       --sites data/projects/jcommander/mutation_sites.yaml

package_root: com.beust.jcommander

sites:
  - {class: com.beust.jcommander.FuzzyMap, method: findInMap, match: "(Map<? extends IKey, V> map, IKey name,", note: "FuzzyMap.findInMap"}
  - {class: com.beust.jcommander.converters.CharArrayConverter, method: convert, match: "(final String value)", note: "CharArrayConverter.convert"}
  - {class: com.beust.jcommander.defaultprovider.EnvironmentVariableDefaultProvider, method: getDefaultValueFor, match: "(final String optionName)", note: "EnvironmentVariableDefaultProvider.getDefaultValueFor"}
  - {class: com.beust.jcommander.internal.Lists, method: newArrayList, match: "()", note: "Lists.newArrayList"}
  - {class: com.beust.jcommander.parser.DefaultParameterizedParser, method: parseArg, match: "(Object annotatedObj)", note: "DefaultParameterizedParser.parseArg"}
  - {class: com.beust.jcommander.validators.NoValidator, method: validate, match: "(String parameterName, String parameterValue)", note: "NoValidator.validate"}
  - {class: com.beust.jcommander.StringKey, method: StringKey, match: "(String name) implements IKey", note: "StringKey.StringKey"}
  - {class: com.beust.jcommander.converters.DefaultListConverter, method: convert, match: "(String value)", note: "DefaultListConverter.convert"}
  - {class: com.beust.jcommander.defaultprovider.PropertyFileDefaultProvider, method: getDefaultValueFor, match: "(String optionName)", note: "PropertyFileDefaultProvider.getDefaultValueFor"}
  - {class: com.beust.jcommander.internal.Lists, method: newArrayList, match: "(Collection<K> c)", note: "Lists.newArrayList"}
  - {class: com.beust.jcommander.validators.NoValueValidator, method: validate, match: "(String parameterName, T parameterValue)", note: "NoValueValidator.validate"}
  - {class: com.beust.jcommander.StringKey, method: getName, match: "()", note: "StringKey.getName"}
  - {class: com.beust.jcommander.converters.StringConverter, method: convert, match: "(String value)", note: "StringConverter.convert"}
  - {class: com.beust.jcommander.internal.Maps, method: newHashMap, match: "()", note: "Maps.newHashMap"}
  - {class: com.beust.jcommander.validators.PositiveInteger, method: validate, match: "(String name, String value)", note: "PositiveInteger.validate"}
  - {class: com.beust.jcommander.Strings, method: isStringEmpty, match: "(String s)", note: "Strings.isStringEmpty"}
  - {class: com.beust.jcommander.converters.BigDecimalConverter, method: convert, match: "(String value)", note: "BigDecimalConverter.convert"}
  - {class: com.beust.jcommander.internal.Maps, method: newLinkedHashMap, match: "()", note: "Maps.newLinkedHashMap"}
  - {class: com.beust.jcommander.Strings, method: startsWith, match: "(String s, String with, boolean isCaseSensitive)", note: "Strings.startsWith"}
  - {class: com.beust.jcommander.converters.BooleanConverter, method: convert, match: "(String value)", note: "BooleanConverter.convert"}
  - {class: com.beust.jcommander.internal.Sets, method: newHashSet, match: "()", note: "Sets.newHashSet"}
  - {class: com.beust.jcommander.DefaultUsageFormatter, method: usage, match: "(String commandName)", note: "DefaultUsageFormatter.usage"}
  - {class: com.beust.jcommander.converters.ByteOrderConverter, method: convert, match: "(final String value)", note: "ByteOrderConverter.convert"}
  - {class: com.beust.jcommander.internal.Sets, method: newLinkedHashSet, match: "()", note: "Sets.newLinkedHashSet"}
  - {class: com.beust.jcommander.DefaultUsageFormatter, method: usage, match: "(String commandName, StringBuilder out)", note: "DefaultUsageFormatter.usage"}
  - {class: com.beust.jcommander.converters.CharsetConverter, method: convert, match: "(final String value)", note: "CharsetConverter.convert"}
  - {class: com.beust.jcommander.internal.DefaultConsole, method: print, match: "(CharSequence msg)", note: "DefaultConsole.print"}
  - {class: com.beust.jcommander.JCommander, method: getDescription, match: "()", note: "JCommander.getDescription"}
  - {class: com.beust.jcommander.converters.CommaParameterSplitter, method: split, match: "(String value)", note: "CommaParameterSplitter.split"}
  - {class: com.beust.jcommander.internal.DefaultConsole, method: println, match: "(CharSequence msg)", note: "DefaultConsole.println"}
  - {class: com.beust.jcommander.JCommander, method: addValue, match: "(Object convertedValue)", note: "JCommander.addValue"}
  - {class: com.beust.jcommander.converters.DoubleConverter, method: convert, match: "(String value)", note: "DoubleConverter.convert"}
  - {class: com.beust.jcommander.internal.DefaultConverterFactory, method: getConverter, match: "(Class forType)", note: "DefaultConverterFactory.getConverter"}
  - {class: com.beust.jcommander.MissingCommandException, method: getUnknownCommand, match: "()", note: "MissingCommandException.getUnknownCommand"}
  - {class: com.beust.jcommander.converters.EnumConverter, method: convert, match: "(String value)", note: "EnumConverter.convert"}
  - {class: com.beust.jcommander.internal.JDK6Console, method: print, match: "(CharSequence msg)", note: "JDK6Console.print"}
  - {class: com.beust.jcommander.ParameterDescription, method: getLongestName, match: "()", note: "ParameterDescription.getLongestName"}
  - {class: com.beust.jcommander.converters.FileConverter, method: convert, match: "(String value)", note: "FileConverter.convert"}
  - {class: com.beust.jcommander.internal.JDK6Console, method: println, match: "(CharSequence msg)", note: "JDK6Console.println"}
  - {class: com.beust.jcommander.ParameterDescription, method: getDefault, match: "()", note: "ParameterDescription.getDefault"}
  - {class: com.beust.jcommander.converters.FloatConverter, method: convert, match: "(String value)", note: "FloatConverter.convert"}
  - {class: com.beust.jcommander.ParameterException, method: setJCommander, match: "(JCommander jc)", note: "ParameterException.setJCommander"}
  - {class: com.beust.jcommander.converters.ISO8601DateConverter, method: convert, match: "(String value)", note: "ISO8601DateConverter.convert"}
  - {class: com.beust.jcommander.ParameterException, method: getJCommander, match: "()", note: "ParameterException.getJCommander"}
  - {class: com.beust.jcommander.converters.InetAddressConverter, method: convert, match: "(String host)", note: "InetAddressConverter.convert"}
  - {class: com.beust.jcommander.Parameterized, method: parseArg, match: "(Object arg)", note: "Parameterized.parseArg"}
  - {class: com.beust.jcommander.converters.InstantConverter, method: supportedFormats, match: "()", note: "InstantConverter.supportedFormats"}
  - {class: com.beust.jcommander.Parameterized, method: getWrappedParameter, match: "()", note: "Parameterized.getWrappedParameter"}
  - {class: com.beust.jcommander.converters.InstantConverter, method: parse, match: "(String value, DateTimeFormatter formatter)", note: "InstantConverter.parse"}
  - {class: com.beust.jcommander.UnixStyleUsageFormatter, method: appendAllParametersDetails, match: "(StringBuilder out, int indentCount, String indent,", note: "UnixStyleUsageFormatter.appendAllParametersDetails"}
