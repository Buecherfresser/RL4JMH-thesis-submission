  - {class: com.github.micycle1.clipper2.core.PointD, method: opNotEquals, match: "(PointD lhs, PointD rhs)", note: "PointD.opNotEquals"}
  - {class: com.github.micycle1.clipper2.core.Rect64, method: getWidth, match: "()", note: "Rect64.getWidth"}
  - {class: com.github.micycle1.clipper2.core.Rect64, method: setWidth, match: "(long value)", note: "Rect64.setWidth"}
  - {class: com.github.micycle1.clipper2.core.Rect64, method: getHeight, match: "()", note: "Rect64.getHeight"}
