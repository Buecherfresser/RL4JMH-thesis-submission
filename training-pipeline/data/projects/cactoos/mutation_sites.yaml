  - {class: org.cactoos.io.HeadOf, method: stream, match: "() throws Exception", note: "HeadOf.stream"}
  - {class: org.cactoos.io.InputNoNulls, method: stream, match: "() throws Exception", note: "InputNoNulls.stream"}
