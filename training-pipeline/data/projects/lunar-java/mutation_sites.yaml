  - {class: com.nlf.calendar.Fu, method: setName, match: "(String name)", note: "Fu.setName"}
  - {class: com.nlf.calendar.eightchar.XiaoYun, method: getYear, match: "()", note: "XiaoYun.getYear"}
  - {class: com.nlf.calendar.util.SolarUtil, method: isLeapYear, match: "(int year)", note: "SolarUtil.isLeapYear"}
  - {class: com.nlf.calendar.Holiday, method: getDay, match: "()", note: "Holiday.getDay"}
