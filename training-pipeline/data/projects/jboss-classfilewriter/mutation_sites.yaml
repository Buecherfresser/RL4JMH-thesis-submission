# Curated performance-mutation sites for jboss-classfilewriter (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jboss-classfilewriter --source data/external-src/<checkout> \
#       --sites data/projects/jboss-classfilewriter/mutation_sites.yaml

package_root: org.jboss.classfilewriter

sites:
