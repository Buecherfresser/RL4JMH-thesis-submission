# Curated benchmarkable classes for RoaringBitmap (GRPO prompt corpus).
#
# Each entry is a concrete class whose public operations are textbook microbenchmark subjects
# (set algebra, rank/select, iteration, (de)serialization inputs). FQCNs verified against
# data/snippets/roaringbitmap.jsonl. Filter with:
#   jmh-curate-snippets --snippets data/snippets/roaringbitmap.jsonl \
#       --good-classes data/projects/roaringbitmap/good_classes.yaml

project: roaringbitmap

classes:
  - org.roaringbitmap.RoaringBitmap
  - org.roaringbitmap.FastRankRoaringBitmap
  - org.roaringbitmap.RoaringBitSet
  - org.roaringbitmap.buffer.MutableRoaringBitmap
  - org.roaringbitmap.buffer.ImmutableRoaringBitmap
  - org.roaringbitmap.longlong.Roaring64Bitmap
  - org.roaringbitmap.longlong.Roaring64NavigableMap
  - org.roaringbitmap.RangeBitmap
  - org.roaringbitmap.FastAggregation
  - org.roaringbitmap.ParallelAggregation
  - org.roaringbitmap.ArrayContainer
  - org.roaringbitmap.BitmapContainer
  - org.roaringbitmap.RunContainer
  - org.roaringbitmap.Util
  - org.roaringbitmap.BitSetUtil
  - org.roaringbitmap.SuccinctRank
