# Curated performance-mutation sites for ow2-asm (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants ow2-asm --source data/external-src/<checkout> \
#       --sites data/projects/ow2-asm/mutation_sites.yaml

package_root: org.objectweb.asm

sites:
  - {class: org.objectweb.asm.AnnotationWriter, method: visit, match: "(final String name, final Object value)", note: "AnnotationWriter.visit"}
  - {class: org.objectweb.asm.commons.AnalyzerAdapter, method: visitInsn, match: "(final int opcode)", note: "AnalyzerAdapter.visitInsn"}
  - {class: org.objectweb.asm.optimizer.NameMapping, method: map, match: "(final String name)", note: "NameMapping.map"}
  - {class: org.objectweb.asm.signature.SignatureReader, method: accept, match: "(final SignatureVisitor v)", note: "SignatureReader.accept"}
  - {class: org.objectweb.asm.tree.InsnList, method: size, match: "()", note: "InsnList.size"}
  - {class: org.objectweb.asm.util.ASMifier, method: main, match: "(final String[] args) throws Exception", note: "ASMifier.main"}
  - {class: org.objectweb.asm.xml.ASMContentHandler, method: match, match: "(final String path)", note: "ASMContentHandler.match"}
  - {class: org.objectweb.asm.AnnotationWriter, method: visitArray, match: "(final String name)", note: "AnnotationWriter.visitArray"}
  - {class: org.objectweb.asm.commons.AnalyzerAdapter, method: visitIntInsn, match: "(final int opcode, final int operand)", note: "AnalyzerAdapter.visitIntInsn"}
  - {class: org.objectweb.asm.optimizer.NameMapping, method: fix, match: "(final String desc)", note: "NameMapping.fix"}
  - {class: org.objectweb.asm.signature.SignatureReader, method: acceptType, match: "(final SignatureVisitor v)", note: "SignatureReader.acceptType"}
  - {class: org.objectweb.asm.tree.InsnList, method: getFirst, match: "()", note: "InsnList.getFirst"}
  - {class: org.objectweb.asm.util.ASMifier, method: visitSource, match: "(final String file, final String debug)", note: "ASMifier.visitSource"}
  - {class: org.objectweb.asm.xml.ASMContentHandler, method: end, match: "(final String name)", note: "ASMContentHandler.end"}
  - {class: org.objectweb.asm.Attribute, method: isUnknown, match: "()", note: "Attribute.isUnknown"}
  - {class: org.objectweb.asm.commons.CodeSizeEvaluator, method: getMinSize, match: "()", note: "CodeSizeEvaluator.getMinSize"}
  - {class: org.objectweb.asm.optimizer.AnnotationConstantsCollector, method: visit, match: "(final String name, final Object value)", note: "AnnotationConstantsCollector.visit"}
  - {class: org.objectweb.asm.signature.SignatureWriter, method: visitFormalTypeParameter, match: "(final String name)", note: "SignatureWriter.visitFormalTypeParameter"}
  - {class: org.objectweb.asm.tree.LineNumberNode, method: accept, match: "(final MethodVisitor mv)", note: "LineNumberNode.accept"}
  - {class: org.objectweb.asm.util.CheckAnnotationAdapter, method: visit, match: "(final String name, final Object value)", note: "CheckAnnotationAdapter.visit"}
  - {class: org.objectweb.asm.xml.Processor, method: process, match: "() throws TransformerException, IOException, SAXException", note: "Processor.process"}
  - {class: org.objectweb.asm.Attribute, method: isCodeAttribute, match: "()", note: "Attribute.isCodeAttribute"}
  - {class: org.objectweb.asm.commons.CodeSizeEvaluator, method: getMaxSize, match: "()", note: "CodeSizeEvaluator.getMaxSize"}
  - {class: org.objectweb.asm.optimizer.AnnotationConstantsCollector, method: visitArray, match: "(final String name)", note: "AnnotationConstantsCollector.visitArray"}
  - {class: org.objectweb.asm.signature.SignatureWriter, method: visitClassBound, match: "()", note: "SignatureWriter.visitClassBound"}
  - {class: org.objectweb.asm.tree.MultiANewArrayInsnNode, method: accept, match: "(final MethodVisitor mv)", note: "MultiANewArrayInsnNode.accept"}
  - {class: org.objectweb.asm.util.CheckAnnotationAdapter, method: visitArray, match: "(final String name)", note: "CheckAnnotationAdapter.visitArray"}
  - {class: org.objectweb.asm.xml.Processor, method: main, match: "(final String[] args) throws Exception", note: "Processor.main"}
  - {class: org.objectweb.asm.ByteVector, method: putByte, match: "(final int b)", note: "ByteVector.putByte"}
  - {class: org.objectweb.asm.commons.GeneratorAdapter, method: push, match: "(final boolean value)", note: "GeneratorAdapter.push"}
  - {class: org.objectweb.asm.optimizer.ClassConstantsCollector, method: visitSource, match: "(final String source, final String debug)", note: "ClassConstantsCollector.visitSource"}
  - {class: org.objectweb.asm.tree.analysis.SmallSet, method: iterator, match: "()", note: "SmallSet.iterator"}
  - {class: org.objectweb.asm.util.CheckClassAdapter, method: main, match: "(final String[] args) throws Exception", note: "CheckClassAdapter.main"}
  - {class: org.objectweb.asm.xml.SAXAdapter, method: getContentHandler, match: "()", note: "SAXAdapter.getContentHandler"}
  - {class: org.objectweb.asm.ByteVector, method: putShort, match: "(final int s)", note: "ByteVector.putShort"}
  - {class: org.objectweb.asm.commons.GeneratorAdapter, method: push, match: "(final int value)", note: "GeneratorAdapter.push"}
  - {class: org.objectweb.asm.optimizer.ClassConstantsCollector, method: visitAttribute, match: "(final Attribute attr)", note: "ClassConstantsCollector.visitAttribute"}
  - {class: org.objectweb.asm.tree.analysis.SmallSet, method: size, match: "()", note: "SmallSet.size"}
  - {class: org.objectweb.asm.util.CheckClassAdapter, method: visitSource, match: "(final String file, final String debug)", note: "CheckClassAdapter.visitSource"}
  - {class: org.objectweb.asm.xml.SAXAdapter, method: addDocumentStart, match: "()", note: "SAXAdapter.addDocumentStart"}
  - {class: org.objectweb.asm.ClassReader, method: getAccess, match: "()", note: "ClassReader.getAccess"}
  - {class: org.objectweb.asm.commons.InstructionAdapter, method: visitInsn, match: "(final int opcode)", note: "InstructionAdapter.visitInsn"}
  - {class: org.objectweb.asm.optimizer.ClassOptimizer, method: visitSource, match: "(final String source, final String debug)", note: "ClassOptimizer.visitSource"}
  - {class: org.objectweb.asm.tree.AnnotationNode, method: visit, match: "(final String name, final Object value)", note: "AnnotationNode.visit"}
  - {class: org.objectweb.asm.util.CheckFieldAdapter, method: visitAttribute, match: "(final Attribute attr)", note: "CheckFieldAdapter.visitAttribute"}
  - {class: org.objectweb.asm.xml.SAXAnnotationAdapter, method: visit, match: "(final String name, final Object value)", note: "SAXAnnotationAdapter.visit"}
  - {class: org.objectweb.asm.ClassReader, method: getClassName, match: "()", note: "ClassReader.getClassName"}
  - {class: org.objectweb.asm.commons.InstructionAdapter, method: visitIntInsn, match: "(final int opcode, final int operand)", note: "InstructionAdapter.visitIntInsn"}
  - {class: org.objectweb.asm.optimizer.ClassOptimizer, method: visitAttribute, match: "(final Attribute attr)", note: "ClassOptimizer.visitAttribute"}
  - {class: org.objectweb.asm.tree.AnnotationNode, method: visitArray, match: "(final String name)", note: "AnnotationNode.visitArray"}
