# Curated performance-mutation sites for avro (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants avro --source data/external-src/<checkout> \
#       --sites data/projects/avro/mutation_sites.yaml

package_root: org.apache.avro

sites:
  - {class: org.apache.avro.JsonSchemaParser, method: parseInternal, match: "(String... fragments)", note: "JsonSchemaParser.parseInternal"}
  - {class: org.apache.avro.codegentest.FixedSizeString, method: getValue, match: "()", note: "FixedSizeString.getValue"}
  - {class: org.apache.avro.compiler.idl.IsResolvedSchemaVisitor, method: visitTerminal, match: "(Schema terminal)", note: "IsResolvedSchemaVisitor.visitTerminal"}
  - {class: org.apache.avro.data.Json, method: setSchema, match: "(Schema schema)", note: "Json.setSchema"}
  - {class: org.apache.avro.file.DataFileStream, method: getHeader, match: "()", note: "DataFileStream.getHeader"}
  - {class: org.apache.avro.generic.GenericRecordBuilder, method: has, match: "(String fieldName)", note: "GenericRecordBuilder.has"}
  - {class: org.apache.avro.grpc.AvroGrpcUtils, method: getServiceName, match: "(Class iface)", note: "AvroGrpcUtils.getServiceName"}
  - {class: org.apache.avro.hadoop.io.AvroKeyComparator, method: setConf, match: "(Configuration conf)", note: "AvroKeyComparator.setConf"}
  - {class: org.apache.avro.idl.IdlUtils, method: serialize, match: "(byte[] value, JsonGenerator gen, SerializerProvider provider) throws IOException", note: "IdlUtils.serialize"}
  - {class: org.apache.avro.io.BinaryDecoder, method: readNull, match: "() throws IOException", note: "BinaryDecoder.readNull"}
  - {class: org.apache.avro.ipc.CallFuture, method: handleResult, match: "(T result)", note: "CallFuture.handleResult"}
  - {class: org.apache.avro.mapred.AvroKeyComparator, method: setConf, match: "(Configuration conf)", note: "AvroKeyComparator.setConf"}
  - {class: org.apache.avro.mapreduce.AvroJob, method: setInputKeySchema, match: "(Job job, Schema schema)", note: "AvroJob.setInputKeySchema"}
  - {class: org.apache.avro.message.BinaryMessageDecoder, method: addSchema, match: "(Schema writeSchema)", note: "BinaryMessageDecoder.addSchema"}
  - {class: org.apache.avro.mojo.IDLMojo, method: doCompile, match: "(String filename, File sourceDirectory, File outputDirectory) throws IOException", note: "IDLMojo.doCompile"}
  - {class: org.apache.avro.path.MapKeyPredicate, method: getKey, match: "()", note: "MapKeyPredicate.getKey"}
  - {class: org.apache.avro.perf.Perf, method: main, match: "(String[] args) throws Exception", note: "Perf.main"}
  - {class: org.apache.avro.reflect.MapEntry, method: getKey, match: "()", note: "MapEntry.getKey"}
  - {class: org.apache.avro.specific.SpecificErrorBuilderBase, method: getValue, match: "()", note: "SpecificErrorBuilderBase.getValue"}
  - {class: org.apache.avro.thrift.ThriftData, method: createDatumReader, match: "(Schema schema)", note: "ThriftData.createDatumReader"}
  - {class: org.apache.avro.tool.BinaryFragmentToJsonTool, method: run, match: "(InputStream stdin, PrintStream out, PrintStream err, List<String> args) throws Exception", note: "BinaryFragmentToJsonTool.run"}
  - {class: org.apache.avro.util.ByteBufferOutputStream, method: getBufferList, match: "()", note: "ByteBufferOutputStream.getBufferList"}
  - {class: org.apache.avro.SchemaBuilder, method: builder, match: "()", note: "SchemaBuilder.builder"}
  - {class: org.apache.avro.codegentest.FixedSizeString, method: setValue, match: "(String value)", note: "FixedSizeString.setValue"}
  - {class: org.apache.avro.compiler.idl.IsResolvedSchemaVisitor, method: visitNonTerminal, match: "(Schema nonTerminal)", note: "IsResolvedSchemaVisitor.visitNonTerminal"}
  - {class: org.apache.avro.data.Json, method: setSchema, match: "(Schema schema)", note: "Json.setSchema"}
  - {class: org.apache.avro.file.DataFileStream, method: getSchema, match: "()", note: "DataFileStream.getSchema"}
  - {class: org.apache.avro.generic.GenericRecordBuilder, method: has, match: "(Field field)", note: "GenericRecordBuilder.has"}
  - {class: org.apache.avro.grpc.AvroGrpcUtils, method: getProtocol, match: "(Class iface)", note: "AvroGrpcUtils.getProtocol"}
  - {class: org.apache.avro.hadoop.file.HadoopCodecFactory, method: fromHadoopString, match: "(String hadoopCodecClass)", note: "HadoopCodecFactory.fromHadoopString"}
  - {class: org.apache.avro.idl.IdlUtils, method: writeObjectEntrySeparator, match: "(JsonGenerator jg) throws IOException", note: "IdlUtils.writeObjectEntrySeparator"}
  - {class: org.apache.avro.io.BinaryDecoder, method: readBoolean, match: "() throws IOException", note: "BinaryDecoder.readBoolean"}
  - {class: org.apache.avro.ipc.CallFuture, method: handleError, match: "(Throwable error)", note: "CallFuture.handleError"}
  - {class: org.apache.avro.mapred.AvroMapper, method: map, match: "(IN datum, AvroCollector<OUT> collector, Reporter reporter) throws IOException", note: "AvroMapper.map"}
  - {class: org.apache.avro.mapreduce.AvroJob, method: setInputValueSchema, match: "(Job job, Schema schema)", note: "AvroJob.setInputValueSchema"}
  - {class: org.apache.avro.mojo.IDLMojo, method: getIncludes, match: "()", note: "IDLMojo.getIncludes"}
  - {class: org.apache.avro.path.TracingAvroTypeException, method: tracePath, match: "(PathElement step)", note: "TracingAvroTypeException.tracePath"}
  - {class: org.apache.avro.reflect.MapEntry, method: getValue, match: "()", note: "MapEntry.getValue"}
  - {class: org.apache.avro.specific.SpecificErrorBuilderBase, method: setValue, match: "(Object value)", note: "SpecificErrorBuilderBase.setValue"}
  - {class: org.apache.avro.thrift.ThriftData, method: createDatumWriter, match: "(Schema schema)", note: "ThriftData.createDatumWriter"}
  - {class: org.apache.avro.tool.BinaryFragmentToJsonTool, method: getName, match: "()", note: "BinaryFragmentToJsonTool.getName"}
  - {class: org.apache.avro.util.ByteBufferOutputStream, method: prepend, match: "(List<ByteBuffer> lists)", note: "ByteBufferOutputStream.prepend"}
  - {class: org.apache.avro.SchemaBuilder, method: builder, match: "(String namespace)", note: "SchemaBuilder.builder"}
  - {class: org.apache.avro.codegentest.FixedSizeStringConversion, method: getConvertedType, match: "()", note: "FixedSizeStringConversion.getConvertedType"}
  - {class: org.apache.avro.compiler.idl.ResolvingVisitor, method: visitTerminal, match: "(final Schema terminal)", note: "ResolvingVisitor.visitTerminal"}
  - {class: org.apache.avro.data.TimeConversions, method: getConvertedType, match: "()", note: "TimeConversions.getConvertedType"}
  - {class: org.apache.avro.file.SeekableByteArrayInput, method: length, match: "() throws IOException", note: "SeekableByteArrayInput.length"}
  - {class: org.apache.avro.generic.PrimitivesArrays, method: createOptimizedArray, match: "(int size, Schema schema, Schema.Type valueType)", note: "PrimitivesArrays.createOptimizedArray"}
  - {class: org.apache.avro.grpc.AvroRequestMarshaller, method: stream, match: "(Object[] value)", note: "AvroRequestMarshaller.stream"}
  - {class: org.apache.avro.hadoop.file.HadoopCodecFactory, method: getAvroCodecName, match: "(String hadoopCodecClass)", note: "HadoopCodecFactory.getAvroCodecName"}
