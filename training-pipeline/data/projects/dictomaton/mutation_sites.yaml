  - {class: eu.danieldk.dictomaton.collections.ImmutableStringFloatMap, method: putAll, match: "(Map<String, Float> map)", note: "ImmutableStringFloatMap.putAll"}
  - {class: eu.danieldk.dictomaton.PerfectHashDictionaryTransCard, method: getStateInfo, match: "(CharSequence seq)", note: "PerfectHashDictionaryTransCard.getStateInfo"}
  - {class: eu.danieldk.dictomaton.collections.ImmutableStringFloatMap, method: build, match: "() throws DictionaryBuilderException", note: "ImmutableStringFloatMap.build"}
  - {class: eu.danieldk.dictomaton.PerfectHashDictionaryTransCard, method: getStateInfo, match: "(CharSequence seq, StateInfo startInfo)", note: "PerfectHashDictionaryTransCard.getStateInfo"}
  - {class: eu.danieldk.dictomaton.collections.ImmutableStringFloatMap, method: putAll, match: "(SortedMap<String, Float> map) throws DictionaryBuilderException", note: "ImmutableStringFloatMap.putAll"}
  - {class: eu.danieldk.dictomaton.State, method: addTransition, match: "(Character c, State s)", note: "State.addTransition"}
  - {class: eu.danieldk.dictomaton.collections.ImmutableStringIntMap, method: putAll, match: "(Map<String, Integer> map)", note: "ImmutableStringIntMap.putAll"}
  - {class: eu.danieldk.dictomaton.State, method: isFinal, match: "()", note: "State.isFinal"}
