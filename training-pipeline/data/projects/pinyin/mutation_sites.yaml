  - {class: com.github.houbb.pinyin.support.tone.PinyinToneReverse, method: getHanziList, match: "(String pinyinLast)", note: "PinyinToneReverse.getHanziList"}
  - {class: com.github.houbb.pinyin.support.tone.PinyinTones, method: defaults, match: "()", note: "PinyinTones.defaults"}
  - {class: com.github.houbb.pinyin.util.InnerToneHelper, method: getToneItem, match: "(final char c)", note: "InnerToneHelper.getToneItem"}
  - {class: com.github.houbb.pinyin.util.InnerToneHelper, method: getCharToneInfo, match: "(final String tone)", note: "InnerToneHelper.getCharToneInfo"}
  - {class: com.github.houbb.pinyin.util.PinyinHelper, method: toPinyin, match: "(final String string)", note: "PinyinHelper.toPinyin"}
