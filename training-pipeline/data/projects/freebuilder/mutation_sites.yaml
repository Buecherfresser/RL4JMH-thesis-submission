  - {class: org.inferred.freebuilder.processor.property.SortedSetProperty, method: create, match: "(Config config)", note: "SortedSetProperty.create"}
  - {class: org.inferred.freebuilder.processor.property.SortedSetProperty, method: addValueFieldDeclaration, match: "(SourceBuilder code)", note: "SortedSetProperty.addValueFieldDeclaration"}
  - {class: org.inferred.freebuilder.processor.source.CompilationUnitBuilder, method: feature, match: "(FeatureType<T> feature)", note: "CompilationUnitBuilder.feature"}
  - {class: org.inferred.freebuilder.processor.source.CompilationUnitBuilder, method: typename, match: "()", note: "CompilationUnitBuilder.typename"}
  - {class: org.inferred.freebuilder.processor.source.FilerUtils, method: writeCompilationUnit, match: "(", note: "FilerUtils.writeCompilationUnit"}
  - {class: org.inferred.freebuilder.processor.source.FunctionalType, method: consumer, match: "(TypeMirror type)", note: "FunctionalType.consumer"}
  - {class: org.inferred.freebuilder.processor.source.FunctionalType, method: unaryOperator, match: "(TypeMirror type)", note: "FunctionalType.unaryOperator"}
  - {class: org.inferred.freebuilder.processor.source.SourceBuilder, method: forEnvironment, match: "(ProcessingEnvironment env, FeatureSet features)", note: "SourceBuilder.forEnvironment"}
  - {class: org.inferred.freebuilder.processor.source.SourceBuilder, method: forTesting, match: "(Feature<?>... features)", note: "SourceBuilder.forTesting"}
  - {class: org.inferred.freebuilder.processor.source.SourceParser, method: parse, match: "(char c)", note: "SourceParser.parse"}
  - {class: org.inferred.freebuilder.processor.Analyser, method: getSourceElement, match: "()", note: "Analyser.getSourceElement"}
