  - {class: org.tinspin.index.phtree.PHTreeP, method: create, match: "(int dims)", note: "PHTreeP.create"}
  - {class: org.tinspin.index.qthypercube.QIterator0, method: isLeaf, match: "()", note: "QIterator0.isLeaf"}
  - {class: org.tinspin.index.qthypercube2.QIterator0, method: isLeaf, match: "()", note: "QIterator0.isLeaf"}
  - {class: org.tinspin.index.qtplain.QIteratorKnn, method: distance, match: "()", note: "QIteratorKnn.distance"}
  - {class: org.tinspin.index.rtree.RTree, method: getDims, match: "()", note: "RTree.getDims"}
  - {class: org.tinspin.index.util.PointMapWrapper, method: iterator, match: "()", note: "PointMapWrapper.iterator"}
  - {class: org.tinspin.index.critbit.CritBit64, method: create, match: "()", note: "CritBit64.create"}
  - {class: org.tinspin.index.kdtree.KDTree, method: create, match: "(int dims)", note: "KDTree.create"}
  - {class: org.tinspin.index.phtree.PHTreeP, method: getDims, match: "()", note: "PHTreeP.getDims"}
  - {class: org.tinspin.index.qthypercube.QIterator1, method: clear, match: "()", note: "QIterator1.clear"}
