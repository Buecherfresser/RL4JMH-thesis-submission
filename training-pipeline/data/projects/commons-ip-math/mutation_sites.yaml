  - {class: com.github.jgonian.ipmath.Ipv6, method: of, match: "(BigInteger value)", note: "Ipv6.of"}
  - {class: com.github.jgonian.ipmath.Ipv6, method: of, match: "(String value)", note: "Ipv6.of"}
