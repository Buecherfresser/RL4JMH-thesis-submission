  - {class: org.kynosarges.tektosyne.geometry.LineD, method: angle, match: "()", note: "LineD.angle"}
  - {class: org.kynosarges.tektosyne.graph.Visibility, method: findVisible, match: "(Predicate<T> isOpaque, T source, double distance)", note: "Visibility.findVisible"}
  - {class: org.kynosarges.tektosyne.subdivision.SubdivisionElement, method: edge, match: "()", note: "SubdivisionElement.edge"}
  - {class: org.kynosarges.tektosyne.geometry.LineD, method: distanceSquared, match: "(PointD q)", note: "LineD.distanceSquared"}
  - {class: org.kynosarges.tektosyne.graph.Visibility, method: nodes, match: "()", note: "Visibility.nodes"}
  - {class: org.kynosarges.tektosyne.subdivision.SubdivisionElement, method: face, match: "()", note: "SubdivisionElement.face"}
  - {class: org.kynosarges.tektosyne.geometry.LineI, method: angle, match: "()", note: "LineI.angle"}
  - {class: org.kynosarges.tektosyne.subdivision.SubdivisionFace, method: key, match: "()", note: "SubdivisionFace.key"}
