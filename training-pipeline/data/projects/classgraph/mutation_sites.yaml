  - {class: nonapi.io.github.classgraph.classloaderhandler.EquinoxClassLoaderHandler, method: findClassLoaderOrder, match: "(final ClassLoader classLoader, final ClassLoaderOrder classLoaderOrder,", note: "EquinoxClassLoaderHandler.findClassLoaderOrder"}
  - {class: nonapi.io.github.classgraph.classloaderhandler.EquinoxContextFinderClassLoaderHandler, method: canHandle, match: "(final Class<?> classLoaderClass, final LogNode log)", note: "EquinoxContextFinderClassLoaderHandler.canHandle"}
  - {class: nonapi.io.github.classgraph.classloaderhandler.EquinoxContextFinderClassLoaderHandler, method: findClassLoaderOrder, match: "(final ClassLoader classLoader, final ClassLoaderOrder classLoaderOrder,", note: "EquinoxContextFinderClassLoaderHandler.findClassLoaderOrder"}
  - {class: nonapi.io.github.classgraph.classloaderhandler.FallbackClassLoaderHandler, method: canHandle, match: "(final Class<?> classLoaderClass, final LogNode log)", note: "FallbackClassLoaderHandler.canHandle"}
  - {class: nonapi.io.github.classgraph.classloaderhandler.FallbackClassLoaderHandler, method: findClassLoaderOrder, match: "(final ClassLoader classLoader, final ClassLoaderOrder classLoaderOrder,", note: "FallbackClassLoaderHandler.findClassLoaderOrder"}
  - {class: nonapi.io.github.classgraph.classloaderhandler.FelixClassLoaderHandler, method: canHandle, match: "(final Class<?> classLoaderClass, final LogNode log)", note: "FelixClassLoaderHandler.canHandle"}
