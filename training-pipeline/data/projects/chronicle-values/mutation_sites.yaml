  - {class: net.openhft.chronicle.values.Utils, method: roundUp, match: "(int divident, int divisor)", note: "Utils.roundUp"}
  - {class: net.openhft.chronicle.values.BytecodeGen, method: getCustomClassLoadingOption, match: "()", note: "BytecodeGen.getCustomClassLoadingOption"}
  - {class: net.openhft.chronicle.values.BytecodeGen, method: getClassLoader, match: "(Class<?> type)", note: "BytecodeGen.getClassLoader"}
  - {class: net.openhft.chronicle.values.BytecodeGen, method: and, match: "(Visibility that)", note: "BytecodeGen.and"}
  - {class: net.openhft.chronicle.values.BytecodeGen, method: and, match: "(Visibility that)", note: "BytecodeGen.and"}
  - {class: net.openhft.chronicle.values.CharSequenceFieldModel, method: generateFields, match: "(ValueBuilder valueBuilder)", note: "CharSequenceFieldModel.generateFields"}
