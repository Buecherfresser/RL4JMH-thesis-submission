# Curated performance-mutation sites for packrat (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants packrat --source data/external-src/<checkout> \
#       --sites data/projects/packrat/mutation_sites.yaml

package_root: io.github.jhspetersson

sites:
  - {class: io.github.jhspetersson.packrat.FlatMapGatherer, method: integrator, match: "()", note: "FlatMapGatherer.integrator"}
