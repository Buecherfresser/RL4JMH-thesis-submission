  - {class: me.lemire.integercompression.benchmarktools.PerformanceLogger, method: start, match: "()", note: "PerformanceLogger.start"}
  - {class: me.lemire.integercompression.differential.IntegratedComposition, method: uncompress, match: "(int[] in, IntWrapper inpos, int inlength,", note: "IntegratedComposition.uncompress"}
  - {class: me.lemire.integercompression.vector.VectorBitPacker256, method: fastpackNoMask, match: "(final int[] in, int inpos, final int[] out,", note: "VectorBitPacker256.fastpackNoMask"}
  - {class: me.lemire.integercompression.DeltaZigzagBinaryPacking, method: compress, match: "(int[] inBuf, IntWrapper inPos, int inLen,", note: "DeltaZigzagBinaryPacking.compress"}
  - {class: me.lemire.integercompression.benchmarktools.PerformanceLogger, method: end, match: "()", note: "PerformanceLogger.end"}
  - {class: me.lemire.integercompression.differential.IntegratedIntCompressor, method: compress, match: "(int[] input)", note: "IntegratedIntCompressor.compress"}
  - {class: me.lemire.integercompression.vector.VectorBitPackerTerse, method: slowpack, match: "(final int[] in, int inpos, int inlen,", note: "VectorBitPackerTerse.slowpack"}
  - {class: me.lemire.integercompression.DeltaZigzagBinaryPacking, method: uncompress, match: "(int[] inBuf, IntWrapper inPos, int inLen,", note: "DeltaZigzagBinaryPacking.uncompress"}
  - {class: me.lemire.integercompression.differential.IntegratedIntCompressor, method: uncompress, match: "(int[] compressed)", note: "IntegratedIntCompressor.uncompress"}
  - {class: me.lemire.integercompression.vector.VectorBitPackerTerse, method: slowunpack, match: "(final int[] in, int inpos, final int[] out,", note: "VectorBitPackerTerse.slowunpack"}
  - {class: me.lemire.integercompression.DeltaZigzagVariableByte, method: compress, match: "(int[] inBuf, IntWrapper inPos, int inLen,", note: "DeltaZigzagVariableByte.compress"}
  - {class: me.lemire.integercompression.differential.IntegratedVariableByte, method: compress, match: "(int[] in, IntWrapper inpos, int inlength,", note: "IntegratedVariableByte.compress"}
  - {class: me.lemire.integercompression.vector.VectorFastPFOR, method: headlessCompress, match: "(int[] in, IntWrapper inpos, int inlength,", note: "VectorFastPFOR.headlessCompress"}
  - {class: me.lemire.integercompression.DeltaZigzagVariableByte, method: uncompress, match: "(int[] inBuf, IntWrapper inPos, int inLen,", note: "DeltaZigzagVariableByte.uncompress"}
  - {class: me.lemire.integercompression.differential.IntegratedVariableByte, method: compress, match: "(int[] in, IntWrapper inpos, int inlength,", note: "IntegratedVariableByte.compress"}
  - {class: me.lemire.integercompression.vector.VectorFastPFOR, method: headlessUncompress, match: "(int[] in, IntWrapper inpos, int inlength,", note: "VectorFastPFOR.headlessUncompress"}
  - {class: me.lemire.integercompression.FastPFOR, method: headlessCompress, match: "(int[] in, IntWrapper inpos, int inlength,", note: "FastPFOR.headlessCompress"}
  - {class: me.lemire.integercompression.differential.SkippableIntegratedComposition, method: headlessCompress, match: "(int[] in, IntWrapper inpos, int inlength,", note: "SkippableIntegratedComposition.headlessCompress"}
