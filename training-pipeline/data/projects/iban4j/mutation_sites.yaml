# Curated performance-mutation sites for iban4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants iban4j --source data/external-src/<checkout> \
#       --sites data/projects/iban4j/mutation_sites.yaml

package_root: org.iban4j.countryrules

sites:
  - {class: org.iban4j.countryrules.CountryRulesAlgorithms, method: ensureInitialized, match: "()", note: "CountryRulesAlgorithms.ensureInitialized"}
  - {class: org.iban4j.countryrules.algorithms.BaNationalCheckDigit, method: getCountry, match: "()", note: "BaNationalCheckDigit.getCountry"}
  - {class: org.iban4j.countryrules.util.Iso7064, method: mod97_10, match: "(final String numeric)", note: "Iso7064.mod97_10"}
  - {class: org.iban4j.countryrules.CountryRulesRegistry, method: register, match: "(CountryRulesAlgorithm algorithm)", note: "CountryRulesRegistry.register"}
  - {class: org.iban4j.countryrules.algorithms.BaNationalCheckDigit, method: validate, match: "(Iban iban)", note: "BaNationalCheckDigit.validate"}
  - {class: org.iban4j.countryrules.util.Iso7064, method: ribCheckDigits, match: "(final String numeric)", note: "Iso7064.ribCheckDigits"}
  - {class: org.iban4j.countryrules.CountryRulesRegistry, method: clear, match: "()", note: "CountryRulesRegistry.clear"}
  - {class: org.iban4j.countryrules.algorithms.BeNationalCheckDigit, method: getCountry, match: "()", note: "BeNationalCheckDigit.getCountry"}
  - {class: org.iban4j.countryrules.CountrySpecificRules, method: isValid, match: "(final Iban iban, final ValidationConfig config)", note: "CountrySpecificRules.isValid"}
  - {class: org.iban4j.countryrules.algorithms.BeNationalCheckDigit, method: validate, match: "(final Iban iban)", note: "BeNationalCheckDigit.validate"}
