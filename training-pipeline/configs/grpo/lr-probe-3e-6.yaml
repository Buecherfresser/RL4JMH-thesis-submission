# LR PROBE arm 3e-6 -- one of four otherwise-identical runs launched concurrently.
#
# QUESTION. 3e-6 was chosen for run 2, when every rollout was being sampled from the BASE model
# (the reload_weights bug) and gradients were therefore ~20x smaller than they are now. It has
# never been tuned in the regime the pipeline actually runs in. grad_norm now sits at 0.03-0.05.
#
# DESIGN. Four arms, log-spaced x2 from the incumbent, identical in every other respect: same
# seed, same corpus, same prompt order, same reward, one GPU each, launched at the same moment so
# they share background load. From BASE, not from a checkpoint -- that is the condition the final
# run will start in, and resuming would restore the optimiser state and silently override the LR
# being tested.
#
# WHAT COUNTS AS AN ANSWER. Run 8 at 3e-6 moved compile 13.9 % -> 14.5 % over its first 200
# steps: essentially flat. If a higher LR compresses the learning curve, ~200 steps is enough to
# separate the arms (n ~ 1600 rollouts/arm, SE ~ 1.2 pp). Watch for the two failure modes as well
# as the win: entropy collapse and a reward crash both mean the arm is too hot.
#
# NOT A FINAL-RUN CONFIG: max_steps is short, checkpointing is off, and the LR schedule decays
# over 300 steps rather than the real horizon.
learning_rate: 3.0e-6
base_model: google/gemma-4-E2B-it
output_dir: outputs/lr-probe-3e-6
dataset_path: data/snippets/rl-mutation.good.jsonl
corpus: full
seed: 42

finetune_mode: lora
precision: bf16
gradient_checkpointing: true
attn_implementation: sdpa
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  exclude_modules: [vision_tower, audio_tower, multi_modal_projector]
  bias: none

# Unchanged from run 2. Run 2's own diagnostics show no entropy collapse (0.14 -> 0.17, if
# anything rising) and grad_norm still tiny at 2e-3, so 3e-6 was not too hot. The reason the
# updates were small was that most of the batch was being masked away -- see below.
# Global batch = per_device x num_processes x accum = 1 x 2 x 4 = 8 = group_size.
per_device_batch_size: 1
gradient_accumulation_steps: 8
group_size: 8
rollout_temperature: 1.0
top_p: 0.95
top_k: 64
max_prompt_length: 20480
max_completion_length: 16384
# Kept at 106 so vLLM's stop behaviour is byte-identical to run 2, but it is NOT a safe basis
# for the truncation mask -- see mask_truncated_completions.
completion_eos_token_id: 106
chat_template_kwargs:
  enable_thinking: true
max_source_chars: 48000
limit_prompts: 0

kl_coeff: 0.0
epsilon: 0.2
epsilon_high: 0.28
grpo_loss_type: dr_grpo
scale_rewards: false
# ------------------------------------------------------------------------------------------
# THE load-bearing change in run 3. Gemma 4's generation_config declares THREE terminators --
# eos_token_id: [1, 106, 50] -- and the model uses two of them in practice. Over 192 measured
# rollouts from run 2's adapter: 43.2 % ended on 106 <turn|>, 56.8 % on 1 <eos>.
#
# TRL tests for a single id (whatever processing_class.eos_token_id happens to be, which
# completion_eos_token_id above pins to 106), marks every other completion "not terminated",
# and mask_truncated_completions then zeroes it out of the loss. Run 2 therefore threw away
# ~57 % of every batch -- complete, valid, compilable Java -- and the discarded half was
# systematically the longer half (mean 2033 tokens vs 1380 kept), so it was also training away
# from the more elaborate benchmarks.
#
# The tell is in run 2's own metrics and is worth re-checking on the first few steps here:
# completions/clipped_ratio ~0.55 at completions/mean_length ~1640 against a 16384 cap.
# Clipping that high at a length that low is never truncation. Expect clipped_ratio to stay
# ~0.55 in run 3 (the metric is still computed off one id) but for it to no longer cost
# anything. Real truncation is negligible here: only 6 of 1726 logged steps saw a completion
# reach 16384 at all.
mask_truncated_completions: false
# ------------------------------------------------------------------------------------------
mu: 1

# Two passes, not one. Run 2 saw each prompt exactly once, and 381 of its 834 prompts never
# compiled in 8 attempts -- a single look at a subject is not enough to climb its API. At the
# ~43 s/step run 2 averaged this is ~19 h, but repaired rollouts compile more often and a
# compiled rollout costs 13.5 s against 1.5 s for a failed one, so budget 30-40 h. There is no
# queue wall on this box; resume_from_checkpoint below covers a crash.
# FOUR epochs, not two -- this is a step-budget correction, not a data-budget one.
#
# At 2 prompts/step, 2 epochs = 786 optimiser steps, whereas run 7 took 1300 to get where it
# got. Run 7's own curve (compile_frac per 100 steps) shows why that matters: 13.5, 13.5, 20.0,
# 15.1, 18.6, 19.6, 21.4, 24.4, 28.7, 28.9, 33.4, 29.8, 32.9 -- most of the gain lands AFTER
# step 700, and 786 is roughly where it had reached 24 %. Stopping there would have ended the
# run just as it started to pay off.
#
# Compared at matched optimiser steps rather than matched epochs, run 8 is exactly where run 7
# was: over their first 336 steps, run 7 went 14.8 % -> 15.2 % compile (slope t=+1.6) and run 8
# 14.8 % -> 13.9 % (t=+0.1). Both flat. The takeoff is a function of update count, so give it
# the updates: 4 x 393 = 1572 steps, ~20 h at the measured ~46 s/step.
#
# The LR is deliberately NOT changed at the same time even though 2 prompts/step halves the
# gradient noise and would justify raising it -- one change per run, and an untuned LR is the
# fastest way to lose a night.
num_epochs: 1.0
num_iterations: 300
warmup_ratio: 0.03
logging_steps: 1
save_steps: 0
resume_from_checkpoint: ""
report_to: none

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.40
vllm_tensor_parallel_size: 1
vllm_max_model_length: 65536
# MUST stay false while enable_thinking is on -- measured twice, see training-run-failures.md
# section 9. Note this is a workaround, not a fix: the 6.5e-07 importance ratio it papers over
# is direct evidence that the colocate rollout distribution is far from the trainer's weights,
# and that is the most likely remaining explanation for the 41.2 % vs 17.4 % gap above. Worth
# attacking properly before run 4.
vllm_importance_sampling_correction: false
vllm_enable_sleep_mode: true

reward_weights:
  compile: 0.10
  runtime: 0.10
  anti_pattern: 0.05
  rsd: 0.05
  mutation: 0.70
anti_pattern_backend: spotjmh
need_run: true
# Score a group's 4 completions concurrently instead of serially. See header note 2; the
# per-worker Maven work roots and the per-invocation JMH tmpdir are what make it safe.
reward_workers: 4
# --- telemetry (jmh-dashboard) ---------------------------------------------------------------
# Capture the generated Java of every rollout in a step, once every 25 steps. Off by default
# because the metrics writer is otherwise scalar-only; on here because "how did this subject's
# benchmark change over training" and "why did these G siblings score differently" are the two
# questions the scalar telemetry cannot answer. ~2 MB over a 1572-step run.
#
# NOTE: run 8 started before this existed, so its Generations tab is empty. It takes effect on
# the next start (including a resume from checkpoint).
capture_completions_every: 0
gpu_sample_seconds: 15.0
# Repair the three mechanical defects that were the root cause of ~27 % of run 2's compile
# failures, measured by finally capturing the javac diagnostics (152 failing rollouts, 985
# messages):
#
#   11.5 %  missing `import java.util.concurrent.TimeUnit;` under @OutputTimeUnit(TimeUnit.…),
#           which javac reports as "an enum annotation value must be an enum constant"
#    ~9 %   `Blackhole.consume(x)` called on the type instead of the injected instance
#    ~7 %   markdown fence remnants left in the extracted source ("illegal character: '`'")
#
# None of these is the skill the reward is meant to teach, and each is a guaranteed zero that
# also flattens the group-relative advantage. Every repair is a no-op unless its exact
# signature is present and none invents a call on the subject under test. GRPO-only: the
# RFT/eval path is untouched, so JMH-Bench numbers stay comparable across runs.
repair_completions: false
# Two subjects whose groups are all-zero often enough to be pure wall-clock. Compile rate in
# run 1 / run 2: jackson-dataformats-binary 0.0 % (n=160) / 1.7 % (n=176), spatial4j 6.2 % /
# 2.8 % (n=216). A group with no reward spread has no advantage, so these cost a full rollout
# batch each and contribute nothing. jackson-databind (4.9 %) and la4j (6.0 %) are deliberately
# KEPT -- they are within reach once the repairs land, and dropping every hard project would
# quietly turn the benchmark into an easy-subjects benchmark.
exclude_projects:
  - jackson-dataformats-binary
  - spatial4j
rsd_good: 0.05
rsd_bad: 0.25

mutation:
  alpha: 0.05
  min_slowdown: 1.10
  arm_property: jmhbench.mutant
  coverage_guidance: true
  max_mutants_per_candidate: 0
  max_benchmarks_per_mutant: 6
  mode: coverage_aware
  coverage_weight: 0.30
  coverage_jmh:
    warmup_iterations: 0
    measurement_iterations: 1
    forks: 1
    warmup_time: "100ms"
    measurement_time: "100ms"
    timeout_s: 120.0
    per_iteration_timeout_s: 60.0
    fail_on_error: false

runner:
  jmh_version: "1.37"
  java_release: 17
  jmh:
    warmup_iterations: 3
    measurement_iterations: 5
    forks: 1
    warmup_time: "200ms"
    measurement_time: "200ms"
    timeout_s: 120.0
    per_iteration_timeout_s: 60.0
    fail_on_error: false

