  - {class: reactor.core.publisher.FluxBufferBoundary, method: getPrefetch, match: "()", note: "FluxBufferBoundary.getPrefetch"}
  - {class: reactor.core.scheduler.DelegatingScheduledExecutorService, method: schedule, match: "(Runnable command, long delay, TimeUnit unit)", note: "DelegatingScheduledExecutorService.schedule"}
