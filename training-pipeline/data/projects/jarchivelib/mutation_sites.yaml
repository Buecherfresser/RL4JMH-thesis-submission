# Curated performance-mutation sites for jarchivelib (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jarchivelib --source data/external-src/<checkout> \
#       --sites data/projects/jarchivelib/mutation_sites.yaml

package_root: org.rauschig.jarchivelib

sites:
  - {class: org.rauschig.jarchivelib.CommonsArchiveStream, method: createNextEntry, match: "() throws IOException", note: "CommonsArchiveStream.createNextEntry"}
  - {class: org.rauschig.jarchivelib.CommonsArchiveStream, method: close, match: "() throws IOException", note: "CommonsArchiveStream.close"}
  - {class: org.rauschig.jarchivelib.IOUtils, method: relativePath, match: "(File root, File node) throws IOException", note: "IOUtils.relativePath"}
  - {class: org.rauschig.jarchivelib.IOUtils, method: requireDirectory, match: "(File destination) throws IOException, IllegalArgumentException", note: "IOUtils.requireDirectory"}
  - {class: org.rauschig.jarchivelib.IOUtils, method: closeQuietly, match: "(Closeable closeable)", note: "IOUtils.closeQuietly"}
  - {class: org.rauschig.jarchivelib.IOUtils, method: filesContainedIn, match: "(File source)", note: "IOUtils.filesContainedIn"}
  - {class: org.rauschig.jarchivelib.ArchiveFormat, method: getName, match: "()", note: "ArchiveFormat.getName"}
  - {class: org.rauschig.jarchivelib.ArchiveFormat, method: getDefaultFileExtension, match: "()", note: "ArchiveFormat.getDefaultFileExtension"}
  - {class: org.rauschig.jarchivelib.ArchiveFormat, method: isValidArchiveFormat, match: "(String archiveFormat)", note: "ArchiveFormat.isValidArchiveFormat"}
  - {class: org.rauschig.jarchivelib.ArchiveFormat, method: fromString, match: "(String archiveFormat)", note: "ArchiveFormat.fromString"}
  - {class: org.rauschig.jarchivelib.ArchiverCompressorDecorator, method: create, match: "(String archive, File destination, File source) throws IOException", note: "ArchiverCompressorDecorator.create"}
  - {class: org.rauschig.jarchivelib.ArchiverCompressorDecorator, method: create, match: "(String archive, File destination, File... sources) throws IOException", note: "ArchiverCompressorDecorator.create"}
  - {class: org.rauschig.jarchivelib.ArchiverCompressorDecorator, method: extract, match: "(File archive, File destination) throws IOException", note: "ArchiverCompressorDecorator.extract"}
  - {class: org.rauschig.jarchivelib.ArchiverCompressorDecorator, method: extract, match: "(InputStream archive, File destination) throws IOException", note: "ArchiverCompressorDecorator.extract"}
  - {class: org.rauschig.jarchivelib.ArchiverFactory, method: createArchiver, match: "(File archive) throws IllegalArgumentException", note: "ArchiverFactory.createArchiver"}
  - {class: org.rauschig.jarchivelib.ArchiverFactory, method: createArchiver, match: "(FileType fileType)", note: "ArchiverFactory.createArchiver"}
  - {class: org.rauschig.jarchivelib.ArchiverFactory, method: createArchiver, match: "(String archiveFormat, String compression) throws IllegalArgumentException", note: "ArchiverFactory.createArchiver"}
  - {class: org.rauschig.jarchivelib.ArchiverFactory, method: createArchiver, match: "(ArchiveFormat archiveFormat, CompressionType compression)", note: "ArchiverFactory.createArchiver"}
  - {class: org.rauschig.jarchivelib.CommonsArchiveEntry, method: getName, match: "()", note: "CommonsArchiveEntry.getName"}
  - {class: org.rauschig.jarchivelib.CommonsArchiveEntry, method: getSize, match: "()", note: "CommonsArchiveEntry.getSize"}
  - {class: org.rauschig.jarchivelib.CommonsArchiveEntry, method: getLastModifiedDate, match: "()", note: "CommonsArchiveEntry.getLastModifiedDate"}
  - {class: org.rauschig.jarchivelib.CommonsArchiveEntry, method: isDirectory, match: "()", note: "CommonsArchiveEntry.isDirectory"}
  - {class: org.rauschig.jarchivelib.CommonsArchiver, method: getArchiveFormat, match: "()", note: "CommonsArchiver.getArchiveFormat"}
  - {class: org.rauschig.jarchivelib.CommonsArchiver, method: create, match: "(String archive, File destination, File source) throws IOException", note: "CommonsArchiver.create"}
  - {class: org.rauschig.jarchivelib.CommonsArchiver, method: create, match: "(String archive, File destination, File... sources) throws IOException", note: "CommonsArchiver.create"}
  - {class: org.rauschig.jarchivelib.CommonsArchiver, method: extract, match: "(File archive, File destination) throws IOException", note: "CommonsArchiver.extract"}
  - {class: org.rauschig.jarchivelib.CommonsCompressor, method: getCompressionType, match: "()", note: "CommonsCompressor.getCompressionType"}
  - {class: org.rauschig.jarchivelib.CommonsCompressor, method: compress, match: "(File source, File destination) throws IllegalArgumentException, IOException", note: "CommonsCompressor.compress"}
  - {class: org.rauschig.jarchivelib.CommonsCompressor, method: decompress, match: "(File source, File destination) throws IOException", note: "CommonsCompressor.decompress"}
  - {class: org.rauschig.jarchivelib.CommonsCompressor, method: decompressingStream, match: "(InputStream compressedStream) throws IOException", note: "CommonsCompressor.decompressingStream"}
  - {class: org.rauschig.jarchivelib.CompressionType, method: getName, match: "()", note: "CompressionType.getName"}
  - {class: org.rauschig.jarchivelib.CompressionType, method: getDefaultFileExtension, match: "()", note: "CompressionType.getDefaultFileExtension"}
  - {class: org.rauschig.jarchivelib.CompressionType, method: isValidCompressionType, match: "(String compression)", note: "CompressionType.isValidCompressionType"}
  - {class: org.rauschig.jarchivelib.CompressionType, method: fromString, match: "(String compression)", note: "CompressionType.fromString"}
  - {class: org.rauschig.jarchivelib.CompressorFactory, method: createCompressor, match: "(File file) throws IllegalArgumentException", note: "CompressorFactory.createCompressor"}
  - {class: org.rauschig.jarchivelib.CompressorFactory, method: createCompressor, match: "(FileType fileType) throws IllegalArgumentException", note: "CompressorFactory.createCompressor"}
  - {class: org.rauschig.jarchivelib.CompressorFactory, method: createCompressor, match: "(String compression) throws IllegalArgumentException", note: "CompressorFactory.createCompressor"}
  - {class: org.rauschig.jarchivelib.CompressorFactory, method: createCompressor, match: "(CompressionType compression)", note: "CompressorFactory.createCompressor"}
  - {class: org.rauschig.jarchivelib.FileType, method: isArchive, match: "()", note: "FileType.isArchive"}
  - {class: org.rauschig.jarchivelib.FileType, method: isCompressed, match: "()", note: "FileType.isCompressed"}
  - {class: org.rauschig.jarchivelib.FileType, method: getSuffix, match: "()", note: "FileType.getSuffix"}
  - {class: org.rauschig.jarchivelib.FileType, method: getArchiveFormat, match: "()", note: "FileType.getArchiveFormat"}
  - {class: org.rauschig.jarchivelib.SevenZArchiver, method: createArchiveOutputStream, match: "(File archive) throws IOException", note: "SevenZArchiver.createArchiveOutputStream"}
  - {class: org.rauschig.jarchivelib.SevenZArchiver, method: createArchiveInputStream, match: "(File archive) throws IOException", note: "SevenZArchiver.createArchiveInputStream"}
  - {class: org.rauschig.jarchivelib.SevenZArchiver, method: getNextEntry, match: "() throws IOException", note: "SevenZArchiver.getNextEntry"}
  - {class: org.rauschig.jarchivelib.SevenZArchiver, method: close, match: "() throws IOException", note: "SevenZArchiver.close"}
  - {class: org.rauschig.jarchivelib.ZipFileArchiver, method: createArchiveInputStream, match: "(File archive) throws IOException", note: "ZipFileArchiver.createArchiveInputStream"}
  - {class: org.rauschig.jarchivelib.ZipFileArchiver, method: getNextEntry, match: "() throws IOException", note: "ZipFileArchiver.getNextEntry"}
  - {class: org.rauschig.jarchivelib.ZipFileArchiver, method: canReadEntryData, match: "(ArchiveEntry archiveEntry)", note: "ZipFileArchiver.canReadEntryData"}
  - {class: org.rauschig.jarchivelib.ZipFileArchiver, method: getCurrentEntry, match: "()", note: "ZipFileArchiver.getCurrentEntry"}
