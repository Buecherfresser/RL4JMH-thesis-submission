# Curated performance-mutation sites for mvel (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants mvel --source data/external-src/<checkout> \
#       --sites data/projects/mvel/mutation_sites.yaml

package_root: org.mvel3.parser

sites:
  - {class: org.mvel3.parser.DrlxParser, method: buildDrlxParserWithArguments, match: "(Collection<String> operators)", note: "DrlxParser.buildDrlxParserWithArguments"}
  - {class: org.mvel3.parser.antlr4.Antlr4MvelParser, method: parseExpressionAsAntlrAST, match: "(final String expression)", note: "Antlr4MvelParser.parseExpressionAsAntlrAST"}
  - {class: org.mvel3.parser.printer.PrintUtil, method: printNode, match: "(Node node)", note: "PrintUtil.printNode"}
  - {class: org.mvel3.parser.util.AstUtils, method: getBinaryExprOperator, match: "(String operatorText)", note: "AstUtils.getBinaryExprOperator"}
  - {class: org.mvel3.parser.DrlxParser, method: parseExpression, match: "(ParseStart<DrlxExpression> parser, final String expression)", note: "DrlxParser.parseExpression"}
  - {class: org.mvel3.parser.antlr4.Antlr4MvelParser, method: syntaxError, match: "(Recognizer<?, ?> recognizer, Object offendingSymbol,", note: "Antlr4MvelParser.syntaxError"}
  - {class: org.mvel3.parser.printer.PrintUtil, method: printNode, match: "(Node node, TypeSolver typeSolver)", note: "PrintUtil.printNode"}
  - {class: org.mvel3.parser.util.AstUtils, method: getStringFromLiteral, match: "(String value)", note: "AstUtils.getStringFromLiteral"}
  - {class: org.mvel3.parser.JavaParserMvelParser, method: getParserConfiguration, match: "()", note: "JavaParserMvelParser.getParserConfiguration"}
  - {class: org.mvel3.parser.antlr4.Mvel3ToJavaParserVisitor, method: isTolerantMode, match: "()", note: "Mvel3ToJavaParserVisitor.isTolerantMode"}
  - {class: org.mvel3.parser.printer.MVELPrintVisitor, method: visit, match: "( RuleDeclaration n, Void arg )", note: "MVELPrintVisitor.visit"}
  - {class: org.mvel3.parser.JavaParserMvelParser, method: parse, match: "(ParseStart<N> start, final Provider provider)", note: "JavaParserMvelParser.parse"}
  - {class: org.mvel3.parser.antlr4.Mvel3ToJavaParserVisitor, method: associateAntlrTokenWithJPNode, match: "(ParserRuleContext ctx, Node jpNode)", note: "Mvel3ToJavaParserVisitor.associateAntlrTokenWithJPNode"}
  - {class: org.mvel3.parser.printer.MVELPrintVisitor, method: visit, match: "( RuleBody ruleBody, Void arg )", note: "MVELPrintVisitor.visit"}
  - {class: org.mvel3.parser.StaticMvelParser, method: getStaticConfiguration, match: "()", note: "StaticMvelParser.getStaticConfiguration"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.ArrayConverter, method: convertArrayInitializer, match: "(final Mvel3Parser.ArrayInitializerContext ctx,", note: "ArrayConverter.convertArrayInitializer"}
  - {class: org.mvel3.parser.StaticMvelParser, method: setStaticTypeSolver, match: "(TypeSolver typeSolver)", note: "StaticMvelParser.setStaticTypeSolver"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.ArrayConverter, method: applyArrayDimensions, match: "(Type baseType, Mvel3Parser.VariableDeclaratorIdContext idContext)", note: "ArrayConverter.applyArrayDimensions"}
  - {class: org.mvel3.parser.JavaTokenHelper, method: create, match: "(Token token, List<com.github.javaparser.JavaToken> tokens)", note: "JavaTokenHelper.create"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.ModifiersParser, method: resolveModifiersFromParent, match: "(ParserRuleContext ctx)", note: "ModifiersParser.resolveModifiersFromParent"}
  - {class: org.mvel3.parser.JavaTokenHelper, method: setKind, match: "(JavaToken token, int kind)", note: "JavaTokenHelper.setKind"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.ModifiersParser, method: parseModifiers, match: "(List<Mvel3Parser.ModifierContext> modifierContexts)", note: "ModifiersParser.parseModifiers"}
  - {class: org.mvel3.parser.Providers, method: provider, match: "(Reader reader)", note: "Providers.provider"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.TokenRangeConverter, method: createTokenRange, match: "(ParserRuleContext ctx)", note: "TokenRangeConverter.createTokenRange"}
  - {class: org.mvel3.parser.Providers, method: provider, match: "(InputStream input, Charset encoding)", note: "Providers.provider"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.TokenRangeConverter, method: createTokenRange, match: "(Token token)", note: "TokenRangeConverter.createTokenRange"}
  - {class: org.mvel3.parser.TokenTypes, method: isWhitespace, match: "(int kind)", note: "TokenTypes.isWhitespace"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.VariableParser, method: parseVariableModifiers, match: "(List<Mvel3Parser.VariableModifierContext> modifierContexts)", note: "VariableParser.parseVariableModifiers"}
  - {class: org.mvel3.parser.TokenTypes, method: isEndOfLineToken, match: "(int kind)", note: "TokenTypes.isEndOfLineToken"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.expressions.ListCreationLiteralConverter, method: convertListCreationLiteral, match: "(", note: "ListCreationLiteralConverter.convertListCreationLiteral"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.expressions.MapCreationLiteralConverter, method: convertMapCreationLiteral, match: "(", note: "MapCreationLiteralConverter.convertMapCreationLiteral"}
  - {class: org.mvel3.parser.antlr4.LambdaParametersResult, method: LambdaParametersResult, match: "(NodeList<Parameter> parameters, boolean enclosingParameters)", note: "LambdaParametersResult.LambdaParametersResult"}
  - {class: org.mvel3.parser.antlr4.ModifiersAnnotations, method: ModifiersAnnotations, match: "(NodeList<Modifier> modifiers, NodeList<AnnotationExpr> annotations)", note: "ModifiersAnnotations.ModifiersAnnotations"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.AnnotationTypeConverter, method: convertAnnotationTypeDeclaration, match: "(final Mvel3Parser.AnnotationTypeDeclarationContext ctx,", note: "AnnotationTypeConverter.convertAnnotationTypeDeclaration"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.ArgumentsConverter, method: convertArguments, match: "(final Mvel3Parser.ArgumentsContext ctx,", note: "ArgumentsConverter.convertArguments"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.ArgumentsConverter, method: convertTypeArgument, match: "(final Mvel3Parser.TypeArgumentContext ctx,", note: "ArgumentsConverter.convertTypeArgument"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.BlockConverter, method: convertBlock, match: "(final Mvel3Parser.BlockContext ctx,", note: "BlockConverter.convertBlock"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.BlockConverter, method: convertBlockStatement, match: "(final Mvel3Parser.BlockStatementContext ctx,", note: "BlockConverter.convertBlockStatement"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.CompilationUnitConverter, method: convertCompilationUnit, match: "(", note: "CompilationUnitConverter.convertCompilationUnit"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.ConstructorConverter, method: convertConstructorDeclaration, match: "(", note: "ConstructorConverter.convertConstructorDeclaration"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.ConstructorConverter, method: convertGenericConstructorDeclaration, match: "(", note: "ConstructorConverter.convertGenericConstructorDeclaration"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.CreatedNameConverter, method: convertCreatedName, match: "(", note: "CreatedNameConverter.convertCreatedName"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.EnumConverter, method: convertEnumDeclaration, match: "(final Mvel3Parser.EnumDeclarationContext ctx,", note: "EnumConverter.convertEnumDeclaration"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.FieldConverter, method: convertFieldDeclaration, match: "(", note: "FieldConverter.convertFieldDeclaration"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.ForConverter, method: convertForStatement, match: "(", note: "ForConverter.convertForStatement"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.ImportConverter, method: convertImportDeclaration, match: "(Mvel3Parser.ImportDeclarationContext ctx)", note: "ImportConverter.convertImportDeclaration"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.InterfaceConverter, method: convertInterfaceDeclaration, match: "(", note: "InterfaceConverter.convertInterfaceDeclaration"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.MethodConverter, method: convertMethodDeclaration, match: "(", note: "MethodConverter.convertMethodDeclaration"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.MethodConverter, method: convertGenericMethodDeclaration, match: "(", note: "MethodConverter.convertGenericMethodDeclaration"}
  - {class: org.mvel3.parser.antlr4.mveltojavaparser.ModifiersConverter, method: convertAnnotationExpr, match: "(Mvel3Parser.AnnotationContext ctx)", note: "ModifiersConverter.convertAnnotationExpr"}
