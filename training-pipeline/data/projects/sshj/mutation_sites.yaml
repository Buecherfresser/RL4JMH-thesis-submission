# Curated performance-mutation sites for sshj (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants sshj --source data/external-src/<checkout> \
#       --sites data/projects/sshj/mutation_sites.yaml

package_root: net.schmizz.sshj

sites:
  - {class: net.schmizz.sshj.AndroidConfig, method: initKeyAlgorithms, match: "()", note: "AndroidConfig.initKeyAlgorithms"}
  - {class: net.schmizz.sshj.common.Buffer, method: getNextPowerOf2, match: "(int i)", note: "Buffer.getNextPowerOf2"}
  - {class: net.schmizz.sshj.connection.channel.ChannelInputStream, method: close, match: "()", note: "ChannelInputStream.close"}
  - {class: net.schmizz.sshj.sftp.FileAttributes, method: isSet, match: "(int mask)", note: "FileAttributes.isSet"}
  - {class: net.schmizz.sshj.signature.SignatureDSA, method: create, match: "()", note: "SignatureDSA.create"}
  - {class: net.schmizz.sshj.transport.Encoder, method: aeadOutgoingBuffer, match: "(Buffer<?> buf, int offset, int len)", note: "Encoder.aeadOutgoingBuffer"}
  - {class: net.schmizz.sshj.userauth.keyprovider.KeyProviderUtil, method: detectKeyFileFormat, match: "(File location)", note: "KeyProviderUtil.detectKeyFileFormat"}
  - {class: net.schmizz.sshj.xfer.LoggingTransferListener, method: directory, match: "(String name)", note: "LoggingTransferListener.directory"}
  - {class: net.schmizz.sshj.ConfigImpl, method: getCipherFactories, match: "()", note: "ConfigImpl.getCipherFactories"}
  - {class: net.schmizz.sshj.common.Buffer, method: array, match: "()", note: "Buffer.array"}
  - {class: net.schmizz.sshj.connection.channel.ChannelInputStream, method: eof, match: "()", note: "ChannelInputStream.eof"}
  - {class: net.schmizz.sshj.sftp.FileAttributes, method: has, match: "(Flag flag)", note: "FileAttributes.has"}
  - {class: net.schmizz.sshj.signature.SignatureDSA, method: getName, match: "()", note: "SignatureDSA.getName"}
  - {class: net.schmizz.sshj.transport.KeyExchanger, method: handle, match: "(Message msg, SSHPacket buf)", note: "KeyExchanger.handle"}
  - {class: net.schmizz.sshj.userauth.keyprovider.KeyProviderUtil, method: detectKeyFileFormat, match: "(String privateKey, boolean separatePubKey)", note: "KeyProviderUtil.detectKeyFileFormat"}
  - {class: net.schmizz.sshj.xfer.LoggingTransferListener, method: file, match: "(final String name, final long size)", note: "LoggingTransferListener.file"}
  - {class: net.schmizz.sshj.ConfigImpl, method: getCompressionFactories, match: "()", note: "ConfigImpl.getCompressionFactories"}
  - {class: net.schmizz.sshj.common.ByteArrayUtils, method: printHex, match: "(byte[] array, int offset, int len)", note: "ByteArrayUtils.printHex"}
  - {class: net.schmizz.sshj.connection.channel.ChannelOutputStream, method: run, match: "() throws TransportException", note: "ChannelOutputStream.run"}
  - {class: net.schmizz.sshj.sftp.FileMode, method: fromMask, match: "(int mask)", note: "FileMode.fromMask"}
  - {class: net.schmizz.sshj.signature.SignatureECDSA, method: create, match: "()", note: "SignatureECDSA.create"}
  - {class: net.schmizz.sshj.transport.KeyExchanger, method: notifyError, match: "(SSHException error)", note: "KeyExchanger.notifyError"}
  - {class: net.schmizz.sshj.userauth.keyprovider.V1PuTTYSecretKeyDerivationFunction, method: deriveSecretKey, match: "(char[] passphrase)", note: "V1PuTTYSecretKeyDerivationFunction.deriveSecretKey"}
  - {class: net.schmizz.sshj.xfer.FilePermission, method: isIn, match: "(int mask)", note: "FilePermission.isIn"}
  - {class: net.schmizz.sshj.DefaultConfig, method: setLoggerFactory, match: "(LoggerFactory loggerFactory)", note: "DefaultConfig.setLoggerFactory"}
  - {class: net.schmizz.sshj.common.ByteArrayUtils, method: toHex, match: "(byte[] array)", note: "ByteArrayUtils.toHex"}
  - {class: net.schmizz.sshj.connection.channel.ChannelOutputStream, method: notifyError, match: "(SSHException error)", note: "ChannelOutputStream.notifyError"}
  - {class: net.schmizz.sshj.sftp.FileMode, method: toMask, match: "()", note: "FileMode.toMask"}
  - {class: net.schmizz.sshj.signature.SignatureECDSA, method: getName, match: "()", note: "SignatureECDSA.getName"}
  - {class: net.schmizz.sshj.transport.NegotiatedAlgorithms, method: getKeyExchangeAlgorithm, match: "()", note: "NegotiatedAlgorithms.getKeyExchangeAlgorithm"}
  - {class: net.schmizz.sshj.userauth.keyprovider.V3PuTTYSecretKeyDerivationFunction, method: deriveSecretKey, match: "(char[] passphrase)", note: "V3PuTTYSecretKeyDerivationFunction.deriveSecretKey"}
  - {class: net.schmizz.sshj.xfer.FilePermission, method: fromMask, match: "(int mask)", note: "FilePermission.fromMask"}
  - {class: net.schmizz.sshj.DefaultConfig, method: initKeyExchangeFactories, match: "()", note: "DefaultConfig.initKeyExchangeFactories"}
  - {class: net.schmizz.sshj.common.CircularBuffer, method: maxPossibleRemainingCapacity, match: "()", note: "CircularBuffer.maxPossibleRemainingCapacity"}
  - {class: net.schmizz.sshj.connection.channel.SocketStreamCopyMonitor, method: monitor, match: "(final int frequency, final TimeUnit unit,", note: "SocketStreamCopyMonitor.monitor"}
  - {class: net.schmizz.sshj.sftp.OpenMode, method: toMask, match: "(Set<OpenMode> modes)", note: "OpenMode.toMask"}
  - {class: net.schmizz.sshj.signature.SignatureRSA, method: create, match: "()", note: "SignatureRSA.create"}
  - {class: net.schmizz.sshj.transport.NegotiatedAlgorithms, method: getSignatureAlgorithm, match: "()", note: "NegotiatedAlgorithms.getSignatureAlgorithm"}
  - {class: net.schmizz.sshj.userauth.password.PasswordUtils, method: blankOut, match: "(char[] pwd)", note: "PasswordUtils.blankOut"}
  - {class: net.schmizz.sshj.xfer.FileSystemFile, method: getFile, match: "()", note: "FileSystemFile.getFile"}
  - {class: net.schmizz.sshj.SSHClient, method: addHostKeyVerifier, match: "(HostKeyVerifier verifier)", note: "SSHClient.addHostKeyVerifier"}
  - {class: net.schmizz.sshj.common.CircularBuffer, method: readRawBytes, match: "(byte[] destination, int offset, int length) throws CircularBufferException", note: "CircularBuffer.readRawBytes"}
  - {class: net.schmizz.sshj.connection.channel.SocketStreamCopyMonitor, method: run, match: "()", note: "SocketStreamCopyMonitor.run"}
  - {class: net.schmizz.sshj.sftp.PacketReader, method: readPacket, match: "()", note: "PacketReader.readPacket"}
  - {class: net.schmizz.sshj.signature.SignatureRSA, method: getName, match: "()", note: "SignatureRSA.getName"}
  - {class: net.schmizz.sshj.transport.Proposal, method: getKeyExchangeAlgorithms, match: "()", note: "Proposal.getKeyExchangeAlgorithms"}
  - {class: net.schmizz.sshj.userauth.password.PasswordUtils, method: createOneOff, match: "(final char[] password)", note: "PasswordUtils.createOneOff"}
  - {class: net.schmizz.sshj.xfer.FileSystemFile, method: getName, match: "()", note: "FileSystemFile.getName"}
  - {class: net.schmizz.sshj.SSHClient, method: addAlgorithmsVerifier, match: "(AlgorithmsVerifier verifier)", note: "SSHClient.addAlgorithmsVerifier"}
  - {class: net.schmizz.sshj.common.IOUtils, method: closeQuietly, match: "(Closeable... closeables)", note: "IOUtils.closeQuietly"}
