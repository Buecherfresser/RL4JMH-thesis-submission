  - {class: com.fasterxml.jackson.core.util.TextBuffer, method: contentsAsFloat, match: "() throws NumberFormatException", note: "TextBuffer.contentsAsFloat"}
  - {class: com.fasterxml.jackson.core.util.ByteArrayBuilder, method: appendFourBytes, match: "(int b32)", note: "ByteArrayBuilder.appendFourBytes"}
  - {class: com.fasterxml.jackson.core.util.ByteArrayBuilder, method: appendThreeBytes, match: "(int b24)", note: "ByteArrayBuilder.appendThreeBytes"}
  - {class: com.fasterxml.jackson.core.util.ByteArrayBuilder, method: appendTwoBytes, match: "(int b16)", note: "ByteArrayBuilder.appendTwoBytes"}
  - {class: com.fasterxml.jackson.core.util.BufferRecycler, method: balloc, match: "(int size)", note: "BufferRecycler.balloc"}
  - {class: com.fasterxml.jackson.core.util.BufferRecycler, method: byteBufferLength, match: "(int ix)", note: "BufferRecycler.byteBufferLength"}
