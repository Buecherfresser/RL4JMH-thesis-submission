  - {class: org.joda.time.chrono.BasicDayOfYearDateTimeField, method: getMinimumValue, match: "()", note: "BasicDayOfYearDateTimeField.getMinimumValue"}
  - {class: org.joda.time.convert.CalendarConverter, method: getChronology, match: "(Object object, DateTimeZone zone)", note: "CalendarConverter.getChronology"}
  - {class: org.joda.time.field.DecoratedDurationField, method: isPrecise, match: "()", note: "DecoratedDurationField.isPrecise"}
  - {class: org.joda.time.format.DateTimeParserBucket, method: parseMillis, match: "(DateTimeParser parser, CharSequence text)", note: "DateTimeParserBucket.parseMillis"}
  - {class: org.joda.time.tz.CachedDateTimeZone, method: getUncachedZone, match: "()", note: "CachedDateTimeZone.getUncachedZone"}
  - {class: org.joda.time.DateMidnight, method: now, match: "()", note: "DateMidnight.now"}
