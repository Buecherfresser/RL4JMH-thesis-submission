# Curated performance-mutation sites for kalium (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants kalium --source data/external-src/<checkout> \
#       --sites data/projects/kalium/mutation_sites.yaml

package_root: org.abstractj.kalium

sites:
  - {class: org.abstractj.kalium.NaCl, method: sodium, match: "()", note: "NaCl.sodium"}
  - {class: org.abstractj.kalium.crypto.Util, method: prependZeros, match: "(int n, byte[] message)", note: "Util.prependZeros"}
  - {class: org.abstractj.kalium.keys.AuthenticationKey, method: sign, match: "(byte[] message)", note: "AuthenticationKey.sign"}
  - {class: org.abstractj.kalium.NaCl, method: init, match: "()", note: "NaCl.init"}
  - {class: org.abstractj.kalium.crypto.Util, method: removeZeros, match: "(int n, byte[] message)", note: "Util.removeZeros"}
  - {class: org.abstractj.kalium.keys.AuthenticationKey, method: sign, match: "(String message, Encoder encoder)", note: "AuthenticationKey.sign"}
  - {class: org.abstractj.kalium.crypto.Util, method: checkLength, match: "(byte[] data, int size)", note: "Util.checkLength"}
  - {class: org.abstractj.kalium.keys.AuthenticationKey, method: verify, match: "(byte[] message, byte[] signature)", note: "AuthenticationKey.verify"}
  - {class: org.abstractj.kalium.crypto.Util, method: zeros, match: "(int n)", note: "Util.zeros"}
  - {class: org.abstractj.kalium.keys.AuthenticationKey, method: verify, match: "(String message, String signature, Encoder encoder)", note: "AuthenticationKey.verify"}
  - {class: org.abstractj.kalium.crypto.Util, method: isValid, match: "(int status, String message)", note: "Util.isValid"}
  - {class: org.abstractj.kalium.keys.AuthenticationKey, method: toBytes, match: "()", note: "AuthenticationKey.toBytes"}
  - {class: org.abstractj.kalium.crypto.Util, method: slice, match: "(byte[] buffer, int start, int end)", note: "Util.slice"}
  - {class: org.abstractj.kalium.keys.KeyPair, method: getPublicKey, match: "()", note: "KeyPair.getPublicKey"}
  - {class: org.abstractj.kalium.crypto.Advanced, method: crypto_stream_xsalsa20_xor, match: "(byte[] message, byte[] nonce, byte[] key)", note: "Advanced.crypto_stream_xsalsa20_xor"}
  - {class: org.abstractj.kalium.keys.KeyPair, method: getPrivateKey, match: "()", note: "KeyPair.getPrivateKey"}
  - {class: org.abstractj.kalium.crypto.Aead, method: useAesGcm, match: "()", note: "Aead.useAesGcm"}
  - {class: org.abstractj.kalium.keys.PrivateKey, method: toBytes, match: "()", note: "PrivateKey.toBytes"}
  - {class: org.abstractj.kalium.crypto.Aead, method: encrypt, match: "(byte[] publicNonce, byte[] message, byte[] additionalData)", note: "Aead.encrypt"}
  - {class: org.abstractj.kalium.keys.PublicKey, method: toBytes, match: "()", note: "PublicKey.toBytes"}
  - {class: org.abstractj.kalium.crypto.Aead, method: encryptChaChaPoly, match: "(byte[] publicNonce, byte[] message, byte[] additionalData)", note: "Aead.encryptChaChaPoly"}
  - {class: org.abstractj.kalium.keys.SigningKey, method: getVerifyKey, match: "()", note: "SigningKey.getVerifyKey"}
  - {class: org.abstractj.kalium.crypto.Aead, method: encryptAesGcm, match: "(byte[] publicNonce, byte[] message, byte[] additionalData)", note: "Aead.encryptAesGcm"}
  - {class: org.abstractj.kalium.keys.SigningKey, method: sign, match: "(byte[] message)", note: "SigningKey.sign"}
  - {class: org.abstractj.kalium.crypto.Aead, method: decrypt, match: "(byte[] publicNonce, byte[] ciphertext, byte[] additionalData)", note: "Aead.decrypt"}
  - {class: org.abstractj.kalium.keys.SigningKey, method: sign, match: "(String message, Encoder encoder)", note: "SigningKey.sign"}
  - {class: org.abstractj.kalium.crypto.Aead, method: decryptChaChaPoly, match: "(byte[] publicNonce, byte[] ciphertext, byte[] additionalData)", note: "Aead.decryptChaChaPoly"}
  - {class: org.abstractj.kalium.keys.SigningKey, method: toBytes, match: "()", note: "SigningKey.toBytes"}
  - {class: org.abstractj.kalium.crypto.Box, method: encrypt, match: "(byte[] nonce, byte[] message)", note: "Box.encrypt"}
  - {class: org.abstractj.kalium.keys.VerifyKey, method: verify, match: "(byte[] message, byte[] signature)", note: "VerifyKey.verify"}
  - {class: org.abstractj.kalium.crypto.Box, method: encrypt, match: "(String nonce, String message, Encoder encoder)", note: "Box.encrypt"}
  - {class: org.abstractj.kalium.keys.VerifyKey, method: verify, match: "(String message, String signature, Encoder encoder)", note: "VerifyKey.verify"}
  - {class: org.abstractj.kalium.crypto.Box, method: decrypt, match: "(byte[] nonce, byte[] ciphertext)", note: "Box.decrypt"}
  - {class: org.abstractj.kalium.keys.VerifyKey, method: toBytes, match: "()", note: "VerifyKey.toBytes"}
  - {class: org.abstractj.kalium.crypto.Box, method: decrypt, match: "(String nonce, String ciphertext, Encoder encoder)", note: "Box.decrypt"}
  - {class: org.abstractj.kalium.crypto.Hash, method: sha256, match: "(byte[] message)", note: "Hash.sha256"}
  - {class: org.abstractj.kalium.crypto.Hash, method: sha512, match: "(byte[] message)", note: "Hash.sha512"}
  - {class: org.abstractj.kalium.crypto.Hash, method: sha256, match: "(String message, Encoder encoder)", note: "Hash.sha256"}
  - {class: org.abstractj.kalium.crypto.Hash, method: sha512, match: "(String message, Encoder encoder)", note: "Hash.sha512"}
  - {class: org.abstractj.kalium.crypto.Hash, method: blake2, match: "(byte[] message) throws UnsupportedOperationException", note: "Hash.blake2"}
  - {class: org.abstractj.kalium.crypto.Hash, method: blake2, match: "(String message, Encoder encoder) throws UnsupportedOperationException", note: "Hash.blake2"}
  - {class: org.abstractj.kalium.crypto.Password, method: deriveKey, match: "(int length, byte[] passwd, byte[] salt, int opslimit, long memlimit)", note: "Password.deriveKey"}
  - {class: org.abstractj.kalium.crypto.Password, method: hash, match: "(byte[] passwd, Encoder encoder, byte[] salt, int opslimit, long memlimit)", note: "Password.hash"}
  - {class: org.abstractj.kalium.crypto.Password, method: hash, match: "(int length, byte[] passwd, Encoder encoder, byte[] salt, int opslimit, long memlimit)", note: "Password.hash"}
  - {class: org.abstractj.kalium.crypto.Password, method: hash, match: "(byte[] passwd, Encoder encoder, int opslimit, long memlimit)", note: "Password.hash"}
  - {class: org.abstractj.kalium.crypto.Password, method: verify, match: "(byte[] hashed_passwd, byte[] passwd)", note: "Password.verify"}
  - {class: org.abstractj.kalium.crypto.Point, method: mult, match: "(byte[] n)", note: "Point.mult"}
  - {class: org.abstractj.kalium.crypto.Point, method: mult, match: "(String n, Encoder encoder)", note: "Point.mult"}
  - {class: org.abstractj.kalium.crypto.Point, method: toBytes, match: "()", note: "Point.toBytes"}
  - {class: org.abstractj.kalium.crypto.Random, method: randomBytes, match: "(int n)", note: "Random.randomBytes"}
