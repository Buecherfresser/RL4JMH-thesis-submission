# Curated performance-mutation sites for streaminer (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants streaminer --source data/external-src/<checkout> \
#       --sites data/projects/streaminer/mutation_sites.yaml

package_root: org.streaminer.stream

sites:
  - {class: org.streaminer.stream.avg.ExponentialMovingAverage, method: clear, match: "()", note: "ExponentialMovingAverage.clear"}
  - {class: org.streaminer.stream.cardinality.RegisterSet, method: getBits, match: "(int count)", note: "RegisterSet.getBits"}
  - {class: org.streaminer.stream.change.AbsoluteChange, method: getDeltoids, match: "(int thresh)", note: "AbsoluteChange.getDeltoids"}
  - {class: org.streaminer.stream.classifier.tree.Range, method: includes, match: "( Double d )", note: "Range.includes"}
  - {class: org.streaminer.stream.clustering.KMeans, method: classify, match: "(double[] features)", note: "KMeans.classify"}
  - {class: org.streaminer.stream.data.DataUtils, method: getKeys, match: "(Data item)", note: "DataUtils.getKeys"}
  - {class: org.streaminer.stream.entropy.EntropyExact, method: push, match: "(byte[] b, int inc)", note: "EntropyExact.push"}
  - {class: org.streaminer.stream.eval.ConfusionMatrix, method: addLabel, match: "(T additionalLabel)", note: "ConfusionMatrix.addLabel"}
  - {class: org.streaminer.stream.frequency.topk.ConcurrentStreamSummary, method: peek, match: "(final int k)", note: "ConcurrentStreamSummary.peek"}
  - {class: org.streaminer.stream.histogram.spdt.ArrayBinReservoir, method: insert, match: "(Bin<T> bin)", note: "ArrayBinReservoir.insert"}
  - {class: org.streaminer.stream.learner.LearnerUtils, method: detectLabelAttribute, match: "( Data item )", note: "LearnerUtils.detectLabelAttribute"}
  - {class: org.streaminer.stream.mapper.KeyMapper, method: getOld, match: "()", note: "KeyMapper.getOld"}
  - {class: org.streaminer.stream.membership.HashFunction, method: clear, match: "()", note: "HashFunction.clear"}
  - {class: org.streaminer.stream.misc.MovingWindowDelta, method: getDelta, match: "()", note: "MovingWindowDelta.getDelta"}
  - {class: org.streaminer.stream.model.StreamDistribution, method: setCounter, match: "( IRichFrequency<T> counter )", note: "StreamDistribution.setCounter"}
  - {class: org.streaminer.stream.norm.StableSketch, method: subtract, match: "(StableSketch that)", note: "StableSketch.subtract"}
  - {class: org.streaminer.stream.quantile.CKMSQuantiles, method: offer, match: "(Long value)", note: "CKMSQuantiles.offer"}
  - {class: org.streaminer.stream.sampler.BernoulliSampler, method: setSeed, match: "(long seed)", note: "BernoulliSampler.setSeed"}
  - {class: org.streaminer.stream.wavelet.HaarWaveletTransform, method: setNumLargest, match: "(int numLargest)", note: "HaarWaveletTransform.setNumLargest"}
  - {class: org.streaminer.stream.avg.ExponentialMovingAverage, method: getCount, match: "()", note: "ExponentialMovingAverage.getCount"}
  - {class: org.streaminer.stream.cardinality.RegisterSet, method: getSizeForCount, match: "(int count)", note: "RegisterSet.getSizeForCount"}
  - {class: org.streaminer.stream.change.CusumNP, method: computeScore, match: "(double value)", note: "CusumNP.computeScore"}
  - {class: org.streaminer.stream.classifier.AROWClassifier, method: predict, match: "(double[] features)", note: "AROWClassifier.predict"}
  - {class: org.streaminer.stream.clustering.KMeans, method: distribution, match: "(double[] features)", note: "KMeans.distribution"}
  - {class: org.streaminer.stream.data.DataUtils, method: getSpecialKeys, match: "(Data item)", note: "DataUtils.getSpecialKeys"}
  - {class: org.streaminer.stream.entropy.EntropyExact, method: entropy, match: "()", note: "EntropyExact.entropy"}
  - {class: org.streaminer.stream.eval.ConfusionMatrix, method: addLabels, match: "(List<T> additionalLabels)", note: "ConfusionMatrix.addLabels"}
  - {class: org.streaminer.stream.frequency.topk.ConcurrentStreamSummary, method: size, match: "()", note: "ConcurrentStreamSummary.size"}
  - {class: org.streaminer.stream.histogram.spdt.ArrayBinReservoir, method: first, match: "()", note: "ArrayBinReservoir.first"}
  - {class: org.streaminer.stream.learner.LearnerUtils, method: isLabel, match: "( String name )", note: "LearnerUtils.isLabel"}
  - {class: org.streaminer.stream.mapper.KeyMapper, method: setOld, match: "(String oldKey)", note: "KeyMapper.setOld"}
  - {class: org.streaminer.stream.membership.HashFunction, method: hash, match: "(Key k)", note: "HashFunction.hash"}
  - {class: org.streaminer.stream.misc.Significance, method: chiSqrScore, match: "(double observed, double expected)", note: "Significance.chiSqrScore"}
  - {class: org.streaminer.stream.model.StreamDistribution, method: getCount, match: "()", note: "StreamDistribution.getCount"}
  - {class: org.streaminer.stream.norm.StableSketch, method: distance, match: "(StableSketch that)", note: "StableSketch.distance"}
  - {class: org.streaminer.stream.quantile.CKMSQuantiles, method: getQuantile, match: "(double q) throws QuantilesException", note: "CKMSQuantiles.getQuantile"}
  - {class: org.streaminer.stream.sampler.ChainSampler, method: sample, match: "(Serializable item)", note: "ChainSampler.sample"}
  - {class: org.streaminer.stream.wavelet.HaarWaveletTransform, method: transform, match: "(int[] data)", note: "HaarWaveletTransform.transform"}
  - {class: org.streaminer.stream.avg.MovingAverage, method: getAverage, match: "()", note: "MovingAverage.getAverage"}
  - {class: org.streaminer.stream.cardinality.AdaptiveCounting, method: offer, match: "(Object o)", note: "AdaptiveCounting.offer"}
  - {class: org.streaminer.stream.change.CusumNP, method: resetScore, match: "()", note: "CusumNP.resetScore"}
  - {class: org.streaminer.stream.classifier.AROWClassifier, method: learn, match: "(Boolean label, double[] features)", note: "AROWClassifier.learn"}
  - {class: org.streaminer.stream.clustering.birch.CFEntry, method: getIndexList, match: "()", note: "CFEntry.getIndexList"}
  - {class: org.streaminer.stream.data.DataImpl, method: getByteSize, match: "()", note: "DataImpl.getByteSize"}
  - {class: org.streaminer.stream.entropy.EntropySketch, method: push, match: "(byte[] b, int inc)", note: "EntropySketch.push"}
  - {class: org.streaminer.stream.eval.TableOfConfusion, method: addTruePositive, match: "()", note: "TableOfConfusion.addTruePositive"}
  - {class: org.streaminer.stream.frequency.topk.StreamSummary, method: getCapacity, match: "()", note: "StreamSummary.getCapacity"}
  - {class: org.streaminer.stream.histogram.spdt.ArrayCategoricalTarget, method: setIndexMap, match: "(Map<Object, Integer> indexMap)", note: "ArrayCategoricalTarget.setIndexMap"}
  - {class: org.streaminer.stream.mapper.SelectFeaturesMapper, method: map, match: "(Map<String, Object> input) throws Exception", note: "SelectFeaturesMapper.map"}
  - {class: org.streaminer.stream.membership.BloomCalculations, method: computeBestK, match: "(int bucketsPerElement)", note: "BloomCalculations.computeBestK"}
