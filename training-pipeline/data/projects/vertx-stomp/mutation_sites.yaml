  - {class: io.vertx.ext.stomp.impl.StompClientImpl, method: receivedFrameHandler, match: "(Handler<Frame> handler)", note: "StompClientImpl.receivedFrameHandler"}
  - {class: io.vertx.ext.stomp.impl.StompServerImpl, method: handler, match: "(StompServerHandler handler)", note: "StompServerImpl.handler"}
  - {class: io.vertx.ext.stomp.impl.StompServerImpl, method: listen, match: "()", note: "StompServerImpl.listen"}
  - {class: io.vertx.ext.stomp.impl.StompServerImpl, method: listen, match: "(Completable<StompServer> handler)", note: "StompServerImpl.listen"}
  - {class: io.vertx.ext.stomp.impl.StompServerTCPConnectionImpl, method: server, match: "()", note: "StompServerTCPConnectionImpl.server"}
  - {class: io.vertx.ext.stomp.impl.StompServerTCPConnectionImpl, method: handler, match: "()", note: "StompServerTCPConnectionImpl.handler"}
