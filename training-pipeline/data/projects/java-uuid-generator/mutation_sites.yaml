  - {class: com.fasterxml.uuid.Generators, method: randomBasedGenerator, match: "()", note: "Generators.randomBasedGenerator"}
  - {class: com.fasterxml.uuid.impl.NameBasedGenerator, method: generate, match: "(byte[] nameBytes)", note: "NameBasedGenerator.generate"}
  - {class: com.fasterxml.uuid.Generators, method: randomBasedGenerator, match: "(Random rnd)", note: "Generators.randomBasedGenerator"}
