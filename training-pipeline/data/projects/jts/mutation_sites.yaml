# Curated performance-mutation sites for jts (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jts --source data/external-src/<checkout> \
#       --sites data/projects/jts/mutation_sites.yaml

package_root: org.locationtech.jts

sites:
  - {class: org.locationtech.jts.JTSVersion, method: getMajor, match: "()", note: "JTSVersion.getMajor"}
  - {class: org.locationtech.jts.algorithm.Angle, method: toDegrees, match: "(double radians)", note: "Angle.toDegrees"}
  - {class: org.locationtech.jts.awt.GeometryCollectionShape, method: getBounds, match: "()", note: "GeometryCollectionShape.getBounds"}
  - {class: org.locationtech.jts.coverage.CleanCoverage, method: mergeOverlap, match: "(Polygon overlap, MergeStrategy mergeStrategy, IntArrayList parentIndexes)", note: "CleanCoverage.mergeOverlap"}
  - {class: org.locationtech.jts.densify.Densifier, method: densify, match: "(Geometry geom, double distanceTolerance)", note: "Densifier.densify"}
  - {class: org.locationtech.jts.dissolve.LineDissolver, method: filter, match: "(Geometry component)", note: "LineDissolver.filter"}
  - {class: org.locationtech.jts.edgegraph.EdgeGraphBuilder, method: build, match: "(Collection geoms)", note: "EdgeGraphBuilder.build"}
  - {class: org.locationtech.jts.geom.CoordinateArrays, method: dimension, match: "(Coordinate[] pts)", note: "CoordinateArrays.dimension"}
  - {class: org.locationtech.jts.geomgraph.EdgeIntersectionList, method: iterator, match: "()", note: "EdgeIntersectionList.iterator"}
  - {class: org.locationtech.jts.index.ArrayListVisitor, method: getItems, match: "()", note: "ArrayListVisitor.getItems"}
  - {class: org.locationtech.jts.io.ByteArrayInStream, method: setBytes, match: "(final byte[] buffer)", note: "ByteArrayInStream.setBytes"}
  - {class: org.locationtech.jts.linearref.LinearGeometryBuilder, method: getLastCoordinate, match: "()", note: "LinearGeometryBuilder.getLastCoordinate"}
  - {class: org.locationtech.jts.math.MathUtil, method: ceil, match: "(int num, int denom)", note: "MathUtil.ceil"}
  - {class: org.locationtech.jts.noding.BasicSegmentString, method: substring, match: "(SegmentString segString, int start, int end)", note: "BasicSegmentString.substring"}
  - {class: org.locationtech.jts.operation.buffer.BufferBuilder, method: setNoder, match: "(Noder noder)", note: "BufferBuilder.setNoder"}
  - {class: org.locationtech.jts.planargraph.NodeMap, method: find, match: "(Coordinate coord)", note: "NodeMap.find"}
  - {class: org.locationtech.jts.precision.CommonBitsRemover, method: getCommonCoordinate, match: "()", note: "CommonBitsRemover.getCommonCoordinate"}
  - {class: org.locationtech.jts.shape.fractal.HilbertCurveBuilder, method: setLevel, match: "(int level)", note: "HilbertCurveBuilder.setLevel"}
  - {class: org.locationtech.jts.simplify.TaggedLineString, method: isRing, match: "()", note: "TaggedLineString.isRing"}
  - {class: org.locationtech.jts.triangulate.quadedge.QuadEdgeUtil, method: findEdgesIncidentOnOrigin, match: "(QuadEdge start)", note: "QuadEdgeUtil.findEdgesIncidentOnOrigin"}
  - {class: org.locationtech.jts.util.CollectionUtil, method: select, match: "(Collection collection, Function func)", note: "CollectionUtil.select"}
  - {class: org.locationtech.jts.JTSVersion, method: getMinor, match: "()", note: "JTSVersion.getMinor"}
  - {class: org.locationtech.jts.algorithm.Angle, method: toRadians, match: "(double angleDegrees)", note: "Angle.toRadians"}
  - {class: org.locationtech.jts.awt.GeometryCollectionShape, method: getBounds2D, match: "()", note: "GeometryCollectionShape.getBounds2D"}
  - {class: org.locationtech.jts.coverage.CleanCoverage, method: findMergeTarget, match: "(Polygon poly, MergeStrategy strat, IntArrayList parentIndexes, CleanArea[] cov)", note: "CleanCoverage.findMergeTarget"}
  - {class: org.locationtech.jts.densify.Densifier, method: setDistanceTolerance, match: "(double distanceTolerance)", note: "Densifier.setDistanceTolerance"}
  - {class: org.locationtech.jts.edgegraph.EdgeGraphBuilder, method: filter, match: "(Geometry component)", note: "EdgeGraphBuilder.filter"}
  - {class: org.locationtech.jts.geom.CoordinateArrays, method: measures, match: "(Coordinate[] pts)", note: "CoordinateArrays.measures"}
  - {class: org.locationtech.jts.geomgraph.EdgeList, method: getEdges, match: "()", note: "EdgeList.getEdges"}
  - {class: org.locationtech.jts.index.VertexSequencePackedRtree, method: getBounds, match: "()", note: "VertexSequencePackedRtree.getBounds"}
  - {class: org.locationtech.jts.io.ByteOrderDataInStream, method: getCount, match: "()", note: "ByteOrderDataInStream.getCount"}
  - {class: org.locationtech.jts.linearref.LinearIterator, method: isEndOfLine, match: "()", note: "LinearIterator.isEndOfLine"}
  - {class: org.locationtech.jts.math.MathUtil, method: hypot, match: "(double x, double y)", note: "MathUtil.hypot"}
  - {class: org.locationtech.jts.noding.BasicSegmentString, method: setData, match: "(Object data)", note: "BasicSegmentString.setData"}
  - {class: org.locationtech.jts.operation.buffer.BufferOp, method: bufferByZero, match: "(Geometry geom, boolean isBothOrientations)", note: "BufferOp.bufferByZero"}
  - {class: org.locationtech.jts.planargraph.DirectedEdge, method: getEdge, match: "()", note: "DirectedEdge.getEdge"}
  - {class: org.locationtech.jts.precision.CommonBitsRemover, method: filter, match: "(CoordinateSequence seq, int i)", note: "CommonBitsRemover.filter"}
  - {class: org.locationtech.jts.shape.fractal.HilbertCurveBuilder, method: getGeometry, match: "()", note: "HilbertCurveBuilder.getGeometry"}
  - {class: org.locationtech.jts.simplify.TaggedLineString, method: getMinimumSize, match: "()", note: "TaggedLineString.getMinimumSize"}
  - {class: org.locationtech.jts.triangulate.tri.TriangulationBuilder, method: build, match: "(List<? extends Tri> triList)", note: "TriangulationBuilder.build"}
  - {class: org.locationtech.jts.util.CoordinateArrayFilter, method: getCoordinates, match: "()", note: "CoordinateArrayFilter.getCoordinates"}
  - {class: org.locationtech.jts.algorithm.ConvexHull, method: getConvexHull, match: "()", note: "ConvexHull.getConvexHull"}
  - {class: org.locationtech.jts.awt.PolygonShape, method: getBounds, match: "()", note: "PolygonShape.getBounds"}
  - {class: org.locationtech.jts.coverage.Corner, method: isVertex, match: "(int index)", note: "Corner.isVertex"}
  - {class: org.locationtech.jts.edgegraph.EdgeGraph, method: addEdge, match: "(Coordinate orig, Coordinate dest)", note: "EdgeGraph.addEdge"}
  - {class: org.locationtech.jts.geom.CoordinateList, method: getCoordinate, match: "(int i)", note: "CoordinateList.getCoordinate"}
  - {class: org.locationtech.jts.geomgraph.EdgeList, method: iterator, match: "()", note: "EdgeList.iterator"}
  - {class: org.locationtech.jts.index.VertexSequencePackedRtree, method: query, match: "(Envelope queryEnv)", note: "VertexSequencePackedRtree.query"}
  - {class: org.locationtech.jts.io.CheckOrdinatesFilter, method: filter, match: "(CoordinateSequence seq, int i)", note: "CheckOrdinatesFilter.filter"}
  - {class: org.locationtech.jts.linearref.LinearIterator, method: getComponentIndex, match: "()", note: "LinearIterator.getComponentIndex"}
