# Curated performance-mutation sites for commons-configuration (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants commons-configuration --source data/external-src/<checkout> \
#       --sites data/projects/commons-configuration/mutation_sites.yaml

package_root: org.apache.commons.configuration2

sites:
  - {class: org.apache.commons.configuration2.ConfigurationMap, method: getKey, match: "()", note: "ConfigurationMap.getKey"}
  - {class: org.apache.commons.configuration2.beanutils.BeanHelper, method: createBean, match: "(final BeanDeclaration data)", note: "BeanHelper.createBean"}
  - {class: org.apache.commons.configuration2.builder.AutoSaveListener, method: loaded, match: "(final FileHandler handler)", note: "AutoSaveListener.loaded"}
  - {class: org.apache.commons.configuration2.convert.DefaultListDelimiterHandler, method: escapeList, match: "(final List<?> values, final ValueTransformer transformer)", note: "DefaultListDelimiterHandler.escapeList"}
  - {class: org.apache.commons.configuration2.event.EventListenerList, method: invokeNext, match: "(final Event event)", note: "EventListenerList.invokeNext"}
  - {class: org.apache.commons.configuration2.interpol.StringLookupAdapter, method: lookup, match: "(final String key)", note: "StringLookupAdapter.lookup"}
  - {class: org.apache.commons.configuration2.io.FileHandlerListenerAdapter, method: loaded, match: "(final FileHandler handler)", note: "FileHandlerListenerAdapter.loaded"}
  - {class: org.apache.commons.configuration2.plist.PropertyListConfiguration, method: checkLength, match: "(final String s, final int index, final int length) throws ParseException", note: "PropertyListConfiguration.checkLength"}
  - {class: org.apache.commons.configuration2.reloading.CombinedReloadingController, method: isReloadingRequired, match: "()", note: "CombinedReloadingController.isReloadingRequired"}
  - {class: org.apache.commons.configuration2.resolver.CatalogResolver, method: loadSystemCatalogs, match: "() throws IOException", note: "CatalogResolver.loadSystemCatalogs"}
  - {class: org.apache.commons.configuration2.spring.ConfigurationPropertiesFactoryBean, method: afterPropertiesSet, match: "() throws Exception", note: "ConfigurationPropertiesFactoryBean.afterPropertiesSet"}
  - {class: org.apache.commons.configuration2.sync.NoOpSynchronizer, method: beginRead, match: "()", note: "NoOpSynchronizer.beginRead"}
  - {class: org.apache.commons.configuration2.tree.TreeUtils, method: printTree, match: "(final PrintStream stream, final ImmutableNode result)", note: "TreeUtils.printTree"}
  - {class: org.apache.commons.configuration2.web.AppletConfiguration, method: getKeysInternal, match: "()", note: "AppletConfiguration.getKeysInternal"}
  - {class: org.apache.commons.configuration2.ConfigurationMap, method: getValue, match: "()", note: "ConfigurationMap.getValue"}
  - {class: org.apache.commons.configuration2.beanutils.BeanHelper, method: getBeanClass, match: "()", note: "BeanHelper.getBeanClass"}
  - {class: org.apache.commons.configuration2.builder.AutoSaveListener, method: loading, match: "(final FileHandler handler)", note: "AutoSaveListener.loading"}
  - {class: org.apache.commons.configuration2.convert.DefaultListDelimiterHandler, method: escapeString, match: "(final String s)", note: "DefaultListDelimiterHandler.escapeString"}
