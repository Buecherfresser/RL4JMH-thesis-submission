# Curated performance-mutation sites for jool (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jool --source data/external-src/<checkout> \
#       --sites data/projects/jool/mutation_sites.yaml

package_root: org.jooq.lambda

sites:
  - {class: org.jooq.lambda.SeqBuffer, method: tryAdvance, match: "(Consumer<? super T> action)", note: "SeqBuffer.tryAdvance"}
  - {class: org.jooq.lambda.function.Functions, method: not, match: "(Predicate<T> predicate)", note: "Functions.not"}
  - {class: org.jooq.lambda.tuple.Range, method: overlaps, match: "(Tuple2<T, T> other)", note: "Range.overlaps"}
  - {class: org.jooq.lambda.SeqBuffer, method: estimateSize, match: "()", note: "SeqBuffer.estimateSize"}
  - {class: org.jooq.lambda.function.Functions, method: and, match: "(Predicate<T>... predicates)", note: "Functions.and"}
  - {class: org.jooq.lambda.tuple.Range, method: overlaps, match: "(Range<T> other)", note: "Range.overlaps"}
  - {class: org.jooq.lambda.SeqUtils, method: tryAdvance, match: "(Consumer<? super U> action)", note: "SeqUtils.tryAdvance"}
  - {class: org.jooq.lambda.tuple.Tuple0, method: concat, match: "(T1 value)", note: "Tuple0.concat"}
  - {class: org.jooq.lambda.SeqUtils, method: trySplit, match: "()", note: "SeqUtils.trySplit"}
  - {class: org.jooq.lambda.tuple.Tuple0, method: concat, match: "(Tuple1<T1> tuple)", note: "Tuple0.concat"}
  - {class: org.jooq.lambda.Agg, method: filter, match: "(Predicate<? super T> predicate, Collector<T, A, R> downstream)", note: "Agg.filter"}
  - {class: org.jooq.lambda.tuple.Tuple1, method: v1, match: "()", note: "Tuple1.v1"}
  - {class: org.jooq.lambda.Agg, method: first, match: "()", note: "Agg.first"}
  - {class: org.jooq.lambda.tuple.Tuple1, method: concat, match: "(T2 value)", note: "Tuple1.concat"}
  - {class: org.jooq.lambda.Async, method: supplyAsync, match: "(Supplier<U> supplier)", note: "Async.supplyAsync"}
  - {class: org.jooq.lambda.tuple.Tuple10, method: v1, match: "()", note: "Tuple10.v1"}
  - {class: org.jooq.lambda.Async, method: supplyAsync, match: "(Supplier<U> supplier, Executor executor)", note: "Async.supplyAsync"}
  - {class: org.jooq.lambda.tuple.Tuple10, method: v2, match: "()", note: "Tuple10.v2"}
  - {class: org.jooq.lambda.Blocking, method: runnable, match: "(Runnable runnable)", note: "Blocking.runnable"}
  - {class: org.jooq.lambda.tuple.Tuple11, method: v1, match: "()", note: "Tuple11.v1"}
  - {class: org.jooq.lambda.Blocking, method: biConsumer, match: "(BiConsumer<? super T, ? super U> biConsumer)", note: "Blocking.biConsumer"}
  - {class: org.jooq.lambda.tuple.Tuple11, method: v2, match: "()", note: "Tuple11.v2"}
  - {class: org.jooq.lambda.SameExecutorCompletionStage, method: thenApply, match: "(Function<? super T, ? extends U> fn)", note: "SameExecutorCompletionStage.thenApply"}
  - {class: org.jooq.lambda.tuple.Tuple12, method: v1, match: "()", note: "Tuple12.v1"}
  - {class: org.jooq.lambda.SameExecutorCompletionStage, method: thenApplyAsync, match: "(Function<? super T, ? extends U> fn)", note: "SameExecutorCompletionStage.thenApplyAsync"}
  - {class: org.jooq.lambda.tuple.Tuple12, method: v2, match: "()", note: "Tuple12.v2"}
  - {class: org.jooq.lambda.SeqImpl, method: stream, match: "()", note: "SeqImpl.stream"}
  - {class: org.jooq.lambda.tuple.Tuple13, method: v1, match: "()", note: "Tuple13.v1"}
  - {class: org.jooq.lambda.SeqImpl, method: filter, match: "(Predicate<? super T> predicate)", note: "SeqImpl.filter"}
  - {class: org.jooq.lambda.tuple.Tuple13, method: v2, match: "()", note: "Tuple13.v2"}
  - {class: org.jooq.lambda.Sneaky, method: throwChecked, match: "(Throwable t)", note: "Sneaky.throwChecked"}
  - {class: org.jooq.lambda.tuple.Tuple14, method: v1, match: "()", note: "Tuple14.v1"}
  - {class: org.jooq.lambda.Sneaky, method: runnable, match: "(CheckedRunnable runnable)", note: "Sneaky.runnable"}
  - {class: org.jooq.lambda.tuple.Tuple14, method: v2, match: "()", note: "Tuple14.v2"}
  - {class: org.jooq.lambda.Unchecked, method: throwChecked, match: "(Throwable t)", note: "Unchecked.throwChecked"}
  - {class: org.jooq.lambda.tuple.Tuple15, method: v1, match: "()", note: "Tuple15.v1"}
  - {class: org.jooq.lambda.Unchecked, method: runnable, match: "(CheckedRunnable runnable)", note: "Unchecked.runnable"}
  - {class: org.jooq.lambda.tuple.Tuple15, method: v2, match: "()", note: "Tuple15.v2"}
  - {class: org.jooq.lambda.WindowImpl, method: value, match: "()", note: "WindowImpl.value"}
  - {class: org.jooq.lambda.tuple.Tuple16, method: v1, match: "()", note: "Tuple16.v1"}
  - {class: org.jooq.lambda.WindowImpl, method: window, match: "()", note: "WindowImpl.window"}
  - {class: org.jooq.lambda.tuple.Tuple16, method: v2, match: "()", note: "Tuple16.v2"}
  - {class: org.jooq.lambda.WindowSpecificationImpl, method: partition, match: "()", note: "WindowSpecificationImpl.partition"}
  - {class: org.jooq.lambda.tuple.Tuple2, method: v1, match: "()", note: "Tuple2.v1"}
  - {class: org.jooq.lambda.WindowSpecificationImpl, method: order, match: "()", note: "WindowSpecificationImpl.order"}
  - {class: org.jooq.lambda.tuple.Tuple2, method: v2, match: "()", note: "Tuple2.v2"}
  - {class: org.jooq.lambda.tuple.Tuple3, method: v1, match: "()", note: "Tuple3.v1"}
  - {class: org.jooq.lambda.tuple.Tuple3, method: v2, match: "()", note: "Tuple3.v2"}
  - {class: org.jooq.lambda.tuple.Tuple4, method: v1, match: "()", note: "Tuple4.v1"}
  - {class: org.jooq.lambda.tuple.Tuple4, method: v2, match: "()", note: "Tuple4.v2"}
