  - {class: com.fasterxml.jackson.datatype.jdk8.Jdk8UnwrappingOptionalBeanPropertyWriter, method: serializeAsField, match: "(Object bean, JsonGenerator gen, SerializerProvider prov) throws Exception", note: "Jdk8UnwrappingOptionalBeanPropertyWriter.serializeAsField"}
  - {class: com.fasterxml.jackson.datatype.jdk8.OptionalDeserializer, method: withResolved, match: "(TypeDeserializer typeDeser, JsonDeserializer<?> valueDeser)", note: "OptionalDeserializer.withResolved"}
