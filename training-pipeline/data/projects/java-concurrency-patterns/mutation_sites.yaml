# Curated performance-mutation sites for java-concurrency-patterns (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants java-concurrency-patterns --source data/external-src/<checkout> \
#       --sites data/projects/java-concurrency-patterns/mutation_sites.yaml

package_root: br.com.leonardoz

sites:
  - {class: br.com.leonardoz.features.parallel_stream.UsingParallelStreams, method: main, match: "(String[] args)", note: "UsingParallelStreams.main"}
  - {class: br.com.leonardoz.patterns.thread_safe.compound_actions.CompareAndSwapUtil, method: getValue, match: "()", note: "CompareAndSwapUtil.getValue"}
  - {class: br.com.leonardoz.features.parallel_stream.UsingParallelStreams, method: isPrime, match: "(BigInteger n)", note: "UsingParallelStreams.isPrime"}
  - {class: br.com.leonardoz.patterns.thread_safe.compound_actions.CompareAndSwapUtil, method: compareAndSwap, match: "(int expected, int newValue)", note: "CompareAndSwapUtil.compareAndSwap"}
  - {class: br.com.leonardoz.features.atomics.UsingAtomics, method: increment, match: "()", note: "UsingAtomics.increment"}
  - {class: br.com.leonardoz.patterns.condition_queues.ExplicitConditionQueue, method: stopMessages, match: "() throws InterruptedException", note: "ExplicitConditionQueue.stopMessages"}
  - {class: br.com.leonardoz.features.atomics.UsingAtomics, method: decrement, match: "()", note: "UsingAtomics.decrement"}
  - {class: br.com.leonardoz.patterns.condition_queues.ExplicitConditionQueue, method: printMessages, match: "(String message) throws InterruptedException", note: "ExplicitConditionQueue.printMessages"}
  - {class: br.com.leonardoz.features.collections.UsingConcurrentCollections, method: usingConcurrentHashMap, match: "()", note: "UsingConcurrentCollections.usingConcurrentHashMap"}
  - {class: br.com.leonardoz.patterns.condition_queues.WaitNotifyQueue, method: stopsMessaging, match: "()", note: "WaitNotifyQueue.stopsMessaging"}
  - {class: br.com.leonardoz.features.collections.UsingConcurrentCollections, method: usingCopyOnWriteArrayList, match: "()", note: "UsingConcurrentCollections.usingCopyOnWriteArrayList"}
  - {class: br.com.leonardoz.patterns.condition_queues.WaitNotifyQueue, method: message, match: "() throws InterruptedException", note: "WaitNotifyQueue.message"}
  - {class: br.com.leonardoz.features.collections.UsingSynchronizedCollections, method: insertIfAbsent, match: "(Vector<Long> list, Long value)", note: "UsingSynchronizedCollections.insertIfAbsent"}
  - {class: br.com.leonardoz.patterns.controlled_initialization.ControlledInitialization, method: main, match: "(String[] args)", note: "ControlledInitialization.main"}
  - {class: br.com.leonardoz.features.collections.UsingSynchronizedCollections, method: insertIfAbsentUnsafe, match: "(Vector<Long> list, Long value)", note: "UsingSynchronizedCollections.insertIfAbsentUnsafe"}
  - {class: br.com.leonardoz.patterns.divideconquer.ParallelDivideAndConquer, method: compute, match: "()", note: "ParallelDivideAndConquer.compute"}
  - {class: br.com.leonardoz.features.executors.UsingExecutors, method: usingSingleThreadExecutor, match: "()", note: "UsingExecutors.usingSingleThreadExecutor"}
  - {class: br.com.leonardoz.patterns.divideconquer.ParallelSum, method: compute, match: "()", note: "ParallelSum.compute"}
  - {class: br.com.leonardoz.features.executors.UsingExecutors, method: usingCachedThreadPool, match: "()", note: "UsingExecutors.usingCachedThreadPool"}
  - {class: br.com.leonardoz.patterns.divideconquer.ParallelSum, method: main, match: "(String[] args) throws InterruptedException", note: "ParallelSum.main"}
  - {class: br.com.leonardoz.features.forkjoin.UsingForkJoinFramework, method: getCommonPool, match: "()", note: "UsingForkJoinFramework.getCommonPool"}
  - {class: br.com.leonardoz.patterns.fixed_lock_ordering.CoinTransfer, method: getId, match: "()", note: "CoinTransfer.getId"}
  - {class: br.com.leonardoz.features.forkjoin.UsingForkJoinFramework, method: customForkJoinPool, match: "(int parallelism,", note: "UsingForkJoinFramework.customForkJoinPool"}
