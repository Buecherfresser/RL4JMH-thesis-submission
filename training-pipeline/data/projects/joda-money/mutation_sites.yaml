# Curated performance-mutation sites for joda-money (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants joda-money --source data/external-src/<checkout> \
#       --sites data/projects/joda-money/mutation_sites.yaml

package_root: org.joda.money

sites:
