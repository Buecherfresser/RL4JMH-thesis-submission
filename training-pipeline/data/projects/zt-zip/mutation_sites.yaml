# Curated performance-mutation sites for zt-zip (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants zt-zip --source data/external-src/<checkout> \
#       --sites data/projects/zt-zip/mutation_sites.yaml

package_root: org.zeroturnaround.zip

sites:
  - {class: org.zeroturnaround.zip.CloseShieldInputStream, method: close, match: "() throws IOException", note: "CloseShieldInputStream.close"}
  - {class: org.zeroturnaround.zip.commons.FileUtils, method: getTempFileFor, match: "(File file)", note: "FileUtils.getTempFileFor"}
  - {class: org.zeroturnaround.zip.extra.ExtraFieldUtils, method: register, match: "(Class<?> c)", note: "ExtraFieldUtils.register"}
  - {class: org.zeroturnaround.zip.timestamps.Java8TimestampStrategy, method: setTime, match: "(ZipEntry newInstance, ZipEntry oldInstance)", note: "Java8TimestampStrategy.setTime"}
  - {class: org.zeroturnaround.zip.transform.ZipEntrySourceZipEntryTransformer, method: transform, match: "(InputStream in, ZipEntry zipEntry, ZipOutputStream out) throws IOException", note: "ZipEntrySourceZipEntryTransformer.transform"}
  - {class: org.zeroturnaround.zip.IdentityNameMapper, method: map, match: "(String name)", note: "IdentityNameMapper.map"}
  - {class: org.zeroturnaround.zip.commons.FileUtilsV2_2, method: openInputStream, match: "(File file) throws IOException", note: "FileUtilsV2_2.openInputStream"}
  - {class: org.zeroturnaround.zip.extra.ExtraFieldUtils, method: createExtraField, match: "(ZipShort headerId)", note: "ExtraFieldUtils.createExtraField"}
  - {class: org.zeroturnaround.zip.timestamps.PreJava8TimestampStrategy, method: setTime, match: "(ZipEntry newInstance, ZipEntry oldInstance)", note: "PreJava8TimestampStrategy.setTime"}
  - {class: org.zeroturnaround.zip.transform.ZipEntryTransformerEntry, method: getPath, match: "()", note: "ZipEntryTransformerEntry.getPath"}
  - {class: org.zeroturnaround.zip.ZTFilePermissionsUtil, method: setPermissions, match: "(File file, ZTFilePermissions permissions)", note: "ZTFilePermissionsUtil.setPermissions"}
  - {class: org.zeroturnaround.zip.commons.FileUtilsV2_2, method: openOutputStream, match: "(File file) throws IOException", note: "FileUtilsV2_2.openOutputStream"}
  - {class: org.zeroturnaround.zip.extra.ExtraFieldUtils, method: parseA, match: "(byte[] data) throws ZipException", note: "ExtraFieldUtils.parseA"}
  - {class: org.zeroturnaround.zip.timestamps.TimestampStrategyFactory, method: getInstance, match: "()", note: "TimestampStrategyFactory.getInstance"}
  - {class: org.zeroturnaround.zip.transform.ZipEntryTransformerEntry, method: getTransformer, match: "()", note: "ZipEntryTransformerEntry.getTransformer"}
  - {class: org.zeroturnaround.zip.ZTFilePermissionsUtil, method: getPermissions, match: "(File file)", note: "ZTFilePermissionsUtil.getPermissions"}
  - {class: org.zeroturnaround.zip.commons.FileUtilsV2_2, method: openOutputStream, match: "(File file, boolean append) throws IOException", note: "FileUtilsV2_2.openOutputStream"}
  - {class: org.zeroturnaround.zip.extra.AsiExtraField, method: getHeaderId, match: "()", note: "AsiExtraField.getHeaderId"}
  - {class: org.zeroturnaround.zip.ZTFileUtil, method: listFiles, match: "(File dir)", note: "ZTFileUtil.listFiles"}
  - {class: org.zeroturnaround.zip.commons.FilenameUtils, method: getPrefixLength, match: "(String filename)", note: "FilenameUtils.getPrefixLength"}
  - {class: org.zeroturnaround.zip.extra.AsiExtraField, method: getLocalFileDataLength, match: "()", note: "AsiExtraField.getLocalFileDataLength"}
  - {class: org.zeroturnaround.zip.ZTFileUtil, method: listFiles, match: "(File dir, FileFilter filter)", note: "ZTFileUtil.listFiles"}
  - {class: org.zeroturnaround.zip.commons.IOUtils, method: closeQuietly, match: "(InputStream input)", note: "IOUtils.closeQuietly"}
  - {class: org.zeroturnaround.zip.extra.AsiExtraField, method: getCentralDirectoryLength, match: "()", note: "AsiExtraField.getCentralDirectoryLength"}
  - {class: org.zeroturnaround.zip.ZTFileUtil, method: accept, match: "(File pathname)", note: "ZTFileUtil.accept"}
  - {class: org.zeroturnaround.zip.commons.IOUtils, method: closeQuietly, match: "(OutputStream output)", note: "IOUtils.closeQuietly"}
  - {class: org.zeroturnaround.zip.extra.UnrecognizedExtraField, method: setHeaderId, match: "(ZipShort headerId)", note: "UnrecognizedExtraField.setHeaderId"}
  - {class: org.zeroturnaround.zip.ZipUtil, method: containsEntry, match: "(File zip, String name)", note: "ZipUtil.containsEntry"}
  - {class: org.zeroturnaround.zip.commons.IOUtils, method: closeQuietly, match: "(Closeable closeable)", note: "IOUtils.closeQuietly"}
  - {class: org.zeroturnaround.zip.extra.UnrecognizedExtraField, method: getHeaderId, match: "()", note: "UnrecognizedExtraField.getHeaderId"}
  - {class: org.zeroturnaround.zip.ZipUtil, method: getCompressionLevelOfEntry, match: "(File zip, String name)", note: "ZipUtil.getCompressionLevelOfEntry"}
  - {class: org.zeroturnaround.zip.commons.StringBuilderWriter, method: append, match: "(char value)", note: "StringBuilderWriter.append"}
  - {class: org.zeroturnaround.zip.extra.UnrecognizedExtraField, method: setLocalFileDataData, match: "(byte[] data)", note: "UnrecognizedExtraField.setLocalFileDataData"}
  - {class: org.zeroturnaround.zip.ZipUtil, method: getCompressionMethodOfEntry, match: "(File zip, String name)", note: "ZipUtil.getCompressionMethodOfEntry"}
  - {class: org.zeroturnaround.zip.commons.StringBuilderWriter, method: append, match: "(CharSequence value)", note: "StringBuilderWriter.append"}
  - {class: org.zeroturnaround.zip.extra.ZipLong, method: getBytes, match: "()", note: "ZipLong.getBytes"}
  - {class: org.zeroturnaround.zip.ByteSource, method: getPath, match: "()", note: "ByteSource.getPath"}
  - {class: org.zeroturnaround.zip.commons.StringBuilderWriter, method: append, match: "(CharSequence value, int start, int end)", note: "StringBuilderWriter.append"}
  - {class: org.zeroturnaround.zip.extra.ZipLong, method: getValue, match: "()", note: "ZipLong.getValue"}
  - {class: org.zeroturnaround.zip.ByteSource, method: getEntry, match: "()", note: "ByteSource.getEntry"}
  - {class: org.zeroturnaround.zip.extra.ZipLong, method: getBytes, match: "(long value)", note: "ZipLong.getBytes"}
  - {class: org.zeroturnaround.zip.ByteSource, method: getInputStream, match: "() throws IOException", note: "ByteSource.getInputStream"}
  - {class: org.zeroturnaround.zip.extra.ZipShort, method: getBytes, match: "()", note: "ZipShort.getBytes"}
  - {class: org.zeroturnaround.zip.FileSource, method: getPath, match: "()", note: "FileSource.getPath"}
  - {class: org.zeroturnaround.zip.extra.ZipShort, method: getValue, match: "()", note: "ZipShort.getValue"}
  - {class: org.zeroturnaround.zip.FileSource, method: getEntry, match: "()", note: "FileSource.getEntry"}
  - {class: org.zeroturnaround.zip.extra.ZipShort, method: getBytes, match: "(int value)", note: "ZipShort.getBytes"}
  - {class: org.zeroturnaround.zip.FileSource, method: getInputStream, match: "() throws IOException", note: "FileSource.getInputStream"}
  - {class: org.zeroturnaround.zip.Java6FileApiPermissionsStrategy, method: getPermissions, match: "(File file)", note: "Java6FileApiPermissionsStrategy.getPermissions"}
  - {class: org.zeroturnaround.zip.Java6FileApiPermissionsStrategy, method: setPermissions, match: "(File file, ZTFilePermissions permissions)", note: "Java6FileApiPermissionsStrategy.setPermissions"}
