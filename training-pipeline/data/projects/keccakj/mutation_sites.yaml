  - {class: com.github.aelstad.keccakj.spi.LakeKeyakCipher, method: init, match: "() throws InvalidKeyException", note: "LakeKeyakCipher.init"}
  - {class: com.github.aelstad.keccakj.spi.LakeKeyakCipher, method: engineUpdate, match: "(byte[] input, int inputOff, int len, byte[] output, int outputOff) throws ShortBufferException", note: "LakeKeyakCipher.engineUpdate"}
  - {class: com.github.aelstad.keccakj.spi.LakeKeyakCipher, method: updateAAD, match: "(byte[] src, int offset, int len)", note: "LakeKeyakCipher.updateAAD"}
  - {class: com.github.aelstad.keccakj.spi.LakeKeyakCipher, method: engineDoFinal, match: "(byte[] input, int inputOff, int len, byte[] output, int outputOff)", note: "LakeKeyakCipher.engineDoFinal"}
