  - {class: com.creditdatamw.zerocell.Reader, method: using, match: "(ColumnInfo... columns)", note: "Reader.using"}
  - {class: com.creditdatamw.zerocell.column.ColumnInfo, method: getConverterClass, match: "()", note: "ColumnInfo.getConverterClass"}
  - {class: com.creditdatamw.zerocell.converter.LocalDateConverter, method: convert, match: "(String value, String columnName, int row)", note: "LocalDateConverter.convert"}
  - {class: com.creditdatamw.zerocell.handler.EntityHandler, method: getMaxRowNumber, match: "()", note: "EntityHandler.getMaxRowNumber"}
  - {class: com.creditdatamw.zerocell.processor.spec.ColumnInfoType, method: getFieldName, match: "()", note: "ColumnInfoType.getFieldName"}
  - {class: com.creditdatamw.zerocell.column.ColumnInfo, method: getFallbackStrategy, match: "()", note: "ColumnInfo.getFallbackStrategy"}
  - {class: com.creditdatamw.zerocell.converter.LocalDateTimeConverter, method: convert, match: "(String value, String columnName, int row)", note: "LocalDateTimeConverter.convert"}
