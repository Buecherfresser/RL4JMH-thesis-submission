# Curated performance-mutation sites for uom (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants uom --source data/external-src/<checkout> \
#       --sites data/projects/uom/mutation_sites.yaml

package_root: com.github.netomi

sites:
  - {class: com.github.netomi.uom.format.QuantityFormatterBuilder, method: appendValue, match: "()", note: "QuantityFormatterBuilder.appendValue"}
  - {class: com.github.netomi.uom.format.QuantityFormatterBuilder, method: appendValue, match: "(NumberFormat format)", note: "QuantityFormatterBuilder.appendValue"}
  - {class: com.github.netomi.uom.format.UnitFormatterBuilder, method: appendSymbol, match: "()", note: "UnitFormatterBuilder.appendSymbol"}
  - {class: com.github.netomi.uom.format.UnitFormatterBuilder, method: appendName, match: "()", note: "UnitFormatterBuilder.appendName"}
  - {class: com.github.netomi.uom.math.ArithmeticUtils, method: gcd, match: "(int p, int q)", note: "ArithmeticUtils.gcd"}
  - {class: com.github.netomi.uom.math.ArithmeticUtils, method: gcd, match: "(final long p, final long q)", note: "ArithmeticUtils.gcd"}
  - {class: com.github.netomi.uom.unit.UnitDefinitionParser, method: parse, match: "(String       definitionFile,", note: "UnitDefinitionParser.parse"}
  - {class: com.github.netomi.uom.util.ConcurrentReferenceHashMap, method: keyHash, match: "()", note: "ConcurrentReferenceHashMap.keyHash"}
  - {class: com.github.netomi.uom.util.ConcurrentReferenceHashMap, method: keyRef, match: "()", note: "ConcurrentReferenceHashMap.keyRef"}
  - {class: com.github.netomi.uom.format.QuantityFormat, method: defaultFormatter, match: "()", note: "QuantityFormat.defaultFormatter"}
  - {class: com.github.netomi.uom.format.QuantityFormatter, method: format, match: "(Quantity<?> quantity) throws FormatException", note: "QuantityFormatter.format"}
  - {class: com.github.netomi.uom.format.QuantityFormatter, method: formatTo, match: "(Quantity<?> quantity, Appendable appendable) throws FormatException", note: "QuantityFormatter.formatTo"}
  - {class: com.github.netomi.uom.format.UnitFormat, method: symbol, match: "()", note: "UnitFormat.symbol"}
  - {class: com.github.netomi.uom.format.UnitFormat, method: name, match: "()", note: "UnitFormat.name"}
  - {class: com.github.netomi.uom.format.UnitFormatter, method: format, match: "(Unit<?> unit) throws FormatException", note: "UnitFormatter.format"}
  - {class: com.github.netomi.uom.format.UnitFormatter, method: formatTo, match: "(Unit<?> unit, Appendable appendable) throws FormatException", note: "UnitFormatter.formatTo"}
  - {class: com.github.netomi.uom.function.AddConverter, method: isLinear, match: "()", note: "AddConverter.isLinear"}
  - {class: com.github.netomi.uom.function.AddConverter, method: inverse, match: "()", note: "AddConverter.inverse"}
  - {class: com.github.netomi.uom.function.MultiplyConverter, method: getMultiplier, match: "()", note: "MultiplyConverter.getMultiplier"}
  - {class: com.github.netomi.uom.function.MultiplyConverter, method: isLinear, match: "()", note: "MultiplyConverter.isLinear"}
  - {class: com.github.netomi.uom.function.PowConverter, method: getUnitConverter, match: "()", note: "PowConverter.getUnitConverter"}
  - {class: com.github.netomi.uom.function.PowConverter, method: getExponent, match: "()", note: "PowConverter.getExponent"}
  - {class: com.github.netomi.uom.function.RootConverter, method: getUnitConverter, match: "()", note: "RootConverter.getUnitConverter"}
  - {class: com.github.netomi.uom.function.RootConverter, method: getN, match: "()", note: "RootConverter.getN"}
  - {class: com.github.netomi.uom.function.UnitConverters, method: identity, match: "()", note: "UnitConverters.identity"}
  - {class: com.github.netomi.uom.function.UnitConverters, method: shift, match: "(double offset)", note: "UnitConverters.shift"}
  - {class: com.github.netomi.uom.math.BigFraction, method: of, match: "(final BigInteger num)", note: "BigFraction.of"}
  - {class: com.github.netomi.uom.math.BigFraction, method: of, match: "(BigInteger num, BigInteger den)", note: "BigFraction.of"}
  - {class: com.github.netomi.uom.math.Fraction, method: from, match: "(double value)", note: "Fraction.from"}
  - {class: com.github.netomi.uom.math.Fraction, method: from, match: "(double value, double epsilon, int maxIterations)", note: "Fraction.from"}
  - {class: com.github.netomi.uom.quantity.Quantities, method: registerQuantityFactory, match: "(Class<Q>           quantityClass,", note: "Quantities.registerQuantityFactory"}
  - {class: com.github.netomi.uom.quantity.Quantities, method: getQuantityType, match: "(Unit<?> unit)", note: "Quantities.getQuantityType"}
  - {class: com.github.netomi.uom.quantity.impl.GenericDecimalQuantity, method: factory, match: "()", note: "GenericDecimalQuantity.factory"}
  - {class: com.github.netomi.uom.quantity.impl.GenericDecimalQuantity, method: with, match: "(BigDecimal value, MathContext mc, Unit unit)", note: "GenericDecimalQuantity.with"}
  - {class: com.github.netomi.uom.quantity.impl.GenericDoubleQuantity, method: factory, match: "()", note: "GenericDoubleQuantity.factory"}
  - {class: com.github.netomi.uom.quantity.impl.GenericDoubleQuantity, method: with, match: "(double value, Unit unit)", note: "GenericDoubleQuantity.with"}
  - {class: com.github.netomi.uom.quantity.impl.ProxyDecimalQuantity, method: factory, match: "(Class<Q> quantityClass)", note: "ProxyDecimalQuantity.factory"}
  - {class: com.github.netomi.uom.quantity.impl.ProxyDecimalQuantity, method: factory, match: "(MathContext mc, Class<Q> quantityClass)", note: "ProxyDecimalQuantity.factory"}
  - {class: com.github.netomi.uom.quantity.impl.ProxyDoubleQuantity, method: factory, match: "(Class<Q> quantityClass)", note: "ProxyDoubleQuantity.factory"}
  - {class: com.github.netomi.uom.quantity.impl.ProxyDoubleQuantity, method: getQuantityClass, match: "()", note: "ProxyDoubleQuantity.getQuantityClass"}
  - {class: com.github.netomi.uom.unit.AlternateSystemUnit, method: getSymbol, match: "()", note: "AlternateSystemUnit.getSymbol"}
  - {class: com.github.netomi.uom.unit.AlternateSystemUnit, method: getName, match: "()", note: "AlternateSystemUnit.getName"}
  - {class: com.github.netomi.uom.unit.BaseUnit, method: getSymbol, match: "()", note: "BaseUnit.getSymbol"}
  - {class: com.github.netomi.uom.unit.BaseUnit, method: getName, match: "()", note: "BaseUnit.getName"}
  - {class: com.github.netomi.uom.unit.Dimensions, method: getPhysicalBaseDimensions, match: "()", note: "Dimensions.getPhysicalBaseDimensions"}
  - {class: com.github.netomi.uom.unit.Dimensions, method: productOf, match: "(Dimension left,  Fraction leftFraction,", note: "Dimensions.productOf"}
  - {class: com.github.netomi.uom.unit.PhysicalDimension, method: getSymbol, match: "()", note: "PhysicalDimension.getSymbol"}
  - {class: com.github.netomi.uom.unit.PhysicalDimension, method: multiply, match: "(Dimension multiplicand)", note: "PhysicalDimension.multiply"}
  - {class: com.github.netomi.uom.unit.PrefixedUnit, method: getSymbol, match: "()", note: "PrefixedUnit.getSymbol"}
  - {class: com.github.netomi.uom.unit.PrefixedUnit, method: getName, match: "()", note: "PrefixedUnit.getName"}
