# Curated performance-mutation sites for recall (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants recall --source data/external-src/<checkout> \
#       --sites data/projects/recall/mutation_sites.yaml

package_root: com.aitusoftware.recall

sites:
  - {class: com.aitusoftware.recall.annotation.model.Type, method: addField, match: "(final Field field)", note: "Type.addField"}
  - {class: com.aitusoftware.recall.map.ByteSequenceMap, method: size, match: "()", note: "ByteSequenceMap.size"}
  - {class: com.aitusoftware.recall.persistence.AsciiCharSequence, method: reset, match: "()", note: "AsciiCharSequence.reset"}
  - {class: com.aitusoftware.recall.sbe.SbeMessageBufferDecoder, method: load, match: "(final UnsafeBuffer buffer, final int offset, final T container)", note: "SbeMessageBufferDecoder.load"}
  - {class: com.aitusoftware.recall.store.BufferStore, method: loadFrom, match: "(", note: "BufferStore.loadFrom"}
  - {class: com.aitusoftware.recall.annotation.model.Type, method: getFieldList, match: "()", note: "Type.getFieldList"}
  - {class: com.aitusoftware.recall.map.ByteSequenceMap, method: rehash, match: "()", note: "ByteSequenceMap.rehash"}
  - {class: com.aitusoftware.recall.persistence.AsciiCharSequence, method: append, match: "(final char value)", note: "AsciiCharSequence.append"}
  - {class: com.aitusoftware.recall.sbe.SbeMessageBufferEncoder, method: store, match: "(final UnsafeBuffer buffer, final int offset, final T value)", note: "SbeMessageBufferEncoder.store"}
  - {class: com.aitusoftware.recall.store.BufferStore, method: load, match: "(", note: "BufferStore.load"}
  - {class: com.aitusoftware.recall.map.ByteSequenceMap, method: onEntryFound, match: "(final ByteBuffer buffer, final int entryIndex)", note: "ByteSequenceMap.onEntryFound"}
  - {class: com.aitusoftware.recall.persistence.AsciiCharSequence, method: length, match: "()", note: "AsciiCharSequence.length"}
  - {class: com.aitusoftware.recall.sbe.SbeMessageStoreFactory, method: forSbeMessage, match: "(", note: "SbeMessageStoreFactory.forSbeMessage"}
  - {class: com.aitusoftware.recall.store.BufferStore, method: store, match: "(", note: "BufferStore.store"}
  - {class: com.aitusoftware.recall.map.CharSequenceMap, method: size, match: "()", note: "CharSequenceMap.size"}
  - {class: com.aitusoftware.recall.persistence.AsciiCharSequence, method: charAt, match: "(final int i)", note: "AsciiCharSequence.charAt"}
  - {class: com.aitusoftware.recall.store.BufferStore, method: compact, match: "()", note: "BufferStore.compact"}
  - {class: com.aitusoftware.recall.map.CharSequenceMap, method: rehash, match: "()", note: "CharSequenceMap.rehash"}
  - {class: com.aitusoftware.recall.persistence.AsciiCharSequence, method: subSequence, match: "(final int i, final int i1)", note: "AsciiCharSequence.subSequence"}
  - {class: com.aitusoftware.recall.store.BufferStore, method: sync, match: "()", note: "BufferStore.sync"}
  - {class: com.aitusoftware.recall.map.CharSequenceMap, method: length, match: "()", note: "CharSequenceMap.length"}
  - {class: com.aitusoftware.recall.store.BufferStore, method: writeTo, match: "(final FileChannel output)", note: "BufferStore.writeTo"}
  - {class: com.aitusoftware.recall.map.CharSequenceMap, method: charAt, match: "(final int i)", note: "CharSequenceMap.charAt"}
  - {class: com.aitusoftware.recall.store.BufferStore, method: utilisation, match: "()", note: "BufferStore.utilisation"}
  - {class: com.aitusoftware.recall.map.CharSequenceMap, method: subSequence, match: "(final int offset, final int length)", note: "CharSequenceMap.subSequence"}
  - {class: com.aitusoftware.recall.store.BufferStore, method: size, match: "()", note: "BufferStore.size"}
  - {class: com.aitusoftware.recall.map.CharSequenceMap, method: onEntryFound, match: "(final ByteBuffer buffer, final int entryIndex)", note: "CharSequenceMap.onEntryFound"}
  - {class: com.aitusoftware.recall.store.BufferStore, method: clear, match: "()", note: "BufferStore.clear"}
  - {class: com.aitusoftware.recall.store.UnsafeBufferOps, method: copyBytes, match: "(", note: "UnsafeBufferOps.copyBytes"}
  - {class: com.aitusoftware.recall.store.SingleTypeStore, method: load, match: "(final long id, final T container)", note: "SingleTypeStore.load"}
  - {class: com.aitusoftware.recall.store.SingleTypeStore, method: store, match: "(final T value)", note: "SingleTypeStore.store"}
  - {class: com.aitusoftware.recall.store.SingleTypeStore, method: compact, match: "()", note: "SingleTypeStore.compact"}
  - {class: com.aitusoftware.recall.store.SingleTypeStore, method: sync, match: "()", note: "SingleTypeStore.sync"}
  - {class: com.aitusoftware.recall.store.SingleTypeStore, method: writeTo, match: "(final FileChannel output)", note: "SingleTypeStore.writeTo"}
  - {class: com.aitusoftware.recall.store.SingleTypeStore, method: utilisation, match: "()", note: "SingleTypeStore.utilisation"}
