  - {class: com.tdunning.math.stats.LogHistogram, method: approxLog2, match: "(double value)", note: "LogHistogram.approxLog2"}
  - {class: com.tdunning.math.stats.LogHistogram, method: pow2, match: "(double x)", note: "LogHistogram.pow2"}
  - {class: com.tdunning.math.stats.LogHistogram, method: bucketIndex, match: "(double x)", note: "LogHistogram.bucketIndex"}
  - {class: com.tdunning.math.stats.MergingDigest, method: recordAllData, match: "()", note: "MergingDigest.recordAllData"}
  - {class: com.tdunning.math.stats.MergingDigest, method: compress, match: "()", note: "MergingDigest.compress"}
  - {class: com.tdunning.math.stats.MergingDigest, method: size, match: "()", note: "MergingDigest.size"}
  - {class: com.tdunning.math.stats.MergingDigest, method: cdf, match: "(double x)", note: "MergingDigest.cdf"}
  - {class: com.tdunning.math.stats.MergingDigest, method: quantile, match: "(double q)", note: "MergingDigest.quantile"}
  - {class: com.tdunning.math.stats.MergingDigest, method: centroidCount, match: "()", note: "MergingDigest.centroidCount"}
  - {class: com.tdunning.math.stats.Simple64, method: compress, match: "(LongBuffer compressedBuffer, long[] unCompressedData, @SuppressWarnings(\"SameParameterValue\") int offset, int size)", note: "Simple64.compress"}
  - {class: com.tdunning.math.stats.Simple64, method: decompress, match: "(LongBuffer compressedBuffer, long[] unCompressedData)", note: "Simple64.decompress"}
  - {class: com.tdunning.math.stats.Sort, method: stableSort, match: "(int[] order, double[] values, int n)", note: "Sort.stableSort"}
