# Curated performance-mutation sites for slice (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants slice --source data/external-src/<checkout> \
#       --sites data/projects/slice/mutation_sites.yaml

package_root: io.airlift.slice

sites:
  - {class: io.airlift.slice.InputStreamSliceInput, method: position, match: "()", note: "InputStreamSliceInput.position"}
  - {class: io.airlift.slice.testing.SliceAssertions, method: assertSlicesEqual, match: "(Slice actual, Slice expected)", note: "SliceAssertions.assertSlicesEqual"}
  - {class: io.airlift.slice.InputStreamSliceInput, method: setPosition, match: "(long position)", note: "InputStreamSliceInput.setPosition"}
  - {class: io.airlift.slice.InputStreamSliceInput, method: isReadable, match: "()", note: "InputStreamSliceInput.isReadable"}
  - {class: io.airlift.slice.InputStreamSliceInput, method: skipBytes, match: "(int n)", note: "InputStreamSliceInput.skipBytes"}
  - {class: io.airlift.slice.OutputStreamSliceOutput, method: close, match: "()", note: "OutputStreamSliceOutput.close"}
  - {class: io.airlift.slice.OutputStreamSliceOutput, method: reset, match: "()", note: "OutputStreamSliceOutput.reset"}
  - {class: io.airlift.slice.OutputStreamSliceOutput, method: reset, match: "(int position)", note: "OutputStreamSliceOutput.reset"}
  - {class: io.airlift.slice.OutputStreamSliceOutput, method: size, match: "()", note: "OutputStreamSliceOutput.size"}
  - {class: io.airlift.slice.BasicSliceInput, method: length, match: "()", note: "BasicSliceInput.length"}
  - {class: io.airlift.slice.BasicSliceInput, method: position, match: "()", note: "BasicSliceInput.position"}
  - {class: io.airlift.slice.BasicSliceInput, method: setPosition, match: "(long position)", note: "BasicSliceInput.setPosition"}
  - {class: io.airlift.slice.BasicSliceInput, method: isReadable, match: "()", note: "BasicSliceInput.isReadable"}
  - {class: io.airlift.slice.BasicSliceOutput, method: reset, match: "()", note: "BasicSliceOutput.reset"}
  - {class: io.airlift.slice.BasicSliceOutput, method: reset, match: "(int position)", note: "BasicSliceOutput.reset"}
  - {class: io.airlift.slice.BasicSliceOutput, method: size, match: "()", note: "BasicSliceOutput.size"}
  - {class: io.airlift.slice.BasicSliceOutput, method: getRetainedSize, match: "()", note: "BasicSliceOutput.getRetainedSize"}
  - {class: io.airlift.slice.ChunkedSliceInput, method: length, match: "()", note: "ChunkedSliceInput.length"}
  - {class: io.airlift.slice.ChunkedSliceInput, method: position, match: "()", note: "ChunkedSliceInput.position"}
  - {class: io.airlift.slice.ChunkedSliceInput, method: setPosition, match: "(long position)", note: "ChunkedSliceInput.setPosition"}
  - {class: io.airlift.slice.ChunkedSliceInput, method: isReadable, match: "()", note: "ChunkedSliceInput.isReadable"}
  - {class: io.airlift.slice.DynamicSliceOutput, method: reset, match: "()", note: "DynamicSliceOutput.reset"}
  - {class: io.airlift.slice.DynamicSliceOutput, method: reset, match: "(int position)", note: "DynamicSliceOutput.reset"}
  - {class: io.airlift.slice.DynamicSliceOutput, method: size, match: "()", note: "DynamicSliceOutput.size"}
  - {class: io.airlift.slice.DynamicSliceOutput, method: getRetainedSize, match: "()", note: "DynamicSliceOutput.getRetainedSize"}
  - {class: io.airlift.slice.FnvHash, method: hash32, match: "(Slice data)", note: "FnvHash.hash32"}
  - {class: io.airlift.slice.FnvHash, method: hash64, match: "(Slice data)", note: "FnvHash.hash64"}
  - {class: io.airlift.slice.InvalidCodePointException, method: getCodePoint, match: "()", note: "InvalidCodePointException.getCodePoint"}
  - {class: io.airlift.slice.Murmur3Hash128, method: hash, match: "(Slice data)", note: "Murmur3Hash128.hash"}
  - {class: io.airlift.slice.Murmur3Hash128, method: hash, match: "(Slice data, int offset, int length)", note: "Murmur3Hash128.hash"}
  - {class: io.airlift.slice.Murmur3Hash128, method: hash, match: "(long seed, Slice data, int offset, int length)", note: "Murmur3Hash128.hash"}
  - {class: io.airlift.slice.Murmur3Hash128, method: hash64, match: "(Slice data)", note: "Murmur3Hash128.hash64"}
  - {class: io.airlift.slice.Murmur3Hash32, method: hash, match: "(Slice data)", note: "Murmur3Hash32.hash"}
  - {class: io.airlift.slice.Murmur3Hash32, method: hash, match: "(Slice data, int offset, int length)", note: "Murmur3Hash32.hash"}
  - {class: io.airlift.slice.Murmur3Hash32, method: hash, match: "(int seed, Slice data, int offset, int length)", note: "Murmur3Hash32.hash"}
  - {class: io.airlift.slice.Murmur3Hash32, method: hash, match: "(int input)", note: "Murmur3Hash32.hash"}
  - {class: io.airlift.slice.Preconditions, method: checkArgument, match: "(boolean expression, String errorMessage)", note: "Preconditions.checkArgument"}
  - {class: io.airlift.slice.Preconditions, method: verify, match: "(boolean condition)", note: "Preconditions.verify"}
  - {class: io.airlift.slice.SizeOf, method: sizeOf, match: "(boolean[] array)", note: "SizeOf.sizeOf"}
  - {class: io.airlift.slice.SizeOf, method: sizeOf, match: "(byte[] array)", note: "SizeOf.sizeOf"}
  - {class: io.airlift.slice.SizeOf, method: sizeOf, match: "(short[] array)", note: "SizeOf.sizeOf"}
  - {class: io.airlift.slice.SizeOf, method: sizeOf, match: "(char[] array)", note: "SizeOf.sizeOf"}
  - {class: io.airlift.slice.Slice, method: length, match: "()", note: "Slice.length"}
  - {class: io.airlift.slice.Slice, method: getRetainedSize, match: "()", note: "Slice.getRetainedSize"}
  - {class: io.airlift.slice.Slice, method: isCompact, match: "()", note: "Slice.isCompact"}
  - {class: io.airlift.slice.Slice, method: byteArray, match: "()", note: "Slice.byteArray"}
  - {class: io.airlift.slice.SliceUtf8, method: isAscii, match: "(Slice utf8)", note: "SliceUtf8.isAscii"}
  - {class: io.airlift.slice.SliceUtf8, method: isAscii, match: "(byte[] utf8, int offset, int length)", note: "SliceUtf8.isAscii"}
  - {class: io.airlift.slice.SliceUtf8, method: countCodePoints, match: "(Slice utf8)", note: "SliceUtf8.countCodePoints"}
  - {class: io.airlift.slice.SliceUtf8, method: countCodePoints, match: "(byte[] utf8, int offset, int length)", note: "SliceUtf8.countCodePoints"}
