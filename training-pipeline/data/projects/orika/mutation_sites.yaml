  - {class: ma.glasnost.orika.converter.builtin.ToStringConverter, method: canConvert, match: "(Type<?> sourceType, Type<?> destinationType)", note: "ToStringConverter.canConvert"}
  - {class: ma.glasnost.orika.impl.DefaultConcreteTypeMap, method: getAll, match: "()", note: "DefaultConcreteTypeMap.getAll"}
  - {class: ma.glasnost.orika.metadata.ClassMap, method: getMapperKey, match: "()", note: "ClassMap.getMapperKey"}
  - {class: ma.glasnost.orika.util.Node, method: getValue, match: "()", note: "Node.getValue"}
