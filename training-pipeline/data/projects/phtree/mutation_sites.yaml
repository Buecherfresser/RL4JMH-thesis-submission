  - {class: ch.ethz.globis.phtree.util.StringBuilderLn, method: append, match: "(String str)", note: "StringBuilderLn.append"}
  - {class: ch.ethz.globis.phtree.util.StringBuilderLn, method: appendLn, match: "(String str)", note: "StringBuilderLn.appendLn"}
