# Curated performance-mutation sites for netty-socketio (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants netty-socketio --source data/external-src/<checkout> \
#       --sites data/projects/netty-socketio/mutation_sites.yaml

package_root: com.corundumstudio.socketio

sites:
