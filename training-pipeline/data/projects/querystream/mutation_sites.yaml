# Curated performance-mutation sites for querystream (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants querystream --source data/external-src/<checkout> \
#       --sites data/projects/querystream/mutation_sites.yaml

package_root: org.dellroad.querystream

sites:
  - {class: org.dellroad.querystream.jpa.DeleteStreamImpl, method: delete, match: "()", note: "DeleteStreamImpl.delete"}
  - {class: org.dellroad.querystream.jpa.DeleteStreamImpl, method: getQueryType, match: "()", note: "DeleteStreamImpl.getQueryType"}
  - {class: org.dellroad.querystream.jpa.DoubleStreamImpl, method: average, match: "()", note: "DoubleStreamImpl.average"}
  - {class: org.dellroad.querystream.jpa.DoubleStreamImpl, method: max, match: "()", note: "DoubleStreamImpl.max"}
  - {class: org.dellroad.querystream.jpa.ExprStreamImpl, method: asSubquery, match: "()", note: "ExprStreamImpl.asSubquery"}
  - {class: org.dellroad.querystream.jpa.ExprStreamImpl, method: exists, match: "()", note: "ExprStreamImpl.exists"}
  - {class: org.dellroad.querystream.jpa.FromStreamImpl, method: flatMap, match: "(CollectionAttribute<? super X, E> attribute)", note: "FromStreamImpl.flatMap"}
  - {class: org.dellroad.querystream.jpa.FromStreamImpl, method: flatMap, match: "(ListAttribute<? super X, E> attribute)", note: "FromStreamImpl.flatMap"}
  - {class: org.dellroad.querystream.jpa.IntStreamImpl, method: asLongStream, match: "()", note: "IntStreamImpl.asLongStream"}
  - {class: org.dellroad.querystream.jpa.IntStreamImpl, method: asDoubleStream, match: "()", note: "IntStreamImpl.asDoubleStream"}
  - {class: org.dellroad.querystream.jpa.LongStreamImpl, method: asDoubleStream, match: "()", note: "LongStreamImpl.asDoubleStream"}
  - {class: org.dellroad.querystream.jpa.LongStreamImpl, method: average, match: "()", note: "LongStreamImpl.average"}
  - {class: org.dellroad.querystream.jpa.PathStreamImpl, method: cast, match: "(Class<Y> type)", note: "PathStreamImpl.cast"}
  - {class: org.dellroad.querystream.jpa.PathStreamImpl, method: distinct, match: "()", note: "PathStreamImpl.distinct"}
  - {class: org.dellroad.querystream.jpa.RootStreamImpl, method: cast, match: "(Class<Y> type)", note: "RootStreamImpl.cast"}
  - {class: org.dellroad.querystream.jpa.RootStreamImpl, method: distinct, match: "()", note: "RootStreamImpl.distinct"}
  - {class: org.dellroad.querystream.jpa.SearchStreamImpl, method: distinct, match: "()", note: "SearchStreamImpl.distinct"}
  - {class: org.dellroad.querystream.jpa.SearchStreamImpl, method: orderBy, match: "(Ref<?, ? extends Expression<?>> ref, boolean asc)", note: "SearchStreamImpl.orderBy"}
  - {class: org.dellroad.querystream.jpa.UpdateStreamImpl, method: getQueryType, match: "()", note: "UpdateStreamImpl.getQueryType"}
  - {class: org.dellroad.querystream.jpa.UpdateStreamImpl, method: bind, match: "(Ref<X, ? super Root<X>> ref)", note: "UpdateStreamImpl.bind"}
  - {class: org.dellroad.querystream.jpa.AbstractRef, method: bind, match: "(S value)", note: "AbstractRef.bind"}
  - {class: org.dellroad.querystream.jpa.AbstractRef, method: unbind, match: "()", note: "AbstractRef.unbind"}
  - {class: org.dellroad.querystream.jpa.BooleanValueImpl, method: not, match: "()", note: "BooleanValueImpl.not"}
  - {class: org.dellroad.querystream.jpa.BooleanValueImpl, method: bind, match: "(Ref<Boolean, ? super Expression<Boolean>> ref)", note: "BooleanValueImpl.bind"}
  - {class: org.dellroad.querystream.jpa.CurrentQuery, method: getBuilder, match: "()", note: "CurrentQuery.getBuilder"}
  - {class: org.dellroad.querystream.jpa.CurrentQuery, method: getQuery, match: "()", note: "CurrentQuery.getQuery"}
  - {class: org.dellroad.querystream.jpa.DoubleValueImpl, method: bind, match: "(Ref<Double, ? super Expression<Double>> ref)", note: "DoubleValueImpl.bind"}
  - {class: org.dellroad.querystream.jpa.DoubleValueImpl, method: peek, match: "(Consumer<? super Expression<Double>> peeker)", note: "DoubleValueImpl.peek"}
  - {class: org.dellroad.querystream.jpa.ExprValueImpl, method: bind, match: "(Ref<X, ? super S> ref)", note: "ExprValueImpl.bind"}
  - {class: org.dellroad.querystream.jpa.ExprValueImpl, method: peek, match: "(Consumer<? super S> peeker)", note: "ExprValueImpl.peek"}
  - {class: org.dellroad.querystream.jpa.FromValueImpl, method: bind, match: "(Ref<X, ? super S> ref)", note: "FromValueImpl.bind"}
  - {class: org.dellroad.querystream.jpa.FromValueImpl, method: peek, match: "(Consumer<? super S> peeker)", note: "FromValueImpl.peek"}
  - {class: org.dellroad.querystream.jpa.IntValueImpl, method: bind, match: "(Ref<Integer, ? super Expression<Integer>> ref)", note: "IntValueImpl.bind"}
