# Curated performance-mutation sites for jprotobuf (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jprotobuf --source data/external-src/<checkout> \
#       --sites data/projects/jprotobuf/mutation_sites.yaml

package_root: com.baidu.bjf

sites:
  - {class: com.baidu.bjf.remoting.protobuf.MapEntry, method: parsePartialFrom, match: "(CodedInputStream input, ExtensionRegistryLite extensionRegistry)", note: "MapEntry.parsePartialFrom"}
  - {class: com.baidu.bjf.remoting.protobuf.MapEntry, method: newDefaultInstance, match: "(Descriptor descriptor, WireFormat.FieldType keyType,", note: "MapEntry.newDefaultInstance"}
  - {class: com.baidu.bjf.remoting.protobuf.MapEntryLite, method: getKey, match: "()", note: "MapEntryLite.getKey"}
  - {class: com.baidu.bjf.remoting.protobuf.MapEntryLite, method: getValue, match: "()", note: "MapEntryLite.getValue"}
  - {class: com.baidu.bjf.remoting.protobuf.MapField, method: convertKeyAndValueToMessage, match: "(K key, V value)", note: "MapField.convertKeyAndValueToMessage"}
  - {class: com.baidu.bjf.remoting.protobuf.MapField, method: convertMessageToKeyAndValue, match: "(Message message, Map<K, V> map)", note: "MapField.convertMessageToKeyAndValue"}
  - {class: com.baidu.bjf.remoting.protobuf.MapFieldLite, method: emptyMapField, match: "()", note: "MapFieldLite.emptyMapField"}
  - {class: com.baidu.bjf.remoting.protobuf.MapFieldLite, method: mergeFrom, match: "(MapFieldLite<K, V> other)", note: "MapFieldLite.mergeFrom"}
  - {class: com.baidu.bjf.remoting.protobuf.code.CodecOutputByteArray, method: threadScopeSize, match: "()", note: "CodecOutputByteArray.threadScopeSize"}
  - {class: com.baidu.bjf.remoting.protobuf.code.CodecOutputByteArray, method: clear, match: "()", note: "CodecOutputByteArray.clear"}
  - {class: com.baidu.bjf.remoting.protobuf.utils.FieldUtils, method: toObjectType, match: "(String primitiveType)", note: "FieldUtils.toObjectType"}
  - {class: com.baidu.bjf.remoting.protobuf.utils.FieldUtils, method: getField, match: "(Object t, String name)", note: "FieldUtils.getField"}
  - {class: com.baidu.bjf.remoting.protobuf.utils.ProtobufProxyUtils, method: isScalarType, match: "(Class<?> cls)", note: "ProtobufProxyUtils.isScalarType"}
  - {class: com.baidu.bjf.remoting.protobuf.utils.ProtobufProxyUtils, method: fetchFieldInfos, match: "(Class cls, boolean ignoreNoAnnotation)", note: "ProtobufProxyUtils.fetchFieldInfos"}
  - {class: com.baidu.bjf.remoting.protobuf.utils.StringBuilderWriter, method: append, match: "(CharSequence csq)", note: "StringBuilderWriter.append"}
  - {class: com.baidu.bjf.remoting.protobuf.utils.StringBuilderWriter, method: append, match: "(CharSequence csq, int start, int end)", note: "StringBuilderWriter.append"}
  - {class: com.baidu.bjf.remoting.protobuf.utils.StringUtils, method: endsWith, match: "(String str, String suffix)", note: "StringUtils.endsWith"}
  - {class: com.baidu.bjf.remoting.protobuf.utils.StringUtils, method: endsWithIgnoreCase, match: "(String str, String suffix)", note: "StringUtils.endsWithIgnoreCase"}
  - {class: com.baidu.bjf.remoting.protobuf.utils.ZipUtils, method: unZip, match: "(File srcFile, String destDirPath) throws RuntimeException", note: "ZipUtils.unZip"}
  - {class: com.baidu.bjf.remoting.protobuf.utils.compiler.ClassUtils, method: newInstance, match: "(String name)", note: "ClassUtils.newInstance"}
  - {class: com.baidu.bjf.remoting.protobuf.utils.compiler.ClassUtils, method: forName, match: "(String[] packages, String className)", note: "ClassUtils.forName"}
  - {class: com.baidu.bjf.remoting.protobuf.Any, method: getCodecClass, match: "()", note: "Any.getCodecClass"}
  - {class: com.baidu.bjf.remoting.protobuf.Any, method: setCodecClass, match: "(String codecClass)", note: "Any.setCodecClass"}
  - {class: com.baidu.bjf.remoting.protobuf.FieldType, method: getDefaultValue, match: "()", note: "FieldType.getDefaultValue"}
  - {class: com.baidu.bjf.remoting.protobuf.FieldType, method: setDefaultValue, match: "(String defaultValue)", note: "FieldType.setDefaultValue"}
  - {class: com.baidu.bjf.remoting.protobuf.IDLProxyObject, method: isCached, match: "()", note: "IDLProxyObject.isCached"}
  - {class: com.baidu.bjf.remoting.protobuf.IDLProxyObject, method: setCached, match: "(boolean cached)", note: "IDLProxyObject.setCached"}
  - {class: com.baidu.bjf.remoting.protobuf.ProtobufField, method: getAnnotation, match: "()", note: "ProtobufField.getAnnotation"}
  - {class: com.baidu.bjf.remoting.protobuf.ProtobufField, method: getName, match: "()", note: "ProtobufField.getName"}
  - {class: com.baidu.bjf.remoting.protobuf.ProtobufIDLGenerator, method: getIDL, match: "(final Class<?> cls, final Set<Class<?>> cachedTypes,", note: "ProtobufIDLGenerator.getIDL"}
  - {class: com.baidu.bjf.remoting.protobuf.ProtobufIDLGenerator, method: getIDL, match: "(final Class<?> cls, final Set<Class<?>> cachedTypes,", note: "ProtobufIDLGenerator.getIDL"}
  - {class: com.baidu.bjf.remoting.protobuf.ProtobufIDLProxy, method: setFormatJavaField, match: "(boolean needFormatJavaField)", note: "ProtobufIDLProxy.setFormatJavaField"}
  - {class: com.baidu.bjf.remoting.protobuf.ProtobufIDLProxy, method: getClassName, match: "()", note: "ProtobufIDLProxy.getClassName"}
  - {class: com.baidu.bjf.remoting.protobuf.ProtobufProxy, method: clearCache, match: "()", note: "ProtobufProxy.clearCache"}
  - {class: com.baidu.bjf.remoting.protobuf.ProtobufProxy, method: compile, match: "(Class<?> cls, File outputPath)", note: "ProtobufProxy.compile"}
  - {class: com.baidu.bjf.remoting.protobuf.Timestamp, method: getSeconds, match: "()", note: "Timestamp.getSeconds"}
  - {class: com.baidu.bjf.remoting.protobuf.Timestamp, method: setSeconds, match: "(Long seconds)", note: "Timestamp.setSeconds"}
  - {class: com.baidu.bjf.remoting.protobuf.code.ClassCode, method: addField, match: "(String scope, String type, String name, String defaultValue)", note: "ClassCode.addField"}
  - {class: com.baidu.bjf.remoting.protobuf.code.ClassCode, method: toCode, match: "()", note: "ClassCode.toCode"}
  - {class: com.baidu.bjf.remoting.protobuf.code.CodeTemplate, method: descriptorMethodSource, match: "(Class cls)", note: "CodeTemplate.descriptorMethodSource"}
  - {class: com.baidu.bjf.remoting.protobuf.code.CodedConstant, method: getFieldName, match: "(int order)", note: "CodedConstant.getFieldName"}
  - {class: com.baidu.bjf.remoting.protobuf.code.CodedConstant, method: computeElementSize, match: "(final WireFormat.FieldType type, final int number, final Object value)", note: "CodedConstant.computeElementSize"}
  - {class: com.baidu.bjf.remoting.protobuf.code.FieldCode, method: getScope, match: "()", note: "FieldCode.getScope"}
  - {class: com.baidu.bjf.remoting.protobuf.code.FieldCode, method: setScope, match: "(String scope)", note: "FieldCode.setScope"}
  - {class: com.baidu.bjf.remoting.protobuf.code.MethodCode, method: toCode, match: "()", note: "MethodCode.toCode"}
  - {class: com.baidu.bjf.remoting.protobuf.code.MethodCode, method: setScope, match: "(String scope)", note: "MethodCode.setScope"}
  - {class: com.baidu.bjf.remoting.protobuf.code.RandomNameCodeGenerator, method: getClassName, match: "()", note: "RandomNameCodeGenerator.getClassName"}
  - {class: com.baidu.bjf.remoting.protobuf.code.TemplateCodeGenerator, method: setTemplator, match: "(MiniTemplator templator)", note: "TemplateCodeGenerator.setTemplator"}
  - {class: com.baidu.bjf.remoting.protobuf.code.TemplateCodeGenerator, method: getTemplator, match: "()", note: "TemplateCodeGenerator.getTemplator"}
  - {class: com.baidu.bjf.remoting.protobuf.command.Main, method: main, match: "(String[] args)", note: "Main.main"}
