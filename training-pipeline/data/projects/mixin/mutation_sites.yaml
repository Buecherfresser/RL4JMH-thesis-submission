# Curated performance-mutation sites for mixin (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants mixin --source data/external-src/<checkout> \
#       --sites data/projects/mixin/mutation_sites.yaml

package_root: org.spongepowered.asm

sites:
  - {class: org.spongepowered.asm.launch.GlobalProperties, method: of, match: "(String name)", note: "GlobalProperties.of"}
  - {class: org.spongepowered.asm.logging.LoggerAdapterConsole, method: setDebugStream, match: "(PrintStream debug)", note: "LoggerAdapterConsole.setDebugStream"}
  - {class: org.spongepowered.asm.mixin.gen.AccessorGeneratorFieldSetter, method: validate, match: "()", note: "AccessorGeneratorFieldSetter.validate"}
  - {class: org.spongepowered.asm.obfuscation.mapping.common.MappingField, method: getName, match: "()", note: "MappingField.getName"}
  - {class: org.spongepowered.asm.service.MixinService, method: boot, match: "()", note: "MixinService.boot"}
  - {class: org.spongepowered.asm.transformers.MixinClassWriter, method: getCommonSuperClass, match: "(final String type1, final String type2)", note: "MixinClassWriter.getCommonSuperClass"}
  - {class: org.spongepowered.asm.util.ConstraintParser, method: getToken, match: "()", note: "ConstraintParser.getToken"}
  - {class: org.spongepowered.asm.launch.GlobalProperties, method: getString, match: "(Keys key, String defaultValue)", note: "GlobalProperties.getString"}
  - {class: org.spongepowered.asm.logging.LoggerAdapterConsole, method: catching, match: "(Level level, Throwable t)", note: "LoggerAdapterConsole.catching"}
