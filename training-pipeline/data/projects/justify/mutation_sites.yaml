  - {class: org.leadpony.justify.internal.schema.DefaultJsonSchemaBuilder, method: build, match: "()", note: "DefaultJsonSchemaBuilder.build"}
  - {class: org.leadpony.justify.internal.schema.DefaultJsonSchemaBuilder, method: withId, match: "(URI id)", note: "DefaultJsonSchemaBuilder.withId"}
  - {class: org.leadpony.justify.internal.schema.DefaultJsonSchemaBuilderFactory, method: createBuilder, match: "()", note: "DefaultJsonSchemaBuilderFactory.createBuilder"}
