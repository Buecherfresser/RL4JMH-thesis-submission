# Curated performance-mutation sites for parquet-carpet (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants parquet-carpet --source data/external-src/<checkout> \
#       --sites data/projects/parquet-carpet/mutation_sites.yaml

package_root: com.jerolba.carpet

sites:
  - {class: com.jerolba.carpet.CarpetParquetReader, method: builder, match: "(Class<T> readClass)", note: "CarpetParquetReader.builder"}
  - {class: com.jerolba.carpet.impl.ParameterizedMap, method: getMapType, match: "()", note: "ParameterizedMap.getMapType"}
  - {class: com.jerolba.carpet.io.CountedPositionOutputStream, method: getPos, match: "() throws IOException", note: "CountedPositionOutputStream.getPos"}
  - {class: com.jerolba.carpet.model.EnumTypeBuilder, method: notNull, match: "()", note: "EnumTypeBuilder.notNull"}
  - {class: com.jerolba.carpet.CarpetParquetReader, method: builder, match: "(InputFile file, Class<T> readClass)", note: "CarpetParquetReader.builder"}
  - {class: com.jerolba.carpet.impl.ParameterizedMap, method: getGenericKey, match: "()", note: "ParameterizedMap.getGenericKey"}
  - {class: com.jerolba.carpet.io.CountedPositionOutputStream, method: close, match: "() throws IOException", note: "CountedPositionOutputStream.close"}
  - {class: com.jerolba.carpet.model.EnumTypeBuilder, method: fieldId, match: "(Integer fieldId)", note: "EnumTypeBuilder.fieldId"}
  - {class: com.jerolba.carpet.CarpetParquetWriter, method: builder, match: "(Class<T> recordClass)", note: "CarpetParquetWriter.builder"}
  - {class: com.jerolba.carpet.impl.read.CarpetGroupAsMapConverter, method: getConverter, match: "(int fieldIndex)", note: "CarpetGroupAsMapConverter.getConverter"}
  - {class: com.jerolba.carpet.io.OutputStreamOutputFile, method: create, match: "(long blockSizeHint) throws IOException", note: "OutputStreamOutputFile.create"}
  - {class: com.jerolba.carpet.model.GeometryTypeBuilder, method: notNull, match: "()", note: "GeometryTypeBuilder.notNull"}
  - {class: com.jerolba.carpet.CarpetParquetWriter, method: builder, match: "(OutputFile file, Class<T> recordClass)", note: "CarpetParquetWriter.builder"}
  - {class: com.jerolba.carpet.impl.read.CarpetGroupAsMapConverter, method: start, match: "()", note: "CarpetGroupAsMapConverter.start"}
  - {class: com.jerolba.carpet.io.OutputStreamOutputFile, method: createOrOverwrite, match: "(long blockSizeHint) throws IOException", note: "OutputStreamOutputFile.createOrOverwrite"}
  - {class: com.jerolba.carpet.model.GeometryTypeBuilder, method: fieldId, match: "(Integer fieldId)", note: "GeometryTypeBuilder.fieldId"}
  - {class: com.jerolba.carpet.CarpetReader, method: withFailOnMissingColumn, match: "(boolean value)", note: "CarpetReader.withFailOnMissingColumn"}
  - {class: com.jerolba.carpet.impl.read.ColumnToFieldMapper, method: NameMap, match: "(RecordComponent recordComponent, Type parquetType)", note: "ColumnToFieldMapper.NameMap"}
  - {class: com.jerolba.carpet.io.s3.LocalFileInputStream, method: close, match: "() throws IOException", note: "LocalFileInputStream.close"}
  - {class: com.jerolba.carpet.model.ListType, method: ListType, match: "(boolean isNotNull, Integer fieldId, FieldType type) implements FieldType, CollectionType", note: "ListType.ListType"}
  - {class: com.jerolba.carpet.CarpetReader, method: withFailOnNullForPrimitives, match: "(boolean value)", note: "CarpetReader.withFailOnNullForPrimitives"}
  - {class: com.jerolba.carpet.impl.read.ColumnToFieldMapper, method: mapFields, match: "(GroupType schema, RecordComponent[] recordComponent)", note: "ColumnToFieldMapper.mapFields"}
  - {class: com.jerolba.carpet.io.s3.LocalFileInputStream, method: mark, match: "(int readlimit)", note: "LocalFileInputStream.mark"}
  - {class: com.jerolba.carpet.model.ListType, method: notNull, match: "()", note: "ListType.notNull"}
  - {class: com.jerolba.carpet.CarpetRecordGenerator, method: generateCode, match: "(String filePath) throws IOException", note: "CarpetRecordGenerator.generateCode"}
  - {class: com.jerolba.carpet.impl.read.GroupFieldsMapper, method: getIndex, match: "(String name)", note: "GroupFieldsMapper.getIndex"}
  - {class: com.jerolba.carpet.io.FileSystemInputFile, method: newStream, match: "() throws IOException", note: "FileSystemInputFile.newStream"}
  - {class: com.jerolba.carpet.model.ListTypeBuilder, method: notNull, match: "()", note: "ListTypeBuilder.notNull"}
  - {class: com.jerolba.carpet.CarpetRecordGenerator, method: generateCode, match: "(File file) throws IOException", note: "CarpetRecordGenerator.generateCode"}
  - {class: com.jerolba.carpet.impl.read.GroupFieldsMapper, method: getRecordComponent, match: "(String name)", note: "GroupFieldsMapper.getRecordComponent"}
  - {class: com.jerolba.carpet.io.FileSystemInputFile, method: close, match: "() throws IOException", note: "FileSystemInputFile.close"}
  - {class: com.jerolba.carpet.model.ListTypeBuilder, method: fieldId, match: "(Integer fieldId)", note: "ListTypeBuilder.fieldId"}
  - {class: com.jerolba.carpet.CarpetWriter, method: accept, match: "(T value)", note: "CarpetWriter.accept"}
  - {class: com.jerolba.carpet.impl.read.MapHolder, method: create, match: "()", note: "MapHolder.create"}
  - {class: com.jerolba.carpet.io.FileSystemOutputFile, method: create, match: "(long blockSizeHint) throws IOException", note: "FileSystemOutputFile.create"}
  - {class: com.jerolba.carpet.model.MapType, method: MapType, match: "(boolean isNotNull, Integer fieldId, FieldType keyType, FieldType valueType) implements FieldType", note: "MapType.MapType"}
  - {class: com.jerolba.carpet.CarpetWriter, method: close, match: "() throws IOException", note: "CarpetWriter.close"}
  - {class: com.jerolba.carpet.impl.read.MapHolder, method: getMap, match: "()", note: "MapHolder.getMap"}
  - {class: com.jerolba.carpet.io.FileSystemOutputFile, method: createOrOverwrite, match: "(long blockSizeHint) throws IOException", note: "FileSystemOutputFile.createOrOverwrite"}
  - {class: com.jerolba.carpet.model.MapType, method: notNull, match: "()", note: "MapType.notNull"}
  - {class: com.jerolba.carpet.impl.read.converter.StringConverter, method: addBinary, match: "(Binary value)", note: "StringConverter.addBinary"}
  - {class: com.jerolba.carpet.io.s3.CachedFooterProxyReader, method: readFully, match: "(long pos, byte[] b, int off, int len) throws IOException", note: "CachedFooterProxyReader.readFully"}
  - {class: com.jerolba.carpet.model.MapTypeBuilder, method: notNull, match: "()", note: "MapTypeBuilder.notNull"}
  - {class: com.jerolba.carpet.impl.read.converter.StringConverter, method: hasDictionarySupport, match: "()", note: "StringConverter.hasDictionarySupport"}
  - {class: com.jerolba.carpet.io.s3.CachedFooterProxyReader, method: readFully, match: "(long pos, ByteBuffer byteBuffer) throws IOException", note: "CachedFooterProxyReader.readFully"}
  - {class: com.jerolba.carpet.model.MapTypeBuilder, method: fieldId, match: "(Integer fieldId)", note: "MapTypeBuilder.fieldId"}
  - {class: com.jerolba.carpet.impl.read.converter.UuidToStringConverter, method: addBinary, match: "(Binary value)", note: "UuidToStringConverter.addBinary"}
  - {class: com.jerolba.carpet.io.s3.LocalInputFile, method: newStream, match: "() throws IOException", note: "LocalInputFile.newStream"}
  - {class: com.jerolba.carpet.model.SetType, method: SetType, match: "(boolean isNotNull, Integer fieldId, FieldType type) implements FieldType, CollectionType", note: "SetType.SetType"}
  - {class: com.jerolba.carpet.impl.read.converter.UuidToStringConverter, method: hasDictionarySupport, match: "()", note: "UuidToStringConverter.hasDictionarySupport"}
