  - {class: com.justinblank.strings.CharacterDistribution, method: average, match: "(List<CharacterDistribution> distributions)", note: "CharacterDistribution.average"}
  - {class: com.justinblank.strings.CharacterDistribution, method: weight, match: "(boolean[] bytes)", note: "CharacterDistribution.weight"}
  - {class: com.justinblank.strings.CompilationPolicy, method: create, match: "(Factorization factorization)", note: "CompilationPolicy.create"}
  - {class: com.justinblank.strings.CompilationPolicy, method: requiresByteClasses, match: "()", note: "CompilationPolicy.requiresByteClasses"}
  - {class: com.justinblank.strings.CompilerOptions, method: fromFlags, match: "(int flags)", note: "CompilerOptions.fromFlags"}
  - {class: com.justinblank.strings.CompilerOptions, method: defaultOptions, match: "()", note: "CompilerOptions.defaultOptions"}
  - {class: com.justinblank.strings.DFA, method: createDFA, match: "(String regex)", note: "DFA.createDFA"}
  - {class: com.justinblank.strings.DFA, method: addTransition, match: "(CharRange charRange, DFA dfa)", note: "DFA.addTransition"}
  - {class: com.justinblank.strings.DFACompiler, method: compile, match: "(String regex, String className)", note: "DFACompiler.compile"}
