# Curated performance-mutation sites for neureka (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants neureka --source data/external-src/<checkout> \
#       --sites data/projects/neureka/mutation_sites.yaml

package_root: neureka.backend.main

sites:
  - {class: neureka.backend.main.algorithms.Util, method: transpose, match: "(Tensor<T> t )", note: "Util.transpose"}
  - {class: neureka.backend.main.implementations.elementwise.CPUElementwiseFunction, method: run, match: "(ExecutionCall<CPU> call )", note: "CPUElementwiseFunction.run"}
  - {class: neureka.backend.main.memory.MemUtil, method: autoDelete, match: "( Tensor<?>... tensors )", note: "MemUtil.autoDelete"}
  - {class: neureka.backend.main.operations.ConvUtil, method: createDeconvolutionFor, match: "(String op )", note: "ConvUtil.createDeconvolutionFor"}
  - {class: neureka.backend.main.implementations.fun.FunUtil, method: invSqrt, match: "(double x)", note: "FunUtil.invSqrt"}
  - {class: neureka.backend.main.memory.MemUtil, method: keep, match: "(Tensor<?>[] tensors, Supplier<T> during )", note: "MemUtil.keep"}
  - {class: neureka.backend.main.operations.ConvUtil, method: shapeOfCon, match: "(int[] shape1, int[] shape2 )", note: "ConvUtil.shapeOfCon"}
  - {class: neureka.backend.main.implementations.fun.FunUtil, method: invSqrt, match: "( float x )", note: "FunUtil.invSqrt"}
  - {class: neureka.backend.main.memory.MemValidator, method: forInputs, match: "(Tensor<?>[] inputs, Supplier<Result> resultProvider )", note: "MemValidator.forInputs"}
  - {class: neureka.backend.main.operations.ElemWiseUtil, method: newTensorLike, match: "( Tensor<V> template, double value )", note: "ElemWiseUtil.newTensorLike"}
  - {class: neureka.backend.main.implementations.scalar.CLScalarFunction, method: run, match: "(ExecutionCall<OpenCLDevice> call)", note: "CLScalarFunction.run"}
  - {class: neureka.backend.main.memory.MemValidator, method: isWronglyIntermediate, match: "()", note: "MemValidator.isWronglyIntermediate"}
  - {class: neureka.backend.main.operations.ElemWiseUtil, method: newTensorLike, match: "(", note: "ElemWiseUtil.newTensorLike"}
  - {class: neureka.backend.main.implementations.scalar.CPUScalarBroadcastFunction, method: run, match: "(ExecutionCall<CPU> call)", note: "CPUScalarBroadcastFunction.run"}
  - {class: neureka.backend.main.operations.functions.Logarithm, method: asDerivative, match: "( Function[] children, int derivationIndex)", note: "Logarithm.asDerivative"}
