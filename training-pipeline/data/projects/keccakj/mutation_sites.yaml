# Curated performance-mutation sites for keccakj (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants keccakj --source data/external-src/<checkout> \
#       --sites data/projects/keccakj/mutation_sites.yaml

package_root: com.github.aelstad

sites:
  - {class: com.github.aelstad.keccakj.core.KeccakStateUtils, method: isIn, match: "()", note: "KeccakStateUtils.isIn"}
  - {class: com.github.aelstad.keccakj.core.KeccakStateUtils, method: isOut, match: "()", note: "KeccakStateUtils.isOut"}
  - {class: com.github.aelstad.keccakj.core.KeccakStateUtils, method: longOp, match: "(StateOp stateOp, long[] state, int pos, long val, int bitoff, int bitlen)", note: "KeccakStateUtils.longOp"}
  - {class: com.github.aelstad.keccakj.core.KeccakStateUtils, method: longOp, match: "(StateOp stateOp, long[] state, int pos, long val)", note: "KeccakStateUtils.longOp"}
  - {class: com.github.aelstad.keccakj.cipher.CipherAdapter, method: init, match: "(int opmode, Key key, AlgorithmParameterSpec params) throws InvalidKeyException,", note: "CipherAdapter.init"}
  - {class: com.github.aelstad.keccakj.cipher.CipherAdapter, method: updateAAD, match: "(byte[] src)", note: "CipherAdapter.updateAAD"}
  - {class: com.github.aelstad.keccakj.cipher.CipherAdapter, method: updateAAD, match: "(byte[] src, int offset, int len)", note: "CipherAdapter.updateAAD"}
  - {class: com.github.aelstad.keccakj.cipher.CipherAdapter, method: updateAAD, match: "(ByteBuffer src)", note: "CipherAdapter.updateAAD"}
  - {class: com.github.aelstad.keccakj.core.DuplexRandom, method: forget, match: "()", note: "DuplexRandom.forget"}
  - {class: com.github.aelstad.keccakj.core.DuplexRandom, method: getBuf, match: "()", note: "DuplexRandom.getBuf"}
  - {class: com.github.aelstad.keccakj.core.DuplexRandom, method: seed, match: "(byte[] seed, int off, int len)", note: "DuplexRandom.seed"}
  - {class: com.github.aelstad.keccakj.core.DuplexRandom, method: seed, match: "()", note: "DuplexRandom.seed"}
  - {class: com.github.aelstad.keccakj.core.Keccak1600, method: validateBytes, match: "(int stateByteOff, byte[] buf, int bufByteOff, int lenBytes)", note: "Keccak1600.validateBytes"}
  - {class: com.github.aelstad.keccakj.core.Keccak1600, method: wrapBytes, match: "(int stateByteOff, byte[] outBuf, int outBufOff, byte[] inBuf, int inBufOff, int lenBytes)", note: "Keccak1600.wrapBytes"}
  - {class: com.github.aelstad.keccakj.core.Keccak1600, method: unwrapBytes, match: "(int stateByteOff, byte[] outBuf, int outBufOff, byte[] inBuf, int inBufOff, int lenBytes)", note: "Keccak1600.unwrapBytes"}
  - {class: com.github.aelstad.keccakj.core.Keccak1600, method: getBytes, match: "(int stateByteOff, byte[] buf, int bufByteOff, int lenBytes)", note: "Keccak1600.getBytes"}
  - {class: com.github.aelstad.keccakj.core.KeccakSponge, method: close, match: "()", note: "KeccakSponge.close"}
  - {class: com.github.aelstad.keccakj.core.KeccakSponge, method: transformBits, match: "(byte[] input, long inputOff, byte[] output, long outputOff, long bitLen)", note: "KeccakSponge.transformBits"}
  - {class: com.github.aelstad.keccakj.core.KeccakSponge, method: close, match: "()", note: "KeccakSponge.close"}
  - {class: com.github.aelstad.keccakj.core.KeccakSponge, method: open, match: "()", note: "KeccakSponge.open"}
  - {class: com.github.aelstad.keccakj.kangaroo.KangarooTwelve, method: engineUpdate, match: "(byte input)", note: "KangarooTwelve.engineUpdate"}
  - {class: com.github.aelstad.keccakj.kangaroo.KangarooTwelve, method: engineUpdate, match: "(byte[] input, int offset, int len)", note: "KangarooTwelve.engineUpdate"}
  - {class: com.github.aelstad.keccakj.kangaroo.KangarooTwelve, method: engineDigest, match: "()", note: "KangarooTwelve.engineDigest"}
  - {class: com.github.aelstad.keccakj.kangaroo.KangarooTwelve, method: engineReset, match: "()", note: "KangarooTwelve.engineReset"}
  - {class: com.github.aelstad.keccakj.keyak.LakeKeyak, method: init, match: "(byte[] key, byte[] nounce) throws InvalidKeyException", note: "LakeKeyak.init"}
  - {class: com.github.aelstad.keccakj.keyak.LakeKeyak, method: header, match: "(byte[] buf, int off, int len)", note: "LakeKeyak.header"}
