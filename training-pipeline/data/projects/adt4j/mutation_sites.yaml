# Curated performance-mutation sites for adt4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants adt4j --source data/external-src/<checkout> \
#       --sites data/projects/adt4j/mutation_sites.yaml

package_root: com.github.sviperll

sites:
  - {class: com.github.sviperll.adt4j.Caching, method: enabled, match: "()", note: "Caching.enabled"}
  - {class: com.github.sviperll.adt4j.Caching, method: synchronizes, match: "()", note: "Caching.synchronizes"}
  - {class: com.github.sviperll.adt4j.GenerateValueClassForVisitorProcessor, method: resultVariableName, match: "()", note: "GenerateValueClassForVisitorProcessor.resultVariableName"}
  - {class: com.github.sviperll.adt4j.GenerateValueClassForVisitorProcessor, method: exceptionVariableName, match: "()", note: "GenerateValueClassForVisitorProcessor.exceptionVariableName"}
  - {class: com.github.sviperll.adt4j.GenerateValueClassForVisitorProcessor, method: selfReferenceVariableName, match: "()", note: "GenerateValueClassForVisitorProcessor.selfReferenceVariableName"}
  - {class: com.github.sviperll.adt4j.GenerateValueClassForVisitorProcessor, method: annotationType, match: "()", note: "GenerateValueClassForVisitorProcessor.annotationType"}
  - {class: com.github.sviperll.adt4j.model.Stage0ValueClassModel, method: createStage1Model, match: "(JDefinedClass jVisitorModel, Visitor visitorAnnotation)", note: "Stage0ValueClassModel.createStage1Model"}
  - {class: com.github.sviperll.adt4j.model.Stage0ValueClassModelFactory, method: createFactory, match: "(JDefinedClassFactory factory)", note: "Stage0ValueClassModelFactory.createFactory"}
  - {class: com.github.sviperll.adt4j.model.Stage0ValueClassModelFactory, method: createStage0Model, match: "(JDefinedClass bootModel, Visitor visitorAnnotation)", note: "Stage0ValueClassModelFactory.createStage0Model"}
  - {class: com.github.sviperll.adt4j.model.Stage1ValueClassModel, method: createResult, match: "()", note: "Stage1ValueClassModel.createResult"}
  - {class: com.github.sviperll.adt4j.model.config.APICustomization, method: acceptMethodName, match: "()", note: "APICustomization.acceptMethodName"}
  - {class: com.github.sviperll.adt4j.model.config.APICustomization, method: isPublic, match: "()", note: "APICustomization.isPublic"}
  - {class: com.github.sviperll.adt4j.model.config.APICustomization, method: isSerializable, match: "()", note: "APICustomization.isSerializable"}
  - {class: com.github.sviperll.adt4j.model.config.AcceptMethodCustomization, method: acceptMethodName, match: "()", note: "AcceptMethodCustomization.acceptMethodName"}
  - {class: com.github.sviperll.adt4j.model.config.FieldConfiguration, method: type, match: "()", note: "FieldConfiguration.type"}
  - {class: com.github.sviperll.adt4j.model.config.FieldConfiguration, method: name, match: "()", note: "FieldConfiguration.name"}
  - {class: com.github.sviperll.adt4j.model.config.FieldConfiguration, method: accessLevel, match: "()", note: "FieldConfiguration.accessLevel"}
  - {class: com.github.sviperll.adt4j.model.config.FieldConfiguration, method: isNullable, match: "()", note: "FieldConfiguration.isNullable"}
  - {class: com.github.sviperll.adt4j.model.config.FloatCustomization, method: floatEpsilon, match: "()", note: "FloatCustomization.floatEpsilon"}
  - {class: com.github.sviperll.adt4j.model.config.FloatCustomization, method: doubleEpsilon, match: "()", note: "FloatCustomization.doubleEpsilon"}
  - {class: com.github.sviperll.adt4j.model.config.PredicateConfigutation, method: accessLevel, match: "()", note: "PredicateConfigutation.accessLevel"}
  - {class: com.github.sviperll.adt4j.model.config.PredicateConfigutation, method: isTrueFor, match: "(JMethod interfaceMethod)", note: "PredicateConfigutation.isTrueFor"}
  - {class: com.github.sviperll.adt4j.model.config.Serialization, method: notSerializable, match: "()", note: "Serialization.notSerializable"}
  - {class: com.github.sviperll.adt4j.model.config.Serialization, method: serializable, match: "(long valueClassSerialVersionUID)", note: "Serialization.serializable"}
  - {class: com.github.sviperll.adt4j.model.config.Serialization, method: isSerializable, match: "()", note: "Serialization.isSerializable"}
  - {class: com.github.sviperll.adt4j.model.config.Serialization, method: serialVersionUIDForGeneratedCode, match: "()", note: "Serialization.serialVersionUIDForGeneratedCode"}
  - {class: com.github.sviperll.adt4j.model.config.ValueClassConfiguration, method: createInstance, match: "(VisitorDefinition visitorDefinition, JAnnotationUse annotation)", note: "ValueClassConfiguration.createInstance"}
  - {class: com.github.sviperll.adt4j.model.config.ValueClassConfiguration, method: createInstance, match: "(VisitorDefinition visitorDefinition, JAnnotationUse annotation, JDefinedClass valueClass)", note: "ValueClassConfiguration.createInstance"}
  - {class: com.github.sviperll.adt4j.model.config.ValueClassConfiguration, method: visitorDefinition, match: "()", note: "ValueClassConfiguration.visitorDefinition"}
  - {class: com.github.sviperll.adt4j.model.config.ValueClassConfiguration, method: getValueTypeParameters, match: "()", note: "ValueClassConfiguration.getValueTypeParameters"}
  - {class: com.github.sviperll.adt4j.model.config.VariableDeclaration, method: valueOf, match: "(JVar var)", note: "VariableDeclaration.valueOf"}
  - {class: com.github.sviperll.adt4j.model.config.VariableDeclaration, method: type, match: "()", note: "VariableDeclaration.type"}
  - {class: com.github.sviperll.adt4j.model.config.VariableDeclaration, method: name, match: "()", note: "VariableDeclaration.name"}
  - {class: com.github.sviperll.adt4j.model.config.VariableDeclaration, method: mods, match: "()", note: "VariableDeclaration.mods"}
  - {class: com.github.sviperll.adt4j.model.config.VisitorDefinition, method: createInstance, match: "(JDefinedClass jVisitorModel, Visitor annotation)", note: "VisitorDefinition.createInstance"}
  - {class: com.github.sviperll.adt4j.model.config.VisitorDefinition, method: narrowed, match: "(AbstractJClass selfType, AbstractJClass resultType, @Nullable AbstractJClass exceptionType)", note: "VisitorDefinition.narrowed"}
  - {class: com.github.sviperll.adt4j.model.config.VisitorDefinition, method: getResultTypeParameter, match: "()", note: "VisitorDefinition.getResultTypeParameter"}
  - {class: com.github.sviperll.adt4j.model.config.VisitorDefinition, method: getExceptionTypeParameter, match: "()", note: "VisitorDefinition.getExceptionTypeParameter"}
  - {class: com.github.sviperll.adt4j.model.util.FilerCodeWriter, method: openBinary, match: "(JPackage pkg, String fileName) throws IOException", note: "FilerCodeWriter.openBinary"}
  - {class: com.github.sviperll.adt4j.model.util.FilerCodeWriter, method: close, match: "() throws IOException", note: "FilerCodeWriter.close"}
  - {class: com.github.sviperll.adt4j.model.util.GenerationProcess, method: reportError, match: "(String error)", note: "GenerationProcess.reportError"}
  - {class: com.github.sviperll.adt4j.model.util.GenerationProcess, method: processGenerationResult, match: "(GenerationResult<T> result)", note: "GenerationProcess.processGenerationResult"}
  - {class: com.github.sviperll.adt4j.model.util.GenerationProcess, method: createGenerationResult, match: "(@Nullable T result)", note: "GenerationProcess.createGenerationResult"}
  - {class: com.github.sviperll.adt4j.model.util.GenerationProcess, method: reportedErrors, match: "()", note: "GenerationProcess.reportedErrors"}
  - {class: com.github.sviperll.adt4j.model.util.Source, method: toJMod, match: "(MemberAccess accessLevel)", note: "Source.toJMod"}
  - {class: com.github.sviperll.adt4j.model.util.Source, method: capitalize, match: "(String s)", note: "Source.capitalize"}
  - {class: com.github.sviperll.adt4j.model.util.Source, method: decapitalize, match: "(String s)", note: "Source.decapitalize"}
  - {class: com.github.sviperll.adt4j.model.util.Source, method: substitute, match: "(AbstractJType type, JTypeVar typeVariable, AbstractJType variableValue)", note: "Source.substitute"}
  - {class: com.github.sviperll.adt4j.model.util.Throwables, method: render, match: "(Throwable exception)", note: "Throwables.render"}
  - {class: com.github.sviperll.adt4j.model.util.Types, method: createInstance, match: "(JCodeModel codeModel)", note: "Types.createInstance"}
