  - {class: com.google.common.graph.MapIteratorCache, method: iterator, match: "()", note: "MapIteratorCache.iterator"}
  - {class: com.google.common.hash.Crc32cHashFunction, method: newHasher, match: "()", note: "Crc32cHashFunction.newHasher"}
  - {class: com.google.common.io.CharStreams, method: readLines, match: "(", note: "CharStreams.readLines"}
