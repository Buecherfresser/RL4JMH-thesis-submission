# Curated performance-mutation sites for coralring (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants coralring --source data/external-src/<checkout> \
#       --sites data/projects/coralring/mutation_sites.yaml

package_root: com.coralblocks.coralring

sites:
  - {class: com.coralblocks.coralring.example.memory.SharedMemoryConsumer, method: main, match: "(String[] args)", note: "SharedMemoryConsumer.main"}
  - {class: com.coralblocks.coralring.memory.ByteBufferMemory, method: getByteBuffer, match: "()", note: "ByteBufferMemory.getByteBuffer"}
  - {class: com.coralblocks.coralring.ring.NonWaitingRingConsumer, method: getLastFetchedSequence, match: "()", note: "NonWaitingRingConsumer.getLastFetchedSequence"}
  - {class: com.coralblocks.coralring.util.MathUtils, method: isPowerOfTwo, match: "(int i)", note: "MathUtils.isPowerOfTwo"}
  - {class: com.coralblocks.coralring.example.memory.SharedMemoryExample, method: main, match: "(String[] args)", note: "SharedMemoryExample.main"}
  - {class: com.coralblocks.coralring.memory.ByteBufferMemory, method: getSize, match: "()", note: "ByteBufferMemory.getSize"}
  - {class: com.coralblocks.coralring.ring.NonWaitingRingConsumer, method: setLastFetchedSequence, match: "(long lastFetchedSeq)", note: "NonWaitingRingConsumer.setLastFetchedSequence"}
  - {class: com.coralblocks.coralring.util.MathUtils, method: isPowerOfTwo, match: "(long l)", note: "MathUtils.isPowerOfTwo"}
  - {class: com.coralblocks.coralring.example.memory.SharedMemoryProducer, method: main, match: "(String[] args)", note: "SharedMemoryProducer.main"}
  - {class: com.coralblocks.coralring.memory.ByteBufferMemory, method: getPointer, match: "()", note: "ByteBufferMemory.getPointer"}
  - {class: com.coralblocks.coralring.ring.NonWaitingRingConsumer, method: getLastOfferedSequence, match: "()", note: "NonWaitingRingConsumer.getLastOfferedSequence"}
