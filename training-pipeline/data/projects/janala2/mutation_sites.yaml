# Curated performance-mutation sites for janala2 (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants janala2 --source data/external-src/<checkout> \
#       --sites data/projects/janala2/mutation_sites.yaml

package_root: janala.logger.inst

sites:
