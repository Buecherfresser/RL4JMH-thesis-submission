  - {class: com.backblaze.erasure.Matrix, method: getColumns, match: "()", note: "Matrix.getColumns"}
  - {class: com.backblaze.erasure.Matrix, method: getRows, match: "()", note: "Matrix.getRows"}
  - {class: com.backblaze.erasure.Matrix, method: times, match: "(Matrix right)", note: "Matrix.times"}
  - {class: com.backblaze.erasure.Matrix, method: augment, match: "(Matrix right)", note: "Matrix.augment"}
