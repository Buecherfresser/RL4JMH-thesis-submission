base_model: google/gemma-4-E2B-it
output_dir: outputs/grpo-run9-smoke8
dataset_path: data/snippets/rl-mutation-all.good.jsonl
corpus: full
seed: 42
finetune_mode: lora
precision: bf16
gradient_checkpointing: true
attn_implementation: sdpa
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  exclude_modules:
  - vision_tower
  - audio_tower
  - multi_modal_projector
  bias: none
learning_rate: 8.0e-05
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_min_lr: 2.0e-05
per_device_batch_size: 1
gradient_accumulation_steps: 4
group_size: 8
rollout_temperature: 1.0
top_p: 0.95
top_k: 64
max_prompt_length: 20480
max_completion_length: 16384
completion_eos_token_id: 106
chat_template_kwargs:
  enable_thinking: true
max_source_chars: 48000
limit_prompts: 40
kl_coeff: 0.0
epsilon: 0.2
epsilon_high: 0.28
grpo_loss_type: dr_grpo
scale_rewards: false
mask_truncated_completions: false
mu: 1
num_epochs: 1.0
num_iterations: 3
warmup_ratio: 0.03
logging_steps: 1
save_steps: 0
resume_from_checkpoint: null
report_to: none
holdout_prompts: 8
holdout_seed: 12345
holdout_eval_every: 3
holdout_eval_on_start: true
per_device_eval_batch_size: 4
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.4
vllm_tensor_parallel_size: 1
vllm_max_model_length: 65536
vllm_importance_sampling_correction: false
vllm_enable_sleep_mode: true
reward_weights:
  compile: 0.1
  runtime: 0.1
  anti_pattern: 0.05
  rsd: 0.05
  mutation: 0.7
anti_pattern_backend: spotjmh
need_run: true
reward_workers: 4
capture_completions_every: 0
gpu_sample_seconds: 10.0
repair_completions: false
exclude_projects:
- jackson-dataformats-binary
- spatial4j
rsd_good: 0.05
rsd_bad: 0.25
mutation:
  alpha: 0.05
  min_slowdown: 1.1
  arm_property: jmhbench.mutant
  coverage_guidance: true
  max_mutants_per_candidate: 0
  max_benchmarks_per_mutant: 6
  mode: coverage_aware
  coverage_weight: 0.3
  coverage_jmh:
    warmup_iterations: 0
    measurement_iterations: 1
    forks: 1
    warmup_time: 100ms
    measurement_time: 100ms
    timeout_s: 120.0
    per_iteration_timeout_s: 60.0
    fail_on_error: false
runner:
  jmh_version: '1.37'
  java_release: 17
  jmh:
    warmup_iterations: 3
    measurement_iterations: 5
    forks: 1
    warmup_time: 200ms
    measurement_time: 200ms
    timeout_s: 120.0
    per_iteration_timeout_s: 60.0
    fail_on_error: false
