# Curated performance-mutation sites for choco-solver (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants choco-solver --source data/external-src/<checkout> \
#       --sites data/projects/choco-solver/mutation_sites.yaml

package_root: org.chocosolver.solver

sites:
  - {class: org.chocosolver.solver.Settings, method: checkModel, match: "(Solver solver)", note: "Settings.checkModel"}
  - {class: org.chocosolver.solver.constraints.extension.binary.CouplesBitSetTable, method: isConsistent, match: "(int x, int y)", note: "CouplesBitSetTable.isConsistent"}
  - {class: org.chocosolver.solver.exception.ContradictionException, method: fillInStackTrace, match: "()", note: "ContradictionException.fillInStackTrace"}
  - {class: org.chocosolver.solver.expression.continuous.arithmetic.BiCArExpression, method: getModel, match: "()", note: "BiCArExpression.getModel"}
  - {class: org.chocosolver.solver.objective.ObjectiveFactory, method: SAT, match: "()", note: "ObjectiveFactory.SAT"}
  - {class: org.chocosolver.solver.propagation.PropagationEngine, method: accept, match: "(Propagator propagator)", note: "PropagationEngine.accept"}
  - {class: org.chocosolver.solver.search.loop.lns.neighbors.SetRandomNeighbor, method: recordSolution, match: "()", note: "SetRandomNeighbor.recordSolution"}
  - {class: org.chocosolver.solver.trace.CPProfiler, method: connect, match: "(String label, int executionId, int port)", note: "CPProfiler.connect"}
  - {class: org.chocosolver.solver.variables.delta.SetDelta, method: getSize, match: "(int kerOrEnv)", note: "SetDelta.getSize"}
  - {class: org.chocosolver.solver.Settings, method: getEnvironmentSupplier, match: "()", note: "Settings.getEnvironmentSupplier"}
  - {class: org.chocosolver.solver.constraints.extension.binary.CouplesBitSetTable, method: checkCouple, match: "(int x, int y)", note: "CouplesBitSetTable.checkCouple"}
  - {class: org.chocosolver.solver.exception.InvalidSolutionException, method: getModel, match: "()", note: "InvalidSolutionException.getModel"}
  - {class: org.chocosolver.solver.expression.continuous.arithmetic.BiCArExpression, method: realVar, match: "(double p)", note: "BiCArExpression.realVar"}
  - {class: org.chocosolver.solver.objective.ObjectiveFactory, method: makeObjectiveManager, match: "(IntVar objective, ResolutionPolicy policy)", note: "ObjectiveFactory.makeObjectiveManager"}
  - {class: org.chocosolver.solver.propagation.PropagationEngine, method: initialize, match: "() throws SolverException", note: "PropagationEngine.initialize"}
  - {class: org.chocosolver.solver.search.loop.lns.neighbors.SetRandomNeighbor, method: fixSomeVariables, match: "() throws ContradictionException", note: "SetRandomNeighbor.fixSomeVariables"}
  - {class: org.chocosolver.solver.trace.CPProfiler, method: disconnect, match: "()", note: "CPProfiler.disconnect"}
  - {class: org.chocosolver.solver.variables.delta.SetDelta, method: lazyClear, match: "()", note: "SetDelta.lazyClear"}
  - {class: org.chocosolver.solver.SettingsBuilder, method: init, match: "()", note: "SettingsBuilder.init"}
  - {class: org.chocosolver.solver.constraints.extension.nary.TuplesList, method: getTuple, match: "(int support)", note: "TuplesList.getTuple"}
  - {class: org.chocosolver.solver.expression.continuous.arithmetic.RealIntervalConstant, method: getLB, match: "()", note: "RealIntervalConstant.getLB"}
  - {class: org.chocosolver.solver.objective.ObjectiveStrategy, method: init, match: "()", note: "ObjectiveStrategy.init"}
  - {class: org.chocosolver.solver.propagation.PropagationEngineObserver, method: execute, match: "(Propagator<?> propagator, boolean activatedByReification) throws ContradictionException", note: "PropagationEngineObserver.execute"}
  - {class: org.chocosolver.solver.search.loop.monitors.SearchMonitorList, method: beforeInitialize, match: "()", note: "SearchMonitorList.beforeInitialize"}
  - {class: org.chocosolver.solver.trace.GephiGenerator, method: disconnect, match: "()", note: "GephiGenerator.disconnect"}
  - {class: org.chocosolver.solver.variables.delta.monitor.SetDeltaMonitor, method: startMonitoring, match: "()", note: "SetDeltaMonitor.startMonitoring"}
  - {class: org.chocosolver.solver.SettingsBuilder, method: prod, match: "()", note: "SettingsBuilder.prod"}
  - {class: org.chocosolver.solver.constraints.extension.nary.TuplesList, method: getTupleTable, match: "()", note: "TuplesList.getTupleTable"}
  - {class: org.chocosolver.solver.expression.continuous.arithmetic.RealIntervalConstant, method: getUB, match: "()", note: "RealIntervalConstant.getUB"}
  - {class: org.chocosolver.solver.objective.ObjectiveStrategy, method: getDecision, match: "()", note: "ObjectiveStrategy.getDecision"}
  - {class: org.chocosolver.solver.propagation.PropagationEngineObserver, method: propagateEvents, match: "() throws ContradictionException", note: "PropagationEngineObserver.propagateEvents"}
  - {class: org.chocosolver.solver.search.loop.monitors.SearchMonitorList, method: afterInitialize, match: "(boolean correct)", note: "SearchMonitorList.afterInitialize"}
  - {class: org.chocosolver.solver.trace.GephiGenerator, method: sendNode, match: "(int nc, int pid, int alt, int kid, int rid, String label, String info)", note: "GephiGenerator.sendNode"}
  - {class: org.chocosolver.solver.variables.delta.monitor.SetDeltaMonitor, method: forEach, match: "(IntProcedure proc, SetEventType evt) throws ContradictionException", note: "SetDeltaMonitor.forEach"}
  - {class: org.chocosolver.solver.Cause, method: forEachIntVar, match: "(Consumer<IntVar> action)", note: "Cause.forEachIntVar"}
  - {class: org.chocosolver.solver.constraints.graph.basic.PropLoopSet, method: propagate, match: "(int evtmask) throws ContradictionException", note: "PropLoopSet.propagate"}
  - {class: org.chocosolver.solver.expression.continuous.arithmetic.UnCArExpression, method: getModel, match: "()", note: "UnCArExpression.getModel"}
  - {class: org.chocosolver.solver.objective.ParetoMaximizer, method: getParetoFront, match: "()", note: "ParetoMaximizer.getParetoFront"}
  - {class: org.chocosolver.solver.propagation.PropagationProfiler, method: onCoarseEvent, match: "(Propagator<?> propagator)", note: "PropagationProfiler.onCoarseEvent"}
  - {class: org.chocosolver.solver.search.strategy.decision.SetDecision, method: getDecisionValue, match: "()", note: "SetDecision.getDecisionValue"}
  - {class: org.chocosolver.solver.trace.GraphvizGenerator, method: disconnect, match: "()", note: "GraphvizGenerator.disconnect"}
  - {class: org.chocosolver.solver.variables.events.SetEventType, method: getMask, match: "()", note: "SetEventType.getMask"}
  - {class: org.chocosolver.solver.Cause, method: forEachIntVar, match: "(Consumer<IntVar> action)", note: "Cause.forEachIntVar"}
  - {class: org.chocosolver.solver.constraints.graph.basic.PropLoopSet, method: isEntailed, match: "()", note: "PropLoopSet.isEntailed"}
  - {class: org.chocosolver.solver.expression.continuous.arithmetic.UnCArExpression, method: realVar, match: "(double p)", note: "UnCArExpression.realVar"}
  - {class: org.chocosolver.solver.objective.ParetoMaximizer, method: onSolution, match: "()", note: "ParetoMaximizer.onSolution"}
  - {class: org.chocosolver.solver.propagation.PropagationProfiler, method: onFineEvent, match: "(Propagator<?> propagator)", note: "PropagationProfiler.onFineEvent"}
  - {class: org.chocosolver.solver.search.strategy.decision.SetDecision, method: apply, match: "() throws ContradictionException", note: "SetDecision.apply"}
  - {class: org.chocosolver.solver.trace.GraphvizGenerator, method: sendNode, match: "(int nc, int pid, int alt, int kid, int rid, String label, String info)", note: "GraphvizGenerator.sendNode"}
  - {class: org.chocosolver.solver.variables.events.SetEventType, method: all, match: "()", note: "SetEventType.all"}
