  - {class: com.baidu.unbiz.easymapper.mapping.impl.Object2ObjectMappingHandler, method: generateMappingCode, match: "(FieldMap fieldMap, VariableRef source, VariableRef destination,", note: "Object2ObjectMappingHandler.generateMappingCode"}
  - {class: com.baidu.unbiz.easymapper.mapping.impl.SpecifyTransformerMappingHandler, method: canApply, match: "(FieldMap fieldMap)", note: "SpecifyTransformerMappingHandler.canApply"}
