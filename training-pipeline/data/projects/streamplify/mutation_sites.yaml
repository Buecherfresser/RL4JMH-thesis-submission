  - {class: org.beryx.streamplify.BigIntegerIndexedSpliterator, method: shuffle, match: "(Random rnd)", note: "BigIntegerIndexedSpliterator.shuffle"}
  - {class: org.beryx.streamplify.LongIndexedSpliterator, method: withAdditionalCharacteristics, match: "(int additionalCharacteristics)", note: "LongIndexedSpliterator.withAdditionalCharacteristics"}
  - {class: org.beryx.streamplify.LongIndexedSpliterator, method: withShuffler, match: "(LongShuffler shuffler)", note: "LongIndexedSpliterator.withShuffler"}
  - {class: org.beryx.streamplify.LongIndexedSpliterator, method: withValueSupplier, match: "(Splittable.LongIndexed<T> valueSupplier)", note: "LongIndexedSpliterator.withValueSupplier"}
  - {class: org.beryx.streamplify.LongIndexedSpliterator, method: getIndex, match: "()", note: "LongIndexedSpliterator.getIndex"}
  - {class: org.beryx.streamplify.LongIndexedSpliterator, method: getFence, match: "()", note: "LongIndexedSpliterator.getFence"}
  - {class: org.beryx.streamplify.LongIndexedSpliterator, method: stream, match: "()", note: "LongIndexedSpliterator.stream"}
  - {class: org.beryx.streamplify.LongIndexedSpliterator, method: parallelStream, match: "()", note: "LongIndexedSpliterator.parallelStream"}
  - {class: org.beryx.streamplify.LongIndexedSpliterator, method: bigCount, match: "()", note: "LongIndexedSpliterator.bigCount"}
  - {class: org.beryx.streamplify.LongIndexedSpliterator, method: estimateSize, match: "()", note: "LongIndexedSpliterator.estimateSize"}
  - {class: org.beryx.streamplify.LongIndexedSpliterator, method: characteristics, match: "()", note: "LongIndexedSpliterator.characteristics"}
  - {class: org.beryx.streamplify.LongIndexedSpliterator, method: tryAdvance, match: "(Consumer<? super T> action)", note: "LongIndexedSpliterator.tryAdvance"}
  - {class: org.beryx.streamplify.LongIndexedSpliterator, method: trySplit, match: "()", note: "LongIndexedSpliterator.trySplit"}
  - {class: org.beryx.streamplify.LongIndexedSpliterator, method: forEachRemaining, match: "(Consumer<? super T> action)", note: "LongIndexedSpliterator.forEachRemaining"}
