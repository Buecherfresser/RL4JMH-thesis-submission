  - {class: com.zaxxer.hikari.util.FastList, method: size, match: "()", note: "FastList.size"}
  - {class: com.zaxxer.hikari.HikariDataSource, method: getConnection, match: "() throws SQLException", note: "HikariDataSource.getConnection"}
