  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: permitReentry, match: "(T trigger)", note: "StateConfiguration.permitReentry"}
  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: permitReentry, match: "(T trigger, Action action)", note: "StateConfiguration.permitReentry"}
  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: permitReentryIf, match: "(T trigger, FuncBoolean guard)", note: "StateConfiguration.permitReentryIf"}
  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: permitReentryIf, match: "(T trigger, FuncBoolean guard, Action action)", note: "StateConfiguration.permitReentryIf"}
