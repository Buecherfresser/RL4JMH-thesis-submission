  - {class: br.com.leonardoz.features.threads.UsingThreads, method: main, match: "(String[] args) throws InterruptedException", note: "UsingThreads.main"}
  - {class: br.com.leonardoz.patterns.task_cancel.BackgroundTimePrintTask, method: cancel, match: "()", note: "BackgroundTimePrintTask.cancel"}
  - {class: br.com.leonardoz.patterns.task_cancel.ThreadTaskCancel, method: run, match: "()", note: "ThreadTaskCancel.run"}
  - {class: br.com.leonardoz.patterns.task_cancel.ThreadTaskCancel, method: cancel, match: "()", note: "ThreadTaskCancel.cancel"}
