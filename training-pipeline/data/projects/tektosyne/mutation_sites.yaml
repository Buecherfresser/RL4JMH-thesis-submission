# Curated performance-mutation sites for tektosyne (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants tektosyne --source data/external-src/<checkout> \
#       --sites data/projects/tektosyne/mutation_sites.yaml

package_root: org.kynosarges.tektosyne

sites:
  - {class: org.kynosarges.tektosyne.MathUtils, method: getAny, match: "(T[] array)", note: "MathUtils.getAny"}
  - {class: org.kynosarges.tektosyne.geometry.GeoUtils, method: connectPoints, match: "(boolean isClosed, PointD... points)", note: "GeoUtils.connectPoints"}
  - {class: org.kynosarges.tektosyne.graph.AStar, method: findBestPath, match: "(GraphAgent<T> agent, T source, T target)", note: "AStar.findBestPath"}
  - {class: org.kynosarges.tektosyne.subdivision.PolygonGridMap, method: source, match: "()", note: "PolygonGridMap.source"}
  - {class: org.kynosarges.tektosyne.MathUtils, method: getAny, match: "(Collection<T> collection)", note: "MathUtils.getAny"}
  - {class: org.kynosarges.tektosyne.geometry.GeoUtils, method: convexHull, match: "(PointD... points)", note: "GeoUtils.convexHull"}
  - {class: org.kynosarges.tektosyne.graph.AStar, method: absoluteLimit, match: "()", note: "AStar.absoluteLimit"}
  - {class: org.kynosarges.tektosyne.subdivision.PolygonGridMap, method: target, match: "()", note: "PolygonGridMap.target"}
  - {class: org.kynosarges.tektosyne.NodeList, method: first, match: "()", note: "NodeList.first"}
  - {class: org.kynosarges.tektosyne.geometry.PointDComparatorX, method: compareEpsilon, match: "(PointD a, PointD b)", note: "PointDComparatorX.compareEpsilon"}
  - {class: org.kynosarges.tektosyne.graph.Coverage, method: findReachable, match: "(GraphAgent<T> agent, T source, double maxCost)", note: "Coverage.findReachable"}
  - {class: org.kynosarges.tektosyne.subdivision.VoronoiMap, method: target, match: "()", note: "VoronoiMap.target"}
  - {class: org.kynosarges.tektosyne.NodeList, method: last, match: "()", note: "NodeList.last"}
  - {class: org.kynosarges.tektosyne.geometry.PointDComparatorX, method: compareEpsilon, match: "(PointD a, PointD b, double epsilon)", note: "PointDComparatorX.compareEpsilon"}
  - {class: org.kynosarges.tektosyne.graph.Coverage, method: agent, match: "()", note: "Coverage.agent"}
  - {class: org.kynosarges.tektosyne.subdivision.VoronoiMap, method: source, match: "()", note: "VoronoiMap.source"}
  - {class: org.kynosarges.tektosyne.Fortran, method: aint, match: "(double n)", note: "Fortran.aint"}
  - {class: org.kynosarges.tektosyne.geometry.PointDComparatorY, method: compareEpsilon, match: "(PointD a, PointD b)", note: "PointDComparatorY.compareEpsilon"}
  - {class: org.kynosarges.tektosyne.graph.FloodFill, method: findMatching, match: "(Predicate<T> match, T source)", note: "FloodFill.findMatching"}
  - {class: org.kynosarges.tektosyne.subdivision.AddEdgeResult, method: isEdgeAdded, match: "()", note: "AddEdgeResult.isEdgeAdded"}
  - {class: org.kynosarges.tektosyne.Fortran, method: aint, match: "(float n)", note: "Fortran.aint"}
  - {class: org.kynosarges.tektosyne.geometry.PointDComparatorY, method: compareEpsilon, match: "(PointD a, PointD b, double epsilon)", note: "PointDComparatorY.compareEpsilon"}
  - {class: org.kynosarges.tektosyne.graph.FloodFill, method: nodes, match: "()", note: "FloodFill.nodes"}
