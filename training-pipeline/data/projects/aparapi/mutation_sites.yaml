# Curated performance-mutation sites for aparapi (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants aparapi --source data/external-src/<checkout> \
#       --sites data/projects/aparapi/mutation_sites.yaml

package_root: com.aparapi.internal

sites:
  - {class: com.aparapi.internal.exception.ClassParseException, method: getDescription, match: "()", note: "ClassParseException.getDescription"}
  - {class: com.aparapi.internal.instruction.BranchSet, method: setParent, match: "(LogicalExpressionNode _parent)", note: "BranchSet.setParent"}
  - {class: com.aparapi.internal.kernel.KernelArg, method: getObjArrayBuffer, match: "()", note: "KernelArg.getObjArrayBuffer"}
  - {class: com.aparapi.internal.model.CacheEnabler, method: setCachesEnabled, match: "(boolean cachesEnabled)", note: "CacheEnabler.setCachesEnabled"}
  - {class: com.aparapi.internal.opencl.OpenCLKernel, method: createKernel, match: "(OpenCLProgram _program, String _kernelName, List<OpenCLArgDescriptor> _args)", note: "OpenCLKernel.createKernel"}
  - {class: com.aparapi.internal.reader.ByteReader, method: u1, match: "()", note: "ByteReader.u1"}
  - {class: com.aparapi.internal.tool.InstructionHelper, method: format, match: "(Object... args)", note: "InstructionHelper.format"}
  - {class: com.aparapi.internal.util.OpenCLUtil, method: getOpenCLPlatforms, match: "()", note: "OpenCLUtil.getOpenCLPlatforms"}
  - {class: com.aparapi.internal.exception.ClassParseException, method: getInstruction, match: "()", note: "ClassParseException.getInstruction"}
  - {class: com.aparapi.internal.instruction.BranchSet, method: getRoot, match: "()", note: "BranchSet.getRoot"}
  - {class: com.aparapi.internal.kernel.KernelArg, method: setObjArrayBuffer, match: "(byte[] objArrayBuffer)", note: "KernelArg.setObjArrayBuffer"}
  - {class: com.aparapi.internal.model.CacheEnabler, method: areCachesEnabled, match: "()", note: "CacheEnabler.areCachesEnabled"}
  - {class: com.aparapi.internal.opencl.OpenCLKernel, method: getName, match: "()", note: "OpenCLKernel.getName"}
  - {class: com.aparapi.internal.reader.ByteReader, method: u2, match: "()", note: "ByteReader.u2"}
  - {class: com.aparapi.internal.tool.InstructionHelper, method: size, match: "()", note: "InstructionHelper.size"}
  - {class: com.aparapi.internal.util.Reflection, method: getSimpleName, match: "(Class<?> klass)", note: "Reflection.getSimpleName"}
  - {class: com.aparapi.internal.instruction.ExpressionList, method: doesNotContainContinueOrBreak, match: "(Instruction _start, Instruction _extent)", note: "ExpressionList.doesNotContainContinueOrBreak"}
  - {class: com.aparapi.internal.kernel.KernelDeviceProfile, method: onEvent, match: "(ProfilingEvent event)", note: "KernelDeviceProfile.onEvent"}
  - {class: com.aparapi.internal.model.ClassModel, method: compute, match: "(String fieldName) throws ClassParseException", note: "ClassModel.compute"}
  - {class: com.aparapi.internal.opencl.OpenCLLoader, method: getInstance, match: "()", note: "OpenCLLoader.getInstance"}
  - {class: com.aparapi.internal.tool.InstructionViewer, method: getPanel, match: "()", note: "InstructionViewer.getPanel"}
  - {class: com.aparapi.internal.util.UnsafeWrapper, method: atomicAdd, match: "(int[] _arr, int _index, int _delta)", note: "UnsafeWrapper.atomicAdd"}
  - {class: com.aparapi.internal.instruction.ExpressionList, method: doesNotContainCompositeOrBranch, match: "(Instruction _start, Instruction _exclusiveEnd)", note: "ExpressionList.doesNotContainCompositeOrBranch"}
  - {class: com.aparapi.internal.kernel.KernelDeviceProfile, method: getElapsedTimeCurrentThread, match: "(int stage)", note: "KernelDeviceProfile.getElapsedTimeCurrentThread"}
