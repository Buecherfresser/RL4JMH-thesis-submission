  - {class: com.google.common.math.BigIntegerMath, method: ceilingPowerOfTwo, match: "(BigInteger x)", note: "BigIntegerMath.ceilingPowerOfTwo"}
  - {class: com.google.common.net.HostAndPort, method: hasPort, match: "()", note: "HostAndPort.hasPort"}
