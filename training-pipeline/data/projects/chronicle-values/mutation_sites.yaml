  - {class: net.openhft.chronicle.values.ValueFieldModel, method: generateSet, match: "(ValueBuilder valueBuilder, MethodSpec.Builder methodBuilder)", note: "ValueFieldModel.generateSet"}
  - {class: net.openhft.chronicle.values.ValueFieldModel, method: generateArrayElementSet, match: "(", note: "ValueFieldModel.generateArrayElementSet"}
  - {class: net.openhft.chronicle.values.ValueFieldModel, method: generateSetVolatile, match: "(", note: "ValueFieldModel.generateSetVolatile"}
