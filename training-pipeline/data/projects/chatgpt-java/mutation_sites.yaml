# Curated performance-mutation sites for chatgpt-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants chatgpt-java --source data/external-src/<checkout> \
#       --sites data/projects/chatgpt-java/mutation_sites.yaml

package_root: com.unfbx.chatgpt

sites:
  - {class: com.unfbx.chatgpt.OpenAiStreamClient, method: streamCompletions, match: "(Completion completion, EventSourceListener eventSourceListener)", note: "OpenAiStreamClient.streamCompletions"}
  - {class: com.unfbx.chatgpt.entity.chat.ChatCompletion, method: tokens, match: "()", note: "ChatCompletion.tokens"}
  - {class: com.unfbx.chatgpt.exception.CommonError, method: msg, match: "()", note: "CommonError.msg"}
  - {class: com.unfbx.chatgpt.function.KeyRandomStrategy, method: apply, match: "(List<String> apiKeys)", note: "KeyRandomStrategy.apply"}
  - {class: com.unfbx.chatgpt.interceptor.DefaultOpenAiAuthInterceptor, method: intercept, match: "(Chain chain) throws IOException", note: "DefaultOpenAiAuthInterceptor.intercept"}
  - {class: com.unfbx.chatgpt.sse.ConsoleEventSourceListener, method: onOpen, match: "(EventSource eventSource, Response response)", note: "ConsoleEventSourceListener.onOpen"}
  - {class: com.unfbx.chatgpt.utils.SSEUtil, method: post, match: "(OkHttpClient okHttpClient, String url, Headers headers, T body, EventSourceListener eventSourceListener)", note: "SSEUtil.post"}
  - {class: com.unfbx.chatgpt.OpenAiStreamClient, method: streamCompletions, match: "(String question, EventSourceListener eventSourceListener)", note: "OpenAiStreamClient.streamCompletions"}
  - {class: com.unfbx.chatgpt.entity.chat.Message, method: builder, match: "()", note: "Message.builder"}
