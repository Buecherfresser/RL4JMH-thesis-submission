# Curated performance-mutation sites for json-io (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants json-io --source data/external-src/<checkout> \
#       --sites data/projects/json-io/mutation_sites.yaml

package_root: com.cedarsoftware.io

sites:
  - {class: com.cedarsoftware.io.CharStreamGenerator, method: getWriteOptions, match: "()", note: "CharStreamGenerator.getWriteOptions"}
  - {class: com.cedarsoftware.io.factory.ArrayFactory, method: newInstance, match: "(Class<?> c, JsonObject jObj, Resolver resolver)", note: "ArrayFactory.newInstance"}
  - {class: com.cedarsoftware.io.reflect.Accessor, method: createFieldAccessor, match: "(Field field, String uniqueFieldName)", note: "Accessor.createFieldAccessor"}
  - {class: com.cedarsoftware.io.spring.http.codec.Json5Decoder, method: createDefaultReadOptions, match: "()", note: "Json5Decoder.createDefaultReadOptions"}
  - {class: com.cedarsoftware.io.util.SealableList, method: size, match: "()", note: "SealableList.size"}
  - {class: com.cedarsoftware.io.writers.AtomicIntegerArrayWriter, method: writePrimitiveForm, match: "(Object o, JsonGenerator gen, WriterContext context) throws IOException", note: "AtomicIntegerArrayWriter.writePrimitiveForm"}
  - {class: com.cedarsoftware.io.CharStreamGenerator, method: writeStartObject, match: "() throws IOException", note: "CharStreamGenerator.writeStartObject"}
  - {class: com.cedarsoftware.io.factory.ArrayFactory, method: isObjectFinal, match: "()", note: "ArrayFactory.isObjectFinal"}
  - {class: com.cedarsoftware.io.reflect.Accessor, method: createMethodAccessor, match: "(Field field, String methodName, String uniqueFieldName)", note: "Accessor.createMethodAccessor"}
  - {class: com.cedarsoftware.io.spring.http.codec.ToonDecoder, method: decodeBytes, match: "(byte[] bytes, Class<?> clazz)", note: "ToonDecoder.decodeBytes"}
  - {class: com.cedarsoftware.io.util.SealableList, method: isEmpty, match: "()", note: "SealableList.isEmpty"}
  - {class: com.cedarsoftware.io.writers.AtomicIntegerArrayWriter, method: writePrimitiveForm, match: "(Object o, Writer output, WriterContext context) throws IOException", note: "AtomicIntegerArrayWriter.writePrimitiveForm"}
  - {class: com.cedarsoftware.io.CharStreamTokenizer, method: nextToken, match: "() throws JsonParseException", note: "CharStreamTokenizer.nextToken"}
  - {class: com.cedarsoftware.io.factory.AtomicIntegerArrayFactory, method: newInstance, match: "(Class<?> c, JsonObject jObj, Resolver resolver)", note: "AtomicIntegerArrayFactory.newInstance"}
  - {class: com.cedarsoftware.io.reflect.AnnotationResolver, method: resolveAnnotationAlias, match: "(String alias)", note: "AnnotationResolver.resolveAnnotationAlias"}
