# Curated performance-mutation sites for shoki (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants shoki --source data/external-src/<checkout> \
#       --sites data/projects/shoki/mutation_sites.yaml

package_root: com.jnape.palatable

sites:
  - {class: com.jnape.palatable.shoki.impl.Arrays, method: insertAt, match: "(int index, Object[] array, Object value)", note: "Arrays.insertAt"}
  - {class: com.jnape.palatable.shoki.impl.Arrays, method: deleteAt, match: "(int index, Object[] array)", note: "Arrays.deleteAt"}
  - {class: com.jnape.palatable.shoki.impl.Arrays, method: overrideAt, match: "(int index, Object[] array, Object value)", note: "Arrays.overrideAt"}
  - {class: com.jnape.palatable.shoki.impl.HashMap, method: keys, match: "()", note: "HashMap.keys"}
  - {class: com.jnape.palatable.shoki.impl.HashMap, method: values, match: "()", note: "HashMap.values"}
  - {class: com.jnape.palatable.shoki.impl.HashMap, method: head, match: "()", note: "HashMap.head"}
  - {class: com.jnape.palatable.shoki.impl.HashMap, method: tail, match: "()", note: "HashMap.tail"}
  - {class: com.jnape.palatable.shoki.impl.HashMap, method: isEmpty, match: "()", note: "HashMap.isEmpty"}
  - {class: com.jnape.palatable.shoki.impl.HashMap, method: merge, match: "(Map<Natural, K, V> other, Semigroup<V> semigroup)", note: "HashMap.merge"}
  - {class: com.jnape.palatable.shoki.impl.HashMap, method: removeAll, match: "(Set<Natural, K> keys)", note: "HashMap.removeAll"}
  - {class: com.jnape.palatable.shoki.impl.HashMap, method: sizeInfo, match: "()", note: "HashMap.sizeInfo"}
  - {class: com.jnape.palatable.shoki.impl.HashMap, method: iterator, match: "()", note: "HashMap.iterator"}
  - {class: com.jnape.palatable.shoki.impl.HashMap, method: hashMap, match: "(EquivalenceRelation<? super K> keyEquivalenceRelation,", note: "HashMap.hashMap"}
  - {class: com.jnape.palatable.shoki.impl.HashMap, method: hashMap, match: "(Tuple2<K, V>... entries)", note: "HashMap.hashMap"}
  - {class: com.jnape.palatable.shoki.impl.HashMultiSet, method: sum, match: "(MultiSet<A> other)", note: "HashMultiSet.sum"}
  - {class: com.jnape.palatable.shoki.impl.HashMultiSet, method: unique, match: "()", note: "HashMultiSet.unique"}
  - {class: com.jnape.palatable.shoki.impl.HashMultiSet, method: inc, match: "(A a, NonZero k)", note: "HashMultiSet.inc"}
  - {class: com.jnape.palatable.shoki.impl.HashMultiSet, method: dec, match: "(A a, NonZero k)", note: "HashMultiSet.dec"}
  - {class: com.jnape.palatable.shoki.impl.HashMultiSet, method: isEmpty, match: "()", note: "HashMultiSet.isEmpty"}
  - {class: com.jnape.palatable.shoki.impl.HashMultiSet, method: inc, match: "(A a)", note: "HashMultiSet.inc"}
  - {class: com.jnape.palatable.shoki.impl.HashMultiSet, method: dec, match: "(A a)", note: "HashMultiSet.dec"}
  - {class: com.jnape.palatable.shoki.impl.HashMultiSet, method: sizeInfo, match: "()", note: "HashMultiSet.sizeInfo"}
  - {class: com.jnape.palatable.shoki.impl.HashMultiSet, method: tail, match: "()", note: "HashMultiSet.tail"}
  - {class: com.jnape.palatable.shoki.impl.HashMultiSet, method: head, match: "()", note: "HashMultiSet.head"}
  - {class: com.jnape.palatable.shoki.impl.HashMultiSet, method: intersection, match: "(MultiSet<A> other)", note: "HashMultiSet.intersection"}
