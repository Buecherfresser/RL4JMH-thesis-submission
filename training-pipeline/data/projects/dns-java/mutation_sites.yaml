# Curated performance-mutation sites for dns-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants dns-java --source data/external-src/<checkout> \
#       --sites data/projects/dns-java/mutation_sites.yaml

package_root: com.spotify.dns

sites:
  - {class: com.spotify.dns.AggregatingChangeNotifier, method: current, match: "()", note: "AggregatingChangeNotifier.current"}
  - {class: com.spotify.dns.AggregatingChangeNotifier, method: closeImplementation, match: "()", note: "AggregatingChangeNotifier.closeImplementation"}
  - {class: com.spotify.dns.CachingLookupFactory, method: forName, match: "(final String fqdn)", note: "CachingLookupFactory.forName"}
  - {class: com.spotify.dns.CachingLookupFactory, method: sessionForName, match: "(String fqdn)", note: "CachingLookupFactory.sessionForName"}
  - {class: com.spotify.dns.ChangeNotifiers, method: isInitialEmptyData, match: "(Set<T> set)", note: "ChangeNotifiers.isInitialEmptyData"}
  - {class: com.spotify.dns.ChangeNotifiers, method: aggregate, match: "(ChangeNotifier<T>... notifiers)", note: "ChangeNotifiers.aggregate"}
  - {class: com.spotify.dns.ChangeNotifiers, method: aggregate, match: "(Iterable<ChangeNotifier<T>> notifiers)", note: "ChangeNotifiers.aggregate"}
