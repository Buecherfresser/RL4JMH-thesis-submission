# Curated performance-mutation sites for jslt (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jslt --source data/external-src/<checkout> \
#       --sites data/projects/jslt/mutation_sites.yaml

package_root: com.schibsted.spt

sites:
  - {class: com.schibsted.spt.data.jslt.Parser, method: compile, match: "(File jslt)", note: "Parser.compile"}
  - {class: com.schibsted.spt.data.jslt.Parser, method: compile, match: "(File jslt, Collection<Function> functions)", note: "Parser.compile"}
  - {class: com.schibsted.spt.data.jslt.impl.ArrayExpression, method: apply, match: "(Scope scope, JsonNode input)", note: "ArrayExpression.apply"}
  - {class: com.schibsted.spt.data.jslt.impl.ArrayExpression, method: computeMatchContexts, match: "(DotExpression parent)", note: "ArrayExpression.computeMatchContexts"}
  - {class: com.schibsted.spt.data.jslt.impl.ArraySlicer, method: apply, match: "(Scope scope, JsonNode input)", note: "ArraySlicer.apply"}
  - {class: com.schibsted.spt.data.jslt.impl.ArraySlicer, method: getChildren, match: "()", note: "ArraySlicer.getChildren"}
  - {class: com.schibsted.spt.data.jslt.impl.BuiltinFunctions, method: call, match: "(JsonNode input, JsonNode[] arguments)", note: "BuiltinFunctions.call"}
  - {class: com.schibsted.spt.data.jslt.impl.BuiltinFunctions, method: call, match: "(JsonNode input, JsonNode[] arguments)", note: "BuiltinFunctions.call"}
  - {class: com.schibsted.spt.data.jslt.impl.FunctionDeclaration, method: getName, match: "()", note: "FunctionDeclaration.getName"}
  - {class: com.schibsted.spt.data.jslt.impl.FunctionDeclaration, method: getMinArguments, match: "()", note: "FunctionDeclaration.getMinArguments"}
  - {class: com.schibsted.spt.data.jslt.impl.FunctionExpression, method: getFunctionName, match: "()", note: "FunctionExpression.getFunctionName"}
  - {class: com.schibsted.spt.data.jslt.impl.FunctionExpression, method: resolve, match: "(Function function)", note: "FunctionExpression.resolve"}
  - {class: com.schibsted.spt.data.jslt.impl.FunctionWrapper, method: getName, match: "()", note: "FunctionWrapper.getName"}
  - {class: com.schibsted.spt.data.jslt.impl.FunctionWrapper, method: getMinArguments, match: "()", note: "FunctionWrapper.getMinArguments"}
  - {class: com.schibsted.spt.data.jslt.impl.NodeUtils, method: evalLets, match: "(Scope scope, JsonNode input, LetExpression[] lets)", note: "NodeUtils.evalLets"}
  - {class: com.schibsted.spt.data.jslt.impl.NodeUtils, method: isTrue, match: "(JsonNode value)", note: "NodeUtils.isTrue"}
  - {class: com.schibsted.spt.data.jslt.impl.OptimizeUtils, method: optimizeLets, match: "(LetExpression[] lets)", note: "OptimizeUtils.optimizeLets"}
  - {class: com.schibsted.spt.data.jslt.impl.OptimizedStaticContainsFunction, method: call, match: "(JsonNode input, JsonNode[] arguments)", note: "OptimizedStaticContainsFunction.call"}
  - {class: com.schibsted.spt.data.jslt.impl.Utils, method: printHexBinary, match: "(byte[] data)", note: "Utils.printHexBinary"}
  - {class: com.schibsted.spt.data.jslt.impl.lambda.LambdaFunction, method: invoke, match: "(String json)", note: "LambdaFunction.invoke"}
  - {class: com.schibsted.spt.data.jslt.parser.ParserImpl, method: compileExpression, match: "(ParseContext ctx, JsltParser parser)", note: "ParserImpl.compileExpression"}
  - {class: com.schibsted.spt.data.jslt.JsltException, method: getMessage, match: "()", note: "JsltException.getMessage"}
  - {class: com.schibsted.spt.data.jslt.JsltException, method: getMessageWithoutLocation, match: "()", note: "JsltException.getMessageWithoutLocation"}
  - {class: com.schibsted.spt.data.jslt.cli.JSLT, method: main, match: "(String[] args) throws Exception", note: "JSLT.main"}
  - {class: com.schibsted.spt.data.jslt.filters.DefaultJsonFilter, method: filter, match: "(JsonNode value)", note: "DefaultJsonFilter.filter"}
  - {class: com.schibsted.spt.data.jslt.filters.JsltJsonFilter, method: filter, match: "(JsonNode value)", note: "JsltJsonFilter.filter"}
  - {class: com.schibsted.spt.data.jslt.filters.TrueJsonFilter, method: filter, match: "(JsonNode value)", note: "TrueJsonFilter.filter"}
  - {class: com.schibsted.spt.data.jslt.impl.AndOperator, method: apply, match: "(Scope scope, JsonNode input)", note: "AndOperator.apply"}
  - {class: com.schibsted.spt.data.jslt.impl.AndOperator, method: perform, match: "(JsonNode v1, JsonNode v2)", note: "AndOperator.perform"}
  - {class: com.schibsted.spt.data.jslt.impl.BiggerComparison, method: perform, match: "(JsonNode v1, JsonNode v2)", note: "BiggerComparison.perform"}
  - {class: com.schibsted.spt.data.jslt.impl.BiggerOrEqualComparison, method: perform, match: "(JsonNode v1, JsonNode v2)", note: "BiggerOrEqualComparison.perform"}
  - {class: com.schibsted.spt.data.jslt.impl.BoundedCache, method: removeEldestEntry, match: "(Map.Entry eldest)", note: "BoundedCache.removeEldestEntry"}
  - {class: com.schibsted.spt.data.jslt.impl.ClasspathResourceResolver, method: resolve, match: "(String jslt)", note: "ClasspathResourceResolver.resolve"}
  - {class: com.schibsted.spt.data.jslt.impl.DivideOperator, method: perform, match: "(JsonNode v1, JsonNode v2)", note: "DivideOperator.perform"}
  - {class: com.schibsted.spt.data.jslt.impl.DivideOperator, method: perform, match: "(double v1, double v2)", note: "DivideOperator.perform"}
  - {class: com.schibsted.spt.data.jslt.impl.DotExpression, method: apply, match: "(Scope scope, JsonNode input)", note: "DotExpression.apply"}
  - {class: com.schibsted.spt.data.jslt.impl.DotExpression, method: getChildren, match: "()", note: "DotExpression.getChildren"}
  - {class: com.schibsted.spt.data.jslt.impl.EqualsComparison, method: perform, match: "(JsonNode v1, JsonNode v2)", note: "EqualsComparison.perform"}
  - {class: com.schibsted.spt.data.jslt.impl.ExperimentalModule, method: getCallable, match: "(String name)", note: "ExperimentalModule.getCallable"}
  - {class: com.schibsted.spt.data.jslt.impl.ExperimentalModule, method: call, match: "(Scope scope, JsonNode input,", note: "ExperimentalModule.call"}
  - {class: com.schibsted.spt.data.jslt.impl.ExpressionImpl, method: getFunction, match: "(String name)", note: "ExpressionImpl.getFunction"}
  - {class: com.schibsted.spt.data.jslt.impl.ExpressionImpl, method: hasBody, match: "()", note: "ExpressionImpl.hasBody"}
  - {class: com.schibsted.spt.data.jslt.impl.FailDotExpression, method: checkOk, match: "(Location matcher)", note: "FailDotExpression.checkOk"}
  - {class: com.schibsted.spt.data.jslt.impl.FileSystemResourceResolver, method: resolve, match: "(String jslt)", note: "FileSystemResourceResolver.resolve"}
  - {class: com.schibsted.spt.data.jslt.impl.ForExpression, method: apply, match: "(Scope scope, JsonNode input)", note: "ForExpression.apply"}
  - {class: com.schibsted.spt.data.jslt.impl.ForExpression, method: computeMatchContexts, match: "(DotExpression parent)", note: "ForExpression.computeMatchContexts"}
  - {class: com.schibsted.spt.data.jslt.impl.IfExpression, method: apply, match: "(Scope scope, JsonNode input)", note: "IfExpression.apply"}
  - {class: com.schibsted.spt.data.jslt.impl.IfExpression, method: computeMatchContexts, match: "(DotExpression parent)", note: "IfExpression.computeMatchContexts"}
  - {class: com.schibsted.spt.data.jslt.impl.JstlFile, method: getCallable, match: "(String name)", note: "JstlFile.getCallable"}
  - {class: com.schibsted.spt.data.jslt.impl.JstlFile, method: getName, match: "()", note: "JstlFile.getName"}
