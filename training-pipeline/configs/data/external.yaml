# External scrape: mine (Java class -> human-written JMH benchmark) pairs from public repos.
# See jmhgen.config.ExternalScrapeConfig.
#
# Complements the distilled gpt-oss-120b SFT set (configs/data/sft.yaml) with expert,
# maintainer-written benchmarks. Output is schema-identical (records.jsonl + sft.jsonl), so the
# two sets can be merged or compared. Pairing is conservative: a benchmark whose target class is
# ambiguous or missing is skipped (with a reason in report.json) rather than mispaired.
repos:
  - name: kafka
    url: https://github.com/apache/kafka.git
    project: kafka
    license: Apache-2.0
    # ref: trunk            # optional branch/tag to pin; the resolved SHA is always recorded
  - name: grpc-java
    url: https://github.com/grpc/grpc-java.git
    project: grpc-java
    license: Apache-2.0

checkout_root: data/external-src   # repos are shallow-cloned here (git-ignored)
output_dir: data/sft-external
clone: true                        # set false to require pre-existing checkouts

template: canonical                # or "llm2jmh_original"
fence_assistant: true              # wrap the benchmark target in a ```java code block

benchmark_globs:
  - "**/src/jmh/**/*.java"
  - "**/jmh-benchmarks/**/*.java"
  - "**/jmh/**/*.java"
benchmark_suffixes: ["Benchmarks", "Benchmark", "Perf", "Bench"]

max_java_source_chars: 0           # 0 disables the size cap (~4 chars per token rule of thumb)
val_fraction: 0.05
seed: 42
