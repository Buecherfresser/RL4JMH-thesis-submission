# Curated performance-mutation sites for photon (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants photon --source data/external-src/<checkout> \
#       --sites data/projects/photon/mutation_sites.yaml

package_root: de.komoot.photon

sites:
  - {class: de.komoot.photon.PhotonDocAddressSet, method: iterator, match: "()", note: "PhotonDocAddressSet.iterator"}
  - {class: de.komoot.photon.cli.Commands, method: getCmd, match: "()", note: "Commands.getCmd"}
  - {class: de.komoot.photon.config.ApiServerConfig, method: getPort, match: "()", note: "ApiServerConfig.getPort"}
  - {class: de.komoot.photon.json.CountryInfo, method: getName, match: "()", note: "CountryInfo.getName"}
  - {class: de.komoot.photon.metrics.MetricsConfig, method: configure, match: "(Meter.Id id, DistributionStatisticConfig config)", note: "MetricsConfig.configure"}
  - {class: de.komoot.photon.nominatim.model.ContextMap, method: addNameFromPrefix, match: "(String fullKey, @Nullable String name, Set<String> languageList)", note: "ContextMap.addNameFromPrefix"}
  - {class: de.komoot.photon.opensearch.AddressQueryBuilder, method: getQuery, match: "()", note: "AddressQueryBuilder.getQuery"}
  - {class: de.komoot.photon.query.BadRequestException, method: getHttpStatus, match: "()", note: "BadRequestException.getHttpStatus"}
  - {class: de.komoot.photon.searcher.GeoJsonFormatter, method: formatError, match: "(@Nullable String msg)", note: "GeoJsonFormatter.formatError"}
  - {class: de.komoot.photon.PhotonDocInterpolationSet, method: iterator, match: "()", note: "PhotonDocInterpolationSet.iterator"}
  - {class: de.komoot.photon.cli.Commands, method: byCommand, match: "(String label)", note: "Commands.byCommand"}
  - {class: de.komoot.photon.config.ApiServerConfig, method: getIp, match: "()", note: "ApiServerConfig.getIp"}
  - {class: de.komoot.photon.json.CountryInfo, method: getCountryCode, match: "()", note: "CountryInfo.getCountryCode"}
  - {class: de.komoot.photon.metrics.MetricsConfig, method: getPlugin, match: "()", note: "MetricsConfig.getPlugin"}
  - {class: de.komoot.photon.nominatim.model.ContextMap, method: addName, match: "(String key, @Nullable String name)", note: "ContextMap.addName"}
  - {class: de.komoot.photon.opensearch.AddressQueryBuilder, method: addCountryCode, match: "(@Nullable String countryCode, boolean hasMoreDetails)", note: "AddressQueryBuilder.addCountryCode"}
  - {class: de.komoot.photon.query.BoundingBoxParamConverter, method: apply, match: "(@Nullable String bboxParam)", note: "BoundingBoxParamConverter.apply"}
  - {class: de.komoot.photon.searcher.GeoJsonFormatter, method: convert, match: "(List<PhotonResult> results, String language,", note: "GeoJsonFormatter.convert"}
  - {class: de.komoot.photon.App, method: main, match: "(String[] rawArgs) throws Exception", note: "App.main"}
  - {class: de.komoot.photon.cli.PhotonCli, method: parse, match: "(String[] args)", note: "PhotonCli.parse"}
  - {class: de.komoot.photon.config.CorsMutuallyExclusiveValidator, method: validate, match: "(Map<String, Object> parameters) throws ParameterException", note: "CorsMutuallyExclusiveValidator.validate"}
  - {class: de.komoot.photon.json.JsonDumper, method: finish, match: "()", note: "JsonDumper.finish"}
  - {class: de.komoot.photon.metrics.OpenSearchMetrics, method: bindTo, match: "(MeterRegistry registry)", note: "OpenSearchMetrics.bindTo"}
  - {class: de.komoot.photon.nominatim.model.NameMap, method: entrySet, match: "()", note: "NameMap.entrySet"}
  - {class: de.komoot.photon.opensearch.BaseQueryBuilder, method: build, match: "()", note: "BaseQueryBuilder.build"}
  - {class: de.komoot.photon.query.RequestBase, method: getLanguage, match: "()", note: "RequestBase.getLanguage"}
  - {class: de.komoot.photon.searcher.QueryReranker, method: accept, match: "(PhotonResult result)", note: "QueryReranker.accept"}
