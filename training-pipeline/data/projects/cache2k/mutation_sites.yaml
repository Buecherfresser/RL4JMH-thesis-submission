# Curated performance-mutation sites for cache2k (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants cache2k --source data/external-src/<checkout> \
#       --sites data/projects/cache2k/mutation_sites.yaml

package_root: org.cache2k

sites:
  - {class: org.cache2k.Cache2kBuilder, method: forUnknownTypes, match: "()", note: "Cache2kBuilder.forUnknownTypes"}
  - {class: org.cache2k.addon.CoalescingBulkLoader, method: loadAll, match: "(Set<K> keys, BulkLoadContext<K, V> context, BulkCallback<K, V> callback)", note: "CoalescingBulkLoader.loadAll"}
  - {class: org.cache2k.config.Cache2kConfig, method: of, match: "(Class<K> keyType, Class<V> valueType)", note: "Cache2kConfig.of"}
  - {class: org.cache2k.core.ConcurrentMapWrapper, method: putIfAbsent, match: "(K key, V value)", note: "ConcurrentMapWrapper.putIfAbsent"}
  - {class: org.cache2k.expiry.Expiry, method: toSharpTime, match: "(long millis)", note: "Expiry.toSharpTime"}
  - {class: org.cache2k.extra.config.generic.ConfigurationParser, method: parse, match: "(ConfigurationTokenizer parser) throws Exception", note: "ConfigurationParser.parse"}
  - {class: org.cache2k.jcache.provider.JCacheBuilder, method: setConfiguration, match: "(Configuration<K, V> cfg)", note: "JCacheBuilder.setConfiguration"}
  - {class: org.cache2k.pinpoint.Await, method: await, match: "(String description, Duration timeoutDuration, Supplier<Boolean> c)", note: "Await.await"}
  - {class: org.cache2k.testing.SimulatedClock, method: schedule, match: "(Runnable runnable, long delayMillis)", note: "SimulatedClock.schedule"}
  - {class: org.cache2k.testsuite.api.MapTest, method: suite, match: "()", note: "MapTest.suite"}
  - {class: org.cache2k.Cache2kBuilder, method: of, match: "(Class<K> keyType, Class<V> valueType)", note: "Cache2kBuilder.of"}
  - {class: org.cache2k.addon.CoalescingBulkLoader, method: onLoadSuccess, match: "(Map<? extends K, ? extends V> data)", note: "CoalescingBulkLoader.onLoadSuccess"}
  - {class: org.cache2k.config.Cache2kConfig, method: of, match: "(CacheType<K> keyType, CacheType<V> valueType)", note: "Cache2kConfig.of"}
  - {class: org.cache2k.core.ConcurrentMapWrapper, method: replace, match: "(K key, V oldValue, V newValue)", note: "ConcurrentMapWrapper.replace"}
  - {class: org.cache2k.expiry.Expiry, method: earliestTime, match: "(long loadTime, long candidate1, long candidate2)", note: "Expiry.earliestTime"}
  - {class: org.cache2k.extra.config.generic.StandardPropertyParser, method: parse, match: "(Class<?> targetType, String value) throws Exception", note: "StandardPropertyParser.parse"}
  - {class: org.cache2k.jcache.provider.JCacheBuilder, method: build, match: "()", note: "JCacheBuilder.build"}
  - {class: org.cache2k.pinpoint.Await, method: await, match: "(String description, Supplier<Boolean> c)", note: "Await.await"}
  - {class: org.cache2k.testing.SimulatedClock, method: execute, match: "(Runnable command)", note: "SimulatedClock.execute"}
  - {class: org.cache2k.testsuite.expiry.ExpirySetupTest, method: defaults, match: "()", note: "ExpirySetupTest.defaults"}
  - {class: org.cache2k.AbstractCache, method: getName, match: "()", note: "AbstractCache.getName"}
  - {class: org.cache2k.addon.CoalescingBulkLoaderConfig, method: getMaxDelay, match: "()", note: "CoalescingBulkLoaderConfig.getMaxDelay"}
  - {class: org.cache2k.config.Cache2kManagerConfig, method: isIgnoreMissingCacheConfiguration, match: "()", note: "Cache2kManagerConfig.isIgnoreMissingCacheConfiguration"}
  - {class: org.cache2k.core.InternalCache2kBuilder, method: getName, match: "()", note: "InternalCache2kBuilder.getName"}
  - {class: org.cache2k.extra.config.generic.StandardPropertyParser, method: parse, match: "(String v)", note: "StandardPropertyParser.parse"}
  - {class: org.cache2k.jcache.provider.Util, method: checkKey, match: "(T value)", note: "Util.checkKey"}
  - {class: org.cache2k.pinpoint.ExceptionCollector, method: exception, match: "(Throwable t)", note: "ExceptionCollector.exception"}
  - {class: org.cache2k.testsuite.expiry.ExpirySetupTest, method: maxExpireAfterWrite, match: "()", note: "ExpirySetupTest.maxExpireAfterWrite"}
  - {class: org.cache2k.AbstractCache, method: containsKey, match: "(K key)", note: "AbstractCache.containsKey"}
  - {class: org.cache2k.addon.CoalescingBulkLoaderConfig, method: setMaxDelay, match: "(long maxDelay)", note: "CoalescingBulkLoaderConfig.setMaxDelay"}
  - {class: org.cache2k.config.Cache2kManagerConfig, method: setIgnoreMissingCacheConfiguration, match: "(boolean f)", note: "Cache2kManagerConfig.setIgnoreMissingCacheConfiguration"}
  - {class: org.cache2k.core.InternalCache2kBuilder, method: getTimeReference, match: "()", note: "InternalCache2kBuilder.getTimeReference"}
  - {class: org.cache2k.extra.jmx.LifecycleListener, method: onCacheClosed, match: "(Cache<?, ?> cache)", note: "LifecycleListener.onCacheClosed"}
  - {class: org.cache2k.jcache.provider.Util, method: checkValue, match: "(T value)", note: "Util.checkValue"}
  - {class: org.cache2k.pinpoint.ExceptionCollector, method: runAndCatch, match: "(Runnable r)", note: "ExceptionCollector.runAndCatch"}
  - {class: org.cache2k.testsuite.stress.ConcurrentMapStressTest, method: test, match: "() throws Exception", note: "ConcurrentMapStressTest.test"}
  - {class: org.cache2k.addon.CoalescingBulkLoaderSupport, method: enable, match: "(Cache2kBuilder<?, ?> b)", note: "CoalescingBulkLoaderSupport.enable"}
  - {class: org.cache2k.config.CacheTypeCapture, method: getTypeName, match: "()", note: "CacheTypeCapture.getTypeName"}
  - {class: org.cache2k.core.util.Util, method: compactFullName, match: "(CacheManager mgr, String cacheName)", note: "Util.compactFullName"}
  - {class: org.cache2k.extra.config.generic.BeanPropertyAccessor, method: getNames, match: "()", note: "BeanPropertyAccessor.getNames"}
  - {class: org.cache2k.jcache.provider.tckGlue.TckMBeanServerBuilder, method: newMBeanServerDelegate, match: "()", note: "TckMBeanServerBuilder.newMBeanServerDelegate"}
  - {class: org.cache2k.pinpoint.SupervisedExecutor, method: execute, match: "(Runnable command)", note: "SupervisedExecutor.execute"}
  - {class: org.cache2k.testsuite.stress.ConcurrentMapStressTest, method: setup, match: "()", note: "ConcurrentMapStressTest.setup"}
  - {class: org.cache2k.addon.CoalescingBulkLoaderSupport, method: disable, match: "(Cache2kBuilder<?, ?> b)", note: "CoalescingBulkLoaderSupport.disable"}
  - {class: org.cache2k.config.CacheTypeCapture, method: hasTypeArguments, match: "()", note: "CacheTypeCapture.hasTypeArguments"}
  - {class: org.cache2k.core.util.Util, method: formatTime, match: "(Instant t)", note: "Util.formatTime"}
  - {class: org.cache2k.extra.config.generic.BeanPropertyMutator, method: getNames, match: "()", note: "BeanPropertyMutator.getNames"}
  - {class: org.cache2k.jcache.provider.tckGlue.TckMBeanServerBuilder, method: getMBeanServerId, match: "()", note: "TckMBeanServerBuilder.getMBeanServerId"}
  - {class: org.cache2k.pinpoint.SupervisedExecutor, method: join, match: "()", note: "SupervisedExecutor.join"}
  - {class: org.cache2k.testsuite.support.StaticUtil, method: enforceWiredCache, match: "(Cache2kBuilder<K, V> b)", note: "StaticUtil.enforceWiredCache"}
