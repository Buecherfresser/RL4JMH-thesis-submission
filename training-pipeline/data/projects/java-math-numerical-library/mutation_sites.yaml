# Curated performance-mutation sites for java-math-numerical-library (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants java-math-numerical-library --source data/external-src/<checkout> \
#       --sites data/projects/java-math-numerical-library/mutation_sites.yaml

package_root: com.mathlibrary.util

sites:
  - {class: com.mathlibrary.util.UtilMatrix, method: getI, match: "(int rows)", note: "UtilMatrix.getI"}
  - {class: com.mathlibrary.util.UtilVector, method: rowOnes, match: "(int numElements)", note: "UtilVector.rowOnes"}
  - {class: com.mathlibrary.util.UtilVector, method: columnOnes, match: "(int numElements)", note: "UtilVector.columnOnes"}
  - {class: com.mathlibrary.util.Combination, method: calc, match: "(final int m, final int n) throws CalculatorException", note: "Combination.calc"}
  - {class: com.mathlibrary.util.Factorial, method: cal, match: "(final int m, final boolean valueZero) throws CalculatorException", note: "Factorial.cal"}
  - {class: com.mathlibrary.util.Interval, method: getA, match: "()", note: "Interval.getA"}
  - {class: com.mathlibrary.util.Interval, method: setA, match: "(double a)", note: "Interval.setA"}
  - {class: com.mathlibrary.util.Interval, method: getB, match: "()", note: "Interval.getB"}
  - {class: com.mathlibrary.util.Interval, method: setB, match: "(double b)", note: "Interval.setB"}
  - {class: com.mathlibrary.util.Round, method: rint, match: "(double x, int numDecimals)", note: "Round.rint"}
