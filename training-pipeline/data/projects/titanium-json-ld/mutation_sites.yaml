  - {class: com.apicatalog.jsonld.runtime.TypeMapCollector, method: onEvent, match: "(EventType type, String key, String value) throws JsonLdException", note: "TypeMapCollector.onEvent"}
  - {class: com.apicatalog.jsonld.tordf.JsonLdToQuads, method: provide, match: "(RdfQuadConsumer consumer) throws JsonLdException", note: "JsonLdToQuads.provide"}
