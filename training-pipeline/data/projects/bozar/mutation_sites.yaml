  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.watermark.TextInsideClassTransformer, method: transformClassWriter, match: "(ClassWriter classWriter)", note: "TextInsideClassTransformer.transformClassWriter"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.watermark.TextInsideClassTransformer, method: getEnableType, match: "()", note: "TextInsideClassTransformer.getEnableType"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.watermark.ZipCommentTransformer, method: transformOutput, match: "(JarOutputStream jarOutputStream)", note: "ZipCommentTransformer.transformOutput"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.watermark.ZipCommentTransformer, method: getEnableType, match: "()", note: "ZipCommentTransformer.getEnableType"}
  - {class: io.github.vimasig.bozar.obfuscator.utils.BozarClassVerifier, method: verify, match: "(Bozar bozar, Path path, ClassLoader parent) throws IOException", note: "BozarClassVerifier.verify"}
  - {class: io.github.vimasig.bozar.obfuscator.utils.Reflection, method: setDeclaredField, match: "(String name, Object value)", note: "Reflection.setDeclaredField"}
  - {class: io.github.vimasig.bozar.obfuscator.utils.model.BozarConfig, method: EnableType, match: "(Supplier<Boolean> isEnabled, Object type)", note: "BozarConfig.EnableType"}
