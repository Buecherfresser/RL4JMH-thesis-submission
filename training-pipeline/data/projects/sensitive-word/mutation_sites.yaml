  - {class: com.github.houbb.sensitive.word.support.allow.WordAllowSystem, method: getInstance, match: "()", note: "WordAllowSystem.getInstance"}
  - {class: com.github.houbb.sensitive.word.support.allow.WordAllowSystem, method: allow, match: "()", note: "WordAllowSystem.allow"}
  - {class: com.github.houbb.sensitive.word.support.allow.WordAllows, method: chains, match: "(final IWordAllow wordAllow,", note: "WordAllows.chains"}
