  - {class: com.fasterxml.jackson.datatype.jdk8.OptionalIntDeserializer, method: logicalType, match: "()", note: "OptionalIntDeserializer.logicalType"}
  - {class: com.fasterxml.jackson.datatype.jdk8.OptionalIntDeserializer, method: deserialize, match: "(JsonParser p, DeserializationContext ctxt) throws IOException", note: "OptionalIntDeserializer.deserialize"}
  - {class: com.fasterxml.jackson.datatype.jdk8.OptionalIntSerializer, method: isEmpty, match: "(SerializerProvider provider, OptionalInt value)", note: "OptionalIntSerializer.isEmpty"}
  - {class: com.fasterxml.jackson.datatype.jdk8.OptionalIntSerializer, method: acceptJsonFormatVisitor, match: "(JsonFormatVisitorWrapper visitor,", note: "OptionalIntSerializer.acceptJsonFormatVisitor"}
  - {class: com.fasterxml.jackson.datatype.jdk8.OptionalLongDeserializer, method: logicalType, match: "()", note: "OptionalLongDeserializer.logicalType"}
  - {class: com.fasterxml.jackson.datatype.jdk8.OptionalLongDeserializer, method: deserialize, match: "(JsonParser p, DeserializationContext ctxt) throws IOException", note: "OptionalLongDeserializer.deserialize"}
  - {class: com.fasterxml.jackson.datatype.jdk8.OptionalLongSerializer, method: isEmpty, match: "(SerializerProvider provider, OptionalLong value)", note: "OptionalLongSerializer.isEmpty"}
  - {class: com.fasterxml.jackson.datatype.jdk8.OptionalLongSerializer, method: acceptJsonFormatVisitor, match: "(JsonFormatVisitorWrapper visitor,", note: "OptionalLongSerializer.acceptJsonFormatVisitor"}
  - {class: com.fasterxml.jackson.datatype.jdk8.OptionalSerializer, method: withResolved, match: "(BeanProperty prop,", note: "OptionalSerializer.withResolved"}
  - {class: com.fasterxml.jackson.datatype.jdk8.OptionalSerializer, method: withContentInclusion, match: "(Object suppressableValue,", note: "OptionalSerializer.withContentInclusion"}
