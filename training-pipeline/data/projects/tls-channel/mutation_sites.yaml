# Curated performance-mutation sites for tls-channel (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants tls-channel --source data/external-src/<checkout> \
#       --sites data/projects/tls-channel/mutation_sites.yaml

package_root: tlschannel

sites:
