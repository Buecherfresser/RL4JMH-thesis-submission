# Curated performance-mutation sites for rythmengine (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants rythmengine --source data/external-src/<checkout> \
#       --sites data/projects/rythmengine/mutation_sites.yaml

package_root: org.rythmengine.internal

sites:
  - {class: org.rythmengine.internal.AutoToStringCodeBuilder, method: extended, match: "()", note: "AutoToStringCodeBuilder.extended"}
  - {class: org.rythmengine.internal.compiler.ParamTypeInferencer, method: typeTransform, match: "(String type)", note: "ParamTypeInferencer.typeTransform"}
  - {class: org.rythmengine.internal.dialect.AutoToString, method: id, match: "()", note: "AutoToString.id"}
  - {class: org.rythmengine.internal.parser.ParserDispatcher, method: go2, match: "()", note: "ParserDispatcher.go2"}
  - {class: org.rythmengine.internal.AutoToStringCodeBuilder, method: pSetup, match: "()", note: "AutoToStringCodeBuilder.pSetup"}
  - {class: org.rythmengine.internal.compiler.ParamTypeInferencer, method: initialValue, match: "()", note: "ParamTypeInferencer.initialValue"}
  - {class: org.rythmengine.internal.dialect.AutoToString, method: createCodeBuilder, match: "(String template, String className, String tagName, TemplateClass templateClass, RythmEngine engine)", note: "AutoToString.createCodeBuilder"}
  - {class: org.rythmengine.internal.parser.ParserDispatcher, method: go, match: "()", note: "ParserDispatcher.go"}
  - {class: org.rythmengine.internal.CodeBuilder, method: objectType, match: "()", note: "CodeBuilder.objectType"}
  - {class: org.rythmengine.internal.compiler.TemplateClass, method: __cloneMe, match: "(RythmEngine engine, ITemplate caller)", note: "TemplateClass.__cloneMe"}
  - {class: org.rythmengine.internal.dialect.ToString, method: id, match: "()", note: "ToString.id"}
  - {class: org.rythmengine.internal.parser.build_in.ArgsParser, method: keyword, match: "()", note: "ArgsParser.keyword"}
  - {class: org.rythmengine.internal.CodeBuilder, method: nullVal, match: "()", note: "CodeBuilder.nullVal"}
  - {class: org.rythmengine.internal.compiler.TemplateClass, method: root, match: "()", note: "TemplateClass.root"}
  - {class: org.rythmengine.internal.dialect.ToString, method: a, match: "()", note: "ToString.a"}
  - {class: org.rythmengine.internal.parser.build_in.ArgsParser, method: create, match: "(final IContext ctx)", note: "ArgsParser.create"}
  - {class: org.rythmengine.internal.LoopUtil, method: sep, match: "(String sep)", note: "LoopUtil.sep"}
  - {class: org.rythmengine.internal.compiler.TemplateClassCache, method: deleteCache, match: "(TemplateClass tc)", note: "TemplateClassCache.deleteCache"}
