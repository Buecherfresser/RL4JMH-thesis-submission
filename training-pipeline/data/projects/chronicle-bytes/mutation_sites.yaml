# Curated performance-mutation sites for chronicle-bytes (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants chronicle-bytes --source data/external-src/<checkout> \
#       --sites data/projects/chronicle-bytes/mutation_sites.yaml

package_root: net.openhft.chronicle.bytes

sites:
