  - {class: com.github.aelstad.keccakj.spi.Shake128Key, method: getAlgorithm, match: "()", note: "Shake128Key.getAlgorithm"}
  - {class: com.github.aelstad.keccakj.spi.Shake256Key, method: getAlgorithm, match: "()", note: "Shake256Key.getAlgorithm"}
