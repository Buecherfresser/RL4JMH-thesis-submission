# Curated performance-mutation sites for cafed00d (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants cafed00d --source data/external-src/<checkout> \
#       --sites data/projects/cafed00d/mutation_sites.yaml

package_root: software.coley.cafedude

sites:
  - {class: software.coley.cafedude.UnresolvedLabelException, method: getLabel, match: "()", note: "UnresolvedLabelException.getLabel"}
  - {class: software.coley.cafedude.classfile.annotation.ArrayElementValue, method: getArray, match: "()", note: "ArrayElementValue.getArray"}
  - {class: software.coley.cafedude.io.ClassBuilder, method: isOakVersion, match: "()", note: "ClassBuilder.isOakVersion"}
  - {class: software.coley.cafedude.transform.IllegalStrippingTransformer, method: transform, match: "()", note: "IllegalStrippingTransformer.transform"}
  - {class: software.coley.cafedude.tree.insn.MultiANewArrayInsn, method: getOwner, match: "()", note: "MultiANewArrayInsn.getOwner"}
  - {class: software.coley.cafedude.util.ConstantUtil, method: from, match: "(@Nonnull CpEntry entry)", note: "ConstantUtil.from"}
  - {class: software.coley.cafedude.UnresolvedLabelException, method: getInstruction, match: "()", note: "UnresolvedLabelException.getInstruction"}
  - {class: software.coley.cafedude.classfile.annotation.ArrayElementValue, method: setArray, match: "(@Nonnull List<ElementValue> array)", note: "ArrayElementValue.setArray"}
  - {class: software.coley.cafedude.io.ClassBuilder, method: isAnnotation, match: "()", note: "ClassBuilder.isAnnotation"}
  - {class: software.coley.cafedude.transform.IllegalStrippingTransformer, method: removeDeadInstructions, match: "(@Nonnull CodeAttribute code)", note: "IllegalStrippingTransformer.removeDeadInstructions"}
  - {class: software.coley.cafedude.tree.insn.MultiANewArrayInsn, method: setOwner, match: "(String owner)", note: "MultiANewArrayInsn.setOwner"}
  - {class: software.coley.cafedude.util.ConstantUtil, method: from, match: "(@Nonnull ElementValue value)", note: "ConstantUtil.from"}
  - {class: software.coley.cafedude.classfile.attribute.CharacterRangeTableAttribute, method: getCharacterRangeTable, match: "()", note: "CharacterRangeTableAttribute.getCharacterRangeTable"}
  - {class: software.coley.cafedude.io.IndexableByteStream, method: getAbsoluteIndex, match: "()", note: "IndexableByteStream.getAbsoluteIndex"}
  - {class: software.coley.cafedude.transform.LabelTransformer, method: transform, match: "()", note: "LabelTransformer.transform"}
  - {class: software.coley.cafedude.tree.visitor.writer.AnnotationArrayWriter, method: visitArrayValue, match: "(@Nonnull Constant value)", note: "AnnotationArrayWriter.visitArrayValue"}
  - {class: software.coley.cafedude.util.GrowingByteBuffer, method: ensureWriteable, match: "(int size)", note: "GrowingByteBuffer.ensureWriteable"}
  - {class: software.coley.cafedude.classfile.attribute.CharacterRangeTableAttribute, method: setCharacterRangeTable, match: "(@Nonnull List<CharacterRangeInfo> characterRangeTable)", note: "CharacterRangeTableAttribute.setCharacterRangeTable"}
