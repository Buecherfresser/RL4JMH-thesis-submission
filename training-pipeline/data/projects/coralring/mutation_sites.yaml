  - {class: com.coralblocks.coralring.ring.NonWaitingRingProducer, method: newInstance, match: "()", note: "NonWaitingRingProducer.newInstance"}
  - {class: com.coralblocks.coralring.util.PayloadByteBufferMessage, method: getMaxSize, match: "(int maxPayloadSize)", note: "PayloadByteBufferMessage.getMaxSize"}
  - {class: com.coralblocks.coralring.example.ring.BasicNonWaitingRingProducer, method: main, match: "(String[] args)", note: "BasicNonWaitingRingProducer.main"}
