  - {class: tlschannel.async.AsynchronousTlsChannel, method: cancel, match: "(boolean mayInterruptIfRunning)", note: "AsynchronousTlsChannel.cancel"}
  - {class: tlschannel.impl.BufferHolder, method: prepare, match: "()", note: "BufferHolder.prepare"}
