  - {class: com.github.marschall.memoryfilesystem.DirectoryChannel, method: force, match: "(boolean metaData) throws IOException", note: "DirectoryChannel.force"}
  - {class: com.github.marschall.memoryfilesystem.DirectoryChannel, method: position, match: "() throws IOException", note: "DirectoryChannel.position"}
  - {class: com.github.marschall.memoryfilesystem.EmptyPath, method: isAbsolute, match: "()", note: "EmptyPath.isAbsolute"}
  - {class: com.github.marschall.memoryfilesystem.EmptyPath, method: getRoot, match: "()", note: "EmptyPath.getRoot"}
  - {class: com.github.marschall.memoryfilesystem.EmptyRoot, method: startsWith, match: "(String other)", note: "EmptyRoot.startsWith"}
  - {class: com.github.marschall.memoryfilesystem.EmptyRoot, method: endsWith, match: "(String other)", note: "EmptyRoot.endsWith"}
  - {class: com.github.marschall.memoryfilesystem.HundredNanoseconds, method: getDuration, match: "()", note: "HundredNanoseconds.getDuration"}
  - {class: com.github.marschall.memoryfilesystem.HundredNanoseconds, method: isDurationEstimated, match: "()", note: "HundredNanoseconds.isDurationEstimated"}
  - {class: com.github.marschall.memoryfilesystem.KindWatchEvent, method: kind, match: "()", note: "KindWatchEvent.kind"}
  - {class: com.github.marschall.memoryfilesystem.MemoryFile, method: accessed, match: "()", note: "MemoryFile.accessed"}
  - {class: com.github.marschall.memoryfilesystem.MemoryFile, method: modified, match: "()", note: "MemoryFile.modified"}
  - {class: com.github.marschall.memoryfilesystem.MemoryFileLock, method: isValid, match: "()", note: "MemoryFileLock.isValid"}
