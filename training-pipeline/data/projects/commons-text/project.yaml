# Mutation-track metadata for Apache Commons Text (GRPO RL corpus).
name: commons-text
display_name: Apache Commons Text
version: "1.12.0"
package_root: org.apache.commons.text

source_dir: data/external-src/commons-text/src/main/java

mutations_patch: mutations.patch
mutants_registry: mutants.yaml
snippets: snippets.jsonl

java_release: 17
dependencies:
  - data/classpaths/lib/commons-text/commons-lang3-3.14.0.jar

mutation:
  switch_class: org.apache.commons.text.jmhbench.MutationSwitch
  arm_property: jmhbench.mutant
  record_property: jmhbench.record

provenance:
  project: Apache Commons Text
  url: https://github.com/apache/commons-text
  tag: rel/commons-text-1.12.0
