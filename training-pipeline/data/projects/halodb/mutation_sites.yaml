  - {class: com.oath.halodb.OffHeapHashTableBuilder, method: getMemoryPoolChunkSize, match: "()", note: "OffHeapHashTableBuilder.getMemoryPoolChunkSize"}
  - {class: com.oath.halodb.CompactionManager, method: run, match: "()", note: "CompactionManager.run"}
