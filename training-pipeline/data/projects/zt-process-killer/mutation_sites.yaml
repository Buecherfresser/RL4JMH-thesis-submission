  - {class: org.zeroturnaround.process.AndProcess, method: waitFor, match: "() throws InterruptedException", note: "AndProcess.waitFor"}
  - {class: org.zeroturnaround.process.AndProcess, method: destroy, match: "(boolean forceful) throws IOException, InterruptedException", note: "AndProcess.destroy"}
