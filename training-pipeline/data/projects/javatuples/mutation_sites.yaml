# Curated performance-mutation sites for javatuples (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants javatuples --source data/external-src/<checkout> \
#       --sites data/projects/javatuples/mutation_sites.yaml

package_root: org.javatuples

sites:
  - {class: org.javatuples.Decade, method: with, match: "(final A value0, final B value1, final C value2, final D value3, final E value4, final F value5, final G value6, final H value7, final I value8, final J value9)", note: "Decade.with"}
  - {class: org.javatuples.Decade, method: fromArray, match: "(final X[] array)", note: "Decade.fromArray"}
  - {class: org.javatuples.Decade, method: fromCollection, match: "(final Collection<X> collection)", note: "Decade.fromCollection"}
  - {class: org.javatuples.Decade, method: fromIterable, match: "(final Iterable<X> iterable)", note: "Decade.fromIterable"}
  - {class: org.javatuples.Decade, method: fromIterable, match: "(final Iterable<X> iterable, int index)", note: "Decade.fromIterable"}
  - {class: org.javatuples.Decade, method: getValue0, match: "()", note: "Decade.getValue0"}
  - {class: org.javatuples.Ennead, method: with, match: "(final A value0, final B value1, final C value2, final D value3, final E value4, final F value5, final G value6, final H value7, final I value8)", note: "Ennead.with"}
  - {class: org.javatuples.Ennead, method: fromArray, match: "(final X[] array)", note: "Ennead.fromArray"}
