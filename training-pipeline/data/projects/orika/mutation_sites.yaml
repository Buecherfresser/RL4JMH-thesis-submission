  - {class: ma.glasnost.orika.unenhance.BaseUnenhancer, method: addSuperTypeResolverStrategy, match: "(final SuperTypeResolverStrategy strategy)", note: "BaseUnenhancer.addSuperTypeResolverStrategy"}
  - {class: ma.glasnost.orika.util.ClassHelper, method: findParameterClass, match: "(int paramNum, Class<? extends T> subclass, Class<? extends T> classWithParameter)", note: "ClassHelper.findParameterClass"}
