  - {class: org.ahocorasick.trie.PayloadTrie, method: parseText, match: "(final CharSequence text, final StatefulPayloadEmitHandler<T> emitHandler)", note: "PayloadTrie.parseText"}
  - {class: org.ahocorasick.trie.PayloadTrie, method: containsMatch, match: "(final CharSequence text)", note: "PayloadTrie.containsMatch"}
