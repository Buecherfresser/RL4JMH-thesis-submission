# Curated performance-mutation sites for offheap-store (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants offheap-store --source data/external-src/<checkout> \
#       --sites data/projects/offheap-store/mutation_sites.yaml

