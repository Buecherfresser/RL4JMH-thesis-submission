# Curated performance-mutation sites for jsoup (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jsoup --source data/external-src/<checkout> \
#       --sites data/projects/jsoup/mutation_sites.yaml

package_root: org.jsoup

sites:
  - {class: org.jsoup.HttpStatusException, method: getStatusCode, match: "()", note: "HttpStatusException.getStatusCode"}
  - {class: org.jsoup.examples.ListLinks, method: main, match: "(String[] args) throws IOException", note: "ListLinks.main"}
  - {class: org.jsoup.helper.DataUtil, method: readToByteBuffer, match: "(InputStream inStream, int maxSize) throws IOException", note: "DataUtil.readToByteBuffer"}
  - {class: org.jsoup.internal.ControllableInputStream, method: wrap, match: "(InputStream in, int bufferSize, int maxSize)", note: "ControllableInputStream.wrap"}
  - {class: org.jsoup.nodes.Range, method: start, match: "()", note: "Range.start"}
  - {class: org.jsoup.parser.HtmlTreeBuilder, method: initialiseParse, match: "(Reader input, String baseUri, Parser parser)", note: "HtmlTreeBuilder.initialiseParse"}
  - {class: org.jsoup.safety.Cleaner, method: clean, match: "(Document dirtyDocument)", note: "Cleaner.clean"}
  - {class: org.jsoup.select.QueryParser, method: parse, match: "(String query)", note: "QueryParser.parse"}
  - {class: org.jsoup.HttpStatusException, method: getUrl, match: "()", note: "HttpStatusException.getUrl"}
  - {class: org.jsoup.examples.HtmlToPlainText, method: main, match: "(String... args) throws IOException", note: "HtmlToPlainText.main"}
  - {class: org.jsoup.helper.HttpConnection, method: connect, match: "(String url)", note: "HttpConnection.connect"}
  - {class: org.jsoup.internal.ControllableInputStream, method: markSupported, match: "()", note: "ControllableInputStream.markSupported"}
  - {class: org.jsoup.nodes.Range, method: startPos, match: "()", note: "Range.startPos"}
  - {class: org.jsoup.parser.HtmlTreeBuilder, method: process, match: "(Token token)", note: "HtmlTreeBuilder.process"}
  - {class: org.jsoup.safety.Cleaner, method: isValid, match: "(Document dirtyDocument)", note: "Cleaner.isValid"}
  - {class: org.jsoup.select.QueryParser, method: close, match: "()", note: "QueryParser.close"}
  - {class: org.jsoup.Jsoup, method: parse, match: "(String html, String baseUri)", note: "Jsoup.parse"}
  - {class: org.jsoup.examples.HtmlToPlainText, method: head, match: "(Node node, int depth)", note: "HtmlToPlainText.head"}
  - {class: org.jsoup.helper.HttpConnection, method: connect, match: "(URL url)", note: "HttpConnection.connect"}
  - {class: org.jsoup.internal.Functions, method: listFunction, match: "()", note: "Functions.listFunction"}
  - {class: org.jsoup.nodes.Attribute, method: getKey, match: "()", note: "Attribute.getKey"}
  - {class: org.jsoup.parser.ParseErrorList, method: noTracking, match: "()", note: "ParseErrorList.noTracking"}
  - {class: org.jsoup.safety.Safelist, method: none, match: "()", note: "Safelist.none"}
  - {class: org.jsoup.select.Collector, method: collect, match: "(Evaluator eval, Element root)", note: "Collector.collect"}
  - {class: org.jsoup.Jsoup, method: parse, match: "(String html, String baseUri, Parser parser)", note: "Jsoup.parse"}
  - {class: org.jsoup.examples.Wikipedia, method: main, match: "(String[] args) throws IOException", note: "Wikipedia.main"}
  - {class: org.jsoup.helper.Re2jRegex, method: compile, match: "(String regex)", note: "Re2jRegex.compile"}
  - {class: org.jsoup.internal.Functions, method: setFunction, match: "()", note: "Functions.setFunction"}
  - {class: org.jsoup.nodes.Attribute, method: setKey, match: "(String key)", note: "Attribute.setKey"}
  - {class: org.jsoup.parser.ParseErrorList, method: tracking, match: "(int maxSize)", note: "ParseErrorList.tracking"}
  - {class: org.jsoup.safety.Safelist, method: simpleText, match: "()", note: "Safelist.simpleText"}
  - {class: org.jsoup.select.Collector, method: stream, match: "(Evaluator evaluator, Element root)", note: "Collector.stream"}
  - {class: org.jsoup.UnsupportedMimeTypeException, method: getMimeType, match: "()", note: "UnsupportedMimeTypeException.getMimeType"}
  - {class: org.jsoup.helper.Re2jRegex, method: matcher, match: "(CharSequence input)", note: "Re2jRegex.matcher"}
  - {class: org.jsoup.internal.LineMap, method: addLineStart, match: "(int pos)", note: "LineMap.addLineStart"}
  - {class: org.jsoup.nodes.Attributes, method: getIgnoreCase, match: "(String key)", note: "Attributes.getIgnoreCase"}
  - {class: org.jsoup.parser.ParseSettings, method: preserveTagCase, match: "()", note: "ParseSettings.preserveTagCase"}
  - {class: org.jsoup.select.Elements, method: asList, match: "()", note: "Elements.asList"}
  - {class: org.jsoup.UnsupportedMimeTypeException, method: getUrl, match: "()", note: "UnsupportedMimeTypeException.getUrl"}
  - {class: org.jsoup.helper.Regex, method: compile, match: "(String regex)", note: "Regex.compile"}
  - {class: org.jsoup.internal.LineMap, method: complete, match: "()", note: "LineMap.complete"}
  - {class: org.jsoup.nodes.Attributes, method: userData, match: "(String key)", note: "Attributes.userData"}
  - {class: org.jsoup.parser.ParseSettings, method: preserveAttributeCase, match: "()", note: "ParseSettings.preserveAttributeCase"}
  - {class: org.jsoup.select.Elements, method: attr, match: "(String attributeKey)", note: "Elements.attr"}
  - {class: org.jsoup.helper.Regex, method: fromPattern, match: "(Pattern pattern)", note: "Regex.fromPattern"}
  - {class: org.jsoup.internal.SimpleBufferedInput, method: close, match: "() throws IOException", note: "SimpleBufferedInput.close"}
  - {class: org.jsoup.nodes.CDataNode, method: nodeName, match: "()", note: "CDataNode.nodeName"}
  - {class: org.jsoup.parser.Parser, method: newInstance, match: "()", note: "Parser.newInstance"}
  - {class: org.jsoup.select.NodeTraversor, method: traverse, match: "(NodeVisitor visitor, Node root)", note: "NodeTraversor.traverse"}
  - {class: org.jsoup.helper.Validate, method: isTrue, match: "(boolean val)", note: "Validate.isTrue"}
