  - {class: edu.uci.ics.crawler4j.parser.ExtractedUrlAnchorPair, method: getHref, match: "()", note: "ExtractedUrlAnchorPair.getHref"}
  - {class: edu.uci.ics.crawler4j.parser.ExtractedUrlAnchorPair, method: setHref, match: "(String href)", note: "ExtractedUrlAnchorPair.setHref"}
  - {class: edu.uci.ics.crawler4j.parser.HtmlContentHandler, method: getElement, match: "(String name)", note: "HtmlContentHandler.getElement"}
  - {class: edu.uci.ics.crawler4j.parser.HtmlContentHandler, method: startElement, match: "(String uri, String localName, String qName, Attributes attributes)", note: "HtmlContentHandler.startElement"}
  - {class: edu.uci.ics.crawler4j.parser.HtmlParseData, method: getHtml, match: "()", note: "HtmlParseData.getHtml"}
  - {class: edu.uci.ics.crawler4j.parser.HtmlParseData, method: setHtml, match: "(String html)", note: "HtmlParseData.setHtml"}
