# Curated performance-mutation sites for daisydiff (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants daisydiff --source data/external-src/<checkout> \
#       --sites data/projects/daisydiff/mutation_sites.yaml

package_root: org.outerj.daisy

sites:
  - {class: org.outerj.daisy.diff.helper.NekoHtmlParser, method: parse, match: "(InputSource is) throws IOException, SAXException", note: "NekoHtmlParser.parse"}
  - {class: org.outerj.daisy.diff.helper.NekoHtmlParser, method: parse, match: "(InputSource is, ContentHandler consumer)", note: "NekoHtmlParser.parse"}
  - {class: org.outerj.daisy.diff.helper.SaxBuffer, method: skippedEntity, match: "(String name) throws SAXException", note: "SaxBuffer.skippedEntity"}
  - {class: org.outerj.daisy.diff.helper.SaxBuffer, method: setDocumentLocator, match: "(Locator locator)", note: "SaxBuffer.setDocumentLocator"}
  - {class: org.outerj.daisy.diff.html.TextNodeComparator, method: getBodyNode, match: "()", note: "TextNodeComparator.getBodyNode"}
  - {class: org.outerj.daisy.diff.html.TextNodeComparator, method: getRangeCount, match: "()", note: "TextNodeComparator.getRangeCount"}
  - {class: org.outerj.daisy.diff.html.ancestor.AncestorComparator, method: getRangeCount, match: "()", note: "AncestorComparator.getRangeCount"}
  - {class: org.outerj.daisy.diff.html.ancestor.AncestorComparator, method: rangesEqual, match: "(int owni, IRangeComparator otherComp, int otheri)", note: "AncestorComparator.rangesEqual"}
  - {class: org.outerj.daisy.diff.html.ancestor.AncestorComparatorResult, method: isChanged, match: "()", note: "AncestorComparatorResult.isChanged"}
  - {class: org.outerj.daisy.diff.html.ancestor.AncestorComparatorResult, method: setChanged, match: "(boolean changed)", note: "AncestorComparatorResult.setChanged"}
  - {class: org.outerj.daisy.diff.html.ancestor.TextOnlyComparator, method: getRangeCount, match: "()", note: "TextOnlyComparator.getRangeCount"}
  - {class: org.outerj.daisy.diff.html.ancestor.TextOnlyComparator, method: rangesEqual, match: "(int owni, IRangeComparator otherComp, int otheri)", note: "TextOnlyComparator.rangesEqual"}
  - {class: org.outerj.daisy.diff.html.ancestor.tagtostring.AnchorToString, method: addAttributes, match: "(ChangeText txt, Attributes attributes)", note: "AnchorToString.addAttributes"}
  - {class: org.outerj.daisy.diff.html.ancestor.tagtostring.NoContentTagToString, method: getAddedDescription, match: "(ChangeText txt)", note: "NoContentTagToString.getAddedDescription"}
  - {class: org.outerj.daisy.diff.html.ancestor.tagtostring.NoContentTagToString, method: getRemovedDescription, match: "(ChangeText txt)", note: "NoContentTagToString.getRemovedDescription"}
  - {class: org.outerj.daisy.diff.html.ancestor.tagtostring.TagToString, method: getDescription, match: "()", note: "TagToString.getDescription"}
  - {class: org.outerj.daisy.diff.html.ancestor.tagtostring.TagToString, method: getRemovedDescription, match: "(ChangeText txt)", note: "TagToString.getRemovedDescription"}
  - {class: org.outerj.daisy.diff.html.ancestor.tagtostring.TagToStringFactory, method: create, match: "(TagNode node, Locale locale)", note: "TagToStringFactory.create"}
  - {class: org.outerj.daisy.diff.html.ancestor.tagtostring.TagToStringFactory, method: getChangeSemantic, match: "(String string)", note: "TagToStringFactory.getChangeSemantic"}
  - {class: org.outerj.daisy.diff.html.dom.DomTreeBuilder, method: getBodyNode, match: "()", note: "DomTreeBuilder.getBodyNode"}
  - {class: org.outerj.daisy.diff.html.dom.DomTreeBuilder, method: getTextNodes, match: "()", note: "DomTreeBuilder.getTextNodes"}
  - {class: org.outerj.daisy.diff.html.dom.helper.AttributesMap, method: hasSameAttributes, match: "(Attributes attributes)", note: "AttributesMap.hasSameAttributes"}
  - {class: org.outerj.daisy.diff.html.dom.helper.AttributesMap, method: equivalentStyles, match: "(String style1, String style2)", note: "AttributesMap.equivalentStyles"}
  - {class: org.outerj.daisy.diff.tag.ArgumentComparator, method: getAtom, match: "(int i)", note: "ArgumentComparator.getAtom"}
  - {class: org.outerj.daisy.diff.tag.ArgumentComparator, method: getRangeCount, match: "()", note: "ArgumentComparator.getRangeCount"}
  - {class: org.outerj.daisy.diff.tag.TagComparator, method: getAtoms, match: "()", note: "TagComparator.getAtoms"}
  - {class: org.outerj.daisy.diff.tag.TagComparator, method: substring, match: "(int startAtom, int endAtom)", note: "TagComparator.substring"}
  - {class: org.outerj.daisy.diff.DaisyDiff, method: diffHTML, match: "(InputSource oldSource, InputSource newSource,", note: "DaisyDiff.diffHTML"}
  - {class: org.outerj.daisy.diff.DaisyDiff, method: diffTag, match: "(String oldText, String newText,", note: "DaisyDiff.diffTag"}
  - {class: org.outerj.daisy.diff.HtmlCleaner, method: cleanAndParse, match: "(InputSource source, ContentHandler consumer)", note: "HtmlCleaner.cleanAndParse"}
  - {class: org.outerj.daisy.diff.Main, method: main, match: "(String[] args) throws URISyntaxException", note: "Main.main"}
  - {class: org.outerj.daisy.diff.XslFilter, method: xsl, match: "(ContentHandler consumer, String xslPath)", note: "XslFilter.xsl"}
  - {class: org.outerj.daisy.diff.helper.MergeCharacterEventsHandler, method: characters, match: "(char ch[], int start, int length)", note: "MergeCharacterEventsHandler.characters"}
  - {class: org.outerj.daisy.diff.helper.MergeCharacterEventsHandler, method: endDocument, match: "() throws SAXException", note: "MergeCharacterEventsHandler.endDocument"}
  - {class: org.outerj.daisy.diff.html.HTMLDiffer, method: diff, match: "(TextNodeComparator ancestorComparator, TextNodeComparator leftComparator,", note: "HTMLDiffer.diff"}
  - {class: org.outerj.daisy.diff.html.HTMLDiffer, method: diff, match: "(TextNodeComparator leftComparator,", note: "HTMLDiffer.diff"}
  - {class: org.outerj.daisy.diff.html.HtmlSaxDiffOutput, method: generateOutput, match: "(TagNode node) throws SAXException", note: "HtmlSaxDiffOutput.generateOutput"}
  - {class: org.outerj.daisy.diff.html.ancestor.ChangeText, method: addText, match: "(String s)", note: "ChangeText.addText"}
  - {class: org.outerj.daisy.diff.html.ancestor.ChangeText, method: addHtml, match: "(String s)", note: "ChangeText.addHtml"}
  - {class: org.outerj.daisy.diff.html.ancestor.ChangeTextGenerator, method: getChanged, match: "(RangeDifference... differences)", note: "ChangeTextGenerator.getChanged"}
  - {class: org.outerj.daisy.diff.html.ancestor.ChangeTextGenerator, method: getHtmlLayoutChanges, match: "()", note: "ChangeTextGenerator.getHtmlLayoutChanges"}
  - {class: org.outerj.daisy.diff.html.dom.BodyNode, method: copyTree, match: "()", note: "BodyNode.copyTree"}
  - {class: org.outerj.daisy.diff.html.dom.BodyNode, method: getMinimalDeletedSet, match: "(long id)", note: "BodyNode.getMinimalDeletedSet"}
  - {class: org.outerj.daisy.diff.html.dom.ImageNode, method: isSameText, match: "(Object other)", note: "ImageNode.isSameText"}
  - {class: org.outerj.daisy.diff.html.dom.ImageNode, method: getAttributes, match: "()", note: "ImageNode.getAttributes"}
  - {class: org.outerj.daisy.diff.html.dom.TagNode, method: addChild, match: "(Node node)", note: "TagNode.addChild"}
  - {class: org.outerj.daisy.diff.html.dom.TagNode, method: setRoot, match: "(TagNode root)", note: "TagNode.setRoot"}
  - {class: org.outerj.daisy.diff.html.dom.TextNode, method: copyTree, match: "()", note: "TextNode.copyTree"}
  - {class: org.outerj.daisy.diff.html.dom.TextNode, method: getLeftMostChild, match: "()", note: "TextNode.getLeftMostChild"}
  - {class: org.outerj.daisy.diff.html.dom.WhiteSpaceNode, method: isWhiteSpace, match: "(char c)", note: "WhiteSpaceNode.isWhiteSpace"}
