# Curated performance-mutation sites for zxing (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants zxing --source data/external-src/<checkout> \
#       --sites data/projects/zxing/mutation_sites.yaml

package_root: com.google.zxing

sites:
  - {class: com.google.zxing.BinaryBitmap, method: getWidth, match: "()", note: "BinaryBitmap.getWidth"}
  - {class: com.google.zxing.aztec.decoder.Decoder, method: highLevelDecode, match: "(boolean[] correctedBits) throws FormatException", note: "Decoder.highLevelDecode"}
  - {class: com.google.zxing.client.android.camera.CameraConfigurationUtils, method: setTorch, match: "(Camera.Parameters parameters, boolean on)", note: "CameraConfigurationUtils.setTorch"}
  - {class: com.google.zxing.common.BitArray, method: getSize, match: "()", note: "BitArray.getSize"}
  - {class: com.google.zxing.datamatrix.encoder.ASCIIEncoder, method: getEncodingMode, match: "()", note: "ASCIIEncoder.getEncodingMode"}
  - {class: com.google.zxing.maxicode.MaxiCodeReader, method: reset, match: "()", note: "MaxiCodeReader.reset"}
  - {class: com.google.zxing.multi.ByQuadrantReader, method: reset, match: "()", note: "ByQuadrantReader.reset"}
  - {class: com.google.zxing.oned.rss.RSSUtils, method: getRSSvalue, match: "(int[] widths, int maxWidth, boolean noNarrow)", note: "RSSUtils.getRSSvalue"}
  - {class: com.google.zxing.pdf417.encoder.PDF417HighLevelEncoder, method: checkCharset, match: "(String input, int max, String errorMessage) throws WriterException", note: "PDF417HighLevelEncoder.checkCharset"}
  - {class: com.google.zxing.qrcode.decoder.QRCodeDecoderMetaData, method: isMirrored, match: "()", note: "QRCodeDecoderMetaData.isMirrored"}
  - {class: com.google.zxing.web.LRUMap, method: removeEldestEntry, match: "(Map.Entry<K,V> eldest)", note: "LRUMap.removeEldestEntry"}
  - {class: com.google.zxing.BinaryBitmap, method: getHeight, match: "()", note: "BinaryBitmap.getHeight"}
  - {class: com.google.zxing.aztec.AztecDetectorResult, method: getNbLayers, match: "()", note: "AztecDetectorResult.getNbLayers"}
  - {class: com.google.zxing.client.android.camera.CameraConfigurationUtils, method: setBestExposure, match: "(Camera.Parameters parameters, boolean lightOn)", note: "CameraConfigurationUtils.setBestExposure"}
  - {class: com.google.zxing.common.BitArray, method: getSizeInBytes, match: "()", note: "BitArray.getSizeInBytes"}
  - {class: com.google.zxing.datamatrix.encoder.Base256Encoder, method: getEncodingMode, match: "()", note: "Base256Encoder.getEncodingMode"}
  - {class: com.google.zxing.multi.GenericMultipleBarcodeReader, method: decodeMultiple, match: "(BinaryBitmap image) throws NotFoundException", note: "GenericMultipleBarcodeReader.decodeMultiple"}
  - {class: com.google.zxing.oned.rss.expanded.decoders.AI01320xDecoder, method: addWeightCode, match: "(StringBuilder buf, int weight)", note: "AI01320xDecoder.addWeightCode"}
  - {class: com.google.zxing.pdf417.encoder.PDF417HighLevelEncoder, method: length, match: "()", note: "PDF417HighLevelEncoder.length"}
  - {class: com.google.zxing.qrcode.decoder.QRCodeDecoderMetaData, method: applyMirroredCorrection, match: "(ResultPoint[] points)", note: "QRCodeDecoderMetaData.applyMirroredCorrection"}
  - {class: com.google.zxing.web.OutputUtils, method: arrayToString, match: "(byte[] bytes)", note: "OutputUtils.arrayToString"}
  - {class: com.google.zxing.ChecksumException, method: getChecksumInstance, match: "()", note: "ChecksumException.getChecksumInstance"}
  - {class: com.google.zxing.aztec.AztecDetectorResult, method: getNbDatablocks, match: "()", note: "AztecDetectorResult.getNbDatablocks"}
  - {class: com.google.zxing.client.j2se.BufferedImageLuminanceSource, method: getRow, match: "(int y, byte[] row)", note: "BufferedImageLuminanceSource.getRow"}
  - {class: com.google.zxing.common.CharacterSetECI, method: getValue, match: "()", note: "CharacterSetECI.getValue"}
  - {class: com.google.zxing.datamatrix.encoder.C40Encoder, method: getEncodingMode, match: "()", note: "C40Encoder.getEncodingMode"}
  - {class: com.google.zxing.multi.qrcode.QRCodeMultiReader, method: decodeMultiple, match: "(BinaryBitmap image) throws NotFoundException", note: "QRCodeMultiReader.decodeMultiple"}
  - {class: com.google.zxing.oned.rss.expanded.decoders.AI01320xDecoder, method: checkWeight, match: "(int weight)", note: "AI01320xDecoder.checkWeight"}
  - {class: com.google.zxing.pdf417.PDF417Common, method: getBitCountSum, match: "(int[] moduleBitCount)", note: "PDF417Common.getBitCountSum"}
  - {class: com.google.zxing.qrcode.encoder.Encoder, method: chooseMode, match: "(String content)", note: "Encoder.chooseMode"}
  - {class: com.google.zxing.web.generator.client.PhoneNumberGenerator, method: getName, match: "()", note: "PhoneNumberGenerator.getName"}
  - {class: com.google.zxing.ChecksumException, method: getChecksumInstance, match: "(Throwable cause)", note: "ChecksumException.getChecksumInstance"}
