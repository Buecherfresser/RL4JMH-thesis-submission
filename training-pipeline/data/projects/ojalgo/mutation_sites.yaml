# Curated performance-mutation sites for ojalgo (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants ojalgo --source data/external-src/<checkout> \
#       --sites data/projects/ojalgo/mutation_sites.yaml

package_root: org.ojalgo

sites:
  - {class: org.ojalgo.ProgrammingError, method: throwForIllegalInvocation, match: "()", note: "ProgrammingError.throwForIllegalInvocation"}
  - {class: org.ojalgo.ann.NetworkBuilder, method: layer, match: "(final int outputs)", note: "NetworkBuilder.layer"}
  - {class: org.ojalgo.array.Array1D, method: function, match: "()", note: "Array1D.function"}
  - {class: org.ojalgo.concurrent.MultiviewSet, method: isEmpty, match: "()", note: "MultiviewSet.isEmpty"}
  - {class: org.ojalgo.data.domain.finance.series.AlphaVantageParser, method: getPrice, match: "()", note: "AlphaVantageParser.getPrice"}
  - {class: org.ojalgo.equation.Equation, method: dense, match: "(final int pivot, final int cols)", note: "Equation.dense"}
  - {class: org.ojalgo.function.BigFunction, method: getSet, match: "()", note: "BigFunction.getSet"}
  - {class: org.ojalgo.machine.Hardware, method: from, match: "(final String arch)", note: "Hardware.from"}
  - {class: org.ojalgo.matrix.MatrixC128, method: getArgument, match: "()", note: "MatrixC128.getArgument"}
  - {class: org.ojalgo.netio.EnumeratedColumnsParser, method: delimiter, match: "(final char delimiter)", note: "EnumeratedColumnsParser.delimiter"}
  - {class: org.ojalgo.optimisation.convex.ConvexObjectiveFunction, method: arity, match: "()", note: "ConvexObjectiveFunction.arity"}
  - {class: org.ojalgo.random.FrequencyMap, method: addAll, match: "(final Map<? extends T, ? extends Number> frequencies)", note: "FrequencyMap.addAll"}
  - {class: org.ojalgo.scalar.ComplexNumber, method: cast, match: "(final Comparable<?> number)", note: "ComplexNumber.cast"}
  - {class: org.ojalgo.series.CoordinationSet, method: complete, match: "()", note: "CoordinationSet.complete"}
  - {class: org.ojalgo.structure.WrapperList, method: size, match: "()", note: "WrapperList.size"}
  - {class: org.ojalgo.tensor.AnyTensor, method: getMathType, match: "()", note: "AnyTensor.getMathType"}
  - {class: org.ojalgo.type.ForgetfulMap, method: build, match: "()", note: "ForgetfulMap.build"}
  - {class: org.ojalgo.ProgrammingError, method: throwForMultiplicationNotPossible, match: "()", note: "ProgrammingError.throwForMultiplicationNotPossible"}
  - {class: org.ojalgo.ann.NetworkBuilder, method: layer, match: "(final int outputs, final Activator activator)", note: "NetworkBuilder.layer"}
  - {class: org.ojalgo.array.Array1D, method: getMathType, match: "()", note: "Array1D.getMathType"}
  - {class: org.ojalgo.concurrent.MultiviewSet, method: offer, match: "(final T entry)", note: "MultiviewSet.offer"}
  - {class: org.ojalgo.data.domain.finance.series.AlphaVantageParser, method: testHeader, match: "(final String header)", note: "AlphaVantageParser.testHeader"}
  - {class: org.ojalgo.equation.Equation, method: dense, match: "(final int pivot, final int cols, final DenseArray.Factory<N, ?> factory)", note: "Equation.dense"}
  - {class: org.ojalgo.function.BigFunction, method: nullary, match: "(final BigDecimal value)", note: "BigFunction.nullary"}
  - {class: org.ojalgo.machine.Hardware, method: getArchitecture, match: "()", note: "Hardware.getArchitecture"}
  - {class: org.ojalgo.matrix.MatrixC128, method: getImaginary, match: "()", note: "MatrixC128.getImaginary"}
  - {class: org.ojalgo.netio.EnumeratedColumnsParser, method: strategy, match: "(final ParseStrategy quoted)", note: "EnumeratedColumnsParser.strategy"}
  - {class: org.ojalgo.optimisation.convex.ConvexObjectiveFunction, method: getConstant, match: "()", note: "ConvexObjectiveFunction.getConstant"}
  - {class: org.ojalgo.random.FrequencyMap, method: addAll, match: "(final Set<? extends T> elements, final long count)", note: "FrequencyMap.addAll"}
  - {class: org.ojalgo.scalar.ComplexNumber, method: cast, match: "(final double value)", note: "ComplexNumber.cast"}
  - {class: org.ojalgo.series.CoordinationSet, method: getAllCalendarDates, match: "()", note: "CoordinationSet.getAllCalendarDates"}
  - {class: org.ojalgo.structure.Iterator1D, method: hasPrevious, match: "()", note: "Iterator1D.hasPrevious"}
  - {class: org.ojalgo.tensor.AnyTensor, method: make, match: "(final int... shape)", note: "AnyTensor.make"}
  - {class: org.ojalgo.type.ForgetfulMap, method: build, match: "(final Consumer<V> disposer)", note: "ForgetfulMap.build"}
  - {class: org.ojalgo.RecoverableCondition, method: newEquationSystemNotSolvable, match: "()", note: "RecoverableCondition.newEquationSystemNotSolvable"}
  - {class: org.ojalgo.ann.ArtificialNeuralNetwork, method: invoke, match: "(final Access1D<?> target, final Access1D<?> current)", note: "ArtificialNeuralNetwork.invoke"}
  - {class: org.ojalgo.array.Array2D, method: function, match: "()", note: "Array2D.function"}
  - {class: org.ojalgo.concurrent.DaemonPoolExecutor, method: invoke, match: "(final Callable<T> task)", note: "DaemonPoolExecutor.invoke"}
  - {class: org.ojalgo.data.domain.finance.series.DatePriceParser, method: parse, match: "(final String line)", note: "DatePriceParser.parse"}
  - {class: org.ojalgo.function.ComplexFunction, method: getSet, match: "()", note: "ComplexFunction.getSet"}
  - {class: org.ojalgo.machine.JavaType, method: box, match: "(final Class<?> type)", note: "JavaType.box"}
  - {class: org.ojalgo.matrix.decomposition.DualSparse, method: countNonzeros, match: "()", note: "DualSparse.countNonzeros"}
  - {class: org.ojalgo.netio.LineSplittingParser, method: parse, match: "(final String line)", note: "LineSplittingParser.parse"}
  - {class: org.ojalgo.optimisation.ConfiguredIntegration, method: build, match: "(final ExpressionsBasedModel model)", note: "ConfiguredIntegration.build"}
  - {class: org.ojalgo.random.SampleSet, method: combine, match: "(final CombineableSet<N> other)", note: "SampleSet.combine"}
  - {class: org.ojalgo.scalar.RationalNumber, method: cast, match: "(final Comparable<?> number)", note: "RationalNumber.cast"}
  - {class: org.ojalgo.series.MappedIndexSeries, method: toIndex, match: "(final Double key)", note: "MappedIndexSeries.toIndex"}
  - {class: org.ojalgo.structure.Iterator1D, method: nextIndex, match: "()", note: "Iterator1D.nextIndex"}
  - {class: org.ojalgo.tensor.MatrixTensor, method: getMathType, match: "()", note: "MatrixTensor.getMathType"}
  - {class: org.ojalgo.type.ScheduleBuilder, method: repetition, match: "(final int aRepetitionMeassure, final CalendarDateUnit aRepetitionUnit)", note: "ScheduleBuilder.repetition"}
