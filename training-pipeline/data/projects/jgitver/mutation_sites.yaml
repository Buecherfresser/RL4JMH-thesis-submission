  - {class: fr.brouillard.oss.jgitver.impl.PatternVersionStrategy, method: build, match: "(Commit head, List<Commit> parents) throws VersionCalculationException", note: "PatternVersionStrategy.build"}
  - {class: fr.brouillard.oss.jgitver.impl.PatternVersionStrategy, method: setVersionPattern, match: "(String versionPattern)", note: "PatternVersionStrategy.setVersionPattern"}
  - {class: fr.brouillard.oss.jgitver.impl.PatternVersionStrategy, method: setTagVersionPattern, match: "(String tagVersionPattern)", note: "PatternVersionStrategy.setTagVersionPattern"}
  - {class: fr.brouillard.oss.jgitver.impl.ScriptVersionStrategy, method: build, match: "(Commit head, List<Commit> parents) throws VersionCalculationException", note: "ScriptVersionStrategy.build"}
  - {class: fr.brouillard.oss.jgitver.impl.ScriptVersionStrategy, method: setScriptType, match: "(ScriptType scriptType)", note: "ScriptVersionStrategy.setScriptType"}
  - {class: fr.brouillard.oss.jgitver.impl.ScriptVersionStrategy, method: setScript, match: "(String script)", note: "ScriptVersionStrategy.setScript"}
  - {class: fr.brouillard.oss.jgitver.impl.TagDateExtractor, method: dateOfTagObjectId, match: "(ObjectId tagObjectId) throws IOException", note: "TagDateExtractor.dateOfTagObjectId"}
  - {class: fr.brouillard.oss.jgitver.impl.TagDateExtractor, method: dateOfRef, match: "(Ref r)", note: "TagDateExtractor.dateOfRef"}
  - {class: fr.brouillard.oss.jgitver.impl.TagDateExtractor, method: close, match: "()", note: "TagDateExtractor.close"}
  - {class: fr.brouillard.oss.jgitver.impl.VersionNamingConfiguration, method: getSearchPattern, match: "()", note: "VersionNamingConfiguration.getSearchPattern"}
  - {class: fr.brouillard.oss.jgitver.impl.VersionNamingConfiguration, method: getReplaceVersionRegex, match: "()", note: "VersionNamingConfiguration.getReplaceVersionRegex"}
  - {class: fr.brouillard.oss.jgitver.impl.VersionNamingConfiguration, method: extractVersionFrom, match: "(String tagName)", note: "VersionNamingConfiguration.extractVersionFrom"}
  - {class: fr.brouillard.oss.jgitver.impl.jgit.root.RootCommit, method: createCommit, match: "(AnyObjectId id)", note: "RootCommit.createCommit"}
  - {class: fr.brouillard.oss.jgitver.impl.jgit.root.RootCommit, method: include, match: "(RevWalk walker, RevCommit commit) throws StopWalkException, MissingObjectException, IncorrectObjectTypeException, IOException", note: "RootCommit.include"}
  - {class: fr.brouillard.oss.jgitver.impl.metadata.MetadataHolder, method: registerMetadata, match: "(Metadatas meta, String value)", note: "MetadataHolder.registerMetadata"}
