  - {class: com.oath.halodb.HaloDBOptions, method: setCompactionThresholdPerFile, match: "(double compactionThresholdPerFile)", note: "HaloDBOptions.setCompactionThresholdPerFile"}
  - {class: com.oath.halodb.HaloDBOptions, method: setMaxFileSize, match: "(int maxFileSize)", note: "HaloDBOptions.setMaxFileSize"}
