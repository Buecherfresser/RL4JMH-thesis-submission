# Curated performance-mutation sites for commons-beanutils (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants commons-beanutils --source data/external-src/<checkout> \
#       --sites data/projects/commons-beanutils/mutation_sites.yaml

