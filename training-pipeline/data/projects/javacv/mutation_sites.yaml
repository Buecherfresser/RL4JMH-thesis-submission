  - {class: org.bytedeco.javacv.ColorCalibrator, method: calibrate, match: "(Color[] referenceColors, Color[] deviceColors)", note: "ColorCalibrator.calibrate"}
  - {class: org.bytedeco.javacv.DC1394FrameGrabber, method: getDeviceDescriptions, match: "() throws Exception", note: "DC1394FrameGrabber.getDeviceDescriptions"}
  - {class: org.bytedeco.javacv.DC1394FrameGrabber, method: createDefault, match: "(File deviceFile)   throws Exception", note: "DC1394FrameGrabber.createDefault"}
  - {class: org.bytedeco.javacv.FFmpegFrameFilter, method: tryLoad, match: "() throws Exception", note: "FFmpegFrameFilter.tryLoad"}
