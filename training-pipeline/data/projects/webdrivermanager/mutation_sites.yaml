  - {class: io.github.bonigarcia.wdm.config.Config, method: isNullOrEmpty, match: "(String string)", note: "Config.isNullOrEmpty"}
  - {class: io.github.bonigarcia.wdm.config.ConfigKey, method: getName, match: "()", note: "ConfigKey.getName"}
  - {class: io.github.bonigarcia.wdm.config.ConfigKey, method: getValue, match: "()", note: "ConfigKey.getValue"}
