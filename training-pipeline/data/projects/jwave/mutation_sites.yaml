# Curated performance-mutation sites for jwave (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jwave --source data/external-src/<checkout> \
#       --sites data/projects/jwave/mutation_sites.yaml

package_root: de.graetz23.jwave

sites:
  - {class: de.graetz23.jwave.JWave, method: main, match: "(String[] args)", note: "JWave.main"}
  - {class: de.graetz23.jwave.datatypes.SuperLine, method: init, match: "( ) throws JWaveException", note: "SuperLine.init"}
  - {class: de.graetz23.jwave.exceptions.JWaveException, method: showMessage, match: "( )", note: "JWaveException.showMessage"}
  - {class: de.graetz23.jwave.tools.MathToolKit, method: decompose, match: "( int number ) throws JWaveException", note: "MathToolKit.decompose"}
  - {class: de.graetz23.jwave.transforms.AncientEgyptianDecomposition, method: forward, match: "(double[] arrTime) throws JWaveException", note: "AncientEgyptianDecomposition.forward"}
  - {class: de.graetz23.jwave.Transform, method: forward, match: "(double[] arrTime)", note: "Transform.forward"}
  - {class: de.graetz23.jwave.datatypes.SuperLine, method: getNoOfLines, match: "( )", note: "SuperLine.getNoOfLines"}
  - {class: de.graetz23.jwave.exceptions.JWaveException, method: nuke, match: "( )", note: "JWaveException.nuke"}
  - {class: de.graetz23.jwave.tools.MathToolKit, method: decompose, match: "( int number, int blockSize ) throws JWaveException", note: "MathToolKit.decompose"}
  - {class: de.graetz23.jwave.transforms.AncientEgyptianDecomposition, method: reverse, match: "(double[] arrHilb) throws JWaveException", note: "AncientEgyptianDecomposition.reverse"}
