# Curated performance-mutation sites for ysoserial (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants ysoserial --source data/external-src/<checkout> \
#       --sites data/projects/ysoserial/mutation_sites.yaml

package_root: ysoserial.payloads

sites:
  - {class: ysoserial.payloads.JRMPListener, method: getObject, match: "( final String command ) throws Exception", note: "JRMPListener.getObject"}
  - {class: ysoserial.payloads.util.ClassFiles, method: classAsFile, match: "(final Class<?> clazz)", note: "ClassFiles.classAsFile"}
  - {class: ysoserial.payloads.JRMPListener, method: main, match: "( final String[] args ) throws Exception", note: "JRMPListener.main"}
  - {class: ysoserial.payloads.util.ClassFiles, method: classAsFile, match: "(final Class<?> clazz, boolean suffix)", note: "ClassFiles.classAsFile"}
  - {class: ysoserial.payloads.AspectJWeaver, method: getObject, match: "(final String command) throws Exception", note: "AspectJWeaver.getObject"}
  - {class: ysoserial.payloads.util.Gadgets, method: transform, match: "( DOM document, SerializationHandler[] handlers ) throws TransletException", note: "Gadgets.transform"}
  - {class: ysoserial.payloads.AspectJWeaver, method: main, match: "(String[] args) throws Exception", note: "AspectJWeaver.main"}
  - {class: ysoserial.payloads.util.Gadgets, method: transform, match: "( DOM document, DTMAxisIterator iterator, SerializationHandler handler ) throws TransletException", note: "Gadgets.transform"}
  - {class: ysoserial.payloads.BeanShell1, method: getObject, match: "(String command) throws Exception", note: "BeanShell1.getObject"}
  - {class: ysoserial.payloads.util.JavaVersion, method: getLocalVersion, match: "()", note: "JavaVersion.getLocalVersion"}
  - {class: ysoserial.payloads.BeanShell1, method: main, match: "(final String[] args) throws Exception", note: "BeanShell1.main"}
  - {class: ysoserial.payloads.util.JavaVersion, method: isAnnInvHUniversalMethodImpl, match: "()", note: "JavaVersion.isAnnInvHUniversalMethodImpl"}
  - {class: ysoserial.payloads.C3P0, method: getObject, match: "( String command ) throws Exception", note: "C3P0.getObject"}
  - {class: ysoserial.payloads.util.PayloadRunner, method: run, match: "(final Class<? extends ObjectPayload<?>> clazz, final String[] args) throws Exception", note: "PayloadRunner.run"}
  - {class: ysoserial.payloads.C3P0, method: getReference, match: "() throws NamingException", note: "C3P0.getReference"}
  - {class: ysoserial.payloads.util.PayloadRunner, method: call, match: "() throws Exception", note: "PayloadRunner.call"}
  - {class: ysoserial.payloads.Click1, method: getObject, match: "(final String command) throws Exception", note: "Click1.getObject"}
  - {class: ysoserial.payloads.util.Reflections, method: setAccessible, match: "(AccessibleObject member)", note: "Reflections.setAccessible"}
  - {class: ysoserial.payloads.Click1, method: main, match: "(final String[] args) throws Exception", note: "Click1.main"}
  - {class: ysoserial.payloads.util.Reflections, method: getField, match: "(final Class<?> clazz, final String fieldName)", note: "Reflections.getField"}
  - {class: ysoserial.payloads.Clojure, method: getObject, match: "(final String command) throws Exception", note: "Clojure.getObject"}
  - {class: ysoserial.payloads.Clojure, method: main, match: "(final String[] args) throws Exception", note: "Clojure.main"}
  - {class: ysoserial.payloads.CommonsBeanutils1, method: getObject, match: "(final String command) throws Exception", note: "CommonsBeanutils1.getObject"}
