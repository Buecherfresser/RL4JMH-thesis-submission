# Curated performance-mutation sites for jsr166 (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jsr166 --source data/external-src/<checkout> \
#       --sites data/projects/jsr166/mutation_sites.yaml

package_root: java.util.concurrent

sites:
