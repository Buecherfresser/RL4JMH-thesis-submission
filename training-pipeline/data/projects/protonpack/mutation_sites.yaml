# Curated performance-mutation sites for protonpack (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants protonpack --source data/external-src/<checkout> \
#       --sites data/projects/protonpack/mutation_sites.yaml

package_root: com.codepoetics.protonpack

sites:
  - {class: com.codepoetics.protonpack.ListZippingSpliterator, method: tryAdvance, match: "(Consumer<? super O> action)", note: "ListZippingSpliterator.tryAdvance"}
  - {class: com.codepoetics.protonpack.collectors.CollectorUtils, method: maxBy, match: "(Function<T, Y> projection)", note: "CollectorUtils.maxBy"}
  - {class: com.codepoetics.protonpack.comparators.Comparators, method: toListComparator, match: "(Comparator<? super T> itemComparator)", note: "Comparators.toListComparator"}
  - {class: com.codepoetics.protonpack.maps.DefaultMapStream, method: iterator, match: "()", note: "DefaultMapStream.iterator"}
  - {class: com.codepoetics.protonpack.selectors.Selectors, method: roundRobin, match: "()", note: "Selectors.roundRobin"}
  - {class: com.codepoetics.protonpack.stateful.ComposedStateMachine, method: getInitialState, match: "()", note: "ComposedStateMachine.getInitialState"}
  - {class: com.codepoetics.protonpack.ListZippingSpliterator, method: trySplit, match: "()", note: "ListZippingSpliterator.trySplit"}
  - {class: com.codepoetics.protonpack.collectors.CollectorUtils, method: minBy, match: "(Function<T, Y> projection)", note: "CollectorUtils.minBy"}
  - {class: com.codepoetics.protonpack.maps.DefaultMapStream, method: spliterator, match: "()", note: "DefaultMapStream.spliterator"}
  - {class: com.codepoetics.protonpack.selectors.Selectors, method: apply, match: "(T[] options)", note: "Selectors.apply"}
  - {class: com.codepoetics.protonpack.stateful.ComposedStateMachine, method: apply, match: "(S state, I input)", note: "ComposedStateMachine.apply"}
  - {class: com.codepoetics.protonpack.StreamUtils, method: indices, match: "()", note: "StreamUtils.indices"}
  - {class: com.codepoetics.protonpack.collectors.CompletableFutures, method: toFutureList, match: "()", note: "CompletableFutures.toFutureList"}
  - {class: com.codepoetics.protonpack.stateful.LastMatchingFinderStateMachine, method: apply, match: "(Supplier<Stream<T>> state, T item)", note: "LastMatchingFinderStateMachine.apply"}
  - {class: com.codepoetics.protonpack.StreamUtils, method: zipWithIndex, match: "(Stream<T> source)", note: "StreamUtils.zipWithIndex"}
  - {class: com.codepoetics.protonpack.collectors.CompletableFutures, method: complete, match: "()", note: "CompletableFutures.complete"}
  - {class: com.codepoetics.protonpack.stateful.LastMatchingFinderStateMachine, method: isTerminal, match: "(Supplier<Stream<T>> state)", note: "LastMatchingFinderStateMachine.isTerminal"}
  - {class: com.codepoetics.protonpack.AggregatingSpliterator, method: tryAdvance, match: "(Consumer<? super List<I>> action)", note: "AggregatingSpliterator.tryAdvance"}
  - {class: com.codepoetics.protonpack.collectors.NonUniqueValueException, method: getMessage, match: "()", note: "NonUniqueValueException.getMessage"}
  - {class: com.codepoetics.protonpack.stateful.StateMachineRunner, method: create, match: "(S initialState, StateMachine<S, I, O> stateMachine)", note: "StateMachineRunner.create"}
  - {class: com.codepoetics.protonpack.AggregatingSpliterator, method: trySplit, match: "()", note: "AggregatingSpliterator.trySplit"}
  - {class: com.codepoetics.protonpack.stateful.StateMachineRunner, method: accept, match: "(I input)", note: "StateMachineRunner.accept"}
  - {class: com.codepoetics.protonpack.EmptySeq, method: head, match: "()", note: "EmptySeq.head"}
  - {class: com.codepoetics.protonpack.stateful.StateMachines, method: lastMatchingFinder, match: "(Predicate<T> condition)", note: "StateMachines.lastMatchingFinder"}
  - {class: com.codepoetics.protonpack.EmptySeq, method: tail, match: "()", note: "EmptySeq.tail"}
  - {class: com.codepoetics.protonpack.stateful.StateMachines, method: windowingStateMachine, match: "(int size, Function<Stream<T>, R> reducer)", note: "StateMachines.windowingStateMachine"}
  - {class: com.codepoetics.protonpack.GroupRunsSpliterator, method: tryAdvance, match: "(Consumer<? super List<T>> action)", note: "GroupRunsSpliterator.tryAdvance"}
  - {class: com.codepoetics.protonpack.stateful.StatefulSpliterator, method: getState, match: "()", note: "StatefulSpliterator.getState"}
  - {class: com.codepoetics.protonpack.GroupRunsSpliterator, method: trySplit, match: "()", note: "GroupRunsSpliterator.trySplit"}
  - {class: com.codepoetics.protonpack.stateful.StatefulSpliterator, method: tryAdvance, match: "(Consumer<? super Stream<O>> action)", note: "StatefulSpliterator.tryAdvance"}
  - {class: com.codepoetics.protonpack.Indexed, method: index, match: "(long index, T value)", note: "Indexed.index"}
  - {class: com.codepoetics.protonpack.stateful.Statefully, method: traverse, match: "(Stream<I> input, StateMachine<S, I, O> stateMachine)", note: "Statefully.traverse"}
  - {class: com.codepoetics.protonpack.Indexed, method: mapping, match: "(Function<T, U> mapper)", note: "Indexed.mapping"}
  - {class: com.codepoetics.protonpack.stateful.Statefully, method: transform, match: "(Stream<I> input, StateMachine<S, I, O> stateMachine)", note: "Statefully.transform"}
  - {class: com.codepoetics.protonpack.InterleavingSpliterator, method: interleaving, match: "(Spliterator<T>[] spliterators, Function<T[], Integer> selector)", note: "InterleavingSpliterator.interleaving"}
  - {class: com.codepoetics.protonpack.stateful.SubsetCheckingStateMachine, method: apply, match: "(Set<T> state, T element)", note: "SubsetCheckingStateMachine.apply"}
  - {class: com.codepoetics.protonpack.InterleavingSpliterator, method: tryAdvance, match: "(Consumer<? super T> action)", note: "InterleavingSpliterator.tryAdvance"}
  - {class: com.codepoetics.protonpack.stateful.SubsetCheckingStateMachine, method: isTerminal, match: "(Set<T> state)", note: "SubsetCheckingStateMachine.isTerminal"}
  - {class: com.codepoetics.protonpack.MergingSpliterator, method: merging, match: "(Spliterator<T>[] sources, Supplier<O> unitSupplier, BiFunction<O, T, O> merger)", note: "MergingSpliterator.merging"}
  - {class: com.codepoetics.protonpack.stateful.TaggedValue, method: of, match: "(S tag, T value)", note: "TaggedValue.of"}
  - {class: com.codepoetics.protonpack.MergingSpliterator, method: tryAdvance, match: "(Consumer<? super O> action)", note: "MergingSpliterator.tryAdvance"}
  - {class: com.codepoetics.protonpack.stateful.TaggedValue, method: getTag, match: "()", note: "TaggedValue.getTag"}
  - {class: com.codepoetics.protonpack.PairSeq, method: head, match: "()", note: "PairSeq.head"}
  - {class: com.codepoetics.protonpack.stateful.TaggingStateMachine, method: apply, match: "(S state, T input)", note: "TaggingStateMachine.apply"}
  - {class: com.codepoetics.protonpack.PairSeq, method: tail, match: "()", note: "PairSeq.tail"}
  - {class: com.codepoetics.protonpack.stateful.TaggingStateMachine, method: isTerminal, match: "(S state)", note: "TaggingStateMachine.isTerminal"}
  - {class: com.codepoetics.protonpack.SkipUntilSpliterator, method: tryAdvance, match: "(Consumer<? super T> action)", note: "SkipUntilSpliterator.tryAdvance"}
  - {class: com.codepoetics.protonpack.stateful.TerminatingActionStateMachine, method: apply, match: "(Boolean shouldContinue, T item)", note: "TerminatingActionStateMachine.apply"}
  - {class: com.codepoetics.protonpack.SkipUntilSpliterator, method: forEachRemaining, match: "(Consumer<? super T> action)", note: "SkipUntilSpliterator.forEachRemaining"}
  - {class: com.codepoetics.protonpack.stateful.TerminatingActionStateMachine, method: isTerminal, match: "(Boolean state)", note: "TerminatingActionStateMachine.isTerminal"}
