  - {class: org.xbill.DNS.utils.hexdump, method: dump, match: "(String description, byte[] b, int offset, int length)", note: "hexdump.dump"}
  - {class: org.xbill.DNS.A6Record, method: rdataFromString, match: "(Tokenizer st, Name origin) throws IOException", note: "A6Record.rdataFromString"}
  - {class: org.xbill.DNS.config.PropertyResolverConfigProvider, method: initialize, match: "()", note: "PropertyResolverConfigProvider.initialize"}
  - {class: org.xbill.DNS.dnssec.DefaultTrustAnchorStore, method: find, match: "(Name name, int dclass)", note: "DefaultTrustAnchorStore.find"}
  - {class: org.xbill.DNS.tools.lookup, method: printAnswer, match: "(String name, Lookup lookup)", note: "lookup.printAnswer"}
  - {class: org.xbill.DNS.utils.hexdump, method: dump, match: "(String s, byte[] b)", note: "hexdump.dump"}
  - {class: org.xbill.DNS.AAAARecord, method: rrFromWire, match: "(DNSInput in) throws IOException", note: "AAAARecord.rrFromWire"}
  - {class: org.xbill.DNS.config.PropertyResolverConfigProvider, method: initialize, match: "(String serverName, String searchName, String ndotsName)", note: "PropertyResolverConfigProvider.initialize"}
  - {class: org.xbill.DNS.dnssec.DnsSecVerifier, method: init, match: "(Properties config)", note: "DnsSecVerifier.init"}
  - {class: org.xbill.DNS.tools.lookup, method: main, match: "(String[] args) throws Exception", note: "lookup.main"}
  - {class: org.xbill.DNS.AAAARecord, method: rdataFromString, match: "(Tokenizer st, Name origin) throws IOException", note: "AAAARecord.rdataFromString"}
  - {class: org.xbill.DNS.config.ResolvConfResolverConfigProvider, method: initialize, match: "()", note: "ResolvConfResolverConfigProvider.initialize"}
  - {class: org.xbill.DNS.dnssec.DnsSecVerifier, method: verify, match: "(SRRset rrset, KeyEntry keyRrset, Instant date)", note: "DnsSecVerifier.verify"}
  - {class: org.xbill.DNS.tools.primary, method: main, match: "(String[] args) throws Exception", note: "primary.main"}
  - {class: org.xbill.DNS.AFSDBRecord, method: getSubtype, match: "()", note: "AFSDBRecord.getSubtype"}
  - {class: org.xbill.DNS.config.ResolvConfResolverConfigProvider, method: parseResolvConf, match: "(InputStream in) throws IOException", note: "ResolvConfResolverConfigProvider.parseResolvConf"}
