# Curated performance-mutation sites for jsemver (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jsemver --source data/external-src/<checkout> \
#       --sites data/projects/jsemver/mutation_sites.yaml

package_root: com.github.zafarkhaja

sites:
  - {class: com.github.zafarkhaja.semver.VersionParser, method: isMatchedBy, match: "(Character chr)", note: "VersionParser.isMatchedBy"}
  - {class: com.github.zafarkhaja.semver.VersionParser, method: isMatchedBy, match: "(Character chr)", note: "VersionParser.isMatchedBy"}
  - {class: com.github.zafarkhaja.semver.VersionParser, method: isMatchedBy, match: "(Character chr)", note: "VersionParser.isMatchedBy"}
