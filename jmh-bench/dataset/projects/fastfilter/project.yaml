name: fastfilter
display_name: FastFilter (fastfilter_java)
version: 1.0.2

# Where the pristine, vendored subject-under-test lives (relative to this dir).
# Sources are the published `io.github.fastfilter:fastfilter:1.0.2` sources
# artefact.
source_dir: src/main/java

provenance:
  project: FastFilter for Java
  url: https://github.com/FastFilter/fastfilter_java
  tag: fastfilter_java-1.0.2
  released: 2022-03-15

mutations_patch: mutations.patch
mutants_registry: mutants.yaml
api_surface: api_surface.md

harness_input:
  mode: per_class
  # Every filter family plus the shared hashing/bit-buffer utilities. `tools`
  # holds two `main`-method command-line drivers (a filter-file builder and a
  # password-lookup demo), not library code.
  include_packages:
    - "(root)"
    - bloom
    - cuckoo
    - gcs
    - utils
    - xor
    - xorplus
  name_filter: "(Filter|Bloom|Cuckoo|Xor|Fuse|Hash|BitBuffer|Set|List|Rank|Sort|Utils)"

# FastFilter has no runtime dependencies; the SUT compiles against the JDK alone.
dependencies: []

mutation:
  switch_class: org.fastfilter.jmhbench.MutationSwitch
  arm_property: jmhbench.mutant
  record_property: jmhbench.record
  record_file_property: jmhbench.record.file
  count: 50
  # Per-lookup / per-key methods on top of the generator's shared hot-name
  # list. `mayContain` is the single hottest call in the library — a benchmark
  # probes a filter millions of times per op — so mutants go on construction,
  # sizing and bit-buffer bookkeeping instead.
  skip_methods:
    - mayContain
    - mayContainKey
    - readBit
    - writeBit
    - readNumber
    - writeNumber
    - readGolombRiceCoded
    - writeGolombRiceCoded
    - readEliasDelta
    - writeEliasDelta
    - getFingerprint
    - getHash
    - hash64
    - reduce
    - select
    - rank
    - getAndPartialRank
    - remainingRank
    - unfoldSigned
    - foldSigned
    # Trivial constant-returning metadata on every filter class. Reachable in
    # principle, but no benchmark calls them in its measured loop, so mutants
    # there would be dead weight rather than a test of benchmark coverage.
    - getBitCount
    - supportsAdd
    - supportsRemove
    - getSize
    - load
    - cardinality
