# Curated performance-mutation sites for sparsebitset (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants sparsebitset --source data/external-src/<checkout> \
#       --sites data/projects/sparsebitset/mutation_sites.yaml

package_root: com.zaxxer.sparsebits

