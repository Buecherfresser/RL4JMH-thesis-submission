  - {class: org.apache.commons.io.ByteBuffers, method: littleEndian, match: "(final byte[] array)", note: "ByteBuffers.littleEndian"}
  - {class: org.apache.commons.io.channels.CloseShieldChannel, method: wrap, match: "(final T channel)", note: "CloseShieldChannel.wrap"}
  - {class: org.apache.commons.io.charset.CharsetEncoders, method: toCharsetEncoder, match: "(final CharsetEncoder charsetEncoder, final Supplier<CharsetEncoder> defaultSupplier)", note: "CharsetEncoders.toCharsetEncoder"}
