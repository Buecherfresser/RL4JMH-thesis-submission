  - {class: net.fortuna.ical4j.transform.compliance.DatePropertyRule, method: apply, match: "(DateProperty element)", note: "DatePropertyRule.apply"}
  - {class: net.fortuna.ical4j.util.MapTimeZoneCache, method: getTimezone, match: "(String id, Supplier<VTimeZone> putIfAbsent)", note: "MapTimeZoneCache.getTimezone"}
  - {class: net.fortuna.ical4j.validate.ComponentValidator, method: assertNone, match: "(String componentName, ComponentList<?> components) throws ValidationException", note: "ComponentValidator.assertNone"}
  - {class: net.fortuna.ical4j.agent.VToDoUserAgent, method: publish, match: "(VToDo... component)", note: "VToDoUserAgent.publish"}
  - {class: net.fortuna.ical4j.data.ParserException, method: getLineNo, match: "()", note: "ParserException.getLineNo"}
  - {class: net.fortuna.ical4j.filter.predicate.PropertyInRangeRule, method: test, match: "(T t)", note: "PropertyInRangeRule.test"}
  - {class: net.fortuna.ical4j.model.DateList, method: parse, match: "(String value, ZoneId zoneId)", note: "DateList.parse"}
  - {class: net.fortuna.ical4j.transform.compliance.DatePropertyRule, method: getSupportedType, match: "()", note: "DatePropertyRule.getSupportedType"}
  - {class: net.fortuna.ical4j.util.Numbers, method: parseInt, match: "(final String value)", note: "Numbers.parseInt"}
  - {class: net.fortuna.ical4j.validate.DefaultCalendarValidatorFactory, method: newInstance, match: "()", note: "DefaultCalendarValidatorFactory.newInstance"}
