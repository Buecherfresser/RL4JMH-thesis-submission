# Curated performance-mutation sites for jsonpath (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jsonpath --source data/external-src/<checkout> \
#       --sites data/projects/jsonpath/mutation_sites.yaml

package_root: com.jayway.jsonpath

sites:
  - {class: com.jayway.jsonpath.Configuration, method: setDefaults, match: "(Defaults defaults)", note: "Configuration.setDefaults"}
  - {class: com.jayway.jsonpath.internal.Utils, method: join, match: "(String delimiter, String wrap, Iterable<?> objs)", note: "Utils.join"}
  - {class: com.jayway.jsonpath.matchers.IsJson, method: matchesSafely, match: "(T json)", note: "IsJson.matchesSafely"}
  - {class: com.jayway.jsonpath.spi.mapper.GsonMappingProvider, method: call, match: "()", note: "GsonMappingProvider.call"}
  - {class: com.jayway.jsonpath.Configuration, method: addEvaluationListeners, match: "(EvaluationListener... evaluationListener)", note: "Configuration.addEvaluationListeners"}
  - {class: com.jayway.jsonpath.internal.Utils, method: join, match: "(String delimiter, Iterable<?> objs)", note: "Utils.join"}
  - {class: com.jayway.jsonpath.matchers.IsJson, method: describeTo, match: "(Description description)", note: "IsJson.describeTo"}
  - {class: com.jayway.jsonpath.spi.mapper.GsonMappingProvider, method: call, match: "()", note: "GsonMappingProvider.call"}
  - {class: com.jayway.jsonpath.Criteria, method: apply, match: "(PredicateContext ctx)", note: "Criteria.apply"}
  - {class: com.jayway.jsonpath.internal.function.PassthruPathFunction, method: invoke, match: "(String currentPath, PathRef parent, Object model, EvaluationContext ctx, List<Parameter> parameters)", note: "PassthruPathFunction.invoke"}
  - {class: com.jayway.jsonpath.matchers.JsonPathMatchers, method: hasJsonPath, match: "(String jsonPath)", note: "JsonPathMatchers.hasJsonPath"}
  - {class: com.jayway.jsonpath.spi.mapper.Jackson3MappingProvider, method: map, match: "(Object source, Class<T> targetType, Configuration configuration)", note: "Jackson3MappingProvider.map"}
  - {class: com.jayway.jsonpath.Criteria, method: where, match: "(Path key)", note: "Criteria.where"}
  - {class: com.jayway.jsonpath.internal.function.PathFunctionFactory, method: newFunction, match: "(String name) throws InvalidPathException", note: "PathFunctionFactory.newFunction"}
  - {class: com.jayway.jsonpath.matchers.JsonPathMatchers, method: hasJsonPath, match: "(String jsonPath, Matcher<T> resultMatcher)", note: "JsonPathMatchers.hasJsonPath"}
  - {class: com.jayway.jsonpath.spi.mapper.Jackson3MappingProvider, method: map, match: "(Object source, final TypeRef<T> targetType, Configuration configuration)", note: "Jackson3MappingProvider.map"}
  - {class: com.jayway.jsonpath.InvalidJsonException, method: getJson, match: "()", note: "InvalidJsonException.getJson"}
  - {class: com.jayway.jsonpath.internal.function.json.KeySetFunction, method: invoke, match: "(String currentPath, PathRef parent, Object model, EvaluationContext ctx, List<Parameter> parameters)", note: "KeySetFunction.invoke"}
  - {class: com.jayway.jsonpath.matchers.WithJsonPath, method: matchesSafely, match: "(ReadContext context)", note: "WithJsonPath.matchesSafely"}
  - {class: com.jayway.jsonpath.spi.mapper.JacksonMappingProvider, method: map, match: "(Object source, Class<T> targetType, Configuration configuration)", note: "JacksonMappingProvider.map"}
  - {class: com.jayway.jsonpath.JsonPath, method: getPath, match: "()", note: "JsonPath.getPath"}
  - {class: com.jayway.jsonpath.internal.path.ArrayIndexOperation, method: indexes, match: "()", note: "ArrayIndexOperation.indexes"}
  - {class: com.jayway.jsonpath.matchers.WithJsonPath, method: describeTo, match: "(Description description)", note: "WithJsonPath.describeTo"}
  - {class: com.jayway.jsonpath.spi.mapper.JacksonMappingProvider, method: map, match: "(Object source, final TypeRef<T> targetType, Configuration configuration)", note: "JacksonMappingProvider.map"}
  - {class: com.jayway.jsonpath.JsonPath, method: isPathDefinite, match: "(String path)", note: "JsonPath.isPathDefinite"}
  - {class: com.jayway.jsonpath.internal.path.ArrayIndexOperation, method: isSingleIndexOperation, match: "()", note: "ArrayIndexOperation.isSingleIndexOperation"}
  - {class: com.jayway.jsonpath.matchers.WithoutJsonPath, method: matchesSafely, match: "(ReadContext actual, Description mismatchDescription)", note: "WithoutJsonPath.matchesSafely"}
  - {class: com.jayway.jsonpath.spi.mapper.JakartaMappingProvider, method: map, match: "(Object source, Class<T> targetType, Configuration configuration)", note: "JakartaMappingProvider.map"}
  - {class: com.jayway.jsonpath.PathNotFoundException, method: fillInStackTrace, match: "()", note: "PathNotFoundException.fillInStackTrace"}
  - {class: com.jayway.jsonpath.internal.path.ArrayIndexToken, method: evaluate, match: "(String currentPath, PathRef parent, Object model, EvaluationContextImpl ctx)", note: "ArrayIndexToken.evaluate"}
  - {class: com.jayway.jsonpath.matchers.WithoutJsonPath, method: describeTo, match: "(Description description)", note: "WithoutJsonPath.describeTo"}
  - {class: com.jayway.jsonpath.spi.mapper.JakartaMappingProvider, method: map, match: "(Object source, final TypeRef<T> targetType, Configuration configuration)", note: "JakartaMappingProvider.map"}
  - {class: com.jayway.jsonpath.internal.path.ArrayIndexToken, method: getPathFragment, match: "()", note: "ArrayIndexToken.getPathFragment"}
