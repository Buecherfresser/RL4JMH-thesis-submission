# Curated performance-mutation sites for titanium-json-ld (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants titanium-json-ld --source data/external-src/<checkout> \
#       --sites data/projects/titanium-json-ld/mutation_sites.yaml

package_root: com.apicatalog.jsonld

sites:
  - {class: com.apicatalog.jsonld.Document, method: of, match: "(final TreeIO content)", note: "Document.of"}
  - {class: com.apicatalog.jsonld.compaction.Compaction, method: with, match: "(final Context activeContext, final Options options, final Execution runtime)", note: "Compaction.with"}
  - {class: com.apicatalog.jsonld.context.ContextBuilder, method: with, match: "(", note: "ContextBuilder.with"}
  - {class: com.apicatalog.jsonld.expansion.Expansion, method: Params, match: "(", note: "Expansion.Params"}
  - {class: com.apicatalog.jsonld.flattening.NodeMap, method: find, match: "(String graphName)", note: "NodeMap.find"}
  - {class: com.apicatalog.jsonld.framing.Frame, method: of, match: "(", note: "Frame.of"}
  - {class: com.apicatalog.jsonld.fromrdf.GraphMap, method: keys, match: "(String graphName)", note: "GraphMap.keys"}
  - {class: com.apicatalog.jsonld.lang.BlankNode, method: hasPrefix, match: "(final String value)", note: "BlankNode.hasPrefix"}
  - {class: com.apicatalog.jsonld.loader.CacheLoader, method: loadDocument, match: "(URI url, Options options) throws JsonLdException", note: "CacheLoader.loadDocument"}
