# Curated performance-mutation sites for okapibarcode (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants okapibarcode --source data/external-src/<checkout> \
#       --sites data/projects/okapibarcode/mutation_sites.yaml

package_root: uk.org.okapibarcode

sites:
