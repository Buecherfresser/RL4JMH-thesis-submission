# Curated performance-mutation sites for liqp (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants liqp --source data/external-src/<checkout> \
#       --sites data/projects/liqp/mutation_sites.yaml

package_root: liqp.filters

sites:
  - {class: liqp.filters.Map, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Map.apply"}
  - {class: liqp.filters.date.FuzzyDateDateParser, method: parse, match: "(String valAsString, Locale locale, ZoneId defaultZone)", note: "FuzzyDateDateParser.parse"}
  - {class: liqp.filters.where.JekyllWhereImpl, method: apply, match: "(Object input, Object... params)", note: "JekyllWhereImpl.apply"}
  - {class: liqp.filters.Abs, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Abs.apply"}
  - {class: liqp.filters.date.FuzzyDateDateParser, method: start, match: "()", note: "FuzzyDateDateParser.start"}
  - {class: liqp.filters.where.LiquidWhereImpl, method: apply, match: "(Object input, Object... params)", note: "LiquidWhereImpl.apply"}
  - {class: liqp.filters.Absolute_Url, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Absolute_Url.apply"}
  - {class: liqp.filters.date.Parser, method: parse, match: "(String str, Locale locale, ZoneId defaultZone)", note: "Parser.parse"}
  - {class: liqp.filters.where.PropertyResolverHelper, method: getItemProperty, match: "(TemplateContext context, Object input, Object property)", note: "PropertyResolverHelper.getItemProperty"}
  - {class: liqp.filters.Absolute_Url, method: convertUnicodeURLToAscii, match: "(@SuppressWarnings(\"hiding\") String url) throws URISyntaxException", note: "Absolute_Url.convertUnicodeURLToAscii"}
  - {class: liqp.filters.date.CustomDateFormatRegistry, method: isRegistered, match: "(CustomDateFormatSupport<?> typeSupport)", note: "CustomDateFormatRegistry.isRegistered"}
  - {class: liqp.filters.where.PropertyResolverHelper, method: support, match: "(Object target)", note: "PropertyResolverHelper.support"}
  - {class: liqp.filters.Append, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Append.apply"}
  - {class: liqp.filters.date.CustomDateFormatRegistry, method: isCustomDateType, match: "(Object value)", note: "CustomDateFormatRegistry.isCustomDateType"}
  - {class: liqp.filters.At_Least, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "At_Least.apply"}
  - {class: liqp.filters.At_Most, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "At_Most.apply"}
  - {class: liqp.filters.Capitalize, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Capitalize.apply"}
  - {class: liqp.filters.Ceil, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Ceil.apply"}
  - {class: liqp.filters.Compact, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Compact.apply"}
  - {class: liqp.filters.Concat, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Concat.apply"}
  - {class: liqp.filters.Date, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Date.apply"}
  - {class: liqp.filters.Date, method: addDatePattern, match: "(String pattern)", note: "Date.addDatePattern"}
  - {class: liqp.filters.Default, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Default.apply"}
  - {class: liqp.filters.Divided_By, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Divided_By.apply"}
  - {class: liqp.filters.Downcase, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Downcase.apply"}
  - {class: liqp.filters.Escape, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Escape.apply"}
  - {class: liqp.filters.Escape_Once, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Escape_Once.apply"}
  - {class: liqp.filters.Filters, method: of, match: "(Collection<Filter> filters)", note: "Filters.of"}
  - {class: liqp.filters.Filters, method: of, match: "(Map<String, Filter> filters)", note: "Filters.of"}
  - {class: liqp.filters.First, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "First.apply"}
  - {class: liqp.filters.Floor, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Floor.apply"}
  - {class: liqp.filters.H, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "H.apply"}
  - {class: liqp.filters.Join, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Join.apply"}
  - {class: liqp.filters.Json, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Json.apply"}
  - {class: liqp.filters.Last, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Last.apply"}
  - {class: liqp.filters.Lstrip, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Lstrip.apply"}
  - {class: liqp.filters.Minus, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Minus.apply"}
  - {class: liqp.filters.Modulo, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Modulo.apply"}
  - {class: liqp.filters.Newline_To_Br, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Newline_To_Br.apply"}
  - {class: liqp.filters.Normalize_Whitespace, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Normalize_Whitespace.apply"}
  - {class: liqp.filters.Plus, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Plus.apply"}
  - {class: liqp.filters.Pop, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Pop.apply"}
  - {class: liqp.filters.Prepend, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Prepend.apply"}
  - {class: liqp.filters.Push, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Push.apply"}
  - {class: liqp.filters.Relative_Url, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Relative_Url.apply"}
  - {class: liqp.filters.Relative_Url, method: getRelativeUrl, match: "(TemplateContext context, String baseUrl, String valAsString)", note: "Relative_Url.getRelativeUrl"}
  - {class: liqp.filters.Remove, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Remove.apply"}
  - {class: liqp.filters.Remove_First, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Remove_First.apply"}
  - {class: liqp.filters.Replace, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Replace.apply"}
  - {class: liqp.filters.Replace_First, method: apply, match: "(Object value, TemplateContext context, Object... params)", note: "Replace_First.apply"}
