# Curated performance-mutation sites for weixin-popular (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants weixin-popular --source data/external-src/<checkout> \
#       --sites data/projects/weixin-popular/mutation_sites.yaml

package_root: weixin.popular.bean

