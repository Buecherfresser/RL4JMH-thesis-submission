# Curated performance-mutation sites for jackson-databind (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jackson-databind --source data/external-src/<checkout> \
#       --sites data/projects/jackson-databind/mutation_sites.yaml

package_root: tools.jackson.databind

sites:
  - {class: tools.jackson.databind.MapperFeature, method: collectLongDefaults, match: "()", note: "MapperFeature.collectLongDefaults"}
  - {class: tools.jackson.databind.cfg.BaseSettings, method: withAnnotationIntrospector, match: "(AnnotationIntrospector ai)", note: "BaseSettings.withAnnotationIntrospector"}
  - {class: tools.jackson.databind.deser.BeanDeserializerBuilder, method: addOrReplaceProperty, match: "(SettableBeanProperty prop, boolean allowOverride)", note: "BeanDeserializerBuilder.addOrReplaceProperty"}
  - {class: tools.jackson.databind.exc.CollectedProblem, method: getPath, match: "()", note: "CollectedProblem.getPath"}
  - {class: tools.jackson.databind.ext.javatime.deser.JSR310StringParsableDeserializer, method: createDeserializer, match: "(Class<T> type, int typeId)", note: "JSR310StringParsableDeserializer.createDeserializer"}
  - {class: tools.jackson.databind.introspect.AnnotatedMethodMap, method: size, match: "()", note: "AnnotatedMethodMap.size"}
  - {class: tools.jackson.databind.json.JsonMapper, method: build, match: "()", note: "JsonMapper.build"}
  - {class: tools.jackson.databind.jsonFormatVisitors.JsonFormatTypes, method: value, match: "()", note: "JsonFormatTypes.value"}
  - {class: tools.jackson.databind.jsontype.impl.AsArrayTypeDeserializer, method: forProperty, match: "(BeanProperty prop)", note: "AsArrayTypeDeserializer.forProperty"}
  - {class: tools.jackson.databind.module.SimpleAbstractTypeResolver, method: addMapping, match: "(Class<T> superType, Class<? extends T> subType)", note: "SimpleAbstractTypeResolver.addMapping"}
  - {class: tools.jackson.databind.node.ArrayNode, method: _at, match: "(JsonPointer ptr)", note: "ArrayNode._at"}
  - {class: tools.jackson.databind.ser.BeanSerializerBuilder, method: setProperties, match: "(List<BeanPropertyWriter> properties)", note: "BeanSerializerBuilder.setProperties"}
  - {class: tools.jackson.databind.type.ArrayType, method: construct, match: "(JavaType componentType, TypeBindings bindings)", note: "ArrayType.construct"}
  - {class: tools.jackson.databind.util.ArrayBuilders, method: getBooleanBuilder, match: "()", note: "ArrayBuilders.getBooleanBuilder"}
  - {class: tools.jackson.databind.MapperFeature, method: enabledByDefault, match: "()", note: "MapperFeature.enabledByDefault"}
  - {class: tools.jackson.databind.cfg.BaseSettings, method: withInsertedAnnotationIntrospector, match: "(AnnotationIntrospector ai)", note: "BaseSettings.withInsertedAnnotationIntrospector"}
  - {class: tools.jackson.databind.deser.BeanDeserializerBuilder, method: addProperty, match: "(SettableBeanProperty prop)", note: "BeanDeserializerBuilder.addProperty"}
  - {class: tools.jackson.databind.exc.CollectedProblem, method: getMessage, match: "()", note: "CollectedProblem.getMessage"}
  - {class: tools.jackson.databind.ext.javatime.deser.JSR310StringParsableDeserializer, method: withLeniency, match: "(Boolean leniency)", note: "JSR310StringParsableDeserializer.withLeniency"}
  - {class: tools.jackson.databind.introspect.AnnotatedMethodMap, method: find, match: "(String name, Class<?>[] paramTypes)", note: "AnnotatedMethodMap.find"}
  - {class: tools.jackson.databind.json.JsonMapper, method: _saveState, match: "()", note: "JsonMapper._saveState"}
  - {class: tools.jackson.databind.jsonFormatVisitors.JsonFormatTypes, method: forValue, match: "(String s)", note: "JsonFormatTypes.forValue"}
  - {class: tools.jackson.databind.jsontype.impl.AsArrayTypeDeserializer, method: getTypeInclusion, match: "()", note: "AsArrayTypeDeserializer.getTypeInclusion"}
  - {class: tools.jackson.databind.module.SimpleAbstractTypeResolver, method: findTypeMapping, match: "(DeserializationConfig config, JavaType type)", note: "SimpleAbstractTypeResolver.findTypeMapping"}
  - {class: tools.jackson.databind.node.ArrayNode, method: _removeAt, match: "(JsonPointer ptr)", note: "ArrayNode._removeAt"}
  - {class: tools.jackson.databind.ser.BeanSerializerBuilder, method: setFilteredProperties, match: "(BeanPropertyWriter[] properties)", note: "BeanSerializerBuilder.setFilteredProperties"}
  - {class: tools.jackson.databind.type.ArrayType, method: construct, match: "(JavaType componentType, TypeBindings bindings,", note: "ArrayType.construct"}
  - {class: tools.jackson.databind.util.ArrayBuilders, method: getByteBuilder, match: "()", note: "ArrayBuilders.getByteBuilder"}
  - {class: tools.jackson.databind.MappingIterator, method: emptyIterator, match: "()", note: "MappingIterator.emptyIterator"}
  - {class: tools.jackson.databind.cfg.GeneratorSettings, method: empty, match: "()", note: "GeneratorSettings.empty"}
  - {class: tools.jackson.databind.deser.bean.BeanAsArrayBuilderDeserializer, method: unwrappingDeserializer, match: "(DeserializationContext ctxt,", note: "BeanAsArrayBuilderDeserializer.unwrappingDeserializer"}
  - {class: tools.jackson.databind.exc.DeferredBindingException, method: getProblems, match: "()", note: "DeferredBindingException.getProblems"}
  - {class: tools.jackson.databind.ext.javatime.util.DecimalUtils, method: toDecimal, match: "(long seconds, int nanoseconds)", note: "DecimalUtils.toDecimal"}
  - {class: tools.jackson.databind.introspect.AnnotationMap, method: of, match: "(Class<?> type, Annotation value)", note: "AnnotationMap.of"}
  - {class: tools.jackson.databind.jsontype.impl.AsArrayTypeSerializer, method: forProperty, match: "(SerializationContext ctxt,", note: "AsArrayTypeSerializer.forProperty"}
  - {class: tools.jackson.databind.module.SimpleDeserializers, method: addDeserializer, match: "(Class<T> forClass, ValueDeserializer<? extends T> deser)", note: "SimpleDeserializers.addDeserializer"}
  - {class: tools.jackson.databind.node.StringNode, method: valueOf, match: "(String v)", note: "StringNode.valueOf"}
  - {class: tools.jackson.databind.ser.PropertyBuilder, method: getClassAnnotations, match: "()", note: "PropertyBuilder.getClassAnnotations"}
  - {class: tools.jackson.databind.type.MapLikeType, method: upgradeFrom, match: "(JavaType baseType, JavaType keyT,", note: "MapLikeType.upgradeFrom"}
  - {class: tools.jackson.databind.util.BeanUtil, method: stdManglePropertyName, match: "(final String basename, final int offset)", note: "BeanUtil.stdManglePropertyName"}
  - {class: tools.jackson.databind.MappingIterator, method: close, match: "()", note: "MappingIterator.close"}
  - {class: tools.jackson.databind.cfg.GeneratorSettings, method: with, match: "(PrettyPrinter pp)", note: "GeneratorSettings.with"}
  - {class: tools.jackson.databind.deser.bean.BeanAsArrayBuilderDeserializer, method: withObjectIdReader, match: "(ObjectIdReader oir)", note: "BeanAsArrayBuilderDeserializer.withObjectIdReader"}
  - {class: tools.jackson.databind.exc.DeferredBindingException, method: getProblemCount, match: "()", note: "DeferredBindingException.getProblemCount"}
  - {class: tools.jackson.databind.ext.javatime.util.DecimalUtils, method: toBigDecimal, match: "(long seconds, int nanoseconds)", note: "DecimalUtils.toBigDecimal"}
  - {class: tools.jackson.databind.introspect.AnnotationMap, method: of, match: "(Collection<Annotation> rawAnnotations)", note: "AnnotationMap.of"}
  - {class: tools.jackson.databind.jsontype.impl.AsArrayTypeSerializer, method: getTypeInclusion, match: "()", note: "AsArrayTypeSerializer.getTypeInclusion"}
  - {class: tools.jackson.databind.module.SimpleDeserializers, method: addDeserializers, match: "(Map<Class<?>,ValueDeserializer<?>> desers)", note: "SimpleDeserializers.addDeserializers"}
  - {class: tools.jackson.databind.node.StringNode, method: getNodeType, match: "()", note: "StringNode.getNodeType"}
  - {class: tools.jackson.databind.ser.PropertyBuilder, method: buildWriter, match: "(SerializationContext ctxt,", note: "PropertyBuilder.buildWriter"}
