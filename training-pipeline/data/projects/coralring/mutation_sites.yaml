  - {class: com.coralblocks.coralring.example.ring.BasicWaitingBroadcastRingConsumer, method: main, match: "(String[] args)", note: "BasicWaitingBroadcastRingConsumer.main"}
  - {class: com.coralblocks.coralring.memory.SharedMemory, method: getFilename, match: "()", note: "SharedMemory.getFilename"}
  - {class: com.coralblocks.coralring.ring.NonWaitingRingProducer, method: setLastOfferedSequence, match: "(long lastOfferedSeq)", note: "NonWaitingRingProducer.setLastOfferedSequence"}
