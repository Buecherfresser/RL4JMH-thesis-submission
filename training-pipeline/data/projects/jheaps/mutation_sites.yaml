# Curated performance-mutation sites for jheaps (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jheaps --source data/external-src/<checkout> \
#       --sites data/projects/jheaps/mutation_sites.yaml

package_root: org.jheaps

sites:
  - {class: org.jheaps.array.BinaryArrayAddressableHeap, method: heapify, match: "(K[] keys, V[] values)", note: "BinaryArrayAddressableHeap.heapify"}
