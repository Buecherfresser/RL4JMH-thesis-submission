# Curated performance-mutation sites for cactoos (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants cactoos --source data/external-src/<checkout> \
#       --sites data/projects/cactoos/mutation_sites.yaml

package_root: org.cactoos.io

sites:
  - {class: org.cactoos.io.CloseShieldInputStream, method: close, match: "()", note: "CloseShieldInputStream.close"}
  - {class: org.cactoos.io.CloseShieldInputStream, method: mark, match: "(final int limit)", note: "CloseShieldInputStream.mark"}
  - {class: org.cactoos.io.CloseShieldOutputStream, method: close, match: "()", note: "CloseShieldOutputStream.close"}
  - {class: org.cactoos.io.HeadInputStream, method: reset, match: "() throws IOException", note: "HeadInputStream.reset"}
  - {class: org.cactoos.io.HeadInputStream, method: close, match: "() throws IOException", note: "HeadInputStream.close"}
  - {class: org.cactoos.io.InputStreamOf, method: close, match: "() throws IOException", note: "InputStreamOf.close"}
  - {class: org.cactoos.io.InputStreamOf, method: mark, match: "(final int limit)", note: "InputStreamOf.mark"}
  - {class: org.cactoos.io.LoggingInputStream, method: close, match: "() throws IOException", note: "LoggingInputStream.close"}
  - {class: org.cactoos.io.LoggingInputStream, method: mark, match: "(final int limit)", note: "LoggingInputStream.mark"}
  - {class: org.cactoos.io.LoggingOutputStream, method: close, match: "() throws IOException", note: "LoggingOutputStream.close"}
  - {class: org.cactoos.io.OutputStreamTo, method: close, match: "() throws IOException", note: "OutputStreamTo.close"}
  - {class: org.cactoos.io.TeeInputStream, method: close, match: "() throws IOException", note: "TeeInputStream.close"}
  - {class: org.cactoos.io.TeeInputStream, method: mark, match: "(final int limit)", note: "TeeInputStream.mark"}
