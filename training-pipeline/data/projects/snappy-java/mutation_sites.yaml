# Curated performance-mutation sites for snappy-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants snappy-java --source data/external-src/<checkout> \
#       --sites data/projects/snappy-java/mutation_sites.yaml

package_root: org.xerial.snappy

sites:
  - {class: org.xerial.snappy.SnappyFramedInputStream, method: isOpen, match: "()", note: "SnappyFramedInputStream.isOpen"}
  - {class: org.xerial.snappy.buffer.CachedBufferAllocator, method: getBufferAllocator, match: "(int bufferSize)", note: "CachedBufferAllocator.getBufferAllocator"}
  - {class: org.xerial.snappy.pool.CachingBufferPool, method: create, match: "(int size)", note: "CachingBufferPool.create"}
  - {class: org.xerial.snappy.SnappyFramedInputStream, method: transferTo, match: "(OutputStream os)", note: "SnappyFramedInputStream.transferTo"}
  - {class: org.xerial.snappy.buffer.CachedBufferAllocator, method: setBufferAllocatorFactory, match: "(BufferAllocatorFactory factory)", note: "CachedBufferAllocator.setBufferAllocatorFactory"}
  - {class: org.xerial.snappy.pool.CachingBufferPool, method: create, match: "(int size)", note: "CachingBufferPool.create"}
  - {class: org.xerial.snappy.SnappyFramedInputStream, method: transferTo, match: "(WritableByteChannel wbc)", note: "SnappyFramedInputStream.transferTo"}
  - {class: org.xerial.snappy.buffer.CachedBufferAllocator, method: getBufferAllocatorFactory, match: "()", note: "CachedBufferAllocator.getBufferAllocatorFactory"}
  - {class: org.xerial.snappy.pool.CachingBufferPool, method: getInstance, match: "()", note: "CachingBufferPool.getInstance"}
  - {class: org.xerial.snappy.SnappyFramedOutputStream, method: isOpen, match: "()", note: "SnappyFramedOutputStream.isOpen"}
  - {class: org.xerial.snappy.buffer.DefaultBufferAllocator, method: getBufferAllocator, match: "(int bufferSize)", note: "DefaultBufferAllocator.getBufferAllocator"}
  - {class: org.xerial.snappy.pool.DirectByteBuffers, method: run, match: "() throws Exception", note: "DirectByteBuffers.run"}
  - {class: org.xerial.snappy.SnappyFramedOutputStream, method: transferFrom, match: "(InputStream is)", note: "SnappyFramedOutputStream.transferFrom"}
  - {class: org.xerial.snappy.buffer.DefaultBufferAllocator, method: allocate, match: "(int size)", note: "DefaultBufferAllocator.allocate"}
  - {class: org.xerial.snappy.pool.DirectByteBuffers, method: releaseDirectByteBuffer, match: "(final ByteBuffer buffer)", note: "DirectByteBuffers.releaseDirectByteBuffer"}
  - {class: org.xerial.snappy.SnappyFramedOutputStream, method: transferFrom, match: "(ReadableByteChannel rbc)", note: "SnappyFramedOutputStream.transferFrom"}
  - {class: org.xerial.snappy.buffer.DefaultBufferAllocator, method: release, match: "(byte[] buffer)", note: "DefaultBufferAllocator.release"}
  - {class: org.xerial.snappy.pool.DirectByteBuffers, method: run, match: "() throws Exception", note: "DirectByteBuffers.run"}
  - {class: org.xerial.snappy.SnappyHadoopCompatibleOutputStream, method: writeHeader, match: "()", note: "SnappyHadoopCompatibleOutputStream.writeHeader"}
