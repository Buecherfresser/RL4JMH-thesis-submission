  - {class: org.roaringbitmap.BitmapContainer, method: and, match: "(final ArrayContainer value2)", note: "BitmapContainer.and"}
  - {class: org.roaringbitmap.BitmapContainer, method: andNot, match: "(final ArrayContainer value2)", note: "BitmapContainer.andNot"}
  - {class: org.roaringbitmap.BitmapContainer, method: lazyor, match: "(ArrayContainer value2)", note: "BitmapContainer.lazyor"}
  - {class: org.roaringbitmap.RunContainer, method: and, match: "(ArrayContainer x)", note: "RunContainer.and"}
  - {class: org.roaringbitmap.RunContainer, method: andNot, match: "(ArrayContainer x)", note: "RunContainer.andNot"}
  - {class: org.roaringbitmap.RunContainer, method: lazyor, match: "(ArrayContainer x)", note: "RunContainer.lazyor"}
  - {class: org.roaringbitmap.Util, method: unsignedBinarySearch, match: "( final char[] array, final int begin, final int end, final char k)", note: "Util.unsignedBinarySearch"}
  - {class: org.roaringbitmap.Util, method: advanceUntil, match: "(char[] array, int pos, int length, char min)", note: "Util.advanceUntil"}
  - {class: org.roaringbitmap.Util, method: branchyUnsignedBinarySearch, match: "( final char[] array, final int begin, final int end, final char k)", note: "Util.branchyUnsignedBinarySearch"}
  - {class: org.roaringbitmap.BitSetUtil, method: arrayContainerBufferOf, match: "( final int from, final int to, final int cardinality, final long[] words)", note: "BitSetUtil.arrayContainerBufferOf"}
  - {class: org.roaringbitmap.ArrayContainer, method: or, match: "(final ArrayContainer value2)", note: "ArrayContainer.or"}
  - {class: org.roaringbitmap.ArrayContainer, method: repairAfterLazy, match: "()", note: "ArrayContainer.repairAfterLazy"}
  - {class: org.roaringbitmap.ArrayContainer, method: runOptimize, match: "()", note: "ArrayContainer.runOptimize"}
  - {class: org.roaringbitmap.ArrayContainer, method: xor, match: "(final ArrayContainer value2)", note: "ArrayContainer.xor"}
  - {class: org.roaringbitmap.BitmapContainer, method: or, match: "(final ArrayContainer value2)", note: "BitmapContainer.or"}
  - {class: org.roaringbitmap.BitmapContainer, method: repairAfterLazy, match: "()", note: "BitmapContainer.repairAfterLazy"}
