# Curated performance-mutation sites for littleproxy (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants littleproxy --source data/external-src/<checkout> \
#       --sites data/projects/littleproxy/mutation_sites.yaml

package_root: org.littleshoot.proxy

sites:
  - {class: org.littleshoot.proxy.ActivityTrackerAdapter, method: bytesReceivedFromClient, match: "(FlowContext flowContext,", note: "ActivityTrackerAdapter.bytesReceivedFromClient"}
  - {class: org.littleshoot.proxy.extras.SelfSignedMitmManager, method: serverSslEngine, match: "(String peerHost, int peerPort)", note: "SelfSignedMitmManager.serverSslEngine"}
  - {class: org.littleshoot.proxy.impl.NetworkUtils, method: getLocalHost, match: "() throws UnknownHostException", note: "NetworkUtils.getLocalHost"}
  - {class: org.littleshoot.proxy.ActivityTrackerAdapter, method: requestReceivedFromClient, match: "(FlowContext flowContext,", note: "ActivityTrackerAdapter.requestReceivedFromClient"}
  - {class: org.littleshoot.proxy.extras.SelfSignedMitmManager, method: serverSslEngine, match: "()", note: "SelfSignedMitmManager.serverSslEngine"}
  - {class: org.littleshoot.proxy.impl.NetworkUtils, method: firstLocalNonLoopbackIpv4Address, match: "()", note: "NetworkUtils.firstLocalNonLoopbackIpv4Address"}
  - {class: org.littleshoot.proxy.ActivityTrackerAdapter, method: bytesSentToServer, match: "(FullFlowContext flowContext, int numberOfBytes)", note: "ActivityTrackerAdapter.bytesSentToServer"}
  - {class: org.littleshoot.proxy.extras.SelfSignedMitmManager, method: clientSslEngineFor, match: "(HttpRequest httpRequest, SSLSession serverSslSession)", note: "SelfSignedMitmManager.clientSslEngineFor"}
  - {class: org.littleshoot.proxy.impl.ProxyUtils, method: stripHost, match: "(final String uri)", note: "ProxyUtils.stripHost"}
