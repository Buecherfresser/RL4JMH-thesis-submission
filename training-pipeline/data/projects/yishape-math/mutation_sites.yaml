# Curated performance-mutation sites for yishape-math (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants yishape-math --source data/external-src/<checkout> \
#       --sites data/projects/yishape-math/mutation_sites.yaml

package_root: com.yishape.lab

sites:
  - {class: com.yishape.lab.math.RereMathUtil, method: floatToDouble, match: "(float[] array)", note: "RereMathUtil.floatToDouble"}
  - {class: com.yishape.lab.util.JsonUtil, method: toJson, match: "(Map<String, Object> map)", note: "JsonUtil.toJson"}
  - {class: com.yishape.lab.math.RereMathUtil, method: doubleToFloat, match: "(double[] array)", note: "RereMathUtil.doubleToFloat"}
  - {class: com.yishape.lab.util.JsonUtil, method: fromJson, match: "(String json)", note: "JsonUtil.fromJson"}
  - {class: com.yishape.lab.math.YishapeMath, method: main, match: "(String[] args)", note: "YishapeMath.main"}
  - {class: com.yishape.lab.util.ReportBuilder, method: rule, match: "()", note: "ReportBuilder.rule"}
  - {class: com.yishape.lab.math.autodiff.impl.AutodiffBufferPool, method: acquire, match: "(int minSize)", note: "AutodiffBufferPool.acquire"}
