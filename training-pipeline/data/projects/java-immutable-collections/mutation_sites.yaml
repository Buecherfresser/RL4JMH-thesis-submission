  - {class: org.javimmutable.collections.common.ArrayToMapAdaptor, method: size, match: "()", note: "ArrayToMapAdaptor.size"}
  - {class: org.javimmutable.collections.deque.ReverseBuilder, method: checkInvariants, match: "()", note: "ReverseBuilder.checkInvariants"}
  - {class: org.javimmutable.collections.hash.EmptyHashSet, method: emptyMutableSet, match: "()", note: "EmptyHashSet.emptyMutableSet"}
  - {class: org.javimmutable.collections.indexed.IndexedList, method: retained, match: "(List<? extends T> values)", note: "IndexedList.retained"}
  - {class: org.javimmutable.collections.inorder.OrderedSet, method: builder, match: "()", note: "OrderedSet.builder"}
