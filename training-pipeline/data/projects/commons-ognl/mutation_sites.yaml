  - {class: org.apache.commons.ognl.ASTAssign, method: getValueBody, match: "( OgnlContext context, Object source )", note: "ASTAssign.getValueBody"}
  - {class: org.apache.commons.ognl.ASTAssign, method: toGetSourceString, match: "( OgnlContext context, Object target )", note: "ASTAssign.toGetSourceString"}
  - {class: org.apache.commons.ognl.ASTBitAnd, method: jjtClose, match: "()", note: "ASTBitAnd.jjtClose"}
  - {class: org.apache.commons.ognl.ASTBitAnd, method: getValueBody, match: "( OgnlContext context, Object source )", note: "ASTBitAnd.getValueBody"}
  - {class: org.apache.commons.ognl.ASTBitNegate, method: getValueBody, match: "( OgnlContext context, Object source )", note: "ASTBitNegate.getValueBody"}
  - {class: org.apache.commons.ognl.ASTBitNegate, method: toGetSourceString, match: "( OgnlContext context, Object target )", note: "ASTBitNegate.toGetSourceString"}
  - {class: org.apache.commons.ognl.ASTBitOr, method: jjtClose, match: "()", note: "ASTBitOr.jjtClose"}
  - {class: org.apache.commons.ognl.ASTBitOr, method: getValueBody, match: "( OgnlContext context, Object source )", note: "ASTBitOr.getValueBody"}
  - {class: org.apache.commons.ognl.ASTChain, method: getLastExpression, match: "()", note: "ASTChain.getLastExpression"}
  - {class: org.apache.commons.ognl.ASTChain, method: getCoreExpression, match: "()", note: "ASTChain.getCoreExpression"}
  - {class: org.apache.commons.ognl.ASTConst, method: setValue, match: "( Object value )", note: "ASTConst.setValue"}
  - {class: org.apache.commons.ognl.ASTConst, method: getValue, match: "()", note: "ASTConst.getValue"}
  - {class: org.apache.commons.ognl.ASTCtor, method: isArray, match: "()", note: "ASTCtor.isArray"}
  - {class: org.apache.commons.ognl.ASTCtor, method: getValueBody, match: "( OgnlContext context, Object source )", note: "ASTCtor.getValueBody"}
  - {class: org.apache.commons.ognl.ASTDivide, method: getValueBody, match: "( OgnlContext context, Object source )", note: "ASTDivide.getValueBody"}
  - {class: org.apache.commons.ognl.ASTDivide, method: getExpressionOperator, match: "( int index )", note: "ASTDivide.getExpressionOperator"}
