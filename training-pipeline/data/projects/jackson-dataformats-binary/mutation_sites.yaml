  - {class: tools.jackson.dataformat.ion.polymorphism.IonAnnotationTypeResolverBuilder, method: getDefaultImpl, match: "()", note: "IonAnnotationTypeResolverBuilder.getDefaultImpl"}
  - {class: tools.jackson.dataformat.smile.async.NonBlockingByteArrayParser, method: nonBlockingInputFeeder, match: "()", note: "NonBlockingByteArrayParser.nonBlockingInputFeeder"}
  - {class: tools.jackson.dataformat.avro.deser.JacksonAvroParserImpl, method: _releaseBuffers, match: "()", note: "JacksonAvroParserImpl._releaseBuffers"}
  - {class: tools.jackson.dataformat.cbor.CBORFactory, method: rebuild, match: "()", note: "CBORFactory.rebuild"}
  - {class: tools.jackson.dataformat.ion.EnumAsIonSymbolModule, method: setupModule, match: "(SetupContext context)", note: "EnumAsIonSymbolModule.setupModule"}
  - {class: tools.jackson.dataformat.smile.async.NonBlockingByteArrayParser, method: needMoreInput, match: "()", note: "NonBlockingByteArrayParser.needMoreInput"}
  - {class: tools.jackson.dataformat.avro.deser.JacksonAvroParserImpl, method: streamReadInputSource, match: "()", note: "JacksonAvroParserImpl.streamReadInputSource"}
  - {class: tools.jackson.dataformat.cbor.CBORFactory, method: builder, match: "()", note: "CBORFactory.builder"}
  - {class: tools.jackson.dataformat.ion.EnumAsIonSymbolModule, method: getModuleName, match: "()", note: "EnumAsIonSymbolModule.getModuleName"}
  - {class: tools.jackson.dataformat.smile.SmileFactory, method: rebuild, match: "()", note: "SmileFactory.rebuild"}
  - {class: tools.jackson.dataformat.avro.deser.ScalarDecoderWrapper, method: newReader, match: "(AvroReadContext parent, AvroParserImpl parser)", note: "ScalarDecoderWrapper.newReader"}
  - {class: tools.jackson.dataformat.cbor.CBORGenerator, method: version, match: "()", note: "CBORGenerator.version"}
