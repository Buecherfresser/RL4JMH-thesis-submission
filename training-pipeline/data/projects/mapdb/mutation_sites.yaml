  - {class: org.mapdb.ser.ByteArrayNoSizeSerializer, method: serialize, match: "(DataOutput2 out, byte[] value)", note: "ByteArrayNoSizeSerializer.serialize"}
  - {class: org.mapdb.store.HeapBufStore, method: preallocate, match: "()", note: "HeapBufStore.preallocate"}
  - {class: org.mapdb.ser.ByteArrayNoSizeSerializer, method: serializedType, match: "()", note: "ByteArrayNoSizeSerializer.serializedType"}
  - {class: org.mapdb.store.HeapBufStore, method: preallocate2, match: "()", note: "HeapBufStore.preallocate2"}
  - {class: org.mapdb.ser.ByteArraySerializer, method: serialize, match: "(DataOutput2 out, byte[] value)", note: "ByteArraySerializer.serialize"}
  - {class: org.mapdb.store.legacy.DataInput2Exposed, method: getPos, match: "()", note: "DataInput2Exposed.getPos"}
  - {class: org.mapdb.ser.ByteArraySerializer, method: deserialize, match: "(DataInput2 in)", note: "ByteArraySerializer.deserialize"}
  - {class: org.mapdb.store.legacy.DataInput2Exposed, method: readFully, match: "(byte[] b, int off, int len)", note: "DataInput2Exposed.readFully"}
  - {class: org.mapdb.ser.CharArraySerializer, method: serialize, match: "(DataOutput2 out, char[] value)", note: "CharArraySerializer.serialize"}
