# Curated performance-mutation sites for evalex (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants evalex --source data/external-src/<checkout> \
#       --sites data/projects/evalex/mutation_sites.yaml

package_root: com.ezylang.evalex

sites:
  - {class: com.ezylang.evalex.EvaluationException, method: ofUnsupportedDataTypeInOperation, match: "(Token token)", note: "EvaluationException.ofUnsupportedDataTypeInOperation"}
  - {class: com.ezylang.evalex.config.MapBasedFunctionDictionary, method: ofFunctions, match: "(Map.Entry<String, FunctionIfc>... functions)", note: "MapBasedFunctionDictionary.ofFunctions"}
  - {class: com.ezylang.evalex.data.MapBasedDataAccessor, method: setData, match: "(String variable, EvaluationValue value)", note: "MapBasedDataAccessor.setData"}
  - {class: com.ezylang.evalex.functions.basic.AbsFunction, method: evaluate, match: "(", note: "AbsFunction.evaluate"}
  - {class: com.ezylang.evalex.operators.arithmetic.InfixDivisionOperator, method: evaluate, match: "(", note: "InfixDivisionOperator.evaluate"}
  - {class: com.ezylang.evalex.parser.ASTNode, method: toJSON, match: "()", note: "ASTNode.toJSON"}
  - {class: com.ezylang.evalex.Expression, method: evaluate, match: "() throws EvaluationException, ParseException", note: "Expression.evaluate"}
  - {class: com.ezylang.evalex.config.MapBasedFunctionDictionary, method: getFunction, match: "(String functionName)", note: "MapBasedFunctionDictionary.getFunction"}
  - {class: com.ezylang.evalex.data.conversion.ArrayConverter, method: convert, match: "(Object object, ExpressionConfiguration configuration)", note: "ArrayConverter.convert"}
  - {class: com.ezylang.evalex.functions.basic.AverageFunction, method: evaluate, match: "(", note: "AverageFunction.evaluate"}
  - {class: com.ezylang.evalex.operators.arithmetic.InfixMinusOperator, method: evaluate, match: "(", note: "InfixMinusOperator.evaluate"}
  - {class: com.ezylang.evalex.parser.ShuntingYardConverter, method: toAbstractSyntaxTree, match: "() throws ParseException", note: "ShuntingYardConverter.toAbstractSyntaxTree"}
  - {class: com.ezylang.evalex.Expression, method: evaluateSubtree, match: "(ASTNode startNode) throws EvaluationException", note: "Expression.evaluateSubtree"}
  - {class: com.ezylang.evalex.config.MapBasedOperatorDictionary, method: ofOperators, match: "(Map.Entry<String, OperatorIfc>... operators)", note: "MapBasedOperatorDictionary.ofOperators"}
  - {class: com.ezylang.evalex.data.conversion.ArrayConverter, method: canConvert, match: "(Object object)", note: "ArrayConverter.canConvert"}
  - {class: com.ezylang.evalex.functions.basic.CeilingFunction, method: evaluate, match: "(", note: "CeilingFunction.evaluate"}
  - {class: com.ezylang.evalex.operators.arithmetic.InfixModuloOperator, method: evaluate, match: "(", note: "InfixModuloOperator.evaluate"}
  - {class: com.ezylang.evalex.parser.Tokenizer, method: parse, match: "() throws ParseException", note: "Tokenizer.parse"}
  - {class: com.ezylang.evalex.config.MapBasedOperatorDictionary, method: addOperator, match: "(String operatorString, OperatorIfc operator)", note: "MapBasedOperatorDictionary.addOperator"}
  - {class: com.ezylang.evalex.data.conversion.NumberConverter, method: convert, match: "(Object object, ExpressionConfiguration configuration)", note: "NumberConverter.convert"}
  - {class: com.ezylang.evalex.functions.basic.CoalesceFunction, method: evaluate, match: "(", note: "CoalesceFunction.evaluate"}
  - {class: com.ezylang.evalex.operators.arithmetic.InfixMultiplicationOperator, method: evaluate, match: "(", note: "InfixMultiplicationOperator.evaluate"}
  - {class: com.ezylang.evalex.config.ExpressionConfiguration, method: defaultConfiguration, match: "()", note: "ExpressionConfiguration.defaultConfiguration"}
  - {class: com.ezylang.evalex.data.conversion.NumberConverter, method: canConvert, match: "(Object object)", note: "NumberConverter.canConvert"}
  - {class: com.ezylang.evalex.functions.basic.FactFunction, method: evaluate, match: "(", note: "FactFunction.evaluate"}
  - {class: com.ezylang.evalex.operators.arithmetic.InfixPlusOperator, method: evaluate, match: "(", note: "InfixPlusOperator.evaluate"}
  - {class: com.ezylang.evalex.config.ExpressionConfiguration, method: withAdditionalOperators, match: "(", note: "ExpressionConfiguration.withAdditionalOperators"}
  - {class: com.ezylang.evalex.data.conversion.StringConverter, method: convert, match: "(Object object, ExpressionConfiguration configuration)", note: "StringConverter.convert"}
  - {class: com.ezylang.evalex.functions.basic.FloorFunction, method: evaluate, match: "(", note: "FloorFunction.evaluate"}
  - {class: com.ezylang.evalex.operators.arithmetic.InfixPowerOfOperator, method: evaluate, match: "(", note: "InfixPowerOfOperator.evaluate"}
  - {class: com.ezylang.evalex.data.conversion.StringConverter, method: canConvert, match: "(Object object)", note: "StringConverter.canConvert"}
  - {class: com.ezylang.evalex.functions.basic.IfFunction, method: evaluate, match: "(", note: "IfFunction.evaluate"}
  - {class: com.ezylang.evalex.operators.arithmetic.InfixPowerOfOperator, method: getPrecedence, match: "(ExpressionConfiguration configuration)", note: "InfixPowerOfOperator.getPrecedence"}
  - {class: com.ezylang.evalex.data.EvaluationValue, method: of, match: "(Object value, ExpressionConfiguration configuration)", note: "EvaluationValue.of"}
