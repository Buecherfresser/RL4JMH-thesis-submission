# Curated performance-mutation sites for similarity (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants similarity --source data/external-src/<checkout> \
#       --sites data/projects/similarity/mutation_sites.yaml

package_root: org.xm.similarity

sites:
  - {class: org.xm.similarity.phrase.PhraseSimilarity, method: getInstance, match: "()", note: "PhraseSimilarity.getInstance"}
  - {class: org.xm.similarity.sentence.editdistance.SuperString, method: createCharSuperString, match: "(String sentence)", note: "SuperString.createCharSuperString"}
  - {class: org.xm.similarity.text.CosineSimilarity, method: getSimilarityImpl, match: "(List<Word> words1, List<Word> words2)", note: "CosineSimilarity.getSimilarityImpl"}
  - {class: org.xm.similarity.util.FileUtil, method: traverseLines, match: "(InputStream input, String encoding, TraverseEvent<String> event)", note: "FileUtil.traverseLines"}
  - {class: org.xm.similarity.word.hownet.concept.ConceptLinkedList, method: removeLast, match: "(int size)", note: "ConceptLinkedList.removeLast"}
  - {class: org.xm.similarity.phrase.PhraseSimilarity, method: getSimilarity, match: "(String phrase1, String phrase2)", note: "PhraseSimilarity.getSimilarity"}
  - {class: org.xm.similarity.sentence.editdistance.SuperString, method: createWordSuperString, match: "(String sentence)", note: "SuperString.createWordSuperString"}
  - {class: org.xm.similarity.text.DiceTextSimilarity, method: getSimilarityImpl, match: "(List<Word> words1, List<Word> words2)", note: "DiceTextSimilarity.getSimilarityImpl"}
  - {class: org.xm.similarity.util.FileUtil, method: saveStringToFile, match: "(String content, String fileName)", note: "FileUtil.saveStringToFile"}
  - {class: org.xm.similarity.word.hownet.concept.ConceptLinkedList, method: addByDefine, match: "(Concept concept)", note: "ConceptLinkedList.addByDefine"}
  - {class: org.xm.similarity.sentence.editdistance.Block, method: getGlobalPosition, match: "()", note: "Block.getGlobalPosition"}
  - {class: org.xm.similarity.text.DiceTextSimilarity, method: main, match: "(String[] args)", note: "DiceTextSimilarity.main"}
  - {class: org.xm.similarity.util.MathUtil, method: min, match: "(int... values)", note: "MathUtil.min"}
  - {class: org.xm.similarity.word.CharBasedSimilarity, method: getInstance, match: "()", note: "CharBasedSimilarity.getInstance"}
  - {class: org.xm.similarity.sentence.editdistance.Block, method: setGlobalPosition, match: "(int globalPosition)", note: "Block.setGlobalPosition"}
  - {class: org.xm.similarity.text.EditDistanceSimilarity, method: getSimilarityImpl, match: "(List<Word> words1, List<Word> words2)", note: "EditDistanceSimilarity.getSimilarityImpl"}
  - {class: org.xm.similarity.util.MathUtil, method: max, match: "(int a, int b)", note: "MathUtil.max"}
  - {class: org.xm.similarity.word.CharBasedSimilarity, method: getSimilarity, match: "(String word1, String word2)", note: "CharBasedSimilarity.getSimilarity"}
  - {class: org.xm.similarity.sentence.editdistance.CharEditUnit, method: getUnitString, match: "()", note: "CharEditUnit.getUnitString"}
  - {class: org.xm.similarity.text.EuclideanDistanceTextSimilarity, method: getSimilarityImpl, match: "(List<Word> words1, List<Word> words2)", note: "EuclideanDistanceTextSimilarity.getSimilarityImpl"}
  - {class: org.xm.similarity.util.StringUtil, method: isBlank, match: "(CharSequence cs)", note: "StringUtil.isBlank"}
  - {class: org.xm.similarity.word.clin.CilinCode, method: getCodeLevel, match: "(String code, int level)", note: "CilinCode.getCodeLevel"}
  - {class: org.xm.similarity.sentence.editdistance.ChunkEditUnit, method: getUnitString, match: "()", note: "ChunkEditUnit.getUnitString"}
  - {class: org.xm.similarity.text.EuclideanDistanceTextSimilarity, method: main, match: "(String[] args)", note: "EuclideanDistanceTextSimilarity.main"}
  - {class: org.xm.similarity.util.StringUtil, method: isNotBlank, match: "(CharSequence cs)", note: "StringUtil.isNotBlank"}
  - {class: org.xm.similarity.word.clin.CilinCode, method: calculateCommonWeight, match: "(String code1, String code2)", note: "CilinCode.calculateCommonWeight"}
  - {class: org.xm.similarity.sentence.editdistance.ChunkEditUnit, method: getSubstitutionCost, match: "(EditUnit otherUnit)", note: "ChunkEditUnit.getSubstitutionCost"}
  - {class: org.xm.similarity.text.JaccardTextSimilarity, method: getSimilarityImpl, match: "(List<Word> words1, List<Word> words2)", note: "JaccardTextSimilarity.getSimilarityImpl"}
  - {class: org.xm.similarity.util.XmlUtils, method: newDocument, match: "() throws XmlException", note: "XmlUtils.newDocument"}
  - {class: org.xm.similarity.word.clin.CilinDictionary, method: getInstance, match: "()", note: "CilinDictionary.getInstance"}
  - {class: org.xm.similarity.sentence.editdistance.GregorEditDistanceSimilarity, method: getEditDistance, match: "(SuperString<? extends EditUnit> S, SuperString<? extends EditUnit> T)", note: "GregorEditDistanceSimilarity.getEditDistance"}
  - {class: org.xm.similarity.text.JaccardTextSimilarity, method: main, match: "(String[] args)", note: "JaccardTextSimilarity.main"}
  - {class: org.xm.similarity.util.XmlUtils, method: getDocument, match: "(File file) throws XmlException", note: "XmlUtils.getDocument"}
  - {class: org.xm.similarity.word.clin.CilinDictionary, method: getCilinCodes, match: "(String word)", note: "CilinDictionary.getCilinCodes"}
  - {class: org.xm.similarity.sentence.editdistance.NewEditDistanceSimilarity, method: getEditDistance, match: "(SuperString<? extends EditUnit> S1, SuperString<? extends EditUnit> T1)", note: "NewEditDistanceSimilarity.getEditDistance"}
  - {class: org.xm.similarity.text.JaroDistanceTextSimilarity, method: getSimilarityImpl, match: "(List<Word> words1, List<Word> words2)", note: "JaroDistanceTextSimilarity.getSimilarityImpl"}
  - {class: org.xm.similarity.util.AtomicFloat, method: addAndGet, match: "(float delta)", note: "AtomicFloat.addAndGet"}
  - {class: org.xm.similarity.word.clin.CilinSimilarity, method: getInstance, match: "()", note: "CilinSimilarity.getInstance"}
  - {class: org.xm.similarity.sentence.editdistance.Split, method: split, match: "(SuperString<? extends EditUnit> X, SuperString<? extends EditUnit> Y)", note: "Split.split"}
  - {class: org.xm.similarity.text.JaroDistanceTextSimilarity, method: main, match: "(String[] args)", note: "JaroDistanceTextSimilarity.main"}
  - {class: org.xm.similarity.util.AtomicFloat, method: getAndAdd, match: "(float delta)", note: "AtomicFloat.getAndAdd"}
  - {class: org.xm.similarity.word.clin.CilinSimilarity, method: getSimilarity, match: "(String word1, String word2)", note: "CilinSimilarity.getSimilarity"}
  - {class: org.xm.similarity.sentence.editdistance.Split, method: parse, match: "(SuperString<?> X, SuperString<?> Y)", note: "Split.parse"}
  - {class: org.xm.similarity.text.JaroWinklerDistanceTextSimilarity, method: getSimilarityImpl, match: "(List<Word> words1, List<Word> words2)", note: "JaroWinklerDistanceTextSimilarity.getSimilarityImpl"}
  - {class: org.xm.similarity.util.DicReader, method: getReader, match: "(String name)", note: "DicReader.getReader"}
  - {class: org.xm.similarity.word.hownet.concept.Concept, method: getWord, match: "()", note: "Concept.getWord"}
  - {class: org.xm.similarity.sentence.editdistance.StandardEditDistanceSimilarity, method: getEditDistance, match: "(SuperString<? extends EditUnit> X, SuperString<? extends EditUnit> Y)", note: "StandardEditDistanceSimilarity.getEditDistance"}
  - {class: org.xm.similarity.text.JaroWinklerDistanceTextSimilarity, method: main, match: "(String[] args)", note: "JaroWinklerDistanceTextSimilarity.main"}
  - {class: org.xm.similarity.util.DicReader, method: getInputStream, match: "(String name)", note: "DicReader.getInputStream"}
  - {class: org.xm.similarity.word.hownet.concept.Concept, method: setWord, match: "(String word)", note: "Concept.setWord"}
