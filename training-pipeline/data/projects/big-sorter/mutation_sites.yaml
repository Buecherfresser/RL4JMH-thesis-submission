# Curated performance-mutation sites for big-sorter (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants big-sorter --source data/external-src/<checkout> \
#       --sites data/projects/big-sorter/mutation_sites.yaml

package_root: com.github.davidmoten

sites:
  - {class: com.github.davidmoten.bigsorter.JsonArraySerializer, method: createReader, match: "(InputStream in)", note: "JsonArraySerializer.createReader"}
  - {class: com.github.davidmoten.bigsorter.JsonArraySerializer, method: close, match: "() throws IOException", note: "JsonArraySerializer.close"}
  - {class: com.github.davidmoten.bigsorter.JsonArraySerializer, method: createWriter, match: "(OutputStream out)", note: "JsonArraySerializer.createWriter"}
  - {class: com.github.davidmoten.bigsorter.JsonArraySerializer, method: close, match: "() throws IOException", note: "JsonArraySerializer.close"}
  - {class: com.github.davidmoten.bigsorter.NonClosingInputStream, method: close, match: "() throws IOException", note: "NonClosingInputStream.close"}
  - {class: com.github.davidmoten.bigsorter.NonClosingInputStream, method: mark, match: "(int readlimit)", note: "NonClosingInputStream.mark"}
  - {class: com.github.davidmoten.bigsorter.NonClosingInputStream, method: reset, match: "() throws IOException", note: "NonClosingInputStream.reset"}
  - {class: com.github.davidmoten.bigsorter.NonClosingInputStream, method: markSupported, match: "()", note: "NonClosingInputStream.markSupported"}
  - {class: com.github.davidmoten.bigsorter.Util, method: findSame, match: "(Reader<? extends T> readerA, Reader<? extends T> readerB,", note: "Util.findSame"}
  - {class: com.github.davidmoten.bigsorter.Util, method: findSame, match: "(File a, File b, Serializer<T> serializer, Comparator<? super T> comparator,", note: "Util.findSame"}
  - {class: com.github.davidmoten.bigsorter.Util, method: findDifferent, match: "(Reader<? extends T> readerA, Reader<? extends T> readerB,", note: "Util.findDifferent"}
  - {class: com.github.davidmoten.bigsorter.Util, method: findDifferent, match: "(File a, File b, Serializer<T> serializer, Comparator<? super T> comparator,", note: "Util.findDifferent"}
  - {class: com.github.davidmoten.bigsorter.Util, method: findComplement, match: "(Reader<? extends T> readerA, Reader<? extends T> readerB,", note: "Util.findComplement"}
  - {class: com.github.davidmoten.bigsorter.Util, method: findComplement, match: "(File a, File b, Serializer<T> serializer, Comparator<? super T> comparator,", note: "Util.findComplement"}
  - {class: com.github.davidmoten.bigsorter.Util, method: splitByCount, match: "(File input, Serializer<T> serializer, long count) throws IOException", note: "Util.splitByCount"}
  - {class: com.github.davidmoten.bigsorter.Util, method: splitByCount, match: "(File input, Serializer<T> serializer, Function<Integer, File> output,", note: "Util.splitByCount"}
  - {class: com.github.davidmoten.bigsorter.Util, method: splitByCount, match: "(List<File> input, Serializer<T> serializer, Function<Integer, File> output,", note: "Util.splitByCount"}
  - {class: com.github.davidmoten.bigsorter.Util, method: splitBySize, match: "(File input, Serializer<T> serializer, long maxSize) throws IOException", note: "Util.splitBySize"}
  - {class: com.github.davidmoten.bigsorter.Util, method: splitBySize, match: "(File input, Serializer<T> serializer, Function<Integer, File> output,", note: "Util.splitBySize"}
  - {class: com.github.davidmoten.bigsorter.Util, method: splitBySize, match: "(List<File> input, Serializer<T> serializer, Function<Integer, File> output,", note: "Util.splitBySize"}
  - {class: com.github.davidmoten.bigsorter.Util, method: convert, match: "(File in, InputStreamReaderFactory<S> readerFactory, File out,", note: "Util.convert"}
  - {class: com.github.davidmoten.bigsorter.internal.ArrayList, method: trimToSize, match: "()", note: "ArrayList.trimToSize"}
  - {class: com.github.davidmoten.bigsorter.internal.ArrayList, method: ensureCapacity, match: "(int minCapacity)", note: "ArrayList.ensureCapacity"}
