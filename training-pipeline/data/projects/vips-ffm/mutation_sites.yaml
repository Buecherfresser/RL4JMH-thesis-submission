# Curated performance-mutation sites for vips-ffm (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants vips-ffm --source data/external-src/<checkout> \
#       --sites data/projects/vips-ffm/mutation_sites.yaml

package_root: app.photofox.vipsffm

