  - {class: org.javolution.util.internal.set.UnmodifiableSetImpl, method: clear, match: "()", note: "UnmodifiableSetImpl.clear"}
  - {class: org.javolution.util.internal.set.UnmodifiableSetImpl, method: size, match: "()", note: "UnmodifiableSetImpl.size"}
  - {class: org.javolution.util.internal.table.MappedTableImpl, method: clear, match: "()", note: "MappedTableImpl.clear"}
  - {class: org.javolution.util.internal.table.MappedTableImpl, method: equality, match: "()", note: "MappedTableImpl.equality"}
  - {class: org.javolution.util.internal.ReadWriteLockImpl, method: lock, match: "()", note: "ReadWriteLockImpl.lock"}
  - {class: org.javolution.util.internal.ReadWriteLockImpl, method: lockInterruptibly, match: "() throws InterruptedException", note: "ReadWriteLockImpl.lockInterruptibly"}
  - {class: org.javolution.util.internal.collection.AtomicCollectionImpl, method: addAll, match: "(Collection<? extends E> that)", note: "AtomicCollectionImpl.addAll"}
  - {class: org.javolution.util.internal.collection.AtomicCollectionImpl, method: addAll, match: "(@SuppressWarnings(\"unchecked\") E... elements)", note: "AtomicCollectionImpl.addAll"}
  - {class: org.javolution.util.internal.collection.ConcatCollectionImpl, method: removeIf, match: "(Predicate<? super E> filter)", note: "ConcatCollectionImpl.removeIf"}
  - {class: org.javolution.util.internal.collection.ConcatCollectionImpl, method: iterator, match: "()", note: "ConcatCollectionImpl.iterator"}
