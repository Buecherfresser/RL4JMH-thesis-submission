# Curated performance-mutation sites for joda-time (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants joda-time --source data/external-src/<checkout> \
#       --sites data/projects/joda-time/mutation_sites.yaml

package_root: org.joda.time

sites:
  - {class: org.joda.time.DateTimeComparator, method: getInstance, match: "()", note: "DateTimeComparator.getInstance"}
  - {class: org.joda.time.chrono.BasicDayOfMonthDateTimeField, method: getRangeDurationField, match: "()", note: "BasicDayOfMonthDateTimeField.getRangeDurationField"}
  - {class: org.joda.time.convert.StringConverter, method: getInstantMillis, match: "(Object object, Chronology chrono)", note: "StringConverter.getInstantMillis"}
  - {class: org.joda.time.field.FieldUtils, method: safeNegate, match: "(int value)", note: "FieldUtils.safeNegate"}
  - {class: org.joda.time.format.DateTimeFormatterBuilder, method: toFormatter, match: "()", note: "DateTimeFormatterBuilder.toFormatter"}
  - {class: org.joda.time.tz.DateTimeZoneBuilder, method: readFrom, match: "(InputStream in, String id) throws IOException", note: "DateTimeZoneBuilder.readFrom"}
  - {class: org.joda.time.DateTimeComparator, method: getInstance, match: "(DateTimeFieldType lowerLimit)", note: "DateTimeComparator.getInstance"}
  - {class: org.joda.time.chrono.BasicDayOfMonthDateTimeField, method: getMinimumValue, match: "()", note: "BasicDayOfMonthDateTimeField.getMinimumValue"}
  - {class: org.joda.time.convert.StringConverter, method: getPartialValues, match: "(ReadablePartial fieldSource, Object object, Chronology chrono, DateTimeFormatter parser)", note: "StringConverter.getPartialValues"}
  - {class: org.joda.time.field.FieldUtils, method: safeAdd, match: "(int val1, int val2)", note: "FieldUtils.safeAdd"}
  - {class: org.joda.time.format.DateTimeFormatterBuilder, method: toPrinter, match: "()", note: "DateTimeFormatterBuilder.toPrinter"}
  - {class: org.joda.time.tz.DateTimeZoneBuilder, method: readFrom, match: "(DataInput in, String id) throws IOException", note: "DateTimeZoneBuilder.readFrom"}
  - {class: org.joda.time.DateTimeUtils, method: currentTimeMillis, match: "()", note: "DateTimeUtils.currentTimeMillis"}
  - {class: org.joda.time.chrono.BasicDayOfYearDateTimeField, method: getRangeDurationField, match: "()", note: "BasicDayOfYearDateTimeField.getRangeDurationField"}
  - {class: org.joda.time.convert.CalendarConverter, method: getChronology, match: "(Object object, Chronology chrono)", note: "CalendarConverter.getChronology"}
  - {class: org.joda.time.field.DecoratedDurationField, method: getWrappedField, match: "()", note: "DecoratedDurationField.getWrappedField"}
  - {class: org.joda.time.format.DateTimeParserBucket, method: reset, match: "()", note: "DateTimeParserBucket.reset"}
  - {class: org.joda.time.tz.CachedDateTimeZone, method: forZone, match: "(DateTimeZone zone)", note: "CachedDateTimeZone.forZone"}
