  - {class: org.apache.datasketches.quantilescommon.BinarySearch, method: find, match: "(final float[] arr, final int low, final int high, final float v)", note: "BinarySearch.find"}
  - {class: org.apache.datasketches.req.ReqSketch, method: builder, match: "()", note: "ReqSketch.builder"}
  - {class: org.apache.datasketches.sampling.EbppsItemsSketch, method: getResult, match: "()", note: "EbppsItemsSketch.getResult"}
  - {class: org.apache.datasketches.tdigest.TDigestDouble, method: getK, match: "()", note: "TDigestDouble.getK"}
