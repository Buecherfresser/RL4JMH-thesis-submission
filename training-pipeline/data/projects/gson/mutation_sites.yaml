# Curated performance-mutation sites for gson (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants gson --source data/external-src/<checkout> \
#       --sites data/projects/gson/mutation_sites.yaml

package_root: com.google.gson

sites:
  - {class: com.google.gson.GsonBuilder, method: setVersion, match: "(double version)", note: "GsonBuilder.setVersion"}
  - {class: com.google.gson.interceptors.InterceptorFactory, method: create, match: "(Gson gson, TypeToken<T> type)", note: "InterceptorFactory.create"}
  - {class: com.google.gson.internal.LazilyParsedNumber, method: intValue, match: "()", note: "LazilyParsedNumber.intValue"}
  - {class: com.google.gson.metrics.BagOfPrimitives, method: getIntValue, match: "()", note: "BagOfPrimitives.getIntValue"}
  - {class: com.google.gson.protobuf.LegacyProtoTypeAdapterFactory, method: computeValue, match: "(Class<?> type)", note: "LegacyProtoTypeAdapterFactory.computeValue"}
  - {class: com.google.gson.reflect.TypeToken, method: getRawType, match: "()", note: "TypeToken.getRawType"}
  - {class: com.google.gson.stream.JsonReader, method: setLenient, match: "(boolean lenient)", note: "JsonReader.setLenient"}
  - {class: com.google.gson.typeadapters.PostConstructAdapterFactory, method: create, match: "(Gson gson, TypeToken<T> type)", note: "PostConstructAdapterFactory.create"}
  - {class: com.google.gson.GsonBuilder, method: excludeFieldsWithModifiers, match: "(int... modifiers)", note: "GsonBuilder.excludeFieldsWithModifiers"}
  - {class: com.google.gson.internal.LazilyParsedNumber, method: longValue, match: "()", note: "LazilyParsedNumber.longValue"}
  - {class: com.google.gson.metrics.BagOfPrimitives, method: getExpectedJson, match: "()", note: "BagOfPrimitives.getExpectedJson"}
  - {class: com.google.gson.protobuf.ProtoTypeAdapter, method: setEnumSerialization, match: "(EnumSerialization enumSerialization)", note: "ProtoTypeAdapter.setEnumSerialization"}
  - {class: com.google.gson.reflect.TypeToken, method: isAssignableFrom, match: "(Class<?> cls)", note: "TypeToken.isAssignableFrom"}
  - {class: com.google.gson.stream.JsonReader, method: isLenient, match: "()", note: "JsonReader.isLenient"}
  - {class: com.google.gson.typeadapters.RuntimeTypeAdapterFactory, method: of, match: "(Class<T> baseType, String typeFieldName)", note: "RuntimeTypeAdapterFactory.of"}
  - {class: com.google.gson.JsonArray, method: deepCopy, match: "()", note: "JsonArray.deepCopy"}
  - {class: com.google.gson.internal.LinkedTreeMap, method: size, match: "()", note: "LinkedTreeMap.size"}
  - {class: com.google.gson.metrics.BagOfPrimitivesDeserializationBenchmark, method: main, match: "(String[] args)", note: "BagOfPrimitivesDeserializationBenchmark.main"}
  - {class: com.google.gson.protobuf.ProtoTypeAdapter, method: setShouldUseJsonNameFieldOption, match: "(boolean shouldUseJsonNameFieldOption)", note: "ProtoTypeAdapter.setShouldUseJsonNameFieldOption"}
  - {class: com.google.gson.stream.JsonWriter, method: setIndent, match: "(String indent)", note: "JsonWriter.setIndent"}
  - {class: com.google.gson.typeadapters.RuntimeTypeAdapterFactory, method: of, match: "(Class<T> baseType)", note: "RuntimeTypeAdapterFactory.of"}
  - {class: com.google.gson.JsonArray, method: addAll, match: "(JsonArray array)", note: "JsonArray.addAll"}
  - {class: com.google.gson.internal.LinkedTreeMap, method: containsKey, match: "(Object key)", note: "LinkedTreeMap.containsKey"}
  - {class: com.google.gson.metrics.BagOfPrimitivesDeserializationBenchmark, method: timeBagOfPrimitivesDefault, match: "(int reps)", note: "BagOfPrimitivesDeserializationBenchmark.timeBagOfPrimitivesDefault"}
  - {class: com.google.gson.stream.JsonWriter, method: setFormattingStyle, match: "(FormattingStyle formattingStyle)", note: "JsonWriter.setFormattingStyle"}
  - {class: com.google.gson.JsonParser, method: parseString, match: "(String json) throws JsonSyntaxException", note: "JsonParser.parseString"}
  - {class: com.google.gson.internal.NonNullElementWrapperList, method: size, match: "()", note: "NonNullElementWrapperList.size"}
  - {class: com.google.gson.metrics.CollectionsDeserializationBenchmark, method: main, match: "(String[] args)", note: "CollectionsDeserializationBenchmark.main"}
  - {class: com.google.gson.JsonParser, method: parseReader, match: "(Reader reader) throws JsonIOException, JsonSyntaxException", note: "JsonParser.parseReader"}
  - {class: com.google.gson.internal.NonNullElementWrapperList, method: clear, match: "()", note: "NonNullElementWrapperList.clear"}
  - {class: com.google.gson.metrics.CollectionsDeserializationBenchmark, method: timeCollectionsDefault, match: "(int reps)", note: "CollectionsDeserializationBenchmark.timeCollectionsDefault"}
  - {class: com.google.gson.ToNumberPolicy, method: readNumber, match: "(JsonReader in) throws IOException", note: "ToNumberPolicy.readNumber"}
  - {class: com.google.gson.internal.NumberLimits, method: parseBigDecimal, match: "(String s) throws NumberFormatException", note: "NumberLimits.parseBigDecimal"}
  - {class: com.google.gson.metrics.NonUploadingCaliperRunner, method: run, match: "(Class<?> c, String[] args)", note: "NonUploadingCaliperRunner.run"}
  - {class: com.google.gson.ToNumberPolicy, method: readNumber, match: "(JsonReader in) throws IOException", note: "ToNumberPolicy.readNumber"}
  - {class: com.google.gson.internal.NumberLimits, method: parseBigInteger, match: "(String s) throws NumberFormatException", note: "NumberLimits.parseBigInteger"}
  - {class: com.google.gson.metrics.ParseBenchmark, method: timeParse, match: "(int reps) throws Exception", note: "ParseBenchmark.timeParse"}
  - {class: com.google.gson.FieldAttributes, method: getDeclaringClass, match: "()", note: "FieldAttributes.getDeclaringClass"}
  - {class: com.google.gson.internal.Streams, method: parse, match: "(JsonReader reader) throws JsonParseException", note: "Streams.parse"}
  - {class: com.google.gson.metrics.ParseBenchmark, method: main, match: "(String[] args) throws Exception", note: "ParseBenchmark.main"}
  - {class: com.google.gson.FieldAttributes, method: getName, match: "()", note: "FieldAttributes.getName"}
  - {class: com.google.gson.internal.Streams, method: writerForAppendable, match: "(Appendable appendable)", note: "Streams.writerForAppendable"}
  - {class: com.google.gson.metrics.SerializationBenchmark, method: main, match: "(String[] args)", note: "SerializationBenchmark.main"}
  - {class: com.google.gson.FieldNamingPolicy, method: translateName, match: "(Field f)", note: "FieldNamingPolicy.translateName"}
  - {class: com.google.gson.internal.bind.ArrayTypeAdapter, method: create, match: "(Gson gson, TypeToken<T> typeToken)", note: "ArrayTypeAdapter.create"}
  - {class: com.google.gson.metrics.SerializationBenchmark, method: timeObjectSerialization, match: "(int reps)", note: "SerializationBenchmark.timeObjectSerialization"}
  - {class: com.google.gson.FieldNamingPolicy, method: translateName, match: "(Field f)", note: "FieldNamingPolicy.translateName"}
  - {class: com.google.gson.internal.bind.MapTypeAdapterFactory, method: create, match: "(Gson gson, TypeToken<T> typeToken)", note: "MapTypeAdapterFactory.create"}
  - {class: com.google.gson.FormattingStyle, method: withNewline, match: "(String newline)", note: "FormattingStyle.withNewline"}
  - {class: com.google.gson.internal.bind.NumberTypeAdapter, method: create, match: "(Gson gson, TypeToken<T> type)", note: "NumberTypeAdapter.create"}
