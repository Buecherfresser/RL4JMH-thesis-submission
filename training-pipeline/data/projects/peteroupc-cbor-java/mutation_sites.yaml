# Curated performance-mutation sites for peteroupc-cbor-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants peteroupc-cbor-java --source data/external-src/<checkout> \
#       --sites data/projects/peteroupc-cbor-java/mutation_sites.yaml

package_root: com.upokecenter.cbor

sites:
  - {class: com.upokecenter.cbor.CBORDataUtilities, method: ParseJSONNumber, match: "(String str)", note: "CBORDataUtilities.ParseJSONNumber"}
  - {class: com.upokecenter.cbor.CBORDataUtilities, method: ParseJSONNumber, match: "(", note: "CBORDataUtilities.ParseJSONNumber"}
  - {class: com.upokecenter.cbor.CBORNumber, method: ToCBORObject, match: "()", note: "CBORNumber.ToCBORObject"}
  - {class: com.upokecenter.cbor.CBORNumber, method: signum, match: "()", note: "CBORNumber.signum"}
  - {class: com.upokecenter.cbor.CBORTypeMapper, method: AddConverter, match: "(java.lang.reflect.Type type,", note: "CBORTypeMapper.AddConverter"}
  - {class: com.upokecenter.cbor.CBORTypeMapper, method: FilterTypeName, match: "(String typeName)", note: "CBORTypeMapper.FilterTypeName"}
  - {class: com.upokecenter.cbor.CBORUtilities, method: CompareStringsAsUtf8LengthFirst, match: "(String strA, String", note: "CBORUtilities.CompareStringsAsUtf8LengthFirst"}
  - {class: com.upokecenter.cbor.CBORUtilities, method: CompareUtf16Utf8LengthFirst, match: "(String utf16, byte[] utf8)", note: "CBORUtilities.CompareUtf16Utf8LengthFirst"}
  - {class: com.upokecenter.cbor.OptionsParser, method: GetLCString, match: "(String key, String defaultValue)", note: "OptionsParser.GetLCString"}
  - {class: com.upokecenter.cbor.OptionsParser, method: GetBoolean, match: "(String key, boolean defaultValue)", note: "OptionsParser.GetBoolean"}
  - {class: com.upokecenter.cbor.PropertyMap, method: getName, match: "()", note: "PropertyMap.getName"}
  - {class: com.upokecenter.cbor.PropertyMap, method: GetValueType, match: "()", note: "PropertyMap.GetValueType"}
  - {class: com.upokecenter.cbor.StringOutput, method: WriteString, match: "(String str) throws java.io.IOException", note: "StringOutput.WriteString"}
  - {class: com.upokecenter.cbor.StringOutput, method: WriteString, match: "(String str, int index, int length) throws java.io.IOException", note: "StringOutput.WriteString"}
  - {class: com.upokecenter.cbor.StringRefs, method: Push, match: "()", note: "StringRefs.Push"}
  - {class: com.upokecenter.cbor.StringRefs, method: Pop, match: "()", note: "StringRefs.Pop"}
  - {class: com.upokecenter.cbor.Base64, method: WriteBase64, match: "(", note: "Base64.WriteBase64"}
  - {class: com.upokecenter.cbor.Base64, method: WriteBase64URL, match: "(", note: "Base64.WriteBase64URL"}
  - {class: com.upokecenter.cbor.CBORCanonical, method: CtapCanonicalEncode, match: "(CBORObject a)", note: "CBORCanonical.CtapCanonicalEncode"}
  - {class: com.upokecenter.cbor.CBORDateConverter, method: FromCBORObject, match: "(CBORObject obj)", note: "CBORDateConverter.FromCBORObject"}
  - {class: com.upokecenter.cbor.CBORDateConverter, method: TryGetDateTimeFields, match: "(CBORObject obj, EInteger[] year, int[]", note: "CBORDateConverter.TryGetDateTimeFields"}
  - {class: com.upokecenter.cbor.CBORDoubleBits, method: IsPositiveInfinity, match: "(Object obj)", note: "CBORDoubleBits.IsPositiveInfinity"}
  - {class: com.upokecenter.cbor.CBORDoubleBits, method: IsInfinity, match: "(Object obj)", note: "CBORDoubleBits.IsInfinity"}
  - {class: com.upokecenter.cbor.CBOREInteger, method: IsPositiveInfinity, match: "(Object obj)", note: "CBOREInteger.IsPositiveInfinity"}
  - {class: com.upokecenter.cbor.CBOREInteger, method: IsInfinity, match: "(Object obj)", note: "CBOREInteger.IsInfinity"}
