# Curated performance-mutation sites for jade4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jade4j --source data/external-src/<checkout> \
#       --sites data/projects/jade4j/mutation_sites.yaml

package_root: de.neuland.jade4j

sites:
  - {class: de.neuland.jade4j.Jade4J, method: render, match: "(String filename, Map<String, Object> model) throws IOException, JadeCompilerException", note: "Jade4J.render"}
  - {class: de.neuland.jade4j.compiler.Utils, method: prepareInterpolate, match: "(String string, boolean xmlEscape)", note: "Utils.prepareInterpolate"}
  - {class: de.neuland.jade4j.expression.BooleanUtil, method: convert, match: "(Object in)", note: "BooleanUtil.convert"}
  - {class: de.neuland.jade4j.filter.CDATAFilter, method: convert, match: "(String source, List<Attr> attributes, Map<String, Object> model)", note: "CDATAFilter.convert"}
  - {class: de.neuland.jade4j.lexer.token.AttributeList, method: getAttributes, match: "()", note: "AttributeList.getAttributes"}
  - {class: de.neuland.jade4j.model.JadeModel, method: pushScope, match: "()", note: "JadeModel.pushScope"}
  - {class: de.neuland.jade4j.parser.FileNameBuilder, method: build, match: "()", note: "FileNameBuilder.build"}
  - {class: de.neuland.jade4j.template.ClasspathTemplateLoader, method: getLastModified, match: "(String name)", note: "ClasspathTemplateLoader.getLastModified"}
  - {class: de.neuland.jade4j.util.CharacterParser, method: parse, match: "(String src) throws SyntaxError", note: "CharacterParser.parse"}
  - {class: de.neuland.jade4j.Jade4J, method: render, match: "(String filename, Map<String, Object> model, boolean pretty) throws IOException, JadeCompilerException", note: "Jade4J.render"}
  - {class: de.neuland.jade4j.compiler.Utils, method: interpolate, match: "(List<Object> prepared, JadeModel model, ExpressionHandler expressionHandler) throws ExpressionException", note: "Utils.interpolate"}
  - {class: de.neuland.jade4j.expression.JexlExpressionHandler, method: evaluateBooleanExpression, match: "(String expression, JadeModel model) throws ExpressionException", note: "JexlExpressionHandler.evaluateBooleanExpression"}
  - {class: de.neuland.jade4j.filter.CssFilter, method: convert, match: "(String source, List<Attr> attributes)", note: "CssFilter.convert"}
  - {class: de.neuland.jade4j.lexer.token.AttributeList, method: addAttribute, match: "(String name, String value, boolean escapedAttr)", note: "AttributeList.addAttribute"}
  - {class: de.neuland.jade4j.model.JadeModel, method: popScope, match: "()", note: "JadeModel.popScope"}
  - {class: de.neuland.jade4j.parser.Parser, method: parse, match: "()", note: "Parser.parse"}
  - {class: de.neuland.jade4j.template.ClasspathTemplateLoader, method: getReader, match: "(String name) throws IOException", note: "ClasspathTemplateLoader.getReader"}
  - {class: de.neuland.jade4j.util.CharacterParser, method: parse, match: "(String src,State state) throws SyntaxError", note: "CharacterParser.parse"}
  - {class: de.neuland.jade4j.JadeConfiguration, method: getTemplate, match: "(String name) throws IOException, JadeException", note: "JadeConfiguration.getTemplate"}
  - {class: de.neuland.jade4j.compiler.Compiler, method: compileToString, match: "(JadeModel model) throws JadeCompilerException", note: "Compiler.compileToString"}
  - {class: de.neuland.jade4j.expression.JexlExpressionHandler, method: evaluateExpression, match: "(String expression, JadeModel model) throws ExpressionException", note: "JexlExpressionHandler.evaluateExpression"}
  - {class: de.neuland.jade4j.filter.JsFilter, method: convert, match: "(String source, List<Attr> attributes)", note: "JsFilter.convert"}
  - {class: de.neuland.jade4j.lexer.AttributeLexer, method: getToken, match: "(String input, int lineno)", note: "AttributeLexer.getToken"}
  - {class: de.neuland.jade4j.parser.Parser, method: getBlocks, match: "()", note: "Parser.getBlocks"}
  - {class: de.neuland.jade4j.template.FileTemplateLoader, method: getLastModified, match: "(String name)", note: "FileTemplateLoader.getLastModified"}
  - {class: de.neuland.jade4j.util.StringReplacer, method: replace, match: "(String input, Pattern regex, StringReplacerCallback callback)", note: "StringReplacer.replace"}
  - {class: de.neuland.jade4j.JadeConfiguration, method: renderTemplate, match: "(JadeTemplate template, Map<String, Object> model, Writer writer) throws JadeCompilerException", note: "JadeConfiguration.renderTemplate"}
  - {class: de.neuland.jade4j.compiler.Compiler, method: compile, match: "(JadeModel model, Writer w) throws JadeCompilerException", note: "Compiler.compile"}
  - {class: de.neuland.jade4j.expression.JsExpressionHandler, method: evaluateBooleanExpression, match: "(String expression, JadeModel model) throws ExpressionException", note: "JsExpressionHandler.evaluateBooleanExpression"}
  - {class: de.neuland.jade4j.filter.MarkdownFilter, method: convert, match: "(String source, List<Attr> attributes)", note: "MarkdownFilter.convert"}
  - {class: de.neuland.jade4j.lexer.Each, method: setCode, match: "(String code)", note: "Each.setCode"}
  - {class: de.neuland.jade4j.parser.node.ExpressionString, method: isEscape, match: "()", note: "ExpressionString.isEscape"}
  - {class: de.neuland.jade4j.template.FileTemplateLoader, method: getReader, match: "(String name) throws IOException", note: "FileTemplateLoader.getReader"}
  - {class: de.neuland.jade4j.util.ArgumentSplitter, method: split, match: "(String arguments)", note: "ArgumentSplitter.split"}
  - {class: de.neuland.jade4j.compiler.IndentWriter, method: append, match: "(String string)", note: "IndentWriter.append"}
  - {class: de.neuland.jade4j.expression.JsExpressionHandler, method: evaluateExpression, match: "(String expression, JadeModel model) throws ExpressionException", note: "JsExpressionHandler.evaluateExpression"}
  - {class: de.neuland.jade4j.filter.PlainFilter, method: convert, match: "(String source, List<Attr> attributes, Map<String, Object> model)", note: "PlainFilter.convert"}
  - {class: de.neuland.jade4j.lexer.Each, method: getCode, match: "()", note: "Each.getCode"}
  - {class: de.neuland.jade4j.parser.node.ExpressionString, method: getValue, match: "()", note: "ExpressionString.getValue"}
  - {class: de.neuland.jade4j.template.JadeTemplate, method: process, match: "(JadeModel model, Writer writer) throws JadeCompilerException", note: "JadeTemplate.process"}
  - {class: de.neuland.jade4j.util.JadeEscape, method: escape, match: "(String html)", note: "JadeEscape.escape"}
  - {class: de.neuland.jade4j.compiler.IndentWriter, method: increment, match: "()", note: "IndentWriter.increment"}
  - {class: de.neuland.jade4j.filter.VerbatimFilter, method: convert, match: "(String source, List<Attr> attributes, Map<String, Object> model)", note: "VerbatimFilter.convert"}
  - {class: de.neuland.jade4j.lexer.Lexer, method: consume, match: "(int len)", note: "Lexer.consume"}
  - {class: de.neuland.jade4j.parser.node.ValueString, method: setEscape, match: "(boolean escape)", note: "ValueString.setEscape"}
  - {class: de.neuland.jade4j.template.JadeTemplate, method: isPrettyPrint, match: "()", note: "JadeTemplate.isPrettyPrint"}
  - {class: de.neuland.jade4j.util.JadeEscape, method: replace, match: "(Matcher m)", note: "JadeEscape.replace"}
  - {class: de.neuland.jade4j.lexer.Lexer, method: defer, match: "(Token tok)", note: "Lexer.defer"}
  - {class: de.neuland.jade4j.parser.node.ValueString, method: isEscape, match: "()", note: "ValueString.isEscape"}
  - {class: de.neuland.jade4j.template.ReaderTemplateLoader, method: getLastModified, match: "(String name) throws IOException", note: "ReaderTemplateLoader.getLastModified"}
