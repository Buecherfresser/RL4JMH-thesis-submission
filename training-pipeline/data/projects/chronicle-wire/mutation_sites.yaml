# Curated performance-mutation sites for chronicle-wire (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants chronicle-wire --source data/external-src/<checkout> \
#       --sites data/projects/chronicle-wire/mutation_sites.yaml

package_root: net.openhft.chronicle.wire

sites:
