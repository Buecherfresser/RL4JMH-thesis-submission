  - {class: io.github.burukeyou.dataframe.util.FrameUtil, method: toListFI4, match: "(Map<K, Map<J, Map<H, V>>> map)", note: "FrameUtil.toListFI4"}
  - {class: io.github.burukeyou.dataframe.util.ListUtils, method: isEmpty, match: "(Collection<?> coll)", note: "ListUtils.isEmpty"}
  - {class: io.github.burukeyou.dataframe.util.ListUtils, method: isNotEmpty, match: "(Collection<?> coll)", note: "ListUtils.isNotEmpty"}
  - {class: io.github.burukeyou.dataframe.util.MathUtils, method: percentage, match: "(BigDecimal dividend)", note: "MathUtils.percentage"}
  - {class: io.github.burukeyou.dataframe.util.MathUtils, method: percentage, match: "(BigDecimal dividend,int scale)", note: "MathUtils.percentage"}
  - {class: io.github.burukeyou.dataframe.util.MathUtils, method: proportion, match: "(BigDecimal dividend, BigDecimal divisor, int scale)", note: "MathUtils.proportion"}
  - {class: io.github.burukeyou.dataframe.util.PartitionList, method: size, match: "()", note: "PartitionList.size"}
  - {class: io.github.burukeyou.dataframe.util.PartitionList, method: isEmpty, match: "()", note: "PartitionList.isEmpty"}
  - {class: io.github.burukeyou.dataframe.util.PartitionList, method: checkElementIndex, match: "(int index, int size, String desc)", note: "PartitionList.checkElementIndex"}
  - {class: io.github.burukeyou.dataframe.iframe.group.GroupWindowImpl, method: sortAsc, match: "(Function<T, U> sortField)", note: "GroupWindowImpl.sortAsc"}
  - {class: io.github.burukeyou.dataframe.iframe.group.GroupWindowImpl, method: sortDesc, match: "(Function<T, U> sortField)", note: "GroupWindowImpl.sortDesc"}
  - {class: io.github.burukeyou.dataframe.iframe.group.GroupWindowImpl, method: distinct, match: "(Function<T, U> distinctField)", note: "GroupWindowImpl.distinct"}
  - {class: io.github.burukeyou.dataframe.iframe.impl.JDFrameImpl, method: toLists, match: "()", note: "JDFrameImpl.toLists"}
  - {class: io.github.burukeyou.dataframe.iframe.impl.JDFrameImpl, method: viewList, match: "()", note: "JDFrameImpl.viewList"}
  - {class: io.github.burukeyou.dataframe.iframe.impl.JDFrameImpl, method: stream, match: "()", note: "JDFrameImpl.stream"}
  - {class: io.github.burukeyou.dataframe.iframe.impl.SDFrameImpl, method: toLists, match: "()", note: "SDFrameImpl.toLists"}
  - {class: io.github.burukeyou.dataframe.iframe.impl.SDFrameImpl, method: viewList, match: "()", note: "SDFrameImpl.viewList"}
  - {class: io.github.burukeyou.dataframe.iframe.impl.SDFrameImpl, method: from, match: "(Stream<R> data)", note: "SDFrameImpl.from"}
