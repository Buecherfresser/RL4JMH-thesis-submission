  - {class: org.LatencyUtils.TimeCappedMovingAverageIntervalEstimator, method: getEstimatedInterval, match: "(final long when)", note: "TimeCappedMovingAverageIntervalEstimator.getEstimatedInterval"}
  - {class: org.LatencyUtils.TimeCappedMovingAverageIntervalEstimator, method: stop, match: "()", note: "TimeCappedMovingAverageIntervalEstimator.stop"}
  - {class: org.LatencyUtils.TimeCappedMovingAverageIntervalEstimator, method: stop, match: "()", note: "TimeCappedMovingAverageIntervalEstimator.stop"}
  - {class: org.LatencyUtils.TimeCappedMovingAverageIntervalEstimator, method: handlePauseEvent, match: "(final long pauseLength, final long pauseEndTime)", note: "TimeCappedMovingAverageIntervalEstimator.handlePauseEvent"}
  - {class: org.LatencyUtils.TimeServices, method: nanoTime, match: "()", note: "TimeServices.nanoTime"}
