# Curated performance-mutation sites for zerocell (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants zerocell --source data/external-src/<checkout> \
#       --sites data/projects/zerocell/mutation_sites.yaml

package_root: com.creditdatamw.zerocell

sites:
  - {class: com.creditdatamw.zerocell.ReaderUtil, method: process, match: "(String path, String sheetName, ZeroCellReader reader)", note: "ReaderUtil.process"}
  - {class: com.creditdatamw.zerocell.column.ColumnMapping, method: getRowNumberInfo, match: "()", note: "ColumnMapping.getRowNumberInfo"}
  - {class: com.creditdatamw.zerocell.converter.ConverterUtils, method: convertValueToType, match: "(Class<?> fieldType,", note: "ConverterUtils.convertValueToType"}
  - {class: com.creditdatamw.zerocell.handler.EntityExcelSheetHandler, method: startRow, match: "(int i)", note: "EntityExcelSheetHandler.startRow"}
  - {class: com.creditdatamw.zerocell.processor.ZeroCellAnnotationProcessor, method: getSupportedAnnotationTypes, match: "()", note: "ZeroCellAnnotationProcessor.getSupportedAnnotationTypes"}
  - {class: com.creditdatamw.zerocell.ReaderUtil, method: process, match: "(File file, String sheetName, ZeroCellReader reader)", note: "ReaderUtil.process"}
  - {class: com.creditdatamw.zerocell.column.ColumnMapping, method: getColumns, match: "()", note: "ColumnMapping.getColumns"}
  - {class: com.creditdatamw.zerocell.converter.ConverterUtils, method: convertValueToType, match: "(Class<?> fieldType,", note: "ConverterUtils.convertValueToType"}
  - {class: com.creditdatamw.zerocell.handler.EntityExcelSheetHandler, method: endRow, match: "(int i)", note: "EntityExcelSheetHandler.endRow"}
  - {class: com.creditdatamw.zerocell.processor.ZeroCellAnnotationProcessor, method: getSupportedSourceVersion, match: "()", note: "ZeroCellAnnotationProcessor.getSupportedSourceVersion"}
  - {class: com.creditdatamw.zerocell.ReaderUtil, method: process, match: "(InputStream is, String sheetName, ZeroCellReader reader)", note: "ReaderUtil.process"}
  - {class: com.creditdatamw.zerocell.column.ColumnMapping, method: parseColumnMappingFromAnnotations, match: "(Class<?> clazz)", note: "ColumnMapping.parseColumnMappingFromAnnotations"}
  - {class: com.creditdatamw.zerocell.converter.BooleanConverter, method: convert, match: "(String value, String columnName, int row)", note: "BooleanConverter.convert"}
  - {class: com.creditdatamw.zerocell.handler.EntityExcelSheetHandler, method: cell, match: "(String cellReference, String formattedValue, XSSFComment xssfComment)", note: "EntityExcelSheetHandler.cell"}
  - {class: com.creditdatamw.zerocell.processor.ZeroCellAnnotationProcessor, method: init, match: "(ProcessingEnvironment env)", note: "ZeroCellAnnotationProcessor.init"}
  - {class: com.creditdatamw.zerocell.Reader, method: columnsOf, match: "(Class<T> clazz)", note: "Reader.columnsOf"}
  - {class: com.creditdatamw.zerocell.column.ColumnMapping, method: getColumnsMap, match: "()", note: "ColumnMapping.getColumnsMap"}
  - {class: com.creditdatamw.zerocell.converter.Converters, method: newDefaultConverters, match: "()", note: "Converters.newDefaultConverters"}
  - {class: com.creditdatamw.zerocell.handler.EntityExcelSheetHandler, method: headerFooter, match: "(String text, boolean b, String tagName)", note: "EntityExcelSheetHandler.headerFooter"}
  - {class: com.creditdatamw.zerocell.processor.ZeroCellAnnotationProcessor, method: process, match: "(Set<? extends TypeElement> annotations, RoundEnvironment env)", note: "ZeroCellAnnotationProcessor.process"}
  - {class: com.creditdatamw.zerocell.Reader, method: of, match: "(Class<T> clazz)", note: "Reader.of"}
  - {class: com.creditdatamw.zerocell.column.ColumnInfo, method: getName, match: "()", note: "ColumnInfo.getName"}
  - {class: com.creditdatamw.zerocell.converter.DefaultConverters, method: convert, match: "(String value, String columnName, int row)", note: "DefaultConverters.convert"}
  - {class: com.creditdatamw.zerocell.handler.EntityHandler, method: getSheetName, match: "()", note: "EntityHandler.getSheetName"}
  - {class: com.creditdatamw.zerocell.processor.spec.CellMethodSpec, method: build, match: "(List<ColumnInfoType> columns)", note: "CellMethodSpec.build"}
  - {class: com.creditdatamw.zerocell.Reader, method: from, match: "(File file)", note: "Reader.from"}
