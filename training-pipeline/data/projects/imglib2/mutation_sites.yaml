# Curated performance-mutation sites for imglib2 (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants imglib2 --source data/external-src/<checkout> \
#       --sites data/projects/imglib2/mutation_sites.yaml

package_root: net.imglib2.img

sites:
  - {class: net.imglib2.img.ImgView, method: factory, match: "()", note: "ImgView.factory"}
  - {class: net.imglib2.img.array.ArrayImg, method: cursor, match: "()", note: "ArrayImg.cursor"}
  - {class: net.imglib2.img.basictypeaccess.array.AbstractByteArray, method: getValue, match: "( final int index )", note: "AbstractByteArray.getValue"}
  - {class: net.imglib2.img.cell.Cell, method: size, match: "()", note: "Cell.size"}
  - {class: net.imglib2.img.list.ListCursor, method: jumpFwd, match: "( final long steps )", note: "ListCursor.jumpFwd"}
  - {class: net.imglib2.img.planar.PlanarCursor, method: getCurrentSliceIndex, match: "()", note: "PlanarCursor.getCurrentSliceIndex"}
