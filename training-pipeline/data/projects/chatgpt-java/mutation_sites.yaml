  - {class: com.unfbx.chatgpt.utils.SSEUtil, method: post, match: "(OkHttpClient okHttpClient, String url, T body, EventSourceListener eventSourceListener)", note: "SSEUtil.post"}
  - {class: com.unfbx.chatgpt.OpenAiStreamClient, method: streamChatCompletion, match: "(T chatCompletion, EventSourceListener eventSourceListener)", note: "OpenAiStreamClient.streamChatCompletion"}
  - {class: com.unfbx.chatgpt.entity.chat.Message, method: role, match: "(Role role)", note: "Message.role"}
