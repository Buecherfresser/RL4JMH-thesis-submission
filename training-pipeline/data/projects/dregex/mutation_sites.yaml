# Curated performance-mutation sites for dregex (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants dregex --source data/external-src/<checkout> \
#       --sites data/projects/dregex/mutation_sites.yaml

package_root: dregex.impl

sites:
  - {class: dregex.impl.RangeOps, method: diff, match: "(List<AbstractRange> left, List<? extends AbstractRange> right)", note: "RangeOps.diff"}
  - {class: dregex.impl.database.UnicodeDatabaseReader, method: compareTo, match: "(Range other)", note: "UnicodeDatabaseReader.compareTo"}
  - {class: dregex.impl.tree.CharRange, method: toRegex, match: "()", note: "CharRange.toRegex"}
  - {class: dregex.impl.RangeOps, method: diff, match: "(AbstractRange left, List<? extends AbstractRange> right)", note: "RangeOps.diff"}
  - {class: dregex.impl.database.UnicodeDatabaseReader, method: getBlocks, match: "(Reader reader) throws IOException", note: "UnicodeDatabaseReader.getBlocks"}
  - {class: dregex.impl.tree.CharRange, method: from, match: "()", note: "CharRange.from"}
  - {class: dregex.impl.RegexParser, method: isChar, match: "(char c)", note: "RegexParser.isChar"}
  - {class: dregex.impl.tree.CharSet, method: complement, match: "()", note: "CharSet.complement"}
  - {class: dregex.impl.RegexParser, method: parse, match: "(String regex, Flags flags)", note: "RegexParser.parse"}
  - {class: dregex.impl.tree.CharSet, method: toRegex, match: "()", note: "CharSet.toRegex"}
  - {class: dregex.impl.Util, method: doIntersect, match: "(Set<A> left, Set<A> right)", note: "Util.doIntersect"}
  - {class: dregex.impl.tree.Difference, method: canonical, match: "()", note: "Difference.canonical"}
  - {class: dregex.impl.Util, method: union, match: "(Set<A> left, Set<A> right)", note: "Util.union"}
  - {class: dregex.impl.tree.Disj, method: toRegex, match: "()", note: "Disj.toRegex"}
  - {class: dregex.impl.CaseExpansion, method: expand, match: "(int codePoint)", note: "CaseExpansion.expand"}
  - {class: dregex.impl.tree.Disj, method: canonical, match: "()", note: "Disj.canonical"}
  - {class: dregex.impl.CaseExpansion, method: expand, match: "(int codePoint)", note: "CaseExpansion.expand"}
  - {class: dregex.impl.tree.Intersection, method: canonical, match: "()", note: "Intersection.canonical"}
  - {class: dregex.impl.CharInterval, method: compareTo, match: "(CharInterval that)", note: "CharInterval.compareTo"}
  - {class: dregex.impl.tree.Juxt, method: canonical, match: "()", note: "Juxt.canonical"}
  - {class: dregex.impl.CharInterval, method: calculateNonOverlapping, match: "(List<AbstractRange> ranges)", note: "CharInterval.calculateNonOverlapping"}
  - {class: dregex.impl.tree.Juxt, method: toRegex, match: "()", note: "Juxt.toRegex"}
  - {class: dregex.impl.CompiledRegex, method: originalString, match: "()", note: "CompiledRegex.originalString"}
  - {class: dregex.impl.tree.Lit, method: from, match: "()", note: "Lit.from"}
  - {class: dregex.impl.CompiledRegex, method: parsedTree, match: "()", note: "CompiledRegex.parsedTree"}
  - {class: dregex.impl.tree.Lit, method: to, match: "()", note: "Lit.to"}
  - {class: dregex.impl.Compiler, method: fromTree, match: "(Node ast)", note: "Compiler.fromTree"}
  - {class: dregex.impl.tree.Lookaround, method: toRegex, match: "()", note: "Lookaround.toRegex"}
  - {class: dregex.impl.Compiler, method: addTransitionsFromJuxtNoLookaround, match: "(", note: "Compiler.addTransitionsFromJuxtNoLookaround"}
  - {class: dregex.impl.tree.Lookaround, method: canonical, match: "()", note: "Lookaround.canonical"}
  - {class: dregex.impl.CompilerHelper, method: combineNegLookaheads, match: "(Juxt juxt)", note: "CompilerHelper.combineNegLookaheads"}
  - {class: dregex.impl.tree.NamedCaptureGroup, method: toRegex, match: "()", note: "NamedCaptureGroup.toRegex"}
  - {class: dregex.impl.CompilerHelper, method: findLookaround, match: "(List<? extends Node> nodes)", note: "CompilerHelper.findLookaround"}
  - {class: dregex.impl.tree.NamedCaptureGroup, method: caseExpansion, match: "(CaseExpansion caseExpansion)", note: "NamedCaptureGroup.caseExpansion"}
  - {class: dregex.impl.Dfa, method: allStates, match: "()", note: "Dfa.allStates"}
  - {class: dregex.impl.tree.PositionalCaptureGroup, method: toRegex, match: "()", note: "PositionalCaptureGroup.toRegex"}
  - {class: dregex.impl.Dfa, method: allButAccepting, match: "()", note: "Dfa.allButAccepting"}
  - {class: dregex.impl.tree.PositionalCaptureGroup, method: caseExpansion, match: "(CaseExpansion caseExpansion)", note: "PositionalCaptureGroup.caseExpansion"}
  - {class: dregex.impl.DfaAlgorithms, method: doIntersect, match: "(Dfa left, Dfa right)", note: "DfaAlgorithms.doIntersect"}
  - {class: dregex.impl.tree.Rep, method: toRegex, match: "()", note: "Rep.toRegex"}
