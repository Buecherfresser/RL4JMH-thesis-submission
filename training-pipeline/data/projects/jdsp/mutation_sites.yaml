# Curated performance-mutation sites for jdsp (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jdsp --source data/external-src/<checkout> \
#       --sites data/projects/jdsp/mutation_sites.yaml

package_root: com.github.psambit9791

sites:
