# GRPO (Group Relative Policy Optimization) stage. See jmhgen.config.GRPOConfig.
base_model: Qwen/Qwen2.5-Coder-7B-Instruct
output_dir: outputs/grpo
dataset_path: data/snippets.jsonl
seed: 42
max_seq_len: 4096
learning_rate: 1.0e-6
per_device_batch_size: 1
gradient_accumulation_steps: 8

group_size: 8
rollout_temperature: 1.0
kl_coeff: 0.04
num_iterations: 1000
reward_weights:
  compile: 0.25
  runtime: 0.25
  anti_pattern: 0.0       # extension point (not yet implemented)
  rsd: 0.0                # extension point (not yet implemented)
  mutation: 0.0           # extension point (not yet implemented)
runner:
  jmh_version: "1.37"
  java_release: 17
  jmh:
    warmup_iterations: 3
    measurement_iterations: 5
    forks: 1
