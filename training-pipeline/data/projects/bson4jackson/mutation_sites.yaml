# Curated performance-mutation sites for bson4jackson (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants bson4jackson --source data/external-src/<checkout> \
#       --sites data/projects/bson4jackson/mutation_sites.yaml

package_root: de.undercouch.bson4jackson

sites:
  - {class: de.undercouch.bson4jackson.BsonParser, method: getMask, match: "()", note: "BsonParser.getMask"}
  - {class: de.undercouch.bson4jackson.deserializers.BsonCalendarDeserializer, method: deserialize, match: "(JsonParser jp, DeserializationContext ctxt)", note: "BsonCalendarDeserializer.deserialize"}
  - {class: de.undercouch.bson4jackson.io.BoundedInputStream, method: mark, match: "(int readlimit)", note: "BoundedInputStream.mark"}
  - {class: de.undercouch.bson4jackson.serializers.BsonCalendarSerializer, method: serialize, match: "(Calendar value, JsonGenerator gen,", note: "BsonCalendarSerializer.serialize"}
  - {class: de.undercouch.bson4jackson.types.Decimal128, method: parse, match: "(final String value)", note: "Decimal128.parse"}
  - {class: de.undercouch.bson4jackson.BsonParser, method: isEnabled, match: "(Feature f)", note: "BsonParser.isEnabled"}
