# Curated performance-mutation sites for dnsjava (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants dnsjava --source data/external-src/<checkout> \
#       --sites data/projects/dnsjava/mutation_sites.yaml

package_root: org.xbill.DNS

sites:
  - {class: org.xbill.DNS.ReverseMap, method: fromAddress, match: "(byte[] addr)", note: "ReverseMap.fromAddress"}
  - {class: org.xbill.DNS.config.AndroidResolverConfigProvider, method: setContext, match: "(Context ctx)", note: "AndroidResolverConfigProvider.setContext"}
  - {class: org.xbill.DNS.dnssec.NSEC3ValUtils, method: stripUnknownAlgNSEC3s, match: "(List<SRRset> nsec3s)", note: "NSEC3ValUtils.stripUnknownAlgNSEC3s"}
  - {class: org.xbill.DNS.hosts.HostsFileParser, method: getAddressForHost, match: "(Name name, int type) throws IOException", note: "HostsFileParser.getAddressForHost"}
  - {class: org.xbill.DNS.io.DefaultIoClientFactory, method: createOrGetTcpClient, match: "()", note: "DefaultIoClientFactory.createOrGetTcpClient"}
  - {class: org.xbill.DNS.lookup.LookupFailedException, method: getName, match: "()", note: "LookupFailedException.getName"}
  - {class: org.xbill.DNS.spi.DNSJavaNameService, method: lookupAllHostAddr, match: "(String host) throws UnknownHostException", note: "DNSJavaNameService.lookupAllHostAddr"}
  - {class: org.xbill.DNS.tools.Tools, method: main, match: "(String[] args) throws Exception", note: "Tools.main"}
  - {class: org.xbill.DNS.utils.base16, method: fromString, match: "(String str)", note: "base16.fromString"}
  - {class: org.xbill.DNS.ReverseMap, method: fromAddress, match: "(int[] addr)", note: "ReverseMap.fromAddress"}
  - {class: org.xbill.DNS.config.AndroidResolverConfigProvider, method: initialize, match: "() throws InitializationException", note: "AndroidResolverConfigProvider.initialize"}
  - {class: org.xbill.DNS.dnssec.NSEC3ValUtils, method: allNSEC3sIgnorable, match: "(List<SRRset> nsec3s, KeyCache dnskeyRrset)", note: "NSEC3ValUtils.allNSEC3sIgnorable"}
  - {class: org.xbill.DNS.io.DefaultIoClientFactory, method: createOrGetUdpClient, match: "()", note: "DefaultIoClientFactory.createOrGetUdpClient"}
  - {class: org.xbill.DNS.lookup.LookupSession, method: resolver, match: "(@NonNull Resolver resolver)", note: "LookupSession.resolver"}
  - {class: org.xbill.DNS.spi.DNSJavaNameService, method: getHostByAddr, match: "(byte[] addr) throws UnknownHostException", note: "DNSJavaNameService.getHostByAddr"}
  - {class: org.xbill.DNS.tools.dig, method: main, match: "(String[] argv) throws IOException", note: "dig.main"}
  - {class: org.xbill.DNS.utils.base32, method: fromString, match: "(String str)", note: "base32.fromString"}
  - {class: org.xbill.DNS.SetResponse, method: isUnknown, match: "()", note: "SetResponse.isUnknown"}
  - {class: org.xbill.DNS.config.FallbackPropertyResolverConfigProvider, method: initialize, match: "()", note: "FallbackPropertyResolverConfigProvider.initialize"}
  - {class: org.xbill.DNS.dnssec.ValUtils, method: setCanonicalNsecOwner, match: "(SRRset set, RRSIGRecord sig)", note: "ValUtils.setCanonicalNsecOwner"}
  - {class: org.xbill.DNS.lookup.LookupSession, method: maxRedirects, match: "(int maxRedirects)", note: "LookupSession.maxRedirects"}
  - {class: org.xbill.DNS.spi.DNSJavaNameServiceDescriptor, method: createNameService, match: "()", note: "DNSJavaNameServiceDescriptor.createNameService"}
  - {class: org.xbill.DNS.tools.dig, method: startAXFR, match: "()", note: "dig.startAXFR"}
  - {class: org.xbill.DNS.utils.base64, method: formatString, match: "(byte[] b, int lineLength, String prefix, boolean addClose)", note: "base64.formatString"}
  - {class: org.xbill.DNS.SetResponse, method: isNXDOMAIN, match: "()", note: "SetResponse.isNXDOMAIN"}
  - {class: org.xbill.DNS.config.JndiContextResolverConfigProvider, method: initialize, match: "()", note: "JndiContextResolverConfigProvider.initialize"}
  - {class: org.xbill.DNS.dnssec.ValUtils, method: init, match: "(Properties config)", note: "ValUtils.init"}
  - {class: org.xbill.DNS.spi.DNSJavaNameServiceDescriptor, method: getProviderName, match: "()", note: "DNSJavaNameServiceDescriptor.getProviderName"}
  - {class: org.xbill.DNS.tools.jnamed, method: addPrimaryZone, match: "(String zname, String zonefile) throws IOException", note: "jnamed.addPrimaryZone"}
  - {class: org.xbill.DNS.utils.base64, method: fromString, match: "(String str)", note: "base64.fromString"}
  - {class: org.xbill.DNS.A6Record, method: rrFromWire, match: "(DNSInput in) throws IOException", note: "A6Record.rrFromWire"}
  - {class: org.xbill.DNS.config.JndiContextResolverConfigProvider, method: initialize, match: "()", note: "JndiContextResolverConfigProvider.initialize"}
  - {class: org.xbill.DNS.dnssec.DefaultTrustAnchorStore, method: store, match: "(RRset rrset)", note: "DefaultTrustAnchorStore.store"}
