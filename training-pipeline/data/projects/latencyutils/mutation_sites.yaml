  - {class: org.LatencyUtils.MovingAverageIntervalEstimator, method: getCurrentPosition, match: "()", note: "MovingAverageIntervalEstimator.getCurrentPosition"}
  - {class: org.LatencyUtils.SimplePauseDetector, method: setVerbose, match: "(boolean verbose)", note: "SimplePauseDetector.setVerbose"}
  - {class: org.LatencyUtils.SimplePauseDetector, method: shutdown, match: "()", note: "SimplePauseDetector.shutdown"}
  - {class: org.LatencyUtils.SimplePauseDetector, method: run, match: "()", note: "SimplePauseDetector.run"}
  - {class: org.LatencyUtils.SimplePauseDetector, method: stallDetectorThreads, match: "(long threadNumberMask, long stallLength) throws InterruptedException", note: "SimplePauseDetector.stallDetectorThreads"}
