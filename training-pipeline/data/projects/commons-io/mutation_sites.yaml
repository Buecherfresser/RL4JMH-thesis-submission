# Curated performance-mutation sites for commons-io (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants commons-io --source data/external-src/<checkout> \
#       --sites data/projects/commons-io/mutation_sites.yaml

package_root: org.apache.commons.io

sites:
  - {class: org.apache.commons.io.Buffers, method: clear, match: "(final Buffer buffer)", note: "Buffers.clear"}
  - {class: org.apache.commons.io.channels.ByteArraySeekableByteChannel, method: builder, match: "()", note: "ByteArraySeekableByteChannel.builder"}
  - {class: org.apache.commons.io.charset.CharsetDecoders, method: toCharsetDecoder, match: "(final CharsetDecoder charsetDecoder)", note: "CharsetDecoders.toCharsetDecoder"}
  - {class: org.apache.commons.io.file.DirectoryStreamFilter, method: accept, match: "(final Path path) throws IOException", note: "DirectoryStreamFilter.accept"}
  - {class: org.apache.commons.io.filefilter.FileFilterUtils, method: ageFileFilter, match: "(final Date cutoffDate)", note: "FileFilterUtils.ageFileFilter"}
  - {class: org.apache.commons.io.function.IOStreamAdapter, method: wrap, match: "(final Stream<T> delegate)", note: "IOStreamAdapter.wrap"}
  - {class: org.apache.commons.io.input.AutoCloseInputStream, method: builder, match: "()", note: "AutoCloseInputStream.builder"}
  - {class: org.apache.commons.io.monitor.FileAlterationListenerAdaptor, method: onDirectoryChange, match: "(final File directory)", note: "FileAlterationListenerAdaptor.onDirectoryChange"}
