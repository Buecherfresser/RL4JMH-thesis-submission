# Curated performance-mutation sites for r5 (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants r5 --source data/external-src/<checkout> \
#       --sites data/projects/r5/mutation_sites.yaml

package_root: com.conveyal.r5

sites:
  - {class: com.conveyal.r5.analyst.ByteArrayOutputInputStream, method: getInputStream, match: "()", note: "ByteArrayOutputInputStream.getInputStream"}
  - {class: com.conveyal.r5.api.ProfileResponse, method: getOptions, match: "()", note: "ProfileResponse.getOptions"}
  - {class: com.conveyal.r5.common.DirectionUtils, method: getAzimuth, match: "(Coordinate a, Coordinate b)", note: "DirectionUtils.getAzimuth"}
  - {class: com.conveyal.r5.labeling.LevelOfTrafficStressLabeler, method: label, match: "(Way way, EnumSet<EdgeStore.EdgeFlag> forwardFlags, EnumSet<EdgeStore.EdgeFlag> backFlags)", note: "LevelOfTrafficStressLabeler.label"}
  - {class: com.conveyal.r5.model.json_serialization.BitSetSerializer, method: makeModule, match: "()", note: "BitSetSerializer.makeModule"}
  - {class: com.conveyal.r5.point_to_point.PointToPointRouterServer, method: main, match: "(String[] commandArguments)", note: "PointToPointRouterServer.main"}
  - {class: com.conveyal.r5.profile.FareDominatingList, method: getNonDominatedStates, match: "()", note: "FareDominatingList.getNonDominatedStates"}
  - {class: com.conveyal.r5.rastercost.BooleanField, method: lengthWherePositive, match: "(int edgePairIndex)", note: "BooleanField.lengthWherePositive"}
  - {class: com.conveyal.r5.shapefile.ShapefileMain, method: main, match: "(String[] args) throws Throwable", note: "ShapefileMain.main"}
