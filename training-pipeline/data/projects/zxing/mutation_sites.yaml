  - {class: com.google.zxing.multi.qrcode.QRCodeMultiReader, method: decodeMultiple, match: "(BinaryBitmap image, Map<DecodeHintType,?> hints) throws NotFoundException", note: "QRCodeMultiReader.decodeMultiple"}
  - {class: com.google.zxing.oned.rss.expanded.decoders.AI01392xDecoder, method: parseInformation, match: "() throws NotFoundException, FormatException", note: "AI01392xDecoder.parseInformation"}
  - {class: com.google.zxing.pdf417.PDF417Common, method: toIntArray, match: "(Collection<Integer> list)", note: "PDF417Common.toIntArray"}
  - {class: com.google.zxing.qrcode.QRCodeReader, method: getDecoder, match: "()", note: "QRCodeReader.getDecoder"}
  - {class: com.google.zxing.web.generator.client.PhoneNumberGenerator, method: getText, match: "() throws GeneratorException", note: "PhoneNumberGenerator.getText"}
  - {class: com.google.zxing.DecodeHintType, method: getValueType, match: "()", note: "DecodeHintType.getValueType"}
  - {class: com.google.zxing.aztec.detector.Detector, method: detect, match: "() throws NotFoundException", note: "Detector.detect"}
  - {class: com.google.zxing.client.j2se.CommandLineEncoder, method: main, match: "(String[] args) throws Exception", note: "CommandLineEncoder.main"}
  - {class: com.google.zxing.common.DecoderResult, method: getRawBytes, match: "()", note: "DecoderResult.getRawBytes"}
  - {class: com.google.zxing.datamatrix.encoder.EncoderContext, method: setSymbolShape, match: "(SymbolShapeHint shape)", note: "EncoderContext.setSymbolShape"}
  - {class: com.google.zxing.multi.qrcode.detector.MultiDetector, method: detectMulti, match: "(Map<DecodeHintType,?> hints) throws NotFoundException", note: "MultiDetector.detectMulti"}
  - {class: com.google.zxing.oned.rss.expanded.decoders.AI01393xDecoder, method: parseInformation, match: "() throws NotFoundException, FormatException", note: "AI01393xDecoder.parseInformation"}
  - {class: com.google.zxing.pdf417.PDF417Reader, method: decodeMultiple, match: "(BinaryBitmap image) throws NotFoundException", note: "PDF417Reader.decodeMultiple"}
  - {class: com.google.zxing.qrcode.QRCodeReader, method: reset, match: "()", note: "QRCodeReader.reset"}
