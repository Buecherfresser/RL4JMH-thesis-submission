# Curated performance-mutation sites for wire (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants wire --source data/external-src/<checkout> \
#       --sites data/projects/wire/mutation_sites.yaml

package_root: com.squareup.wire

sites:
  - {class: com.squareup.wire.java.JavaGenerator, method: builtInType, match: "(ProtoType protoType)", note: "JavaGenerator.builtInType"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: newBuilder, match: "()", note: "AllTypes.newBuilder"}
  - {class: com.squareup.wire.java.JavaGenerator, method: load, match: "(Type type) throws Exception", note: "JavaGenerator.load"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: int32, match: "(int int32)", note: "AllTypes.int32"}
  - {class: com.squareup.wire.java.JavaGenerator, method: withAndroid, match: "(boolean emitAndroid)", note: "JavaGenerator.withAndroid"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: uint32, match: "(int uint32)", note: "AllTypes.uint32"}
  - {class: com.squareup.wire.java.JavaGenerator, method: withAndroidAnnotations, match: "(boolean emitAndroidAnnotations)", note: "JavaGenerator.withAndroidAnnotations"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: sint32, match: "(int sint32)", note: "AllTypes.sint32"}
  - {class: com.squareup.wire.java.JavaGenerator, method: withCompact, match: "(boolean emitCompact)", note: "JavaGenerator.withCompact"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: fixed32, match: "(int fixed32)", note: "AllTypes.fixed32"}
  - {class: com.squareup.wire.java.JavaGenerator, method: withProfile, match: "(Profile profile)", note: "JavaGenerator.withProfile"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: sfixed32, match: "(int sfixed32)", note: "AllTypes.sfixed32"}
  - {class: com.squareup.wire.java.JavaGenerator, method: withOptions, match: "(boolean emitDeclaredOptions, boolean emitAppliedOptions)", note: "JavaGenerator.withOptions"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: int64, match: "(long int64)", note: "AllTypes.int64"}
  - {class: com.squareup.wire.java.JavaGenerator, method: withBuildersOnly, match: "(boolean buildersOnly)", note: "JavaGenerator.withBuildersOnly"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: uint64, match: "(long uint64)", note: "AllTypes.uint64"}
  - {class: com.squareup.wire.java.JavaGenerator, method: newName, match: "(String packageName, String simpleName)", note: "JavaGenerator.newName"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: sint64, match: "(long sint64)", note: "AllTypes.sint64"}
  - {class: com.squareup.wire.java.JavaGenerator, method: nestedName, match: "(ClassName enclosing, String simpleName)", note: "JavaGenerator.nestedName"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: fixed64, match: "(long fixed64)", note: "AllTypes.fixed64"}
  - {class: com.squareup.wire.java.JavaGenerator, method: schema, match: "()", note: "JavaGenerator.schema"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: sfixed64, match: "(long sfixed64)", note: "AllTypes.sfixed64"}
  - {class: com.squareup.wire.java.JavaGenerator, method: typeName, match: "(ProtoType protoType)", note: "JavaGenerator.typeName"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: bool, match: "(boolean bool)", note: "AllTypes.bool"}
  - {class: com.squareup.wire.java.JavaGenerator, method: isEnum, match: "(ProtoType type)", note: "JavaGenerator.isEnum"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: float_, match: "(float float_)", note: "AllTypes.float_"}
  - {class: com.squareup.wire.java.JavaGenerator, method: generatedTypeName, match: "(Type type)", note: "JavaGenerator.generatedTypeName"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: double_, match: "(double double_)", note: "AllTypes.double_"}
  - {class: com.squareup.wire.java.JavaGenerator, method: generateType, match: "(Type type)", note: "JavaGenerator.generateType"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: string, match: "(String string)", note: "AllTypes.string"}
  - {class: com.squareup.wire.java.JavaGenerator, method: generateAdapterForCustomType, match: "(Type type)", note: "JavaGenerator.generateAdapterForCustomType"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: bytes, match: "(ByteString bytes)", note: "AllTypes.bytes"}
  - {class: com.squareup.wire.java.JavaGenerator, method: generatedTypeName, match: "(ProtoMember member)", note: "JavaGenerator.generatedTypeName"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: nested_enum, match: "(NestedEnum nested_enum)", note: "AllTypes.nested_enum"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: nested_message, match: "(NestedMessage nested_message)", note: "AllTypes.nested_message"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: any, match: "(AnyMessage any)", note: "AllTypes.any"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: duration, match: "(Duration duration)", note: "AllTypes.duration"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: struct, match: "(Map<String, ?> struct)", note: "AllTypes.struct"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: list_value, match: "(List<?> list_value)", note: "AllTypes.list_value"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: value, match: "(Object value)", note: "AllTypes.value"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: null_value, match: "(Void null_value)", note: "AllTypes.null_value"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: empty, match: "(Unit empty)", note: "AllTypes.empty"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: timestamp, match: "(Instant timestamp)", note: "AllTypes.timestamp"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: opt_int32, match: "(Integer opt_int32)", note: "AllTypes.opt_int32"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: opt_uint32, match: "(Integer opt_uint32)", note: "AllTypes.opt_uint32"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: opt_sint32, match: "(Integer opt_sint32)", note: "AllTypes.opt_sint32"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: opt_fixed32, match: "(Integer opt_fixed32)", note: "AllTypes.opt_fixed32"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: opt_sfixed32, match: "(Integer opt_sfixed32)", note: "AllTypes.opt_sfixed32"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: opt_int64, match: "(Long opt_int64)", note: "AllTypes.opt_int64"}
  - {class: com.squareup.wire.proto3.java.all_types.AllTypes, method: opt_uint64, match: "(Long opt_uint64)", note: "AllTypes.opt_uint64"}
