# Curated performance-mutation sites for jgraphx (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jgraphx --source data/external-src/<checkout> \
#       --sites data/projects/jgraphx/mutation_sites.yaml

package_root: com.mxgraph

sites:
  - {class: com.mxgraph.analysis.mxConstantCostFunction, method: getCost, match: "(mxCellState state)", note: "mxConstantCostFunction.getCost"}
  - {class: com.mxgraph.canvas.mxGraphics2DCanvas, method: putShape, match: "(String name, mxIShape shape)", note: "mxGraphics2DCanvas.putShape"}
  - {class: com.mxgraph.costfunction.mxConstCostFunction, method: getCost, match: "(mxCellState state)", note: "mxConstCostFunction.getCost"}
  - {class: com.mxgraph.generatorfunction.mxGeneratorConstFunction, method: getCost, match: "(mxCellState state)", note: "mxGeneratorConstFunction.getCost"}
  - {class: com.mxgraph.io.mxCellCodec, method: isExcluded, match: "(Object obj, String attr, Object value,", note: "mxCellCodec.isExcluded"}
  - {class: com.mxgraph.layout.hierarchical.model.mxGraphHierarchyEdge, method: invert, match: "()", note: "mxGraphHierarchyEdge.invert"}
  - {class: com.mxgraph.model.mxCell, method: getId, match: "()", note: "mxCell.getId"}
  - {class: com.mxgraph.reader.mxDomOutputParser, method: main, match: "(String[] args)", note: "mxDomOutputParser.main"}
  - {class: com.mxgraph.shape.mxActorShape, method: createShape, match: "(mxGraphics2DCanvas canvas, mxCellState state)", note: "mxActorShape.createShape"}
  - {class: com.mxgraph.swing.handler.mxCellHandler, method: isActive, match: "()", note: "mxCellHandler.isActive"}
  - {class: com.mxgraph.util.mxDomUtils, method: createDocument, match: "()", note: "mxDomUtils.createDocument"}
  - {class: com.mxgraph.view.mxCellState, method: isInvalid, match: "()", note: "mxCellState.isInvalid"}
  - {class: com.mxgraph.analysis.mxDistanceCostFunction, method: getCost, match: "(mxCellState state)", note: "mxDistanceCostFunction.getCost"}
  - {class: com.mxgraph.canvas.mxGraphics2DCanvas, method: getShape, match: "(Map<String, Object> style)", note: "mxGraphics2DCanvas.getShape"}
  - {class: com.mxgraph.costfunction.mxDoubleValCostFunction, method: getCost, match: "(mxCellState state)", note: "mxDoubleValCostFunction.getCost"}
  - {class: com.mxgraph.generatorfunction.mxGeneratorRandomFunction, method: getCost, match: "(mxCellState state)", note: "mxGeneratorRandomFunction.getCost"}
  - {class: com.mxgraph.io.mxCellCodec, method: afterEncode, match: "(mxCodec enc, Object obj, Node node)", note: "mxCellCodec.afterEncode"}
  - {class: com.mxgraph.layout.hierarchical.model.mxGraphHierarchyEdge, method: isReversed, match: "()", note: "mxGraphHierarchyEdge.isReversed"}
  - {class: com.mxgraph.model.mxCell, method: setId, match: "(String id)", note: "mxCell.setId"}
  - {class: com.mxgraph.reader.mxDomOutputParser, method: initHandlers, match: "()", note: "mxDomOutputParser.initHandlers"}
  - {class: com.mxgraph.shape.mxArrowShape, method: createShape, match: "(mxGraphics2DCanvas canvas, mxCellState state)", note: "mxArrowShape.createShape"}
  - {class: com.mxgraph.swing.handler.mxCellHandler, method: refresh, match: "(mxCellState state)", note: "mxCellHandler.refresh"}
  - {class: com.mxgraph.util.mxDomUtils, method: createSvgDocument, match: "(int width, int height)", note: "mxDomUtils.createSvgDocument"}
  - {class: com.mxgraph.view.mxCellState, method: setInvalid, match: "(boolean invalid)", note: "mxCellState.setInvalid"}
  - {class: com.mxgraph.analysis.mxAnalysisGraph, method: getEdges, match: "(Object cell, Object parent, boolean incoming, boolean outgoing, boolean includeLoops, boolean recurse)", note: "mxAnalysisGraph.getEdges"}
  - {class: com.mxgraph.canvas.mxGraphicsCanvas2D, method: removeEldestEntry, match: "(Map.Entry<String, Color> eldest)", note: "mxGraphicsCanvas2D.removeEldestEntry"}
  - {class: com.mxgraph.generatorfunction.mxGeneratorRandomFunction, method: getMaxWeight, match: "()", note: "mxGeneratorRandomFunction.getMaxWeight"}
  - {class: com.mxgraph.io.mxChildChangeCodec, method: isReference, match: "(Object obj, String attr, Object value,", note: "mxChildChangeCodec.isReference"}
  - {class: com.mxgraph.layout.hierarchical.model.mxGraphHierarchyModel, method: createInternalCells, match: "(mxHierarchicalLayout layout,", note: "mxGraphHierarchyModel.createInternalCells"}
  - {class: com.mxgraph.model.mxCellPath, method: create, match: "(mxICell cell)", note: "mxCellPath.create"}
  - {class: com.mxgraph.reader.mxGraphViewImageReader, method: getBackground, match: "()", note: "mxGraphViewImageReader.getBackground"}
  - {class: com.mxgraph.shape.mxBasicShape, method: paintShape, match: "(mxGraphics2DCanvas canvas, mxCellState state)", note: "mxBasicShape.paintShape"}
  - {class: com.mxgraph.swing.handler.mxCellMarker, method: setEnabled, match: "(boolean enabled)", note: "mxCellMarker.setEnabled"}
  - {class: com.mxgraph.util.mxStyleUtils, method: getStylename, match: "(String style)", note: "mxStyleUtils.getStylename"}
  - {class: com.mxgraph.view.mxConnectionConstraint, method: getPoint, match: "()", note: "mxConnectionConstraint.getPoint"}
  - {class: com.mxgraph.analysis.mxAnalysisGraph, method: getEdges, match: "(Object cell, Object parent, boolean includeLoops, boolean recurse)", note: "mxAnalysisGraph.getEdges"}
  - {class: com.mxgraph.canvas.mxGraphicsCanvas2D, method: setGraphics, match: "(Graphics2D value)", note: "mxGraphicsCanvas2D.setGraphics"}
  - {class: com.mxgraph.generatorfunction.mxGeneratorRandomIntFunction, method: getCost, match: "(mxCellState state)", note: "mxGeneratorRandomIntFunction.getCost"}
  - {class: com.mxgraph.io.mxChildChangeCodec, method: afterEncode, match: "(mxCodec enc, Object obj, Node node)", note: "mxChildChangeCodec.afterEncode"}
  - {class: com.mxgraph.layout.hierarchical.model.mxGraphHierarchyModel, method: initialRank, match: "()", note: "mxGraphHierarchyModel.initialRank"}
  - {class: com.mxgraph.model.mxCellPath, method: getParentPath, match: "(String path)", note: "mxCellPath.getParentPath"}
  - {class: com.mxgraph.reader.mxGraphViewImageReader, method: setBackground, match: "(Color background)", note: "mxGraphViewImageReader.setBackground"}
  - {class: com.mxgraph.shape.mxBasicShape, method: createShape, match: "(mxGraphics2DCanvas canvas, mxCellState state)", note: "mxBasicShape.createShape"}
  - {class: com.mxgraph.swing.handler.mxCellMarker, method: isEnabled, match: "()", note: "mxCellMarker.isEnabled"}
  - {class: com.mxgraph.util.mxStyleUtils, method: getStylenames, match: "(String style)", note: "mxStyleUtils.getStylenames"}
  - {class: com.mxgraph.view.mxConnectionConstraint, method: setPoint, match: "(mxPoint value)", note: "mxConnectionConstraint.setPoint"}
  - {class: com.mxgraph.analysis.mxFibonacciHeap, method: getNode, match: "(Object element, boolean create)", note: "mxFibonacciHeap.getNode"}
  - {class: com.mxgraph.canvas.mxHtmlCanvas, method: appendHtmlElement, match: "(Element node)", note: "mxHtmlCanvas.appendHtmlElement"}
  - {class: com.mxgraph.generatorfunction.mxGeneratorRandomIntFunction, method: getMaxWeight, match: "()", note: "mxGeneratorRandomIntFunction.getMaxWeight"}
  - {class: com.mxgraph.io.mxCodec, method: getDocument, match: "()", note: "mxCodec.getDocument"}
