# Curated performance-mutation sites for stateless4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants stateless4j --source data/external-src/<checkout> \
#       --sites data/projects/stateless4j/mutation_sites.yaml

package_root: com.github.oxo42

sites:
  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: call, match: "()", note: "StateConfiguration.call"}
  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: doIt, match: "()", note: "StateConfiguration.doIt"}
  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: doIt, match: "(Object[] args)", note: "StateConfiguration.doIt"}
  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: permit, match: "(T trigger, S destinationState)", note: "StateConfiguration.permit"}
  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: permit, match: "(T trigger, S destinationState, final Action action)", note: "StateConfiguration.permit"}
  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: permitIf, match: "(T trigger, S destinationState, FuncBoolean guard)", note: "StateConfiguration.permitIf"}
  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: permitIf, match: "(T trigger, S destinationState, FuncBoolean guard, Action action)", note: "StateConfiguration.permitIf"}
  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: permitIfElseIgnore, match: "(T trigger, S destinationState, final FuncBoolean guard)", note: "StateConfiguration.permitIfElseIgnore"}
  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: call, match: "()", note: "StateConfiguration.call"}
  - {class: com.github.oxo42.stateless4j.StateConfiguration, method: permitIfElseIgnore, match: "(T trigger, S destinationState, final FuncBoolean guard, Action action)", note: "StateConfiguration.permitIfElseIgnore"}
