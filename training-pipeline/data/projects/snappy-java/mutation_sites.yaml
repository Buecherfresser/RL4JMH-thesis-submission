  - {class: org.xerial.snappy.SnappyHadoopCompatibleOutputStream, method: writeBlockPreemble, match: "()", note: "SnappyHadoopCompatibleOutputStream.writeBlockPreemble"}
  - {class: org.xerial.snappy.pool.QuiescentBufferPool, method: allocateArray, match: "(int size)", note: "QuiescentBufferPool.allocateArray"}
  - {class: org.xerial.snappy.SnappyInputStream, method: close, match: "()", note: "SnappyInputStream.close"}
  - {class: org.xerial.snappy.pool.QuiescentBufferPool, method: releaseArray, match: "(byte[] buffer)", note: "QuiescentBufferPool.releaseArray"}
  - {class: org.xerial.snappy.SnappyInputStream, method: readHeader, match: "()", note: "SnappyInputStream.readHeader"}
  - {class: org.xerial.snappy.pool.DefaultPoolFactory, method: getDefaultPool, match: "()", note: "DefaultPoolFactory.getDefaultPool"}
