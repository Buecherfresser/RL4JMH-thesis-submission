  - {class: org.msgpack.value.ValueFactory, method: newNil, match: "()", note: "ValueFactory.newNil"}
  - {class: org.msgpack.core.buffer.ByteBufferInput, method: reset, match: "(ByteBuffer input)", note: "ByteBufferInput.reset"}
  - {class: org.msgpack.jackson.dataformat.ExtensionTypeCustomDeserializers, method: addCustomDeser, match: "(byte type, final Deser deser)", note: "ExtensionTypeCustomDeserializers.addCustomDeser"}
  - {class: org.msgpack.value.ValueFactory, method: newBoolean, match: "(boolean v)", note: "ValueFactory.newBoolean"}
  - {class: org.msgpack.core.buffer.ByteBufferInput, method: close, match: "()", note: "ByteBufferInput.close"}
  - {class: org.msgpack.jackson.dataformat.ExtensionTypeCustomDeserializers, method: getDeser, match: "(byte type)", note: "ExtensionTypeCustomDeserializers.getDeser"}
  - {class: org.msgpack.value.ValueType, method: isNilType, match: "()", note: "ValueType.isNilType"}
