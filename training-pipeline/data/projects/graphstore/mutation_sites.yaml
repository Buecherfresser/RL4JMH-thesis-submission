  - {class: org.gephi.graph.impl.FormattingAndParsingUtils, method: parseDateTimeOrTimestamp, match: "(String timeStr, ZoneId zoneId) throws DateTimeParseException", note: "FormattingAndParsingUtils.parseDateTimeOrTimestamp"}
  - {class: org.gephi.graph.api.types.IntervalBooleanMap, method: getBoolean, match: "(Interval interval, boolean defaultValue)", note: "IntervalBooleanMap.getBoolean"}
