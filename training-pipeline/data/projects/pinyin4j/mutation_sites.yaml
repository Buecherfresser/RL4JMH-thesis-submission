# Curated performance-mutation sites for pinyin4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants pinyin4j --source data/external-src/<checkout> \
#       --sites data/projects/pinyin4j/mutation_sites.yaml

package_root: com.hp.hpl

sites:
  - {class: com.hp.hpl.sparta.ParseByteStream, method: getSystemId, match: "()", note: "ParseByteStream.getSystemId"}
  - {class: com.hp.hpl.sparta.ParseByteStream, method: getLineNumber, match: "()", note: "ParseByteStream.getLineNumber"}
  - {class: com.hp.hpl.sparta.ParseCharStream, method: getSystemId, match: "()", note: "ParseCharStream.getSystemId"}
  - {class: com.hp.hpl.sparta.ParseCharStream, method: getLineNumber, match: "()", note: "ParseCharStream.getLineNumber"}
  - {class: com.hp.hpl.sparta.xpath.SimpleStreamTokenizer, method: ordinaryChar, match: "(char ch)", note: "SimpleStreamTokenizer.ordinaryChar"}
  - {class: com.hp.hpl.sparta.xpath.SimpleStreamTokenizer, method: wordChars, match: "(char from, char to)", note: "SimpleStreamTokenizer.wordChars"}
  - {class: com.hp.hpl.sparta.BuildDocument, method: setParseSource, match: "(ParseSource ps)", note: "BuildDocument.setParseSource"}
  - {class: com.hp.hpl.sparta.BuildDocument, method: getParseSource, match: "()", note: "BuildDocument.getParseSource"}
  - {class: com.hp.hpl.sparta.DefaultParseHandler, method: setParseSource, match: "(ParseSource ps)", note: "DefaultParseHandler.setParseSource"}
  - {class: com.hp.hpl.sparta.DefaultParseHandler, method: getParseSource, match: "()", note: "DefaultParseHandler.getParseSource"}
  - {class: com.hp.hpl.sparta.Document, method: getSystemId, match: "()", note: "Document.getSystemId"}
  - {class: com.hp.hpl.sparta.Document, method: setSystemId, match: "(String systemId)", note: "Document.setSystemId"}
  - {class: com.hp.hpl.sparta.Element, method: cloneShallow, match: "()", note: "Element.cloneShallow"}
  - {class: com.hp.hpl.sparta.Element, method: cloneElement, match: "(boolean deep)", note: "Element.cloneElement"}
  - {class: com.hp.hpl.sparta.ParseException, method: getLineNumber, match: "()", note: "ParseException.getLineNumber"}
  - {class: com.hp.hpl.sparta.ParseException, method: getCause, match: "()", note: "ParseException.getCause"}
  - {class: com.hp.hpl.sparta.Sparta, method: intern, match: "(String s)", note: "Sparta.intern"}
  - {class: com.hp.hpl.sparta.Sparta, method: main, match: "(String[] args)", note: "Sparta.main"}
  - {class: com.hp.hpl.sparta.Text, method: appendData, match: "(String s)", note: "Text.appendData"}
  - {class: com.hp.hpl.sparta.Text, method: appendData, match: "(char ch)", note: "Text.appendData"}
  - {class: com.hp.hpl.sparta.XPathVisitor, method: visit, match: "(ThisNodeTest a)", note: "XPathVisitor.visit"}
  - {class: com.hp.hpl.sparta.XPathVisitor, method: visit, match: "(ParentNodeTest a) throws XPathException", note: "XPathVisitor.visit"}
  - {class: com.hp.hpl.sparta.xpath.AllElementTest, method: accept, match: "(Visitor visitor)", note: "AllElementTest.accept"}
  - {class: com.hp.hpl.sparta.xpath.AllElementTest, method: isStringValue, match: "()", note: "AllElementTest.isStringValue"}
  - {class: com.hp.hpl.sparta.xpath.AttrEqualsExpr, method: accept, match: "(BooleanExprVisitor visitor) throws XPathException", note: "AttrEqualsExpr.accept"}
  - {class: com.hp.hpl.sparta.xpath.AttrExistsExpr, method: accept, match: "(BooleanExprVisitor visitor) throws XPathException", note: "AttrExistsExpr.accept"}
  - {class: com.hp.hpl.sparta.xpath.AttrGreaterExpr, method: accept, match: "(BooleanExprVisitor visitor) throws XPathException", note: "AttrGreaterExpr.accept"}
  - {class: com.hp.hpl.sparta.xpath.AttrLessExpr, method: accept, match: "(BooleanExprVisitor visitor) throws XPathException", note: "AttrLessExpr.accept"}
  - {class: com.hp.hpl.sparta.xpath.AttrNotEqualsExpr, method: accept, match: "(BooleanExprVisitor visitor) throws XPathException", note: "AttrNotEqualsExpr.accept"}
  - {class: com.hp.hpl.sparta.xpath.AttrTest, method: accept, match: "(Visitor visitor)", note: "AttrTest.accept"}
  - {class: com.hp.hpl.sparta.xpath.AttrTest, method: isStringValue, match: "()", note: "AttrTest.isStringValue"}
  - {class: com.hp.hpl.sparta.xpath.ElementTest, method: accept, match: "(Visitor visitor)", note: "ElementTest.accept"}
  - {class: com.hp.hpl.sparta.xpath.ElementTest, method: isStringValue, match: "()", note: "ElementTest.isStringValue"}
  - {class: com.hp.hpl.sparta.xpath.ParentNodeTest, method: accept, match: "(Visitor visitor) throws XPathException", note: "ParentNodeTest.accept"}
  - {class: com.hp.hpl.sparta.xpath.ParentNodeTest, method: isStringValue, match: "()", note: "ParentNodeTest.isStringValue"}
  - {class: com.hp.hpl.sparta.xpath.PositionEqualsExpr, method: accept, match: "(BooleanExprVisitor visitor) throws XPathException", note: "PositionEqualsExpr.accept"}
  - {class: com.hp.hpl.sparta.xpath.PositionEqualsExpr, method: getPosition, match: "()", note: "PositionEqualsExpr.getPosition"}
  - {class: com.hp.hpl.sparta.xpath.Step, method: isMultiLevel, match: "()", note: "Step.isMultiLevel"}
  - {class: com.hp.hpl.sparta.xpath.Step, method: isStringValue, match: "()", note: "Step.isStringValue"}
  - {class: com.hp.hpl.sparta.xpath.TextEqualsExpr, method: accept, match: "(BooleanExprVisitor visitor) throws XPathException", note: "TextEqualsExpr.accept"}
  - {class: com.hp.hpl.sparta.xpath.TextExistsExpr, method: accept, match: "(BooleanExprVisitor visitor) throws XPathException", note: "TextExistsExpr.accept"}
  - {class: com.hp.hpl.sparta.xpath.TextNotEqualsExpr, method: accept, match: "(BooleanExprVisitor visitor) throws XPathException", note: "TextNotEqualsExpr.accept"}
  - {class: com.hp.hpl.sparta.xpath.TextTest, method: accept, match: "(Visitor visitor) throws XPathException", note: "TextTest.accept"}
  - {class: com.hp.hpl.sparta.xpath.TextTest, method: isStringValue, match: "()", note: "TextTest.isStringValue"}
  - {class: com.hp.hpl.sparta.xpath.ThisNodeTest, method: accept, match: "(Visitor visitor)", note: "ThisNodeTest.accept"}
  - {class: com.hp.hpl.sparta.xpath.ThisNodeTest, method: isStringValue, match: "()", note: "ThisNodeTest.isStringValue"}
  - {class: com.hp.hpl.sparta.xpath.TrueExpr, method: accept, match: "(BooleanExprVisitor visitor)", note: "TrueExpr.accept"}
  - {class: com.hp.hpl.sparta.xpath.XPath, method: isAbsolute, match: "()", note: "XPath.isAbsolute"}
  - {class: com.hp.hpl.sparta.xpath.XPath, method: isStringValue, match: "()", note: "XPath.isStringValue"}
  - {class: com.hp.hpl.sparta.xpath.XPathException, method: getCause, match: "()", note: "XPathException.getCause"}
