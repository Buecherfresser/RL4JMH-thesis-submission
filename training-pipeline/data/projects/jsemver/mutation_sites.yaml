  - {class: com.github.zafarkhaja.semver.expr.ExpressionParser, method: parse, match: "(String input)", note: "ExpressionParser.parse"}
  - {class: com.github.zafarkhaja.semver.util.Stream, method: consume, match: "()", note: "Stream.consume"}
  - {class: com.github.zafarkhaja.semver.util.Stream, method: consume, match: "(T... expected)", note: "Stream.consume"}
  - {class: com.github.zafarkhaja.semver.util.Stream, method: pushBack, match: "()", note: "Stream.pushBack"}
  - {class: com.github.zafarkhaja.semver.util.Stream, method: lookahead, match: "()", note: "Stream.lookahead"}
  - {class: com.github.zafarkhaja.semver.util.Stream, method: lookahead, match: "(int position)", note: "Stream.lookahead"}
