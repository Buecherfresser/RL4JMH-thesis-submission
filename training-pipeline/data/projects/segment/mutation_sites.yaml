# Curated performance-mutation sites for segment (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants segment --source data/external-src/<checkout> \
#       --sites data/projects/segment/mutation_sites.yaml

package_root: com.github.houbb

sites:
  - {class: com.github.houbb.segment.util.CharUtils, method: isConsequent, match: "(final char ch)", note: "CharUtils.isConsequent"}
  - {class: com.github.houbb.segment.util.CharUtils, method: isConnectorChars, match: "(final char ch)", note: "CharUtils.isConnectorChars"}
  - {class: com.github.houbb.segment.bs.SegmentBs, method: newInstance, match: "()", note: "SegmentBs.newInstance"}
  - {class: com.github.houbb.segment.bs.SegmentBs, method: segment, match: "(ISegment segment)", note: "SegmentBs.segment"}
  - {class: com.github.houbb.segment.constant.enums.HmmStateEnum, method: index, match: "()", note: "HmmStateEnum.index"}
  - {class: com.github.houbb.segment.constant.enums.HmmStateEnum, method: state, match: "()", note: "HmmStateEnum.state"}
  - {class: com.github.houbb.segment.constant.enums.SegmentPosEnum, method: code, match: "()", note: "SegmentPosEnum.code"}
  - {class: com.github.houbb.segment.constant.enums.SegmentPosEnum, method: desc, match: "()", note: "SegmentPosEnum.desc"}
