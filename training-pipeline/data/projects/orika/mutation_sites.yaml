# Curated performance-mutation sites for orika (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants orika --source data/external-src/<checkout> \
#       --sites data/projects/orika/mutation_sites.yaml

package_root: ma.glasnost.orika

sites:
  - {class: ma.glasnost.orika.MapEntry, method: getKey, match: "()", note: "MapEntry.getKey"}
  - {class: ma.glasnost.orika.cern.colt.map.OpenIntObjectHashMap, method: containsKey, match: "(int key)", note: "OpenIntObjectHashMap.containsKey"}
  - {class: ma.glasnost.orika.constructor.ConstructorParameterResolver, method: getProperties, match: "(java.lang.reflect.Type type)", note: "ConstructorParameterResolver.getProperties"}
  - {class: ma.glasnost.orika.converter.builtin.DateToStringConverter, method: convertTo, match: "(Date source, Type<String> destinationType, MappingContext context)", note: "DateToStringConverter.convertTo"}
  - {class: ma.glasnost.orika.impl.ConfigurableMapper, method: init, match: "()", note: "ConfigurableMapper.init"}
  - {class: ma.glasnost.orika.inheritance.SuperTypeResolver, method: getSuperType, match: "(final Type<?> enhancedClass, final SuperTypeResolverStrategy strategy)", note: "SuperTypeResolver.getSuperType"}
  - {class: ma.glasnost.orika.jsr166x.ConcurrentSkipListMap, method: getKey, match: "()", note: "ConcurrentSkipListMap.getKey"}
  - {class: ma.glasnost.orika.metadata.ArrayElementProperty, method: isArrayElement, match: "()", note: "ArrayElementProperty.isArrayElement"}
  - {class: ma.glasnost.orika.property.IntrospectorPropertyResolver, method: collectProperties, match: "(Class<?> type, Type<?> referenceType, Map<String, Property> properties)", note: "IntrospectorPropertyResolver.collectProperties"}
  - {class: ma.glasnost.orika.unenhance.BaseUnenhancer, method: addUnenhanceStrategy, match: "(final UnenhanceStrategy strategy)", note: "BaseUnenhancer.addUnenhanceStrategy"}
  - {class: ma.glasnost.orika.util.SortedSet, method: mustAdd, match: "(V item)", note: "SortedSet.mustAdd"}
  - {class: ma.glasnost.orika.MapEntry, method: getValue, match: "()", note: "MapEntry.getValue"}
  - {class: ma.glasnost.orika.cern.colt.map.OpenIntObjectHashMap, method: indexOfInsertion, match: "(int key)", note: "OpenIntObjectHashMap.indexOfInsertion"}
  - {class: ma.glasnost.orika.constructor.ConstructorParameterResolver, method: getPossibleConstructorParams, match: "(java.lang.reflect.Type type, String name)", note: "ConstructorParameterResolver.getPossibleConstructorParams"}
  - {class: ma.glasnost.orika.converter.builtin.DateToStringConverter, method: convertFrom, match: "(String source, Type<Date> destinationType, MappingContext context)", note: "DateToStringConverter.convertFrom"}
  - {class: ma.glasnost.orika.impl.ConfigurableMapper, method: configure, match: "(MapperFactory factory)", note: "ConfigurableMapper.configure"}
