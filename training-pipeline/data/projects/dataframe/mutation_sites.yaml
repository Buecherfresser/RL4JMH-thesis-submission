# Curated performance-mutation sites for dataframe (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants dataframe --source data/external-src/<checkout> \
#       --sites data/projects/dataframe/mutation_sites.yaml

package_root: de.unknownreality.dataframe

sites:
  - {class: de.unknownreality.dataframe.DataFrameBuilder, method: createDefault, match: "()", note: "DataFrameBuilder.createDefault"}
  - {class: de.unknownreality.dataframe.column.StringColumn, method: getValueType, match: "()", note: "StringColumn.getValueType"}
  - {class: de.unknownreality.dataframe.common.NumberUtil, method: subtract, match: "(Number a, Number b, Class<T> cl)", note: "NumberUtil.subtract"}
  - {class: de.unknownreality.dataframe.csv.CSVReaderBuilder, method: create, match: "()", note: "CSVReaderBuilder.create"}
  - {class: de.unknownreality.dataframe.filter.compile.PredicateCompileErrorListener, method: syntaxError, match: "(Recognizer<?, ?> recognizer, Object offendingSymbol, int line, int charPositionInLine, String msg, RecognitionException e)", note: "PredicateCompileErrorListener.syntaxError"}
  - {class: de.unknownreality.dataframe.group.impl.TreeGroupUtil, method: groupBy, match: "(DataFrame df, String... columns)", note: "TreeGroupUtil.groupBy"}
  - {class: de.unknownreality.dataframe.index.Indices, method: isIndexColumn, match: "(DataFrameColumn<?, ?> column)", note: "Indices.isIndexColumn"}
  - {class: de.unknownreality.dataframe.io.GZipUtil, method: isGzipped, match: "(File file)", note: "GZipUtil.isGzipped"}
  - {class: de.unknownreality.dataframe.join.impl.DefaultJoinUtil, method: leftJoin, match: "(DataFrame dfA, DataFrame dfB, JoinColumn... joinColumns)", note: "DefaultJoinUtil.leftJoin"}
  - {class: de.unknownreality.dataframe.meta.DataFrameMeta, method: create, match: "(DataFrame dataFrame, Class<? extends ReadFormat> readFormatClass, DataWriter dataWriterBuilder)", note: "DataFrameMeta.create"}
  - {class: de.unknownreality.dataframe.print.ColumnPrintSettings, method: isAutoWidth, match: "()", note: "ColumnPrintSettings.isAutoWidth"}
  - {class: de.unknownreality.dataframe.sort.SortColumn, method: getName, match: "()", note: "SortColumn.getName"}
  - {class: de.unknownreality.dataframe.transform.StringColumnConverter, method: convert, match: "(StringColumn column, Class<C> colType) throws DataFrameException", note: "StringColumnConverter.convert"}
  - {class: de.unknownreality.dataframe.type.impl.StringType, method: convertRaw, match: "(Object o)", note: "StringType.convertRaw"}
  - {class: de.unknownreality.dataframe.DataFrameBuilder, method: createFrom, match: "(DataIterator<?> dataIterator)", note: "DataFrameBuilder.createFrom"}
  - {class: de.unknownreality.dataframe.column.StringColumn, method: getThis, match: "()", note: "StringColumn.getThis"}
  - {class: de.unknownreality.dataframe.common.NumberUtil, method: multiply, match: "(Number a, Number b, Class<T> cl)", note: "NumberUtil.multiply"}
  - {class: de.unknownreality.dataframe.csv.CSVReaderBuilder, method: withSeparator, match: "(char separator)", note: "CSVReaderBuilder.withSeparator"}
  - {class: de.unknownreality.dataframe.filter.ColumnComparePredicate, method: valid, match: "(Row<?, String> row)", note: "ColumnComparePredicate.valid"}
  - {class: de.unknownreality.dataframe.group.impl.TreeGroupUtil, method: clear, match: "()", note: "TreeGroupUtil.clear"}
  - {class: de.unknownreality.dataframe.index.Indices, method: replace, match: "(DataFrameColumn<?, ?> existing, DataFrameColumn<?, ?> replacement)", note: "Indices.replace"}
  - {class: de.unknownreality.dataframe.io.GZipUtil, method: isGzipped, match: "(InputStream is)", note: "GZipUtil.isGzipped"}
  - {class: de.unknownreality.dataframe.join.impl.DefaultJoinUtil, method: leftJoin, match: "(DataFrame  dfA, DataFrame  dfB, String joinSuffixA, String joinSuffixB, JoinColumn... joinColumns)", note: "DefaultJoinUtil.leftJoin"}
  - {class: de.unknownreality.dataframe.meta.DataFrameMeta, method: create, match: "(Class<? extends ReadFormat> readFormatClass, List<DataFrameColumn<?, ?>> columns, Map<String, String> writerAttributes)", note: "DataFrameMeta.create"}
  - {class: de.unknownreality.dataframe.print.ColumnPrintSettings, method: setAutoWidth, match: "(boolean autoWidth)", note: "ColumnPrintSettings.setAutoWidth"}
  - {class: de.unknownreality.dataframe.sort.SortColumn, method: getDirection, match: "()", note: "SortColumn.getDirection"}
  - {class: de.unknownreality.dataframe.transform.CountTransformer, method: transform, match: "(DataFrameColumn<T, ?> source)", note: "CountTransformer.transform"}
  - {class: de.unknownreality.dataframe.type.impl.StringType, method: parse, match: "(String s)", note: "StringType.parse"}
  - {class: de.unknownreality.dataframe.ColumnSelection, method: where, match: "(String colName, Object value)", note: "ColumnSelection.where"}
  - {class: de.unknownreality.dataframe.column.BooleanColumn, method: getValueType, match: "()", note: "BooleanColumn.getValueType"}
  - {class: de.unknownreality.dataframe.common.StringSplitter, method: create, match: "()", note: "StringSplitter.create"}
  - {class: de.unknownreality.dataframe.csv.CSVSettings, method: isQuoteDetection, match: "()", note: "CSVSettings.isQuoteDetection"}
  - {class: de.unknownreality.dataframe.filter.ColumnComparePredicate, method: convertValue, match: "(ValueType<T> type, Object value) throws ParseException", note: "ColumnComparePredicate.convertValue"}
  - {class: de.unknownreality.dataframe.group.DataGroup, method: getGroupHeader, match: "()", note: "DataGroup.getGroupHeader"}
  - {class: de.unknownreality.dataframe.index.TreeIndex, method: setUnique, match: "(boolean unique)", note: "TreeIndex.setUnique"}
  - {class: de.unknownreality.dataframe.io.ColumnInformation, method: setColumnType, match: "(Class<? extends DataFrameColumn> columnType)", note: "ColumnInformation.setColumnType"}
  - {class: de.unknownreality.dataframe.join.impl.DirectionJoinUtil, method: createDirectionJoin, match: "(DataFrame dfA, DataFrame dfB,", note: "DirectionJoinUtil.createDirectionJoin"}
  - {class: de.unknownreality.dataframe.print.DefaultNumberFormatter, method: format, match: "(ValueType<?> valueType, Object value, int maxWidth)", note: "DefaultNumberFormatter.format"}
  - {class: de.unknownreality.dataframe.type.DataFrameTypeManager, method: getColumnType, match: "(Class<T> type)", note: "DataFrameTypeManager.getColumnType"}
  - {class: de.unknownreality.dataframe.ColumnSelection, method: where, match: "(FilterPredicate predicate)", note: "ColumnSelection.where"}
  - {class: de.unknownreality.dataframe.column.BooleanColumn, method: and, match: "(BooleanColumn other)", note: "BooleanColumn.and"}
  - {class: de.unknownreality.dataframe.common.StringSplitter, method: setDetectQuotes, match: "(boolean detectQuotes)", note: "StringSplitter.setDetectQuotes"}
  - {class: de.unknownreality.dataframe.csv.CSVSettings, method: isSingleQuoteDetection, match: "()", note: "CSVSettings.isSingleQuoteDetection"}
  - {class: de.unknownreality.dataframe.filter.ComparePredicate, method: getHeaderName, match: "()", note: "ComparePredicate.getHeaderName"}
  - {class: de.unknownreality.dataframe.group.DataGroup, method: getGroupValues, match: "()", note: "DataGroup.getGroupValues"}
  - {class: de.unknownreality.dataframe.index.TreeIndex, method: getName, match: "()", note: "TreeIndex.getName"}
  - {class: de.unknownreality.dataframe.io.ColumnInformation, method: isAutodetect, match: "()", note: "ColumnInformation.isAutodetect"}
  - {class: de.unknownreality.dataframe.join.impl.JoinOperationUtil, method: fillValues, match: "(int[] joinIndices, DataRow row, Object[] joinedRowValues)", note: "JoinOperationUtil.fillValues"}
  - {class: de.unknownreality.dataframe.print.PrinterBuilder, method: create, match: "()", note: "PrinterBuilder.create"}
  - {class: de.unknownreality.dataframe.type.DataFrameTypeManager, method: register, match: "(DataFrameColumn<?, ?> col)", note: "DataFrameTypeManager.register"}
