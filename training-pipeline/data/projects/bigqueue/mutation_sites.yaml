  - {class: com.leansoft.bigqueue.BigArrayImpl, method: getBackFileSize, match: "() throws IOException", note: "BigArrayImpl.getBackFileSize"}
  - {class: com.leansoft.bigqueue.page.MappedPageFactoryImpl, method: getFirstPageIndexBefore, match: "(long timestamp)", note: "MappedPageFactoryImpl.getFirstPageIndexBefore"}
  - {class: com.leansoft.bigqueue.BigArrayImpl, method: limitBackFileSize, match: "(long sizeLimit) throws IOException", note: "BigArrayImpl.limitBackFileSize"}
  - {class: com.leansoft.bigqueue.page.MappedPageFactoryImpl, method: getBackPageFileSet, match: "()", note: "MappedPageFactoryImpl.getBackPageFileSet"}
  - {class: com.leansoft.bigqueue.BigArrayImpl, method: getItemLength, match: "(long index) throws IOException", note: "BigArrayImpl.getItemLength"}
  - {class: com.leansoft.bigqueue.page.MappedPageFactoryImpl, method: getBackPageFileSize, match: "()", note: "MappedPageFactoryImpl.getBackPageFileSize"}
  - {class: com.leansoft.bigqueue.BigQueueImpl, method: isEmpty, match: "()", note: "BigQueueImpl.isEmpty"}
  - {class: com.leansoft.bigqueue.page.MappedPageImpl, method: close, match: "() throws IOException", note: "MappedPageImpl.close"}
