# Curated performance-mutation sites for fastcsv (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants fastcsv --source data/external-src/<checkout> \
#       --sites data/projects/fastcsv/mutation_sites.yaml

package_root: de.siegmar.fastcsv

sites:
  - {class: de.siegmar.fastcsv.reader.BomInputStreamReader, method: close, match: "() throws IOException", note: "BomInputStreamReader.close"}
  - {class: de.siegmar.fastcsv.util.Util, method: containsDupe, match: "(final char... chars)", note: "Util.containsDupe"}
  - {class: de.siegmar.fastcsv.writer.AutoflushingFastBufferedWriter, method: endRecord, match: "() throws IOException", note: "AutoflushingFastBufferedWriter.endRecord"}
  - {class: de.siegmar.fastcsv.reader.CollectingStatusListener, method: onInit, match: "(final long fileSize)", note: "CollectingStatusListener.onInit"}
  - {class: de.siegmar.fastcsv.util.Util, method: isNewline, match: "(final char character)", note: "Util.isNewline"}
  - {class: de.siegmar.fastcsv.writer.FastBufferedWriter, method: endRecord, match: "() throws IOException", note: "FastBufferedWriter.endRecord"}
  - {class: de.siegmar.fastcsv.reader.CollectingStatusListener, method: getFileSize, match: "()", note: "CollectingStatusListener.getFileSize"}
  - {class: de.siegmar.fastcsv.util.Util, method: containsNewline, match: "(final String str)", note: "Util.containsNewline"}
  - {class: de.siegmar.fastcsv.writer.FastBufferedWriter, method: close, match: "() throws IOException", note: "FastBufferedWriter.close"}
  - {class: de.siegmar.fastcsv.reader.CollectingStatusListener, method: onReadRecord, match: "()", note: "CollectingStatusListener.onReadRecord"}
  - {class: de.siegmar.fastcsv.util.Preconditions, method: checkArgument, match: "(final boolean expression, final String errorMessage)", note: "Preconditions.checkArgument"}
  - {class: de.siegmar.fastcsv.writer.CsvWriter, method: builder, match: "()", note: "CsvWriter.builder"}
  - {class: de.siegmar.fastcsv.reader.RandomAccessFileInputStream, method: close, match: "() throws IOException", note: "RandomAccessFileInputStream.close"}
  - {class: de.siegmar.fastcsv.util.Preconditions, method: checkArgument, match: "(final boolean expression, final Supplier<String> errorMessageSupplier)", note: "Preconditions.checkArgument"}
  - {class: de.siegmar.fastcsv.writer.CsvWriter, method: writeRecord, match: "(final Iterable<String> values)", note: "CsvWriter.writeRecord"}
  - {class: de.siegmar.fastcsv.reader.RelaxedCsvParser, method: parse, match: "() throws IOException", note: "RelaxedCsvParser.parse"}
  - {class: de.siegmar.fastcsv.writer.CsvWriter, method: writeRecord, match: "(final String... values)", note: "CsvWriter.writeRecord"}
  - {class: de.siegmar.fastcsv.reader.RelaxedCsvParser, method: peekLine, match: "() throws IOException", note: "RelaxedCsvParser.peekLine"}
  - {class: de.siegmar.fastcsv.writer.LineDelimiter, method: of, match: "(final String str)", note: "LineDelimiter.of"}
  - {class: de.siegmar.fastcsv.reader.RelaxedCsvParser, method: skipLine, match: "(final int numCharsToSkip) throws IOException", note: "RelaxedCsvParser.skipLine"}
  - {class: de.siegmar.fastcsv.writer.NoCloseWriter, method: close, match: "()", note: "NoCloseWriter.close"}
  - {class: de.siegmar.fastcsv.reader.SeekableInputStreamReader, method: close, match: "() throws IOException", note: "SeekableInputStreamReader.close"}
  - {class: de.siegmar.fastcsv.writer.QuoteStrategies, method: quoteNull, match: "(final int lineNo, final int fieldIdx)", note: "QuoteStrategies.quoteNull"}
  - {class: de.siegmar.fastcsv.reader.StrictCsvParser, method: parse, match: "() throws IOException", note: "StrictCsvParser.parse"}
  - {class: de.siegmar.fastcsv.writer.QuoteStrategies, method: quoteEmpty, match: "(final int lineNo, final int fieldIdx)", note: "QuoteStrategies.quoteEmpty"}
  - {class: de.siegmar.fastcsv.reader.StrictCsvParser, method: getStartingLineNumber, match: "()", note: "StrictCsvParser.getStartingLineNumber"}
  - {class: de.siegmar.fastcsv.writer.QuoteStrategies, method: quoteValue, match: "(final int lineNo, final int fieldIdx, final String value)", note: "QuoteStrategies.quoteValue"}
  - {class: de.siegmar.fastcsv.reader.StrictCsvParser, method: reset, match: "(final long startingLineNumber)", note: "StrictCsvParser.reset"}
  - {class: de.siegmar.fastcsv.writer.UnbufferedWriter, method: endRecord, match: "() throws IOException", note: "UnbufferedWriter.endRecord"}
  - {class: de.siegmar.fastcsv.reader.StringArrayHandler, method: builder, match: "()", note: "StringArrayHandler.builder"}
  - {class: de.siegmar.fastcsv.reader.StringArrayHandler, method: of, match: "()", note: "StringArrayHandler.of"}
  - {class: de.siegmar.fastcsv.reader.StringArrayHandler, method: of, match: "(final Consumer<StringArrayHandlerBuilder> configurer)", note: "StringArrayHandler.of"}
  - {class: de.siegmar.fastcsv.reader.CsvReader, method: builder, match: "()", note: "CsvReader.builder"}
  - {class: de.siegmar.fastcsv.reader.CsvReader, method: skipLines, match: "(final int lineCount)", note: "CsvReader.skipLines"}
  - {class: de.siegmar.fastcsv.reader.CsvReader, method: skipLines, match: "(final Predicate<String> predicate, final int maxLines)", note: "CsvReader.skipLines"}
  - {class: de.siegmar.fastcsv.reader.CsvRecord, method: getStartingLineNumber, match: "()", note: "CsvRecord.getStartingLineNumber"}
  - {class: de.siegmar.fastcsv.reader.CsvRecord, method: getField, match: "(final int index)", note: "CsvRecord.getField"}
  - {class: de.siegmar.fastcsv.reader.CsvRecord, method: getFields, match: "()", note: "CsvRecord.getFields"}
  - {class: de.siegmar.fastcsv.reader.CsvRecordHandler, method: builder, match: "()", note: "CsvRecordHandler.builder"}
  - {class: de.siegmar.fastcsv.reader.CsvRecordHandler, method: of, match: "()", note: "CsvRecordHandler.of"}
  - {class: de.siegmar.fastcsv.reader.CsvRecordHandler, method: of, match: "(final Consumer<CsvRecordHandlerBuilder> configurer)", note: "CsvRecordHandler.of"}
  - {class: de.siegmar.fastcsv.reader.IndexedCsvReader, method: builder, match: "()", note: "IndexedCsvReader.builder"}
  - {class: de.siegmar.fastcsv.reader.IndexedCsvReader, method: getIndex, match: "()", note: "IndexedCsvReader.getIndex"}
  - {class: de.siegmar.fastcsv.reader.IndexedCsvReader, method: readPage, match: "(final int page) throws IOException", note: "IndexedCsvReader.readPage"}
  - {class: de.siegmar.fastcsv.reader.NamedCsvRecord, method: getHeader, match: "()", note: "NamedCsvRecord.getHeader"}
  - {class: de.siegmar.fastcsv.reader.NamedCsvRecord, method: getField, match: "(final String name)", note: "NamedCsvRecord.getField"}
  - {class: de.siegmar.fastcsv.reader.NamedCsvRecord, method: findField, match: "(final String name)", note: "NamedCsvRecord.findField"}
  - {class: de.siegmar.fastcsv.reader.NamedCsvRecordHandler, method: builder, match: "()", note: "NamedCsvRecordHandler.builder"}
  - {class: de.siegmar.fastcsv.reader.NamedCsvRecordHandler, method: of, match: "()", note: "NamedCsvRecordHandler.of"}
  - {class: de.siegmar.fastcsv.reader.NamedCsvRecordHandler, method: of, match: "(final Consumer<NamedCsvRecordHandlerBuilder> configurer)", note: "NamedCsvRecordHandler.of"}
