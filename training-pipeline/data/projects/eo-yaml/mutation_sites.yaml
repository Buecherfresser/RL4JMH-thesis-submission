  - {class: com.amihaiemil.eoyaml.RtYamlMappingBuilder, method: build, match: "(final String comment)", note: "RtYamlMappingBuilder.build"}
  - {class: com.amihaiemil.eoyaml.RtYamlScalarBuilder, method: addLine, match: "(final String value)", note: "RtYamlScalarBuilder.addLine"}
