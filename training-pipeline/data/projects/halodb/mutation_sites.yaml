# Curated performance-mutation sites for halodb (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants halodb --source data/external-src/<checkout> \
#       --sites data/projects/halodb/mutation_sites.yaml

package_root: com.oath.halodb

sites:
  - {class: com.oath.halodb.KeyBuffer, method: size, match: "()", note: "KeyBuffer.size"}
  - {class: com.oath.halodb.histo.EstimatedHistogram, method: getBucketOffsets, match: "()", note: "EstimatedHistogram.getBucketOffsets"}
  - {class: com.oath.halodb.LongArrayList, method: clear, match: "()", note: "LongArrayList.clear"}
  - {class: com.oath.halodb.histo.EstimatedHistogram, method: getBuckets, match: "(boolean reset)", note: "EstimatedHistogram.getBuckets"}
  - {class: com.oath.halodb.LongArrayList, method: size, match: "()", note: "LongArrayList.size"}
  - {class: com.oath.halodb.histo.EstimatedHistogram, method: min, match: "()", note: "EstimatedHistogram.min"}
  - {class: com.oath.halodb.OffHeapHashTableBuilder, method: build, match: "()", note: "OffHeapHashTableBuilder.build"}
  - {class: com.oath.halodb.histo.EstimatedHistogram, method: max, match: "()", note: "EstimatedHistogram.max"}
  - {class: com.oath.halodb.OffHeapHashTableBuilder, method: getHashTableSize, match: "()", note: "OffHeapHashTableBuilder.getHashTableSize"}
