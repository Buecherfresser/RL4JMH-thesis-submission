# Curated performance-mutation sites for xmlbeam (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants xmlbeam --source data/external-src/<checkout> \
#       --sites data/projects/xmlbeam/mutation_sites.yaml

package_root: org.xmlbeam.util

sites:
  - {class: org.xmlbeam.util.Base64, method: printBase64Binary, match: "(byte[] input)", note: "Base64.printBase64Binary"}
  - {class: org.xmlbeam.util.intern.duplex.DuplexXPathParser, method: compile, match: "(final CharSequence path) throws XBPathParsingException", note: "DuplexXPathParser.compile"}
  - {class: org.xmlbeam.util.IOHelper, method: createBasicAuthenticationProperty, match: "(final String username, final String password)", note: "IOHelper.createBasicAuthenticationProperty"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: getNamespaceMapping, match: "(final Document document)", note: "DOMHelper.getNamespaceMapping"}
  - {class: org.xmlbeam.util.IOHelper, method: httpGet, match: "(final String httpurl, final Map<String, String>... requestProperties) throws IOException", note: "IOHelper.httpGet"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: setDocumentElement, match: "(final Document document, final Element element)", note: "DOMHelper.setDocumentElement"}
  - {class: org.xmlbeam.util.IOHelper, method: httpPost, match: "(final String httpurl, final String data, final Map<String, String>... requestProperties) throws IOException", note: "IOHelper.httpPost"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: nodesAreEqual, match: "(final Node a, final Node b)", note: "DOMHelper.nodesAreEqual"}
  - {class: org.xmlbeam.util.IOHelper, method: inputStreamToString, match: "(final InputStream inputStream, final String... optionalCharsetName)", note: "IOHelper.inputStreamToString"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: nodeHashCode, match: "(final Node node)", note: "DOMHelper.nodeHashCode"}
  - {class: org.xmlbeam.util.IOHelper, method: dropUTF8BOM, match: "(final byte[] source)", note: "IOHelper.dropUTF8BOM"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: setOrRemoveAttribute, match: "(final Element element, final String attributeName, final String value)", note: "DOMHelper.setOrRemoveAttribute"}
  - {class: org.xmlbeam.util.IOHelper, method: loadDocument, match: "(final XBProjector projector, final InputStream is)", note: "IOHelper.loadDocument"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: renameNode, match: "(final T node, final String newName)", note: "DOMHelper.renameNode"}
  - {class: org.xmlbeam.util.IOHelper, method: getDocumentFromURL, match: "(final DocumentBuilder documentBuilder, final String url, final Map<String, String> requestProperties, final Class<?>... resourceAwareClasses) throws IOException", note: "IOHelper.getDocumentFromURL"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: ensureOwnership, match: "(final Document ownerDocument, final Node node)", note: "DOMHelper.ensureOwnership"}
  - {class: org.xmlbeam.util.IOHelper, method: isResourceProtocol, match: "(final String url)", note: "IOHelper.isResourceProtocol"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: getOwnerDocumentFor, match: "(final Node documentOrElement)", note: "DOMHelper.getOwnerDocumentFor"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: trim, match: "(final Node domNode)", note: "DOMHelper.trim"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: iterator, match: "()", note: "DOMHelper.iterator"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: asList, match: "(final T node)", note: "DOMHelper.asList"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: replaceElement, match: "(final Element previous, final Element newNode)", note: "DOMHelper.replaceElement"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: removeAllChildren, match: "(final Node node)", note: "DOMHelper.removeAllChildren"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: removeAttribute, match: "(final Attr attributeNode)", note: "DOMHelper.removeAttribute"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: appendClone, match: "(final Element parentElement, final Node o)", note: "DOMHelper.appendClone"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: removeNodes, match: "(final Iterable<? extends Node> existingNodes)", note: "DOMHelper.removeNodes"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: toXMLString, match: "(final XBProjector projector, final Node domNode)", note: "DOMHelper.toXMLString"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: directTextContent, match: "(final Node item)", note: "DOMHelper.directTextContent"}
  - {class: org.xmlbeam.util.intern.DOMHelper, method: setDirectTextContent, match: "(final Node elementToChange, final String asString)", note: "DOMHelper.setDirectTextContent"}
  - {class: org.xmlbeam.util.intern.MethodParamVariableResolver, method: resolveVariable, match: "(final QName variableName)", note: "MethodParamVariableResolver.resolveVariable"}
  - {class: org.xmlbeam.util.intern.MethodParamVariableResolver, method: updateArgs, match: "(final Object[] args)", note: "MethodParamVariableResolver.updateArgs"}
  - {class: org.xmlbeam.util.intern.Preprocessor, method: getParameterIndex, match: "(final String paramName)", note: "Preprocessor.getParameterIndex"}
  - {class: org.xmlbeam.util.intern.Preprocessor, method: applyParams, match: "(final String string, final Map<String, Integer> paramNameIndexMap, final Object[] args)", note: "Preprocessor.applyParams"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: array, match: "(T... content)", note: "ReflectionHelper.array"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: findAllCommonSuperInterfaces, match: "(final Class<?> a, final Class<?> b)", note: "ReflectionHelper.findAllCommonSuperInterfaces"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: findMethodByName, match: "(final Class<?> clazz, final String name)", note: "ReflectionHelper.findMethodByName"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: findAllSuperInterfaces, match: "(final Class<?> a)", note: "ReflectionHelper.findAllSuperInterfaces"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: hasReturnType, match: "(final Method method)", note: "ReflectionHelper.hasReturnType"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: hasParameters, match: "(final Method method)", note: "ReflectionHelper.hasParameters"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: array2ObjectList, match: "(final Object array)", note: "ReflectionHelper.array2ObjectList"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: isDefaultMethod, match: "(final Method m)", note: "ReflectionHelper.isDefaultMethod"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: getMethodParameterIndexes, match: "(final Method m)", note: "ReflectionHelper.getMethodParameterIndexes"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: getCallableConstructorForParams, match: "(final Class<T> type, final Class<?>... params)", note: "ReflectionHelper.getCallableConstructorForParams"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: getCallableFactoryForParams, match: "(final Class<?> type, final Class<?>... params)", note: "ReflectionHelper.getCallableFactoryForParams"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: mayProvideParameterNames, match: "()", note: "ReflectionHelper.mayProvideParameterNames"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: unwrap, match: "(final Class<?> type, final Object object) throws Exception", note: "ReflectionHelper.unwrap"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: getParameterType, match: "(final Type type)", note: "ReflectionHelper.getParameterType"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: isOptional, match: "(final Type type)", note: "ReflectionHelper.isOptional"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: isRawType, match: "(final Type type)", note: "ReflectionHelper.isRawType"}
  - {class: org.xmlbeam.util.intern.ReflectionHelper, method: createOptional, match: "(final Object value)", note: "ReflectionHelper.createOptional"}
