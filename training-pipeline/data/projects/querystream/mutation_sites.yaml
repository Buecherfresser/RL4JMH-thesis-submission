  - {class: org.dellroad.querystream.jpa.ParamBinding, method: getParameter, match: "()", note: "ParamBinding.getParameter"}
  - {class: org.dellroad.querystream.jpa.ParamBinding, method: getValue, match: "()", note: "ParamBinding.getValue"}
  - {class: org.dellroad.querystream.jpa.PathValueImpl, method: bind, match: "(Ref<X, ? super S> ref)", note: "PathValueImpl.bind"}
  - {class: org.dellroad.querystream.jpa.PathValueImpl, method: peek, match: "(Consumer<? super S> peeker)", note: "PathValueImpl.peek"}
  - {class: org.dellroad.querystream.jpa.QueryInfo, method: of, match: "(QueryStream<?, ?, ?, ?, ?> stream)", note: "QueryInfo.of"}
  - {class: org.dellroad.querystream.jpa.QueryInfo, method: applyTo, match: "(Query query)", note: "QueryInfo.applyTo"}
  - {class: org.dellroad.querystream.jpa.RootValueImpl, method: bind, match: "(Ref<X, ? super Root<X>> ref)", note: "RootValueImpl.bind"}
  - {class: org.dellroad.querystream.jpa.RootValueImpl, method: peek, match: "(Consumer<? super Root<X>> peeker)", note: "RootValueImpl.peek"}
  - {class: org.dellroad.querystream.jpa.SearchValueImpl, method: bind, match: "(Ref<X, ? super S> ref)", note: "SearchValueImpl.bind"}
  - {class: org.dellroad.querystream.jpa.SearchValueImpl, method: peek, match: "(Consumer<? super S> peeker)", note: "SearchValueImpl.peek"}
  - {class: org.dellroad.querystream.jpa.querytype.DeleteType, method: createCriteriaQuery, match: "(CriteriaBuilder builder)", note: "DeleteType.createCriteriaQuery"}
  - {class: org.dellroad.querystream.jpa.querytype.DeleteType, method: createQuery, match: "(EntityManager entityManager, CriteriaDelete<X> query)", note: "DeleteType.createQuery"}
  - {class: org.dellroad.querystream.jpa.querytype.SearchType, method: createCriteriaQuery, match: "(CriteriaBuilder builder)", note: "SearchType.createCriteriaQuery"}
