  - {class: com.github.luben.zstd.ZstdDirectBufferCompressingStreamNoFinalizer, method: recommendedOutputBufferSize, match: "()", note: "ZstdDirectBufferCompressingStreamNoFinalizer.recommendedOutputBufferSize"}
  - {class: com.github.luben.zstd.ZstdDirectBufferCompressingStreamNoFinalizer, method: setDict, match: "(byte[] dict)", note: "ZstdDirectBufferCompressingStreamNoFinalizer.setDict"}
  - {class: com.github.luben.zstd.ZstdDirectBufferDecompressingStream, method: refill, match: "(ByteBuffer toRefill)", note: "ZstdDirectBufferDecompressingStream.refill"}
