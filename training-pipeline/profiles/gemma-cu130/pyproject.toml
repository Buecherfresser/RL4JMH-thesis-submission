[project]
name = "jmhgen-gemma-cu130"
version = "0.1.0"
description = "Locked Gemma 4 training and rollout environment for JMHGen."
requires-python = ">=3.11,<3.13"
dependencies = [
    "jmhgen",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "transformers>=5.5.1",
    "trl>=1.7,<1.8",
    "datasets>=4.0",
    "accelerate>=1.0",
    "peft>=0.15",
    "bitsandbytes>=0.46",
    "ray>=2.40",
    "vllm==0.23.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
jmhgen = { path = "../..", editable = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
