# Curated performance-mutation sites for bigqueue (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants bigqueue --source data/external-src/<checkout> \
#       --sites data/projects/bigqueue/mutation_sites.yaml

package_root: com.leansoft.bigqueue

sites:
  - {class: com.leansoft.bigqueue.BigArrayImpl, method: getArrayDirectory, match: "()", note: "BigArrayImpl.getArrayDirectory"}
  - {class: com.leansoft.bigqueue.cache.LRUCacheImpl, method: CloseExecutorService, match: "()", note: "LRUCacheImpl.CloseExecutorService"}
  - {class: com.leansoft.bigqueue.page.MappedPageFactoryImpl, method: acquirePage, match: "(long index) throws IOException", note: "MappedPageFactoryImpl.acquirePage"}
  - {class: com.leansoft.bigqueue.utils.FileUtil, method: isFilenameValid, match: "(String file)", note: "FileUtil.isFilenameValid"}
  - {class: com.leansoft.bigqueue.BigArrayImpl, method: removeAll, match: "() throws IOException", note: "BigArrayImpl.removeAll"}
  - {class: com.leansoft.bigqueue.cache.LRUCacheImpl, method: run, match: "()", note: "LRUCacheImpl.run"}
  - {class: com.leansoft.bigqueue.page.MappedPageFactoryImpl, method: getPageSize, match: "()", note: "MappedPageFactoryImpl.getPageSize"}
  - {class: com.leansoft.bigqueue.utils.FileUtil, method: deleteDirectory, match: "(File dir)", note: "FileUtil.deleteDirectory"}
  - {class: com.leansoft.bigqueue.BigArrayImpl, method: removeBeforeIndex, match: "(long index) throws IOException", note: "BigArrayImpl.removeBeforeIndex"}
  - {class: com.leansoft.bigqueue.cache.LRUCacheImpl, method: release, match: "(K key)", note: "LRUCacheImpl.release"}
  - {class: com.leansoft.bigqueue.page.MappedPageFactoryImpl, method: getPageDir, match: "()", note: "MappedPageFactoryImpl.getPageDir"}
  - {class: com.leansoft.bigqueue.utils.FileUtil, method: deleteFile, match: "(File file)", note: "FileUtil.deleteFile"}
  - {class: com.leansoft.bigqueue.BigArrayImpl, method: removeBefore, match: "(long timestamp) throws IOException", note: "BigArrayImpl.removeBefore"}
  - {class: com.leansoft.bigqueue.cache.LRUCacheImpl, method: size, match: "()", note: "LRUCacheImpl.size"}
  - {class: com.leansoft.bigqueue.page.MappedPageFactoryImpl, method: releasePage, match: "(long index)", note: "MappedPageFactoryImpl.releasePage"}
  - {class: com.leansoft.bigqueue.utils.Calculator, method: mod, match: "(long val, int bits)", note: "Calculator.mod"}
  - {class: com.leansoft.bigqueue.BigArrayImpl, method: append, match: "(byte[] data) throws IOException", note: "BigArrayImpl.append"}
  - {class: com.leansoft.bigqueue.cache.LRUCacheImpl, method: removeAll, match: "()  throws IOException", note: "LRUCacheImpl.removeAll"}
  - {class: com.leansoft.bigqueue.page.MappedPageFactoryImpl, method: releaseCachedPages, match: "() throws IOException", note: "MappedPageFactoryImpl.releaseCachedPages"}
  - {class: com.leansoft.bigqueue.utils.Calculator, method: mul, match: "(long val, int bits)", note: "Calculator.mul"}
  - {class: com.leansoft.bigqueue.BigArrayImpl, method: getTimestamp, match: "(long index) throws IOException", note: "BigArrayImpl.getTimestamp"}
  - {class: com.leansoft.bigqueue.cache.LRUCacheImpl, method: getValues, match: "()", note: "LRUCacheImpl.getValues"}
  - {class: com.leansoft.bigqueue.page.MappedPageFactoryImpl, method: deleteAllPages, match: "() throws IOException", note: "MappedPageFactoryImpl.deleteAllPages"}
  - {class: com.leansoft.bigqueue.utils.Calculator, method: div, match: "(long val, int bits)", note: "Calculator.div"}
  - {class: com.leansoft.bigqueue.BigArrayImpl, method: size, match: "()", note: "BigArrayImpl.size"}
  - {class: com.leansoft.bigqueue.page.MappedPageFactoryImpl, method: deletePages, match: "(Set<Long> indexes) throws IOException", note: "MappedPageFactoryImpl.deletePages"}
  - {class: com.leansoft.bigqueue.utils.FolderNameValidator, method: validate, match: "(String name)", note: "FolderNameValidator.validate"}
