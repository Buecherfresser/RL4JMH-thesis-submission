# Curated performance-mutation sites for commons-bcel (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants commons-bcel --source data/external-src/<checkout> \
#       --sites data/projects/commons-bcel/mutation_sites.yaml

package_root: org.apache.bcel

sites:
  - {class: org.apache.bcel.Const, method: getAccessName, match: "(final int index)", note: "Const.getAccessName"}
  - {class: org.apache.bcel.classfile.ArrayElementValue, method: dump, match: "(final DataOutputStream dos) throws IOException", note: "ArrayElementValue.dump"}
  - {class: org.apache.bcel.generic.ArrayElementValueGen, method: addElement, match: "(final ElementValueGen gen)", note: "ArrayElementValueGen.addElement"}
  - {class: org.apache.bcel.util.ClassSet, method: empty, match: "()", note: "ClassSet.empty"}
  - {class: org.apache.bcel.verifier.VerifierFactoryListModel, method: addListDataListener, match: "(final ListDataListener l)", note: "VerifierFactoryListModel.addListDataListener"}
  - {class: org.apache.bcel.Const, method: getAttributeName, match: "(final int index)", note: "Const.getAttributeName"}
  - {class: org.apache.bcel.classfile.ArrayElementValue, method: getElementValuesArray, match: "()", note: "ArrayElementValue.getElementValuesArray"}
  - {class: org.apache.bcel.generic.ArrayElementValueGen, method: dump, match: "(final DataOutputStream dos) throws IOException", note: "ArrayElementValueGen.dump"}
  - {class: org.apache.bcel.util.ClassSet, method: getClassNames, match: "()", note: "ClassSet.getClassNames"}
  - {class: org.apache.bcel.verifier.VerifierFactoryListModel, method: getElementAt, match: "(final int index)", note: "VerifierFactoryListModel.getElementAt"}
  - {class: org.apache.bcel.ExceptionConst, method: createExceptions, match: "(final EXCS type, final Class<?>... extraClasses)", note: "ExceptionConst.createExceptions"}
  - {class: org.apache.bcel.classfile.ClassParser, method: parse, match: "() throws IOException, ClassFormatException", note: "ClassParser.parse"}
  - {class: org.apache.bcel.generic.ArrayType, method: getBasicType, match: "()", note: "ArrayType.getBasicType"}
  - {class: org.apache.bcel.util.Args, method: require, match: "(final int value, final int required, final String message)", note: "Args.require"}
  - {class: org.apache.bcel.verifier.exc.Utility, method: getStackTrace, match: "(final Throwable t)", note: "Utility.getStackTrace"}
  - {class: org.apache.bcel.classfile.ConstantString, method: accept, match: "(final Visitor v)", note: "ConstantString.accept"}
  - {class: org.apache.bcel.generic.ArrayType, method: getClassName, match: "()", note: "ArrayType.getClassName"}
  - {class: org.apache.bcel.util.Args, method: require0, match: "(final int value, final String message)", note: "Args.require0"}
  - {class: org.apache.bcel.verifier.statics.StringRepresentation, method: visitAnnotation, match: "(final Annotations obj)", note: "StringRepresentation.visitAnnotation"}
  - {class: org.apache.bcel.classfile.ConstantString, method: dump, match: "(final DataOutputStream file) throws IOException", note: "ConstantString.dump"}
  - {class: org.apache.bcel.generic.InstructionList, method: findHandle, match: "(final InstructionHandle[] ihs, final int[] pos, final int count, final int target)", note: "InstructionList.findHandle"}
  - {class: org.apache.bcel.util.AttributeHTML, method: close, match: "()", note: "AttributeHTML.close"}
  - {class: org.apache.bcel.verifier.statics.StringRepresentation, method: visitAnnotationDefault, match: "(final AnnotationDefault obj)", note: "StringRepresentation.visitAnnotationDefault"}
  - {class: org.apache.bcel.classfile.LineNumber, method: accept, match: "(final Visitor v)", note: "LineNumber.accept"}
  - {class: org.apache.bcel.generic.InstructionList, method: addObserver, match: "(final InstructionListObserver o)", note: "InstructionList.addObserver"}
  - {class: org.apache.bcel.util.BCELFactory, method: start, match: "()", note: "BCELFactory.start"}
  - {class: org.apache.bcel.verifier.GraphicalVerifier, method: main, match: "(final String[] args)", note: "GraphicalVerifier.main"}
  - {class: org.apache.bcel.classfile.LineNumber, method: dump, match: "(final DataOutputStream file) throws IOException", note: "LineNumber.dump"}
  - {class: org.apache.bcel.generic.LineNumberGen, method: containsTarget, match: "(final InstructionHandle ih)", note: "LineNumberGen.containsTarget"}
  - {class: org.apache.bcel.util.BCELFactory, method: visitAllocationInstruction, match: "(final AllocationInstruction i)", note: "BCELFactory.visitAllocationInstruction"}
  - {class: org.apache.bcel.verifier.TransitiveHull, method: main, match: "(final String[] args)", note: "TransitiveHull.main"}
  - {class: org.apache.bcel.classfile.LineNumberTable, method: accept, match: "(final Visitor v)", note: "LineNumberTable.accept"}
  - {class: org.apache.bcel.generic.LineNumberGen, method: getInstruction, match: "()", note: "LineNumberGen.getInstruction"}
  - {class: org.apache.bcel.util.BCELifier, method: main, match: "(final String[] argv) throws Exception", note: "BCELifier.main"}
  - {class: org.apache.bcel.verifier.VerificationResult, method: getMessage, match: "()", note: "VerificationResult.getMessage"}
  - {class: org.apache.bcel.classfile.LineNumberTable, method: dump, match: "(final DataOutputStream file) throws IOException", note: "LineNumberTable.dump"}
  - {class: org.apache.bcel.generic.AALOAD, method: accept, match: "(final Visitor v)", note: "AALOAD.accept"}
  - {class: org.apache.bcel.util.BCELifier, method: printFlags, match: "(final int flags, final FLAGS location)", note: "BCELifier.printFlags"}
  - {class: org.apache.bcel.verifier.VerificationResult, method: getStatus, match: "()", note: "VerificationResult.getStatus"}
  - {class: org.apache.bcel.classfile.StackMap, method: accept, match: "(final Visitor v)", note: "StackMap.accept"}
  - {class: org.apache.bcel.generic.AASTORE, method: accept, match: "(final Visitor v)", note: "AASTORE.accept"}
  - {class: org.apache.bcel.util.ByteSequence, method: getIndex, match: "()", note: "ByteSequence.getIndex"}
  - {class: org.apache.bcel.verifier.Verifier, method: main, match: "(final String[] args)", note: "Verifier.main"}
  - {class: org.apache.bcel.classfile.StackMap, method: dump, match: "(final DataOutputStream file) throws IOException", note: "StackMap.dump"}
  - {class: org.apache.bcel.generic.ACONST_NULL, method: accept, match: "(final Visitor v)", note: "ACONST_NULL.accept"}
  - {class: org.apache.bcel.util.Class2HTML, method: main, match: "(final String[] argv) throws IOException", note: "Class2HTML.main"}
  - {class: org.apache.bcel.verifier.Verifier, method: doPass1, match: "()", note: "Verifier.doPass1"}
  - {class: org.apache.bcel.classfile.StackMapEntry, method: accept, match: "(final Visitor v)", note: "StackMapEntry.accept"}
  - {class: org.apache.bcel.generic.ALOAD, method: accept, match: "(final Visitor v)", note: "ALOAD.accept"}
  - {class: org.apache.bcel.util.ClassLoader, method: createClass, match: "(final String className)", note: "ClassLoader.createClass"}
