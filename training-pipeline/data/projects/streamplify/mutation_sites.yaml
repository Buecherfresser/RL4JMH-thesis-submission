# Curated performance-mutation sites for streamplify (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants streamplify --source data/external-src/<checkout> \
#       --sites data/projects/streamplify/mutation_sites.yaml

package_root: org.beryx.streamplify

sites:
  - {class: org.beryx.streamplify.BigIntegerIndexedSpliterator, method: withAdditionalCharacteristics, match: "(int additionalCharacteristics)", note: "BigIntegerIndexedSpliterator.withAdditionalCharacteristics"}
  - {class: org.beryx.streamplify.combination.Combinations, method: getDelegate, match: "()", note: "Combinations.getDelegate"}
  - {class: org.beryx.streamplify.derangement.BigIntegerDerangements, method: subfactorial, match: "(int n)", note: "BigIntegerDerangements.subfactorial"}
  - {class: org.beryx.streamplify.partperm.BigIntegerPartialPermutations, method: numberOfPermutations, match: "(int n)", note: "BigIntegerPartialPermutations.numberOfPermutations"}
  - {class: org.beryx.streamplify.permutation.BigIntegerPermutations, method: factorial, match: "(int n)", note: "BigIntegerPermutations.factorial"}
  - {class: org.beryx.streamplify.powerset.PowerSet, method: getDelegate, match: "()", note: "PowerSet.getDelegate"}
  - {class: org.beryx.streamplify.product.CartesianProduct, method: getDelegate, match: "()", note: "CartesianProduct.getDelegate"}
  - {class: org.beryx.streamplify.shared.Unranking, method: unrankCombination, match: "(int n, int k, long count, long index)", note: "Unranking.unrankCombination"}
  - {class: org.beryx.streamplify.shuffler.DefaultBigIntegerShuffler, method: withSeed, match: "(long seed)", note: "DefaultBigIntegerShuffler.withSeed"}
  - {class: org.beryx.streamplify.BigIntegerIndexedSpliterator, method: withShuffler, match: "(BigIntegerShuffler shuffler)", note: "BigIntegerIndexedSpliterator.withShuffler"}
  - {class: org.beryx.streamplify.derangement.Derangements, method: getDelegate, match: "()", note: "Derangements.getDelegate"}
  - {class: org.beryx.streamplify.partperm.BigIntegerPartialPermutations, method: computeFactorials, match: "(int length)", note: "BigIntegerPartialPermutations.computeFactorials"}
  - {class: org.beryx.streamplify.permutation.LongPermutations, method: factorial, match: "(int n)", note: "LongPermutations.factorial"}
  - {class: org.beryx.streamplify.shared.Unranking, method: unrankCombination, match: "(int n, int k, BigInteger count, BigInteger index)", note: "Unranking.unrankCombination"}
  - {class: org.beryx.streamplify.shuffler.DefaultBigIntegerShuffler, method: getShuffledIndex, match: "(BigInteger index)", note: "DefaultBigIntegerShuffler.getShuffledIndex"}
  - {class: org.beryx.streamplify.BigIntegerIndexedSpliterator, method: withValueSupplier, match: "(Splittable.BigIntegerIndexed<T> valueSupplier)", note: "BigIntegerIndexedSpliterator.withValueSupplier"}
  - {class: org.beryx.streamplify.derangement.LongDerangements, method: subfactorial, match: "(int n)", note: "LongDerangements.subfactorial"}
  - {class: org.beryx.streamplify.partperm.LongPartialPermutations, method: numberOfPermutations, match: "(int n)", note: "LongPartialPermutations.numberOfPermutations"}
  - {class: org.beryx.streamplify.permutation.Permutations, method: getDelegate, match: "()", note: "Permutations.getDelegate"}
  - {class: org.beryx.streamplify.shuffler.DefaultLongShuffler, method: withSeed, match: "(long seed)", note: "DefaultLongShuffler.withSeed"}
  - {class: org.beryx.streamplify.BigIntegerIndexedSpliterator, method: getIndex, match: "()", note: "BigIntegerIndexedSpliterator.getIndex"}
  - {class: org.beryx.streamplify.partperm.PartialPermutations, method: getDelegate, match: "()", note: "PartialPermutations.getDelegate"}
  - {class: org.beryx.streamplify.shuffler.DefaultLongShuffler, method: getShuffledIndex, match: "(long index)", note: "DefaultLongShuffler.getShuffledIndex"}
  - {class: org.beryx.streamplify.BigIntegerIndexedSpliterator, method: getFence, match: "()", note: "BigIntegerIndexedSpliterator.getFence"}
  - {class: org.beryx.streamplify.shuffler.ShufflerImpl, method: withSeed, match: "(long seed)", note: "ShufflerImpl.withSeed"}
  - {class: org.beryx.streamplify.BigIntegerIndexedSpliterator, method: stream, match: "()", note: "BigIntegerIndexedSpliterator.stream"}
  - {class: org.beryx.streamplify.shuffler.ShufflerImpl, method: getShuffledIndex, match: "(long index, long count)", note: "ShufflerImpl.getShuffledIndex"}
  - {class: org.beryx.streamplify.BigIntegerIndexedSpliterator, method: parallelStream, match: "()", note: "BigIntegerIndexedSpliterator.parallelStream"}
  - {class: org.beryx.streamplify.shuffler.ShufflerImpl, method: getShuffledIndex, match: "(BigInteger index, BigInteger count)", note: "ShufflerImpl.getShuffledIndex"}
  - {class: org.beryx.streamplify.BigIntegerIndexedSpliterator, method: bigCount, match: "()", note: "BigIntegerIndexedSpliterator.bigCount"}
  - {class: org.beryx.streamplify.shuffler.ShufflerImpl, method: getRandomPermutation, match: "(int length)", note: "ShufflerImpl.getRandomPermutation"}
  - {class: org.beryx.streamplify.BigIntegerIndexedSpliterator, method: estimateSize, match: "()", note: "BigIntegerIndexedSpliterator.estimateSize"}
  - {class: org.beryx.streamplify.BigIntegerIndexedSpliterator, method: characteristics, match: "()", note: "BigIntegerIndexedSpliterator.characteristics"}
