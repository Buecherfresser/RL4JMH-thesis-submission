# Curated performance-mutation sites for hdrhistogram (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants hdrhistogram --source data/external-src/<checkout> \
#       --sites data/projects/hdrhistogram/mutation_sites.yaml

package_root: org.HdrHistogram

sites:
  - {class: org.HdrHistogram.AllValuesIterator, method: reset, match: "()", note: "AllValuesIterator.reset"}
  - {class: org.HdrHistogram.packedarray.AbstractPackedLongArray, method: getStartTimeStamp, match: "()", note: "AbstractPackedLongArray.getStartTimeStamp"}
  - {class: org.HdrHistogram.AtomicHistogram, method: setAutoResize, match: "(boolean autoResize)", note: "AtomicHistogram.setAutoResize"}
  - {class: org.HdrHistogram.packedarray.AbstractPackedLongArray, method: setStartTimeStamp, match: "(final long timeStampMsec)", note: "AbstractPackedLongArray.setStartTimeStamp"}
  - {class: org.HdrHistogram.AtomicHistogram, method: supportsAutoResize, match: "()", note: "AtomicHistogram.supportsAutoResize"}
  - {class: org.HdrHistogram.packedarray.ConcurrentPackedLongArray, method: setVirtualLength, match: "(final int newVirtualArrayLength)", note: "ConcurrentPackedLongArray.setVirtualLength"}
  - {class: org.HdrHistogram.ConcurrentHistogram, method: setAutoResize, match: "(final boolean autoResize)", note: "ConcurrentHistogram.setAutoResize"}
  - {class: org.HdrHistogram.packedarray.ConcurrentPackedLongArray, method: clear, match: "()", note: "ConcurrentPackedLongArray.clear"}
  - {class: org.HdrHistogram.ConcurrentHistogram, method: copyCorrectedForCoordinatedOmission, match: "(final long expectedIntervalBetweenValueSamples)", note: "ConcurrentHistogram.copyCorrectedForCoordinatedOmission"}
  - {class: org.HdrHistogram.packedarray.PackedArrayRecorder, method: length, match: "()", note: "PackedArrayRecorder.length"}
  - {class: org.HdrHistogram.DoubleAllValuesIterator, method: reset, match: "()", note: "DoubleAllValuesIterator.reset"}
  - {class: org.HdrHistogram.packedarray.PackedArrayRecorder, method: setVirtualLength, match: "(int newVirtualLength)", note: "PackedArrayRecorder.setVirtualLength"}
  - {class: org.HdrHistogram.DoubleHistogram, method: isAutoResize, match: "()", note: "DoubleHistogram.isAutoResize"}
  - {class: org.HdrHistogram.packedarray.PackedArraySingleWriterRecorder, method: length, match: "()", note: "PackedArraySingleWriterRecorder.length"}
  - {class: org.HdrHistogram.DoubleHistogram, method: setAutoResize, match: "(boolean autoResize)", note: "DoubleHistogram.setAutoResize"}
  - {class: org.HdrHistogram.packedarray.PackedArraySingleWriterRecorder, method: setVirtualLength, match: "(int newVirtualLength)", note: "PackedArraySingleWriterRecorder.setVirtualLength"}
  - {class: org.HdrHistogram.DoubleHistogramIterationValue, method: getValueIteratedTo, match: "()", note: "DoubleHistogramIterationValue.getValueIteratedTo"}
  - {class: org.HdrHistogram.packedarray.PackedLongArray, method: setVirtualLength, match: "(final int newVirtualArrayLength)", note: "PackedLongArray.setVirtualLength"}
  - {class: org.HdrHistogram.DoubleHistogramIterationValue, method: getValueIteratedFrom, match: "()", note: "DoubleHistogramIterationValue.getValueIteratedFrom"}
  - {class: org.HdrHistogram.packedarray.IterationValue, method: getIndex, match: "()", note: "IterationValue.getIndex"}
  - {class: org.HdrHistogram.DoubleLinearIterator, method: reset, match: "(final double valueUnitsPerBucket)", note: "DoubleLinearIterator.reset"}
  - {class: org.HdrHistogram.packedarray.IterationValue, method: getValue, match: "()", note: "IterationValue.getValue"}
  - {class: org.HdrHistogram.DoubleLogarithmicIterator, method: reset, match: "(final double valueUnitsInFirstBucket, final double logBase)", note: "DoubleLogarithmicIterator.reset"}
  - {class: org.HdrHistogram.DoublePercentileIterator, method: reset, match: "(final int percentileTicksPerHalfDistance)", note: "DoublePercentileIterator.reset"}
  - {class: org.HdrHistogram.DoubleRecordedValuesIterator, method: reset, match: "()", note: "DoubleRecordedValuesIterator.reset"}
  - {class: org.HdrHistogram.DoubleRecorder, method: recordValue, match: "(final double value)", note: "DoubleRecorder.recordValue"}
  - {class: org.HdrHistogram.DoubleRecorder, method: recordValueWithCount, match: "(final double value, final long count) throws ArrayIndexOutOfBoundsException", note: "DoubleRecorder.recordValueWithCount"}
  - {class: org.HdrHistogram.Histogram, method: copyCorrectedForCoordinatedOmission, match: "(final long expectedIntervalBetweenValueSamples)", note: "Histogram.copyCorrectedForCoordinatedOmission"}
  - {class: org.HdrHistogram.Histogram, method: getTotalCount, match: "()", note: "Histogram.getTotalCount"}
  - {class: org.HdrHistogram.HistogramIterationValue, method: getValueIteratedTo, match: "()", note: "HistogramIterationValue.getValueIteratedTo"}
  - {class: org.HdrHistogram.HistogramIterationValue, method: getDoubleValueIteratedTo, match: "()", note: "HistogramIterationValue.getDoubleValueIteratedTo"}
  - {class: org.HdrHistogram.HistogramLogProcessor, method: run, match: "()", note: "HistogramLogProcessor.run"}
  - {class: org.HdrHistogram.HistogramLogProcessor, method: main, match: "(final String[] args)", note: "HistogramLogProcessor.main"}
  - {class: org.HdrHistogram.HistogramLogReader, method: onException, match: "(Throwable t)", note: "HistogramLogReader.onException"}
  - {class: org.HdrHistogram.HistogramLogReader, method: getStartTimeSec, match: "()", note: "HistogramLogReader.getStartTimeSec"}
  - {class: org.HdrHistogram.HistogramLogScanner, method: process, match: "(EventHandler handler)", note: "HistogramLogScanner.process"}
  - {class: org.HdrHistogram.HistogramLogScanner, method: hasNextLine, match: "()", note: "HistogramLogScanner.hasNextLine"}
  - {class: org.HdrHistogram.HistogramLogWriter, method: close, match: "()", note: "HistogramLogWriter.close"}
  - {class: org.HdrHistogram.HistogramLogWriter, method: outputIntervalHistogram, match: "(final EncodableHistogram histogram)", note: "HistogramLogWriter.outputIntervalHistogram"}
  - {class: org.HdrHistogram.IntCountsHistogram, method: copyCorrectedForCoordinatedOmission, match: "(final long expectedIntervalBetweenValueSamples)", note: "IntCountsHistogram.copyCorrectedForCoordinatedOmission"}
  - {class: org.HdrHistogram.IntCountsHistogram, method: getTotalCount, match: "()", note: "IntCountsHistogram.getTotalCount"}
  - {class: org.HdrHistogram.LinearIterator, method: reset, match: "(final long valueUnitsPerBucket)", note: "LinearIterator.reset"}
  - {class: org.HdrHistogram.LogarithmicIterator, method: reset, match: "(final long valueUnitsInFirstBucket, final double logBase)", note: "LogarithmicIterator.reset"}
  - {class: org.HdrHistogram.PackedConcurrentHistogram, method: copyCorrectedForCoordinatedOmission, match: "(final long expectedIntervalBetweenValueSamples)", note: "PackedConcurrentHistogram.copyCorrectedForCoordinatedOmission"}
  - {class: org.HdrHistogram.PackedConcurrentHistogram, method: getTotalCount, match: "()", note: "PackedConcurrentHistogram.getTotalCount"}
  - {class: org.HdrHistogram.PackedHistogram, method: copyCorrectedForCoordinatedOmission, match: "(final long expectedIntervalBetweenValueSamples)", note: "PackedHistogram.copyCorrectedForCoordinatedOmission"}
  - {class: org.HdrHistogram.PercentileIterator, method: reset, match: "(final int percentileTicksPerHalfDistance)", note: "PercentileIterator.reset"}
  - {class: org.HdrHistogram.RecordedValuesIterator, method: reset, match: "()", note: "RecordedValuesIterator.reset"}
  - {class: org.HdrHistogram.Recorder, method: recordValue, match: "(final long value) throws ArrayIndexOutOfBoundsException", note: "Recorder.recordValue"}
  - {class: org.HdrHistogram.Recorder, method: recordValueWithCount, match: "(final long value, final long count) throws ArrayIndexOutOfBoundsException", note: "Recorder.recordValueWithCount"}
