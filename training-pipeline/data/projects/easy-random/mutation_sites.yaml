  - {class: org.jeasy.random.randomizers.range.FloatRangeRandomizer, method: getDefaultMinValue, match: "()", note: "FloatRangeRandomizer.getDefaultMinValue"}
  - {class: org.jeasy.random.randomizers.range.InstantRangeRandomizer, method: checkValues, match: "()", note: "InstantRangeRandomizer.checkValues"}
  - {class: org.jeasy.random.randomizers.range.InstantRangeRandomizer, method: getDefaultMinValue, match: "()", note: "InstantRangeRandomizer.getDefaultMinValue"}
  - {class: org.jeasy.random.randomizers.range.IntegerRangeRandomizer, method: checkValues, match: "()", note: "IntegerRangeRandomizer.checkValues"}
  - {class: org.jeasy.random.randomizers.range.IntegerRangeRandomizer, method: getRandomValue, match: "()", note: "IntegerRangeRandomizer.getRandomValue"}
  - {class: org.jeasy.random.randomizers.range.LocalDateRangeRandomizer, method: checkValues, match: "()", note: "LocalDateRangeRandomizer.checkValues"}
  - {class: org.jeasy.random.randomizers.range.LocalDateRangeRandomizer, method: getDefaultMinValue, match: "()", note: "LocalDateRangeRandomizer.getDefaultMinValue"}
  - {class: org.jeasy.random.randomizers.range.LocalDateTimeRangeRandomizer, method: checkValues, match: "()", note: "LocalDateTimeRangeRandomizer.checkValues"}
