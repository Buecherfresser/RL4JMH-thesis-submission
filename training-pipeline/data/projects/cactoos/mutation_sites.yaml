  - {class: org.cactoos.io.WriterAsOutputStream, method: close, match: "() throws IOException", note: "WriterAsOutputStream.close"}
  - {class: org.cactoos.io.AppendTo, method: stream, match: "() throws Exception", note: "AppendTo.stream"}
  - {class: org.cactoos.io.CheckedInput, method: stream, match: "() throws E", note: "CheckedInput.stream"}
  - {class: org.cactoos.io.CheckedOutput, method: stream, match: "() throws E", note: "CheckedOutput.stream"}
