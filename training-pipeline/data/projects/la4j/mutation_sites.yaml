  - {class: org.la4j.linear.ForwardBackSubstitutionSolver, method: applicableTo, match: "(Matrix matrix)", note: "ForwardBackSubstitutionSolver.applicableTo"}
  - {class: org.la4j.matrix.dense.Basic1DMatrix, method: constant, match: "(int rows, int columns, double constant)", note: "Basic1DMatrix.constant"}
  - {class: org.la4j.operation.inplace.InPlaceCopyMatrixToMatrix, method: applySimple, match: "(SparseMatrix a, DenseMatrix b)", note: "InPlaceCopyMatrixToMatrix.applySimple"}
  - {class: org.la4j.vector.dense.BasicVector, method: constant, match: "(int length, double value)", note: "BasicVector.constant"}
