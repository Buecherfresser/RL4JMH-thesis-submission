  - {class: com.github.davidmoten.bigsorter.internal.ArrayList, method: listIterator, match: "(int index)", note: "ArrayList.listIterator"}
  - {class: com.github.davidmoten.bigsorter.internal.ArrayList, method: listIterator, match: "()", note: "ArrayList.listIterator"}
  - {class: com.github.davidmoten.bigsorter.internal.ArrayList, method: iterator, match: "()", note: "ArrayList.iterator"}
  - {class: com.github.davidmoten.bigsorter.internal.ArrayList, method: forEachRemaining, match: "(Consumer<? super E> consumer)", note: "ArrayList.forEachRemaining"}
  - {class: com.github.davidmoten.bigsorter.internal.ArrayList, method: hasPrevious, match: "()", note: "ArrayList.hasPrevious"}
  - {class: com.github.davidmoten.bigsorter.internal.ArrayList, method: nextIndex, match: "()", note: "ArrayList.nextIndex"}
  - {class: com.github.davidmoten.bigsorter.internal.ArrayList, method: previousIndex, match: "()", note: "ArrayList.previousIndex"}
  - {class: com.github.davidmoten.bigsorter.internal.ArrayList, method: previous, match: "()", note: "ArrayList.previous"}
  - {class: com.github.davidmoten.bigsorter.internal.ArrayList, method: subList, match: "(int fromIndex, int toIndex)", note: "ArrayList.subList"}
  - {class: com.github.davidmoten.bigsorter.internal.ArrayList, method: size, match: "()", note: "ArrayList.size"}
  - {class: com.github.davidmoten.bigsorter.internal.ArrayList, method: removeRange, match: "(int fromIndex, int toIndex)", note: "ArrayList.removeRange"}
  - {class: com.github.davidmoten.bigsorter.internal.ArrayList, method: addAll, match: "(Collection<? extends E> c)", note: "ArrayList.addAll"}
