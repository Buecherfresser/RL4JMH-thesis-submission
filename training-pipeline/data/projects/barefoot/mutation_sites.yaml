# Curated performance-mutation sites for barefoot (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants barefoot --source data/external-src/<checkout> \
#       --sites data/projects/barefoot/mutation_sites.yaml

package_root: com.bmwcarit.barefoot

sites:
  - {class: com.bmwcarit.barefoot.analysis.DBCAN, method: cluster, match: "(ISearchIndex<T> index, double epsilon, int minimum)", note: "DBCAN.cluster"}
  - {class: com.bmwcarit.barefoot.markov.KState, method: isEmpty, match: "()", note: "KState.isEmpty"}
  - {class: com.bmwcarit.barefoot.matcher.Matcher, method: getSigma, match: "()", note: "Matcher.getSigma"}
  - {class: com.bmwcarit.barefoot.road.BaseRoad, method: id, match: "()", note: "BaseRoad.id"}
  - {class: com.bmwcarit.barefoot.roadmap.RoadMap, method: clear, match: "()", note: "RoadMap.clear"}
  - {class: com.bmwcarit.barefoot.scheduler.Group, method: spawn, match: "(Task task)", note: "Group.spawn"}
  - {class: com.bmwcarit.barefoot.spatial.Geography, method: distance, match: "(Point a, Point b)", note: "Geography.distance"}
  - {class: com.bmwcarit.barefoot.topology.Dijkstra, method: route, match: "(P source, P target, Cost<E> cost)", note: "Dijkstra.route"}
  - {class: com.bmwcarit.barefoot.tracker.TemporaryMemory, method: run, match: "()", note: "TemporaryMemory.run"}
  - {class: com.bmwcarit.barefoot.util.AbstractServer, method: call, match: "() throws IOException", note: "AbstractServer.call"}
  - {class: com.bmwcarit.barefoot.analysis.DBCAN, method: radius, match: "(Double center, double radius)", note: "DBCAN.radius"}
  - {class: com.bmwcarit.barefoot.markov.KState, method: size, match: "()", note: "KState.size"}
  - {class: com.bmwcarit.barefoot.matcher.Matcher, method: setSigma, match: "(double sigma)", note: "Matcher.setSigma"}
  - {class: com.bmwcarit.barefoot.road.BaseRoad, method: source, match: "()", note: "BaseRoad.source"}
  - {class: com.bmwcarit.barefoot.roadmap.RoadMap, method: nearest, match: "(Point c)", note: "RoadMap.nearest"}
  - {class: com.bmwcarit.barefoot.scheduler.Group, method: cancel, match: "()", note: "Group.cancel"}
  - {class: com.bmwcarit.barefoot.spatial.Geography, method: intercept, match: "(Point a, Point b, Point c)", note: "Geography.intercept"}
  - {class: com.bmwcarit.barefoot.topology.Dijkstra, method: route, match: "(P source, P target, Cost<E> cost, Cost<E> bound, Double max)", note: "Dijkstra.route"}
  - {class: com.bmwcarit.barefoot.tracker.TemporaryMemory, method: updateAndUnlock, match: "(int ttl)", note: "TemporaryMemory.updateAndUnlock"}
  - {class: com.bmwcarit.barefoot.util.AbstractServer, method: call, match: "() throws IOException", note: "AbstractServer.call"}
  - {class: com.bmwcarit.barefoot.analysis.DBRCAN, method: modulo, match: "(double dividend, double divisor)", note: "DBRCAN.modulo"}
  - {class: com.bmwcarit.barefoot.markov.Sample, method: time, match: "()", note: "Sample.time"}
  - {class: com.bmwcarit.barefoot.matcher.MatcherCandidate, method: point, match: "()", note: "MatcherCandidate.point"}
  - {class: com.bmwcarit.barefoot.road.BfmapReader, method: isOpen, match: "()", note: "BfmapReader.isOpen"}
  - {class: com.bmwcarit.barefoot.roadmap.Distance, method: cost, match: "(Road road)", note: "Distance.cost"}
  - {class: com.bmwcarit.barefoot.scheduler.Scheduler, method: group, match: "()", note: "Scheduler.group"}
  - {class: com.bmwcarit.barefoot.spatial.Intercept, method: intercept, match: "(double lata1, double lona1, double lata2, double lona2,", note: "Intercept.intercept"}
  - {class: com.bmwcarit.barefoot.topology.Edge, method: id, match: "()", note: "Edge.id"}
  - {class: com.bmwcarit.barefoot.tracker.TrackerServer, method: getMap, match: "()", note: "TrackerServer.getMap"}
  - {class: com.bmwcarit.barefoot.util.PostgresSource, method: isOpen, match: "()", note: "PostgresSource.isOpen"}
  - {class: com.bmwcarit.barefoot.analysis.DBRCAN, method: epsilonRound, match: "(double value)", note: "DBRCAN.epsilonRound"}
  - {class: com.bmwcarit.barefoot.markov.Sample, method: toJSON, match: "() throws JSONException", note: "Sample.toJSON"}
  - {class: com.bmwcarit.barefoot.matcher.MatcherCandidate, method: toJSON, match: "() throws JSONException", note: "MatcherCandidate.toJSON"}
  - {class: com.bmwcarit.barefoot.road.BfmapReader, method: open, match: "() throws SourceException", note: "BfmapReader.open"}
  - {class: com.bmwcarit.barefoot.roadmap.Loader, method: roadmap, match: "(String propertiesPath, boolean buffer)", note: "Loader.roadmap"}
  - {class: com.bmwcarit.barefoot.scheduler.Scheduler, method: shutdown, match: "()", note: "Scheduler.shutdown"}
  - {class: com.bmwcarit.barefoot.spatial.Intersect, method: intersect, match: "(double lata1, double lona1, double lata2, double lona2,", note: "Intersect.intersect"}
  - {class: com.bmwcarit.barefoot.topology.Edge, method: source, match: "()", note: "Edge.source"}
  - {class: com.bmwcarit.barefoot.tracker.TrackerServer, method: getMatcher, match: "()", note: "TrackerServer.getMatcher"}
  - {class: com.bmwcarit.barefoot.util.PostgresSource, method: open, match: "() throws SourceException", note: "PostgresSource.open"}
  - {class: com.bmwcarit.barefoot.analysis.DBSCAN, method: radius, match: "(Point center, double radius)", note: "DBSCAN.radius"}
  - {class: com.bmwcarit.barefoot.markov.StateCandidate, method: id, match: "()", note: "StateCandidate.id"}
  - {class: com.bmwcarit.barefoot.matcher.MatcherFactory, method: candidate, match: "(JSONObject json) throws JSONException", note: "MatcherFactory.candidate"}
  - {class: com.bmwcarit.barefoot.road.BfmapWriter, method: isOpen, match: "()", note: "BfmapWriter.isOpen"}
  - {class: com.bmwcarit.barefoot.roadmap.Loader, method: roadmap, match: "(Properties properties, boolean buffer) throws SourceException", note: "Loader.roadmap"}
  - {class: com.bmwcarit.barefoot.scheduler.StaticScheduler, method: spawn, match: "(Task task)", note: "StaticScheduler.spawn"}
  - {class: com.bmwcarit.barefoot.spatial.QuadTreeIndex, method: clear, match: "()", note: "QuadTreeIndex.clear"}
  - {class: com.bmwcarit.barefoot.topology.Graph, method: size, match: "()", note: "Graph.size"}
  - {class: com.bmwcarit.barefoot.util.Quadruple, method: four, match: "()", note: "Quadruple.four"}
  - {class: com.bmwcarit.barefoot.analysis.DBSCAN, method: iterator, match: "()", note: "DBSCAN.iterator"}
