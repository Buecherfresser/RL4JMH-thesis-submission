  - {class: org.locationtech.spatial4j.shape.SpatialRelation, method: combine, match: "(SpatialRelation other)", note: "SpatialRelation.combine"}
  - {class: org.locationtech.spatial4j.io.GeoJSONReader, method: getFormatName, match: "()", note: "GeoJSONReader.getFormatName"}
  - {class: org.locationtech.spatial4j.shape.impl.BBoxCalculator, method: expandRange, match: "(Rectangle rect)", note: "BBoxCalculator.expandRange"}
  - {class: org.locationtech.spatial4j.io.GeoJSONReader, method: readIfSupported, match: "(Object value) throws InvalidShapeException", note: "GeoJSONReader.readIfSupported"}
  - {class: org.locationtech.spatial4j.shape.impl.BBoxCalculator, method: expandRange, match: "(final double minX, final double maxX, double minY, double maxY)", note: "BBoxCalculator.expandRange"}
  - {class: org.locationtech.spatial4j.io.GeoJSONWriter, method: getFormatName, match: "()", note: "GeoJSONWriter.getFormatName"}
  - {class: org.locationtech.spatial4j.shape.impl.CircleImpl, method: reset, match: "(double x, double y, double radiusDEG)", note: "CircleImpl.reset"}
  - {class: org.locationtech.spatial4j.io.LegacyShapeReader, method: readShapeOrNull, match: "(String str, SpatialContext ctx) throws InvalidShapeException", note: "LegacyShapeReader.readShapeOrNull"}
  - {class: org.locationtech.spatial4j.shape.impl.CircleImpl, method: isEmpty, match: "()", note: "CircleImpl.isEmpty"}
  - {class: org.locationtech.spatial4j.io.LegacyShapeReader, method: getFormatName, match: "()", note: "LegacyShapeReader.getFormatName"}
  - {class: org.locationtech.spatial4j.shape.impl.GeoCircle, method: reset, match: "(double x, double y, double radiusDEG)", note: "GeoCircle.reset"}
  - {class: org.locationtech.spatial4j.io.LegacyShapeWriter, method: writeShape, match: "(Shape shape)", note: "LegacyShapeWriter.writeShape"}
  - {class: org.locationtech.spatial4j.shape.impl.GeoCircle, method: getYAxis, match: "()", note: "GeoCircle.getYAxis"}
  - {class: org.locationtech.spatial4j.io.LegacyShapeWriter, method: writeShape, match: "(Shape shape, NumberFormat nf)", note: "LegacyShapeWriter.writeShape"}
  - {class: org.locationtech.spatial4j.shape.impl.InfBufLine, method: distanceUnbuffered, match: "(Point c)", note: "InfBufLine.distanceUnbuffered"}
  - {class: org.locationtech.spatial4j.io.PolyshapeReader, method: getFormatName, match: "()", note: "PolyshapeReader.getFormatName"}
  - {class: org.locationtech.spatial4j.shape.impl.InfBufLine, method: quadrant, match: "(Point c)", note: "InfBufLine.quadrant"}
  - {class: org.locationtech.spatial4j.io.PolyshapeReader, method: readIfSupported, match: "(Object value) throws InvalidShapeException", note: "PolyshapeReader.readIfSupported"}
  - {class: org.locationtech.spatial4j.shape.impl.PointImpl, method: isEmpty, match: "()", note: "PointImpl.isEmpty"}
