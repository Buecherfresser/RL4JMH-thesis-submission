  - {class: org.javimmutable.collections.common.ArrayToMapAdaptor, method: of, match: "(IArray<V> map)", note: "ArrayToMapAdaptor.of"}
  - {class: org.javimmutable.collections.deque.ForwardBuilder, method: checkInvariants, match: "()", note: "ForwardBuilder.checkInvariants"}
