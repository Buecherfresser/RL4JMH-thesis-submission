# Curated performance-mutation sites for easyflow (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants easyflow --source data/external-src/<checkout> \
#       --sites data/projects/easyflow/mutation_sites.yaml

package_root: au.com.ds

sites:
  - {class: au.com.ds.ef.FlowBuilder, method: to, match: "(StateEnum state)", note: "FlowBuilder.to"}
  - {class: au.com.ds.ef.FlowBuilder, method: finish, match: "(StateEnum state)", note: "FlowBuilder.finish"}
  - {class: au.com.ds.ef.FlowBuilder, method: from, match: "(StateEnum startState)", note: "FlowBuilder.from"}
  - {class: au.com.ds.ef.FlowBuilder, method: fromTransitions, match: "(StateEnum startState,", note: "FlowBuilder.fromTransitions"}
  - {class: au.com.ds.ef.FlowBuilder, method: on, match: "(EventEnum event)", note: "FlowBuilder.on"}
  - {class: au.com.ds.ef.FlowBuilder, method: transit, match: "(Transition... transitions)", note: "FlowBuilder.transit"}
  - {class: au.com.ds.ef.FlowBuilder, method: transit, match: "(boolean skipValidation, Transition... transitions)", note: "FlowBuilder.transit"}
  - {class: au.com.ds.ef.AsyncExecutor, method: execute, match: "(Runnable task)", note: "AsyncExecutor.execute"}
  - {class: au.com.ds.ef.EasyFlow, method: call, match: "(ExecutionError error, StatefulContext context)", note: "EasyFlow.call"}
  - {class: au.com.ds.ef.EasyFlow, method: processAllTransitions, match: "(boolean skipValidation)", note: "EasyFlow.processAllTransitions"}
  - {class: au.com.ds.ef.EasyFlow, method: setTransitions, match: "(Collection<Transition> collection, boolean skipValidation)", note: "EasyFlow.setTransitions"}
  - {class: au.com.ds.ef.EasyFlow, method: start, match: "(final C context)", note: "EasyFlow.start"}
  - {class: au.com.ds.ef.EasyFlow, method: start, match: "(boolean enterInitialState, final C context)", note: "EasyFlow.start"}
  - {class: au.com.ds.ef.EasyFlow, method: setCurrentState, match: "(final StateEnum state, final boolean enterInitialState, final C context)", note: "EasyFlow.setCurrentState"}
  - {class: au.com.ds.ef.EasyFlow, method: run, match: "()", note: "EasyFlow.run"}
  - {class: au.com.ds.ef.EasyFlow, method: execute, match: "(Runnable task, final C context)", note: "EasyFlow.execute"}
  - {class: au.com.ds.ef.EasyFlow, method: whenEvent, match: "(EventEnum event, ContextHandler<C1> onEvent)", note: "EasyFlow.whenEvent"}
  - {class: au.com.ds.ef.EasyFlow, method: whenEvent, match: "(EventHandler<C1> onEvent)", note: "EasyFlow.whenEvent"}
  - {class: au.com.ds.ef.EasyFlow, method: whenEnter, match: "(StateEnum state, ContextHandler<C1> onEnter)", note: "EasyFlow.whenEnter"}
  - {class: au.com.ds.ef.EasyFlow, method: whenEnter, match: "(StateHandler<C1> onEnter)", note: "EasyFlow.whenEnter"}
  - {class: au.com.ds.ef.EasyFlow, method: whenLeave, match: "(StateEnum state, ContextHandler<C1> onEnter)", note: "EasyFlow.whenLeave"}
  - {class: au.com.ds.ef.EasyFlow, method: whenLeave, match: "(StateHandler<C1> onEnter)", note: "EasyFlow.whenLeave"}
  - {class: au.com.ds.ef.EasyFlow, method: whenError, match: "(ExecutionErrorHandler<C1> onError)", note: "EasyFlow.whenError"}
  - {class: au.com.ds.ef.EasyFlow, method: whenFinalState, match: "(StateHandler<C1> onFinalState)", note: "EasyFlow.whenFinalState"}
  - {class: au.com.ds.ef.EasyFlow, method: waitForCompletion, match: "(C context)", note: "EasyFlow.waitForCompletion"}
  - {class: au.com.ds.ef.EasyFlow, method: executor, match: "(Executor executor)", note: "EasyFlow.executor"}
  - {class: au.com.ds.ef.EasyFlow, method: trace, match: "()", note: "EasyFlow.trace"}
  - {class: au.com.ds.ef.EasyFlow, method: logger, match: "(FlowLogger log)", note: "EasyFlow.logger"}
  - {class: au.com.ds.ef.EasyFlow, method: safeTrigger, match: "(final EventEnum event, final C context)", note: "EasyFlow.safeTrigger"}
  - {class: au.com.ds.ef.EasyFlow, method: trigger, match: "(final EventEnum event, final C context) throws LogicViolationError", note: "EasyFlow.trigger"}
  - {class: au.com.ds.ef.EasyFlow, method: getAvailableTransitions, match: "(StateEnum stateFrom)", note: "EasyFlow.getAvailableTransitions"}
  - {class: au.com.ds.ef.EasyFlow, method: isEventHandledByState, match: "(final StateEnum state, final EventEnum event)", note: "EasyFlow.isEventHandledByState"}
  - {class: au.com.ds.ef.EasyFlow, method: run, match: "()", note: "EasyFlow.run"}
  - {class: au.com.ds.ef.EasyFlow, method: isTrace, match: "()", note: "EasyFlow.isTrace"}
  - {class: au.com.ds.ef.EasyFlow, method: doOnError, match: "(final ExecutionError error)", note: "EasyFlow.doOnError"}
  - {class: au.com.ds.ef.EasyFlow, method: getStartState, match: "()", note: "EasyFlow.getStartState"}
  - {class: au.com.ds.ef.EasyFlow, method: doOnTerminate, match: "(StateEnum state, final C context)", note: "EasyFlow.doOnTerminate"}
  - {class: au.com.ds.ef.FlowLoggerImpl, method: info, match: "(String message, Object... o)", note: "FlowLoggerImpl.info"}
  - {class: au.com.ds.ef.FlowLoggerImpl, method: error, match: "(String message, Throwable e)", note: "FlowLoggerImpl.error"}
  - {class: au.com.ds.ef.HandlerCollection, method: setHandler, match: "(EventType eventType, StateEnum state, EventEnum event, Handler handler)", note: "HandlerCollection.setHandler"}
  - {class: au.com.ds.ef.HandlerCollection, method: callOnEventTriggered, match: "(EventEnum event, StateEnum stateFrom, StateEnum stateTo, C context) throws Exception", note: "HandlerCollection.callOnEventTriggered"}
  - {class: au.com.ds.ef.HandlerCollection, method: callOnStateEntered, match: "(StateEnum state, C context) throws Exception", note: "HandlerCollection.callOnStateEntered"}
  - {class: au.com.ds.ef.HandlerCollection, method: callOnStateLeaved, match: "(StateEnum state, C context) throws Exception", note: "HandlerCollection.callOnStateLeaved"}
  - {class: au.com.ds.ef.HandlerCollection, method: callOnFinalState, match: "(StateEnum state, C context) throws Exception", note: "HandlerCollection.callOnFinalState"}
  - {class: au.com.ds.ef.HandlerCollection, method: callOnError, match: "(ExecutionError error)", note: "HandlerCollection.callOnError"}
  - {class: au.com.ds.ef.StatefulContext, method: getId, match: "()", note: "StatefulContext.getId"}
  - {class: au.com.ds.ef.StatefulContext, method: setState, match: "(StateEnum state)", note: "StatefulContext.setState"}
  - {class: au.com.ds.ef.StatefulContext, method: getState, match: "()", note: "StatefulContext.getState"}
  - {class: au.com.ds.ef.StatefulContext, method: stop, match: "()", note: "StatefulContext.stop"}
  - {class: au.com.ds.ef.StatefulContext, method: isStopped, match: "()", note: "StatefulContext.isStopped"}
