  - {class: com.github.sgreben.regex_builder.charclass.NonHorizontalWhitespace, method: complement, match: "()", note: "NonHorizontalWhitespace.complement"}
  - {class: com.github.sgreben.regex_builder.charclass.NonHorizontalWhitespace, method: compile, match: "(java.util.List<TOKEN> output)", note: "NonHorizontalWhitespace.compile"}
  - {class: com.github.sgreben.regex_builder.charclass.NonVerticalWhitespace, method: complement, match: "()", note: "NonVerticalWhitespace.complement"}
  - {class: com.github.sgreben.regex_builder.charclass.NonVerticalWhitespace, method: compile, match: "(java.util.List<TOKEN> output)", note: "NonVerticalWhitespace.compile"}
  - {class: com.github.sgreben.regex_builder.charclass.NonWhitespace, method: complement, match: "()", note: "NonWhitespace.complement"}
  - {class: com.github.sgreben.regex_builder.charclass.NonWhitespace, method: compile, match: "(java.util.List<TOKEN> output)", note: "NonWhitespace.compile"}
  - {class: com.github.sgreben.regex_builder.charclass.NonWordBoundary, method: complement, match: "()", note: "NonWordBoundary.complement"}
  - {class: com.github.sgreben.regex_builder.charclass.NonWordBoundary, method: compile, match: "(java.util.List<TOKEN> output)", note: "NonWordBoundary.compile"}
  - {class: com.github.sgreben.regex_builder.charclass.NonWordCharacter, method: complement, match: "()", note: "NonWordCharacter.complement"}
