# Curated performance-mutation sites for javacc (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants javacc --source data/external-src/<checkout> \
#       --sites data/projects/javacc/mutation_sites.yaml

package_root: org.javacc.parser

sites:
  - {class: org.javacc.parser.CharacterRange, method: setLeft, match: "(char left)", note: "CharacterRange.setLeft"}
  - {class: org.javacc.parser.CharacterRange, method: getLeft, match: "()", note: "CharacterRange.getLeft"}
  - {class: org.javacc.parser.RCharacterList, method: GenerateNfa, match: "(boolean ignoreCase)", note: "RCharacterList.GenerateNfa"}
  - {class: org.javacc.parser.RCharacterList, method: CanMatchAnyChar, match: "()", note: "RCharacterList.CanMatchAnyChar"}
  - {class: org.javacc.parser.RRepetitionRange, method: GenerateNfa, match: "(boolean ignoreCase)", note: "RRepetitionRange.GenerateNfa"}
  - {class: org.javacc.parser.RStringLiteral, method: InsertValidKind, match: "(int kind)", note: "RStringLiteral.InsertValidKind"}
  - {class: org.javacc.parser.RStringLiteral, method: InsertFinalKind, match: "(int kind)", note: "RStringLiteral.InsertFinalKind"}
  - {class: org.javacc.parser.Action, method: dump, match: "(int indent, Set alreadyDumped)", note: "Action.dump"}
  - {class: org.javacc.parser.Action, method: getActionTokens, match: "()", note: "Action.getActionTokens"}
  - {class: org.javacc.parser.BNFProduction, method: getDeclarationTokens, match: "()", note: "BNFProduction.getDeclarationTokens"}
  - {class: org.javacc.parser.BNFProduction, method: setJumpPatched, match: "(boolean jumpPatched)", note: "BNFProduction.setJumpPatched"}
  - {class: org.javacc.parser.CPPFiles, method: gen_CharStream, match: "()", note: "CPPFiles.gen_CharStream"}
  - {class: org.javacc.parser.CPPFiles, method: gen_ParseException, match: "()", note: "CPPFiles.gen_ParseException"}
  - {class: org.javacc.parser.Choice, method: setChoices, match: "(List<? super Object> choices)", note: "Choice.setChoices"}
  - {class: org.javacc.parser.Choice, method: getChoices, match: "()", note: "Choice.getChoices"}
  - {class: org.javacc.parser.CodeGenerator, method: genStringLiteralArrayCPP, match: "(String varName, String[] arr)", note: "CodeGenerator.genStringLiteralArrayCPP"}
  - {class: org.javacc.parser.CodeGenerator, method: genStringLiteralInCPP, match: "(String s)", note: "CodeGenerator.genStringLiteralInCPP"}
  - {class: org.javacc.parser.Expansion, method: reInit, match: "()", note: "Expansion.reInit"}
  - {class: org.javacc.parser.Expansion, method: dumpPrefix, match: "(int indent)", note: "Expansion.dumpPrefix"}
  - {class: org.javacc.parser.JavaCCErrors, method: parse_error, match: "(Object node, String mess)", note: "JavaCCErrors.parse_error"}
  - {class: org.javacc.parser.JavaCCErrors, method: parse_error, match: "(String mess)", note: "JavaCCErrors.parse_error"}
  - {class: org.javacc.parser.JavaCCGlobals, method: getIdString, match: "(String toolName, String fileName)", note: "JavaCCGlobals.getIdString"}
  - {class: org.javacc.parser.JavaCCGlobals, method: getIdString, match: "(List<String> toolNames, String fileName)", note: "JavaCCGlobals.getIdString"}
  - {class: org.javacc.parser.JavaFiles, method: getTokenMgrErrorTemplateResourceUrl, match: "()", note: "JavaFiles.getTokenMgrErrorTemplateResourceUrl"}
  - {class: org.javacc.parser.JavaFiles, method: getCharStreamTemplateResourceUrl, match: "()", note: "JavaFiles.getCharStreamTemplateResourceUrl"}
  - {class: org.javacc.parser.LexGen, method: writeTemplate, match: "(String name, Object... additionalOptions) throws IOException", note: "LexGen.writeTemplate"}
  - {class: org.javacc.parser.LexGen, method: AddCharToSkip, match: "(char c, int kind)", note: "LexGen.AddCharToSkip"}
  - {class: org.javacc.parser.LexGenCPP, method: AddCharToSkip, match: "(char c, int kind)", note: "LexGenCPP.AddCharToSkip"}
  - {class: org.javacc.parser.LexGenCPP, method: start, match: "() throws IOException", note: "LexGenCPP.start"}
  - {class: org.javacc.parser.Lookahead, method: dump, match: "(int indent, Set alreadyDumped)", note: "Lookahead.dump"}
  - {class: org.javacc.parser.Lookahead, method: getActionTokens, match: "()", note: "Lookahead.getActionTokens"}
  - {class: org.javacc.parser.LookaheadCalc, method: choiceCalc, match: "(Choice ch)", note: "LookaheadCalc.choiceCalc"}
  - {class: org.javacc.parser.LookaheadCalc, method: ebnfCalc, match: "(Expansion exp, Expansion nested)", note: "LookaheadCalc.ebnfCalc"}
  - {class: org.javacc.parser.LookaheadWalk, method: genFirstSet, match: "(List<MatchInfo> partialMatches, Expansion exp)", note: "LookaheadWalk.genFirstSet"}
  - {class: org.javacc.parser.LookaheadWalk, method: genFollowSet, match: "(List<MatchInfo> partialMatches, Expansion exp, long generation)", note: "LookaheadWalk.genFollowSet"}
  - {class: org.javacc.parser.Main, method: main, match: "(String args[]) throws Exception", note: "Main.main"}
  - {class: org.javacc.parser.Main, method: mainProgram, match: "(String args[]) throws Exception", note: "Main.mainProgram"}
  - {class: org.javacc.parser.MatchInfo, method: reInit, match: "()", note: "MatchInfo.reInit"}
  - {class: org.javacc.parser.NfaState, method: ReInit, match: "()", note: "NfaState.ReInit"}
  - {class: org.javacc.parser.NfaState, method: HasTransitions, match: "()", note: "NfaState.HasTransitions"}
  - {class: org.javacc.parser.NonTerminal, method: dump, match: "(int indent, Set alreadyDumped)", note: "NonTerminal.dump"}
  - {class: org.javacc.parser.NonTerminal, method: setLhsTokens, match: "(List<Token> lhsTokens)", note: "NonTerminal.setLhsTokens"}
  - {class: org.javacc.parser.NormalProduction, method: dumpPrefix, match: "(int indent)", note: "NormalProduction.dumpPrefix"}
  - {class: org.javacc.parser.NormalProduction, method: getSimpleName, match: "()", note: "NormalProduction.getSimpleName"}
  - {class: org.javacc.parser.OneOrMore, method: dump, match: "(int indent, Set<? super Expansion> alreadyDumped)", note: "OneOrMore.dump"}
  - {class: org.javacc.parser.Options, method: init, match: "()", note: "Options.init"}
  - {class: org.javacc.parser.Options, method: intValue, match: "(final String option)", note: "Options.intValue"}
  - {class: org.javacc.parser.OtherFilesGen, method: reInit, match: "()", note: "OtherFilesGen.reInit"}
  - {class: org.javacc.parser.OtherFilesGenCPP, method: printCharArray, match: "(java.io.PrintWriter ostr, String s)", note: "OtherFilesGenCPP.printCharArray"}
  - {class: org.javacc.parser.OtherFilesGenCPP, method: reInit, match: "()", note: "OtherFilesGenCPP.reInit"}
