# Curated performance-mutation sites for vavr (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants vavr --source data/external-src/<checkout> \
#       --sites data/projects/vavr/mutation_sites.yaml

package_root: io.vavr

sites:
  - {class: io.vavr.Lazy, method: narrow, match: "(Lazy<? extends T> lazy)", note: "Lazy.narrow"}
  - {class: io.vavr.collection.Array, method: collector, match: "()", note: "Array.collector"}
  - {class: io.vavr.concurrent.FutureImpl, method: await, match: "()", note: "FutureImpl.await"}
  - {class: io.vavr.Lazy, method: isAsync, match: "()", note: "Lazy.isAsync"}
  - {class: io.vavr.collection.Array, method: empty, match: "()", note: "Array.empty"}
  - {class: io.vavr.concurrent.FutureImpl, method: block, match: "()", note: "FutureImpl.block"}
  - {class: io.vavr.Lazy, method: isEmpty, match: "()", note: "Lazy.isEmpty"}
  - {class: io.vavr.collection.Array, method: narrow, match: "(Array<? extends T> array)", note: "Array.narrow"}
  - {class: io.vavr.concurrent.FutureImpl, method: isReleasable, match: "()", note: "FutureImpl.isReleasable"}
  - {class: io.vavr.MatchError, method: getObject, match: "()", note: "MatchError.getObject"}
  - {class: io.vavr.collection.HashMap, method: collector, match: "()", note: "HashMap.collector"}
  - {class: io.vavr.Predicates, method: is, match: "(T value)", note: "Predicates.is"}
  - {class: io.vavr.collection.HashMap, method: empty, match: "()", note: "HashMap.empty"}
  - {class: io.vavr.Predicates, method: isNotNull, match: "()", note: "Predicates.isNotNull"}
  - {class: io.vavr.collection.HashMap, method: narrow, match: "(HashMap<? extends K, ? extends V> hashMap)", note: "HashMap.narrow"}
  - {class: io.vavr.Predicates, method: isNull, match: "()", note: "Predicates.isNull"}
  - {class: io.vavr.collection.HashSet, method: empty, match: "()", note: "HashSet.empty"}
  - {class: io.vavr.collection.HashSet, method: collector, match: "()", note: "HashSet.collector"}
  - {class: io.vavr.collection.HashSet, method: narrow, match: "(HashSet<? extends T> hashSet)", note: "HashSet.narrow"}
  - {class: io.vavr.collection.LinkedHashMap, method: collector, match: "()", note: "LinkedHashMap.collector"}
  - {class: io.vavr.collection.LinkedHashMap, method: empty, match: "()", note: "LinkedHashMap.empty"}
  - {class: io.vavr.collection.LinkedHashMap, method: of, match: "(K key, V value)", note: "LinkedHashMap.of"}
  - {class: io.vavr.collection.LinkedHashSet, method: empty, match: "()", note: "LinkedHashSet.empty"}
  - {class: io.vavr.collection.LinkedHashSet, method: collector, match: "()", note: "LinkedHashSet.collector"}
  - {class: io.vavr.collection.LinkedHashSet, method: narrow, match: "(LinkedHashSet<? extends T> linkedHashSet)", note: "LinkedHashSet.narrow"}
  - {class: io.vavr.collection.TreeMap, method: collector, match: "()", note: "TreeMap.collector"}
  - {class: io.vavr.collection.TreeMap, method: empty, match: "()", note: "TreeMap.empty"}
  - {class: io.vavr.collection.TreeMap, method: narrow, match: "(TreeMap<? extends K, ? extends V> treeMap)", note: "TreeMap.narrow"}
  - {class: io.vavr.collection.TreeSet, method: collector, match: "()", note: "TreeSet.collector"}
  - {class: io.vavr.collection.TreeSet, method: empty, match: "()", note: "TreeSet.empty"}
  - {class: io.vavr.collection.TreeSet, method: narrow, match: "(TreeSet<? extends T> treeSet)", note: "TreeSet.narrow"}
  - {class: io.vavr.collection.CharSeq, method: empty, match: "()", note: "CharSeq.empty"}
  - {class: io.vavr.collection.CharSeq, method: collector, match: "()", note: "CharSeq.collector"}
  - {class: io.vavr.collection.CharSeq, method: of, match: "(char character)", note: "CharSeq.of"}
  - {class: io.vavr.collection.Collections, method: getNext, match: "()", note: "Collections.getNext"}
  - {class: io.vavr.collection.HashMultimap, method: withSeq, match: "()", note: "HashMultimap.withSeq"}
  - {class: io.vavr.collection.HashMultimap, method: withSet, match: "()", note: "HashMultimap.withSet"}
  - {class: io.vavr.collection.HashMultimap, method: withSortedSet, match: "()", note: "HashMultimap.withSortedSet"}
  - {class: io.vavr.collection.JavaConverters, method: isMutable, match: "()", note: "JavaConverters.isMutable"}
  - {class: io.vavr.collection.JavaConverters, method: setDelegateAndCheckChanged, match: "(Supplier<C> delegate)", note: "JavaConverters.setDelegateAndCheckChanged"}
  - {class: io.vavr.collection.JavaConverters, method: setDelegate, match: "(Supplier<C> newDelegate)", note: "JavaConverters.setDelegate"}
  - {class: io.vavr.collection.LinkedHashMultimap, method: withSeq, match: "()", note: "LinkedHashMultimap.withSeq"}
  - {class: io.vavr.collection.LinkedHashMultimap, method: withSet, match: "()", note: "LinkedHashMultimap.withSet"}
  - {class: io.vavr.collection.LinkedHashMultimap, method: withSortedSet, match: "()", note: "LinkedHashMultimap.withSortedSet"}
  - {class: io.vavr.collection.PriorityQueue, method: enqueue, match: "(T element)", note: "PriorityQueue.enqueue"}
  - {class: io.vavr.collection.PriorityQueue, method: enqueueAll, match: "(Iterable<? extends T> elements)", note: "PriorityQueue.enqueueAll"}
  - {class: io.vavr.collection.PriorityQueue, method: head, match: "()", note: "PriorityQueue.head"}
  - {class: io.vavr.collection.Queue, method: collector, match: "()", note: "Queue.collector"}
  - {class: io.vavr.collection.Queue, method: empty, match: "()", note: "Queue.empty"}
  - {class: io.vavr.collection.Queue, method: narrow, match: "(Queue<? extends T> queue)", note: "Queue.narrow"}
