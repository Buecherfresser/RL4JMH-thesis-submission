  - {class: com.github.houbb.sensitive.word.support.check.WordCheckResult, method: newInstance, match: "()", note: "WordCheckResult.newInstance"}
  - {class: com.github.houbb.sensitive.word.support.check.WordCheckResult, method: wordLengthResult, match: "()", note: "WordCheckResult.wordLengthResult"}
  - {class: com.github.houbb.sensitive.word.support.check.WordCheckUrl, method: getInstance, match: "()", note: "WordCheckUrl.getInstance"}
  - {class: com.github.houbb.sensitive.word.support.check.WordCheckUrl, method: getSensitiveCheckClass, match: "()", note: "WordCheckUrl.getSensitiveCheckClass"}
  - {class: com.github.houbb.sensitive.word.support.check.WordCheckUrlNoPrefix, method: getInstance, match: "()", note: "WordCheckUrlNoPrefix.getInstance"}
  - {class: com.github.houbb.sensitive.word.support.check.WordCheckUrlNoPrefix, method: isUrl, match: "(String text)", note: "WordCheckUrlNoPrefix.isUrl"}
  - {class: com.github.houbb.sensitive.word.support.check.WordCheckWord, method: getInstance, match: "()", note: "WordCheckWord.getInstance"}
