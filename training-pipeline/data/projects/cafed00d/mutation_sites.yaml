  - {class: software.coley.cafedude.transform.LabelTransformer, method: getLabels, match: "(Method method)", note: "LabelTransformer.getLabels"}
  - {class: software.coley.cafedude.tree.visitor.writer.AnnotationArrayWriter, method: visitArrayEnum, match: "(@Nonnull String type, @Nonnull String name)", note: "AnnotationArrayWriter.visitArrayEnum"}
  - {class: software.coley.cafedude.util.GrowingByteBuffer, method: putBoolean, match: "(boolean value)", note: "GrowingByteBuffer.putBoolean"}
