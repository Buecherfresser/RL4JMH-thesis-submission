  - {class: io.vertx.ext.stomp.impl.EventBusBridge, method: unsubscribe, match: "(StompServerConnection connection, Frame frame)", note: "EventBusBridge.unsubscribe"}
  - {class: io.vertx.ext.stomp.impl.Queue, method: destination, match: "()", note: "Queue.destination"}
