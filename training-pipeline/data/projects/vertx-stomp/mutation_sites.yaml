# Curated performance-mutation sites for vertx-stomp (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants vertx-stomp --source data/external-src/<checkout> \
#       --sites data/projects/vertx-stomp/mutation_sites.yaml

package_root: io.vertx.ext

sites:
  - {class: io.vertx.ext.stomp.impl.FrameParser, method: handler, match: "(Handler<Frame> handler)", note: "FrameParser.handler"}
  - {class: io.vertx.ext.stomp.impl.FrameParser, method: errorHandler, match: "(Handler<FrameException> handler)", note: "FrameParser.errorHandler"}
  - {class: io.vertx.ext.stomp.impl.FrameParser, method: handle, match: "(Buffer event)", note: "FrameParser.handle"}
  - {class: io.vertx.ext.stomp.BridgeOptions, method: toJson, match: "()", note: "BridgeOptions.toJson"}
  - {class: io.vertx.ext.stomp.BridgeOptions, method: setPointToPoint, match: "(boolean v)", note: "BridgeOptions.setPointToPoint"}
  - {class: io.vertx.ext.stomp.BridgeOptions, method: isPointToPoint, match: "()", note: "BridgeOptions.isPointToPoint"}
  - {class: io.vertx.ext.stomp.DefaultAbortHandler, method: handle, match: "(ServerFrame sf)", note: "DefaultAbortHandler.handle"}
  - {class: io.vertx.ext.stomp.DefaultAckHandler, method: handle, match: "(ServerFrame serverFrame)", note: "DefaultAckHandler.handle"}
  - {class: io.vertx.ext.stomp.DefaultBeginHandler, method: handle, match: "(ServerFrame serverFrame)", note: "DefaultBeginHandler.handle"}
  - {class: io.vertx.ext.stomp.DefaultCommitHandler, method: handle, match: "(ServerFrame serverFrame)", note: "DefaultCommitHandler.handle"}
  - {class: io.vertx.ext.stomp.DefaultConnectHandler, method: handle, match: "(ServerFrame sf)", note: "DefaultConnectHandler.handle"}
  - {class: io.vertx.ext.stomp.DefaultNackHandler, method: handle, match: "(ServerFrame sf)", note: "DefaultNackHandler.handle"}
  - {class: io.vertx.ext.stomp.DefaultSendHandler, method: handle, match: "(ServerFrame sf)", note: "DefaultSendHandler.handle"}
  - {class: io.vertx.ext.stomp.DefaultSubscribeHandler, method: handle, match: "(ServerFrame serverFrame)", note: "DefaultSubscribeHandler.handle"}
  - {class: io.vertx.ext.stomp.DefaultUnsubscribeHandler, method: handle, match: "(ServerFrame serverFrame)", note: "DefaultUnsubscribeHandler.handle"}
  - {class: io.vertx.ext.stomp.Frame, method: parse, match: "(String header)", note: "Frame.parse"}
  - {class: io.vertx.ext.stomp.Frame, method: create, match: "(JsonObject json)", note: "Frame.create"}
  - {class: io.vertx.ext.stomp.Frame, method: computePingPeriod, match: "(Heartbeat client, Heartbeat server)", note: "Frame.computePingPeriod"}
  - {class: io.vertx.ext.stomp.StompClientOptions, method: toJson, match: "()", note: "StompClientOptions.toJson"}
