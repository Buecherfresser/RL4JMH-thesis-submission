# Curated performance-mutation sites for javareedsolomon (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants javareedsolomon --source data/external-src/<checkout> \
#       --sites data/projects/javareedsolomon/mutation_sites.yaml

package_root: com.backblaze.erasure

sites:
  - {class: com.backblaze.erasure.SampleDecoder, method: main, match: "(String [] arguments) throws IOException", note: "SampleDecoder.main"}
  - {class: com.backblaze.erasure.SampleEncoder, method: main, match: "(String [] arguments) throws IOException", note: "SampleEncoder.main"}
  - {class: com.backblaze.erasure.ByteInputOutputExpCodingLoop, method: codeSomeShards, match: "(", note: "ByteInputOutputExpCodingLoop.codeSomeShards"}
