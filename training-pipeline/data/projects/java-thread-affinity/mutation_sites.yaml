# Curated performance-mutation sites for java-thread-affinity (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants java-thread-affinity --source data/external-src/<checkout> \
#       --sites data/projects/java-thread-affinity/mutation_sites.yaml

package_root: net.openhft.affinity

