# Curated performance-mutation sites for extjwnl (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants extjwnl --source data/external-src/<checkout> \
#       --sites data/projects/extjwnl/mutation_sites.yaml

package_root: net.sf.extjwnl

sites:
  - {class: net.sf.extjwnl.cli.ewn, method: main, match: "(String[] args) throws IOException, JWNLException", note: "ewn.main"}
  - {class: net.sf.extjwnl.data.IndexWordSet, method: size, match: "()", note: "IndexWordSet.size"}
  - {class: net.sf.extjwnl.dictionary.MapBackedDictionary, method: delete, match: "() throws JWNLException", note: "MapBackedDictionary.delete"}
  - {class: net.sf.extjwnl.princeton.file.PrincetonObjectDictionaryFile, method: newInstance, match: "(final Dictionary dictionary,", note: "PrincetonObjectDictionaryFile.newInstance"}
  - {class: net.sf.extjwnl.util.ByteArrayCharSequence, method: getLastBytePosition, match: "()", note: "ByteArrayCharSequence.getLastBytePosition"}
  - {class: net.sf.extjwnl.utilities.DictionaryToMap, method: convert, match: "() throws JWNLException, IOException", note: "DictionaryToMap.convert"}
  - {class: net.sf.extjwnl.data.IndexWordSet, method: getIndexWord, match: "(POS p)", note: "IndexWordSet.getIndexWord"}
  - {class: net.sf.extjwnl.dictionary.MapBackedDictionary, method: close, match: "() throws JWNLException", note: "MapBackedDictionary.close"}
  - {class: net.sf.extjwnl.princeton.file.PrincetonObjectDictionaryFile, method: close, match: "()", note: "PrincetonObjectDictionaryFile.close"}
  - {class: net.sf.extjwnl.util.ByteArrayCharSequence, method: length, match: "()", note: "ByteArrayCharSequence.length"}
  - {class: net.sf.extjwnl.utilities.DictionaryToMap, method: main, match: "(String[] args) throws IOException, JWNLException", note: "DictionaryToMap.main"}
  - {class: net.sf.extjwnl.data.MapBackedDictionaryElementFactory, method: createSynset, match: "(POS pos) throws JWNLException", note: "MapBackedDictionaryElementFactory.createSynset"}
  - {class: net.sf.extjwnl.dictionary.MapDictionary, method: getIndexWord, match: "(POS pos, String lemma)", note: "MapDictionary.getIndexWord"}
  - {class: net.sf.extjwnl.princeton.file.PrincetonRandomAccessDictionaryFile, method: formatOffset, match: "(long i, int formatLength, StringBuilder target)", note: "PrincetonRandomAccessDictionaryFile.formatOffset"}
  - {class: net.sf.extjwnl.util.CharBufferCharSequence, method: length, match: "()", note: "CharBufferCharSequence.length"}
  - {class: net.sf.extjwnl.utilities.DictionaryToDatabase, method: main, match: "(String[] args) throws JWNLException, SQLException, IOException", note: "DictionaryToDatabase.main"}
  - {class: net.sf.extjwnl.data.list.PointerTargetNodeList, method: print, match: "(PrintStream stream, PointerTargetNode node, int indent, int indentIncrement)", note: "PointerTargetNodeList.print"}
  - {class: net.sf.extjwnl.dictionary.MapDictionary, method: getIndexWordIterator, match: "(POS pos, String substring)", note: "MapDictionary.getIndexWordIterator"}
  - {class: net.sf.extjwnl.princeton.file.PrincetonRandomAccessDictionaryFile, method: newInstance, match: "(Dictionary dictionary, String path, POS pos, DictionaryFileType fileType)", note: "PrincetonRandomAccessDictionaryFile.newInstance"}
  - {class: net.sf.extjwnl.util.CharBufferCharSequence, method: charAt, match: "(int index)", note: "CharBufferCharSequence.charAt"}
  - {class: net.sf.extjwnl.utilities.DictionaryToDatabase, method: importWordnet, match: "(String propertyFile, String tablesScript, String driverClass, String connectionURL, String username, String password) throws IOException, JWNLException, SQLException", note: "DictionaryToDatabase.importWordnet"}
  - {class: net.sf.extjwnl.data.list.PointerTargetNodeList, method: printIndented, match: "(PrintStream stream, PointerTargetNode node, int indent)", note: "PointerTargetNodeList.printIndented"}
  - {class: net.sf.extjwnl.dictionary.file.DictionaryCatalogSet, method: open, match: "() throws JWNLException", note: "DictionaryCatalogSet.open"}
  - {class: net.sf.extjwnl.princeton.file.PrincetonResourceDictionaryFile, method: newInstance, match: "(Dictionary dictionary, String path, POS pos, DictionaryFileType fileType)", note: "PrincetonResourceDictionaryFile.newInstance"}
  - {class: net.sf.extjwnl.util.CharSequenceParser, method: nextToken, match: "()", note: "CharSequenceParser.nextToken"}
  - {class: net.sf.extjwnl.utilities.Examples, method: main, match: "(String[] args) throws FileNotFoundException, JWNLException, CloneNotSupportedException", note: "Examples.main"}
  - {class: net.sf.extjwnl.data.list.PointerTargetTreeNodeList, method: print, match: "(PrintStream stream, PointerTargetTreeNode node, int indent, int indentIncrement)", note: "PointerTargetTreeNodeList.print"}
  - {class: net.sf.extjwnl.dictionary.file.DictionaryCatalogSet, method: delete, match: "() throws JWNLException", note: "DictionaryCatalogSet.delete"}
  - {class: net.sf.extjwnl.princeton.file.PrincetonResourceDictionaryFile, method: open, match: "() throws JWNLException", note: "PrincetonResourceDictionaryFile.open"}
  - {class: net.sf.extjwnl.util.CharSequenceParser, method: remainder, match: "()", note: "CharSequenceParser.remainder"}
  - {class: net.sf.extjwnl.utilities.Examples, method: go, match: "() throws JWNLException, CloneNotSupportedException", note: "Examples.go"}
  - {class: net.sf.extjwnl.data.list.PointerTargetTreeNodeList, method: getNodePrinter, match: "()", note: "PointerTargetTreeNodeList.getNodePrinter"}
  - {class: net.sf.extjwnl.dictionary.morph.BaseFormSet, method: addAll, match: "(BaseFormSet forms)", note: "BaseFormSet.addAll"}
  - {class: net.sf.extjwnl.princeton.file.PrincetonResourceObjectDictionaryFile, method: newInstance, match: "(final Dictionary dictionary,", note: "PrincetonResourceObjectDictionaryFile.newInstance"}
  - {class: net.sf.extjwnl.util.ResourceBundleSet, method: addResource, match: "(String resource)", note: "ResourceBundleSet.addResource"}
  - {class: net.sf.extjwnl.data.relationship.RelationshipList, method: getShallowest, match: "()", note: "RelationshipList.getShallowest"}
  - {class: net.sf.extjwnl.dictionary.morph.BaseFormSet, method: getForm, match: "(int index)", note: "BaseFormSet.getForm"}
  - {class: net.sf.extjwnl.princeton.file.PrincetonResourceObjectDictionaryFile, method: openOutputStream, match: "() throws JWNLException", note: "PrincetonResourceObjectDictionaryFile.openOutputStream"}
  - {class: net.sf.extjwnl.util.ResourceBundleSet, method: setLocale, match: "(Locale locale)", note: "ResourceBundleSet.setLocale"}
  - {class: net.sf.extjwnl.data.relationship.RelationshipList, method: getDeepest, match: "()", note: "RelationshipList.getDeepest"}
  - {class: net.sf.extjwnl.dictionary.DatabaseBackedDictionary, method: getIndexWord, match: "(POS pos, String lemma) throws JWNLException", note: "DatabaseBackedDictionary.getIndexWord"}
  - {class: net.sf.extjwnl.util.cache.LRUCacheSet, method: createCache, match: "(int size)", note: "LRUCacheSet.createCache"}
  - {class: net.sf.extjwnl.data.Adjective, method: getAdjectivePosition, match: "()", note: "Adjective.getAdjectivePosition"}
  - {class: net.sf.extjwnl.dictionary.DatabaseBackedDictionary, method: getIndexWordIterator, match: "(POS pos) throws JWNLException", note: "DatabaseBackedDictionary.getIndexWordIterator"}
  - {class: net.sf.extjwnl.util.factory.ParamList, method: getName, match: "()", note: "ParamList.getName"}
  - {class: net.sf.extjwnl.data.AdjectivePosition, method: getAdjectivePositionForKey, match: "(String key)", note: "AdjectivePosition.getAdjectivePositionForKey"}
  - {class: net.sf.extjwnl.dictionary.FileBackedDictionary, method: close, match: "() throws JWNLException", note: "FileBackedDictionary.close"}
  - {class: net.sf.extjwnl.util.factory.ParamList, method: getValue, match: "()", note: "ParamList.getValue"}
  - {class: net.sf.extjwnl.data.AdjectivePosition, method: getKey, match: "()", note: "AdjectivePosition.getKey"}
  - {class: net.sf.extjwnl.dictionary.FileBackedDictionary, method: delete, match: "() throws JWNLException", note: "FileBackedDictionary.delete"}
