  - {class: org.la4j.linear.LeastNormSolver, method: solve, match: "(Vector b)", note: "LeastNormSolver.solve"}
  - {class: org.la4j.matrix.sparse.CRSMatrix, method: zero, match: "(int rows, int columns)", note: "CRSMatrix.zero"}
  - {class: org.la4j.operation.ooplace.OoPlaceMatricesAddition, method: applySymmetric, match: "(RowMajorSparseMatrix a, ColumnMajorSparseMatrix b)", note: "OoPlaceMatricesAddition.applySymmetric"}
  - {class: org.la4j.decomposition.RawLUDecompositor, method: applicableTo, match: "(Matrix matrix)", note: "RawLUDecompositor.applicableTo"}
