# Curated performance-mutation sites for supertokens-core (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants supertokens-core --source data/external-src/<checkout> \
#       --sites data/projects/supertokens-core/mutation_sites.yaml

package_root: io.supertokens.webserver

