  - {class: org.dominokit.jackson.GwtJacksonJsonSerializerParameters, method: getPattern, match: "()", note: "GwtJacksonJsonSerializerParameters.getPattern"}
  - {class: org.dominokit.jackson.deser.array.PrimitiveByteArrayJsonDeserializer, method: doDeserializeArray, match: "(", note: "PrimitiveByteArrayJsonDeserializer.doDeserializeArray"}
