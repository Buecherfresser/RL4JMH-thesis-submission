# Curated performance-mutation sites for lz4-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants lz4-java --source data/external-src/<checkout> \
#       --sites data/projects/lz4-java/mutation_sites.yaml

package_root: net.jpountz.lz4

sites:
  - {class: java.net.jpountz.lz4.LZ4BlockInputStream, method: markSupported, match: "()", note: "LZ4BlockInputStream.markSupported"}
  - {class: java.net.jpountz.lz4.LZ4BlockInputStream, method: mark, match: "(int readlimit)", note: "LZ4BlockInputStream.mark"}
  - {class: java.net.jpountz.lz4.LZ4BlockInputStream, method: reset, match: "() throws IOException", note: "LZ4BlockInputStream.reset"}
  - {class: java.net.jpountz.lz4.LZ4BlockOutputStream, method: close, match: "() throws IOException", note: "LZ4BlockOutputStream.close"}
  - {class: java.net.jpountz.lz4.LZ4BlockOutputStream, method: finish, match: "() throws IOException", note: "LZ4BlockOutputStream.finish"}
  - {class: java.net.jpountz.lz4.LZ4FrameInputStream, method: close, match: "() throws IOException", note: "LZ4FrameInputStream.close"}
  - {class: java.net.jpountz.lz4.LZ4FrameInputStream, method: mark, match: "(int readlimit)", note: "LZ4FrameInputStream.mark"}
  - {class: java.net.jpountz.lz4.LZ4FrameInputStream, method: reset, match: "() throws IOException", note: "LZ4FrameInputStream.reset"}
  - {class: java.net.jpountz.lz4.LZ4FrameInputStream, method: markSupported, match: "()", note: "LZ4FrameInputStream.markSupported"}
