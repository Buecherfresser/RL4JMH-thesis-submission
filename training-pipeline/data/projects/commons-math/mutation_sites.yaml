# Curated performance-mutation sites for commons-math (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants commons-math --source data/external-src/<checkout> \
#       --sites data/projects/commons-math/mutation_sites.yaml

package_root: org.apache.commons.math4

sites:
  - {class: org.apache.commons.math4.core.jdkmath.AccurateMath, method: cosh, match: "(double x)", note: "AccurateMath.cosh"}
  - {class: org.apache.commons.math4.legacy.analysis.FunctionUtils, method: compose, match: "(final UnivariateFunction ... f)", note: "FunctionUtils.compose"}
  - {class: org.apache.commons.math4.neuralnet.MapRanking, method: rank, match: "(double[] features)", note: "MapRanking.rank"}
  - {class: org.apache.commons.math4.transform.FastCosineTransform, method: apply, match: "(final double[] f)", note: "FastCosineTransform.apply"}
  - {class: org.apache.commons.math4.core.jdkmath.AccurateMath, method: sinh, match: "(double x)", note: "AccurateMath.sinh"}
  - {class: org.apache.commons.math4.legacy.analysis.FunctionUtils, method: value, match: "(double x)", note: "FunctionUtils.value"}
  - {class: org.apache.commons.math4.neuralnet.MapRanking, method: getNeuron, match: "()", note: "MapRanking.getNeuron"}
  - {class: org.apache.commons.math4.transform.FastFourierTransform, method: transformInPlace, match: "(final double[][] dataRI)", note: "FastFourierTransform.transformInPlace"}
  - {class: org.apache.commons.math4.core.jdkmath.JdkMath, method: abs, match: "(int x)", note: "JdkMath.abs"}
  - {class: org.apache.commons.math4.legacy.analysis.differentiation.GradientFunction, method: value, match: "(double[] point)", note: "GradientFunction.value"}
  - {class: org.apache.commons.math4.neuralnet.oned.NeuronString, method: getNetwork, match: "()", note: "NeuronString.getNetwork"}
  - {class: org.apache.commons.math4.transform.FastFourierTransform, method: apply, match: "(final double[] f)", note: "FastFourierTransform.apply"}
  - {class: org.apache.commons.math4.core.jdkmath.JdkMath, method: abs, match: "(long x)", note: "JdkMath.abs"}
  - {class: org.apache.commons.math4.legacy.analysis.differentiation.JacobianFunction, method: value, match: "(double[] point)", note: "JacobianFunction.value"}
  - {class: org.apache.commons.math4.neuralnet.oned.NeuronString, method: getSize, match: "()", note: "NeuronString.getSize"}
  - {class: org.apache.commons.math4.transform.FastHadamardTransform, method: apply, match: "(final double[] f)", note: "FastHadamardTransform.apply"}
  - {class: org.apache.commons.math4.legacy.analysis.function.StepFunction, method: value, match: "(double x)", note: "StepFunction.value"}
  - {class: org.apache.commons.math4.neuralnet.sofm.LearningFactorFunctionFactory, method: value, match: "(long n)", note: "LearningFactorFunctionFactory.value"}
  - {class: org.apache.commons.math4.transform.FastHadamardTransform, method: apply, match: "(final int[] f)", note: "FastHadamardTransform.apply"}
  - {class: org.apache.commons.math4.legacy.analysis.interpolation.BicubicInterpolatingFunction, method: isValidPoint, match: "(double x, double y)", note: "BicubicInterpolatingFunction.isValidPoint"}
  - {class: org.apache.commons.math4.neuralnet.sofm.LearningFactorFunctionFactory, method: value, match: "(long n)", note: "LearningFactorFunctionFactory.value"}
  - {class: org.apache.commons.math4.transform.FastSineTransform, method: apply, match: "(final double[] f)", note: "FastSineTransform.apply"}
  - {class: org.apache.commons.math4.legacy.analysis.interpolation.BicubicInterpolatingFunction, method: partialDerivativeX, match: "()", note: "BicubicInterpolatingFunction.partialDerivativeX"}
  - {class: org.apache.commons.math4.neuralnet.sofm.NeighbourhoodSizeFunctionFactory, method: value, match: "(long n)", note: "NeighbourhoodSizeFunctionFactory.value"}
  - {class: org.apache.commons.math4.legacy.analysis.interpolation.TricubicInterpolatingFunction, method: isValidPoint, match: "(double x, double y, double z)", note: "TricubicInterpolatingFunction.isValidPoint"}
  - {class: org.apache.commons.math4.neuralnet.sofm.NeighbourhoodSizeFunctionFactory, method: value, match: "(long n)", note: "NeighbourhoodSizeFunctionFactory.value"}
  - {class: org.apache.commons.math4.legacy.analysis.interpolation.TricubicInterpolatingFunction, method: value, match: "(double x, double y, double z) throws OutOfRangeException", note: "TricubicInterpolatingFunction.value"}
  - {class: org.apache.commons.math4.neuralnet.sofm.util.ExponentialDecayFunction, method: applyAsDouble, match: "(long numCall)", note: "ExponentialDecayFunction.applyAsDouble"}
  - {class: org.apache.commons.math4.legacy.analysis.polynomials.PolynomialFunction, method: value, match: "(double x)", note: "PolynomialFunction.value"}
