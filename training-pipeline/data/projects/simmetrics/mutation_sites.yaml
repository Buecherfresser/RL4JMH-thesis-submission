# Curated performance-mutation sites for simmetrics (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants simmetrics --source data/external-src/<checkout> \
#       --sites data/projects/simmetrics/mutation_sites.yaml

package_root: org.simmetrics.simplifiers

sites:
  - {class: org.simmetrics.simplifiers.Caverphone1, method: simplify, match: "(String input)", note: "Caverphone1.simplify"}
  - {class: org.simmetrics.simplifiers.Caverphone2, method: simplify, match: "(String input)", note: "Caverphone2.simplify"}
  - {class: org.simmetrics.simplifiers.ColognePhonetic, method: simplify, match: "(String input)", note: "ColognePhonetic.simplify"}
  - {class: org.simmetrics.simplifiers.DaitchMokotoffSoundex, method: simplify, match: "(String input)", note: "DaitchMokotoffSoundex.simplify"}
  - {class: org.simmetrics.simplifiers.DoubleMetaphone, method: simplify, match: "(String input)", note: "DoubleMetaphone.simplify"}
  - {class: org.simmetrics.simplifiers.MatchRatingApproach, method: simplify, match: "(String input)", note: "MatchRatingApproach.simplify"}
  - {class: org.simmetrics.simplifiers.Metaphone, method: simplify, match: "(String input)", note: "Metaphone.simplify"}
  - {class: org.simmetrics.simplifiers.Nysiis, method: simplify, match: "(String input)", note: "Nysiis.simplify"}
  - {class: org.simmetrics.simplifiers.RefinedSoundex, method: simplify, match: "(String input)", note: "RefinedSoundex.simplify"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: simplify, match: "(String input)", note: "Simplifiers.simplify"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: simplify, match: "(String input)", note: "Simplifiers.simplify"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: simplify, match: "(String input)", note: "Simplifiers.simplify"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: simplify, match: "(String input)", note: "Simplifiers.simplify"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: simplify, match: "(String s)", note: "Simplifiers.simplify"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: simplify, match: "(String s)", note: "Simplifiers.simplify"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: chain, match: "(List<Simplifier> simplifiers)", note: "Simplifiers.chain"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: chain, match: "(Simplifier simplifier,", note: "Simplifiers.chain"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: normalize, match: "(Form form)", note: "Simplifiers.normalize"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: removeAll, match: "(String regex)", note: "Simplifiers.removeAll"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: removeAll, match: "(Pattern pattern)", note: "Simplifiers.removeAll"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: removeDiacritics, match: "()", note: "Simplifiers.removeDiacritics"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: removeNonWord, match: "()", note: "Simplifiers.removeNonWord"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: removeNonWord, match: "(String replacement)", note: "Simplifiers.removeNonWord"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: replaceAll, match: "(String regex, String replacement)", note: "Simplifiers.replaceAll"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: replaceAll, match: "(Pattern pattern, String replacement)", note: "Simplifiers.replaceAll"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: replaceNonWord, match: "()", note: "Simplifiers.replaceNonWord"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: replaceNonWord, match: "(String replacement)", note: "Simplifiers.replaceNonWord"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: toLowerCase, match: "()", note: "Simplifiers.toLowerCase"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: toLowerCase, match: "(Locale l)", note: "Simplifiers.toLowerCase"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: toUpperCase, match: "()", note: "Simplifiers.toUpperCase"}
  - {class: org.simmetrics.simplifiers.Simplifiers, method: toUpperCase, match: "(Locale l)", note: "Simplifiers.toUpperCase"}
  - {class: org.simmetrics.simplifiers.Soundex, method: simplify, match: "(String input)", note: "Soundex.simplify"}
