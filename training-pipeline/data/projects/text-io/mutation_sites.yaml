# Curated performance-mutation sites for text-io (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants text-io --source data/external-src/<checkout> \
#       --sites data/projects/text-io/mutation_sites.yaml

package_root: org.beryx.textio

sites:
  - {class: org.beryx.textio.StringInputReader, method: withPattern, match: "(String regex)", note: "StringInputReader.withPattern"}
  - {class: org.beryx.textio.console.ConsoleTextTerminal, method: rawPrint, match: "(String message)", note: "ConsoleTextTerminal.rawPrint"}
  - {class: org.beryx.textio.jline.JLineTextTerminal, method: getStandardColorCode, match: "(String colorName)", note: "JLineTextTerminal.getStandardColorCode"}
