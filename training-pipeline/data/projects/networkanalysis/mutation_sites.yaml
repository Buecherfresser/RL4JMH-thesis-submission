# Curated performance-mutation sites for networkanalysis (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants networkanalysis --source data/external-src/<checkout> \
#       --sites data/projects/networkanalysis/mutation_sites.yaml

package_root: nl.cwts.networkanalysis

sites:
  - {class: nl.cwts.networkanalysis.Clustering, method: load, match: "(String filename) throws ClassNotFoundException, IOException", note: "Clustering.load"}
  - {class: nl.cwts.networkanalysis.run.FileIO, method: readEdgeList, match: "(String filename, boolean weightedEdges, boolean sortedEdgeList)", note: "FileIO.readEdgeList"}
  - {class: nl.cwts.networkanalysis.Clustering, method: save, match: "(String filename) throws IOException", note: "Clustering.save"}
  - {class: nl.cwts.networkanalysis.run.FileIO, method: readClustering, match: "(String filename, int nNodes)", note: "FileIO.readClustering"}
  - {class: nl.cwts.networkanalysis.Clustering, method: getNNodes, match: "()", note: "Clustering.getNNodes"}
  - {class: nl.cwts.networkanalysis.run.FileIO, method: writeClustering, match: "(String filename, Clustering clustering)", note: "FileIO.writeClustering"}
  - {class: nl.cwts.networkanalysis.Clustering, method: getNClusters, match: "()", note: "Clustering.getNClusters"}
  - {class: nl.cwts.networkanalysis.run.FileIO, method: readLayout, match: "(String filename, int nNodes)", note: "FileIO.readLayout"}
  - {class: nl.cwts.networkanalysis.Clustering, method: getClusterIsNotEmpty, match: "()", note: "Clustering.getClusterIsNotEmpty"}
  - {class: nl.cwts.networkanalysis.run.FileIO, method: writeLayout, match: "(String filename, Layout layout)", note: "FileIO.writeLayout"}
  - {class: nl.cwts.networkanalysis.Clustering, method: getNNonEmptyClusters, match: "()", note: "Clustering.getNNonEmptyClusters"}
  - {class: nl.cwts.networkanalysis.run.RunNetworkClustering, method: main, match: "(String[] args)", note: "RunNetworkClustering.main"}
  - {class: nl.cwts.networkanalysis.Clustering, method: getClusters, match: "()", note: "Clustering.getClusters"}
  - {class: nl.cwts.networkanalysis.run.RunNetworkLayout, method: main, match: "(String[] args)", note: "RunNetworkLayout.main"}
  - {class: nl.cwts.networkanalysis.Clustering, method: getCluster, match: "(int node)", note: "Clustering.getCluster"}
  - {class: nl.cwts.networkanalysis.Clustering, method: getNNodesPerCluster, match: "()", note: "Clustering.getNNodesPerCluster"}
  - {class: nl.cwts.networkanalysis.Clustering, method: getNodesPerCluster, match: "()", note: "Clustering.getNodesPerCluster"}
  - {class: nl.cwts.networkanalysis.Clustering, method: setCluster, match: "(int node, int cluster)", note: "Clustering.setCluster"}
  - {class: nl.cwts.networkanalysis.Clustering, method: initSingletonClusters, match: "()", note: "Clustering.initSingletonClusters"}
  - {class: nl.cwts.networkanalysis.Clustering, method: removeEmptyClusters, match: "()", note: "Clustering.removeEmptyClusters"}
  - {class: nl.cwts.networkanalysis.Clustering, method: removeEmptyClustersLargerThan, match: "(int minimumCluster)", note: "Clustering.removeEmptyClustersLargerThan"}
  - {class: nl.cwts.networkanalysis.Clustering, method: getClusterWeights, match: "(Network network)", note: "Clustering.getClusterWeights"}
  - {class: nl.cwts.networkanalysis.Clustering, method: getClusterWeights, match: "(double[] nodeWeights)", note: "Clustering.getClusterWeights"}
  - {class: nl.cwts.networkanalysis.Clustering, method: orderClustersByNNodes, match: "()", note: "Clustering.orderClustersByNNodes"}
  - {class: nl.cwts.networkanalysis.Clustering, method: orderClustersByWeight, match: "(double[] nodeWeights)", note: "Clustering.orderClustersByWeight"}
  - {class: nl.cwts.networkanalysis.Clustering, method: compareTo, match: "(Cluster cluster)", note: "Clustering.compareTo"}
  - {class: nl.cwts.networkanalysis.Clustering, method: mergeClusters, match: "(Clustering clustering)", note: "Clustering.mergeClusters"}
  - {class: nl.cwts.networkanalysis.Clustering, method: calcNormalizedMutualInformation, match: "(Clustering clustering)", note: "Clustering.calcNormalizedMutualInformation"}
  - {class: nl.cwts.networkanalysis.Clustering, method: calcVariationOfInformation, match: "(Clustering clustering)", note: "Clustering.calcVariationOfInformation"}
  - {class: nl.cwts.networkanalysis.ComponentsAlgorithm, method: findClustering, match: "(Network network)", note: "ComponentsAlgorithm.findClustering"}
  - {class: nl.cwts.networkanalysis.FastLocalMovingAlgorithm, method: improveClusteringOneIteration, match: "(Network network, Clustering clustering)", note: "FastLocalMovingAlgorithm.improveClusteringOneIteration"}
  - {class: nl.cwts.networkanalysis.GradientDescentVOSLayoutAlgorithm, method: getMaxNIterations, match: "()", note: "GradientDescentVOSLayoutAlgorithm.getMaxNIterations"}
  - {class: nl.cwts.networkanalysis.GradientDescentVOSLayoutAlgorithm, method: getInitialStepSize, match: "()", note: "GradientDescentVOSLayoutAlgorithm.getInitialStepSize"}
  - {class: nl.cwts.networkanalysis.GradientDescentVOSLayoutAlgorithm, method: getMinStepSize, match: "()", note: "GradientDescentVOSLayoutAlgorithm.getMinStepSize"}
  - {class: nl.cwts.networkanalysis.GradientDescentVOSLayoutAlgorithm, method: getStepSizeReduction, match: "()", note: "GradientDescentVOSLayoutAlgorithm.getStepSizeReduction"}
  - {class: nl.cwts.networkanalysis.GradientDescentVOSLayoutAlgorithm, method: getRequiredNQualityValueImprovements, match: "()", note: "GradientDescentVOSLayoutAlgorithm.getRequiredNQualityValueImprovements"}
  - {class: nl.cwts.networkanalysis.GradientDescentVOSLayoutAlgorithm, method: setMaxNIterations, match: "(int maxNIterations)", note: "GradientDescentVOSLayoutAlgorithm.setMaxNIterations"}
  - {class: nl.cwts.networkanalysis.GradientDescentVOSLayoutAlgorithm, method: setInitialStepSize, match: "(double initialStepSize)", note: "GradientDescentVOSLayoutAlgorithm.setInitialStepSize"}
  - {class: nl.cwts.networkanalysis.GradientDescentVOSLayoutAlgorithm, method: setMinStepSize, match: "(double minStepSize)", note: "GradientDescentVOSLayoutAlgorithm.setMinStepSize"}
  - {class: nl.cwts.networkanalysis.GradientDescentVOSLayoutAlgorithm, method: setStepSizeReduction, match: "(double stepSizeReduction)", note: "GradientDescentVOSLayoutAlgorithm.setStepSizeReduction"}
  - {class: nl.cwts.networkanalysis.GradientDescentVOSLayoutAlgorithm, method: setRequiredNQualityValueImprovements, match: "(int requiredNQualityValueImprovements)", note: "GradientDescentVOSLayoutAlgorithm.setRequiredNQualityValueImprovements"}
  - {class: nl.cwts.networkanalysis.GradientDescentVOSLayoutAlgorithm, method: findLayout, match: "(Network network)", note: "GradientDescentVOSLayoutAlgorithm.findLayout"}
  - {class: nl.cwts.networkanalysis.GradientDescentVOSLayoutAlgorithm, method: improveLayout, match: "(Network network, Layout layout)", note: "GradientDescentVOSLayoutAlgorithm.improveLayout"}
  - {class: nl.cwts.networkanalysis.Layout, method: load, match: "(String fileName) throws ClassNotFoundException, IOException", note: "Layout.load"}
  - {class: nl.cwts.networkanalysis.Layout, method: save, match: "(String fileName) throws IOException", note: "Layout.save"}
  - {class: nl.cwts.networkanalysis.Layout, method: getNNodes, match: "()", note: "Layout.getNNodes"}
  - {class: nl.cwts.networkanalysis.Layout, method: getCoordinates, match: "()", note: "Layout.getCoordinates"}
  - {class: nl.cwts.networkanalysis.Layout, method: getCoordinates, match: "(int node)", note: "Layout.getCoordinates"}
  - {class: nl.cwts.networkanalysis.Layout, method: getMinCoordinates, match: "()", note: "Layout.getMinCoordinates"}
  - {class: nl.cwts.networkanalysis.Layout, method: getMaxCoordinates, match: "()", note: "Layout.getMaxCoordinates"}
