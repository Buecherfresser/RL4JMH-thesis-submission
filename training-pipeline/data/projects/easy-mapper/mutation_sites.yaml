# Curated performance-mutation sites for easy-mapper (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants easy-mapper --source data/external-src/<checkout> \
#       --sites data/projects/easy-mapper/mutation_sites.yaml

package_root: com.baidu.unbiz

sites:
  - {class: com.baidu.unbiz.easymapper.ClassMapBuilder, method: field, match: "(String sourceField, String targetField)", note: "ClassMapBuilder.field"}
  - {class: com.baidu.unbiz.easymapper.ClassMapBuilder, method: field, match: "(String sourceField, String targetField, Class<S> sourceType,", note: "ClassMapBuilder.field"}
  - {class: com.baidu.unbiz.easymapper.ClassMapBuilder, method: field, match: "(String sourceField, String targetField, Transformer<S, D> transformer)", note: "ClassMapBuilder.field"}
  - {class: com.baidu.unbiz.easymapper.CopyByRefMapper, method: clear, match: "()", note: "CopyByRefMapper.clear"}
  - {class: com.baidu.unbiz.easymapper.CopyByRefMapper, method: registerClassMap, match: "(MapperKey key, final ClassMapBuilder<A, B> builder)", note: "CopyByRefMapper.registerClassMap"}
  - {class: com.baidu.unbiz.easymapper.CopyByRefMapper, method: compute, match: "(MapperKey arg) throws Exception", note: "CopyByRefMapper.compute"}
  - {class: com.baidu.unbiz.easymapper.MapperFactory, method: getCopyByRefMapper, match: "()", note: "MapperFactory.getCopyByRefMapper"}
  - {class: com.baidu.unbiz.easymapper.codegen.MappingCodeGenerator, method: map, match: "(Object o, Object o2)", note: "MappingCodeGenerator.map"}
  - {class: com.baidu.unbiz.easymapper.codegen.MappingCodeGenerator, method: build, match: "(ClassMap<?, ?> classMap, Mapper mapper)", note: "MappingCodeGenerator.build"}
