# Curated performance-mutation sites for javacv (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants javacv --source data/external-src/<checkout> \
#       --sites data/projects/javacv/mutation_sites.yaml

package_root: org.bytedeco.javacv

sites:
  - {class: org.bytedeco.javacv.BaseChildSettings, method: addPropertyChangeListener, match: "(PropertyChangeListener listener)", note: "BaseChildSettings.addPropertyChangeListener"}
  - {class: org.bytedeco.javacv.BaseChildSettings, method: removePropertyChangeListener, match: "(PropertyChangeListener listener)", note: "BaseChildSettings.removePropertyChangeListener"}
  - {class: org.bytedeco.javacv.BaseSettings, method: addPropertyChangeListener, match: "(PropertyChangeListener listener)", note: "BaseSettings.addPropertyChangeListener"}
  - {class: org.bytedeco.javacv.BaseSettings, method: removePropertyChangeListener, match: "(PropertyChangeListener listener)", note: "BaseSettings.removePropertyChangeListener"}
  - {class: org.bytedeco.javacv.BufferRing, method: capacity, match: "()", note: "BufferRing.capacity"}
  - {class: org.bytedeco.javacv.BufferRing, method: position, match: "()", note: "BufferRing.position"}
  - {class: org.bytedeco.javacv.CameraSettings, method: getQuantity, match: "()", note: "CameraSettings.getQuantity"}
  - {class: org.bytedeco.javacv.CameraSettings, method: setQuantity, match: "(int quantity) throws PropertyVetoException", note: "CameraSettings.setQuantity"}
  - {class: org.bytedeco.javacv.Java2DFrameUtils, method: deepCopy, match: "(BufferedImage source)", note: "Java2DFrameUtils.deepCopy"}
  - {class: org.bytedeco.javacv.Java2DFrameUtils, method: toBufferedImage, match: "(IplImage src)", note: "Java2DFrameUtils.toBufferedImage"}
  - {class: org.bytedeco.javacv.ProjectorSettings, method: getQuantity, match: "()", note: "ProjectorSettings.getQuantity"}
  - {class: org.bytedeco.javacv.ProjectorSettings, method: setQuantity, match: "(int quantity)", note: "ProjectorSettings.setQuantity"}
  - {class: org.bytedeco.javacv.AndroidFrameConverter, method: convert, match: "(byte[] data, int width, int height)", note: "AndroidFrameConverter.convert"}
  - {class: org.bytedeco.javacv.Blobs, method: PrintRegionData, match: "()", note: "Blobs.PrintRegionData"}
  - {class: org.bytedeco.javacv.Blobs, method: PrintRegionData, match: "(int Label0, int Label1)", note: "Blobs.PrintRegionData"}
  - {class: org.bytedeco.javacv.CameraDevice, method: getDeviceNumber, match: "()", note: "CameraDevice.getDeviceNumber"}
  - {class: org.bytedeco.javacv.CameraDevice, method: setDeviceNumber, match: "(Integer deviceNumber) throws PropertyVetoException", note: "CameraDevice.setDeviceNumber"}
  - {class: org.bytedeco.javacv.CanvasFrame, method: getScreenDescriptions, match: "()", note: "CanvasFrame.getScreenDescriptions"}
