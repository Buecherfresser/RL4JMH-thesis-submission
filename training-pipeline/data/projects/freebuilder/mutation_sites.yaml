# Curated performance-mutation sites for freebuilder (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants freebuilder --source data/external-src/<checkout> \
#       --sites data/projects/freebuilder/mutation_sites.yaml

package_root: org.inferred.freebuilder

sites:
  - {class: org.inferred.freebuilder.processor.BuilderFactory, method: from, match: "(TypeElement builderType)", note: "BuilderFactory.from"}
  - {class: org.inferred.freebuilder.processor.BuilderMethods, method: getter, match: "(Property property)", note: "BuilderMethods.getter"}
  - {class: org.inferred.freebuilder.processor.BuilderMethods, method: setter, match: "(Property property)", note: "BuilderMethods.setter"}
  - {class: org.inferred.freebuilder.processor.GeneratedBuilder, method: getGeneratorsByProperty, match: "()", note: "GeneratedBuilder.getGeneratorsByProperty"}
  - {class: org.inferred.freebuilder.processor.GeneratedBuilder, method: addFields, match: "(FieldReceiver fields)", note: "GeneratedBuilder.addFields"}
  - {class: org.inferred.freebuilder.processor.ToStringGenerator, method: addToString, match: "(", note: "ToStringGenerator.addToString"}
  - {class: org.inferred.freebuilder.processor.excerpt.BuildableList, method: of, match: "(BuildableType element)", note: "BuildableList.of"}
  - {class: org.inferred.freebuilder.processor.excerpt.BuildableList, method: addTo, match: "(SourceBuilder code)", note: "BuildableList.addTo"}
  - {class: org.inferred.freebuilder.processor.excerpt.CheckedBiMap, method: addTo, match: "(SourceBuilder code)", note: "CheckedBiMap.addTo"}
  - {class: org.inferred.freebuilder.processor.excerpt.CheckedBiMap, method: addFields, match: "(FieldReceiver fields)", note: "CheckedBiMap.addFields"}
  - {class: org.inferred.freebuilder.processor.excerpt.CheckedList, method: addTo, match: "(SourceBuilder code)", note: "CheckedList.addTo"}
  - {class: org.inferred.freebuilder.processor.excerpt.CheckedList, method: addFields, match: "(FieldReceiver fields)", note: "CheckedList.addFields"}
  - {class: org.inferred.freebuilder.processor.excerpt.CheckedListMultimap, method: addTo, match: "(SourceBuilder code)", note: "CheckedListMultimap.addTo"}
  - {class: org.inferred.freebuilder.processor.excerpt.CheckedListMultimap, method: addFields, match: "(FieldReceiver fields)", note: "CheckedListMultimap.addFields"}
  - {class: org.inferred.freebuilder.processor.excerpt.CheckedMap, method: addTo, match: "(SourceBuilder code)", note: "CheckedMap.addTo"}
  - {class: org.inferred.freebuilder.processor.excerpt.CheckedMap, method: addFields, match: "(FieldReceiver fields)", note: "CheckedMap.addFields"}
  - {class: org.inferred.freebuilder.processor.excerpt.CheckedNavigableSet, method: addTo, match: "(SourceBuilder code)", note: "CheckedNavigableSet.addTo"}
  - {class: org.inferred.freebuilder.processor.excerpt.CheckedNavigableSet, method: addFields, match: "(FieldReceiver fields)", note: "CheckedNavigableSet.addFields"}
  - {class: org.inferred.freebuilder.processor.excerpt.CheckedSet, method: addTo, match: "(SourceBuilder code)", note: "CheckedSet.addTo"}
  - {class: org.inferred.freebuilder.processor.excerpt.CheckedSet, method: addFields, match: "(FieldReceiver fields)", note: "CheckedSet.addFields"}
  - {class: org.inferred.freebuilder.processor.excerpt.CheckedSetMultimap, method: addTo, match: "(SourceBuilder code)", note: "CheckedSetMultimap.addTo"}
  - {class: org.inferred.freebuilder.processor.excerpt.CheckedSetMultimap, method: addFields, match: "(FieldReceiver fields)", note: "CheckedSetMultimap.addFields"}
  - {class: org.inferred.freebuilder.processor.model.ModelUtils, method: findAnnotationMirror, match: "(", note: "ModelUtils.findAnnotationMirror"}
  - {class: org.inferred.freebuilder.processor.model.ModelUtils, method: findAnnotationMirror, match: "(", note: "ModelUtils.findAnnotationMirror"}
  - {class: org.inferred.freebuilder.processor.property.BiMapProperty, method: create, match: "(Config config)", note: "BiMapProperty.create"}
  - {class: org.inferred.freebuilder.processor.property.BiMapProperty, method: addValueFieldDeclaration, match: "(SourceBuilder code)", note: "BiMapProperty.addValueFieldDeclaration"}
  - {class: org.inferred.freebuilder.processor.property.BuildableListProperty, method: create, match: "(Config config)", note: "BuildableListProperty.create"}
  - {class: org.inferred.freebuilder.processor.property.BuildableListProperty, method: addValueFieldDeclaration, match: "(SourceBuilder code)", note: "BuildableListProperty.addValueFieldDeclaration"}
