  - {class: com.sanctionco.jmail.normalization.NormalizationOptions, method: getSubAddressSeparator, match: "()", note: "NormalizationOptions.getSubAddressSeparator"}
  - {class: com.sanctionco.jmail.EmailValidator, method: withRule, match: "(Predicate<Email> rule)", note: "EmailValidator.withRule"}
  - {class: com.sanctionco.jmail.normalization.NormalizationOptions, method: shouldPerformUnicodeNormalization, match: "()", note: "NormalizationOptions.shouldPerformUnicodeNormalization"}
  - {class: com.sanctionco.jmail.EmailValidator, method: withRule, match: "(Predicate<Email> rule, FailureReason failureReason)", note: "EmailValidator.withRule"}
  - {class: com.sanctionco.jmail.EmailValidator, method: withRule, match: "(Predicate<Email> rule, String failureReason)", note: "EmailValidator.withRule"}
  - {class: com.sanctionco.jmail.EmailValidator, method: allowNonstandardDots, match: "()", note: "EmailValidator.allowNonstandardDots"}
  - {class: com.sanctionco.jmail.JMail, method: validator, match: "()", note: "JMail.validator"}
  - {class: com.sanctionco.jmail.JMail, method: strictValidator, match: "()", note: "JMail.strictValidator"}
  - {class: com.sanctionco.jmail.JMail, method: isValid, match: "(String email)", note: "JMail.isValid"}
  - {class: com.sanctionco.jmail.JMail, method: isInvalid, match: "(String email)", note: "JMail.isInvalid"}
  - {class: com.sanctionco.jmail.JMail, method: enforceValid, match: "(String email) throws InvalidEmailException", note: "JMail.enforceValid"}
  - {class: com.sanctionco.jmail.JMail, method: tryParse, match: "(String email)", note: "JMail.tryParse"}
  - {class: com.sanctionco.jmail.TopLevelDomain, method: fromString, match: "(String tld)", note: "TopLevelDomain.fromString"}
  - {class: com.sanctionco.jmail.ValidationRules, method: disallowIpDomain, match: "(Email email)", note: "ValidationRules.disallowIpDomain"}
