# Curated performance-mutation sites for bplustree (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants bplustree --source data/external-src/<checkout> \
#       --sites data/projects/bplustree/mutation_sites.yaml

package_root: com.github.davidmoten

sites:
  - {class: com.github.davidmoten.bplustree.internal.LargeMappedByteBuffer, method: position, match: "(long newPosition)", note: "LargeMappedByteBuffer.position"}
  - {class: com.github.davidmoten.bplustree.internal.LargeMappedByteBuffer, method: putInt, match: "(int value)", note: "LargeMappedByteBuffer.putInt"}
  - {class: com.github.davidmoten.bplustree.internal.LargeMappedByteBuffer, method: putLong, match: "(long value)", note: "LargeMappedByteBuffer.putLong"}
  - {class: com.github.davidmoten.bplustree.internal.LargeMappedByteBuffer, method: position, match: "()", note: "LargeMappedByteBuffer.position"}
  - {class: com.github.davidmoten.bplustree.internal.LargeMappedByteBuffer, method: getShort, match: "()", note: "LargeMappedByteBuffer.getShort"}
  - {class: com.github.davidmoten.bplustree.internal.LargeMappedByteBuffer, method: putShort, match: "(short value)", note: "LargeMappedByteBuffer.putShort"}
  - {class: com.github.davidmoten.bplustree.internal.util.LazyList, method: size, match: "()", note: "LazyList.size"}
  - {class: com.github.davidmoten.bplustree.BPlusTree, method: memory, match: "()", note: "BPlusTree.memory"}
