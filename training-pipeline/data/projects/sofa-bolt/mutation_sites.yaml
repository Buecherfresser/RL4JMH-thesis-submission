# Curated performance-mutation sites for sofa-bolt (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants sofa-bolt --source data/external-src/<checkout> \
#       --sites data/projects/sofa-bolt/mutation_sites.yaml

package_root: com.alipay.remoting

sites:
  - {class: com.alipay.remoting.ConnectionEventListener, method: onEvent, match: "(ConnectionEventType type, String remoteAddress, Connection connection)", note: "ConnectionEventListener.onEvent"}
  - {class: com.alipay.remoting.codec.ProtocolCodeBasedDecoder, method: decodeProtocolCode, match: "(ByteBuf in)", note: "ProtocolCodeBasedDecoder.decodeProtocolCode"}
  - {class: com.alipay.remoting.config.BoltOption, method: name, match: "()", note: "BoltOption.name"}
  - {class: com.alipay.remoting.exception.DeserializationException, method: isServerSide, match: "()", note: "DeserializationException.isServerSide"}
  - {class: com.alipay.remoting.log.BoltLoggerFactory, method: getLogger, match: "(Class<?> clazz)", note: "BoltLoggerFactory.getLogger"}
  - {class: com.alipay.remoting.rpc.RpcAddressParser, method: parse, match: "(String url)", note: "RpcAddressParser.parse"}
  - {class: com.alipay.remoting.serialization.HessianSerializer, method: initialValue, match: "()", note: "HessianSerializer.initialValue"}
  - {class: com.alipay.remoting.util.ConcurrentHashSet, method: size, match: "()", note: "ConcurrentHashSet.size"}
  - {class: com.alipay.remoting.ConnectionEventListener, method: addConnectionEventProcessor, match: "(ConnectionEventType type,", note: "ConnectionEventListener.addConnectionEventProcessor"}
  - {class: com.alipay.remoting.codec.ProtocolCodeBasedDecoder, method: decodeProtocolVersion, match: "(ByteBuf in)", note: "ProtocolCodeBasedDecoder.decodeProtocolVersion"}
  - {class: com.alipay.remoting.config.BoltOption, method: defaultValue, match: "()", note: "BoltOption.defaultValue"}
  - {class: com.alipay.remoting.exception.SerializationException, method: isServerSide, match: "()", note: "SerializationException.isServerSide"}
  - {class: com.alipay.remoting.log.BoltLoggerFactory, method: getLogger, match: "(String name)", note: "BoltLoggerFactory.getLogger"}
  - {class: com.alipay.remoting.rpc.RpcAddressParser, method: parseUniqueKey, match: "(String url)", note: "RpcAddressParser.parseUniqueKey"}
  - {class: com.alipay.remoting.serialization.HessianSerializer, method: serialize, match: "(Object obj) throws CodecException", note: "HessianSerializer.serialize"}
  - {class: com.alipay.remoting.util.ConcurrentHashSet, method: iterator, match: "()", note: "ConcurrentHashSet.iterator"}
  - {class: com.alipay.remoting.CommonCommandCode, method: value, match: "()", note: "CommonCommandCode.value"}
  - {class: com.alipay.remoting.config.BoltOptions, method: option, match: "(BoltOption<T> option)", note: "BoltOptions.option"}
  - {class: com.alipay.remoting.rpc.RpcInvokeCallbackListener, method: onResponse, match: "(InvokeFuture future)", note: "RpcInvokeCallbackListener.onResponse"}
  - {class: com.alipay.remoting.serialization.SerializerManager, method: getSerializer, match: "(int idx)", note: "SerializerManager.getSerializer"}
  - {class: com.alipay.remoting.util.ConnectionUtil, method: getConnectionFromChannel, match: "(Channel channel)", note: "ConnectionUtil.getConnectionFromChannel"}
  - {class: com.alipay.remoting.CommonCommandCode, method: valueOf, match: "(short value)", note: "CommonCommandCode.valueOf"}
  - {class: com.alipay.remoting.config.BoltOptions, method: option, match: "(BoltOption<T> option, T value)", note: "BoltOptions.option"}
  - {class: com.alipay.remoting.rpc.RpcInvokeCallbackListener, method: run, match: "()", note: "RpcInvokeCallbackListener.run"}
  - {class: com.alipay.remoting.serialization.SerializerManager, method: addSerializer, match: "(int idx, Serializer serializer)", note: "SerializerManager.addSerializer"}
  - {class: com.alipay.remoting.util.ConnectionUtil, method: addIdPoolKeyMapping, match: "(Integer id, String group, Channel channel)", note: "ConnectionUtil.addIdPoolKeyMapping"}
  - {class: com.alipay.remoting.Connection, method: isFine, match: "()", note: "Connection.isFine"}
  - {class: com.alipay.remoting.config.ConfigManager, method: tcp_nodelay, match: "()", note: "ConfigManager.tcp_nodelay"}
  - {class: com.alipay.remoting.rpc.protocol.RpcProtocolDecoder, method: decodeProtocolVersion, match: "(ByteBuf in)", note: "RpcProtocolDecoder.decodeProtocolVersion"}
  - {class: com.alipay.remoting.util.CrcUtil, method: initialValue, match: "()", note: "CrcUtil.initialValue"}
  - {class: com.alipay.remoting.Connection, method: increaseRef, match: "()", note: "Connection.increaseRef"}
  - {class: com.alipay.remoting.config.ConfigManager, method: tcp_so_reuseaddr, match: "()", note: "ConfigManager.tcp_so_reuseaddr"}
  - {class: com.alipay.remoting.rpc.DefaultInvokeFuture, method: waitResponse, match: "(long timeoutMillis) throws InterruptedException", note: "DefaultInvokeFuture.waitResponse"}
  - {class: com.alipay.remoting.util.CrcUtil, method: crc32, match: "(byte[] array)", note: "CrcUtil.crc32"}
  - {class: com.alipay.remoting.ConnectionEventHandler, method: connect, match: "(ChannelHandlerContext ctx, SocketAddress remoteAddress,", note: "ConnectionEventHandler.connect"}
