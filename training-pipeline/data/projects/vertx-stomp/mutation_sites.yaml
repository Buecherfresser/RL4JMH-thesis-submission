  - {class: io.vertx.ext.stomp.StompServerOptions, method: toJson, match: "()", note: "StompServerOptions.toJson"}
  - {class: io.vertx.ext.stomp.StompServerOptions, method: getMaxBodyLength, match: "()", note: "StompServerOptions.getMaxBodyLength"}
  - {class: io.vertx.ext.stomp.StompServerOptions, method: setMaxBodyLength, match: "(int maxBodyLength)", note: "StompServerOptions.setMaxBodyLength"}
  - {class: io.vertx.ext.stomp.impl.AcknowledgementImpl, method: subscription, match: "()", note: "AcknowledgementImpl.subscription"}
