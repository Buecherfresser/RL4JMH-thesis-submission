# Curated performance-mutation sites for tomlj (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants tomlj --source data/external-src/<checkout> \
#       --sites data/projects/tomlj/mutation_sites.yaml

package_root: org.tomlj

sites:
  - {class: org.tomlj.AccumulatingErrorListener, method: syntaxError, match: "(", note: "AccumulatingErrorListener.syntaxError"}
  - {class: org.tomlj.AccumulatingErrorListener, method: reportError, match: "(TomlParseError error)", note: "AccumulatingErrorListener.reportError"}
  - {class: org.tomlj.ArrayVisitor, method: visitArrayValue, match: "(TomlParser.ArrayValueContext ctx)", note: "ArrayVisitor.visitArrayValue"}
  - {class: org.tomlj.ArrayVisitor, method: aggregateResult, match: "(MutableTomlArray aggregate, MutableTomlArray nextResult)", note: "ArrayVisitor.aggregateResult"}
  - {class: org.tomlj.ArrayVisitor, method: defaultResult, match: "()", note: "ArrayVisitor.defaultResult"}
  - {class: org.tomlj.EmptyTomlArray, method: size, match: "()", note: "EmptyTomlArray.size"}
  - {class: org.tomlj.EmptyTomlArray, method: isEmpty, match: "()", note: "EmptyTomlArray.isEmpty"}
  - {class: org.tomlj.EmptyTomlArray, method: containsStrings, match: "()", note: "EmptyTomlArray.containsStrings"}
  - {class: org.tomlj.MutableHomogeneousTomlArray, method: containsStrings, match: "()", note: "MutableHomogeneousTomlArray.containsStrings"}
  - {class: org.tomlj.MutableHomogeneousTomlArray, method: containsLongs, match: "()", note: "MutableHomogeneousTomlArray.containsLongs"}
  - {class: org.tomlj.MutableHomogeneousTomlArray, method: containsDoubles, match: "()", note: "MutableHomogeneousTomlArray.containsDoubles"}
  - {class: org.tomlj.MutableTomlArray, method: containsStrings, match: "()", note: "MutableTomlArray.containsStrings"}
  - {class: org.tomlj.MutableTomlArray, method: containsLongs, match: "()", note: "MutableTomlArray.containsLongs"}
  - {class: org.tomlj.MutableTomlArray, method: containsDoubles, match: "()", note: "MutableTomlArray.containsDoubles"}
  - {class: org.tomlj.Parser, method: size, match: "()", note: "Parser.size"}
  - {class: org.tomlj.Parser, method: isEmpty, match: "()", note: "Parser.isEmpty"}
  - {class: org.tomlj.Parser, method: keySet, match: "()", note: "Parser.keySet"}
  - {class: org.tomlj.QuotedStringVisitor, method: visitLiteralBody, match: "(TomlParser.LiteralBodyContext ctx)", note: "QuotedStringVisitor.visitLiteralBody"}
  - {class: org.tomlj.QuotedStringVisitor, method: visitMlLiteralBody, match: "(TomlParser.MlLiteralBodyContext ctx)", note: "QuotedStringVisitor.visitMlLiteralBody"}
  - {class: org.tomlj.QuotedStringVisitor, method: visitBasicUnescaped, match: "(TomlParser.BasicUnescapedContext ctx)", note: "QuotedStringVisitor.visitBasicUnescaped"}
  - {class: org.tomlj.EmptyTomlTable, method: size, match: "()", note: "EmptyTomlTable.size"}
  - {class: org.tomlj.EmptyTomlTable, method: isEmpty, match: "()", note: "EmptyTomlTable.isEmpty"}
  - {class: org.tomlj.EmptyTomlTable, method: keySet, match: "()", note: "EmptyTomlTable.keySet"}
  - {class: org.tomlj.InlineTableVisitor, method: visitKeyval, match: "(TomlParser.KeyvalContext ctx)", note: "InlineTableVisitor.visitKeyval"}
  - {class: org.tomlj.InlineTableVisitor, method: aggregateResult, match: "(MutableTomlTable aggregate, MutableTomlTable nextResult)", note: "InlineTableVisitor.aggregateResult"}
  - {class: org.tomlj.InlineTableVisitor, method: defaultResult, match: "()", note: "InlineTableVisitor.defaultResult"}
  - {class: org.tomlj.KeyVisitor, method: visitUnquotedKey, match: "(TomlParser.UnquotedKeyContext ctx)", note: "KeyVisitor.visitUnquotedKey"}
  - {class: org.tomlj.KeyVisitor, method: visitQuotedKey, match: "(TomlParser.QuotedKeyContext ctx)", note: "KeyVisitor.visitQuotedKey"}
  - {class: org.tomlj.KeyVisitor, method: aggregateResult, match: "(List<String> aggregate, List<String> nextResult)", note: "KeyVisitor.aggregateResult"}
  - {class: org.tomlj.LineVisitor, method: visitKeyval, match: "(TomlParser.KeyvalContext ctx)", note: "LineVisitor.visitKeyval"}
  - {class: org.tomlj.LineVisitor, method: visitStandardTable, match: "(TomlParser.StandardTableContext ctx)", note: "LineVisitor.visitStandardTable"}
  - {class: org.tomlj.LineVisitor, method: visitArrayTable, match: "(TomlParser.ArrayTableContext ctx)", note: "LineVisitor.visitArrayTable"}
  - {class: org.tomlj.LocalDateVisitor, method: visitYear, match: "(TomlParser.YearContext ctx)", note: "LocalDateVisitor.visitYear"}
  - {class: org.tomlj.LocalDateVisitor, method: visitMonth, match: "(TomlParser.MonthContext ctx)", note: "LocalDateVisitor.visitMonth"}
  - {class: org.tomlj.LocalDateVisitor, method: visitDay, match: "(TomlParser.DayContext ctx)", note: "LocalDateVisitor.visitDay"}
  - {class: org.tomlj.LocalTimeVisitor, method: visitHour, match: "(TomlParser.HourContext ctx)", note: "LocalTimeVisitor.visitHour"}
  - {class: org.tomlj.LocalTimeVisitor, method: visitMinute, match: "(TomlParser.MinuteContext ctx)", note: "LocalTimeVisitor.visitMinute"}
  - {class: org.tomlj.LocalTimeVisitor, method: visitSecond, match: "(TomlParser.SecondContext ctx)", note: "LocalTimeVisitor.visitSecond"}
  - {class: org.tomlj.MutableTomlTable, method: size, match: "()", note: "MutableTomlTable.size"}
  - {class: org.tomlj.MutableTomlTable, method: isEmpty, match: "()", note: "MutableTomlTable.isEmpty"}
  - {class: org.tomlj.MutableTomlTable, method: keySet, match: "()", note: "MutableTomlTable.keySet"}
  - {class: org.tomlj.TokenName, method: displayName, match: "()", note: "TokenName.displayName"}
  - {class: org.tomlj.Toml, method: parse, match: "(String input)", note: "Toml.parse"}
  - {class: org.tomlj.Toml, method: parse, match: "(String input, TomlVersion version)", note: "Toml.parse"}
  - {class: org.tomlj.Toml, method: parse, match: "(Path file) throws IOException", note: "Toml.parse"}
  - {class: org.tomlj.TomlCommand, method: main, match: "(String[] args)", note: "TomlCommand.main"}
  - {class: org.tomlj.TomlParseError, method: position, match: "()", note: "TomlParseError.position"}
  - {class: org.tomlj.TomlPosition, method: positionAt, match: "(int line, int column)", note: "TomlPosition.positionAt"}
  - {class: org.tomlj.TomlPosition, method: line, match: "()", note: "TomlPosition.line"}
  - {class: org.tomlj.TomlPosition, method: column, match: "()", note: "TomlPosition.column"}
