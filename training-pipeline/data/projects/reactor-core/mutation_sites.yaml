  - {class: reactor.core.observability.micrometer.TimedSchedulerMeterDocumentation, method: getKeyNames, match: "()", note: "TimedSchedulerMeterDocumentation.getKeyNames"}
  - {class: reactor.core.publisher.FluxConcatArray, method: subscribe, match: "(CoreSubscriber<? super T> actual)", note: "FluxConcatArray.subscribe"}
