# Curated performance-mutation sites for threeten-extra (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants threeten-extra --source data/external-src/<checkout> \
#       --sites data/projects/threeten-extra/mutation_sites.yaml

package_root: org.threeten.extra

sites:
