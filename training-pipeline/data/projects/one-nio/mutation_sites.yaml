# Curated performance-mutation sites for one-nio (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants one-nio --source data/external-src/<checkout> \
#       --sites data/projects/one-nio/mutation_sites.yaml

package_root: one.nio.serial

sites:
  - {class: one.nio.serial.ArrayListSerializer, method: calcSize, match: "(ArrayList obj, CalcSizeStream css) throws IOException", note: "ArrayListSerializer.calcSize"}
  - {class: one.nio.serial.gen.GetFieldInputStream, method: readFields, match: "()", note: "GetFieldInputStream.readFields"}
  - {class: one.nio.serial.ArrayListSerializer, method: toJson, match: "(ArrayList obj, StringBuilder builder) throws IOException", note: "ArrayListSerializer.toJson"}
  - {class: one.nio.serial.gen.GetFieldInputStream, method: getObjectStreamClass, match: "()", note: "GetFieldInputStream.getObjectStreamClass"}
  - {class: one.nio.serial.AsmUtils, method: printify, match: "(byte[] classData, Logger log)", note: "AsmUtils.printify"}
  - {class: one.nio.serial.gen.NullObjectInputStream, method: defaultReadObject, match: "()", note: "NullObjectInputStream.defaultReadObject"}
  - {class: one.nio.serial.AsmUtils, method: verifyBytecode, match: "(byte[] classData)", note: "AsmUtils.verifyBytecode"}
  - {class: one.nio.serial.gen.NullObjectInputStream, method: readUnshared, match: "() throws IOException", note: "NullObjectInputStream.readUnshared"}
  - {class: one.nio.serial.BitSetSerializer, method: calcSize, match: "(BitSet obj, CalcSizeStream css)", note: "BitSetSerializer.calcSize"}
  - {class: one.nio.serial.gen.NullObjectOutputStream, method: defaultWriteObject, match: "()", note: "NullObjectOutputStream.defaultWriteObject"}
  - {class: one.nio.serial.BitSetSerializer, method: toJson, match: "(BitSet obj, StringBuilder builder)", note: "BitSetSerializer.toJson"}
  - {class: one.nio.serial.gen.NullObjectOutputStream, method: writeUnshared, match: "(Object obj) throws IOException", note: "NullObjectOutputStream.writeUnshared"}
  - {class: one.nio.serial.BooleanArraySerializer, method: calcSize, match: "(boolean[] obj, CalcSizeStream css)", note: "BooleanArraySerializer.calcSize"}
  - {class: one.nio.serial.gen.DelegateGenerator, method: instantiate, match: "(Class cls, FieldDescriptor[] fds, byte[] code)", note: "DelegateGenerator.instantiate"}
  - {class: one.nio.serial.BooleanArraySerializer, method: toJson, match: "(boolean[] obj, StringBuilder builder)", note: "BooleanArraySerializer.toJson"}
  - {class: one.nio.serial.gen.DelegateGenerator, method: instantiate, match: "(Class cls, FieldDescriptor[] fds, FieldDescriptor[] defaultFields)", note: "DelegateGenerator.instantiate"}
  - {class: one.nio.serial.ByteArraySerializer, method: calcSize, match: "(byte[] obj, CalcSizeStream css)", note: "ByteArraySerializer.calcSize"}
  - {class: one.nio.serial.gen.FieldType, method: readMethod, match: "()", note: "FieldType.readMethod"}
  - {class: one.nio.serial.ByteArraySerializer, method: toJson, match: "(byte[] obj, StringBuilder builder)", note: "ByteArraySerializer.toJson"}
  - {class: one.nio.serial.gen.FieldType, method: readSignature, match: "()", note: "FieldType.readSignature"}
  - {class: one.nio.serial.CalcSizeStream, method: hasCycles, match: "()", note: "CalcSizeStream.hasCycles"}
  - {class: one.nio.serial.gen.HandlesStrategy, method: getBaseClassName, match: "()", note: "HandlesStrategy.getBaseClassName"}
  - {class: one.nio.serial.CalcSizeStream, method: writeBoolean, match: "(boolean v)", note: "CalcSizeStream.writeBoolean"}
  - {class: one.nio.serial.gen.HandlesStrategy, method: generateStatics, match: "(ClassWriter cv, Class cls, String className, FieldDescriptor[] fds, FieldDescriptor[] defaultFields)", note: "HandlesStrategy.generateStatics"}
  - {class: one.nio.serial.CharacterArraySerializer, method: calcSize, match: "(char[] obj, CalcSizeStream css)", note: "CharacterArraySerializer.calcSize"}
  - {class: one.nio.serial.gen.MagicAccessor, method: magicAccessorBridge, match: "()", note: "MagicAccessor.magicAccessorBridge"}
  - {class: one.nio.serial.CharacterArraySerializer, method: toJson, match: "(char[] obj, StringBuilder builder)", note: "CharacterArraySerializer.toJson"}
  - {class: one.nio.serial.gen.MagicAccessor, method: sunMagicAccessor, match: "()", note: "MagicAccessor.sunMagicAccessor"}
  - {class: one.nio.serial.DataStream, method: array, match: "()", note: "DataStream.array"}
  - {class: one.nio.serial.gen.MagicAccessorStrategy, method: getBaseClassName, match: "()", note: "MagicAccessorStrategy.getBaseClassName"}
  - {class: one.nio.serial.DataStream, method: address, match: "()", note: "DataStream.address"}
  - {class: one.nio.serial.gen.MagicAccessorStrategy, method: generateStatics, match: "(ClassWriter cv, Class cls, String className, FieldDescriptor[] fds, FieldDescriptor[] defaultFields)", note: "MagicAccessorStrategy.generateStatics"}
  - {class: one.nio.serial.DeserializeInputStream, method: readObject, match: "() throws IOException, ClassNotFoundException", note: "DeserializeInputStream.readObject"}
  - {class: one.nio.serial.gen.StubGenerator, method: generateRegular, match: "(String className, String superName, FieldDescriptor[] fds)", note: "StubGenerator.generateRegular"}
  - {class: one.nio.serial.DeserializeInputStream, method: close, match: "() throws IOException", note: "DeserializeInputStream.close"}
  - {class: one.nio.serial.gen.StubGenerator, method: generateEnum, match: "(String className, String[] constants)", note: "StubGenerator.generateEnum"}
  - {class: one.nio.serial.DeserializeStream, method: readObject, match: "() throws IOException, ClassNotFoundException", note: "DeserializeStream.readObject"}
  - {class: one.nio.serial.DeserializeStream, method: close, match: "()", note: "DeserializeStream.close"}
  - {class: one.nio.serial.DoubleArraySerializer, method: calcSize, match: "(double[] obj, CalcSizeStream css)", note: "DoubleArraySerializer.calcSize"}
  - {class: one.nio.serial.DoubleArraySerializer, method: toJson, match: "(double[] obj, StringBuilder builder)", note: "DoubleArraySerializer.toJson"}
  - {class: one.nio.serial.FloatArraySerializer, method: calcSize, match: "(float[] obj, CalcSizeStream css)", note: "FloatArraySerializer.calcSize"}
  - {class: one.nio.serial.FloatArraySerializer, method: toJson, match: "(float[] obj, StringBuilder builder)", note: "FloatArraySerializer.toJson"}
  - {class: one.nio.serial.IntegerArraySerializer, method: calcSize, match: "(int[] obj, CalcSizeStream css)", note: "IntegerArraySerializer.calcSize"}
  - {class: one.nio.serial.IntegerArraySerializer, method: toJson, match: "(int[] obj, StringBuilder builder)", note: "IntegerArraySerializer.toJson"}
  - {class: one.nio.serial.LongArraySerializer, method: calcSize, match: "(long[] obj, CalcSizeStream css)", note: "LongArraySerializer.calcSize"}
  - {class: one.nio.serial.LongArraySerializer, method: toJson, match: "(long[] obj, StringBuilder builder)", note: "LongArraySerializer.toJson"}
  - {class: one.nio.serial.MapSerializer, method: readExternal, match: "(ObjectInput in) throws IOException, ClassNotFoundException", note: "MapSerializer.readExternal"}
  - {class: one.nio.serial.MapSerializer, method: calcSize, match: "(Map obj, CalcSizeStream css) throws IOException", note: "MapSerializer.calcSize"}
  - {class: one.nio.serial.ObjectArraySerializer, method: readExternal, match: "(ObjectInput in) throws IOException, ClassNotFoundException", note: "ObjectArraySerializer.readExternal"}
  - {class: one.nio.serial.ObjectArraySerializer, method: calcSize, match: "(Object[] obj, CalcSizeStream css) throws IOException", note: "ObjectArraySerializer.calcSize"}
