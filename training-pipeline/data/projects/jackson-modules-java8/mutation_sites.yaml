  - {class: com.fasterxml.jackson.datatype.jsr310.JSR310Module, method: findValueInstantiator, match: "(DeserializationConfig config,", note: "JSR310Module.findValueInstantiator"}
  - {class: com.fasterxml.jackson.datatype.jsr310.JavaTimeFeature, method: enabledByDefault, match: "()", note: "JavaTimeFeature.enabledByDefault"}
  - {class: com.fasterxml.jackson.datatype.jsr310.JavaTimeFeature, method: enabledIn, match: "(int flags)", note: "JavaTimeFeature.enabledIn"}
  - {class: com.fasterxml.jackson.datatype.jsr310.JavaTimeModule, method: enable, match: "(JavaTimeFeature f)", note: "JavaTimeModule.enable"}
  - {class: com.fasterxml.jackson.datatype.jsr310.JavaTimeModule, method: disable, match: "(JavaTimeFeature f)", note: "JavaTimeModule.disable"}
  - {class: com.fasterxml.jackson.datatype.jsr310.deser.DurationDeserializer, method: withLeniency, match: "(Boolean leniency)", note: "DurationDeserializer.withLeniency"}
  - {class: com.fasterxml.jackson.datatype.jsr310.deser.DurationDeserializer, method: withConverter, match: "(DurationUnitConverter converter)", note: "DurationDeserializer.withConverter"}
