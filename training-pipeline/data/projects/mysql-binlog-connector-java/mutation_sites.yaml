# Curated performance-mutation sites for mysql-binlog-connector-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants mysql-binlog-connector-java --source data/external-src/<checkout> \
#       --sites data/projects/mysql-binlog-connector-java/mutation_sites.yaml

package_root: com.github.shyiko

sites:
