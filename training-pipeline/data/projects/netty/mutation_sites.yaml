# Curated performance-mutation sites for netty (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants netty --source data/external-src/<checkout> \
#       --sites data/projects/netty/mutation_sites.yaml

package_root: io.netty

sites:
  - {class: io.netty.bootstrap.Bootstrap, method: resolver, match: "(AddressResolverGroup<?> resolver)", note: "Bootstrap.resolver"}
  - {class: io.netty.buffer.AllocateBufferEvent, method: isEventEnabled, match: "()", note: "AllocateBufferEvent.isEventEnabled"}
  - {class: io.netty.channel.ChannelOutboundBuffer, method: initialValue, match: "() throws Exception", note: "ChannelOutboundBuffer.initialValue"}
  - {class: io.netty.handler.codec.CodecOutputList, method: recycle, match: "(CodecOutputList object)", note: "CodecOutputList.recycle"}
  - {class: io.netty.pkitesting.CertificateBuilder, method: provider, match: "(Provider provider)", note: "CertificateBuilder.provider"}
  - {class: io.netty.resolver.HostsFileParser, method: parseSilently, match: "()", note: "HostsFileParser.parseSilently"}
  - {class: io.netty.testsuite.http2.HelloWorldHttp2HandlerBuilder, method: build, match: "()", note: "HelloWorldHttp2HandlerBuilder.build"}
  - {class: io.netty.testsuite_jpms.main.Http3HelloWorldServerHandler, method: channelRead, match: "(ChannelHandlerContext ctx, Http3HeadersFrame frame)", note: "Http3HelloWorldServerHandler.channelRead"}
  - {class: io.netty.util.AsciiString, method: forEachByte, match: "(ByteProcessor visitor) throws Exception", note: "AsciiString.forEachByte"}
  - {class: io.netty.bootstrap.Bootstrap, method: disableResolver, match: "()", note: "Bootstrap.disableResolver"}
  - {class: io.netty.buffer.ByteBufInputStream, method: readBytes, match: "()", note: "ByteBufInputStream.readBytes"}
  - {class: io.netty.channel.ChannelOutboundBuffer, method: addMessage, match: "(Object msg, int size, ChannelPromise promise)", note: "ChannelOutboundBuffer.addMessage"}
  - {class: io.netty.handler.codec.CodecOutputList, method: initialValue, match: "() throws Exception", note: "CodecOutputList.initialValue"}
  - {class: io.netty.pkitesting.CertificateBuilder, method: secureRandom, match: "(SecureRandom secureRandom)", note: "CertificateBuilder.secureRandom"}
  - {class: io.netty.resolver.HostsFileParser, method: parseSilently, match: "(Charset... charsets)", note: "HostsFileParser.parseSilently"}
  - {class: io.netty.testsuite.transport.socket.CompositeBufferGatheringWriteTest, method: testSingleCompositeBufferWrite, match: "(TestInfo testInfo) throws Throwable", note: "CompositeBufferGatheringWriteTest.testSingleCompositeBufferWrite"}
  - {class: io.netty.testsuite_jpms.main.Http3HelloWorldServerHandler, method: channelRead, match: "(ChannelHandlerContext ctx, Http3DataFrame frame)", note: "Http3HelloWorldServerHandler.channelRead"}
  - {class: io.netty.util.AsciiString, method: forEachByte, match: "(int index, int length, ByteProcessor visitor) throws Exception", note: "AsciiString.forEachByte"}
  - {class: io.netty.bootstrap.BootstrapConfig, method: remoteAddress, match: "()", note: "BootstrapConfig.remoteAddress"}
  - {class: io.netty.buffer.ByteBufInputStream, method: close, match: "() throws IOException", note: "ByteBufInputStream.close"}
  - {class: io.netty.channel.CoalescingBufferQueue, method: releaseAndFailAll, match: "(Throwable cause)", note: "CoalescingBufferQueue.releaseAndFailAll"}
  - {class: io.netty.handler.codec.DatagramPacketDecoder, method: acceptInboundMessage, match: "(Object msg) throws Exception", note: "DatagramPacketDecoder.acceptInboundMessage"}
  - {class: io.netty.pkitesting.RevocationServer, method: getInstance, match: "() throws Exception", note: "RevocationServer.getInstance"}
  - {class: io.netty.resolver.dns.DefaultDnsServerAddressStreamProvider, method: nameServerAddressStream, match: "(String hostname)", note: "DefaultDnsServerAddressStreamProvider.nameServerAddressStream"}
  - {class: io.netty.testsuite.transport.socket.CompositeBufferGatheringWriteTest, method: run, match: "(ServerBootstrap serverBootstrap, Bootstrap bootstrap) throws Throwable", note: "CompositeBufferGatheringWriteTest.run"}
  - {class: io.netty.testsuite_jpms.main.Http3HelloWorldServerInitializer, method: initChannel, match: "(QuicChannel ch)", note: "Http3HelloWorldServerInitializer.initChannel"}
  - {class: io.netty.util.CharsetUtil, method: values, match: "()", note: "CharsetUtil.values"}
  - {class: io.netty.bootstrap.BootstrapConfig, method: resolver, match: "()", note: "BootstrapConfig.resolver"}
  - {class: io.netty.buffer.ByteBufOutputStream, method: writtenBytes, match: "()", note: "ByteBufOutputStream.writtenBytes"}
  - {class: io.netty.channel.CoalescingBufferQueue, method: compose, match: "(ByteBufAllocator alloc, ByteBuf cumulation, ByteBuf next)", note: "CoalescingBufferQueue.compose"}
  - {class: io.netty.handler.codec.DatagramPacketDecoder, method: channelRegistered, match: "(ChannelHandlerContext ctx) throws Exception", note: "DatagramPacketDecoder.channelRegistered"}
  - {class: io.netty.pkitesting.RevocationServer, method: register, match: "(X509Bundle issuer)", note: "RevocationServer.register"}
  - {class: io.netty.resolver.dns.DefaultDnsServerAddressStreamProvider, method: defaultAddressList, match: "()", note: "DefaultDnsServerAddressStreamProvider.defaultAddressList"}
  - {class: io.netty.testsuite.transport.socket.DatagramUnicastIPv6MappedTest, method: newSocketAddress, match: "()", note: "DatagramUnicastIPv6MappedTest.newSocketAddress"}
  - {class: io.netty.testsuite_jpms.main.Http3HelloWorldServerInitializer, method: initChannel, match: "(QuicStreamChannel ch)", note: "Http3HelloWorldServerInitializer.initChannel"}
  - {class: io.netty.util.CharsetUtil, method: getEncoder, match: "(Charset charset)", note: "CharsetUtil.getEncoder"}
  - {class: io.netty.bootstrap.FailedChannel, method: newUnsafe, match: "()", note: "FailedChannel.newUnsafe"}
  - {class: io.netty.buffer.ByteBufOutputStream, method: writeBoolean, match: "(boolean v) throws IOException", note: "ByteBufOutputStream.writeBoolean"}
  - {class: io.netty.channel.WriteBufferWaterMark, method: low, match: "()", note: "WriteBufferWaterMark.low"}
  - {class: io.netty.handler.codec.DatagramPacketEncoder, method: acceptOutboundMessage, match: "(Object msg) throws Exception", note: "DatagramPacketEncoder.acceptOutboundMessage"}
  - {class: io.netty.pkitesting.X509Bundle, method: fromRootCertificateAuthority, match: "(X509Certificate root, KeyPair keyPair)", note: "X509Bundle.fromRootCertificateAuthority"}
  - {class: io.netty.resolver.dns.DnsNameResolverBuilder, method: eventLoop, match: "(EventLoop eventLoop)", note: "DnsNameResolverBuilder.eventLoop"}
  - {class: io.netty.testsuite.transport.socket.DatagramUnicastIPv6MappedTest, method: convertAnyAddress, match: "(InetSocketAddress serverAddress)", note: "DatagramUnicastIPv6MappedTest.convertAnyAddress"}
  - {class: io.netty.testsuite_jpms.main.HttpHelloWorldServer, method: main, match: "(String[] args) throws Exception", note: "HttpHelloWorldServer.main"}
  - {class: io.netty.util.DefaultAttributeMap, method: attr, match: "(AttributeKey<T> key)", note: "DefaultAttributeMap.attr"}
  - {class: io.netty.bootstrap.FailedChannel, method: isCompatible, match: "(EventLoop loop)", note: "FailedChannel.isCompatible"}
  - {class: io.netty.buffer.ByteBufUtil, method: initialValue, match: "() throws Exception", note: "ByteBufUtil.initialValue"}
  - {class: io.netty.channel.WriteBufferWaterMark, method: high, match: "()", note: "WriteBufferWaterMark.high"}
  - {class: io.netty.handler.codec.DatagramPacketEncoder, method: bind, match: "(ChannelHandlerContext ctx, SocketAddress localAddress, ChannelPromise promise) throws Exception", note: "DatagramPacketEncoder.bind"}
  - {class: io.netty.pkitesting.X509Bundle, method: getCertificate, match: "()", note: "X509Bundle.getCertificate"}
