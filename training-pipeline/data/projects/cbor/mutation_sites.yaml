# Curated performance-mutation sites for cbor (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants cbor --source data/external-src/<checkout> \
#       --sites data/projects/cbor/mutation_sites.yaml

package_root: com.authlete.cbor

sites:
  - {class: com.authlete.cbor.CBORByteArray, method: getDecodedContent, match: "()", note: "CBORByteArray.getDecodedContent"}
  - {class: com.authlete.cbor.tag.CPBignum, method: process, match: "(Number tagNumber, CBORItem tagContent) throws CBORDecoderException", note: "CPBignum.process"}
  - {class: com.authlete.cbor.token.CBORTokenizer, method: getReadCount, match: "()", note: "CBORTokenizer.getReadCount"}
  - {class: com.authlete.cbor.tsl.StatusList, method: getBits, match: "()", note: "StatusList.getBits"}
  - {class: com.authlete.cbor.CBORByteArray, method: prettify, match: "(String indent, String indentUnit, Number tagNumber)", note: "CBORByteArray.prettify"}
  - {class: com.authlete.cbor.tag.CPDefault, method: process, match: "(Number tagNumber, CBORItem tagContent) throws CBORDecoderException", note: "CPDefault.process"}
  - {class: com.authlete.cbor.tsl.StatusList, method: getLst, match: "()", note: "StatusList.getLst"}
  - {class: com.authlete.cbor.CBORDecoder, method: getOptions, match: "()", note: "CBORDecoder.getOptions"}
  - {class: com.authlete.cbor.tag.CPUntag, method: process, match: "(Number tagNumber, CBORItem tagContent) throws CBORDecoderException", note: "CPUntag.process"}
  - {class: com.authlete.cbor.tsl.StatusList, method: getAggregationUri, match: "()", note: "StatusList.getAggregationUri"}
  - {class: com.authlete.cbor.CBORDecoder, method: all, match: "() throws IOException", note: "CBORDecoder.all"}
  - {class: com.authlete.cbor.tag.CPUri, method: process, match: "(Number tagNumber, CBORItem tagContent) throws CBORDecoderException", note: "CPUri.process"}
  - {class: com.authlete.cbor.tsl.StatusListBuilder, method: valueAt, match: "(StatusTypeValue value, int index)", note: "StatusListBuilder.valueAt"}
  - {class: com.authlete.cbor.CBORDecoderOptions, method: getTagProcessor, match: "(Number tagNumber)", note: "CBORDecoderOptions.getTagProcessor"}
  - {class: com.authlete.cbor.tsl.StatusListBuilder, method: valueAt, match: "(int value, int index)", note: "StatusListBuilder.valueAt"}
  - {class: com.authlete.cbor.CBORDecoderOptions, method: setTagProcessor, match: "(Number tagNumber, CBORTagProcessor processor)", note: "CBORDecoderOptions.setTagProcessor"}
  - {class: com.authlete.cbor.tsl.StatusListBuilder, method: aggregationUri, match: "(String uri)", note: "StatusListBuilder.aggregationUri"}
  - {class: com.authlete.cbor.CBORDecoderOptions, method: removeTagProcessor, match: "(Number tagNumber)", note: "CBORDecoderOptions.removeTagProcessor"}
  - {class: com.authlete.cbor.tsl.StatusListBuilder, method: capacity, match: "(int capacity)", note: "StatusListBuilder.capacity"}
  - {class: com.authlete.cbor.CBORItemList, method: CBORItemList, match: "(T... items)", note: "CBORItemList.CBORItemList"}
  - {class: com.authlete.cbor.tsl.StatusTypeValuesBuilder, method: getBits, match: "()", note: "StatusTypeValuesBuilder.getBits"}
  - {class: com.authlete.cbor.CBORItemList, method: getItems, match: "()", note: "CBORItemList.getItems"}
  - {class: com.authlete.cbor.tsl.StatusTypeValuesBuilder, method: valueAt, match: "(StatusTypeValue value, int index)", note: "StatusTypeValuesBuilder.valueAt"}
  - {class: com.authlete.cbor.CBORItemList, method: prettify, match: "(String indent, String indentUnit, Number tagNumber)", note: "CBORItemList.prettify"}
  - {class: com.authlete.cbor.tsl.StatusTypeValuesBuilder, method: valueAt, match: "(int value, int index)", note: "StatusTypeValuesBuilder.valueAt"}
  - {class: com.authlete.cbor.CBORItemList, method: parse, match: "()", note: "CBORItemList.parse"}
  - {class: com.authlete.cbor.tsl.StatusTypeValuesBuilder, method: build, match: "()", note: "StatusTypeValuesBuilder.build"}
  - {class: com.authlete.cbor.CBOROutputStream, method: writeBoolean, match: "(boolean value) throws IOException", note: "CBOROutputStream.writeBoolean"}
  - {class: com.authlete.cbor.tsl.StatusTypeValue, method: getValue, match: "()", note: "StatusTypeValue.getValue"}
  - {class: com.authlete.cbor.CBOROutputStream, method: writeInteger, match: "(int value) throws IOException", note: "CBOROutputStream.writeInteger"}
  - {class: com.authlete.cbor.CBOROutputStream, method: writeLong, match: "(long value) throws IOException", note: "CBOROutputStream.writeLong"}
  - {class: com.authlete.cbor.CBOROutputStream, method: writeBigInteger, match: "(BigInteger value) throws IOException", note: "CBOROutputStream.writeBigInteger"}
  - {class: com.authlete.cbor.CBORPairList, method: CBORPairList, match: "(T... pairs)", note: "CBORPairList.CBORPairList"}
  - {class: com.authlete.cbor.CBORPairList, method: getPairs, match: "()", note: "CBORPairList.getPairs"}
  - {class: com.authlete.cbor.CBORPairList, method: prettify, match: "(String indent, String indentUnit, Number tagNumber)", note: "CBORPairList.prettify"}
  - {class: com.authlete.cbor.CBORPairList, method: parse, match: "()", note: "CBORPairList.parse"}
  - {class: com.authlete.cbor.CBORPairsBuilder, method: addUnlessNull, match: "(CBORItem label, CBORItem value)", note: "CBORPairsBuilder.addUnlessNull"}
  - {class: com.authlete.cbor.CBORPairsBuilder, method: addUnlessNull, match: "(CBORItem label, Object value)", note: "CBORPairsBuilder.addUnlessNull"}
  - {class: com.authlete.cbor.CBORPairsBuilder, method: addUnlessNull, match: "(Object label, Object value)", note: "CBORPairsBuilder.addUnlessNull"}
  - {class: com.authlete.cbor.CBORPairsBuilder, method: build, match: "()", note: "CBORPairsBuilder.build"}
  - {class: com.authlete.cbor.CBORParser, method: all, match: "() throws IOException", note: "CBORParser.all"}
  - {class: com.authlete.cbor.CBORParser, method: getDecoder, match: "()", note: "CBORParser.getDecoder"}
  - {class: com.authlete.cbor.CBORBreak, method: parse, match: "()", note: "CBORBreak.parse"}
  - {class: com.authlete.cbor.CBORNull, method: parse, match: "()", note: "CBORNull.parse"}
  - {class: com.authlete.cbor.CBORPair, method: getKey, match: "()", note: "CBORPair.getKey"}
  - {class: com.authlete.cbor.CBORPair, method: getValue, match: "()", note: "CBORPair.getValue"}
  - {class: com.authlete.cbor.CBORPair, method: getKeyComment, match: "()", note: "CBORPair.getKeyComment"}
  - {class: com.authlete.cbor.CBORPair, method: setKeyComment, match: "(String comment)", note: "CBORPair.setKeyComment"}
  - {class: com.authlete.cbor.CBORTaggedItem, method: getTagNumber, match: "()", note: "CBORTaggedItem.getTagNumber"}
  - {class: com.authlete.cbor.CBORTaggedItem, method: getTagContent, match: "()", note: "CBORTaggedItem.getTagContent"}
