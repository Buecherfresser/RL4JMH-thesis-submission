  - {class: com.clearspring.analytics.hash.MurmurHash, method: hash, match: "(Object o)", note: "MurmurHash.hash"}
  - {class: com.clearspring.analytics.stream.SampleSet, method: peek, match: "()", note: "SampleSet.peek"}
