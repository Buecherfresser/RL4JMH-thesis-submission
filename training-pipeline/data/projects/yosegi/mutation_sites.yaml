# Curated performance-mutation sites for yosegi (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants yosegi --source data/external-src/<checkout> \
#       --sites data/projects/yosegi/mutation_sites.yaml

package_root: jp.co.yahoo

