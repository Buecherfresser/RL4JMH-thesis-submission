# Curated performance-mutation sites for justify (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants justify --source data/external-src/<checkout> \
#       --sites data/projects/justify/mutation_sites.yaml

package_root: org.leadpony.justify

sites:
  - {class: org.leadpony.justify.api.EmptyJsonSchema, method: createEvaluator, match: "(Evaluator parent, InstanceType type)", note: "EmptyJsonSchema.createEvaluator"}
  - {class: org.leadpony.justify.cli.ColorConsole, method: decorate, match: "(String line)", note: "ColorConsole.decorate"}
  - {class: org.leadpony.justify.internal.base.ResettableInputStream, method: createResettedStream, match: "()", note: "ResettableInputStream.createResettedStream"}
  - {class: org.leadpony.justify.api.EmptyJsonSchema, method: createNegatedEvaluator, match: "(Evaluator parent, InstanceType type)", note: "EmptyJsonSchema.createNegatedEvaluator"}
  - {class: org.leadpony.justify.cli.Console, method: decorate, match: "(String line)", note: "Console.decorate"}
  - {class: org.leadpony.justify.internal.base.Sets, method: newIdentitySet, match: "()", note: "Sets.newIdentitySet"}
  - {class: org.leadpony.justify.api.InstanceType, method: isNumeric, match: "()", note: "InstanceType.isNumeric"}
  - {class: org.leadpony.justify.cli.Help, method: execute, match: "(List<String> args)", note: "Help.execute"}
  - {class: org.leadpony.justify.internal.base.json.BigDecimalJsonNumber, method: getValueType, match: "()", note: "BigDecimalJsonNumber.getValueType"}
  - {class: org.leadpony.justify.api.InstanceType, method: isContainer, match: "()", note: "InstanceType.isContainer"}
  - {class: org.leadpony.justify.cli.Launcher, method: launch, match: "(String[] args)", note: "Launcher.launch"}
  - {class: org.leadpony.justify.internal.base.json.BigDecimalJsonNumber, method: isIntegral, match: "()", note: "BigDecimalJsonNumber.isIntegral"}
  - {class: org.leadpony.justify.api.JsonValidatingException, method: getProblems, match: "()", note: "JsonValidatingException.getProblems"}
  - {class: org.leadpony.justify.cli.Launcher, method: main, match: "(String[] args)", note: "Launcher.main"}
  - {class: org.leadpony.justify.internal.base.json.DefaultPointerAwareJsonParser, method: getPointer, match: "()", note: "DefaultPointerAwareJsonParser.getPointer"}
  - {class: org.leadpony.justify.api.JsonValidatingException, method: getMessage, match: "()", note: "JsonValidatingException.getMessage"}
  - {class: org.leadpony.justify.cli.LocalLocation, method: openStream, match: "() throws IOException", note: "LocalLocation.openStream"}
  - {class: org.leadpony.justify.internal.base.json.DefaultPointerAwareJsonParser, method: process, match: "(Event event)", note: "DefaultPointerAwareJsonParser.process"}
  - {class: org.leadpony.justify.api.SpecVersion, method: id, match: "()", note: "SpecVersion.id"}
