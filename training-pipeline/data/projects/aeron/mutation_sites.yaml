  - {class: io.aeron.driver.status.StatusUtil, method: controllableIdleStrategy, match: "(final CountersReader countersReader)", note: "StatusUtil.controllableIdleStrategy"}
  - {class: io.aeron.driver.AeronClient, method: onTimeEvent, match: "(final long timeNs, final long timeMs, final DriverConductor conductor)", note: "AeronClient.onTimeEvent"}
