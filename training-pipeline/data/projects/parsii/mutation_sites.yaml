# Curated performance-mutation sites for parsii (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants parsii --source data/external-src/<checkout> \
#       --sites data/projects/parsii/mutation_sites.yaml

package_root: parsii.eval

sites:
  - {class: parsii.eval.FunctionCall, method: evaluate, match: "()", note: "FunctionCall.evaluate"}
  - {class: parsii.eval.FunctionCall, method: simplify, match: "()", note: "FunctionCall.simplify"}
  - {class: parsii.eval.FunctionCall, method: setFunction, match: "(Function function)", note: "FunctionCall.setFunction"}
  - {class: parsii.eval.FunctionCall, method: addParameter, match: "(Expression expression)", note: "FunctionCall.addParameter"}
  - {class: parsii.eval.FunctionCall, method: getParameters, match: "()", note: "FunctionCall.getParameters"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a, double b)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a, double b)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
