# Curated performance-mutation sites for toml4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants toml4j --source data/external-src/<checkout> \
#       --sites data/projects/toml4j/mutation_sites.yaml

package_root: com.moandjiezana.toml

sites:
  - {class: com.moandjiezana.toml.ArrayValueReader, method: canRead, match: "(String s)", note: "ArrayValueReader.canRead"}
  - {class: com.moandjiezana.toml.LiteralStringValueReader, method: canRead, match: "(String s)", note: "LiteralStringValueReader.canRead"}
  - {class: com.moandjiezana.toml.MapValueWriter, method: canWrite, match: "(Object value)", note: "MapValueWriter.canWrite"}
  - {class: com.moandjiezana.toml.MapValueWriter, method: isPrimitiveType, match: "()", note: "MapValueWriter.isPrimitiveType"}
  - {class: com.moandjiezana.toml.MultilineLiteralStringValueReader, method: canRead, match: "(String s)", note: "MultilineLiteralStringValueReader.canRead"}
  - {class: com.moandjiezana.toml.MultilineStringValueReader, method: canRead, match: "(String s)", note: "MultilineStringValueReader.canRead"}
  - {class: com.moandjiezana.toml.NumberValueReaderWriter, method: canRead, match: "(String s)", note: "NumberValueReaderWriter.canRead"}
  - {class: com.moandjiezana.toml.NumberValueReaderWriter, method: canWrite, match: "(Object value)", note: "NumberValueReaderWriter.canWrite"}
  - {class: com.moandjiezana.toml.NumberValueReaderWriter, method: isPrimitiveType, match: "()", note: "NumberValueReaderWriter.isPrimitiveType"}
  - {class: com.moandjiezana.toml.PrimitiveArrayValueWriter, method: canWrite, match: "(Object value)", note: "PrimitiveArrayValueWriter.canWrite"}
  - {class: com.moandjiezana.toml.StringValueReaderWriter, method: canRead, match: "(String s)", note: "StringValueReaderWriter.canRead"}
  - {class: com.moandjiezana.toml.StringValueReaderWriter, method: canWrite, match: "(Object value)", note: "StringValueReaderWriter.canWrite"}
  - {class: com.moandjiezana.toml.StringValueReaderWriter, method: isPrimitiveType, match: "()", note: "StringValueReaderWriter.isPrimitiveType"}
  - {class: com.moandjiezana.toml.TableArrayValueWriter, method: canWrite, match: "(Object value)", note: "TableArrayValueWriter.canWrite"}
  - {class: com.moandjiezana.toml.BooleanValueReaderWriter, method: canRead, match: "(String s)", note: "BooleanValueReaderWriter.canRead"}
  - {class: com.moandjiezana.toml.BooleanValueReaderWriter, method: canWrite, match: "(Object value)", note: "BooleanValueReaderWriter.canWrite"}
  - {class: com.moandjiezana.toml.BooleanValueReaderWriter, method: isPrimitiveType, match: "()", note: "BooleanValueReaderWriter.isPrimitiveType"}
  - {class: com.moandjiezana.toml.Context, method: with, match: "(Identifier identifier)", note: "Context.with"}
  - {class: com.moandjiezana.toml.DateValueReaderWriter, method: canRead, match: "(String s)", note: "DateValueReaderWriter.canRead"}
  - {class: com.moandjiezana.toml.DateValueReaderWriter, method: canWrite, match: "(Object value)", note: "DateValueReaderWriter.canWrite"}
  - {class: com.moandjiezana.toml.DateValueReaderWriter, method: isPrimitiveType, match: "()", note: "DateValueReaderWriter.isPrimitiveType"}
  - {class: com.moandjiezana.toml.InlineTableValueReader, method: canRead, match: "(String s)", note: "InlineTableValueReader.canRead"}
  - {class: com.moandjiezana.toml.ObjectValueWriter, method: canWrite, match: "(Object value)", note: "ObjectValueWriter.canWrite"}
  - {class: com.moandjiezana.toml.ObjectValueWriter, method: isPrimitiveType, match: "()", note: "ObjectValueWriter.isPrimitiveType"}
  - {class: com.moandjiezana.toml.Results, method: tableDuplicatesKey, match: "(String table, AtomicInteger line)", note: "Results.tableDuplicatesKey"}
