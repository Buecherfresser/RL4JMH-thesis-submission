  - {class: com.jayway.jsonpath.internal.path.ArraySliceOperation, method: to, match: "()", note: "ArraySliceOperation.to"}
  - {class: com.jayway.jsonpath.spi.mapper.JsonSmartMappingProvider, method: call, match: "()", note: "JsonSmartMappingProvider.call"}
  - {class: com.jayway.jsonpath.internal.path.ArraySliceToken, method: evaluate, match: "(String currentPath, PathRef parent, Object model, EvaluationContextImpl ctx)", note: "ArraySliceToken.evaluate"}
  - {class: com.jayway.jsonpath.spi.mapper.JsonSmartMappingProvider, method: map, match: "(Object source, Class<T> targetType, Configuration configuration)", note: "JsonSmartMappingProvider.map"}
  - {class: com.jayway.jsonpath.internal.path.ArraySliceToken, method: getPathFragment, match: "()", note: "ArraySliceToken.getPathFragment"}
  - {class: com.jayway.jsonpath.spi.mapper.TapestryMappingProvider, method: map, match: "(final Object source, final Class<T> targetType, final Configuration configuration)", note: "TapestryMappingProvider.map"}
  - {class: com.jayway.jsonpath.internal.path.FunctionPathToken, method: evaluate, match: "(String currentPath, PathRef parent, Object model, EvaluationContextImpl ctx)", note: "FunctionPathToken.evaluate"}
  - {class: com.jayway.jsonpath.spi.mapper.TapestryMappingProvider, method: map, match: "(final Object source, final TypeRef<T> targetType, final Configuration configuration)", note: "TapestryMappingProvider.map"}
  - {class: com.jayway.jsonpath.internal.path.FunctionPathToken, method: isTokenDefinite, match: "()", note: "FunctionPathToken.isTokenDefinite"}
  - {class: com.jayway.jsonpath.spi.cache.CacheProvider, method: setCache, match: "(Cache cache)", note: "CacheProvider.setCache"}
  - {class: com.jayway.jsonpath.internal.CharacterIndex, method: length, match: "()", note: "CharacterIndex.length"}
