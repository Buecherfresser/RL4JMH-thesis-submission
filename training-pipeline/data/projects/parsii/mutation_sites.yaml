  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: eval, match: "(double a)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: getNumberOfArguments, match: "()", note: "Functions.getNumberOfArguments"}
  - {class: parsii.eval.Functions, method: eval, match: "(List<Expression> args)", note: "Functions.eval"}
  - {class: parsii.eval.Functions, method: isNaturalFunction, match: "()", note: "Functions.isNaturalFunction"}
