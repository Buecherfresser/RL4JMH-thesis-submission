  - {class: org.leadpony.justify.internal.base.json.JsonInstanceBuilder, method: append, match: "(Event event, JsonParser parser)", note: "JsonInstanceBuilder.append"}
  - {class: org.leadpony.justify.api.SpecVersion, method: current, match: "()", note: "SpecVersion.current"}
  - {class: org.leadpony.justify.cli.Message, method: format, match: "(Object... arguments)", note: "Message.format"}
  - {class: org.leadpony.justify.internal.base.json.JsonInstanceBuilder, method: build, match: "()", note: "JsonInstanceBuilder.build"}
  - {class: org.leadpony.justify.cli.PathOrUrlFormatAttribute, method: name, match: "()", note: "PathOrUrlFormatAttribute.name"}
  - {class: org.leadpony.justify.internal.base.json.JsonParserFactoryDecorator, method: realFactory, match: "()", note: "JsonParserFactoryDecorator.realFactory"}
