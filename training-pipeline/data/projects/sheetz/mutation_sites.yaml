# Curated performance-mutation sites for sheetz (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants sheetz --source data/external-src/<checkout> \
#       --sites data/projects/sheetz/mutation_sites.yaml

package_root: io.github.chitralabs

sites:
  - {class: io.github.chitralabs.sheetz.cache.FieldMapping, method: from, match: "(Field field)", note: "FieldMapping.from"}
  - {class: io.github.chitralabs.sheetz.cache.FieldMapping, method: field, match: "()", note: "FieldMapping.field"}
  - {class: io.github.chitralabs.sheetz.cache.FieldMapping, method: headerName, match: "()", note: "FieldMapping.headerName"}
  - {class: io.github.chitralabs.sheetz.cache.MappingCache, method: clear, match: "()", note: "MappingCache.clear"}
  - {class: io.github.chitralabs.sheetz.cache.MappingCache, method: type, match: "()", note: "MappingCache.type"}
  - {class: io.github.chitralabs.sheetz.cache.MappingCache, method: fields, match: "()", note: "MappingCache.fields"}
  - {class: io.github.chitralabs.sheetz.exception.MappingException, method: row, match: "()", note: "MappingException.row"}
  - {class: io.github.chitralabs.sheetz.exception.MappingException, method: column, match: "()", note: "MappingException.column"}
  - {class: io.github.chitralabs.sheetz.exception.MappingException, method: value, match: "()", note: "MappingException.value"}
  - {class: io.github.chitralabs.sheetz.reader.StreamingReader, method: delimiter, match: "(char delimiter)", note: "StreamingReader.delimiter"}
  - {class: io.github.chitralabs.sheetz.reader.StreamingReader, method: forEach, match: "(Consumer<? super T> action)", note: "StreamingReader.forEach"}
  - {class: io.github.chitralabs.sheetz.reader.StreamingReader, method: batch, match: "(int size)", note: "StreamingReader.batch"}
  - {class: io.github.chitralabs.sheetz.style.CellStyleBuilder, method: create, match: "()", note: "CellStyleBuilder.create"}
  - {class: io.github.chitralabs.sheetz.style.CellStyleBuilder, method: fontName, match: "(String fontName)", note: "CellStyleBuilder.fontName"}
  - {class: io.github.chitralabs.sheetz.style.CellStyleBuilder, method: fontSize, match: "(int fontSize)", note: "CellStyleBuilder.fontSize"}
  - {class: io.github.chitralabs.sheetz.style.StyleAnnotationParser, method: parse, match: "(Style style)", note: "StyleAnnotationParser.parse"}
  - {class: io.github.chitralabs.sheetz.writer.WorkbookBuilder, method: sheet, match: "(String name, List<T> data)", note: "WorkbookBuilder.sheet"}
  - {class: io.github.chitralabs.sheetz.Format, method: extension, match: "()", note: "Format.extension"}
  - {class: io.github.chitralabs.sheetz.Format, method: isExcel, match: "()", note: "Format.isExcel"}
  - {class: io.github.chitralabs.sheetz.Format, method: isCsv, match: "()", note: "Format.isCsv"}
  - {class: io.github.chitralabs.sheetz.Sheetz, method: readMaps, match: "(String path)", note: "Sheetz.readMaps"}
  - {class: io.github.chitralabs.sheetz.Sheetz, method: readMaps, match: "(Path path)", note: "Sheetz.readMaps"}
  - {class: io.github.chitralabs.sheetz.Sheetz, method: readMaps, match: "(InputStream input, Format format)", note: "Sheetz.readMaps"}
  - {class: io.github.chitralabs.sheetz.SheetzConfig, method: defaults, match: "()", note: "SheetzConfig.defaults"}
  - {class: io.github.chitralabs.sheetz.SheetzConfig, method: builder, match: "()", note: "SheetzConfig.builder"}
  - {class: io.github.chitralabs.sheetz.SheetzConfig, method: dateFormat, match: "()", note: "SheetzConfig.dateFormat"}
  - {class: io.github.chitralabs.sheetz.ValidationResult, method: isValid, match: "()", note: "ValidationResult.isValid"}
  - {class: io.github.chitralabs.sheetz.ValidationResult, method: hasErrors, match: "()", note: "ValidationResult.hasErrors"}
  - {class: io.github.chitralabs.sheetz.ValidationResult, method: validRows, match: "()", note: "ValidationResult.validRows"}
  - {class: io.github.chitralabs.sheetz.cache.ColumnResolver, method: resolve, match: "(String name)", note: "ColumnResolver.resolve"}
  - {class: io.github.chitralabs.sheetz.cache.ColumnResolver, method: headerAt, match: "(int index)", note: "ColumnResolver.headerAt"}
  - {class: io.github.chitralabs.sheetz.cache.ColumnResolver, method: size, match: "()", note: "ColumnResolver.size"}
  - {class: io.github.chitralabs.sheetz.convert.ConvertContext, method: fieldName, match: "()", note: "ConvertContext.fieldName"}
  - {class: io.github.chitralabs.sheetz.convert.ConvertContext, method: targetType, match: "()", note: "ConvertContext.targetType"}
  - {class: io.github.chitralabs.sheetz.convert.ConvertContext, method: format, match: "()", note: "ConvertContext.format"}
  - {class: io.github.chitralabs.sheetz.convert.Converters, method: register, match: "(Class<T> type, Converter<T> conv)", note: "Converters.register"}
  - {class: io.github.chitralabs.sheetz.convert.Converters, method: has, match: "(Class<?> type)", note: "Converters.has"}
  - {class: io.github.chitralabs.sheetz.convert.Converters, method: reset, match: "() { synchronized (LOCK)", note: "Converters.reset"}
  - {class: io.github.chitralabs.sheetz.reader.CsvReader, method: delimiter, match: "(char d)", note: "CsvReader.delimiter"}
  - {class: io.github.chitralabs.sheetz.reader.CsvReader, method: validate, match: "(Path path)", note: "CsvReader.validate"}
  - {class: io.github.chitralabs.sheetz.reader.CsvReader, method: readMaps, match: "(Path path, SheetzConfig config)", note: "CsvReader.readMaps"}
  - {class: io.github.chitralabs.sheetz.reader.ExcelReader, method: sheet, match: "(int index)", note: "ExcelReader.sheet"}
  - {class: io.github.chitralabs.sheetz.reader.ExcelReader, method: sheet, match: "(String name)", note: "ExcelReader.sheet"}
  - {class: io.github.chitralabs.sheetz.reader.ExcelReader, method: headerRow, match: "(int row)", note: "ExcelReader.headerRow"}
  - {class: io.github.chitralabs.sheetz.reader.OdsReader, method: sheet, match: "(int index)", note: "OdsReader.sheet"}
  - {class: io.github.chitralabs.sheetz.reader.OdsReader, method: sheet, match: "(String name)", note: "OdsReader.sheet"}
  - {class: io.github.chitralabs.sheetz.reader.OdsReader, method: headerRow, match: "(int row)", note: "OdsReader.headerRow"}
  - {class: io.github.chitralabs.sheetz.style.CellStyleDef, method: fontName, match: "()", note: "CellStyleDef.fontName"}
  - {class: io.github.chitralabs.sheetz.style.CellStyleDef, method: fontSize, match: "()", note: "CellStyleDef.fontSize"}
  - {class: io.github.chitralabs.sheetz.style.CellStyleDef, method: bold, match: "()", note: "CellStyleDef.bold"}
