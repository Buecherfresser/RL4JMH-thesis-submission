# Curated performance-mutation sites for abacus-common (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants abacus-common --source data/external-src/<checkout> \
#       --sites data/projects/abacus-common/mutation_sites.yaml

package_root: com.landawn.abacus

sites:
