# Curated performance-mutation sites for vavr-jackson (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants vavr-jackson --source data/external-src/<checkout> \
#       --sites data/projects/vavr-jackson/mutation_sites.yaml

package_root: io.vavr.jackson

sites:
  - {class: io.vavr.jackson.datatype.deserialize.MapDeserializer, method: deserialize, match: "(JsonParser p, DeserializationContext ctxt, Map<?, ?> intoValue)", note: "MapDeserializer.deserialize"}
  - {class: io.vavr.jackson.datatype.deserialize.MapDeserializer, method: deserialize, match: "(JsonParser p, DeserializationContext ctxt)", note: "MapDeserializer.deserialize"}
  - {class: io.vavr.jackson.datatype.serialize.ArraySerializer, method: serializeWithType, match: "(T value, JsonGenerator gen, SerializationContext context,", note: "ArraySerializer.serializeWithType"}
  - {class: io.vavr.jackson.datatype.serialize.ArraySerializer, method: isEmpty, match: "(SerializationContext context, T value)", note: "ArraySerializer.isEmpty"}
  - {class: io.vavr.jackson.datatype.serialize.ArraySerializer, method: createContextual, match: "(SerializationContext context, BeanProperty property)", note: "ArraySerializer.createContextual"}
  - {class: io.vavr.jackson.datatype.serialize.MapSerializer, method: isEmpty, match: "(SerializationContext context, Map<?, ?> value)", note: "MapSerializer.isEmpty"}
  - {class: io.vavr.jackson.datatype.serialize.MapSerializer, method: createContextual, match: "(SerializationContext context, BeanProperty property) throws DatabindException", note: "MapSerializer.createContextual"}
  - {class: io.vavr.jackson.datatype.VavrModule, method: useOptionInPlainFormat, match: "(boolean value)", note: "VavrModule.useOptionInPlainFormat"}
