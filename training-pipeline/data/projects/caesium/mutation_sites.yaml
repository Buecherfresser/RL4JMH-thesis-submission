# Curated performance-mutation sites for caesium (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants caesium --source data/external-src/<checkout> \
#       --sites data/projects/caesium/mutation_sites.yaml

package_root: dev.sim0n.caesium

sites:
  - {class: dev.sim0n.caesium.Caesium, method: run, match: "(File input, File output) throws Exception", note: "Caesium.run"}
  - {class: dev.sim0n.caesium.gui.CGui, method: main, match: "(String[] args) throws HeadlessException, IOException", note: "CGui.main"}
  - {class: dev.sim0n.caesium.manager.ClassManager, method: parseJar, match: "(File input) throws Exception", note: "ClassManager.parseJar"}
  - {class: dev.sim0n.caesium.mutator.impl.LineNumberMutator, method: handle, match: "(ClassWrapper wrapper)", note: "LineNumberMutator.handle"}
  - {class: dev.sim0n.caesium.util.ASMUtil, method: getOptimisedInt, match: "(int value)", note: "ASMUtil.getOptimisedInt"}
  - {class: dev.sim0n.caesium.Caesium, method: separator, match: "()", note: "Caesium.separator"}
  - {class: dev.sim0n.caesium.manager.ClassManager, method: handleMutation, match: "() throws Exception", note: "ClassManager.handleMutation"}
  - {class: dev.sim0n.caesium.mutator.impl.LineNumberMutator, method: handleFinish, match: "()", note: "LineNumberMutator.handleFinish"}
  - {class: dev.sim0n.caesium.util.ASMUtil, method: visitOptimisedInt, match: "(MethodVisitor mv, int i)", note: "ASMUtil.visitOptimisedInt"}
  - {class: dev.sim0n.caesium.PreRuntime, method: loadJavaRuntime, match: "() throws HeadlessException, IOException", note: "PreRuntime.loadJavaRuntime"}
  - {class: dev.sim0n.caesium.manager.MutatorManager, method: getMutator, match: "(Class<T> clazz)", note: "MutatorManager.getMutator"}
  - {class: dev.sim0n.caesium.mutator.impl.NumberMutator, method: handle, match: "(ClassWrapper wrapper)", note: "NumberMutator.handle"}
  - {class: dev.sim0n.caesium.util.ByteUtil, method: parseClassBytes, match: "(byte[] bytes)", note: "ByteUtil.parseClassBytes"}
  - {class: dev.sim0n.caesium.PreRuntime, method: loadInput, match: "(String inputFile) throws CaesiumException", note: "PreRuntime.loadInput"}
  - {class: dev.sim0n.caesium.manager.MutatorManager, method: handleMutation, match: "(ClassWrapper clazz)", note: "MutatorManager.handleMutation"}
  - {class: dev.sim0n.caesium.mutator.impl.NumberMutator, method: handleFinish, match: "()", note: "NumberMutator.handleFinish"}
  - {class: dev.sim0n.caesium.util.ByteUtil, method: getClassBytes, match: "(ClassNode classNode)", note: "ByteUtil.getClassBytes"}
  - {class: dev.sim0n.caesium.Start, method: main, match: "(String[] args)", note: "Start.main"}
  - {class: dev.sim0n.caesium.mutator.impl.OldStringMutator, method: handle, match: "(ClassWrapper wrapper)", note: "OldStringMutator.handle"}
  - {class: dev.sim0n.caesium.util.OSUtil, method: getCurrentOS, match: "() throws IOException", note: "OSUtil.getCurrentOS"}
  - {class: dev.sim0n.caesium.mutator.impl.OldStringMutator, method: handleFinish, match: "()", note: "OldStringMutator.handleFinish"}
  - {class: dev.sim0n.caesium.util.StringUtil, method: getRandomString, match: "(int min, int max, boolean uppercase)", note: "StringUtil.getRandomString"}
  - {class: dev.sim0n.caesium.mutator.impl.StringMutator, method: handle, match: "(ClassWrapper wrapper)", note: "StringMutator.handle"}
  - {class: dev.sim0n.caesium.util.VersionUtil, method: getVersion, match: "()", note: "VersionUtil.getVersion"}
  - {class: dev.sim0n.caesium.mutator.impl.StringMutator, method: getStrings, match: "(ClassNode owner)", note: "StringMutator.getStrings"}
  - {class: dev.sim0n.caesium.util.classwriter.CaesiumClassWriter, method: getCommonSuperClass, match: "(final String type1, final String type2)", note: "CaesiumClassWriter.getCommonSuperClass"}
  - {class: dev.sim0n.caesium.mutator.impl.AttributeMutator, method: handle, match: "(ClassWrapper wrapper)", note: "AttributeMutator.handle"}
  - {class: dev.sim0n.caesium.util.classwriter.CaesiumClassWriter, method: getTree, match: "(String ref) throws CaesiumException", note: "CaesiumClassWriter.getTree"}
  - {class: dev.sim0n.caesium.mutator.impl.AttributeMutator, method: handleFinish, match: "()", note: "AttributeMutator.handleFinish"}
  - {class: dev.sim0n.caesium.util.wrapper.impl.ClassWrapper, method: getClinit, match: "()", note: "ClassWrapper.getClinit"}
  - {class: dev.sim0n.caesium.mutator.impl.ClassFolderMutator, method: handle, match: "(ClassWrapper wrapper)", note: "ClassFolderMutator.handle"}
  - {class: dev.sim0n.caesium.util.wrapper.impl.ClassWrapper, method: addField, match: "(FieldNode fieldNode)", note: "ClassWrapper.addField"}
  - {class: dev.sim0n.caesium.mutator.impl.ClassFolderMutator, method: handleFinish, match: "()", note: "ClassFolderMutator.handleFinish"}
  - {class: dev.sim0n.caesium.util.wrapper.impl.MethodWrapper, method: getMaxSize, match: "()", note: "MethodWrapper.getMaxSize"}
  - {class: dev.sim0n.caesium.mutator.impl.ControlFlowMutator, method: handle, match: "(ClassWrapper wrapper)", note: "ControlFlowMutator.handle"}
  - {class: dev.sim0n.caesium.util.wrapper.impl.MethodWrapper, method: hasInstructions, match: "()", note: "MethodWrapper.hasInstructions"}
  - {class: dev.sim0n.caesium.mutator.impl.ControlFlowMutator, method: handleFinish, match: "()", note: "ControlFlowMutator.handleFinish"}
  - {class: dev.sim0n.caesium.mutator.impl.LocalVariableMutator, method: handle, match: "(ClassWrapper wrapper)", note: "LocalVariableMutator.handle"}
  - {class: dev.sim0n.caesium.mutator.impl.LocalVariableMutator, method: handleFinish, match: "()", note: "LocalVariableMutator.handleFinish"}
  - {class: dev.sim0n.caesium.mutator.impl.PolymorphMutator, method: handle, match: "(ClassWrapper wrapper)", note: "PolymorphMutator.handle"}
  - {class: dev.sim0n.caesium.mutator.impl.PolymorphMutator, method: handleFinish, match: "()", note: "PolymorphMutator.handleFinish"}
  - {class: dev.sim0n.caesium.mutator.impl.ReferenceMutator, method: handle, match: "(ClassWrapper wrapper)", note: "ReferenceMutator.handle"}
  - {class: dev.sim0n.caesium.mutator.impl.ReferenceMutator, method: base64Encode, match: "(byte[] bytes, String table, byte opcodeRandomKey)", note: "ReferenceMutator.base64Encode"}
  - {class: dev.sim0n.caesium.mutator.impl.ShuffleMutator, method: handle, match: "(ClassWrapper wrapper)", note: "ShuffleMutator.handle"}
  - {class: dev.sim0n.caesium.mutator.impl.ShuffleMutator, method: handleFinish, match: "()", note: "ShuffleMutator.handleFinish"}
  - {class: dev.sim0n.caesium.mutator.impl.TrimMutator, method: handle, match: "(ClassWrapper wrapper)", note: "TrimMutator.handle"}
  - {class: dev.sim0n.caesium.mutator.impl.TrimMutator, method: handleFinish, match: "()", note: "TrimMutator.handleFinish"}
  - {class: dev.sim0n.caesium.mutator.impl.crasher.BadAnnotationMutator, method: handle, match: "(ClassWrapper wrapper)", note: "BadAnnotationMutator.handle"}
  - {class: dev.sim0n.caesium.mutator.impl.crasher.BadAnnotationMutator, method: handleFinish, match: "()", note: "BadAnnotationMutator.handleFinish"}
  - {class: dev.sim0n.caesium.mutator.impl.crasher.ImageCrashMutator, method: handle, match: "(ClassWrapper wrapper)", note: "ImageCrashMutator.handle"}
