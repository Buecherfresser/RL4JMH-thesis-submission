# Curated performance-mutation sites for rtree-multi (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants rtree-multi --source data/external-src/<checkout> \
#       --sites data/projects/rtree-multi/mutation_sites.yaml

package_root: com.github.davidmoten

sites:
