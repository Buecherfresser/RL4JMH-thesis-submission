# Curated performance-mutation sites for staedi (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants staedi --source data/external-src/<checkout> \
#       --sites data/projects/staedi/mutation_sites.yaml

package_root: io.xlate.edi

sites:
  - {class: io.xlate.edi.internal.schema.ClasspathURLStreamHandler, method: openConnection, match: "(URL u) throws IOException", note: "ClasspathURLStreamHandler.openConnection"}
  - {class: io.xlate.edi.schema.EDISchemaException, method: getLocation, match: "()", note: "EDISchemaException.getLocation"}
  - {class: io.xlate.edi.stream.EDIStreamEvent, method: isError, match: "()", note: "EDIStreamEvent.isError"}
  - {class: io.xlate.edi.internal.schema.SchemaUtils, method: getControlSchema, match: "(String standard, String[] version) throws EDISchemaException", note: "SchemaUtils.getControlSchema"}
  - {class: io.xlate.edi.schema.EDISchemaException, method: getOriginalMessage, match: "()", note: "EDISchemaException.getOriginalMessage"}
  - {class: io.xlate.edi.stream.EDIStreamException, method: buildMessage, match: "(String message, Location location)", note: "EDIStreamException.buildMessage"}
  - {class: io.xlate.edi.internal.stream.CharArraySequence, method: clear, match: "()", note: "CharArraySequence.clear"}
  - {class: io.xlate.edi.stream.EDIStreamException, method: getLocation, match: "()", note: "EDIStreamException.getLocation"}
  - {class: io.xlate.edi.internal.stream.CharArraySequence, method: putToBuffer, match: "(CharBuffer buffer)", note: "CharArraySequence.putToBuffer"}
  - {class: io.xlate.edi.stream.EDIStreamValidationError, method: getCategory, match: "()", note: "EDIStreamValidationError.getCategory"}
  - {class: io.xlate.edi.internal.stream.StaEDIFilteredStreamReader, method: getProperty, match: "(String name)", note: "StaEDIFilteredStreamReader.getProperty"}
  - {class: io.xlate.edi.stream.EDINamespaces, method: all, match: "()", note: "EDINamespaces.all"}
  - {class: io.xlate.edi.internal.stream.StaEDIFilteredStreamReader, method: getDelimiters, match: "()", note: "StaEDIFilteredStreamReader.getDelimiters"}
  - {class: io.xlate.edi.stream.EDIValidationException, method: getEvent, match: "()", note: "EDIValidationException.getEvent"}
  - {class: io.xlate.edi.internal.stream.StaEDIStreamLocation, method: setElementPosition, match: "(int elementPosition)", note: "StaEDIStreamLocation.setElementPosition"}
  - {class: io.xlate.edi.stream.EDIValidationException, method: getError, match: "()", note: "EDIValidationException.getError"}
  - {class: io.xlate.edi.internal.stream.StaEDIStreamLocation, method: setElementOccurrence, match: "(int elementOccurrence)", note: "StaEDIStreamLocation.setElementOccurrence"}
  - {class: io.xlate.edi.internal.stream.StaEDIStreamReader, method: getProperty, match: "(String name)", note: "StaEDIStreamReader.getProperty"}
  - {class: io.xlate.edi.internal.stream.StaEDIStreamReader, method: getDelimiters, match: "()", note: "StaEDIStreamReader.getDelimiters"}
  - {class: io.xlate.edi.internal.stream.StaEDIStreamWriter, method: formatElements, match: "()", note: "StaEDIStreamWriter.formatElements"}
  - {class: io.xlate.edi.internal.stream.StaEDIStreamWriter, method: trimDiscriminatorValues, match: "()", note: "StaEDIStreamWriter.trimDiscriminatorValues"}
  - {class: io.xlate.edi.internal.stream.StaEDIXMLStreamReader, method: getProperty, match: "(String name)", note: "StaEDIXMLStreamReader.getProperty"}
  - {class: io.xlate.edi.internal.stream.StaEDIXMLStreamReader, method: require, match: "(int type, String namespaceURI, String localName) throws XMLStreamException", note: "StaEDIXMLStreamReader.require"}
  - {class: io.xlate.edi.internal.stream.StaEDIXMLStreamWriter, method: writeStartElement, match: "(String localName) throws XMLStreamException", note: "StaEDIXMLStreamWriter.writeStartElement"}
  - {class: io.xlate.edi.internal.stream.StaEDIXMLStreamWriter, method: writeStartElement, match: "(String namespaceURI, String localName) throws XMLStreamException", note: "StaEDIXMLStreamWriter.writeStartElement"}
  - {class: io.xlate.edi.internal.stream.json.JsonParserFactory, method: createJsonParser, match: "(EDIStreamReader reader, Class<J> type, Map<String, Object> properties)", note: "JsonParserFactory.createJsonParser"}
  - {class: io.xlate.edi.internal.stream.json.StaEDIJacksonJsonParser, method: nextToken, match: "() throws IOException", note: "StaEDIJacksonJsonParser.nextToken"}
  - {class: io.xlate.edi.internal.stream.json.StaEDIJacksonJsonParser, method: close, match: "() throws IOException", note: "StaEDIJacksonJsonParser.close"}
  - {class: io.xlate.edi.internal.stream.json.StaEDIJakartaJsonParser, method: newJsonException, match: "(String message, Throwable cause)", note: "StaEDIJakartaJsonParser.newJsonException"}
  - {class: io.xlate.edi.internal.stream.json.StaEDIJakartaJsonParser, method: newJsonParsingException, match: "(String message, Throwable cause)", note: "StaEDIJakartaJsonParser.newJsonParsingException"}
