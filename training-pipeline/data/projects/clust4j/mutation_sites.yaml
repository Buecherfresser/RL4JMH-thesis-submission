# Curated performance-mutation sites for clust4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants clust4j --source data/external-src/<checkout> \
#       --sites data/projects/clust4j/mutation_sites.yaml

package_root: com.clust4j.algo

sites:
  - {class: com.clust4j.algo.LabelEncoder, method: addMapping, match: "(Integer key, Integer value)", note: "LabelEncoder.addMapping"}
  - {class: com.clust4j.algo.pipeline.NeighborsPipeline, method: fit, match: "(final RealMatrix data)", note: "NeighborsPipeline.fit"}
  - {class: com.clust4j.algo.preprocess.BoxCoxTransformer, method: checkFit, match: "()", note: "BoxCoxTransformer.checkFit"}
  - {class: com.clust4j.algo.LabelEncoder, method: allowSingleClass, match: "()", note: "LabelEncoder.allowSingleClass"}
  - {class: com.clust4j.algo.pipeline.NeighborsPipeline, method: checkFit, match: "()", note: "NeighborsPipeline.checkFit"}
  - {class: com.clust4j.algo.preprocess.BoxCoxTransformer, method: inverseTransform, match: "(RealMatrix X)", note: "BoxCoxTransformer.inverseTransform"}
  - {class: com.clust4j.algo.NoiseyLabelEncoder, method: fit, match: "()", note: "NoiseyLabelEncoder.fit"}
  - {class: com.clust4j.algo.pipeline.SupervisedPipeline, method: fit, match: "(final RealMatrix data, int[] y)", note: "SupervisedPipeline.fit"}
  - {class: com.clust4j.algo.preprocess.MeanCenterer, method: checkFit, match: "()", note: "MeanCenterer.checkFit"}
  - {class: com.clust4j.algo.SafeLabelEncoder, method: allowSingleClass, match: "()", note: "SafeLabelEncoder.allowSingleClass"}
  - {class: com.clust4j.algo.pipeline.SupervisedPipeline, method: getLabels, match: "()", note: "SupervisedPipeline.getLabels"}
  - {class: com.clust4j.algo.preprocess.MeanCenterer, method: fit, match: "(RealMatrix data)", note: "MeanCenterer.fit"}
  - {class: com.clust4j.algo.SafeLabelEncoder, method: fit, match: "()", note: "SafeLabelEncoder.fit"}
  - {class: com.clust4j.algo.pipeline.UnsupervisedPipeline, method: fit, match: "(final RealMatrix data)", note: "UnsupervisedPipeline.fit"}
  - {class: com.clust4j.algo.preprocess.MedianCenterer, method: checkFit, match: "()", note: "MedianCenterer.checkFit"}
  - {class: com.clust4j.algo.AffinityPropagation, method: getLabels, match: "()", note: "AffinityPropagation.getLabels"}
  - {class: com.clust4j.algo.pipeline.UnsupervisedPipeline, method: getLabels, match: "()", note: "UnsupervisedPipeline.getLabels"}
  - {class: com.clust4j.algo.preprocess.MedianCenterer, method: inverseTransform, match: "(RealMatrix X)", note: "MedianCenterer.inverseTransform"}
  - {class: com.clust4j.algo.AffinityPropagation, method: didConverge, match: "()", note: "AffinityPropagation.didConverge"}
  - {class: com.clust4j.algo.preprocess.MinMaxScaler, method: checkFit, match: "()", note: "MinMaxScaler.checkFit"}
  - {class: com.clust4j.algo.AffinityPropagationParameters, method: useGaussianSmoothing, match: "(boolean b)", note: "AffinityPropagationParameters.useGaussianSmoothing"}
  - {class: com.clust4j.algo.preprocess.MinMaxScaler, method: fit, match: "(RealMatrix X)", note: "MinMaxScaler.fit"}
  - {class: com.clust4j.algo.AffinityPropagationParameters, method: fitNewModel, match: "(RealMatrix data)", note: "AffinityPropagationParameters.fitNewModel"}
  - {class: com.clust4j.algo.preprocess.PCA, method: checkFit, match: "()", note: "PCA.checkFit"}
  - {class: com.clust4j.algo.BaseNeighborsModel, method: buildTree, match: "(RealMatrix data,", note: "BaseNeighborsModel.buildTree"}
  - {class: com.clust4j.algo.preprocess.PCA, method: getComponents, match: "()", note: "PCA.getComponents"}
  - {class: com.clust4j.algo.BaseNeighborsModel, method: isValidMetric, match: "(GeometricallySeparable geo)", note: "BaseNeighborsModel.isValidMetric"}
  - {class: com.clust4j.algo.preprocess.RobustScaler, method: checkFit, match: "()", note: "RobustScaler.checkFit"}
  - {class: com.clust4j.algo.BoruvkaAlgorithm, method: ballTreeMinDistDual, match: "(double rad1, double rad2, int node1, int node2, double[][] centroidDist)", note: "BoruvkaAlgorithm.ballTreeMinDistDual"}
  - {class: com.clust4j.algo.preprocess.RobustScaler, method: inverseTransform, match: "(RealMatrix X)", note: "RobustScaler.inverseTransform"}
  - {class: com.clust4j.algo.BoruvkaAlgorithm, method: kdTreeMinRDistDual, match: "(DistanceMetric metric, int node1, int node2, double[][][] nodeBounds, int n)", note: "BoruvkaAlgorithm.kdTreeMinRDistDual"}
  - {class: com.clust4j.algo.preprocess.StandardScaler, method: checkFit, match: "()", note: "StandardScaler.checkFit"}
  - {class: com.clust4j.algo.DBSCAN, method: getEps, match: "()", note: "DBSCAN.getEps"}
  - {class: com.clust4j.algo.preprocess.StandardScaler, method: fit, match: "(RealMatrix data)", note: "StandardScaler.fit"}
  - {class: com.clust4j.algo.DBSCAN, method: getLabels, match: "()", note: "DBSCAN.getLabels"}
  - {class: com.clust4j.algo.preprocess.WeightTransformer, method: checkFit, match: "()", note: "WeightTransformer.checkFit"}
  - {class: com.clust4j.algo.DBSCANParameters, method: fitNewModel, match: "(RealMatrix data)", note: "DBSCANParameters.fitNewModel"}
  - {class: com.clust4j.algo.preprocess.WeightTransformer, method: inverseTransform, match: "(RealMatrix data)", note: "WeightTransformer.inverseTransform"}
  - {class: com.clust4j.algo.DBSCANParameters, method: getEps, match: "()", note: "DBSCANParameters.getEps"}
  - {class: com.clust4j.algo.preprocess.YeoJohnsonTransformer, method: estimateShifts, match: "(double[][] x)", note: "YeoJohnsonTransformer.estimateShifts"}
  - {class: com.clust4j.algo.HDBSCAN, method: initTree, match: "(HDBSCAN h)", note: "HDBSCAN.initTree"}
  - {class: com.clust4j.algo.preprocess.YeoJohnsonTransformer, method: fit, match: "(RealMatrix X)", note: "YeoJohnsonTransformer.fit"}
  - {class: com.clust4j.algo.HDBSCAN, method: isValidMetric, match: "(GeometricallySeparable g)", note: "HDBSCAN.isValidMetric"}
  - {class: com.clust4j.algo.preprocess.impute.BootstrapImputation, method: getSeed, match: "()", note: "BootstrapImputation.getSeed"}
  - {class: com.clust4j.algo.HDBSCANParameters, method: fitNewModel, match: "(RealMatrix data)", note: "HDBSCANParameters.fitNewModel"}
  - {class: com.clust4j.algo.preprocess.impute.BootstrapImputation, method: getVerbose, match: "()", note: "BootstrapImputation.getVerbose"}
  - {class: com.clust4j.algo.HDBSCANParameters, method: getAlgo, match: "()", note: "HDBSCANParameters.getAlgo"}
  - {class: com.clust4j.algo.preprocess.impute.MeanImputation, method: getSeed, match: "()", note: "MeanImputation.getSeed"}
  - {class: com.clust4j.algo.HierarchicalAgglomerative, method: buildTree, match: "(HierarchicalAgglomerative h)", note: "HierarchicalAgglomerative.buildTree"}
  - {class: com.clust4j.algo.preprocess.impute.MeanImputation, method: getVerbose, match: "()", note: "MeanImputation.getVerbose"}
