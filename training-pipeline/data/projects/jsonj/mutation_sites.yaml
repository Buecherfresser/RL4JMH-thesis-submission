# Curated performance-mutation sites for jsonj (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jsonj --source data/external-src/<checkout> \
#       --sites data/projects/jsonj/mutation_sites.yaml

package_root: com.github.jsonj

sites:
  - {class: com.github.jsonj.JsonArray, method: addObject, match: "(Object o)", note: "JsonArray.addObject"}
  - {class: com.github.jsonj.assertions.JsonArrayAssert, method: hasSize, match: "(int i)", note: "JsonArrayAssert.hasSize"}
  - {class: com.github.jsonj.bson.BsonParser, method: parse, match: "(InputStream is)", note: "BsonParser.parse"}
  - {class: com.github.jsonj.hocon.HoconParser, method: factory, match: "()", note: "HoconParser.factory"}
  - {class: com.github.jsonj.plist.JsonJPlistParser, method: parse, match: "(InputStream is) throws IOException", note: "JsonJPlistParser.parse"}
  - {class: com.github.jsonj.toml.TomlParser, method: parse, match: "(Reader input)", note: "TomlParser.parse"}
  - {class: com.github.jsonj.tools.JsonBuilder, method: putArray, match: "(String key, String... values)", note: "JsonBuilder.putArray"}
  - {class: com.github.jsonj.yaml.YamlParser, method: factory, match: "()", note: "YamlParser.factory"}
  - {class: com.github.jsonj.JsonArray, method: filter, match: "(@Nonnull Predicate<JsonElement> p)", note: "JsonArray.filter"}
  - {class: com.github.jsonj.assertions.JsonArrayAssert, method: isNotEmpty, match: "()", note: "JsonArrayAssert.isNotEmpty"}
  - {class: com.github.jsonj.bson.BsonParser, method: parse, match: "(String s)", note: "BsonParser.parse"}
  - {class: com.github.jsonj.plist.JsonJPlistParser, method: parse, match: "(byte[] bytes)", note: "JsonJPlistParser.parse"}
  - {class: com.github.jsonj.toml.TomlParser, method: parse, match: "(InputStream input)", note: "TomlParser.parse"}
  - {class: com.github.jsonj.tools.JsonBuilder, method: putArray, match: "(String key, @Nonnull Number... values)", note: "JsonBuilder.putArray"}
  - {class: com.github.jsonj.yaml.YamlSerializer, method: serialize, match: "(OutputStream out, JsonElement e)", note: "YamlSerializer.serialize"}
  - {class: com.github.jsonj.JsonSet, method: deepClone, match: "()", note: "JsonSet.deepClone"}
  - {class: com.github.jsonj.assertions.JsonSetAssert, method: shouldContain, match: "(Object...elements)", note: "JsonSetAssert.shouldContain"}
  - {class: com.github.jsonj.bson.BsonSerializer, method: serialize, match: "(JsonElement element, OutputStream out) throws IOException", note: "BsonSerializer.serialize"}
  - {class: com.github.jsonj.plist.JsonJPlistSerializer, method: serialize, match: "(JsonElement e, OutputStream out) throws IOException", note: "JsonJPlistSerializer.serialize"}
  - {class: com.github.jsonj.tools.JsonParser, method: useEfficientStringBasedJsonObject, match: "()", note: "JsonParser.useEfficientStringBasedJsonObject"}
  - {class: com.github.jsonj.yaml.YamlSerializer, method: serialize, match: "(Writer w, JsonElement e)", note: "YamlSerializer.serialize"}
  - {class: com.github.jsonj.JsonSet, method: addAll, match: "(@SuppressWarnings(\"rawtypes\") Collection c)", note: "JsonSet.addAll"}
  - {class: com.github.jsonj.assertions.JsonSetAssert, method: hasSize, match: "(int i)", note: "JsonSetAssert.hasSize"}
  - {class: com.github.jsonj.plist.JsonJPlistSerializer, method: toNsObject, match: "(JsonElement e)", note: "JsonJPlistSerializer.toNsObject"}
  - {class: com.github.jsonj.tools.JsonParser, method: parse, match: "(final String s)", note: "JsonParser.parse"}
  - {class: com.github.jsonj.MapBasedJsonObject, method: createNew, match: "()", note: "MapBasedJsonObject.createNew"}
  - {class: com.github.jsonj.assertions.JsonElementAssert, method: isObject, match: "()", note: "JsonElementAssert.isObject"}
  - {class: com.github.jsonj.tools.GeoJsonSupport, method: point, match: "(double latitude, double longitude)", note: "GeoJsonSupport.point"}
  - {class: com.github.jsonj.MapBasedJsonObject, method: asObject, match: "()", note: "MapBasedJsonObject.asObject"}
  - {class: com.github.jsonj.assertions.JsonElementAssert, method: isArray, match: "()", note: "JsonElementAssert.isArray"}
  - {class: com.github.jsonj.tools.GeoJsonSupport, method: toJsonJPoint, match: "(@Nonnull double[] coordinates)", note: "GeoJsonSupport.toJsonJPoint"}
  - {class: com.github.jsonj.SimpleIntKeyMap, method: makeImmutable, match: "()", note: "SimpleIntKeyMap.makeImmutable"}
  - {class: com.github.jsonj.assertions.JsonJAssertions, method: assertThat, match: "(JsonPrimitive primitive)", note: "JsonJAssertions.assertThat"}
  - {class: com.github.jsonj.tools.JacksonHandler, method: parseContent, match: "(com.fasterxml.jackson.core.JsonParser parser, JsonjSettings settings) throws IOException, com.fasterxml.jackson.core.JsonParseException", note: "JacksonHandler.parseContent"}
  - {class: com.github.jsonj.SimpleIntKeyMap, method: isMutable, match: "()", note: "SimpleIntKeyMap.isMutable"}
  - {class: com.github.jsonj.assertions.JsonJAssertions, method: assertThat, match: "(JsonObject object)", note: "JsonJAssertions.assertThat"}
  - {class: com.github.jsonj.tools.JsonHandler, method: startObjectEntry, match: "(final String entry)", note: "JsonHandler.startObjectEntry"}
  - {class: com.github.jsonj.SimpleIntMapJsonObject, method: createNew, match: "()", note: "SimpleIntMapJsonObject.createNew"}
  - {class: com.github.jsonj.assertions.JsonObjectAssert, method: hasFields, match: "(String...fields)", note: "JsonObjectAssert.hasFields"}
  - {class: com.github.jsonj.tools.JsonHandler, method: startObject, match: "()", note: "JsonHandler.startObject"}
  - {class: com.github.jsonj.SimpleIntMapJsonObject, method: useIdHashCodeStrategy, match: "(@Nonnull String fieldName)", note: "SimpleIntMapJsonObject.useIdHashCodeStrategy"}
  - {class: com.github.jsonj.assertions.JsonObjectAssert, method: hasNoFields, match: "(String...fields)", note: "JsonObjectAssert.hasNoFields"}
  - {class: com.github.jsonj.tools.JsonSerializer, method: serialize, match: "(@Nonnull JsonElement json)", note: "JsonSerializer.serialize"}
  - {class: com.github.jsonj.SimpleStringKeyMap, method: makeImmutable, match: "()", note: "SimpleStringKeyMap.makeImmutable"}
  - {class: com.github.jsonj.assertions.JsonPrimitiveAssert, method: isEqualTo, match: "(Object o)", note: "JsonPrimitiveAssert.isEqualTo"}
  - {class: com.github.jsonj.tools.JsonSerializer, method: serialize, match: "(@Nonnull  JsonElement json, @Nonnull OutputStream out)", note: "JsonSerializer.serialize"}
  - {class: com.github.jsonj.SimpleStringKeyMap, method: isMutable, match: "()", note: "SimpleStringKeyMap.isMutable"}
  - {class: com.github.jsonj.assertions.JsonPrimitiveAssert, method: isNotEqualTo, match: "(Object o)", note: "JsonPrimitiveAssert.isNotEqualTo"}
  - {class: com.github.jsonj.tools.JsonXmlConverter, method: getW3cDocument, match: "(JsonElement value)", note: "JsonXmlConverter.getW3cDocument"}
  - {class: com.github.jsonj.JacksonObjectDeserializer, method: deserialize, match: "(JsonParser p, DeserializationContext ctxt) throws IOException, JsonProcessingException", note: "JacksonObjectDeserializer.deserialize"}
