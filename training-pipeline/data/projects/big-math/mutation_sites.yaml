# Curated performance-mutation sites for big-math (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants big-math --source data/external-src/<checkout> \
#       --sites data/projects/big-math/mutation_sites.yaml

package_root: ch.obermuhlner.math.big

