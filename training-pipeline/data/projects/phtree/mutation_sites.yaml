  - {class: ch.ethz.globis.phtree.util.unsynced.LongArrayPool, method: create, match: "(int maxArraySize, int maxArrayCount)", note: "LongArrayPool.create"}
  - {class: ch.ethz.globis.phtree.util.unsynced.ObjectArrayPool, method: create, match: "()", note: "ObjectArrayPool.create"}
