# Curated performance-mutation sites for cbor-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants cbor-java --source data/external-src/<checkout> \
#       --sites data/projects/cbor-java/mutation_sites.yaml

package_root: co.nstant.in

sites:
  - {class: co.nstant.in.cbor.CborBuilder, method: reset, match: "()", note: "CborBuilder.reset"}
  - {class: co.nstant.in.cbor.CborBuilder, method: build, match: "()", note: "CborBuilder.build"}
  - {class: co.nstant.in.cbor.CborBuilder, method: startByteString, match: "()", note: "CborBuilder.startByteString"}
  - {class: co.nstant.in.cbor.CborDecoder, method: decodeNext, match: "() throws CborException", note: "CborDecoder.decodeNext"}
  - {class: co.nstant.in.cbor.CborDecoder, method: isAutoDecodeInfinitiveArrays, match: "()", note: "CborDecoder.isAutoDecodeInfinitiveArrays"}
  - {class: co.nstant.in.cbor.CborDecoder, method: setAutoDecodeInfinitiveArrays, match: "(boolean autoDecodeInfinitiveArrays)", note: "CborDecoder.setAutoDecodeInfinitiveArrays"}
  - {class: co.nstant.in.cbor.CborEncoder, method: isCanonical, match: "()", note: "CborEncoder.isCanonical"}
  - {class: co.nstant.in.cbor.CborEncoder, method: nonCanonical, match: "()", note: "CborEncoder.nonCanonical"}
  - {class: co.nstant.in.cbor.CborEncoder, method: encodeToBytes, match: "(List<DataItem> dataItems)", note: "CborEncoder.encodeToBytes"}
  - {class: co.nstant.in.cbor.CborOutputStream, method: isCanonical, match: "()", note: "CborOutputStream.isCanonical"}
  - {class: co.nstant.in.cbor.CborOutputStream, method: setCanonical, match: "(boolean canonical)", note: "CborOutputStream.setCanonical"}
  - {class: co.nstant.in.cbor.CborOutputStream, method: writeDataItem, match: "(DataItem dataItem) throws IOException", note: "CborOutputStream.writeDataItem"}
  - {class: co.nstant.in.cbor.builder.ArrayBuilder, method: tagged, match: "(long tag)", note: "ArrayBuilder.tagged"}
  - {class: co.nstant.in.cbor.builder.ArrayBuilder, method: addArray, match: "()", note: "ArrayBuilder.addArray"}
  - {class: co.nstant.in.cbor.builder.ArrayBuilder, method: startArray, match: "()", note: "ArrayBuilder.startArray"}
  - {class: co.nstant.in.cbor.builder.ByteStringBuilder, method: end, match: "()", note: "ByteStringBuilder.end"}
  - {class: co.nstant.in.cbor.builder.MapBuilder, method: putArray, match: "(DataItem key)", note: "MapBuilder.putArray"}
  - {class: co.nstant.in.cbor.builder.MapBuilder, method: putArray, match: "(long key)", note: "MapBuilder.putArray"}
  - {class: co.nstant.in.cbor.builder.MapBuilder, method: putArray, match: "(String key)", note: "MapBuilder.putArray"}
  - {class: co.nstant.in.cbor.builder.MapEntryBuilder, method: value, match: "(boolean value)", note: "MapEntryBuilder.value"}
  - {class: co.nstant.in.cbor.builder.MapEntryBuilder, method: value, match: "(byte[] value)", note: "MapEntryBuilder.value"}
  - {class: co.nstant.in.cbor.builder.MapEntryBuilder, method: value, match: "(double value)", note: "MapEntryBuilder.value"}
  - {class: co.nstant.in.cbor.builder.UnicodeStringBuilder, method: end, match: "()", note: "UnicodeStringBuilder.end"}
  - {class: co.nstant.in.cbor.model.Array, method: getDataItems, match: "()", note: "Array.getDataItems"}
  - {class: co.nstant.in.cbor.model.Array, method: peekLast, match: "()", note: "Array.peekLast"}
