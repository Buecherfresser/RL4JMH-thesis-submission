# Curated performance-mutation sites for jtk (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jtk --source data/external-src/<checkout> \
#       --sites data/projects/jtk/mutation_sites.yaml

package_root: edu.mines.jtk

sites:
  - {class: edu.mines.jtk.awt.ColorMap, method: getMinValue, match: "()", note: "ColorMap.getMinValue"}
  - {class: edu.mines.jtk.bench.ArrayFileBench, method: main, match: "(String[] args)", note: "ArrayFileBench.main"}
  - {class: edu.mines.jtk.dsp.FilterBuffer2, method: setArray, match: "(float[][] a)", note: "FilterBuffer2.setArray"}
  - {class: edu.mines.jtk.interp.BicubicInterpolator2, method: interpolate, match: "(float x1, float x2)", note: "BicubicInterpolator2.interpolate"}
  - {class: edu.mines.jtk.io.ArrayFile, method: getByteOrderRead, match: "()", note: "ArrayFile.getByteOrderRead"}
  - {class: edu.mines.jtk.la.DMatrix, method: getM, match: "()", note: "DMatrix.getM"}
  - {class: edu.mines.jtk.lapack.DMatrix, method: getM, match: "()", note: "DMatrix.getM"}
  - {class: edu.mines.jtk.mesh.Geometry, method: leftOfLine, match: "(", note: "Geometry.leftOfLine"}
  - {class: edu.mines.jtk.mosaic.AxisScale, method: isLinear, match: "()", note: "AxisScale.isLinear"}
  - {class: edu.mines.jtk.ogl.GlDisplayList, method: list, match: "()", note: "GlDisplayList.list"}
  - {class: edu.mines.jtk.opt.ArrayVect1, method: init, match: "(final double[] data, final double variance)", note: "ArrayVect1.init"}
  - {class: edu.mines.jtk.sgl.ArrayStack, method: push, match: "(E e)", note: "ArrayStack.push"}
  - {class: edu.mines.jtk.util.ArgsParser, method: getOptions, match: "()", note: "ArgsParser.getOptions"}
  - {class: edu.mines.jtk.awt.ColorMap, method: getMaxValue, match: "()", note: "ColorMap.getMaxValue"}
  - {class: edu.mines.jtk.bench.ArrayListBench, method: trim, match: "()", note: "ArrayListBench.trim"}
  - {class: edu.mines.jtk.dsp.FilterBuffer2, method: setExtrapolation, match: "(Extrapolation extrapolation)", note: "FilterBuffer2.setExtrapolation"}
  - {class: edu.mines.jtk.interp.BicubicInterpolator2, method: interpolate00, match: "(float x1, float x2)", note: "BicubicInterpolator2.interpolate00"}
  - {class: edu.mines.jtk.io.ArrayFile, method: getByteOrderWrite, match: "()", note: "ArrayFile.getByteOrderWrite"}
