  - {class: com.backblaze.erasure.Galois, method: allPossiblePolynomials, match: "()", note: "Galois.allPossiblePolynomials"}
  - {class: com.backblaze.erasure.InputByteOutputExpCodingLoop, method: codeSomeShards, match: "(", note: "InputByteOutputExpCodingLoop.codeSomeShards"}
  - {class: com.backblaze.erasure.InputByteOutputTableCodingLoop, method: codeSomeShards, match: "(", note: "InputByteOutputTableCodingLoop.codeSomeShards"}
  - {class: com.backblaze.erasure.InputOutputByteExpCodingLoop, method: codeSomeShards, match: "(", note: "InputOutputByteExpCodingLoop.codeSomeShards"}
  - {class: com.backblaze.erasure.InputOutputByteTableCodingLoop, method: codeSomeShards, match: "(", note: "InputOutputByteTableCodingLoop.codeSomeShards"}
