  - {class: software.coley.cafedude.tree.ExceptionHandler, method: getEnd, match: "()", note: "ExceptionHandler.getEnd"}
  - {class: software.coley.cafedude.classfile.instruction.MultiANewArrayInstruction, method: getDimensions, match: "()", note: "MultiANewArrayInstruction.getDimensions"}
  - {class: software.coley.cafedude.io.AttributeHolderType, method: fromAnnotationTargetType, match: "(int targetType)", note: "AttributeHolderType.fromAnnotationTargetType"}
