  - {class: org.multiverse.api.functions.Functions, method: call, match: "(long current)", note: "Functions.call"}
  - {class: org.multiverse.api.StmUtils, method: atomic, match: "(TxnIntCallable callable)", note: "StmUtils.atomic"}
  - {class: org.multiverse.api.functions.Functions, method: call, match: "(Object value)", note: "Functions.call"}
