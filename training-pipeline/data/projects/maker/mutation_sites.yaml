# Curated performance-mutation sites for maker (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants maker --source data/external-src/<checkout> \
#       --sites data/projects/maker/mutation_sites.yaml

package_root: org.cojen.maker

sites:
  - {class: org.cojen.maker.AnnotatableType, method: name, match: "()", note: "AnnotatableType.name"}
  - {class: org.cojen.maker.AnnotatableType, method: descriptor, match: "()", note: "AnnotatableType.descriptor"}
  - {class: org.cojen.maker.AnnotatableType, method: classType, match: "()", note: "AnnotatableType.classType"}
  - {class: org.cojen.maker.AnnotatableType, method: isPrimitive, match: "()", note: "AnnotatableType.isPrimitive"}
  - {class: org.cojen.maker.AnnotatableType, method: isInterface, match: "()", note: "AnnotatableType.isInterface"}
  - {class: org.cojen.maker.AnnotatableType, method: isArray, match: "()", note: "AnnotatableType.isArray"}
  - {class: org.cojen.maker.AnnotatableType, method: elementType, match: "()", note: "AnnotatableType.elementType"}
  - {class: org.cojen.maker.AnnotatableType, method: asArray, match: "()", note: "AnnotatableType.asArray"}
  - {class: org.cojen.maker.AnnotatableType, method: box, match: "()", note: "AnnotatableType.box"}
  - {class: org.cojen.maker.AnnotatableType, method: unbox, match: "()", note: "AnnotatableType.unbox"}
  - {class: org.cojen.maker.AnnotatableType, method: annotatable, match: "()", note: "AnnotatableType.annotatable"}
  - {class: org.cojen.maker.AnnotatableType, method: addAnnotation, match: "(Object annotationType, boolean visible)", note: "AnnotatableType.addAnnotation"}
  - {class: org.cojen.maker.AnnotatableType, method: freeze, match: "()", note: "AnnotatableType.freeze"}
  - {class: org.cojen.maker.AnnotatableType, method: unannotated, match: "()", note: "AnnotatableType.unannotated"}
  - {class: org.cojen.maker.AnnotatableType, method: newAnnotation, match: "(Object annotationType)", note: "AnnotatableType.newAnnotation"}
  - {class: org.cojen.maker.BytesOut, method: size, match: "()", note: "BytesOut.size"}
  - {class: org.cojen.maker.BytesOut, method: writeShort, match: "(int v) throws IOException", note: "BytesOut.writeShort"}
  - {class: org.cojen.maker.BytesOut, method: writeInt, match: "(int v) throws IOException", note: "BytesOut.writeInt"}
  - {class: org.cojen.maker.BytesOut, method: writeLong, match: "(long v) throws IOException", note: "BytesOut.writeLong"}
  - {class: org.cojen.maker.BytesOut, method: writeFloat, match: "(float v) throws IOException", note: "BytesOut.writeFloat"}
  - {class: org.cojen.maker.BytesOut, method: writeDouble, match: "(double v) throws IOException", note: "BytesOut.writeDouble"}
  - {class: org.cojen.maker.BytesOut, method: writeUTF, match: "(String str) throws IOException", note: "BytesOut.writeUTF"}
  - {class: org.cojen.maker.BytesOut, method: checkUTF, match: "(String str)", note: "BytesOut.checkUTF"}
  - {class: org.cojen.maker.BytesOut, method: toByteArray, match: "()", note: "BytesOut.toByteArray"}
  - {class: org.cojen.maker.ClassInjector, method: loadClass, match: "(String name) throws ClassNotFoundException", note: "ClassInjector.loadClass"}
  - {class: org.cojen.maker.ClassInjector, method: loadClass, match: "(String name, boolean resolve) throws ClassNotFoundException", note: "ClassInjector.loadClass"}
  - {class: org.cojen.maker.ExternalType, method: classType, match: "()", note: "ExternalType.classType"}
  - {class: org.cojen.maker.ExternalType, method: classMaker, match: "()", note: "ExternalType.classMaker"}
  - {class: org.cojen.maker.ExternalType, method: addAnnotation, match: "(Object annotationType, boolean visible)", note: "ExternalType.addAnnotation"}
  - {class: org.cojen.maker.ExternalType, method: newAnnotation, match: "(Object annotationType)", note: "ExternalType.newAnnotation"}
  - {class: org.cojen.maker.ExternalType, method: addAttribute, match: "(String name, Object value)", note: "ExternalType.addAttribute"}
  - {class: org.cojen.maker.ExternalType, method: another, match: "(String className)", note: "ExternalType.another"}
  - {class: org.cojen.maker.ExternalType, method: public_, match: "()", note: "ExternalType.public_"}
  - {class: org.cojen.maker.ExternalType, method: private_, match: "()", note: "ExternalType.private_"}
  - {class: org.cojen.maker.ExternalType, method: protected_, match: "()", note: "ExternalType.protected_"}
  - {class: org.cojen.maker.ExternalType, method: static_, match: "()", note: "ExternalType.static_"}
  - {class: org.cojen.maker.ExternalType, method: final_, match: "()", note: "ExternalType.final_"}
  - {class: org.cojen.maker.ExternalType, method: interface_, match: "()", note: "ExternalType.interface_"}
  - {class: org.cojen.maker.ExternalType, method: abstract_, match: "()", note: "ExternalType.abstract_"}
  - {class: org.cojen.maker.ExternalType, method: synthetic, match: "()", note: "ExternalType.synthetic"}
  - {class: org.cojen.maker.ExternalType, method: enum_, match: "()", note: "ExternalType.enum_"}
  - {class: org.cojen.maker.ExternalType, method: annotation, match: "()", note: "ExternalType.annotation"}
  - {class: org.cojen.maker.ExternalType, method: extend, match: "(Object superClass)", note: "ExternalType.extend"}
  - {class: org.cojen.maker.ExternalType, method: implement, match: "(Object iface)", note: "ExternalType.implement"}
  - {class: org.cojen.maker.ExternalType, method: signature, match: "(Object... components)", note: "ExternalType.signature"}
  - {class: org.cojen.maker.ExternalType, method: permitSubclass, match: "(Object subclass)", note: "ExternalType.permitSubclass"}
  - {class: org.cojen.maker.ExternalType, method: addField, match: "(Object otype, String name)", note: "ExternalType.addField"}
  - {class: org.cojen.maker.ExternalType, method: addMethod, match: "(Object oretType, String name, Object... oparamTypes)", note: "ExternalType.addMethod"}
  - {class: org.cojen.maker.ExternalType, method: addConstructor, match: "(Object... paramTypes)", note: "ExternalType.addConstructor"}
  - {class: org.cojen.maker.ExternalType, method: addClinit, match: "()", note: "ExternalType.addClinit"}
