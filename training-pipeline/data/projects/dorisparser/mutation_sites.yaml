# Curated performance-mutation sites for dorisparser (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants dorisparser --source data/external-src/<checkout> \
#       --sites data/projects/dorisparser/mutation_sites.yaml

package_root: com.lfsenior.sql

sites:
  - {class: com.lfsenior.sql.parser.clickhouse.antlr4.ClickHouseParser, method: getTokenNames, match: "()", note: "ClickHouseParser.getTokenNames"}
  - {class: com.lfsenior.sql.parser.clickhouse.antlr4.ClickHouseParser, method: getVocabulary, match: "()", note: "ClickHouseParser.getVocabulary"}
  - {class: com.lfsenior.sql.parser.doris.analysis.RangePartitionDesc, method: getSingleRangePartitionDescs, match: "()", note: "RangePartitionDesc.getSingleRangePartitionDescs"}
  - {class: com.lfsenior.sql.parser.doris.analysis.RangePartitionDesc, method: getPartitionColNames, match: "()", note: "RangePartitionDesc.getPartitionColNames"}
  - {class: com.lfsenior.sql.parser.doris.analysis.SingleRangePartitionDesc, method: isSetIfNotExists, match: "()", note: "SingleRangePartitionDesc.isSetIfNotExists"}
  - {class: com.lfsenior.sql.parser.doris.analysis.SingleRangePartitionDesc, method: getPartitionName, match: "()", note: "SingleRangePartitionDesc.getPartitionName"}
  - {class: com.lfsenior.sql.parser.doris.analysis.SqlParser, method: production_table, match: "()", note: "SqlParser.production_table"}
  - {class: com.lfsenior.sql.parser.doris.analysis.SqlParser, method: action_table, match: "()", note: "SqlParser.action_table"}
  - {class: com.lfsenior.sql.parser.doris.catalog.ArrayType, method: getItemType, match: "()", note: "ArrayType.getItemType"}
  - {class: com.lfsenior.sql.parser.doris.catalog.ArrayType, method: toSql, match: "(int depth)", note: "ArrayType.toSql"}
  - {class: com.lfsenior.sql.parser.doris.catalog.MapType, method: toSql, match: "(int depth)", note: "MapType.toSql"}
  - {class: com.lfsenior.sql.parser.doris.common.util.SqlParserUtils, method: getFirstStmt, match: "(SqlParser parser) throws Exception", note: "SqlParserUtils.getFirstStmt"}
  - {class: com.lfsenior.sql.parser.doris.common.util.SqlParserUtils, method: getStmt, match: "(SqlParser parser, int idx) throws Exception", note: "SqlParserUtils.getStmt"}
  - {class: com.lfsenior.sql.parser.doris.common.util.SqlUtils, method: escapeUnquote, match: "(String ident)", note: "SqlUtils.escapeUnquote"}
  - {class: com.lfsenior.sql.parser.doris.common.util.SqlUtils, method: getIdentSql, match: "(String ident)", note: "SqlUtils.getIdentSql"}
  - {class: com.lfsenior.sql.parser.clickhouse.antlr4.ClickHouseLexer, method: getTokenNames, match: "()", note: "ClickHouseLexer.getTokenNames"}
  - {class: com.lfsenior.sql.parser.clickhouse.antlr4.ClickHouseLexer, method: getVocabulary, match: "()", note: "ClickHouseLexer.getVocabulary"}
  - {class: com.lfsenior.sql.parser.clickhouse.antlr4.Dictionary, method: insert, match: "(T t)", note: "Dictionary.insert"}
  - {class: com.lfsenior.sql.parser.doris.analysis.AddColumnClause, method: getProperties, match: "()", note: "AddColumnClause.getProperties"}
  - {class: com.lfsenior.sql.parser.doris.analysis.AddColumnClause, method: toSql, match: "()", note: "AddColumnClause.toSql"}
  - {class: com.lfsenior.sql.parser.doris.analysis.AddColumnsClause, method: getRollupName, match: "()", note: "AddColumnsClause.getRollupName"}
