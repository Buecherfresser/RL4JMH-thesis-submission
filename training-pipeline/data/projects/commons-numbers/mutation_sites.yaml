# Curated performance-mutation sites for commons-numbers (GRPO RL corpus).
#
# Hand-picked from good_classes.yaml: concrete classes and hot ~once-per-call public
# methods (encode/decode/hash/aggregate/set-algebra kernels) that a JMH benchmark drives
# once per invocation. Several methods per class => ``killed / in-class mutants`` rewards
# benchmark coverage of the subject's core operations.
#
# Regenerate with:
#   jmh-make-mutants commons-numbers --source data/external-src/commons-numbers-merged \
#       --sites data/projects/commons-numbers/mutation_sites.yaml

package_root: org.apache.commons.numbers

sites:
  - {class: org.apache.commons.numbers.core.Precision, method: compareTo, match: "(double x, double y, double eps)", note: "Precision.compareTo"}
  - {class: org.apache.commons.numbers.core.Precision, method: equalsIncludingNaN, match: "(float x, float y)", note: "Precision.equalsIncludingNaN"}
  - {class: org.apache.commons.numbers.core.Precision, method: equalsWithRelativeTolerance, match: "(double x, double y, double eps)", note: "Precision.equalsWithRelativeTolerance"}
  - {class: org.apache.commons.numbers.core.ArithmeticUtils, method: gcd, match: "(int p, int q)", note: "ArithmeticUtils.gcd"}
  - {class: org.apache.commons.numbers.core.ArithmeticUtils, method: lcm, match: "(int a, int b)", note: "ArithmeticUtils.lcm"}
  - {class: org.apache.commons.numbers.core.ArithmeticUtils, method: pow, match: "(final int k, final int e)", note: "ArithmeticUtils.pow"}
  - {class: org.apache.commons.numbers.core.Sum, method: subtract, match: "(final Sum other)", note: "Sum.subtract"}
  - {class: org.apache.commons.numbers.core.Sum, method: addProduct, match: "(final double a, final double b)", note: "Sum.addProduct"}
  - {class: org.apache.commons.numbers.core.Sum, method: addProducts, match: "(final double[] a, final double[] b)", note: "Sum.addProducts"}
  - {class: org.apache.commons.numbers.fraction.Fraction, method: abs, match: "()", note: "Fraction.abs"}
  - {class: org.apache.commons.numbers.fraction.Fraction, method: compareTo, match: "(Fraction other)", note: "Fraction.compareTo"}
  - {class: org.apache.commons.numbers.fraction.Fraction, method: divide, match: "(final int value)", note: "Fraction.divide"}
  - {class: org.apache.commons.numbers.fraction.BigFraction, method: abs, match: "()", note: "BigFraction.abs"}
  - {class: org.apache.commons.numbers.fraction.BigFraction, method: compareTo, match: "(final BigFraction other)", note: "BigFraction.compareTo"}
  - {class: org.apache.commons.numbers.fraction.BigFraction, method: divide, match: "(final int value)", note: "BigFraction.divide"}
  - {class: org.apache.commons.numbers.gamma.Gamma, method: value, match: "(final double x)", note: "Gamma.value"}
  - {class: org.apache.commons.numbers.gamma.LogGamma, method: value, match: "(double x)", note: "LogGamma.value"}
  - {class: org.apache.commons.numbers.gamma.Erf, method: value, match: "(double x)", note: "Erf.value"}
  - {class: org.apache.commons.numbers.gamma.Erfc, method: value, match: "(double x)", note: "Erfc.value"}
  - {class: org.apache.commons.numbers.gamma.Beta, method: value, match: "(double a, double b)", note: "Beta.value"}
  - {class: org.apache.commons.numbers.gamma.LogBeta, method: value, match: "(double p, double q)", note: "LogBeta.value"}
  - {class: org.apache.commons.numbers.gamma.RegularizedGamma, method: value, match: "(double a, double x)", note: "RegularizedGamma.value"}
  - {class: org.apache.commons.numbers.gamma.RegularizedGamma, method: derivative, match: "(double a, double x)", note: "RegularizedGamma.derivative"}
  - {class: org.apache.commons.numbers.combinatorics.BinomialCoefficient, method: value, match: "(int n, int k)", note: "BinomialCoefficient.value"}
  - {class: org.apache.commons.numbers.combinatorics.BinomialCoefficientDouble, method: value, match: "(int n, int k)", note: "BinomialCoefficientDouble.value"}
  - {class: org.apache.commons.numbers.combinatorics.Factorial, method: value, match: "(int n)", note: "Factorial.value"}
  - {class: org.apache.commons.numbers.combinatorics.Factorial, method: doubleValue, match: "(int n)", note: "Factorial.doubleValue"}
  - {class: org.apache.commons.numbers.combinatorics.FactorialDouble, method: value, match: "(int n)", note: "FactorialDouble.value"}
  - {class: org.apache.commons.numbers.combinatorics.LogFactorial, method: value, match: "(int n)", note: "LogFactorial.value"}
  - {class: org.apache.commons.numbers.combinatorics.LogBinomialCoefficient, method: value, match: "(int n, int k)", note: "LogBinomialCoefficient.value"}
  - {class: org.apache.commons.numbers.complex.Complex, method: abs, match: "()", note: "Complex.abs"}
  - {class: org.apache.commons.numbers.complex.Complex, method: divide, match: "(Complex divisor)", note: "Complex.divide"}
  - {class: org.apache.commons.numbers.complex.Complex, method: exp, match: "()", note: "Complex.exp"}
  - {class: org.apache.commons.numbers.primes.Primes, method: nextPrime, match: "(int n)", note: "Primes.nextPrime"}
  - {class: org.apache.commons.numbers.primes.Primes, method: primeFactors, match: "(int n)", note: "Primes.primeFactors"}
  - {class: org.apache.commons.numbers.angle.CosAngle, method: value, match: "(double[] v1, double[] v2)", note: "CosAngle.value"}
  - {class: org.apache.commons.numbers.angle.Reduce, method: applyAsDouble, match: "(double x)", note: "Reduce.applyAsDouble"}
  - {class: org.apache.commons.numbers.complex.Complex, method: log, match: "()", note: "Complex.log"}
  - {class: org.apache.commons.numbers.complex.Complex, method: multiply, match: "(Complex factor)", note: "Complex.multiply"}
  - {class: org.apache.commons.numbers.complex.Complex, method: negate, match: "()", note: "Complex.negate"}
  - {class: org.apache.commons.numbers.complex.Complex, method: parse, match: "(String s)", note: "Complex.parse"}
  - {class: org.apache.commons.numbers.complex.Complex, method: pow, match: "(Complex x)", note: "Complex.pow"}
  - {class: org.apache.commons.numbers.complex.Complex, method: sqrt, match: "()", note: "Complex.sqrt"}
  - {class: org.apache.commons.numbers.complex.Complex, method: subtract, match: "(Complex subtrahend)", note: "Complex.subtract"}
  - {class: org.apache.commons.numbers.core.Precision, method: round, match: "(double x, int scale)", note: "Precision.round"}
  - {class: org.apache.commons.numbers.fraction.BigFraction, method: multiply, match: "(final int value)", note: "BigFraction.multiply"}
  - {class: org.apache.commons.numbers.fraction.BigFraction, method: negate, match: "()", note: "BigFraction.negate"}
  - {class: org.apache.commons.numbers.fraction.BigFraction, method: parse, match: "(String s)", note: "BigFraction.parse"}
  - {class: org.apache.commons.numbers.fraction.BigFraction, method: pow, match: "(final int exponent)", note: "BigFraction.pow"}
  - {class: org.apache.commons.numbers.fraction.BigFraction, method: subtract, match: "(final int value)", note: "BigFraction.subtract"}
