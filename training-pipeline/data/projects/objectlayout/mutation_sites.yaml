# Curated performance-mutation sites for objectlayout (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants objectlayout --source data/external-src/<checkout> \
#       --sites data/projects/objectlayout/mutation_sites.yaml

package_root: org.ObjectLayout

