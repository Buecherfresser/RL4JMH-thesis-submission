# Gemma 4 E2B - run 2 on the 8x RTX PRO 6000 Blackwell box: 2-GPU COLOCATE, thinking on.
#
# Derived from mutation70-gemma.yaml (run 1, LRZ 5723231). Every change below is backed by a
# measurement from run 1 or from the JMH-Bench matrix that evaluated its adapter
# (docs/evaluation-gemma-grpo-run1.md):
#
#   * completions were being truncated -- run 1 logged clipped_ratio mean 0.10, max 0.80
#     against a 4096 cap. A truncated Java class cannot compile, so part of run 1's 77 %
#     compile-failure rate was budget, not skill. -> max_completion_length 4096 -> 16384.
#   * thinking is the single biggest lever measured. On JMH-Bench the same adapter scored
#     18 % vs 10 % mutation and 34 % vs 21 % first-shot compile with thinking on vs off --
#     yet run 1 trained with it off. -> chat_template_kwargs.enable_thinking: true.
#     Gemma 4's chat template exposes only enable_thinking / preserve_thinking; there is no
#     effort or budget knob, so "maximum effort" == a completion budget large enough that the
#     model is never cut off mid-thought.
#   * run 1 was under-trained: 744 updates at LR 1e-6 with 44 % of steps yielding no gradient.
#     -> LR 3e-6. Watch entropy and completions/clipped_ratio; fall back to 2e-6 on collapse.
#
# NOT server mode: TRL's `trl vllm-serve` hangs at "Waiting for application startup" for every
# model on every cluster we have tried (training-run-failures.md 5), so colocate is the only
# proven rollout path. Colocate here means 2 data-parallel ranks, each with its own vLLM on its
# own card -- which is why gpu_memory_utilization is back and why the batch maths changes below.
# These cards have 95.6 GiB each, ~2 GiB more than the LRZ H100s, and nothing else is competing
# for them, so the 40960-token window still fits alongside vLLM.
#
# Stage 1 is one epoch. If reward trends up, extend with resume_from_checkpoint: auto rather
# than restarting -- 2 epochs at this token count is ~90-120 h, well past the 2-day QOS wall.
#
#   sbatch scripts/cluster/run-grpo-gemma-2gpu-lrz.sbatch

base_model: google/gemma-4-E2B-it
output_dir: outputs/grpo-mutation70-gemma-rtx
dataset_path: data/snippets/rl-mutation.good.jsonl
corpus: full
seed: 42

finetune_mode: lora
precision: bf16
gradient_checkpointing: true
attn_implementation: sdpa
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  exclude_modules: [vision_tower, audio_tower, multi_modal_projector]
  bias: none

learning_rate: 3.0e-6
# Global batch = per_device x num_processes x accum = 1 x 2 x 4 = 8 = group_size, so the
# gradient stays numerically identical to run 1. Note the num_processes term: under accelerate
# with 2 ranks, accum 8 would give a global batch of 16 and change the objective.
per_device_batch_size: 1
gradient_accumulation_steps: 4
group_size: 8
rollout_temperature: 1.0
top_p: 0.95
top_k: 64
max_prompt_length: 20480
max_completion_length: 16384
completion_eos_token_id: 106
# Render rollout prompts with Gemma 4's thinking channel open. parse_completion() already
# calls strip_thinking(), so the reward path is unaffected -- it still sees only the Java.
chat_template_kwargs:
  enable_thinking: true
# 48000 chars ~ 13.7k tokens, still inside max_prompt_length (20480) with room for the
# instruction template. Admits 1040 of the 1097 subjects against run 1's 744 (+40 %), and the
# ones it adds are the large complex-API classes that run 1 never got to attempt.
max_source_chars: 48000
limit_prompts: 0

kl_coeff: 0.0
epsilon: 0.2
epsilon_high: 0.28
grpo_loss_type: dr_grpo
scale_rewards: false
mask_truncated_completions: true
mu: 1

num_epochs: 1.0
num_iterations: 0
warmup_ratio: 0.03
logging_steps: 1
# Slurm caps this QOS at 2 days, which is shorter than one epoch over 1040 prompts.
# Checkpoint often so a follow-up job can resume instead of restarting.
save_steps: 25
# 'auto' = continue from the newest checkpoint-* in output_dir, or start fresh if none.
# Guards against losing hours to a crash or the 2-day wall; see training-run-failures.md.
resume_from_checkpoint: auto
report_to: none

use_vllm: true
vllm_mode: colocate
# 0.40 of 95.6 GiB = ~38 GiB for vLLM: ~11 GiB of bf16 weights plus KV for a 40960-token
# window. The trainer keeps ~57 GiB for its own copy, LoRA states and activations.
vllm_gpu_memory_utilization: 0.40
vllm_tensor_parallel_size: 1
# 65536, not 36864. The corpus is heavily skewed: median source is ~1900 tokens but the
# largest file at max_source_chars 48000 is 40939 tokens -- 1.06 chars/token, against a
# median of 3.83. Sizing the window off the median crashed run 2 at step 395/834:
#     VLLMValidationError: maximum context length is 40960 tokens.
#     However, you requested 0 output tokens and your prompt contains 41961 input tokens
# TRL >= 1.0 does NOT truncate via max_prompt_length (see the note on max_source_chars), so
# nothing clips an oversized prompt before vLLM rejects it. Worst case here is
# 40939 source + ~600 template + 16384 completion = 57923, which fits 65536 with room.
# Gemma 4 E2B's native context is 131072, so this is well within the model.
vllm_max_model_length: 65536

# MUST stay false while enable_thinking is on. TRL's correction for vLLM-vs-trainer logprob
# divergence compounds with sequence length; thinking pushes completions to ~1700 tokens and the
# ratio collapses (observed mean 6.5e-07), taking the gradient with it: grad_norm 1e-09 instead
# of ~3e-03. Measured twice -- see training-run-failures.md §9.
# Sanity check before every launch (TRL only logs sampling/importance_sampling_* when this is
# ON, so those metrics appearing in the log means this flag got lost):
#   python -c "from jmhgen.config.schema import GRPOConfig; \
#              print(GRPOConfig.from_yaml('configs/grpo/mutation70-gemma-rtx.yaml').vllm_importance_sampling_correction)"
vllm_importance_sampling_correction: false
# Frees vLLM's memory during the optimizer step. Level 1 only -- level 2 offloads weights to
# host RAM, and this box has 62 GB total.
vllm_enable_sleep_mode: true

reward_weights:
  compile: 0.10
  runtime: 0.10
  anti_pattern: 0.05
  rsd: 0.05
  mutation: 0.70
# SpotJMHBugs (Costa et al., TSE 2019) bytecode analysis, not the regex pre-screen.
# regex is only a static approximation; spotjmh is the actual detector. Requires
# vendor/spotbugs (tools/install_spotjmhbugs.sh) -- preflight_grpo.py --reward-smoke
# fails the run if the backend is missing, since r_anti would otherwise be dead weight.
anti_pattern_backend: spotjmh
need_run: true
rsd_good: 0.05
rsd_bad: 0.25

mutation:
  alpha: 0.05
  min_slowdown: 1.10
  arm_property: jmhbench.mutant
  coverage_guidance: true
  max_mutants_per_candidate: 0
  max_benchmarks_per_mutant: 6
  mode: coverage_aware
  coverage_weight: 0.30
  coverage_jmh:
    warmup_iterations: 0
    measurement_iterations: 1
    forks: 1
    warmup_time: "100ms"
    measurement_time: "100ms"
    timeout_s: 120.0
    per_iteration_timeout_s: 60.0
    fail_on_error: false

runner:
  jmh_version: "1.37"
  java_release: 17
  jmh:
    warmup_iterations: 3
    measurement_iterations: 5
    forks: 1
    warmup_time: "200ms"
    measurement_time: "200ms"
    timeout_s: 120.0
    per_iteration_timeout_s: 60.0
    fail_on_error: false

