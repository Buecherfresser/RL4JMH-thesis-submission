# Curated performance-mutation sites for threetenbp (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants threetenbp --source data/external-src/<checkout> \
#       --sites data/projects/threetenbp/mutation_sites.yaml

package_root: org.threeten.bp

sites:
  - {class: org.threeten.bp.DateTimeUtils, method: toInstant, match: "(Date utilDate)", note: "DateTimeUtils.toInstant"}
  - {class: org.threeten.bp.chrono.ChronoLocalDateTimeImpl, method: toLocalDate, match: "()", note: "ChronoLocalDateTimeImpl.toLocalDate"}
  - {class: org.threeten.bp.format.DateTimeBuilder, method: resolve, match: "(ResolverStyle resolverStyle, Set<TemporalField> resolverFields)", note: "DateTimeBuilder.resolve"}
  - {class: org.threeten.bp.jdk8.Jdk8Methods, method: requireNonNull, match: "(T value)", note: "Jdk8Methods.requireNonNull"}
  - {class: org.threeten.bp.temporal.ValueRange, method: of, match: "(long min, long max)", note: "ValueRange.of"}
  - {class: org.threeten.bp.zone.ZoneRulesBuilder, method: addWindow, match: "(", note: "ZoneRulesBuilder.addWindow"}
  - {class: org.threeten.bp.DateTimeUtils, method: toDate, match: "(Instant instant)", note: "DateTimeUtils.toDate"}
  - {class: org.threeten.bp.chrono.ChronoLocalDateTimeImpl, method: toLocalTime, match: "()", note: "ChronoLocalDateTimeImpl.toLocalTime"}
  - {class: org.threeten.bp.format.DateTimeBuilder, method: build, match: "(TemporalQuery<R> type)", note: "DateTimeBuilder.build"}
  - {class: org.threeten.bp.jdk8.Jdk8Methods, method: requireNonNull, match: "(T value, String parameterName)", note: "Jdk8Methods.requireNonNull"}
  - {class: org.threeten.bp.temporal.ValueRange, method: of, match: "(long min, long maxSmallest, long maxLargest)", note: "ValueRange.of"}
  - {class: org.threeten.bp.zone.ZoneRulesBuilder, method: addWindowForever, match: "(ZoneOffset standardOffset)", note: "ZoneRulesBuilder.addWindowForever"}
  - {class: org.threeten.bp.DayOfWeek, method: queryFrom, match: "(TemporalAccessor temporal)", note: "DayOfWeek.queryFrom"}
  - {class: org.threeten.bp.chrono.ChronoPeriodImpl, method: getUnits, match: "()", note: "ChronoPeriodImpl.getUnits"}
  - {class: org.threeten.bp.format.DateTimeFormatterBuilder, method: queryFrom, match: "(TemporalAccessor temporal)", note: "DateTimeFormatterBuilder.queryFrom"}
  - {class: org.threeten.bp.temporal.ChronoField, method: getBaseUnit, match: "()", note: "ChronoField.getBaseUnit"}
  - {class: org.threeten.bp.zone.Ser, method: writeExternal, match: "(ObjectOutput out) throws IOException", note: "Ser.writeExternal"}
