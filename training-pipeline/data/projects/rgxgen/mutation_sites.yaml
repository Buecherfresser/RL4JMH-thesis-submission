  - {class: com.github.curiousoddman.rgxgen.iterators.IndexIterator, method: reset, match: "()", note: "IndexIterator.reset"}
  - {class: com.github.curiousoddman.rgxgen.iterators.IndexIterator, method: current, match: "()", note: "IndexIterator.current"}
  - {class: com.github.curiousoddman.rgxgen.iterators.PermutationsIterator, method: reset, match: "()", note: "PermutationsIterator.reset"}
  - {class: com.github.curiousoddman.rgxgen.iterators.PermutationsIterator, method: current, match: "()", note: "PermutationsIterator.current"}
  - {class: com.github.curiousoddman.rgxgen.iterators.ReferenceIterator, method: setOther, match: "(StringIterator other)", note: "ReferenceIterator.setOther"}
  - {class: com.github.curiousoddman.rgxgen.iterators.ReferenceIterator, method: current, match: "()", note: "ReferenceIterator.current"}
  - {class: com.github.curiousoddman.rgxgen.iterators.SingleValueIterator, method: reset, match: "()", note: "SingleValueIterator.reset"}
  - {class: com.github.curiousoddman.rgxgen.iterators.SingleValueIterator, method: current, match: "()", note: "SingleValueIterator.current"}
  - {class: com.github.curiousoddman.rgxgen.model.GroupType, method: isNegative, match: "()", note: "GroupType.isNegative"}
  - {class: com.github.curiousoddman.rgxgen.model.RgxGenCharsDefinition, method: of, match: "(List<SymbolRange> externalRanges)", note: "RgxGenCharsDefinition.of"}
  - {class: com.github.curiousoddman.rgxgen.model.RgxGenCharsDefinition, method: of, match: "(UnicodeCategory category)", note: "RgxGenCharsDefinition.of"}
  - {class: com.github.curiousoddman.rgxgen.model.UnicodeCategory, method: getSymbolRanges, match: "()", note: "UnicodeCategory.getSymbolRanges"}
  - {class: com.github.curiousoddman.rgxgen.model.UnicodeCategory, method: getSymbols, match: "()", note: "UnicodeCategory.getSymbols"}
  - {class: com.github.curiousoddman.rgxgen.nodes.Choice, method: getNodes, match: "()", note: "Choice.getNodes"}
  - {class: com.github.curiousoddman.rgxgen.nodes.Choice, method: visit, match: "(NodeVisitor visitor)", note: "Choice.visit"}
  - {class: com.github.curiousoddman.rgxgen.nodes.FinalSymbol, method: visit, match: "(NodeVisitor visitor)", note: "FinalSymbol.visit"}
  - {class: com.github.curiousoddman.rgxgen.nodes.FinalSymbol, method: getValue, match: "()", note: "FinalSymbol.getValue"}
