  - {class: de.graetz23.jwave.tools.MathToolKit, method: getExponent, match: "( double f )", note: "MathToolKit.getExponent"}
  - {class: de.graetz23.jwave.transforms.DiscreteFourierTransform, method: forward, match: "(double[] arrTime, int level)", note: "DiscreteFourierTransform.forward"}
  - {class: de.graetz23.jwave.Transform, method: forward, match: "(Complex[] arrTime)", note: "Transform.forward"}
  - {class: de.graetz23.jwave.datatypes.natives.Complex, method: setReal, match: "( double r )", note: "Complex.setReal"}
