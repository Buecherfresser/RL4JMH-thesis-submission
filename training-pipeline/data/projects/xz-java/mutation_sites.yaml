# Curated performance-mutation sites for xz-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants xz-java --source data/external-src/<checkout> \
#       --sites data/projects/xz-java/mutation_sites.yaml

package_root: org.tukaani.xz

sites:
  - {class: org.tukaani.xz.ArrayCache, method: getDummyCache, match: "()", note: "ArrayCache.getDummyCache"}
  - {class: org.tukaani.xz.check.CRC32, method: finish, match: "()", note: "CRC32.finish"}
  - {class: org.tukaani.xz.common.ByteArrayView, method: getShortBE, match: "(byte[] buf, int index)", note: "ByteArrayView.getShortBE"}
  - {class: org.tukaani.xz.index.IndexDecoder, method: setOffsets, match: "(IndexDecoder prev)", note: "IndexDecoder.setOffsets"}
  - {class: org.tukaani.xz.lz.LZDecoder, method: putArraysToCache, match: "(ArrayCache arrayCache)", note: "LZDecoder.putArraysToCache"}
  - {class: org.tukaani.xz.lzma.LZMADecoder, method: reset, match: "()", note: "LZMADecoder.reset"}
  - {class: org.tukaani.xz.rangecoder.RangeDecoderFromBuffer, method: putArraysToCache, match: "(ArrayCache arrayCache)", note: "RangeDecoderFromBuffer.putArraysToCache"}
  - {class: org.tukaani.xz.simple.RISCVDecoder, method: code, match: "(byte[] buf, int off, int len)", note: "RISCVDecoder.code"}
  - {class: org.tukaani.xz.ArrayCache, method: getDefaultCache, match: "()", note: "ArrayCache.getDefaultCache"}
  - {class: org.tukaani.xz.check.CRC64, method: finish, match: "()", note: "CRC64.finish"}
  - {class: org.tukaani.xz.common.ByteArrayView, method: getShortLE, match: "(byte[] buf, int index)", note: "ByteArrayView.getShortLE"}
  - {class: org.tukaani.xz.index.IndexDecoder, method: getMemoryUsage, match: "()", note: "IndexDecoder.getMemoryUsage"}
  - {class: org.tukaani.xz.lz.LZDecoder, method: reset, match: "()", note: "LZDecoder.reset"}
  - {class: org.tukaani.xz.lzma.LZMADecoder, method: endMarkerDetected, match: "()", note: "LZMADecoder.endMarkerDetected"}
  - {class: org.tukaani.xz.rangecoder.RangeDecoderFromBuffer, method: isFinished, match: "()", note: "RangeDecoderFromBuffer.isFinished"}
  - {class: org.tukaani.xz.simple.RISCVEncoder, method: code, match: "(byte[] buf, int off, int len)", note: "RISCVEncoder.code"}
  - {class: org.tukaani.xz.BCJDecoder, method: getMemoryUsage, match: "()", note: "BCJDecoder.getMemoryUsage"}
  - {class: org.tukaani.xz.check.None, method: finish, match: "()", note: "None.finish"}
  - {class: org.tukaani.xz.common.DecoderUtil, method: areStreamFlagsEqual, match: "(StreamFlags a, StreamFlags b)", note: "DecoderUtil.areStreamFlagsEqual"}
  - {class: org.tukaani.xz.index.BlockInfo, method: getCheckType, match: "()", note: "BlockInfo.getCheckType"}
  - {class: org.tukaani.xz.lz.BT4, method: putArraysToCache, match: "(ArrayCache arrayCache)", note: "BT4.putArraysToCache"}
  - {class: org.tukaani.xz.lzma.LZMAEncoderNormal, method: reset, match: "()", note: "LZMAEncoderNormal.reset"}
  - {class: org.tukaani.xz.rangecoder.RangeDecoderFromStream, method: isFinished, match: "()", note: "RangeDecoderFromStream.isFinished"}
  - {class: org.tukaani.xz.simple.ARM, method: code, match: "(byte[] buf, int off, int len)", note: "ARM.code"}
  - {class: org.tukaani.xz.BCJDecoder, method: getInputStream, match: "(InputStream in, ArrayCache arrayCache)", note: "BCJDecoder.getInputStream"}
  - {class: org.tukaani.xz.check.SHA256, method: finish, match: "()", note: "SHA256.finish"}
  - {class: org.tukaani.xz.common.DecoderUtil, method: decodeVLI, match: "(InputStream in) throws IOException", note: "DecoderUtil.decodeVLI"}
  - {class: org.tukaani.xz.index.BlockInfo, method: setNext, match: "()", note: "BlockInfo.setNext"}
  - {class: org.tukaani.xz.lz.BT4, method: getMatches, match: "()", note: "BT4.getMatches"}
  - {class: org.tukaani.xz.rangecoder.RangeDecoderFromStream, method: normalize, match: "() throws IOException", note: "RangeDecoderFromStream.normalize"}
  - {class: org.tukaani.xz.simple.ARM64, method: code, match: "(byte[] buf, int off, int len)", note: "ARM64.code"}
  - {class: org.tukaani.xz.BCJEncoder, method: getFilterID, match: "()", note: "BCJEncoder.getFilterID"}
  - {class: org.tukaani.xz.common.Util, method: getVLISize, match: "(long num)", note: "Util.getVLISize"}
  - {class: org.tukaani.xz.index.IndexHash, method: validate, match: "(InputStream in) throws IOException", note: "IndexHash.validate"}
  - {class: org.tukaani.xz.lz.HC4, method: putArraysToCache, match: "(ArrayCache arrayCache)", note: "HC4.putArraysToCache"}
  - {class: org.tukaani.xz.rangecoder.RangeEncoderToBuffer, method: putArraysToCache, match: "(ArrayCache arrayCache)", note: "RangeEncoderToBuffer.putArraysToCache"}
  - {class: org.tukaani.xz.simple.ARMThumb, method: code, match: "(byte[] buf, int off, int len)", note: "ARMThumb.code"}
