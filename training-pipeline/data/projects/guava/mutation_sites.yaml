# Curated performance-mutation sites for guava (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants guava --source data/external-src/<checkout> \
#       --sites data/projects/guava/mutation_sites.yaml

package_root: com.google.common

sites:
  - {class: com.google.common.base.FunctionalEquivalence, method: doEquivalent, match: "(F a, F b)", note: "FunctionalEquivalence.doEquivalent"}
  - {class: com.google.common.cache.CacheBuilder, method: recordHits, match: "(int count)", note: "CacheBuilder.recordHits"}
  - {class: com.google.common.collect.ArrayListMultimap, method: trimToSize, match: "()", note: "ArrayListMultimap.trimToSize"}
  - {class: com.google.common.escape.ArrayBasedEscaperMap, method: create, match: "(Map<Character, String> replacements)", note: "ArrayBasedEscaperMap.create"}
  - {class: com.google.common.eventbus.DeadEvent, method: getSource, match: "()", note: "DeadEvent.getSource"}
  - {class: com.google.common.graph.GraphBuilder, method: directed, match: "()", note: "GraphBuilder.directed"}
  - {class: com.google.common.hash.ChecksumHashFunction, method: bits, match: "()", note: "ChecksumHashFunction.bits"}
  - {class: com.google.common.html.HtmlEscapers, method: htmlEscaper, match: "()", note: "HtmlEscapers.htmlEscaper"}
  - {class: com.google.common.io.ByteStreams, method: toByteArray, match: "(InputStream in) throws IOException", note: "ByteStreams.toByteArray"}
  - {class: com.google.common.math.BigDecimalMath, method: roundToDouble, match: "(BigDecimal x, RoundingMode mode)", note: "BigDecimalMath.roundToDouble"}
  - {class: com.google.common.net.HostAndPort, method: getHost, match: "()", note: "HostAndPort.getHost"}
  - {class: com.google.common.primitives.ImmutableDoubleArray, method: of, match: "()", note: "ImmutableDoubleArray.of"}
  - {class: com.google.common.reflect.ImmutableTypeToInstanceMap, method: of, match: "()", note: "ImmutableTypeToInstanceMap.of"}
  - {class: com.google.common.util.concurrent.AtomicDoubleArray, method: length, match: "()", note: "AtomicDoubleArray.length"}
  - {class: com.google.common.xml.XmlEscapers, method: xmlContentEscaper, match: "()", note: "XmlEscapers.xmlContentEscaper"}
  - {class: com.google.common.base.FunctionalEquivalence, method: doHash, match: "(F a)", note: "FunctionalEquivalence.doHash"}
  - {class: com.google.common.cache.CacheBuilder, method: recordMisses, match: "(int count)", note: "CacheBuilder.recordMisses"}
  - {class: com.google.common.collect.ArrayTable, method: create, match: "(", note: "ArrayTable.create"}
  - {class: com.google.common.escape.CharEscaperBuilder, method: escape, match: "(String s)", note: "CharEscaperBuilder.escape"}
  - {class: com.google.common.eventbus.DeadEvent, method: getEvent, match: "()", note: "DeadEvent.getEvent"}
