# Curated performance-mutation sites for streamex (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants streamex --source data/external-src/<checkout> \
#       --sites data/projects/streamex/mutation_sites.yaml

package_root: one.util.streamex

sites:
  - {class: one.util.streamex.BaseStreamEx, method: isParallel, match: "()", note: "BaseStreamEx.isParallel"}
  - {class: one.util.streamex.BaseStreamEx, method: close, match: "()", note: "BaseStreamEx.close"}
  - {class: one.util.streamex.DoubleStreamEx, method: unordered, match: "()", note: "DoubleStreamEx.unordered"}
  - {class: one.util.streamex.DoubleStreamEx, method: onClose, match: "(Runnable closeHandler)", note: "DoubleStreamEx.onClose"}
  - {class: one.util.streamex.EntryStream, method: join, match: "(CharSequence delimiter)", note: "EntryStream.join"}
  - {class: one.util.streamex.EntryStream, method: join, match: "(CharSequence delimiter, CharSequence prefix, CharSequence suffix)", note: "EntryStream.join"}
  - {class: one.util.streamex.IntStreamEx, method: unordered, match: "()", note: "IntStreamEx.unordered"}
  - {class: one.util.streamex.IntStreamEx, method: onClose, match: "(Runnable closeHandler)", note: "IntStreamEx.onClose"}
  - {class: one.util.streamex.LongStreamEx, method: unordered, match: "()", note: "LongStreamEx.unordered"}
  - {class: one.util.streamex.LongStreamEx, method: onClose, match: "(Runnable closeHandler)", note: "LongStreamEx.onClose"}
  - {class: one.util.streamex.RangeBasedSpliterator, method: estimateSize, match: "()", note: "RangeBasedSpliterator.estimateSize"}
  - {class: one.util.streamex.RangeBasedSpliterator, method: characteristics, match: "()", note: "RangeBasedSpliterator.characteristics"}
  - {class: one.util.streamex.StreamEx, method: select, match: "(Class<TT> clazz)", note: "StreamEx.select"}
  - {class: one.util.streamex.StreamEx, method: mapFirst, match: "(Function<? super T, ? extends T> mapper)", note: "StreamEx.mapFirst"}
  - {class: one.util.streamex.CharSpliterator, method: tryAdvance, match: "(Consumer<? super String> action)", note: "CharSpliterator.tryAdvance"}
  - {class: one.util.streamex.CharSpliterator, method: trySplit, match: "()", note: "CharSpliterator.trySplit"}
  - {class: one.util.streamex.CollapseSpliterator, method: tryAdvance, match: "(Consumer<? super R> action)", note: "CollapseSpliterator.tryAdvance"}
  - {class: one.util.streamex.CollapseSpliterator, method: forEachRemaining, match: "(Consumer<? super R> action)", note: "CollapseSpliterator.forEachRemaining"}
  - {class: one.util.streamex.CombinationSpliterator, method: forEachRemaining, match: "(Consumer<? super int[]> action)", note: "CombinationSpliterator.forEachRemaining"}
  - {class: one.util.streamex.CombinationSpliterator, method: trySplit, match: "()", note: "CombinationSpliterator.trySplit"}
  - {class: one.util.streamex.ConstSpliterator, method: trySplit, match: "()", note: "ConstSpliterator.trySplit"}
  - {class: one.util.streamex.ConstSpliterator, method: estimateSize, match: "()", note: "ConstSpliterator.estimateSize"}
  - {class: one.util.streamex.CrossSpliterator, method: tryAdvance, match: "(Consumer<? super A> action)", note: "CrossSpliterator.tryAdvance"}
  - {class: one.util.streamex.CrossSpliterator, method: forEachRemaining, match: "(Consumer<? super A> action)", note: "CrossSpliterator.forEachRemaining"}
  - {class: one.util.streamex.DistinctSpliterator, method: tryAdvance, match: "(Consumer<? super T> action)", note: "DistinctSpliterator.tryAdvance"}
  - {class: one.util.streamex.DistinctSpliterator, method: forEachRemaining, match: "(Consumer<? super T> action)", note: "DistinctSpliterator.forEachRemaining"}
  - {class: one.util.streamex.EmitterSpliterator, method: tryAdvance, match: "(Consumer<? super T> action)", note: "EmitterSpliterator.tryAdvance"}
  - {class: one.util.streamex.EmitterSpliterator, method: forEachRemaining, match: "(Consumer<? super T> action)", note: "EmitterSpliterator.forEachRemaining"}
  - {class: one.util.streamex.HeadTailSpliterator, method: tryAdvance, match: "(Consumer<? super U> action)", note: "HeadTailSpliterator.tryAdvance"}
  - {class: one.util.streamex.HeadTailSpliterator, method: tryAdvanceOrTail, match: "(Consumer<? super U> action)", note: "HeadTailSpliterator.tryAdvanceOrTail"}
  - {class: one.util.streamex.IfEmptySpliterator, method: tryAdvance, match: "(Consumer<? super T> action)", note: "IfEmptySpliterator.tryAdvance"}
  - {class: one.util.streamex.IfEmptySpliterator, method: forEachRemaining, match: "(Consumer<? super T> action)", note: "IfEmptySpliterator.forEachRemaining"}
  - {class: one.util.streamex.Internals, method: containsKey, match: "(Object key)", note: "Internals.containsKey"}
  - {class: one.util.streamex.Internals, method: entrySet, match: "()", note: "Internals.entrySet"}
  - {class: one.util.streamex.Joining, method: with, match: "(CharSequence delimiter)", note: "Joining.with"}
  - {class: one.util.streamex.Joining, method: wrap, match: "(CharSequence prefix, CharSequence suffix)", note: "Joining.wrap"}
  - {class: one.util.streamex.Limiter, method: putAll, match: "(Limiter<T> ls)", note: "Limiter.putAll"}
  - {class: one.util.streamex.Limiter, method: sort, match: "()", note: "Limiter.sort"}
  - {class: one.util.streamex.MoreCollectors, method: toEnumSet, match: "(Class<T> enumClass)", note: "MoreCollectors.toEnumSet"}
  - {class: one.util.streamex.MoreCollectors, method: maxAll, match: "()", note: "MoreCollectors.maxAll"}
  - {class: one.util.streamex.OrderedCancellableSpliterator, method: tryAdvance, match: "(Consumer<? super A> action)", note: "OrderedCancellableSpliterator.tryAdvance"}
  - {class: one.util.streamex.OrderedCancellableSpliterator, method: forEachRemaining, match: "(Consumer<? super A> action)", note: "OrderedCancellableSpliterator.forEachRemaining"}
  - {class: one.util.streamex.PairPermutationSpliterator, method: estimateSize, match: "()", note: "PairPermutationSpliterator.estimateSize"}
  - {class: one.util.streamex.PairPermutationSpliterator, method: characteristics, match: "()", note: "PairPermutationSpliterator.characteristics"}
  - {class: one.util.streamex.PairSpliterator, method: estimateSize, match: "()", note: "PairSpliterator.estimateSize"}
  - {class: one.util.streamex.PairSpliterator, method: characteristics, match: "()", note: "PairSpliterator.characteristics"}
  - {class: one.util.streamex.PermutationSpliterator, method: tryAdvance, match: "(Consumer<? super int[]> action)", note: "PermutationSpliterator.tryAdvance"}
  - {class: one.util.streamex.PermutationSpliterator, method: forEachRemaining, match: "(Consumer<? super int[]> action)", note: "PermutationSpliterator.forEachRemaining"}
  - {class: one.util.streamex.PrefixOps, method: isInit, match: "()", note: "PrefixOps.isInit"}
  - {class: one.util.streamex.PrefixOps, method: estimateSize, match: "()", note: "PrefixOps.estimateSize"}
