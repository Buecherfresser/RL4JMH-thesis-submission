# Curated performance-mutation sites for etk4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants etk4j --source data/external-src/<checkout> \
#       --sites data/projects/etk4j/mutation_sites.yaml

package_root: com.wildbitsfoundry.etk4j

sites:
