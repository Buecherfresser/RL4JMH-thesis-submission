  - {class: edu.uci.ics.crawler4j.frontier.Frontier, method: scheduleAll, match: "(List<WebURL> urls)", note: "Frontier.scheduleAll"}
  - {class: edu.uci.ics.crawler4j.frontier.Frontier, method: schedule, match: "(WebURL url)", note: "Frontier.schedule"}
  - {class: edu.uci.ics.crawler4j.frontier.InProcessPagesDB, method: removeURL, match: "(WebURL webUrl)", note: "InProcessPagesDB.removeURL"}
  - {class: edu.uci.ics.crawler4j.frontier.WebURLTupleBinding, method: entryToObject, match: "(TupleInput input)", note: "WebURLTupleBinding.entryToObject"}
  - {class: edu.uci.ics.crawler4j.frontier.WebURLTupleBinding, method: objectToEntry, match: "(WebURL url, TupleOutput output)", note: "WebURLTupleBinding.objectToEntry"}
  - {class: edu.uci.ics.crawler4j.frontier.WorkQueues, method: beginTransaction, match: "()", note: "WorkQueues.beginTransaction"}
  - {class: edu.uci.ics.crawler4j.frontier.WorkQueues, method: commit, match: "(Transaction tnx)", note: "WorkQueues.commit"}
  - {class: edu.uci.ics.crawler4j.parser.BinaryParseData, method: setBinaryContent, match: "(byte[] data)", note: "BinaryParseData.setBinaryContent"}
