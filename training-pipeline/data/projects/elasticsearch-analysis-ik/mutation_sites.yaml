# Curated performance-mutation sites for elasticsearch-analysis-ik (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants elasticsearch-analysis-ik --source data/external-src/<checkout> \
#       --sites data/projects/elasticsearch-analysis-ik/mutation_sites.yaml

package_root: org.wltea.analyzer

sites:
  - {class: org.wltea.analyzer.core.QuickSortSet, method: compareTo, match: "(Cell o)", note: "QuickSortSet.compareTo"}
  - {class: org.wltea.analyzer.dic.DictSegment, method: compareTo, match: "(DictSegment o)", note: "DictSegment.compareTo"}
  - {class: org.wltea.analyzer.help.CharacterHelper, method: isSpaceLetter, match: "(char input)", note: "CharacterHelper.isSpaceLetter"}
  - {class: org.wltea.analyzer.lucene.IKAnalyzer, method: createComponents, match: "(String fieldName)", note: "IKAnalyzer.createComponents"}
  - {class: org.wltea.analyzer.core.QuickSortSet, method: getPrev, match: "()", note: "QuickSortSet.getPrev"}
  - {class: org.wltea.analyzer.dic.Dictionary, method: initial, match: "(Configuration cfg)", note: "Dictionary.initial"}
  - {class: org.wltea.analyzer.help.CharacterHelper, method: isEnglishLetter, match: "(char input)", note: "CharacterHelper.isEnglishLetter"}
  - {class: org.wltea.analyzer.lucene.IKTokenizer, method: incrementToken, match: "() throws IOException", note: "IKTokenizer.incrementToken"}
  - {class: org.wltea.analyzer.core.QuickSortSet, method: getNext, match: "()", note: "QuickSortSet.getNext"}
  - {class: org.wltea.analyzer.dic.Dictionary, method: visitFile, match: "(Path file, BasicFileAttributes attrs)", note: "Dictionary.visitFile"}
  - {class: org.wltea.analyzer.help.CharacterHelper, method: isArabicNumber, match: "(char input)", note: "CharacterHelper.isArabicNumber"}
  - {class: org.wltea.analyzer.lucene.IKTokenizer, method: reset, match: "() throws IOException", note: "IKTokenizer.reset"}
  - {class: org.wltea.analyzer.core.QuickSortSet, method: getLexeme, match: "()", note: "QuickSortSet.getLexeme"}
  - {class: org.wltea.analyzer.dic.Dictionary, method: visitFileFailed, match: "(Path file, IOException e)", note: "Dictionary.visitFileFailed"}
  - {class: org.wltea.analyzer.help.CharacterHelper, method: isCJKCharacter, match: "(char input)", note: "CharacterHelper.isCJKCharacter"}
  - {class: org.wltea.analyzer.lucene.IKTokenizer, method: end, match: "() throws IOException", note: "IKTokenizer.end"}
  - {class: org.wltea.analyzer.core.AnalyzeContext, method: getLastUselessCharNum, match: "()", note: "AnalyzeContext.getLastUselessCharNum"}
  - {class: org.wltea.analyzer.dic.Dictionary, method: getSingleton, match: "()", note: "Dictionary.getSingleton"}
  - {class: org.wltea.analyzer.help.CharacterHelper, method: regularize, match: "(char input)", note: "CharacterHelper.regularize"}
  - {class: org.wltea.analyzer.core.CJKSegmenter, method: analyze, match: "(AnalyzeContext context)", note: "CJKSegmenter.analyze"}
  - {class: org.wltea.analyzer.dic.Dictionary, method: addWords, match: "(Collection<String> words)", note: "Dictionary.addWords"}
  - {class: org.wltea.analyzer.help.PrefixPluginLogger, method: prefix, match: "()", note: "PrefixPluginLogger.prefix"}
  - {class: org.wltea.analyzer.core.CJKSegmenter, method: reset, match: "()", note: "CJKSegmenter.reset"}
  - {class: org.wltea.analyzer.dic.Dictionary, method: disableWords, match: "(Collection<String> words)", note: "Dictionary.disableWords"}
  - {class: org.wltea.analyzer.help.PrefixPluginLogger, method: logMessage, match: "(String fqcn, Level level, Marker marker, Message message, Throwable t)", note: "PrefixPluginLogger.logMessage"}
  - {class: org.wltea.analyzer.core.CN_QuantifierSegmenter, method: analyze, match: "(AnalyzeContext context)", note: "CN_QuantifierSegmenter.analyze"}
  - {class: org.wltea.analyzer.dic.Hit, method: isMatch, match: "()", note: "Hit.isMatch"}
  - {class: org.wltea.analyzer.help.Sleep, method: sleep, match: "(Type type, int num)", note: "Sleep.sleep"}
  - {class: org.wltea.analyzer.core.CN_QuantifierSegmenter, method: reset, match: "()", note: "CN_QuantifierSegmenter.reset"}
  - {class: org.wltea.analyzer.dic.Hit, method: setMatch, match: "()", note: "Hit.setMatch"}
  - {class: org.wltea.analyzer.core.IKSegmenter, method: reset, match: "(Reader input)", note: "IKSegmenter.reset"}
  - {class: org.wltea.analyzer.dic.Hit, method: isPrefix, match: "()", note: "Hit.isPrefix"}
  - {class: org.wltea.analyzer.core.IKSegmenter, method: getLastUselessCharNum, match: "()", note: "IKSegmenter.getLastUselessCharNum"}
  - {class: org.wltea.analyzer.dic.Hit, method: setPrefix, match: "()", note: "Hit.setPrefix"}
  - {class: org.wltea.analyzer.core.IKSegmenter, method: getSavedMaxConsumedEndPosition, match: "()", note: "IKSegmenter.getSavedMaxConsumedEndPosition"}
  - {class: org.wltea.analyzer.dic.Hit, method: isUnmatch, match: "()", note: "Hit.isUnmatch"}
  - {class: org.wltea.analyzer.core.IKSegmenter, method: getSavedSkippedCount, match: "()", note: "IKSegmenter.getSavedSkippedCount"}
  - {class: org.wltea.analyzer.dic.Hit, method: setUnmatch, match: "()", note: "Hit.setUnmatch"}
  - {class: org.wltea.analyzer.core.LetterSegmenter, method: analyze, match: "(AnalyzeContext context)", note: "LetterSegmenter.analyze"}
  - {class: org.wltea.analyzer.dic.Monitor, method: run, match: "()", note: "Monitor.run"}
  - {class: org.wltea.analyzer.core.LetterSegmenter, method: reset, match: "()", note: "LetterSegmenter.reset"}
  - {class: org.wltea.analyzer.dic.Monitor, method: runUnprivileged, match: "()", note: "Monitor.runUnprivileged"}
  - {class: org.wltea.analyzer.core.Lexeme, method: compareTo, match: "(Lexeme other)", note: "Lexeme.compareTo"}
  - {class: org.wltea.analyzer.core.Lexeme, method: setOffset, match: "(int offset)", note: "Lexeme.setOffset"}
  - {class: org.wltea.analyzer.core.Lexeme, method: getBegin, match: "()", note: "Lexeme.getBegin"}
  - {class: org.wltea.analyzer.core.Lexeme, method: getBeginPosition, match: "()", note: "Lexeme.getBeginPosition"}
  - {class: org.wltea.analyzer.core.Lexeme, method: setBegin, match: "(int begin)", note: "Lexeme.setBegin"}
  - {class: org.wltea.analyzer.core.Lexeme, method: getEndPosition, match: "()", note: "Lexeme.getEndPosition"}
  - {class: org.wltea.analyzer.core.LexemePath, method: compareTo, match: "(LexemePath o)", note: "LexemePath.compareTo"}
  - {class: org.wltea.analyzer.core.SurrogatePairSegmenter, method: analyze, match: "(AnalyzeContext context)", note: "SurrogatePairSegmenter.analyze"}
