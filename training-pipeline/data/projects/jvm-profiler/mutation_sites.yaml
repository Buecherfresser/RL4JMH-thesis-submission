# Curated performance-mutation sites for jvm-profiler (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jvm-profiler --source data/external-src/<checkout> \
#       --sites data/projects/jvm-profiler/mutation_sites.yaml

package_root: com.uber.profiling

sites:
  - {class: com.uber.profiling.ArgumentUtils, method: needToUpdateArg, match: "(String argValue)", note: "ArgumentUtils.needToUpdateArg"}
  - {class: com.uber.profiling.examples.HelloWorldApplication, method: main, match: "(String[] args) throws Throwable", note: "HelloWorldApplication.main"}
  - {class: com.uber.profiling.profilers.CpuAndMemoryProfiler, method: getIntervalMillis, match: "()", note: "CpuAndMemoryProfiler.getIntervalMillis"}
  - {class: com.uber.profiling.reporters.ConsoleOutputReporter, method: report, match: "(String profilerName, Map<String, Object> metrics)", note: "ConsoleOutputReporter.report"}
  - {class: com.uber.profiling.transformers.JavaAgentFileTransformer, method: transform, match: "(ClassLoader loader, String className, Class<?> classBeingRedefined, ProtectionDomain protectionDomain, byte[] classfileBuffer) throws IllegalClassFormatException", note: "JavaAgentFileTransformer.transform"}
  - {class: com.uber.profiling.util.ClassAndMethodLongMetricBuffer, method: appendValue, match: "(String className, String methodName, String metricName, long value)", note: "ClassAndMethodLongMetricBuffer.appendValue"}
  - {class: com.uber.profiling.ArgumentUtils, method: needToUpdateRollingArg, match: "(String enableRolling)", note: "ArgumentUtils.needToUpdateRollingArg"}
  - {class: com.uber.profiling.examples.HelloWorldApplication, method: publicSleepMethod, match: "(AtomicLong millis)", note: "HelloWorldApplication.publicSleepMethod"}
  - {class: com.uber.profiling.profilers.CpuAndMemoryProfiler, method: setIntervalMillis, match: "(long intervalMillis)", note: "CpuAndMemoryProfiler.setIntervalMillis"}
  - {class: com.uber.profiling.reporters.ConsoleOutputReporter, method: close, match: "()", note: "ConsoleOutputReporter.close"}
  - {class: com.uber.profiling.transformers.MethodProfilerStaticProxy, method: setCollector, match: "(MethodDurationCollector collector)", note: "MethodProfilerStaticProxy.setCollector"}
  - {class: com.uber.profiling.util.ClassAndMethodLongMetricBuffer, method: reset, match: "()", note: "ClassAndMethodLongMetricBuffer.reset"}
  - {class: com.uber.profiling.Agent, method: agentmain, match: "(final String args, final Instrumentation instrumentation)", note: "Agent.agentmain"}
  - {class: com.uber.profiling.profilers.IOProfiler, method: getIntervalMillis, match: "()", note: "IOProfiler.getIntervalMillis"}
  - {class: com.uber.profiling.reporters.FileOutputReporter, method: getDirectory, match: "()", note: "FileOutputReporter.getDirectory"}
  - {class: com.uber.profiling.transformers.MethodProfilerStaticProxy, method: setArgumentCollector, match: "(MethodArgumentCollector collector)", note: "MethodProfilerStaticProxy.setArgumentCollector"}
  - {class: com.uber.profiling.util.ClassMethodArgumentMetricBuffer, method: appendValue, match: "(String className, String methodName, String argument)", note: "ClassMethodArgumentMetricBuffer.appendValue"}
  - {class: com.uber.profiling.Agent, method: premain, match: "(final String args, final Instrumentation instrumentation)", note: "Agent.premain"}
  - {class: com.uber.profiling.profilers.IOProfiler, method: setIntervalMillis, match: "(long intervalMillis)", note: "IOProfiler.setIntervalMillis"}
  - {class: com.uber.profiling.reporters.FileOutputReporter, method: setDirectory, match: "(String directory)", note: "FileOutputReporter.setDirectory"}
  - {class: com.uber.profiling.util.ClassMethodArgumentMetricBuffer, method: reset, match: "()", note: "ClassMethodArgumentMetricBuffer.reset"}
  - {class: com.uber.profiling.AgentImpl, method: run, match: "(Arguments arguments, Instrumentation instrumentation, Collection<AutoCloseable> objectsToCloseOnShutdown)", note: "AgentImpl.run"}
  - {class: com.uber.profiling.profilers.MethodArgumentCollector, method: collectMetric, match: "(String className, String methodName, String argument)", note: "MethodArgumentCollector.collectMetric"}
  - {class: com.uber.profiling.reporters.FlattenKafkaOutputReporter, method: getTopicLowercase, match: "()", note: "FlattenKafkaOutputReporter.getTopicLowercase"}
  - {class: com.uber.profiling.util.IOUtils, method: toByteArray, match: "(InputStream input)", note: "IOUtils.toByteArray"}
  - {class: com.uber.profiling.AgentImpl, method: startProfilers, match: "(Collection<Profiler> profilers)", note: "AgentImpl.startProfilers"}
  - {class: com.uber.profiling.profilers.MethodArgumentProfiler, method: getIntervalMillis, match: "()", note: "MethodArgumentProfiler.getIntervalMillis"}
  - {class: com.uber.profiling.reporters.FlattenKafkaOutputReporter, method: setTopicLowercase, match: "(Boolean topicLowercase)", note: "FlattenKafkaOutputReporter.setTopicLowercase"}
  - {class: com.uber.profiling.util.JsonUtils, method: getMapper, match: "()", note: "JsonUtils.getMapper"}
  - {class: com.uber.profiling.AgentThreadFactory, method: newThread, match: "(Runnable r)", note: "AgentThreadFactory.newThread"}
  - {class: com.uber.profiling.profilers.MethodArgumentProfiler, method: setIntervalMillis, match: "(long intervalMillis)", note: "MethodArgumentProfiler.setIntervalMillis"}
  - {class: com.uber.profiling.reporters.GraphiteOutputReporter, method: report, match: "(String profilerName, Map<String, Object> metrics)", note: "GraphiteOutputReporter.report"}
  - {class: com.uber.profiling.util.JsonUtils, method: serialize, match: "(Object obj)", note: "JsonUtils.serialize"}
  - {class: com.uber.profiling.Arguments, method: parseArgs, match: "(String args)", note: "Arguments.parseArgs"}
  - {class: com.uber.profiling.profilers.MethodDurationCollector, method: collectLongMetric, match: "(String className, String methodName, String metricName, long metricValue)", note: "MethodDurationCollector.collectLongMetric"}
  - {class: com.uber.profiling.reporters.GraphiteOutputReporter, method: getFormattedMetrics, match: "(Map<String, Object> metrics)", note: "GraphiteOutputReporter.getFormattedMetrics"}
  - {class: com.uber.profiling.util.NetworkUtils, method: getLocalHostName, match: "()", note: "NetworkUtils.getLocalHostName"}
  - {class: com.uber.profiling.Arguments, method: updateArguments, match: "(Map<String, List<String>> parsedArgs)", note: "Arguments.updateArguments"}
  - {class: com.uber.profiling.profilers.MethodDurationProfiler, method: getIntervalMillis, match: "()", note: "MethodDurationProfiler.getIntervalMillis"}
  - {class: com.uber.profiling.reporters.KafkaOutputReporter, method: updateArguments, match: "(Map<String, List<String>> parsedArgs)", note: "KafkaOutputReporter.updateArguments"}
  - {class: com.uber.profiling.util.NetworkUtils, method: main, match: "(String[] args)", note: "NetworkUtils.main"}
  - {class: com.uber.profiling.ProfilerGroup, method: getOneTimeProfilers, match: "()", note: "ProfilerGroup.getOneTimeProfilers"}
  - {class: com.uber.profiling.profilers.MethodDurationProfiler, method: setIntervalMillis, match: "(long intervalMillis)", note: "MethodDurationProfiler.setIntervalMillis"}
  - {class: com.uber.profiling.reporters.KafkaOutputReporter, method: report, match: "(String profilerName, Map<String, Object> metrics)", note: "KafkaOutputReporter.report"}
  - {class: com.uber.profiling.util.ProcFileUtils, method: getProcStatus, match: "()", note: "ProcFileUtils.getProcStatus"}
  - {class: com.uber.profiling.ProfilerGroup, method: getPeriodicProfilers, match: "()", note: "ProfilerGroup.getPeriodicProfilers"}
  - {class: com.uber.profiling.profilers.ProcessInfoProfiler, method: getIntervalMillis, match: "()", note: "ProcessInfoProfiler.getIntervalMillis"}
  - {class: com.uber.profiling.util.ProcFileUtils, method: getProcIO, match: "()", note: "ProcFileUtils.getProcIO"}
  - {class: com.uber.profiling.ProfilerRunner, method: run, match: "()", note: "ProfilerRunner.run"}
  - {class: com.uber.profiling.profilers.ProcessInfoProfiler, method: setReporter, match: "(Reporter reporter)", note: "ProcessInfoProfiler.setReporter"}
