# Curated performance-mutation sites for dsiutils (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants dsiutils --source data/external-src/<checkout> \
#       --sites data/projects/dsiutils/mutation_sites.yaml

package_root: it.unimi.dsi

sites:
  - {class: it.unimi.dsi.Util, method: format, match: "(final double d)", note: "Util.format"}
  - {class: it.unimi.dsi.big.io.FileLinesByteArrayCollection, method: close, match: "()", note: "FileLinesByteArrayCollection.close"}
  - {class: it.unimi.dsi.bits.BooleanListBitVector, method: ensureIntegerIndex, match: "(final long index)", note: "BooleanListBitVector.ensureIntegerIndex"}
