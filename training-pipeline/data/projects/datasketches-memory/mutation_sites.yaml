# Curated performance-mutation sites for datasketches-memory (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants datasketches-memory --source data/external-src/<checkout> \
#       --sites data/projects/datasketches-memory/mutation_sites.yaml

