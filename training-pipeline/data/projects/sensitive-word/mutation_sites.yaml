# Curated performance-mutation sites for sensitive-word (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants sensitive-word --source data/external-src/<checkout> \
#       --sites data/projects/sensitive-word/mutation_sites.yaml

package_root: com.github.houbb

sites:
  - {class: com.github.houbb.sensitive.word.collection.Char2CharMap, method: size, match: "()", note: "Char2CharMap.size"}
  - {class: com.github.houbb.sensitive.word.support.check.WordCheckArray, method: sensitiveCheck, match: "(int beginIndex, InnerSensitiveWordContext checkContext)", note: "WordCheckArray.sensitiveCheck"}
  - {class: com.github.houbb.sensitive.word.support.format.WordFormatArray, method: format, match: "(char original, IWordContext context)", note: "WordFormatArray.format"}
  - {class: com.github.houbb.sensitive.word.support.tag.WordTagMap, method: doGetTag, match: "(String word)", note: "WordTagMap.doGetTag"}
  - {class: com.github.houbb.sensitive.word.utils.InnerCharUtils, method: toHalfWidth, match: "(char original)", note: "InnerCharUtils.toHalfWidth"}
  - {class: com.github.houbb.sensitive.word.utils.InnerCharUtils, method: parseInt, match: "(String text)", note: "InnerCharUtils.parseInt"}
  - {class: com.github.houbb.sensitive.word.utils.InnerStreamUtils, method: readAllLines, match: "(String path)", note: "InnerStreamUtils.readAllLines"}
  - {class: com.github.houbb.sensitive.word.utils.InnerWordCharUtils, method: getString, match: "(final String text,", note: "InnerWordCharUtils.getString"}
  - {class: com.github.houbb.sensitive.word.utils.InnerWordCharUtils, method: getString, match: "(final String text,", note: "InnerWordCharUtils.getString"}
  - {class: com.github.houbb.sensitive.word.utils.InnerWordFormatUtils, method: format, match: "(final String original, final IWordContext context)", note: "InnerWordFormatUtils.format"}
  - {class: com.github.houbb.sensitive.word.utils.InnerWordFormatUtils, method: getMappingChar, match: "(final Map<Character, Character> map, char c)", note: "InnerWordFormatUtils.getMappingChar"}
  - {class: com.github.houbb.sensitive.word.utils.InnerWordTagUtils, method: tags, match: "(final String word,", note: "InnerWordTagUtils.tags"}
  - {class: com.github.houbb.sensitive.word.api.context.InnerSensitiveWordContext, method: newInstance, match: "()", note: "InnerSensitiveWordContext.newInstance"}
  - {class: com.github.houbb.sensitive.word.api.context.InnerSensitiveWordContext, method: originalText, match: "()", note: "InnerSensitiveWordContext.originalText"}
  - {class: com.github.houbb.sensitive.word.bs.SensitiveWordBs, method: newInstance, match: "()", note: "SensitiveWordBs.newInstance"}
  - {class: com.github.houbb.sensitive.word.bs.SensitiveWordBs, method: init, match: "()", note: "SensitiveWordBs.init"}
  - {class: com.github.houbb.sensitive.word.bs.SensitiveWordContext, method: wordData, match: "()", note: "SensitiveWordContext.wordData"}
  - {class: com.github.houbb.sensitive.word.bs.SensitiveWordContext, method: wordData, match: "(IWordData wordData)", note: "SensitiveWordContext.wordData"}
  - {class: com.github.houbb.sensitive.word.constant.enums.WordTagType, method: getCode, match: "()", note: "WordTagType.getCode"}
  - {class: com.github.houbb.sensitive.word.constant.enums.WordTagType, method: getDesc, match: "()", note: "WordTagType.getDesc"}
  - {class: com.github.houbb.sensitive.word.constant.enums.WordTypeEnum, method: getCode, match: "()", note: "WordTypeEnum.getCode"}
  - {class: com.github.houbb.sensitive.word.constant.enums.WordTypeEnum, method: getDesc, match: "()", note: "WordTypeEnum.getDesc"}
  - {class: com.github.houbb.sensitive.word.core.SensitiveWord, method: getInstance, match: "()", note: "SensitiveWord.getInstance"}
  - {class: com.github.houbb.sensitive.word.core.SensitiveWord, method: doFindAll, match: "(String string, IWordContext context)", note: "SensitiveWord.doFindAll"}
