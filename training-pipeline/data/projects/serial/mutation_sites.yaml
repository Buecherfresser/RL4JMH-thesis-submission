# Curated performance-mutation sites for serial (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants serial --source data/external-src/<checkout> \
#       --sites data/projects/serial/mutation_sites.yaml

package_root: com.twitter.serial

sites:
  - {class: com.twitter.serial.sample.MainActivity, method: onCreate, match: "(@Nullable Bundle savedInstanceState)", note: "MainActivity.onCreate"}
  - {class: com.twitter.serial.serializer.CollectionSerializers, method: getListSerializer, match: "(@NotNull final Serializer<T> itemSerializer)", note: "CollectionSerializers.getListSerializer"}
  - {class: com.twitter.serial.stream.bytebuffer.ByteBufferSerial, method: toByteArray, match: "(@Nullable T value, @NotNull Serializer<T> serializer)", note: "ByteBufferSerial.toByteArray"}
  - {class: com.twitter.serial.util.InternalSerialUtils, method: checkIsNotNull, match: "(@Nullable T value)", note: "InternalSerialUtils.checkIsNotNull"}
  - {class: com.twitter.serial.sample.MainActivity, method: onClick, match: "(View v)", note: "MainActivity.onClick"}
  - {class: com.twitter.serial.serializer.CollectionSerializers, method: serializeObject, match: "(@NotNull SerializationContext context,", note: "CollectionSerializers.serializeObject"}
  - {class: com.twitter.serial.stream.bytebuffer.ByteBufferSerial, method: toByteArray, match: "(@Nullable T value, @NotNull Serializer<T> serializer,", note: "ByteBufferSerial.toByteArray"}
  - {class: com.twitter.serial.util.InternalSerialUtils, method: getOrEmpty, match: "(@Nullable String string)", note: "InternalSerialUtils.getOrEmpty"}
  - {class: com.twitter.serial.sample.MainActivity, method: onSaveInstanceState, match: "(@NotNull Bundle outState)", note: "MainActivity.onSaveInstanceState"}
  - {class: com.twitter.serial.serializer.CollectionSerializers, method: deserializeObject, match: "(@NotNull SerializationContext context, @NotNull SerializerInput input, int versionNumber)", note: "CollectionSerializers.deserializeObject"}
  - {class: com.twitter.serial.stream.bytebuffer.ByteBufferSerial, method: fromByteArray, match: "(@Nullable byte[] bytes, @NotNull Serializer<T> serializer)", note: "ByteBufferSerial.fromByteArray"}
  - {class: com.twitter.serial.util.InternalSerialUtils, method: getOrDefault, match: "(@Nullable T value, @Nullable T defaultValue)", note: "InternalSerialUtils.getOrDefault"}
  - {class: com.twitter.serial.sample.Person, method: setFirstName, match: "(@Nullable String firstName)", note: "Person.setFirstName"}
  - {class: com.twitter.serial.serializer.CollectionSerializers, method: getSetSerializer, match: "(@NotNull final Serializer<T> itemSerializer)", note: "CollectionSerializers.getSetSerializer"}
  - {class: com.twitter.serial.stream.bytebuffer.ByteBufferSerializerInput, method: isPeekSupported, match: "()", note: "ByteBufferSerializerInput.isPeekSupported"}
  - {class: com.twitter.serial.util.InternalSerialUtils, method: closeSilently, match: "(@Nullable Closeable closeable)", note: "InternalSerialUtils.closeSilently"}
  - {class: com.twitter.serial.sample.Person, method: setLastName, match: "(@Nullable String lastName)", note: "Person.setLastName"}
  - {class: com.twitter.serial.serializer.CoreSerializers, method: serializeValue, match: "(@NotNull SerializationContext context,", note: "CoreSerializers.serializeValue"}
  - {class: com.twitter.serial.stream.bytebuffer.ByteBufferSerializerInput, method: getPosition, match: "()", note: "ByteBufferSerializerInput.getPosition"}
  - {class: com.twitter.serial.util.SerializableUtils, method: toByteArray, match: "(@Nullable Serializable o) throws IOException", note: "SerializableUtils.toByteArray"}
  - {class: com.twitter.serial.sample.Person, method: setAge, match: "(int age)", note: "Person.setAge"}
  - {class: com.twitter.serial.serializer.CoreSerializers, method: deserializeValue, match: "(@NotNull SerializationContext context,", note: "CoreSerializers.deserializeValue"}
  - {class: com.twitter.serial.stream.bytebuffer.ByteBufferSerializerInput, method: readBoolean, match: "() throws IOException", note: "ByteBufferSerializerInput.readBoolean"}
  - {class: com.twitter.serial.util.SerializableUtils, method: fromByteArray, match: "(@Nullable byte[] bytes) throws IOException, ClassNotFoundException", note: "SerializableUtils.fromByteArray"}
  - {class: com.twitter.serial.sample.Person, method: build, match: "()", note: "Person.build"}
  - {class: com.twitter.serial.serializer.CoreSerializers, method: serializeValue, match: "(@NotNull SerializationContext context,", note: "CoreSerializers.serializeValue"}
  - {class: com.twitter.serial.stream.bytebuffer.ByteBufferSerializerInput, method: readInt, match: "() throws IOException", note: "ByteBufferSerializerInput.readInt"}
  - {class: com.twitter.serial.util.SerializableUtils, method: fromByteArray, match: "(@Nullable byte[] bytes, @Nullable final Map<Long, Class<?>> classMapping)", note: "SerializableUtils.fromByteArray"}
  - {class: com.twitter.serial.serializer.CoreSerializers, method: deserializeValue, match: "(@NotNull SerializationContext context,", note: "CoreSerializers.deserializeValue"}
  - {class: com.twitter.serial.stream.bytebuffer.ByteBufferSerializerOutput, method: getSerializedData, match: "()", note: "ByteBufferSerializerOutput.getSerializedData"}
  - {class: com.twitter.serial.util.SerializableUtils, method: resolveClass, match: "(@NotNull ObjectStreamClass osClass)", note: "SerializableUtils.resolveClass"}
  - {class: com.twitter.serial.stream.bytebuffer.ByteBufferSerializerOutput, method: isPeekSupported, match: "()", note: "ByteBufferSerializerOutput.isPeekSupported"}
  - {class: com.twitter.serial.util.SerializationUtils, method: initializePool, match: "(@NotNull Pools.SynchronizedPool<byte[]> pool)", note: "SerializationUtils.initializePool"}
  - {class: com.twitter.serial.stream.bytebuffer.ByteBufferSerializerOutput, method: getPosition, match: "()", note: "ByteBufferSerializerOutput.getPosition"}
  - {class: com.twitter.serial.util.SerializationUtils, method: writeNullIndicator, match: "(@NotNull SerializerOutput output, @Nullable Object object)", note: "SerializationUtils.writeNullIndicator"}
  - {class: com.twitter.serial.stream.bytebuffer.ByteBufferSerializerOutput, method: peekTypeAtPosition, match: "(int position)", note: "ByteBufferSerializerOutput.peekTypeAtPosition"}
  - {class: com.twitter.serial.util.SerializationUtils, method: readNullIndicator, match: "(@NotNull SerializerInput input) throws IOException", note: "SerializationUtils.readNullIndicator"}
  - {class: com.twitter.serial.stream.legacy.LegacySerial, method: toByteArray, match: "(@Nullable T value, @NotNull Serializer<T> serializer) throws IOException", note: "LegacySerial.toByteArray"}
  - {class: com.twitter.serial.util.SerializationUtils, method: validateSerializedData, match: "(@NotNull byte[] bytes) throws IOException", note: "SerializationUtils.validateSerializedData"}
  - {class: com.twitter.serial.stream.legacy.LegacySerial, method: fromByteArray, match: "(@Nullable byte[] bytes, @NotNull Serializer<T> serializer) throws IOException,", note: "LegacySerial.fromByteArray"}
  - {class: com.twitter.serial.util.Pools, method: acquire, match: "()", note: "Pools.acquire"}
  - {class: com.twitter.serial.stream.legacy.LegacySerial, method: toCompressedByteArray, match: "(@Nullable T value, @NotNull Serializer<T> serializer) throws IOException", note: "LegacySerial.toCompressedByteArray"}
  - {class: com.twitter.serial.util.Pools, method: release, match: "(@NotNull T instance)", note: "Pools.release"}
  - {class: com.twitter.serial.stream.legacy.LegacySerial, method: fromCompressedByteArray, match: "(@Nullable byte[] bytes, @NotNull Serializer<T> serializer) throws IOException,", note: "LegacySerial.fromCompressedByteArray"}
  - {class: com.twitter.serial.util.Pools, method: acquire, match: "()", note: "Pools.acquire"}
  - {class: com.twitter.serial.stream.legacy.LegacySerializerInput, method: readBoolean, match: "() throws IOException", note: "LegacySerializerInput.readBoolean"}
  - {class: com.twitter.serial.util.Pools, method: release, match: "(@NotNull T element)", note: "Pools.release"}
  - {class: com.twitter.serial.stream.legacy.LegacySerializerInput, method: readInt, match: "() throws IOException", note: "LegacySerializerInput.readInt"}
  - {class: com.twitter.serial.util.SerializableClass, method: create, match: "(@NotNull Class<T> klass, @NotNull Serializer<? super T> serializer)", note: "SerializableClass.create"}
  - {class: com.twitter.serial.stream.legacy.LegacySerializerInput, method: readLong, match: "() throws IOException", note: "LegacySerializerInput.readLong"}
