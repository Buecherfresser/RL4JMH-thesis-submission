# Curated performance-mutation sites for reactor-core (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants reactor-core --source data/external-src/<checkout> \
#       --sites data/projects/reactor-core/mutation_sites.yaml

package_root: reactor.core

sites:
  - {class: reactor.core.Disposables, method: composite, match: "()", note: "Disposables.composite"}
  - {class: reactor.core.observability.micrometer.MicrometerMeterListener, method: doOnCancel, match: "()", note: "MicrometerMeterListener.doOnCancel"}
  - {class: reactor.core.publisher.ContextTrackingFunctionWrapper, method: apply, match: "(Publisher<T> source)", note: "ContextTrackingFunctionWrapper.apply"}
  - {class: reactor.core.scheduler.BoundedElasticScheduler, method: isDisposed, match: "()", note: "BoundedElasticScheduler.isDisposed"}
  - {class: reactor.core.Disposables, method: composite, match: "(Disposable... disposables)", note: "Disposables.composite"}
  - {class: reactor.core.observability.micrometer.MicrometerMeterListener, method: doOnComplete, match: "()", note: "MicrometerMeterListener.doOnComplete"}
  - {class: reactor.core.publisher.ContextTrackingFunctionWrapper, method: subscribe, match: "(CoreSubscriber<? super V> actual)", note: "ContextTrackingFunctionWrapper.subscribe"}
  - {class: reactor.core.scheduler.BoundedElasticScheduler, method: init, match: "()", note: "BoundedElasticScheduler.init"}
  - {class: reactor.core.observability.micrometer.MicrometerMeterListenerDocumentation, method: getKeyNames, match: "()", note: "MicrometerMeterListenerDocumentation.getKeyNames"}
