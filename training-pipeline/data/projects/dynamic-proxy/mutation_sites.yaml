# Curated performance-mutation sites for dynamic-proxy (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants dynamic-proxy --source data/external-src/<checkout> \
#       --sites data/projects/dynamic-proxy/mutation_sites.yaml

package_root: net.neoremind.dynamicproxy

sites:
  - {class: net.neoremind.dynamicproxy.DefaultProxyCreator, method: canProxy, match: "(Class<?>... proxyClasses)", note: "DefaultProxyCreator.canProxy"}
  - {class: net.neoremind.dynamicproxy.bytebuddy.DynamicDelegator, method: invoke, match: "(@This Object proxy, @Origin Method method, @AllArguments Object[] arguments)", note: "DynamicDelegator.invoke"}
  - {class: net.neoremind.dynamicproxy.impl.ASMCreator, method: createDelegatorProxy, match: "(ClassLoader classLoader, ObjectProvider<?> delegateProvider,", note: "ASMCreator.createDelegatorProxy"}
  - {class: net.neoremind.dynamicproxy.invoke.NullInvoker, method: invoke, match: "(Object proxy, Method method, Object... args) throws Throwable", note: "NullInvoker.invoke"}
  - {class: net.neoremind.dynamicproxy.provider.BeanProvider, method: getObject, match: "()", note: "BeanProvider.getObject"}
  - {class: net.neoremind.dynamicproxy.support.DelegatorInvoker, method: invokeImpl, match: "(Object proxy, Method method, Object[] args) throws Throwable", note: "DelegatorInvoker.invokeImpl"}
  - {class: net.neoremind.dynamicproxy.template.ClassCache, method: getProxyClass, match: "(ClassLoader classLoader, Class<?>[] proxyClasses)", note: "ClassCache.getProxyClass"}
  - {class: net.neoremind.dynamicproxy.util.ObjectUtil, method: defaultIfNull, match: "(T object, S defaultValue)", note: "ObjectUtil.defaultIfNull"}
  - {class: net.neoremind.dynamicproxy.DefaultProxyCreator, method: createDelegatorProxy, match: "(ObjectProvider<?> delegateProvider, Class<?>... proxyClasses)", note: "DefaultProxyCreator.createDelegatorProxy"}
  - {class: net.neoremind.dynamicproxy.bytebuddy.DynamicDelegator, method: setInvoker, match: "(ObjectInvoker invoker)", note: "DynamicDelegator.setInvoker"}
  - {class: net.neoremind.dynamicproxy.impl.ASMCreator, method: createInterceptorProxy, match: "(ClassLoader classLoader, Object target, Interceptor interceptor,", note: "ASMCreator.createInterceptorProxy"}
  - {class: net.neoremind.dynamicproxy.provider.ConstantProvider, method: getObject, match: "()", note: "ConstantProvider.getObject"}
  - {class: net.neoremind.dynamicproxy.support.InterceptorInvoker, method: invokeImpl, match: "(Object proxy, Method method, Object[] args) throws Throwable", note: "InterceptorInvoker.invokeImpl"}
  - {class: net.neoremind.dynamicproxy.util.ReflectionUtil, method: hasSuperClass, match: "(Class<?> clazz)", note: "ReflectionUtil.hasSuperClass"}
  - {class: net.neoremind.dynamicproxy.DefaultProxyCreator, method: createDelegatorProxy, match: "(ClassLoader classLoader, ObjectProvider<?> delegateProvider,", note: "DefaultProxyCreator.createDelegatorProxy"}
  - {class: net.neoremind.dynamicproxy.impl.ASMCreator, method: createInvokerProxy, match: "(ClassLoader classLoader, ObjectInvoker invoker, Class<?>... proxyClasses)", note: "ASMCreator.createInvokerProxy"}
  - {class: net.neoremind.dynamicproxy.provider.ProviderDecorator, method: getObject, match: "()", note: "ProviderDecorator.getObject"}
  - {class: net.neoremind.dynamicproxy.support.Invokering, method: invokeImpl, match: "(Object proxy, Method method, Object[] args) throws Throwable", note: "Invokering.invokeImpl"}
  - {class: net.neoremind.dynamicproxy.util.ReflectionUtil, method: getMethod, match: "(Class<?> clazz, String methodName, Class<?>... parameterTypes)", note: "ReflectionUtil.getMethod"}
  - {class: net.neoremind.dynamicproxy.DefaultProxyCreator, method: createInterceptorProxy, match: "(Object target, Interceptor interceptor, Class<?>... proxyClasses)", note: "DefaultProxyCreator.createInterceptorProxy"}
  - {class: net.neoremind.dynamicproxy.impl.ASMCreator, method: generateProxyClass, match: "(final ClassLoader classLoader, final Class<?>... proxyClasses)", note: "ASMCreator.generateProxyClass"}
  - {class: net.neoremind.dynamicproxy.provider.ProviderDecorator, method: getInner, match: "()", note: "ProviderDecorator.getInner"}
  - {class: net.neoremind.dynamicproxy.support.ReflectionInvocation, method: getArguments, match: "()", note: "ReflectionInvocation.getArguments"}
  - {class: net.neoremind.dynamicproxy.util.ReflectionUtil, method: getMethod, match: "(Object object, String methodName, Class<?>... parameterTypes)", note: "ReflectionUtil.getMethod"}
  - {class: net.neoremind.dynamicproxy.MethodSignature, method: getName, match: "(String className, String methodName, Class<?>[] parameterTypes)", note: "MethodSignature.getName"}
  - {class: net.neoremind.dynamicproxy.impl.ByteBuddyCreator, method: canProxy, match: "(Class<?>... proxyClasses)", note: "ByteBuddyCreator.canProxy"}
  - {class: net.neoremind.dynamicproxy.provider.ProviderDecorator, method: setInner, match: "(ObjectProvider<? extends T> inner)", note: "ProviderDecorator.setInner"}
  - {class: net.neoremind.dynamicproxy.support.ReflectionInvocation, method: getMethod, match: "()", note: "ReflectionInvocation.getMethod"}
  - {class: net.neoremind.dynamicproxy.util.ReflectionUtil, method: newInstance, match: "(final Class<T> clazz)", note: "ReflectionUtil.newInstance"}
  - {class: net.neoremind.dynamicproxy.MethodSignature, method: toMethod, match: "(Class<?> type)", note: "MethodSignature.toMethod"}
  - {class: net.neoremind.dynamicproxy.impl.ByteBuddyCreator, method: createDelegatorProxy, match: "(ClassLoader classLoader, ObjectProvider<?> delegateProvider,", note: "ByteBuddyCreator.createDelegatorProxy"}
