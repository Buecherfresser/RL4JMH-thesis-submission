  - {class: com.hubspot.jinjava.doc.JinjavaDocParam, method: getName, match: "()", note: "JinjavaDocParam.getName"}
  - {class: com.hubspot.jinjava.el.TypeConvertingMapELResolver, method: getValue, match: "(ELContext context, Object base, Object property)", note: "TypeConvertingMapELResolver.getValue"}
  - {class: com.hubspot.jinjava.features.FeatureConfig, method: newBuilder, match: "()", note: "FeatureConfig.newBuilder"}
  - {class: com.hubspot.jinjava.interpret.CallStack, method: pushWithMaxDepth, match: "(", note: "CallStack.pushWithMaxDepth"}
  - {class: com.hubspot.jinjava.lib.exptest.IsNumberExpTest, method: evaluate, match: "(Object var, JinjavaInterpreter interpreter, Object... args)", note: "IsNumberExpTest.evaluate"}
  - {class: com.hubspot.jinjava.loader.RelativePathResolver, method: resolve, match: "(String path, JinjavaInterpreter interpreter)", note: "RelativePathResolver.resolve"}
  - {class: com.hubspot.jinjava.mode.NonRevertingEagerExecutionMode, method: instance, match: "()", note: "NonRevertingEagerExecutionMode.instance"}
  - {class: com.hubspot.jinjava.objects.collections.PyMap, method: delegate, match: "()", note: "PyMap.delegate"}
  - {class: com.hubspot.jinjava.random.DeferredRandomNumberGenerator, method: nextInt, match: "(int bound)", note: "DeferredRandomNumberGenerator.nextInt"}
  - {class: com.hubspot.jinjava.tree.parse.LenientWhitespaceControlParser, method: hasLeftTrim, match: "(String unwrapped)", note: "LenientWhitespaceControlParser.hasLeftTrim"}
  - {class: com.hubspot.jinjava.util.EagerReconstructionUtils, method: executeInChildContext, match: "(", note: "EagerReconstructionUtils.executeInChildContext"}
  - {class: com.hubspot.jinjava.LegacyOverrides, method: newBuilder, match: "()", note: "LegacyOverrides.newBuilder"}
  - {class: com.hubspot.jinjava.doc.JinjavaDocParam, method: getDesc, match: "()", note: "JinjavaDocParam.getDesc"}
