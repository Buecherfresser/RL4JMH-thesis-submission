# Curated performance-mutation sites for jimfs (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jimfs --source data/external-src/<checkout> \
#       --sites data/projects/jimfs/mutation_sites.yaml

package_root: com.google.common.jimfs

sites:
  - {class: com.google.common.jimfs.DowngradedDirectoryStream, method: iterator, match: "()", note: "DowngradedDirectoryStream.iterator"}
  - {class: com.google.common.jimfs.DowngradedDirectoryStream, method: close, match: "() throws IOException", note: "DowngradedDirectoryStream.close"}
  - {class: com.google.common.jimfs.JimfsInputStream, method: close, match: "() throws IOException", note: "JimfsInputStream.close"}
