# Curated performance-mutation sites for bozar (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants bozar --source data/external-src/<checkout> \
#       --sites data/projects/bozar/mutation_sites.yaml

package_root: io.github.vimasig

sites:
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.LineNumberTransformer, method: transformMethod, match: "(ClassNode classNode, MethodNode methodNode)", note: "LineNumberTransformer.transformMethod"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.LineNumberTransformer, method: getEnableType, match: "()", note: "LineNumberTransformer.getEnableType"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.watermark.UnusedStringTransformer, method: transformMethod, match: "(ClassNode classNode, MethodNode methodNode)", note: "UnusedStringTransformer.transformMethod"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.watermark.UnusedStringTransformer, method: getEnableType, match: "()", note: "UnusedStringTransformer.getEnableType"}
  - {class: io.github.vimasig.bozar.obfuscator.utils.ASMUtils, method: getPrintln, match: "(String s)", note: "ASMUtils.getPrintln"}
  - {class: io.github.vimasig.bozar.obfuscator.utils.ASMUtils, method: getThrowNull, match: "()", note: "ASMUtils.getThrowNull"}
  - {class: io.github.vimasig.bozar.obfuscator.utils.BozarUtils, method: getLatestVersion, match: "() throws IOException, InterruptedException", note: "BozarUtils.getLatestVersion"}
  - {class: io.github.vimasig.bozar.obfuscator.utils.BozarUtils, method: openDownloadURL, match: "()", note: "BozarUtils.openDownloadURL"}
  - {class: io.github.vimasig.bozar.obfuscator.utils.FileUtils, method: getAllFiles, match: "(File file)", note: "FileUtils.getAllFiles"}
  - {class: io.github.vimasig.bozar.obfuscator.utils.InsnBuilder, method: insn, match: "(AbstractInsnNode... insnNodes)", note: "InsnBuilder.insn"}
  - {class: io.github.vimasig.bozar.obfuscator.utils.InsnBuilder, method: insnList, match: "(InsnList... insnLists)", note: "InsnBuilder.insnList"}
  - {class: io.github.vimasig.bozar.obfuscator.utils.StreamUtils, method: getHash, match: "(InputStream is) throws NoSuchAlgorithmException, IOException", note: "StreamUtils.getHash"}
  - {class: io.github.vimasig.bozar.obfuscator.utils.StreamUtils, method: readAll, match: "(InputStream in) throws IOException", note: "StreamUtils.readAll"}
  - {class: io.github.vimasig.bozar.obfuscator.utils.StringUtils, method: getAlphabetCombinations, match: "()", note: "StringUtils.getAlphabetCombinations"}
  - {class: io.github.vimasig.bozar.obfuscator.utils.StringUtils, method: getAlphabet, match: "()", note: "StringUtils.getAlphabet"}
  - {class: io.github.vimasig.bozar.obfuscator.Bozar, method: run, match: "()", note: "Bozar.run"}
  - {class: io.github.vimasig.bozar.obfuscator.Bozar, method: isExcluded, match: "(ClassTransformer classTransformer, final String str)", note: "Bozar.isExcluded"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.TransformManager, method: getTransformers, match: "()", note: "TransformManager.getTransformers"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.TransformManager, method: createTransformerInstance, match: "(Class<? extends ClassTransformer> transformerClass)", note: "TransformManager.createTransformerInstance"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.ConstantTransformer, method: transformMethod, match: "(ClassNode classNode, MethodNode methodNode)", note: "ConstantTransformer.transformMethod"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.ConstantTransformer, method: transformField, match: "(ClassNode classNode, FieldNode fieldNode)", note: "ConstantTransformer.transformField"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.CrasherTransformer, method: transformOutput, match: "(JarOutputStream jarOutputStream)", note: "CrasherTransformer.transformOutput"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.CrasherTransformer, method: getEnableType, match: "()", note: "CrasherTransformer.getEnableType"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.HeavyControlFlowTransformer, method: transformClass, match: "(ClassNode classNode)", note: "HeavyControlFlowTransformer.transformClass"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.HeavyControlFlowTransformer, method: transformMethod, match: "(ClassNode classNode, MethodNode methodNode)", note: "HeavyControlFlowTransformer.transformMethod"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.InnerClassTransformer, method: transformClass, match: "(ClassNode classNode)", note: "InnerClassTransformer.transformClass"}
