# Curated performance-mutation sites for cloning (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants cloning --source data/external-src/<checkout> \
#       --sites data/projects/cloning/mutation_sites.yaml

package_root: com.rits.cloning

sites:
  - {class: com.rits.cloning.Cloner, method: getDumpCloned, match: "()", note: "Cloner.getDumpCloned"}
  - {class: com.rits.cloning.Cloner, method: setDumpCloned, match: "(IDumpCloned dumpCloned)", note: "Cloner.setDumpCloned"}
  - {class: com.rits.cloning.Cloner, method: isNullTransient, match: "()", note: "Cloner.isNullTransient"}
  - {class: com.rits.cloning.Cloner, method: setNullTransient, match: "(final boolean nullTransient)", note: "Cloner.setNullTransient"}
  - {class: com.rits.cloning.Cloner, method: setCloneSynthetics, match: "(final boolean cloneSynthetics)", note: "Cloner.setCloneSynthetics"}
  - {class: com.rits.cloning.Cloner, method: registerFastCloners, match: "()", note: "Cloner.registerFastCloners"}
  - {class: com.rits.cloning.Cloner, method: registerInaccessibleClassToBeFastCloned, match: "(String className, IFastCloner fastCloner)", note: "Cloner.registerInaccessibleClassToBeFastCloned"}
  - {class: com.rits.cloning.Cloner, method: fastClone, match: "(final Object o, final Map<Object, Object> clones)", note: "Cloner.fastClone"}
  - {class: com.rits.cloning.Cloner, method: registerConstant, match: "(Object o)", note: "Cloner.registerConstant"}
  - {class: com.rits.cloning.Cloner, method: registerConstant, match: "(Class<?> c, String privateFieldName)", note: "Cloner.registerConstant"}
  - {class: com.rits.cloning.Cloner, method: registerKnownJdkImmutableClasses, match: "()", note: "Cloner.registerKnownJdkImmutableClasses"}
  - {class: com.rits.cloning.Cloner, method: registerKnownConstants, match: "()", note: "Cloner.registerKnownConstants"}
  - {class: com.rits.cloning.Cloner, method: registerCloningStrategy, match: "(ICloningStrategy strategy)", note: "Cloner.registerCloningStrategy"}
  - {class: com.rits.cloning.Cloner, method: registerStaticFields, match: "(final Class<?>... classes)", note: "Cloner.registerStaticFields"}
  - {class: com.rits.cloning.Cloner, method: setExtraStaticFields, match: "(final Set<Class<?>> set)", note: "Cloner.setExtraStaticFields"}
  - {class: com.rits.cloning.Cloner, method: dontClone, match: "(final Class<?>... c)", note: "Cloner.dontClone"}
  - {class: com.rits.cloning.Cloner, method: dontCloneInstanceOf, match: "(final Class<?>... c)", note: "Cloner.dontCloneInstanceOf"}
  - {class: com.rits.cloning.Cloner, method: setDontCloneInstanceOf, match: "(final Class<?>... c)", note: "Cloner.setDontCloneInstanceOf"}
  - {class: com.rits.cloning.Cloner, method: nullInsteadOfClone, match: "(final Class<?>... c)", note: "Cloner.nullInsteadOfClone"}
  - {class: com.rits.cloning.Cloner, method: setExtraNullInsteadOfClone, match: "(final Set<Class<?>> set)", note: "Cloner.setExtraNullInsteadOfClone"}
  - {class: com.rits.cloning.Cloner, method: setExtraNullInsteadOfCloneFieldAnnotation, match: "(final Set<Class<? extends Annotation>> set)", note: "Cloner.setExtraNullInsteadOfCloneFieldAnnotation"}
  - {class: com.rits.cloning.Cloner, method: registerImmutable, match: "(final Class<?>... c)", note: "Cloner.registerImmutable"}
  - {class: com.rits.cloning.Cloner, method: setExtraImmutables, match: "(final Set<Class<?>> set)", note: "Cloner.setExtraImmutables"}
  - {class: com.rits.cloning.Cloner, method: registerFastCloner, match: "(final Class<?> c, final IFastCloner fastCloner)", note: "Cloner.registerFastCloner"}
  - {class: com.rits.cloning.Cloner, method: unregisterFastCloner, match: "(final Class<?> c)", note: "Cloner.unregisterFastCloner"}
  - {class: com.rits.cloning.Cloner, method: newInstance, match: "(Class<T> c)", note: "Cloner.newInstance"}
  - {class: com.rits.cloning.Cloner, method: fastCloneOrNewInstance, match: "(final Class<T> c)", note: "Cloner.fastCloneOrNewInstance"}
  - {class: com.rits.cloning.Cloner, method: deepClone, match: "(final T o)", note: "Cloner.deepClone"}
  - {class: com.rits.cloning.Cloner, method: deepCloneDontCloneInstances, match: "(final T o, final Object... dontCloneThese)", note: "Cloner.deepCloneDontCloneInstances"}
  - {class: com.rits.cloning.Cloner, method: shallowClone, match: "(final T o)", note: "Cloner.shallowClone"}
  - {class: com.rits.cloning.Cloner, method: considerImmutable, match: "(final Class<?> clz)", note: "Cloner.considerImmutable"}
  - {class: com.rits.cloning.Cloner, method: getImmutableAnnotation, match: "()", note: "Cloner.getImmutableAnnotation"}
  - {class: com.rits.cloning.Cloner, method: cloneInternal, match: "(T o, Map<Object, Object> clones)", note: "Cloner.cloneInternal"}
  - {class: com.rits.cloning.Cloner, method: deepClone, match: "(T o, Map<Object, Object> clones)", note: "Cloner.deepClone"}
  - {class: com.rits.cloning.Cloner, method: deepClone, match: "(T o, Map<Object, Object> clones)", note: "Cloner.deepClone"}
  - {class: com.rits.cloning.Cloner, method: deepClone, match: "(T o, Map<Object, Object> clones)", note: "Cloner.deepClone"}
  - {class: com.rits.cloning.Cloner, method: deepClone, match: "(T o, Map<Object, Object> clones)", note: "Cloner.deepClone"}
  - {class: com.rits.cloning.Cloner, method: deepClone, match: "(T o, Map<Object, Object> clones)", note: "Cloner.deepClone"}
  - {class: com.rits.cloning.Cloner, method: deepClone, match: "(T o, Map<Object, Object> clones)", note: "Cloner.deepClone"}
  - {class: com.rits.cloning.Cloner, method: copyPropertiesOfInheritedClass, match: "(final T src, final E dest)", note: "Cloner.copyPropertiesOfInheritedClass"}
  - {class: com.rits.cloning.Cloner, method: allFields, match: "(Class<?> c)", note: "Cloner.allFields"}
  - {class: com.rits.cloning.Cloner, method: isDumpClonedClasses, match: "()", note: "Cloner.isDumpClonedClasses"}
  - {class: com.rits.cloning.Cloner, method: setDumpClonedClasses, match: "(final boolean dumpClonedClasses)", note: "Cloner.setDumpClonedClasses"}
  - {class: com.rits.cloning.Cloner, method: startCloning, match: "(Class<?> clz)", note: "Cloner.startCloning"}
  - {class: com.rits.cloning.Cloner, method: cloning, match: "(Field field, Class<?> clz)", note: "Cloner.cloning"}
  - {class: com.rits.cloning.Cloner, method: isCloningEnabled, match: "()", note: "Cloner.isCloningEnabled"}
  - {class: com.rits.cloning.Cloner, method: setCloningEnabled, match: "(final boolean cloningEnabled)", note: "Cloner.setCloningEnabled"}
  - {class: com.rits.cloning.Cloner, method: setCloneAnonymousParent, match: "(final boolean cloneAnonymousParent)", note: "Cloner.setCloneAnonymousParent"}
  - {class: com.rits.cloning.Cloner, method: isCloneAnonymousParent, match: "()", note: "Cloner.isCloneAnonymousParent"}
  - {class: com.rits.cloning.Cloner, method: standard, match: "()", note: "Cloner.standard"}
