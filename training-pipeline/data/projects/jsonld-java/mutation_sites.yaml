# Curated performance-mutation sites for jsonld-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jsonld-java --source data/external-src/<checkout> \
#       --sites data/projects/jsonld-java/mutation_sites.yaml

package_root: com.github.jsonldjava

sites:
  - {class: com.github.jsonldjava.core.JsonLdUtils, method: deepCompare, match: "(Object v1, Object v2, Boolean listOrderMatters)", note: "JsonLdUtils.deepCompare"}
  - {class: com.github.jsonldjava.impl.NQuadRDFParser, method: parse, match: "(Object input) throws JsonLdError", note: "NQuadRDFParser.parse"}
  - {class: com.github.jsonldjava.utils.JsonUtils, method: fromInputStream, match: "(InputStream input) throws IOException", note: "JsonUtils.fromInputStream"}
  - {class: com.github.jsonldjava.core.JsonLdUtils, method: deepCompare, match: "(Object v1, Object v2)", note: "JsonLdUtils.deepCompare"}
  - {class: com.github.jsonldjava.impl.NQuadTripleCallback, method: call, match: "(RDFDataset dataset)", note: "NQuadTripleCallback.call"}
  - {class: com.github.jsonldjava.utils.JsonUtils, method: fromInputStream, match: "(InputStream input, String enc) throws IOException", note: "JsonUtils.fromInputStream"}
  - {class: com.github.jsonldjava.core.JsonLdUtils, method: deepContains, match: "(List<Object> values, Object value)", note: "JsonLdUtils.deepContains"}
  - {class: com.github.jsonldjava.utils.JsonUtils, method: fromInputStream, match: "(InputStream input, Charset enc) throws IOException", note: "JsonUtils.fromInputStream"}
  - {class: com.github.jsonldjava.core.JsonLdUtils, method: isAbsoluteIri, match: "(String value)", note: "JsonLdUtils.isAbsoluteIri"}
  - {class: com.github.jsonldjava.utils.JsonUtils, method: fromReader, match: "(Reader reader) throws IOException", note: "JsonUtils.fromReader"}
  - {class: com.github.jsonldjava.core.NormalizeUtils, method: hashBlankNodes, match: "(Collection<String> unnamed_) throws JsonLdError", note: "NormalizeUtils.hashBlankNodes"}
  - {class: com.github.jsonldjava.utils.JarCacheResource, method: length, match: "()", note: "JarCacheResource.length"}
  - {class: com.github.jsonldjava.core.RDFDatasetUtils, method: toNQuads, match: "(RDFDataset dataset)", note: "RDFDatasetUtils.toNQuads"}
  - {class: com.github.jsonldjava.utils.JarCacheResource, method: getInputStream, match: "() throws IOException", note: "JarCacheResource.getInputStream"}
  - {class: com.github.jsonldjava.core.RDFDatasetUtils, method: toNQuads, match: "(RDFDataset dataset, StringBuilder output)", note: "RDFDatasetUtils.toNQuads"}
  - {class: com.github.jsonldjava.utils.JarCacheResource, method: dispose, match: "()", note: "JarCacheResource.dispose"}
  - {class: com.github.jsonldjava.core.RDFDatasetUtils, method: unescape, match: "(String str)", note: "RDFDatasetUtils.unescape"}
  - {class: com.github.jsonldjava.utils.JarCacheStorage, method: load, match: "(URL url) throws IOException", note: "JarCacheStorage.load"}
  - {class: com.github.jsonldjava.core.RDFDatasetUtils, method: escape, match: "(String str, StringBuilder rval)", note: "RDFDatasetUtils.escape"}
  - {class: com.github.jsonldjava.utils.JarCacheStorage, method: getClassLoader, match: "()", note: "JarCacheStorage.getClassLoader"}
  - {class: com.github.jsonldjava.core.Context, method: compactValue, match: "(String activeProperty, Map<String, Object> value)", note: "Context.compactValue"}
  - {class: com.github.jsonldjava.utils.JarCacheStorage, method: setClassLoader, match: "(ClassLoader classLoader)", note: "JarCacheStorage.setClassLoader"}
  - {class: com.github.jsonldjava.core.Context, method: parse, match: "(Object localContext, List<String> remoteContexts) throws JsonLdError", note: "Context.parse"}
  - {class: com.github.jsonldjava.utils.JarCacheStorage, method: putEntry, match: "(String key, HttpCacheEntry entry) throws IOException", note: "JarCacheStorage.putEntry"}
  - {class: com.github.jsonldjava.core.Context, method: parse, match: "(Object localContext) throws JsonLdError", note: "Context.parse"}
  - {class: com.github.jsonldjava.utils.JsonLdUrl, method: parse, match: "(String url)", note: "JsonLdUrl.parse"}
  - {class: com.github.jsonldjava.core.Context, method: _iriCompactionStep5point4, match: "(String iri, Object value, String compactIRI,", note: "Context._iriCompactionStep5point4"}
  - {class: com.github.jsonldjava.utils.JsonLdUrl, method: removeDotSegments, match: "(String path, boolean hasAuthority)", note: "JsonLdUrl.removeDotSegments"}
  - {class: com.github.jsonldjava.core.DocumentLoader, method: addInjectedDoc, match: "(String url, String doc) throws JsonLdError", note: "DocumentLoader.addInjectedDoc"}
  - {class: com.github.jsonldjava.utils.JsonLdUrl, method: removeBase, match: "(Object baseobj, String iri)", note: "JsonLdUrl.removeBase"}
  - {class: com.github.jsonldjava.core.DocumentLoader, method: loadDocument, match: "(String url) throws JsonLdError", note: "DocumentLoader.loadDocument"}
  - {class: com.github.jsonldjava.utils.JsonLdUrl, method: resolve, match: "(String baseUri, String pathToResolve)", note: "JsonLdUrl.resolve"}
