# Curated performance-mutation sites for tinspin-indexes (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants tinspin-indexes --source data/external-src/<checkout> \
#       --sites data/projects/tinspin-indexes/mutation_sites.yaml

package_root: org.tinspin.index

sites:
  - {class: org.tinspin.index.IndexConfig, method: create, match: "(int dimensions)", note: "IndexConfig.create"}
  - {class: org.tinspin.index.array.PointArray, method: insert, match: "(double[] key, T value)", note: "PointArray.insert"}
  - {class: org.tinspin.index.covertree.CoverTree, method: create, match: "(double[] point, T value)", note: "CoverTree.create"}
  - {class: org.tinspin.index.critbit.BitTools, method: toSortableLong, match: "(double value)", note: "BitTools.toSortableLong"}
  - {class: org.tinspin.index.kdtree.KDIterator, method: clear, match: "()", note: "KDIterator.clear"}
  - {class: org.tinspin.index.phtree.PHStats, method: getPhStats, match: "()", note: "PHStats.getPhStats"}
  - {class: org.tinspin.index.qthypercube.QUtil, method: isPointEnclosed, match: "(double[] point,", note: "QUtil.isPointEnclosed"}
  - {class: org.tinspin.index.qthypercube2.QUtil, method: isPointEnclosed, match: "(double[] point,", note: "QUtil.isPointEnclosed"}
  - {class: org.tinspin.index.qtplain.QUtil, method: isPointEnclosed, match: "(double[] point,", note: "QUtil.isPointEnclosed"}
  - {class: org.tinspin.index.rtree.RStarTreeLogic, method: chooseSubTree, match: "(RTreeNode<T> root,", note: "RStarTreeLogic.chooseSubTree"}
  - {class: org.tinspin.index.util.MathTools, method: ceilPowerOfTwo, match: "(double d)", note: "MathTools.ceilPowerOfTwo"}
  - {class: org.tinspin.index.IndexConfig, method: setDimensions, match: "(int dimensions)", note: "IndexConfig.setDimensions"}
  - {class: org.tinspin.index.array.PointArray, method: removeIf, match: "(double[] point, Predicate<PointEntry<T>> condition)", note: "PointArray.removeIf"}
  - {class: org.tinspin.index.covertree.CoverTree, method: create, match: "(int nDims)", note: "CoverTree.create"}
  - {class: org.tinspin.index.critbit.BitTools, method: toSortableLong, match: "(float value)", note: "BitTools.toSortableLong"}
  - {class: org.tinspin.index.kdtree.KDIterator, method: reset, match: "(double[] min, double[] max)", note: "KDIterator.reset"}
  - {class: org.tinspin.index.phtree.PHTreeMMP, method: create, match: "(int dims)", note: "PHTreeMMP.create"}
  - {class: org.tinspin.index.qthypercube.QUtil, method: fitsIntoNode, match: "(double[] point, double[] center, double radius)", note: "QUtil.fitsIntoNode"}
  - {class: org.tinspin.index.qthypercube2.QUtil, method: fitsIntoNode, match: "(double[] point, double[] center, double radius)", note: "QUtil.fitsIntoNode"}
  - {class: org.tinspin.index.qtplain.QUtil, method: fitsIntoNode, match: "(double[] point, double[] center, double radius)", note: "QUtil.fitsIntoNode"}
  - {class: org.tinspin.index.rtree.RStarTreeLogic, method: compareTo, match: "(NDPair<T> o)", note: "RStarTreeLogic.compareTo"}
  - {class: org.tinspin.index.util.MathTools, method: ceilPowerOfTwoCopy, match: "(double[] d)", note: "MathTools.ceilPowerOfTwoCopy"}
  - {class: org.tinspin.index.Stats, method: getDims, match: "()", note: "Stats.getDims"}
  - {class: org.tinspin.index.array.RectArray, method: insert, match: "(double[] lower, double[] upper, T value)", note: "RectArray.insert"}
  - {class: org.tinspin.index.covertree.CoverTreeQueryKnn, method: reset, match: "(double[] center, int k)", note: "CoverTreeQueryKnn.reset"}
  - {class: org.tinspin.index.critbit.CritBit, method: create1D, match: "(int width)", note: "CritBit.create1D"}
  - {class: org.tinspin.index.kdtree.KDIteratorKnn, method: reset, match: "(double[] center, int minResults)", note: "KDIteratorKnn.reset"}
  - {class: org.tinspin.index.phtree.PHTreeMMP, method: getDims, match: "()", note: "PHTreeMMP.getDims"}
  - {class: org.tinspin.index.qthypercube.QIterator0, method: clear, match: "()", note: "QIterator0.clear"}
  - {class: org.tinspin.index.qthypercube2.QIterator0, method: clear, match: "()", note: "QIterator0.clear"}
  - {class: org.tinspin.index.qtplain.QIteratorKnn, method: reset, match: "(double[] center, int minResults)", note: "QIteratorKnn.reset"}
  - {class: org.tinspin.index.rtree.RTree, method: createRStar, match: "(int dims)", note: "RTree.createRStar"}
