# Curated performance-mutation sites for java-immutable-collections (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants java-immutable-collections --source data/external-src/<checkout> \
#       --sites data/projects/java-immutable-collections/mutation_sites.yaml

package_root: org.javimmutable.collections

sites:
  - {class: org.javimmutable.collections.IArrays, method: of, match: "()", note: "IArrays.of"}
  - {class: org.javimmutable.collections.array.TrieArray, method: of, match: "()", note: "TrieArray.of"}
  - {class: org.javimmutable.collections.common.ArrayHelper, method: subArray, match: "(@Nonnull Allocator<T> allocator,", note: "ArrayHelper.subArray"}
  - {class: org.javimmutable.collections.deque.ArrayDeque, method: of, match: "()", note: "ArrayDeque.of"}
  - {class: org.javimmutable.collections.hash.EmptyHashMap, method: mapBuilder, match: "()", note: "EmptyHashMap.mapBuilder"}
  - {class: org.javimmutable.collections.indexed.IndexedArray, method: copied, match: "(T[] values)", note: "IndexedArray.copied"}
  - {class: org.javimmutable.collections.inorder.OrderedMap, method: of, match: "()", note: "OrderedMap.of"}
  - {class: org.javimmutable.collections.iterators.EntryStreamable, method: iterator, match: "()", note: "EntryStreamable.iterator"}
  - {class: org.javimmutable.collections.list.ListAppendTimingComparison, method: main, match: "(String[] argv)", note: "ListAppendTimingComparison.main"}
  - {class: org.javimmutable.collections.listmap.HashListMap, method: of, match: "()", note: "HashListMap.of"}
  - {class: org.javimmutable.collections.serialization.ArrayDequeProxy, method: writeExternal, match: "(ObjectOutput out)", note: "ArrayDequeProxy.writeExternal"}
  - {class: org.javimmutable.collections.setmap.HashSetMap, method: of, match: "()", note: "HashSetMap.of"}
  - {class: org.javimmutable.collections.tree.ComparableComparator, method: of, match: "()", note: "ComparableComparator.of"}
  - {class: org.javimmutable.collections.util.Functions, method: foldLeft, match: "(R accumulator,", note: "Functions.foldLeft"}
  - {class: org.javimmutable.collections.IArrays, method: of, match: "(T... source)", note: "IArrays.of"}
  - {class: org.javimmutable.collections.array.TrieArray, method: builder, match: "()", note: "TrieArray.builder"}
  - {class: org.javimmutable.collections.common.ArrayHelper, method: subArray, match: "(@Nonnull Allocator<T> allocator,", note: "ArrayHelper.subArray"}
  - {class: org.javimmutable.collections.deque.ArrayDeque, method: of, match: "(Indexed<? extends T> source)", note: "ArrayDeque.of"}
  - {class: org.javimmutable.collections.hash.EmptyHashMap, method: find, match: "(@Nonnull K key)", note: "EmptyHashMap.find"}
  - {class: org.javimmutable.collections.indexed.IndexedArray, method: retained, match: "(T[] values)", note: "IndexedArray.retained"}
  - {class: org.javimmutable.collections.inorder.OrderedMap, method: builder, match: "()", note: "OrderedMap.builder"}
  - {class: org.javimmutable.collections.iterators.EntryStreamable, method: getSpliteratorCharacteristics, match: "()", note: "EntryStreamable.getSpliteratorCharacteristics"}
  - {class: org.javimmutable.collections.list.ListCollisionMap, method: instance, match: "()", note: "ListCollisionMap.instance"}
  - {class: org.javimmutable.collections.listmap.HashListMap, method: checkInvariants, match: "()", note: "HashListMap.checkInvariants"}
  - {class: org.javimmutable.collections.serialization.ArrayDequeProxy, method: readExternal, match: "(ObjectInput in)", note: "ArrayDequeProxy.readExternal"}
  - {class: org.javimmutable.collections.setmap.HashSetMap, method: checkInvariants, match: "()", note: "HashSetMap.checkInvariants"}
