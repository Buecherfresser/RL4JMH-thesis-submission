  - {class: org.apache.commons.rng.core.source32.DotyHumphreySmallFastCounting32, method: setStateInternal, match: "(byte[] s)", note: "DotyHumphreySmallFastCounting32.setStateInternal"}
  - {class: org.apache.commons.rng.sampling.CombinationSampler, method: sample, match: "()", note: "CombinationSampler.sample"}
  - {class: org.apache.commons.rng.simple.internal.Long2LongArray, method: convert, match: "(Long seed)", note: "Long2LongArray.convert"}
  - {class: org.apache.commons.rng.core.source32.ISAACRandom, method: getStateInternal, match: "()", note: "ISAACRandom.getStateInternal"}
