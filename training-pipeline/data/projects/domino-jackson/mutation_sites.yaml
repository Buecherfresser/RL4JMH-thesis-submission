  - {class: org.dominokit.jackson.utils.DefaultDateFormat, method: format, match: "(Date date)", note: "DefaultDateFormat.format"}
  - {class: org.dominokit.jackson.DefaultJsonSerializationContext, method: useEqualityForObjectId, match: "(boolean useEqualityForObjectId)", note: "DefaultJsonSerializationContext.useEqualityForObjectId"}
  - {class: org.dominokit.jackson.deser.array.ArrayJsonDeserializer, method: doDeserializeArray, match: "(", note: "ArrayJsonDeserializer.doDeserializeArray"}
  - {class: org.dominokit.jackson.processor.GeneratedMappersRegistry, method: hasTypeToken, match: "(Category category, TypeMirror typeMirror)", note: "GeneratedMappersRegistry.hasTypeToken"}
  - {class: org.dominokit.jackson.ser.array.ArrayJsonSerializer, method: isEmpty, match: "(T[] value)", note: "ArrayJsonSerializer.isEmpty"}
