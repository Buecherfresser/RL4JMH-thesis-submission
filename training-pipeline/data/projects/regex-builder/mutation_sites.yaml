# Curated performance-mutation sites for regex-builder (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants regex-builder --source data/external-src/<checkout> \
#       --sites data/projects/regex-builder/mutation_sites.yaml

package_root: com.github.sgreben

sites:
  - {class: com.github.sgreben.regex_builder.StringReplacementPart, method: toReplacementString, match: "(CaptureGroupIndex index)", note: "StringReplacementPart.toReplacementString"}
  - {class: com.github.sgreben.regex_builder.charclass.Range, method: complement, match: "()", note: "Range.complement"}
  - {class: com.github.sgreben.regex_builder.charclass.Range, method: compile, match: "(java.util.List<TOKEN> output)", note: "Range.compile"}
  - {class: com.github.sgreben.regex_builder.charclass.RangeComplement, method: complement, match: "()", note: "RangeComplement.complement"}
  - {class: com.github.sgreben.regex_builder.charclass.RangeComplement, method: compile, match: "(java.util.List<TOKEN> output)", note: "RangeComplement.compile"}
  - {class: com.github.sgreben.regex_builder.CaptureGroup, method: compile, match: "(CaptureGroupIndex index, java.util.List<TOKEN> output)", note: "CaptureGroup.compile"}
  - {class: com.github.sgreben.regex_builder.CaptureGroupReplacementPart, method: toReplacementString, match: "(CaptureGroupIndex index)", note: "CaptureGroupReplacementPart.toReplacementString"}
  - {class: com.github.sgreben.regex_builder.ExpressionWrapper, method: children, match: "()", note: "ExpressionWrapper.children"}
  - {class: com.github.sgreben.regex_builder.ExpressionWrapper, method: accept, match: "(ExpressionVisitor visitor)", note: "ExpressionWrapper.accept"}
  - {class: com.github.sgreben.regex_builder.FluentRe, method: match, match: "(Expression e)", note: "FluentRe.match"}
  - {class: com.github.sgreben.regex_builder.FluentRe, method: match, match: "(String s)", note: "FluentRe.match"}
  - {class: com.github.sgreben.regex_builder.Matcher, method: find, match: "()", note: "Matcher.find"}
  - {class: com.github.sgreben.regex_builder.Matcher, method: find, match: "(int offset)", note: "Matcher.find"}
  - {class: com.github.sgreben.regex_builder.Pattern, method: compile, match: "(Expression expression)", note: "Pattern.compile"}
  - {class: com.github.sgreben.regex_builder.Pattern, method: compile, match: "(Expression expression, int flags)", note: "Pattern.compile"}
  - {class: com.github.sgreben.regex_builder.Re, method: string, match: "(String s)", note: "Re.string"}
  - {class: com.github.sgreben.regex_builder.Re, method: character, match: "(char c)", note: "Re.character"}
  - {class: com.github.sgreben.regex_builder.Replacement, method: addPart, match: "(ReplacementPart part)", note: "Replacement.addPart"}
  - {class: com.github.sgreben.regex_builder.Replacement, method: toReplacementString, match: "(CaptureGroupIndex index)", note: "Replacement.toReplacementString"}
  - {class: com.github.sgreben.regex_builder.charclass.AnyCharacter, method: complement, match: "()", note: "AnyCharacter.complement"}
  - {class: com.github.sgreben.regex_builder.charclass.AnyCharacter, method: compile, match: "(java.util.List<TOKEN> output)", note: "AnyCharacter.compile"}
  - {class: com.github.sgreben.regex_builder.charclass.BeginInput, method: complement, match: "()", note: "BeginInput.complement"}
  - {class: com.github.sgreben.regex_builder.charclass.BeginInput, method: compile, match: "(java.util.List<TOKEN> output)", note: "BeginInput.compile"}
  - {class: com.github.sgreben.regex_builder.charclass.Complement, method: complement, match: "()", note: "Complement.complement"}
  - {class: com.github.sgreben.regex_builder.charclass.Complement, method: compile, match: "(final java.util.List<TOKEN> output)", note: "Complement.compile"}
  - {class: com.github.sgreben.regex_builder.charclass.Digit, method: complement, match: "()", note: "Digit.complement"}
