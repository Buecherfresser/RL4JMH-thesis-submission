  - {class: tech.units.indriya.quantity.MixedQuantity, method: fromArray, match: "(Quantity<Q>... quantities)", note: "MixedQuantity.fromArray"}
  - {class: tech.units.indriya.unit.ProductUnit, method: ofProduct, match: "(Unit<?> left, Unit<?> right)", note: "ProductUnit.ofProduct"}
  - {class: tech.units.indriya.format.LocalUnitFormat, method: getInstance, match: "()", note: "LocalUnitFormat.getInstance"}
  - {class: tech.units.indriya.function.Calculus, method: currentNumberSystem, match: "()", note: "Calculus.currentNumberSystem"}
  - {class: tech.units.indriya.internal.format.UnitTokenManager, method: setDebugStream, match: "(java.io.PrintStream ds)", note: "UnitTokenManager.setDebugStream"}
  - {class: tech.units.indriya.quantity.Quantities, method: getQuantity, match: "(CharSequence csq)", note: "Quantities.getQuantity"}
  - {class: tech.units.indriya.unit.ProductUnit, method: ofQuotient, match: "(Unit<?> left, Unit<?> right)", note: "ProductUnit.ofQuotient"}
  - {class: tech.units.indriya.format.LocalUnitFormat, method: getInstance, match: "(Locale locale)", note: "LocalUnitFormat.getInstance"}
  - {class: tech.units.indriya.function.DoubleMultiplyConverter, method: isIdentity, match: "()", note: "DoubleMultiplyConverter.isIdentity"}
  - {class: tech.units.indriya.internal.format.UnitTokenManager, method: reInit, match: "(DefaultCharStream stream)", note: "UnitTokenManager.reInit"}
  - {class: tech.units.indriya.quantity.Quantities, method: getQuantity, match: "(Number value, Unit<Q> unit, Scale scale)", note: "Quantities.getQuantity"}
