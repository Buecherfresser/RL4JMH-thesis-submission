# Curated performance-mutation sites for deobfuscator (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants deobfuscator --source data/external-src/<checkout> \
#       --sites data/projects/deobfuscator/mutation_sites.yaml

package_root: com.javadeobfuscator.deobfuscator

sites:
  - {class: com.javadeobfuscator.deobfuscator.Deobfuscator, method: getConstantPool, match: "(ClassNode classNode)", note: "Deobfuscator.getConstantPool"}
  - {class: com.javadeobfuscator.deobfuscator.analyzer.frame.ArrayLoadFrame, method: getIndex, match: "()", note: "ArrayLoadFrame.getIndex"}
  - {class: com.javadeobfuscator.deobfuscator.asm.ConstantPool, method: getSize, match: "()", note: "ConstantPool.getSize"}
  - {class: com.javadeobfuscator.deobfuscator.config.Configuration, method: getInput, match: "()", note: "Configuration.getInput"}
  - {class: com.javadeobfuscator.deobfuscator.exceptions.NoClassInPathException, method: getClassName, match: "()", note: "NoClassInPathException.getClassName"}
  - {class: com.javadeobfuscator.deobfuscator.executor.defined.MappedFieldProvider, method: getField, match: "(String className, String fieldName, String fieldDesc, JavaValue targetObject, Context context)", note: "MappedFieldProvider.getField"}
  - {class: com.javadeobfuscator.deobfuscator.graph.callgraph.CallGraphBuilder, method: newBuilder, match: "()", note: "CallGraphBuilder.newBuilder"}
  - {class: com.javadeobfuscator.deobfuscator.iterablematcher.AnyStep, method: tryMatch, match: "(AbstractInsnNode ain)", note: "AnyStep.tryMatch"}
  - {class: com.javadeobfuscator.deobfuscator.matcher.ANewArrayStep, method: tryMatch, match: "(InstructionMatcher matcher, AbstractInsnNode now)", note: "ANewArrayStep.tryMatch"}
  - {class: com.javadeobfuscator.deobfuscator.rules.allatori.RuleStringDecryptor, method: getDescription, match: "()", note: "RuleStringDecryptor.getDescription"}
  - {class: com.javadeobfuscator.deobfuscator.transformers.allatori.StringEncryptionTransformer, method: isCleanup, match: "()", note: "StringEncryptionTransformer.isCleanup"}
  - {class: com.javadeobfuscator.deobfuscator.utils.PrimitiveUtils, method: getPrimitiveByName, match: "(String name)", note: "PrimitiveUtils.getPrimitiveByName"}
  - {class: com.javadeobfuscator.deobfuscator.Deobfuscator, method: setConstantPool, match: "(ClassNode owner, ConstantPool pool)", note: "Deobfuscator.setConstantPool"}
  - {class: com.javadeobfuscator.deobfuscator.analyzer.frame.ArrayLoadFrame, method: getArray, match: "()", note: "ArrayLoadFrame.getArray"}
  - {class: com.javadeobfuscator.deobfuscator.asm.source.ConstantPropagatingSourceFinder, method: findSource, match: "(MethodNode methodNode, Frame<SourceValue>[] frames, List<AbstractInsnNode> instructions, AbstractInsnNode source, SourceValue want, AbstractInsnNode now)", note: "ConstantPropagatingSourceFinder.findSource"}
  - {class: com.javadeobfuscator.deobfuscator.config.Configuration, method: setInput, match: "(File input)", note: "Configuration.setInput"}
  - {class: com.javadeobfuscator.deobfuscator.executor.defined.MappedFieldProvider, method: setField, match: "(String className, String fieldName, String fieldDesc, JavaValue targetObject, Object value, Context context)", note: "MappedFieldProvider.setField"}
  - {class: com.javadeobfuscator.deobfuscator.graph.callgraph.CallGraphBuilder, method: withNode, match: "(ClassNode node)", note: "CallGraphBuilder.withNode"}
  - {class: com.javadeobfuscator.deobfuscator.iterablematcher.CastedSimpleStep, method: ofOpcodeRangeInclusive, match: "(int start, int end)", note: "CastedSimpleStep.ofOpcodeRangeInclusive"}
  - {class: com.javadeobfuscator.deobfuscator.matcher.NewArrayStep, method: tryMatch, match: "(InstructionMatcher matcher, AbstractInsnNode now)", note: "NewArrayStep.tryMatch"}
  - {class: com.javadeobfuscator.deobfuscator.rules.allatori.RuleStringDecryptor, method: test, match: "(Deobfuscator deobfuscator)", note: "RuleStringDecryptor.test"}
  - {class: com.javadeobfuscator.deobfuscator.transformers.allatori.StringEncryptionTransformer, method: setCleanup, match: "(boolean cleanup)", note: "StringEncryptionTransformer.setCleanup"}
  - {class: com.javadeobfuscator.deobfuscator.utils.PrimitiveUtils, method: getDefaultValue, match: "(Class<?> primitive)", note: "PrimitiveUtils.getDefaultValue"}
  - {class: com.javadeobfuscator.deobfuscator.DeobfuscatorMain, method: main, match: "(String[] args) throws ClassNotFoundException", note: "DeobfuscatorMain.main"}
  - {class: com.javadeobfuscator.deobfuscator.analyzer.frame.ArrayStoreFrame, method: getObject, match: "()", note: "ArrayStoreFrame.getObject"}
  - {class: com.javadeobfuscator.deobfuscator.asm.source.ExceptionHolder, method: getExceptionType, match: "()", note: "ExceptionHolder.getExceptionType"}
  - {class: com.javadeobfuscator.deobfuscator.config.TransformerConfig, method: getImplementation, match: "()", note: "TransformerConfig.getImplementation"}
  - {class: com.javadeobfuscator.deobfuscator.executor.defined.MappedMethodProvider, method: canInvokeMethod, match: "(String className, String methodName, String methodDesc, JavaValue targetObject, List<JavaValue> args, Context context)", note: "MappedMethodProvider.canInvokeMethod"}
  - {class: com.javadeobfuscator.deobfuscator.graph.inheritancegraph.InheritanceGraphBuilder, method: newBuilder, match: "()", note: "InheritanceGraphBuilder.newBuilder"}
  - {class: com.javadeobfuscator.deobfuscator.iterablematcher.CastedSimpleStep, method: ofOpcodeRangeInclusive, match: "(int start, int end, int[] additional)", note: "CastedSimpleStep.ofOpcodeRangeInclusive"}
  - {class: com.javadeobfuscator.deobfuscator.matcher.CapturingStep, method: tryMatch, match: "(InstructionMatcher matcher, AbstractInsnNode now)", note: "CapturingStep.tryMatch"}
  - {class: com.javadeobfuscator.deobfuscator.rules.antireleak.RuleStringDecryptor, method: getDescription, match: "()", note: "RuleStringDecryptor.getDescription"}
  - {class: com.javadeobfuscator.deobfuscator.transformers.allatori.string.StringEncryptionTransformer, method: transform, match: "() throws WrongTransformerException", note: "StringEncryptionTransformer.transform"}
  - {class: com.javadeobfuscator.deobfuscator.utils.Utils, method: isInstruction, match: "(AbstractInsnNode node)", note: "Utils.isInstruction"}
  - {class: com.javadeobfuscator.deobfuscator.DeobfuscatorMain, method: run, match: "(String[] args) throws ClassNotFoundException", note: "DeobfuscatorMain.run"}
  - {class: com.javadeobfuscator.deobfuscator.analyzer.frame.ArrayStoreFrame, method: getIndex, match: "()", note: "ArrayStoreFrame.getIndex"}
  - {class: com.javadeobfuscator.deobfuscator.asm.source.ExceptionHolder, method: getExceptionProperties, match: "()", note: "ExceptionHolder.getExceptionProperties"}
  - {class: com.javadeobfuscator.deobfuscator.config.TransformerConfig, method: getVmModifiers, match: "()", note: "TransformerConfig.getVmModifiers"}
  - {class: com.javadeobfuscator.deobfuscator.executor.defined.MappedMethodProvider, method: invokeMethod, match: "(String className, String methodName, String methodDesc, JavaValue targetObject, List<JavaValue> args, Context context)", note: "MappedMethodProvider.invokeMethod"}
  - {class: com.javadeobfuscator.deobfuscator.graph.inheritancegraph.InheritanceGraphBuilder, method: withNode, match: "(ClassNode node)", note: "InheritanceGraphBuilder.withNode"}
  - {class: com.javadeobfuscator.deobfuscator.iterablematcher.ConstantIntInsnStep, method: tryMatch, match: "(AbstractInsnNode ain)", note: "ConstantIntInsnStep.tryMatch"}
  - {class: com.javadeobfuscator.deobfuscator.matcher.FieldStep, method: tryMatch, match: "(InstructionMatcher matcher, AbstractInsnNode now)", note: "FieldStep.tryMatch"}
  - {class: com.javadeobfuscator.deobfuscator.rules.antireleak.RuleStringDecryptor, method: test, match: "(Deobfuscator deobfuscator)", note: "RuleStringDecryptor.test"}
  - {class: com.javadeobfuscator.deobfuscator.transformers.antireleak.StringEncryptionTransformer, method: transform, match: "()", note: "StringEncryptionTransformer.transform"}
  - {class: com.javadeobfuscator.deobfuscator.utils.Utils, method: notAbstractOrNative, match: "(MethodNode methodNode)", note: "Utils.notAbstractOrNative"}
  - {class: com.javadeobfuscator.deobfuscator.analyzer.frame.MathFrame, method: getTargets, match: "()", note: "MathFrame.getTargets"}
  - {class: com.javadeobfuscator.deobfuscator.asm.source.SimpleMethodConstantSourceFinder, method: findSource, match: "(MethodNode methodNode, Frame<SourceValue>[] frames, List<AbstractInsnNode> instructions, AbstractInsnNode source, SourceValue want, AbstractInsnNode now)", note: "SimpleMethodConstantSourceFinder.findSource"}
  - {class: com.javadeobfuscator.deobfuscator.config.TransformerConfigDeserializer, method: deserialize, match: "(JsonParser p, DeserializationContext ctxt) throws IOException, JsonProcessingException", note: "TransformerConfigDeserializer.deserialize"}
  - {class: com.javadeobfuscator.deobfuscator.executor.values.JavaArray, method: onValueStored, match: "(int index, String type)", note: "JavaArray.onValueStored"}
  - {class: com.javadeobfuscator.deobfuscator.graph.GraphHelper, method: validateUniqueClasses, match: "(Collection<ClassNode> nodes)", note: "GraphHelper.validateUniqueClasses"}
