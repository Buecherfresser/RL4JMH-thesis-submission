# Curated performance-mutation sites for numbers-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants numbers-java --source data/external-src/<checkout> \
#       --sites data/projects/numbers-java/mutation_sites.yaml

package_root: com.upokecenter.numbers

