# Curated performance-mutation sites for memoryfilesystem (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants memoryfilesystem --source data/external-src/<checkout> \
#       --sites data/projects/memoryfilesystem/mutation_sites.yaml

package_root: com.github.marschall

sites:
  - {class: com.github.marschall.memoryfilesystem.ArrayCharacterSet, method: containsAny, match: "(String s)", note: "ArrayCharacterSet.containsAny"}
  - {class: com.github.marschall.memoryfilesystem.BlockInputStream, method: close, match: "()", note: "BlockInputStream.close"}
  - {class: com.github.marschall.memoryfilesystem.BlockInputStream, method: transferTo, match: "(OutputStream out) throws IOException", note: "BlockInputStream.transferTo"}
  - {class: com.github.marschall.memoryfilesystem.CompositeList, method: size, match: "()", note: "CompositeList.size"}
  - {class: com.github.marschall.memoryfilesystem.CompositeList, method: subList, match: "(int fromIndex, int toIndex)", note: "CompositeList.subList"}
  - {class: com.github.marschall.memoryfilesystem.EmptyCharacterSet, method: containsAny, match: "(String s)", note: "EmptyCharacterSet.containsAny"}
  - {class: com.github.marschall.memoryfilesystem.MemoryDirectoryStream, method: close, match: "()", note: "MemoryDirectoryStream.close"}
  - {class: com.github.marschall.memoryfilesystem.MemoryDirectoryStream, method: iterator, match: "()", note: "MemoryDirectoryStream.iterator"}
  - {class: com.github.marschall.memoryfilesystem.MemoryFileSystemBuilder, method: addRoot, match: "(String root)", note: "MemoryFileSystemBuilder.addRoot"}
  - {class: com.github.marschall.memoryfilesystem.MemoryFileSystemBuilder, method: setSeparator, match: "(String separator)", note: "MemoryFileSystemBuilder.setSeparator"}
  - {class: com.github.marschall.memoryfilesystem.MultipleNamedRootsPathParser, method: parse, match: "(Map<String, Root> roots, String first, String... more)", note: "MultipleNamedRootsPathParser.parse"}
  - {class: com.github.marschall.memoryfilesystem.ParentReferenceList, method: size, match: "()", note: "ParentReferenceList.size"}
  - {class: com.github.marschall.memoryfilesystem.ParentReferenceList, method: subList, match: "(int fromIndex, int toIndex)", note: "ParentReferenceList.subList"}
  - {class: com.github.marschall.memoryfilesystem.SingleEmptyRootPathParser, method: parse, match: "(Map<String, Root> roots, String first, String... more)", note: "SingleEmptyRootPathParser.parse"}
  - {class: com.github.marschall.memoryfilesystem.StringTransformers, method: caseInsensitive, match: "()", note: "StringTransformers.caseInsensitive"}
  - {class: com.github.marschall.memoryfilesystem.StringTransformers, method: caseInsensitive, match: "(Locale locale)", note: "StringTransformers.caseInsensitive"}
  - {class: com.github.marschall.memoryfilesystem.memory.MemoryURLStreamHandlerFactory, method: createURLStreamHandler, match: "(String protocol)", note: "MemoryURLStreamHandlerFactory.createURLStreamHandler"}
  - {class: com.github.marschall.memoryfilesystem.AbsolutePath, method: isAbsolute, match: "()", note: "AbsolutePath.isAbsolute"}
  - {class: com.github.marschall.memoryfilesystem.AbsolutePath, method: getRoot, match: "()", note: "AbsolutePath.getRoot"}
  - {class: com.github.marschall.memoryfilesystem.AppendingBlockChannel, method: truncate, match: "(long size) throws IOException", note: "AppendingBlockChannel.truncate"}
  - {class: com.github.marschall.memoryfilesystem.AppendingBlockChannel, method: transferFrom, match: "(ReadableByteChannel src, long position, long count) throws IOException", note: "AppendingBlockChannel.transferFrom"}
  - {class: com.github.marschall.memoryfilesystem.AsynchronousBlockChannel, method: close, match: "() throws IOException", note: "AsynchronousBlockChannel.close"}
  - {class: com.github.marschall.memoryfilesystem.AsynchronousBlockChannel, method: isOpen, match: "()", note: "AsynchronousBlockChannel.isOpen"}
  - {class: com.github.marschall.memoryfilesystem.AsynchronousDirectoryFileChannel, method: close, match: "() throws IOException", note: "AsynchronousDirectoryFileChannel.close"}
  - {class: com.github.marschall.memoryfilesystem.AsynchronousDirectoryFileChannel, method: isOpen, match: "()", note: "AsynchronousDirectoryFileChannel.isOpen"}
  - {class: com.github.marschall.memoryfilesystem.AttributeAccessors, method: readAttribute, match: "(AttributeReadContext context) throws IOException", note: "AttributeAccessors.readAttribute"}
  - {class: com.github.marschall.memoryfilesystem.AttributeAccessors, method: writeAttribute, match: "(Object value, MemoryEntry entry) throws IOException", note: "AttributeAccessors.writeAttribute"}
  - {class: com.github.marschall.memoryfilesystem.AutoReleaseLock, method: close, match: "()", note: "AutoReleaseLock.close"}
  - {class: com.github.marschall.memoryfilesystem.CurrentGroup, method: useDuring, match: "(GroupPrincipal group, GroupTask<V> task) throws IOException", note: "CurrentGroup.useDuring"}
  - {class: com.github.marschall.memoryfilesystem.CurrentGroup, method: useDuring, match: "(GroupPrincipal group, VoidGroupTask task) throws IOException", note: "CurrentGroup.useDuring"}
  - {class: com.github.marschall.memoryfilesystem.CurrentUser, method: useDuring, match: "(UserPrincipal user, UserTask<V> task) throws IOException", note: "CurrentUser.useDuring"}
