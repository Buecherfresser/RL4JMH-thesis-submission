  - {class: org.apache.commons.math4.legacy.analysis.polynomials.PolynomialFunctionNewtonForm, method: value, match: "(double z)", note: "PolynomialFunctionNewtonForm.value"}
  - {class: org.apache.commons.math4.neuralnet.Network, method: getNeurons, match: "()", note: "Network.getNeurons"}
  - {class: org.apache.commons.math4.legacy.analysis.polynomials.PolynomialFunctionNewtonForm, method: value, match: "(final DerivativeStructure t)", note: "PolynomialFunctionNewtonForm.value"}
  - {class: org.apache.commons.math4.neuralnet.Neuron, method: getIdentifier, match: "()", note: "Neuron.getIdentifier"}
  - {class: org.apache.commons.math4.legacy.analysis.polynomials.PolynomialSplineFunction, method: value, match: "(double v)", note: "PolynomialSplineFunction.value"}
  - {class: org.apache.commons.math4.neuralnet.Neuron, method: getSize, match: "()", note: "Neuron.getSize"}
  - {class: org.apache.commons.math4.legacy.analysis.polynomials.PolynomialSplineFunction, method: polynomialSplineDerivative, match: "()", note: "PolynomialSplineFunction.polynomialSplineDerivative"}
  - {class: org.apache.commons.math4.neuralnet.sofm.KohonenTrainingTask, method: run, match: "()", note: "KohonenTrainingTask.run"}
  - {class: org.apache.commons.math4.legacy.analysis.polynomials.PolynomialsUtils, method: createChebyshevPolynomial, match: "(final int degree)", note: "PolynomialsUtils.createChebyshevPolynomial"}
