# Curated performance-mutation sites for minimal-json (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants minimal-json --source data/external-src/<checkout> \
#       --sites data/projects/minimal-json/mutation_sites.yaml

package_root: com.eclipsesource.json

sites:
  - {class: com.eclipsesource.json.JsonArray, method: readFrom, match: "(Reader reader) throws IOException", note: "JsonArray.readFrom"}
  - {class: com.eclipsesource.json.performancetest.BufferedReaderBenchmark, method: setUp, match: "() throws Exception", note: "BufferedReaderBenchmark.setUp"}
  - {class: com.eclipsesource.json.JsonArray, method: readFrom, match: "(String string)", note: "JsonArray.readFrom"}
  - {class: com.eclipsesource.json.performancetest.BufferedReaderBenchmark, method: timeReader, match: "(int reps) throws Exception", note: "BufferedReaderBenchmark.timeReader"}
  - {class: com.eclipsesource.json.JsonNumber, method: isNumber, match: "()", note: "JsonNumber.isNumber"}
  - {class: com.eclipsesource.json.performancetest.BufferedStringWriterBenchmark, method: setUp, match: "() throws Exception", note: "BufferedStringWriterBenchmark.setUp"}
  - {class: com.eclipsesource.json.JsonNumber, method: asInt, match: "()", note: "JsonNumber.asInt"}
  - {class: com.eclipsesource.json.performancetest.BufferedStringWriterBenchmark, method: timeStringWriter, match: "(int reps) throws Exception", note: "BufferedStringWriterBenchmark.timeStringWriter"}
  - {class: com.eclipsesource.json.JsonParser, method: parse, match: "(String string)", note: "JsonParser.parse"}
  - {class: com.eclipsesource.json.performancetest.BufferedWriterBenchmark, method: setUp, match: "() throws Exception", note: "BufferedWriterBenchmark.setUp"}
  - {class: com.eclipsesource.json.JsonParser, method: parse, match: "(Reader reader) throws IOException", note: "JsonParser.parse"}
  - {class: com.eclipsesource.json.performancetest.BufferedWriterBenchmark, method: timeWriter, match: "(int reps) throws Exception", note: "BufferedWriterBenchmark.timeWriter"}
  - {class: com.eclipsesource.json.JsonString, method: isString, match: "()", note: "JsonString.isString"}
  - {class: com.eclipsesource.json.performancetest.DoubleBufferingBenchmark, method: timePlainWriter, match: "(int reps) throws Exception", note: "DoubleBufferingBenchmark.timePlainWriter"}
  - {class: com.eclipsesource.json.JsonString, method: asString, match: "()", note: "JsonString.asString"}
  - {class: com.eclipsesource.json.performancetest.DoubleBufferingBenchmark, method: timeBufferedWriter, match: "(int reps) throws Exception", note: "DoubleBufferingBenchmark.timeBufferedWriter"}
  - {class: com.eclipsesource.json.WritingBuffer, method: close, match: "() throws IOException", note: "WritingBuffer.close"}
  - {class: com.eclipsesource.json.performancetest.ExampleArrayListWithHash, method: indexOf, match: "(Object element)", note: "ExampleArrayListWithHash.indexOf"}
  - {class: com.eclipsesource.json.Json, method: value, match: "(int value)", note: "Json.value"}
  - {class: com.eclipsesource.json.performancetest.ListVsHashLookupBenchmark, method: setUp, match: "() throws IOException", note: "ListVsHashLookupBenchmark.setUp"}
  - {class: com.eclipsesource.json.Json, method: value, match: "(long value)", note: "Json.value"}
  - {class: com.eclipsesource.json.performancetest.ListVsHashLookupBenchmark, method: timeFillArrayList, match: "(int reps)", note: "ListVsHashLookupBenchmark.timeFillArrayList"}
  - {class: com.eclipsesource.json.JsonLiteral, method: isNull, match: "()", note: "JsonLiteral.isNull"}
  - {class: com.eclipsesource.json.performancetest.IntVsLongBenchmark, method: timeValueOfInt, match: "(int reps)", note: "IntVsLongBenchmark.timeValueOfInt"}
