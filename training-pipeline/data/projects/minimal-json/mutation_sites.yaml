  - {class: com.eclipsesource.json.performancetest.jsonrunners.GsonRunner, method: readFromReader, match: "(Reader reader) throws Exception", note: "GsonRunner.readFromReader"}
  - {class: com.eclipsesource.json.performancetest.jsonrunners.JacksonRunner, method: readFromString, match: "(String string) throws Exception", note: "JacksonRunner.readFromString"}
  - {class: com.eclipsesource.json.performancetest.jsonrunners.JacksonRunner, method: readFromByteArray, match: "(byte[] bytes) throws Exception", note: "JacksonRunner.readFromByteArray"}
