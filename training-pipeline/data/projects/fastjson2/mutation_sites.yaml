# Curated performance-mutation sites for fastjson2 (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants fastjson2 --source data/external-src/<checkout> \
#       --sites data/projects/fastjson2/mutation_sites.yaml

package_root: com.alibaba.fastjson2

sites:
  - {class: com.alibaba.fastjson2.JSONArray, method: getJSONArray, match: "(int index)", note: "JSONArray.getJSONArray"}
  - {class: com.alibaba.fastjson2.android.MainActivity, method: onCreate, match: "(Bundle savedInstanceState)", note: "MainActivity.onCreate"}
  - {class: com.alibaba.fastjson2.codec.BeanInfo, method: required, match: "(String fieldName)", note: "BeanInfo.required"}
  - {class: com.alibaba.fastjson2.filter.BeanContext, method: getBeanClass, match: "()", note: "BeanContext.getBeanClass"}
  - {class: com.alibaba.fastjson2.function.FieldSupplierFunction, method: apply, match: "(T object)", note: "FieldSupplierFunction.apply"}
  - {class: com.alibaba.fastjson2.internal.CodeGenUtils, method: fieldReader, match: "(int i)", note: "CodeGenUtils.fieldReader"}
  - {class: com.alibaba.fastjson2.introspect.PropertyAccessorFactory, method: createSupplier, match: "(Constructor constructor)", note: "PropertyAccessorFactory.createSupplier"}
  - {class: com.alibaba.fastjson2.reader.ConstructorFunction, method: apply, match: "(Map<Long, Object> values)", note: "ConstructorFunction.apply"}
  - {class: com.alibaba.fastjson2.schema.ArraySchema, method: validateInternal, match: "(Object value)", note: "ArraySchema.validateInternal"}
  - {class: com.alibaba.fastjson2.stream.JSONStreamReaderUTF16, method: seekLine, match: "() throws IOException", note: "JSONStreamReaderUTF16.seekLine"}
  - {class: com.alibaba.fastjson2.support.airlift.JSONFunctions, method: jsonExtract, match: "(Slice json, JSONPath path)", note: "JSONFunctions.jsonExtract"}
  - {class: com.alibaba.fastjson2.util.DateUtils, method: parseDateYMDHMS19, match: "(String str)", note: "DateUtils.parseDateYMDHMS19"}
  - {class: com.alibaba.fastjson2.writer.FieldWriterList, method: getItemType, match: "()", note: "FieldWriterList.getItemType"}
  - {class: com.alibaba.fastjson2.JSONArray, method: getJSONObject, match: "(int index)", note: "JSONArray.getJSONObject"}
  - {class: com.alibaba.fastjson2.android.MainActivity, method: fastjson1EishaySerde, match: "()", note: "MainActivity.fastjson1EishaySerde"}
  - {class: com.alibaba.fastjson2.codec.FieldInfo, method: getInitReader, match: "()", note: "FieldInfo.getInitReader"}
  - {class: com.alibaba.fastjson2.filter.BeanContext, method: getMethod, match: "()", note: "BeanContext.getMethod"}
  - {class: com.alibaba.fastjson2.function.impl.StringToAny, method: apply, match: "(Object from)", note: "StringToAny.apply"}
  - {class: com.alibaba.fastjson2.internal.asm.ASMUtils, method: type, match: "(Class<?> clazz)", note: "ASMUtils.type"}
  - {class: com.alibaba.fastjson2.introspect.PropertyAccessorFactory, method: createFunction, match: "(Constructor constructor)", note: "PropertyAccessorFactory.createFunction"}
  - {class: com.alibaba.fastjson2.reader.FactoryFunction, method: apply, match: "(Map<Long, Object> values)", note: "FactoryFunction.apply"}
  - {class: com.alibaba.fastjson2.schema.ArraySchema, method: toJSONObject, match: "()", note: "ArraySchema.toJSONObject"}
  - {class: com.alibaba.fastjson2.stream.JSONStreamReaderUTF16, method: readLineObject, match: "()", note: "JSONStreamReaderUTF16.readLineObject"}
  - {class: com.alibaba.fastjson2.support.arrow.ArrowByteArrayConsumer, method: afterRow, match: "(int row)", note: "ArrowByteArrayConsumer.afterRow"}
  - {class: com.alibaba.fastjson2.util.DateUtils, method: parseDate, match: "(String str, String format)", note: "DateUtils.parseDate"}
  - {class: com.alibaba.fastjson2.writer.FieldWriterList, method: getItemClass, match: "()", note: "FieldWriterList.getItemClass"}
  - {class: com.alibaba.fastjson2.JSONPathFunction, method: accept, match: "(JSONReader jsonReader, JSONPath.Context context)", note: "JSONPathFunction.accept"}
  - {class: com.alibaba.fastjson2.android.eishay.MediaContent, method: setMedia, match: "(Media media)", note: "MediaContent.setMedia"}
  - {class: com.alibaba.fastjson2.codec.FieldInfo, method: getInitArrayToMapDuplicateHandler, match: "()", note: "FieldInfo.getInitArrayToMapDuplicateHandler"}
  - {class: com.alibaba.fastjson2.filter.CompositeLabelFilter, method: apply, match: "(String label)", note: "CompositeLabelFilter.apply"}
  - {class: com.alibaba.fastjson2.function.impl.ToNumber, method: apply, match: "(Object o)", note: "ToNumber.apply"}
  - {class: com.alibaba.fastjson2.internal.asm.ASMUtils, method: desc, match: "(Class<?> clazz)", note: "ASMUtils.desc"}
  - {class: com.alibaba.fastjson2.introspect.PropertyAccessorFactoryUnsafe, method: createInternal, match: "(Field field)", note: "PropertyAccessorFactoryUnsafe.createInternal"}
  - {class: com.alibaba.fastjson2.reader.FactoryFunction, method: createInstance, match: "(Object[] args)", note: "FactoryFunction.createInstance"}
  - {class: com.alibaba.fastjson2.schema.NumberSchema, method: validateInternal, match: "(Object value)", note: "NumberSchema.validateInternal"}
  - {class: com.alibaba.fastjson2.stream.JSONStreamReaderUTF8, method: seekLine, match: "() throws IOException", note: "JSONStreamReaderUTF8.seekLine"}
  - {class: com.alibaba.fastjson2.support.arrow.ArrowByteArrayConsumer, method: allocateNew, match: "(int blockSize)", note: "ArrowByteArrayConsumer.allocateNew"}
  - {class: com.alibaba.fastjson2.util.IOUtils, method: writeDigitPair, match: "(byte[] buf, int charPos, int value)", note: "IOUtils.writeDigitPair"}
  - {class: com.alibaba.fastjson2.writer.FieldWriterMap, method: getObjectWriter, match: "(JSONWriter jsonWriter, Class valueClass)", note: "FieldWriterMap.getObjectWriter"}
  - {class: com.alibaba.fastjson2.JSONPathFunction, method: eval, match: "(JSONPath.Context context)", note: "JSONPathFunction.eval"}
  - {class: com.alibaba.fastjson2.android.eishay.MediaContent, method: setImages, match: "(List<Image> images)", note: "MediaContent.setImages"}
  - {class: com.alibaba.fastjson2.filter.CompositePropertyFilter, method: apply, match: "(Object object, String name, Object value)", note: "CompositePropertyFilter.apply"}
  - {class: com.alibaba.fastjson2.function.impl.ToString, method: apply, match: "(Object o)", note: "ToString.apply"}
  - {class: com.alibaba.fastjson2.internal.processor.CodeGenUtils, method: getReadSuperClass, match: "(int fieldReaders)", note: "CodeGenUtils.getReadSuperClass"}
  - {class: com.alibaba.fastjson2.introspect.PropertyAccessorFactoryUnsafe, method: getBooleanValue, match: "(Object object)", note: "PropertyAccessorFactoryUnsafe.getBooleanValue"}
  - {class: com.alibaba.fastjson2.reader.FieldReaderAnySetter, method: getItemObjectReader, match: "(JSONReader jsonReader)", note: "FieldReaderAnySetter.getItemObjectReader"}
  - {class: com.alibaba.fastjson2.schema.NumberSchema, method: validateInternal, match: "(Integer value)", note: "NumberSchema.validateInternal"}
  - {class: com.alibaba.fastjson2.stream.JSONStreamReaderUTF8, method: readLineObject, match: "()", note: "JSONStreamReaderUTF8.readLineObject"}
  - {class: com.alibaba.fastjson2.support.arrow.ArrowUtils, method: setValue, match: "(FieldVector vector, int row, String value)", note: "ArrowUtils.setValue"}
  - {class: com.alibaba.fastjson2.util.IOUtils, method: writeDigitPair, match: "(char[] buf, int charPos, int value)", note: "IOUtils.writeDigitPair"}
