  - {class: de.graetz23.jwave.tools.MathToolKit, method: compose, match: "( int[ ] ancientEgyptianMultipliers ) throws JWaveException", note: "MathToolKit.compose"}
  - {class: de.graetz23.jwave.transforms.DiscreteFourierTransform, method: forward, match: "(double[] arrTime) throws JWaveException", note: "DiscreteFourierTransform.forward"}
  - {class: de.graetz23.jwave.Transform, method: forward, match: "(double[] arrTime, int level)", note: "Transform.forward"}
  - {class: de.graetz23.jwave.datatypes.natives.Complex, method: getReal, match: "( )", note: "Complex.getReal"}
  - {class: de.graetz23.jwave.tools.MathToolKit, method: isBinary, match: "( int number )", note: "MathToolKit.isBinary"}
