  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.ShuffleTransformer, method: pre, match: "()", note: "ShuffleTransformer.pre"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.ShuffleTransformer, method: post, match: "()", note: "ShuffleTransformer.post"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.SourceFileTransformer, method: transformClass, match: "(ClassNode classNode)", note: "SourceFileTransformer.transformClass"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.SourceFileTransformer, method: getEnableType, match: "()", note: "SourceFileTransformer.getEnableType"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.renamer.ClassRenamerTransformer, method: transformClass, match: "(ClassNode classNode)", note: "ClassRenamerTransformer.transformClass"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.renamer.ClassRenamerTransformer, method: transformResource, match: "(ResourceWrapper resource)", note: "ClassRenamerTransformer.transformResource"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.renamer.FieldRenamerTransformer, method: transformClass, match: "(ClassNode classNode)", note: "FieldRenamerTransformer.transformClass"}
  - {class: io.github.vimasig.bozar.obfuscator.transformer.impl.renamer.FieldRenamerTransformer, method: getEnableType, match: "()", note: "FieldRenamerTransformer.getEnableType"}
