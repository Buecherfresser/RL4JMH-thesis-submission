  - {class: com.creditdatamw.zerocell.converter.DoubleConverter, method: convert, match: "(String value, String columnName, int row)", note: "DoubleConverter.convert"}
  - {class: com.creditdatamw.zerocell.handler.EntityHandler, method: getEntitySheetHandler, match: "()", note: "EntityHandler.getEntitySheetHandler"}
  - {class: com.creditdatamw.zerocell.processor.spec.CellMethodSpec, method: converterStatementFor, match: "(ColumnInfoType column)", note: "CellMethodSpec.converterStatementFor"}
  - {class: com.creditdatamw.zerocell.Reader, method: from, match: "(InputStream inputStream)", note: "Reader.from"}
