  - {class: com.linkedin.paldb.impl.StorageSerialization, method: serializeKey, match: "(Object key, DataOutput dataOutput)", note: "StorageSerialization.serializeKey"}
  - {class: com.linkedin.paldb.impl.StorageSerialization, method: serializeValue, match: "(Object value)", note: "StorageSerialization.serializeValue"}
  - {class: com.linkedin.paldb.impl.StorageSerialization, method: serializeValue, match: "(Object value, DataOutput dataOutput)", note: "StorageSerialization.serializeValue"}
  - {class: com.linkedin.paldb.impl.StorageWriter, method: close, match: "()", note: "StorageWriter.close"}
  - {class: com.linkedin.paldb.impl.StoreImpl, method: createReader, match: "(File file, Configuration config)", note: "StoreImpl.createReader"}
  - {class: com.linkedin.paldb.impl.StoreImpl, method: createReader, match: "(InputStream stream, Configuration config)", note: "StoreImpl.createReader"}
  - {class: com.linkedin.paldb.impl.StoreImpl, method: createWriter, match: "(File file, Configuration config)", note: "StoreImpl.createWriter"}
  - {class: com.linkedin.paldb.impl.StoreImpl, method: createWriter, match: "(OutputStream stream, Configuration config)", note: "StoreImpl.createWriter"}
