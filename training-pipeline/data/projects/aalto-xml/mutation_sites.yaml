  - {class: com.fasterxml.aalto.sax.SAXParserImpl, method: getXMLReader, match: "()", note: "SAXParserImpl.getXMLReader"}
  - {class: com.fasterxml.aalto.stax.EventFactoryImpl, method: createQName, match: "(String nsURI, String localName, String prefix)", note: "EventFactoryImpl.createQName"}
  - {class: com.fasterxml.aalto.util.DataUtil, method: growArrayBy, match: "(String[] arr, int more)", note: "DataUtil.growArrayBy"}
  - {class: com.fasterxml.aalto.async.AsyncStreamReaderImpl, method: getInputFeeder, match: "()", note: "AsyncStreamReaderImpl.getInputFeeder"}
  - {class: com.fasterxml.aalto.dom.DOMReaderImpl, method: createFrom, match: "(DOMSource src, ReaderConfig cfg)", note: "DOMReaderImpl.createFrom"}
  - {class: com.fasterxml.aalto.evt.IncompleteEvent, method: instance, match: "()", note: "IncompleteEvent.instance"}
  - {class: com.fasterxml.aalto.impl.LocationImpl, method: fromZeroBased, match: "(String pubId, String sysId,", note: "LocationImpl.fromZeroBased"}
  - {class: com.fasterxml.aalto.in.ByteBasedPNameFactory, method: getInstance, match: "()", note: "ByteBasedPNameFactory.getInstance"}
  - {class: com.fasterxml.aalto.out.AsciiXmlWriter, method: getHighestEncodable, match: "()", note: "AsciiXmlWriter.getHighestEncodable"}
  - {class: com.fasterxml.aalto.sax.SAXUtil, method: findStdFeature, match: "(String featURI)", note: "SAXUtil.findStdFeature"}
  - {class: com.fasterxml.aalto.stax.InputFactoryImpl, method: createFilteredReader, match: "(XMLEventReader reader, EventFilter filter)", note: "InputFactoryImpl.createFilteredReader"}
