  - {class: br.com.leonardoz.patterns.non_blocking.NonBlockingDesign, method: getValue, match: "()", note: "NonBlockingDesign.getValue"}
  - {class: br.com.leonardoz.features.locks.UsingIntrinsicLocks, method: mySynchronizedMethod, match: "()", note: "UsingIntrinsicLocks.mySynchronizedMethod"}
  - {class: br.com.leonardoz.patterns.producer_consumer.ProducerConsumer, method: run, match: "(long forHowLong, TimeUnit unit) throws InterruptedException", note: "ProducerConsumer.run"}
  - {class: br.com.leonardoz.features.locks.UsingIntrinsicLocks, method: mySynchronizedBlock, match: "()", note: "UsingIntrinsicLocks.mySynchronizedBlock"}
  - {class: br.com.leonardoz.patterns.producer_consumer.ProducerConsumer, method: main, match: "(String[] args)", note: "ProducerConsumer.main"}
  - {class: br.com.leonardoz.features.synchronizers.UsingBarriers, method: main, match: "(String[] args)", note: "UsingBarriers.main"}
  - {class: br.com.leonardoz.patterns.resource_pool.ResourcePool, method: release, match: "(T resource) throws InterruptedException", note: "ResourcePool.release"}
  - {class: br.com.leonardoz.features.synchronizers.UsingLatches, method: main, match: "(String[] args)", note: "UsingLatches.main"}
  - {class: br.com.leonardoz.patterns.resource_pool.ResourcePoolUsage, method: main, match: "(String[] args)", note: "ResourcePoolUsage.main"}
