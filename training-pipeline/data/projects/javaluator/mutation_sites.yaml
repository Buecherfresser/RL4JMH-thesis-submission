# Curated performance-mutation sites for javaluator (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants javaluator --source data/external-src/<checkout> \
#       --sites data/projects/javaluator/mutation_sites.yaml

package_root: com.fathzer.soft

sites:
  - {class: com.fathzer.soft.javaluator.Function, method: getName, match: "()", note: "Function.getName"}
  - {class: com.fathzer.soft.javaluator.Function, method: getMinimumArgumentCount, match: "()", note: "Function.getMinimumArgumentCount"}
  - {class: com.fathzer.soft.javaluator.Function, method: getMaximumArgumentCount, match: "()", note: "Function.getMaximumArgumentCount"}
  - {class: com.fathzer.soft.javaluator.BracketPair, method: getOpen, match: "()", note: "BracketPair.getOpen"}
  - {class: com.fathzer.soft.javaluator.BracketPair, method: getClose, match: "()", note: "BracketPair.getClose"}
  - {class: com.fathzer.soft.javaluator.Constant, method: getName, match: "()", note: "Constant.getName"}
  - {class: com.fathzer.soft.javaluator.DoubleEvaluator, method: getDefaultParameters, match: "()", note: "DoubleEvaluator.getDefaultParameters"}
  - {class: com.fathzer.soft.javaluator.DoubleEvaluator, method: getDefaultParameters, match: "(Style style)", note: "DoubleEvaluator.getDefaultParameters"}
  - {class: com.fathzer.soft.javaluator.DoubleEvaluator, method: tokenize, match: "(String expression)", note: "DoubleEvaluator.tokenize"}
  - {class: com.fathzer.soft.javaluator.DoubleEvaluator, method: isScientificNotation, match: "(String str)", note: "DoubleEvaluator.isScientificNotation"}
  - {class: com.fathzer.soft.javaluator.DoubleEvaluator, method: toValue, match: "(String literal, Object evaluationContext)", note: "DoubleEvaluator.toValue"}
  - {class: com.fathzer.soft.javaluator.DoubleEvaluator, method: evaluate, match: "(Constant constant, Object evaluationContext)", note: "DoubleEvaluator.evaluate"}
  - {class: com.fathzer.soft.javaluator.DoubleEvaluator, method: evaluate, match: "(Operator operator, Iterator<Double> operands, Object evaluationContext)", note: "DoubleEvaluator.evaluate"}
  - {class: com.fathzer.soft.javaluator.DoubleEvaluator, method: evaluate, match: "(Function function, Iterator<Double> arguments, Object evaluationContext)", note: "DoubleEvaluator.evaluate"}
  - {class: com.fathzer.soft.javaluator.Operator, method: getSymbol, match: "()", note: "Operator.getSymbol"}
  - {class: com.fathzer.soft.javaluator.Operator, method: getOperandCount, match: "()", note: "Operator.getOperandCount"}
  - {class: com.fathzer.soft.javaluator.Operator, method: getAssociativity, match: "()", note: "Operator.getAssociativity"}
  - {class: com.fathzer.soft.javaluator.Operator, method: getPrecedence, match: "()", note: "Operator.getPrecedence"}
  - {class: com.fathzer.soft.javaluator.Parameters, method: getOperators, match: "()", note: "Parameters.getOperators"}
  - {class: com.fathzer.soft.javaluator.Parameters, method: getFunctions, match: "()", note: "Parameters.getFunctions"}
  - {class: com.fathzer.soft.javaluator.Parameters, method: getConstants, match: "()", note: "Parameters.getConstants"}
  - {class: com.fathzer.soft.javaluator.Parameters, method: getExpressionBrackets, match: "()", note: "Parameters.getExpressionBrackets"}
  - {class: com.fathzer.soft.javaluator.Parameters, method: getFunctionBrackets, match: "()", note: "Parameters.getFunctionBrackets"}
  - {class: com.fathzer.soft.javaluator.Parameters, method: addOperators, match: "(Collection<Operator> operators)", note: "Parameters.addOperators"}
  - {class: com.fathzer.soft.javaluator.Parameters, method: addFunctions, match: "(Collection<Function> functions)", note: "Parameters.addFunctions"}
  - {class: com.fathzer.soft.javaluator.Parameters, method: addConstants, match: "(Collection<Constant> constants)", note: "Parameters.addConstants"}
  - {class: com.fathzer.soft.javaluator.Parameters, method: addExpressionBracket, match: "(BracketPair pair)", note: "Parameters.addExpressionBracket"}
  - {class: com.fathzer.soft.javaluator.Parameters, method: addExpressionBrackets, match: "(Collection<BracketPair> brackets)", note: "Parameters.addExpressionBrackets"}
  - {class: com.fathzer.soft.javaluator.Parameters, method: addFunctionBracket, match: "(BracketPair pair)", note: "Parameters.addFunctionBracket"}
  - {class: com.fathzer.soft.javaluator.Parameters, method: addFunctionBrackets, match: "(Collection<BracketPair> brackets)", note: "Parameters.addFunctionBrackets"}
  - {class: com.fathzer.soft.javaluator.Parameters, method: setTranslation, match: "(Function function, String translatedName)", note: "Parameters.setTranslation"}
  - {class: com.fathzer.soft.javaluator.Parameters, method: setTranslation, match: "(Constant constant, String translatedName)", note: "Parameters.setTranslation"}
  - {class: com.fathzer.soft.javaluator.Parameters, method: setFunctionArgumentSeparator, match: "(char separator)", note: "Parameters.setFunctionArgumentSeparator"}
  - {class: com.fathzer.soft.javaluator.Parameters, method: getFunctionArgumentSeparator, match: "()", note: "Parameters.getFunctionArgumentSeparator"}
  - {class: com.fathzer.soft.javaluator.Token, method: isOperator, match: "()", note: "Token.isOperator"}
  - {class: com.fathzer.soft.javaluator.Token, method: isFunction, match: "()", note: "Token.isFunction"}
  - {class: com.fathzer.soft.javaluator.Token, method: isOpenBracket, match: "()", note: "Token.isOpenBracket"}
  - {class: com.fathzer.soft.javaluator.Token, method: isCloseBracket, match: "()", note: "Token.isCloseBracket"}
  - {class: com.fathzer.soft.javaluator.Token, method: isFunctionArgumentSeparator, match: "()", note: "Token.isFunctionArgumentSeparator"}
  - {class: com.fathzer.soft.javaluator.Token, method: isLiteral, match: "()", note: "Token.isLiteral"}
  - {class: com.fathzer.soft.javaluator.Tokenizer, method: isTrimTokens, match: "()", note: "Tokenizer.isTrimTokens"}
  - {class: com.fathzer.soft.javaluator.Tokenizer, method: setTrimTokens, match: "(boolean trimTokens)", note: "Tokenizer.setTrimTokens"}
  - {class: com.fathzer.soft.javaluator.Tokenizer, method: tokenize, match: "(String string)", note: "Tokenizer.tokenize"}
