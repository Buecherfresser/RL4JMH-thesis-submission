# Curated performance-mutation sites for erdos (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants erdos --source data/external-src/<checkout> \
#       --sites data/projects/erdos/mutation_sites.yaml

package_root: com.hendrix.erdos

sites:
  - {class: com.hendrix.erdos.Erdos, method: hasMultiEdges, match: "()", note: "Erdos.hasMultiEdges"}
  - {class: com.hendrix.erdos.algorithms.AbstractGraphAlgorithm, method: setInputGraph, match: "(E graph)", note: "AbstractGraphAlgorithm.setInputGraph"}
  - {class: com.hendrix.erdos.graphs.AbstractGraph, method: iterator, match: "()", note: "AbstractGraph.iterator"}
  - {class: com.hendrix.erdos.types.Edge, method: getEdgeDesc, match: "(IVertex v1, IVertex v2, EDGE_DIRECTION edgeType)", note: "Edge.getEdgeDesc"}
  - {class: com.hendrix.erdos.utils.EdgeFunction, method: addAll, match: "(Collection<Edge> edges)", note: "EdgeFunction.addAll"}
  - {class: com.hendrix.erdos.Erdos, method: hasSelfLoops, match: "()", note: "Erdos.hasSelfLoops"}
  - {class: com.hendrix.erdos.algorithms.AbstractGraphAlgorithm, method: getInputGraph, match: "()", note: "AbstractGraphAlgorithm.getInputGraph"}
  - {class: com.hendrix.erdos.graphs.AbstractGraph, method: vertices, match: "()", note: "AbstractGraph.vertices"}
  - {class: com.hendrix.erdos.types.Edge, method: getEdgeDesc, match: "(Edge edge, EDGE_DIRECTION edgeType)", note: "Edge.getEdgeDesc"}
  - {class: com.hendrix.erdos.utils.EdgeFunction, method: addValue, match: "(IVertex u, IVertex v, float value)", note: "EdgeFunction.addValue"}
  - {class: com.hendrix.erdos.algorithms.AbstractShortestPathAlgorithm, method: setStartVertex, match: "(IVertex vertex)", note: "AbstractShortestPathAlgorithm.setStartVertex"}
  - {class: com.hendrix.erdos.graphs.DirectedGraph, method: outDegreeOfVertex, match: "(IVertex vertex)", note: "DirectedGraph.outDegreeOfVertex"}
  - {class: com.hendrix.erdos.types.Vertex, method: getColor, match: "()", note: "Vertex.getColor"}
  - {class: com.hendrix.erdos.algorithms.AbstractShortestPathAlgorithm, method: setWeightFunction, match: "(EdgeFunction weightFunction)", note: "AbstractShortestPathAlgorithm.setWeightFunction"}
  - {class: com.hendrix.erdos.graphs.DirectedGraph, method: inDegreeOfVertex, match: "(IVertex vertex)", note: "DirectedGraph.inDegreeOfVertex"}
  - {class: com.hendrix.erdos.types.Vertex, method: setColor, match: "(int color)", note: "Vertex.setColor"}
  - {class: com.hendrix.erdos.algorithms.AllPairsShortPathResult, method: shortDistanceBetween, match: "(IVertex u, IVertex v)", note: "AllPairsShortPathResult.shortDistanceBetween"}
  - {class: com.hendrix.erdos.graphs.DirectedPseudoGraph, method: hasMultiEdges, match: "()", note: "DirectedPseudoGraph.hasMultiEdges"}
  - {class: com.hendrix.erdos.algorithms.AllPairsShortPathResult, method: shortestPathsTreeOf, match: "(IVertex u)", note: "AllPairsShortPathResult.shortestPathsTreeOf"}
  - {class: com.hendrix.erdos.graphs.DirectedPseudoGraph, method: hasSelfLoops, match: "()", note: "DirectedPseudoGraph.hasSelfLoops"}
  - {class: com.hendrix.erdos.algorithms.BFS, method: applyAlgorithm, match: "()", note: "BFS.applyAlgorithm"}
  - {class: com.hendrix.erdos.graphs.MultiDigraph, method: getMultiEdges, match: "(IVertex u, IVertex v)", note: "MultiDigraph.getMultiEdges"}
  - {class: com.hendrix.erdos.algorithms.BFS, method: getSourceIVertex, match: "()", note: "BFS.getSourceIVertex"}
  - {class: com.hendrix.erdos.graphs.MultiDigraph, method: removeMultiEdges, match: "(IVertex u, IVertex v)", note: "MultiDigraph.removeMultiEdges"}
  - {class: com.hendrix.erdos.algorithms.BellmanFordShortestPath, method: applyAlgorithm, match: "()", note: "BellmanFordShortestPath.applyAlgorithm"}
  - {class: com.hendrix.erdos.graphs.MultiGraph, method: getMultiEdges, match: "(IVertex u, IVertex v)", note: "MultiGraph.getMultiEdges"}
  - {class: com.hendrix.erdos.algorithms.BellmanFordShortestPath, method: shortest, match: "()", note: "BellmanFordShortestPath.shortest"}
  - {class: com.hendrix.erdos.graphs.MultiGraph, method: removeMultiEdges, match: "(IVertex u, IVertex v)", note: "MultiGraph.removeMultiEdges"}
  - {class: com.hendrix.erdos.algorithms.DFS, method: isFlagClassifyEdges, match: "()", note: "DFS.isFlagClassifyEdges"}
  - {class: com.hendrix.erdos.graphs.PredecessorSubGraph, method: commitPredecessorList, match: "(HashMap<IVertex, IVertex> PIE, IVertex startVertex)", note: "PredecessorSubGraph.commitPredecessorList"}
  - {class: com.hendrix.erdos.algorithms.DFS, method: setFlagClassifyEdges, match: "(boolean flagClassifyEdges)", note: "DFS.setFlagClassifyEdges"}
  - {class: com.hendrix.erdos.graphs.PredecessorSubGraph, method: getStartVertex, match: "()", note: "PredecessorSubGraph.getStartVertex"}
