# Curated performance-mutation sites for aeron-io-agrona (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants aeron-io-agrona --source data/external-src/<checkout> \
#       --sites data/projects/aeron-io-agrona/mutation_sites.yaml

