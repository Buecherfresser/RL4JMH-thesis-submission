  - {class: org.apache.commons.net.examples.nntp.ListNewsgroups, method: main, match: "(final String[] args)", note: "ListNewsgroups.main"}
  - {class: org.apache.commons.net.examples.nntp.NNTPUtils, method: getArticleInfo, match: "(final NNTPClient client, final long lowArticleNumber, final long highArticleNumber) throws IOException", note: "NNTPUtils.getArticleInfo"}
