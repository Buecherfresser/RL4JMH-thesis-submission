# Curated performance-mutation sites for lunar-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants lunar-java --source data/external-src/<checkout> \
#       --sites data/projects/lunar-java/mutation_sites.yaml

package_root: com.nlf.calendar

sites:
  - {class: com.nlf.calendar.EightChar, method: fromLunar, match: "(Lunar lunar)", note: "EightChar.fromLunar"}
  - {class: com.nlf.calendar.eightchar.DaYun, method: getStartYear, match: "()", note: "DaYun.getStartYear"}
  - {class: com.nlf.calendar.util.FotoUtil, method: getXiu, match: "(int month, int day)", note: "FotoUtil.getXiu"}
  - {class: com.nlf.calendar.EightChar, method: getSect, match: "()", note: "EightChar.getSect"}
  - {class: com.nlf.calendar.eightchar.DaYun, method: getEndYear, match: "()", note: "DaYun.getEndYear"}
  - {class: com.nlf.calendar.util.HolidayUtil, method: getHoliday, match: "(int year,int month, int day)", note: "HolidayUtil.getHoliday"}
  - {class: com.nlf.calendar.Foto, method: fromLunar, match: "(Lunar lunar)", note: "Foto.fromLunar"}
  - {class: com.nlf.calendar.eightchar.LiuNian, method: getIndex, match: "()", note: "LiuNian.getIndex"}
  - {class: com.nlf.calendar.util.HolidayUtil, method: getHoliday, match: "(String ymd)", note: "HolidayUtil.getHoliday"}
  - {class: com.nlf.calendar.Foto, method: fromYmdHms, match: "(int year, int month, int day, int hour, int minute, int second)", note: "Foto.fromYmdHms"}
  - {class: com.nlf.calendar.eightchar.LiuNian, method: getYear, match: "()", note: "LiuNian.getYear"}
  - {class: com.nlf.calendar.util.LunarUtil, method: getTimeZhiIndex, match: "(String hm)", note: "LunarUtil.getTimeZhiIndex"}
  - {class: com.nlf.calendar.FotoFestival, method: getName, match: "()", note: "FotoFestival.getName"}
  - {class: com.nlf.calendar.eightchar.LiuYue, method: getIndex, match: "()", note: "LiuYue.getIndex"}
  - {class: com.nlf.calendar.util.LunarUtil, method: convertTime, match: "(String hm)", note: "LunarUtil.convertTime"}
  - {class: com.nlf.calendar.FotoFestival, method: getResult, match: "()", note: "FotoFestival.getResult"}
  - {class: com.nlf.calendar.eightchar.LiuYue, method: getMonthInChinese, match: "()", note: "LiuYue.getMonthInChinese"}
