  - {class: org.ahocorasick.trie.State, method: getDepth, match: "()", note: "State.getDepth"}
  - {class: org.ahocorasick.trie.State, method: addEmit, match: "(String keyword)", note: "State.addEmit"}
  - {class: org.ahocorasick.trie.Trie, method: tokenize, match: "(final String text)", note: "Trie.tokenize"}
  - {class: org.ahocorasick.trie.Trie, method: parseText, match: "(final CharSequence text)", note: "Trie.parseText"}
  - {class: org.ahocorasick.trie.Trie, method: parseText, match: "( final CharSequence text, final StatefulEmitHandler emitHandler)", note: "Trie.parseText"}
  - {class: org.ahocorasick.trie.Trie, method: containsMatch, match: "(final CharSequence text)", note: "Trie.containsMatch"}
  - {class: org.ahocorasick.trie.Trie, method: parseText, match: "(final CharSequence text, final EmitHandler emitHandler)", note: "Trie.parseText"}
  - {class: org.ahocorasick.trie.Trie, method: firstMatch, match: "(final CharSequence text)", note: "Trie.firstMatch"}
  - {class: org.ahocorasick.trie.TrieConfig, method: isStopOnHit, match: "()", note: "TrieConfig.isStopOnHit"}
  - {class: org.ahocorasick.trie.TrieConfig, method: setStopOnHit, match: "(boolean stopOnHit)", note: "TrieConfig.setStopOnHit"}
  - {class: org.ahocorasick.trie.TrieConfig, method: isAllowOverlaps, match: "()", note: "TrieConfig.isAllowOverlaps"}
