  - {class: dev.xdark.classfile.opcode.Label, method: setPosition, match: "(int position)", note: "Label.setPosition"}
  - {class: dev.xdark.classfile.ClassAdapter, method: visit, match: "(@NotNull ClassVersion version, @NotNull AccessFlag access, @NotNull String name, @Nullable String superName)", note: "ClassAdapter.visit"}
  - {class: dev.xdark.classfile.annotation.ElementType, method: of, match: "(int tag)", note: "ElementType.of"}
  - {class: dev.xdark.classfile.attribute.stackmap.StackMapTableAttribute, method: info, match: "()", note: "StackMapTableAttribute.info"}
  - {class: dev.xdark.classfile.constantpool.BuiltConstantPool, method: iterator, match: "()", note: "BuiltConstantPool.iterator"}
  - {class: dev.xdark.classfile.opcode.LookupSwitchInstruction, method: getDefault, match: "()", note: "LookupSwitchInstruction.getDefault"}
  - {class: dev.xdark.classfile.ClassContext, method: getClassVersion, match: "()", note: "ClassContext.getClassVersion"}
  - {class: dev.xdark.classfile.annotation.ElementType, method: tag, match: "()", note: "ElementType.tag"}
  - {class: dev.xdark.classfile.attribute.stackmap.frame.FrameTypeRange, method: getFrom, match: "()", note: "FrameTypeRange.getFrom"}
  - {class: dev.xdark.classfile.constantpool.ConstantClass, method: index, match: "()", note: "ConstantClass.index"}
