# Curated performance-mutation sites for proj4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants proj4j --source data/external-src/<checkout> \
#       --sites data/projects/proj4j/mutation_sites.yaml

package_root: org.locationtech.proj4j

sites:
  - {class: org.locationtech.proj4j.BasicCoordinateTransform, method: getSourceCRS, match: "()", note: "BasicCoordinateTransform.getSourceCRS"}
  - {class: org.locationtech.proj4j.datum.AxisOrder, method: fromENU, match: "(ProjCoordinate c)", note: "AxisOrder.fromENU"}
  - {class: org.locationtech.proj4j.geoapi.LocalizedString, method: length, match: "()", note: "LocalizedString.length"}
  - {class: org.locationtech.proj4j.geodesic.GeoMath, method: sq, match: "(double x)", note: "GeoMath.sq"}
  - {class: org.locationtech.proj4j.io.Proj4FileReader, method: readParametersFromFile, match: "(String authorityCode, String name)", note: "Proj4FileReader.readParametersFromFile"}
  - {class: org.locationtech.proj4j.parser.Proj4Parser, method: parse, match: "(String name, String[] args)", note: "Proj4Parser.parse"}
  - {class: org.locationtech.proj4j.proj.NewZealandMapGridProjection, method: project, match: "(double lplam, double lpphi, ProjCoordinate out)", note: "NewZealandMapGridProjection.project"}
  - {class: org.locationtech.proj4j.units.Angle, method: parse, match: "(String text)", note: "Angle.parse"}
  - {class: org.locationtech.proj4j.util.ProjectionMath, method: sind, match: "(double v)", note: "ProjectionMath.sind"}
  - {class: org.locationtech.proj4j.BasicCoordinateTransform, method: getTargetCRS, match: "()", note: "BasicCoordinateTransform.getTargetCRS"}
  - {class: org.locationtech.proj4j.datum.AxisOrder, method: toENU, match: "(double x, ProjCoordinate c)", note: "AxisOrder.toENU"}
  - {class: org.locationtech.proj4j.geoapi.LocalizedString, method: charAt, match: "(int index)", note: "LocalizedString.charAt"}
  - {class: org.locationtech.proj4j.geodesic.GeoMath, method: atanh, match: "(double x)", note: "GeoMath.atanh"}
  - {class: org.locationtech.proj4j.io.Proj4FileReader, method: getParameters, match: "(String crsName)", note: "Proj4FileReader.getParameters"}
  - {class: org.locationtech.proj4j.parser.DatumParameters, method: getDatum, match: "()", note: "DatumParameters.getDatum"}
  - {class: org.locationtech.proj4j.proj.NewZealandMapGridProjection, method: projectInverse, match: "(double x, double y, ProjCoordinate dst)", note: "NewZealandMapGridProjection.projectInverse"}
  - {class: org.locationtech.proj4j.units.AngleFormat, method: format, match: "(long number, StringBuffer result, FieldPosition fieldPosition)", note: "AngleFormat.format"}
  - {class: org.locationtech.proj4j.util.ProjectionMath, method: cosd, match: "(double v)", note: "ProjectionMath.cosd"}
  - {class: org.locationtech.proj4j.CRSFactory, method: getRegistry, match: "()", note: "CRSFactory.getRegistry"}
  - {class: org.locationtech.proj4j.datum.CTABLEV2, method: testHeader, match: "(byte[] header)", note: "CTABLEV2.testHeader"}
  - {class: org.locationtech.proj4j.geoapi.Alias, method: scope, match: "()", note: "Alias.scope"}
  - {class: org.locationtech.proj4j.geodesic.Geodesic, method: Direct, match: "(double lat1, double lon1,", note: "Geodesic.Direct"}
  - {class: org.locationtech.proj4j.parser.DatumParameters, method: getEllipsoid, match: "()", note: "DatumParameters.getEllipsoid"}
  - {class: org.locationtech.proj4j.proj.AiryProjection, method: project, match: "(double lplam, double lpphi, ProjCoordinate out)", note: "AiryProjection.project"}
  - {class: org.locationtech.proj4j.units.AngleFormat, method: format, match: "(double number, StringBuffer result, FieldPosition fieldPosition)", note: "AngleFormat.format"}
  - {class: org.locationtech.proj4j.util.CRSCache, method: createFromName, match: "(String name)", note: "CRSCache.createFromName"}
  - {class: org.locationtech.proj4j.CRSFactory, method: createFromName, match: "(String name)", note: "CRSFactory.createFromName"}
  - {class: org.locationtech.proj4j.datum.CTABLEV2, method: init, match: "(DataInputStream definition) throws IOException", note: "CTABLEV2.init"}
  - {class: org.locationtech.proj4j.geoapi.Alias, method: depth, match: "()", note: "Alias.depth"}
  - {class: org.locationtech.proj4j.geodesic.Geodesic, method: Direct, match: "(double lat1, double lon1,", note: "Geodesic.Direct"}
  - {class: org.locationtech.proj4j.parser.Proj4Keyword, method: supportedParameters, match: "()", note: "Proj4Keyword.supportedParameters"}
  - {class: org.locationtech.proj4j.proj.AiryProjection, method: initialize, match: "()", note: "AiryProjection.initialize"}
  - {class: org.locationtech.proj4j.units.DegreeUnit, method: parse, match: "(String s) throws NumberFormatException", note: "DegreeUnit.parse"}
  - {class: org.locationtech.proj4j.util.CRSCache, method: createFromParameters, match: "(String name, String paramStr)", note: "CRSCache.createFromParameters"}
  - {class: org.locationtech.proj4j.CoordinateReferenceSystem, method: getName, match: "()", note: "CoordinateReferenceSystem.getName"}
  - {class: org.locationtech.proj4j.datum.Datum, method: getCode, match: "()", note: "Datum.getCode"}
  - {class: org.locationtech.proj4j.geoapi.AuthorityFactoryWrapper, method: getCode, match: "()", note: "AuthorityFactoryWrapper.getCode"}
  - {class: org.locationtech.proj4j.geodesic.GeodesicLine, method: Position, match: "(double s12)", note: "GeodesicLine.Position"}
  - {class: org.locationtech.proj4j.parser.Proj4Keyword, method: isSupported, match: "(String paramKey)", note: "Proj4Keyword.isSupported"}
  - {class: org.locationtech.proj4j.proj.AitoffProjection, method: project, match: "(double lplam, double lpphi, ProjCoordinate out)", note: "AitoffProjection.project"}
  - {class: org.locationtech.proj4j.units.DegreeUnit, method: format, match: "(double n)", note: "DegreeUnit.format"}
  - {class: org.locationtech.proj4j.util.Pair, method: fst, match: "()", note: "Pair.fst"}
  - {class: org.locationtech.proj4j.CoordinateReferenceSystem, method: getParameters, match: "()", note: "CoordinateReferenceSystem.getParameters"}
  - {class: org.locationtech.proj4j.datum.Datum, method: getName, match: "()", note: "Datum.getName"}
  - {class: org.locationtech.proj4j.geoapi.AuthorityFactoryWrapper, method: getVendor, match: "()", note: "AuthorityFactoryWrapper.getVendor"}
  - {class: org.locationtech.proj4j.geodesic.GeodesicLine, method: Position, match: "(double s12, int outmask)", note: "GeodesicLine.Position"}
  - {class: org.locationtech.proj4j.proj.AitoffProjection, method: initialize, match: "()", note: "AitoffProjection.initialize"}
  - {class: org.locationtech.proj4j.units.Unit, method: toBase, match: "(double n)", note: "Unit.toBase"}
  - {class: org.locationtech.proj4j.util.Pair, method: setFirst, match: "(A first)", note: "Pair.setFirst"}
  - {class: org.locationtech.proj4j.CoordinateTransformFactory, method: createTransform, match: "(CoordinateReferenceSystem sourceCRS, CoordinateReferenceSystem targetCRS)", note: "CoordinateTransformFactory.createTransform"}
