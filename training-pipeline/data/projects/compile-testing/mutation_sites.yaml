# Curated performance-mutation sites for compile-testing (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants compile-testing --source data/external-src/<checkout> \
#       --sites data/projects/compile-testing/mutation_sites.yaml

package_root: com.google.testing

sites:
  - {class: com.google.testing.compile.Breadcrumbs, method: defaultAction, match: "(Tree t, Void v)", note: "Breadcrumbs.defaultAction"}
  - {class: com.google.testing.compile.Breadcrumbs, method: visitBlock, match: "(BlockTree reference, Void v)", note: "Breadcrumbs.visitBlock"}
  - {class: com.google.testing.compile.Breadcrumbs, method: visitBreak, match: "(BreakTree reference, Void v)", note: "Breadcrumbs.visitBreak"}
  - {class: com.google.testing.compile.Breadcrumbs, method: visitClass, match: "(ClassTree reference, Void v)", note: "Breadcrumbs.visitClass"}
  - {class: com.google.testing.compile.Compilation, method: compiler, match: "()", note: "Compilation.compiler"}
  - {class: com.google.testing.compile.Compilation, method: sourceFiles, match: "()", note: "Compilation.sourceFiles"}
  - {class: com.google.testing.compile.Compilation, method: status, match: "()", note: "Compilation.status"}
  - {class: com.google.testing.compile.Compilation, method: diagnostics, match: "()", note: "Compilation.diagnostics"}
  - {class: com.google.testing.compile.CompilationRule, method: apply, match: "(final Statement base, Description description)", note: "CompilationRule.apply"}
  - {class: com.google.testing.compile.CompilationRule, method: evaluate, match: "() throws Throwable", note: "CompilationRule.evaluate"}
  - {class: com.google.testing.compile.CompilationRule, method: getElements, match: "()", note: "CompilationRule.getElements"}
  - {class: com.google.testing.compile.CompilationRule, method: getTypes, match: "()", note: "CompilationRule.getTypes"}
  - {class: com.google.testing.compile.CompilationSubject, method: compilations, match: "()", note: "CompilationSubject.compilations"}
  - {class: com.google.testing.compile.CompilationSubject, method: assertThat, match: "(Compilation actual)", note: "CompilationSubject.assertThat"}
  - {class: com.google.testing.compile.CompilationSubject, method: succeeded, match: "()", note: "CompilationSubject.succeeded"}
  - {class: com.google.testing.compile.CompilationSubject, method: succeededWithoutWarnings, match: "()", note: "CompilationSubject.succeededWithoutWarnings"}
  - {class: com.google.testing.compile.CompilationSubjectFactory, method: createSubject, match: "(", note: "CompilationSubjectFactory.createSubject"}
  - {class: com.google.testing.compile.ForwardingStandardJavaFileManager, method: getJavaFileObjectsFromFiles, match: "(", note: "ForwardingStandardJavaFileManager.getJavaFileObjectsFromFiles"}
  - {class: com.google.testing.compile.ForwardingStandardJavaFileManager, method: getJavaFileObjects, match: "(File... files)", note: "ForwardingStandardJavaFileManager.getJavaFileObjects"}
  - {class: com.google.testing.compile.ForwardingStandardJavaFileManager, method: getJavaFileObjects, match: "(String... names)", note: "ForwardingStandardJavaFileManager.getJavaFileObjects"}
  - {class: com.google.testing.compile.ForwardingStandardJavaFileManager, method: getJavaFileObjectsFromStrings, match: "(Iterable<String> names)", note: "ForwardingStandardJavaFileManager.getJavaFileObjectsFromStrings"}
  - {class: com.google.testing.compile.InMemoryJavaFileManager, method: load, match: "(URI key)", note: "InMemoryJavaFileManager.load"}
  - {class: com.google.testing.compile.InMemoryJavaFileManager, method: isSameFile, match: "(FileObject a, FileObject b)", note: "InMemoryJavaFileManager.isSameFile"}
  - {class: com.google.testing.compile.InMemoryJavaFileManager, method: getFileForInput, match: "(", note: "InMemoryJavaFileManager.getFileForInput"}
  - {class: com.google.testing.compile.InMemoryJavaFileManager, method: getJavaFileForInput, match: "(", note: "InMemoryJavaFileManager.getJavaFileForInput"}
  - {class: com.google.testing.compile.JavaFileObjectSubject, method: javaFileObjects, match: "()", note: "JavaFileObjectSubject.javaFileObjects"}
  - {class: com.google.testing.compile.JavaFileObjectSubject, method: assertThat, match: "(@Nullable JavaFileObject actual)", note: "JavaFileObjectSubject.assertThat"}
  - {class: com.google.testing.compile.JavaFileObjectSubject, method: actualCustomStringRepresentation, match: "()", note: "JavaFileObjectSubject.actualCustomStringRepresentation"}
  - {class: com.google.testing.compile.JavaFileObjectSubject, method: isEqualTo, match: "(@Nullable Object other)", note: "JavaFileObjectSubject.isEqualTo"}
  - {class: com.google.testing.compile.JavaFileObjectSubjectFactory, method: createSubject, match: "(", note: "JavaFileObjectSubjectFactory.createSubject"}
  - {class: com.google.testing.compile.JavaFileObjects, method: forSourceString, match: "(String fullyQualifiedName, String source)", note: "JavaFileObjects.forSourceString"}
  - {class: com.google.testing.compile.JavaFileObjects, method: forSourceLines, match: "(String fullyQualifiedName, String... lines)", note: "JavaFileObjects.forSourceLines"}
  - {class: com.google.testing.compile.JavaFileObjects, method: forSourceLines, match: "(String fullyQualifiedName, Iterable<String> lines)", note: "JavaFileObjects.forSourceLines"}
  - {class: com.google.testing.compile.JavaFileObjects, method: getCharContent, match: "(boolean ignoreEncodingErrors)", note: "JavaFileObjects.getCharContent"}
  - {class: com.google.testing.compile.JavaSourceSubjectFactory, method: javaSource, match: "()", note: "JavaSourceSubjectFactory.javaSource"}
  - {class: com.google.testing.compile.JavaSourceSubjectFactory, method: createSubject, match: "(", note: "JavaSourceSubjectFactory.createSubject"}
  - {class: com.google.testing.compile.JavaSourcesSubject, method: withCompilerOptions, match: "(Iterable<String> options)", note: "JavaSourcesSubject.withCompilerOptions"}
  - {class: com.google.testing.compile.JavaSourcesSubject, method: withCompilerOptions, match: "(String... options)", note: "JavaSourcesSubject.withCompilerOptions"}
  - {class: com.google.testing.compile.JavaSourcesSubject, method: withClasspathFrom, match: "(ClassLoader classLoader)", note: "JavaSourcesSubject.withClasspathFrom"}
  - {class: com.google.testing.compile.JavaSourcesSubject, method: withClasspath, match: "(Iterable<File> classPath)", note: "JavaSourcesSubject.withClasspath"}
  - {class: com.google.testing.compile.JavaSourcesSubjectFactory, method: javaSources, match: "()", note: "JavaSourcesSubjectFactory.javaSources"}
  - {class: com.google.testing.compile.JavaSourcesSubjectFactory, method: createSubject, match: "(", note: "JavaSourcesSubjectFactory.createSubject"}
  - {class: com.google.testing.compile.MoreTrees, method: scan, match: "(Tree node, @Nullable Void v)", note: "MoreTrees.scan"}
  - {class: com.google.testing.compile.MoreTrees, method: scan, match: "(Iterable<? extends Tree> nodes, @Nullable Void v)", note: "MoreTrees.scan"}
  - {class: com.google.testing.compile.MoreTrees, method: reduce, match: "(Optional<TreePath> t1, Optional<TreePath> t2)", note: "MoreTrees.reduce"}
  - {class: com.google.testing.compile.MoreTrees, method: visitBreak, match: "(@Nullable BreakTree node, @Nullable Void v)", note: "MoreTrees.visitBreak"}
  - {class: com.google.testing.compile.TreeDiffer, method: addTypeMismatch, match: "(Tree expected, Tree actual)", note: "TreeDiffer.addTypeMismatch"}
  - {class: com.google.testing.compile.TreeDiffer, method: defaultAction, match: "(Tree expected, Tree actual)", note: "TreeDiffer.defaultAction"}
  - {class: com.google.testing.compile.TreeDiffer, method: visitOther, match: "(Tree expected, Tree actual)", note: "TreeDiffer.visitOther"}
  - {class: com.google.testing.compile.TreeDiffer, method: filterActualMembers, match: "(", note: "TreeDiffer.filterActualMembers"}
