  - {class: com.github.houbb.pinyin.support.style.InputToneStyle, method: getCharFormat, match: "(String tone, CharToneInfo toneInfo)", note: "InputToneStyle.getCharFormat"}
  - {class: com.github.houbb.pinyin.support.style.NormalPinyinToneStyle, method: getCharFormat, match: "(String tone, CharToneInfo toneInfo)", note: "NormalPinyinToneStyle.getCharFormat"}
  - {class: com.github.houbb.pinyin.support.style.NumLastPinyinToneStyle, method: getCharFormat, match: "(String tone, CharToneInfo toneInfo)", note: "NumLastPinyinToneStyle.getCharFormat"}
  - {class: com.github.houbb.pinyin.support.style.PinyinToneStyles, method: getTone, match: "(final PinyinStyleEnum styleEnum)", note: "PinyinToneStyles.getTone"}
  - {class: com.github.houbb.pinyin.support.style.PinyinToneStyles, method: defaults, match: "()", note: "PinyinToneStyles.defaults"}
  - {class: com.github.houbb.pinyin.support.style.PinyinToneStyles, method: firstLetter, match: "()", note: "PinyinToneStyles.firstLetter"}
  - {class: com.github.houbb.pinyin.support.tone.DefaultPinyinTone, method: getCharTones, match: "(String chinese, final IPinyinToneStyle toneStyle)", note: "DefaultPinyinTone.getCharTones"}
