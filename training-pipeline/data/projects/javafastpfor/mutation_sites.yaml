# Curated performance-mutation sites for javafastpfor (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants javafastpfor --source data/external-src/<checkout> \
#       --sites data/projects/javafastpfor/mutation_sites.yaml

package_root: me.lemire.integercompression

sites:
  - {class: me.lemire.integercompression.Util, method: smallerorequalthan, match: "(int x, int y)", note: "Util.smallerorequalthan"}
  - {class: me.lemire.integercompression.benchmarktools.Benchmark, method: main, match: "(String args[]) throws FileNotFoundException", note: "Benchmark.main"}
  - {class: me.lemire.integercompression.differential.Delta, method: delta, match: "(int[] data)", note: "Delta.delta"}
  - {class: me.lemire.integercompression.synth.ClusteredDataGenerator, method: generateClustered, match: "(int N, int Max)", note: "ClusteredDataGenerator.generateClustered"}
  - {class: me.lemire.integercompression.vector.VectorBinaryPacking, method: compress, match: "(int[] in, IntWrapper inpos, int inlength, int[] out, IntWrapper outpos)", note: "VectorBinaryPacking.compress"}
  - {class: me.lemire.integercompression.Util, method: maxbits, match: "(int[] i, int pos, int length)", note: "Util.maxbits"}
  - {class: me.lemire.integercompression.benchmarktools.Benchmark, method: testKamikaze, match: "(int[][] data, int repeat,", note: "Benchmark.testKamikaze"}
  - {class: me.lemire.integercompression.differential.Delta, method: delta, match: "(int[] data, int start, int length, int init)", note: "Delta.delta"}
  - {class: me.lemire.integercompression.synth.ClusteredDataGenerator, method: main, match: "(final String[] args)", note: "ClusteredDataGenerator.main"}
  - {class: me.lemire.integercompression.vector.VectorBinaryPacking, method: headlessCompress, match: "(int[] in, IntWrapper inpos, int inlength, int[] out, IntWrapper outpos)", note: "VectorBinaryPacking.headlessCompress"}
  - {class: me.lemire.integercompression.BinaryPacking, method: compress, match: "(int[] in, IntWrapper inpos, int inlength,", note: "BinaryPacking.compress"}
  - {class: me.lemire.integercompression.benchmarktools.BenchmarkBitPacking, method: main, match: "(String[] args)", note: "BenchmarkBitPacking.main"}
  - {class: me.lemire.integercompression.differential.IntegratedBinaryPacking, method: compress, match: "(int[] in, IntWrapper inpos, int inlength, int[] out,", note: "IntegratedBinaryPacking.compress"}
  - {class: me.lemire.integercompression.synth.UniformDataGenerator, method: generateUniform, match: "(int N, int Max)", note: "UniformDataGenerator.generateUniform"}
  - {class: me.lemire.integercompression.vector.VectorBitPacker, method: fastpack, match: "(final int[] in, int inpos, final int[] out,", note: "VectorBitPacker.fastpack"}
  - {class: me.lemire.integercompression.BinaryPacking, method: headlessCompress, match: "(int[] in, IntWrapper inpos, int inlength,", note: "BinaryPacking.headlessCompress"}
  - {class: me.lemire.integercompression.benchmarktools.BenchmarkCSV, method: main, match: "(final String[] args) throws IOException", note: "BenchmarkCSV.main"}
  - {class: me.lemire.integercompression.differential.IntegratedBinaryPacking, method: uncompress, match: "(int[] in, IntWrapper inpos, int inlength, int[] out,", note: "IntegratedBinaryPacking.uncompress"}
  - {class: me.lemire.integercompression.vector.VectorBitPacker, method: fastpackNoMask, match: "(final int[] in, int inpos, final int[] out,", note: "VectorBitPacker.fastpackNoMask"}
  - {class: me.lemire.integercompression.BitPacking, method: fastpack, match: "(final int[] in, final int inpos,", note: "BitPacking.fastpack"}
  - {class: me.lemire.integercompression.benchmarktools.BenchmarkOffsettedSeries, method: run, match: "(final PrintWriter csvWriter, final int count, final int length)", note: "BenchmarkOffsettedSeries.run"}
  - {class: me.lemire.integercompression.differential.IntegratedBitPacking, method: integratedpack, match: "(final int initoffset, final int[] in,", note: "IntegratedBitPacking.integratedpack"}
  - {class: me.lemire.integercompression.vector.VectorBitPacker128, method: fastpack, match: "(final int[] in, int inpos, final int[] out,", note: "VectorBitPacker128.fastpack"}
  - {class: me.lemire.integercompression.BitPacking, method: fastpack0, match: "(final int[] in, int inpos,", note: "BitPacking.fastpack0"}
  - {class: me.lemire.integercompression.benchmarktools.BenchmarkOffsettedSeries, method: main, match: "(final String[] args) throws Exception", note: "BenchmarkOffsettedSeries.main"}
  - {class: me.lemire.integercompression.differential.IntegratedBitPacking, method: integratedpack0, match: "(final int initoffset,", note: "IntegratedBitPacking.integratedpack0"}
  - {class: me.lemire.integercompression.vector.VectorBitPacker128, method: fastpackNoMask, match: "(final int[] in, int inpos, final int[] out,", note: "VectorBitPacker128.fastpackNoMask"}
  - {class: me.lemire.integercompression.Composition, method: compress, match: "(int[] in, IntWrapper inpos, int inlength,", note: "Composition.compress"}
  - {class: me.lemire.integercompression.benchmarktools.BenchmarkSkippable, method: main, match: "(String args[]) throws FileNotFoundException", note: "BenchmarkSkippable.main"}
  - {class: me.lemire.integercompression.differential.IntegratedComposition, method: compress, match: "(int[] in, IntWrapper inpos, int inlength,", note: "IntegratedComposition.compress"}
  - {class: me.lemire.integercompression.vector.VectorBitPacker256, method: fastpack, match: "(final int[] in, int inpos, final int[] out,", note: "VectorBitPacker256.fastpack"}
