[project]
name = "jmhgen-qwen-cu128"
version = "0.1.0"
description = "Locked Qwen3.5 CUDA 12.8 training and rollout environment for JMHGen."
requires-python = ">=3.12,<3.13"
dependencies = [
    "jmhgen",
    # Must match the prebuilt vLLM cu128 wheel ABI (Requires-Dist: torch==2.11.0).
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "transformers @ git+https://github.com/huggingface/transformers.git@28596623762cb409bb1c9234f04bfb1269b1ece1",
    "trl>=1.7,<1.8",
    "datasets>=4.0",
    "accelerate>=1.0",
    "peft>=0.15",
    "bitsandbytes>=0.46",
    "ray>=2.40",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
jmhgen = { path = "../..", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
