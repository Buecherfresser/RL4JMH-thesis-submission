  - {class: org.bytedeco.javacv.GNImageAligner, method: getStepSize, match: "()", note: "GNImageAligner.getStepSize"}
  - {class: org.bytedeco.javacv.GNImageAligner, method: setStepSize, match: "(double stepSize)", note: "GNImageAligner.setStepSize"}
  - {class: org.bytedeco.javacv.GNImageAlignerCL, method: release, match: "()", note: "GNImageAlignerCL.release"}
  - {class: org.bytedeco.javacv.GNImageAlignerCL, method: getTemplateImage, match: "(boolean blocking)", note: "GNImageAlignerCL.getTemplateImage"}
  - {class: org.bytedeco.javacv.GeometricCalibrator, method: getDetectedBoardMin, match: "()", note: "GeometricCalibrator.getDetectedBoardMin"}
