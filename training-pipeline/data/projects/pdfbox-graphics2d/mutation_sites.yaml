# Curated performance-mutation sites for pdfbox-graphics2d (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants pdfbox-graphics2d --source data/external-src/<checkout> \
#       --sites data/projects/pdfbox-graphics2d/mutation_sites.yaml

package_root: de.rototor.pdfbox

