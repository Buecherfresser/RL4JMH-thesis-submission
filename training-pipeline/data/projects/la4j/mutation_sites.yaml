# Curated performance-mutation sites for la4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants la4j --source data/external-src/<checkout> \
#       --sites data/projects/la4j/mutation_sites.yaml

package_root: org.la4j

sites:
  - {class: org.la4j.LinearAlgebra, method: create, match: "(Matrix matrix)", note: "LinearAlgebra.create"}
  - {class: org.la4j.decomposition.CholeskyDecompositor, method: decompose, match: "()", note: "CholeskyDecompositor.decompose"}
  - {class: org.la4j.inversion.GaussJordanInverter, method: inverse, match: "()", note: "GaussJordanInverter.inverse"}
  - {class: org.la4j.iterator.CursorToColumnMajorMatrixIterator, method: rowIndex, match: "()", note: "CursorToColumnMajorMatrixIterator.rowIndex"}
  - {class: org.la4j.linear.ForwardBackSubstitutionSolver, method: solve, match: "(Vector b)", note: "ForwardBackSubstitutionSolver.solve"}
  - {class: org.la4j.matrix.dense.Basic1DMatrix, method: zero, match: "(int rows, int columns)", note: "Basic1DMatrix.zero"}
  - {class: org.la4j.operation.inplace.InPlaceCopyMatrixToMatrix, method: applySimple, match: "(DenseMatrix a, SparseMatrix b)", note: "InPlaceCopyMatrixToMatrix.applySimple"}
  - {class: org.la4j.vector.dense.BasicVector, method: zero, match: "(int length)", note: "BasicVector.zero"}
  - {class: org.la4j.LinearAlgebra, method: create, match: "(Matrix matrix)", note: "LinearAlgebra.create"}
  - {class: org.la4j.decomposition.CholeskyDecompositor, method: applicableTo, match: "(Matrix matrix)", note: "CholeskyDecompositor.applicableTo"}
