  - {class: org.threeten.bp.format.DateTimeFormatter, method: ofPattern, match: "(String pattern, Locale locale)", note: "DateTimeFormatter.ofPattern"}
  - {class: org.threeten.bp.temporal.ChronoUnit, method: isDurationEstimated, match: "()", note: "ChronoUnit.isDurationEstimated"}
  - {class: org.threeten.bp.zone.StandardZoneRules, method: getValidOffsets, match: "(LocalDateTime localDateTime)", note: "StandardZoneRules.getValidOffsets"}
