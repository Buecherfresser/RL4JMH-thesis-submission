# Curated performance-mutation sites for hikaricp (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants hikaricp --source data/external-src/<checkout> \
#       --sites data/projects/hikaricp/mutation_sites.yaml

package_root: com.zaxxer.hikari

sites:
  - {class: com.zaxxer.hikari.HikariConfig, method: getCatalog, match: "()", note: "HikariConfig.getCatalog"}
  - {class: com.zaxxer.hikari.hibernate.HikariConfigurationUtil, method: loadConfiguration, match: "(Map props)", note: "HikariConfigurationUtil.loadConfiguration"}
  - {class: com.zaxxer.hikari.metrics.dropwizard.CodaHaleMetricsTracker, method: close, match: "()", note: "CodaHaleMetricsTracker.close"}
  - {class: com.zaxxer.hikari.pool.HikariPool, method: getConnection, match: "() throws SQLException", note: "HikariPool.getConnection"}
  - {class: com.zaxxer.hikari.util.FastList, method: removeLast, match: "()", note: "FastList.removeLast"}
  - {class: com.zaxxer.hikari.HikariConfig, method: setCatalog, match: "(String catalog)", note: "HikariConfig.setCatalog"}
  - {class: com.zaxxer.hikari.hibernate.HikariConnectionProvider, method: configure, match: "(Map props) throws HibernateException", note: "HikariConnectionProvider.configure"}
  - {class: com.zaxxer.hikari.metrics.dropwizard.CodaHaleMetricsTracker, method: recordConnectionAcquiredNanos, match: "(final long elapsedAcquiredNanos)", note: "CodaHaleMetricsTracker.recordConnectionAcquiredNanos"}
  - {class: com.zaxxer.hikari.pool.HikariPool, method: getConnection, match: "(final long hardTimeout) throws SQLException", note: "HikariPool.getConnection"}
  - {class: com.zaxxer.hikari.util.FastList, method: clear, match: "()", note: "FastList.clear"}
  - {class: com.zaxxer.hikari.HikariConfig, method: getConnectionTimeout, match: "()", note: "HikariConfig.getConnectionTimeout"}
  - {class: com.zaxxer.hikari.hibernate.HikariConnectionProvider, method: getConnection, match: "() throws SQLException", note: "HikariConnectionProvider.getConnection"}
  - {class: com.zaxxer.hikari.metrics.dropwizard.CodaHaleMetricsTracker, method: recordConnectionUsageMillis, match: "(final long elapsedBorrowedMillis)", note: "CodaHaleMetricsTracker.recordConnectionUsageMillis"}
