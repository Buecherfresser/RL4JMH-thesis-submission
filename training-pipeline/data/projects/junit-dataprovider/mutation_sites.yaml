# Curated performance-mutation sites for junit-dataprovider (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants junit-dataprovider --source data/external-src/<checkout> \
#       --sites data/projects/junit-dataprovider/mutation_sites.yaml

package_root: com.tngtech.junit

sites:
  - {class: com.tngtech.junit.dataprovider.StringDataProviderArgumentProvider, method: accept, match: "(DataProvider sourceAnnotation)", note: "StringDataProviderArgumentProvider.accept"}
  - {class: com.tngtech.junit.dataprovider.StringDataProviderArgumentProvider, method: getConverterContext, match: "(DataProvider dataProvider)", note: "StringDataProviderArgumentProvider.getConverterContext"}
  - {class: com.tngtech.junit.dataprovider.convert.ObjectArrayConverter, method: convert, match: "(Object[] data, boolean isVarargs, Class<?>[] parameterTypes)", note: "ObjectArrayConverter.convert"}
  - {class: com.tngtech.junit.dataprovider.convert.StringConverter, method: convert, match: "(String data, boolean isVarargs, Class<?>[] parameterTypes, ConverterContext context, int rowIdx)", note: "StringConverter.convert"}
  - {class: com.tngtech.junit.dataprovider.convert.StringConverter, method: splitBy, match: "(String data, String regex)", note: "StringConverter.splitBy"}
  - {class: com.tngtech.junit.dataprovider.convert.StringConverter, method: checkArgumentsAndParameterCount, match: "(int argCount, int paramCount, boolean isVarargs, int rowIdx)", note: "StringConverter.checkArgumentsAndParameterCount"}
  - {class: com.tngtech.junit.dataprovider.DataProviderExtension, method: getConverterContext, match: "(DataProvider dataProvider)", note: "DataProviderExtension.getConverterContext"}
  - {class: com.tngtech.junit.dataprovider.DataProviderExtension, method: getDisplayNameContext, match: "(DataProvider dataProvider)", note: "DataProviderExtension.getDisplayNameContext"}
  - {class: com.tngtech.junit.dataprovider.DataProviderInvocationContext, method: getDisplayName, match: "(int invocationIndex)", note: "DataProviderInvocationContext.getDisplayName"}
  - {class: com.tngtech.junit.dataprovider.DataProviderInvocationContext, method: getAdditionalExtensions, match: "()", note: "DataProviderInvocationContext.getAdditionalExtensions"}
  - {class: com.tngtech.junit.dataprovider.DataProviderParameterResolver, method: supportsParameter, match: "(ParameterContext parameterContext, ExtensionContext extensionContext)", note: "DataProviderParameterResolver.supportsParameter"}
  - {class: com.tngtech.junit.dataprovider.DataProviderParameterResolver, method: resolveParameter, match: "(ParameterContext parameterContext, ExtensionContext extensionContext)", note: "DataProviderParameterResolver.resolveParameter"}
  - {class: com.tngtech.junit.dataprovider.DataProviders, method: $, match: "(Object... args)", note: "DataProviders.$"}
  - {class: com.tngtech.junit.dataprovider.DataProviders, method: $$, match: "(Object[]... args)", note: "DataProviders.$$"}
  - {class: com.tngtech.junit.dataprovider.DataProviders, method: testForEach, match: "(Object... args)", note: "DataProviders.testForEach"}
  - {class: com.tngtech.junit.dataprovider.DisplayNameContext, method: getFormatter, match: "()", note: "DisplayNameContext.getFormatter"}
  - {class: com.tngtech.junit.dataprovider.DisplayNameContext, method: getFormat, match: "()", note: "DisplayNameContext.getFormat"}
  - {class: com.tngtech.junit.dataprovider.DisplayNameContext, method: getPlaceholders, match: "()", note: "DisplayNameContext.getPlaceholders"}
  - {class: com.tngtech.junit.dataprovider.Preconditions, method: checkNotNull, match: "(T object, String errorMessage)", note: "Preconditions.checkNotNull"}
  - {class: com.tngtech.junit.dataprovider.Preconditions, method: checkArgument, match: "(boolean expression, String errorMessage)", note: "Preconditions.checkArgument"}
  - {class: com.tngtech.junit.dataprovider.Preconditions, method: checkArgument, match: "(boolean expression, String errorMessageFormat, Object... errorMessageArgs)", note: "Preconditions.checkArgument"}
  - {class: com.tngtech.junit.dataprovider.UseDataProviderArgumentProvider, method: accept, match: "(UseDataProvider sourceAnnotation)", note: "UseDataProviderArgumentProvider.accept"}
  - {class: com.tngtech.junit.dataprovider.UseDataProviderArgumentProvider, method: getDataProviderResolverContext, match: "(ExtensionContext extensionContext,", note: "UseDataProviderArgumentProvider.getDataProviderResolverContext"}
  - {class: com.tngtech.junit.dataprovider.UseDataProviderArgumentProvider, method: getConverterContext, match: "(DataProvider dataProvider)", note: "UseDataProviderArgumentProvider.getConverterContext"}
  - {class: com.tngtech.junit.dataprovider.UseDataProviderExtension, method: getDataProviderResolverContext, match: "(ExtensionContext extensionContext,", note: "UseDataProviderExtension.getDataProviderResolverContext"}
  - {class: com.tngtech.junit.dataprovider.UseDataProviderExtension, method: getConverterContext, match: "(DataProvider dataProvider)", note: "UseDataProviderExtension.getConverterContext"}
  - {class: com.tngtech.junit.dataprovider.UseDataProviderExtension, method: cacheDataProviderResult, match: "(DataProvider dataProviderAnnotation)", note: "UseDataProviderExtension.cacheDataProviderResult"}
  - {class: com.tngtech.junit.dataprovider.convert.ConverterContext, method: getSplitBy, match: "()", note: "ConverterContext.getSplitBy"}
  - {class: com.tngtech.junit.dataprovider.convert.ConverterContext, method: isConvertNulls, match: "()", note: "ConverterContext.isConvertNulls"}
  - {class: com.tngtech.junit.dataprovider.convert.ConverterContext, method: isTrimValues, match: "()", note: "ConverterContext.isTrimValues"}
  - {class: com.tngtech.junit.dataprovider.convert.DataConverter, method: convert, match: "(Object data, boolean isVarargs, Class<?>[] parameterTypes, ConverterContext context)", note: "DataConverter.convert"}
  - {class: com.tngtech.junit.dataprovider.convert.SingleArgConverter, method: convert, match: "(Object data, boolean isVarargs, Class<?>[] parameterTypes)", note: "SingleArgConverter.convert"}
  - {class: com.tngtech.junit.dataprovider.format.DataProviderPlaceholderFormatter, method: format, match: "(Method testMethod, int invocationIndex, List<Object> arguments)", note: "DataProviderPlaceholderFormatter.format"}
  - {class: com.tngtech.junit.dataprovider.placeholder.ArgumentPlaceholder, method: getReplacementFor, match: "(String placeholder, ReplacementData data)", note: "ArgumentPlaceholder.getReplacementFor"}
  - {class: com.tngtech.junit.dataprovider.placeholder.ArgumentPlaceholder, method: formatAll, match: "(List<Object> arguments)", note: "ArgumentPlaceholder.formatAll"}
  - {class: com.tngtech.junit.dataprovider.placeholder.CanonicalClassNamePlaceholder, method: getReplacementFor, match: "(String placeholder, ReplacementData data)", note: "CanonicalClassNamePlaceholder.getReplacementFor"}
  - {class: com.tngtech.junit.dataprovider.placeholder.CompleteMethodSignaturePlaceholder, method: getReplacementFor, match: "(String placeholder, ReplacementData data)", note: "CompleteMethodSignaturePlaceholder.getReplacementFor"}
  - {class: com.tngtech.junit.dataprovider.placeholder.IndexPlaceholder, method: getReplacementFor, match: "(String placeholder, ReplacementData data)", note: "IndexPlaceholder.getReplacementFor"}
  - {class: com.tngtech.junit.dataprovider.placeholder.NamedArgumentPlaceholder, method: getReplacementFor, match: "(String placeholder, ReplacementData data)", note: "NamedArgumentPlaceholder.getReplacementFor"}
  - {class: com.tngtech.junit.dataprovider.placeholder.NamedArgumentPlaceholder, method: formatAll, match: "(Parameter[] parameters, List<Object> arguments)", note: "NamedArgumentPlaceholder.formatAll"}
  - {class: com.tngtech.junit.dataprovider.placeholder.ReplacementData, method: of, match: "(Method testMethod, int testIndex, List<Object> arguments)", note: "ReplacementData.of"}
  - {class: com.tngtech.junit.dataprovider.placeholder.ReplacementData, method: getTestMethod, match: "()", note: "ReplacementData.getTestMethod"}
  - {class: com.tngtech.junit.dataprovider.placeholder.ReplacementData, method: getTestIndex, match: "()", note: "ReplacementData.getTestIndex"}
  - {class: com.tngtech.junit.dataprovider.placeholder.SimpleClassNamePlaceholder, method: getReplacementFor, match: "(String placeholder, ReplacementData data)", note: "SimpleClassNamePlaceholder.getReplacementFor"}
  - {class: com.tngtech.junit.dataprovider.placeholder.SimpleMethodNamePlaceholder, method: getReplacementFor, match: "(String placeholder, ReplacementData data)", note: "SimpleMethodNamePlaceholder.getReplacementFor"}
  - {class: com.tngtech.junit.dataprovider.resolver.DataProviderMethodResolverHelper, method: findDataProviderMethods, match: "(DataProviderResolverContext context)", note: "DataProviderMethodResolverHelper.findDataProviderMethods"}
  - {class: com.tngtech.junit.dataprovider.resolver.DataProviderResolverContext, method: generateLocations, match: "(Class<?> testClass, Class<?>... explicitLocations)", note: "DataProviderResolverContext.generateLocations"}
  - {class: com.tngtech.junit.dataprovider.resolver.DataProviderResolverContext, method: useDataProviderNameConvention, match: "()", note: "DataProviderResolverContext.useDataProviderNameConvention"}
  - {class: com.tngtech.junit.dataprovider.resolver.DataProviderResolverContext, method: getTestMethod, match: "()", note: "DataProviderResolverContext.getTestMethod"}
  - {class: com.tngtech.junit.dataprovider.resolver.DefaultDataProviderMethodResolver, method: resolve, match: "(DataProviderResolverContext context)", note: "DefaultDataProviderMethodResolver.resolve"}
