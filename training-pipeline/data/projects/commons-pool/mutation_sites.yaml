  - {class: org.apache.commons.pool3.impl.LinkedBlockingDeque, method: addFirst, match: "(final E e)", note: "LinkedBlockingDeque.addFirst"}
  - {class: org.apache.commons.pool3.impl.LinkedBlockingDeque, method: addLast, match: "(final E e)", note: "LinkedBlockingDeque.addLast"}
