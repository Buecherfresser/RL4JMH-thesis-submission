# Curated performance-mutation sites for jsoniter (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jsoniter --source data/external-src/<checkout> \
#       --sites data/projects/jsoniter/mutation_sites.yaml

package_root: com.jsoniter

sites:
  - {class: com.jsoniter.CodegenImplArray, method: genArray, match: "(ClassInfo classInfo)", note: "CodegenImplArray.genArray"}
  - {class: com.jsoniter.any.ArrayAny, method: valueType, match: "()", note: "ArrayAny.valueType"}
  - {class: com.jsoniter.extra.Base64FloatSupport, method: enableEncodersAndDecoders, match: "()", note: "Base64FloatSupport.enableEncodersAndDecoders"}
  - {class: com.jsoniter.fuzzy.MaybeStringDoubleDecoder, method: decodeDouble, match: "(JsonIterator iter) throws IOException", note: "MaybeStringDoubleDecoder.decodeDouble"}
  - {class: com.jsoniter.output.CodegenImplArray, method: genCollection, match: "(String cacheKey, ClassInfo classInfo)", note: "CodegenImplArray.genCollection"}
  - {class: com.jsoniter.spi.Binding, method: decoderCacheKey, match: "()", note: "Binding.decoderCacheKey"}
  - {class: com.jsoniter.static_codegen.StaticCodegen, method: main, match: "(String[] args) throws Exception", note: "StaticCodegen.main"}
  - {class: com.jsoniter.CodegenImplArray, method: genCollection, match: "(ClassInfo classInfo)", note: "CodegenImplArray.genCollection"}
  - {class: com.jsoniter.any.ArrayAny, method: object, match: "()", note: "ArrayAny.object"}
  - {class: com.jsoniter.extra.Base64FloatSupport, method: wrap, match: "(Object obj)", note: "Base64FloatSupport.wrap"}
  - {class: com.jsoniter.fuzzy.MaybeStringFloatDecoder, method: decodeFloat, match: "(JsonIterator iter) throws IOException", note: "MaybeStringFloatDecoder.decodeFloat"}
  - {class: com.jsoniter.output.CodegenImplArray, method: genArray, match: "(String cacheKey, ClassInfo classInfo)", note: "CodegenImplArray.genArray"}
  - {class: com.jsoniter.spi.Binding, method: encoderCacheKey, match: "()", note: "Binding.encoderCacheKey"}
  - {class: com.jsoniter.CodegenImplMap, method: genMap, match: "(ClassInfo classInfo)", note: "CodegenImplMap.genMap"}
  - {class: com.jsoniter.any.ArrayLazyAny, method: valueType, match: "()", note: "ArrayLazyAny.valueType"}
  - {class: com.jsoniter.extra.Base64Support, method: enable, match: "()", note: "Base64Support.enable"}
  - {class: com.jsoniter.fuzzy.MaybeStringIntDecoder, method: decodeInt, match: "(JsonIterator iter) throws IOException", note: "MaybeStringIntDecoder.decodeInt"}
  - {class: com.jsoniter.output.CodegenImplMap, method: genMap, match: "(String cacheKey, ClassInfo classInfo)", note: "CodegenImplMap.genMap"}
  - {class: com.jsoniter.spi.ClassDescriptor, method: getDecodingClassDescriptor, match: "(ClassInfo classInfo, boolean includingPrivate)", note: "ClassDescriptor.getDecodingClassDescriptor"}
  - {class: com.jsoniter.IterImplArray, method: readArray, match: "(final JsonIterator iter) throws IOException", note: "IterImplArray.readArray"}
  - {class: com.jsoniter.any.ArrayLazyAny, method: object, match: "()", note: "ArrayLazyAny.object"}
  - {class: com.jsoniter.extra.GsonCompatibilityMode, method: builder, match: "()", note: "GsonCompatibilityMode.builder"}
  - {class: com.jsoniter.fuzzy.MaybeStringLongDecoder, method: decodeLong, match: "(JsonIterator iter) throws IOException", note: "MaybeStringLongDecoder.decodeLong"}
  - {class: com.jsoniter.output.JsonStream, method: reset, match: "(OutputStream out)", note: "JsonStream.reset"}
  - {class: com.jsoniter.spi.ClassDescriptor, method: getEncodingClassDescriptor, match: "(ClassInfo classInfo, boolean includingPrivate)", note: "ClassDescriptor.getEncodingClassDescriptor"}
  - {class: com.jsoniter.IterImplArray, method: readArrayCB, match: "(final JsonIterator iter, final JsonIterator.ReadArrayCallback callback, Object attachment) throws IOException", note: "IterImplArray.readArrayCB"}
  - {class: com.jsoniter.any.ArrayWrapperAny, method: valueType, match: "()", note: "ArrayWrapperAny.valueType"}
  - {class: com.jsoniter.extra.GsonCompatibilityMode, method: initialValue, match: "()", note: "GsonCompatibilityMode.initialValue"}
  - {class: com.jsoniter.fuzzy.MaybeStringShortDecoder, method: decodeShort, match: "(JsonIterator iter) throws IOException", note: "MaybeStringShortDecoder.decodeShort"}
  - {class: com.jsoniter.output.JsonStream, method: close, match: "() throws IOException", note: "JsonStream.close"}
  - {class: com.jsoniter.spi.Config, method: configName, match: "()", note: "Config.configName"}
  - {class: com.jsoniter.IterImplForStreaming, method: readObjectFieldAsHash, match: "(JsonIterator iter) throws IOException", note: "IterImplForStreaming.readObjectFieldAsHash"}
  - {class: com.jsoniter.any.ArrayWrapperAny, method: object, match: "()", note: "ArrayWrapperAny.object"}
  - {class: com.jsoniter.extra.JacksonCompatibilityMode, method: build, match: "()", note: "JacksonCompatibilityMode.build"}
  - {class: com.jsoniter.fuzzy.StringDoubleDecoder, method: decodeDouble, match: "(JsonIterator iter) throws IOException", note: "StringDoubleDecoder.decodeDouble"}
  - {class: com.jsoniter.output.JsonStreamPool, method: borrowJsonStream, match: "()", note: "JsonStreamPool.borrowJsonStream"}
  - {class: com.jsoniter.spi.Config, method: getDecoderCacheKey, match: "(Type type)", note: "Config.getDecoderCacheKey"}
  - {class: com.jsoniter.IterImplForStreaming, method: readObjectFieldAsSlice, match: "(JsonIterator iter) throws IOException", note: "IterImplForStreaming.readObjectFieldAsSlice"}
  - {class: com.jsoniter.any.ListWrapperAny, method: valueType, match: "()", note: "ListWrapperAny.valueType"}
  - {class: com.jsoniter.extra.JacksonCompatibilityMode, method: doBuild, match: "(String configName)", note: "JacksonCompatibilityMode.doBuild"}
  - {class: com.jsoniter.fuzzy.StringFloatDecoder, method: decodeFloat, match: "(JsonIterator iter) throws IOException", note: "StringFloatDecoder.decodeFloat"}
  - {class: com.jsoniter.output.JsonStreamPool, method: returnJsonStream, match: "(JsonStream jsonStream)", note: "JsonStreamPool.returnJsonStream"}
  - {class: com.jsoniter.spi.EmptyExtension, method: chooseImplementation, match: "(Type type)", note: "EmptyExtension.chooseImplementation"}
  - {class: com.jsoniter.IterImplNumber, method: readDouble, match: "(final JsonIterator iter) throws IOException", note: "IterImplNumber.readDouble"}
  - {class: com.jsoniter.any.ListWrapperAny, method: object, match: "()", note: "ListWrapperAny.object"}
  - {class: com.jsoniter.extra.JdkDatetimeSupport, method: initialValue, match: "()", note: "JdkDatetimeSupport.initialValue"}
  - {class: com.jsoniter.fuzzy.StringIntDecoder, method: decodeInt, match: "(JsonIterator iter) throws IOException", note: "StringIntDecoder.decodeInt"}
  - {class: com.jsoniter.output.MapKeyEncoders, method: registerOrGetExisting, match: "(Type mapKeyType)", note: "MapKeyEncoders.registerOrGetExisting"}
  - {class: com.jsoniter.spi.EmptyExtension, method: canCreate, match: "(Class clazz)", note: "EmptyExtension.canCreate"}
  - {class: com.jsoniter.IterImplNumber, method: readFloat, match: "(final JsonIterator iter) throws IOException", note: "IterImplNumber.readFloat"}
