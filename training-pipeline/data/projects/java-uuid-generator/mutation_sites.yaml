# Curated performance-mutation sites for java-uuid-generator (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants java-uuid-generator --source data/external-src/<checkout> \
#       --sites data/projects/java-uuid-generator/mutation_sites.yaml

package_root: com.fasterxml.uuid

sites:
  - {class: com.fasterxml.uuid.UUIDComparator, method: staticCompare, match: "(UUID u1, UUID u2)", note: "UUIDComparator.staticCompare"}
  - {class: com.fasterxml.uuid.ext.FileBasedTimestampSynchronizer, method: setUpdateInterval, match: "(long interval)", note: "FileBasedTimestampSynchronizer.setUpdateInterval"}
  - {class: com.fasterxml.uuid.impl.UUIDUtil, method: nilUUID, match: "()", note: "UUIDUtil.nilUUID"}
  - {class: com.fasterxml.uuid.UUIDComparator, method: compareULongs, match: "(long l1, long l2)", note: "UUIDComparator.compareULongs"}
  - {class: com.fasterxml.uuid.ext.FileBasedTimestampSynchronizer, method: initialize, match: "() throws IOException", note: "FileBasedTimestampSynchronizer.initialize"}
  - {class: com.fasterxml.uuid.impl.UUIDUtil, method: maxUUID, match: "()", note: "UUIDUtil.maxUUID"}
  - {class: com.fasterxml.uuid.UUIDComparator, method: compareUInts, match: "(int i1, int i2)", note: "UUIDComparator.compareUInts"}
  - {class: com.fasterxml.uuid.ext.FileBasedTimestampSynchronizer, method: deactivate, match: "() throws IOException", note: "FileBasedTimestampSynchronizer.deactivate"}
  - {class: com.fasterxml.uuid.impl.UUIDUtil, method: uuid, match: "(String id)", note: "UUIDUtil.uuid"}
  - {class: com.fasterxml.uuid.EgressInterfaceFinder, method: egressInterface, match: "() throws EgressResolutionException", note: "EgressInterfaceFinder.egressInterface"}
  - {class: com.fasterxml.uuid.ext.FileBasedTimestampSynchronizer, method: doDeactivate, match: "(LockedFile lf1, LockedFile lf2)", note: "FileBasedTimestampSynchronizer.doDeactivate"}
  - {class: com.fasterxml.uuid.impl.UUIDUtil, method: uuid, match: "(byte[] bytes)", note: "UUIDUtil.uuid"}
  - {class: com.fasterxml.uuid.EgressInterfaceFinder, method: fromDefaultMechanisms, match: "(final int timeoutMillis)", note: "EgressInterfaceFinder.fromDefaultMechanisms"}
  - {class: com.fasterxml.uuid.ext.LockedFile, method: deactivate, match: "()", note: "LockedFile.deactivate"}
  - {class: com.fasterxml.uuid.impl.LazyRandom, method: sharedSecureRandom, match: "()", note: "LazyRandom.sharedSecureRandom"}
  - {class: com.fasterxml.uuid.EgressInterfaceFinder, method: fromAggregate, match: "(Finder[] finders)", note: "EgressInterfaceFinder.fromAggregate"}
  - {class: com.fasterxml.uuid.ext.LockedFile, method: readStamp, match: "()", note: "LockedFile.readStamp"}
  - {class: com.fasterxml.uuid.impl.LoggerFacade, method: getLogger, match: "(Class<?> forClass)", note: "LoggerFacade.getLogger"}
  - {class: com.fasterxml.uuid.EgressInterfaceFinder, method: egressInterface, match: "()", note: "EgressInterfaceFinder.egressInterface"}
  - {class: com.fasterxml.uuid.ext.LockedFile, method: writeStamp, match: "(long stamp)", note: "LockedFile.writeStamp"}
  - {class: com.fasterxml.uuid.impl.LoggerFacade, method: warn, match: "(String msg)", note: "LoggerFacade.warn"}
  - {class: com.fasterxml.uuid.EthernetAddress, method: valueOf, match: "(byte[] addr)", note: "EthernetAddress.valueOf"}
  - {class: com.fasterxml.uuid.ext.LockedFile, method: doDeactivate, match: "(File f, RandomAccessFile raf,", note: "LockedFile.doDeactivate"}
  - {class: com.fasterxml.uuid.impl.LoggerFacade, method: warn, match: "(String msg, Object arg)", note: "LoggerFacade.warn"}
  - {class: com.fasterxml.uuid.EthernetAddress, method: valueOf, match: "(int[] addr)", note: "EthernetAddress.valueOf"}
