# Curated performance-mutation sites for domino-jackson (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants domino-jackson --source data/external-src/<checkout> \
#       --sites data/projects/domino-jackson/mutation_sites.yaml

package_root: org.dominokit.jackson

sites:
  - {class: org.dominokit.jackson.ServerValueStringifier, method: stringify, match: "(String value)", note: "ServerValueStringifier.stringify"}
  - {class: org.dominokit.jackson.deser.StringJsonDeserializer, method: getInstance, match: "()", note: "StringJsonDeserializer.getInstance"}
  - {class: org.dominokit.jackson.processor.BeanMapperGenerator, method: getSuperClass, match: "()", note: "BeanMapperGenerator.getSuperClass"}
  - {class: org.dominokit.jackson.registration.TypeToken, method: of, match: "(Class<T> type)", note: "TypeToken.of"}
  - {class: org.dominokit.jackson.ser.StringJsonSerializer, method: getInstance, match: "()", note: "StringJsonSerializer.getInstance"}
  - {class: org.dominokit.jackson.stream.impl.NonBufferedJsonReader, method: setLenient, match: "(boolean lenient)", note: "NonBufferedJsonReader.setLenient"}
  - {class: org.dominokit.jackson.utils.Base64Utils, method: fromBase64, match: "(String data)", note: "Base64Utils.fromBase64"}
  - {class: org.dominokit.jackson.DefaultJsonDeserializationContext, method: failOnUnknownProperties, match: "(boolean failOnUnknownProperties)", note: "DefaultJsonDeserializationContext.failOnUnknownProperties"}
  - {class: org.dominokit.jackson.deser.StringJsonDeserializer, method: doDeserialize, match: "(", note: "StringJsonDeserializer.doDeserialize"}
  - {class: org.dominokit.jackson.processor.BeanMapperGenerator, method: getMapperMethods, match: "(Element element, TypeMirror beanType)", note: "BeanMapperGenerator.getMapperMethods"}
  - {class: org.dominokit.jackson.registration.TypeToken, method: getRawType, match: "()", note: "TypeToken.getRawType"}
  - {class: org.dominokit.jackson.ser.StringJsonSerializer, method: isEmpty, match: "(String value)", note: "StringJsonSerializer.isEmpty"}
  - {class: org.dominokit.jackson.stream.impl.NonBufferedJsonReader, method: isLenient, match: "()", note: "NonBufferedJsonReader.isLenient"}
  - {class: org.dominokit.jackson.utils.Base64Utils, method: longFromBase64, match: "(String value)", note: "Base64Utils.longFromBase64"}
  - {class: org.dominokit.jackson.DefaultJsonDeserializationContext, method: unwrapRootValue, match: "(boolean unwrapRootValue)", note: "DefaultJsonDeserializationContext.unwrapRootValue"}
  - {class: org.dominokit.jackson.deser.array.ArrayJsonDeserializer, method: newInstance, match: "(", note: "ArrayJsonDeserializer.newInstance"}
  - {class: org.dominokit.jackson.processor.GeneratedMappersRegistry, method: addTypeToken, match: "(Category category, TypeMirror typeMirror)", note: "GeneratedMappersRegistry.addTypeToken"}
  - {class: org.dominokit.jackson.ser.array.ArrayJsonSerializer, method: newInstance, match: "(JsonSerializer<T> serializer)", note: "ArrayJsonSerializer.newInstance"}
