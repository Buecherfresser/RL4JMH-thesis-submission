# Curated performance-mutation sites for aeron (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants aeron --source data/external-src/<checkout> \
#       --sites data/projects/aeron/mutation_sites.yaml

package_root: io.aeron.driver

sites:
  - {class: io.aeron.driver.AeronClient, method: close, match: "()", note: "AeronClient.close"}
  - {class: io.aeron.driver.buffer.MappedRawLog, method: termLength, match: "()", note: "MappedRawLog.termLength"}
  - {class: io.aeron.driver.ext.CubicCongestionControl, method: close, match: "()", note: "CubicCongestionControl.close"}
