  - {class: org.littleshoot.proxy.impl.ProxyUtils, method: formatDate, match: "(final Date date)", note: "ProxyUtils.formatDate"}
  - {class: org.littleshoot.proxy.ChainedProxyAdapter, method: getLocalAddress, match: "()", note: "ChainedProxyAdapter.getLocalAddress"}
  - {class: org.littleshoot.proxy.extras.SelfSignedSslEngineSource, method: newSslEngine, match: "(String peerHost, int peerPort)", note: "SelfSignedSslEngineSource.newSslEngine"}
  - {class: org.littleshoot.proxy.impl.ProxyUtils, method: formatDate, match: "(final Date date, final String pattern)", note: "ProxyUtils.formatDate"}
  - {class: org.littleshoot.proxy.ChainedProxyAdapter, method: getTransportProtocol, match: "()", note: "ChainedProxyAdapter.getTransportProtocol"}
