# Curated benchmarkable classes for Apache Commons Numbers (GRPO prompt corpus).
#
# Small, self-contained numeric kernels (parsing, gcd/reduce, special functions, combinatorics)
# with hot, once-per-call public methods -- ideal JMH subjects. FQCNs are best-effort from the
# pinned public API; jmh-curate-snippets reports any that don't match an extracted snippet, so a
# version drift shrinks the corpus visibly instead of silently. Filter with:
#   jmh-curate-snippets --snippets data/snippets/commons-numbers.jsonl \
#       --good-classes data/projects/commons-numbers/good_classes.yaml

project: commons-numbers

classes:
  # core
  - org.apache.commons.numbers.core.Precision
  - org.apache.commons.numbers.core.ArithmeticUtils
  - org.apache.commons.numbers.core.Sum
  - org.apache.commons.numbers.core.Norm
  # fraction
  - org.apache.commons.numbers.fraction.Fraction
  - org.apache.commons.numbers.fraction.BigFraction
  # gamma / special functions
  - org.apache.commons.numbers.gamma.Gamma
  - org.apache.commons.numbers.gamma.LogGamma
  - org.apache.commons.numbers.gamma.Erf
  - org.apache.commons.numbers.gamma.Erfc
  - org.apache.commons.numbers.gamma.Beta
  - org.apache.commons.numbers.gamma.LogBeta
  - org.apache.commons.numbers.gamma.RegularizedGamma
  # combinatorics
  - org.apache.commons.numbers.combinatorics.BinomialCoefficient
  - org.apache.commons.numbers.combinatorics.BinomialCoefficientDouble
  - org.apache.commons.numbers.combinatorics.Factorial
  - org.apache.commons.numbers.combinatorics.FactorialDouble
  - org.apache.commons.numbers.combinatorics.LogFactorial
  - org.apache.commons.numbers.combinatorics.LogBinomialCoefficient
  # complex
  - org.apache.commons.numbers.complex.Complex
  # primes
  - org.apache.commons.numbers.primes.Primes
  # angle
  - org.apache.commons.numbers.angle.CosAngle
  - org.apache.commons.numbers.angle.Reduce
  # arrays
  - org.apache.commons.numbers.arrays.Selection
