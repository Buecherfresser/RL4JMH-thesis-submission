  - {class: nonapi.io.github.classgraph.classloaderhandler.JPMSClassLoaderHandler, method: canHandle, match: "(final Class<?> classLoaderClass, final LogNode log)", note: "JPMSClassLoaderHandler.canHandle"}
  - {class: nonapi.io.github.classgraph.classloaderhandler.JPMSClassLoaderHandler, method: findClassLoaderOrder, match: "(final ClassLoader classLoader, final ClassLoaderOrder classLoaderOrder,", note: "JPMSClassLoaderHandler.findClassLoaderOrder"}
  - {class: nonapi.io.github.classgraph.classloaderhandler.OSGiDefaultClassLoaderHandler, method: canHandle, match: "(final Class<?> classLoaderClass, final LogNode log)", note: "OSGiDefaultClassLoaderHandler.canHandle"}
