  - {class: net.openhft.hashing.ByteBufferAccess, method: getUnsignedByte, match: "(ByteBuffer input, long offset)", note: "ByteBufferAccess.getUnsignedByte"}
  - {class: net.openhft.hashing.ByteBufferAccess, method: byteOrder, match: "(ByteBuffer input)", note: "ByteBufferAccess.byteOrder"}
  - {class: net.openhft.hashing.ByteBufferAccess, method: reverseAccess, match: "()", note: "ByteBufferAccess.reverseAccess"}
  - {class: net.openhft.hashing.HotSpotPrior7u6StringHash, method: longHash, match: "(String s, LongHashFunction hashFunction, int off, int len)", note: "HotSpotPrior7u6StringHash.longHash"}
