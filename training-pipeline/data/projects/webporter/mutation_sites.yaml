# Curated performance-mutation sites for webporter (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants webporter --source data/external-src/<checkout> \
#       --sites data/projects/webporter/mutation_sites.yaml

package_root: com.brianway.webporter

sites:
  - {class: com.brianway.webporter.collector.zhihu.ZhihuConfiguration, method: getMemberPath, match: "()", note: "ZhihuConfiguration.getMemberPath"}
  - {class: com.brianway.webporter.configure.BasicConfiguration, method: resolve, match: "()", note: "BasicConfiguration.resolve"}
  - {class: com.brianway.webporter.data.HashSetDuplicateRemover, method: isDuplicate, match: "(ID id)", note: "HashSetDuplicateRemover.isDuplicate"}
  - {class: com.brianway.webporter.util.StringHelper, method: urlEncode, match: "(String urlToken)", note: "StringHelper.urlEncode"}
