# Curated performance-mutation sites for javolution (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants javolution --source data/external-src/<checkout> \
#       --sites data/projects/javolution/mutation_sites.yaml

package_root: org.javolution.util

sites:
  - {class: org.javolution.util.FastBitSet, method: and, match: "(FastBitSet that)", note: "FastBitSet.and"}
  - {class: org.javolution.util.internal.collection.MappedCollectionImpl, method: clear, match: "()", note: "MappedCollectionImpl.clear"}
  - {class: org.javolution.util.FastBitSet, method: andNot, match: "(FastBitSet that)", note: "FastBitSet.andNot"}
  - {class: org.javolution.util.internal.collection.MappedCollectionImpl, method: equality, match: "()", note: "MappedCollectionImpl.equality"}
  - {class: org.javolution.util.FastMap, method: updateValue, match: "(Entry<K, V> entry, V newValue)", note: "FastMap.updateValue"}
  - {class: org.javolution.util.internal.function.ArrayEqualityImpl, method: areEqual, match: "(@Nullable Object left, @Nullable Object right)", note: "ArrayEqualityImpl.areEqual"}
  - {class: org.javolution.util.FastMap, method: areEqual, match: "(Entry<K, V> left, Entry<K, V> right)", note: "FastMap.areEqual"}
  - {class: org.javolution.util.internal.map.AtomicMapImpl, method: clear, match: "()", note: "AtomicMapImpl.clear"}
  - {class: org.javolution.util.FastSet, method: clear, match: "()", note: "FastSet.clear"}
  - {class: org.javolution.util.internal.map.AtomicMapImpl, method: containsKey, match: "(Object key)", note: "AtomicMapImpl.containsKey"}
  - {class: org.javolution.util.FastSet, method: freeze, match: "()", note: "FastSet.freeze"}
  - {class: org.javolution.util.internal.map.KeySetImpl, method: test, match: "(Entry<K, V> param)", note: "KeySetImpl.test"}
  - {class: org.javolution.util.FastTable, method: clear, match: "()", note: "FastTable.clear"}
  - {class: org.javolution.util.internal.map.KeySetImpl, method: clear, match: "()", note: "KeySetImpl.clear"}
  - {class: org.javolution.util.FastTable, method: freeze, match: "()", note: "FastTable.freeze"}
  - {class: org.javolution.util.internal.map.LinkedMapImpl, method: entries, match: "()", note: "LinkedMapImpl.entries"}
  - {class: org.javolution.util.TestFractal, method: main, match: "(String[] args)", note: "TestFractal.main"}
  - {class: org.javolution.util.internal.map.LinkedMapImpl, method: getEntry, match: "(K key)", note: "LinkedMapImpl.getEntry"}
  - {class: org.javolution.util.internal.map.MultiMapImpl, method: entries, match: "()", note: "MultiMapImpl.entries"}
  - {class: org.javolution.util.internal.map.MultiMapImpl, method: getEntry, match: "(K key)", note: "MultiMapImpl.getEntry"}
  - {class: org.javolution.util.internal.map.SharedMapImpl, method: clear, match: "()", note: "SharedMapImpl.clear"}
  - {class: org.javolution.util.internal.map.SharedMapImpl, method: keyOrder, match: "()", note: "SharedMapImpl.keyOrder"}
  - {class: org.javolution.util.internal.map.SubMapImpl, method: entries, match: "()", note: "SubMapImpl.entries"}
  - {class: org.javolution.util.internal.map.SubMapImpl, method: getEntry, match: "(K key)", note: "SubMapImpl.getEntry"}
  - {class: org.javolution.util.internal.map.UnmodifiableMapImpl, method: entries, match: "()", note: "UnmodifiableMapImpl.entries"}
  - {class: org.javolution.util.internal.map.UnmodifiableMapImpl, method: clear, match: "()", note: "UnmodifiableMapImpl.clear"}
  - {class: org.javolution.util.internal.set.AtomicSetImpl, method: addAll, match: "(Collection<? extends E> that)", note: "AtomicSetImpl.addAll"}
  - {class: org.javolution.util.internal.set.AtomicSetImpl, method: addAll, match: "(@SuppressWarnings(\"unchecked\") E... elements)", note: "AtomicSetImpl.addAll"}
  - {class: org.javolution.util.internal.set.FilteredSetImpl, method: clear, match: "()", note: "FilteredSetImpl.clear"}
  - {class: org.javolution.util.internal.set.FilteredSetImpl, method: isEmpty, match: "()", note: "FilteredSetImpl.isEmpty"}
  - {class: org.javolution.util.internal.set.LinkedSetImpl, method: clear, match: "()", note: "LinkedSetImpl.clear"}
  - {class: org.javolution.util.internal.set.LinkedSetImpl, method: iterator, match: "()", note: "LinkedSetImpl.iterator"}
  - {class: org.javolution.util.internal.set.MultiSetImpl, method: clear, match: "()", note: "MultiSetImpl.clear"}
  - {class: org.javolution.util.internal.set.MultiSetImpl, method: size, match: "()", note: "MultiSetImpl.size"}
  - {class: org.javolution.util.internal.set.SharedSetImpl, method: addAll, match: "(Collection<? extends E> that)", note: "SharedSetImpl.addAll"}
  - {class: org.javolution.util.internal.set.SharedSetImpl, method: addAll, match: "(@SuppressWarnings(\"unchecked\") E... elements)", note: "SharedSetImpl.addAll"}
  - {class: org.javolution.util.internal.set.SortedSetImpl, method: removeIf, match: "(Predicate<? super E> filter)", note: "SortedSetImpl.removeIf"}
