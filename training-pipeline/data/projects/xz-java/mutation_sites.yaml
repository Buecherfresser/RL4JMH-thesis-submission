  - {class: org.tukaani.xz.lz.HC4, method: getMatches, match: "()", note: "HC4.getMatches"}
  - {class: org.tukaani.xz.rangecoder.RangeEncoderToBuffer, method: reset, match: "()", note: "RangeEncoderToBuffer.reset"}
  - {class: org.tukaani.xz.simple.IA64, method: code, match: "(byte[] buf, int off, int len)", note: "IA64.code"}
  - {class: org.tukaani.xz.BasicArrayCache, method: pop, match: "()", note: "BasicArrayCache.pop"}
  - {class: org.tukaani.xz.simple.PowerPC, method: code, match: "(byte[] buf, int off, int len)", note: "PowerPC.code"}
  - {class: org.tukaani.xz.BasicArrayCache, method: push, match: "(T e)", note: "BasicArrayCache.push"}
  - {class: org.tukaani.xz.simple.SPARC, method: code, match: "(byte[] buf, int off, int len)", note: "SPARC.code"}
  - {class: org.tukaani.xz.BlockInputStream, method: close, match: "()", note: "BlockInputStream.close"}
  - {class: org.tukaani.xz.simple.X86, method: code, match: "(byte[] buf, int off, int len)", note: "X86.code"}
  - {class: org.tukaani.xz.BlockInputStream, method: getUnpaddedSize, match: "()", note: "BlockInputStream.getUnpaddedSize"}
  - {class: org.tukaani.xz.BlockOutputStream, method: finish, match: "() throws IOException", note: "BlockOutputStream.finish"}
  - {class: org.tukaani.xz.BlockOutputStream, method: getUnpaddedSize, match: "()", note: "BlockOutputStream.getUnpaddedSize"}
