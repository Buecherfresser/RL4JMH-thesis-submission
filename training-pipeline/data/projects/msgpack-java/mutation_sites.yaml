  - {class: org.msgpack.value.ValueType, method: isBooleanType, match: "()", note: "ValueType.isBooleanType"}
  - {class: org.msgpack.core.buffer.ChannelBufferInput, method: close, match: "()", note: "ChannelBufferInput.close"}
  - {class: org.msgpack.jackson.dataformat.MessagePackFactory, method: setReuseResourceInGenerator, match: "(boolean reuseResourceInGenerator)", note: "MessagePackFactory.setReuseResourceInGenerator"}
  - {class: org.msgpack.value.Variable, method: isNilValue, match: "()", note: "Variable.isNilValue"}
  - {class: org.msgpack.core.buffer.ChannelBufferOutput, method: reset, match: "(WritableByteChannel channel)", note: "ChannelBufferOutput.reset"}
  - {class: org.msgpack.jackson.dataformat.MessagePackFactory, method: setReuseResourceInParser, match: "(boolean reuseResourceInParser)", note: "MessagePackFactory.setReuseResourceInParser"}
