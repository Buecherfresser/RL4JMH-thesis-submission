  - {class: com.github.jgonian.ipmath.PrefixUtils, method: sumIpv6Prefixes, match: "(List<Integer> ipv6Prefixes)", note: "PrefixUtils.sumIpv6Prefixes"}
  - {class: com.github.jgonian.ipmath.SizeComparator, method: reverse, match: "()", note: "SizeComparator.reverse"}
  - {class: com.github.jgonian.ipmath.SortedRangeSet, method: addAll, match: "(SortedRangeSet<C, R> ranges)", note: "SortedRangeSet.addAll"}
  - {class: com.github.jgonian.ipmath.SortedRangeSet, method: addAll, match: "(Collection<R> ranges)", note: "SortedRangeSet.addAll"}
  - {class: com.github.jgonian.ipmath.SortedRangeSet, method: removeAll, match: "(SortedRangeSet<C, R> ranges)", note: "SortedRangeSet.removeAll"}
