# Curated performance-mutation sites for flag4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants flag4j --source data/external-src/<checkout> \
#       --sites data/projects/flag4j/mutation_sites.yaml

package_root: org.flag4j.linalg

sites:
  - {class: org.flag4j.linalg.Condition, method: cond, match: "(Matrix src, double p)", note: "Condition.cond"}
  - {class: org.flag4j.linalg.decompositions.balance.ComplexBalancer, method: swapRows, match: "(int rowIdx1, int rowIdx2, int start, int stop)", note: "ComplexBalancer.swapRows"}
  - {class: org.flag4j.linalg.ops.dense.real.RealDenseSetOps, method: setValues, match: "(Double[] src, final double[] dest)", note: "RealDenseSetOps.setValues"}
  - {class: org.flag4j.linalg.solvers.exact.ComplexExactSolver, method: permuteRows, match: "(CVector b)", note: "ComplexExactSolver.permuteRows"}
  - {class: org.flag4j.linalg.transformations.Givens, method: getGeneralRotator, match: "(int size, int i, int j, double theta)", note: "Givens.getGeneralRotator"}
  - {class: org.flag4j.linalg.Condition, method: cond, match: "(CMatrix src, double p)", note: "Condition.cond"}
  - {class: org.flag4j.linalg.decompositions.balance.ComplexBalancer, method: swapCols, match: "(int colIdx1, int colIdx2, int start, int stop)", note: "ComplexBalancer.swapCols"}
  - {class: org.flag4j.linalg.ops.dense.real.RealDenseSetOps, method: setValues, match: "(Integer[] src, final double[] dest)", note: "RealDenseSetOps.setValues"}
  - {class: org.flag4j.linalg.solvers.exact.ComplexExactSolver, method: permuteRows, match: "(CMatrix B)", note: "ComplexExactSolver.permuteRows"}
  - {class: org.flag4j.linalg.transformations.Givens, method: getRotator, match: "(Vector v, int i)", note: "Givens.getRotator"}
  - {class: org.flag4j.linalg.DirectSum, method: directSum, match: "(Matrix A, Matrix B)", note: "DirectSum.directSum"}
  - {class: org.flag4j.linalg.decompositions.balance.RealBalancer, method: swapRows, match: "(int rowIdx1, int rowIdx2, int start, int stop)", note: "RealBalancer.swapRows"}
  - {class: org.flag4j.linalg.ops.sparse.SparseUtils, method: cooFlattenIndices, match: "(Shape shape, int[][] indices)", note: "SparseUtils.cooFlattenIndices"}
  - {class: org.flag4j.linalg.solvers.exact.ComplexExactTensorSolver, method: initMatrix, match: "(CTensor A, int prod)", note: "ComplexExactTensorSolver.initMatrix"}
  - {class: org.flag4j.linalg.transformations.Householder, method: getReflector, match: "(Vector normal)", note: "Householder.getReflector"}
  - {class: org.flag4j.linalg.DirectSum, method: directSum, match: "(Matrix A, CooMatrix B)", note: "DirectSum.directSum"}
  - {class: org.flag4j.linalg.decompositions.balance.RealBalancer, method: swapCols, match: "(int colIdx1, int colIdx2, int start, int stop)", note: "RealBalancer.swapCols"}
  - {class: org.flag4j.linalg.ops.sparse.SparseUtils, method: cooFlattenIndices, match: "(Shape shape, int[][] indices, int axis)", note: "SparseUtils.cooFlattenIndices"}
  - {class: org.flag4j.linalg.solvers.exact.ComplexExactTensorSolver, method: initVector, match: "(CTensor B)", note: "ComplexExactTensorSolver.initVector"}
  - {class: org.flag4j.linalg.transformations.Householder, method: getVector, match: "(Vector normal)", note: "Householder.getVector"}
  - {class: org.flag4j.linalg.Eigen, method: get2x2EigenValues, match: "(Matrix src)", note: "Eigen.get2x2EigenValues"}
  - {class: org.flag4j.linalg.decompositions.chol.ComplexCholesky, method: decompose, match: "(CMatrix src)", note: "ComplexCholesky.decompose"}
  - {class: org.flag4j.linalg.ops.sparse.coo.CooGetSet, method: setRow, match: "(Shape srcShape, T[] srcEntries, int[] rowIndices, int[] colIndices,", note: "CooGetSet.setRow"}
  - {class: org.flag4j.linalg.solvers.exact.RealExactSolver, method: permuteRows, match: "(Vector b)", note: "RealExactSolver.permuteRows"}
  - {class: org.flag4j.linalg.transformations.Projection, method: getPerspective, match: "(double fov, double aspectRatio, double nearClip, double farClip)", note: "Projection.getPerspective"}
  - {class: org.flag4j.linalg.Eigen, method: get2x2EigenValues, match: "(double a11, double a12, double a21, double a22)", note: "Eigen.get2x2EigenValues"}
  - {class: org.flag4j.linalg.decompositions.chol.RealCholesky, method: decompose, match: "(Matrix src)", note: "RealCholesky.decompose"}
  - {class: org.flag4j.linalg.ops.sparse.coo.CooGetSet, method: setCol, match: "(Shape srcShape, T[] srcEntries, int[] rowIndices, int[] colIndices,", note: "CooGetSet.setCol"}
  - {class: org.flag4j.linalg.solvers.exact.RealExactSolver, method: permuteRows, match: "(Matrix B)", note: "RealExactSolver.permuteRows"}
  - {class: org.flag4j.linalg.transformations.Projection, method: getPerspective, match: "(double fovX, double fovY, double aspectRatio, double nearClip, double farClip)", note: "Projection.getPerspective"}
  - {class: org.flag4j.linalg.Invert, method: inv, match: "(Matrix src)", note: "Invert.inv"}
  - {class: org.flag4j.linalg.decompositions.hess.ComplexHess, method: decompose, match: "(CMatrix src)", note: "ComplexHess.decompose"}
  - {class: org.flag4j.linalg.ops.sparse.coo.real.RealCooMatrixGetSet, method: matrixGet, match: "(CooMatrix src, int row, int col)", note: "RealCooMatrixGetSet.matrixGet"}
  - {class: org.flag4j.linalg.solvers.exact.RealExactTensorSolver, method: initMatrix, match: "(Tensor A, int prod)", note: "RealExactTensorSolver.initMatrix"}
  - {class: org.flag4j.linalg.transformations.Rotation, method: rotate2D, match: "(double theta)", note: "Rotation.rotate2D"}
  - {class: org.flag4j.linalg.Invert, method: inv, match: "(CMatrix src)", note: "Invert.inv"}
  - {class: org.flag4j.linalg.decompositions.hess.ComplexHess, method: decompose, match: "(CMatrix src, int iLow, int iHigh)", note: "ComplexHess.decompose"}
  - {class: org.flag4j.linalg.ops.sparse.coo.real.RealCooMatrixGetSet, method: matrixSet, match: "(CooMatrix src, int row, int col, double value)", note: "RealCooMatrixGetSet.matrixSet"}
  - {class: org.flag4j.linalg.solvers.exact.RealExactTensorSolver, method: initVector, match: "(Tensor B)", note: "RealExactTensorSolver.initVector"}
  - {class: org.flag4j.linalg.transformations.Rotation, method: rotateX3D, match: "(double theta)", note: "Rotation.rotateX3D"}
  - {class: org.flag4j.linalg.MatrixNorms, method: schattenNorm, match: "(Matrix src,  double p)", note: "MatrixNorms.schattenNorm"}
  - {class: org.flag4j.linalg.decompositions.hess.HermHess, method: decompose, match: "(CMatrix src)", note: "HermHess.decompose"}
  - {class: org.flag4j.linalg.ops.MatrixMultiplyDispatcher, method: dispatch, match: "(Matrix A, CVector b)", note: "MatrixMultiplyDispatcher.dispatch"}
  - {class: org.flag4j.linalg.solvers.exact.triangular.ComplexBackSolver, method: setCheckSingular, match: "(boolean checkSingular)", note: "ComplexBackSolver.setCheckSingular"}
  - {class: org.flag4j.linalg.transformations.View, method: lookAt, match: "(Vector cameraPos, Vector center, Vector up)", note: "View.lookAt"}
  - {class: org.flag4j.linalg.MatrixNorms, method: schattenNorm, match: "(CMatrix src,  double p)", note: "MatrixNorms.schattenNorm"}
  - {class: org.flag4j.linalg.decompositions.hess.HermHess, method: getH, match: "()", note: "HermHess.getH"}
  - {class: org.flag4j.linalg.ops.MatrixMultiplyDispatcher, method: dispatch, match: "(CMatrix A, Vector b)", note: "MatrixMultiplyDispatcher.dispatch"}
  - {class: org.flag4j.linalg.solvers.exact.triangular.ComplexBackSolver, method: getDet, match: "()", note: "ComplexBackSolver.getDet"}
  - {class: org.flag4j.linalg.PositiveDefiniteness, method: isPosDef, match: "(Matrix src)", note: "PositiveDefiniteness.isPosDef"}
