# Curated performance-mutation sites for ck (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants ck --source data/external-src/<checkout> \
#       --sites data/projects/ck/mutation_sites.yaml

package_root: com.github.mauricioaniche

sites:
  - {class: com.github.mauricioaniche.ck.metric.NumberOfAssignments, method: visit, match: "(Assignment node)", note: "NumberOfAssignments.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfAssignments, method: visit, match: "(VariableDeclarationFragment node)", note: "NumberOfAssignments.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfComparisons, method: visit, match: "(InfixExpression node)", note: "NumberOfComparisons.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfComparisons, method: setResult, match: "(CKMethodResult result)", note: "NumberOfComparisons.setResult"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfFields, method: visit, match: "(FieldDeclaration node)", note: "NumberOfFields.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfFields, method: setResult, match: "(CKClassResult result)", note: "NumberOfFields.setResult"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfInnerClassesLambdasAndAnonymousClasses, method: visit, match: "(TypeDeclaration node)", note: "NumberOfInnerClassesLambdasAndAnonymousClasses.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfInnerClassesLambdasAndAnonymousClasses, method: visit, match: "(EnumDeclaration node)", note: "NumberOfInnerClassesLambdasAndAnonymousClasses.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfLogStatements, method: isLogStatement, match: "(String line)", note: "NumberOfLogStatements.isLogStatement"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfLogStatements, method: visit, match: "(MethodInvocation node)", note: "NumberOfLogStatements.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfLoops, method: visit, match: "(EnhancedForStatement node)", note: "NumberOfLoops.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfLoops, method: visit, match: "(DoStatement node)", note: "NumberOfLoops.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfMathOperators, method: visit, match: "(InfixExpression node)", note: "NumberOfMathOperators.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfMathOperators, method: setResult, match: "(CKMethodResult result)", note: "NumberOfMathOperators.setResult"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfMaxNestedBlock, method: visit, match: "(Block node)", note: "NumberOfMaxNestedBlock.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfMaxNestedBlock, method: visit, match: "(ForStatement node)", note: "NumberOfMaxNestedBlock.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfMethods, method: visit, match: "(MethodDeclaration node)", note: "NumberOfMethods.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfMethods, method: setResult, match: "(CKClassResult result)", note: "NumberOfMethods.setResult"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfNumbers, method: visit, match: "(NumberLiteral node)", note: "NumberOfNumbers.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfNumbers, method: setResult, match: "(CKMethodResult result)", note: "NumberOfNumbers.setResult"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfParameters, method: visit, match: "(MethodDeclaration node)", note: "NumberOfParameters.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfParameters, method: setResult, match: "(CKMethodResult result)", note: "NumberOfParameters.setResult"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfParenthesis, method: visit, match: "(ParenthesizedExpression node)", note: "NumberOfParenthesis.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfParenthesis, method: setResult, match: "(CKMethodResult result)", note: "NumberOfParenthesis.setResult"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfReturns, method: setResult, match: "(CKMethodResult result)", note: "NumberOfReturns.setResult"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfReturns, method: visit, match: "(ReturnStatement node)", note: "NumberOfReturns.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfStringLiterals, method: visit, match: "(StringLiteral node)", note: "NumberOfStringLiterals.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfStringLiterals, method: setResult, match: "(CKMethodResult result)", note: "NumberOfStringLiterals.setResult"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfTryCatches, method: visit, match: "(TryStatement node)", note: "NumberOfTryCatches.visit"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfTryCatches, method: setResult, match: "(CKMethodResult result)", note: "NumberOfTryCatches.setResult"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfVariables, method: setResult, match: "(CKMethodResult result)", note: "NumberOfVariables.setResult"}
  - {class: com.github.mauricioaniche.ck.metric.NumberOfVariables, method: visit, match: "(VariableDeclarationFragment node)", note: "NumberOfVariables.visit"}
  - {class: com.github.mauricioaniche.ck.util.FileUtils, method: getAllDirs, match: "(String path)", note: "FileUtils.getAllDirs"}
  - {class: com.github.mauricioaniche.ck.util.FileUtils, method: getAllJavaFiles, match: "(String path)", note: "FileUtils.getAllJavaFiles"}
  - {class: com.github.mauricioaniche.ck.util.JDTUtils, method: getStartLine, match: "(CompilationUnit cu, MethodDeclaration node)", note: "JDTUtils.getStartLine"}
  - {class: com.github.mauricioaniche.ck.util.JDTUtils, method: getStartLine, match: "(CompilationUnit cu, Initializer node)", note: "JDTUtils.getStartLine"}
  - {class: com.github.mauricioaniche.ck.CK, method: calculate, match: "(String path, CKNotifier notifier)", note: "CK.calculate"}
  - {class: com.github.mauricioaniche.ck.CK, method: calculate, match: "(Path path, CKNotifier notifier)", note: "CK.calculate"}
  - {class: com.github.mauricioaniche.ck.CKClassResult, method: getModifiers, match: "()", note: "CKClassResult.getModifiers"}
  - {class: com.github.mauricioaniche.ck.CKClassResult, method: getFile, match: "()", note: "CKClassResult.getFile"}
  - {class: com.github.mauricioaniche.ck.CKMethodResult, method: getModifiers, match: "()", note: "CKMethodResult.getModifiers"}
  - {class: com.github.mauricioaniche.ck.CKMethodResult, method: getIsVisible, match: "()", note: "CKMethodResult.getIsVisible"}
  - {class: com.github.mauricioaniche.ck.CKVisitor, method: visit, match: "(TypeDeclaration node)", note: "CKVisitor.visit"}
  - {class: com.github.mauricioaniche.ck.CKVisitor, method: endVisit, match: "(TypeDeclaration node)", note: "CKVisitor.endVisit"}
  - {class: com.github.mauricioaniche.ck.MetricsExecutor, method: acceptAST, match: "(String sourceFilePath,", note: "MetricsExecutor.acceptAST"}
  - {class: com.github.mauricioaniche.ck.ResultWriter, method: printResult, match: "(CKClassResult result) throws IOException", note: "ResultWriter.printResult"}
  - {class: com.github.mauricioaniche.ck.ResultWriter, method: flushAndClose, match: "() throws IOException", note: "ResultWriter.flushAndClose"}
  - {class: com.github.mauricioaniche.ck.Runner, method: main, match: "(String[] args) throws IOException", note: "Runner.main"}
  - {class: com.github.mauricioaniche.ck.Runner, method: notify, match: "(CKClassResult result)", note: "Runner.notify"}
  - {class: com.github.mauricioaniche.ck.metric.CBO, method: visit, match: "(VariableDeclarationStatement node)", note: "CBO.visit"}
