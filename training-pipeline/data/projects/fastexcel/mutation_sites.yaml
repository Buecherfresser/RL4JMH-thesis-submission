# Curated performance-mutation sites for fastexcel (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants fastexcel --source data/external-src/<checkout> \
#       --sites data/projects/fastexcel/mutation_sites.yaml

