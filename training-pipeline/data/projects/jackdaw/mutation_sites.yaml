# Curated performance-mutation sites for jackdaw (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jackdaw --source data/external-src/<checkout> \
#       --sites data/projects/jackdaw/mutation_sites.yaml

package_root: com.github.vbauer

sites:
  - {class: com.github.vbauer.jackdaw.code.generator.JBuilderCodeGenerator, method: getAnnotation, match: "()", note: "JBuilderCodeGenerator.getAnnotation"}
