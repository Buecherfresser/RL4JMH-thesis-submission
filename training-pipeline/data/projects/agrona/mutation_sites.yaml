  - {class: org.agrona.concurrent.MutableDirectBufferParseIntAsciiBenchmark, method: unsafeBuffer, match: "()", note: "MutableDirectBufferParseIntAsciiBenchmark.unsafeBuffer"}
  - {class: org.agrona.generation.ClassFileManager, method: getClassLoader, match: "(final Location location)", note: "ClassFileManager.getClassLoader"}
