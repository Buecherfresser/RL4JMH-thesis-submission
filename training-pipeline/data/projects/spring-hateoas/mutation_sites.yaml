# Curated performance-mutation sites for spring-hateoas (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants spring-hateoas --source data/external-src/<checkout> \
#       --sites data/projects/spring-hateoas/mutation_sites.yaml

package_root: org.springframework.hateoas

sites:
  - {class: org.springframework.hateoas.LinkParser, method: parseLinks, match: "(String source)", note: "LinkParser.parseLinks"}
  - {class: org.springframework.hateoas.aot.AotUtils, method: registerModelDomainTypesForReflection, match: "(ResolvableType type, ReflectionHints reflection,", note: "AotUtils.registerModelDomainTypesForReflection"}
  - {class: org.springframework.hateoas.client.Hop, method: rel, match: "(String rel)", note: "Hop.rel"}
  - {class: org.springframework.hateoas.config.HateoasConfiguration, method: messageResolver, match: "()", note: "HateoasConfiguration.messageResolver"}
  - {class: org.springframework.hateoas.mediatype.PropertyUtils, method: extractPropertyValues, match: "(@Nullable Object object)", note: "PropertyUtils.extractPropertyValues"}
  - {class: org.springframework.hateoas.server.core.AnnotationMappingDiscoverer, method: getUriMapping, match: "(Class<?> type)", note: "AnnotationMappingDiscoverer.getUriMapping"}
  - {class: org.springframework.hateoas.support.ClassUtils, method: loadIfPresent, match: "(String type)", note: "ClassUtils.loadIfPresent"}
  - {class: org.springframework.hateoas.LinkParser, method: parseLink, match: "(String input)", note: "LinkParser.parseLink"}
  - {class: org.springframework.hateoas.aot.AotUtils, method: registerTypeForReflection, match: "(Class<?> type, ReflectionHints reflection, Class<?> context)", note: "AotUtils.registerTypeForReflection"}
  - {class: org.springframework.hateoas.client.Hop, method: withParameter, match: "(String name, Object value)", note: "Hop.withParameter"}
  - {class: org.springframework.hateoas.config.HypermediaConfigurationImportSelector, method: setResourceLoader, match: "(ResourceLoader resourceLoader)", note: "HypermediaConfigurationImportSelector.setResourceLoader"}
  - {class: org.springframework.hateoas.mediatype.PropertyUtils, method: createObjectFromProperties, match: "(BeanDescription description, Map<String, Object> properties)", note: "PropertyUtils.createObjectFromProperties"}
  - {class: org.springframework.hateoas.server.core.AnnotationMappingDiscoverer, method: getUriMapping, match: "(Method method)", note: "AnnotationMappingDiscoverer.getUriMapping"}
  - {class: org.springframework.hateoas.support.WebStack, method: getAvailableConfigurations, match: "()", note: "WebStack.getAvailableConfigurations"}
  - {class: org.springframework.hateoas.StringLinkRelation, method: of, match: "(String relation)", note: "StringLinkRelation.of"}
  - {class: org.springframework.hateoas.aot.ControllerMethodReturnTypeAotProcessor, method: processAheadOfTime, match: "(RegisteredBean registeredBean)", note: "ControllerMethodReturnTypeAotProcessor.processAheadOfTime"}
  - {class: org.springframework.hateoas.client.JsonPathLinkDiscoverer, method: findLinkWithRel, match: "(LinkRelation relation, String representation)", note: "JsonPathLinkDiscoverer.findLinkWithRel"}
  - {class: org.springframework.hateoas.config.HypermediaConfigurationImportSelector, method: setBeanFactory, match: "(BeanFactory beanFactory) throws BeansException", note: "HypermediaConfigurationImportSelector.setBeanFactory"}
  - {class: org.springframework.hateoas.mediatype.hal.HalModelBuilder, method: halModel, match: "()", note: "HalModelBuilder.halModel"}
  - {class: org.springframework.hateoas.server.core.CachingMappingDiscoverer, method: of, match: "(MappingDiscoverer delegate)", note: "CachingMappingDiscoverer.of"}
  - {class: org.springframework.hateoas.StringLinkRelation, method: value, match: "()", note: "StringLinkRelation.value"}
  - {class: org.springframework.hateoas.aot.ControllerMethodReturnTypeAotProcessor, method: applyTo, match: "(GenerationContext generationContext, BeanRegistrationCode beanRegistrationCode)", note: "ControllerMethodReturnTypeAotProcessor.applyTo"}
  - {class: org.springframework.hateoas.client.JsonPathLinkDiscoverer, method: findLinkWithRel, match: "(LinkRelation relation, InputStream representation)", note: "JsonPathLinkDiscoverer.findLinkWithRel"}
  - {class: org.springframework.hateoas.config.HypermediaRestTemplateConfigurer, method: registerHypermediaTypes, match: "(RestTemplate template)", note: "HypermediaRestTemplateConfigurer.registerHypermediaTypes"}
  - {class: org.springframework.hateoas.mediatype.hal.HalModelBuilder, method: halModel, match: "(EmbeddedWrappers wrappers)", note: "HalModelBuilder.halModel"}
  - {class: org.springframework.hateoas.server.core.CachingMappingDiscoverer, method: getUriMapping, match: "(Class<?> type)", note: "CachingMappingDiscoverer.getUriMapping"}
  - {class: org.springframework.hateoas.Affordance, method: getAffordanceModel, match: "(MediaType mediaType)", note: "Affordance.getAffordanceModel"}
  - {class: org.springframework.hateoas.aot.HateoasTypesRuntimeHints, method: registerHints, match: "(RuntimeHints hints, @Nullable ClassLoader classLoader)", note: "HateoasTypesRuntimeHints.registerHints"}
  - {class: org.springframework.hateoas.client.LinkDiscoverers, method: getLinkDiscovererFor, match: "(MediaType mediaType)", note: "LinkDiscoverers.getLinkDiscovererFor"}
  - {class: org.springframework.hateoas.config.HypermediaWebClientConfigurer, method: registerHypermediaTypes, match: "(WebClient.Builder builder)", note: "HypermediaWebClientConfigurer.registerHypermediaTypes"}
  - {class: org.springframework.hateoas.mediatype.hal.forms.HalFormsTemplateBuilder, method: findTemplates, match: "(RepresentationModel<?> resource)", note: "HalFormsTemplateBuilder.findTemplates"}
  - {class: org.springframework.hateoas.server.core.DummyInvocationUtils, method: invoke, match: "(org.aopalliance.intercept.MethodInvocation invocation)", note: "DummyInvocationUtils.invoke"}
  - {class: org.springframework.hateoas.Affordance, method: getRequiredAffordanceModel, match: "(MediaType mediaType)", note: "Affordance.getRequiredAffordanceModel"}
  - {class: org.springframework.hateoas.aot.HypermediaTypeAotProcessor, method: processAheadOfTime, match: "(RegisteredBean registeredBean)", note: "HypermediaTypeAotProcessor.processAheadOfTime"}
  - {class: org.springframework.hateoas.client.LinkDiscoverers, method: getLinkDiscovererFor, match: "(String mediaType)", note: "LinkDiscoverers.getLinkDiscovererFor"}
  - {class: org.springframework.hateoas.config.HypermediaWebTestClientConfigurer, method: afterConfigurerAdded, match: "(WebTestClient.Builder builder, //", note: "HypermediaWebTestClientConfigurer.afterConfigurerAdded"}
  - {class: org.springframework.hateoas.mediatype.hal.forms.HalFormsTemplateBuilder, method: of, match: "(HalFormsAffordanceModel affordance, boolean soleTemplate)", note: "HalFormsTemplateBuilder.of"}
  - {class: org.springframework.hateoas.server.core.DummyInvocationUtils, method: getLastInvocation, match: "()", note: "DummyInvocationUtils.getLastInvocation"}
  - {class: org.springframework.hateoas.CollectionModel, method: empty, match: "()", note: "CollectionModel.empty"}
  - {class: org.springframework.hateoas.aot.HypermediaTypeAotProcessor, method: applyTo, match: "(GenerationContext generationContext, BeanRegistrationCode beanRegistrationCode)", note: "HypermediaTypeAotProcessor.applyTo"}
  - {class: org.springframework.hateoas.client.Rels, method: getRelFor, match: "(String rel, LinkDiscoverers discoverers)", note: "Rels.getRelFor"}
  - {class: org.springframework.hateoas.config.RestTemplateHateoasConfiguration, method: postProcessBeforeInitialization, match: "(Object bean, String beanName) throws BeansException", note: "RestTemplateHateoasConfiguration.postProcessBeforeInitialization"}
  - {class: org.springframework.hateoas.mediatype.jsonpath.JacksonMappingProvider, method: map, match: "(Object source, Class<T> targetType, Configuration configuration)", note: "JacksonMappingProvider.map"}
  - {class: org.springframework.hateoas.server.core.EncodingUtils, method: encodePath, match: "(Object source)", note: "EncodingUtils.encodePath"}
  - {class: org.springframework.hateoas.CollectionModel, method: empty, match: "(Class<T> elementType, Class<?>... generics)", note: "CollectionModel.empty"}
  - {class: org.springframework.hateoas.aot.HypermediaTypesRuntimeHints, method: registerHints, match: "(RuntimeHints hints, @Nullable ClassLoader classLoader)", note: "HypermediaTypesRuntimeHints.registerHints"}
  - {class: org.springframework.hateoas.client.Rels, method: findInResponse, match: "(String response, MediaType mediaType)", note: "Rels.findInResponse"}
  - {class: org.springframework.hateoas.config.WebClientHateoasConfiguration, method: postProcessBeforeInitialization, match: "(Object bean, String beanName) throws BeansException", note: "WebClientHateoasConfiguration.postProcessBeforeInitialization"}
  - {class: org.springframework.hateoas.mediatype.jsonpath.JacksonMappingProvider, method: map, match: "(Object source, final TypeRef<T> targetType,", note: "JacksonMappingProvider.map"}
  - {class: org.springframework.hateoas.server.core.EncodingUtils, method: encodeFragment, match: "(Object source)", note: "EncodingUtils.encodeFragment"}
