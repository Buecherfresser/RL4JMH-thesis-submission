# Curated performance-mutation sites for genetic-programming (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants genetic-programming --source data/external-src/<checkout> \
#       --sites data/projects/genetic-programming/mutation_sites.yaml

package_root: com.lagodiuk.gp

sites:
  - {class: com.lagodiuk.gp.symbolic.TabulatedFunctionFitness, method: fitness, match: "(Expression expression, Context context)", note: "TabulatedFunctionFitness.fitness"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Functions, method: argumentsCount, match: "()", note: "Functions.argumentsCount"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Functions, method: coefficientsCount, match: "()", note: "Functions.coefficientsCount"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Functions, method: getCoefficients, match: "(Expression expression)", note: "Functions.getCoefficients"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Functions, method: setCoefficients, match: "(Expression expression, List<Double> coefficients, int startIndex)", note: "Functions.setCoefficients"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Functions, method: isVariable, match: "()", note: "Functions.isVariable"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Functions, method: isCommutative, match: "()", note: "Functions.isCommutative"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.SyntaxTreeUtils, method: createTree, match: "(int depth, Context context)", note: "SyntaxTreeUtils.createTree"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.SyntaxTreeUtils, method: simplifyTree, match: "(Expression tree, Context context)", note: "SyntaxTreeUtils.simplifyTree"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.SyntaxTreeUtils, method: cutTree, match: "(Expression tree, Context context, int depth)", note: "SyntaxTreeUtils.cutTree"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.SyntaxTreeUtils, method: hasVariableNode, match: "(Expression tree)", note: "SyntaxTreeUtils.hasVariableNode"}
  - {class: com.lagodiuk.gp.symbolic.GpChromosome, method: crossover, match: "(GpChromosome anotherChromosome)", note: "GpChromosome.crossover"}
  - {class: com.lagodiuk.gp.symbolic.GpChromosome, method: mutate, match: "()", note: "GpChromosome.mutate"}
  - {class: com.lagodiuk.gp.symbolic.GpChromosome, method: optimizeTree, match: "()", note: "GpChromosome.optimizeTree"}
  - {class: com.lagodiuk.gp.symbolic.GpChromosome, method: optimizeTree, match: "(int iterations)", note: "GpChromosome.optimizeTree"}
  - {class: com.lagodiuk.gp.symbolic.GpChromosome, method: getContext, match: "()", note: "GpChromosome.getContext"}
  - {class: com.lagodiuk.gp.symbolic.GpChromosome, method: setContext, match: "(Context context)", note: "GpChromosome.setContext"}
  - {class: com.lagodiuk.gp.symbolic.SymbolicRegressionEngine, method: addIterationListener, match: "(final SymbolicRegressionIterationListener listener)", note: "SymbolicRegressionEngine.addIterationListener"}
  - {class: com.lagodiuk.gp.symbolic.SymbolicRegressionEngine, method: evolve, match: "(int itrationsCount)", note: "SymbolicRegressionEngine.evolve"}
  - {class: com.lagodiuk.gp.symbolic.SymbolicRegressionEngine, method: getContext, match: "()", note: "SymbolicRegressionEngine.getContext"}
  - {class: com.lagodiuk.gp.symbolic.SymbolicRegressionEngine, method: getBestSyntaxTree, match: "()", note: "SymbolicRegressionEngine.getBestSyntaxTree"}
  - {class: com.lagodiuk.gp.symbolic.SymbolicRegressionEngine, method: fitness, match: "(Expression expression)", note: "SymbolicRegressionEngine.fitness"}
  - {class: com.lagodiuk.gp.symbolic.SymbolicRegressionEngine, method: terminate, match: "()", note: "SymbolicRegressionEngine.terminate"}
  - {class: com.lagodiuk.gp.symbolic.SymbolicRegressionFitness, method: calculate, match: "(GpChromosome chromosome)", note: "SymbolicRegressionFitness.calculate"}
  - {class: com.lagodiuk.gp.symbolic.Target, method: when, match: "(String variableName, double variableValue)", note: "Target.when"}
  - {class: com.lagodiuk.gp.symbolic.Target, method: targetIs, match: "(double targetValue)", note: "Target.targetIs"}
  - {class: com.lagodiuk.gp.symbolic.Target, method: getTargetValue, match: "()", note: "Target.getTargetValue"}
  - {class: com.lagodiuk.gp.symbolic.Target, method: getContextState, match: "()", note: "Target.getContextState"}
  - {class: com.lagodiuk.gp.symbolic.example.Antiderivative, method: fitness, match: "(Expression expression, Context context)", note: "Antiderivative.fitness"}
  - {class: com.lagodiuk.gp.symbolic.example.Derivative, method: fitness, match: "(Expression expression, Context context)", note: "Derivative.fitness"}
  - {class: com.lagodiuk.gp.symbolic.example.Launcher, method: main, match: "(String[] args)", note: "Launcher.main"}
  - {class: com.lagodiuk.gp.symbolic.example.Launcher2, method: main, match: "(String[] args)", note: "Launcher2.main"}
  - {class: com.lagodiuk.gp.symbolic.example.LauncherDerivative, method: main, match: "(String[] args)", note: "LauncherDerivative.main"}
  - {class: com.lagodiuk.gp.symbolic.example.LauncherDerivative, method: f, match: "(double x)", note: "LauncherDerivative.f"}
  - {class: com.lagodiuk.gp.symbolic.example.LauncherXYZ, method: main, match: "(String[] args)", note: "LauncherXYZ.main"}
  - {class: com.lagodiuk.gp.symbolic.example.Main, method: main, match: "(String[] args) throws Exception", note: "Main.main"}
  - {class: com.lagodiuk.gp.symbolic.example.TestExpressionFitness, method: fitness, match: "(Expression expression, Context context)", note: "TestExpressionFitness.fitness"}
  - {class: com.lagodiuk.gp.symbolic.example.TestExpressionFitness2, method: fitness, match: "(Expression expression, Context context)", note: "TestExpressionFitness2.fitness"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Context, method: lookupVariable, match: "(String variable)", note: "Context.lookupVariable"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Context, method: setVariable, match: "(String variable, double value)", note: "Context.setVariable"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Context, method: getRandomNonTerminalFunction, match: "()", note: "Context.getRandomNonTerminalFunction"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Context, method: getRandomTerminalFunction, match: "()", note: "Context.getRandomTerminalFunction"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Context, method: getTerminalFunctions, match: "()", note: "Context.getTerminalFunctions"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Context, method: getRandomVariableName, match: "()", note: "Context.getRandomVariableName"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Expression, method: eval, match: "(Context context)", note: "Expression.eval"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Expression, method: print, match: "()", note: "Expression.print"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Expression, method: getChilds, match: "()", note: "Expression.getChilds"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Expression, method: setChilds, match: "(List<Expression> childs)", note: "Expression.setChilds"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Expression, method: addChild, match: "(Expression child)", note: "Expression.addChild"}
  - {class: com.lagodiuk.gp.symbolic.interpreter.Expression, method: removeChilds, match: "()", note: "Expression.removeChilds"}
