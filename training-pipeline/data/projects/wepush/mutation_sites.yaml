# Curated performance-mutation sites for wepush (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants wepush --source data/external-src/<checkout> \
#       --sites data/projects/wepush/mutation_sites.yaml

package_root: com.fangxuele.tool

sites:
  - {class: com.fangxuele.tool.push.logic.PushResultUtil, method: computeUnsent, match: "(List<String[]> toSendList,", note: "PushResultUtil.computeUnsent"}
  - {class: com.fangxuele.tool.push.ui.dialog.SettingDialog, method: windowClosing, match: "(WindowEvent e)", note: "SettingDialog.windowClosing"}
  - {class: com.fangxuele.tool.push.ui.dialog.SettingDialog, method: $$$getRootComponent$$$, match: "()", note: "SettingDialog.$$$getRootComponent$$$"}
  - {class: com.fangxuele.tool.push.ui.listener.AboutListener, method: addListeners, match: "()", note: "AboutListener.addListeners"}
  - {class: com.fangxuele.tool.push.ui.listener.AboutListener, method: mousePressed, match: "(MouseEvent e)", note: "AboutListener.mousePressed"}
