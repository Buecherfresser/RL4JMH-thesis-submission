  - {class: com.github.luben.zstd.ZstdBufferDecompressingStream, method: refill, match: "(ByteBuffer toRefill)", note: "ZstdBufferDecompressingStream.refill"}
  - {class: com.github.luben.zstd.util.Native, method: run, match: "()", note: "Native.run"}
  - {class: com.github.luben.zstd.ZstdBufferDecompressingStream, method: setFinalize, match: "(boolean finalize)", note: "ZstdBufferDecompressingStream.setFinalize"}
  - {class: com.github.luben.zstd.ZstdBufferDecompressingStreamNoFinalizer, method: recommendedTargetBufferSize, match: "()", note: "ZstdBufferDecompressingStreamNoFinalizer.recommendedTargetBufferSize"}
  - {class: com.github.luben.zstd.ZstdDirectBufferCompressingStream, method: flushBuffer, match: "(ByteBuffer toFlush) throws IOException", note: "ZstdDirectBufferCompressingStream.flushBuffer"}
  - {class: com.github.luben.zstd.ZstdDirectBufferCompressingStream, method: flushBuffer, match: "(ByteBuffer toFlush) throws IOException", note: "ZstdDirectBufferCompressingStream.flushBuffer"}
