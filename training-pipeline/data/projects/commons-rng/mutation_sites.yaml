# Curated performance-mutation sites for commons-rng (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants commons-rng --source data/external-src/<checkout> \
#       --sites data/projects/commons-rng/mutation_sites.yaml

package_root: org.apache.commons.rng

sites:
  - {class: org.apache.commons.rng.UniformRandomProviderSupport, method: estimateSize, match: "()", note: "UniformRandomProviderSupport.estimateSize"}
  - {class: org.apache.commons.rng.core.util.NumberFactory, method: makeBoolean, match: "(int v)", note: "NumberFactory.makeBoolean"}
  - {class: org.apache.commons.rng.sampling.ArraySampler, method: shuffle, match: "(UniformRandomProvider rng, boolean[] array)", note: "ArraySampler.shuffle"}
  - {class: org.apache.commons.rng.simple.internal.ByteArray2IntArray, method: convert, match: "(byte[] seed)", note: "ByteArray2IntArray.convert"}
  - {class: org.apache.commons.rng.UniformRandomProviderSupport, method: characteristics, match: "()", note: "UniformRandomProviderSupport.characteristics"}
  - {class: org.apache.commons.rng.core.util.NumberFactory, method: makeBoolean, match: "(long v)", note: "NumberFactory.makeBoolean"}
  - {class: org.apache.commons.rng.sampling.ArraySampler, method: shuffle, match: "(UniformRandomProvider rng, byte[] array)", note: "ArraySampler.shuffle"}
  - {class: org.apache.commons.rng.simple.internal.ByteArray2LongArray, method: convert, match: "(byte[] seed)", note: "ByteArray2LongArray.convert"}
  - {class: org.apache.commons.rng.core.util.RandomStreams, method: estimateSize, match: "()", note: "RandomStreams.estimateSize"}
  - {class: org.apache.commons.rng.sampling.distribution.InternalUtils, method: create, match: "()", note: "InternalUtils.create"}
