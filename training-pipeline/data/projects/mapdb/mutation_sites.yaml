# Curated performance-mutation sites for mapdb (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants mapdb --source data/external-src/<checkout> \
#       --sites data/projects/mapdb/mutation_sites.yaml

package_root: org.mapdb

sites:
  - {class: org.mapdb.db.DB, method: getStore, match: "()", note: "DB.getStore"}
  - {class: org.mapdb.flat.LongBufStack, method: pop, match: "()", note: "LongBufStack.pop"}
  - {class: org.mapdb.io.DataInput2ByteArray, method: getPos, match: "()", note: "DataInput2ByteArray.getPos"}
  - {class: org.mapdb.list.KernelList, method: newList, match: "(Store store, Serializer<E> ser)", note: "KernelList.newList"}
  - {class: org.mapdb.record.Atomic, method: getRecid, match: "()", note: "Atomic.getRecid"}
  - {class: org.mapdb.ser.ArrayDeltaSerializer, method: valueArraySerialize, match: "(DataOutput2 out, Object[] vals2)", note: "ArrayDeltaSerializer.valueArraySerialize"}
  - {class: org.mapdb.store.ConcMapStore, method: preallocate, match: "()", note: "ConcMapStore.preallocate"}
  - {class: org.mapdb.util.IO, method: readLong, match: "(DataInputStream in) throws IOException", note: "IO.readLong"}
  - {class: org.mapdb.db.DB, method: close, match: "()", note: "DB.close"}
  - {class: org.mapdb.flat.LongBufStack, method: push, match: "(long value)", note: "LongBufStack.push"}
  - {class: org.mapdb.io.DataInput2ByteArray, method: readFully, match: "(byte[] b, int off, int len)", note: "DataInput2ByteArray.readFully"}
  - {class: org.mapdb.list.KernelList, method: entryStore, match: "(Store store)", note: "KernelList.entryStore"}
  - {class: org.mapdb.record.Atomic, method: getAndSet, match: "(int newValue)", note: "Atomic.getAndSet"}
  - {class: org.mapdb.ser.ArrayDeltaSerializer, method: valueArrayDeserialize, match: "(DataInput2 in, final int size)", note: "ArrayDeltaSerializer.valueArrayDeserialize"}
  - {class: org.mapdb.store.ConcMapStore, method: verify, match: "()", note: "ConcMapStore.verify"}
  - {class: org.mapdb.util.IO, method: readInt, match: "(DataInputStream in) throws IOException", note: "IO.readInt"}
  - {class: org.mapdb.io.DataInput2ByteBuffer, method: readFully, match: "(byte[] b, int off, int len)", note: "DataInput2ByteBuffer.readFully"}
  - {class: org.mapdb.list.MonolithList, method: newList, match: "(Store store, Serializer<E> ser)", note: "MonolithList.newList"}
  - {class: org.mapdb.ser.ArraySerializer, method: serialize, match: "(DataOutput2 out, T[] value)", note: "ArraySerializer.serialize"}
  - {class: org.mapdb.store.legacy.LongConcurrentHashMap, method: isEmpty, match: "()", note: "LongConcurrentHashMap.isEmpty"}
  - {class: org.mapdb.io.DataInput2ByteBuffer, method: skipBytes, match: "(final int n)", note: "DataInput2ByteBuffer.skipBytes"}
  - {class: org.mapdb.list.MonolithList, method: make, match: "()", note: "MonolithList.make"}
  - {class: org.mapdb.ser.ArraySerializer, method: deserialize, match: "(DataInput2 in)", note: "ArraySerializer.deserialize"}
  - {class: org.mapdb.store.legacy.LongConcurrentHashMap, method: size, match: "()", note: "LongConcurrentHashMap.size"}
  - {class: org.mapdb.io.DataInputToStream, method: close, match: "() throws IOException", note: "DataInputToStream.close"}
  - {class: org.mapdb.ser.ArrayTupleSerializer, method: cast, match: "(Object o)", note: "ArrayTupleSerializer.cast"}
  - {class: org.mapdb.store.legacy.LongHashMap, method: hashSaltValue, match: "()", note: "LongHashMap.hashSaltValue"}
  - {class: org.mapdb.io.DataOutput2ByteArray, method: ensureAvail, match: "(int n)", note: "DataOutput2ByteArray.ensureAvail"}
  - {class: org.mapdb.ser.ArrayTupleSerializer, method: serializedType, match: "()", note: "ArrayTupleSerializer.serializedType"}
  - {class: org.mapdb.store.legacy.LongHashMap, method: moveToNext, match: "()", note: "LongHashMap.moveToNext"}
  - {class: org.mapdb.io.DataOutput2ByteArray, method: writeBoolean, match: "(final boolean v)", note: "DataOutput2ByteArray.writeBoolean"}
  - {class: org.mapdb.ser.ByteArrayDelta2Serializer, method: valueArraySearch, match: "(ByteArrayKeys keys, byte[] key)", note: "ByteArrayDelta2Serializer.valueArraySearch"}
  - {class: org.mapdb.store.li.LiUtil, method: zeroOut, match: "(ByteBuffer data, long offset, int size)", note: "LiUtil.zeroOut"}
  - {class: org.mapdb.io.DataIO, method: packLongSize, match: "(long value)", note: "DataIO.packLongSize"}
  - {class: org.mapdb.ser.ByteArrayDelta2Serializer, method: valueArraySearch, match: "(ByteArrayKeys keys, byte[] key, Comparator comparator)", note: "ByteArrayDelta2Serializer.valueArraySearch"}
  - {class: org.mapdb.store.li.LiUtil, method: decompIndexValPage, match: "(long indexVal)", note: "LiUtil.decompIndexValPage"}
  - {class: org.mapdb.io.DataIO, method: longHash, match: "(long h)", note: "DataIO.longHash"}
