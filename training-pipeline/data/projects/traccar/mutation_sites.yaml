# Curated performance-mutation sites for traccar (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants traccar --source data/external-src/<checkout> \
#       --sites data/projects/traccar/mutation_sites.yaml

package_root: org.traccar.protocol

