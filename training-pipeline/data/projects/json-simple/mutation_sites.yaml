# Curated performance-mutation sites for json-simple (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants json-simple --source data/external-src/<checkout> \
#       --sites data/projects/json-simple/mutation_sites.yaml

package_root: org.json.simple

sites:
  - {class: org.json.simple.ItemList, method: getItems, match: "()", note: "ItemList.getItems"}
  - {class: org.json.simple.parser.JSONParser, method: reset, match: "()", note: "JSONParser.reset"}
  - {class: org.json.simple.ItemList, method: getArray, match: "()", note: "ItemList.getArray"}
  - {class: org.json.simple.parser.JSONParser, method: reset, match: "(Reader in)", note: "JSONParser.reset"}
  - {class: org.json.simple.ItemList, method: split, match: "(String s,String sp,List append,boolean isMultiToken)", note: "ItemList.split"}
  - {class: org.json.simple.parser.JSONParser, method: getPosition, match: "()", note: "JSONParser.getPosition"}
  - {class: org.json.simple.ItemList, method: split, match: "(String s,String sp,List append)", note: "ItemList.split"}
  - {class: org.json.simple.parser.JSONParser, method: parse, match: "(String s) throws ParseException", note: "JSONParser.parse"}
  - {class: org.json.simple.ItemList, method: setSP, match: "(String sp)", note: "ItemList.setSP"}
  - {class: org.json.simple.parser.JSONParser, method: parse, match: "(String s, ContainerFactory containerFactory) throws ParseException", note: "JSONParser.parse"}
  - {class: org.json.simple.ItemList, method: addAll, match: "(ItemList list)", note: "ItemList.addAll"}
  - {class: org.json.simple.parser.JSONParser, method: parse, match: "(Reader in) throws IOException, ParseException", note: "JSONParser.parse"}
  - {class: org.json.simple.ItemList, method: addAll, match: "(String s)", note: "ItemList.addAll"}
  - {class: org.json.simple.parser.JSONParser, method: parse, match: "(Reader in, ContainerFactory containerFactory) throws IOException, ParseException", note: "JSONParser.parse"}
  - {class: org.json.simple.ItemList, method: addAll, match: "(String s,String sp)", note: "ItemList.addAll"}
  - {class: org.json.simple.parser.JSONParser, method: parse, match: "(String s, ContentHandler contentHandler) throws ParseException", note: "JSONParser.parse"}
  - {class: org.json.simple.ItemList, method: addAll, match: "(String s,String sp,boolean isMultiToken)", note: "ItemList.addAll"}
  - {class: org.json.simple.parser.JSONParser, method: parse, match: "(String s, ContentHandler contentHandler, boolean isResume) throws ParseException", note: "JSONParser.parse"}
  - {class: org.json.simple.ItemList, method: size, match: "()", note: "ItemList.size"}
  - {class: org.json.simple.parser.JSONParser, method: parse, match: "(Reader in, ContentHandler contentHandler) throws IOException, ParseException", note: "JSONParser.parse"}
  - {class: org.json.simple.ItemList, method: clear, match: "()", note: "ItemList.clear"}
  - {class: org.json.simple.parser.JSONParser, method: parse, match: "(Reader in, ContentHandler contentHandler, boolean isResume) throws IOException, ParseException", note: "JSONParser.parse"}
  - {class: org.json.simple.ItemList, method: reset, match: "()", note: "ItemList.reset"}
  - {class: org.json.simple.parser.ParseException, method: getErrorType, match: "()", note: "ParseException.getErrorType"}
  - {class: org.json.simple.JSONArray, method: writeJSONString, match: "(Collection collection, Writer out) throws IOException", note: "JSONArray.writeJSONString"}
  - {class: org.json.simple.parser.ParseException, method: setErrorType, match: "(int errorType)", note: "ParseException.setErrorType"}
  - {class: org.json.simple.JSONArray, method: writeJSONString, match: "(Writer out) throws IOException", note: "JSONArray.writeJSONString"}
  - {class: org.json.simple.parser.ParseException, method: getPosition, match: "()", note: "ParseException.getPosition"}
  - {class: org.json.simple.JSONArray, method: toJSONString, match: "(Collection collection)", note: "JSONArray.toJSONString"}
  - {class: org.json.simple.parser.ParseException, method: setPosition, match: "(int position)", note: "ParseException.setPosition"}
  - {class: org.json.simple.JSONArray, method: writeJSONString, match: "(byte[] array, Writer out) throws IOException", note: "JSONArray.writeJSONString"}
  - {class: org.json.simple.parser.ParseException, method: getUnexpectedObject, match: "()", note: "ParseException.getUnexpectedObject"}
  - {class: org.json.simple.JSONArray, method: toJSONString, match: "(byte[] array)", note: "JSONArray.toJSONString"}
  - {class: org.json.simple.parser.ParseException, method: setUnexpectedObject, match: "(Object unexpectedObject)", note: "ParseException.setUnexpectedObject"}
  - {class: org.json.simple.JSONArray, method: writeJSONString, match: "(short[] array, Writer out) throws IOException", note: "JSONArray.writeJSONString"}
  - {class: org.json.simple.parser.ParseException, method: getMessage, match: "()", note: "ParseException.getMessage"}
  - {class: org.json.simple.JSONArray, method: toJSONString, match: "(short[] array)", note: "JSONArray.toJSONString"}
  - {class: org.json.simple.parser.Yylex, method: yyclose, match: "() throws java.io.IOException", note: "Yylex.yyclose"}
  - {class: org.json.simple.JSONArray, method: writeJSONString, match: "(int[] array, Writer out) throws IOException", note: "JSONArray.writeJSONString"}
  - {class: org.json.simple.parser.Yylex, method: yyreset, match: "(java.io.Reader reader)", note: "Yylex.yyreset"}
  - {class: org.json.simple.JSONArray, method: toJSONString, match: "(int[] array)", note: "JSONArray.toJSONString"}
  - {class: org.json.simple.parser.Yylex, method: yystate, match: "()", note: "Yylex.yystate"}
  - {class: org.json.simple.JSONArray, method: writeJSONString, match: "(long[] array, Writer out) throws IOException", note: "JSONArray.writeJSONString"}
  - {class: org.json.simple.parser.Yylex, method: yybegin, match: "(int newState)", note: "Yylex.yybegin"}
  - {class: org.json.simple.JSONArray, method: toJSONString, match: "(long[] array)", note: "JSONArray.toJSONString"}
  - {class: org.json.simple.parser.Yylex, method: yytext, match: "()", note: "Yylex.yytext"}
  - {class: org.json.simple.JSONArray, method: writeJSONString, match: "(float[] array, Writer out) throws IOException", note: "JSONArray.writeJSONString"}
  - {class: org.json.simple.parser.Yylex, method: yycharat, match: "(int pos)", note: "Yylex.yycharat"}
  - {class: org.json.simple.JSONArray, method: toJSONString, match: "(float[] array)", note: "JSONArray.toJSONString"}
  - {class: org.json.simple.parser.Yylex, method: yylength, match: "()", note: "Yylex.yylength"}
