# Curated performance-mutation sites for zjsonpatch (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants zjsonpatch --source data/external-src/<checkout> \
#       --sites data/projects/zjsonpatch/mutation_sites.yaml

package_root: com.flipkart.zjsonpatch

sites:
  - {class: com.flipkart.zjsonpatch.CompatibilityFlags, method: defaults, match: "()", note: "CompatibilityFlags.defaults"}
  - {class: com.flipkart.zjsonpatch.mapping.ListIteratorDecorator, method: nextIndex, match: "()", note: "ListIteratorDecorator.nextIndex"}
