# Curated performance-mutation sites for commons-imaging (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants commons-imaging --source data/external-src/<checkout> \
#       --sites data/projects/commons-imaging/mutation_sites.yaml

package_root: org.apache.commons.imaging

sites:
  - {class: org.apache.commons.imaging.ColorTools, method: convertBetweenColorSpaces, match: "(BufferedImage bi, final ColorSpace from, final ColorSpace to)", note: "ColorTools.convertBetweenColorSpaces"}
  - {class: org.apache.commons.imaging.bytesource.InputStreamByteSource, method: getByteArray, match: "(final long position, final int length) throws IOException", note: "InputStreamByteSource.getByteArray"}
  - {class: org.apache.commons.imaging.color.ColorConversions, method: convertCieLabToArgbTest, match: "(final int cieL, final int cieA, final int cieB)", note: "ColorConversions.convertCieLabToArgbTest"}
  - {class: org.apache.commons.imaging.common.BasicCParser, method: tokenizeRow, match: "(final String row)", note: "BasicCParser.tokenizeRow"}
  - {class: org.apache.commons.imaging.formats.bmp.BmpImageParser, method: dumpImageFile, match: "(final PrintWriter pw, final ByteSource byteSource) throws ImagingException, IOException", note: "BmpImageParser.dumpImageFile"}
  - {class: org.apache.commons.imaging.icc.CachingInputStream, method: close, match: "() throws IOException", note: "CachingInputStream.close"}
  - {class: org.apache.commons.imaging.internal.ImageParserFactory, method: getImageParser, match: "(final ByteSource byteSource) throws IOException", note: "ImageParserFactory.getImageParser"}
  - {class: org.apache.commons.imaging.mylzw.BitsToByteInputStream, method: readBitsArray, match: "(final int sampleBits, final int length) throws IOException", note: "BitsToByteInputStream.readBitsArray"}
  - {class: org.apache.commons.imaging.palette.ColorComponent, method: argbComponent, match: "(final int argb)", note: "ColorComponent.argbComponent"}
  - {class: org.apache.commons.imaging.ColorTools, method: convertBetweenColorSpacesX2, match: "(BufferedImage bi, final ColorSpace from, final ColorSpace to)", note: "ColorTools.convertBetweenColorSpacesX2"}
  - {class: org.apache.commons.imaging.bytesource.InputStreamByteSource, method: getInputStream, match: "() throws IOException", note: "InputStreamByteSource.getInputStream"}
  - {class: org.apache.commons.imaging.color.ColorConversions, method: convertCieLabToCieLch, match: "(final ColorCieLab cielab)", note: "ColorConversions.convertCieLabToCieLch"}
  - {class: org.apache.commons.imaging.common.BasicCParser, method: unescapeString, match: "(final StringBuilder stringBuilder, final String string) throws ImagingException", note: "BasicCParser.unescapeString"}
  - {class: org.apache.commons.imaging.formats.bmp.BmpImageParser, method: getAcceptedExtensions, match: "()", note: "BmpImageParser.getAcceptedExtensions"}
  - {class: org.apache.commons.imaging.icc.CachingInputStream, method: getCache, match: "()", note: "CachingInputStream.getCache"}
