# Curated performance-mutation sites for uuid-creator (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants uuid-creator --source data/external-src/<checkout> \
#       --sites data/projects/uuid-creator/mutation_sites.yaml

package_root: com.github.f4b6a3

