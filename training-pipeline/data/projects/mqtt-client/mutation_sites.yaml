  - {class: org.fusesource.mqtt.client.Message, method: getPayloadBuffer, match: "()", note: "Message.getPayloadBuffer"}
  - {class: org.fusesource.mqtt.codec.MessageSupport, method: messageId, match: "()", note: "MessageSupport.messageId"}
  - {class: org.fusesource.mqtt.client.NoopCallback, method: onSuccess, match: "(T value)", note: "NoopCallback.onSuccess"}
  - {class: org.fusesource.mqtt.codec.MessageSupport, method: messageId, match: "(short messageId)", note: "MessageSupport.messageId"}
  - {class: org.fusesource.mqtt.client.NoopCallback, method: onFailure, match: "(Throwable value)", note: "NoopCallback.onFailure"}
  - {class: org.fusesource.mqtt.codec.PINGREQ, method: messageType, match: "()", note: "PINGREQ.messageType"}
  - {class: org.fusesource.mqtt.client.Promise, method: onFailure, match: "(Throwable value)", note: "Promise.onFailure"}
