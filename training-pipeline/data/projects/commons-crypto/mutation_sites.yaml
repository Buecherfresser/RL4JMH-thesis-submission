  - {class: org.apache.commons.crypto.utils.AES, method: newSecretKeySpec, match: "(final byte[] key)", note: "AES.newSecretKeySpec"}
  - {class: org.apache.commons.crypto.cipher.OpenSslCipher, method: getAlgorithm, match: "()", note: "OpenSslCipher.getAlgorithm"}
  - {class: org.apache.commons.crypto.jna.OpenSslJna, method: getRandomClass, match: "()", note: "OpenSslJna.getRandomClass"}
  - {class: org.apache.commons.crypto.random.OsCryptoRandom, method: nextBytes, match: "(final byte[] bytes)", note: "OsCryptoRandom.nextBytes"}
  - {class: org.apache.commons.crypto.stream.CtrCryptoOutputStream, method: encryptFinal, match: "() throws IOException", note: "CtrCryptoOutputStream.encryptFinal"}
  - {class: org.apache.commons.crypto.utils.Transformation, method: parse, match: "(final String transformation) throws NoSuchAlgorithmException, NoSuchPaddingException", note: "Transformation.parse"}
  - {class: org.apache.commons.crypto.cipher.OpenSslCommonMode, method: doFinal, match: "(final ByteBuffer input, final ByteBuffer output) throws ShortBufferException, IllegalBlockSizeException, BadPaddingException", note: "OpenSslCommonMode.doFinal"}
  - {class: org.apache.commons.crypto.jna.OpenSslJnaCipher, method: close, match: "()", note: "OpenSslJnaCipher.close"}
  - {class: org.apache.commons.crypto.stream.PositionedCryptoInputStream, method: getCryptoCipher, match: "()", note: "PositionedCryptoInputStream.getCryptoCipher"}
  - {class: org.apache.commons.crypto.utils.Transformation, method: getAlgorithm, match: "()", note: "Transformation.getAlgorithm"}
  - {class: org.apache.commons.crypto.cipher.OpenSslCommonMode, method: init, match: "(final int mode, final byte[] key, final AlgorithmParameterSpec params) throws InvalidAlgorithmParameterException", note: "OpenSslCommonMode.init"}
  - {class: org.apache.commons.crypto.jna.OpenSslJnaCipher, method: getAlgorithm, match: "()", note: "OpenSslJnaCipher.getAlgorithm"}
