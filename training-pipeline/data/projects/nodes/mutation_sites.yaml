  - {class: com.twitter.nodes.utils.DebugManager, method: getDebugMessageBuilder, match: "()", note: "DebugManager.getDebugMessageBuilder"}
  - {class: com.twitter.nodes.NodeDotGraphGenerator, method: getRenderingStyle, match: "()", note: "NodeDotGraphGenerator.getRenderingStyle"}
  - {class: com.twitter.nodes.utils.DebugManager, method: basic, match: "(final String message, Object... args)", note: "DebugManager.basic"}
  - {class: com.twitter.nodes.NodeDotGraphGenerator, method: getDOTString, match: "()", note: "NodeDotGraphGenerator.getDOTString"}
