# Curated performance-mutation sites for jboss-modules (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jboss-modules --source data/external-src/<checkout> \
#       --sites data/projects/jboss-modules/mutation_sites.yaml

package_root: org.jboss.modules

sites:
  - {class: org.jboss.modules.DataURLStreamHandler, method: openConnection, match: "(final URL url) throws IOException", note: "DataURLStreamHandler.openConnection"}
  - {class: org.jboss.modules.filter.MultiplePathFilterBuilder, method: addFilter, match: "(final PathFilter filter, final boolean include)", note: "MultiplePathFilterBuilder.addFilter"}
  - {class: org.jboss.modules.log.StreamModuleLogger, method: trace, match: "(final String message)", note: "StreamModuleLogger.trace"}
  - {class: org.jboss.modules.management.DependencyInfo, method: getDependencyType, match: "()", note: "DependencyInfo.getDependencyType"}
  - {class: org.jboss.modules.maven.MavenArtifactUtil, method: resolveJarArtifact, match: "(final ArtifactCoordinates coordinates) throws IOException", note: "MavenArtifactUtil.resolveJarArtifact"}
  - {class: org.jboss.modules.ref.PhantomReference, method: getAttachment, match: "()", note: "PhantomReference.getAttachment"}
  - {class: org.jboss.modules.security.FactoryPermissionCollection, method: implies, match: "(final Permission permission)", note: "FactoryPermissionCollection.implies"}
  - {class: org.jboss.modules.xml.MXParser, method: resetStringCache, match: "()", note: "MXParser.resetStringCache"}
  - {class: org.jboss.modules.DataURLStreamHandler, method: connect, match: "()", note: "DataURLStreamHandler.connect"}
  - {class: org.jboss.modules.filter.MultiplePathFilterBuilder, method: create, match: "()", note: "MultiplePathFilterBuilder.create"}
  - {class: org.jboss.modules.log.StreamModuleLogger, method: trace, match: "(final String format, final Object arg1)", note: "StreamModuleLogger.trace"}
  - {class: org.jboss.modules.management.DependencyInfo, method: getExportFilter, match: "()", note: "DependencyInfo.getExportFilter"}
  - {class: org.jboss.modules.maven.MavenArtifactUtil, method: resolveArtifact, match: "(final ArtifactCoordinates coordinates, final String packaging) throws IOException", note: "MavenArtifactUtil.resolveArtifact"}
  - {class: org.jboss.modules.ref.PhantomReference, method: getReaper, match: "()", note: "PhantomReference.getReaper"}
  - {class: org.jboss.modules.security.FactoryPermissionCollection, method: elements, match: "()", note: "FactoryPermissionCollection.elements"}
  - {class: org.jboss.modules.xml.MXParser, method: newString, match: "(char[] cbuf, int off, int len)", note: "MXParser.newString"}
  - {class: org.jboss.modules.FastCopyHashSet, method: size, match: "()", note: "FastCopyHashSet.size"}
  - {class: org.jboss.modules.filter.SetPathFilter, method: accept, match: "(final String path)", note: "SetPathFilter.accept"}
  - {class: org.jboss.modules.log.JDKModuleLogger, method: trace, match: "(final String message)", note: "JDKModuleLogger.trace"}
  - {class: org.jboss.modules.management.ModuleInfo, method: getName, match: "()", note: "ModuleInfo.getName"}
  - {class: org.jboss.modules.maven.MavenSettings, method: setLocalRepository, match: "(Path localRepository)", note: "MavenSettings.setLocalRepository"}
  - {class: org.jboss.modules.ref.References, method: getAttachment, match: "()", note: "References.getAttachment"}
  - {class: org.jboss.modules.security.ImmediatePermissionFactory, method: construct, match: "()", note: "ImmediatePermissionFactory.construct"}
  - {class: org.jboss.modules.xml.ModuleXmlParser, method: parsedProperty, match: "(String name, String value)", note: "ModuleXmlParser.parsedProperty"}
  - {class: org.jboss.modules.FastCopyHashSet, method: isEmpty, match: "()", note: "FastCopyHashSet.isEmpty"}
  - {class: org.jboss.modules.filter.AggregatePathFilter, method: accept, match: "(String path)", note: "AggregatePathFilter.accept"}
  - {class: org.jboss.modules.log.JDKModuleLogger, method: trace, match: "(final String format, final Object arg1)", note: "JDKModuleLogger.trace"}
  - {class: org.jboss.modules.management.ModuleInfo, method: getModuleLoader, match: "()", note: "ModuleInfo.getModuleLoader"}
  - {class: org.jboss.modules.maven.MavenSettings, method: getLocalRepository, match: "()", note: "MavenSettings.getLocalRepository"}
  - {class: org.jboss.modules.ref.References, method: clear, match: "()", note: "References.clear"}
  - {class: org.jboss.modules.security.LoadedPermissionFactory, method: construct, match: "()", note: "LoadedPermissionFactory.construct"}
  - {class: org.jboss.modules.xml.ModuleXmlParser, method: parseModuleXml, match: "(final ModuleLoader moduleLoader, final String moduleName, final File root, final File moduleInfoFile) throws ModuleLoadException, IOException", note: "ModuleXmlParser.parseModuleXml"}
  - {class: org.jboss.modules.IteratorUtils, method: transformingIterator, match: "(Iterator<T> original, Function<T, U> translator)", note: "IteratorUtils.transformingIterator"}
  - {class: org.jboss.modules.filter.BooleanClassFilter, method: accept, match: "(final String path)", note: "BooleanClassFilter.accept"}
  - {class: org.jboss.modules.log.ModuleLogRecord, method: getSourceClassName, match: "()", note: "ModuleLogRecord.getSourceClassName"}
  - {class: org.jboss.modules.management.ObjectProperties, method: property, match: "(String key, String value)", note: "ObjectProperties.property"}
  - {class: org.jboss.modules.maven.ArtifactCoordinates, method: fromString, match: "(String string)", note: "ArtifactCoordinates.fromString"}
  - {class: org.jboss.modules.ref.SoftReference, method: getReaper, match: "()", note: "SoftReference.getReaper"}
  - {class: org.jboss.modules.security.ModularPermissionFactory, method: construct, match: "()", note: "ModularPermissionFactory.construct"}
  - {class: org.jboss.modules.xml.PermissionsXmlParser, method: parsePermissionsXml, match: "(final InputStream inputStream, ModuleLoader moduleLoader, final String moduleName) throws XmlPullParserException, IOException", note: "PermissionsXmlParser.parsePermissionsXml"}
  - {class: org.jboss.modules.LocalDependencySpecBuilder, method: getImportFilter, match: "()", note: "LocalDependencySpecBuilder.getImportFilter"}
  - {class: org.jboss.modules.filter.BooleanPathFilter, method: accept, match: "(final String path)", note: "BooleanPathFilter.accept"}
  - {class: org.jboss.modules.log.ModuleLogRecord, method: setSourceClassName, match: "(final String sourceClassName)", note: "ModuleLogRecord.setSourceClassName"}
  - {class: org.jboss.modules.management.ObjectProperties, method: properties, match: "(Property... properties)", note: "ObjectProperties.properties"}
  - {class: org.jboss.modules.maven.ArtifactCoordinates, method: getGroupId, match: "()", note: "ArtifactCoordinates.getGroupId"}
  - {class: org.jboss.modules.ref.SoftReference, method: getAttachment, match: "()", note: "SoftReference.getAttachment"}
  - {class: org.jboss.modules.security.ModularProtectionDomain, method: implies, match: "(final Permission permission)", note: "ModularProtectionDomain.implies"}
  - {class: org.jboss.modules.xml.PermissionsXmlParser, method: parsePermissionsXml, match: "(final XmlPullParser reader, ModuleLoader moduleLoader, final String moduleName) throws IOException, XmlPullParserException", note: "PermissionsXmlParser.parsePermissionsXml"}
  - {class: org.jboss.modules.LocalDependencySpecBuilder, method: setImportFilter, match: "(final PathFilter importFilter)", note: "LocalDependencySpecBuilder.setImportFilter"}
  - {class: org.jboss.modules.filter.ChildPathFilter, method: accept, match: "(final String path)", note: "ChildPathFilter.accept"}
