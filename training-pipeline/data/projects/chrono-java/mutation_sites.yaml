  - {class: com.wanasit.chrono.Chrono, method: Parse, match: "(String text, Date refDate)", note: "Chrono.Parse"}
  - {class: com.wanasit.chrono.filter.PrefixCheckFilter, method: isValid, match: "(String text, ChronoOption options, ParsedResult result)", note: "PrefixCheckFilter.isValid"}
  - {class: com.wanasit.chrono.parser.en.ENCasualDateExpressionParser, method: extract, match: "(String text, Date refDate, Matcher matcher, ChronoOption option)", note: "ENCasualDateExpressionParser.extract"}
  - {class: com.wanasit.chrono.refiner.en.ENMergeDateRangeRefiner, method: mergeResult, match: "(String text, ParsedResult fromResult, ParsedResult toResult)", note: "ENMergeDateRangeRefiner.mergeResult"}
