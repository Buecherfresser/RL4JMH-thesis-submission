# Curated performance-mutation sites for fusionauth-jwt (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants fusionauth-jwt --source data/external-src/<checkout> \
#       --sites data/projects/fusionauth-jwt/mutation_sites.yaml

package_root: io.fusionauth.jwt

sites:
  - {class: io.fusionauth.jwt.HexUtils, method: fromBytes, match: "(byte[] bytes)", note: "HexUtils.fromBytes"}
  - {class: io.fusionauth.jwt.domain.Algorithm, method: fromName, match: "(String name)", note: "Algorithm.fromName"}
  - {class: io.fusionauth.jwt.ec.ECDSASignature, method: derDecode, match: "(Algorithm algorithm) throws IOException", note: "ECDSASignature.derDecode"}
  - {class: io.fusionauth.jwt.ed.EdDSASigner, method: newSigner, match: "(PrivateKey privateKey, String kid)", note: "EdDSASigner.newSigner"}
  - {class: io.fusionauth.jwt.hmac.HMACSigner, method: newSHA256Signer, match: "(byte[] secret)", note: "HMACSigner.newSHA256Signer"}
  - {class: io.fusionauth.jwt.json.Mapper, method: deserialize, match: "(byte[] bytes, Class<T> type) throws InvalidJWTException", note: "Mapper.deserialize"}
  - {class: io.fusionauth.jwt.rsa.RSAPSSSigner, method: newSHA256Signer, match: "(String privateKey)", note: "RSAPSSSigner.newSHA256Signer"}
  - {class: io.fusionauth.jwt.HexUtils, method: toBytes, match: "(String hexString)", note: "HexUtils.toBytes"}
  - {class: io.fusionauth.jwt.domain.Algorithm, method: getName, match: "()", note: "Algorithm.getName"}
  - {class: io.fusionauth.jwt.ec.ECDSASignature, method: derEncode, match: "() throws IOException", note: "ECDSASignature.derEncode"}
  - {class: io.fusionauth.jwt.ed.EdDSASigner, method: newSigner, match: "(PrivateKey privateKey)", note: "EdDSASigner.newSigner"}
