  - {class: java.net.jpountz.lz4.LZ4FrameOutputStream, method: valueOf, match: "(int indicator)", note: "LZ4FrameOutputStream.valueOf"}
  - {class: java.net.jpountz.lz4.LZ4FrameOutputStream, method: close, match: "() throws IOException", note: "LZ4FrameOutputStream.close"}
  - {class: java.net.jpountz.lz4.LZ4FrameOutputStream, method: fromByte, match: "(byte flg)", note: "LZ4FrameOutputStream.fromByte"}
