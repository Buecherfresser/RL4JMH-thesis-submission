  - {class: com.wanasit.chrono.parser.en.ENInternationalStandardParser, method: extract, match: "(String text, Date refDate, Matcher matcher, ChronoOption option)", note: "ENInternationalStandardParser.extract"}
  - {class: com.wanasit.chrono.refiner.en.ENMergeDateAndTimeRefiner, method: isTimeOnly, match: "(ParsedResult result)", note: "ENMergeDateAndTimeRefiner.isTimeOnly"}
