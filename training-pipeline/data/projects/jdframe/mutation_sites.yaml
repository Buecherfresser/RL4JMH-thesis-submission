# Curated performance-mutation sites for jdframe (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jdframe --source data/external-src/<checkout> \
#       --sites data/projects/jdframe/mutation_sites.yaml

package_root: io.github.burukeyou

sites:
  - {class: io.github.burukeyou.dataframe.iframe.support.DFList, method: first, match: "(int n)", note: "DFList.first"}
  - {class: io.github.burukeyou.dataframe.iframe.support.DFList, method: first, match: "()", note: "DFList.first"}
  - {class: io.github.burukeyou.dataframe.iframe.support.DFList, method: last, match: "(int n)", note: "DFList.last"}
  - {class: io.github.burukeyou.dataframe.iframe.window.SorterBuilder, method: sortAsc, match: "(Function<T,U> sortField)", note: "SorterBuilder.sortAsc"}
  - {class: io.github.burukeyou.dataframe.iframe.window.SorterBuilder, method: sortDesc, match: "(Function<T,U> sortField)", note: "SorterBuilder.sortDesc"}
  - {class: io.github.burukeyou.dataframe.iframe.window.SorterBuilder, method: sort, match: "(Comparator<T> comparator)", note: "SorterBuilder.sort"}
  - {class: io.github.burukeyou.dataframe.iframe.window.WindowBuilder, method: initDefault, match: "()", note: "WindowBuilder.initDefault"}
  - {class: io.github.burukeyou.dataframe.iframe.window.WindowBuilder, method: getComparator, match: "()", note: "WindowBuilder.getComparator"}
  - {class: io.github.burukeyou.dataframe.iframe.window.WindowBuilder, method: getStartRange, match: "()", note: "WindowBuilder.getStartRange"}
  - {class: io.github.burukeyou.dataframe.iframe.window.round.AfterRange, method: check, match: "()", note: "AfterRange.check"}
  - {class: io.github.burukeyou.dataframe.iframe.window.round.AfterRange, method: getStartIndex, match: "(Integer currentRowIndex, List<T> windowList)", note: "AfterRange.getStartIndex"}
  - {class: io.github.burukeyou.dataframe.iframe.window.round.AfterRange, method: getEndIndex, match: "(Integer currentRowIndex, List<T> windowList)", note: "AfterRange.getEndIndex"}
  - {class: io.github.burukeyou.dataframe.iframe.window.round.BeforeRange, method: check, match: "()", note: "BeforeRange.check"}
  - {class: io.github.burukeyou.dataframe.iframe.window.round.BeforeRange, method: getStartIndex, match: "(Integer currentRowIndex, List<T> windowList)", note: "BeforeRange.getStartIndex"}
  - {class: io.github.burukeyou.dataframe.iframe.window.round.BeforeRange, method: getEndIndex, match: "(Integer currentRowIndex, List<T> windowList)", note: "BeforeRange.getEndIndex"}
  - {class: io.github.burukeyou.dataframe.iframe.window.round.CurrentRowRange, method: getStartIndex, match: "(Integer currentRowIndex, List<T> windowList)", note: "CurrentRowRange.getStartIndex"}
  - {class: io.github.burukeyou.dataframe.iframe.window.round.CurrentRowRange, method: getEndIndex, match: "(Integer currentRowIndex, List<T> windowList)", note: "CurrentRowRange.getEndIndex"}
  - {class: io.github.burukeyou.dataframe.iframe.window.round.EndRowRange, method: isFixedEndIndex, match: "()", note: "EndRowRange.isFixedEndIndex"}
  - {class: io.github.burukeyou.dataframe.iframe.window.round.EndRowRange, method: getStartIndex, match: "(Integer currentRowIndex, List<T> windowList)", note: "EndRowRange.getStartIndex"}
  - {class: io.github.burukeyou.dataframe.iframe.window.round.EndRowRange, method: getEndIndex, match: "(Integer currentRowIndex, List<T> windowList)", note: "EndRowRange.getEndIndex"}
  - {class: io.github.burukeyou.dataframe.iframe.window.round.Range, method: BEFORE, match: "(int n)", note: "Range.BEFORE"}
  - {class: io.github.burukeyou.dataframe.iframe.window.round.Range, method: AFTER, match: "(int n)", note: "Range.AFTER"}
  - {class: io.github.burukeyou.dataframe.iframe.window.round.StartRowRange, method: isFixedStartIndex, match: "()", note: "StartRowRange.isFixedStartIndex"}
  - {class: io.github.burukeyou.dataframe.iframe.window.round.StartRowRange, method: getStartIndex, match: "(Integer currentRowIndex, List<T> windowList)", note: "StartRowRange.getStartIndex"}
  - {class: io.github.burukeyou.dataframe.iframe.window.round.StartRowRange, method: getEndIndex, match: "(Integer currentRowIndex, List<T> windowList)", note: "StartRowRange.getEndIndex"}
  - {class: io.github.burukeyou.dataframe.util.BeanCopyUtil, method: copyProperties, match: "(Object source,Class<T> targetClass)", note: "BeanCopyUtil.copyProperties"}
  - {class: io.github.burukeyou.dataframe.util.ClassUtil, method: findAllFiled, match: "(Class<?> clazz)", note: "ClassUtil.findAllFiled"}
  - {class: io.github.burukeyou.dataframe.util.CollectorsPlusUtil, method: accumulator, match: "()", note: "CollectorsPlusUtil.accumulator"}
  - {class: io.github.burukeyou.dataframe.util.CollectorsPlusUtil, method: supplier, match: "()", note: "CollectorsPlusUtil.supplier"}
