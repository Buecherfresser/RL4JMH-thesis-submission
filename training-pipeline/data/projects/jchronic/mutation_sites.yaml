  - {class: com.mdimension.jchronic.repeaters.RepeaterFortnight, method: _nextSpan, match: "(PointerType pointer)", note: "RepeaterFortnight._nextSpan"}
  - {class: com.mdimension.jchronic.tags.Scalar, method: scan, match: "(Token token, Token postToken, Options options)", note: "Scalar.scan"}
  - {class: com.mdimension.jchronic.utils.Time, method: construct, match: "(int year, int month, int day)", note: "Time.construct"}
  - {class: com.mdimension.jchronic.handlers.RdnRmnSdTTzSyHandler, method: handle, match: "(List<Token> tokens, Options options)", note: "RdnRmnSdTTzSyHandler.handle"}
  - {class: com.mdimension.jchronic.repeaters.RepeaterFortnight, method: _thisSpan, match: "(PointerType pointer)", note: "RepeaterFortnight._thisSpan"}
  - {class: com.mdimension.jchronic.tags.ScalarDay, method: scan, match: "(Token token, Token postToken, Options options)", note: "ScalarDay.scan"}
  - {class: com.mdimension.jchronic.utils.Token, method: getWord, match: "()", note: "Token.getWord"}
  - {class: com.mdimension.jchronic.handlers.RmnOdHandler, method: handle, match: "(List<Token> tokens, Options options)", note: "RmnOdHandler.handle"}
  - {class: com.mdimension.jchronic.repeaters.RepeaterHour, method: _nextSpan, match: "(PointerType pointer)", note: "RepeaterHour._nextSpan"}
  - {class: com.mdimension.jchronic.tags.ScalarMonth, method: scan, match: "(Token token, Token postToken, Options options)", note: "ScalarMonth.scan"}
  - {class: com.mdimension.jchronic.utils.Token, method: tag, match: "(Tag<?> newTag)", note: "Token.tag"}
