# GRPO RL subject-library corpus.
#
# Each entry is a GitHub repo used for prompt snippets + planted performance mutants.
# Existing six keep their pinned refs; new libraries resolve a shallow default-branch tip
# at bootstrap time (recorded into data/projects/<id>/project.yaml provenance.tag).
#
# Bootstrap / plant 50 sites:
#   uv run python scripts/bootstrap_rl_corpus.py
#   uv run python scripts/bootstrap_rl_corpus.py --only guava,gson
#
# Then provision classpaths + patched jars:
#   ./scripts/provision_rl_projects.sh
#   ./scripts/provision_rl_mutants.sh

mutants_per_project: 50

# Already in the GRPO corpus (hand-curated sites; skip re-bootstrap by default).
existing:
  - id: commons-numbers
    github: apache/commons-numbers
    ref: rel/commons-numbers-1.3
    package_root: org.apache.commons.numbers
    merge_modules: true
  - id: commons-statistics
    github: apache/commons-statistics
    ref: rel/commons-statistics-1.3
    package_root: org.apache.commons.statistics
    merge_modules: true
  - id: commons-codec
    github: apache/commons-codec
    ref: rel/commons-codec-1.17.1
    package_root: org.apache.commons.codec
  - id: commons-text
    github: apache/commons-text
    ref: rel/commons-text-1.12.0
    package_root: org.apache.commons.text
  - id: jackson-core
    github: FasterXML/jackson-core
    ref: jackson-core-2.18.2
    package_root: com.fasterxml.jackson.core
  - id: roaringbitmap
    github: RoaringBitmap/RoaringBitmap
    ref: "1.6.13"
    package_root: org.roaringbitmap
    source_subdir: RoaringBitmap
    build: gradle

# Extended corpus (image list minus the six above).
projects:
