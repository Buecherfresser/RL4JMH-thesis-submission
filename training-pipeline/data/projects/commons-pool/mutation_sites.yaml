  - {class: org.apache.commons.pool3.impl.EvictionTimer, method: run, match: "()", note: "EvictionTimer.run"}
  - {class: org.apache.commons.pool3.impl.GenericKeyedObjectPool, method: addObject, match: "(final K key) throws E", note: "GenericKeyedObjectPool.addObject"}
  - {class: org.apache.commons.pool3.impl.GenericKeyedObjectPool, method: borrowObject, match: "(final K key) throws E", note: "GenericKeyedObjectPool.borrowObject"}
  - {class: org.apache.commons.pool3.impl.GenericKeyedObjectPool, method: borrowObject, match: "(final K key, final long borrowMaxWaitMillis) throws E", note: "GenericKeyedObjectPool.borrowObject"}
  - {class: org.apache.commons.pool3.impl.GenericKeyedObjectPoolConfig, method: getMaxIdlePerKey, match: "()", note: "GenericKeyedObjectPoolConfig.getMaxIdlePerKey"}
  - {class: org.apache.commons.pool3.impl.GenericKeyedObjectPoolConfig, method: getMaxTotal, match: "()", note: "GenericKeyedObjectPoolConfig.getMaxTotal"}
  - {class: org.apache.commons.pool3.impl.GenericKeyedObjectPoolConfig, method: getMaxTotalPerKey, match: "()", note: "GenericKeyedObjectPoolConfig.getMaxTotalPerKey"}
  - {class: org.apache.commons.pool3.impl.GenericObjectPool, method: addObject, match: "() throws E", note: "GenericObjectPool.addObject"}
  - {class: org.apache.commons.pool3.impl.GenericObjectPool, method: borrowObject, match: "() throws E", note: "GenericObjectPool.borrowObject"}
  - {class: org.apache.commons.pool3.impl.GenericObjectPool, method: borrowObject, match: "(final Duration maxWaitDuration) throws E", note: "GenericObjectPool.borrowObject"}
  - {class: org.apache.commons.pool3.impl.GenericObjectPoolConfig, method: getMaxIdle, match: "()", note: "GenericObjectPoolConfig.getMaxIdle"}
