  - {class: nonapi.io.github.classgraph.classloaderhandler.CxfContainerClassLoaderHandler, method: findClassLoaderOrder, match: "(final ClassLoader classLoader, final ClassLoaderOrder classLoaderOrder,", note: "CxfContainerClassLoaderHandler.findClassLoaderOrder"}
