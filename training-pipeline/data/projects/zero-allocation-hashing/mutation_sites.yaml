# Curated performance-mutation sites for zero-allocation-hashing (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants zero-allocation-hashing --source data/external-src/<checkout> \
#       --sites data/projects/zero-allocation-hashing/mutation_sites.yaml

package_root: net.openhft.hashing

sites:
  - {class: net.openhft.hashing.ByteBufferAccess, method: getUnsignedInt, match: "(ByteBuffer input, long offset)", note: "ByteBufferAccess.getUnsignedInt"}
  - {class: net.openhft.hashing.ByteBufferAccess, method: getUnsignedShort, match: "(ByteBuffer input, long offset)", note: "ByteBufferAccess.getUnsignedShort"}
