# Curated performance-mutation sites for ejml (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants ejml --source data/external-src/<checkout> \
#       --sites data/projects/ejml/mutation_sites.yaml

package_root: org.ejml

sites:
  - {class: org.ejml.MapPrintFormat, method: pair, match: "( StringBuilder builder, String name, double value, boolean isMore )", note: "MapPrintFormat.pair"}
  - {class: org.ejml.concurrency.EjmlConcurrency, method: setMaxThreads, match: "( int maxThreads )", note: "EjmlConcurrency.setMaxThreads"}
  - {class: org.ejml.data.DGrowArray, method: length, match: "()", note: "DGrowArray.length"}
  - {class: org.ejml.dense.row.decompose.UtilDecompositons_ZDRM, method: checkIdentity, match: "( @Nullable ZMatrixRMaj A, int numRows, int numCols )", note: "UtilDecompositons_ZDRM.checkIdentity"}
  - {class: org.ejml.equation.Function, method: getName, match: "()", note: "Function.getName"}
  - {class: org.ejml.generic.GenericMatrixOps_F64, method: isEquivalent, match: "( DMatrix a, DMatrix b, double tol )", note: "GenericMatrixOps_F64.isEquivalent"}
  - {class: org.ejml.masks.DMaskFactory, method: builder, match: "( double[] values )", note: "DMaskFactory.builder"}
  - {class: org.ejml.ops.ComplexMath_F64, method: conj, match: "( Complex_F64 input, Complex_F64 conj )", note: "ComplexMath_F64.conj"}
  - {class: org.ejml.simple.AutomaticSimpleMatrixConvert, method: specify0, match: "( ConstMatrix<?> a, ConstMatrix<?>... inputs )", note: "AutomaticSimpleMatrixConvert.specify0"}
  - {class: org.ejml.sparse.csc.decomposition.qr.QrHelperFunctions_DSCC, method: applyHouseholder, match: "( DMatrixSparseCSC V, int colV, double beta,", note: "QrHelperFunctions_DSCC.applyHouseholder"}
  - {class: org.ejml.MapPrintFormat, method: pair, match: "( String name, double value, boolean isMore )", note: "MapPrintFormat.pair"}
  - {class: org.ejml.concurrency.EjmlConcurrency, method: isUseConcurrent, match: "()", note: "EjmlConcurrency.isUseConcurrent"}
  - {class: org.ejml.data.DGrowArray, method: reset, match: "()", note: "DGrowArray.reset"}
  - {class: org.ejml.dense.row.decompose.UtilDecompositons_ZDRM, method: checkZeros, match: "( @Nullable ZMatrixRMaj A, int numRows, int numCols )", note: "UtilDecompositons_ZDRM.checkZeros"}
  - {class: org.ejml.equation.ManagerFunctions, method: isFunctionName, match: "( String s )", note: "ManagerFunctions.isFunctionName"}
  - {class: org.ejml.generic.GenericMatrixOps_F64, method: isIdentity, match: "( DMatrix a, double tol )", note: "GenericMatrixOps_F64.isIdentity"}
  - {class: org.ejml.masks.DMaskFactory, method: builder, match: "( DMatrixD1 matrix )", note: "DMaskFactory.builder"}
  - {class: org.ejml.ops.ComplexMath_F64, method: plus, match: "( Complex_F64 a, Complex_F64 b, Complex_F64 result )", note: "ComplexMath_F64.plus"}
  - {class: org.ejml.simple.AutomaticSimpleMatrixConvert, method: specify, match: "( ConstMatrix<?>... inputs )", note: "AutomaticSimpleMatrixConvert.specify"}
  - {class: org.ejml.sparse.csc.decomposition.qr.QrHelperFunctions_DSCC, method: rank1UpdateMultR, match: "( DMatrixSparseCSC V, int colV, double gamma,", note: "QrHelperFunctions_DSCC.rank1UpdateMultR"}
  - {class: org.ejml.MapPrintReflect, method: formatMap, match: "( Object object )", note: "MapPrintReflect.formatMap"}
  - {class: org.ejml.data.IGrowArray, method: length, match: "()", note: "IGrowArray.length"}
  - {class: org.ejml.dense.row.decompose.qr.QrHelperFunctions_ZDRM, method: findMax, match: "( double[] u, int startU, int length )", note: "QrHelperFunctions_ZDRM.findMax"}
  - {class: org.ejml.equation.ManagerFunctions, method: create, match: "( String name, Variable var0 )", note: "ManagerFunctions.create"}
  - {class: org.ejml.masks.DMaskPrimitive, method: isSet, match: "( int row, int col )", note: "DMaskPrimitive.isSet"}
  - {class: org.ejml.ops.DConvertArrays, method: convert, match: "( double[][] src, @Nullable DMatrixRMaj dst )", note: "DConvertArrays.convert"}
  - {class: org.ejml.simple.SimpleEVD, method: createEigen, match: "( MatrixType type )", note: "SimpleEVD.createEigen"}
  - {class: org.ejml.sparse.csc.CommonOpsWithSemiRing_DSCC, method: mult, match: "(DMatrixSparseCSC A, DMatrixSparseCSC B, @Nullable DMatrixSparseCSC output, DSemiRing semiRing)", note: "CommonOpsWithSemiRing_DSCC.mult"}
  - {class: org.ejml.MapPrintReflect, method: formatMap, match: "( Object object, MapPrintFormat format )", note: "MapPrintReflect.formatMap"}
  - {class: org.ejml.data.IGrowArray, method: reshape, match: "( int length )", note: "IGrowArray.reshape"}
  - {class: org.ejml.dense.row.decompose.qr.QrHelperFunctions_ZDRM, method: divideElements, match: "( final int j, final int numRows, final double[] u,", note: "QrHelperFunctions_ZDRM.divideElements"}
  - {class: org.ejml.equation.TokenList, method: push, match: "( Token token )", note: "TokenList.push"}
  - {class: org.ejml.masks.DMaskPrimitive, method: getNumCols, match: "()", note: "DMaskPrimitive.getNumCols"}
  - {class: org.ejml.ops.DConvertArrays, method: convert, match: "( DMatrixRMaj src )", note: "DConvertArrays.convert"}
  - {class: org.ejml.simple.SimpleEVD, method: getEigenvalues, match: "()", note: "SimpleEVD.getEigenvalues"}
  - {class: org.ejml.sparse.csc.CommonOpsWithSemiRing_DSCC, method: mult, match: "(DMatrixSparseCSC A, DMatrixSparseCSC B, @Nullable DMatrixSparseCSC output, DSemiRing semiRing,", note: "CommonOpsWithSemiRing_DSCC.mult"}
  - {class: org.ejml.TestDMaskUtil, method: assertMaskedResult, match: "( DMatrixSparseCSC unmaskedResult, DMatrixSparseCSC maskedResult, Mask mask )", note: "TestDMaskUtil.assertMaskedResult"}
  - {class: org.ejml.data.UtilTestMatrix, method: checkMat, match: "(DMatrixRMaj mat , double ...d )", note: "UtilTestMatrix.checkMat"}
  - {class: org.ejml.dense.row.decomposition.UtilDecompositons_DDRM, method: ensureIdentity, match: "( @Nullable DMatrixRMaj A, int numRows, int numCols )", note: "UtilDecompositons_DDRM.ensureIdentity"}
  - {class: org.ejml.equation.TokenList, method: insert, match: "( @Nullable Token where, Token token )", note: "TokenList.insert"}
  - {class: org.ejml.masks.DMaskSparse, method: isSet, match: "( int row, int col )", note: "DMaskSparse.isSet"}
  - {class: org.ejml.ops.SortCoupledArray_F64, method: quick, match: "( int[] segments, int length, int[] valuesA, double[] valuesB )", note: "SortCoupledArray_F64.quick"}
  - {class: org.ejml.simple.SimpleMatrix, method: wrap, match: "( Matrix internalMat )", note: "SimpleMatrix.wrap"}
  - {class: org.ejml.sparse.csc.CommonOps_DSCC, method: checkIndicesSorted, match: "( DMatrixSparseCSC A )", note: "CommonOps_DSCC.checkIndicesSorted"}
  - {class: org.ejml.TestDMaskUtil, method: assertMaskedResult, match: "( double[] unmaskedResult, double[] maskedResult, Mask mask )", note: "TestDMaskUtil.assertMaskedResult"}
  - {class: org.ejml.data.UtilTestMatrix, method: checkMat, match: "(FMatrixRMaj mat , float ...d )", note: "UtilTestMatrix.checkMat"}
  - {class: org.ejml.dense.row.decomposition.UtilDecompositons_DDRM, method: ensureZeros, match: "( @Nullable DMatrixRMaj A, int numRows, int numCols )", note: "UtilDecompositons_DDRM.ensureZeros"}
  - {class: org.ejml.equation.Equation, method: setSeed, match: "( long seed )", note: "Equation.setSeed"}
  - {class: org.ejml.masks.DMaskSparse, method: isSet, match: "( int idx )", note: "DMaskSparse.isSet"}
  - {class: org.ejml.ops.SortCoupledArray_F64, method: shellSort, match: "( int[] data, int offset, int length, int[] indexes )", note: "SortCoupledArray_F64.shellSort"}
