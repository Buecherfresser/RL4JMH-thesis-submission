# Curated performance-mutation sites for fast-serialization (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants fast-serialization --source data/external-src/<checkout> \
#       --sites data/projects/fast-serialization/mutation_sites.yaml

package_root: org.nustaq.serialization

sites:
  - {class: org.nustaq.serialization.FSTClazzInfo, method: getDecoderAttached, match: "()", note: "FSTClazzInfo.getDecoderAttached"}
