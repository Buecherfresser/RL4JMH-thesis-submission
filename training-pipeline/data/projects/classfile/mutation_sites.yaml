# Curated performance-mutation sites for classfile (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants classfile --source data/external-src/<checkout> \
#       --sites data/projects/classfile/mutation_sites.yaml

package_root: dev.xdark.classfile

sites:
  - {class: dev.xdark.classfile.AccessFlag, method: of, match: "(AccessFlag a, AccessFlag b)", note: "AccessFlag.of"}
  - {class: dev.xdark.classfile.annotation.ElementValueArray, method: getValues, match: "()", note: "ElementValueArray.getValues"}
  - {class: dev.xdark.classfile.attribute.LineNumberTableAttribute, method: getLineNumbers, match: "()", note: "LineNumberTableAttribute.getLineNumbers"}
  - {class: dev.xdark.classfile.constantpool.ConstantPoolBuilder, method: build, match: "()", note: "ConstantPoolBuilder.build"}
  - {class: dev.xdark.classfile.dynamic.MethodHandle, method: getReferenceKind, match: "()", note: "MethodHandle.getReferenceKind"}
  - {class: dev.xdark.classfile.field.FieldAdapter, method: visit, match: "(AccessFlag access, String name, String desc)", note: "FieldAdapter.visit"}
  - {class: dev.xdark.classfile.io.buffer.ByteBufferInput, method: remaining, match: "()", note: "ByteBufferInput.remaining"}
  - {class: dev.xdark.classfile.method.FilterMethodVisitor, method: visit, match: "(@NotNull AccessFlag access, int nameIndex, int descriptorIndex)", note: "FilterMethodVisitor.visit"}
  - {class: dev.xdark.classfile.opcode.FieldInstruction, method: getFieldIndex, match: "()", note: "FieldInstruction.getFieldIndex"}
  - {class: dev.xdark.classfile.pseuo.InstructionNode, method: getOpcode, match: "()", note: "InstructionNode.getOpcode"}
  - {class: dev.xdark.classfile.AccessFlag, method: of, match: "(AccessFlag... flags)", note: "AccessFlag.of"}
  - {class: dev.xdark.classfile.annotation.ElementValueArray, method: type, match: "()", note: "ElementValueArray.type"}
  - {class: dev.xdark.classfile.attribute.LineNumberTableAttribute, method: info, match: "()", note: "LineNumberTableAttribute.info"}
  - {class: dev.xdark.classfile.constantpool.ConstantPoolBuilder, method: putUtf8, match: "(@NotNull String value)", note: "ConstantPoolBuilder.putUtf8"}
  - {class: dev.xdark.classfile.dynamic.MethodHandle, method: getOwner, match: "()", note: "MethodHandle.getOwner"}
  - {class: dev.xdark.classfile.field.FieldAdapter, method: visitAttributes, match: "()", note: "FieldAdapter.visitAttributes"}
  - {class: dev.xdark.classfile.io.buffer.ByteBufferInput, method: hasRemaining, match: "()", note: "ByteBufferInput.hasRemaining"}
  - {class: dev.xdark.classfile.method.FilterMethodVisitor, method: visitAttributes, match: "()", note: "FilterMethodVisitor.visitAttributes"}
  - {class: dev.xdark.classfile.opcode.IincInstruction, method: getIndex, match: "()", note: "IincInstruction.getIndex"}
  - {class: dev.xdark.classfile.pseuo.InstructionNode, method: verifyRange, match: "(int from, int opcode, int to)", note: "InstructionNode.verifyRange"}
  - {class: dev.xdark.classfile.AttributeWriter, method: visitAttributes, match: "()", note: "AttributeWriter.visitAttributes"}
  - {class: dev.xdark.classfile.annotation.ElementValueString, method: type, match: "()", note: "ElementValueString.type"}
  - {class: dev.xdark.classfile.attribute.code.CodeBuilder, method: create, match: "()", note: "CodeBuilder.create"}
  - {class: dev.xdark.classfile.constantpool.ConstantString, method: index, match: "()", note: "ConstantString.index"}
  - {class: dev.xdark.classfile.field.FilterFieldVisitor, method: visit, match: "(@NotNull AccessFlag access, int nameIndex, int descriptorIndex)", note: "FilterFieldVisitor.visit"}
  - {class: dev.xdark.classfile.io.buffer.ByteBufferOutput, method: consume, match: "()", note: "ByteBufferOutput.consume"}
  - {class: dev.xdark.classfile.method.MethodAdapter, method: visit, match: "(AccessFlag access, String name, String desc)", note: "MethodAdapter.visit"}
  - {class: dev.xdark.classfile.opcode.IincInstruction, method: getValue, match: "()", note: "IincInstruction.getValue"}
  - {class: dev.xdark.classfile.AttributeWriter, method: visitAttribute, match: "(int nameIndex, @NotNull Attribute<?> attribute)", note: "AttributeWriter.visitAttribute"}
  - {class: dev.xdark.classfile.annotation.FilterAnnotationArrayVisitor, method: visitArray, match: "(int length)", note: "FilterAnnotationArrayVisitor.visitArray"}
  - {class: dev.xdark.classfile.attribute.code.CodeBuilder, method: visitCode, match: "()", note: "CodeBuilder.visitCode"}
  - {class: dev.xdark.classfile.constantpool.ConstantString, method: tag, match: "()", note: "ConstantString.tag"}
  - {class: dev.xdark.classfile.field.FilterFieldVisitor, method: visitAttributes, match: "()", note: "FilterFieldVisitor.visitAttributes"}
  - {class: dev.xdark.classfile.io.buffer.ByteBufferOutput, method: position, match: "()", note: "ByteBufferOutput.position"}
  - {class: dev.xdark.classfile.method.MethodAdapter, method: visitAttributes, match: "()", note: "MethodAdapter.visitAttributes"}
  - {class: dev.xdark.classfile.opcode.Label, method: getPosition, match: "()", note: "Label.getPosition"}
  - {class: dev.xdark.classfile.ClassAdapter, method: visit, match: "(@NotNull ClassVersion version, @NotNull AccessFlag access, @NotNull String name, @Nullable String superName, @NotNull List<String> interfaces)", note: "ClassAdapter.visit"}
  - {class: dev.xdark.classfile.annotation.FilterAnnotationArrayVisitor, method: visitConstant, match: "(@NotNull ElementValueConstant<?> value)", note: "FilterAnnotationArrayVisitor.visitConstant"}
  - {class: dev.xdark.classfile.attribute.stackmap.StackMapTableAttribute, method: getFrames, match: "()", note: "StackMapTableAttribute.getFrames"}
