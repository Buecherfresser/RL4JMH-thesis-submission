# Curated performance-mutation sites for jackson-modules-java8 (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jackson-modules-java8 --source data/external-src/<checkout> \
#       --sites data/projects/jackson-modules-java8/mutation_sites.yaml

package_root: com.fasterxml.jackson

sites:
  - {class: com.fasterxml.jackson.datatype.jdk8.DoubleStreamSerializer, method: serialize, match: "(DoubleStream stream, JsonGenerator jgen, SerializerProvider provider) throws IOException", note: "DoubleStreamSerializer.serialize"}
  - {class: com.fasterxml.jackson.module.paramnames.ParameterExtractor, method: getParameters, match: "(Executable executable)", note: "ParameterExtractor.getParameters"}
  - {class: com.fasterxml.jackson.datatype.jdk8.IntStreamSerializer, method: serialize, match: "(IntStream stream, JsonGenerator jgen, SerializerProvider provider) throws IOException", note: "IntStreamSerializer.serialize"}
  - {class: com.fasterxml.jackson.module.paramnames.ParameterNamesAnnotationIntrospector, method: findImplicitPropertyName, match: "(AnnotatedMember m)", note: "ParameterNamesAnnotationIntrospector.findImplicitPropertyName"}
  - {class: com.fasterxml.jackson.datatype.jdk8.LongStreamSerializer, method: serialize, match: "(LongStream stream, JsonGenerator jgen, SerializerProvider provider) throws IOException", note: "LongStreamSerializer.serialize"}
  - {class: com.fasterxml.jackson.module.paramnames.ParameterNamesAnnotationIntrospector, method: findCreatorAnnotation, match: "(MapperConfig<?> config, Annotated a)", note: "ParameterNamesAnnotationIntrospector.findCreatorAnnotation"}
  - {class: com.fasterxml.jackson.datatype.jdk8.StreamSerializer, method: createContextual, match: "(SerializerProvider provider, BeanProperty property) throws JsonMappingException", note: "StreamSerializer.createContextual"}
  - {class: com.fasterxml.jackson.module.paramnames.ParameterNamesModule, method: setupModule, match: "(SetupContext context)", note: "ParameterNamesModule.setupModule"}
  - {class: com.fasterxml.jackson.datatype.jdk8.StreamSerializer, method: serialize, match: "(Stream<?> stream, JsonGenerator jgen, SerializerProvider provider) throws IOException", note: "StreamSerializer.serialize"}
  - {class: com.fasterxml.jackson.datatype.jsr310.DecimalUtils, method: toDecimal, match: "(long seconds, int nanoseconds)", note: "DecimalUtils.toDecimal"}
  - {class: com.fasterxml.jackson.datatype.jsr310.DecimalUtils, method: toBigDecimal, match: "(long seconds, int nanoseconds)", note: "DecimalUtils.toBigDecimal"}
  - {class: com.fasterxml.jackson.datatype.jsr310.deser.JSR310StringParsableDeserializer, method: createDeserializer, match: "(Class<T> type, int typeId)", note: "JSR310StringParsableDeserializer.createDeserializer"}
  - {class: com.fasterxml.jackson.datatype.jsr310.deser.JSR310StringParsableDeserializer, method: withLeniency, match: "(Boolean leniency)", note: "JSR310StringParsableDeserializer.withLeniency"}
  - {class: com.fasterxml.jackson.datatype.jdk8.Jdk8BeanSerializerModifier, method: changeProperties, match: "(SerializationConfig config,", note: "Jdk8BeanSerializerModifier.changeProperties"}
  - {class: com.fasterxml.jackson.datatype.jdk8.Jdk8Deserializers, method: findReferenceDeserializer, match: "(ReferenceType refType,", note: "Jdk8Deserializers.findReferenceDeserializer"}
  - {class: com.fasterxml.jackson.datatype.jdk8.Jdk8Deserializers, method: findBeanDeserializer, match: "(JavaType type,", note: "Jdk8Deserializers.findBeanDeserializer"}
  - {class: com.fasterxml.jackson.datatype.jdk8.Jdk8Module, method: setupModule, match: "(SetupContext context)", note: "Jdk8Module.setupModule"}
  - {class: com.fasterxml.jackson.datatype.jdk8.Jdk8Module, method: version, match: "()", note: "Jdk8Module.version"}
  - {class: com.fasterxml.jackson.datatype.jdk8.Jdk8OptionalBeanPropertyWriter, method: _new, match: "(PropertyName newName)", note: "Jdk8OptionalBeanPropertyWriter._new"}
  - {class: com.fasterxml.jackson.datatype.jdk8.Jdk8OptionalBeanPropertyWriter, method: unwrappingWriter, match: "(NameTransformer unwrapper)", note: "Jdk8OptionalBeanPropertyWriter.unwrappingWriter"}
  - {class: com.fasterxml.jackson.datatype.jdk8.Jdk8Serializers, method: findReferenceSerializer, match: "(SerializationConfig config,", note: "Jdk8Serializers.findReferenceSerializer"}
  - {class: com.fasterxml.jackson.datatype.jdk8.Jdk8Serializers, method: findSerializer, match: "(SerializationConfig config, JavaType type,", note: "Jdk8Serializers.findSerializer"}
