# Curated performance-mutation sites for fixture-factory (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants fixture-factory --source data/external-src/<checkout> \
#       --sites data/projects/fixture-factory/mutation_sites.yaml

package_root: br.com.six2six

sites:
  - {class: br.com.six2six.fixturefactory.base.Range, method: getStart, match: "()", note: "Range.getStart"}
  - {class: br.com.six2six.fixturefactory.base.Range, method: getEnd, match: "()", note: "Range.getEnd"}
  - {class: br.com.six2six.fixturefactory.function.FixtureFunction, method: generateValue, match: "()", note: "FixtureFunction.generateValue"}
