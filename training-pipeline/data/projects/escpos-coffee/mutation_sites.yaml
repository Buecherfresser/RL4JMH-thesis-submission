  - {class: com.github.anastaciocintra.output.PrinterOutputStream, method: setUncaughtException, match: "(UncaughtExceptionHandler uncaughtException)", note: "PrinterOutputStream.setUncaughtException"}
  - {class: com.github.anastaciocintra.escpos.EscPos, method: setOutputStream, match: "(OutputStream outputStream)", note: "EscPos.setOutputStream"}
  - {class: com.github.anastaciocintra.output.PrinterOutputStream, method: getListPrintServicesNames, match: "()", note: "PrinterOutputStream.getListPrintServicesNames"}
  - {class: com.github.anastaciocintra.escpos.EscPos, method: getOutputStream, match: "()", note: "EscPos.getOutputStream"}
  - {class: com.github.anastaciocintra.output.PrinterOutputStream, method: getDefaultPrintService, match: "()", note: "PrinterOutputStream.getDefaultPrintService"}
  - {class: com.github.anastaciocintra.escpos.EscPos, method: setStyle, match: "(Style style)", note: "EscPos.setStyle"}
