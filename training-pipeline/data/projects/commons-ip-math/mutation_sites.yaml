# Curated performance-mutation sites for commons-ip-math (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants commons-ip-math --source data/external-src/<checkout> \
#       --sites data/projects/commons-ip-math/mutation_sites.yaml

package_root: com.github.jgonian

sites:
  - {class: com.github.jgonian.ipmath.AsnRange, method: newInstance, match: "(Asn start, Asn end)", note: "AsnRange.newInstance"}
  - {class: com.github.jgonian.ipmath.AsnRange, method: from, match: "(Long from)", note: "AsnRange.from"}
  - {class: com.github.jgonian.ipmath.AsnRange, method: from, match: "(Asn from)", note: "AsnRange.from"}
  - {class: com.github.jgonian.ipmath.AsnRange, method: from, match: "(String from)", note: "AsnRange.from"}
  - {class: com.github.jgonian.ipmath.AsnRange, method: parse, match: "(String text)", note: "AsnRange.parse"}
  - {class: com.github.jgonian.ipmath.AsnRange, method: containsOnly16BitAsns, match: "()", note: "AsnRange.containsOnly16BitAsns"}
  - {class: com.github.jgonian.ipmath.Ipv4Range, method: newInstance, match: "(BigInteger start, BigInteger end)", note: "Ipv4Range.newInstance"}
  - {class: com.github.jgonian.ipmath.Ipv4Range, method: newInstance, match: "(Ipv4 start, Ipv4 end)", note: "Ipv4Range.newInstance"}
  - {class: com.github.jgonian.ipmath.Ipv4Range, method: from, match: "(Ipv4 from)", note: "Ipv4Range.from"}
  - {class: com.github.jgonian.ipmath.Ipv4Range, method: from, match: "(BigInteger from)", note: "Ipv4Range.from"}
  - {class: com.github.jgonian.ipmath.Ipv4Range, method: from, match: "(Long from)", note: "Ipv4Range.from"}
  - {class: com.github.jgonian.ipmath.Ipv4Range, method: from, match: "(String from)", note: "Ipv4Range.from"}
  - {class: com.github.jgonian.ipmath.Ipv6Range, method: newInstance, match: "(BigInteger start, BigInteger end)", note: "Ipv6Range.newInstance"}
  - {class: com.github.jgonian.ipmath.Ipv6Range, method: newInstance, match: "(Ipv6 start, Ipv6 end)", note: "Ipv6Range.newInstance"}
  - {class: com.github.jgonian.ipmath.Ipv6Range, method: from, match: "(Ipv6 from)", note: "Ipv6Range.from"}
  - {class: com.github.jgonian.ipmath.Ipv6Range, method: from, match: "(BigInteger from)", note: "Ipv6Range.from"}
  - {class: com.github.jgonian.ipmath.Ipv6Range, method: from, match: "(String from)", note: "Ipv6Range.from"}
  - {class: com.github.jgonian.ipmath.Ipv6Range, method: parse, match: "(String range)", note: "Ipv6Range.parse"}
  - {class: com.github.jgonian.ipmath.PrefixUtils, method: findMaxPrefixLengthForAddress, match: "(Ipv6 address)", note: "PrefixUtils.findMaxPrefixLengthForAddress"}
