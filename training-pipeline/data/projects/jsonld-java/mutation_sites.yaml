  - {class: com.github.jsonldjava.utils.Obj, method: newMap, match: "(String key, Object value)", note: "Obj.newMap"}
  - {class: com.github.jsonldjava.core.JsonLdApi, method: compact, match: "(Context activeCtx, String activeProperty, Object element,", note: "JsonLdApi.compact"}
  - {class: com.github.jsonldjava.core.JsonLdApi, method: compact, match: "(Context activeCtx, String activeProperty, Object element)", note: "JsonLdApi.compact"}
  - {class: com.github.jsonldjava.core.JsonLdApi, method: expand, match: "(Context activeCtx, String activeProperty, Object element)", note: "JsonLdApi.expand"}
  - {class: com.github.jsonldjava.core.JsonLdApi, method: expand, match: "(Context activeCtx, Object element) throws JsonLdError", note: "JsonLdApi.expand"}
  - {class: com.github.jsonldjava.core.JsonLdError, method: getMessage, match: "()", note: "JsonLdError.getMessage"}
  - {class: com.github.jsonldjava.core.JsonLdOptions, method: getEmbed, match: "()", note: "JsonLdOptions.getEmbed"}
  - {class: com.github.jsonldjava.core.JsonLdOptions, method: setEmbed, match: "(Boolean embed)", note: "JsonLdOptions.setEmbed"}
  - {class: com.github.jsonldjava.core.JsonLdOptions, method: setEmbed, match: "(String embed) throws JsonLdError", note: "JsonLdOptions.setEmbed"}
  - {class: com.github.jsonldjava.core.JsonLdOptions, method: setEmbed, match: "(Embed embed) throws JsonLdError", note: "JsonLdOptions.setEmbed"}
  - {class: com.github.jsonldjava.core.JsonLdProcessor, method: compact, match: "(Object input, Object context, JsonLdOptions opts)", note: "JsonLdProcessor.compact"}
  - {class: com.github.jsonldjava.core.JsonLdProcessor, method: expand, match: "(Object input, JsonLdOptions opts) throws JsonLdError", note: "JsonLdProcessor.expand"}
  - {class: com.github.jsonldjava.core.JsonLdProcessor, method: expand, match: "(Object input) throws JsonLdError", note: "JsonLdProcessor.expand"}
  - {class: com.github.jsonldjava.core.JsonLdProcessor, method: flatten, match: "(Object input, Object context, JsonLdOptions opts)", note: "JsonLdProcessor.flatten"}
  - {class: com.github.jsonldjava.core.RDFDataset, method: getSubject, match: "()", note: "RDFDataset.getSubject"}
