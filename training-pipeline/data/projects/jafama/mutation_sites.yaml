# Curated performance-mutation sites for jafama (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jafama --source data/external-src/<checkout> \
#       --sites data/projects/jafama/mutation_sites.yaml

package_root: net.jafama

sites:
  - {class: net.jafama.FastMath, method: sin, match: "(double angle)", note: "FastMath.sin"}
  - {class: net.jafama.FastMath, method: sinQuick, match: "(double angle)", note: "FastMath.sinQuick"}
  - {class: net.jafama.FastMath, method: cos, match: "(double angle)", note: "FastMath.cos"}
  - {class: net.jafama.FastMath, method: cosQuick, match: "(double angle)", note: "FastMath.cosQuick"}
  - {class: net.jafama.FastMath, method: sinAndCos, match: "(double angle, DoubleWrapper cosine)", note: "FastMath.sinAndCos"}
  - {class: net.jafama.FastMath, method: tan, match: "(double angle)", note: "FastMath.tan"}
  - {class: net.jafama.FastMath, method: asin, match: "(double value)", note: "FastMath.asin"}
  - {class: net.jafama.FastMath, method: asinInRange, match: "(double value)", note: "FastMath.asinInRange"}
  - {class: net.jafama.FastMath, method: acos, match: "(double value)", note: "FastMath.acos"}
  - {class: net.jafama.FastMath, method: acosInRange, match: "(double value)", note: "FastMath.acosInRange"}
  - {class: net.jafama.FastMath, method: atan, match: "(double value)", note: "FastMath.atan"}
  - {class: net.jafama.FastMath, method: atan2, match: "(double y, double x)", note: "FastMath.atan2"}
  - {class: net.jafama.FastMath, method: toRadians, match: "(double angdeg)", note: "FastMath.toRadians"}
  - {class: net.jafama.FastMath, method: toDegrees, match: "(double angrad)", note: "FastMath.toDegrees"}
  - {class: net.jafama.FastMath, method: toRadians, match: "(boolean sign, int degrees, int minutes, double seconds)", note: "FastMath.toRadians"}
  - {class: net.jafama.FastMath, method: toDegrees, match: "(boolean sign, int degrees, int minutes, double seconds)", note: "FastMath.toDegrees"}
  - {class: net.jafama.FastMath, method: toDMS, match: "(double angrad, IntWrapper degrees, IntWrapper minutes, DoubleWrapper seconds)", note: "FastMath.toDMS"}
  - {class: net.jafama.FastMath, method: isInClockwiseDomain, match: "(double startAngRad, double angSpanRad, double angRad)", note: "FastMath.isInClockwiseDomain"}
  - {class: net.jafama.FastMath, method: sinh, match: "(double value)", note: "FastMath.sinh"}
  - {class: net.jafama.FastMath, method: cosh, match: "(double value)", note: "FastMath.cosh"}
  - {class: net.jafama.FastMath, method: coshm1, match: "(double value)", note: "FastMath.coshm1"}
  - {class: net.jafama.FastMath, method: sinhAndCosh, match: "(double value, DoubleWrapper hcosine)", note: "FastMath.sinhAndCosh"}
  - {class: net.jafama.FastMath, method: tanh, match: "(double value)", note: "FastMath.tanh"}
  - {class: net.jafama.FastMath, method: asinh, match: "(double value)", note: "FastMath.asinh"}
  - {class: net.jafama.FastMath, method: acosh, match: "(double value)", note: "FastMath.acosh"}
  - {class: net.jafama.FastMath, method: acosh1p, match: "(double value)", note: "FastMath.acosh1p"}
  - {class: net.jafama.FastMath, method: atanh, match: "(double value)", note: "FastMath.atanh"}
  - {class: net.jafama.FastMath, method: exp, match: "(double value)", note: "FastMath.exp"}
  - {class: net.jafama.FastMath, method: expQuick, match: "(double value)", note: "FastMath.expQuick"}
  - {class: net.jafama.FastMath, method: expm1, match: "(double value)", note: "FastMath.expm1"}
  - {class: net.jafama.FastMath, method: log, match: "(double value)", note: "FastMath.log"}
  - {class: net.jafama.FastMath, method: logQuick, match: "(double value)", note: "FastMath.logQuick"}
  - {class: net.jafama.FastMath, method: log10, match: "(double value)", note: "FastMath.log10"}
  - {class: net.jafama.FastMath, method: log1p, match: "(double value)", note: "FastMath.log1p"}
  - {class: net.jafama.FastMath, method: pow, match: "(double value, double power)", note: "FastMath.pow"}
  - {class: net.jafama.FastMath, method: powQuick, match: "(double value, double power)", note: "FastMath.powQuick"}
  - {class: net.jafama.FastMath, method: powFast, match: "(double value, int power)", note: "FastMath.powFast"}
  - {class: net.jafama.FastMath, method: pow2, match: "(float value)", note: "FastMath.pow2"}
  - {class: net.jafama.FastMath, method: pow2, match: "(double value)", note: "FastMath.pow2"}
  - {class: net.jafama.FastMath, method: pow3, match: "(float value)", note: "FastMath.pow3"}
  - {class: net.jafama.FastMath, method: pow3, match: "(double value)", note: "FastMath.pow3"}
  - {class: net.jafama.FastMath, method: sqrt, match: "(double value)", note: "FastMath.sqrt"}
  - {class: net.jafama.FastMath, method: sqrtQuick, match: "(double value)", note: "FastMath.sqrtQuick"}
  - {class: net.jafama.FastMath, method: invSqrtQuick, match: "(double value)", note: "FastMath.invSqrtQuick"}
  - {class: net.jafama.FastMath, method: cbrt, match: "(double value)", note: "FastMath.cbrt"}
  - {class: net.jafama.FastMath, method: hypot, match: "(double x, double y)", note: "FastMath.hypot"}
  - {class: net.jafama.FastMath, method: hypot, match: "(double x, double y, double z)", note: "FastMath.hypot"}
  - {class: net.jafama.FastMath, method: floor, match: "(float value)", note: "FastMath.floor"}
  - {class: net.jafama.FastMath, method: floor, match: "(double value)", note: "FastMath.floor"}
  - {class: net.jafama.FastMath, method: ceil, match: "(float value)", note: "FastMath.ceil"}
