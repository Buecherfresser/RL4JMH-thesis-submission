# Curated performance-mutation sites for ognl (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants ognl --source data/external-src/<checkout> \
#       --sites data/projects/ognl/mutation_sites.yaml

package_root: ognl

sites:
  - {class: ognl.ASTList, method: getValueBody, match: "(C context, Object source)", note: "ASTList.getValueBody"}
  - {class: ognl.enhance.ContextClassLoader, method: findClass, match: "(String name) throws ClassNotFoundException", note: "ContextClassLoader.findClass"}
  - {class: ognl.internal.HashMapCache, method: clear, match: "()", note: "HashMapCache.clear"}
  - {class: ognl.ASTList, method: getGetterClass, match: "()", note: "ASTList.getGetterClass"}
  - {class: ognl.enhance.EnhancedClassLoader, method: defineClass, match: "(String enhancedClassName, byte[] byteCode)", note: "EnhancedClassLoader.defineClass"}
  - {class: ognl.internal.HashMapCache, method: getSize, match: "()", note: "HashMapCache.getSize"}
  - {class: ognl.ASTMap, method: setClassName, match: "(String value)", note: "ASTMap.setClassName"}
  - {class: ognl.enhance.ExpressionCompiler, method: addCastString, match: "(C context, String cast)", note: "ExpressionCompiler.addCastString"}
  - {class: ognl.internal.HashMapCacheFactory, method: createCache, match: "(CacheEntryFactory<K, V> entryFactory)", note: "HashMapCacheFactory.createCache"}
  - {class: ognl.ASTMap, method: getValueBody, match: "(C context, Object source) throws OgnlException", note: "ASTMap.getValueBody"}
  - {class: ognl.enhance.ExpressionCompiler, method: getCastString, match: "(Class<?> type)", note: "ExpressionCompiler.getCastString"}
  - {class: ognl.internal.HashMapCacheFactory, method: createClassCache, match: "()", note: "HashMapCacheFactory.createClassCache"}
  - {class: ognl.ArrayElementsAccessor, method: getElements, match: "(final Object target)", note: "ArrayElementsAccessor.getElements"}
  - {class: ognl.enhance.OgnlLocalReference, method: getName, match: "()", note: "OgnlLocalReference.getName"}
  - {class: ognl.internal.HashMapClassCache, method: setClassInspector, match: "(ClassCacheInspector inspector)", note: "HashMapClassCache.setClassInspector"}
  - {class: ognl.ArrayElementsAccessor, method: hasMoreElements, match: "()", note: "ArrayElementsAccessor.hasMoreElements"}
  - {class: ognl.enhance.OgnlLocalReference, method: getExpression, match: "()", note: "OgnlLocalReference.getExpression"}
  - {class: ognl.internal.ClassCacheHandler, method: getHandler, match: "(Class<?> forClass, ClassCache<T> handlers) throws CacheException", note: "ClassCacheHandler.getHandler"}
  - {class: ognl.ArrayPropertyAccessor, method: getProperty, match: "(C context, Object target, Object name) throws OgnlException", note: "ArrayPropertyAccessor.getProperty"}
  - {class: ognl.internal.entry.DeclaredMethodCacheEntryFactory, method: shouldCache, match: "(DeclaredMethodCacheEntry key, Method method)", note: "DeclaredMethodCacheEntryFactory.shouldCache"}
  - {class: ognl.ArrayPropertyAccessor, method: setProperty, match: "(C context, Object target, Object name, Object value) throws OgnlException", note: "ArrayPropertyAccessor.setProperty"}
  - {class: ognl.internal.entry.FieldCacheEntryFactory, method: create, match: "(Class<?> key) throws CacheException", note: "FieldCacheEntryFactory.create"}
  - {class: ognl.JJTOgnlParserState, method: nodeCreated, match: "()", note: "JJTOgnlParserState.nodeCreated"}
  - {class: ognl.internal.entry.GenericMethodParameterTypeFactory, method: create, match: "(GenericMethodParameterTypeCacheEntry entry) throws CacheException", note: "GenericMethodParameterTypeFactory.create"}
  - {class: ognl.JJTOgnlParserState, method: reset, match: "()", note: "JJTOgnlParserState.reset"}
  - {class: ognl.internal.entry.MethodAccessCacheEntryFactory, method: create, match: "(Method method) throws CacheException", note: "MethodAccessCacheEntryFactory.create"}
  - {class: ognl.ListPropertyAccessor, method: getProperty, match: "(C context, Object target, Object name) throws OgnlException", note: "ListPropertyAccessor.getProperty"}
  - {class: ognl.internal.entry.MethodAccessEntryValue, method: isAccessible, match: "()", note: "MethodAccessEntryValue.isAccessible"}
  - {class: ognl.ListPropertyAccessor, method: setProperty, match: "(C context, Object target, Object name, Object value)", note: "ListPropertyAccessor.setProperty"}
  - {class: ognl.internal.entry.MethodAccessEntryValue, method: isNotPublic, match: "()", note: "MethodAccessEntryValue.isNotPublic"}
  - {class: ognl.MapElementsAccessor, method: getElements, match: "(Object target)", note: "MapElementsAccessor.getElements"}
  - {class: ognl.internal.entry.PropertyDescriptorCacheEntryFactory, method: create, match: "(Class<?> targetClass) throws CacheException", note: "PropertyDescriptorCacheEntryFactory.create"}
  - {class: ognl.MapPropertyAccessor, method: getProperty, match: "(C context, Object target, Object name) throws OgnlException", note: "MapPropertyAccessor.getProperty"}
  - {class: ognl.MapPropertyAccessor, method: setProperty, match: "(C context, Object target, Object name, Object value) throws OgnlException", note: "MapPropertyAccessor.setProperty"}
  - {class: ognl.NumberElementsAccessor, method: getElements, match: "(final Object target)", note: "NumberElementsAccessor.getElements"}
  - {class: ognl.NumberElementsAccessor, method: hasMoreElements, match: "()", note: "NumberElementsAccessor.hasMoreElements"}
  - {class: ognl.SetPropertyAccessor, method: getProperty, match: "(C context, Object target, Object name) throws OgnlException", note: "SetPropertyAccessor.getProperty"}
  - {class: ognl.ASTAdd, method: jjtClose, match: "()", note: "ASTAdd.jjtClose"}
  - {class: ognl.ASTAdd, method: getValueBody, match: "(C context, Object source) throws OgnlException", note: "ASTAdd.getValueBody"}
  - {class: ognl.ASTAnd, method: jjtClose, match: "()", note: "ASTAnd.jjtClose"}
  - {class: ognl.ASTAnd, method: getValueBody, match: "(C context, Object source)", note: "ASTAnd.getValueBody"}
  - {class: ognl.ASTAssign, method: getValueBody, match: "(C context, Object source) throws OgnlException", note: "ASTAssign.getValueBody"}
  - {class: ognl.ASTAssign, method: toGetSourceString, match: "(C context, Object target)", note: "ASTAssign.toGetSourceString"}
  - {class: ognl.ASTBitAnd, method: jjtClose, match: "()", note: "ASTBitAnd.jjtClose"}
  - {class: ognl.ASTBitAnd, method: getValueBody, match: "(C context, Object source) throws OgnlException", note: "ASTBitAnd.getValueBody"}
  - {class: ognl.ASTBitNegate, method: getValueBody, match: "(C context, Object source) throws OgnlException", note: "ASTBitNegate.getValueBody"}
  - {class: ognl.ASTBitNegate, method: toGetSourceString, match: "(C context, Object target)", note: "ASTBitNegate.toGetSourceString"}
  - {class: ognl.ASTBitOr, method: jjtClose, match: "()", note: "ASTBitOr.jjtClose"}
  - {class: ognl.ASTBitOr, method: getValueBody, match: "(C context, Object source) throws OgnlException", note: "ASTBitOr.getValueBody"}
  - {class: ognl.ASTChain, method: getLastExpression, match: "()", note: "ASTChain.getLastExpression"}
