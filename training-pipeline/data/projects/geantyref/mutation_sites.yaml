# Curated performance-mutation sites for geantyref (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants geantyref --source data/external-src/<checkout> \
#       --sites data/projects/geantyref/mutation_sites.yaml

package_root: io.leangen.geantyref

sites:
  - {class: io.leangen.geantyref.AnnotatedArrayTypeImpl, method: getAnnotatedGenericComponentType, match: "()", note: "AnnotatedArrayTypeImpl.getAnnotatedGenericComponentType"}
  - {class: io.leangen.geantyref.AnnotatedTypeMap, method: size, match: "()", note: "AnnotatedTypeMap.size"}
  - {class: io.leangen.geantyref.AnnotatedTypeMap, method: isEmpty, match: "()", note: "AnnotatedTypeMap.isEmpty"}
  - {class: io.leangen.geantyref.AnnotatedTypeMap, method: containsKey, match: "(Object key)", note: "AnnotatedTypeMap.containsKey"}
  - {class: io.leangen.geantyref.AnnotatedTypeMap, method: containsValue, match: "(Object value)", note: "AnnotatedTypeMap.containsValue"}
  - {class: io.leangen.geantyref.AnnotatedTypeMap, method: putAll, match: "(Map<? extends K, ? extends V> m)", note: "AnnotatedTypeMap.putAll"}
  - {class: io.leangen.geantyref.AnnotatedTypeMap, method: clear, match: "()", note: "AnnotatedTypeMap.clear"}
  - {class: io.leangen.geantyref.AnnotatedTypeSet, method: size, match: "()", note: "AnnotatedTypeSet.size"}
  - {class: io.leangen.geantyref.AnnotatedTypeSet, method: isEmpty, match: "()", note: "AnnotatedTypeSet.isEmpty"}
  - {class: io.leangen.geantyref.AnnotatedTypeSet, method: iterator, match: "()", note: "AnnotatedTypeSet.iterator"}
  - {class: io.leangen.geantyref.AnnotatedTypeSet, method: toArray, match: "()", note: "AnnotatedTypeSet.toArray"}
  - {class: io.leangen.geantyref.AnnotatedTypeSet, method: toArray, match: "(T[] a)", note: "AnnotatedTypeSet.toArray"}
  - {class: io.leangen.geantyref.AnnotatedTypeSet, method: containsAll, match: "(Collection<?> c)", note: "AnnotatedTypeSet.containsAll"}
  - {class: io.leangen.geantyref.GenericArrayTypeImpl, method: getGenericComponentType, match: "()", note: "GenericArrayTypeImpl.getGenericComponentType"}
  - {class: io.leangen.geantyref.AnnotatedCaptureTypeImpl, method: getDeclaredAnnotations, match: "()", note: "AnnotatedCaptureTypeImpl.getDeclaredAnnotations"}
  - {class: io.leangen.geantyref.AnnotatedCaptureTypeImpl, method: getAnnotatedUpperBounds, match: "()", note: "AnnotatedCaptureTypeImpl.getAnnotatedUpperBounds"}
  - {class: io.leangen.geantyref.AnnotatedCaptureTypeImpl, method: setAnnotatedUpperBounds, match: "(AnnotatedType[] upperBounds)", note: "AnnotatedCaptureTypeImpl.setAnnotatedUpperBounds"}
  - {class: io.leangen.geantyref.AnnotatedCaptureTypeImpl, method: getAnnotatedLowerBounds, match: "()", note: "AnnotatedCaptureTypeImpl.getAnnotatedLowerBounds"}
  - {class: io.leangen.geantyref.AnnotatedCaptureTypeImpl, method: getAnnotatedTypeVariable, match: "()", note: "AnnotatedCaptureTypeImpl.getAnnotatedTypeVariable"}
  - {class: io.leangen.geantyref.AnnotatedCaptureTypeImpl, method: getAnnotatedWildcardType, match: "()", note: "AnnotatedCaptureTypeImpl.getAnnotatedWildcardType"}
  - {class: io.leangen.geantyref.AnnotatedParameterizedTypeImpl, method: getAnnotatedActualTypeArguments, match: "()", note: "AnnotatedParameterizedTypeImpl.getAnnotatedActualTypeArguments"}
  - {class: io.leangen.geantyref.AnnotatedTypeImpl, method: getAnnotation, match: "(Class<T> annotationClass)", note: "AnnotatedTypeImpl.getAnnotation"}
  - {class: io.leangen.geantyref.AnnotatedTypeImpl, method: getAnnotations, match: "()", note: "AnnotatedTypeImpl.getAnnotations"}
  - {class: io.leangen.geantyref.AnnotatedTypeImpl, method: getDeclaredAnnotations, match: "()", note: "AnnotatedTypeImpl.getDeclaredAnnotations"}
  - {class: io.leangen.geantyref.AnnotatedTypeImpl, method: getAnnotatedOwnerType, match: "()", note: "AnnotatedTypeImpl.getAnnotatedOwnerType"}
  - {class: io.leangen.geantyref.AnnotatedTypeImpl, method: toMap, match: "(Annotation[] annotations)", note: "AnnotatedTypeImpl.toMap"}
  - {class: io.leangen.geantyref.AnnotatedTypeVariableImpl, method: getAnnotatedBounds, match: "()", note: "AnnotatedTypeVariableImpl.getAnnotatedBounds"}
  - {class: io.leangen.geantyref.AnnotatedWildcardTypeImpl, method: getAnnotatedLowerBounds, match: "()", note: "AnnotatedWildcardTypeImpl.getAnnotatedLowerBounds"}
  - {class: io.leangen.geantyref.AnnotatedWildcardTypeImpl, method: getAnnotatedUpperBounds, match: "()", note: "AnnotatedWildcardTypeImpl.getAnnotatedUpperBounds"}
  - {class: io.leangen.geantyref.AnnotationInvocationHandler, method: invoke, match: "(Object proxy, Method method, Object[] args) throws Throwable", note: "AnnotationInvocationHandler.invoke"}
  - {class: io.leangen.geantyref.AnnotationInvocationHandler, method: annotationType, match: "()", note: "AnnotationInvocationHandler.annotationType"}
  - {class: io.leangen.geantyref.CaptureTypeImpl, method: getLowerBounds, match: "()", note: "CaptureTypeImpl.getLowerBounds"}
