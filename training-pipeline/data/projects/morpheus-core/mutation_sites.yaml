  - {class: com.zavtech.morpheus.source.CsvSourceOptions, method: getRowAxisType, match: "()", note: "CsvSourceOptions.getRowAxisType"}
  - {class: com.zavtech.morpheus.stats.Correlation, method: reset, match: "()", note: "Correlation.reset"}
  - {class: com.zavtech.morpheus.util.Mapper, method: apply, match: "(List<I> list, boolean parallel, ListMapper<I,O> listMapper)", note: "Mapper.apply"}
  - {class: com.zavtech.morpheus.array.ArrayReadOnly, method: length, match: "()", note: "ArrayReadOnly.length"}
  - {class: com.zavtech.morpheus.frame.DataFrameOptions, method: initialValue, match: "()", note: "DataFrameOptions.initialValue"}
  - {class: com.zavtech.morpheus.index.IndexOfDoubles, method: filter, match: "(Iterable<Double> keys)", note: "IndexOfDoubles.filter"}
  - {class: com.zavtech.morpheus.jama.EigenDecomposition, method: getRealEigenvalues, match: "()", note: "EigenDecomposition.getRealEigenvalues"}
  - {class: com.zavtech.morpheus.range.RangeOfLocalDateTimes, method: isAscending, match: "()", note: "RangeOfLocalDateTimes.isAscending"}
  - {class: com.zavtech.morpheus.reference.XDataFrameCalculate, method: logReturns, match: "()", note: "XDataFrameCalculate.logReturns"}
  - {class: com.zavtech.morpheus.sink.JsonSinkOptions, method: getFormats, match: "()", note: "JsonSinkOptions.getFormats"}
  - {class: com.zavtech.morpheus.source.DbSourceOptions, method: validate, match: "()", note: "DbSourceOptions.validate"}
  - {class: com.zavtech.morpheus.stats.Count, method: getN, match: "()", note: "Count.getN"}
  - {class: com.zavtech.morpheus.util.TextStreamReader, method: nextLine, match: "()", note: "TextStreamReader.nextLine"}
