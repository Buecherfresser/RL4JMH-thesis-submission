# Curated performance-mutation sites for datasketches-java (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants datasketches-java --source data/external-src/<checkout> \
#       --sites data/projects/datasketches-java/mutation_sites.yaml

package_root: org.apache.datasketches

sites:
  - {class: org.apache.datasketches.common.ArrayOfBooleansSerDe, method: computeBytesNeeded, match: "(final int arrayLength)", note: "ArrayOfBooleansSerDe.computeBytesNeeded"}
  - {class: org.apache.datasketches.count.CountMinSketch, method: isEmpty, match: "()", note: "CountMinSketch.isEmpty"}
  - {class: org.apache.datasketches.cpc.StreamingValidation, method: start, match: "()", note: "StreamingValidation.start"}
  - {class: org.apache.datasketches.fdt.FdtSketch, method: getPostProcessor, match: "()", note: "FdtSketch.getPostProcessor"}
  - {class: org.apache.datasketches.filters.bloomfilter.BloomFilterBuilder, method: suggestNumHashes, match: "(final long maxDistinctItems, final long numFilterBits)", note: "BloomFilterBuilder.suggestNumHashes"}
  - {class: org.apache.datasketches.frequencies.PreambleUtil, method: preambleToString, match: "(final MemorySegment srcSeg)", note: "PreambleUtil.preambleToString"}
  - {class: org.apache.datasketches.hash.MurmurHash3, method: hash, match: "(final long key, final long seed)", note: "MurmurHash3.hash"}
  - {class: org.apache.datasketches.hll.DirectAuxHashMap, method: getAuxCount, match: "()", note: "DirectAuxHashMap.getAuxCount"}
  - {class: org.apache.datasketches.hllmap.UniqueCountMap, method: getEstimate, match: "(final byte[] key)", note: "UniqueCountMap.getEstimate"}
  - {class: org.apache.datasketches.kll.KllDirectCompactItemsSketch, method: getK, match: "()", note: "KllDirectCompactItemsSketch.getK"}
  - {class: org.apache.datasketches.partitions.Partitioner, method: partition, match: "(final S sk)", note: "Partitioner.partition"}
  - {class: org.apache.datasketches.quantiles.ClassicUtil, method: getNormalizedRankError, match: "(final int k, final boolean pmf)", note: "ClassicUtil.getNormalizedRankError"}
  - {class: org.apache.datasketches.quantilescommon.QuantilesUtil, method: checkNormalizedRankBounds, match: "(final double nRank)", note: "QuantilesUtil.checkNormalizedRankBounds"}
  - {class: org.apache.datasketches.req.ReqSketchBuilder, method: build, match: "()", note: "ReqSketchBuilder.build"}
  - {class: org.apache.datasketches.sampling.SamplingUtil, method: rand, match: "()", note: "SamplingUtil.rand"}
  - {class: org.apache.datasketches.tdigest.Sort, method: stableSort, match: "(final double[] keys, final long[] values, final int n)", note: "Sort.stableSort"}
  - {class: org.apache.datasketches.theta.ConcurrentHeapThetaBuffer, method: getCompactBytes, match: "()", note: "ConcurrentHeapThetaBuffer.getCompactBytes"}
  - {class: org.apache.datasketches.thetacommon.BoundsOnRatiosInThetaSketchedSets, method: getLowerBoundForBoverA, match: "(final ThetaSketch sketchA, final ThetaSketch sketchB)", note: "BoundsOnRatiosInThetaSketchedSets.getLowerBoundForBoverA"}
  - {class: org.apache.datasketches.tuple.UpdatableTupleSketchBuilder, method: setNominalEntries, match: "(final int nomEntries)", note: "UpdatableTupleSketchBuilder.setNominalEntries"}
  - {class: org.apache.datasketches.common.ArrayOfBooleansSerDe, method: serializeToByteArray, match: "(final Boolean item)", note: "ArrayOfBooleansSerDe.serializeToByteArray"}
  - {class: org.apache.datasketches.count.CountMinSketch, method: getNumHashes_, match: "()", note: "CountMinSketch.getNumHashes_"}
  - {class: org.apache.datasketches.cpc.CompressionCharacterization, method: start, match: "()", note: "CompressionCharacterization.start"}
  - {class: org.apache.datasketches.fdt.FdtSketch, method: getPostProcessor, match: "(final Group group, final char sep)", note: "FdtSketch.getPostProcessor"}
  - {class: org.apache.datasketches.filters.bloomfilter.BloomFilterBuilder, method: suggestNumHashes, match: "(final double targetFalsePositiveProb)", note: "BloomFilterBuilder.suggestNumHashes"}
  - {class: org.apache.datasketches.frequencies.FrequentItemsSketch, method: getAprioriError, match: "(final int maxMapSize, final long estimatedTotalStreamWeight)", note: "FrequentItemsSketch.getAprioriError"}
  - {class: org.apache.datasketches.hash.MurmurHash3, method: hash, match: "(final long[] key, final long seed)", note: "MurmurHash3.hash"}
  - {class: org.apache.datasketches.hll.DirectAuxHashMap, method: getAuxIntArr, match: "()", note: "DirectAuxHashMap.getAuxIntArr"}
  - {class: org.apache.datasketches.hllmap.UniqueCountMap, method: getUpperBound, match: "(final byte[] key)", note: "UniqueCountMap.getUpperBound"}
  - {class: org.apache.datasketches.kll.KllDirectCompactItemsSketch, method: getMaxItem, match: "()", note: "KllDirectCompactItemsSketch.getMaxItem"}
  - {class: org.apache.datasketches.quantiles.ClassicUtil, method: getKFromEpsilon, match: "(final double epsilon, final boolean pmf)", note: "ClassicUtil.getKFromEpsilon"}
