# Curated performance-mutation sites for remap (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants remap --source data/external-src/<checkout> \
#       --sites data/projects/remap/mutation_sites.yaml

package_root: com.remondis.remap

sites:
  - {class: com.remondis.remap.AssertMapping, method: of, match: "(Mapper<S, D> mapper)", note: "AssertMapping.of"}
  - {class: com.remondis.remap.utils.mapOver.MapOver, method: mapProperty, match: "(Function<T, TT> propertyExtractor, BiConsumer<T, TT> propertyWriter)", note: "MapOver.mapProperty"}
  - {class: com.remondis.remap.BidirectionalMapper, method: of, match: "(Mapper<S, D> to, Mapper<D, S> from)", note: "BidirectionalMapper.of"}
  - {class: com.remondis.remap.utils.mapOver.MapOver, method: addPropertyAction, match: "(Function<T, TT> propertyExtractor, BiConsumer<T, TT> propertyWriter,", note: "MapOver.addPropertyAction"}
  - {class: com.remondis.remap.BidirectionalMapper, method: map, match: "(S source)", note: "BidirectionalMapper.map"}
  - {class: com.remondis.remap.utils.propertywalker.GetSet, method: create, match: "(T object, Function<T, P> propertyExtractor,", note: "GetSet.create"}
  - {class: com.remondis.remap.MappedResult, method: value, match: "(Object value)", note: "MappedResult.value"}
  - {class: com.remondis.remap.utils.propertywalker.BiPropertyVisitor, method: execute, match: "(T source, T target)", note: "BiPropertyVisitor.execute"}
  - {class: com.remondis.remap.MappedResult, method: getValue, match: "()", note: "MappedResult.getValue"}
  - {class: com.remondis.remap.utils.propertywalker.BiRecursivePropertyWalker, method: goInto, match: "(Function<T, TT> propertyExtractor,", note: "BiRecursivePropertyWalker.goInto"}
  - {class: com.remondis.remap.Mapper, method: map, match: "(S source)", note: "Mapper.map"}
  - {class: com.remondis.remap.utils.propertywalker.BiRecursivePropertyWalker, method: consume, match: "(PropertyAccess<T, TT> access)", note: "BiRecursivePropertyWalker.consume"}
  - {class: com.remondis.remap.Mapper, method: map, match: "(S source, D destination)", note: "Mapper.map"}
  - {class: com.remondis.remap.utils.propertywalker.PropertyAccess, method: source, match: "()", note: "PropertyAccess.source"}
  - {class: com.remondis.remap.MapperAdapter, method: map, match: "(S source, D destination)", note: "MapperAdapter.map"}
  - {class: com.remondis.remap.utils.propertywalker.PropertyAccess, method: target, match: "()", note: "PropertyAccess.target"}
  - {class: com.remondis.remap.MapperAdapter, method: map, match: "(S source)", note: "MapperAdapter.map"}
  - {class: com.remondis.remap.Mapping, method: from, match: "(Class<S> source)", note: "Mapping.from"}
  - {class: com.remondis.remap.Mapping, method: from, match: "(S sourceInstance)", note: "Mapping.from"}
  - {class: com.remondis.remap.MappingConfiguration, method: omitInDestination, match: "(FieldSelector<D> destinationSelector)", note: "MappingConfiguration.omitInDestination"}
  - {class: com.remondis.remap.MappingConfiguration, method: omitOthers, match: "()", note: "MappingConfiguration.omitOthers"}
  - {class: com.remondis.remap.MappingModel, method: findMappingBySource, match: "(Predicate<String> sourcePropertySelector)", note: "MappingModel.findMappingBySource"}
  - {class: com.remondis.remap.MappingModel, method: findMappingByDestination, match: "(Predicate<String> destinationPropertySelector)", note: "MappingModel.findMappingByDestination"}
  - {class: com.remondis.remap.PropertyPathAndApplyBuilder, method: apply, match: "(Function<X, RD> transformation)", note: "PropertyPathAndApplyBuilder.apply"}
  - {class: com.remondis.remap.PropertyPathAndApplyCollectionBuilder, method: apply, match: "(Function<X, RD> transformation)", note: "PropertyPathAndApplyCollectionBuilder.apply"}
  - {class: com.remondis.remap.ReassignAssertBuilder, method: to, match: "(FieldSelector<D> destinationSelector)", note: "ReassignAssertBuilder.to"}
  - {class: com.remondis.remap.ReassignBuilder, method: to, match: "(FieldSelector<D> destinationSelector)", note: "ReassignBuilder.to"}
  - {class: com.remondis.remap.ReflectionUtil, method: isBuildInType, match: "(Class<?> type)", note: "ReflectionUtil.isBuildInType"}
  - {class: com.remondis.remap.ReflectionUtil, method: isWrapper, match: "(Class<?> type1, Class<?> type2)", note: "ReflectionUtil.isWrapper"}
  - {class: com.remondis.remap.ReplaceAssertBuilder, method: withPropertyPath, match: "(PropertyPath<RD, RS, E> propertyPath)", note: "ReplaceAssertBuilder.withPropertyPath"}
  - {class: com.remondis.remap.ReplaceAssertBuilder, method: withPropertyPathAndTransformation, match: "(PropertyPath<?, RS, ?> propertyPath)", note: "ReplaceAssertBuilder.withPropertyPathAndTransformation"}
  - {class: com.remondis.remap.ReplaceBuilder, method: withPropertyPath, match: "(PropertyPath<RD, RS, E> propertyPath)", note: "ReplaceBuilder.withPropertyPath"}
  - {class: com.remondis.remap.ReplaceBuilder, method: withPropertyPathAnd, match: "(", note: "ReplaceBuilder.withPropertyPathAnd"}
  - {class: com.remondis.remap.ReplaceCollectionAssertBuilder, method: withPropertyPath, match: "(PropertyPath<RD, RS, E> propertyPath)", note: "ReplaceCollectionAssertBuilder.withPropertyPath"}
  - {class: com.remondis.remap.ReplaceCollectionAssertBuilder, method: withPropertyPathAndTransformation, match: "(PropertyPath<?, RS, ?> propertyPath)", note: "ReplaceCollectionAssertBuilder.withPropertyPathAndTransformation"}
  - {class: com.remondis.remap.ReplaceCollectionBuilder, method: withPropertyPath, match: "(PropertyPath<RD, RS, E> propertyPath)", note: "ReplaceCollectionBuilder.withPropertyPath"}
  - {class: com.remondis.remap.ReplaceCollectionBuilder, method: withPropertyPathAnd, match: "(", note: "ReplaceCollectionBuilder.withPropertyPathAnd"}
  - {class: com.remondis.remap.RestructureAssertBuilder, method: implicitly, match: "()", note: "RestructureAssertBuilder.implicitly"}
  - {class: com.remondis.remap.RestructureAssertBuilder, method: applying, match: "(", note: "RestructureAssertBuilder.applying"}
  - {class: com.remondis.remap.RestructureBuilder, method: implicitly, match: "()", note: "RestructureBuilder.implicitly"}
  - {class: com.remondis.remap.RestructureBuilder, method: applying, match: "(Consumer<MappingConfiguration<S, RD>> restructureMappingConfiguration)", note: "RestructureBuilder.applying"}
  - {class: com.remondis.remap.SetAssertBuilder, method: withFunction, match: "()", note: "SetAssertBuilder.withFunction"}
  - {class: com.remondis.remap.SetAssertBuilder, method: withSupplier, match: "()", note: "SetAssertBuilder.withSupplier"}
  - {class: com.remondis.remap.SetBuilder, method: with, match: "(Function<S, RD> valueSupplier)", note: "SetBuilder.with"}
  - {class: com.remondis.remap.SetBuilder, method: with, match: "(Supplier<RD> valueSupplier)", note: "SetBuilder.with"}
  - {class: com.remondis.remap.SetTransformation, method: performTransformation, match: "(PropertyDescriptor sourceProperty, Object source,", note: "SetTransformation.performTransformation"}
  - {class: com.remondis.remap.SetTransformation, method: performValueTransformation, match: "(Object source, Object destination) throws MappingException", note: "SetTransformation.performValueTransformation"}
  - {class: com.remondis.remap.TypeMapping, method: to, match: "(Class<D> destination)", note: "TypeMapping.to"}
  - {class: com.remondis.remap.TypeMapping, method: applying, match: "(Function<S, D> conversionFunction)", note: "TypeMapping.applying"}
  - {class: com.remondis.remap.AssertConfiguration, method: expectReassign, match: "(FieldSelector<S> sourceSelector)", note: "AssertConfiguration.expectReassign"}
