# Curated performance-mutation sites for allgood-consistent-hash (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants allgood-consistent-hash --source data/external-src/<checkout> \
#       --sites data/projects/allgood-consistent-hash/mutation_sites.yaml

package_root: org.ishugaliy.allgood

sites:
  - {class: org.ishugaliy.allgood.consistent.hash.HashRingBuilder, method: name, match: "(String name)", note: "HashRingBuilder.name"}
  - {class: org.ishugaliy.allgood.consistent.hash.HashRingBuilder, method: hasher, match: "(Hasher hash)", note: "HashRingBuilder.hasher"}
  - {class: org.ishugaliy.allgood.consistent.hash.HashRingBuilder, method: partitionRate, match: "(int partitionRate)", note: "HashRingBuilder.partitionRate"}
  - {class: org.ishugaliy.allgood.consistent.hash.HashRingBuilder, method: nodes, match: "(Collection<T> nodes)", note: "HashRingBuilder.nodes"}
  - {class: org.ishugaliy.allgood.consistent.hash.HashRingBuilder, method: build, match: "()", note: "HashRingBuilder.build"}
  - {class: org.ishugaliy.allgood.consistent.hash.HashRing, method: newBuilder, match: "()", note: "HashRing.newBuilder"}
  - {class: org.ishugaliy.allgood.consistent.hash.HashRing, method: addAll, match: "(Collection<T> nodes)", note: "HashRing.addAll"}
  - {class: org.ishugaliy.allgood.consistent.hash.HashRing, method: getNodes, match: "()", note: "HashRing.getNodes"}
  - {class: org.ishugaliy.allgood.consistent.hash.HashRing, method: locate, match: "(String key)", note: "HashRing.locate"}
  - {class: org.ishugaliy.allgood.consistent.hash.HashRing, method: locate, match: "(String key, int count)", note: "HashRing.locate"}
  - {class: org.ishugaliy.allgood.consistent.hash.HashRing, method: getName, match: "()", note: "HashRing.getName"}
  - {class: org.ishugaliy.allgood.consistent.hash.HashRing, method: size, match: "()", note: "HashRing.size"}
  - {class: org.ishugaliy.allgood.consistent.hash.HashRing, method: getHasher, match: "()", note: "HashRing.getHasher"}
  - {class: org.ishugaliy.allgood.consistent.hash.HashRing, method: getPartitionRate, match: "()", note: "HashRing.getPartitionRate"}
  - {class: org.ishugaliy.allgood.consistent.hash.hasher.DefaultHasher, method: hash, match: "(String key, int seed)", note: "DefaultHasher.hash"}
  - {class: org.ishugaliy.allgood.consistent.hash.node.ServerNode, method: getDc, match: "()", note: "ServerNode.getDc"}
  - {class: org.ishugaliy.allgood.consistent.hash.node.ServerNode, method: getIp, match: "()", note: "ServerNode.getIp"}
  - {class: org.ishugaliy.allgood.consistent.hash.node.ServerNode, method: getPort, match: "()", note: "ServerNode.getPort"}
  - {class: org.ishugaliy.allgood.consistent.hash.node.ServerNode, method: getKey, match: "()", note: "ServerNode.getKey"}
  - {class: org.ishugaliy.allgood.consistent.hash.node.SimpleNode, method: of, match: "(String value)", note: "SimpleNode.of"}
  - {class: org.ishugaliy.allgood.consistent.hash.node.SimpleNode, method: getKey, match: "()", note: "SimpleNode.getKey"}
  - {class: org.ishugaliy.allgood.consistent.hash.partition.ReplicationPartition, method: getIndex, match: "()", note: "ReplicationPartition.getIndex"}
  - {class: org.ishugaliy.allgood.consistent.hash.partition.ReplicationPartition, method: getNode, match: "()", note: "ReplicationPartition.getNode"}
  - {class: org.ishugaliy.allgood.consistent.hash.partition.ReplicationPartition, method: getSlot, match: "()", note: "ReplicationPartition.getSlot"}
  - {class: org.ishugaliy.allgood.consistent.hash.partition.ReplicationPartition, method: setSlot, match: "(long slot)", note: "ReplicationPartition.setSlot"}
  - {class: org.ishugaliy.allgood.consistent.hash.partition.ReplicationPartition, method: getPartitionKey, match: "()", note: "ReplicationPartition.getPartitionKey"}
