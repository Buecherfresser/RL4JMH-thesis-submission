# Curated performance-mutation sites for latencyutils (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants latencyutils --source data/external-src/<checkout> \
#       --sites data/projects/latencyutils/mutation_sites.yaml

package_root: org.LatencyUtils

sites:
  - {class: org.LatencyUtils.LatencyStats, method: recordLatency, match: "(long latency)", note: "LatencyStats.recordLatency"}
  - {class: org.LatencyUtils.LatencyStats, method: getIntervalHistogram, match: "()", note: "LatencyStats.getIntervalHistogram"}
  - {class: org.LatencyUtils.LatencyStats, method: getIntervalHistogramInto, match: "(Histogram targetHistogram)", note: "LatencyStats.getIntervalHistogramInto"}
  - {class: org.LatencyUtils.LatencyStats, method: addIntervalHistogramTo, match: "(Histogram toHistogram)", note: "LatencyStats.addIntervalHistogramTo"}
  - {class: org.LatencyUtils.LatencyStats, method: getLatestUncorrectedIntervalHistogram, match: "()", note: "LatencyStats.getLatestUncorrectedIntervalHistogram"}
  - {class: org.LatencyUtils.LatencyStats, method: getLatestUncorrectedIntervalHistogramInto, match: "(Histogram targetHistogram)", note: "LatencyStats.getLatestUncorrectedIntervalHistogramInto"}
  - {class: org.LatencyUtils.LatencyStats, method: stop, match: "()", note: "LatencyStats.stop"}
  - {class: org.LatencyUtils.LatencyStats, method: getIntervalEstimator, match: "()", note: "LatencyStats.getIntervalEstimator"}
  - {class: org.LatencyUtils.LatencyStats, method: getPauseDetector, match: "()", note: "LatencyStats.getPauseDetector"}
  - {class: org.LatencyUtils.LatencyStats, method: create, match: "()", note: "LatencyStats.create"}
  - {class: org.LatencyUtils.LatencyStats, method: lowestTrackableLatency, match: "(long lowestTrackableLatency)", note: "LatencyStats.lowestTrackableLatency"}
  - {class: org.LatencyUtils.LatencyStats, method: highestTrackableLatency, match: "(long highestTrackableLatency)", note: "LatencyStats.highestTrackableLatency"}
  - {class: org.LatencyUtils.LatencyStats, method: numberOfSignificantValueDigits, match: "(int numberOfSignificantValueDigits)", note: "LatencyStats.numberOfSignificantValueDigits"}
  - {class: org.LatencyUtils.LatencyStats, method: intervalEstimatorWindowLength, match: "(int intervalEstimatorWindowLength)", note: "LatencyStats.intervalEstimatorWindowLength"}
  - {class: org.LatencyUtils.LatencyStats, method: intervalEstimatorTimeCap, match: "(long intervalEstimatorTimeCap)", note: "LatencyStats.intervalEstimatorTimeCap"}
  - {class: org.LatencyUtils.LatencyStats, method: pauseDetector, match: "(PauseDetector pauseDetector)", note: "LatencyStats.pauseDetector"}
  - {class: org.LatencyUtils.LatencyStats, method: build, match: "()", note: "LatencyStats.build"}
  - {class: org.LatencyUtils.LatencyStats, method: stop, match: "()", note: "LatencyStats.stop"}
  - {class: org.LatencyUtils.LatencyStats, method: handlePauseEvent, match: "(final long pauseLength, final long pauseEndTime)", note: "LatencyStats.handlePauseEvent"}
