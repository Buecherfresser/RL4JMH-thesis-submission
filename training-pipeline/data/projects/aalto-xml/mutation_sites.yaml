  - {class: com.fasterxml.aalto.out.RepairingStreamWriter, method: setDefaultNamespace, match: "(String uri)", note: "RepairingStreamWriter.setDefaultNamespace"}
  - {class: com.fasterxml.aalto.sax.SAXParserImpl, method: getParser, match: "()", note: "SAXParserImpl.getParser"}
  - {class: com.fasterxml.aalto.stax.EventFactoryImpl, method: createQName, match: "(String nsURI, String localName)", note: "EventFactoryImpl.createQName"}
  - {class: com.fasterxml.aalto.util.DataUtil, method: getEmptyCharArray, match: "()", note: "DataUtil.getEmptyCharArray"}
  - {class: com.fasterxml.aalto.ValidationException, method: getMessage, match: "()", note: "ValidationException.getMessage"}
  - {class: com.fasterxml.aalto.async.AsyncByteBufferScanner, method: _nextByte, match: "() throws XMLStreamException", note: "AsyncByteBufferScanner._nextByte"}
