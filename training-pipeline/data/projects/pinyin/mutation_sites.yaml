  - {class: com.github.houbb.pinyin.support.segment.CharPinyinSegment, method: segment, match: "(String string)", note: "CharPinyinSegment.segment"}
  - {class: com.github.houbb.pinyin.support.segment.CharPinyinSegment, method: handle, match: "(Character character)", note: "CharPinyinSegment.handle"}
