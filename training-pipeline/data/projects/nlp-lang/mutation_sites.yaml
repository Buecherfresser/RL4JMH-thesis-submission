# Curated performance-mutation sites for nlp-lang (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants nlp-lang --source data/external-src/<checkout> \
#       --sites data/projects/nlp-lang/mutation_sites.yaml

package_root: org.nlpcn.commons

sites:
  - {class: org.nlpcn.commons.lang.dat.DoubleArrayTire, method: getDAT, match: "()", note: "DoubleArrayTire.getDAT"}
  - {class: org.nlpcn.commons.lang.dat.DoubleArrayTire, method: getId, match: "(String str)", note: "DoubleArrayTire.getId"}
  - {class: org.nlpcn.commons.lang.pinyin.PinyinUtil, method: loadPinyinMapping, match: "()", note: "PinyinUtil.loadPinyinMapping"}
  - {class: org.nlpcn.commons.lang.pinyin.PinyinUtil, method: loadPolyphoneMapping, match: "()", note: "PinyinUtil.loadPolyphoneMapping"}
  - {class: org.nlpcn.commons.lang.standardization.SentencesUtil, method: toSentenceList, match: "(String content)", note: "SentencesUtil.toSentenceList"}
  - {class: org.nlpcn.commons.lang.standardization.SentencesUtil, method: toSentenceList, match: "(char[] chars)", note: "SentencesUtil.toSentenceList"}
  - {class: org.nlpcn.commons.lang.standardization.WordUtil, method: str2Elements, match: "(String str)", note: "WordUtil.str2Elements"}
  - {class: org.nlpcn.commons.lang.standardization.WordUtil, method: str2Str, match: "(String str)", note: "WordUtil.str2Str"}
  - {class: org.nlpcn.commons.lang.util.AnsjArrays, method: binarySearch, match: "(T[] branches, char c)", note: "AnsjArrays.binarySearch"}
  - {class: org.nlpcn.commons.lang.util.AnsjArrays, method: main, match: "(String[] args)", note: "AnsjArrays.main"}
  - {class: org.nlpcn.commons.lang.util.CollectionUtil, method: sortMapByValue, match: "(Map<K, V> map, final int sort)", note: "CollectionUtil.sortMapByValue"}
  - {class: org.nlpcn.commons.lang.util.CollectionUtil, method: as, match: "(K k1, V v1)", note: "CollectionUtil.as"}
  - {class: org.nlpcn.commons.lang.util.IOUtil, method: getInputStream, match: "(String path)", note: "IOUtil.getInputStream"}
  - {class: org.nlpcn.commons.lang.util.IOUtil, method: getReader, match: "(String path, String charEncoding) throws FileNotFoundException, UnsupportedEncodingException", note: "IOUtil.getReader"}
  - {class: org.nlpcn.commons.lang.util.MapCount, method: size, match: "()", note: "MapCount.size"}
  - {class: org.nlpcn.commons.lang.util.MapCount, method: getDic, match: "()", note: "MapCount.getDic"}
  - {class: org.nlpcn.commons.lang.util.MapFactory, method: hashMap, match: "()", note: "MapFactory.hashMap"}
  - {class: org.nlpcn.commons.lang.util.MapFactory, method: treeMap, match: "()", note: "MapFactory.treeMap"}
  - {class: org.nlpcn.commons.lang.util.StringUtil, method: rmHtmlTag, match: "(String input)", note: "StringUtil.rmHtmlTag"}
  - {class: org.nlpcn.commons.lang.util.StringUtil, method: isBlank, match: "(CharSequence cs)", note: "StringUtil.isBlank"}
  - {class: org.nlpcn.commons.lang.bloomFilter.BloomFilter, method: containsAndAdd, match: "(String str)", note: "BloomFilter.containsAndAdd"}
  - {class: org.nlpcn.commons.lang.bloomFilter.filter.DefaultFilter, method: myHashCode, match: "(String str)", note: "DefaultFilter.myHashCode"}
  - {class: org.nlpcn.commons.lang.bloomFilter.filter.ELFFilter, method: myHashCode, match: "(String str)", note: "ELFFilter.myHashCode"}
  - {class: org.nlpcn.commons.lang.bloomFilter.filter.FNVFilter, method: myHashCode, match: "(String str)", note: "FNVFilter.myHashCode"}
