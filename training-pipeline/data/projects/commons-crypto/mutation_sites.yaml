# Curated performance-mutation sites for commons-crypto (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants commons-crypto --source data/external-src/<checkout> \
#       --sites data/projects/commons-crypto/mutation_sites.yaml

package_root: org.apache.commons.crypto

sites:
  - {class: org.apache.commons.crypto.Crypto, method: getComponentName, match: "()", note: "Crypto.getComponentName"}
  - {class: org.apache.commons.crypto.cipher.CryptoCipherFactory, method: getClassName, match: "()", note: "CryptoCipherFactory.getClassName"}
  - {class: org.apache.commons.crypto.jna.LibreSsl20XNativeJna, method: _ENGINE_by_id, match: "(final String string)", note: "LibreSsl20XNativeJna._ENGINE_by_id"}
  - {class: org.apache.commons.crypto.random.CryptoRandomFactory, method: getClassName, match: "()", note: "CryptoRandomFactory.getClassName"}
  - {class: org.apache.commons.crypto.stream.CryptoInputStream, method: checkStream, match: "() throws IOException", note: "CryptoInputStream.checkStream"}
  - {class: org.apache.commons.crypto.utils.IoUtils, method: cleanup, match: "(final Closeable... closeables)", note: "IoUtils.cleanup"}
  - {class: org.apache.commons.crypto.Crypto, method: getComponentVersion, match: "()", note: "Crypto.getComponentVersion"}
  - {class: org.apache.commons.crypto.cipher.CryptoCipherFactory, method: getImplClass, match: "()", note: "CryptoCipherFactory.getImplClass"}
  - {class: org.apache.commons.crypto.jna.LibreSsl20XNativeJna, method: _ENGINE_cleanup, match: "()", note: "LibreSsl20XNativeJna._ENGINE_cleanup"}
  - {class: org.apache.commons.crypto.random.CryptoRandomFactory, method: getImplClass, match: "()", note: "CryptoRandomFactory.getImplClass"}
  - {class: org.apache.commons.crypto.stream.CryptoInputStream, method: close, match: "() throws IOException", note: "CryptoInputStream.close"}
  - {class: org.apache.commons.crypto.utils.IoUtils, method: closeQuietly, match: "(final Closeable closeable)", note: "IoUtils.closeQuietly"}
  - {class: org.apache.commons.crypto.OsInfo, method: main, match: "(final String[] args)", note: "OsInfo.main"}
  - {class: org.apache.commons.crypto.cipher.JceCipher, method: close, match: "()", note: "JceCipher.close"}
  - {class: org.apache.commons.crypto.jna.OpenSsl11XNativeJna, method: _ENGINE_by_id, match: "(final String string)", note: "OpenSsl11XNativeJna._ENGINE_by_id"}
  - {class: org.apache.commons.crypto.random.JavaCryptoRandom, method: close, match: "()", note: "JavaCryptoRandom.close"}
  - {class: org.apache.commons.crypto.stream.CryptoOutputStream, method: checkStream, match: "() throws IOException", note: "CryptoOutputStream.checkStream"}
  - {class: org.apache.commons.crypto.utils.ReflectionUtils, method: getClassByName, match: "(final String name) throws ClassNotFoundException", note: "ReflectionUtils.getClassByName"}
  - {class: org.apache.commons.crypto.cipher.JceCipher, method: getAlgorithm, match: "()", note: "JceCipher.getAlgorithm"}
  - {class: org.apache.commons.crypto.jna.OpenSsl11XNativeJna, method: _ENGINE_cleanup, match: "()", note: "OpenSsl11XNativeJna._ENGINE_cleanup"}
  - {class: org.apache.commons.crypto.random.JavaCryptoRandom, method: nextBytes, match: "(final byte[] bytes)", note: "JavaCryptoRandom.nextBytes"}
  - {class: org.apache.commons.crypto.stream.CryptoOutputStream, method: close, match: "() throws IOException", note: "CryptoOutputStream.close"}
  - {class: org.apache.commons.crypto.utils.ReflectionUtils, method: newInstance, match: "(final Class<T> klass, final Object... args)", note: "ReflectionUtils.newInstance"}
  - {class: org.apache.commons.crypto.cipher.OpenSsl, method: getLoadingFailureReason, match: "()", note: "OpenSsl.getLoadingFailureReason"}
  - {class: org.apache.commons.crypto.jna.OpenSsl30XNativeJna, method: _ENGINE_by_id, match: "(final String string)", note: "OpenSsl30XNativeJna._ENGINE_by_id"}
  - {class: org.apache.commons.crypto.random.OpenSslCryptoRandom, method: isNativeCodeEnabled, match: "()", note: "OpenSslCryptoRandom.isNativeCodeEnabled"}
  - {class: org.apache.commons.crypto.stream.CtrCryptoInputStream, method: decrypt, match: "() throws IOException", note: "CtrCryptoInputStream.decrypt"}
  - {class: org.apache.commons.crypto.utils.Utils, method: checkArgument, match: "(final boolean expression)", note: "Utils.checkArgument"}
  - {class: org.apache.commons.crypto.cipher.OpenSsl, method: clean, match: "()", note: "OpenSsl.clean"}
  - {class: org.apache.commons.crypto.jna.OpenSsl30XNativeJna, method: _ENGINE_cleanup, match: "()", note: "OpenSsl30XNativeJna._ENGINE_cleanup"}
  - {class: org.apache.commons.crypto.random.OpenSslCryptoRandom, method: close, match: "()", note: "OpenSslCryptoRandom.close"}
  - {class: org.apache.commons.crypto.stream.CtrCryptoInputStream, method: decryptBuffer, match: "(final ByteBuffer out) throws IOException", note: "CtrCryptoInputStream.decryptBuffer"}
  - {class: org.apache.commons.crypto.utils.Utils, method: checkArgument, match: "(final boolean expression, final Object errorMessage)", note: "Utils.checkArgument"}
