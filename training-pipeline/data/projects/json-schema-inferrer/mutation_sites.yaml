# Curated performance-mutation sites for json-schema-inferrer (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants json-schema-inferrer --source data/external-src/<checkout> \
#       --sites data/projects/json-schema-inferrer/mutation_sites.yaml

