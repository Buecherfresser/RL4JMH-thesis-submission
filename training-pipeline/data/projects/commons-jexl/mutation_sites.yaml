# Curated performance-mutation sites for commons-jexl (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants commons-jexl --source data/external-src/<checkout> \
#       --sites data/projects/commons-jexl/mutation_sites.yaml

package_root: org.apache.commons

sites:
  - {class: org.apache.commons.jexl3.JexlBuilder, method: setDefaultPermissions, match: "(final JexlPermissions permissions)", note: "JexlBuilder.setDefaultPermissions"}
  - {class: org.apache.commons.jexl3.JexlBuilder, method: setDefaultFeatures, match: "(final JexlFeatures features)", note: "JexlBuilder.setDefaultFeatures"}
  - {class: org.apache.commons.jexl3.MapContext, method: clear, match: "()", note: "MapContext.clear"}
  - {class: org.apache.commons.jexl3.MapContext, method: has, match: "(final String name)", note: "MapContext.has"}
  - {class: org.apache.commons.jexl3.internal.ArrayBuilder, method: unboxingClass, match: "(final Class<?> parm)", note: "ArrayBuilder.unboxingClass"}
  - {class: org.apache.commons.jexl3.internal.ArrayBuilder, method: create, match: "(final boolean e)", note: "ArrayBuilder.create"}
  - {class: org.apache.commons.jexl3.internal.MapBuilder, method: create, match: "()", note: "MapBuilder.create"}
  - {class: org.apache.commons.jexl3.internal.SetBuilder, method: create, match: "()", note: "SetBuilder.create"}
  - {class: org.apache.commons.jexl3.internal.introspection.ArrayListWrapper, method: indexOf, match: "(final Object o)", note: "ArrayListWrapper.indexOf"}
  - {class: org.apache.commons.jexl3.internal.introspection.ArrayListWrapper, method: iterator, match: "()", note: "ArrayListWrapper.iterator"}
  - {class: org.apache.commons.jexl3.internal.introspection.ClassMap, method: cacheMiss, match: "()", note: "ClassMap.cacheMiss"}
  - {class: org.apache.commons.jexl3.internal.introspection.ClassMap, method: entrySet, match: "()", note: "ClassMap.entrySet"}
  - {class: org.apache.commons.jexl3.internal.introspection.DuckSetExecutor, method: discover, match: "(final Introspector is, final Class<?> clazz, final Object key, final Object value)", note: "DuckSetExecutor.discover"}
  - {class: org.apache.commons.jexl3.internal.introspection.DuckSetExecutor, method: getTargetProperty, match: "()", note: "DuckSetExecutor.getTargetProperty"}
  - {class: org.apache.commons.jexl3.internal.introspection.FieldSetExecutor, method: discover, match: "(final Introspector is,", note: "FieldSetExecutor.discover"}
  - {class: org.apache.commons.jexl3.internal.introspection.FieldSetExecutor, method: invoke, match: "(final Object obj, final Object arg) throws Exception", note: "FieldSetExecutor.invoke"}
  - {class: org.apache.commons.jexl3.internal.introspection.ListGetExecutor, method: discover, match: "(final Introspector is, final Class<?> clazz, final Integer index)", note: "ListGetExecutor.discover"}
  - {class: org.apache.commons.jexl3.internal.introspection.ListGetExecutor, method: getTargetProperty, match: "()", note: "ListGetExecutor.getTargetProperty"}
  - {class: org.apache.commons.jexl3.internal.introspection.ListSetExecutor, method: discover, match: "(final Introspector is,", note: "ListSetExecutor.discover"}
  - {class: org.apache.commons.jexl3.internal.introspection.ListSetExecutor, method: getTargetProperty, match: "()", note: "ListSetExecutor.getTargetProperty"}
  - {class: org.apache.commons.jexl3.internal.introspection.MapGetExecutor, method: discover, match: "(final Introspector is, final Class<?> clazz, final Object identifier)", note: "MapGetExecutor.discover"}
  - {class: org.apache.commons.jexl3.internal.introspection.MapGetExecutor, method: getTargetProperty, match: "()", note: "MapGetExecutor.getTargetProperty"}
  - {class: org.apache.commons.jexl3.internal.introspection.MapSetExecutor, method: discover, match: "(final Introspector is,", note: "MapSetExecutor.discover"}
  - {class: org.apache.commons.jexl3.internal.introspection.MapSetExecutor, method: getTargetProperty, match: "()", note: "MapSetExecutor.getTargetProperty"}
  - {class: org.apache.commons.jexl3.internal.introspection.PermissionsParser, method: parse, match: "(final String... srcs)", note: "PermissionsParser.parse"}
  - {class: org.apache.commons.jexl3.internal.introspection.PropertySetExecutor, method: discover, match: "(final Introspector is,", note: "PropertySetExecutor.discover"}
  - {class: org.apache.commons.jexl3.internal.introspection.PropertySetExecutor, method: getTargetProperty, match: "()", note: "PropertySetExecutor.getTargetProperty"}
  - {class: org.apache.commons.jexl3.parser.ASTArrayAccess, method: isSafeChild, match: "(final int c)", note: "ASTArrayAccess.isSafeChild"}
  - {class: org.apache.commons.jexl3.parser.ASTArrayAccess, method: isSafeLhs, match: "(final boolean safe)", note: "ASTArrayAccess.isSafeLhs"}
  - {class: org.apache.commons.jexl3.parser.ASTArrayLiteral, method: jjtAccept, match: "(final ParserVisitor visitor, final Object data)", note: "ASTArrayLiteral.jjtAccept"}
  - {class: org.apache.commons.jexl3.parser.ASTMapLiteral, method: jjtAccept, match: "(final ParserVisitor visitor, final Object data)", note: "ASTMapLiteral.jjtAccept"}
  - {class: org.apache.commons.jexl3.parser.ASTNumberLiteral, method: getLiteral, match: "()", note: "ASTNumberLiteral.getLiteral"}
  - {class: org.apache.commons.jexl3.parser.ASTNumberLiteral, method: getLiteralClass, match: "()", note: "ASTNumberLiteral.getLiteralClass"}
  - {class: org.apache.commons.jexl3.parser.ASTSetLiteral, method: jjtAccept, match: "(final ParserVisitor visitor, final Object data)", note: "ASTSetLiteral.jjtAccept"}
  - {class: org.apache.commons.jexl3.parser.ASTStringLiteral, method: getLiteral, match: "()", note: "ASTStringLiteral.getLiteral"}
  - {class: org.apache.commons.jexl3.parser.ASTStringLiteral, method: isConstant, match: "(final boolean literal)", note: "ASTStringLiteral.isConstant"}
  - {class: org.apache.commons.jexl3.parser.StringParser, method: buildRegex, match: "(final CharSequence str)", note: "StringParser.buildRegex"}
  - {class: org.apache.commons.jexl3.parser.StringParser, method: buildString, match: "(final CharSequence str, final boolean eatsep)", note: "StringParser.buildString"}
  - {class: org.apache.commons.jexl3.JexlArithmetic, method: isMultiplyExact, match: "(final long x, final long y, final long r)", note: "JexlArithmetic.isMultiplyExact"}
  - {class: org.apache.commons.jexl3.JexlArithmetic, method: and, match: "(final Object left, final Object right)", note: "JexlArithmetic.and"}
  - {class: org.apache.commons.jexl3.JexlConfigLoader, method: load, match: "(final InputStream in) throws IOException", note: "JexlConfigLoader.load"}
  - {class: org.apache.commons.jexl3.JexlConfigLoader, method: load, match: "(final Reader reader) throws IOException", note: "JexlConfigLoader.load"}
  - {class: org.apache.commons.jexl3.JexlException, method: detailedMessage, match: "()", note: "JexlException.detailedMessage"}
  - {class: org.apache.commons.jexl3.JexlException, method: tryCleanSource, match: "(final String src)", note: "JexlException.tryCleanSource"}
  - {class: org.apache.commons.jexl3.JexlFeatures, method: createAll, match: "()", note: "JexlFeatures.createAll"}
  - {class: org.apache.commons.jexl3.JexlFeatures, method: createDefault, match: "()", note: "JexlFeatures.createDefault"}
  - {class: org.apache.commons.jexl3.JexlInfo, method: from, match: "(final JexlScript script)", note: "JexlInfo.from"}
  - {class: org.apache.commons.jexl3.JexlInfo, method: at, match: "(final int l, final int c)", note: "JexlInfo.at"}
  - {class: org.apache.commons.jexl3.JexlOperator, method: getArity, match: "()", note: "JexlOperator.getArity"}
  - {class: org.apache.commons.jexl3.JexlOperator, method: getBaseOperator, match: "()", note: "JexlOperator.getBaseOperator"}
