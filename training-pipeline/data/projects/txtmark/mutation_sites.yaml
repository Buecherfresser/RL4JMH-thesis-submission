# Curated performance-mutation sites for txtmark (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants txtmark --source data/external-src/<checkout> \
#       --sites data/projects/txtmark/mutation_sites.yaml

package_root: com.github.rjeschke

sites:
  - {class: com.github.rjeschke.txtmark.Utils, method: rnd, match: "()", note: "Utils.rnd"}
  - {class: com.github.rjeschke.txtmark.Utils, method: skipSpaces, match: "(final String in, final int start)", note: "Utils.skipSpaces"}
  - {class: com.github.rjeschke.txtmark.Utils, method: escape, match: "(final StringBuilder out, final char ch, final int pos)", note: "Utils.escape"}
  - {class: com.github.rjeschke.txtmark.Utils, method: readUntil, match: "(final StringBuilder out, final String in, final int start, final char... end)", note: "Utils.readUntil"}
  - {class: com.github.rjeschke.txtmark.Utils, method: readUntil, match: "(final StringBuilder out, final String in, final int start, final char end)", note: "Utils.readUntil"}
  - {class: com.github.rjeschke.txtmark.Utils, method: readMdLink, match: "(final StringBuilder out, final String in, final int start)", note: "Utils.readMdLink"}
  - {class: com.github.rjeschke.txtmark.cmd.CmdLineParser, method: generateHelp, match: "(final int columnWidth, final boolean sort, final Object... objs)", note: "CmdLineParser.generateHelp"}
  - {class: com.github.rjeschke.txtmark.cmd.CmdLineParser, method: parse, match: "(final String[] args, final Object... objs) throws IOException", note: "CmdLineParser.parse"}
  - {class: com.github.rjeschke.txtmark.cmd.CmdLineParser, method: getResolvedType, match: "()", note: "CmdLineParser.getResolvedType"}
  - {class: com.github.rjeschke.txtmark.cmd.CmdLineParser, method: isCatchAll, match: "()", note: "CmdLineParser.isCatchAll"}
  - {class: com.github.rjeschke.txtmark.cmd.CmdLineParser, method: isList, match: "()", note: "CmdLineParser.isList"}
  - {class: com.github.rjeschke.txtmark.cmd.CmdLineParser, method: setCatchAll, match: "(final List<String> list) throws IOException", note: "CmdLineParser.setCatchAll"}
  - {class: com.github.rjeschke.txtmark.cmd.HlUtils, method: highlight, match: "(final List<String> lines, final String meta, final String prog, final String encoding)", note: "HlUtils.highlight"}
  - {class: com.github.rjeschke.txtmark.cmd.HlUtils, method: escapedAdd, match: "(final StringBuilder sb, final String str)", note: "HlUtils.escapedAdd"}
  - {class: com.github.rjeschke.txtmark.Block, method: hasLines, match: "()", note: "Block.hasLines"}
  - {class: com.github.rjeschke.txtmark.Block, method: removeSurroundingEmptyLines, match: "()", note: "Block.removeSurroundingEmptyLines"}
  - {class: com.github.rjeschke.txtmark.Block, method: transfromHeadline, match: "()", note: "Block.transfromHeadline"}
  - {class: com.github.rjeschke.txtmark.Block, method: removeListIndent, match: "(final Configuration configuration)", note: "Block.removeListIndent"}
  - {class: com.github.rjeschke.txtmark.Block, method: removeBlockQuotePrefix, match: "()", note: "Block.removeBlockQuotePrefix"}
  - {class: com.github.rjeschke.txtmark.Block, method: removeLeadingEmptyLines, match: "()", note: "Block.removeLeadingEmptyLines"}
  - {class: com.github.rjeschke.txtmark.Configuration, method: builder, match: "()", note: "Configuration.builder"}
  - {class: com.github.rjeschke.txtmark.Configuration, method: enableSafeMode, match: "()", note: "Configuration.enableSafeMode"}
  - {class: com.github.rjeschke.txtmark.Configuration, method: forceExtentedProfile, match: "()", note: "Configuration.forceExtentedProfile"}
  - {class: com.github.rjeschke.txtmark.Configuration, method: setSafeMode, match: "(final boolean flag)", note: "Configuration.setSafeMode"}
  - {class: com.github.rjeschke.txtmark.Configuration, method: setEncoding, match: "(final String encoding)", note: "Configuration.setEncoding"}
  - {class: com.github.rjeschke.txtmark.Configuration, method: setDecorator, match: "(final Decorator decorator)", note: "Configuration.setDecorator"}
  - {class: com.github.rjeschke.txtmark.DefaultDecorator, method: openParagraph, match: "(final StringBuilder out)", note: "DefaultDecorator.openParagraph"}
  - {class: com.github.rjeschke.txtmark.DefaultDecorator, method: closeParagraph, match: "(final StringBuilder out)", note: "DefaultDecorator.closeParagraph"}
  - {class: com.github.rjeschke.txtmark.DefaultDecorator, method: openBlockquote, match: "(final StringBuilder out)", note: "DefaultDecorator.openBlockquote"}
  - {class: com.github.rjeschke.txtmark.DefaultDecorator, method: closeBlockquote, match: "(final StringBuilder out)", note: "DefaultDecorator.closeBlockquote"}
  - {class: com.github.rjeschke.txtmark.DefaultDecorator, method: openCodeBlock, match: "(final StringBuilder out)", note: "DefaultDecorator.openCodeBlock"}
  - {class: com.github.rjeschke.txtmark.DefaultDecorator, method: closeCodeBlock, match: "(final StringBuilder out)", note: "DefaultDecorator.closeCodeBlock"}
  - {class: com.github.rjeschke.txtmark.Emitter, method: addLinkRef, match: "(final String key, final LinkRef linkRef)", note: "Emitter.addLinkRef"}
  - {class: com.github.rjeschke.txtmark.Emitter, method: emit, match: "(final StringBuilder out, final Block root)", note: "Emitter.emit"}
  - {class: com.github.rjeschke.txtmark.HTML, method: isLinkPrefix, match: "(final String value)", note: "HTML.isLinkPrefix"}
  - {class: com.github.rjeschke.txtmark.HTML, method: isEntity, match: "(final String value)", note: "HTML.isEntity"}
  - {class: com.github.rjeschke.txtmark.HTML, method: isHtmlElement, match: "(final String value)", note: "HTML.isHtmlElement"}
  - {class: com.github.rjeschke.txtmark.HTML, method: isHtmlBlockElement, match: "(final String value)", note: "HTML.isHtmlBlockElement"}
  - {class: com.github.rjeschke.txtmark.HTML, method: isUnsafeHtmlElement, match: "(final String value)", note: "HTML.isUnsafeHtmlElement"}
  - {class: com.github.rjeschke.txtmark.Line, method: init, match: "()", note: "Line.init"}
  - {class: com.github.rjeschke.txtmark.Line, method: initLeading, match: "()", note: "Line.initLeading"}
  - {class: com.github.rjeschke.txtmark.Line, method: skipSpaces, match: "()", note: "Line.skipSpaces"}
  - {class: com.github.rjeschke.txtmark.Line, method: readUntil, match: "(final char... end)", note: "Line.readUntil"}
  - {class: com.github.rjeschke.txtmark.Line, method: setEmpty, match: "()", note: "Line.setEmpty"}
  - {class: com.github.rjeschke.txtmark.Line, method: getLineType, match: "(final Configuration configuration)", note: "Line.getLineType"}
  - {class: com.github.rjeschke.txtmark.Processor, method: process, match: "(final Reader reader, final Configuration configuration) throws IOException", note: "Processor.process"}
  - {class: com.github.rjeschke.txtmark.Processor, method: process, match: "(final String input, final Configuration configuration)", note: "Processor.process"}
  - {class: com.github.rjeschke.txtmark.Processor, method: process, match: "(final File file, final Configuration configuration) throws IOException", note: "Processor.process"}
  - {class: com.github.rjeschke.txtmark.Processor, method: process, match: "(final InputStream input, final Configuration configuration) throws IOException", note: "Processor.process"}
  - {class: com.github.rjeschke.txtmark.Processor, method: process, match: "(final String input)", note: "Processor.process"}
