# Curated performance-mutation sites for re2j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants re2j --source data/external-src/<checkout> \
#       --sites data/projects/re2j/mutation_sites.yaml

package_root: com.google.re2j

sites:
  - {class: com.google.re2j.Parser, method: removeRange, match: "(int fromIndex, int toIndex)", note: "Parser.removeRange"}
  - {class: com.google.re2j.Matcher, method: pattern, match: "()", note: "Matcher.pattern"}
  - {class: com.google.re2j.Matcher, method: reset, match: "()", note: "Matcher.reset"}
  - {class: com.google.re2j.Matcher, method: reset, match: "(CharSequence input)", note: "Matcher.reset"}
  - {class: com.google.re2j.Matcher, method: reset, match: "(byte[] bytes)", note: "Matcher.reset"}
  - {class: com.google.re2j.Matcher, method: start, match: "()", note: "Matcher.start"}
  - {class: com.google.re2j.Matcher, method: end, match: "()", note: "Matcher.end"}
  - {class: com.google.re2j.Matcher, method: start, match: "(int group)", note: "Matcher.start"}
  - {class: com.google.re2j.Matcher, method: start, match: "(String group)", note: "Matcher.start"}
  - {class: com.google.re2j.Matcher, method: end, match: "(int group)", note: "Matcher.end"}
  - {class: com.google.re2j.Matcher, method: end, match: "(String group)", note: "Matcher.end"}
  - {class: com.google.re2j.Matcher, method: programSize, match: "()", note: "Matcher.programSize"}
  - {class: com.google.re2j.Matcher, method: group, match: "()", note: "Matcher.group"}
  - {class: com.google.re2j.Matcher, method: group, match: "(int group)", note: "Matcher.group"}
  - {class: com.google.re2j.Matcher, method: group, match: "(String group)", note: "Matcher.group"}
  - {class: com.google.re2j.Matcher, method: groupCount, match: "()", note: "Matcher.groupCount"}
  - {class: com.google.re2j.Matcher, method: lookingAt, match: "()", note: "Matcher.lookingAt"}
  - {class: com.google.re2j.Matcher, method: find, match: "()", note: "Matcher.find"}
  - {class: com.google.re2j.Matcher, method: find, match: "(int start)", note: "Matcher.find"}
  - {class: com.google.re2j.Matcher, method: quoteReplacement, match: "(String s)", note: "Matcher.quoteReplacement"}
  - {class: com.google.re2j.Matcher, method: appendReplacement, match: "(StringBuffer sb, String replacement)", note: "Matcher.appendReplacement"}
  - {class: com.google.re2j.Matcher, method: appendReplacement, match: "(StringBuilder sb, String replacement)", note: "Matcher.appendReplacement"}
  - {class: com.google.re2j.Matcher, method: appendTail, match: "(StringBuffer sb)", note: "Matcher.appendTail"}
  - {class: com.google.re2j.Matcher, method: appendTail, match: "(StringBuilder sb)", note: "Matcher.appendTail"}
  - {class: com.google.re2j.Matcher, method: replaceAll, match: "(String replacement)", note: "Matcher.replaceAll"}
  - {class: com.google.re2j.Matcher, method: replaceFirst, match: "(String replacement)", note: "Matcher.replaceFirst"}
  - {class: com.google.re2j.Pattern, method: reset, match: "()", note: "Pattern.reset"}
  - {class: com.google.re2j.Pattern, method: flags, match: "()", note: "Pattern.flags"}
  - {class: com.google.re2j.Pattern, method: pattern, match: "()", note: "Pattern.pattern"}
  - {class: com.google.re2j.Pattern, method: compile, match: "(String regex)", note: "Pattern.compile"}
  - {class: com.google.re2j.Pattern, method: compile, match: "(String regex, int flags)", note: "Pattern.compile"}
  - {class: com.google.re2j.Pattern, method: matcher, match: "(CharSequence input)", note: "Pattern.matcher"}
  - {class: com.google.re2j.Pattern, method: matcher, match: "(byte[] input)", note: "Pattern.matcher"}
  - {class: com.google.re2j.Pattern, method: split, match: "(String input)", note: "Pattern.split"}
  - {class: com.google.re2j.Pattern, method: split, match: "(String input, int limit)", note: "Pattern.split"}
  - {class: com.google.re2j.Pattern, method: quote, match: "(String s)", note: "Pattern.quote"}
  - {class: com.google.re2j.Pattern, method: programSize, match: "()", note: "Pattern.programSize"}
  - {class: com.google.re2j.Pattern, method: groupCount, match: "()", note: "Pattern.groupCount"}
  - {class: com.google.re2j.Pattern, method: namedGroups, match: "()", note: "Pattern.namedGroups"}
  - {class: com.google.re2j.PatternSyntaxException, method: getIndex, match: "()", note: "PatternSyntaxException.getIndex"}
  - {class: com.google.re2j.PatternSyntaxException, method: getDescription, match: "()", note: "PatternSyntaxException.getDescription"}
  - {class: com.google.re2j.PatternSyntaxException, method: getPattern, match: "()", note: "PatternSyntaxException.getPattern"}
  - {class: com.google.re2j.RE2, method: replace, match: "(String orig)", note: "RE2.replace"}
  - {class: com.google.re2j.RE2, method: replace, match: "(String orig)", note: "RE2.replace"}
  - {class: com.google.re2j.RE2, method: deliver, match: "(int[] match)", note: "RE2.deliver"}
  - {class: com.google.re2j.RE2, method: deliver, match: "(int[] match)", note: "RE2.deliver"}
  - {class: com.google.re2j.RE2, method: deliver, match: "(int[] match)", note: "RE2.deliver"}
  - {class: com.google.re2j.RE2, method: deliver, match: "(int[] match)", note: "RE2.deliver"}
  - {class: com.google.re2j.RE2, method: deliver, match: "(int[] match)", note: "RE2.deliver"}
  - {class: com.google.re2j.RE2, method: deliver, match: "(int[] match)", note: "RE2.deliver"}
