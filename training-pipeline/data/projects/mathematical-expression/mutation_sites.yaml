# Curated performance-mutation sites for mathematical-expression (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants mathematical-expression --source data/external-src/<checkout> \
#       --sites data/projects/mathematical-expression/mutation_sites.yaml

package_root: io.github.beardedManZhao

