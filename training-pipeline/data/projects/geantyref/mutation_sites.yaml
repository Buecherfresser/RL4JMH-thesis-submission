  - {class: io.leangen.geantyref.CaptureTypeImpl, method: setUpperBounds, match: "(Type[] upperBounds)", note: "CaptureTypeImpl.setUpperBounds"}
  - {class: io.leangen.geantyref.CaptureTypeImpl, method: getTypeVariable, match: "()", note: "CaptureTypeImpl.getTypeVariable"}
  - {class: io.leangen.geantyref.CaptureTypeImpl, method: getWildcardType, match: "()", note: "CaptureTypeImpl.getWildcardType"}
  - {class: io.leangen.geantyref.GenericTypeReflector, method: erase, match: "(Type type)", note: "GenericTypeReflector.erase"}
  - {class: io.leangen.geantyref.GenericTypeReflector, method: box, match: "(Type type)", note: "GenericTypeReflector.box"}
  - {class: io.leangen.geantyref.GenericTypeReflector, method: isBoxType, match: "(Type type)", note: "GenericTypeReflector.isBoxType"}
  - {class: io.leangen.geantyref.GenericTypeReflector, method: isFullyBound, match: "(Type type)", note: "GenericTypeReflector.isFullyBound"}
  - {class: io.leangen.geantyref.GenericTypeReflector, method: resolveExactType, match: "(AnnotatedType unresolved, AnnotatedType typeAndParams)", note: "GenericTypeReflector.resolveExactType"}
  - {class: io.leangen.geantyref.GenericTypeReflector, method: resolveExactType, match: "(Type unresolved, Type typeAndParams)", note: "GenericTypeReflector.resolveExactType"}
  - {class: io.leangen.geantyref.ParameterizedTypeImpl, method: getRawType, match: "()", note: "ParameterizedTypeImpl.getRawType"}
  - {class: io.leangen.geantyref.ParameterizedTypeImpl, method: getActualTypeArguments, match: "()", note: "ParameterizedTypeImpl.getActualTypeArguments"}
  - {class: io.leangen.geantyref.ParameterizedTypeImpl, method: getOwnerType, match: "()", note: "ParameterizedTypeImpl.getOwnerType"}
  - {class: io.leangen.geantyref.TypeArgumentNotInBoundException, method: getArgument, match: "()", note: "TypeArgumentNotInBoundException.getArgument"}
  - {class: io.leangen.geantyref.TypeArgumentNotInBoundException, method: getParameter, match: "()", note: "TypeArgumentNotInBoundException.getParameter"}
  - {class: io.leangen.geantyref.TypeArgumentNotInBoundException, method: getBound, match: "()", note: "TypeArgumentNotInBoundException.getBound"}
  - {class: io.leangen.geantyref.TypeFactory, method: parameterizedClass, match: "(Class<?> clazz, Type... arguments)", note: "TypeFactory.parameterizedClass"}
  - {class: io.leangen.geantyref.TypeFactory, method: annotatedClass, match: "(Class<?> clazz, Annotation[] annotations)", note: "TypeFactory.annotatedClass"}
