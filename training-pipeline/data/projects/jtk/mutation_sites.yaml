  - {class: edu.mines.jtk.mosaic.AxisScale, method: isLog, match: "()", note: "AxisScale.isLog"}
  - {class: edu.mines.jtk.ogl.GlDisplayList, method: range, match: "()", note: "GlDisplayList.range"}
  - {class: edu.mines.jtk.opt.ArrayVect1, method: getSize, match: "()", note: "ArrayVect1.getSize"}
  - {class: edu.mines.jtk.sgl.ArrayStack, method: pop, match: "()", note: "ArrayStack.pop"}
