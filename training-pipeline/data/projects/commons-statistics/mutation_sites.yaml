# Curated performance-mutation sites for commons-statistics (GRPO RL corpus).
#
# Hand-picked streaming reductions (of/ofRange/evaluate) and distribution kernels
# (density, probability, cumulativeProbability) from good_classes.yaml.
#
# Regenerate with:
#   jmh-make-mutants commons-statistics --source data/external-src/commons-statistics-merged \
#       --sites data/projects/commons-statistics/mutation_sites.yaml

