  - {class: org.LatencyUtils.TimeServices, method: moveTimeForwardMsec, match: "(long timeDeltaMsec) throws InterruptedException", note: "TimeServices.moveTimeForwardMsec"}
  - {class: org.LatencyUtils.TimeServices, method: setCurrentTime, match: "(long newCurrentTime) throws InterruptedException", note: "TimeServices.setCurrentTime"}
  - {class: org.LatencyUtils.TimeServices, method: scheduleAtFixedRate, match: "(Runnable command, long initialDelay, long period, TimeUnit unit)", note: "TimeServices.scheduleAtFixedRate"}
  - {class: org.LatencyUtils.TimeServices, method: shutdown, match: "()", note: "TimeServices.shutdown"}
  - {class: org.LatencyUtils.TimeServices, method: run, match: "()", note: "TimeServices.run"}
