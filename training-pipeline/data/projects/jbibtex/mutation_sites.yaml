# Curated performance-mutation sites for jbibtex (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jbibtex --source data/external-src/<checkout> \
#       --sites data/projects/jbibtex/mutation_sites.yaml

package_root: org.jbibtex

sites:
  - {class: org.jbibtex.BibTeXString, method: getKey, match: "()", note: "BibTeXString.getKey"}
  - {class: org.jbibtex.BibTeXString, method: getValue, match: "()", note: "BibTeXString.getValue"}
  - {class: org.jbibtex.DigitStringValue, method: format, match: "()", note: "DigitStringValue.format"}
  - {class: org.jbibtex.LaTeXString, method: getValue, match: "()", note: "LaTeXString.getValue"}
  - {class: org.jbibtex.StringUtil, method: addIndent, match: "(String string, String indent)", note: "StringUtil.addIndent"}
  - {class: org.jbibtex.StringUtil, method: addIndent, match: "(String string, int level, String indent)", note: "StringUtil.addIndent"}
  - {class: org.jbibtex.StringUtil, method: removeIndent, match: "(String string)", note: "StringUtil.removeIndent"}
  - {class: org.jbibtex.StringValue, method: format, match: "()", note: "StringValue.format"}
  - {class: org.jbibtex.StringValue, method: getStyle, match: "()", note: "StringValue.getStyle"}
  - {class: org.jbibtex.StringValue, method: getBegin, match: "()", note: "StringValue.getBegin"}
  - {class: org.jbibtex.StringValue, method: getEnd, match: "()", note: "StringValue.getEnd"}
  - {class: org.jbibtex.BibTeXComment, method: getValue, match: "()", note: "BibTeXComment.getValue"}
  - {class: org.jbibtex.BibTeXDatabase, method: addObject, match: "(BibTeXObject object)", note: "BibTeXDatabase.addObject"}
  - {class: org.jbibtex.BibTeXDatabase, method: removeObject, match: "(BibTeXObject object)", note: "BibTeXDatabase.removeObject"}
  - {class: org.jbibtex.BibTeXDatabase, method: getObjects, match: "()", note: "BibTeXDatabase.getObjects"}
  - {class: org.jbibtex.BibTeXDatabase, method: resolveString, match: "(Key key)", note: "BibTeXDatabase.resolveString"}
  - {class: org.jbibtex.BibTeXEntry, method: getCrossReference, match: "()", note: "BibTeXEntry.getCrossReference"}
  - {class: org.jbibtex.BibTeXEntry, method: getField, match: "(Key key)", note: "BibTeXEntry.getField"}
  - {class: org.jbibtex.BibTeXEntry, method: addField, match: "(Key key, Value value)", note: "BibTeXEntry.addField"}
  - {class: org.jbibtex.BibTeXEntry, method: addAllFields, match: "(Map<Key, Value> fields)", note: "BibTeXEntry.addAllFields"}
  - {class: org.jbibtex.BibTeXFormatter, method: format, match: "(BibTeXDatabase database, Writer writer) throws IOException", note: "BibTeXFormatter.format"}
  - {class: org.jbibtex.BibTeXFormatter, method: format, match: "(BibTeXComment comment, Writer writer) throws IOException", note: "BibTeXFormatter.format"}
  - {class: org.jbibtex.BibTeXFormatter, method: format, match: "(BibTeXEntry entry, Writer writer) throws IOException", note: "BibTeXFormatter.format"}
  - {class: org.jbibtex.BibTeXFormatter, method: format, match: "(BibTeXInclude include, Writer writer) throws IOException", note: "BibTeXFormatter.format"}
  - {class: org.jbibtex.BibTeXInclude, method: getValue, match: "()", note: "BibTeXInclude.getValue"}
  - {class: org.jbibtex.BibTeXInclude, method: getDatabase, match: "()", note: "BibTeXInclude.getDatabase"}
  - {class: org.jbibtex.BibTeXPreamble, method: getValue, match: "()", note: "BibTeXPreamble.getValue"}
  - {class: org.jbibtex.CharacterFilterReader, method: accept, match: "(char c)", note: "CharacterFilterReader.accept"}
  - {class: org.jbibtex.ConcateValue, method: format, match: "()", note: "ConcateValue.format"}
  - {class: org.jbibtex.ConcateValue, method: toUserString, match: "()", note: "ConcateValue.toUserString"}
  - {class: org.jbibtex.ConcateValue, method: getLeft, match: "()", note: "ConcateValue.getLeft"}
  - {class: org.jbibtex.ConcateValue, method: getRight, match: "()", note: "ConcateValue.getRight"}
  - {class: org.jbibtex.CrossReferenceValue, method: format, match: "()", note: "CrossReferenceValue.format"}
  - {class: org.jbibtex.CrossReferenceValue, method: toUserString, match: "()", note: "CrossReferenceValue.toUserString"}
  - {class: org.jbibtex.CrossReferenceValue, method: isResolved, match: "()", note: "CrossReferenceValue.isResolved"}
  - {class: org.jbibtex.CrossReferenceValue, method: getValue, match: "()", note: "CrossReferenceValue.getValue"}
  - {class: org.jbibtex.Key, method: getValue, match: "()", note: "Key.getValue"}
  - {class: org.jbibtex.KeyValue, method: toKey, match: "()", note: "KeyValue.toKey"}
  - {class: org.jbibtex.KeyValue, method: format, match: "()", note: "KeyValue.format"}
  - {class: org.jbibtex.KeyValue, method: toUserString, match: "()", note: "KeyValue.toUserString"}
  - {class: org.jbibtex.KeyValue, method: getString, match: "()", note: "KeyValue.getString"}
  - {class: org.jbibtex.LaTeXCommand, method: getName, match: "()", note: "LaTeXCommand.getName"}
  - {class: org.jbibtex.LaTeXGroup, method: getObjects, match: "()", note: "LaTeXGroup.getObjects"}
  - {class: org.jbibtex.LaTeXPrinter, method: print, match: "(List<LaTeXObject> objects)", note: "LaTeXPrinter.print"}
  - {class: org.jbibtex.LaTeXPrinter, method: today, match: "()", note: "LaTeXPrinter.today"}
  - {class: org.jbibtex.LaTeXPrinter, method: getSymbol, match: "(String name)", note: "LaTeXPrinter.getSymbol"}
  - {class: org.jbibtex.LaTeXPrinter, method: setSymbol, match: "(String name, String symbol)", note: "LaTeXPrinter.setSymbol"}
  - {class: org.jbibtex.LiteralValue, method: toUserString, match: "()", note: "LiteralValue.toUserString"}
  - {class: org.jbibtex.LiteralValue, method: getString, match: "()", note: "LiteralValue.getString"}
  - {class: org.jbibtex.ReferenceValue, method: format, match: "()", note: "ReferenceValue.format"}
