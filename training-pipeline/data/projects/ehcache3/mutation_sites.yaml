  - {class: org.ehcache.build.util.ConfigurationBucketSet, method: implementation, match: "()", note: "ConfigurationBucketSet.implementation"}
  - {class: org.ehcache.clustered.ChainUtils, method: createPayload, match: "(long key)", note: "ChainUtils.createPayload"}
