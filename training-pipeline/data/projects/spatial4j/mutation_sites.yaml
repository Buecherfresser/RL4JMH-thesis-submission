# Curated performance-mutation sites for spatial4j (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants spatial4j --source data/external-src/<checkout> \
#       --sites data/projects/spatial4j/mutation_sites.yaml

package_root: org.locationtech.spatial4j

sites:
  - {class: org.locationtech.spatial4j.context.SpatialContext, method: getShapeFactory, match: "()", note: "SpatialContext.getShapeFactory"}
  - {class: org.locationtech.spatial4j.distance.DistanceUtils, method: vectorDistance, match: "(double[] vec1, double[] vec2, double power)", note: "DistanceUtils.vectorDistance"}
  - {class: org.locationtech.spatial4j.io.GeohashUtils, method: encodeLatLon, match: "(double latitude, double longitude)", note: "GeohashUtils.encodeLatLon"}
  - {class: org.locationtech.spatial4j.shape.impl.BufferedLine, method: isEmpty, match: "()", note: "BufferedLine.isEmpty"}
  - {class: org.locationtech.spatial4j.context.SpatialContext, method: getFormats, match: "()", note: "SpatialContext.getFormats"}
  - {class: org.locationtech.spatial4j.distance.DistanceUtils, method: vectorDistance, match: "(double[] vec1, double[] vec2, double power, double oneOverPower)", note: "DistanceUtils.vectorDistance"}
  - {class: org.locationtech.spatial4j.io.GeohashUtils, method: encodeLatLon, match: "(double latitude, double longitude, int precision)", note: "GeohashUtils.encodeLatLon"}
  - {class: org.locationtech.spatial4j.shape.impl.BufferedLine, method: getBuffered, match: "(double distance, SpatialContext ctx)", note: "BufferedLine.getBuffered"}
  - {class: org.locationtech.spatial4j.context.SpatialContextFactory, method: makeSpatialContext, match: "(Map<String,String> args, ClassLoader classLoader)", note: "SpatialContextFactory.makeSpatialContext"}
  - {class: org.locationtech.spatial4j.distance.CartesianDistCalc, method: distance, match: "(Point from, double toX, double toY)", note: "CartesianDistCalc.distance"}
  - {class: org.locationtech.spatial4j.io.OnePointsBuilder, method: pointXY, match: "(double x, double y)", note: "OnePointsBuilder.pointXY"}
  - {class: org.locationtech.spatial4j.shape.impl.BufferedLineString, method: isEmpty, match: "()", note: "BufferedLineString.isEmpty"}
  - {class: org.locationtech.spatial4j.context.SpatialContextFactory, method: init, match: "(Map<String, String> args, ClassLoader classLoader)", note: "SpatialContextFactory.init"}
  - {class: org.locationtech.spatial4j.distance.CartesianDistCalc, method: distanceToLineSegment, match: "(Point point, double vX, double vY, double wX, double wY)", note: "CartesianDistCalc.distanceToLineSegment"}
  - {class: org.locationtech.spatial4j.io.OnePointsBuilder, method: pointXYZ, match: "(double x, double y, double z)", note: "OnePointsBuilder.pointXYZ"}
  - {class: org.locationtech.spatial4j.shape.impl.BufferedLineString, method: getBuffered, match: "(double distance, SpatialContext ctx)", note: "BufferedLineString.getBuffered"}
  - {class: org.locationtech.spatial4j.context.jts.JtsSpatialContext, method: getShapeFactory, match: "()", note: "JtsSpatialContext.getShapeFactory"}
  - {class: org.locationtech.spatial4j.io.ParseUtils, method: parsePoint, match: "(String[] out, String externalVal, int dimension) throws InvalidShapeException", note: "ParseUtils.parsePoint"}
  - {class: org.locationtech.spatial4j.shape.impl.Range, method: xRange, match: "(Rectangle rect, SpatialContext ctx)", note: "Range.xRange"}
  - {class: org.locationtech.spatial4j.context.jts.JtsSpatialContext, method: isAllowMultiOverlap, match: "()", note: "JtsSpatialContext.isAllowMultiOverlap"}
  - {class: org.locationtech.spatial4j.io.ParseUtils, method: parsePointDouble, match: "(double[] out, String externalVal, int dimension) throws InvalidShapeException", note: "ParseUtils.parsePointDouble"}
  - {class: org.locationtech.spatial4j.shape.impl.Range, method: yRange, match: "(Rectangle rect, SpatialContext ctx)", note: "Range.yRange"}
  - {class: org.locationtech.spatial4j.context.jts.JtsSpatialContextFactory, method: checkDefaultFormats, match: "()", note: "JtsSpatialContextFactory.checkDefaultFormats"}
  - {class: org.locationtech.spatial4j.io.jts.JtsWKTReaderShapeParser, method: parseIfSupported, match: "(String wktString) throws ParseException", note: "JtsWKTReaderShapeParser.parseIfSupported"}
  - {class: org.locationtech.spatial4j.shape.ShapeCollection, method: computeBoundingBox, match: "(Collection<? extends Shape> shapes, SpatialContext ctx)", note: "ShapeCollection.computeBoundingBox"}
  - {class: org.locationtech.spatial4j.context.jts.JtsSpatialContextFactory, method: init, match: "(Map<String, String> args, ClassLoader classLoader)", note: "JtsSpatialContextFactory.init"}
  - {class: org.locationtech.spatial4j.io.jts.JtsWKTReaderShapeParser, method: parseIfSupported, match: "(String str, WKTReader reader) throws ParseException", note: "JtsWKTReaderShapeParser.parseIfSupported"}
  - {class: org.locationtech.spatial4j.shape.ShapeCollection, method: getShapes, match: "()", note: "ShapeCollection.getShapes"}
  - {class: org.locationtech.spatial4j.io.BinaryCodec, method: readShape, match: "(DataInput dataInput) throws IOException", note: "BinaryCodec.readShape"}
