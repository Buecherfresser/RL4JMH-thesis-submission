# Curated performance-mutation sites for flatpack (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants flatpack --source data/external-src/<checkout> \
#       --sites data/projects/flatpack/mutation_sites.yaml

package_root: net.sf.flatpack

sites:
  - {class: net.sf.flatpack.CsvParserFactory, method: newForwardParser, match: "(Reader reader)", note: "CsvParserFactory.newForwardParser"}
  - {class: net.sf.flatpack.brparse.BuffReaderDataSet, method: previous, match: "()", note: "BuffReaderDataSet.previous"}
  - {class: net.sf.flatpack.converter.ConvertBigDecimal, method: convertValue, match: "(final String valueToConvert)", note: "ConvertBigDecimal.convertValue"}
  - {class: net.sf.flatpack.excel.ExcelTransformer, method: writeExcelFile, match: "() throws IOException, WriteException", note: "ExcelTransformer.writeExcelFile"}
  - {class: net.sf.flatpack.ordering.OrderBy, method: addOrderColumn, match: "(final OrderColumn oc)", note: "OrderBy.addOrderColumn"}
  - {class: net.sf.flatpack.structure.ColumnMetaData, method: getColLength, match: "()", note: "ColumnMetaData.getColLength"}
  - {class: net.sf.flatpack.util.FPStringUtils, method: isBlank, match: "(final String str)", note: "FPStringUtils.isBlank"}
  - {class: net.sf.flatpack.writer.DelimiterWriter, method: writeWithDelimiter, match: "(final Object value) throws IOException", note: "DelimiterWriter.writeWithDelimiter"}
  - {class: net.sf.flatpack.xml.MapParser, method: parse, match: "(final Reader xmlStreamReader, final Parser pzparser)", note: "MapParser.parse"}
  - {class: net.sf.flatpack.CsvParserFactory, method: newInMemoryParser, match: "(Reader reader)", note: "CsvParserFactory.newInMemoryParser"}
  - {class: net.sf.flatpack.brparse.BuffReaderDataSet, method: orderRows, match: "(final OrderBy ob)", note: "BuffReaderDataSet.orderRows"}
  - {class: net.sf.flatpack.converter.ConvertDouble, method: convertValue, match: "(final String valueToConvert)", note: "ConvertDouble.convertValue"}
  - {class: net.sf.flatpack.excel.ExcelTransformer, method: setExcludeFromExportColumns, match: "(final String[] excludeFromExportColumns)", note: "ExcelTransformer.setExcludeFromExportColumns"}
  - {class: net.sf.flatpack.ordering.OrderBy, method: setMetaData, match: "(final MetaData metaData)", note: "OrderBy.setMetaData"}
  - {class: net.sf.flatpack.structure.ColumnMetaData, method: getColName, match: "()", note: "ColumnMetaData.getColName"}
  - {class: net.sf.flatpack.util.FPStringUtils, method: isNotBlank, match: "(final String str)", note: "FPStringUtils.isNotBlank"}
  - {class: net.sf.flatpack.writer.DelimiterWriter, method: writeColumnTitles, match: "() throws IOException", note: "DelimiterWriter.writeColumnTitles"}
  - {class: net.sf.flatpack.xml.MapParser, method: setDebug, match: "(final boolean b)", note: "MapParser.setDebug"}
  - {class: net.sf.flatpack.DBDelimiterParser, method: init, match: "()", note: "DBDelimiterParser.init"}
  - {class: net.sf.flatpack.brparse.BuffReaderDelimParser, method: doParse, match: "()", note: "BuffReaderDelimParser.doParse"}
  - {class: net.sf.flatpack.converter.ConvertInteger, method: convertValue, match: "(final String valueToConvert)", note: "ConvertInteger.convertValue"}
  - {class: net.sf.flatpack.ordering.OrderColumn, method: getColumnName, match: "()", note: "OrderColumn.getColumnName"}
  - {class: net.sf.flatpack.structure.Row, method: addColumn, match: "(final String colValue)", note: "Row.addColumn"}
  - {class: net.sf.flatpack.util.FixedWidthParserUtils, method: splitFixedText, match: "(final List<ColumnMetaData> columnMetaData, final String lineToParse,", note: "FixedWidthParserUtils.splitFixedText"}
  - {class: net.sf.flatpack.writer.DelimiterWriterFactory, method: getDelimiter, match: "()", note: "DelimiterWriterFactory.getDelimiter"}
  - {class: net.sf.flatpack.xml.MetaData, method: getColumnsNames, match: "()", note: "MetaData.getColumnsNames"}
  - {class: net.sf.flatpack.DBDelimiterParser, method: shouldCreateMDFromFile, match: "()", note: "DBDelimiterParser.shouldCreateMDFromFile"}
  - {class: net.sf.flatpack.brparse.BuffReaderDelimParser, method: buildRow, match: "(final DefaultDataSet ds)", note: "BuffReaderDelimParser.buildRow"}
  - {class: net.sf.flatpack.ordering.OrderColumn, method: setColumnName, match: "(final String columnName)", note: "OrderColumn.setColumnName"}
  - {class: net.sf.flatpack.structure.Row, method: addColumn, match: "(final List<String> columns)", note: "Row.addColumn"}
  - {class: net.sf.flatpack.util.FixedWidthParserUtils, method: getCMDKey, match: "(final MetaData columnMD, final String line)", note: "FixedWidthParserUtils.getCMDKey"}
  - {class: net.sf.flatpack.writer.DelimiterWriterFactory, method: getQualifier, match: "()", note: "DelimiterWriterFactory.getQualifier"}
  - {class: net.sf.flatpack.xml.MetaData, method: getColumnIndexMap, match: "()", note: "MetaData.getColumnIndexMap"}
  - {class: net.sf.flatpack.DBFixedLengthParser, method: init, match: "()", note: "DBFixedLengthParser.init"}
  - {class: net.sf.flatpack.brparse.BuffReaderFixedParser, method: doParse, match: "()", note: "BuffReaderFixedParser.doParse"}
  - {class: net.sf.flatpack.util.FlatpackWriterUtil, method: buildParametersForColumns, match: "(final String colsAsCsv)", note: "FlatpackWriterUtil.buildParametersForColumns"}
  - {class: net.sf.flatpack.writer.FixedLengthWriter, method: addRecordEntry, match: "(final String columnName, final Object value)", note: "FixedLengthWriter.addRecordEntry"}
  - {class: net.sf.flatpack.xml.ResolveLocalDTD, method: resolveEntity, match: "(final String publicId, final String systemId) throws SAXException, IOException", note: "ResolveLocalDTD.resolveEntity"}
  - {class: net.sf.flatpack.DefaultDataSet, method: addRow, match: "(final Row row)", note: "DefaultDataSet.addRow"}
  - {class: net.sf.flatpack.brparse.BuffReaderFixedParser, method: buildRow, match: "(final DefaultDataSet ds)", note: "BuffReaderFixedParser.buildRow"}
  - {class: net.sf.flatpack.util.FlatpackWriterUtil, method: buildColumns, match: "(final String colsAsCsv)", note: "FlatpackWriterUtil.buildColumns"}
  - {class: net.sf.flatpack.writer.FixedLengthWriter, method: nextRecord, match: "() throws IOException", note: "FixedLengthWriter.nextRecord"}
  - {class: net.sf.flatpack.xml.XMLRecordElement, method: getElementNumber, match: "()", note: "XMLRecordElement.getElementNumber"}
  - {class: net.sf.flatpack.DefaultDataSet, method: addError, match: "(final DataError dataError)", note: "DefaultDataSet.addError"}
  - {class: net.sf.flatpack.brparse.DBBuffReaderDelimParser, method: init, match: "()", note: "DBBuffReaderDelimParser.init"}
  - {class: net.sf.flatpack.util.ParserUtils, method: splitLine, match: "(final String line, final char delimiter, final char qualifier, final int initialSize,", note: "ParserUtils.splitLine"}
  - {class: net.sf.flatpack.writer.FixedWriterFactory, method: createWriter, match: "(final java.io.Writer output) throws IOException", note: "FixedWriterFactory.createWriter"}
  - {class: net.sf.flatpack.xml.XMLRecordElement, method: setElementNumber, match: "(final int elementNumber)", note: "XMLRecordElement.setElementNumber"}
  - {class: net.sf.flatpack.DefaultParserFactory, method: getInstance, match: "()", note: "DefaultParserFactory.getInstance"}
  - {class: net.sf.flatpack.brparse.DBBuffReaderDelimParser, method: shouldCreateMDFromFile, match: "()", note: "DBBuffReaderDelimParser.shouldCreateMDFromFile"}
