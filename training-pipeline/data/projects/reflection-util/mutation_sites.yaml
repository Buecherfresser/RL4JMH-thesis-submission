  - {class: de.cronn.reflection.util.immutable.collection.DeepImmutableList, method: of, match: "(T e1, T e2, ImmutableProxyOption... options)", note: "DeepImmutableList.of"}
  - {class: de.cronn.reflection.util.immutable.collection.DeepImmutableList, method: of, match: "(T e1, T e2, T e3, ImmutableProxyOption... options)", note: "DeepImmutableList.of"}
