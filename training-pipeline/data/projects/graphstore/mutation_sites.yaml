# Curated performance-mutation sites for graphstore (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants graphstore --source data/external-src/<checkout> \
#       --sites data/projects/graphstore/mutation_sites.yaml

package_root: org.gephi.graph

sites:
