  - {class: com.fasterxml.uuid.Jug, method: run, match: "(String[] args)", note: "Jug.run"}
  - {class: com.fasterxml.uuid.impl.TimeBasedGenerator, method: getEthernetAddress, match: "()", note: "TimeBasedGenerator.getEthernetAddress"}
  - {class: com.fasterxml.uuid.UUIDClock, method: systemTimeClock, match: "()", note: "UUIDClock.systemTimeClock"}
