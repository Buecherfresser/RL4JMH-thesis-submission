# Curated performance-mutation sites for dictomaton (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants dictomaton --source data/external-src/<checkout> \
#       --sites data/projects/dictomaton/mutation_sites.yaml

package_root: eu.danieldk.dictomaton

sites:
  - {class: eu.danieldk.dictomaton.CompactIntArray, method: binarySearch, match: "(int fromIndex, int toIndex, int value)", note: "CompactIntArray.binarySearch"}
  - {class: eu.danieldk.dictomaton.collections.ImmutableStringBooleanMap, method: putAll, match: "(Map<String, Boolean> map)", note: "ImmutableStringBooleanMap.putAll"}
  - {class: eu.danieldk.dictomaton.levenshtein.LevenshteinAutomaton, method: toDot, match: "()", note: "LevenshteinAutomaton.toDot"}
  - {class: eu.danieldk.dictomaton.CompactIntArray, method: size, match: "()", note: "CompactIntArray.size"}
  - {class: eu.danieldk.dictomaton.collections.ImmutableStringBooleanMap, method: build, match: "() throws DictionaryBuilderException", note: "ImmutableStringBooleanMap.build"}
  - {class: eu.danieldk.dictomaton.levenshtein.LevenshteinAutomaton, method: intersectionLanguage, match: "(Dictionary dictionary)", note: "LevenshteinAutomaton.intersectionLanguage"}
  - {class: eu.danieldk.dictomaton.CompactIntArray, method: width, match: "(int n)", note: "CompactIntArray.width"}
  - {class: eu.danieldk.dictomaton.collections.ImmutableStringBooleanMap, method: putAll, match: "(SortedMap<String, Boolean> map) throws DictionaryBuilderException", note: "ImmutableStringBooleanMap.putAll"}
  - {class: eu.danieldk.dictomaton.levenshtein.LevenshteinAutomatonState, method: addTransition, match: "(Character c, LevenshteinAutomatonState s)", note: "LevenshteinAutomatonState.addTransition"}
  - {class: eu.danieldk.dictomaton.DictionaryBuilder, method: compareCharacterSequences, match: "(CharSequence seq1, CharSequence seq2)", note: "DictionaryBuilder.compareCharacterSequences"}
  - {class: eu.danieldk.dictomaton.collections.ImmutableStringByteMap, method: putAll, match: "(Map<String, Byte> map)", note: "ImmutableStringByteMap.putAll"}
  - {class: eu.danieldk.dictomaton.levenshtein.LevenshteinAutomatonState, method: isFinal, match: "()", note: "LevenshteinAutomatonState.isFinal"}
  - {class: eu.danieldk.dictomaton.DictionaryBuilder, method: addAll, match: "(Collection<? extends CharSequence> seqs) throws DictionaryBuilderException", note: "DictionaryBuilder.addAll"}
  - {class: eu.danieldk.dictomaton.collections.ImmutableStringByteMap, method: build, match: "() throws DictionaryBuilderException", note: "ImmutableStringByteMap.build"}
  - {class: eu.danieldk.dictomaton.levenshtein.LevenshteinAutomatonState, method: transitions, match: "()", note: "LevenshteinAutomatonState.transitions"}
  - {class: eu.danieldk.dictomaton.DictionaryBuilder, method: build, match: "()", note: "DictionaryBuilder.build"}
  - {class: eu.danieldk.dictomaton.collections.ImmutableStringByteMap, method: putAll, match: "(SortedMap<String, Byte> map) throws DictionaryBuilderException", note: "ImmutableStringByteMap.putAll"}
  - {class: eu.danieldk.dictomaton.levenshtein.ParametricTransitions1, method: transition, match: "(int parametricState, int offset, int characteristicVector, int len)", note: "ParametricTransitions1.transition"}
  - {class: eu.danieldk.dictomaton.DictionaryImpl, method: addAll, match: "(Collection<? extends String> c)", note: "DictionaryImpl.addAll"}
  - {class: eu.danieldk.dictomaton.collections.ImmutableStringCharMap, method: putAll, match: "(Map<String, Character> map)", note: "ImmutableStringCharMap.putAll"}
  - {class: eu.danieldk.dictomaton.levenshtein.ParametricTransitions1, method: nParametricStates, match: "()", note: "ParametricTransitions1.nParametricStates"}
  - {class: eu.danieldk.dictomaton.DictionaryImpl, method: clear, match: "()", note: "DictionaryImpl.clear"}
  - {class: eu.danieldk.dictomaton.collections.ImmutableStringCharMap, method: build, match: "() throws DictionaryBuilderException", note: "ImmutableStringCharMap.build"}
  - {class: eu.danieldk.dictomaton.levenshtein.ParametricTransitions1, method: maxOffsetErrors, match: "(int parametricState)", note: "ParametricTransitions1.maxOffsetErrors"}
  - {class: eu.danieldk.dictomaton.DictionaryImpl, method: containsAll, match: "(Collection<?> c)", note: "DictionaryImpl.containsAll"}
  - {class: eu.danieldk.dictomaton.collections.ImmutableStringCharMap, method: putAll, match: "(SortedMap<String, Character> map) throws DictionaryBuilderException", note: "ImmutableStringCharMap.putAll"}
  - {class: eu.danieldk.dictomaton.levenshtein.ParametricTransitions2, method: transition, match: "(int parametricState, int offset, int characteristicVector, int len)", note: "ParametricTransitions2.transition"}
  - {class: eu.danieldk.dictomaton.PerfectHashDictionaryStateCard, method: number, match: "(CharSequence seq)", note: "PerfectHashDictionaryStateCard.number"}
  - {class: eu.danieldk.dictomaton.collections.ImmutableStringDoubleMap, method: putAll, match: "(Map<String, Double> map)", note: "ImmutableStringDoubleMap.putAll"}
