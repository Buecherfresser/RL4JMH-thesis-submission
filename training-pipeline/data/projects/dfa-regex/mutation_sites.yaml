# Curated performance-mutation sites for dfa-regex (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants dfa-regex --source data/external-src/<checkout> \
#       --sites data/projects/dfa-regex/mutation_sites.yaml

package_root: top.yatt.dfargx

sites:
  - {class: top.yatt.dfargx.MatchedText, method: getText, match: "()", note: "MatchedText.getText"}
  - {class: top.yatt.dfargx.automata.DFA, method: getTransitionTable, match: "()", note: "DFA.getTransitionTable"}
  - {class: top.yatt.dfargx.stack.OperatingStack, method: visit, match: "(LeafNode leafNode)", note: "OperatingStack.visit"}
  - {class: top.yatt.dfargx.tree.SyntaxTree, method: copyNodes, match: "(List<Node> sample)", note: "SyntaxTree.copyNodes"}
  - {class: top.yatt.dfargx.util.CommonSets, method: listToArray, match: "(List<Character> charList)", note: "CommonSets.listToArray"}
  - {class: top.yatt.dfargx.MatchedText, method: getPos, match: "()", note: "MatchedText.getPos"}
  - {class: top.yatt.dfargx.automata.DFA, method: getRejectedState, match: "()", note: "DFA.getRejectedState"}
  - {class: top.yatt.dfargx.stack.OperatingStack, method: visit, match: "(BranchNode branchNode)", note: "OperatingStack.visit"}
  - {class: top.yatt.dfargx.tree.SyntaxTree, method: getRoot, match: "()", note: "SyntaxTree.getRoot"}
  - {class: top.yatt.dfargx.util.CommonSets, method: arrayToList, match: "(char[] charArr)", note: "CommonSets.arrayToList"}
  - {class: top.yatt.dfargx.RegexMatcher, method: match, match: "(String str)", note: "RegexMatcher.match"}
  - {class: top.yatt.dfargx.automata.DFA, method: getInitState, match: "()", note: "DFA.getInitState"}
  - {class: top.yatt.dfargx.stack.OperatingStack, method: pop, match: "()", note: "OperatingStack.pop"}
  - {class: top.yatt.dfargx.tree.node.BConcat, method: accept, match: "(NFA nfa)", note: "BConcat.accept"}
  - {class: top.yatt.dfargx.util.CommonSets, method: complementarySet, match: "(char[] set)", note: "CommonSets.complementarySet"}
  - {class: top.yatt.dfargx.RegexSearcher, method: search, match: "(String str)", note: "RegexSearcher.search"}
  - {class: top.yatt.dfargx.automata.NFA, method: asBitmapStateManager, match: "()", note: "NFA.asBitmapStateManager"}
  - {class: top.yatt.dfargx.stack.ShuntingStack, method: visit, match: "(LeftBracket leftBracket)", note: "ShuntingStack.visit"}
  - {class: top.yatt.dfargx.tree.node.BConcat, method: accept, match: "(OperatingStack operatingStack)", note: "BConcat.accept"}
  - {class: top.yatt.dfargx.RegexSearcher, method: hasMoreElements, match: "()", note: "RegexSearcher.hasMoreElements"}
  - {class: top.yatt.dfargx.automata.NFA, method: visit, match: "(LChar lChar)", note: "NFA.visit"}
  - {class: top.yatt.dfargx.stack.ShuntingStack, method: visit, match: "(RightBracket rightBracket)", note: "ShuntingStack.visit"}
  - {class: top.yatt.dfargx.tree.node.BConcat, method: accept, match: "(ShuntingStack shuntingStack)", note: "BConcat.accept"}
  - {class: top.yatt.dfargx.RegexSearcher, method: nextElement, match: "()", note: "RegexSearcher.nextElement"}
  - {class: top.yatt.dfargx.automata.NFA, method: visit, match: "(LNull lNull)", note: "NFA.visit"}
  - {class: top.yatt.dfargx.stack.ShuntingStack, method: visit, match: "(LeafNode leafNode)", note: "ShuntingStack.visit"}
  - {class: top.yatt.dfargx.tree.node.BMany, method: accept, match: "(NFA nfa)", note: "BMany.accept"}
  - {class: top.yatt.dfargx.automata.NFABitmapState, method: transitionRule, match: "(char ch, int targetID)", note: "NFABitmapState.transitionRule"}
  - {class: top.yatt.dfargx.tree.node.BMany, method: accept, match: "(OperatingStack operatingStack)", note: "BMany.accept"}
  - {class: top.yatt.dfargx.automata.NFABitmapState, method: directRule, match: "(int targetID)", note: "NFABitmapState.directRule"}
  - {class: top.yatt.dfargx.tree.node.BMany, method: accept, match: "(ShuntingStack shuntingStack)", note: "BMany.accept"}
  - {class: top.yatt.dfargx.automata.NFABitmapState, method: getDirectTable, match: "()", note: "NFABitmapState.getDirectTable"}
  - {class: top.yatt.dfargx.tree.node.BOr, method: accept, match: "(NFA nfa)", note: "BOr.accept"}
  - {class: top.yatt.dfargx.automata.NFABitmapStateManager, method: getState, match: "(int id)", note: "NFABitmapStateManager.getState"}
  - {class: top.yatt.dfargx.tree.node.BOr, method: accept, match: "(OperatingStack operatingStack)", note: "BOr.accept"}
  - {class: top.yatt.dfargx.automata.NFABitmapStateManager, method: getStates, match: "()", note: "NFABitmapStateManager.getStates"}
  - {class: top.yatt.dfargx.tree.node.BOr, method: accept, match: "(ShuntingStack shuntingStack)", note: "BOr.accept"}
  - {class: top.yatt.dfargx.automata.NFABitmapStateManager, method: stateCount, match: "()", note: "NFABitmapStateManager.stateCount"}
  - {class: top.yatt.dfargx.tree.node.LChar, method: accept, match: "(NFA nfa)", note: "LChar.accept"}
  - {class: top.yatt.dfargx.automata.NFABitmapStatePack, method: addState, match: "(int stateID)", note: "NFABitmapStatePack.addState"}
  - {class: top.yatt.dfargx.tree.node.LChar, method: accept, match: "(OperatingStack operatingStack)", note: "LChar.accept"}
  - {class: top.yatt.dfargx.automata.NFABitmapStatePack, method: addAll, match: "(NFABitmapStatePack other)", note: "NFABitmapStatePack.addAll"}
  - {class: top.yatt.dfargx.tree.node.LChar, method: accept, match: "(ShuntingStack shuntingStack)", note: "LChar.accept"}
  - {class: top.yatt.dfargx.automata.NFABitmapStatePack, method: isEmpty, match: "()", note: "NFABitmapStatePack.isEmpty"}
  - {class: top.yatt.dfargx.tree.node.LClosure, method: accept, match: "(NFA nfa)", note: "LClosure.accept"}
  - {class: top.yatt.dfargx.automata.NFAState, method: transitionRule, match: "(char ch, NFAState state)", note: "NFAState.transitionRule"}
  - {class: top.yatt.dfargx.tree.node.LClosure, method: accept, match: "(OperatingStack operatingStack)", note: "LClosure.accept"}
  - {class: top.yatt.dfargx.automata.NFAState, method: directRule, match: "(NFAState state)", note: "NFAState.directRule"}
  - {class: top.yatt.dfargx.tree.node.LClosure, method: accept, match: "(ShuntingStack shuntingStack)", note: "LClosure.accept"}
  - {class: top.yatt.dfargx.automata.NFAState, method: getId, match: "()", note: "NFAState.getId"}
