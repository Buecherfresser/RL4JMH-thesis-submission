  - {class: com.hendrix.erdos.algorithms.DijkstraShortestPath, method: applyAlgorithm, match: "()", note: "DijkstraShortestPath.applyAlgorithm"}
  - {class: com.hendrix.erdos.graphs.SimpleDirectedGraph, method: hasMultiEdges, match: "()", note: "SimpleDirectedGraph.hasMultiEdges"}
  - {class: com.hendrix.erdos.algorithms.DijkstraShortestPath, method: shortest, match: "()", note: "DijkstraShortestPath.shortest"}
  - {class: com.hendrix.erdos.graphs.SimpleDirectedGraph, method: hasSelfLoops, match: "()", note: "SimpleDirectedGraph.hasSelfLoops"}
  - {class: com.hendrix.erdos.algorithms.FloydWarshall, method: applyAlgorithm, match: "()", note: "FloydWarshall.applyAlgorithm"}
  - {class: com.hendrix.erdos.graphs.SimpleGraph, method: hasMultiEdges, match: "()", note: "SimpleGraph.hasMultiEdges"}
  - {class: com.hendrix.erdos.algorithms.Johnson, method: applyAlgorithm, match: "()", note: "Johnson.applyAlgorithm"}
  - {class: com.hendrix.erdos.graphs.SimpleGraph, method: hasSelfLoops, match: "()", note: "SimpleGraph.hasSelfLoops"}
  - {class: com.hendrix.erdos.algorithms.MSTKruskal, method: applyAlgorithm, match: "()", note: "MSTKruskal.applyAlgorithm"}
  - {class: com.hendrix.erdos.graphs.UndirectedGraph, method: getGraphType, match: "()", note: "UndirectedGraph.getGraphType"}
  - {class: com.hendrix.erdos.algorithms.MSTKruskal, method: mst, match: "()", note: "MSTKruskal.mst"}
  - {class: com.hendrix.erdos.graphs.UndirectedGraph, method: degreeOfVertex, match: "(IVertex vertex)", note: "UndirectedGraph.degreeOfVertex"}
