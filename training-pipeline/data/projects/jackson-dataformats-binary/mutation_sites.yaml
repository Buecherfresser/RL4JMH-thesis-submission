# Curated performance-mutation sites for jackson-dataformats-binary (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants jackson-dataformats-binary --source data/external-src/<checkout> \
#       --sites data/projects/jackson-dataformats-binary/mutation_sites.yaml

package_root: tools.jackson.dataformat

sites:
  - {class: tools.jackson.dataformat.avro.AvroFactoryBuilder, method: build, match: "()", note: "AvroFactoryBuilder.build"}
  - {class: tools.jackson.dataformat.cbor.CBORFactoryBuilder, method: enable, match: "(CBORWriteFeature f)", note: "CBORFactoryBuilder.enable"}
  - {class: tools.jackson.dataformat.ion.IonFactoryBuilder, method: build, match: "()", note: "IonFactoryBuilder.build"}
  - {class: tools.jackson.dataformat.smile.SmileFactoryBuilder, method: build, match: "()", note: "SmileFactoryBuilder.build"}
  - {class: tools.jackson.dataformat.avro.AvroFactoryBuilder, method: useApacheLibDecoder, match: "()", note: "AvroFactoryBuilder.useApacheLibDecoder"}
  - {class: tools.jackson.dataformat.cbor.CBORFactoryBuilder, method: enable, match: "(CBORWriteFeature first, CBORWriteFeature... other)", note: "CBORFactoryBuilder.enable"}
  - {class: tools.jackson.dataformat.ion.IonFactoryBuilder, method: withBinaryWriters, match: "()", note: "IonFactoryBuilder.withBinaryWriters"}
  - {class: tools.jackson.dataformat.smile.SmileFactoryBuilder, method: enable, match: "(SmileReadFeature f)", note: "SmileFactoryBuilder.enable"}
  - {class: tools.jackson.dataformat.avro.AvroMapper, method: build, match: "()", note: "AvroMapper.build"}
  - {class: tools.jackson.dataformat.cbor.CBORMapper, method: build, match: "()", note: "CBORMapper.build"}
  - {class: tools.jackson.dataformat.ion.IonObjectMapper, method: build, match: "()", note: "IonObjectMapper.build"}
  - {class: tools.jackson.dataformat.smile.SmileMapper, method: build, match: "()", note: "SmileMapper.build"}
  - {class: tools.jackson.dataformat.avro.AvroMapper, method: _saveState, match: "()", note: "AvroMapper._saveState"}
  - {class: tools.jackson.dataformat.cbor.CBORMapper, method: _saveState, match: "()", note: "CBORMapper._saveState"}
  - {class: tools.jackson.dataformat.ion.IonObjectMapper, method: _saveState, match: "()", note: "IonObjectMapper._saveState"}
  - {class: tools.jackson.dataformat.smile.SmileMapper, method: _saveState, match: "()", note: "SmileMapper._saveState"}
  - {class: tools.jackson.dataformat.avro.AvroTypeResolverBuilder, method: construct, match: "(JsonTypeInfo.Value config)", note: "AvroTypeResolverBuilder.construct"}
  - {class: tools.jackson.dataformat.cbor.CBORParser, method: size, match: "()", note: "CBORParser.size"}
  - {class: tools.jackson.dataformat.ion.IonParser, method: version, match: "()", note: "IonParser.version"}
  - {class: tools.jackson.dataformat.smile.SmileParser, method: handleSignature, match: "(boolean consumeFirstByte, boolean throwException)", note: "SmileParser.handleSignature"}
  - {class: tools.jackson.dataformat.avro.AvroTypeResolverBuilder, method: buildTypeSerializer, match: "(SerializationContext ctxt, JavaType baseType,", note: "AvroTypeResolverBuilder.buildTypeSerializer"}
  - {class: tools.jackson.dataformat.cbor.CBORParser, method: isEmpty, match: "()", note: "CBORParser.isEmpty"}
  - {class: tools.jackson.dataformat.ion.IonParser, method: getIonSystem, match: "()", note: "IonParser.getIonSystem"}
  - {class: tools.jackson.dataformat.smile.SmileParser, method: releaseBuffered, match: "(OutputStream out) throws JacksonException", note: "SmileParser.releaseBuffered"}
  - {class: tools.jackson.dataformat.avro.apacheimpl.ApacheAvroParserImpl, method: _releaseBuffers, match: "()", note: "ApacheAvroParserImpl._releaseBuffers"}
  - {class: tools.jackson.dataformat.cbor.CBORParserBootstrapper, method: constructParser, match: "(ObjectReadContext readCtxt,", note: "CBORParserBootstrapper.constructParser"}
  - {class: tools.jackson.dataformat.ion.ionvalue.IonValueMapper, method: parse, match: "(IonValue value, Class<T> clazz) throws IOException", note: "IonValueMapper.parse"}
  - {class: tools.jackson.dataformat.smile.SmileParserBootstrapper, method: constructParser, match: "(ObjectReadContext readCtxt,", note: "SmileParserBootstrapper.constructParser"}
  - {class: tools.jackson.dataformat.avro.apacheimpl.ApacheAvroParserImpl, method: streamReadInputSource, match: "()", note: "ApacheAvroParserImpl.streamReadInputSource"}
  - {class: tools.jackson.dataformat.cbor.CBORParserBootstrapper, method: ensureLoaded, match: "(int minimum) throws JacksonException", note: "CBORParserBootstrapper.ensureLoaded"}
  - {class: tools.jackson.dataformat.ion.ionvalue.IonValueMapper, method: serialize, match: "(Object o) throws IOException", note: "IonValueMapper.serialize"}
  - {class: tools.jackson.dataformat.smile.SmileUtil, method: zigzagEncode, match: "(int input)", note: "SmileUtil.zigzagEncode"}
  - {class: tools.jackson.dataformat.avro.apacheimpl.DecoderOverAvroParser, method: consumeToken, match: "(JsonToken... expectedTokens) throws IOException", note: "DecoderOverAvroParser.consumeToken"}
