# Curated performance-mutation sites for regexstaticanalysis (GRPO RL corpus).
#
# Concrete classes and hot ~once-per-call public methods. Several methods per class
# => killed / in-class mutants rewards benchmark coverage of the subject's core API.
#
# Regenerate with:
#   jmh-make-mutants regexstaticanalysis --source data/external-src/<checkout> \
#       --sites data/projects/regexstaticanalysis/mutation_sites.yaml

package_root: regexcompiler

sites:
  - {class: regexcompiler.JavaParseTreeToNFAConverter, method: createBaseCaseEmpty, match: "()", note: "JavaParseTreeToNFAConverter.createBaseCaseEmpty"}
  - {class: regexcompiler.JavaParseTreeToNFAConverter, method: createBaseCaseLookAround, match: "(NFAVertexND lookAroundState)", note: "JavaParseTreeToNFAConverter.createBaseCaseLookAround"}
  - {class: regexcompiler.JavaParseTreeToNFAConverter, method: createBaseCaseEmptyString, match: "()", note: "JavaParseTreeToNFAConverter.createBaseCaseEmptyString"}
  - {class: regexcompiler.JavaParseTreeToNFAConverter, method: createBaseCaseSymbol, match: "(String symbol)", note: "JavaParseTreeToNFAConverter.createBaseCaseSymbol"}
  - {class: regexcompiler.JavaParseTreeToNFAConverter, method: unionNFAs, match: "(NFAGraph m1, NFAGraph m2)", note: "JavaParseTreeToNFAConverter.unionNFAs"}
  - {class: regexcompiler.JavaParseTreeToNFAConverter, method: joinNFAs, match: "(NFAGraph m1, NFAGraph m2)", note: "JavaParseTreeToNFAConverter.joinNFAs"}
  - {class: regexcompiler.JavaParseTreeToNFAConverter, method: starNFA, match: "(NFAGraph m, RegexStarOperator starOperator)", note: "JavaParseTreeToNFAConverter.starNFA"}
  - {class: regexcompiler.JavaParseTreeToNFAConverter, method: plusNFA, match: "(NFAGraph m, RegexPlusOperator plusOperator)", note: "JavaParseTreeToNFAConverter.plusNFA"}
  - {class: regexcompiler.JavaParseTreeToNFAConverter, method: countClosureNFA, match: "(NFAGraph m, RegexCountClosureOperator countClosureOperator)", note: "JavaParseTreeToNFAConverter.countClosureNFA"}
  - {class: regexcompiler.JavaParseTreeToNFAConverter, method: questionMarkNFA, match: "(NFAGraph m, RegexQuestionMarkOperator questionMarkOperator)", note: "JavaParseTreeToNFAConverter.questionMarkNFA"}
  - {class: regexcompiler.MyPattern, method: main, match: "(String [] args)", note: "MyPattern.main"}
  - {class: regexcompiler.MyPattern, method: compile, match: "(String pattern, NFAConstruction construction)", note: "MyPattern.compile"}
  - {class: regexcompiler.MyPattern, method: matcher, match: "(String inputString)", note: "MyPattern.matcher"}
  - {class: regexcompiler.MyPattern, method: toNFAGraph, match: "(String pattern, NFAConstruction construction)", note: "MyPattern.toNFAGraph"}
  - {class: regexcompiler.MyPattern, method: parse, match: "()", note: "MyPattern.parse"}
  - {class: regexcompiler.MyPattern, method: parseRegex, match: "()", note: "MyPattern.parseRegex"}
  - {class: regexcompiler.MyPattern, method: parseTerm, match: "()", note: "MyPattern.parseTerm"}
  - {class: regexcompiler.MyPattern, method: parseFactor, match: "()", note: "MyPattern.parseFactor"}
  - {class: regexcompiler.ParseTree, method: getRoot, match: "()", note: "ParseTree.getRoot"}
  - {class: regexcompiler.ParseTree, method: addTreeNode, match: "(TreeNode child)", note: "ParseTree.addTreeNode"}
  - {class: regexcompiler.ParseTree, method: newRoot, match: "(TreeNode child)", note: "ParseTree.newRoot"}
  - {class: regexcompiler.ParseTree, method: getChildren, match: "()", note: "ParseTree.getChildren"}
  - {class: regexcompiler.ParseTree, method: addChild, match: "(TreeNode child)", note: "ParseTree.addChild"}
  - {class: regexcompiler.ParseTree, method: getRegexToken, match: "()", note: "ParseTree.getRegexToken"}
  - {class: regexcompiler.RegexAnchor, method: getAnchorType, match: "()", note: "RegexAnchor.getAnchorType"}
  - {class: regexcompiler.RegexAnchor, method: getIndex, match: "()", note: "RegexAnchor.getIndex"}
  - {class: regexcompiler.RegexAnchor, method: getTokenType, match: "()", note: "RegexAnchor.getTokenType"}
  - {class: regexcompiler.RegexCharacterClass, method: getSubexpressionType, match: "()", note: "RegexCharacterClass.getSubexpressionType"}
  - {class: regexcompiler.RegexCountClosureOperator, method: getLow, match: "()", note: "RegexCountClosureOperator.getLow"}
  - {class: regexcompiler.RegexCountClosureOperator, method: getHigh, match: "()", note: "RegexCountClosureOperator.getHigh"}
  - {class: regexcompiler.RegexEscapedSymbol, method: getSubexpressionType, match: "()", note: "RegexEscapedSymbol.getSubexpressionType"}
  - {class: regexcompiler.RegexEscapedSymbol, method: getRegexEscapedSymbolType, match: "()", note: "RegexEscapedSymbol.getRegexEscapedSymbolType"}
  - {class: regexcompiler.RegexGroup, method: getGroupType, match: "()", note: "RegexGroup.getGroupType"}
  - {class: regexcompiler.RegexGroup, method: getSubexpressionType, match: "()", note: "RegexGroup.getSubexpressionType"}
  - {class: regexcompiler.RegexQuantifiableOperator, method: getQuantifierType, match: "()", note: "RegexQuantifiableOperator.getQuantifierType"}
  - {class: regexcompiler.RegexSymbol, method: getSubexpressionType, match: "()", note: "RegexSymbol.getSubexpressionType"}
  - {class: regexcompiler.ThompsonParseTreeToNFAConverter, method: createBaseCaseEmpty, match: "()", note: "ThompsonParseTreeToNFAConverter.createBaseCaseEmpty"}
  - {class: regexcompiler.ThompsonParseTreeToNFAConverter, method: createBaseCaseLookAround, match: "(NFAVertexND lookAroundState)", note: "ThompsonParseTreeToNFAConverter.createBaseCaseLookAround"}
  - {class: regexcompiler.ThompsonParseTreeToNFAConverter, method: createBaseCaseEmptyString, match: "()", note: "ThompsonParseTreeToNFAConverter.createBaseCaseEmptyString"}
  - {class: regexcompiler.ThompsonParseTreeToNFAConverter, method: createBaseCaseSymbol, match: "(String symbol)", note: "ThompsonParseTreeToNFAConverter.createBaseCaseSymbol"}
  - {class: regexcompiler.ThompsonParseTreeToNFAConverter, method: unionNFAs, match: "(NFAGraph m1, NFAGraph m2)", note: "ThompsonParseTreeToNFAConverter.unionNFAs"}
  - {class: regexcompiler.ThompsonParseTreeToNFAConverter, method: joinNFAs, match: "(NFAGraph m1, NFAGraph m2)", note: "ThompsonParseTreeToNFAConverter.joinNFAs"}
  - {class: regexcompiler.ThompsonParseTreeToNFAConverter, method: starNFA, match: "(NFAGraph m, RegexStarOperator starOperator)", note: "ThompsonParseTreeToNFAConverter.starNFA"}
  - {class: regexcompiler.ThompsonParseTreeToNFAConverter, method: plusNFA, match: "(NFAGraph m, RegexPlusOperator plusOperator)", note: "ThompsonParseTreeToNFAConverter.plusNFA"}
  - {class: regexcompiler.ThompsonParseTreeToNFAConverter, method: countClosureNFA, match: "(NFAGraph m, RegexCountClosureOperator countClosureOperator)", note: "ThompsonParseTreeToNFAConverter.countClosureNFA"}
  - {class: regexcompiler.ThompsonParseTreeToNFAConverter, method: questionMarkNFA, match: "(NFAGraph m,	RegexQuestionMarkOperator questionMarkOperator)", note: "ThompsonParseTreeToNFAConverter.questionMarkNFA"}
