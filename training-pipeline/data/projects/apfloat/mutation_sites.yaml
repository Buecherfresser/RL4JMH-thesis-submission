  - {class: org.apfloat.jscience.ApcomplexField, method: newInstance, match: "(Class<ApcomplexField> cls, InputElement xml)", note: "ApcomplexField.newInstance"}
  - {class: org.apfloat.spi.Util, method: round2down, match: "(int x)", note: "Util.round2down"}
